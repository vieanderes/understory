term: circular dependency
aka: [import cycle, dependency cycle, circular import]
short: Two or more modules that import each other, directly or through a chain.
explain: |
  Module A imports B, and B imports A. When the program loads, one of them has to run first,
  so the other sees a half-finished module. Whether that crashes depends on load order, so it
  can work today and break after an unrelated change.

  In an ES module cycle, reading a `const` before its module has run throws a
  `ReferenceError`. A function declaration, by contrast, is already usable. Break the cycle by
  moving what both sides need into a third module that imports neither. A lint rule or a
  graph search finds cycles before users do.
analogy: Two people each waiting for the other to hang up first. Nothing moves until someone breaks the loop.
example:
  language: ts
  code: |
    // bookings/index.ts
    import { invoiceFor } from '../invoices';
    // invoices/index.ts
    import { bookingTotal } from '../bookings'; // cycle
usage: The build passes, but there's a circular dependency between bookings and invoices; move the shared total into its own module.
related: [coupling, barrel-file, graph]
level: 2
lessons: [arch.project-structure, js.modules]
