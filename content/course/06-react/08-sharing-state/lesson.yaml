id: react.sharing-state
title: Sharing state
objective: Lift state to the closest common parent so components agree, and hand a value deep down the tree with context.
level: essential
minutes: 10
concepts: [react.lifting-state, react.context]
prerequisites: [react.updating-objects-and-arrays]
opening:
  text: >-
    You'll make two parts of a page agree, like a menu where opening one section closes the
    others. And you'll send a setting to every component that needs it without passing it
    through all the ones that don't.

steps:
  - type: prose
    id: each-has-its-own
    body: |-
      State belongs to one component, in one place on the page. Use the same component twice,
      and each copy gets its own state:

      ```tsx
      <div>
        <LikeButton />
        <LikeButton />
      </div>
      ```

      Two photos, two like buttons, two separate counts. Usually that's exactly what you want.

  - type: predict-output
    id: predict-two-counters
    concept: react.lifting-state
    difficulty: 1
    language: tsx
    code: |
      function LikeButton() {
        const [likes, setLikes] = useState(0);
        return <button onClick={() => setLikes(likes + 1)}>{likes}</button>;
      }

      function Gallery() {
        return <div><LikeButton /><LikeButton /></div>;
      }
    question: You click the first button twice. What do the two buttons show?
    choices:
      - text: '`2` and `0`'
        correct: true
        feedback: >-
          Right. Each `LikeButton` keeps its own `likes`, so the second never hears the clicks.
      - text: '`2` and `2`'
        feedback: >-
          They share code, not state. Each place a component appears gets its own copy.
      - text: '`1` and `1`'
        feedback: >-
          Both clicks went to the first button, and nothing links the two. So it counts to 2 alone.

  - type: prose
    id: lifting-state-up
    body: |-
      Sometimes two components must agree. Take the state out of both, and put it in their
      closest common parent. That's **lifting state up**.

      ```tsx
      const [query, setQuery] = useState("");
      <SearchBox query={query} onQueryChange={setQuery} />
      <Results query={query} />
      ```

      The parent passes the value down as a prop, with a function to change it. One value, one
      owner, so both always show the same thing.

  - type: ai-review
    id: review-copied-prop
    concept: react.lifting-state
    difficulty: 3
    language: tsx
    request: Show a cart line's quantity, with buttons to change it.
    flawClass: edge-case
    code: |
      function QuantityPicker({ quantity }: { quantity: number }) {
        const [value, setValue] = useState(quantity);
        return (
          <div>
            <button onClick={() => setValue(value - 1)}>-</button>
            <span>{value}</span>
            <button onClick={() => setValue(value + 1)}>+</button>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. Its test clicks + and sees the number go up. Then "Empty cart"
      sets the parent's quantity to 0, and the picker still shows 3. Tap the line at fault.
    lines: [2]
    reasons:
      - text: It copies the prop into state of its own
        correct: true
        feedback: >-
          Yes. `useState` reads `quantity` only on the first render. After that it ignores the parent.
      - text: '`value - 1` can go below zero'
        feedback: >-
          True, and worth a check. But it doesn't explain the stale 3 after the cart was emptied.
      - text: The buttons need a `key`
        feedback: >-
          Keys tell list items apart. These buttons aren't a list, and the number is still stale.
    fix: |
      function QuantityPicker({ quantity, onQuantityChange }: {
        quantity: number;
        onQuantityChange: (next: number) => void;
      }) {
        return (
          <div>
            <button onClick={() => onQuantityChange(quantity - 1)}>-</button>
            <span>{quantity}</span>
            <button onClick={() => onQuantityChange(quantity + 1)}>+</button>
          </div>
        );
      }

  - type: code-challenge
    id: build-floor-guide
    concept: react.lifting-state
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A museum guide has three panels, one per floor. Clicking a floor's button shows its text.
      But each `Panel` keeps its own `open`, so several stay open at once.


      Make opening one floor close the others. Lift the state into `FloorGuide`: keep which
      panel is open there, and give each `Panel` an `isOpen` prop and a function to call on
      click. Every panel starts closed.
    hints:
      - Look at where `open` lives. Three panels means three separate values that never talk.
      - The parent needs one value, the number of the open panel, or `null` for none.
      - 'Start `FloorGuide` with `const [openIndex, setOpenIndex] = useState<number | null>(null);`.'

  - type: prose
    id: context-skips-the-middle
    body: |-
      Some values are needed everywhere: a colour theme, the signed-in user. Passing a prop
      through ten components that never use it is called **prop drilling**.

      **Context** skips the middle. Make one, give it a value above, and read it anywhere below:

      ```tsx
      const ThemeContext = createContext("light");  // "light" is the default

      <ThemeContext value="dark"><Page /></ThemeContext>

      const theme = useContext(ThemeContext);        // in any component inside Page
      ```

  - type: fill-blank
    id: fill-units-context
    concept: react.context
    difficulty: 2
    language: tsx
    prompt: >-
      A weather app shows every temperature in the units picked at the top. Fill the gaps.
    template: |
      const UnitsContext = {{1}}("celsius");

      function Temperature({ value }) {
        const units = {{2}}(UnitsContext);
        return <span>{value} {units === "celsius" ? "°C" : "°F"}</span>;
      }

      <UnitsContext {{3}}="fahrenheit">
        <Forecast />
      </UnitsContext>
    blanks:
      - key: '1'
        answer: createContext
      - key: '2'
        answer: useContext
      - key: '3'
        answer: value
    bank: [createContext, useState, useContext, useEffect, value, default]

  - type: ai-review
    id: review-header-outside-provider
    concept: react.context
    difficulty: 3
    language: tsx
    request: Add a dark mode switch in the header that themes the whole app.
    flawClass: logic
    code: |
      function App() {
        const [theme, setTheme] = useState("light");
        function toggle() {
          setTheme(theme === "light" ? "dark" : "light");
        }
        return (
          <>
            <Header onToggleTheme={toggle} />
            <ThemeContext value={theme}>
              <Page />
            </ThemeContext>
          </>
        );
      }
    prompt: >-
      An assistant wrote this. Its test switches to dark and checks the page. But the header,
      which reads `ThemeContext` too, stays light. Tap the line at fault.
    lines: [8]
    reasons:
      - text: '`Header` sits outside the context''s value'
        correct: true
        feedback: >-
          Yes. Nothing above it gives a value, so it gets the default. Move it inside.
      - text: State can't hold a theme name
        feedback: >-
          State holds any value, and the page did switch. The header can't see it.
      - text: '`toggle` needs an updater function'
        feedback: >-
          One update per click, so `theme` is current. The trouble is where `Header` sits.
    fix: |
      function App() {
        const [theme, setTheme] = useState("light");
        function toggle() {
          setTheme(theme === "light" ? "dark" : "light");
        }
        return (
          <ThemeContext value={theme}>
            <Header onToggleTheme={toggle} />
            <Page />
          </ThemeContext>
        );
      }

  - type: multiple-choice
    id: pick-context-or-props
    concept: react.context
    difficulty: 3
    question: >-
      The user's name shows in a header, a menu and twenty comments, at different depths.
      Where should it come from?
    choices:
      - text: Context, given a value near the top
        correct: true
        feedback: >-
          Yes. Every reader asks for it where it's needed. The rest never mention it.
      - text: A prop passed down through every level
        feedback: >-
          It works, but dozens of components must take and forward a name they never use.
      - text: Each component's own `useState`
        feedback: >-
          Then there'd be twenty-two separate copies, and signing in would update none of them.

  - type: explain-back
    id: explain-where-state-lives
    concept: react.lifting-state
    difficulty: 3
    prompt: >-
      A search box and a results list must show the same query. Why does the query live in
      their parent, not in the search box?
    rubric:
      - State belongs to one component, and props only flow down from parent to child.
      - The results list is a sibling, so it can't read the search box's state.
      - In the closest common parent, one value reaches both as props, so they can't disagree.
    modelAnswer: >-
      A component's state is private, and props only travel downwards. If the search box kept
      the query, the results list beside it would have no way to read it. The parent sits above
      both. It holds the query, passes it to each, and hands the search box a function to
      change it. There's one copy, so the two can never show different queries.

recap:
  - Lift shared state to the closest common parent, and pass it down with a function to change it.
  - Spot a prop copied into state, which stops following its parent.
  - Hand a value to a whole subtree with `createContext`, a provider and `useContext`.

recall:
  - id: card-own-state
    concept: react.lifting-state
    front: A page shows `<LikeButton />` twice. Do the two share their count?
    back: >-
      No. Each place a component appears gets its own state.
  - id: card-lift-where
    concept: react.lifting-state
    front: Where should state go when two siblings need it?
    back: >-
      In their closest common parent, which passes it down as a prop, with a function to
      change it.
  - id: card-copied-prop
    concept: react.lifting-state
    front: Why does `useState(props.quantity)` go stale?
    back: >-
      `useState` uses its argument only on the first render. Later changes to the prop never
      reach the copy.
  - id: card-context-default
    concept: react.context
    front: When does `useContext` return the default from `createContext`?
    back: >-
      When no component above it gives that context a value.

