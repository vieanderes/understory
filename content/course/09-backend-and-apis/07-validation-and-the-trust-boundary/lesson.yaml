    note: What the browser checks, and its own warning that it must not replace server checks.
    verified: true

deepDive: >-
  zod strips unknown keys by default, which is what saved the review step once `result.data`
  was used. `z.strictObject(...)` turns an unknown key into an error instead. That suits an
  admin API, where a stray field usually means a bug. `z.looseObject(...)` keeps them, and is
  rarely what you want at a boundary.


  A body that isn't JSON makes `await request.json()` throw before any schema runs. Left
  alone, that's a 500 with an empty body. Catch it and answer 400: the client sent the wrong
  thing, the server didn't fail.


  One schema can serve both checks. Share it with a React form, or generate `min`, `max` and
  `required` from it, so the two can't drift apart.


  Next in the journey, Next.js route handlers put this same parse at the top of an endpoint
  inside a Next.js app.
