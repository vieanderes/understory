term: few-shot prompting
aka:
  - few-shot
  - few-shot examples
short: Putting a handful of worked examples in the instructions so the model copies their pattern.
explain: |
  Describing the output you want is hard. Showing it works better: two or three example
  inputs with the exact answers you'd want, then the real input.

  The model copies everything about the examples, flaws included. If all three examples are
  short, the answers come back short. If they share one label, that label wins more often.
  Vary them on purpose. Nothing is trained here: the model's weights don't change.
analogy: Showing a new colleague three finished reports before they write theirs. They'll match the layout, and every quirk.
usage: Add a few-shot example with an empty field, or the model never leaves one blank.
twin:
  term: fine-tuning
  difference: Few-shot examples sit in the prompt and change nothing permanent. Fine-tuning trains on thousands of examples and changes the model's weights.
related:
  - prompt
  - fine-tuning
  - system-prompt
level: 2
lessons:
