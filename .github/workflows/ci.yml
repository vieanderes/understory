# Runs on every pull request and on every push to main.
# Two jobs: the content check is fast and tells a lesson author what is wrong with a
# lesson file; the build job only starts once the content is valid.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The news bot commits data/news/*.json every day. Those commits are validated by the
    # news workflow itself and must not spend a full e2e run.
    paths-ignore:
      - 'data/news/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    name: Content check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:content

  build:
    name: Build & test
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (must be completely clean)
        run: pnpm audit --audit-level=low
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # WebKit as well as Chromium: the phone project runs on Safari's engine.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
