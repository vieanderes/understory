deepDive: |
  **Build once.** Every build makes its own keys for Server Actions. If each server builds
  for itself, a form rendered by one can post to another and fail with "Failed to find
  Server Action". Build one image and run it everywhere, or give every server the same
  `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY`.

  **Version skew.** During a rolling deploy, a browser may hold the old build while servers
  run the new one. Set a `deploymentId`, and Next.js spots the mismatch and does a full page
  load instead of a broken navigation.

  **A shared cache.** `'use cache'` keeps results in each server's memory. A custom cache
  handler with `'use cache: remote'` stores them somewhere every copy can reach, and its
  `refreshTags()` spreads an `updateTag` to all of them.

  **Streaming through a proxy.** nginx buffers responses by default, so a streamed page
  arrives all at once. Send the `X-Accel-Buffering: no` header, or turn buffering off.

  **Runtimes.** Server code runs in the Node.js runtime. The older Edge runtime, a smaller
  set of web APIs, is deprecated for pages and routes in Next.js 16.
