term: lockfile
aka:
  - lock file
  - package-lock.json
  - pnpm-lock.yaml
  - uv.lock
short: A generated file recording the exact version of every installed package, so every install matches.
explain: |
  It works on your laptop and fails in CI. Same code, but a library released a new version
  overnight and CI picked it up.

  The dependency list allows a range of versions. This file pins the exact version and checksum of every package in the tree. That includes the ones you never asked for by name.
  Commit it. In CI, install with `--frozen-lockfile` or `npm ci`, so a mismatch fails
  loudly instead of quietly installing something new.
analogy: A photo of the finished Lego model. The instructions allow some choices; the photo shows exactly which bricks went where.
example:
  language: yaml
  code: |
    # pnpm-lock.yaml (excerpt)
    packages:
      zod@3.23.8:
        resolution: {integrity: sha512-XBx9AXhX...}
usage: Don't delete the lockfile to fix the conflict; regenerate it from main and re-add your package.
twin:
  term: semantic-versioning
  difference: Semantic versioning lets the dependency list ask for a range, such as any 3.x. A lockfile records the one exact version that range resolved to, so installs repeat.
related:
  - package-manager
  - semantic-versioning
  - continuous-integration
  - supply-chain-attack
level: 2
lessons:
  - tooling.node-and-npm
  - security.supply-chain
