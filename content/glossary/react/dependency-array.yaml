term: dependency array
aka:
  - deps array
  - dependencies
short: The list after a React effect's function, naming the values that make it run again when they change.
explain: |
  `useEffect(fn, [roomId])` runs after the first draw, then again whenever `roomId` changes.
  An empty list, `[]`, means once on mount. No list at all means after every draw.

  The list must name every value from the component that the function reads. Leave one out
  and the effect keeps the old value: a stale closure. Don't silence the linter; move the
  value inside the function or out of the component instead.
analogy: The list of triggers on a smoke alarm. It reacts to exactly what's on the list, and ignores the rest.
example:
  language: tsx
  code: |
    useEffect(() => {
      const connection = connect(roomId);
      return () => connection.close();
    }, [roomId]); // reconnects when roomId changes
usage: The dependency array is missing userId, so switching users keeps showing the old profile.
twin:
  term: effect
  difference: The effect is the code that syncs with the outside. The dependency array decides when it runs again.
related:
  - effect
  - closure
level: 2
lessons:
  - react.effects
