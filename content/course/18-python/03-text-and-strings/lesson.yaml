deepDive: >-
  `split` takes a second argument, the most cuts to make: `"key: a: b".split(": ", 1)` gives
  `['key', 'a: b']`. `partition` does the same once and always returns three parts.
  `removeprefix` and `removesuffix` drop a known start or end, which `strip` can't do safely:
  `strip("ab")` removes any mix of those characters, not the word.


  Python strings are Unicode, so `len("café")` is 4 whatever the bytes. `casefold` is a
  stronger `lower` for comparing text in any language, and `splitlines` splits on every kind
  of line break. Slicing, from the next lesson, works on strings too: `word[:3]` is the first
  three characters.
