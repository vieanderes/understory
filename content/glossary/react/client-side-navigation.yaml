term: client-side navigation
aka: [soft navigation, Link component]
short: Moving to another page by swapping only the part that changes, without the browser reloading the document.
explain: |
  A plain link throws the whole page away and loads a new one. The header blinks, scroll
  positions reset and anything typed is lost.

  Next.js's `<Link>` catches the click, fetches only what the new page needs and swaps it
  in. Shared layouts and their state stay put, and links in view are fetched ahead, so the
  move feels instant. A plain `<a>` to the same address still works, but reloads everything.
analogy: Changing the slide in a projector instead of switching the projector off and on between slides.
example:
  language: tsx
  code: |
    import Link from 'next/link';

    // keeps the layout, its state and the scroll of the sidebar
    <Link href="/settings/profile">Profile</Link>
usage: Use the Link component here, otherwise the whole dashboard reloads and the filters reset.
related: [layout-file, file-based-routing, client-side-rendering]
level: 2
lessons: [next.app-router]
