term: process
aka: [processes, OS process, PID]
short: A program loaded into memory and running, with its own private memory the others can't touch.
explain: |
  A program is a file sitting on disk. Run it and the operating system creates a live copy. It gets memory of its own, open
  files and at least one line of execution. Run it twice and
  you get two of these.

  Each one is walled off. One crashing doesn't take down the others, and they can't read
  each other's memory. To share data they must talk, through pipes, sockets or files.

  That wall costs memory and makes starting one slower. A Node server runs as one; to use
  eight cores, you run several and put a load balancer in front.
analogy: Separate flats in one building. Each has its own kitchen and front door; to share sugar, you have to knock.
example:
  language: bash
  code: |
    $ node server.js &
    [1] 4821
    $ ps -o pid,rss,command -p 4821
      PID   RSS COMMAND
     4821 48212 node server.js
usage: Each worker is its own process, so a crash in one doesn't drop the other requests.
twin:
  term: thread
  difference: A process has its own memory, walled off from the rest. A thread runs inside a process and shares its memory with the other threads there.
related: [thread, concurrency, parallelism, horizontal-scaling]
level: 2
lessons: [cs.os-and-networks, cs.what-a-computer-does]
