id: js.requests-and-responses
title: Browsers, servers and requests
objective: Describe what a request and a response carry, and read a status code and a JSON body.
level: essential
minutes: 10
concepts: [js.requests-and-responses, js.status-codes]
prerequisites: [js.event-loop, js.built-in-toolbox]
opening:
  text: >-
    You'll know what really happens when a page asks a server for data. Every weather card, feed
    and search box you'll build depends on it.

steps:
  - type: prose
    id: client-and-server
    body: >-
      A weather page doesn't know tomorrow's forecast. It has to ask another computer.


      Your browser is the **client**: the side that asks. A **server** is a program on another
      computer that waits for questions and answers them. It's like ordering at a café counter.
      You ask for something, and the counter hands something back. Calling an AI model from
      your code works the same way.

  - type: prose
    id: parts-of-a-url
    body: |-
      Every question goes to a **URL**, an address with three parts:

      ```text
      https://weather.example/forecast?city=Leeds&days=3
      ```

      The **origin**, `https://weather.example`, names the server. The **path**, `/forecast`,
      says which thing you want. The **query string** after `?` adds details as name and value
      pairs, joined by `&`.

  - type: multiple-choice
    id: pick-query-string
    concept: js.requests-and-responses
    difficulty: 1
    language: text
    code: |
      https://library.example/search?title=Emma&page=2
    question: Which part is the query string?
    choices:
      - text: '`title=Emma&page=2`'
        correct: true
        feedback: >-
          Right. Everything after the `?`, as name and value pairs.
      - text: '`/search`'
        feedback: >-
          That's the path. It says what you want, and the query string adds the details.
      - text: '`https://library.example`'
        feedback: >-
          That's the origin, which names the server. The query string comes after the `?`.

  - type: prose
    id: request-and-response
    body: |-
      The question is a **request**, a small message like this one:

      ```text
      POST /reviews
      Content-Type: application/json

      {"book":12,"stars":5}
      ```

      It has a **method**: `GET` asks for something, `POST` sends something new. Then a URL,
      **headers** (labels about the message) and sometimes a **body**. The answer is a
      **response**, with a status code, headers and a body.
    figure:
      id: request-response
      caption: 'A request and a response have the same shape: a first line, headers, then a body.'

  - type: fill-blank
    id: fill-new-recipe-request
    concept: js.requests-and-responses
    difficulty: 2
    language: http
    prompt: >-
      Someone shares a new pancake recipe. Complete the request the page sends to the server.
    template: |
      {{1}} /recipes
      Content-Type: {{2}}

      {{3}}
    blanks:
      - key: '1'
        answer: POST
      - key: '2'
        answer: application/json
      - key: '3'
        answer: '{"title":"Pancakes","serves":4}'
    bank: [GET, POST, application/json, '{"title":"Pancakes","serves":4}', '?title=Pancakes&serves=4']

  - type: prose
    id: status-codes
    body: >-
      Every response starts with a **status code**, a number that says how it went. The first
      digit gives the family.


      `2xx` means it worked: `200` OK, `201` Created. `3xx` means look somewhere else. `4xx`
      means the request was wrong: `404` Not Found. `5xx` means the server itself failed:
      `500` Internal Server Error. A 404 is still an answer, not a broken connection.

  - type: playground
    id: show-the-answer
    concept: js.status-codes
    difficulty: 2
    prompt: >-
      The page asks a stand-in server for two books. Read each status. For a 200, parse the body
      and show "Emma by Jane Austen". For a 404, show "Not found".
    html: |
      <h2 id="first"></h2>
      <p id="second"></p>
      <script>
        // A stand-in server. It answers a request object with a response object.
        function server(request) {
          if (request.url === "/books/12") {
            return { status: 200, body: '{"title":"Emma","author":"Jane Austen"}' };
          }
          return { status: 404, body: '{"error":"No such book"}' };
        }
      </script>
    js: |
      const found = server({ method: "GET", url: "/books/12" });
      const missing = server({ method: "GET", url: "/books/99" });

      document.querySelector("#first").textContent = found.body;
      document.querySelector("#second").textContent = missing.body;
    editable: [js]
    checks:
      - label: The heading reads Emma by Jane Austen
        selector: '#first'
        text: Emma by Jane Austen
      - label: The paragraph reads Not found
        selector: '#second'
        text: Not found
    solution:
      js: |
        const found = server({ method: "GET", url: "/books/12" });
        const missing = server({ method: "GET", url: "/books/99" });

        function show(response, element) {
          if (response.status === 404) {
            element.textContent = "Not found";
            return;
          }
          const book = JSON.parse(response.body);
          element.textContent = `${book.title} by ${book.author}`;
        }
        show(found, document.querySelector("#first"));
        show(missing, document.querySelector("#second"));
    hints:
      - The body is JSON text. Turn it into an object before you read `title`.
      - '`JSON.parse(response.body)` gives an object. Check `response.status` first.'
      - Write a function `show(response, element)` and call it once for each response.

  - type: prose
    id: encode-the-query
    body: |-
      A query string breaks when the value holds `&`, `+` or spaces. Searching for "fish & chips"
      would send `q=fish ` and a stray ` chips`.

      Encode user text first. `encodeURIComponent("fish & chips")` gives `fish%20%26%20chips`.
      `URLSearchParams` builds a whole query for you:

      ```js
      "/search?" + new URLSearchParams({ q: "fish & chips", page: 2 })
      ```

  - type: code-challenge
    id: write-search-url
    concept: js.requests-and-responses
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `searchUrl(query, page)`. It returns the path `/search` with a query string holding
      `q` and `page`. The query must survive any characters a person types. `page` is 1 when
      left out.


      Example: `searchUrl("fish & chips", 2)` gives a URL whose `q` reads `fish & chips` and whose
      `page` reads `2`.
    hints:
      - The starter glues the text in as it is. What happens to the `&`?
      - '`URLSearchParams` or `encodeURIComponent` turns `&` and spaces into safe characters.'
      - 'Start with `function searchUrl(query, page = 1) {` and wrap the query in `encodeURIComponent(query)`.'

  - type: explain-back
    id: explain-404-is-an-answer
    concept: js.status-codes
    difficulty: 3
    prompt: >-
      A page asks for book 99, which doesn't exist, and gets a 404. A teammate says the request
      failed to reach the server. Are they right? Why?
    rubric:
      - A 404 is a response, so the request reached the server and it answered.
      - The 4xx family means the request asked for something wrong, here a book that isn't there.
      - A broken connection gives no response and no status code at all.
    modelAnswer: >-
      No. A status code only exists because the server answered. The request arrived, the server
      looked for book 99, and replied with 404, meaning "there's nothing at that path". The 4xx
      family says the request was wrong, not the server or the network. If the connection had
      failed, there'd be no response and no status code.

recap:
  - Name the client, the server, and the parts of a URL.
  - Say what a request and a response carry, and read a status code by its family.
  - Parse a JSON body, and encode user text before it goes into a query string.

recall:
  - id: card-client-server
    concept: js.requests-and-responses
    front: What's a server, and which side is the client?
    back: >-
      A server is a program on another computer that answers requests. The browser asking is the
      client.
  - id: card-url-parts
    concept: js.requests-and-responses
    front: 'Name the three parts of `https://shop.example/search?q=tea`.'
    back: >-
      The origin `https://shop.example`, the path `/search`, and the query string `q=tea`.
  - id: card-request-parts
    concept: js.requests-and-responses
    front: What does a request carry, and what does a response carry?
    back: >-
      A request has a method, a URL, headers and sometimes a body. A response has a status code,
      headers and a body.
  - id: card-status-families
    concept: js.status-codes
    front: What do the status code families 2xx, 4xx and 5xx mean?
    back: >-
      2xx it worked, 4xx the request was wrong (404 Not Found), 5xx the server failed (500).
  - id: card-encode-query
    concept: js.requests-and-responses
    front: Why encode what someone typed before putting it in a query string?
    back: >-
      Characters like `&`, `+` and spaces have meanings in a URL. `encodeURIComponent` or
      `URLSearchParams` keeps them as plain text.

