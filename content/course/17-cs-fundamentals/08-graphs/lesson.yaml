id: cs.graphs
title: Graphs
objective: Traverse a graph, order it topologically, and resolve dependencies.
level: advanced
minutes: 10
concepts: [cs.graphs, cs.graph-traversal, cs.topological-order]
prerequisites: [tooling.node-and-npm, tooling.git-as-a-graph]
opening:
  text: >-
    You'll explore anything made of things and links: a map, a friend list, a dependency
    tree. And you'll work out what `npm install` has to do first.

steps:
  - type: prose
    id: name-graph
    body: |-
      A **graph** is things and the links between them. The things are **nodes**, the links
      are **edges**. Here, stations one stop apart:

      ```js
      const tube = {
        Ash: ["Birch", "Cedar"],
        Birch: ["Ash", "Dale"],
        Cedar: ["Ash", "Dale"],
        Dale: ["Birch", "Cedar", "Elm"],
        Elm: ["Dale"],
      };
      ```

      Each node lists its neighbours. That's an **adjacency list**. Git history is a graph
      too: each commit points at its parent.

  - type: predict-output
    id: predict-neighbours
    concept: cs.graphs
    difficulty: 1
    language: js
    code: |
      const tube = {
        Ash: ["Birch", "Cedar"],
        Birch: ["Ash", "Dale"],
        Cedar: ["Ash", "Dale"],
        Dale: ["Birch", "Cedar", "Elm"],
        Elm: ["Dale"],
      };
      console.log(tube.Dale);
    question: What does this log?
    choices:
      - text: "`['Birch', 'Cedar', 'Elm']`"
        correct: true
        feedback: >-
          Right. One lookup gives a node's neighbours, however big the map gets.
      - text: "`['Elm']`"
        feedback: >-
          Elm lists Dale, but so do Birch and Cedar. Dale's own list has all three.
      - text: Every station on the map
        feedback: >-
          `tube.Dale` is only Dale's own list, the stations one stop away.

  - type: prose
    id: name-bfs-and-dfs
    body: >-
      To visit every station, keep a **queue**, like a line at a till. New stations join the
      back with `push`. The next visit leaves the front with `shift`.


      That's **breadth-first search**. It visits in rings: one stop away, then two. So it
      reaches each station by a shortest route. A `seen` list stops it going round in
      circles.

  - type: parsons
    id: arrange-bfs
    concept: cs.graph-traversal
    difficulty: 2
    language: js
    prompt: Visit every station reachable from `start`, nearest first. One block doesn't belong.
    blocks:
      - id: start-seen
        code: const seen = [start];
        subgoal: Remember where you've been
      - id: start-queue
        code: const queue = [start];
      - id: loop-open
        code: while (queue.length > 0) {
        subgoal: Take the next station off the front
      - id: take-front
        code: const station = queue.shift();
        indent: 1
      - id: for-open
        code: for (const next of graph[station]) {
        indent: 1
        subgoal: Queue each neighbour you haven't seen
      - id: if-new
        code: if (!seen.includes(next)) {
        indent: 2
      - id: mark-seen
        code: seen.push(next);
        indent: 3
      - id: join-back
        code: queue.push(next);
        indent: 3
      - id: if-close
        code: '}'
        indent: 2
      - id: for-close
        code: '}'
        indent: 1
      - id: loop-close
        code: '}'
    distractors:
      - id: take-back
        code: const station = queue.pop();
        feedback: >-
          `pop` takes from the back, so the newest station goes first. That's a stack.

  - type: fill-blank
    id: fill-stack-pop
    concept: cs.graph-traversal
    difficulty: 2
    prompt: >-
      A stack, from the recursion lesson, takes the newest item first. Make this search
      follow one path to its end before trying another.
    language: js
    template: |
      while (todo.length > 0) {
        const station = todo.{{1}}();
        for (const next of graph[station]) {
          if (!seen.includes(next)) {
            seen.push(next);
            todo.push(next);
          }
        }
      }
    blanks:
      - key: '1'
        answer: pop
    bank: [pop, shift, push, at]

  - type: ai-review
    id: review-no-seen-list
    concept: cs.graph-traversal
    difficulty: 4
    language: js
    request: List everyone a user can reach by following "follows" links.
    flawClass: edge-case
    code: |
      function reachable(follows, start) {
        const found = [];
        const queue = [start];
        while (queue.length > 0) {
          const person = queue.shift();
          found.push(person);
          for (const next of follows[person]) {
            queue.push(next);
          }
        }
        return found;
      }
    prompt: >-
      An assistant wrote this. On a chain, ana follows ben and ben follows cy, it worked. Then
      cy followed ana back, and it never finishes. Tap the line at fault.
    lines: [8]
    reasons:
      - text: '`shift` should be `pop`'
        feedback: >-
          That turns it into a depth-first search. It would loop round the same three people
          all the same.
      - text: The start person shouldn't be in the result
        feedback: >-
          Maybe not, as a product choice. It isn't why the loop never ends.
      - text: It queues people it has already visited
        correct: true
        feedback: >-
          Yes. Ours went ana, ben, cy, round and round. Check a `seen` list first.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A graph where someone follows back
          correct: true
          feedback: >-
            Yes. A cycle is exactly what a missing seen list can't survive.
        - text: A longer chain with no loop
          feedback: >-
            Each person is queued once on a chain, so it ends. The bug needs a loop.
        - text: A user who follows nobody
          feedback: >-
            The queue empties straight away. Nothing comes round again.
    fix: |
      for (const next of follows[person]) {
        if (!seen.includes(next)) {
          seen.push(next);
          queue.push(next);
        }
      }

  - type: prose
    id: name-topological-order
    body: >-
      That `pop` version is **depth-first search**: it dives down one path first.


      Now make the edges mean "needs". `test` needs `compile`, and `compile` needs `install`.
      A **topological order** lists every node after the nodes it needs. It's how a build
      tool, or `npm install`, decides what to do first. If everything left waits on
      something else, there's a **cycle**, and no order exists.

  - type: parsons
    id: predict-build-order
    concept: cs.topological-order
    difficulty: 3
    language: text
    prompt: >-
      `deploy` needs `bundle` and `test`. `bundle` needs `compile` and `test`. `test` needs
      `compile`. `compile` needs `install`. Order the tasks so each runs after what it needs.
    blocks:
      - id: install
        code: install
      - id: compile
        code: compile
      - id: test
        code: test
      - id: bundle
        code: bundle
      - id: deploy
        code: deploy

  - type: code-challenge
    id: write-fewest-hops
    concept: cs.graph-traversal
    difficulty: 4
    language: ts
    prompt: >-
      Write `fewestHops(graph, from, to)`. `graph` is an adjacency list: each name maps to the
      names it links to. Return the smallest number of edges on a route from `from` to `to`.


      A node is 0 hops from itself. Return `-1` when there's no route. Edges are one-way, and
      the graph may contain cycles.


      So on this lesson's map, `fewestHops(tube, 'Ash', 'Elm')` is `3`.
    hints:
      - Breadth-first search reaches nodes in order of distance, so search that way.
      - Store each node's hop count when you first queue it. That doubles as the `seen` check.
      - 'Start with `const hops: Record<string, number> = {};` and set `hops[from] = 0;`'

  - type: explain-back
    id: explain-cycle-no-order
    concept: cs.topological-order
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A build has three tasks. `a` needs `b`, `b` needs `c`, and `c` needs `a`. Why can't any
      build tool find an order to run them in?
    rubric:
      - A topological order puts every task after the tasks it needs.
      - In a cycle each task needs another in the ring, so none of them can ever go first.
      - The tool finds no task whose needs are met while tasks remain, and reports the cycle.
    modelAnswer: >-
      An order has to start somewhere, with a task whose needs are all done. Here `a` waits
      for `b`, `b` waits for `c`, and `c` waits for `a`. Whichever you pick first, something it
      needs hasn't run. So no first task exists, and with no first there's no order. A build
      tool notices it this way: tasks remain, and none is ready. The fix is to break the
      ring, often by splitting one task in two.

recap:
  - Store a graph as an adjacency list, and look up a node's neighbours in one step.
  - Traverse with a queue for fewest hops or a stack to go deep, and always keep a seen list.
  - Order dependencies topologically, and treat "nothing is ready" as a cycle.

recall:
  - id: card-adjacency-list
    concept: cs.graphs
    front: What is an adjacency list?
    back: >-
      A graph stored as a map from each node to the list of nodes it links to. Finding a node's
      neighbours is one lookup.
  - id: card-bfs-vs-dfs
    concept: cs.graph-traversal
    front: What's the one data structure that separates breadth-first from depth-first search?
    back: >-
      Breadth-first uses a queue and visits in rings of distance. Depth-first uses a stack and
      follows one path to its end.
  - id: card-seen-list
    concept: cs.graph-traversal
    front: Why does a graph traversal need a seen list?
    back: >-
      Graphs can have cycles. Without a record of visited nodes, the search goes round the
      cycle for ever.
  - id: card-topological
    concept: cs.topological-order
    front: What is a topological order, and when doesn't one exist?
    back: >-
      An order where every node comes after the nodes it depends on. None exists if the
      dependencies form a cycle.

references:
  - kind: paper
    title: Topological sorting of large networks
    authors: A. B. Kahn
    year: 1962
    venue: Communications of the ACM, 5(11)
    url: https://doi.org/10.1145/368996.369025
    note: The "list whatever is ready, and repeat" method this lesson uses, in two pages.
    primary: true
    verified: true
  - kind: paper
    title: Depth-First Search and Linear Graph Algorithms
    authors: Robert Tarjan
    year: 1972
    venue: SIAM Journal on Computing, 1(2)
    url: https://doi.org/10.1137/0201010
    note: What depth-first search can find in one pass, including the cycles in a directed graph.
    primary: true
    verified: true

deepDive: >-
  Every output here is from Node 24. Breadth-first from Ash gave Ash, Birch, Cedar, Dale, Elm,
  and the stack version gave Ash, Cedar, Dale, Elm, Birch. The build tasks have exactly one
  valid order; we checked every arrangement of the five.


  `seen.includes` walks an array, so it's O(n) per check. On a big graph, use a `Set`, which
  answers "have I seen this?" in about one step, like the hash maps lesson's `Map`. `shift`
  is O(n) on an array too, since everything moves up one place. A real queue keeps an index of
  its front instead.


  Both searches touch each node and each edge once: O(nodes + edges). Breadth-first finds
  fewest hops only when every edge costs the same. When edges have weights, such as minutes
  between stations, you need Dijkstra's algorithm. It's breadth-first search with a priority
  queue in place of the plain one.


  The other way to store a graph is a matrix: a grid with a row and a column per node, and a
  mark where an edge exists. It answers "are these two linked?" in one step, and costs
  nodes-squared memory. Most real graphs are sparse, so adjacency lists win.
