term: slopsquatting
aka: [package hallucination, hallucinated package]
short: Registering a package name that AI tools invent, so code that installs the invented name gets malware.
explain: |
  Code assistants sometimes import a package that doesn't exist, with a name that sounds
  right. The same made-up names come up again and again. An attacker registers one and
  fills it with malicious code.

  The next developer who runs the suggested install command pulls the attacker's code. The
  defences are old ones: look up every new dependency before adding it, keep a committed
  lockfile, and use an allow-list in CI.
analogy: Someone opens a shop under a street address that sat-navs keep inventing, and waits for lost drivers.
usage: That import isn't on the registry yesterday and has two hundred downloads today; treat it as slopsquatting.
twin:
  term: supply-chain-attack
  difference: A supply-chain attack is the whole family of attacks through dependencies. Slopsquatting is one member, where the bait is a name an AI made up.
related: [supply-chain-attack, hallucination, lockfile]
level: 2
lessons: [ai.reviewing-ai-code]
