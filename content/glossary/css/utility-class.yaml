term: utility class
aka: [utility-first CSS, atomic CSS]
short: A class that sets one small style, like padding or a colour, combined with others in the markup.
explain: |
  Instead of writing a `.card` rule, you list small classes on the element:
  `class="p-2 rounded-md"`. Each does one job, and the design is composed where it's used.
  Tailwind works this way.

  The classes come from the theme, so they follow your tokens. Square brackets, as in
  `p-[13px]`, step outside the tokens, so avoid them. When the same long list repeats, pull
  it into a component.
analogy: Jars on a spice rack. Each does one thing, and you combine them in the pan.
example:
  language: html
  code: |
    <button class="rounded-md bg-accent px-2 py-1 text-sm font-medium">
      Save
    </button>
usage: That arbitrary value breaks the grid, so use the spacing utility class instead.
related: [design-token, specificity, component-library]
level: 2
lessons: [design.utility-first-css]
