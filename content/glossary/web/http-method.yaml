term: HTTP method
aka:
  - HTTP verb
  - request method
short: The word at the start of a request that says what the client wants done.
explain: |
  A request names a thing and an action. The thing is the URL. The action is a word: `GET` reads, `POST` creates, `PUT` replaces, `PATCH` changes part, `DELETE` removes.

  The choice carries promises. `GET` must be safe: no side effects, so browsers, caches
  and crawlers repeat it freely. `PUT` and `DELETE` are idempotent; `POST` is not. Put a
  delete behind a `GET` link and a prefetching browser will happily empty your table.
analogy: The verb on a library slip. "Borrow", "return" and "renew" all name the same book, but ask for very different things.
example:
  language: http
  code: |
    GET    /tasks/7    read it
    PATCH  /tasks/7    change some fields
    DELETE /tasks/7    remove it
usage: That endpoint changes data, so it can't be a GET; switch the HTTP method to POST.
related:
  - http
  - rest
  - idempotent
  - status-code
level: 1
