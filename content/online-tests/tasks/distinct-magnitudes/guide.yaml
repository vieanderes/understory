approach: >-
  Take the absolute value of every reading and put it in a set. A set keeps each value
  once, so its size is the number of different magnitudes. Adding to a set is constant time
  on average, so the whole thing is one pass.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Start at the bottom. **N up to 100,000** and **efficient** rule out comparing every
      pair of readings. The value range runs to the full 32-bit limits, which is a hint
      about one tricky value.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in your own words. A one-line version is the plan: drop the sign, count what
      is left.
    code:
      ts: |-
        // Return how many different absolute values appear in A.
      python: |-
        # Return how many different absolute values appear in A.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break it:

      - a single reading, including 0;
      - a value next to its negative, which counts once;
      - only negative readings;
      - the extremes, -2147483648 and 2147483647.

      Put them in test-input.txt now.
    input:
      - "[0]"
      - "[-2, 2, -9, 9, 0, 0]"
      - "[-1, -2, -3, -2]"
      - "[-2147483648, 2147483647]"
      - "[-2147483647, 2147483647]"
  - kind: ask-ai
    title: Check the one value that can overflow
    minutes: 1
    body: |-
      In many languages, the absolute value of -2147483648 does not fit a 32-bit integer.
      Asking whether that bites here is a sharp, narrow question. It shows you know where
      bugs hide.
    prompt: >-
      One line each: does Math.abs(-2147483648) in JavaScript and abs(-2147483648) in
      Python return 2147483648 exactly, or can it overflow like a 32-bit int?
    expect: Both return 2147483648 exactly, because neither language uses 32-bit integers here.
  - kind: plan
    title: Pick the structure that keeps each value once
    minutes: 1
    body: |-
      You need "have I seen this magnitude?" for every reading. A set answers that at once,
      and its size is the answer. Sorting the magnitudes also works, at O(N log N).
  - kind: write
    title: Write the solution yourself
    minutes: 3
    body: |-
      It is three lines. Type it yourself: prompting would take longer, and the transcript
      shows you know the tool. Add the complexity to the header comment.
    code:
      ts: |-
        // Return how many different absolute values appear in A.
        // A set keeps each magnitude once, and adding to it is O(1) on average:
        // O(N) time, O(N) space.
        function solution(A: number[]): number {
          const seen = new Set<number>();
          for (const value of A) seen.add(Math.abs(value));
          return seen.size;
        }
      python: |-
        # Return how many different absolute values appear in A.
        # A set keeps each magnitude once, and adding to it is O(1) on average:
        # O(N) time, O(N) space.
        def solution(A):
            return len({abs(value) for value in A})
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Then check each returned value against
      the rule.
    expect: >-
      Two OKs, then 1 for [0], 3 for the pairs with zeros, 3 for the negatives, 2 for the two
      extremes and 1 for -2147483647 with 2147483647.
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Varied inputs are a good job for the assistant. You stay in charge of the answers and
      check each one against the rule.
    prompt: >-
      Give me 5 test inputs for solution(A), one per line, in the format [-5, -3, 0, 3].
      Cover many duplicates, a sorted array symmetric around zero, one large negative value
      repeated and a mix of the 32-bit extremes. Inputs only, no answers and no code.
    expect: Five lines to paste into test-input.txt. Run again and check each result.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The code is short, so the review is quick.
    prompt: >-
      Review my current solution for correctness at the 32-bit extremes and for time
      complexity. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output. Check the header comment states the complexity. Then submit.
