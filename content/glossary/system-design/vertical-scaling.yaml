term: vertical scaling
aka: [scaling up, scale up]
short: Handling more load by moving to a bigger machine with more CPU, memory or disk.
explain: |
  The quickest fix for a busy server is often a larger one. No code changes, no new moving
  parts. Databases are usually scaled this way first, because splitting a database is hard.

  It has a ceiling: the biggest machine on offer, and its price rises faster than its
  power. And it's still one machine, so if it fails, everything stops. Most systems scale
  up until it hurts, then scale out.
analogy: Swapping your hatchback for a van, instead of buying a second hatchback.
usage: Vertical scaling buys us a year on the database; double the instance size and revisit sharding later.
twin:
  term: horizontal-scaling
  difference: Vertical scaling makes one machine bigger. Horizontal scaling adds more machines. Up versus out.
related: [horizontal-scaling, single-point-of-failure]
level: 2
lessons: [cloud.scaling-and-cost]
