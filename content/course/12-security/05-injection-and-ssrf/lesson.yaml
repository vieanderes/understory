deepDive: >-
  Injection isn't only SQL. Any language built from strings has it: an OS command from user
  input, an LDAP filter, a NoSQL query object. The cure is always the same: keep the code and
  the data apart, with parameters or an API that never parses the data as code.


  SSRF has a nastier variant. An attacker's host can pass an allow-list, then a DNS rebind
  changes what it resolves to a moment later, landing on `169.254.169.254` at fetch time. So
  resolve the host, check the resolved IP against private ranges, and fetch that IP.


  On a cloud host, the metadata endpoint at `169.254.169.254` hands out temporary credentials
  to anything that asks from the instance. IMDSv2 requires a token first, which blocks the
  simplest SSRF. Turn it on, and still allow-list.


  Prompt injection is the newest member of the family. A language model reads text that
  contains instructions, and follows them as if you'd written them. Chapter 20 has a lesson on
  it, and chapter 21 adds guardrails around it.


  When an agent reads a web page or an email and then calls tools, injected instructions can act
  with its permissions. The lesson *What an agent may touch* in the agents chapter covers that
  case.
