term: Suspense
aka: [Suspense boundary, "<Suspense>", loading.tsx]
short: A React wrapper that shows a fallback while something inside it is still waiting for data or code.
explain: |
  A page often has one part that is slow. You want the rest on screen now and a
  placeholder in that one spot.

  React's `<Suspense fallback={...}>` draws the fallback until everything inside is ready,
  then swaps in the real content. On the server it marks where a page may stream. Where you
  put the boundary decides what waits together: one around the whole page hides everything
  behind the slowest part.
analogy: A sign saying "back in five minutes" on one shop counter while the rest of the shop stays open.
example:
  language: tsx
  code: |
    <Suspense fallback={<Skeleton />}>
      <Comments postId={id} />
    </Suspense>
usage: Move the Suspense boundary down to the comments, or the whole article waits for them.
related: [streaming, error-boundary, code-splitting]
level: 2
lessons: [next.loading-data]
