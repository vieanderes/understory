term: topological sort
aka: [topological order, topological ordering, Kahn's algorithm, toposort]
short: Putting tasks in an order where each comes after everything it depends on.
explain: |
  You can't put on shoes before socks. Given rules like "B needs A", you want a running
  order that breaks none of them. Builds, package installs and course prerequisites all
  need one.

  Count each task's unmet dependencies. Start with the tasks at zero. Each time you finish
  one, lower the count of the tasks waiting on it, and queue any that reach zero.

  Tasks left over at the end wait on each other in a cycle, so no valid order exists. That check is often the real question.
analogy: Getting dressed. Underwear before trousers, socks before shoes, and the order of shirt and socks doesn't matter.
example:
  language: python
  code: |
    def order(tasks, needs):  # needs: (before, after) pairs
        waiting = {t: 0 for t in tasks}
        for _, after in needs:
            waiting[after] += 1
        ready, done = [t for t in tasks if waiting[t] == 0], []
        while ready:
            t = ready.pop()
            done.append(t)
            for nxt in (a for b, a in needs if b == t):
                waiting[nxt] -= 1
                if waiting[nxt] == 0: ready.append(nxt)
        return done if len(done) == len(tasks) else None  # None: a cycle
usage: Do a topological sort of the migrations; if any are left, two of them depend on each other.
related: [graph, depth-first-search, fifo-queue, union-find]
