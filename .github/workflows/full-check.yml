# Everything `pnpm check` and `pnpm test:e2e` do, on a clean runner: every solution run
# against its tests, coverage thresholds, the content build tests, the production build and
# the end-to-end suite on desktop Chromium and phone WebKit with axe. About an hour, so it
# is started by hand ("Run workflow") before a release, not on every push.
name: Full check

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Run the end-to-end suite as well'
        type: boolean
        default: true

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    name: Full check
    runs-on: ubuntu-latest
    # A hung step must not burn the month's minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Strict here, so the unit suite skips its own full validation of the real content.
      - run: pnpm validate:content --strict
      - name: Dependency audit (must be completely clean)
        run: pnpm audit --audit-level=low
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

      # WebKit as well as Chromium: the phone project runs on Safari's engine.
      - if: inputs.e2e
        run: pnpm exec playwright install --with-deps chromium webkit
      - if: inputs.e2e
        run: pnpm test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure() && inputs.e2e
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
