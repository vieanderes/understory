id: longest-streak
title: LongestStreak
topic: iterations
difficulty: easy
type: bug-fix
recommendedMinutes: 15
maxChangedLines: 2
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A step counter records whether a daily goal was met: A[K] = 1 if it was met on day K,
  and 0 if not. The app shows the longest streak: the largest number of consecutive days
  on which the goal was met.

  The function below is meant to compute it, but it returns wrong answers for some inputs.
  Find the bug and fix it. **You can modify at most two lines.**

  {{signature}}

  For example, given A = [1, 1, 0, 1, 1, 1, 0], the function should return 3.

  Given A = [0, 0], the function should return 0.

  Given A = [1, 0, 1, 1], the function should return 2.

  Assume that:

  - N is an integer within the range [1..1,000];
  - each element of array A is 0 or 1.

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [[1, 1, 0, 1, 1, 1, 0]], expected: 3 }
  - { args: [[0, 0]], expected: 0 }
tests:
  - name: ends_with_streak
    description: the longest streak runs to the last day
    group: correctness
    cases:
      - { args: [[1, 0, 1, 1]], expected: 2 }
      - { args: [[0, 1, 1, 1]], expected: 3 }
  - name: all_met
    description: the goal was met every day
    group: correctness
    cases:
      - { args: [[1]], expected: 1 }
      - { args: [[1, 1, 1, 1, 1]], expected: 5 }
  - name: none_met
    description: the goal was never met
    group: correctness
    cases:
      - { args: [[0]], expected: 0 }
      - { args: [[0, 0, 0]], expected: 0 }
  - name: alternating
    description: met every other day
    group: correctness
    cases:
      - { args: [[1, 0, 1, 0, 1, 0]], expected: 1 }
      - { args: [[0, 1, 0, 1]], expected: 1 }
  - name: random
    description: random days, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 3, args: [{ kind: ints, n: 1000, min: 0, max: 1 }] }
      - generate: { seed: 4, args: [{ kind: ints, n: 999, min: 0, max: 1 }] }
