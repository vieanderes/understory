id: algo.backtracking
title: Backtracking
objective: Generate subsets, orders and combinations by choosing, exploring and undoing, and prune branches that cannot succeed.
level: advanced
minutes: 10
concepts: [algo.backtracking, algo.pruning]
prerequisites: [algo.dynamic-programming, cs.recursion]
opening:
  text: >-
    You'll list every subset, order or combination with one short recursive pattern. Then
    you'll cut the search down so it finishes on inputs that would otherwise never end.

steps:
  - type: prose
    id: picture-backtracking
    body: |-
      Some tasks want every answer, not the best one: every subset, every order. Build each
      answer one choice at a time. For items `a` and `b`, each level takes an item or skips
      it:

      ```text
      take a?   yes: take b?  yes -> ab   no -> a
                no:  take b?  yes -> b    no -> (none)
      ```

      Signals: "all combinations", "every order", "every way to", and a small n, often 20 or
      less.

  - type: multiple-choice
    id: spot-backtracking-signal
    concept: algo.backtracking
    difficulty: 1
    question: Which task wants backtracking?
    choices:
      - text: List every seating order for six dinner guests
        correct: true
        feedback: >-
          Yes. "Every order" of a small group is a search over choices.
      - text: Find the fewest moves between two rooms
        feedback: >-
          Fewest moves is breadth-first search. It wants one best path, not all of them.
      - text: Merge overlapping bookings into busy blocks
        feedback: >-
          That's sort by start, then one pass.
      - text: Find the most common word in a book
        feedback: >-
          "Most common" is counting with a map.

  - type: prose
    id: name-backtracking
    body: |-
      In code, one shared `path` holds the choices so far:

      ```js
      path.push(items[i]);   // choose
      explore(i + 1);        // explore everything that follows
      path.pop();            // undo, so the next branch starts clean
      ```

      That's **backtracking**. With n items there are 2^n subsets and n factorial orders, so the work
      is exponential by nature. That's why n stays small.

  - type: ai-review
    id: review-shared-path
    concept: algo.backtracking
    difficulty: 3
    language: js
    request: List every order of the items.
    flawClass: logic
    code: |
      function orders(items) {
        const result = [];
        const path = [];
        function explore() {
          if (path.length === items.length) { result.push(path); return; }
          for (const item of items) {
            if (path.includes(item)) continue;
            path.push(item);
            explore();
            path.pop();
          }
        }
        explore();
        return result;
      }
    prompt: >-
      An assistant wrote this. Its test checked `orders([1, 2, 3]).length` and got 6. Printing
      the result shows six empty arrays. Tap the line at fault.
    lines: [5]
    reasons:
      - text: Every entry is the same shared array
        correct: true
        feedback: >-
          Yes. Later pops empty it. Push a copy: `result.push([...path])`.
      - text: '`path.includes` skips valid items'
        feedback: >-
          It skips items already in this order, which is what an order needs. The count was right.
      - text: '`path.pop()` runs too early'
        feedback: >-
          It runs after the branch is fully explored. That's the undo step, and it belongs there.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Check the orders themselves, not only how many
          correct: true
          feedback: >-
            Yes. The count was right; the contents were empty.
        - text: Count the orders of four items
          feedback: >-
            24 comes back, as it should. A count can't see that every entry is the same
            array.
        - text: Count the orders of an empty list
          feedback: >-
            That gives one order, which is right. Counting hides the shared array again.
    fix: |
      if (path.length === items.length) { result.push([...path]); return; }

  - type: parsons
    id: arrange-choose-k
    concept: algo.backtracking
    difficulty: 3
    language: js
    prompt: >-
      Build `explore`, which records every group of `k` items where order doesn't matter.
      `items`, `k` and `result` already exist. Starting after the last pick stops `ab` and `ba`
      both appearing.
    blocks:
      - id: open-explore
        code: function explore(start, path) {
      - id: record-full
        code: 'if (path.length === k) { result.push([...path]); return; }'
        indent: 1
        subgoal: Record a full group
      - id: loop
        code: for (let i = start; i < items.length; i++) {
        indent: 1
        subgoal: Choose, explore, undo
      - id: choose-item
        code: path.push(items[i]);
        indent: 2
      - id: explore-next
        code: explore(i + 1, path);
        indent: 2
      - id: undo
        code: path.pop();
        indent: 2
      - id: close-loop
        code: '}'
        indent: 1
      - id: close-explore
        code: '}'
    distractors:
      - id: explore-start-plus-one
        code: explore(start + 1, path);
        feedback: >-
          That restarts near the front, so an item can be picked twice. With `a`, `b`, `c` you'd get `bb` and `cb`.
      - id: record-shared
        code: result.push(path);
        feedback: >-
          That stores the shared array, which the pops later empty. Record a copy.

  - type: prose
    id: pruning-idea
    body: |-
      Now find items whose prices add up to a budget. Sort the prices first.

      If the next price is already more than what's left, every later price is too. So you
      can stop the whole loop there. Cutting off a branch that can't succeed is **pruning**.
      It's what turns "never finishes" into "instant".

  - type: multiple-choice
    id: break-or-continue
    concept: algo.pruning
    difficulty: 3
    code: |
      for (let i = start; i < sorted.length; i++) {
        if (sorted[i] > remaining) ____;
        path.push(sorted[i]);
        explore(i + 1, remaining - sorted[i]);
        path.pop();
      }
    language: js
    question: The prices are sorted, smallest first. What goes in the blank?
    choices:
      - text: '`break`'
        correct: true
        feedback: >-
          Right. Sorted order means nothing later can fit either.
      - text: '`continue`'
        feedback: >-
          Still correct, but it checks every later price, and each is bigger. `break` skips them all.
      - text: '`return result`'
        feedback: >-
          That ends this call only. Other branches go on, and `result` isn't this function's job.
      - text: Nothing, check the total at the end
        feedback: >-
          Most people's first version. It builds every subset before rejecting them: 2^n work.

  - type: code-challenge
    id: write-budget-combos
    concept: algo.pruning
    difficulty: 4
    language: ts
    prompt: >-
      A gift-card page suggests item sets that use the card exactly. Write
      `budgetCombos(prices, budget)`. Prices are distinct positive whole numbers. Return
      every combination that adds up to exactly the budget, each item used at most once.


      List each combination smallest first, and the combinations in dictionary order.
      `budgetCombos([8, 2, 6, 4, 5, 3], 10)` is `[[2, 3, 5], [2, 8], [4, 6]]`.


      **Target:** prune, so 40 prices finish at once. The tests include no prices, nothing
      that fits, and a check that the input isn't changed. Trying every subset never
      finishes.
    hints:
      - Sort a copy of the prices, smallest first. That gives both the output order and the pruning.
      - 'Recurse with a start index and what''s left of the budget. At `0` left, record a copy of the path.'
      - 'In the loop, `break` once a price is more than what''s left. Otherwise push it, recurse with `i + 1`, then pop.'

  - type: code-challenge
    id: write-bracket-strings
    concept: algo.pruning
    difficulty: 4
    language: python
    starter: brackets.starter.py
    solution: brackets.solution.py
    tests: brackets.tests.py
    prompt: >-
      Now in Python, a classic. Write `bracket_strings(n)`: every string of `n` pairs of
      `(` and `)` that closes properly, in sorted order.


      `bracket_strings(2)` is `["(())", "()()"]`.


      **Target:** build only valid strings. The tests include `n = 0` and `n = 12`, which
      has 208,012 answers. Building all 16,777,216 strings of 24 brackets, then filtering,
      runs out of time.
    hints:
      - Build the string one bracket at a time. When is `(` allowed? When is `)`?
      - '`(` while you have opened fewer than `n`. `)` only while an open `(` is waiting to close.'
      - 'Recurse with `(text, opened, closed)`. At length `2 * n`, append `text`. Try `(` before `)` and the output is sorted.'

  - type: explain-back
    id: explain-break-safe
    concept: algo.pruning
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer asks why `budgetCombos` can `break` when a price is too big, rather
      than skip that one price. What do you say?
    rubric:
      - The prices are sorted, so every later price is at least as big.
      - Prices are positive, so adding more can only raise the total.
      - No later price can lead to an answer, so stopping loses nothing and saves the work.
    modelAnswer: >-
      The prices are sorted, so each later price is bigger than this one. They're all
      positive, so no combination through them can come back down to the budget. The loop has
      nothing left to find, and stopping cuts off all those branches at once.

recap:
  - Choose, explore, then undo to visit every combination once.
  - Record a copy of the path, never the shared array.
  - Sort first so you can prune with `break`.
recall:
  - id: card-choose-explore-undo
    concept: algo.backtracking
    front: What are the three moves of backtracking?
    back: >-
      Choose an option, explore everything that follows from it, then undo the choice before
      trying the next option.
  - id: card-copy-path
    concept: algo.backtracking
    front: Why must a backtracking search push `[...path]` rather than `path`?
    back: >-
      Every call shares one path array, and later pops change it. A copy freezes the answer.
  - id: card-no-duplicate-groups
    concept: algo.backtracking
    front: How do you stop `ab` and `ba` both appearing when order doesn't matter?
    back: >-
      Start each level's loop after the index of the last pick, so items only ever appear in
      index order.
  - id: card-prune
    concept: algo.pruning
    front: What makes pruning with `break` safe in a budget search?
    back: >-
      Sorted, positive prices. Once one is over what's left, every later one is too.

references:
  - kind: docs
    title: Backtracking
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Backtracking
    note: The general scheme of accept, reject and extend, and the search tree it walks.
    primary: true
    verified: true

deepDive: >-
  **Cost.** Subsets are O(2^n × n) and orders are O(n × n factorial), because each answer is copied.
  Say that out loud in an interview: the output itself is that big, so no trick beats it.
  Pruning helps when most branches die early, which is why sorting first is such a common
  move.


  **Duplicates in the input.** If two items share a value, `[1, 1, 2]` yields `[1, 2]`
  twice. The usual fix is to sort, then skip an item equal to the one before it at the same
  level: `if (i > start && sorted[i] === sorted[i - 1]) continue`. That's the classic
  follow-up to this lesson's challenge.


  **Reuse allowed.** If each price may be used many times, recurse with `i` instead of
  `i + 1`. It's a one-character change, so state which version you're writing before you
  start.


  **Stack depth.** Recursion depth equals the path length, so it's usually small. Depth
  becomes a problem only when one path can hold thousands of choices; then use an explicit
  stack.
