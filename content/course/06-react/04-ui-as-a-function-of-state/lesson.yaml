id: react.ui-as-a-function-of-state
title: UI as a function of state
objective: Follow a click through trigger, render and commit, and keep components pure so rendering changes nothing else.
level: essential
minutes: 10
concepts: [react.render-and-commit, react.jsx, react.purity]
prerequisites: [react.state-and-events]
opening:
  text: >-
    You'll follow a click from the setter to the page, and see what React touches and what it
    leaves alone. It's why the note you're typing survives when the list around it
    changes.

steps:
  - type: prose
    id: three-steps
    body: |-
      Last lesson, calling a setter changed the page. Three steps happen in between:

      1. **Trigger**: something asks for a new render, like `setCount(1)`.
      2. **Render**: React calls your components to get the new JSX.
      3. **Commit**: React changes the real page, the DOM, to match.

      Rendering only works out the answer. Committing is the one step that touches the page.

  - type: playground
    id: wipe-the-note
    concept: react.render-and-commit
    difficulty: 2
    prompt: >-
      No React here, only plain JavaScript. `update` redraws everything with `innerHTML`, so
      the typed note is wiped. Change `update` to rewrite only the count's text. Watch the note.
    html: |
      <h2>Shopping list</h2>
      <div id="app"></div>
    js: |
      const app = document.querySelector("#app");
      const items = ["Bread", "Eggs"];
      function render() {
        app.innerHTML = `<p id="count">${items.length} items</p>
          <label for="note">Note</label> <input id="note" placeholder="Add a note">`;
      }
      function update() {
        render();
      }

      render();
      // A test: someone types a note, then an item is added.
      document.querySelector("#note").value = "Get the oat milk";
      items.push("Milk");
      update();
    editable: [js]
    checks:
      - label: The count says 3 items
        selector: '#count'
        text: 3 items
      - label: The note keeps its text
        selector: '#note:not(:placeholder-shown)'
    solution:
      js: |
        const app = document.querySelector("#app");
        const items = ["Bread", "Eggs"];
        function render() {
          app.innerHTML = `<p id="count">${items.length} items</p>
            <label for="note">Note</label> <input id="note" placeholder="Add a note">`;
        }
        function update() {
          document.querySelector("#count").textContent = `${items.length} items`;
        }

        render();
        // A test: someone types a note, then an item is added.
        document.querySelector("#note").value = "Get the oat milk";
        items.push("Milk");
        update();
    hints:
      - '`innerHTML` throws away every element inside `#app`, the input too, and builds new ones.'
      - Only the count changed. Find that one element and change its text.
      - "Inside `update`, use `document.querySelector(\"#count\").textContent`."

  - type: prose
    id: render-then-commit
    body: >-
      React does what your fix did, for every change, without you writing it. After a render,
      it compares the new JSX with the last render's. Then it commits only the differences.


      So a component can render again and again while most of its part of the page stays put.
      Your typed note lives in a DOM node React never needed to replace.

  - type: multiple-choice
    id: pick-render-without-commit
    concept: react.render-and-commit
    difficulty: 3
    language: tsx
    code: |
      function Song({ title }: { title: string }) {
        console.log("render", title);
        return <li>{title}</li>;
      }

      function Playlist() {
        const [plays, setPlays] = useState(0);
        return (
          <ul onClick={() => setPlays(plays + 1)}>
            <Song title="Intro" />
            <Song title="Outro" />
            <li>{plays > 1 ? "Played a lot" : "New"}</li>
          </ul>
        );
      }
    question: You click the list once. What happens?
    choices:
      - text: Both songs render, and no DOM node changes
        correct: true
        feedback: >-
          Right. The new JSX still says Intro, Outro and New, so nothing is committed.
      - text: Nothing renders, and no DOM node changes
        feedback: >-
          A parent's render calls its children too. Skipping unchanged ones is opt-in, in the
          performance lesson.
      - text: All three `li` nodes are replaced
        feedback: >-
          That's how `innerHTML` works. React compares first, and leaves equal nodes alone.
      - text: Only the last `li` text is rewritten
        feedback: >-
          The expression ran again, but it gave "New" both times. Nothing differs, so nothing is
          written.

  - type: prose
    id: jsx-is-a-description
    body: >-
      What does a component actually hand React? Each JSX tag becomes a function call, and the
      call returns a **React element**: a plain object with a `type` and `props`.


      An element is a description, like an order slip. Writing the slip doesn't cook anything.
      React decides when to call your component, and that's the render.

  - type: predict-output
    id: predict-element-object
    concept: react.jsx
    difficulty: 2
    language: tsx
    code: |
      function Count({ total }: { total: number }) {
        console.log("Count called");
        return <strong>{total} left</strong>;
      }

      const element = <Count total={3} />;
      console.log(typeof element, element.props.total);
    question: Nothing else runs. What does this log?
    choices:
      - text: '`object 3`'
        correct: true
        feedback: >-
          Right. The tag builds an object naming `Count`. Nobody has called `Count` yet.
      - text: '`Count called`, then `object 3`'
        feedback: >-
          Most people expect the tag to call the function. It only records which function to
          call later.
      - text: '`Count called`, then `string 3`'
        feedback: >-
          JSX doesn't produce HTML text. It produces an object, and `Count` never runs here.
      - text: '`function 3`'
        feedback: >-
          `Count` itself is stored inside, under `element.type`. The element around it is an
          object.

  - type: prose
    id: pure-components
    body: >-
      React calls your components whenever it needs to, sometimes more than once. So a
      component must be **pure**: the same props and state give the same JSX, and rendering
      changes nothing outside it.


      **Strict Mode** checks this by calling each component twice. It only runs in the
      **development build**, the version with extra checks you use while building. Visitors get
      the leaner **production build**.

  - type: ai-review
    id: review-sort-mutates-props
    concept: react.purity
    difficulty: 3
    language: tsx
    request: Show the top score from the scores the parent passes in.
    flawClass: logic
    code: |
      function TopScore({ scores }: { scores: number[] }) {
        const best = scores.sort((a, b) => b - a)[0];
        return <p>Top score: {best}</p>;
      }
    prompt: >-
      An assistant wrote this. It shows 95, which is right. But the results table beside it,
      reading the same `scores`, has changed order. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`sort` reorders the parent''s array in place'
        correct: true
        feedback: >-
          Yes. Rendering must leave props alone. `toSorted` returns a sorted copy.
      - text: The comparator must return `true` or `false`
        feedback: >-
          `sort` wants a negative, zero or positive number. The top score it found is right.
      - text: Props are copies, so this can't reach the parent
        feedback: >-
          A common belief. Props hand over the very array the parent holds, so changing it here
          changes it there.
    verify:
      question: What else could this in-place sort break?
      choices:
        - text: Any other component that reads the same `scores`
          correct: true
          feedback: >-
            Yes. They all hold one array, so all of them see the new order.
        - text: Only the text inside `TopScore`
          feedback: >-
            That text is right. The damage lands outside, in the array the parent owns.
        - text: Nothing, once Strict Mode is turned off
          feedback: >-
            Strict Mode only shows the problem sooner. The array is changed on every render anyway.
    fix: |
      function TopScore({ scores }: { scores: number[] }) {
        const best = scores.toSorted((a, b) => b - a)[0];
        return <p>Top score: {best}</p>;
      }

  - type: code-challenge
    id: build-pure-receipt
    concept: react.purity
    difficulty: 2
    language: tsx
    starter: receipt.starter.tsx
    solution: receipt.solution.tsx
    tests: receipt.tests.tsx
    prompt: >-
      A café prints one `Receipt` per table. It adds each price to a `total` that lives
      outside the component. Two receipts on one page share it, and every new render adds the
      prices again.


      Make `Receipt` pure. Work the total out from `prices` while rendering, so the same props
      always show the same total. With `prices` of `[4.5, 3]`, it shows `Total: £7.50`.
    hints:
      - Look at where `total` is declared. Who else can change it between renders?
      - A value worked out inside the component starts fresh on every render.
      - 'Delete the outer `let`, and start with `const total = prices.reduce(` inside the function.'

  - type: explain-back
    id: explain-typing-survives
    concept: react.render-and-commit
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A shopping list built with `innerHTML` wipes the note you're typing whenever an item is
      added. Why doesn't a React version?
    rubric:
      - Rendering calls the components and produces new JSX without touching the page.
      - React compares the new JSX with the previous render's and commits only the differences.
      - The input is described the same way both times, so its node and its text are never replaced.
    modelAnswer: >-
      Setting `innerHTML` destroys every node inside and builds new ones, so the input and its
      text are gone. React splits the work. Rendering calls the components and gets a
      description of the next page. Committing applies only what differs from the last one.
      The count gets updated. The input looks the same as before, so React leaves its node,
      and your note, alone.

recap:
  - Follow a state change through trigger, render and commit.
  - Read a JSX tag as a plain object that describes an element.
  - Keep components pure, so rendering changes nothing outside them.

recall:
  - id: card-render-commit
    concept: react.render-and-commit
    front: What happens in the render step, and what happens in the commit step?
    back: >-
      Render calls your components to work out the new JSX and compares it with the last.
      Commit changes the page, only where something differs.
  - id: card-jsx-value
    concept: react.jsx
    front: What is the value of `<Count total={3} />`, and has `Count` run?
    back: >-
      A plain object, a React element, with `type: Count` and `props: { total: 3 }`. `Count`
      hasn't run. React calls it when it renders the element.
  - id: card-purity
    concept: react.purity
    front: Why must a component not change outside variables or its props while rendering?
    back: >-
      React may call it any number of times. The output must depend only on props and state,
      or the page changes each time it renders.
  - id: card-strict-mode
    concept: react.purity
    front: What does Strict Mode do to your components, and when?
    back: >-
      In the development build it calls each component twice, so a render that changes
      something outside shows up. Production builds skip it.

