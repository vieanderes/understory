term: aggregate function
aka: [aggregate, GROUP BY, HAVING]
short: A SQL function that turns many rows into one value, such as a count, total or average.
explain: |
  A dashboard wants one number per thing: open tickets per agent, revenue per day. Fetching
  every row and counting in your code moves the whole table over the network. Let the
  database do it.

  `count`, `sum`, `avg`, `min` and `max` collapse rows, and `GROUP BY` runs them once per
  group. `WHERE` filters rows before grouping; `HAVING` filters groups afterwards. Watch the traps. `count(*)` counts rows while `count(col)` skips NULLs. A `sum` over
  zero rows is NULL. And a join that repeats rows inflates every total.
analogy: Counting votes. You don't read every ballot aloud at the end; you announce one total per candidate.
example:
  language: sql
  code: |
    SELECT agent_id, count(*) AS open_tickets
    FROM tickets
    WHERE status = 'open'
    GROUP BY agent_id
    HAVING count(*) > 10;
usage: Don't add up every order in JavaScript; use an aggregate function and send back one row per day.
twin:
  term: window-function
  difference: An aggregate collapses each group into one row. A window function computes the same kind of value but keeps every row.
related: [window-function, join, index]
level: 2
lessons: [db.grouping]
