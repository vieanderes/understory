deepDive: >-
  A script in `head` can wait for the page with `<script defer src="app.js">`. `defer` loads
  the file alongside the HTML and runs it once the whole document is parsed. Module scripts,
  which a later lesson covers, behave that way on their own.


  Another old style is `onclick="showHours()"` written in the HTML. It works, but it mixes
  behaviour into the markup, and an element gets only one such handler per event.
  `addEventListener` keeps the code in one place and lets several listeners share an event.


  The listener receives an event object describing what happened, such as which element was
  clicked. The events lesson puts it to work.


  `element.click()` fires the same click event a mouse would, which is why tests use it. It
  doesn't move the pointer or focus anything.
