term: contract test
aka: [contract testing, consumer-driven contract]
short: A test that checks two services still agree on the shape of the requests and replies between them.
explain: |
  The orders service expects the users API to return `email`. The users team renames it to
  `emailAddress`. Both test suites pass, because each side fakes the other, and production
  breaks.

  A contract records what one side sends and the other expects. The consumer's tests write
  it; the provider's build checks it can still meet it, so the rename fails in their CI,
  not in production. Tools like Pact do this. It's cheaper than running both services
  together end to end, and it pins the exact field that broke.
analogy: A plug and a socket built to the same standard. Two factories never meet, but the plug still fits.
usage: Add a contract test for the billing webhook payload; the last rename broke three consumers.
related: [integration-test, test-pyramid, stub]
level: 3
lessons: [testing.contract-tests]
