summary: >-
  With coding agents, writing code is cheap and fast. Deciding what to build is not, and it's
  now where most of the waste happens. A team can ship a polished AI feature in a week that
  changes nothing for anyone, because nobody said what it should change or checked the bet it
  rested on.


  Shaping is the work before the code. You name the **outcome**, the change in what people do,
  and a **success metric** with a baseline, a target and a guardrail, all set before any result
  can bend them. You list the **assumptions** the build rests on, rank them by how damaging
  and how uncertain they are, and test the riskiest first with the **smallest slice** that
  runs end to end on real data. Then you write a **spec** that fixes what must hold and leaves
  reversible choices to the builder, person or agent.


  Shape anything that costs more than a few days or touches users. Don't shape a bug fix with
  a failing test; the test is the spec.
remember:
  - An output is what you ship; an outcome is the change it causes, measured against a baseline.
  - Set the metric, baseline, target, guardrail and decision date before building, so the result can't choose them.
  - Write assumptions as claims that could be false, and test the most damaging and least certain first.
  - Decisions you can't undo, such as data migrations or customer-facing sends, need evidence earlier.
  - The smallest testable slice runs end to end through the riskiest assumption on real data, with a stop rule.
  - A spec marks each decision as locked, bounded or delegated, and names non-goals and the proof it will accept.
  - Proof has to match the claim; a passing unit test doesn't prove users are better off.
sections:
  - title: From request to brief
    body: |-
      A request usually arrives as an output: "add AI summaries to tickets", "let users chat
      with their documents". Turn it into a brief before anyone opens an editor.

      ```yaml
      request: add AI summaries to support tickets
      outcome: agents resolve tickets faster
      metric: median_handling_minutes
      baseline: 12
      target: 9
      guardrail: reopen_rate stays under 6%
      decide_on: 2026-11-30
      stop_if: graded accuracy below 90% on 50 real tickets
      ```

      The **metric** measures the outcome, not the activity. "Summaries generated" goes up
      whether or not anyone is helped. The **guardrail** catches the cheap way to hit the
      target: tickets closed faster but reopened more often. The **decision date** stops a
      pilot running for ever because nobody wants to call it.

      Set these before building. After a result arrives, it's tempting to pick the number
      that moved, and a team will always find one. Writing them first also forces a useful
      question: do we have the baseline? If nobody knows today's median handling time,
      measuring it is the first task.
  - title: Mapping and ranking assumptions
    body: |-
      Every feature rests on bets. They fall into a few kinds, and a list that covers each
      kind is a good start:

      - **Value**: will the change matter enough? Agents may already skim tickets fast.
      - **Usability**: will people understand and use it? They might not read the summary.
      - **Feasibility**: can the system do it with the data and budget you have? Accuracy
        on messy real tickets is the classic unknown.
      - **Viability**: can you afford and run it? Cost per ticket, who owns the prompt.
      - **Safety and compliance**: can it fail without harm? May you send ticket text to a
        model provider at all?

      Write each as a claim that could be false: "agents rate at least 45 of 50 summaries as
      accurate", not "summaries are useful". Score impact and uncertainty, and flag the ones
      you can't reverse. The ranking is a conversation tool, not science. Its job is to make
      the team say out loud why one unknown comes before another.

      Then design the cheapest test that could prove the top one wrong, with the threshold
      decided in advance. A test that can only confirm the idea, such as a demo to people who
      already like it, isn't a test.
  - title: Slices, stop rules and specs for agents
    body: |-
      A slice is small in users, data, time and features, never small by leaving out the
      risky part. Common false minimums: a screen on fake data, which skips feasibility; the
      happy path only, which skips the cases that cause most failures; a reusable platform,
      which builds machinery before one workflow has earned it.

      Order slices by consequence. A read-only replay on past tickets comes before a pilot
      with a few agents, which comes before a release. A suggestion a person approves comes
      before an automatic action. Each stage has a **stop rule**: what result means stop,
      narrow, or try a different approach.

      The spec then tells the builder what matters. For an agent this is critical, because an
      agent fills every gap with a guess and follows every detail literally.

      ```yaml
      invariants: [no card numbers in summaries, p95 latency under 3 s]
      locked: [summaries visible to agents only]
      bounded: [any approved model under 2p per ticket]
      delegated: [file and function names, prompt wording]
      examples: [normal ticket, angry customer, ticket in two languages]
      non_goals: [auto-replies, emailing customers]
      proof: [eval on 50 graded real tickets, pnpm check]
      ```

      Lock what is costly or public to change. Bound what has a safe range. Delegate what is
      cheap to reverse and checked by the proof.
pitfalls:
  - "**Treating the feature as the goal.** Shipping the panel becomes the finish line, and nobody checks that anything changed. Write the outcome and its metric first."
  - "**Choosing the metric after the results.** Some number always moved. Fix the metric, baseline, target and guardrail before building."
  - "**No guardrail metric.** A target met the cheap way, such as faster handling with more reopened tickets, looks like success. Pair every target with what mustn't get worse."
  - "**Testing the comfortable assumption first.** Building the UI feels like progress while the accuracy question waits. Rank by impact and uncertainty and test the top one."
  - "**A slice on fake data.** It proves the screen works, not that the model copes with real tickets. Use real, redacted data in the first slice."
  - "**A pilot with no stop rule.** Every result leads to \"keep going\". Decide in advance which result means stop or change course."
  - "**Over-specifying the spec.** Dictating every function name leaves no room for better ideas and hides the rules that matter. Lock the few risky decisions and delegate the rest."
interview:
  - question: A stakeholder asks you to add an AI feature. How do you decide what to build?
    answer: >-
      I start from the outcome, not the feature. I ask what should change and for whom, then
      agree a metric with a baseline, a target, a guardrail and a decision date before any
      code. Next I list the assumptions it rests on, such as accuracy on real data, whether
      people will use it, and whether we may send the data to a provider, and I rank them by
      impact and uncertainty. I test the riskiest first with the smallest slice that runs end
      to end on real data, often a read-only replay of past cases graded by the people who'd
      use it, with a stop rule. The trade-off is a slower visible start, which is cheap next
      to shipping something that changes nothing.
  - question: What's the difference between an output metric and an outcome metric? Give an example.
    answer: >-
      An output metric counts what we produced; an outcome metric measures the change it
      caused. For ticket summaries, "summaries generated per day" is output: it rises whether
      or not anyone is helped. "Median handling time" is an outcome: it moves only if agents
      actually work faster. I'd also pair it with a guardrail, such as the reopen rate, so
      nobody hits the target by closing tickets too early. Output metrics still help with
      operations, like cost and latency, but they can't tell you whether to keep the feature.
      The catch is that outcomes move slowly and have many causes, so I'd compare against a
      control group or a clear baseline.
  - question: How do you write a spec for a coding agent so it neither guesses nor follows you off a cliff?
    answer: >-
      I specify the edges and the proof, and leave reversible choices open. The spec states
      the outcome, invariants that must always hold, a few concrete examples including edge
      and forbidden cases, non-goals, and the evidence I'll accept, such as an eval set and
      the check command. Then I mark each decision: locked for anything public, costly or
      irreversible, bounded for choices with a safe range like a cost per request, and
      delegated for names and structure, which the agent chooses and explains. Examples do
      more than adjectives like "production-ready", which mean nothing to an agent. The risk
      is over-specifying, which copies my mistakes into the code, so I lock as little as I
      safely can.
  - question: What makes a good first slice or MVP for an AI feature?
    answer: >-
      It tests the riskiest assumption end to end on real data, with as little else as
      possible, and you can undo it. For AI features that's usually accuracy on real,
      messy inputs, so a strong first slice is running the model on a sample of past cases
      and having the people who'd use it grade the results, before anything reaches a user.
      It has a threshold and a stop rule set in advance. Weak slices remove the risk: a demo
      on sample data, a happy-path build, or a shared platform before one workflow works.
      The trade-off is that a replay can't measure behaviour, like whether people read the
      output, so the next slice is a small, reversible pilot.
terms:
  - term: Outcome
    say: The feature we deliver.
    means: >-
      The change in what people do or experience because of the feature, such as tickets
      resolved faster, measured against a baseline.
  - term: Success metric
    say: Whatever number we report after launch.
    means: >-
      A measure of the outcome with a baseline, a target and a decision date, set before
      building, and paired with a guardrail metric.
  - term: Guardrail metric
    say: A safety filter on the model.
    means: >-
      A metric that mustn't get worse while the target improves, such as the reopen rate
      while handling time falls. It catches a target met the cheap way.
  - term: Assumption map
    say: A list of risks.
    means: >-
      The bets a build rests on, written as claims that could be false and ranked by impact,
      uncertainty and reversibility, so the riskiest is tested first.
  - term: Smallest testable slice
    say: The MVP, with fewer features.
    means: >-
      The least you can build that runs end to end through the riskiest assumption on real
      data, with a threshold and a stop rule.
  - term: Locked, bounded, delegated
    say: How detailed the spec is.
    means: >-
      How much freedom each decision in a spec gives the builder: none without asking, a
      choice within limits, or the builder's own call.
