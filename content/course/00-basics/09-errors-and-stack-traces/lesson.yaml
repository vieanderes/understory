id: basics.debugging
title: Errors and stack traces
objective: Read an error message, picture the call stack, and follow a stack trace to the bug.
level: essential
minutes: 10
concepts: [basics.error-messages, basics.stack-trace]
prerequisites: [basics.objects]
opening:
  text: >-
    You'll learn to read an error and follow it back to the line that caused it. Once you can,
    an error stops being a wall and becomes a signpost.

steps:
  - type: prose
    id: anatomy-of-an-error
    body: |-
      When you run code, the computer carries it out one line at a time. Sometimes a line
      can't be done, like calling a list as if it were a function:

      ```js
      const tasks = ["Buy milk", "Call the dentist"];
      tasks();
      ```

      The program stops on that line and shows an **error message**. Here it reads:

      ```text
      Type error on line 2: tasks is not a function
      ```

      It tells you three things: the kind of error, the line, and what went wrong.

  - type: predict-output
    id: predict-program-stops
    concept: basics.error-messages
    difficulty: 1
    language: js
    code: |
      console.log("Start");
      const tasks = ["Buy milk", "Call the dentist"];
      tasks();
      console.log("End");
    question: Line 3 causes an error. What does the output show before the error message?
    choices:
      - text: '`Start` only'
        correct: true
        feedback: >-
          Yes. Line 1 ran, line 3 stopped everything, and line 4 never ran.
      - text: '`Start`, then `End`'
        feedback: >-
          Most people expect the bad line to be skipped. The program stops there instead, so
          line 4 never runs.
      - text: Nothing at all
        feedback: >-
          Code runs from the top. Line 1 had already finished when line 3 broke.

  - type: prose
    id: two-kinds-of-error
    body: >-
      Two kinds of error turn up more than any other.


      A **reference error** means a name doesn't exist. Usually it's a typo, like `taks` for
      `tasks`.


      A **type error** means the value exists, but it can't do what you asked. Calling a list
      is one. Reading a property of `undefined` is another.


      Outside this app, the kind is written as one word: `ReferenceError`, `TypeError`.

  - type: code-challenge
    id: write-fix-reference-error
    concept: basics.error-messages
    difficulty: 2
    language: js
    starter: typo.starter.js
    solution: typo.solution.js
    tests: typo.tests.js
    prompt: >-
      This should show how many tasks are on the list. Press Run tests and read the error: its
      kind, its line, and what went wrong.


      Then fix that line.
    hints:
      - A reference error means a name doesn't exist.
      - Compare the name on line 2 with the name on line 1, letter by letter.
      - The list is called `tasks`, with an s.

  - type: prose
    id: what-the-call-stack-is
    body: |-
      Errors often happen in a function that another function called. To follow one back,
      picture this. The computer keeps a pile of the functions still running, newest on top.
      That pile is the **call stack**.

      ```js
      function greet(name) {
        return "Hi, " + name;
      }
      function welcome() {
        console.log(greet("Sam"));
      }
      welcome();
      ```

      - Line 7 calls `welcome`. The pile: `welcome`.
      - Line 5 calls `greet`. The pile: `greet` on top of `welcome`.
      - `greet` returns, so it comes off. Then `welcome` finishes, and the pile is empty.
    figure:
      id: call-stack
      caption: Each call puts a frame on top. Each return takes the top one off.

  - type: trace-table
    id: trace-call-stack
    concept: basics.stack-trace
    difficulty: 2
    language: js
    code: |
      const tasks = [
        { title: "Buy milk", due: "Monday" },
        { title: "Call the dentist", due: "Friday" },
      ];
      function formatTask(task) {
        return task.title + " by " + task.due;
      }
      function lastTask(list) {
        const last = list[list.length];
        return formatTask(last);
      }
      function renderList() {
        console.log("Last: " + lastTask(tasks));
      }
      renderList();
    prompt: Build the pile. As each line starts, which function is on top, and how many are on the pile?
    columns: [on top, on the pile]
    rows:
      - line: 13
        values: [renderList, '1']
        given: true
      - line: 9
        values: [lastTask, '2']
      - line: 6
        values: [formatTask, '3']

  - type: prose
    id: reading-a-stack-trace
    body: |-
      Line 6 breaks. Outside this app, JavaScript prints the pile at that moment:

      ```text
      TypeError: Cannot read properties of undefined (reading 'title')
          at formatTask (todo.js:6:15)
          at lastTask (todo.js:10:10)
          at renderList (todo.js:13:26)
          at todo.js:15:1
      ```

      That's a **stack trace**: the call stack, top first. `6:15` means line 6, character 15.
      Read from the top. The top line is where it broke. Each line below called the one above.
      This app shows you the top line.

  - type: bug-hunt
    id: hunt-closing-act
    concept: basics.stack-trace
    difficulty: 3
    language: js
    code: |
      const tasks = [
        { title: "Buy milk", due: "Monday" },
        { title: "Call the dentist", due: "Friday" },
      ];
      function formatTask(task) {
        return task.title + " by " + task.due;
      }
      function lastTask(list) {
        const last = list[list.length];
        return formatTask(last);
      }
      function renderList() {
        console.log("Last: " + lastTask(tasks));
      }
      renderList();
    prompt: The trace blames line 6, where `task` is `undefined`. Follow it down. Tap the line that needs the fix.
    lines: [9]
    reasons:
      - text: '`list.length` is one past the last index'
        correct: true
        feedback: >-
          That's the one. `last` is `undefined`, and line 6 is where it finally breaks.
      - text: '`list` is `undefined` here'
        feedback: >-
          Then line 9 would break first, reading `length`, and the trace would start there.
      - text: '`formatTask` should check its input'
        feedback: >-
          That hides the problem. `formatTask` did its job. It was handed `undefined` by line
          10.
    fix: |
      function lastTask(list) {
        const last = list[list.length - 1];
        return formatTask(last);
      }

  - type: code-challenge
    id: write-fix-order-summary
    concept: basics.stack-trace
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      This should show `Ada ordered 2 things`. Run it first and read the error.


      The error names line 4, but line 4 is fine. Follow the bad value back to where it was
      made, and fix that line. Change as little as you can.
    hints:
      - Line 4 is inside `countItems`. Who called it, and what did they pass in?
      - '`list` is `undefined`. Compare what line 8 asks for with the names in `order`.'
      - The object has a property called `items`, with an s.

  - type: explain-back
    id: explain-top-frame
    concept: basics.stack-trace
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: |-
      ```js
      function formatTask(task) {
        return task.title + " by " + task.due;
      }
      function lastTask(list) {
        const last = list[list.length];
        return formatTask(last);
      }
      ```

      The trace blames `formatTask`, but the fix goes in `lastTask`. Why is the line that breaks often not the buggy one?
    rubric:
      - A bad value like `undefined` can be made and passed on without any error.
      - The error appears at the first line that uses the value.
      - The lines below the top of the trace are the callers, so you follow the value down to where it was made.
    modelAnswer: >-
      Reading past the end of a list gives `undefined` without complaint. `lastTask` passes it
      on, and `formatTask` is the first to read a property of it, so that's where it breaks.
      The top of the trace shows where the bad value was used. The lines below lead back to
      where it was made.

recap:
  - "Read an error: its kind, its line and what went wrong."
  - "Picture the call stack as a pile of running functions."
  - "Follow a stack trace down to where a bad value was made."
recall:
  - id: card-error-parts
    concept: basics.error-messages
    front: What three things does an error message tell you?
    back: >-
      The kind of error, the line it happened on, and what went wrong.
  - id: card-reference-vs-type
    concept: basics.error-messages
    front: How does a reference error differ from a type error?
    back: >-
      A reference error means a name doesn't exist, often a typo. A type error means the value
      exists but can't do what you asked, like calling a list.
  - id: card-call-stack
    concept: basics.stack-trace
    front: What is the call stack?
    back: >-
      The pile of functions still running, newest on top. A call adds one, and a return takes
      it off.
  - id: card-trace-order
    concept: basics.stack-trace
    front: The top line of a stack trace names a function. What do the lines below it tell you?
    back: >-
      Who called it. Each line called the one above, so you can follow a bad value down to
      where it was made.

