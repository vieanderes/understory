    verified: true

deepDive: >-
  Every output here was checked by running it. `&&` and `||` don't only give `true` or `false`. They hand
  back one of their two values: `a || b` gives `a` if it's truthy, otherwise `b`. That's why
  `name || "guest"` works as a default. They also stop early: in `a && b`, if `a` is falsy,
  `b` never runs.


  A `switch` compares with `===`, so `case 1` never matches the string `'1'`. Running on
  into the next case is sometimes used on purpose, to give two cases one body.


  `?.` also works on calls, `order.cancel?.()`, and on brackets, `rows?.[0]`. It stops the
  rest of the chain, so `a?.b.c` is safe when `a` is missing, but not when `b` is.


  Loops have one more form, `do { } while (test)`, which runs its body once before the first
  check. You'll rarely need it.
