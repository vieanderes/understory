term: trajectory
aka:
  - trajectory eval
  - agent trajectory
short: The full path of steps and tool calls an agent took to its result, graded separately.
explain: |
  An agent books the right meeting room. Success? Not if it first cancelled someone else's
  booking, or tried the payment tool on the way.

  So an agent eval grades two things. The outcome is the end state. The trajectory is the path. The right tools with the right arguments, in a sensible order, and
  nothing forbidden on the way.

  Don't demand one exact path. Several routes can be fine. Grade what matters: forbidden
  calls never happen, required checks always do, and the step count stays reasonable.
analogy: A driving test. Arriving at the right street isn't a pass if you ran two red lights.
usage: The outcome passes, but the trajectory shows it called delete before reading the record, so it fails.
related:
  - eval
  - pass-at-k
  - agent-loop
level: 3
