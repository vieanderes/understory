term: repository host
aka:
  - code host
  - Git host
  - Git hosting service
short: A website that keeps an online copy of a project's history and adds reviews and automation around it.
explain: |
  Your history lives on your laptop. Your teammates need it too, and a laptop can be lost.
  So the team keeps a shared copy on a server everyone can reach.

  The host stores that copy as a **remote**, usually called `origin`, and you sync with
  `push` and `pull`. On top it adds what the version control tool itself lacks: pull
  requests, review comments, issue tracking, CI runners and access control. You can
  switch hosts and keep every commit, because the history is the same everywhere.
analogy: A shared cloud folder for your save files. The game runs on your machine; the folder lets friends pick up where you left off.
example:
  language: bash
  code: |
    $ git remote -v
    origin  git@code.example:team/booking.git (fetch)
    origin  git@code.example:team/booking.git (push)
    $ git push -u origin add-search
usage: The repository host was down, but everyone still had the full history locally.
twin:
  term: git
  difference: A repository host is an online service built around shared copies of a project. Git is the version control program itself, and it works without any website at all.
related:
  - git
  - pull-request
  - continuous-integration
level: 2
lessons:
  - tooling.remotes
