    check: 'After an update, test that the original is unchanged as well as that the result is right.'
interview:
  - question: What's the difference between a shallow copy and a deep copy, and how do you make each?
    answer: >-
      A shallow copy creates a new outer object whose properties point at the same nested
      objects; a deep copy duplicates every level. Spread, `Object.assign`, `slice`, `concat`
      and `Array.from` are shallow, so after `const draft = { ...cart }`, changing
      `draft.owner` is safe but `draft.lines.push()` also changes `cart.lines`. For a deep copy
      I use `structuredClone`, which handles dates, maps, sets and cycles, but throws on
      functions and drops prototypes, so class instances come back as plain objects. The JSON
      round trip is a fallback with more losses: dates become strings and `undefined`
      disappears. In application state I usually want neither, and do an immutable update
      that copies only the path to the change.
  - question: Is JavaScript pass by value or pass by reference?
    answer: >-
      It's pass by value, where the value of an object variable is a reference, often called
      pass by sharing. So a function receives a copy of the pointer. If it mutates the
      object, `user.name = "Sam"`, the caller sees it, because both pointers lead to the same
      object. If it reassigns the parameter, `user = {}`, only the local copy moves, and the
      caller's variable is untouched. In real pass by reference, as with a C++ reference
      parameter, that reassignment would change the caller's variable too. The practical
      takeaway is that functions can mutate their inputs, so I treat parameters as read-only
      and return new values, which keeps data flow visible.
  - question: What are the limits of `structuredClone`?
    answer: >-
      It copies structured data but not behaviour. It supports primitives, plain objects,
      arrays, dates, regular expressions, maps, sets, array buffers, typed arrays and error
      objects, and it preserves cycles and shared references. It throws a `DataCloneError` for
      functions, symbols and DOM nodes, so one method anywhere in the object fails the whole
      call. It loses prototypes, so a class instance comes back as a plain object without
      methods, and it drops property descriptors: getters become plain values and
      non-enumerable properties disappear. It also costs time proportional to the whole
      structure. So I use it for data at boundaries, such as a form draft or a message
      to a worker, and give domain classes their own copy methods.
  - question: What's the difference between `const` and `Object.freeze`?
    answer: >-
      `const` makes the binding constant, while `Object.freeze` makes an object's own
      properties read-only. With `const cart = { items: [] }` I can't reassign `cart`, but
      `cart.items.push()` works. `Object.freeze(cart)` stops adding, removing or changing
      `cart`'s own properties, and in strict mode a write throws a `TypeError`, though in
      sloppy scripts it's silently ignored. Freeze is shallow: `cart.items` is still a mutable
      array unless I freeze it too, which is why test helpers often have a recursive
      `deepFreeze`. It also doesn't reach internal slots, so a frozen `Map` still accepts
      `set`. I use freeze to catch accidental mutations in tests and constants, not as a
      security boundary.
  - question: Why do React and Redux insist on immutable updates?
    answer: >-
      Because they detect change by reference, which is only correct if nobody mutates
      existing objects. React compares state with `Object.is` and skips the render when the
      reference is unchanged; `memo`, `useMemo` and effect dependencies compare the same
      way. If I push into the state array and set it again, it's the same array, so React
      sees no change and the screen goes stale. With an immutable update, I copy only the
      objects on the path to the change, so changed parts get new identities and unchanged
      parts keep theirs. That makes change detection O(1) per reference and enables undo
      and time travel. The costs are extra allocations and verbose nested spreads, which
      flat state or Immer reduces.
terms:
  - term: Pass by reference
    say: JavaScript passes objects by reference.
    means: It passes everything by value, and for an object that value is a reference. A function can
      mutate the caller's object but can't rebind the caller's variable.
  - term: Shallow copy
    say: A copy of the object.
    means: A new outer object that shares every nested object with the original. Spread,
      `Object.assign`, `slice` and `Array.from` all make one.
  - term: Deep copy
    say: "`JSON.parse(JSON.stringify(x))`."
    means: A copy of every level. `structuredClone` keeps dates, maps, sets and cycles, while the JSON
      round trip turns dates into strings and drops `undefined`.
  - term: Object equality
    say: Two objects with the same contents are equal.
    means: "`===` on objects compares identity: whether both names point at the same object. Compare
      contents through a key such as `id`."
  - term: "`const`"
    say: "`const` makes a value constant."
    means: "`const` stops the name being reassigned, not the object being changed. `Object.freeze` stops
      changes, but only one level deep."
  - term: Immutable update
    say: Deep-copy everything, then change it.
    means: Copy only the objects on the path to the change and reuse the rest, so unchanged parts keep
      their identity and cheap `===` checks still work.
