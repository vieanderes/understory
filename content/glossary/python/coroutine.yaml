term: coroutine
aka:
  - async def
short: A function call that can pause at each await and let other work run until it resumes.
explain: |
  A program that calls a model waits for seconds at a time. If it does nothing else while it
  waits, ten calls take ten times as long.

  Write `async def` and calling the function no longer runs it. You get a paused object
  instead. The event loop starts it, and at each `await` it steps aside so another one can
  run. One thread, many conversations in flight.

  The trap: forgetting `await`. Calling `fetch()` without it hands you an unstarted object. Python warns that it was never
  awaited, and the work never happens.
analogy: A chef with five pans. Each dish pauses while it simmers, and the chef tends another meanwhile.
example:
  language: python
  code: |
    import asyncio

    async def summarise(text: str) -> str:
        reply = await client.messages.create(...)
        return reply.content[0].text

    async def main(texts):
        return await asyncio.gather(*(summarise(t) for t in texts))
usage: That coroutine is created but never awaited, so the summary is never written.
twin:
  term: generator
  difference: A generator pauses at `yield` to hand a value to whoever is looping over it. A coroutine pauses at `await` to wait for work, and the event loop resumes it.
