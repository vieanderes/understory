term: denormalisation
aka: [denormalization, denormalised, denormalized, duplicated data]
short: Storing a copy of data in a second place on purpose, so a common read needs no join.
explain: |
  A normalised schema keeps each fact once. Reading it often needs joins. If one read is
  hot, you can store a copy where that read wants it: the author's name on each post, a
  count on the parent row.

  Every copy must now be kept in step. Decide who updates it, and what happens when the
  update fails halfway. That cost is why you normalise by default and copy on evidence.
analogy: Writing a friend's number in your diary as well as your phone. Quicker to find, but you have two to update.
usage: Store the comment count on the post as denormalisation, and update it in the same transaction.
twin:
  term: normalisation
  difference: Normalisation stores each fact once to keep it consistent. Denormalisation copies facts on purpose to make reads faster.
related: [normalisation, join, transaction, document-database]
level: 2
lessons: [sysdesign.sql-or-nosql]
