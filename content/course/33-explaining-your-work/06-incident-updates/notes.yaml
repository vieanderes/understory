summary: >-
  An incident update is the message everyone reads while something is broken. It has a fixed
  shape: the **impact** (who is affected, since when, and what still works), the **status**
  (investigating, identified, fixing, monitoring or resolved), **what you're doing** now,
  and **when the next update comes**, as a clock time with a time zone. The order matters,
  because most readers only want to know whether they're affected, and they stop reading
  once they do.


  Two habits keep updates trusted. **Blameless wording** describes what systems and
  processes did, not who slipped, so people keep raising problems early. And honest
  uncertainty marks a suspicion as a suspicion, so support and customers don't repeat a guess
  that you later have to correct in public.


  The update is not the investigation and not the review. It's a short, regular, truthful
  signal that buys the people fixing the problem quiet time to work. When the incident ends,
  a **follow-up summary** closes it: what happened, the impact, the cause as far as it's
  known, the fix and the actions. The full blameless review, covered in Alerts and on-call
  and in the security chapter's Incident response, comes after and is linked from it.
remember:
  - 'An incident update says four things in order: impact, status, what you''re doing, and the next update time.'
  - Lead with impact in the reader's terms, including what still works, because most readers stop once they know whether they're affected.
  - Give the next update as a clock time with a time zone, and send it on time even when nothing has changed.
  - Describe what systems and processes did, not who did it, so people keep reporting problems early.
  - Mark suspicions as suspicions; a guess stated as fact gets repeated and then corrected in public.
  - Offer a workaround when one exists, because it's the most useful line for the people affected.
  - Close the incident with a follow-up summary whose every claim matches a log, graph or message.
sections:
  - title: Status words that mean something
    body: |-
      A status word only helps if everyone reads it the same way. Many teams use a short,
      fixed ladder, often the one their status page offers:

      ```text
      investigating  we know something is wrong, not why
      identified     we know the cause, or are confident of it
      monitoring     a fix is in, and we're watching it hold
      resolved       it's over; a summary follows
      ```

      Each word promises something. "Identified" tells support they can stop collecting
      examples. "Monitoring" tells them not to close tickets yet. "Resolved" ends the cadence
      of updates. Moving to "identified" on a hunch, then back to "investigating", is the
      written form of a guess stated as fact.

      Keep the ladder in the update template, so nobody invents "looking into it" or "should
      be fine now" at 3 a.m. A template also makes a missing part visible: an update with no
      next update time looks unfinished, which is exactly what you want.

      The cadence depends on the severity. A total outage might get an update every 15 or 30
      minutes; a degraded feature, every hour. Whatever you choose, say it, and keep it.
      Readers forgive a slow fix far more easily than silence.
  - title: Writing about causes without blame
    body: |-
      Blameless doesn't mean vague. It means the subject of every sentence is a system, a
      change or a process, never a person.

      ```text
      blame:      Alex pushed a bad config and skipped review
      blameless:  a config change went out without review at 09:38
      blame:      the on-call engineer missed the alert
      blameless:  the alert fired into a channel nobody was watching
      ```

      The blameless versions carry more information, not less. "Went out without review"
      points at a gap anyone could fall through. "A channel nobody was watching" points at
      the real fix. "Alex" points at nothing you can change, and teaches everyone else to
      keep quiet about their own risky changes.

      The same goes for honest uncertainty. Three phrases do most of the work: "we suspect",
      "not confirmed yet" and "we've ruled out". The last is underrated: "we've ruled out the
      storage provider" saves support from repeating the rumour, and it's a fact you can
      stand behind.

      Watch for blame that hides in passive or loaded words: "human error", "should have",
      "carelessly", "failed to". Each one turns a description into a judgement. Rewrite the
      sentence with the system as the subject, and the judgement usually disappears.
  - title: The follow-up summary
    body: |-
      When the incident ends, one message closes it. It's short, and it's what people find
      later when they search the channel:

      ```yaml
      summary: from 09:40 to 10:55 UTC, about 1 in 3 episode uploads failed
      impact: 1,840 uploads failed; listening was not affected
      cause: a 09:38 storage change left one of three upload servers read-only
      fixed: rolled back at 10:52; uploads recovered by 10:55
      action: deploy checks will test write access on every upload server
      review: linked here by Friday
      ```

      Every claim needs a source you could point to: a graph for the times, a log query for
      the count, a message for the rollback. That matters more when an AI assistant drafts
      the summary from the channel, because a channel is full of questions and theories. "Is
      it the provider?" at 10:10 can turn into "the provider was also degraded" in a fluent
      draft. Ruled-out theories belong in the review, labelled as ruled out.

      The summary isn't the review. It doesn't dig into why the change could skip review or
      list every contributing factor; it says the review is coming and links to it. Keeping
      the two apart lets the summary go out within the hour, while the review takes the days
      it needs.
pitfalls:
  - '**Cause before impact.** Engineers want to explain; readers want to know if they''re affected. Put the impact first, and the cause only once it''s confirmed.'
  - '**Relative times.** "Next update in 30 minutes" means nothing to someone reading later or in another time zone. Write "10:35 UTC".'
  - '**Going quiet.** Skipping an update because nothing changed makes people assume the worst and start asking. Send "no change, still working on it" on time.'
  - '**Names in updates.** Naming who made the change feels like transparency and works as blame. Describe the change and the process gap instead.'
  - '**Unchecked summaries.** A fluent draft can promote a passing theory to a cause. Match every claim to a log, graph or message before sending.'
verify:
  - lens: confuses
    check: Read the first line alone and confirm an affected user can tell whether they're affected and what still works.
  - lens: tests
    check: Match every claim in the follow-up summary to a log query, graph or message, and remove any claim with no source.
  - lens: breaks
    check: Confirm each update gives the next update as a clock time with a time zone, and that someone owns sending it.
  - lens: leaks
    check: Strip hostnames, customer ids and exploit details from any update that goes to a public status page.
interview:
  - question: You're on call during an outage. How do you communicate with the rest of the company?
    answer: >-
      Regular, short, structured updates in one place. I'd post the first within minutes,
      even if all I know is the impact, and lead with who's affected and what still works.
      Then the status, what we're doing, a workaround if there is one, and the next update
      as a clock time. If the incident is big, I'd hand communication to someone else, so
      the people fixing it aren't interrupted. I'd keep every update blameless and mark
      suspicions as suspicions, because support repeats what we write. The trade-off is that
      early updates feel thin, but a thin update on time beats a thorough one an hour late.
  - question: What does "blameless" mean in incident communication, and why does it matter?
    answer: >-
      It means describing what systems and processes did rather than who made the mistake.
      "A config change went out without review", not "Alex skipped review". It matters for
      two reasons. First, it points at the fix: a process gap can be closed, a person can
      only be told to be careful. Second, it keeps information flowing. If people see names
      in the incident channel, they stop mentioning risky changes and near misses, and the
      next incident takes longer to find. Blameless isn't the same as no accountability:
      the actions still have owners and dates. It's accountability for fixing the system.
  - question: How do you handle uncertainty when you have to update people during an incident?
    answer: >-
      I separate what we know from what we suspect, in so many words. "Impact: 1 in 3
      uploads fail. Status: investigating. We suspect this morning's storage change and are
      rolling it back to test that." The suspicion is useful, so I share it, but labelled.
      I also say what we've ruled out, since that stops rumours. What I avoid is moving the
      status to "identified" on a hunch, because correcting a cause in public costs more
      trust than saying "not known yet". The trade-off is that honest updates can sound less
      confident, which is why the next update time and the actions carry the confidence
      instead.
