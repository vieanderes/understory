term: design system
short: A shared set of tokens, components, rules and guidance that keeps a product's interface consistent.
explain: |
  Ten teams building screens on their own get ten kinds of button. This gives everyone the
  same parts and the same rules: tokens for colour and spacing, components for buttons and
  fields, and guidance on when to use which.

  It's more than the code. It holds the decisions behind the parts: what the accent colour
  may mark, how errors read, what counts as accessible. The components are one
  part, and the agreement is the rest.
analogy: The rules of a board game plus the box of pieces. With only the pieces, everyone plays a different game.
usage: The date picker isn't in the design system yet, so build it from our tokens and propose it.
twin:
  term: component-library
  difference: A design system is the whole agreement, tokens, components, rules and the reasons behind them. A component library is only the code part, the buttons and fields you import.
related: [design-token, component-library, component-variant, wcag]
level: 2
lessons: [design.design-tokens, design.component-apis]
