summary: |-
  "Tell me about yourself" is the first question in almost every round, and it's the one you control completely. It isn't small talk. It sets the interviewer's first picture of your level and hands them the thread they'll pull on for the next forty minutes.

  The shape is now, before, next: what you do and are strongest at, how you got here with one proof that you deliver, and why this role is the obvious next step. Keep a one-minute version for technical rounds and a two-minute version for a hiring manager who asks you to walk through your CV.

  The same plain, specific, forward-looking style answers the other personal questions: why here, why you, your strengths and weakness, five years from now, a gap, a short stay, why you're leaving. These notes give no scripts. A memorised answer sounds memorised and breaks at the first follow-up. Instead, each question gets what the interviewer is really asking, how to build your answer from your own work, and what to avoid.
remember:
  - The introduction is now, before, next, in about a minute, and it ends on why this role so the interviewer has a natural first question.
  - One proof with a checkable result beats any list of technologies, because it's the only part the interviewer can write down as evidence.
  - Tailor the thread to the job posting, leading with the part of your past that matches their hardest problem.
  - Answer "why should we hire you?" by mapping their top three requirements to one proof each.
  - Answer a gap, a short stay or a switch plainly and without apology, give one thing you built or learnt, then steer back to the role.
  - Answer "why are you leaving?" with what you're moving towards, never with complaints about a past employer or manager.
  - Every claim on your CV invites a follow-up, so have the number, the reason for the tool and one honest regret ready for each.
  - Memorise the beats and the numbers, not the sentences, so the answer survives an interruption.
sections:
  - title: Building your introduction from the job posting
    body: |-
      Start from the posting, not your CV. Read it and underline the two or three problems the team clearly has. Phrases like "scale our retrieval pipeline", "own evals end to end" or "ship AI features to enterprise customers" are the real brief.

      Then write four lines of notes, not sentences:

      ```yaml
      now: role, area of strength, the kind of systems you build
      before: the path in one clause, chosen to match their problem
      proof: one result, with a number or a before and after
      next: their problem, in their words, and why you want it
      ```

      Pick the proof that matches their underlined problem. If they want evals, lead with evaluation work. If they want scale, lead with a latency or cost result.

      Check each line with two tests. Could a stranger verify it? "Cut tickets by a fifth" passes; "passionate about AI" fails. Would the interviewer want to ask about it? A good proof invites "how did you do that?", which is the question you most want, because you've prepared it.

      Finally, say it aloud with a timer. Most first drafts run to two and a half minutes. Cut the before part first: the path matters less than the proof.
  - title: The two-minute version, and walking through your CV
    body: |-
      A hiring manager often asks for more: "walk me through your CV". **What they're really asking** is how you made each move, and whether your recent work matches their level.

      Build the longer version from the same four lines, with three additions:

      - **A second proof**, from a different kind of work, so they see range. If the first proof is a technical result, make the second about people or scope.
      - **A reason for each move**, in forward terms: closer to the product, AI in production, more ownership.
      - **One arc** that ties it together, such as prototype to production, or backend to AI.

      Spend the time where the hiring decision is. Early roles get a sentence together ("several years of backend work across two companies"). The last two or three years get most of the two minutes. End on why this role, then offer to go deeper on any part.

      **Avoid** a chronological recital from your first job, which buries your strongest work at the end, when attention is lowest. And avoid reasons for a move that blame anyone.
  - title: One career, three emphases
    body: |-
      The facts stay the same. The emphasis moves to match the company. Three things change: the first clause, which proof leads, and the "next" line.

      - **An AI platform team** builds for other engineers. Lead with tooling others use, and prove it with adoption: how many teams rely on something you built. End on wanting to build what other teams ship on.
      - **A product company** ships AI to end users. Lead with features end to end, including the states users see when the model is slow or unsure. Prove it with a user outcome. End on their users.
      - **An early start-up** needs owners. Lead with taking something from prototype to production, including on-call and cost. Prove it with a result you owned alone. End on wanting a whole feature with little process around it.

      What doesn't change: every line is still checkable, and none criticises the current job.
  - title: Awkward facts, one pattern
    body: |-
      Gaps, layoffs, switches, short stays and closed start-ups all take the same three beats: the plain fact in a sentence, one concrete detail, then back to the role.

      - **A gap.** Name the reason at the level you're comfortable with ("caring for a parent", "a health matter"). Add what you did towards the end, such as a project they can look at. Say you're fully back.
      - **A layoff.** Say it was part of a wider cut, if it was. It isn't a verdict on you, so don't treat it as one. Add what you've done since.
      - **A career switch.** Give the moment you knew, in a clause, then the concrete steps you took. Name one skill from the old field that helps here.
      - **A start-up that closed.** State it, then what you learnt about shipping with little money and a small team.

      None of these needs an apology or a long explanation. Each should hand the interviewer something positive to ask about next.
  - title: Where do you see yourself in five years?
    body: |-
      **What they're really asking:** will you stay long enough to be worth hiring, does this role lead where you want to go, and have you thought about your growth at all?

      **How to answer:** talk about a direction, not a title. Name the kind of work you want to be trusted with, such as owning how AI features are evaluated, or leading a small team's technical decisions. Say which part of that you already enjoy, with one sentence of evidence. Then connect it to this role: what you'd learn here that gets you there. Staying close to building is a fine thing to say.

      **Avoid:**

      - A title race, such as "your job" or "head of engineering by then". It sounds like you'll leave when the title doesn't come.
      - Plans that point away from the role: your own company, a different field, "no idea". If you don't know, give the direction you're leaning and why.
  - title: Follow-ups your CV invites
    body: |-
      An interviewer reads your CV looking for the line to pull on. Every claim is a question waiting to happen. Go through your CV line by line and prepare a one-line answer for each type:

      - **The number.** "Faster processing", "better quality", "saved time": how much? Have the figure, or an honest before and after, and know where it came from.
      - **The why-this-tool.** Every framework or service you name invites "why that, and not something simpler?" Give the problem it solved that the simpler option didn't.
      - **How you knew it worked.** For AI work, expect "how did you evaluate it?" and "how did you check the judge?" Know your test set, your metric and how you checked it against people.
      - **The one regret.** "What would you do differently?" Have one honest technical regret and what it taught you. "Nothing" signals no reflection.
      - **Explain it plainly.** A thesis, a research project or a niche domain: have a two-sentence version a non-expert would follow.

      Then remove or soften any line you can't defend for five minutes. **Avoid** inflated numbers and tools you only touched once: a follow-up finds them in a single question.
pitfalls:
  - >-
    **Reciting the CV in order.** Starting at university spends the minute on the least
    relevant part. Start with now, compress the before, and give one proof.
  - >-
    **Listing technologies.** A string of framework names is unmemorable and uncheckable. One
    result with a number does more.
  - >-
    **"I'm passionate about AI."** Everyone says it, so it carries no information. Show it
    through the proof and the reason you want this particular role.
  - >-
    **Criticising a past employer.** It makes the interviewer picture you describing them
    the same way. Talk about what you're moving towards.
  - >-
    **Apologising for a gap or a switch.** Framing it as a weakness invites doubt the facts
    don't justify. State it, give one thing you did, move on.
  - >-
    **Using the same version for every company.** A generic ending ("I'm looking for a new
    challenge") wastes the most useful sentence. End on their problem, in their words.
  - >-
    **Learning a script word for word.** It sounds flat, and one interruption derails it.
    Learn the beats and the numbers, then say it differently each time you practise.
interview:
  - question: Tell me about yourself.
    answer: |-
      **What they're really asking:** what's your level, what are you strongest at, and does your path lead to this role? They also want a thread to follow for the rest of the round.

      **How to answer:** now, before, next, in about a minute. Open with your current role and strongest area. Compress the path into a clause, chosen to match their posting. Give one proof with a result someone could check. End on their problem and why you want it, which hands them a first question you've prepared for.

      **Avoid:** a life story from school onwards, and a list of tools. Neither gives them anything to write down.
  - question: Why do you want to work here?
    answer: |-
      **What they're really asking:** have you done your homework, and will you still want this job in a year?

      **How to answer:** give three specifics. First, what they build and why it matters to you, in a sentence. Second, something you found that matches how you work: an engineering blog post, a product decision, how they use AI. Third, the part of the role that fits your direction, tied to one thing you've done. If you can't name something specific, research more before the interview.

      **Avoid:** anything that could be said about any company, such as "great culture" or "an exciting space", and reasons that are only about pay or perks.
  - question: Why should we hire you?
    answer: |-
      **What they're really asking:** can you connect your experience to their needs, or do they have to do that work for you?

      **How to answer:** take the top three requirements from the job posting, in their words. Map each one to one proof: something you did, with a result. Three short beats, then one line on what you'd bring beyond the list, such as teaching others or owning a system in production. A proof sounds like "led the move of an eval set into CI", not "I'm good at evals".

      **Avoid:** claims without proof ("hard-working, quick learner"), and comparing yourself with other candidates you've never met.
  - question: What are your strengths?
    answer: |-
      **What they're really asking:** do you know what you're good at, and is it what this role needs?

      **How to answer:** pick two strengths the posting asks for, not your whole list. For each, name it in a few words, then give one piece of evidence: a system you owned, a result you measured, a person you helped. Evidence turns a strength from an opinion into a fact. If they ask for strengths and weaknesses together, keep the strengths short, then give the weakness the care the next answer describes.

      **Avoid:** adjectives with no proof ("creative, detail-oriented"), and strengths the role doesn't use.
  - question: What's your biggest weakness?
    answer: |-
      **What they're really asking:** are you self-aware, and do you fix things about yourself on purpose?

      **How to answer:** name a real weakness that matters at work but isn't the core of this role. Say how you noticed it, in a sentence. Then spend most of the answer on what you do about it, with evidence that it's improving. A common honest shape: a habit, such as going deep before sharing, and the small routine that now counters it.

      **Avoid:**

      - Disguised strengths, like "I work too hard". Interviewers hear them as evasion.
      - A weakness in the main skill of the job, such as "I don't enjoy testing" for an evals role.
  - question: Why are you leaving your current job?
    answer: |-
      **What they're really asking:** are you running from a problem that will follow you here, and will you leave them the same way?

      **How to answer:** one or two sentences about what you're moving towards: more scale, a product you believe in, a harder class of problem, a stronger team. Tie it to this role. If there's a harder truth, such as a reorganisation or a clash, give the neutral, true version: the role moved away from the work you want.

      **Avoid:** criticising your employer or manager, and lying. References and follow-ups can expose a lie, but you don't have to volunteer every detail.
  - question: Your last role was quite short. Why?
    answer: |-
      **What they're really asking:** will you leave us after a few months too?

      **How to answer:** the plain reason in a sentence, from a fact rather than a feeling: the role changed after a reorganisation, the funding ended, the work wasn't what was advertised. Add what you did well while there, such as handing over properly. Then say what you're looking for now, and why this role gives it, so they hear a reason to stay. If you have more than one short stay, name the pattern yourself and what you've changed in how you choose roles.

      **Avoid:** blaming people, and a long story. The longer the answer, the bigger the problem sounds.
  - question: I see a gap of about a year on your CV. What happened?
    answer: |-
      **What they're really asking:** is there a reason to worry, and are you ready to work now?

      **How to answer:** the fact in a sentence, at the level of detail you're comfortable with. Then one thing you did, such as a project they can look at or a course you finished. Then say you're fully back and steer to the role. A gap isn't a failure, and a concrete project gives them something positive to ask about.

      **Avoid:** apologising, which frames the gap as a weakness, and vagueness ("time for things"), which invites more questions.
terms:
  - term: Tell me about yourself
    say: Your life story, from the start.
    means: "About a minute in the order now, before, next: what you do and are strongest at, one
      proof that you deliver, and why this role is the next step. It ends where the
      interviewer can pick up a thread."
  - term: Proof point
    say: A list of the technologies you know.
    means: One piece of work with a result someone could check, such as a number or a before and
      after. It is the part the interviewer can write down as evidence.
  - term: Why here
    say: "\"It's a great company with a great culture.\""
    means: "Specifics that could only be said about this team: their problem, how your past work
      fits it, and why it is your next step. A reason that fits any company reads as no
      research."
  - term: Weakness
    say: A strength in disguise, like perfectionism.
    means: A real gap that matters to the work, what you are doing about it and a sign it is
      improving. A disguised strength reads as evasive.
  - term: Career gap
    say: Something to hide or apologise for.
    means: A fact to state plainly in a sentence, followed by one thing you built or learnt in
      that time, then a turn back to the role.
