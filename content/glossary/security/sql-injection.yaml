term: SQL injection
aka:
  - SQLi
short: An attack where user input is pasted into a database query and changes what the query does.
explain: |
  Build a query by gluing strings together, and the input becomes code. Type `' OR '1'='1`
  into a login box and a careless query returns every user.

  The fix isn't escaping by hand. It's a **parameterised query**: the SQL and the values
  travel separately, so a value can never become code. ORMs do this for you, until someone
  reaches for a raw query built with a template string.
analogy: A cheque with a blank after "Pay". Someone writes "ten pounds, and also empty the safe", and the cashier does both.
example:
  language: js
  code: |
    // Input becomes part of the SQL
    db.query(`SELECT * FROM users WHERE email = '${email}'`);

    // Input stays a value
    db.query('SELECT * FROM users WHERE email = $1', [email]);
usage: The sort column goes from the URL into a template string, so that's SQL injection, login or not.
twin:
  term: prompt-injection
  difference: SQL injection has a cure, because parameters keep data and code apart. Prompt injection has none, because a model reads instructions and data as one stream of text.
related:
  - xss
  - ssrf
  - prompt-injection
  - orm
level: 1
lessons:
