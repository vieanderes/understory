id: css.positioning
title: Positioning and z-index
objective: "Pin a badge to a card, stick a header to the top, and explain why a `z-index` does nothing."
level: essential
minutes: 10
concepts: [css.positioning, css.containing-block, css.stacking-context]
prerequisites: [css.grid]
opening:
  text: >-
    You'll pin a badge to the corner of a card and keep a header in view as the page scrolls.
    You'll also know why `z-index: 9999` sometimes loses, so you stop guessing bigger numbers.

steps:
  - type: prose
    id: what-position-does
    body: |-
      Normal flow places every box for you. The `position` property lets you move one:

      - `static`: the default, in the flow
      - `relative`: nudged from its own spot, which it keeps
      - `absolute`: lifted out of the flow and placed with `top`, `right`, `bottom`, `left`
      - `fixed`: pinned to the browser window
      - `sticky`: scrolls with the page, then sticks at an edge

  - type: playground
    id: pin-the-badge
    concept: css.containing-block
    difficulty: 2
    prompt: >-
      Give `.badge` `position: absolute; top: 8px; right: 8px;` and watch it fly to the
      page's corner. Then give `.card` `position: relative;` and watch it land on the card.
    html: |
      <div class="card">
        <div class="photo"></div>
        <h3>Canvas backpack</h3>
        <p>£45</p>
        <span class="badge">New</span>
      </div>
    css: |
      body { font-family: sans-serif; }
      .card {
        width: 200px;
        margin: 48px auto 0;
        padding: 12px;
        border: 1px solid lightgrey;
      }
      .photo { height: 120px; background: wheat; }
      .badge { padding: 4px 8px; background: crimson; color: white; }
    editable: [css]
    checks:
      - label: The badge is absolutely positioned
        selector: .badge
        style: { property: position, value: absolute }
      - label: It sits 8px from the top
        selector: .badge
        style: { property: top, value: 8px }
      - label: The card is its anchor
        selector: .card
        style: { property: position, value: relative }
    solution:
      css: |
        body { font-family: sans-serif; }
        .card {
          position: relative;
          width: 200px;
          margin: 48px auto 0;
          padding: 12px;
          border: 1px solid lightgrey;
        }
        .photo { height: 120px; background: wheat; }
        .badge {
          position: absolute; top: 8px; right: 8px;
          padding: 4px 8px; background: crimson; color: white;
        }
    hints:
      - The three badge declarations go in `.badge`.
      - The badge measures from the nearest positioned ancestor, and there isn't one yet.
      - 'Add `position: relative;` to `.card`.'

  - type: prose
    id: containing-block-rules
    body: >-
      Why did the badge fly off? An absolute box measures `top` and `right` from its
      **containing block**: the nearest ancestor with a `position` other than `static`. With
      none, it measures from the page.


      That's why `position: relative` with no offsets is so common. It doesn't move the card
      at all. It makes the card the anchor.

  - type: predict-output
    id: predict-relative-keeps-space
    concept: css.positioning
    difficulty: 2
    language: html
    code: |
      <style>
        .note { position: relative; top: 20px; }
      </style>
      <p class="note">Shop closes early today.</p>
      <p>Open as usual tomorrow.</p>
    question: The note moves 20px down. What happens to the paragraph below it?
    choices:
      - text: It stays where it was
        correct: true
        feedback: >-
          Yes. A relative box keeps its old space, so nothing around it moves.
      - text: It moves down 20px too
        feedback: >-
          That's what a bigger margin would do. `relative` moves only the box, not its space.
      - text: It moves up into the gap
        feedback: >-
          There's no gap to fill. The note still holds its old place in the flow.

  - type: playground
    id: stick-the-header
    concept: css.positioning
    difficulty: 2
    prompt: >-
      Scroll the page: the header scrolls away. Give `header` `position: sticky;` and `top:
      0;`, then scroll again and watch it stay.
    html: |
      <header>Evening news</header>
      <p>The river path reopens on Monday after repairs.</p>
      <p>A new bakery opens on Mill Street this weekend.</p>
      <p>Library hours change for the summer holidays.</p>
      <p>The swimming pool adds an early morning session.</p>
      <p>Road works on the high street end on Friday.</p>
      <p>The allotments hold their open day next month.</p>
      <p>A lost cat named Pepper has found her way home.</p>
      <p>Tickets for the school play go on sale soon.</p>
    css: |
      body { margin: 0; font-family: sans-serif; }
      header {
        padding: 16px;
        background: navy;
        color: white;
      }
      p { margin: 0; padding: 24px 16px; border-bottom: 1px solid lightgrey; }
    editable: [css]
    checks:
      - label: The header is sticky
        selector: header
        style: { property: position, value: sticky }
      - label: It sticks at the very top
        selector: header
        style: { property: top, value: 0px }
    solution:
      css: |
        body { margin: 0; font-family: sans-serif; }
        header {
          position: sticky;
          top: 0;
          padding: 16px;
          background: navy;
          color: white;
        }
        p { margin: 0; padding: 24px 16px; border-bottom: 1px solid lightgrey; }
    hints:
      - Both declarations go in the `header` rule.
      - '`sticky` needs an edge to stick to, set with `top`.'
      - 'Add `position: sticky;` and `top: 0;`.'

  - type: prose
    id: what-a-stacking-context-is
    body: >-
      When positioned boxes overlap, `z-index` picks which is on top: the higher number wins.
      But only inside a group.


      A **stacking context** is a group of boxes painted as one layer. A positioned box with a
      `z-index` forms one, and so do `opacity` below 1 and a `transform`. From outside, the
      whole group has one level, whatever the numbers inside it.

  - type: predict-output
    id: predict-tooltip-under-header
    concept: css.stacking-context
    difficulty: 3
    language: html
    code: |
      <style>
        .header { position: sticky; top: 0; z-index: 10;
                  height: 60px; background: navy; }
        .gallery { position: relative; z-index: 1;
                   margin-top: 20px; height: 200px; }
        .tooltip { position: absolute; z-index: 9999; top: -50px;
                   width: 100px; height: 60px; background: gold; }
      </style>
      <header class="header"></header>
      <div class="gallery">
        <div class="tooltip"></div>
      </div>
    question: The gold tooltip reaches up into the navy header. Which one is on top?
    choices:
      - text: The header
        correct: true
        feedback: >-
          Right. The tooltip's 9999 only counts inside the gallery, which is at level 1.
      - text: The tooltip, because 9999 beats 10
        feedback: >-
          Most people expect that. But the browser never compares 9999 with 10. They're in
          different groups.
      - text: The tooltip, because it comes later
        feedback: >-
          Document order only breaks ties. Here the levels are 10 and 1, so there's no tie.

  - type: playground
    id: free-the-tooltip
    concept: css.stacking-context
    difficulty: 3
    prompt: >-
      Here's that page. The tooltip hides under the header, whatever its `z-index`. Delete
      `z-index: 1` from `.gallery` so the tooltip joins the header's group, and watch it come
      out on top.
    html: |
      <header class="header">Gallery</header>
      <div class="gallery">
        <div class="tooltip">Click a photo to enlarge it</div>
      </div>
    css: |
      body { margin: 0; font-family: sans-serif; }
      .header {
        position: sticky; top: 0; z-index: 10;
        height: 60px; padding: 0 16px; background: navy; color: white;
      }
      .gallery {
        position: relative; z-index: 1;
        margin-top: 20px; height: 200px; background: wheat;
      }
      .tooltip {
        position: absolute; z-index: 9999; top: -50px; left: 120px;
        width: 140px; padding: 8px; background: gold;
      }
    editable: [css]
    checks:
      - label: The gallery no longer forms its own group
        selector: .gallery
        style: { property: z-index, value: auto }
    solution:
      css: |
        body { margin: 0; font-family: sans-serif; }
        .header {
          position: sticky; top: 0; z-index: 10;
          height: 60px; padding: 0 16px; background: navy; color: white;
        }
        .gallery {
          position: relative;
          margin-top: 20px; height: 200px; background: wheat;
        }
        .tooltip {
          position: absolute; z-index: 9999; top: -50px; left: 120px;
          width: 140px; padding: 8px; background: gold;
        }
    hints:
      - The fix is on the tooltip's ancestor, not on the tooltip.
      - A relative box forms a group only when it has a `z-index`.
      - 'Delete `z-index: 1;` from the `.gallery` rule.'

  - type: explain-back
    id: explain-z-index-does-nothing
    concept: css.stacking-context
    difficulty: 3
    prompt: >-
      Why can't `z-index: 9999` lift a tooltip above a header with `z-index: 10`, and what would
      work?
    rubric:
      - '`z-index` is only compared between boxes in the same stacking context.'
      - The gallery forms a stacking context, so the tooltip is trapped inside its level.
      - The fix is on the ancestor, or moving the tooltip out of it.
    modelAnswer: >-
      The gallery forms a stacking context, so the tooltip's 9999 only orders it among the
      gallery's children. From outside, the whole gallery sits at one level, below the header's
      10. So the fix is on the ancestor: remove what forms the context, raise the gallery, or
      move the tooltip out.

recap:
  - Nudge, place, pin or stick a box with `position`.
  - 'Anchor an absolute box with `position: relative` on its parent.'
  - Explain why a huge `z-index` can still lose, and fix it on the ancestor.

recall:
  - id: card-absolute-containing-block
    concept: css.containing-block
    front: What does an `absolute` box measure `top` and `right` from?
    back: >-
      Its containing block: the nearest ancestor that isn't `position: static`. Without one,
      the page itself.
  - id: card-relative-keeps-space
    concept: css.positioning
    front: 'A box gets `position: relative; top: 20px`. What happens to the boxes around it?'
    back: >-
      Nothing. It moves 20px down but keeps its old space, so it may overlap its neighbours.
  - id: card-sticky-header
    concept: css.positioning
    front: Which two declarations keep a header at the top while the page scrolls?
    back: >-
      `position: sticky` and `top: 0`.
  - id: card-context-creators
    concept: css.stacking-context
    front: Name three things that make a box form a stacking context.
    back: >-
      A positioned box with a `z-index`, `opacity` below 1, and a `transform`. `fixed` and
      `sticky` boxes form one too.

references:
  - kind: spec
    title: CSS Positioned Layout Module Level 3
    authors: Elika J. Etemad, Tab Atkins Jr.
    venue: W3C
    url: https://www.w3.org/TR/css-position-3/
    note: The `position` values and each one's containing block.
    primary: true
    verified: true
  - kind: docs
    title: Positioning
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Positioning
    note: Relative, absolute, fixed and sticky, each with an editable example.
    verified: true
  - kind: docs
    title: Stacking context
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Positioned_layout/Stacking_context
    note: The full list of properties that form a stacking context.
    verified: true

deepDive: >-
  A `transform` or `filter` on an ancestor changes the containing block of `fixed` boxes too.
  A modal with `position: fixed` inside a transformed drawer scrolls away with the drawer
  instead of staying on screen. Even `transform: translateX(0)` does it, because the browser
  only checks that the value isn't `none`.


  Percentages on an absolute box are measured against the padding box of its containing
  block, while a box in the flow measures against its parent's content box.


  `isolation: isolate` forms a stacking context and does nothing else, which makes it the
  cleanest way to start a group on purpose.


  Dialogs opened with `showModal()` and elements with the `popover` attribute go to the top
  layer. It paints above every stacking context, with no `z-index` needed.
