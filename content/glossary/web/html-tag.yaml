term: tag
aka: [HTML tag, start tag, end tag, closing tag]
short: The marker in angle brackets, like `<p>` or `</p>`, that opens or closes a piece of a page.
explain: |
  HTML is plain text with markers in angle brackets. `<h1>` says "a main heading starts
  here", and `</h1>`, with a slash, says "it ends here". The text between them is shown.

  People often say "tag" when they mean the whole element, and in casual talk that's fine.
  When you debug nesting, the difference matters. Tags must close in the reverse order they
  opened.
analogy: Quotation marks in writing. One opens, one closes, and what sits between them is the quote.
example:
  language: html
  code: |
    <h1>Pancakes</h1>
    <!-- start tag <h1>, end tag </h1> -->
    <p>Mix, <em>rest</em>, then fry.</p>
usage: That list item is missing its end tag, so the browser guessed where it stops.
twin:
  term: html-element
  difference: A tag is only the marker you type. The element is the finished piece, the opening tag, the closing tag and everything between them.
related: [html-element, html-attribute]
level: 1
lessons: [html.first-page]
