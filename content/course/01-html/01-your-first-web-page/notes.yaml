summary: >-
  A web page starts life as a plain text file. **HTML**, short for HyperText Markup Language,
  is the set of tags you wrap around that text to say what each part is: this is the main
  heading, this is a paragraph, these words matter. The **browser**, the app you read websites
  in, reads those tags and draws each part to match.


  The key idea is that a tag names meaning, not looks. `h1` means "the title of this page",
  whatever size it's drawn at. That meaning is used by more than your eyes. Screen readers,
  apps that read a page aloud, let people jump from heading to heading. Search engines use
  headings to work out what a page is about. How things look is a separate job, done
  later with CSS, the styling language.


  Browsers are also forgiving. They never refuse a page. If you forget an end tag or nest
  tags the wrong way round, the browser guesses what you meant and carries on, with no error
  message anywhere. That makes HTML friendly to start with, and it's why checking what the
  browser really built becomes a habit you'll learn in the DOM lesson.
remember:
  - An element is a start tag, its content and an end tag, and the tag says what the content is, not how it looks.
  - The browser treats a line break or a run of spaces in your text as one space, so a new line on screen needs a new element.
  - Elements nest like boxes in boxes, so the inner element always closes before the outer one.
  - A whole page is `html` holding `head`, for facts about the page, and `body`, for everything you see.
  - 'Browsers never reject HTML: they repair mistakes silently, so a broken page shows no error.'
  - '`<!doctype html>` on the first line switches the browser to standards mode; without it, the page is laid out in quirks mode.'
  - Choose a heading level by its place in the outline, `h1` for the page title and `h2` for its sections, never by the size you want.
  - To show a `<` or `&` as text, write `&lt;` or `&amp;`, because the browser reads a bare `<` as the start of a tag.
sections:
  - title: What the browser does with your file
    body: |-
      When you open a page, the browser receives your file as plain text. It doesn't draw that
      text straight away. First, a part of the browser called the **parser** reads the file
      from top to bottom. A parser is a program that reads text and works out its structure,
      the way you read a sentence and spot its subject and verb.

      The parser spots each start tag, its content and its end tag, and keeps track of what
      sits inside what. From that it builds a model of the page in memory. Only then does the
      browser draw the screen, from that model rather than from your file. You'll meet the
      model by name, the DOM, two lessons from now.

      A few things follow from this.

      - **Tag names ignore case.** The parser turns `<P>` and `<p>` into the same paragraph.
        Everyone writes lower case, so do the same.
      - **Order matters.** The parser reads top to bottom, so a heading written first is
        drawn first.
      - **The file and the page can differ.** The parser adds and repairs things as it goes,
        so the page can hold elements your file never mentions.

      You can see both sides in any browser. Right-click a page and choose "View page source"
      to see the file exactly as it arrived. What's drawn on screen comes from the model. For
      your own pages today, the two look the same. They drift apart as soon as the parser
      repairs a mistake, which is the next section.
  - title: What the browser repairs, and what it can't
    body: |-
      Browsers follow the same written repair rules, from the HTML Living Standard, the
      document that defines HTML. So every modern browser fixes the same mistake the same way.
      Here are four repairs, checked in Chrome. Each pair shows what you write, then what the
      browser builds. A line between `<!--` and `-->` is a **comment**, a note the browser
      ignores.

      ```html
      <!-- 1. You leave out the skeleton -->
      <title>Pancakes</title><h1>Pancakes</h1>
      <!-- The browser builds -->
      <html><head><title>Pancakes</title></head><body><h1>Pancakes</h1></body></html>

      <!-- 2. You forget to close a paragraph -->
      <p>Mix the flour<p>Add the eggs
      <!-- The browser builds -->
      <p>Mix the flour</p><p>Add the eggs</p>

      <!-- 3. You close tags in the wrong order -->
      <p><strong><em>Hot</strong> pan</em></p>
      <!-- The browser builds -->
      <p><strong><em>Hot</em></strong><em> pan</em></p>
      ```

      Those repairs happen to match what you meant. The fourth doesn't:

      ```html
      <!-- 4. You forget to close the main heading -->
      <h1>Pancakes<p>Fluffy and quick.</p><h2>Ingredients</h2>
      <!-- The browser builds -->
      <h1>Pancakes<p>Fluffy and quick.</p></h1><h2>Ingredients</h2>
      ```

      The paragraph ended up inside the heading. A screen reader now announces one long
      heading, "Pancakes Fluffy and quick.", and the page may look fine to you. That's the
      lesson in one example: **the browser repairs the syntax, not your intent.** It always
      produces a page, but not always the page you meant. Close every element you open, and
      when a page behaves oddly, suspect a missing end tag first.
  - title: Spaces, line breaks and characters that look like tags
    body: |-
      In most text, the browser shrinks every run of spaces, tabs and line breaks down to a
      single space. This is called **whitespace collapsing**. It's why your three-line
      shopping list came out on one line.

      ```html
      <p>Eggs
         Flour      Milk</p>
      ```

      On screen, that reads "Eggs Flour Milk". Your spacing is still in the file, and the
      browser keeps it in its model, but it doesn't draw it. So you never lay out text with
      spaces or blank lines. You mark up the structure instead: separate paragraphs, or a
      list, which is the next lesson.

      The second surprise is the `<` character. The parser treats `<` followed by a letter as
      the start of a tag. A space after it is safe, so `5 < 6` shows as written. But look what
      Chrome builds from this line:

      ```html
      <p>Use a<b to compare</p>
      ```

      ```text
      A paragraph that says "Use a", then an unknown b element.
      "to" and "compare</p" are swallowed into its start tag,
      so the words vanish from the screen.
      ```

      The fix is a **character reference**, a short code that stands for one character. The
      two you'll need most:

      ```html
      <p>Write &lt;p&gt; to start a paragraph.</p>
      <p>Fish &amp; chips</p>
      ```

      These show as "Write `<p>` to start a paragraph." and "Fish & chips". `&lt;` means
      "less than", `&gt;` "greater than" and `&amp;` is the ampersand itself.
  - title: Headings are the outline of the page
    body: |-
      Think of the headings as a table of contents that the browser can hand to anyone who
      asks. `h1` is the title of the page. Each `h2` starts a main section. An `h3` is a part
      of the `h2` above it, and so on down to `h6`.

      ```html
      <h1>Pancakes</h1>
      <h2>Ingredients</h2>
      <h2>Method</h2>
      <h3>Making the batter</h3>
      <h3>Cooking</h3>
      <h2>Serving ideas</h2>
      ```

      Why does the level matter if you can change the size later with CSS? Because the level
      is information. Screen reader users often pull up a list of headings. Then they jump
      straight to the part they need, the way you'd scan a page with your eyes. If "Cooking"
      were an `h2`, it would look like a separate section rather than a step of the method.
      If it were bold text in a `p`, it wouldn't be in the list at all.

      The Web Content Accessibility Guidelines (WCAG) 2.2, the standard most laws point to,
      cover this. Success criterion 1.3.1, Info and Relationships, level A, says structure you
      can see must also be in the markup. A heading that's only big bold text fails it.

      Two habits keep the outline clean. Use one `h1` per page, naming what the page is about.
      It isn't a hard rule of HTML, but it's what users and tools expect. And don't skip levels
      on the way down: an `h4` straight under an `h2` suggests a missing section.
pitfalls:
  - '**Choosing a heading for its size.** People reach for `h3` because `h2` looks too big. The level is structure, and a screen reader announces it. Pick the level by position, and change the size with CSS later.'
  - '**Pressing Enter to start a new line.** In the editor it looks like a new line, but the browser collapses it into a space. Put each line in its own element, such as a `p` or a list item.'
  - '**Leaving an element open.** A missing `</h1>` or `</strong>` produces no error, and the browser may stretch the element over everything after it. Close every element you open, inner ones first.'
  - '**Putting visible content in `head`.** `head` is for facts about the page, like the `title`. Anything you want people to see belongs in `body`.'
  - '**Typing a bare `<` in text.** `a<b` starts a tag, and the words after it disappear. Write `&lt;` instead, and `&amp;` for `&`.'
  - '**Forgetting the doctype.** The page still shows, but in quirks mode, where layout copies old browser bugs. Start every file with `<!doctype html>`.'
interview:
  - question: What's the difference between a tag and an element?
    answer: >-
      A tag is the marker you type, and an element is the whole piece of the page it creates.
      In `<p>Serves four</p>`, `<p>` is the start tag, `</p>` is the end tag, and together
      with the content they make one paragraph element. The distinction matters because the
      browser works with elements, not tags. It can create elements you never tagged, like
      `head` and `body`, and close elements whose end tag you forgot. Some elements, such as
      `img` and `br`, have only a start tag, because they hold no content. So when you talk
      about the page, as in "the second paragraph is too long", you mean elements. When you
      talk about the file you typed, you mean tags.
  - question: What happens when an HTML file has a mistake, like a missing end tag?
    answer: >-
      The browser repairs it silently and builds a page anyway, with no error. The HTML Living
      Standard defines exact repair rules, so every modern browser makes the same repair. A
      paragraph left open is closed when the next paragraph starts. Missing `html`, `head` and
      `body` elements are added. Tags closed in the wrong order are rearranged. The catch is
      that the repair follows rules, not your intent. An `h1` left open can swallow the
      paragraph after it, so a screen reader announces one long heading while the page looks
      fine. So I close every element, and when a page behaves strangely I compare the source
      with what the browser built in the developer tools. A validator, such as the W3C one,
      also lists these mistakes.
  - question: What does the doctype do, and what happens if you leave it out?
    answer: >-
      `<!doctype html>` tells the browser to lay the page out by today's standards. It isn't
      an element and it isn't shown. Without it, browsers switch to quirks mode, which copies
      the layout bugs of very old browsers so that sites from the 1990s still look as they
      did. In Chrome's console you can check the JavaScript value `document.compatMode`: it says `CSS1Compat` with the
      doctype and `BackCompat` without it. The differences are subtle, such as how widths and
      heights are measured. So a page can look almost right, then break in odd ways once you
      style it. There's no reason to omit it: it's one short line at the very top of
      every HTML file.
  - question: Why do heading levels matter if CSS can make any text any size?
    answer: >-
      Because the level is structure that people and programs use, and size is only looks.
      Screen reader users often list a page's headings and jump to the one they want, and
      the level tells them which sections belong together. Search engines read headings to
      understand the page too. WCAG 2.2 success criterion 1.3.1, Info and Relationships,
      requires structure you can see to be in the markup, so bold text posing as a heading
      fails it. In practice I use one `h1` for the page title, `h2` for main sections and
      `h3` for parts of them, without skipping levels. Then I size them with CSS. The trade-off
      is that a design might want a small heading high in the outline, and that's fine: the
      level follows the structure and CSS handles the rest.
