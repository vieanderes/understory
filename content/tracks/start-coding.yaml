# The first path: for someone who has never written code. Schema: fastTrackSchema in
# src/core/content/notes.ts.
title: Start coding from zero
name: Start coding
order: 1
promise: Write, run and fix your first small programs, then put one on a web page.
outcomes:
  - Write a program with variables, decisions, loops and functions
  - Keep data in lists and objects and work through it
  - Read an error message and fix the line it points at
  - Build a web page and make it respond to a click
decision: Have you never written code, or only copied it?
readyWhen:
  - You can write a function that takes a list and returns a total, without looking it up.
  - You can read an error message and say which line broke and why.
  - You can explain what a loop does to someone who has never coded.
  - You can build a small web page and change it when a button is clicked.
proof:
  title: A small program of your own, from an empty file
  evidence:
    - A program that keeps data in a list of objects
    - At least one function, one loop and one decision
    - An error you hit, fixed, and a note on what it meant
coverage:
  covered: [Variables and types, Decisions and loops, Functions, Lists and objects, Reading errors, A first web page]
  partial: [CSS, The DOM]
  outside: [Frameworks, Servers and databases]
summary: >-
  For anyone starting from zero. One idea per lesson, each one something you write and run
  in the browser, from your first line of code to a small program and a web page.
method:
  - Read the idea, then type the example yourself. Reading code is not writing it.
  - Run it, then change one thing and predict what happens before you run it again.
  - When something breaks, read the whole error before you change anything.
shapes:
  - label: Stuck on an exercise
    text: >-
      Say what the code should do in one sentence, then run the smallest piece that you are
      sure of. Ask the study assistant for a hint, not the answer.
  - label: An error message
    text: >-
      Read the last line first: it names the problem. Then find the line number and look at
      that line and the one above it.
days:
  - title: Your first programs
    why: >-
      Every program is built from a few ideas: values you keep, decisions you make and steps
      you repeat. Learn them one at a time, by running them.
    artifact: "Programs that decide and repeat"
    must: [basics.first-program, basics.variables, basics.operators, basics.conditions, basics.loops]
  - title: Functions and data
    why: >-
      Functions let you name a piece of work and use it again. Lists and objects hold the data
      it works on. Together they are most of everyday code.
    artifact: "Functions that work through a list"
    must: [basics.functions, basics.arrays, basics.objects]
  - title: When code goes wrong
    why: >-
      Code breaks, for everyone. Reading an error and watching code run step by step turn a
      broken program into a fixable one.
    artifact: "A small program, debugged"
    must: [basics.debugging, basics.watching-code, basics.small-program]
  - title: Your first web page
    why: >-
      A web page is the easiest place to see your code do something. Structure it with HTML,
      style it with CSS, then make it react with JavaScript.
    artifact: "A web page that responds to a click"
    must: [html.first-page, html.everyday-elements, css.what-css-is, js.meets-the-page]
    should: [css.box-model, html.the-dom]
