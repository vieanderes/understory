term: TLS termination
aka: [SSL termination, TLS offloading]
short: Decrypting HTTPS at the front door, then passing plain requests to the app over a private network.
explain: |
  Every app copy could hold the certificate and do its own decryption. That means renewing
  certificates in many places and repeating the same work on each one.

  So the reverse proxy or load balancer holds the certificate, decrypts the request and
  forwards it over a private network. The app then sees plain HTTP. It learns the browser
  used HTTPS from the `X-Forwarded-Proto` header, which matters for redirects and secure
  cookies. The private network must really be private, or the traffic travels in the clear.
analogy: The post room opening the outer envelope and handing you the letter. You still know it came by recorded delivery from the stamp.
usage: With TLS termination at the proxy, the app has to trust X-Forwarded-Proto, or it redirects to http for ever.
related: [tls, load-balancer, http-header, sticky-session]
level: 2
lessons: [cloud.reverse-proxies]
