deepDive: >-
  **The build checks you.** With `cacheComponents: true`, an uncached `fetch` or query that
  sits outside `<Suspense>` stops `next build`:


  ```text

  Error: Route "/fixtures": Next.js encountered uncached or runtime data during prerendering.

  Ways to fix this:
    - [stream] Provide a placeholder with `<Suspense fallback={...}>` around the data access
    - [cache] For uncached data (`fetch`, database calls): cache the access with "use cache"
    - [block] Set `export const instant = false` to allow a blocking route
  ```


  Stream it for data that must be fresh on every visit, cache it for data many people share.
  The build output marks a streamed route with `◐` (Partial Prerender).


  **Request data stays out.** Reading `cookies()` inside `'use cache'` fails with "Route
  /mine used `cookies()` inside "use cache"". The cookie isn't part of the cache key, so one
  visitor's data could be served to another. Read the cookie outside and pass the value in
  as an argument; arguments are part of the key.


  **Two more tools.** `React.cache` only removes repeated reads inside one request, such as
  two components asking for the same table. `revalidateTag('table', 'max')` also works in
  route handlers, but it serves the old result once more while refreshing, so the person who
  saved may not see their own change.


  **Several servers.** The cache lives in each server's memory. We ran two copies of one
  build and saved a result through the first: it showed 36 points, the second still showed
  33. Deploying Next.js covers the fix, a shared cache handler.
