summary: >-
  A **form** is how a page asks for information and sends it to a **server**, the computer
  that runs the site. When someone submits it, the browser, the app
  showing the page, walks through the fields, takes
  every one that has a `name`, and builds a list of name and value pairs. Then it makes a
  **request**, a message to the server, to the address in `action`. With `method="get"` the
  pairs ride in the address after a `?`. With `method="post"` they travel inside the request.


  HTML does a surprising amount of this with no JavaScript at all. A `label` gives each field
  a name that screen readers, apps that read a page aloud, announce and a bigger target to click. Attributes such as
  `required`, `type="email"` and `minlength` make the browser check the input, point at the
  first problem and refuse to send until it's fixed. A `button` inside a form submits it by
  default.


  Most form bugs come from the gaps between what the page shows and what gets sent: a field
  with an `id` but no `name`, a button that submits when it shouldn't, a check that only ran in
  the browser. Knowing exactly how the browser builds the request is what lets you predict and
  prevent them.
remember:
  - Only a field with a `name` is sent, as a name and value pair, and an `id` alone sends nothing.
  - Every field needs a visible `label`, wrapped around it or linked with `for` and `id`, because the label becomes the field's accessible name.
  - A `button` inside a form submits it unless it has `type="button"`.
  - GET puts the pairs in the address and suits searches, while POST sends them inside the request and suits anything that changes data.
  - Browser checks such as `required` and `type="email"` stop the form sending, but the server must check everything again, because anyone can send a request without your page.
  - An empty field that isn't `required` passes all its other checks.
  - Disabled fields, unticked checkboxes and the buttons nobody clicked add nothing to the data.
  - A placeholder is a hint, not a label, because it disappears as soon as someone types.
sections:
  - title: Exactly what the browser sends
    body: |-
      Here's a booking search with most kinds of field. What follows is the address Chrome
      loaded when Search was clicked:

      ```html
      <form action="/search">
        <input name="q" value="tomato soup & bread">
        <input id="guests" value="4">
        <input name="table" value="7" disabled>
        <input name="branch" value="north" readonly>
        <input type="checkbox" name="vegan" checked>
        <input type="checkbox" name="nuts">
        <input type="radio" name="time" value="7pm">
        <input type="radio" name="time" value="8pm" checked>
        <button>Search</button>
      </form>
      ```

      ```text
      /search?q=tomato+soup+%26+bread&branch=north&vegan=on&time=8pm
      ```

      Walk through it field by field:

      - **`q`** is sent, and encoded: a space becomes `+` and `&` becomes `%26`, so the value
        can't be confused with the `&` between pairs.
      - **`guests`** has only an `id`, so it's skipped.
      - **`table`** is `disabled`, so it's skipped. **`branch`** is `readonly`: it can't be
        edited, but it is sent.
      - **`vegan`** is ticked and has no `value`, so it sends the word `on`. **`nuts`** isn't
        ticked, so it sends nothing at all, not even `nuts=off`.
      - **`time`** is a radio group: fields sharing a `name` where only one can be chosen.
        Only the checked one is sent.

      Buttons can carry data too. With `<button name="action" value="save">` and
      `<button name="action" value="publish">` in one form, only the button that was clicked
      adds its pair. The server learns which one was pressed. For a fixed value the visitor
      never sees, use `<input type="hidden" name="source" value="homepage">`.
  - title: GET and POST, as the server sees them
    body: |-
      The method decides where the pairs go. Here are the two requests Chrome made for a
      one-field form, written the way the HTTP protocol, the language of web requests, lays
      them out:

      ```http
      GET /search?q=soup HTTP/1.1
      Host: shop.example
      ```

      ```http
      POST /search?lang=en HTTP/1.1
      Host: shop.example
      Content-Type: application/x-www-form-urlencoded

      q=soup
      ```

      Both forms had `action="/search?lang=en"`. Look closely: the GET form threw away
      `lang=en` and replaced the whole query with its own pairs. The POST form kept it, and
      put the pairs in the **body**, the part of the request after the blank line.

      Why POST for anything that changes data? A GET address is meant to be safe to repeat.
      It lands in the browser history, in bookmarks, in shared links and in server logs. So
      never put a password or personal details in a GET form. A booking sent by GET could be
      made again by anyone who reopens the link.

      POST has its own wrinkle. Refresh the page a POST produced, and the browser offers to
      send the form again, which could book twice. Servers avoid that by answering a POST with
      a redirect, an instruction to load a different address, such as a confirmation page.
      Refreshing then reloads the confirmation, not the booking. This pattern is called
      Post/Redirect/Get.

      To upload files, a form needs `method="post"` and `enctype="multipart/form-data"`, a
      different body format built for files.
  - title: Labels, groups and autofill
    body: |-
      A label is linked to its field in one of two ways, and they work the same:

      ```html
      <label>Email <input name="email"></label>

      <label for="phone">Phone</label>
      <input id="phone" name="phone">
      ```

      Chrome names both fields from their labels, "Email" and "Phone", and a click on either
      label puts the cursor in its field. The `for` version breaks silently if `for` and `id`
      don't match: in a test, a label with `for="wrong"` left its field with no name.

      A placeholder isn't a label. Chrome does use it as a name when nothing else exists, but
      it vanishes the moment someone types, so they can't check what the field wanted. WCAG
      2.2, the Web Content Accessibility Guidelines, covers this in success criterion 3.3.2,
      Labels or Instructions, level A: fields that need input need labels or instructions.

      For a set of radio buttons or checkboxes, the question itself needs a label too. Wrap
      the set in `fieldset` and put the question in `legend`:

      ```html
      <fieldset>
        <legend>Delivery time</legend>
        <label><input type="radio" name="time" value="am"> Morning</label>
        <label><input type="radio" name="time" value="pm"> Evening</label>
      </fieldset>
      ```

      Chrome exposes a group named "Delivery time" holding two radio buttons, so a screen
      reader can say "Delivery time, group" before "Morning".

      Finally, the `autocomplete` attribute tells the browser what a field holds, so it can
      offer saved details: `autocomplete="email"`, `autocomplete="name"`,
      `autocomplete="current-password"`. That saves everyone typing, and it's how you meet
      WCAG 2.2 success criterion 1.3.5, Identify Input Purpose, level AA.
  - title: How built-in validation really behaves
    body: |-
      Browser checks are called **constraint validation**. When a check fails on submit,
      nothing is sent, the first failing field gets focus and a message appears. Every result
      below was checked in Chrome:

      ```text
      required, left empty           invalid  "Please fill out this field."
      type="email", value "hello"    invalid  "Please include an '@' in the email address..."
      type="email", value "a@b"      valid    no dot is needed after the @
      type="email", left empty       valid    not required, so no check runs
      pattern="[0-9]{5}", "123456"   invalid  the pattern must match the whole value
      type="number" max="8", "12"    invalid  "Value must be less than or equal to 8."
      minlength="5", preset "ab"     valid    only text the person typed is measured
      minlength="5", typed "ab"      invalid  "Please lengthen this text to 5 characters..."
      ```

      Three of these surprise people. The email check is loose: `a@b` passes, because
      the standard's rule doesn't require a dot. An optional field left empty skips every check.
      And `minlength` ignores a value that came from the HTML: it only measures what someone
      typed. The message wording belongs to the browser and differs between browsers.

      Sometimes you want to skip the checks. `novalidate` on the `form` switches them off,
      and `formnovalidate` on one button skips them for that button only, which suits a
      "Save draft" button next to "Submit". A `disabled` field is never checked.

      None of this is security. Anyone can delete `required` in the developer tools, the
      inspection panels built into every browser, or send
      a request straight to your server without the page. Browser checks help honest people
      fix mistakes fast. The server checks every value again, every time.
  - title: The Enter key submits too
    body: |-
      Pressing Enter in a text field can submit the form. The HTML Standard calls it implicit
      submission, and it follows rules you should know, because they explain surprise
      submissions. All three cases below were tested in Chrome:

      ```html
      <!-- One text field, no button: Enter submits -->
      <form action="/search">
        <input name="q">
      </form>

      <!-- Two text fields, no submit button: Enter does nothing -->
      <form action="/search">
        <input name="q">
        <input name="city">
      </form>

      <!-- Enter clicks the first submit button, skipping type="button" -->
      <form action="/bookings">
        <input name="guest">
        <button type="button">Add another guest</button>
        <button name="via" value="book">Book table</button>
      </form>
      ```

      In the third form, with Sam typed in, Enter sent `/bookings?guest=Sam&via=book`, as if "Book table" had
      been clicked. Remove `type="button"` from the first button, and Enter would click it
      instead, because every button without a type is a submit button. That's the same bug
      the lesson hunts, arriving from the keyboard.

      So give every button in a form a deliberate type. Leave the one real submit button as
      it is, or write `type="submit"` to make the intent obvious to the next reader, and mark
      every other button `type="button"`.
pitfalls:
  - '**Forgetting the `name`.** The field shows, accepts input and passes its checks, but its value is never sent. Give every field that should be sent a `name`.'
  - '**Using a placeholder as the label.** It disappears as soon as someone types, and it''s often too faint to read. Use a visible `label`, and keep placeholders for examples.'
  - '**Leaving a helper button without a type.** Any button in a form submits it by default, from a click or from Enter. Add `type="button"` to every button that shouldn''t send.'
  - '**Sending changes or secrets with GET.** The data ends up in the address, the history and server logs. Use `method="post"` for anything that changes data or is private.'
  - '**Trusting browser checks.** They run only in the browser, and anyone can bypass them. Check every value again on the server.'
  - '**Mismatching `for` and `id`.** The label shows, but the field has no name, and clicking the label does nothing. Copy the id exactly, or wrap the field in its label.'
verify:
  - lens: breaks
    check: 'Every field that should be sent has a `name`, because a field with only an `id` is dropped without an error.'
  - lens: breaks
    check: 'The server checks every value again, because built-in validation runs only in the browser and anyone can send a request without it.'
  - lens: leaks
    check: 'Forms that send personal data or change something use `method="post"`, so the values stay out of the address, history and server logs.'
  - lens: confuses
    check: 'Every field has a visible `label`, so a screen reader announces what its for and clicking the label focuses it.'
  - lens: tests
    check: 'Every button that shouldnt send the form has `type="button"`, and each button is clicked once before release.'
interview:
  - question: When would you use GET and when POST for a form?
    answer: >-
      GET for reading, POST for changing. A GET form puts its pairs in the address, like
      `/search?q=soup`, so the result can be bookmarked, shared, cached and repeated safely.
      That suits searches and filters. A POST form sends its pairs in the request body, so
      they stay out of the address, history and server logs, and browsers warn before sending
      one again. That suits anything that creates or changes data, like a booking or a
      sign-up, and anything private, like a password. POST isn't encryption: the body is
      readable unless the site uses HTTPS. After handling a POST, the server should redirect
      to a result page, so a refresh doesn't resubmit. One detail: a GET form replaces any
      query already in `action`, while POST keeps it.
  - question: If HTML can validate a form, why validate on the server too?
    answer: >-
      Because browser validation is a convenience for honest users, not a security boundary.
      It runs on a machine you don't control. Anyone can remove `required` in the developer
      tools, disable it with `novalidate`, or skip the page entirely and send a request with
      any tool they like. The browser's rules are also loose: `type="email"` accepts `a@b`,
      and an optional field skips its checks when empty. So the server validates every value
      again, and treats the browser checks as the first line of feedback. The trade-off is
      keeping the two in step. Where the server rejects something the browser allowed, it
      must send back a clear message, tied to the field, so the person can fix it. That's
      WCAG 3.3.1, Error Identification.
  - question: How do you make a form accessible?
    answer: >-
      Start with native elements and visible labels, then test by keyboard and screen reader.
      Every field gets a `label`, wrapped around it or linked with `for` and `id`, so its
      accessible name matches what people see. Groups of radio buttons or checkboxes go in a
      `fieldset` with a `legend` that asks the question. Placeholders are examples, never
      labels. I use the right `type` and `autocomplete` values, so phones show the right
      keyboard and browsers can fill in saved details, which is WCAG 1.3.5. Errors are named
      in text next to the field, not by colour alone. Buttons are real `button` elements with
      clear text. Then I tab through the whole form, submit it empty, and check that focus
      lands on the first problem and the message is announced.
  - question: A button in your form sends the form when it should only add a field. Why?
    answer: >-
      A `button` without a `type` is a submit button, so clicking it submits its form. That's the HTML
      default.
      The fix is `type="button"` on every button that performs an action instead of sending.
      There's a second route to the same bug: pressing Enter in a text field clicks the form's
      first submit button, so an untyped helper button placed first can fire from the
      keyboard too. My habit is to give every button inside a form an explicit type, even the
      real submit button, so the intent is visible in review. If the button's behaviour comes
      from a script, the script can't prevent the submit when it fails to load, so the markup
      has to be right on its own.
