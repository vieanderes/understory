term: cursor pagination
aka: [keyset pagination, cursor-based pagination, next cursor]
short: Fetching the next page by asking for records after the last one seen, not by counting.
explain: |
  Counting from the start breaks when the list changes under you. Instead, remember where
  you stopped, "after this record", and ask for what comes next.

  The cursor is usually the sort key of the last row, often encoded as an opaque string.
  Sorting by a timestamp alone skips rows that share it, so add a unique tie-breaker such
  as the id. It stays fast at any depth, because an index finds the starting point. You
  can't jump to page 50.
analogy: A bookmark. You open the book where you left off, however many pages were added before it.
example:
  language: sql
  code: |
    SELECT id, updated_at, name
    FROM contacts
    WHERE (updated_at, id) > ($1, $2)
    ORDER BY updated_at, id
    LIMIT 100;
usage: The cursor pagination uses updated_at alone, so contacts saved in the same second get skipped.
twin:
  term: offset-pagination
  difference: Cursor pagination continues after the last record seen, so it stays correct while data changes. Offset pagination skips a count of records, which shifts when rows are added or removed.
related: [offset-pagination, delta-sync, index, generator]
level: 2
lessons: [integrations.paging-through]
