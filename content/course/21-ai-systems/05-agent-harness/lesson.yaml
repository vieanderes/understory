deepDive: >-
  No model was called. The harness snippets and the loop check ran in Python 3.12 on
  made-up histories.


  **Named workflow shapes.** Prompt chaining runs calls in sequence. Routing classifies an
  input and sends it down one branch. Parallelisation runs calls at once and combines them.
  Orchestrator and workers lets one call split a task for others. Most production systems
  are these, with an agent loop only in the one step that needs open-ended exploration.


  **Hard caps and soft budgets.** `max_tokens` caps one reply, not a run, so the harness
  counts tokens and money across turns itself. Some APIs also accept an advisory task
  budget the model can see, which helps it pace itself and finish tidily. Your code still
  enforces the hard cap.


  **A second loop signal.** Hash each tool result. When the last few hashes repeat, no new
  information is arriving, whatever the calls look like. For long tasks, write progress to
  a file and commit it, so a fresh context window can pick up where the last one stopped.
  The harness decides when to start that window, not the model.
