term: poisoned retrieval
short: A planted document in what a RAG system searches that carries instructions into the model's prompt.
explain: |
  A RAG system pastes the chunks it finds into the prompt. If anyone can write to what it
  searches, such as forum posts, tickets or shared files, they can plant text that reads
  like orders. When it's retrieved, the model may follow it.

  You can't filter out every wording. So you tag each chunk with its source, search only
  sources you trust for anything that sets policy, and fence retrieved text as quoted data.
  Retrieved text never grants a tool or a permission on its own.
analogy: A prankster slips a fake page into the office handbook. Whoever looks up that topic reads it as policy.
usage: The support bot quoted a forum post asking for card numbers. That's poisoned retrieval, so we now search staff pages only.
twin:
  term: prompt-injection
  difference: Prompt injection is any untrusted text steering the model. Poisoned retrieval is the kind that arrives through your own search index.
