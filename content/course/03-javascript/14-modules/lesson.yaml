deepDive: >-
  Open `index.html` straight from your disk, with a `file://` address, and the module won't
  load. Chromium's Console blames a CORS policy. Browsers fetch modules like any other request,
  and they refuse files from disk, so serve the folder from a local server instead. The tooling
  chapter shows how.


  An import is a live link, not a copy. If `stock.js` changes an exported `let`, every importer
  sees the new value the next time it reads it. Importers can't assign to it themselves.


  Every import is loaded and run before the importing file's first line, and each module runs
  once, however many files import it. `import("./pdf.js")` loads a module later, on demand,
  and returns a promise for it.


  Node, which runs JavaScript outside the browser, also has an older system, CommonJS, with `require` and `module.exports`. You'll meet it in
  older packages. Build tools read `import` and `export` to find code nothing uses and leave it
  out of the bundle, which is why new code uses them.
