approach: >-
  Simulate the timer. While the value is above 0, find its largest digit by taking the last
  digit with % 10 and dropping it with a division by 10, then subtract that digit and count
  the step. The largest digit is at least 1 for any positive value, so the loop always
  ends.
complexity: O(N · log N) time in the worst case, O(1) extra space
steps:
  - kind: read
    title: Read the assumptions and the focus
    minutes: 2
    body: |-
      This task says **focus on correctness**, and N is at most 1,000,000. A plain
      simulation is fine: no clever maths needed.

      That changes your job. Spend the time on getting every digit right, not on speed.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in your own words. If the comment names the loop and when it stops, the code
      almost writes itself.
    code:
      ts: |-
        // Repeatedly subtract the largest digit until the value is 0; return how many steps.
      python: |-
        # Repeatedly subtract the largest digit until the value is 0; return how many steps.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break it:

      - N = 0, which takes no steps;
      - a single digit, which takes one step;
      - zeros inside the number, such as 100 or 505;
      - the top of the range, 1,000,000.

      Put them in test-input.txt now.
    input:
      - "0"
      - "9"
      - "100"
      - "505"
      - "1000000"
  - kind: ask-ai
    title: Confirm the loop always stops
    minutes: 1
    body: |-
      A countdown loop is only safe if it cannot overshoot or stall. Check your reasoning
      with a narrow question. Do not ask for the code.
    prompt: >-
      Without solving it: for a positive whole number, the largest digit is at least 1 and
      never more than the number, so subtracting it never goes below 0 and always makes
      progress. Is that right? One sentence.
    expect: The assistant agrees, so `while value > 0` is the right loop.
  - kind: plan
    title: Read digits with % and division
    minutes: 2
    body: |-
      Two loops. The outer one counts steps until the value is 0. The inner one finds the
      largest digit: `rest % 10` is the last digit, and dividing by 10 drops it.

      Turning the number into a string also works. The arithmetic version avoids a new
      string on every step.
  - kind: ask-ai
    title: Ask one syntax question about division
    minutes: 1
    body: |-
      Integer division differs between the two languages. It is a fair, narrow question,
      and getting it wrong gives an endless inner loop.
    prompt: >-
      One line each: how do I divide a positive integer by 10 and drop the remainder in
      TypeScript, and in Python?
    expect: "Math.floor(rest / 10) in TypeScript, and rest // 10 in Python."
  - kind: write
    title: Write the solution yourself
    minutes: 4
    body: |-
      It is about ten lines. Type it yourself: it is faster than prompting, and it is the
      whole task. Keep the header comment.
    code:
      ts: |-
        // Repeatedly subtract the largest digit until the value is 0; return how many steps.
        // Each step reads the digits of the current value with % and /, so no string round
        // trip: O(N log N) time in the worst case, O(1) space.
        function solution(N: number): number {
          let value = N;
          let steps = 0;
          while (value > 0) {
            let largest = 0;
            for (let rest = value; rest > 0; rest = Math.floor(rest / 10)) {
              largest = Math.max(largest, rest % 10);
            }
            value -= largest;
            steps++;
          }
          return steps;
        }
      python: |-
        # Repeatedly subtract the largest digit until the value is 0; return how many steps.
        # Each step reads the digits of the current value with % and //, so no string round
        # trip: O(N log N) time in the worst case, O(1) space.
        def solution(N):
            value = N
            steps = 0
            while value > 0:
                largest = 0
                rest = value
                while rest > 0:
                    largest = max(largest, rest % 10)
                    rest //= 10
                value -= largest
                steps += 1
            return steps
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. The three examples must say OK. For 0 and 9 you know the answer
      from the rule. For the bigger ones, check that the run finishes and returns a positive
      count.
    expect: Three OKs, 0 for 0, 1 for 9, and a quick positive count for the others.
  - kind: test
    title: Trace one case to check the rule, then remove it
    minutes: 2
    body: |-
      Add a temporary print of the value inside the outer loop and run 100. Each line should
      drop by the largest digit of the line above. Reading the trace checks the rule; you do
      not need to work anything out yourself.
    input:
      - "100"
    expect: The printed values follow the rule down to 0. Then delete the print.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. Zeros inside the number are the usual place for a
      digit loop to go wrong.
    prompt: >-
      Review my current solution for correctness, including numbers with zeros inside and
      N = 0. List any problems in one line each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Make sure the trace print is gone. Check the header comment says what the function
      does and its cost. Then submit.
