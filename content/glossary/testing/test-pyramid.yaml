term: test pyramid
aka: [testing pyramid, testing trophy]
short: A guide to the mix of tests, with many fast small ones and a few slow full-app ones.
explain: |
  Tests differ in cost. A small one runs in a millisecond and points straight at the bug. A
  browser journey takes seconds, breaks for many reasons, and says only "something's
  wrong". So you want lots of the first kind and a handful of the second.

  The shape is a guide, not a law. Some teams draw a "trophy" with the most weight in
  integration tests, because those catch the bugs users meet. The point underneath holds
  either way: push each check down to the cheapest level that can still catch the bug.
analogy: A food pyramid. Plenty of the everyday basics, a little of the rich stuff on top.
usage: Our test pyramid is upside down; 300 browser tests and almost no unit tests, so CI takes forty minutes.
related: [unit-test, integration-test, end-to-end-test, contract-test]
level: 2
lessons: [testing.what-to-test, testing.contract-tests]
