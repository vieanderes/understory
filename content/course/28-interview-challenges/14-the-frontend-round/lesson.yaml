id: interview.frontend-round
title: The frontend round
objective: "Get the state of an autocomplete right: latest request wins, every loading and error state, keyboard navigation and the combobox pattern."
level: advanced
minutes: 10
concepts: [interview.stale-responses, interview.ui-state-machine, interview.combobox-pattern]
prerequisites: [react.effects, react.state-placement, design.keyboard-and-focus]
opening:
  text: >-
    You'll build an autocomplete that works from the keyboard and never shows stale results,
    even from a slow search. It's the frontend round's favourite task.

steps:
  - type: prose
    id: what-you-need
    body: |-
      What you need: React's `useState` and `useRef`, and promises. A **reducer** is a
      function `(state, action) => newState` that makes every change in one place.

      An **autocomplete** suggests matches as you type, fetched from a server. It's the
      favourite frontend round. Graders check that the latest request wins, every state has
      a screen, and keyboard and screen reader both work. Let the assistant write markup;
      write the race handling yourself.

  - type: prose
    id: tag-requests
    body: >-
      Networks don't promise order. Type `ca`, then `cat`: if `ca` answers last, its list
      overwrites the right one. So tag each request with an id that goes up by one, and
      remember the latest. An answer with an older id is a **stale response**: drop it.


      An `AbortController` cancels a `fetch` you no longer need. It saves bandwidth, but the
      id check is what keeps the screen right.

  - type: prose
    id: status-union
    body: >-
      Now count the screens: idle, loading, success, empty, error. Keep one `status` field
      that holds exactly one of them.


      Separate `isLoading` and `hasError` booleans allow "loading and failed" at once, and
      someone will render it. One field and a reducer make that impossible. That's **UI state
      as a machine**.

  - type: fill-blank
    id: fill-received
    concept: interview.stale-responses
    difficulty: 2
    prompt: Finish the reducer case for an answer, so stale answers change nothing.
    language: ts
    template: |
      case 'received': {
        if (action.requestId !== {{1}}) return state;
        const status = action.results.length === 0 ? {{2}} : 'success';
        return { ...state, status, results: action.results, active: -1 };
      }
    blanks:
      - key: '1'
        answer: state.requestId
      - key: '2'
        answer: "'empty'"
    bank: [state.requestId, action.requestId, "'empty'", "'idle'", "'error'"]

  - type: prose
    id: combobox-roles
    body: |-
      For a screen reader, an autocomplete is a **combobox**. The input has
      `role="combobox"`, `aria-expanded` and `aria-controls`, naming the list. The list is a
      `listbox` of `option`s, each with an id.

      Focus stays in the input so typing still works. The arrows move a highlight, and
      `aria-activedescendant` on the input names the highlighted option's id, so it's read
      aloud.

  - type: fill-blank
    id: fill-combobox
    concept: interview.combobox-pattern
    difficulty: 3
    prompt: >-
      Focus stays in the input while the arrows move through the options. Fill in the roles
      and the attribute that names the active option.
    language: tsx
    template: |
      <input
        role="{{1}}"
        aria-expanded={open}
        aria-controls="city-list"
        {{2}}={active >= 0 ? `city-${active}` : undefined}
      />
      <ul id="city-list" role="{{3}}">
        {cities.map((city, i) => (
          <li key={city} id={`city-${i}`} role="{{4}}" aria-selected={i === active}>
            {city}
          </li>
        ))}
      </ul>
    blanks:
      - key: '1'
        answer: combobox
      - key: '2'
        answer: aria-activedescendant
      - key: '3'
        answer: listbox
      - key: '4'
        answer: option
    bank: [combobox, aria-activedescendant, listbox, option, menu, menuitem, aria-current]

  - type: playground
    id: build-city-options
    concept: interview.combobox-pattern
    difficulty: 3
    prompt: >-
      Typing shows cities, but a screen reader hears plain text and clicks do nothing. Give
      the input and list their combobox roles, and let a click pick a city and close the list.
    jsx: |
      import { useState } from "react";
      const CITIES = ["Leeds", "Leicester", "York", "Bath"];
      export default function CityPicker() {
        const [query, setQuery] = useState("");
        const [chosen, setChosen] = useState("");
        const matches = query ? CITIES.filter((c) => c.toLowerCase().includes(query.toLowerCase())) : [];
        return (<div>
          <input aria-label="City" value={query} onChange={(e) => setQuery(e.target.value)} />
          {matches.length > 0 && <ul>{matches.map((c) => <li key={c}>{c}</li>)}</ul>}
          <p>Chosen: {chosen}</p>
        </div>);
      }
    checks:
      - label: The input is a combobox naming its list
        selector: 'input[role="combobox"][aria-controls="city-list"]'
      - label: Typing opens a listbox of two options
        actions: [{ type: le, into: input }]
        selector: '#city-list[role="listbox"] [role="option"]'
        count: 2
      - label: The open list sets aria-expanded
        actions: [{ type: le, into: input }]
        selector: 'input[aria-expanded="true"]'
      - label: Each option has an id
        actions: [{ type: le, into: input }]
        selector: '[role="option"][id]'
        count: 2
      - label: Clicking Leeds picks it and closes the list
        actions: [{ type: le, into: input }, { click: '[role="option"]' }]
        selector: '[role="listbox"]'
        count: 0
      - label: The page shows the city picked
        actions: [{ type: le, into: input }, { click: '[role="option"]' }]
        selector: p
        text: 'Chosen: Leeds'
    solution:
      jsx: |
        import { useState } from "react";
        const CITIES = ["Leeds", "Leicester", "York", "Bath"];
        export default function CityPicker() {
          const [query, setQuery] = useState("");
          const [chosen, setChosen] = useState("");
          const matches = query ? CITIES.filter((c) => c.toLowerCase().includes(query.toLowerCase())) : [];
          const pick = (c) => { setChosen(c); setQuery(""); };
          return (<div>
            <input role="combobox" aria-label="City" aria-controls="city-list" aria-expanded={matches.length > 0}
              value={query} onChange={(e) => setQuery(e.target.value)} />
            {matches.length > 0 && <ul id="city-list" role="listbox">{matches.map((c, i) => (
              <li key={c} id={`city-${i}`} role="option" aria-selected={false} onClick={() => pick(c)}>{c}</li>))}</ul>}
            <p>Chosen: {chosen}</p>
          </div>);
        }
    hints:
      - The roles go on three elements. The input, the `ul` and each `li`.
      - '`aria-controls` must match the `ul`''s `id`, and `aria-expanded` is true while there are matches.'
      - Give each `li` `role="option"`, an id such as `city-${i}` and an `onClick` that sets `chosen` and clears the query.

  - type: ai-review
    id: review-fake-aria
    concept: interview.combobox-pattern
    difficulty: 4
    language: tsx
    request: Make the city search accessible. Screen readers should hear each option as the arrows move.
    flawClass: hallucinated-api
    code: |
      <input
        role="combobox"
        value={query}
        aria-expanded={open}
        aria-controls="city-list"
        aria-activeoption={active >= 0 ? `city-${active}` : undefined}
        onKeyDown={onKeyDown}
      />
    prompt: >-
      An assistant wrote this. TypeScript accepts any hyphenated attribute, and the test only
      checked the highlight. A screen reader stays silent. Tap the line at fault.
    lines: [6]
    reasons:
      - text: '`aria-activeoption` is not an ARIA attribute'
        correct: true
        feedback: >-
          Right. It's invented. The real one is `aria-activedescendant`, pointing at the option's id.
      - text: Focus should move onto each option
        feedback: >-
          That's a different pattern. A combobox keeps focus in the input so typing still works.
      - text: '`aria-expanded` needs the string `"true"`'
        feedback: >-
          React turns `true` into `"true"` for `aria-` attributes. The silent line is another one.
    fix: |
      aria-activedescendant={active >= 0 ? `city-${active}` : undefined}

  - type: code-challenge
    id: build-autocomplete
    concept: interview.ui-state-machine
    difficulty: 4
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Now build the real thing, the way the round asks. Turn the bare input into
      `<Autocomplete search={search} />`. `search(query)` returns a promise of strings, and
      the tests decide when each one settles.


      Label the input "Search" and make it a combobox. Each change searches, unless the box is
      blank. Show "Loading" and "No results" in a `role="status"` paragraph, and "Search failed"
      in a `role="alert"`.


      Only the latest request may change the screen. The arrows move and wrap round, Enter or a
      click picks, and Escape closes.
    hints:
      - Look at what happens when an older answer lands last. Keep the latest request id in a `useRef`.
      - Escape and a blank box both close, so they must make answers in flight stale too.
      - 'Start with one `status` value. The list shows only when it''s `''success''`.'

  - type: explain-back
    id: explain-latest-wins
    concept: interview.stale-responses
    difficulty: 4
    prompt: >-
      Your search debounces keystrokes. Why can the list still show results for an older
      query without the request id check?
    rubric:
      - Debounce cuts how many requests go out, but two can still overlap.
      - The network and the server don't keep order, so an older answer can land last.
      - Without comparing ids, whichever answer lands last wins, even when it's stale.
    modelAnswer: >-
      Debounce means fewer requests, not one at a time. If you pause, type again and pause,
      two requests are in flight. The first can be slower and arrive second, and then it
      overwrites the newer results. Checking the id against the latest drops it.

recap:
  - Drop stale answers by tagging each request with an id.
  - Model loading, success, empty and error as one status.
  - Wire up a combobox with listbox, option and aria-activedescendant.
recall:
  - id: card-stale
    concept: interview.stale-responses
    front: How does an autocomplete make sure the latest request wins?
    back: >-
      Each request gets an increasing id. An answer whose id isn't the latest is ignored.
  - id: card-status
    concept: interview.ui-state-machine
    front: Why use one `status` field rather than `isLoading` and `hasError` booleans?
    back: >-
      One field holds exactly one state, so impossible mixes like "loading and failed" can't
      be represented.
  - id: card-wrap
    concept: interview.ui-state-machine
    front: With `count` options, what is the next index after ArrowDown from `active`?
    back: >-
      `(active + 1) % count`, so the last option wraps to the first, and `-1` goes to `0`.
  - id: card-activedescendant
    concept: interview.combobox-pattern
    front: In a combobox, what does `aria-activedescendant` do?
    back: >-
      It holds the id of the highlighted option, so screen readers announce it while focus
      stays in the input.

references:
  - kind: spec
    title: Combobox Pattern
    authors: W3C Web Accessibility Initiative
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/patterns/combobox/
    note: The roles, states and keys, with a list autocomplete example.
    primary: true
    verified: true
  - kind: spec
    title: 'Accessible Rich Internet Applications (WAI-ARIA) 1.2'
    authors: W3C
    year: 2023
    venue: W3C Recommendation
    url: https://www.w3.org/TR/wai-aria-1.2/
    note: The definitions of `combobox`, `listbox`, `option` and `aria-activedescendant`.
    verified: true
  - kind: docs
    title: You Might Not Need an Effect, fetching data
    authors: React team
    venue: react.dev
    url: https://react.dev/learn/you-might-not-need-an-effect#fetching-data
    note: The race between overlapping fetches, and the ignore flag that fixes it.
    verified: true

deepDive: |-
  **What the round usually asks.** Build an autocomplete in React against a slow, flaky
  mock API. Graders look for debounce, latest request wins, a small cache by query,
  keyboard support, the combobox roles, and a real loading, empty and error state. Say
  which of these you'll do first. State, then keys, then roles is a good order, because
  each builds on the one before.


  **State or a reducer.** The challenge keeps a few `useState` values and a ref for the
  latest id. With more transitions, move them into a reducer with `typed`, `received`,
  `failed` and `key` actions, and the id check lives in one `case`. Aborting the old request
  with an `AbortController` saves bandwidth, but keep the id check. An abort can race with a
  response that has already arrived.


  **How the tests work.** The fake `search` hands each promise's `resolve` to the test, so
  it can answer out of order on purpose. That's how you prove latest request wins without a
  real network or timers. Interviewers like hearing that you'd test it this way.


  **Debounce and cache.** Debounce the call to `search` with the utility
  from the utilities round. Cache answers in a `Map` keyed by the query, and a repeated
  query costs nothing. Cap the cache with the LRU from the same lesson.


  **The combobox details.** The input keeps DOM focus. `aria-controls` names the listbox.
  `aria-expanded` says whether it's showing. `aria-activedescendant` names the highlighted
  option's id, and each option carries `aria-selected`. The APG pattern also covers
  `aria-autocomplete="list"`, Home and End, and Alt plus ArrowDown to open.


  **The data table.** The other common task is a table with sort, filter and pages. Keep
  it a pure `tableView(rows, state)` that filters, sorts, then slices, and put the state in
  the URL.
