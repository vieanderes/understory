id: tool-call-check
title: ToolCallCheck
topic: agents
difficulty: easy
type: coding
recommendedMinutes: 20
signature:
  params:
    - { name: R, type: "string[]" }
    - { name: C, type: "string[]" }
  returns: "string[]"
statement: |-
  An agent asks for tool calls, and a guard checks each one before it runs. The registry R
  describes the tools, one string each: the tool name, its mode (`read` or `write`), then
  its parameters as `name:type`, all separated by single spaces. Every listed parameter is
  required. A type is `int`, `bool` or `text`. For example, `"search read query:text
  limit:int"`.

  Each call in C is the tool name, then its arguments as `key=value`, separated by single
  spaces. A call may also hold the word `approved`, which means a person has approved it.
  For example, `"search query=shoes limit=5"`.

  A value is valid for its type when:

  - `int`: it is one or more digits, optionally after a single minus sign;
  - `bool`: it is exactly `true` or `false`;
  - `text`: always.

  Each call gets the first verdict in this list that applies:

  1. `unknown-tool`: no tool in the registry has that name;
  2. `unknown-arg`: the call has a key that is not a parameter of the tool;
  3. `missing-arg`: a parameter of the tool has no argument;
  4. `bad-type`: a value is not valid for its parameter's type;
  5. `needs-approval`: the tool is a write tool and the call is not approved;
  6. `ok`.

  Write a function:

  {{signature}}

  that, given arrays R and C of strings, returns an array with the verdict for each call, in
  order.

  For example, given R = ["search read query:text limit:int", "refund write order:int
  notify:bool"] and C = ["search query=shoes limit=5", "search query=shoes limit=five",
  "refund order=7 notify=true", "refund order=7 notify=true approved", "delete order=7"],
  the function should return ["ok", "bad-type", "needs-approval", "ok", "unknown-tool"].

  Assume that:

  - the lengths of arrays R and C are integers within the range [1..100];
  - tool names, parameter names, keys and values are non-empty strings of letters, digits,
    hyphens and full stops, and are never `approved`;
  - tool names in R are unique, and no call repeats a key.

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [["search read query:text limit:int", "refund write order:int notify:bool"], ["search query=shoes limit=5", "search query=shoes limit=five", "refund order=7 notify=true", "refund order=7 notify=true approved", "delete order=7"]], expected: ["ok", "bad-type", "needs-approval", "ok", "unknown-tool"] }
tests:
  - name: extreme_single
    description: a tool without parameters
    group: correctness
    cases:
      - { args: [["ping read"], ["ping"]], expected: ["ok"] }
      - { args: [["ping read"], ["ping x=1"]], expected: ["unknown-arg"] }
      - { args: [["reset write"], ["reset", "reset approved"]], expected: ["needs-approval", "ok"] }
  - name: verdict_order
    description: several problems in one call, the first in the list wins
    group: correctness
    cases:
      - { args: [["refund write order:int notify:bool"], ["refund order=x extra=1", "refund order=x", "refund order=x notify=yes", "refund order=1 notify=yes", "refund notify=maybe approved"]], expected: ["unknown-arg", "missing-arg", "bad-type", "bad-type", "missing-arg"] }
  - name: int_values
    description: signs, zeros and look-alikes
    group: correctness
    cases:
      - { args: [["page read n:int"], ["page n=0", "page n=-12", "page n=007", "page n=+3", "page n=1.5", "page n=-", "page n=--1", "page n=1e3"]], expected: ["ok", "ok", "ok", "bad-type", "bad-type", "bad-type", "bad-type", "bad-type"] }
  - name: bool_values
    description: only true and false
    group: correctness
    cases:
      - { args: [["flag read on:bool"], ["flag on=true", "flag on=false", "flag on=True", "flag on=1", "flag on=yes"]], expected: ["ok", "ok", "bad-type", "bad-type", "bad-type"] }
  - name: text_values
    description: text accepts anything, including digits and minus signs
    group: correctness
    cases:
      - { args: [["note write body:text"], ["note body=-5 approved", "note body=true approved", "note body=a.b-c approved"]], expected: ["ok", "ok", "ok"] }
  - name: approval_placement
    description: the approved word can sit anywhere, and read tools ignore it
    group: correctness
    cases:
      - { args: [["send write to:text", "fetch read url:text"], ["send approved to=team", "send to=team", "fetch approved url=x.y", "fetch url=x.y"]], expected: ["ok", "needs-approval", "ok", "ok"] }
  - name: argument_order
    description: arguments in any order, names that share a prefix
    group: correctness
    cases:
      - { args: [["move write from:int to:int"], ["move to=2 from=1 approved", "move from=1 tox=2 approved", "move fro=1 to=2 approved"]], expected: ["ok", "unknown-arg", "unknown-arg"] }
      - { args: [["list read"], ["lists", "list", "List"]], expected: ["unknown-tool", "ok", "unknown-tool"] }
