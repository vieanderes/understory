term: normalisation
aka: [normalization, normal form, normalised, normalized]
short: Arranging tables so each fact is stored in one place, with other rows pointing to it.
explain: |
  If a customer's address is copied onto every order, changing it means updating many
  rows. Miss one and the data disagrees with itself. Storing the address once and pointing
  to it fixes that.

  The formal rules are called normal forms; third normal form is the usual target. Going
  the other way on purpose, **denormalising**, copies data to make reads faster. That's a
  fair trade for a read model or a report, as long as you know which copy is the truth.
analogy: A shared family calendar. Write the dentist appointment once, and everyone sees the change, instead of five paper diaries drifting apart.
usage: The product name lives in three tables now; normalisation would leave it in one.
related: [foreign-key, primary-key, join]
level: 2
lessons: [db.schema-design]
