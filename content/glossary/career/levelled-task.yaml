term: levelled task
aka:
  - levelled assessment
  - multi-level coding task
short: An assessment that grows one program in stages, where each stage adds rules and keeps the old ones.
explain: |
  You start with something small, such as a store that sets and gets values. Pass level
  one, and level two adds expiry. Level three adds backups. The program keeps growing.

  The trap is the earlier levels. Every new rule must leave the old tests green, so a
  quick hack in level one becomes a wall in level three. Pick a model of the data that
  can grow, and rerun every level after each change.

  It mirrors real work more than a puzzle does. Requirements arrive in pieces, and the
  code you wrote yesterday has to survive them.
analogy: Building a house a floor at a time. A shaky ground floor decides how high you can go.
usage: In the levelled task I stored timestamps from level one, so expiry in level two was a small change.
