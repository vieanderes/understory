term: fail closed
aka: [fail-closed, fail secure, fail open, fail-open]
short: Refusing access when a security check errors or times out, instead of letting the request through.
explain: |
  Checks fail too. The permission service times out, the token can't be parsed, the
  feature flag service is down. Code then has to choose: refuse the request, or wave it
  through.

  For anything security-related, refuse. Code often lets it through by accident: a `catch`
  that logs and carries on, or a default of `true`. Give the check a deadline, and treat an
  error or a timeout the same as "no". Failing open is right only for things like a
  recommendation widget, where nothing is protected.
analogy: A security door that locks when the power cuts out, rather than swinging open.
example:
  language: ts
  code: |
    async function mayEdit(user: User, doc: Doc): Promise<boolean> {
      try {
        return await withTimeout(policy.check(user, doc), 200);
      } catch {
        return false; // errors and timeouts deny
      }
    }
usage: The permission check returns true when the service is down; make it fail closed and alert instead.
related: [authorisation, owasp-top-ten, circuit-breaker]
level: 2
lessons: [security.owasp-top-ten]
