term: lab data
aka: [ synthetic testing, synthetic monitoring, lab test ]
short: Speed measurements from a controlled test load, on a fixed device profile and network, that you can repeat.
explain: |
  To know whether a change helped, you need the same test twice with one thing changed. A
  controlled run, on a set device and network speed, gives you that.

  Lab tools record a full trace you can dig into, which real visits can't give you. The trap
  is mistaking it for reality. One throttled load is not a million phones, and nobody taps, so
  INP goes unmeasured. Check results against field data.
analogy: A car's fuel figure from a test track. Useful to compare cars, never what you get in traffic.
usage: The lab data improved after the change, so let's see if the field data follows next week.
twin:
  term: field-data
  difference: Lab data comes from a controlled run and is repeatable, good for comparing fixes. Field data comes from real visits and shows what people really feel.
related: [ field-data, core-web-vitals, profiling ]
level: 2
lessons: [ perf.measure-first, perf.web-vitals ]
