term: controlled input
aka:
  - controlled component
short: A form field whose value comes from React state and changes only through an onChange handler.
explain: |
  Give an input `value={text}` and `onChange={(e) => setText(e.target.value)}`. Now React
  holds the truth, and the field shows whatever state says.

  That lets you check, reformat or limit the text on each keystroke. The classic bug is a
  `value` without an `onChange`: the field becomes read-only. Another is a `value` that starts
  `undefined`, which React treats as uncontrolled.
analogy: A puppet. It moves only when the puppeteer moves the strings.
example:
  language: tsx
  code: |
    function Search() {
      const [text, setText] = useState('');
      return <input value={text} onChange={(e) => setText(e.target.value)} />;
    }
usage: Make it a controlled input, so we can strip spaces as they type.
twin:
  term: uncontrolled-input
  difference: A controlled input's value lives in React state. An uncontrolled input keeps its own value in the browser, and you read it when you need it.
related:
  - uncontrolled-input
  - state
level: 2
