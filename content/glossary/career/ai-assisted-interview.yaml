term: AI-assisted interview
aka:
  - AI-assisted round
  - AI-enabled interview
short: A coding interview where you may use an AI helper, scored on how you direct and check it.
explain: |
  Some companies now let you use an assistant during the round. It sounds easier. It isn't,
  because the bar moves from typing code to judging it.

  Reviewers still score problem solving, code quality and communication. They add one
  more thing: judgement. Do you plan before you prompt? Do you test the answer against the
  task, or only against the example? Can you explain every line you submit?

  The usual failure is quiet. The assistant gets a tie-break or a unit wrong, and the
  candidate never notices. Write your own test cases first, so every answer has something
  to fail against.
analogy: An open-book exam. The book is there for everyone, so they mark how you use it.
usage: It was an AI-assisted interview, so I wrote my edge cases down before the first prompt.
