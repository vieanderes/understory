term: spike test
aka: [spike testing, burst test]
short: A load test that jumps from quiet to very busy in seconds, faster than new capacity can arrive.
explain: |
  A newsletter goes out and ten thousand people click at once. Autoscaling needs minutes
  to add servers, but the crowd arrives in seconds.

  So test the jump itself. Go from idle to peak almost instantly, hold briefly, then drop.
  Watch what fails while capacity catches up: queues, connection limits, cold starts. A
  service that handles the peak load slowly ramped can still fall over when it arrives all
  at once.
analogy: The doors opening on the first morning of a sale. The shop copes with the same crowd spread over a day, not all at nine sharp.
usage: Before the launch email, run a spike test from zero to five thousand users in ten seconds.
twin:
  term: stress-testing
  difference: A stress test climbs steadily past normal to find the limit. A spike test is about the speed of the jump, even to a load the service can normally handle.
related: [stress-testing, soak-test, autoscaling, cold-start]
level: 2
lessons: [testing.breaking-it-on-purpose]
