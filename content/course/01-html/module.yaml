id: html
number: 1
title: HTML
summary: Build real web pages from scratch, and see what the browser makes of them. Headings, lists, links, images, forms, and the DOM that JavaScript changes.
why: "Every web page is HTML underneath. Good markup works for everyone: screen readers, search engines and slow phones."
youCanBuild: "A well-structured page with links, images and a form that works without JavaScript."
concepts:
  - id: html.elements
    title: Elements
    summary: An element is a start tag, its content and an end tag, like `<p>Serves four</p>`. The tag says what the content is.
  - id: html.nesting
    title: Nesting and page structure
    summary: Elements sit inside other elements, and the inner one closes first. A whole page nests everything in `html`, with `head` and `body` inside.
  - id: html.lists
    title: Lists
    summary: "`ul` makes a bullet list and `ol` a numbered one, with each item in an `li`."
  - id: html.attributes
    title: Attributes, links and images
    summary: An attribute adds a setting to a start tag, like `href` for where a link goes and `src` for an image file.
  - id: html.alt-text
    title: Alt text
    summary: The `alt` attribute describes an image in words, for screen reader users and for when the file fails to load.
  - id: html.dom
    title: The DOM
    summary: The DOM is the tree of objects the browser builds from your HTML, one per element. The screen is drawn from it.
    confusableWith: [html.accessibility-tree]
  - id: html.dom-scripting
    title: Changing the page with JavaScript
    summary: JavaScript finds an element with `document.querySelector` and changes it through properties such as `textContent`.
  - id: html.parsing
    title: How browsers read HTML
    summary: Browsers never reject HTML. They repair mistakes silently, and the Elements panel shows the tree they really built.
  - id: html.semantic-elements
    title: Semantic elements
    summary: A semantic element says what its content is, like `button` or `nav`, while `div` says nothing.
  - id: html.landmarks
    title: Landmarks
    summary: "`header`, `nav`, `main` and `footer` mark the main regions of a page, and screen reader users can jump between them."
  - id: html.headings
    title: Heading structure
    summary: Headings from `h1` to `h6` form the outline of a page. Pick the level by position, never by size.
  - id: html.accessibility-tree
    title: The accessibility tree
    summary: From the DOM, the browser builds a list of each element's role and name for screen readers.
    confusableWith: [html.dom]
  - id: html.url-resolution
    title: Relative URLs
    summary: A relative path starts from the folder of the current page, while a path starting with `/` starts at the top of the site.
  - id: html.fragments
    title: Links to a place on the page
    summary: A link like `#find-us` jumps to the element with `id="find-us"` on the same page.
  - id: html.form-controls
    title: Labels and form fields
    summary: A `label` tells everyone what a box is for, and the `name` attribute gives its value a key in the sent data.
  - id: html.form-submission
    title: What a form sends
    summary: A form sends a name and value pair for each named box. A button inside a form submits it unless it has `type="button"`.
  - id: html.get-and-post-forms
    title: GET and POST forms
    summary: A GET form puts its data in the address, which suits searches. A POST form sends it inside the request, for anything that changes data.
  - id: html.constraint-validation
    title: Built-in form checks
    summary: Attributes such as `required` and `type="email"` make the browser check a form and block sending until it passes.
  - id: html.responsive-images
    title: Responsive images
    summary: "`srcset` offers the same picture in several widths, so each screen downloads the smallest file that looks sharp."
  - id: html.image-dimensions
    title: Image width and height
    summary: The `width` and `height` attributes let the browser save space for an image before it loads, so the page doesn't jump.
  - id: html.metadata
    title: The head
    summary: "`head` holds facts about the page, such as its `title`, a description for search results and the `viewport` for phones."
