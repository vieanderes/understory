term: TDD
aka: [test-driven development, red green refactor]
short: Writing a failing test first, then the least code to pass it, then tidying up, in short loops.
explain: |
  Usually you write code, then test it, and sometimes not. Here you flip the order. Write
  a test for the next small behaviour and watch it fail (red). Write only enough code to
  pass it (green). Clean up with the test as a safety net (refactor). Repeat.

  The failing test proves the test can fail. The tiny steps keep you from building what
  nobody asked for. And writing the test first makes you design the code from the caller's
  side, which tends to give simpler interfaces. It suits rules and logic best; it's harder
  for UI layout.
analogy: Writing the exam question before you study the chapter, so you know exactly what you need to learn.
usage: Let's do the pricing rules with TDD; each rule is one red test and a few lines.
related: [unit-test, regression, assertion]
level: 2
lessons: [testing.tdd]
