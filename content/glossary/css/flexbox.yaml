term: flexbox
aka:
  - flex layout
  - flexible box layout
short: A one-direction layout that lines items up in a row or column and shares out the space.
explain: |
  A toolbar: icons on the left, a button pushed right, everything centred vertically.
  Doing that with floats or margins was painful for years.

  Set `display: flex` on the parent and its children line up along one axis.
  `justify-content` spaces them along it, `align-items` positions them across it, and
  `gap` puts space between. Each child's `flex` says how it grows and shrinks. Items
  refuse to shrink below their content by default, so add `min-width: 0` when long text
  overflows.
analogy: Books on a shelf. They sit in one row, and you decide whether they bunch left, spread out, or lean to the right.
example:
  language: css
  code: |
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar .spacer {
      flex: 1;  /* takes the leftover space */
    }
usage: That's one row of buttons, so flexbox will do; you don't need a grid.
twin:
  term: css-grid
  difference: Flexbox lays things out along one line and lets content set the sizes. Grid lays out rows and columns together, so the container sets the tracks and items line up both ways.
related:
  - css-grid
  - box-model
level: 1
lessons:
  - css.flexbox
