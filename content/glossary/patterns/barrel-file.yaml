term: barrel file
aka: [barrel, entry file, index re-export]
short: A module's index file that re-exports what outsiders are allowed to import.
explain: |
  A folder hides nothing on its own. Anyone can reach in and import any file, so every
  internal helper quietly becomes public. One entry file per feature fixes that: outsiders
  import from `bookings`, never from `bookings/lib/price.ts`, and a lint rule enforces it.

  Keep it short. A barrel that re-exports everything invites import cycles. It also makes bundlers and
  test runners load the whole folder to use one function. Re-export the public
  API and nothing more.
analogy: The reception desk of an office. Visitors ask at the front, not by wandering into the back rooms.
example:
  language: ts
  code: |
    // bookings/index.ts
    export { createBooking, cancelBooking } from './service';
    export type { Booking } from './types';
usage: Import it from the bookings barrel file, not the internal path, or the lint rule will fail the build.
related: [circular-dependency, information-hiding, cohesion]
level: 2
lessons: [arch.project-structure, js.modules]
