id: css.grid
title: Grid
objective: Build a card grid and a page layout with tracks, areas and auto-placement.
level: essential
minutes: 10
concepts: [css.grid, css.grid-tracks, css.grid-areas, css.grid-auto-placement]
prerequisites: [css.flexbox]
opening:
  text: >-
    You'll build a card grid that goes from one column on a phone to four on a laptop. Most
    dashboards and galleries you use work this way.

steps:
  - type: prose
    id: fr-is-leftover
    body: |-
      Flex lines items up in one direction. **Grid** places them in rows and columns at once,
      so cards line up both ways. `grid-template-columns` lists the columns, one size each:

      ```css
      .forecast { display: grid; grid-template-columns: 200px 1fr 2fr; }
      ```

      A column or a row is called a track. The `fr` unit is a share of the space left after
      the fixed tracks. `repeat(3, 1fr)` is short for `1fr 1fr 1fr`.

  - type: playground
    id: build-the-forecast
    concept: css.grid
    difficulty: 1
    prompt: >-
      Turn the forecast into a grid: give `.forecast` `display: grid`,
      `grid-template-columns: repeat(3, 1fr)` and `gap: 16px`. Watch six days snap into two
      even rows.
    html: |
      <div class="forecast">
        <div class="day">Mon<br>18°</div>
        <div class="day">Tue<br>21°</div>
        <div class="day">Wed<br>16°</div>
        <div class="day">Thu<br>14°</div>
        <div class="day">Fri<br>19°</div>
        <div class="day">Sat<br>23°</div>
      </div>
    css: |
      body { font-family: sans-serif; }
      .forecast { }
      .day {
        padding: 16px;
        background: aliceblue;
        border: 2px solid steelblue;
        text-align: center;
      }
    editable: [css]
    checks:
      - label: The forecast is a grid
        selector: .forecast
        style: { property: display, value: grid }
      - label: The days have a 16px gap
        selector: .forecast
        style: { property: gap, value: 16px }
    solution:
      css: |
        body { font-family: sans-serif; }
        .forecast {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
        }
        .day {
          padding: 16px;
          background: aliceblue;
          border: 2px solid steelblue;
          text-align: center;
        }
    hints:
      - All three declarations go on the container, `.forecast`.
      - The columns come from `grid-template-columns`.
      - '`gap: 16px;` spaces rows and columns alike.'

  - type: fill-blank
    id: fill-forecast-columns
    concept: css.grid-tracks
    difficulty: 2
    language: css
    prompt: >-
      Each row shows a city, a summary and a chart. The city gets a fixed 120px. The chart
      takes twice the share of the summary.
    template: |
      .row {
        display: grid;
        grid-template-columns: {{1}} {{2}} {{3}};
      }
    blanks:
      - key: '1'
        answer: 120px
      - key: '2'
        answer: 1fr
      - key: '3'
        answer: 2fr
    bank: [120px, 1fr, 2fr, 50%, 3fr, 2px]

  - type: prose
    id: columns-that-fit
    body: |-
      Here's the line behind most responsive card grids:

      ```css
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      ```

      `minmax(200px, 1fr)` makes a column at least 200px and at most one share. `auto-fit`
      makes as many as fit. One column on a phone, four on a laptop, and no extra rules.
      `auto-fill` does the same, but keeps empty columns when the items run out.

  - type: lab
    id: lab-flex-grid-playground
    concept: css.grid-tracks
    lab: flex-grid-playground
    intro: >-
      Two photos in a grid with room for three columns of at least 100px. Step through it
      with `auto-fill`, then switch to `auto-fit` and watch what happens to the empty column.
    preset:
      scenario: few-items
      hideSwitcher: true
    checkpoint:
      question: With `auto-fit`, what happens to the empty third column?
      difficulty: 2
      choices:
        - text: It collapses, and the two photos grow into its space
          correct: true
          feedback: >-
            Yes. `auto-fit` drops the empty track, so two columns share the row.
        - text: It stays empty, and the photos keep their width
          feedback: >-
            That's `auto-fill`, which keeps the empty column. `auto-fit` collapses it.
        - text: The photos shrink to 100px each
          feedback: >-
            100px is only the minimum. The maximum is `1fr`, so the columns grow into the
            space left.
    fallback:
      type: multiple-choice
      id: pick-auto-fit-width
      concept: css.grid-tracks
      difficulty: 2
      language: css
      code: |
        .gallery {
          display: grid;
          gap: 16px;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
      question: The row has room for four columns, but there are three photos. What happens?
      choices:
        - text: The empty column collapses, and the photos fill the row
          correct: true
          feedback: >-
            Right. `auto-fit` drops empty tracks, so three columns share the row.
        - text: An empty column stays at the end
          feedback: >-
            Most people pick this. That's `auto-fill`. `auto-fit` collapses the empty column
            and its gap.
        - text: Each photo stays 200px wide
          feedback: >-
            200px is only the minimum. The maximum is `1fr`, so the columns grow into the space
            left.

  - type: prose
    id: lines-and-areas
    body: |-
      You can also draw a layout with words. Write each row as a string of area names, then
      put each element in an area with `grid-area`:

      ```css
      .page { grid-template-areas: "top top" "side main"; }
      .menu { grid-area: side; }
      ```

      Repeating a name makes that area span. Here `top` covers both columns.

  - type: playground
    id: draw-the-dashboard
    concept: css.grid-areas
    difficulty: 3
    prompt: >-
      Each part names its `grid-area`, but no areas exist yet, so the parts pile up. On
      `.page`, draw them with `grid-template-areas`: header across the top, sidebar beside
      main, footer across the bottom.
    html: |
      <div class="page">
        <header>Weather</header>
        <nav>Cities</nav>
        <main>Today: sunny spells, 21°</main>
        <footer>Updated 9:00</footer>
      </div>
    css: |
      body { font-family: sans-serif; }
      .page {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 8px;
      }
      .page > * { padding: 16px; background: aliceblue; }
      header { grid-area: header; }
      nav { grid-area: sidebar; }
      main { grid-area: main; }
      footer { grid-area: footer; }
    editable: [css]
    checks:
      - label: The page is drawn with three rows of areas
        selector: .page
        style:
          property: grid-template-areas
          value: '"header header" "sidebar main" "footer footer"'
    solution:
      css: |
        body { font-family: sans-serif; }
        .page {
          display: grid;
          grid-template-columns: 100px 1fr;
          grid-template-areas:
            "header header"
            "sidebar main"
            "footer footer";
          gap: 8px;
        }
        .page > * { padding: 16px; background: aliceblue; }
        header { grid-area: header; }
        nav { grid-area: sidebar; }
        main { grid-area: main; }
        footer { grid-area: footer; }
    hints:
      - There are two columns, so each string holds two names.
      - The header spans both columns, so its row reads `"header header"`.
      - 'The middle row is `"sidebar main"`.'

  - type: prose
    id: auto-placement
    body: >-
      Items with no area fill the next free cell, row by row. That's **auto-placement**. When
      the rows run out, grid adds more.


      Rows you list in `grid-template-rows` get the sizes you gave them. Rows the grid adds
      are sized by `grid-auto-rows`, which fits their content unless you set it.

  - type: bug-hunt
    id: hunt-short-last-row
    concept: css.grid-auto-placement
    difficulty: 3
    language: css
    code: |
      .forecast {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 120px);
        gap: 16px;
      }
    prompt: >-
      Seven cards need a third row. The first six are 120px tall, but the seventh is only as
      tall as its text. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It sizes only the first two rows
        correct: true
        feedback: >-
          Yes. The added row is sized by `grid-auto-rows`, which fits content by default.
      - text: It stops the grid at two rows
        feedback: >-
          It feels like a limit, but grid adds rows as cards need them. The new row has no size
          set.
      - text: The gap is taken from the last row
        feedback: >-
          Gaps sit between tracks and never shrink one. The third row is short because nothing
          sized it.
    fix: |
      .forecast {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 120px;
        gap: 16px;
      }

  - type: explain-back
    id: explain-auto-fit-grid
    concept: css.grid-tracks
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why does `repeat(auto-fit, minmax(200px, 1fr))` give one column on a phone and four on
      a laptop, with no extra rules?
    rubric:
      - '`minmax(200px, 1fr)` makes each column at least 200px and at most one share.'
      - '`auto-fit` makes as many columns as fit the width, so the count changes with the screen.'
      - The columns then share the leftover space, so they always fill the row.
    modelAnswer: >-
      Each column must be at least 200px, and `auto-fit` makes as many as fit. A 360px phone
      fits one, a 1000px laptop fits four. Then `1fr` lets them share the space left over, so
      the row is always full. The grid works out the count from its own width, so no extra
      rules are needed.

recap:
  - Build columns with fixed sizes, `fr` shares and `gap`.
  - Make a card grid that picks its own column count with `auto-fit` and `minmax()`.
  - Draw a page with named areas, and size the rows the grid adds.

recall:
  - id: card-fr-leftover
    concept: css.grid-tracks
    front: What space does an `fr` track share, and what is taken out first?
    back: >-
      The space left over in the grid. Fixed tracks, content-sized tracks and every gap are
      taken out first.
  - id: card-auto-fill-or-fit
    concept: css.grid-tracks
    front: Three cards sit in a row with room for four columns. How do `auto-fill` and `auto-fit` differ?
    back: >-
      Both make four columns. `auto-fill` keeps the empty one, and `auto-fit` collapses it and
      its gap, so the three cards grow.
  - id: card-implicit-rows
    concept: css.grid-auto-placement
    front: Which property sizes a row that auto-placement adds, and what is its initial value?
    back: >-
      `grid-auto-rows`, and its initial value is `auto`. `grid-template-rows` sizes only the
      rows you list.
  - id: card-template-areas
    concept: css.grid-areas
    front: How do you make a header span both columns with `grid-template-areas`?
    back: >-
      Repeat its name across the row, as in `"header header"`, and give the header
      `grid-area: header`.

references:
  - kind: spec
    title: CSS Grid Layout Module Level 2
    authors: Tab Atkins Jr., Elika J. Etemad, Rossen Atanassov, Oriol Brufau
    venue: W3C
    url: https://www.w3.org/TR/css-grid-2/
    note: >-
      Defines tracks, `fr`, `minmax()`, `repeat()`, named areas, the auto-placement algorithm
      and track sizing.
    primary: true
    verified: true
  - kind: docs
    title: Grid
    venue: web.dev, Learn CSS
    url: https://web.dev/learn/css/grid
    note: Tracks, areas, auto-placement and the responsive card grid, with live demos.
    verified: true
  - kind: docs
