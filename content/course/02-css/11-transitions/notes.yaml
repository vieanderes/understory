summary: >-
  A **transform** changes how a box is drawn, moved, turned or scaled, without moving
  anything around it. A **transition** spreads a change of style over time, so a button
  fades to its hover colour instead of snapping. Together they give an interface its sense of
  cause and effect: you press, it responds, and you can see what changed.


  Motion has a cost and a risk. The cost is work for the browser on every frame, and some
  properties are far cheaper to animate than others. Transforms and `opacity` are cheap.
  Anything that moves the layout is expensive. The risk is people. Large or constant motion
  can make some readers dizzy or sick, so every animation needs a calmer version for readers
  who ask their system for less motion.


  Use transitions for small, quick feedback between two states: hover, focus, open and
  closed. Keep them short, around 150 to 300 milliseconds. For motion that plays on its own
  or loops, CSS has a separate tool, `@keyframes` animations.
remember:
  - A transform changes how a box is drawn, not where the layout puts it, so its neighbours never move.
  - Animate `transform` and `opacity` where you can, because the browser can change them without laying out the page again.
  - The transition that runs is the one on the state being entered, so a transition on the base rule applies in both directions.
  - '`transition-property` names what to animate, and properties that don''t change are ignored, so `all` animates changes you didn''t mean.'
  - "A transition can't run from `height: 0` to `height: auto` or from `display: none`, because there's no start or end value to animate between."
  - "Percentages in `translate` refer to the element's own size, so `translate: -50% -50%` moves a box back by half its width and height."
  - '`prefers-reduced-motion: reduce` matches readers who asked their system for less motion, and your CSS should calm or remove movement for them.'
sections:
  - title: What the browser does on every frame
    body: |-
      A smooth animation shows about 60 new pictures, or **frames**, every second. That leaves
      the browser roughly 16 milliseconds per frame. To draw a frame after a style changes, it
      can go through three kinds of work:

      - **Layout**: working out where every box goes and how big it is.
      - **Paint**: filling in the pixels of each box, such as text, colours and borders.
      - **Compositing**: putting the painted layers together on screen, like sheets of
        tracing paper stacked on each other.

      Changing `width`, `height`, `margin`, `top` or `left` moves boxes, so the browser redoes
      layout for everything the change can affect, then paints again. Changing `color` or
      `background-color` skips layout but repaints. Changing a transform or `opacity` can often
      skip both, because the browser can move or fade an already painted layer. That's why they
      stay smooth on a slow phone.

      You can measure the difference. We gave a 50px tall box `translate: 0 -8px` and asked
      Chromium where things were. In the layout, the box still started at 0, and the box after
      it still started at 50px. Only the drawing moved: on screen, the box's top edge sat at
      -8px. A box with `scale: 2` looked 200px wide but still took up 100px in the layout.

      That makes transforms the standard way to animate movement. A card that lifts on hover
      uses `translate`, a panel that slides in uses `translate`, and something that grows uses
      `scale`. The one catch comes from the positioning lesson. Any transform, even
      `translate: 0 0`, makes the box a containing block for fixed children, and it can
      start a new stacking context.
  - title: The rules of a transition
    body: |-
      A transition starts when a property's computed value changes, and it uses the
      `transition` declared in the rule that applies after the change. That's why the lesson
      put the transition on `.button`: the base rule applies in both directions. It also lets
      you give each direction its own timing:

      ```css
      .button {
        background-color: teal;
        transition: background-color 0.4s;
      }
      .button:hover {
        background-color: darkorange;
        transition-duration: 0.1s;
      }
      ```

      We checked it in Chromium: hovering started a 100ms transition, and leaving started one
      of about 400ms. A quick reaction and a gentle return often feel right.

      The full shorthand is `property duration timing-function delay`, and you can list
      several, separated by commas:

      ```css
      .card {
        transition: translate 0.2s ease-out, opacity 0.3s;
      }
      ```

      The **timing function** shapes the speed over time. `ease`, the default, starts gently
      and slows down at the end. `ease-out` starts fast and settles, which suits things that
      react to the reader.

      Transitions also reverse politely. If you leave a button halfway through its hover
      transition, the way back doesn't take the full time. We interrupted a 1-second fade at
      500ms, and the return took about 517ms.

      Some changes can't be transitioned. `height: auto` has no number to animate towards,
      so a panel going from `height: 0` to `auto` jumps: Chromium created no transition at all.
      An element switching from `display: none` has no box before the change, so a fade on it
      doesn't run either. To animate a panel open, animate a transform or `opacity`, or
      `max-height`, a cap on the height that works like `max-width`, set to a real number.
  - title: Motion for everyone
    body: |-
      Some people get dizzy, sick or lose their place when things slide, zoom or spin on
      screen. It's common among people with vestibular disorders, which affect the inner ear's
      sense of balance. Every major operating system has a setting to reduce motion, and CSS can
      read it with a media query:

      ```css
      .card {
        transition: translate 0.3s ease-out, background-color 0.3s;
      }
      .card:hover {
        translate: 0 -6px;
        background-color: honeydew;
      }
      @media (prefers-reduced-motion: reduce) {
        .card { transition: background-color 0.3s; }
        .card:hover { translate: none; }
      }
      ```

      In this version the lift goes away for those readers, but the hover still gives
      feedback through the colour change. That's usually better than removing every transition,
      because a fade or a colour change doesn't cause the same trouble as movement does. Keep
      the information, drop the travel.

      We checked the query with Playwright's reduced-motion emulation in Chromium: it matched,
      and the rules inside it applied.

      WCAG 2.2 has a success criterion for this, 2.3.3, Animation from Interactions. It asks
      that motion triggered by an interaction can be turned off unless it's essential. It's a
      level AAA criterion, the strictest level, but the media query makes it cheap to meet.
      Motion that starts by itself, lasts more than five seconds and plays alongside other
      content must also have a way to pause, stop or hide it. That's criterion 2.2.2, Pause,
      Stop, Hide, at level A.
  - title: Where a transform starts from, and in what order
    body: |-
      Rotating and scaling happen around a point called the **transform origin**. By default
      it's the centre of the box: for a 100px by 40px box, Chromium reported `50px 20px`. Change
      it with `transform-origin`, for example to grow a menu out of its top corner:

      ```css
      .menu {
        transform-origin: top right;
        scale: 0.95;
        opacity: 0;
        transition: scale 0.15s ease-out, opacity 0.15s;
      }
      .menu.open {
        scale: 1;
        opacity: 1;
      }
      ```

      Percentages in `translate` are a share of the element's own width and height, not its
      parent's. That powers a classic centring trick. An absolutely placed box at `top: 50%;
      left: 50%` has its top-left corner in the middle of the parent. `translate: -50% -50%`
      then pulls it back by half its own size, so its centre lands in the middle. In our test,
      a 200px by 100px box moved exactly 100px left and 50px up.

      Order matters when you combine movements. The separate `translate`, `rotate` and `scale`
      properties always apply in that order. The older `transform` property applies its
      functions in the order you write them, and rotating first turns the direction a later
      move goes. In our test, `transform: rotate(90deg) translate(50px)` moved the box down,
      not right, because the rotation had turned its axes.
pitfalls:
  - '**Putting the transition on the hover rule.** It applies only while hovering, so the change back snaps. Put the transition on the base rule, and use the hover rule only to change the timing if you need to.'
  - '**Writing `transition: all`.** Every property that changes animates, including ones changed by a media query or a class you add later, which can look glitchy and cost frames. Name the properties you mean.'
  - '**Animating layout properties.** A hover lift built with `margin-top` or `top` redoes layout every frame and can stutter on phones. Use `translate`.'
  - '**Expecting `height: auto` to animate.** There''s no end value to animate towards, so the panel jumps open. Animate a transform or `opacity`, or a `max-height` with a real number.'
  - '**Ignoring reduced motion.** Sliding panels and zooming cards can make some readers ill. Add a `prefers-reduced-motion: reduce` query that removes the movement but keeps a fade or colour change as feedback.'
  - '**Durations that are too long.** A 600ms hover makes the interface feel slow, because the reader waits for it. Keep feedback between about 150 and 300ms.'
interview:
  - question: Why is animating `transform` smoother than animating `top` or `margin`?
    answer: >-
      A transform changes only how a box is drawn, so the browser can skip layout and often
      painting too. Each frame has about 16ms at 60 frames a second. Changing `top` or
      `margin` moves the box in the layout. On every frame, the browser recalculates the
      positions of everything the change affects, then repaints. A transform leaves the
      layout alone, and the browser can move an already painted layer, which is cheap enough
      even on a slow phone. `opacity` works the same way. The trade-off is that because layout
      doesn't change, neighbours don't make room: a scaled card overlaps the next one. When
      the surrounding layout must really move, such as a list closing a gap, you need a
      different technique.
  - question: How do you make animations respect users who prefer reduced motion?
    answer: >-
      I use the `prefers-reduced-motion: reduce` media query to remove or soften movement,
      while keeping the feedback. Operating systems let people ask for less motion, often
      because movement triggers dizziness or nausea. Inside the query, I replace travel and
      zoom with something calm. A hover that lifts a card becomes a colour change, and a
      panel that slides in fades in instead. I don't blanket-remove all transitions,
      because instant changes can be harder to follow, and a fade doesn't cause the same
      problem. WCAG 2.2 criterion 2.3.3, Animation from Interactions, covers this at level
      AAA. The trade-off is maintaining two versions, so I keep motion in a few shared rules
      rather than scattered through every component.
  - question: What's the difference between a CSS transition and a CSS animation?
    answer: >-
      A transition animates between two states when a property changes, while an animation
      runs a sequence defined with `@keyframes`, on its own schedule. A transition needs a
      trigger, such as a hover, a focus or a class being added, and it knows only the start
      and end values. It reverses naturally when the state changes back. An animation can
      have many steps, start on page load, repeat or loop forever, and run without any change
      of state. I use transitions for interface feedback, like buttons, menus and cards, and
      animations for things like a loading spinner or an attention pulse. The trade-off is
      control: animations do more, but they're more code, and looping motion needs extra care
      for readers who prefer reduced motion.
