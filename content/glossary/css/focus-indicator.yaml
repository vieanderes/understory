term: focus indicator
aka: [focus ring, focus outline, ":focus-visible"]
short: The visible outline that shows which control the keyboard is on.
explain: |
  A mouse user sees the pointer. A keyboard user sees only the ring around the focused
  control. Remove it with `outline: none`, and they're pressing keys blind.

  `:focus-visible` styles the ring only when the browser thinks it's needed, mostly for
  keyboard use. So you can hide it on mouse clicks and keep it for keys. Make it at least
  2 px thick, with 3 to 1 contrast against its background.
analogy: The cursor in a text document. Without it, you'd type and hope.
example:
  language: css
  code: |
    button:focus-visible {
      outline: 2px solid var(--colour-focus);
      outline-offset: 2px;
    }
usage: The reset removed the focus indicator, so put back a ring on :focus-visible.
related: [keyboard-navigation, focus-order, pseudo-class, contrast-ratio]
level: 2
lessons: [design.keyboard-and-focus]
