term: stub
aka: [ stubbed, canned response ]
short: A fake stand-in that returns a fixed, ready-made answer, so the code under test gets predictable input.
explain: |
  Your function asks a weather service for today's temperature. In a test you don't want a
  real network call, or an answer that changes every day. So you swap in something that
  always says 18 degrees.

  It's there to set the scene, not to be checked. The test asserts on what your code did
  with the answer, never on whether it was called. Stub at the boundary you don't own, and
  make the fake answer realistic, including errors and empty results, or you test a world
  that doesn't exist.
analogy: A cardboard cut-out shop assistant in a fire drill. It always says the same line, so you can practise your part.
example:
  language: ts
  code: |
    const weather = { today: async () => ({ tempC: 18 }) };

    const advice = await clothingAdvice(weather);
    expect(advice).toBe('a light jacket');
usage: Stub the exchange-rate client to return 1.2, then check the converted total.
twin:
  term: mock
  difference: A stub hands your code an answer and the test checks your result. A mock records calls and the test checks those calls.
related: [ mock, fixture, unit-test, dependency-injection ]
level: 2
lessons: [ testing.doubles-and-integration ]
