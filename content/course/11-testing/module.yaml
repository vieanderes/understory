id: testing
number: 11
title: Testing
summary: "Evidence that software works and keeps working. Spend test effort where a failure would cost most, from unit tests to a load test."
why: "Tests let you change code without fear."
youCanBuild: "A test suite with unit tests, integration tests on a real database, one end-to-end journey and a load test."
concepts:
  - id: testing.automated-tests
    title: Automated tests
    summary: A test is code that calls your code with a known input and checks the answer, and a test runner such as Vitest runs every test and reports each one as passed or failed.
  - id: testing.assertions
    title: Assertions and matchers
    summary: "`expect(value)` with a matcher such as `toBe` or `toEqual` states what a value must be, and the test fails when it isn't."
  - id: testing.tests-that-cannot-fail
    title: A test that can't fail
    summary: A test with no assertion, or one that compares the code with itself, passes whatever the code does, so a new test is trusted only once you've seen it fail.
  - id: testing.coverage
    title: Coverage
    summary: Coverage reports which lines ran during the tests. It can't say whether any result was checked, so a high number proves little on its own.
  - id: testing.component-tests
    title: Component tests
    summary: A component test renders one component into a page in memory, finds elements by role and label as a user would, acts with user events and checks what's on screen.
  - id: testing.snapshot-tests
    title: Snapshot tests
    summary: A snapshot test saves rendered output and fails on any change, so updates get accepted without reading and the test stops catching bugs.
  - id: testing.risk-based-testing
    title: Risk-based testing
    summary: Test effort goes where a failure is both likely and costly, not evenly across the code.
  - id: testing.test-levels
    title: Test levels
    summary: Unit tests check one piece in isolation, integration tests check pieces working together, and end-to-end tests check the whole system through its interface.
  - id: testing.test-cost
    title: The cost of a test
    summary: A test costs time to write, run and maintain, and a test coupled to implementation details fails on harmless refactors.
  - id: testing.arrange-act-assert
    title: Arrange, act, assert
    summary: A test sets up its inputs, performs one action, and checks the outcome, in that order.
  - id: testing.boundary-values
    title: Boundary values
    summary: Faults cluster at the edges of input ranges, so tests use the values at, below and above each limit.
  - id: testing.test-naming
    title: Test names
    summary: A test name states the behaviour and the condition, so a failure reads as a sentence about what broke.
  - id: testing.mutation-testing
    title: Mutation testing
    summary: A tool changes the code in small ways and reruns the tests, and a surviving mutant marks behaviour that no test checks.
  - id: testing.red-green-refactor
    title: Red, green, refactor
    summary: Write a failing test, make it pass with the least code, then improve the design while the tests stay green.
  - id: testing.refactoring
    title: Refactoring
    summary: Changing the structure of code without changing its behaviour, which tests make safe to do.
  - id: testing.test-first-design
    title: Tests as the first client
    summary: Writing the test first makes you use the interface before it exists, which exposes an awkward design early.
  - id: testing.stubs-and-fakes
    title: Stubs and fakes
    summary: A stub returns canned answers and a fake is a working lightweight implementation, and neither checks how it was used.
    confusableWith: [testing.mocks]
  - id: testing.mocks
    title: Mocks and spies
    summary: A mock or spy records the calls it receives, so the test asserts on the interaction and not on the result.
    confusableWith: [testing.stubs-and-fakes]
  - id: testing.fake-at-the-boundary
    title: Fake at the boundary
    summary: Only what you do not own, such as the payment provider, the mail service or the clock, is replaced, behind an interface you do own.
  - id: testing.database-tests
    title: Integration tests on a real database
    summary: Tests run against the same database engine as production, each in a transaction or a fresh schema, so constraints and SQL are exercised.
  - id: testing.e2e
    title: End-to-end tests
    summary: A browser drives the running application through one user journey, so every layer is checked together.
  - id: testing.locators
    title: Locators and auto-waiting
    summary: A Playwright locator finds elements by role or label and retries until the element is actionable, which removes fixed sleeps.
  - id: testing.flakiness
    title: Flaky tests
    summary: A flaky test passes and fails on the same code, usually because of shared state, timing or a real network.
  - id: testing.property-based-testing
    title: Property-based testing
    summary: The test states a rule that holds for all inputs, and the framework generates inputs and shrinks a failing one to a minimal case.
  - id: testing.invariants
    title: Invariants
    summary: An invariant is a condition that holds before and after every operation, such as sold plus held never exceeding capacity.
  - id: testing.interleavings
    title: Testing interleavings
    summary: A concurrency test runs the same operations in many orders, by real parallel calls or a controlled scheduler, and checks the invariant after each.
  - id: testing.load-scenarios
    title: Load scenarios
    summary: A k6 scenario defines how virtual users or an arrival rate change over time, which models a ramp, a spike or a soak.
  - id: testing.percentiles
    title: Latency percentiles
    summary: The p95 is the latency that 95% of requests stay under, and it shows the slow tail that a mean hides.
  - id: testing.knee
    title: The knee of the curve
    summary: As load rises throughput flattens and latency climbs sharply at the knee, which marks the capacity of the bottleneck resource.
  - id: testing.contract-tests
    title: "Contract tests"
    summary: "A contract test checks one side of an API against a recorded agreement, so two services can be tested apart and still fit together."
  - id: testing.consumer-driven-contracts
    title: "Consumer-driven contracts"
    summary: "Each consumer records the requests it sends and the responses it relies on, and the provider's build replays them before it deploys."
  - id: testing.test-pyramid
    title: "The test pyramid"
    summary: "Many fast unit tests, fewer integration and contract tests, and a few end-to-end tests keep a suite quick and trustworthy."
