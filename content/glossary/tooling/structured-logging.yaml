term: structured logging
aka:
  - structured logs
  - JSON logging
  - key-value logging
short: Writing each log entry as named fields instead of a sentence, so machines can search and join them.
explain: |
  "User 42 failed to pay for order 913" reads well once, to a person. Finding every failed
  payment for one user across a million lines means writing a fragile pattern match.

  Log the same event as fields instead: an event name, `user_id`, `order_id`, a request id.
  Log tools can then filter, count and join on any field, and follow one request through
  every service it touched.

  Two traps. Inconsistent field names across services break the joins. And logging whole
  objects puts emails and tokens in a place many people can read.
analogy: A filled-in form instead of a handwritten letter. Same facts, but you can sort a pile of forms.
example:
  language: python
  code: |
    log.info(
        "payment_failed",
        extra={"user_id": user.id, "order_id": order.id, "request_id": rid},
    )
usage: Switch the worker to structured logging so we can filter failed jobs by tenant.
related:
  - observability
  - traceback
  - metrics
  - distributed-tracing
level: 2
lessons: [pro.production-python, cloud.observability, security.detection-and-logging]
