term: stakeholder
aka:
  - stakeholders
short: Anyone affected by some work or with a say in it, such as users or other teams.
explain: |
  Engineering work lands on people. A product manager waits for the feature, support answers the
  questions it raises, and finance reads its reports. Each of them is
  affected, and some can stop it.

  Each needs different things. A product manager wants dates and trade-offs. Support wants to
  know what changes for customers. An executive wants the impact and the decision in two lines.

  Find them early. A stakeholder who learns about a change at launch becomes an objection; one
  asked in week one becomes a reviewer.
analogy: Everyone with a key to a shared house. Change the locks and every one of them needs telling.
usage: Who's the stakeholder in finance for this report? Let's check the column names with them before we ship.
