id: testing.components
title: Testing a component
objective: Test a React component the way a user meets it, by role and label, and keep tests off its internals.
level: essential
minutes: 10
concepts: [testing.component-tests, testing.test-cost, testing.snapshot-tests]
prerequisites: [testing.doubles-and-integration, react.state-and-events, design.accessibility-foundations]
opening:
  text: >-
    You'll test a React component by clicking it the way a person would, in milliseconds and
    with no browser. Your tests will survive a redesign and still catch a button nobody can
    name.

steps:
  - type: prose
    id: what-a-component-test-is
    body: |-
      A **component test** checks one React component the way a person uses it. Testing
      Library draws it into a page held in memory, with no real browser. The React
      challenges in chapter 6 were marked this way:

      ```tsx
      test('adds a guest', async () => {
        const user = userEvent.setup();
        render(<GuestPicker />);
        await user.click(screen.getByRole('button', { name: 'Add a guest' }));
        expect(screen.getByText('Guests: 3')).toBeInTheDocument();
      });
      ```

      `screen` is that page. `getByRole` finds an element by its role and accessible name,
      as a screen reader does. `user` clicks and types like a person.

  - type: multiple-choice
    id: pick-query
    concept: testing.component-tests
    difficulty: 1
    language: tsx
    code: |
      <button className="btn-primary" data-testid="save">Save draft</button>
    question: Which query finds this button the way a user would?
    choices:
      - text: "`screen.getByRole('button', { name: 'Save draft' })`"
        correct: true
        feedback: >-
          Right. Its role and its words are what a person, or a screen reader, meets.
      - text: "`document.querySelector('.btn-primary')`"
        feedback: >-
          Nobody sees a class. Restyle the button and this test breaks for no reason.
      - text: "`screen.getByTestId('save')`"
        feedback: >-
          A test id is invisible to users. It still passes if the button loses its words.

  - type: prose
    id: waiting-for-the-page
    body: >-
      Some things appear a moment later, like a "Saved" message after a click. `getByText`
      looks once and fails if the text isn't there yet. `findByText` keeps looking for up to
      a second, so you `await` it.


      And `queryByText` returns `null` instead of failing. Use it to check that something is
      gone.

  - type: fill-blank
    id: fill-find-by
    concept: testing.component-tests
    difficulty: 2
    language: tsx
    prompt: The "Saved" message appears a moment after the click. Wait for it.
    template: |
      test('says when the draft is saved', async () => {
        const user = userEvent.setup();
        render(<SaveButton />);
        await user.click(screen.{{1}}('button', { name: 'Save' }));
        expect({{2}} screen.{{3}}('Saved')).toBeInTheDocument();
      });
    blanks:
      - key: '1'
        answer: getByRole
      - key: '2'
        answer: await
      - key: '3'
        answer: findByText
    bank: [getByRole, getByTestId, await, async, findByText, getByText]

  - type: prose
    id: test-what-the-user-sees
    body: >-
      People never see your state, your class names or which function ran. They see words,
      buttons, labels and whether a toggle is on.


      So test that. A test that reads a class name breaks when someone restyles the page. It
      can also pass while the page is broken for anyone who can't see the colour.

  - type: ai-review
    id: review-class-name-test
    concept: testing.test-cost
    difficulty: 3
    language: tsx
    request: Add a test for the favourite toggle.
    flawClass: logic
    code: |
      function FavouriteButton() {
        const [on, setOn] = useState(false);
        return (
          <button className={on ? 'fav on' : 'fav'} onClick={() => setOn(!on)}>
            Favourite
          </button>
        );
      }

      test('turns on when clicked', async () => {
        const user = userEvent.setup();
        render(<FavouriteButton />);
        await user.click(screen.getByRole('button', { name: 'Favourite' }));
        expect(screen.getByRole('button')).toHaveClass('on');
      });
    prompt: >-
      An assistant wrote this, and it passes. A screen reader user still can't tell if it's
      on. Tap the line at fault.
    lines: [14]
    reasons:
      - text: It checks a class, not anything a user perceives
        correct: true
        feedback: >-
          Yes. Add `aria-pressed={on}` and assert on that, as in chapter 8.
      - text: The button needs a test id
        feedback: >-
          A test id is invisible too. The state has to reach users, then the test.
      - text: The click needs a second `await`
        feedback: >-
          One `await` on the click is right. What the test checks is the problem.
    fix: |
      function FavouriteButton() {
        const [on, setOn] = useState(false);
        return (
          <button aria-pressed={on} onClick={() => setOn(!on)}>
            Favourite
          </button>
        );
      }

      test('turns on when clicked', async () => {
        const user = userEvent.setup();
        render(<FavouriteButton />);
        await user.click(screen.getByRole('button', { name: 'Favourite' }));
        expect(screen.getByRole('button')).toHaveAttribute('aria-pressed', 'true');
      });

  - type: prose
    id: snapshots
    body: >-
      A **snapshot test** saves what a component rendered into a file. On the next run it
      compares, and any change fails, even a fixed typo.


      So people learn to run `vitest -u`, which saves whatever renders now as the new right
      answer. After a few weeks nobody reads the difference, and the snapshot approves bugs.
      That's snapshot rot.

  - type: ai-review
    id: review-snapshot-update
    concept: testing.snapshot-tests
    difficulty: 3
    language: text
    request: CI is red on a snapshot test. Get it green.
    flawClass: logic
    code: |
      $ npx vitest run
        × basket summary
      Error: Snapshot `basket summary 1` mismatched

      Expected: ""<p>Total: £24.00</p>""
      Received: ""<p>Total: £NaN</p>""

      $ npx vitest run -u
        Snapshots  1 updated
            Tests  1 passed (1)
    prompt: >-
      An assistant ran these commands and pushed. CI is green. Tap the line at fault.
    lines: [8]
    reasons:
      - text: It saved `£NaN` as the new right answer
        correct: true
        feedback: >-
          Yes. The snapshot caught the bug, and the update threw that away.
      - text: '`-u` only works in watch mode'
        feedback: >-
          It works in any run. That's the danger: one flag and every snapshot agrees.
      - text: The old snapshot was out of date
        feedback: >-
          £24.00 was right. Read the difference before accepting it.
    fix: |
      $ npx vitest run
        × basket summary
      Received: ""<p>Total: £NaN</p>""

      # Read the difference. The total is broken, so fix the code, not the snapshot.

  - type: code-challenge
    id: write-guest-picker-tests
    concept: testing.component-tests
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    editable: '17-27'
    prompt: >-
      Finish the two tests for `GuestPicker`. It starts at 2 guests and never goes below 1.
      Find each button by its role and name.


      We'll run them on the real picker, then on three broken copies. Each copy must fail
      one of your tests.
    hints:
      - Click, then check the words on screen with `getByText`.
      - A copy may draw its buttons as + and -. A query by name notices.
      - "Start with `await user.click(screen.getByRole('button', { name: 'Add a guest' }));`"

  - type: explain-back
    id: explain-test-like-a-user
    concept: testing.component-tests
    difficulty: 3
    prompt: >-
      A teammate finds buttons by class name and checks the component's state. Why query by
      role and name, and check what's on screen instead?
    rubric:
      - Role and name are what users and screen readers meet, so the test uses the component as they do.
      - A redesign that keeps the behaviour leaves such a test green, where a class name would break it.
      - A button with no accessible name fails a role query, so the test catches an accessibility bug too.
    modelAnswer: >-
      Users never see a class or a state variable. They see a button called "Add a guest" and
      the words "Guests: 3". A test that does the same survives a redesign, because the words
      and roles stay put while classes change. It also catches more. If the button loses its
      name, a role query fails. That's a real bug for anyone using a screen reader.

recap:
  - Render a component, find elements by role and name, click with `user`, and check the screen.
  - Wait with `findBy` for things that appear later.
  - Read a snapshot's difference before you accept it, or skip the snapshot.

recall:
  - id: card-query-by-role
    concept: testing.component-tests
    front: "Why find a button with `getByRole('button', { name: ... })`?"
    back: >-
      It finds the button the way users and screen readers do, so the test survives a
      restyle and fails if the button loses its name.
  - id: card-find-by
    concept: testing.component-tests
    front: When do you use `findByText` instead of `getByText`?
    back: >-
      When the text appears a moment later. `findByText` keeps looking and is awaited.
  - id: card-class-name
    concept: testing.test-cost
    front: What's wrong with asserting that a toggle has the class `on`?
    back: >-
      Users can't see a class. The test breaks on a restyle and misses a state screen
      readers can't hear.
  - id: card-snapshot-rot
    concept: testing.snapshot-tests
    front: How does a snapshot test end up approving a bug?
    back: >-
      Someone updates it with `-u` without reading the difference, so the broken output
      becomes the new right answer.

references:
  - kind: docs
    title: Guiding Principles
    authors: Kent C. Dodds and Testing Library contributors
    venue: Testing Library documentation
    url: https://testing-library.com/docs/guiding-principles
    note: 'The principle behind the queries: the closer a test is to real use, the more it proves.'
    primary: true
    verified: true
  - kind: docs
    title: About Queries
    authors: Kent C. Dodds and Testing Library contributors
    venue: Testing Library documentation
    url: https://testing-library.com/docs/queries/about
    note: '`getBy`, `queryBy` and `findBy`, and the order of preference with `ByRole` first.'
    primary: true
    verified: true
  - kind: docs
    title: Snapshot
    authors: VoidZero Inc. and Vitest contributors
    venue: Vitest documentation
    url: https://vitest.dev/guide/snapshot.html
    note: How snapshots are stored and updated with `-u`.
    verified: true

deepDive: >-
  The page in memory has no layout and no style sheet, so a component test can't check that
  a button is blue or fits on a phone. That's the end-to-end test's job, next lesson, in a
  real browser.


  Snapshots aren't always rot. A small inline snapshot of a formatted string, reviewed like
  any other change, can be fine. The trouble is a large snapshot of a whole page, where the
  difference is too long to read, so nobody does.


  In the challenge your tests took the component as an argument, so we could pass in broken
  copies. In a real test file you'd import the component and render it directly.
