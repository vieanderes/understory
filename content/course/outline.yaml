# The planned lessons of the course, in course order. Source: docs/CURRICULUM.md.
# Ids and directory names here are fixed: a lesson is published under exactly this id, in
# exactly this folder. Schema: src/core/content/outline.ts. Checked by pnpm validate:content.
# The cs module is woven: its lessons live in 17-cs-fundamentals, and wovenAfter names the
# lesson each one follows in the journey.
modules:
  - id: basics
    dir: 00-basics
    lessons:
      - id: basics.first-program
        dir: 01-your-first-line-of-code
        title: Your first line of code
        objective: "Run code and print numbers and text with `console.log`."
        level: essential
        concepts: [basics.values, basics.console-log]
      - id: basics.variables
        dir: 02-variables
        title: Variables
        objective: "Give a value a name with `let` or `const`, and change it."
        level: essential
        concepts: [basics.variables, basics.let-and-const]
      - id: basics.operators
        dir: 03-maths-and-text
        title: Maths and text
        objective: Calculate with numbers and build text from values.
        level: essential
        concepts: [basics.arithmetic, basics.strings]
      - id: basics.conditions
        dir: 04-making-decisions
        title: Making decisions
        objective: "Compare values and choose what runs with `if` and `else`."
        level: essential
        concepts: [basics.comparisons, basics.if-else]
      - id: basics.loops
        dir: 05-repeating-things
        title: Repeating things
        objective: "Repeat work with `for` and `while` loops."
        level: essential
        concepts: [basics.for-loops, basics.while-loops]
      - id: basics.functions
        dir: 06-functions
        title: Functions
        objective: Write a function that takes inputs and returns a result.
        level: essential
        concepts: [basics.functions, basics.return-values]
      - id: basics.arrays
        dir: 07-lists
        title: Lists
        objective: Store values in an array, read them by index and loop over them.
        level: essential
        concepts: [basics.arrays, basics.array-methods]
      - id: basics.objects
        dir: 08-objects
        title: Objects
        objective: Group related values in an object and work with a list of objects.
        level: essential
        concepts: [basics.objects, basics.lists-of-objects]
      - id: basics.debugging
        dir: 09-errors-and-stack-traces
        title: Errors and stack traces
        objective: Read an error message, picture the call stack, and follow a stack trace to the bug.
        level: essential
        concepts: [basics.error-messages, basics.stack-trace]
      - id: basics.watching-code
        dir: 10-watching-code-run
        title: Watching code run
        objective: "Watch values change with `console.log`, and pause code with breakpoints and stepping."
        level: essential
        concepts: [basics.probes, basics.debugger]
      - id: basics.small-program
        dir: 11-a-small-program
        title: A small program
        objective: Build a to-do list program from everything in this chapter.
        level: essential
        concepts: [basics.program-design, basics.functions]
  - id: html
    dir: 01-html
    lessons:
      - id: html.first-page
        dir: 01-your-first-web-page
        title: Your first web page
        objective: Write headings and paragraphs, and nest elements into a whole page.
        level: essential
        concepts: [html.elements, html.nesting]
      - id: html.everyday-elements
        dir: 02-lists-links-and-images
        title: Lists, links and images
        objective: Build lists, link pages together and add images with useful `alt` text.
        level: essential
        concepts: [html.lists, html.attributes, html.alt-text]
      - id: html.the-dom
        dir: 03-the-dom
        title: The DOM
        objective: Read the tree a browser builds from HTML, and change the page with one line of JavaScript.
        level: essential
        concepts: [html.dom, html.dom-scripting, html.parsing]
      - id: html.semantic-structure
        dir: 04-semantic-structure
        title: Semantic structure
        objective: Choose buttons, landmarks and heading levels so every visitor can find their way.
        level: essential
        concepts: [html.semantic-elements, html.landmarks, html.headings, html.accessibility-tree]
      - id: html.links-and-urls
        dir: 05-links-urls-and-navigation
        title: Links and URLs
        objective: Write link and image paths that lead where you mean, and link to a place on the page.
        level: essential
        concepts: [html.url-resolution, html.fragments]
      - id: html.forms
        dir: 06-forms-and-native-validation
        title: Forms
        objective: Build a labelled form that sends the right data and checks it without JavaScript.
        level: essential
        concepts: [html.form-controls, html.form-submission, html.get-and-post-forms, html.constraint-validation]
      - id: html.media-and-head
        dir: 07-media-responsive-images-and-the-head
        title: Images and the head
        objective: Stop images from shifting the page, offer them in several sizes, and fill in the head.
        level: essential
        concepts: [html.image-dimensions, html.responsive-images, html.metadata]
  - id: css
    dir: 02-css
    lessons:
      - id: css.what-css-is
        dir: 01-what-css-is
        title: What CSS is
        objective: Write CSS rules that colour and shape a page, and pick out elements with a class.
        level: essential
        concepts: [css.rules, css.class-selectors, css.everyday-properties]
      - id: css.cascade
        dir: 02-selectors-and-the-cascade
        title: Selectors and the cascade
        objective: Target elements with selectors, and predict which rule wins when two clash.
        level: essential
        concepts: [css.cascade, css.specificity, css.inheritance]
      - id: css.box-model
        dir: 03-the-box-model
        title: The box model
        objective: Space a box with padding, border and margin, and stop it spilling off a phone.
        level: essential
        concepts: [css.box-model, css.box-sizing, css.margin-collapse]
        lab: box-model-explorer
      - id: css.display-and-flow
        dir: 04-display-and-flow
        title: Block, inline and display
        objective: "Predict how boxes flow down a page, switch it with `display`, and tame content that overflows."
        level: essential
        concepts: [css.normal-flow, css.display, css.overflow]
      - id: css.flexbox
        dir: 05-flexbox
        title: Flexbox
        objective: Build a nav bar, centre anything, and stop a long title pushing the rest off screen.
        level: essential
        concepts: [css.flexbox, css.flex-axes, css.flex-sizing]
      - id: css.grid
        dir: 06-grid
        title: Grid
        objective: Build a card grid and a page layout with tracks, areas and auto-placement.
        level: essential
        concepts: [css.grid, css.grid-tracks, css.grid-areas, css.grid-auto-placement]
        lab: flex-grid-playground
      - id: css.positioning
        dir: 07-positioning-and-z-index
        title: Positioning and z-index
        objective: "Pin a badge to a card, stick a header to the top, and explain why a `z-index` does nothing."
        level: essential
        concepts: [css.positioning, css.containing-block, css.stacking-context]
      - id: css.responsive-design
        dir: 08-responsive-design
        title: Units and responsive design
        objective: Size with relative units, and adapt a layout with media queries, container queries and `clamp()`.
        level: essential
        concepts: [css.relative-units, css.media-queries, css.container-queries, css.fluid-sizing]
      - id: css.custom-properties
        dir: 09-custom-properties
        title: Custom properties
        objective: Name values once with custom properties, and switch a whole page to a dark theme.
        level: essential
        concepts: [css.custom-properties, css.theming]
      - id: css.typography
        dir: 10-text-and-fonts
        title: Text and fonts
        objective: Choose a font stack, set comfortable lines of text, and load a web font without surprises.
        level: essential
        concepts: [css.text-styling, css.measure-and-scale, css.font-loading]
      - id: css.transitions
        dir: 11-transitions
        title: Transitions and transforms
        objective: Move, turn and scale elements, and animate a change smoothly.
        level: essential
        concepts: [css.transforms, css.transitions]
      - id: css.build-a-page
        dir: 12-build-a-page
        title: Build a page
        objective: Build a responsive event page from a plain one, with a header, a card grid and a theme.
        level: essential
        concepts: [css.page-layout, css.flexbox, css.grid]
      - id: css.modern-architecture
        dir: 13-modern-css-architecture
        title: Modern CSS architecture
        objective: "Organise a style sheet with `@layer`, nesting, `:has()` and logical properties."
        level: advanced
        concepts: [css.cascade-layers, css.nesting-and-has, css.logical-properties]
  - id: js
    dir: 03-javascript
    lessons:
      - id: js.meets-the-page
        dir: 01-javascript-meets-the-page
        title: JavaScript meets the page
        objective: Run a script in a page, change what it shows and react to a click.
        level: essential
        concepts: [js.page-scripts, js.event-listeners]
      - id: js.coercion
        dir: 02-values-types-coercion
        title: Values, types and coercion
        objective: "Predict what `+`, `==` and a condition do with mixed types, and turn form input into numbers."
        level: essential
        concepts: [js.types, js.coercion, js.equality, js.truthiness]
      - id: js.built-in-toolbox
        dir: 03-the-built-in-toolbox
        title: The built-in toolbox
        objective: Use the string, number, object, Set, Map and JSON helpers that everyday code relies on.
        level: essential
        concepts: [js.string-methods, js.numbers-and-math, js.object-and-set-helpers, js.json]
      - id: js.everyday-syntax
        dir: 04-everyday-syntax
        title: Everyday syntax
        objective: "Combine conditions with `&&`, `||` and `!`, read `?.` and `??`, and steer code with `switch`, `break` and `continue`."
        level: essential
        concepts: [js.logical-operators, js.optional-chaining, js.switch, js.loop-control]
      - id: js.destructuring-and-spread
        dir: 05-destructuring-and-spread
        title: Destructuring, spread and defaults
        objective: Unpack objects and arrays into variables, copy and merge them with spread, and give parameters defaults.
        level: essential
        concepts: [js.destructuring, js.spread-and-rest, js.default-values]
      - id: js.arrays
        dir: 06-arrays-and-iteration
        title: Arrays and iteration
        objective: "Write arrow functions for `map`, `filter`, `find` and `reduce`, and know which methods change the array."
        level: essential
        concepts: [js.arrow-functions, js.array-iteration, js.array-helpers, js.array-mutation]
      - id: js.closures
        dir: 07-scope-and-closures
        title: Variables, scope and closures
        objective: Trace which variable a function reads, and use a closure to keep state private.
        level: essential
        concepts: [js.declarations, js.scope, js.closures]
      - id: js.references-and-copying
        dir: 08-references-copying-and-immutability
        title: References, copying and immutability
        objective: Predict which changes two variables share, and update data without changing the original.
        level: essential
        concepts: [js.references, js.copying, js.immutable-updates]
      - id: js.errors
        dir: 09-control-flow-and-errors
        title: Errors
        objective: Throw, catch and clean up after errors, and never hide one.
        level: essential
        concepts: [js.errors, js.error-types, js.swallowed-errors]
      - id: js.changing-the-page
        dir: 10-changing-the-page
        title: Changing the page
        objective: Read what someone typed, switch classes, and add and remove elements from JavaScript.
        level: essential
        concepts: [js.form-values, js.class-list, js.creating-elements]
      - id: js.dom-events
        dir: 11-dom-and-events
        title: Events
        objective: React to typing and form submits, stop the browser's default action, and serve many rows with one listener.
        level: essential
        concepts: [js.event-propagation, js.event-delegation, js.default-actions]
      - id: js.prototypes-and-classes
        dir: 12-objects-prototypes-and-classes
        title: Classes and prototypes
        objective: Write a class with a constructor, methods and private fields, and see the prototype link underneath.
        level: essential
        concepts: [js.classes, js.prototypes, js.own-properties]
      - id: js.functions-and-this
        dir: 13-functions-and-this
        title: Functions and `this`
        objective: "Work out `this` from how a function is called, and keep it when a method becomes a click handler."
        level: essential
        concepts: [js.this, js.arrow-functions, js.call-apply-bind]
      - id: js.modules
        dir: 14-modules
        title: Modules
        objective: "Split code into files with `export` and `import`, and load them in the browser."
        level: essential
        concepts: [js.modules, js.named-and-default-exports, js.module-scripts]
      - id: js.promises
        dir: 15-promises-and-async-await
        title: Promises and async/await
        objective: "Wait for slow work with promises and `await`, catch its errors, and run several jobs at once."
        level: essential
        concepts: [js.promises, js.async-await, js.concurrent-awaits, js.promise-combinators]
      - id: js.event-loop
        dir: 16-the-event-loop
        title: The event loop
        objective: Explain why a long task freezes the page, and order timers, promise callbacks and painting.
        level: essential
        concepts: [js.event-loop, js.tasks, js.microtasks, js.rendering-steps]
        lab: event-loop-stepper
      - id: js.requests-and-responses
        dir: 17-requests-and-responses
        title: Browsers, servers and requests
        objective: Describe what a request and a response carry, and read a status code and a JSON body.
        level: essential
        concepts: [js.requests-and-responses, js.status-codes]
      - id: js.fetch-cancellation
        dir: 18-fetch-cancellation-and-timeouts
        title: Fetching data
        objective: "Load data with `fetch`, show it on the page, send JSON, and cancel requests you no longer need."
        level: essential
        concepts: [js.fetch, js.sending-data, js.cancellation]
      - id: js.live-search
        dir: 19-build-a-live-search
        title: Build a live search
        objective: Build a search page that fetches as you type, shows results and errors, and ignores stale answers.
        level: essential
        concepts: [js.fetch, js.cancellation, js.creating-elements]
  - id: ts
    dir: 04-typescript
    lessons:
      - id: ts.what-typescript-is
        dir: 01-what-typescript-is
        title: What TypeScript is
        objective: Write type annotations, read a type error, and know that types are gone when the code runs.
        level: essential
        concepts: [ts.type-checker, ts.annotations, ts.type-erasure]
      - id: ts.everyday-types
        dir: 02-typing-everyday-code
        title: Typing everyday code
        objective: Type variables, arrays, functions and objects, and handle a property that may be missing.
        level: essential
        concepts: [ts.type-inference, ts.function-and-array-types, ts.object-types, ts.optional-properties]
      - id: ts.structural-typing
        dir: 03-structural-typing
        title: Structural typing
        objective: Say whether an object fits a type by its shape, and catch a misspelt property.
        level: essential
        concepts: [ts.structural-typing, ts.excess-property-checks]
      - id: ts.narrowing
        dir: 04-unions-and-narrowing
        title: Unions and narrowing
        objective: "Handle a value that can be one of several things, including `null`, and make the build fail when a case is forgotten."
        level: essential
        concepts: [ts.union-types, ts.narrowing, ts.discriminated-unions, ts.exhaustiveness]
      - id: ts.typing-the-boundary
        dir: 05-typing-the-boundary
        title: Typing the boundary
        objective: "Check data from outside your code with `unknown` and a parser, instead of trusting `as`."
        level: essential
        concepts: [ts.unknown, ts.type-assertions, ts.runtime-schemas]
      - id: ts.generics
        dir: 06-generics
        title: Generics
        objective: Write one helper that works for any type and hands back the type it was given.
        level: essential
        concepts: [ts.generics, ts.generic-constraints, ts.type-argument-inference]
      - id: ts.advanced-types
        dir: 07-deriving-types
        title: Deriving types
        objective: "Build types from one source with `typeof`, `as const`, `satisfies` and helpers like `Partial` and `Omit`."
        level: essential
        concepts: [ts.keyof-and-typeof, ts.utility-types, ts.satisfies]
      - id: ts.strictness
        dir: 08-strictness
        title: Strictness and escape hatches
        objective: "Turn on the checks that catch crashes, and fix an error instead of hiding it with `any`, `as` or `!`."
        level: essential
        concepts: [ts.strict-flags, ts.escape-hatches]
      - id: ts.configuration
        dir: 09-typescript-in-a-project
        title: TypeScript in a project
        objective: "Set up `tsconfig.json`, match the module settings to what runs your code, and treat declaration files with care."
        level: advanced
        concepts: [ts.tsconfig, ts.module-resolution, ts.declaration-files]
        # Needs the terminal and the checks taught in Tooling, so it follows them.
        wovenAfter: pro.modern-javascript
  - id: tooling
    dir: 05-tooling
    lessons:
      - id: tooling.terminal
        dir: 01-the-terminal
        title: The terminal
        objective: Type commands in a terminal, and move between folders and read files with `pwd`, `ls`, `cd` and `cat`.
        level: essential
        concepts: [tooling.shell, tooling.paths]
      - id: tooling.pipes-and-exit-codes
        dir: 02-pipes-redirection-and-exit-codes
        title: Pipes, redirection and exit codes
        objective: Chain commands with `|`, save output with `>` and `>>`, and stop on failure with `&&`.
        level: essential
        concepts: [tooling.pipes-redirection, tooling.exit-codes]
      - id: tooling.node
        dir: 03-what-node-is
        title: What Node is
        objective: Run JavaScript files with Node, read its errors, and pass settings in through `process.env`.
        level: essential
        concepts: [tooling.node-runtime, tooling.node-errors, tooling.process-env]
      - id: tooling.node-and-npm
        dir: 04-node-and-npm
        title: npm and packages
        objective: Install and use a package, run scripts, and keep installs repeatable with ranges and a lockfile.
        level: essential
        concepts: [tooling.packages, tooling.package-json, tooling.semver, tooling.lockfile]
      - id: tooling.git-basics
        dir: 05-git-from-zero
        title: Git from zero
        objective: Save snapshots of a project with `git add` and `git commit`, read its history, and keep junk out with `.gitignore`.
        level: essential
        concepts: [tooling.git-commits, tooling.staging, tooling.gitignore]
      - id: tooling.git-as-a-graph
        dir: 06-git-as-a-graph
        title: Branches and merging
        objective: Work on a branch, merge it back, resolve a conflict, and get lost work back with the reflog.
        level: essential
        concepts: [tooling.git-graph, tooling.merge-rebase, tooling.reflog]
      - id: tooling.remotes
        dir: 07-remotes-and-pull-requests
        title: Remotes and pull requests
        objective: Clone a repository, push and pull commits, and open a pull request for review.
        level: essential
        concepts: [tooling.remotes, tooling.pull-requests]
      - id: tooling.working-with-ai
        dir: 08-working-with-ai
        title: Working with AI without losing skill
        objective: Apply generation-then-comprehension, and decide what to delegate.
        level: essential
        concepts: [tooling.ai-comprehension, tooling.ai-delegation]
      - id: tooling.what-a-build-does
        dir: 09-what-a-build-does
        title: What a build does
        objective: Tell a dev server from a production build, follow source through transpiling and bundling, and read a source map.
        level: essential
        concepts: [tooling.transpiling, tooling.bundling, tooling.tree-shaking, tooling.source-maps]
      - id: tooling.quality-gates
        dir: 10-quality-gates
        title: Quality gates
        objective: Set up linting, formatting and type-checking, and keep pre-commit and CI checks the same.
        level: essential
        concepts: [tooling.linting, tooling.formatting, tooling.type-checking, tooling.ci-parity]
      - id: tooling.configuration-and-environment
        dir: 11-configuration-and-environment
        title: Configuration and environment
        objective: Check the environment with a schema, keep secrets out of the bundle, and separate build-time from runtime config.
        level: essential
        concepts: [tooling.env-schema, tooling.client-bundle-secrets, tooling.build-and-runtime-config]
  - id: react
    dir: 06-react
    lessons:
      - id: react.what-react-is
        dir: 01-what-react-is
        title: What React is
        objective: "Describe part of a page as a component, write JSX with braces and `className`, and put it on the page with `createRoot`."
        level: essential
        concepts: [react.declarative-ui, react.components, react.jsx]
      - id: react.props-and-composition
        dir: 02-props-and-children
        title: Props and children
        objective: "Pass data into components with props, fill them with `children`, and show parts of the page only when a condition holds."
        level: essential
        concepts: [react.props, react.children, react.conditional-rendering]
      - id: react.state-and-events
        dir: 03-state-and-events
        title: State and events
        objective: "Respond to clicks with event handlers, remember values with `useState`, and follow the rules every hook shares."
        level: essential
        concepts: [react.events, react.state, react.rules-of-hooks]
      - id: react.ui-as-a-function-of-state
        dir: 04-ui-as-a-function-of-state
        title: UI as a function of state
        objective: Follow a click through trigger, render and commit, and keep components pure so rendering changes nothing else.
        level: essential
        concepts: [react.render-and-commit, react.jsx, react.purity]
      - id: react.state-as-a-snapshot
        dir: 05-state-as-a-snapshot
        title: State as a snapshot
        objective: Predict what a render sees, with batching and updater functions.
        level: essential
        concepts: [react.state-snapshot, react.batching, react.updater-functions]
      - id: react.lists-and-keys
        dir: 06-lists-and-keys
        title: Lists and keys
        objective: "Render a list from an array with `map`, give each item a stable key, and predict what state survives a reorder."
        level: essential
        concepts: [react.rendering-lists, react.keys, react.state-preservation]
      - id: react.updating-objects-and-arrays
        dir: 07-updating-objects-and-arrays
        title: Updating objects and arrays
        objective: Change objects and arrays in state by making new copies, so React sees the change and renders.
        level: essential
        concepts: [react.updating-objects, react.updating-arrays]
      - id: react.sharing-state
        dir: 08-sharing-state
        title: Sharing state
        objective: Lift state to the closest common parent so components agree, and hand a value deep down the tree with context.
        level: essential
        concepts: [react.lifting-state, react.context]
      - id: react.forms-and-actions
        dir: 09-forms
        title: Forms
        objective: "Choose a controlled or uncontrolled input, submit with `<form action={fn}>`, and show a pending state while it saves."
        level: essential
        concepts: [react.controlled-inputs, react.uncontrolled-inputs, react.form-actions]
      - id: react.effects
        dir: 10-effects
        title: Effects
        objective: Keep a component in step with something outside React, with the right dependencies and cleanup, and skip effects you don't need.
        level: essential
        concepts: [react.effects, react.effect-dependencies, react.effect-cleanup, react.derived-values]
      - id: react.fetching-data
        dir: 11-fetching-data
        title: Fetching data
        objective: Load data when a component appears, show loading and error states, and ignore answers that arrive too late.
        level: essential
        concepts: [react.fetching-data, react.stale-responses]
      - id: react.state-placement
        dir: 12-reducers-and-url-state
        title: Reducers and URL state
        objective: Gather update rules into a reducer, and keep state people share or reload in the URL.
        level: essential
        concepts: [react.reducers, react.url-state]
      - id: react.build-a-small-app
        dir: 13-build-a-small-app
        title: Build a small app
        objective: Build a small app from a sketch, with the least state that works, a form, a filtered list and loaded data.
        level: essential
        concepts: [react.thinking-in-react, react.derived-values, react.fetching-data]
      - id: react.hooks-and-refs
        dir: 14-refs-and-custom-hooks
        title: Refs and custom hooks
        objective: Keep values and DOM nodes in refs, and move repeated stateful logic into hooks of your own.
        level: advanced
        concepts: [react.refs, react.custom-hooks]
      - id: react.performance
        dir: 15-performance
        title: Performance
        objective: "Measure a slow render, then fix it with `useMemo`, `memo` or a transition, and know what the React Compiler does."
        level: advanced
        concepts: [react.use-memo, react.use-callback, react.transitions, react.compiler]
  - id: next
    dir: 07-nextjs
    lessons:
      - id: next.what-nextjs-adds
        dir: 01-what-nextjs-adds
        title: What Next.js adds
        objective: Create a Next.js app, run it, and say what Next.js adds to React.
        level: essential
        concepts: [next.framework, next.create-and-run, next.server-rendering]
      - id: next.app-router
        dir: 02-app-router
        title: Pages, layouts and links
        objective: Turn folders into pages, share a layout, link between pages, and show loading and error states.
        level: essential
        concepts: [next.file-routing, next.layouts, next.links, next.loading-and-error]
      - id: next.server-and-client-components
        dir: 03-server-and-client-components
        title: Server and Client Components
        objective: "Say where each component runs, mark the interactive parts with `'use client'`, and keep both renders equal."
        level: essential
        concepts: [next.server-components, next.client-components, next.serialisable-props, next.hydration]
      - id: next.loading-data
        dir: 04-loading-data
        title: Loading data on the server
        objective: Load data in an async Server Component, keep secrets on the server, and stream a slow part in.
        level: essential
        concepts: [next.server-data, next.environment-variables, next.streaming]
      - id: next.rendering-spectrum
        dir: 05-the-rendering-spectrum
        title: Static and dynamic pages
        objective: Read the build output, tell static pages from dynamic ones, and keep a page's data fresh.
        level: essential
        concepts: [next.static-rendering, next.dynamic-rendering, next.client-rendering]
      - id: next.content-and-static-sites
        dir: 06-content-driven-and-static-sites
        title: Content sites and static export
        objective: Give each page a title and a share preview, use `next/image` and `next/font`, and export a site as plain files.
        level: essential
        concepts: [next.metadata, next.image-and-font, next.mdx, next.static-export]
  - id: design
    dir: 08-design-systems-and-accessibility
    lessons:
      - id: design.accessibility-foundations
        dir: 01-who-accessibility-is-for
        title: Who accessibility is for
        objective: Describe how people use a page with assistive technology, and give every control a role, a name and a state.
        level: essential
        concepts: [design.assistive-technology, design.accessible-name, design.roles-and-states]
      - id: design.keyboard-and-focus
        dir: 02-keyboard-and-focus
        title: Keyboard and focus
        objective: Make every control reachable with Tab, keep the focus order in step with the layout, and show where focus is.
        level: essential
        concepts: [design.keyboard-access, design.focus-order, design.focus-visible]
      - id: design.contrast-colour-and-motion
        dir: 03-contrast-colour-and-motion
        title: Contrast, colour and motion
        objective: Check text against the WCAG contrast rules, never let colour carry a message alone, and calm motion for people who ask.
        level: essential
        concepts: [design.wcag, design.contrast, design.colour-alone, design.reduced-motion]
      - id: design.design-tokens
        dir: 04-design-tokens
        title: Design systems and tokens
        objective: Explain what a design system is, split tokens into a palette and roles, and theme a page for dark mode.
        level: essential
        concepts: [design.tokens, design.colour-roles, design.theming, design.colour-scheme]
      - id: design.component-apis
        dir: 05-component-apis-and-variants
        title: Components with good APIs
        objective: Build a shared Button on the native element, give it variants, and let types refuse a wrong value.
        level: essential
        concepts: [design.native-semantics, design.variants, design.constrained-props]
      - id: design.utility-first-css
        dir: 06-utility-first-css
        title: Utility-first CSS with Tailwind
        objective: "Style markup with Tailwind's utility classes, read its theme as design tokens, and extract a component when classes repeat."
        level: essential
        concepts: [design.utility-classes, design.tailwind-theme, design.type-and-spacing-scale, design.component-extraction]
      - id: design.accessible-widgets
        dir: 07-accessible-widgets
        title: Accessible widgets
        objective: "Reach for native widgets first, build a modal with `dialog` that handles focus, and follow the ARIA pattern when there's no native element."
        level: essential
        concepts: [design.native-widgets, design.focus-management, design.aria-patterns]
      - id: design.forms-that-help
        dir: 08-forms-that-help
        title: Forms that help
        objective: Label every field so the label stays, link hints and errors to their fields, and group related choices.
        level: essential
        concepts: [design.form-labels, design.error-messages, design.field-groups]
      - id: design.i18n-and-forms
        dir: 09-internationalisation
        title: Internationalisation
        objective: "Format dates, money and counts for any locale with `Intl`, and mark a page's language and direction."
        level: advanced
        concepts: [design.locale-formatting, design.pluralisation, design.rtl]
  - id: backend
    dir: 09-backend-and-apis
    lessons:
      - id: backend.what-a-backend-is
        dir: 01-what-a-backend-is
        title: What a backend is
        objective: "Say what a server and a backend do, and read a real request and response with `curl`."
        level: essential
        concepts: [backend.client-server, backend.curl]
      - id: backend.how-a-page-reaches-you
        dir: 02-how-a-page-reaches-you
        title: How a page reaches you
        objective: Name the parts of a URL and the hops a request makes, and tell from an error which hop failed.
        level: essential
        concepts: [backend.url, backend.request-journey]
        lab: request-journey
      - id: backend.first-endpoint
        dir: 03-your-first-endpoint
        title: Your first endpoint
        objective: Write a handler that routes by method and path, reads JSON and answers with JSON and a status.
        level: essential
        concepts: [backend.handlers, backend.routing]
      - id: backend.http-in-depth
        dir: 04-http-in-depth
        title: Methods and status codes
        objective: "Send any method with `curl`, answer with the status a client expects, and know which requests are safe to repeat."
        level: essential
        concepts: [backend.http-methods, backend.status-codes, backend.safe-and-idempotent]
      - id: backend.api-design
        dir: 05-api-design
        title: API design
        objective: Name resources as nouns at stable URLs, filter a collection, and page a growing list with a cursor.
        level: essential
        concepts: [backend.resources, backend.pagination]
      - id: backend.error-responses
        dir: 06-error-responses
        title: Errors clients can use
        objective: Answer every failure with a true status and one error shape, and turn an unexpected crash into a logged 500.
        level: essential
        concepts: [backend.error-shapes, backend.server-errors]
      - id: backend.validation
        dir: 07-validation-and-the-trust-boundary
        title: Validation at the trust boundary
        objective: Parse every request body at the boundary, keep only the fields you named, and answer bad input with a 400.
        level: essential
        concepts: [backend.trust-boundary, backend.parse-dont-validate, backend.client-side-checks]
      - id: backend.sessions-and-tokens
        dir: 08-sessions-cookies-and-tokens
        title: Sessions, cookies and tokens
        objective: Remember a signed-in user with a session cookie, set its safety flags, and weigh a session against a JWT.
        level: essential
        concepts: [backend.authentication, backend.cookies, backend.server-sessions, backend.jwt]
      - id: backend.authorisation
        dir: 09-authorisation
        title: Authorisation
        objective: Write ownership checks and roles, and find an IDOR.
        level: essential
        concepts: [backend.authorisation, backend.ownership-checks, backend.roles, backend.idor]
      - id: backend.oauth-and-passkeys
        dir: 10-oauth-oidc-and-passkeys
        title: Signing in with another account
        objective: "Follow the \"Sign in with\" redirect flow, check its `state`, and say what PKCE, an ID token and a passkey add."
        level: advanced
        concepts: [backend.oauth, backend.pkce, backend.oidc, backend.passkeys]
      - id: backend.calling-other-apis
        dir: 11-calling-other-apis
        title: Calling other APIs from your server
        objective: Keep an API key on the server, call a model or payment API with it, and turn its failures into clear errors.
        level: essential
        concepts: [backend.api-keys, backend.upstream-failures]
      - id: backend.rate-limits
        dir: 12-rate-limits
        title: Rate limits
        objective: "Limit each caller's requests with a counter, answer `429` with `Retry-After`, and retry politely when you're the one limited."
        level: essential
        concepts: [backend.rate-limiting, backend.backoff]
      - id: backend.webhooks
        dir: 13-webhooks
        title: Webhooks
        objective: Receive events from another service, check their signature on the raw body, and handle repeats and reordering.
        level: essential
        concepts: [backend.webhook-signatures, backend.webhook-retries, backend.idempotent-handlers]
      - id: backend.payments
        dir: 14-payments-with-stripe
        title: Payments with Stripe
        objective: Take a card payment with Stripe Checkout, mark an order paid only from a verified webhook, and refund it.
        level: essential
        concepts: [backend.stripe-checkout, backend.payment-intents, backend.sca, backend.refunds]
      - id: backend.files
        dir: 15-files-and-object-storage
        title: Files and object storage
        objective: Accept an upload with a size and type check, store it in object storage, and hand out signed URLs.
        level: advanced
        concepts: [backend.object-storage, backend.signed-urls, backend.image-pipelines]
      - id: backend.realtime
        dir: 16-realtime
        title: Realtime and streaming
        objective: Push updates to the browser with server-sent events or a WebSocket, stream a model's answer, and know what open connections cost.
        level: advanced
        concepts: [backend.polling, backend.sse, backend.websockets, backend.connection-cost]
      - id: backend.api-evolution
        dir: 17-api-evolution
        title: Changing an API safely
        objective: Tell a compatible change from a breaking one, rename a field with expand and contract, and choose between REST, RPC and GraphQL.
        level: advanced
        concepts: [backend.versioning, backend.compatibility, backend.rest-rpc-graphql]
  - id: db
    dir: 10-databases
    lessons:
      - id: db.what-a-database-is
        dir: 01-what-a-database-is
        title: What a database is
        objective: "Say what a database, a table and SQL are, and run your first `SELECT` against Postgres."
        level: essential
        concepts: [db.databases, db.select-basics]
      - id: db.reading-rows
        dir: 02-reading-rows
        title: Finding the rows you want
        objective: "Filter with `WHERE`, sort with `ORDER BY`, keep the first few with `LIMIT`, and find missing values with `IS NULL`."
        level: essential
        concepts: [db.filtering, db.sorting-and-limit, db.null]
      - id: db.changing-rows
        dir: 03-changing-rows
        title: Adding, changing and deleting rows
        objective: "Add rows with `INSERT`, change them with `UPDATE` and remove them with `DELETE`, touching only the rows you mean."
        level: essential
        concepts: [db.insert, db.update-and-delete]
      - id: db.relational-model
        dir: 04-the-relational-model
        title: Keys and relations
        objective: Give each table a primary key, link tables with foreign keys, and keep each fact in one place.
        level: essential
        concepts: [db.tables-and-keys, db.foreign-keys, db.normalisation]
      - id: db.sql-queries
        dir: 05-sql-queries
        title: Joining tables
        objective: "Combine tables with `JOIN` and `LEFT JOIN`, and spot a join that repeats rows."
        level: essential
        concepts: [db.joins, db.join-fanout]
      - id: db.grouping
        dir: 06-counting-and-grouping
        title: Counting and grouping
        objective: "Summarise rows with `count`, `GROUP BY` and `HAVING`, and know the order a query runs in."
        level: essential
        concepts: [db.aggregation, db.select-pipeline]
      - id: db.schema-design
        dir: 07-schema-design-in-practice
        title: Designing tables
        objective: "Choose column types, store money and time correctly, and let `NOT NULL`, `UNIQUE` and `CHECK` refuse bad rows."
        level: essential
        concepts: [db.column-types, db.money-and-time, db.constraints]
      - id: db.from-code
        dir: 08-querying-from-code
        title: Querying from code
        objective: "Query Postgres from a server with `$1` parameters, see why gluing input into SQL is an injection, and replace N+1 queries with one."
        level: essential
        concepts: [db.drivers-and-parameters, db.sql-injection, db.n-plus-one]
      - id: db.indexes
        dir: 09-indexes
        title: Indexes
        objective: "Turn a full-table read into an index lookup, read the difference in `EXPLAIN`, and spot when an index can't help."
        level: essential
        concepts: [db.btree-index, db.composite-index, db.index-selectivity]
        lab: btree-index-explorer
      - id: db.reading-explain
        dir: 10-reading-explain
        title: Reading `EXPLAIN`
        objective: "Read a real query plan, find the clue that points at the slow part, and run `EXPLAIN ANALYZE` safely."
        level: advanced
        concepts: [db.query-plan, db.explain-analyze]
      - id: db.transactions
        dir: 11-transactions-and-acid
        title: Transactions
        objective: "Group writes with `BEGIN` and `COMMIT` so they all happen or none do, and never leave a transaction open."
        level: essential
        concepts: [db.transactions, db.acid, db.atomicity]
      - id: db.constraints
        dir: 12-constraints-as-the-last-line-of-defence
        title: Constraints as the last line of defence
        objective: Close the gap between checking and writing with `UNIQUE` and conditional updates, so two requests at once can't break a rule.
        level: essential
        concepts: [db.unique-under-concurrency, db.inventory-invariant]
      - id: db.isolation-levels
        dir: 13-isolation-levels-and-anomalies
        title: Two writers at once
        objective: "Spot a lost update, fix it with an atomic `UPDATE` or `FOR UPDATE`, and know what read committed and serializable promise."
        level: advanced
        concepts: [db.anomalies, db.read-committed, db.row-locks, db.serializable]
        lab: isolation-anomaly-stepper
      - id: db.migrations
        dir: 14-migrations
        title: Migrations
        objective: Change the schema of a live database with migration files, safe defaults and expand and contract.
        level: essential
        concepts: [db.migrations, db.expand-contract, db.ddl-locks]
      - id: db.row-level-security
        dir: 15-row-level-security-and-the-supabase-model
        title: Row-level security and the Supabase model
        objective: Write policies so each user sees only their rows, and keep the service key off the browser.
        level: essential
        concepts: [db.rls-policies, db.supabase-roles, db.service-key]
      - id: db.storage-and-pooling
        dir: 16-storage-pooling-and-redis
        title: Scaling a database
        objective: Pool connections, read from replicas, cache with Redis and understand sharding, in the order a growing app needs them.
        level: advanced
        concepts: [db.connection-pooling, db.read-replicas, db.redis, db.shard-key]
  - id: testing
    dir: 11-testing
    lessons:
      - id: testing.first-test
        dir: 01-your-first-test
        title: Your first test
        objective: "Write a test with `test` and `expect`, read what the runner prints, and make sure the test can fail."
        level: essential
        concepts: [testing.automated-tests, testing.assertions, testing.test-naming, testing.tests-that-cannot-fail]
      - id: testing.what-to-test
        dir: 02-what-to-test
        title: What to test
        objective: Test behaviour rather than code, pick a test level by risk, and read coverage for what it can't prove.
        level: essential
        concepts: [testing.test-cost, testing.test-levels, testing.risk-based-testing, testing.coverage]
      - id: testing.unit-tests
        dir: 03-unit-tests
        title: Unit tests
        objective: Write tests with arrange, act, assert, cover boundaries, and kill mutants.
        level: essential
        concepts: [testing.arrange-act-assert, testing.boundary-values, testing.mutation-testing]
      - id: testing.tdd
        dir: 04-the-tdd-loop
        title: The TDD loop
        objective: Apply red, green, refactor to a pricing rule, writing the next failing test yourself.
        level: essential
        concepts: [testing.red-green-refactor, testing.refactoring, testing.test-first-design]
      - id: testing.doubles-and-integration
        dir: 05-test-doubles-and-integration
        title: Test doubles and integration
        objective: Stub and spy on what you don't own, control the clock, and test against a real database.
        level: essential
        concepts: [testing.stubs-and-fakes, testing.mocks, testing.fake-at-the-boundary, testing.database-tests]
      - id: testing.components
        dir: 06-testing-a-component
        title: Testing a component
        objective: Test a React component the way a user meets it, by role and label, and keep tests off its internals.
        level: essential
        concepts: [testing.component-tests, testing.test-cost, testing.snapshot-tests]
      - id: testing.e2e-playwright
        dir: 07-end-to-end-with-playwright
        title: End-to-end with Playwright
        objective: Automate one purchase path, and fix a flaky test.
        level: essential
        concepts: [testing.e2e, testing.locators, testing.flakiness]
      - id: testing.property-based
        dir: 08-property-based-and-concurrency-tests
        title: Property-based and concurrency tests
        objective: State rules that hold for every input, check model output the same way, and test calls that overlap.
        level: advanced
        concepts: [testing.property-based-testing, testing.invariants, testing.interleavings]
      - id: testing.load-testing
        dir: 09-load-testing-with-k6
        title: Load testing with k6
        objective: Read latency and throughput, find the knee, and gate a release on percentiles.
        level: advanced
        concepts: [testing.load-scenarios, testing.percentiles, testing.knee]
      - id: testing.contract-tests
        dir: 10-contract-tests
        title: "Contract tests"
        objective: "Check that a consumer and a provider agree on an API with consumer-driven contracts, and place them in the test pyramid."
        level: advanced
        concepts: [testing.contract-tests, testing.consumer-driven-contracts, testing.test-pyramid]
  - id: security
    dir: 12-security
    lessons:
      - id: security.threat-modelling
        dir: 01-threat-modelling
        title: What attackers want
        objective: "Say what security means for a web developer, read the OWASP Top 10 as a map, and write a threat model for a small app."
        level: essential
        concepts: [security.owasp-top-ten, security.assets-and-attackers, security.attack-surface, security.stride]
      - id: security.xss-and-csp
        dir: 02-xss-csp-and-security-headers
        title: Cross-site scripting and CSP
        objective: "Run an XSS attack against your own page, stop it with `textContent` and escaping, and add a Content Security Policy as a second wall."
        level: essential
        concepts: [security.xss, security.output-encoding, security.csp, security.security-headers]
      - id: security.csrf-and-cors
        dir: 03-csrf-samesite-and-cors
        title: CSRF and SameSite cookies
        objective: "Tell an origin from a site, see how another site can send requests with your cookies, and stop it with `SameSite` and a CSRF token."
        level: essential
        concepts: [security.csrf, security.samesite]
      - id: security.same-origin-and-cors
        dir: 04-same-origin-policy-and-cors
        title: Same-origin policy and CORS
        objective: "Say what the same-origin policy blocks, allow only the origins you trust with CORS, and never pair `*` with credentials."
        level: essential
        concepts: [security.same-origin-policy, security.cors, security.cors-credentials]
      - id: security.injection-and-ssrf
        dir: 05-injection-and-ssrf
        title: Injection and SSRF
        objective: "Close every glued value with parameters, pick names such as a sort column from an allow-list, and stop your server fetching URLs it shouldn't."
        level: essential
        concepts: [security.sql-injection, security.parameterised-queries, security.ssrf, security.allow-lists]
      - id: security.broken-auth
        dir: 06-broken-authentication-and-access-control
        title: Broken authentication and access control
        objective: "Issue a fresh session at login, make reset links single-use, and prove access rules with owner, stranger and signed-out tests."
        level: essential
        concepts: [security.session-fixation, security.reset-flows, security.access-control-tests]
      - id: security.cryptography
        dir: 07-cryptography-for-engineers
        title: Hashing and passwords
        objective: "Tell hashing from encryption, and store and check passwords with a slow, salted hash."
        level: essential
        concepts: [security.hashing, security.password-hashing]
      - id: security.encryption-and-tls
        dir: 08-encryption-signatures-and-tls
        title: Encryption, signatures and TLS
        objective: "Choose encryption, a MAC or a signature for a job, and say what HTTPS protects and what it doesn't."
        level: advanced
        concepts: [security.encryption, security.mac-and-signatures, security.tls-guarantees]
      - id: security.secrets
        dir: 09-secrets-and-key-management
        title: Secrets and key management
        objective: "Keep secrets out of the repository and the browser bundle, give each key only the access it needs, and rotate one after a leak."
        level: essential
        concepts: [security.secret-storage, security.key-rotation, security.least-privilege]
      - id: security.jwt-pitfalls
        dir: 10-jwt-pitfalls
        title: "JWT pitfalls"
        objective: "Read what a JWT reveals, verify one with a library and pinned settings, keep it where scripts can't reach, and plan for logout."
        level: advanced
        concepts: [security.jwt-verification, security.token-storage, security.token-revocation]
      - id: security.uploads-and-paths
        dir: 11-file-uploads-and-path-traversal
        title: File uploads and path traversal
        objective: "Accept uploads by checking size and type and naming files yourself, and stop `../` from reaching files outside a folder."
        level: essential
        concepts: [security.upload-validation, security.path-traversal]
      - id: security.abuse-and-privacy
        dir: 12-abuse-bots-and-privacy
        title: Abuse, bots and privacy
        objective: "Rate-limit a login, raise the cost of bots without blocking people, and collect only the personal data you need."
        level: advanced
        concepts: [security.rate-limiting, security.bot-defence, security.data-minimisation]
      - id: security.detection-and-logging
        dir: 13-detection-and-logging
        title: Detection and logging
        objective: Log the events that matter without leaking secrets, tell detection from prevention, and alert on signals worth waking up for.
        level: essential
        concepts: [security.security-logging, security.detection-vs-prevention, security.alerting-signals]
      - id: security.incident-response
        dir: 14-incident-response
        title: Incident response
        objective: Handle a leaked key or a taken-over account step by step, contain it first, and write a review without blame.
        level: advanced
        concepts: [security.ir-lifecycle, security.containment, security.blameless-postmortem]
      - id: security.defence-in-depth
        dir: 15-defence-in-depth-and-zero-trust
        title: Defence in depth and zero trust
        objective: "Layer independent checks, verify every request instead of trusting the network, and switch off what you don't use."
        level: essential
        concepts: [security.defence-in-depth, security.zero-trust, security.hardening]
      - id: security.attacker-playbook
        dir: 16-the-attackers-playbook
        title: Attacking your own app, legally
        objective: "See your app the way an attacker does, find a privilege escalation, stay inside the law, and report a flaw responsibly."
        level: essential
        concepts: [security.authorised-testing, security.reconnaissance, security.privilege-escalation, security.responsible-disclosure]
      - id: security.supply-chain
        dir: 17-supply-chain
        title: "When a dependency turns malicious"
        objective: "Spot a risky change in a lockfile diff, know what an install script can reach, and respond when a package you use is hijacked."
        level: advanced
        concepts: [security.install-scripts, security.compromised-dependency]
      - id: security.owasp-top-ten
        dir: 18-owasp-top-ten
        title: "Capstone: audit an app"
        objective: "Audit a small app for the flaws this chapter taught, name each fix, make a check fail closed, and review AI-written code with a security eye."
        level: essential
        concepts: [security.security-review, security.fail-closed]
  - id: perf
    dir: 13-performance
    lessons:
      - id: perf.measure-first
        dir: 01-measure-first
        title: Measure first
        objective: Name latency, throughput and percentiles, time code honestly, and set a latency budget people can feel.
        level: essential
        concepts: [perf.latency-and-percentiles, perf.timing-code, perf.latency-budgets]
      - id: perf.web-vitals
        dir: 02-how-fast-a-page-feels
        title: How fast a page feels
        objective: Read LCP, INP and CLS in a real report, tell lab data from field data, and stop content jumping as a page loads.
        level: essential
        concepts: [perf.core-web-vitals, perf.lab-and-field-data, perf.layout-shift]
      - id: perf.critical-rendering-path
        dir: 03-the-critical-rendering-path
        title: What keeps the screen blank
        objective: "Say what the browser needs before its first paint, unblock scripts with `defer` and `async`, and load the main image and fonts early."
        level: essential
        concepts: [perf.critical-rendering-path, perf.render-blocking, perf.resource-hints, perf.lcp-assets]
      - id: perf.cost-of-javascript
        dir: 04-the-cost-of-javascript
        title: The cost of JavaScript
        objective: Say what every byte of script costs, read an interaction's INP, keep clicks answered during heavy work, and see why a server-rendered page can ignore a tap.
        level: essential
        concepts: [perf.javascript-cost, perf.long-tasks, perf.inp, perf.hydration-cost]
      - id: perf.shipping-less-javascript
        dir: 05-shipping-less-javascript
        title: Shipping less JavaScript
        objective: "Read a bundle report, load code only when it's needed with `import()`, and fail the build when the bundle grows past a budget."
        level: essential
        concepts: [perf.bundle-analysis, perf.code-splitting, perf.performance-budgets]
      - id: perf.graphics-performance
        dir: 06-smooth-animation
        title: Smooth animation
        objective: "Animate with `requestAnimationFrame` and the time between frames, move things with `transform`, and stop a loop from forcing layout again and again."
        level: advanced
        concepts: [perf.render-loop, perf.compositor-animation, perf.layout-thrashing]
      - id: perf.memory-leaks
        dir: 07-memory-leaks
        title: Memory leaks
        objective: Say what keeps memory alive, find a leak by comparing heap snapshots, and clean up listeners, timers and caches.
        level: essential
        concepts: [perf.memory-leaks, perf.heap-snapshots, perf.cleanup]
      - id: perf.caching-layers
        dir: 08-caching-in-the-browser-and-cdn
        title: Caching in the browser and CDN
        objective: "Let the browser reuse a response with `Cache-Control`, check a stale one with an `ETag`, and keep private pages out of a shared CDN."
        level: essential
        concepts: [perf.http-caching, perf.cdn-caching]
      - id: perf.server-caching
        dir: 09-caching-on-the-server
        title: Caching on the server
        objective: Cache slow work and model calls under the right key, for the right time, and clear an entry the moment its data changes.
        level: essential
        concepts: [perf.application-caching, perf.cache-invalidation, perf.caching-model-calls]
      - id: perf.backend-performance
        dir: 10-finding-a-slow-request
        title: Finding a slow request
        objective: Find where a request's time goes, replace an N+1 loop with one query and check its plan, and see why many calls meet the slow tail.
        level: advanced
        concepts: [perf.profiling, perf.n-plus-one, perf.tail-latency]
  - id: scale
    dir: 14-concurrency-and-scale
    lessons:
      - id: scale.concurrency-vs-parallelism
        dir: 01-many-things-at-once
        title: Many things at once
        objective: Tell waiting work from computing work, and picture the copies of a server that run at once.
        level: essential
        concepts: [scale.concurrency, scale.parallelism, scale.cpu-and-io-bound, scale.server-copies]
      - id: scale.backpressure
        dir: 02-how-many-at-once
        title: How many at once
        objective: Cap the calls in flight, batch model calls, and stop a buffer from growing without limit.
        level: essential
        concepts: [scale.bounded-concurrency, scale.batching, scale.backpressure]
      - id: scale.web-workers
        dir: 03-cpu-work-off-the-main-thread
        title: CPU work off the main thread
        objective: Spot CPU work that blocks a server or a page, and move it to a worker thread with messages.
        level: advanced
        concepts: [scale.blocking-the-loop, scale.worker-threads, scale.web-workers, scale.message-passing]
      - id: scale.race-conditions
        dir: 04-race-conditions
        title: Race conditions
        objective: Find the gap between a check and its write, and close it in one process and across servers.
        level: essential
        concepts: [scale.race-condition, scale.check-then-act, scale.lost-update]
      - id: scale.locks
        dir: 05-optimistic-locking
        title: Optimistic locking
        objective: Stop a stale save from erasing a newer one with a version column, and retry or report the conflict.
        level: advanced
        concepts: [scale.optimistic-locking, scale.pessimistic-locking]
      - id: scale.overselling
        dir: 06-holds-that-expire
        title: Holds that expire
        objective: Hold stock while a buyer pays, expire it safely, and check that no transition can oversell.
        level: advanced
        concepts: [scale.holds, scale.hold-expiry, scale.invariant-proof]
        lab: overselling-simulator
      - id: scale.idempotency
        dir: 07-idempotency
        title: Idempotency
        objective: Make a retried request safe with an idempotency key, so a lost reply never charges anyone twice.
        level: advanced
        concepts: [scale.idempotency-keys, scale.deduplication-window]
      - id: scale.queues-and-workers
        dir: 08-queues-and-workers
        title: Queues and workers
        objective: Move long jobs to a queue, acknowledge only after the work, and retry or park failures.
        level: advanced
        concepts: [scale.queues, scale.at-least-once, scale.visibility-timeout, scale.dead-letter-queue]
      - id: scale.cron
        dir: 09-scheduled-jobs
        title: Scheduled jobs
        objective: Run a scheduled job once across servers, survive missed runs, and keep schedules in UTC.
        level: advanced
        concepts: [scale.single-runner, scale.leases, scale.catch-up, scale.schedule-time-zones]
      - id: scale.failure-handling
        dir: 10-failure-handling
        title: Failure handling
        objective: Give calls deadlines, retry with backoff and jitter, and fail fast with breakers and load shedding.
        level: advanced
        concepts: [scale.timeouts, scale.retries-with-jitter, scale.circuit-breaker, scale.load-shedding]
  - id: arch
    dir: 15-architecture
    lessons:
      - id: arch.coupling-and-cohesion
        dir: 01-coupling-cohesion-and-information-hiding
        title: Coupling, cohesion and information hiding
        objective: Say where the line between two modules belongs, hide what's likely to change, and refactor a caller that reaches into another module.
        level: essential
        concepts: [arch.coupling, arch.cohesion, arch.information-hiding]
      - id: arch.project-structure
        dir: 02-organising-a-codebase
        title: Organising a codebase
        objective: Group code by feature, give each module one entry file a lint rule enforces, and find and break an import cycle.
        level: essential
        concepts: [arch.feature-folders, arch.public-module-api, arch.circular-dependencies]
      - id: arch.monorepos
        dir: 03-monorepos-and-workspaces
        title: Monorepos and workspaces
        objective: Link a repository's packages with workspaces, use a package's `exports` as its public API, and tell a real boundary from files moved into a folder.
        level: essential
        concepts: [arch.monorepos, arch.workspaces]
      - id: arch.layers
        dir: 04-layers-and-thin-handlers
        title: Layers and thin handlers
        objective: Put each piece of code in its layer, keep handlers and components thin, and move a business rule where every entry point passes it.
        level: essential
        concepts: [arch.layering, arch.thin-handlers]
      - id: arch.hexagonal
        dir: 05-ports-and-adapters
        title: Ports and adapters
        objective: Point dependencies inward with a port the domain owns, pass adapters in, and test the rules against an in-memory adapter.
        level: advanced
        concepts: [arch.ports-and-adapters, arch.dependency-rule, arch.dependency-injection]
      - id: arch.model-behind-a-port
        dir: 06-where-the-model-call-lives
        title: Where the model call lives
        objective: Put the call to a language model in one adapter behind a port, swap providers without touching the rules, and judge the swap with evals.
        level: advanced
        concepts: [arch.model-port, arch.evals-at-the-boundary]
      - id: arch.domain-modelling
        dir: 07-domain-modelling
        title: Domain modelling
        objective: Replace flags with a state machine, enforce each invariant in one place, and wrap amounts in value objects.
        level: advanced
        concepts: [arch.state-machines, arch.invariants, arch.value-objects]
      - id: arch.monolith-and-services
        dir: 08-monolith-or-services
        title: Monolith or services
        objective: Tell a monolith, a modular monolith and services apart, and count what a network boundary costs before you split.
        level: advanced
        concepts: [arch.monolith, arch.modular-monolith, arch.services, arch.network-boundary-costs]
      - id: arch.event-driven
        dir: 09-events-and-the-outbox
        title: Events and the outbox
        objective: Tell events from commands, say what a message broker does, and publish events through an outbox so none is lost.
        level: advanced
        concepts: [arch.events-and-commands, arch.outbox]
      - id: arch.cqrs-and-event-sourcing
        dir: 10-read-models-and-event-logs
        title: Read models and event logs
        objective: Plan for a read model's lag, decide when reads deserve their own model, and know when an event log is worth keeping.
        level: advanced
        concepts: [arch.read-models, arch.cqrs, arch.event-sourcing]
      - id: arch.tenants
        dir: 11-serving-many-customers
        title: Serving many customers
        objective: Keep each customer's data apart in one deployment, take the tenant from the session, and scope every query through one store.
        level: advanced
        concepts: [arch.multi-tenancy, arch.tenant-context]
      - id: arch.adrs-and-twelve-factor
        dir: 12-recording-decisions
        title: Recording decisions
        objective: Write an architecture decision record with its context, decision and costs, and supersede it when the decision changes.
        level: essential
        concepts: [arch.adrs, arch.trade-offs]
  - id: cloud
    dir: 16-cloud-and-devops
    lessons:
      - id: cloud.where-code-runs
