deepDive: >-
  The fan-out and its tests ran in Python 3.13 against a fake worker that sleeps and
  counts. No model was called.


  **How far tokens multiply.** One provider reported that its agents used about four times
  the tokens of a chat, and its multi-agent research system about fifteen times. The
  multi-agent version won on broad research questions with many independent threads. It
  fits poorly where the parts depend on each other, as in most coding tasks.


  **Evaluator and optimiser.** The generator and evaluator loop from Loops that run for
  hours is the fifth named shape. It belongs here too: one call proposes, another checks
  against criteria, and code decides when to stop.


  **Estimates and actuals.** The challenge admits work by estimate, so the decision never
  depends on timing. A real harness also counts what each worker really spent, and stops
  starting new workers once the running total passes the budget.


  **Handoffs that transfer control.** Some frameworks offer a handoff where one agent passes
  the whole conversation to another, as a support bot passes to a billing bot. The same
  rule applies: decide what state crosses the line. A summary with the constraints is
  usually better than every message so far.
