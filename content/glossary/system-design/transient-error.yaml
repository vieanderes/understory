term: transient error
aka: [ transient failure, temporary error, retryable error ]
short: A failure that may pass if the same request is sent again a little later.
explain: |
  Some errors are bad luck: the server was busy, the connection dropped, a request timed
  out. Try again in a moment and it often works. Other errors are about the request itself,
  like a malformed body or a bad key. Those fail the same way every time.

  Retry only the first kind. Rate limits (`429`), overloads, most `5xx` responses and
  timeouts are usually transient. A `400` or `401` is permanent, so retrying it only wastes
  time and quota.
analogy: A busy phone line. Ringing back in a minute helps; ringing a wrong number again doesn't.
usage: The client retries every error, including the 401; make it retry only transient errors.
twin:
  term: retry
  difference: A transient error is the kind of failure. A retry is the response to it, and it only makes sense for that kind.
related: [ retry, jitter, status-code, circuit-breaker ]
level: 2
lessons: [ ai.failures, interview.llm-client-build ]
