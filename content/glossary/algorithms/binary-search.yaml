term: binary search
aka: [ bisection, lower bound, upper bound, bisect ]
short: Finding a value in sorted data by checking the middle and discarding the half it can't be in.
explain: |
  In a sorted list of a million names, checking one by one takes up to a million looks.
  Check the middle instead. If your name comes later, the whole first half is gone.

  Each look halves what's left, so a million items take about twenty looks: O(log n). It
  only works if the data is sorted, or the yes or no answer flips once along the range.

  That second form is the useful one in interviews. Find the first index where a check
  becomes true, even over a range of possible answers. Most bugs are off-by-one errors at
  the edges, so keep a clear rule for what the range means.
analogy: Guessing a number between 1 and 100 when someone says "higher" or "lower". Always guess the middle and you need seven tries at most.
example:
  language: python
  code: |
    def first_at_least(nums, target):
        lo, hi = 0, len(nums)        # answer lies in [lo, hi)
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] < target:
                lo = mid + 1          # too small: drop the left half
            else:
                hi = mid              # could be the answer: keep it
        return lo
usage: The prices are sorted, so a binary search finds the first one over budget in log n steps.
related: [ invariant, off-by-one-error, time-complexity, binary-search-tree ]
level: 1
