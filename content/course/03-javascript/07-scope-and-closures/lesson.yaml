deepDive: >-
  A `let` variable exists from the top of its block, but it can't be read until its line has
  run. Reading it earlier throws a `ReferenceError`. The gap is called the temporal dead zone.
  A `var` read that early gives `undefined` instead, which hides the mistake.


  A `for` loop with `let` does something subtle. Each turn gets a fresh variable, and the
  value is copied forward before the update runs. That's why `i++` still works while every
  handler keeps its own number.


  A closure keeps its variables alive as long as the function exists. Keep a handler on a
  page, and everything it closes over stays in memory too. That's one common source of
  memory leaks.
