term: delta sync
aka: [ incremental sync, delta, change sync ]
short: Copying only the records that changed since the previous run, found by a timestamp or a change feed.
explain: |
  Fetching a million records to find the hundred that changed wastes hours. Ask instead for
  what changed since your last run.

  It needs a dependable way to find changes, such as an `updated_after` filter. It also needs
  a watermark saying where the last run started. Reach back a little before it, because clocks
  drift and some records arrive late, and deduplicate what you see twice. Deltas usually miss
  deletions, so pair them with an occasional full pass.
analogy: Reading only the new messages in a group chat, not scrolling back through the whole history.
example:
  language: ts
  code: |
    const startedAt = new Date();
    for await (const contact of api.contacts({ updatedAfter: minusMinutes(watermark, 5) })) {
      await upsert(contact);
    }
    await saveWatermark(startedAt);
usage: The delta sync missed edits made during the run, because we saved the end time as the watermark.
twin:
  term: full-sync
  difference: A delta sync copies only the changes since last time. A full sync copies everything, slower but simpler, and it notices deletions.
related: [ full-sync, watermark, clock-skew, cursor-pagination, polling ]
level: 2
lessons: [ integrations.full-and-delta-sync ]
