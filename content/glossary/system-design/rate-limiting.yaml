term: rate limiting
aka: [ rate limit, rate limiter ]
short: Capping how many requests one client may make in a time window, and refusing the rest.
explain: |
  One buggy script or one attacker can send thousands of requests a second. Without a
  cap, they slow everyone else down or run up your bill.

  The server counts requests per key, such as a user, an API key or an IP address, and
  replies `429 Too Many Requests` past the limit, ideally with `Retry-After`. A **token
  bucket** allows short bursts while holding the average. With several servers, the counts
  must live somewhere shared, like Redis, or each server allows the full amount.
analogy: A nightclub bouncer letting in so many people per minute, however long the line outside.
example:
  language: http
  code: |
    HTTP/1.1 429 Too Many Requests
    Retry-After: 30
    RateLimit-Policy: 100;w=60
usage: Add rate limiting on the login endpoint, per account and per IP, before someone tries a million passwords.
related: [ load-shedding, backpressure, retry, guardrail ]
level: 1
lessons: [ sysdesign.rate-limiting ]
