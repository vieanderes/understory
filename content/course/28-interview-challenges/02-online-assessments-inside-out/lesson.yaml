id: interview.online-assessments
title: Online assessments inside out
objective: "Work the way a hidden-test scorer rewards: read the complexity line, test your own cases, and never submit code that does not compile."
level: essential
minutes: 10
concepts: [interview.hidden-tests, interview.expected-complexity, interview.platform-conduct]
prerequisites: [interview.landscape]
opening:
  text: >-
    You'll know how a timed online test turns your code into a score. That tells you where
    the points really are.

steps:
  - type: prose
    id: what-the-platform-is
    body: |-
      What you need: JavaScript or TypeScript, and Big-O notation. An **online coding
      assessment** is a site employers use for timed tests. Each task gives you a statement and an editor.

      **Run** executes the examples and any cases you add, and shows what your function
      returned. It never tells you the expected answer for your own cases. **Submit**, or
      the clock reaching zero, sends your code to the hidden tests.

  - type: prose
    id: hidden-tests
    body: |-
      Each task has at least six **hidden tests**. Your score is the share that pass.

      **Correctness tests** use small inputs and nasty corners. **Performance tests** use
      large inputs, sized so that anything slower than expected runs out of time. The report
      marks each test `OK`, `WRONG ANSWER` or `TIMEOUT ERROR`, and names the complexity it
      detected.

  - type: multiple-choice
    id: example-passes
    concept: interview.hidden-tests
    difficulty: 1
    question: Your code returns the right answer for the example in the task. What does that tell you about your score?
    choices:
      - text: Very little. The example isn't scored.
        correct: true
        feedback: >-
          Right. The score comes from hidden tests you never see.
      - text: You've earned at least half
        feedback: >-
          It feels like a head start. The example isn't one of the scored tests at all.
      - text: You've got full marks for correctness
        feedback: >-
          Correctness is judged on small, tricky inputs you haven't seen. One example proves little.

  - type: ai-review
    id: review-missing-integer
    concept: interview.hidden-tests
    difficulty: 4
    language: js
    request: Return the smallest positive whole number that does not appear in the array.
    flawClass: edge-case
    code: |
      function solution(A) {
        const seen = new Set(A);
        let max = 0;
        for (const x of A) if (x > max) max = x;
        for (let n = 1; n <= max; n++) {
          if (!seen.has(n)) return n;
        }
        return max;
      }
    prompt: >-
      An assistant wrote this. The example `[1, 3, 6, 4, 1, 2]` returns `5`, as it should.
      The example has a gap, so it never reaches the last line. Tap the line at fault.
    lines: [8]
    reasons:
      - text: With no gap, the answer is one past `max`
        correct: true
        feedback: >-
          Yes. `[1, 2, 3]` gives 3, and all negatives give 0. Both need `max + 1`.
      - text: '`max` should start at `-Infinity`'
        feedback: >-
          Starting at 0 is fine, since only positive answers count. The return is what's off.
      - text: A `Set` can't hold negative numbers
        feedback: >-
          A `Set` holds any value. The loop never reaches negatives anyway.
    fix: |
      return max + 1;

  - type: code-challenge
    id: write-min-split-gap
    concept: interview.expected-complexity
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: split.starter.py
      solution: split.solution.py
      tests: split.tests.py
    prompt: >-
      Write `minSplitGap(entries)`. Each number is a ledger entry, from -1,000 to 1,000.
      Split the list into two non-empty parts, a front and a back. Return the smallest
      possible difference between their sums.


      N is from 2 to 100,000. Expected worst-case time: O(N).


      So `minSplitGap([3, 1, 2, 4, 3])` is `1`: the front `[3, 1, 2]` sums to 6, the back
      to 7. The hidden tests include two entries, all negatives and 100,000 entries.
    hints:
      - The brute force adds both parts again for every split. That's the O(N²) part.
      - The back is always the total minus the front.
      - Work out the total once, then walk the list keeping a running front sum.

  - type: prose
    id: platform-conduct
    body: |-
      Three rules about conduct. Code that doesn't compile scores **zero** on every test.
      So a working slow version beats a broken fast one.

      Employers can see pastes and time away from the tab. When an assistant is switched
      on, they can read its transcript. Ask it narrow questions you'd happily show.

  - type: fill-blank
    id: fill-check-table
    concept: interview.hidden-tests
    difficulty: 2
    prompt: >-
      Some editors block imports, so there's no test library. Finish this helper and
      run every named case through it.
    language: ts
    template: |
      function check(name: string, actual: unknown, expected: unknown): void {
        const ok = {{1}}(actual) === JSON.stringify(expected);
        console.log(`${ok ? 'PASS' : 'FAIL'} ${name}`);
      }
      const cases: [string, number[], number][] = [
        ['task example', [3, 2, -2, 5, -3], 3],
        ['zero only', [0, 0], 0],
      ];
      for (const [name, input, expected] of cases) {
        check(name, {{2}}, expected);
      }
    blanks:
      - key: '1'
        answer: JSON.stringify
      - key: '2'
        answer: solution(input)
    bank: [JSON.stringify, String, solution(input), solution(cases), name]

  - type: prose
    id: reviewer-header
    body: |-
      A person may read your file after the machine scores it. Open it with a three-line
      **header comment**, and update it before you submit:

      ```ts
      // Task: largest K > 0 with both K and -K in A, else 0.
      // Approach: a Set of A, then check each positive x for -x. O(n) time and memory.
      // Tested: examples, no pair, [0, 0], duplicates, 100,000 numbers.
      ```

      It shows your plan, its cost and your testing before anyone reads the code.

  - type: parsons
    id: order-task-process
    concept: interview.platform-conduct
    difficulty: 3
    language: text
    prompt: >-
      The task: the largest K where both K and -K are in A. The assistant is on. Put the
      process in order.
    blocks:
      - id: header
        code: Type the header comment with the task and limits
        subgoal: Understand
      - id: clarify
        code: Ask the assistant one or two clarifying questions
      - id: tests
        code: Write the test table, answers worked out by hand
        subgoal: Test first
      - id: plan
        code: Comment the brute force, then the faster plan
      - id: code
        code: Write the code yourself and run the table
        subgoal: Build
      - id: break
        code: Ask the assistant for inputs that might break it
        subgoal: Break it
      - id: cross-check
        code: Compare with the brute force and time 100,000 numbers
      - id: submit
        code: Update the header, remove prints, submit
        subgoal: Finish
    distractors:
      - id: ask-solution
        code: Ask the assistant for the O(n) version
        feedback: >-
          The transcript is read. Asking for the solution is the one prompt that fails outright.
      - id: skip-submit
        code: Keep polishing until the timer submits for you
        feedback: >-
          A half-typed edit at zero can stop the code compiling. Submit on your own terms.

  - type: explain-back
    id: explain-half-score
    concept: interview.hidden-tests
    difficulty: 4
    prompt: >-
      Your brute force gets the right answer on every case you try with Run. Why can it
      still score about half?
    rubric:
      - Run only checks the example and your own small cases.
      - Hidden performance tests use large inputs sized to the expected complexity.
      - A slower solution times out on those, and a timeout scores nothing.
    modelAnswer: >-
      Run only shows how my code behaves on small inputs I chose. The hidden tests include
      performance tests with inputs sized to the expected complexity. An O(n²) brute force
      passes the correctness tests but runs out of time on the large ones. Each timeout
      scores zero, so the total lands near half.

recap:
  - Treat the example as a warm-up and write your own edge cases.
  - Read N and the expected complexity first, then pick the algorithm.
  - Submit code that compiles, and ask any assistant narrow questions.
recall:
  - id: card-two-test-kinds
    concept: interview.hidden-tests
    front: What two kinds of hidden test does an algorithmic task have?
    back: >-
      Correctness tests on small and tricky inputs, and performance tests on large inputs
      sized to the expected complexity.
  - id: card-n-100k
    concept: interview.expected-complexity
    front: N can be 100,000. What time complexity do you aim for?
    back: >-
      O(n log n) or better. An O(n²) loop is about ten billion steps and times out.
  - id: card-compile-zero
    concept: interview.platform-conduct
    front: Why submit a working brute force over an unfinished fast version?
    back: >-
      Code that doesn't compile scores zero. The brute force keeps its correctness points.
  - id: card-header-comment
    concept: interview.platform-conduct
    front: What three lines open your file in a timed online test?
    back: >-
      Task, Approach with its Big-O, and Tested: the cases you checked. Update them before
      you submit.
  - id: card-edge-list
    concept: interview.hidden-tests
    front: Which edge cases do you test before submitting?
    back: >-
      The smallest and largest input, all equal, all negative, duplicates, sorted and
      reversed, and the extremes of the value range.

references:
  - kind: docs
    title: Top techniques to approach and solve coding interview questions
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/coding-interview-techniques/
    note: Clarify, brute force, optimise, test, and talk throughout.
    primary: true
    verified: true

deepDive: |-
  How a typical online coding assessment works, as of September 2026. A **screen** is a timed
  test taken alone. One timer covers every task and can't be paused. When it ends, whatever
  is in the editor is submitted. Finishing early doesn't raise the automatic score.

  Versions matter. Algorithmic tasks commonly run JavaScript on Node 22, TypeScript 5.8 on
  Node 22 and Python 3.12. Real-life tasks can use older versions, so check the version shown
  in the editor before relying on a recent API.

  Proctoring, when the employer turns it on, records paste events on a timeline, time away
  from the tab, unusually fast finishing, webcam snapshots and sometimes the screen. A paste
  isn't proof of cheating, but it shows. Every submission is also checked for similarity to
  known solutions. The built-in AI assistant is enabled per test, and employers read the
  whole transcript to see whether you asked reasonable questions or tried to get the solution.

  Don't validate what the constraints already rule out. If N is at least 2, you don't need a
  branch for an empty array, and the extra code is one more place for a bug.

  Practise on the platform's free demo test and its public training tasks. Employers are
  told not to use training tasks in real tests, so expect the same patterns in new clothes.
  Collections of solutions warn that real tests are harder than the public lessons: nastier
  corners, and two patterns in one task.
