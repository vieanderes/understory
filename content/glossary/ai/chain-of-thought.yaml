term: chain of thought
aka: [CoT, chain-of-thought prompting, step-by-step reasoning]
short: Intermediate steps a model writes out before its final answer, so later tokens can build on them.
explain: |
  A model writes one token at a time, and each token can only use what came before it.
  Ask for the answer straight away and it has to jump there in one go. Ask it to work
  through the steps first, and every step becomes context for the next one.

  It helps most on multi-step problems: sums, logic, planning. Reasoning models are trained
  to do it by themselves, and those thinking tokens are billed as output. The trap: the
  written steps are not a faithful record of how the answer was reached.
analogy: Doing long division on paper instead of in your head. The paper holds the parts you would otherwise drop.
usage: Turn on chain of thought for the pricing check, but only parse the final answer block.
twin:
  term: test-time-compute
  difference: Chain of thought is one way to think longer, by writing steps. Test-time compute is the wider idea of spending more work per answer, including sampling and search.
related: [test-time-compute, token, prompt]
level: 2
lessons: [ai.reasoning-and-training]
