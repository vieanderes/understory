id: js.functions-and-this
title: Functions and `this`
objective: "Work out `this` from how a function is called, and keep it when a method becomes a click handler."
level: essential
minutes: 10
concepts: [js.this, js.arrow-functions, js.call-apply-bind]
prerequisites: [js.prototypes-and-classes]
opening:
  text: >-
    You'll know what `this` means at any call, and why a method breaks when a button calls it.
    That one idea fixes a whole family of "cannot read properties of undefined" errors.

steps:
  - type: prose
    id: object-before-the-dot
    body: |-
      In a method, `this` is the object before the dot in the call:

      ```js
      likes.who();   // this is likes
      views.who();   // this is views
      ```

      It's filled in fresh by each call. The same function called through another object gets
      another `this`. Called with nothing before the dot, a class method gets `undefined`.

  - type: predict-output
    id: predict-detached-method
    concept: js.this
    difficulty: 2
    language: js
    code: |
      class Counter {
        constructor(name) {
          this.name = name;
        }
        who() {
          return this.name;
        }
      }
      const likes = new Counter("likes");
      console.log(likes.who());
      const who = likes.who;
      console.log(who());
    question: The first log shows `likes`. What happens on the last line?
    choices:
      - text: A `TypeError` about reading `name`
        correct: true
        feedback: >-
          Right. Nothing sits before the dot, so `this` is `undefined`.
      - text: It logs `likes` again
        feedback: >-
          Most people expect that. But `who` came from `likes` without keeping it. `this` comes
          from the call.
      - text: It logs `undefined`
        feedback: >-
          Close. There's no `this` at all here, and reading `name` from `undefined` throws.

  - type: prose
    id: lost-in-a-handler
    body: >-
      That's the trap. `likes.who` without brackets hands over the function alone. The object
      stays behind.


      That's exactly what `button.addEventListener("click", cart.add)` does. When the button
      is clicked, the browser calls `add` with the **button** as `this`. The button has none of
      the cart's data, so the method breaks.

  - type: playground
    id: fix-lost-this
    concept: js.this
    difficulty: 3
    prompt: >-
      The last line presses the button once, like a test. The script stops with an error and
      no ticket appears. Change the `addEventListener` line so `add` runs on the cart.
    html: |
      <button id="add">Add a ticket</button>
      <ul id="tickets"></ul>
    js: |
      class Cart {
        constructor() {
          this.items = [];
        }
        add() {
          this.items.push("ticket");
          const item = document.createElement("li");
          item.textContent = "Ticket " + this.items.length;
          document.querySelector("#tickets").append(item);
        }
      }
      const cart = new Cart();
      const button = document.querySelector("#add");
      button.addEventListener("click", cart.add);
      button.click(); // presses the button once, like a test
    editable: [js]
    showTree: true
    checks:
      - label: A ticket appears in the list
        selector: '#tickets li'
      - label: The first ticket is numbered 1
        selector: '#tickets li'
        text: Ticket 1
    solution:
      js: |
        class Cart {
          constructor() {
            this.items = [];
          }
          add() {
            this.items.push("ticket");
            const item = document.createElement("li");
            item.textContent = "Ticket " + this.items.length;
            document.querySelector("#tickets").append(item);
          }
        }
        const cart = new Cart();
        const button = document.querySelector("#add");
        button.addEventListener("click", () => cart.add());
        button.click(); // presses the button once, like a test
    hints:
      - The error says `this.items` is undefined. Who is `this` when the button calls `add`?
      - Give the button a function that calls `add` with the cart before the dot.
      - 'Try `() => cart.add()` in place of `cart.add`.'

  - type: prose
    id: arrows-have-no-this
    body: >-
      Why did the arrow fix it? It calls `cart.add()` itself, with the cart before the dot.


      Arrows have one more trait: they have no `this` of their own. Inside an arrow, `this`
      means whatever it meant where the arrow was written. So an arrow inside a method sees the
      method's `this`. A `function` written there gets a new one from its own call.

  - type: predict-output
    id: predict-callback-this
    concept: js.arrow-functions
    difficulty: 3
    language: js
    code: |
      class Menu {
        constructor() {
          this.fee = 2;
          this.prices = [4, 6];
        }
        withFee() {
          return this.prices.map(function (price) {
            return price + this.fee;
          });
        }
      }
      console.log(new Menu().withFee());
    question: '`withFee` is called on the menu. What happens?'
    choices:
      - text: A `TypeError` about reading `fee`
        correct: true
        feedback: >-
          Right. `map` calls the inner `function` plainly, so its `this` is `undefined`.
      - text: It logs `[ 6, 8 ]`
        feedback: >-
          That's what an arrow would give. A `function` gets its own `this` from its own call,
          and `map` passes none.
      - text: It logs `[ NaN, NaN ]`
        feedback: >-
          Old code outside a class behaved like that. Class bodies are strict, so reading from
          `undefined` throws.

  - type: prose
    id: bind-fixes-this
    body: |-
      There's a second fix. `bind` returns a new function with `this` fixed for good:

      ```js
      const add = cart.add.bind(cart);
      button.addEventListener("click", add);
      ```

      Whoever calls `add` now, `this` is the cart. One catch: every `bind` call makes another new
      function. `removeEventListener` needs the very function you added, so bind once and keep
      it.

  - type: ai-review
    id: review-unmount
    concept: js.call-apply-bind
    difficulty: 4
    language: js
    request: Write a Slideshow class whose arrow keys work while it's open and stop when it closes.
    flawClass: logic
    code: |
      class Slideshow {
        constructor() {
          this.slide = 0;
        }
        open() {
          document.addEventListener("keydown", this.onKey.bind(this));
        }
        close() {
          document.removeEventListener("keydown", this.onKey.bind(this));
        }
        onKey(event) {
          if (event.key === "ArrowRight") this.slide += 1;
        }
      }
    prompt: >-
      This came back from a coding assistant. After closing and reopening the slideshow, one key
      press skips two slides. Tap the line that fails at its job.
    lines: [9]
    reasons:
      - text: '`bind` makes a new function, so nothing matches'
        correct: true
        feedback: >-
          Right. Removal needs the very same function. Bind once in the constructor and reuse it.
      - text: '`bind(this)` isn''t needed in a class'
        feedback: >-
          Without it, the document would call `onKey` with the document as `this`.
      - text: '`removeEventListener` wants the event, not a function'
        feedback: >-
          It mirrors `addEventListener`: an event name and a function. The function is what
          differs.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'Close, reopen, press once: one slide'
          correct: true
          feedback: >-
            Yes. A listener that wasn't removed moves it twice.
        - text: 'Open, press once: one slide'
          feedback: >-
            That passes. The leftover listener only appears after a close.
        - text: 'Press a key before ever opening'
          feedback: >-
            Nothing is listening yet, so it passes. The leak needs an open and a close.
    fix: |
      constructor() {
        this.slide = 0;
        this.handleKey = this.onKey.bind(this); // bound once, kept
      }
      open() {
        document.addEventListener("keydown", this.handleKey);
      }
      close() {
        document.removeEventListener("keydown", this.handleKey);
      }

  - type: code-challenge
    id: write-add-handler
    concept: js.this
    difficulty: 3
    language: js
    starter: starter.js
    editable: '12-13'
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `addHandler(watchlist)`. It returns a function a button can call with a film.


      Each call adds the film to that watchlist and returns the new number of films. It must
      keep its watchlist whoever calls it: a button object, `map`, or a plain call. Leave the
      `Watchlist` class alone.


      Example: with `const add = addHandler(watchlist)`, `add("Up")` returns `1`.
    hints:
      - Look at the `return` line. It hands out the method without its object.
      - Either wrap the call in an arrow, or fix `this` with `bind`.
      - '`return (film) => watchlist.add(film);` is one way to start.'

  - type: explain-back
    id: explain-lost-receiver
    concept: js.this
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: |-
      ```js
      const cart = new Cart();
      button.addEventListener("click", cart.add);
      // click: TypeError: Cannot read properties of undefined (reading 'push')
      ```

      A click on the button throws. Why, and why do an arrow wrapper and `bind` both fix it?
    rubric:
      - '`this` is set by each call, and `cart.add` without brackets passes the function without the cart.'
      - The browser calls the handler with the button as `this`, and the button has no `items`.
      - An arrow wrapper calls `cart.add()` through the cart, and `bind` fixes `this` to the cart.
    modelAnswer: >-
      A function keeps no link to the object it came from. `cart.add` hands the browser the
      function alone. On a click, the browser calls it with the button as `this`. The button
      has no `items`, so `this.items.push` throws. An arrow wrapper makes the call as
      `cart.add()`, with the cart before the dot. `bind` returns a copy whose `this` is fixed
      to the cart.

recap:
  - Work out `this` from the object before the dot at the call.
  - Keep a method's object in a click handler with an arrow wrapper or `bind`.
  - Bind a handler once and keep it, so you can remove it later.

recall:
  - id: card-method-as-callback
    concept: js.this
    front: What's lost when you pass `cart.add` to `addEventListener`?
    back: >-
      The cart. Only the function travels, and the browser calls it with the element as
      `this`.
  - id: card-arrow-this
    concept: js.arrow-functions
    front: Where does an arrow function get `this`?
    back: >-
      From the code around it, where it was written. It has no `this` of its own, so the
      caller can't change it.
  - id: card-bind-identity
    concept: js.call-apply-bind
    front: Why does `removeEventListener("click", fn.bind(x))` remove nothing?
    back: >-
      `bind` returns a new function each time, so it never matches the one added. Bind once and
      keep it.
  - id: card-plain-call
    concept: js.this
    front: What is `this` when a class method is called with nothing before the dot?
    back: >-
      `undefined`, because class code is strict. Reading a property from it throws a
      `TypeError`.

