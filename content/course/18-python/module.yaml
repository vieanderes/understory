id: python
number: 18
title: "Python"
summary: "Python for someone who writes JavaScript: the new spelling, text, lists, dicts, functions as values, comprehensions, exceptions and tracebacks, files and JSON, classes, uv, type hints, and a command-line tool to finish."
why: "Python is the language of the AI and data world, and most model tooling is written for it first."
youCanBuild: "A typed command-line tool that reads a JSON file of eval results and prints a report, with exit codes CI can trust."
concepts:
  - id: python.running-python
    title: "Running Python"
    summary: "python3 runs a .py file from top to bottom, and print shows values in the output, like console.log."
  - id: python.names-and-values
    title: "Names and values"
    summary: "Assignment binds a name to a value without a keyword, and a name can later point at a value of another type."
  - id: python.f-strings
    title: "f-strings"
    summary: "A string prefixed with f evaluates each expression in braces and inserts its value, with optional formatting after a colon."
  - id: python.indentation
    title: "Indentation as structure"
    summary: "Python marks blocks with a colon and consistent indentation instead of braces, so indentation is syntax."
  - id: python.conditionals
    title: "if, elif and else"
    summary: "Python chooses a branch with if, elif and else, and combines conditions with and, or and not."
  - id: python.truthiness
    title: "Truthiness"
    summary: "None, False, zero and every empty container count as false in a condition, and everything else counts as true."
  - id: python.for-loops
    title: "for loops"
    summary: "A for loop walks the items of any iterable directly, with no index unless you ask for one."
  - id: python.range
    title: "range"
    summary: "range(start, stop, step) produces integers up to but not including stop, lazily."
  - id: python.division
    title: "Division and numbers"
    summary: "/ always gives a float, // divides and rounds down to a whole number, % gives the remainder and ** raises to a power."
  - id: python.string-basics
    title: "Strings"
    summary: "A string is an immutable sequence of characters: index it, measure it with len, and test for a piece with in."
  - id: python.string-methods
    title: "String methods"
    summary: "Methods such as strip, lower, replace and startswith return a new string, because a string never changes."
  - id: python.split-and-join
    title: "split and join"
    summary: "split cuts text into a list of pieces, and separator.join(pieces) glues a list of strings back into one."
  - id: python.functions
    title: "Defining functions"
    summary: "def names a function, return sends a value back, and a function without return gives None."
  - id: python.keyword-arguments
    title: "Keyword arguments and defaults"
    summary: "Arguments can be passed by name in any order, and parameters can have default values."
  - id: python.args-kwargs
    title: "*args and **kwargs"
    summary: "A starred parameter collects extra positional arguments into a tuple, and a double-starred one collects extra keyword arguments into a dict."
  - id: python.mutable-default
    title: "The mutable default trap"
    summary: "A default value is created once when the function is defined, so a list or dict default is shared by every call."
  - id: python.functions-as-values
    title: "Functions as values"
    summary: "A function without brackets is a value you can store or pass, and lambda writes a small one inline."
  - id: python.shadowing-builtins
    title: "Shadowing built-ins"
    summary: "Names such as list, max and sum are ordinary names, so assigning to one hides the built-in for the rest of the file."
  - id: python.lists
    title: "Lists"
    summary: "A list is an ordered, mutable sequence with methods such as append, extend, insert, pop and remove."
  - id: python.slicing
    title: "Slicing"
    summary: "seq[start:stop:step] copies part of a sequence, negative indices count from the end, and out-of-range bounds are clipped."
  - id: python.tuples-and-unpacking
    title: "Tuples and unpacking"
    summary: "A tuple is an immutable sequence, and unpacking assigns its items to several names at once, with a star catching the rest."
  - id: python.sorting-with-key
    title: "Sorting with a key"
    summary: "sorted returns a new list and list.sort sorts in place, both stable and both ordering by the value a key function returns."
  - id: python.identity
    title: "is and =="
    summary: "== compares values, is asks whether two names point at the very same object, and is belongs with None."
  - id: python.dicts
    title: "Dictionaries"
    summary: "A dict maps hashable keys to values, keeps insertion order, and raises KeyError for a missing key."
  - id: python.dict-tools
    title: "get, defaultdict and Counter"
    summary: "get returns a default for a missing key, defaultdict creates one on first access, and Counter counts hashable items."
  - id: python.sets
    title: "Sets"
    summary: "A set holds unique hashable items, tests membership in constant time on average, and supports union, intersection and difference."
  - id: python.hashability
    title: "Hashability"
    summary: "Only immutable values such as strings, numbers and tuples of them can be dict keys or set members."
  - id: python.comprehensions
    title: "Comprehensions"
    summary: "[expr for item in items if cond] builds a list in one expression, and the same form with braces builds a dict or a set."
  - id: python.enumerate-and-zip
    title: "enumerate and zip"
    summary: "enumerate pairs each item with its index, and zip walks several iterables side by side until the shortest ends."
  - id: python.generator-expressions
    title: "Generator expressions"
    summary: "The same form in parentheses produces items lazily, one at a time, without building a list."
  - id: python.mutating-while-iterating
    title: "Changing a list while looping over it"
    summary: "Removing items from a list inside a for loop over it skips items, so build a new list instead."
  - id: python.exceptions
    title: "Exceptions"
    summary: "raise signals an error, try and except catch named exception types, else runs when nothing was raised, and finally always runs."
  - id: python.tracebacks
    title: "Reading a traceback"
    summary: "A traceback lists the calls that led to an error, oldest first, and its last line names the exception."
  - id: python.context-managers
    title: "with and context managers"
    summary: "A with block acquires a resource and guarantees it is released, even when an exception leaves the block."
  - id: python.pathlib
    title: "pathlib"
    summary: "Path objects join, inspect, read and write file paths the same way on every operating system."
  - id: python.json-module
    title: "The json module"
    summary: "json.loads and json.dumps convert between JSON text and dicts, lists, strings, numbers, booleans and None."
  - id: python.classes
    title: "Classes and self"
    summary: "A class bundles data and methods, __init__ sets up a new instance, and every method receives the instance as self."
  - id: python.dunder-methods
    title: "Dunder methods"
    summary: "Methods such as __repr__, __eq__ and __len__ let your objects work with repr, ==, len and other built-ins."
  - id: python.dataclasses
    title: "Dataclasses"
    summary: "@dataclass writes __init__, __repr__ and __eq__ from annotated fields, and frozen=True makes instances immutable."
  - id: python.inheritance-and-composition
    title: "Inheritance and composition"
    summary: "A subclass extends a base class and super() calls the base, but holding another object as a field is usually the simpler design."
  - id: python.modules-and-imports
    title: "Modules and imports"
    summary: "Every .py file is a module, a folder of them is a package, and code under if __name__ == \"__main__\" runs only when the file is run directly."
  - id: python.virtual-environments
    title: "Virtual environments"
    summary: "A virtual environment is a folder with its own interpreter and installed packages, so each project's dependencies stay apart."
  - id: python.uv
    title: "uv"
    summary: "uv creates the project and its environment, records dependencies in pyproject.toml and uv.lock, and runs commands inside it with uv run."
  - id: python.ruff
    title: "ruff"
    summary: "ruff lints and formats Python code in one fast tool, configured in pyproject.toml."
  - id: python.type-hints
    title: "Type hints"
    summary: "Annotations such as list[str], dict[str, int] and str | None describe types, and the interpreter does not enforce them."
  - id: python.type-checkers
    title: "Type checkers"
    summary: "mypy, pyright or ty read the annotations and report mismatches before the code runs."
  - id: python.typeddict-and-literal
    title: "TypedDict and Literal"
    summary: "TypedDict types a dict with fixed keys, and Literal limits a value to a few exact constants."
  - id: python.protocols
    title: "Protocols"
    summary: "A Protocol describes the methods an object must have, so any class with them fits, without inheriting."
  - id: python.command-line-args
    title: "Command-line arguments"
    summary: "sys.argv is the list of words on the command line, with the script's own name first."
  - id: python.exit-codes
    title: "Exit codes"
    summary: "A program ends with a number, 0 for success and anything else for failure, which shells and CI read."
