id: aisys.pii-and-privacy
title: PII and privacy in AI systems
objective: Recognise personally identifiable information, detect and redact it, keep it out of prompts, logs and eval sets, and meet GDPR duties.
level: advanced
minutes: 10
concepts: [aisys.pii, aisys.pii-redaction, aisys.ai-data-retention]
prerequisites: [ai.injection-and-leakage, security.abuse-and-privacy]
opening:
  text: >-
    You'll spot personal data before it reaches a model, a log or an eval set. Then you'll
    strip it out, and know what the law expects when someone asks to be forgotten.

steps:
  - type: prose
    id: what-pii-is
    body: |-
      **PII** stands for personally identifiable information. It's any data that points to
      a person. Think of a name, a home address, an email or a phone number. Or an **IBAN**
      (International Bank Account Number), an ID number, an IP address.

      Some data only identifies in combination. A postcode, a birth date and a gender
      together often narrow the field to one person. Treat those as PII too.

  - type: multiple-choice
    id: pick-pii
    concept: aisys.pii
    difficulty: 1
    question: A support bot writes one log line per request. Which field is personal data?
    choices:
      - text: The caller's IP address
        correct: true
        feedback: >-
          Yes. An IP address can point to one person, so it counts.
      - text: The model name
        feedback: >-
          That's the same for every user. It tells you nothing about anyone.
      - text: The number of output tokens
        feedback: >-
          A count says nothing about who asked. It's safe to log.
      - text: 'The HTTP status, `200`'
        feedback: >-
          Every request shares a handful of status codes. No person hides in one.

  - type: prose
    id: detect-and-redact
    body: |-
      Detection needs two layers. **Patterns**, regular expressions, catch structured PII:
      emails, phone numbers, IBANs, card numbers. **Entity recognition**, a small model
      trained to tag names and places, catches the rest. "Mia Chen" has no pattern.

      Redaction swaps each find for a typed placeholder, like `[EMAIL]`. Do it before text
      leaves your system: before the prompt, the log line and the trace.

  - type: ai-review
    id: review-iban-spaces
    concept: aisys.pii-redaction
    difficulty: 2
    language: python
    request: Redact IBANs from support messages before we send them to the model.
    flawClass: edge-case
    code: |
      IBAN = re.compile(r"\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b")

      def redact_iban(text):
          return IBAN.sub("[IBAN]", text)

      # redact_iban("Refund to DE89370400440532013000")
      # gives "Refund to [IBAN]"
    prompt: >-
      An assistant wrote this, and its one test passed. A week later, raw IBANs show up in
      the traces. Tap the line at fault.
    lines: [1]
    reasons:
      - text: It misses IBANs written in groups of four
        correct: true
        feedback: >-
          Exactly. People type `DE89 3704 0044 ...`, and the spaces break the match.
      - text: '`sub` only replaces the first match'
        feedback: >-
          `sub` replaces every match unless you pass a count. The pattern is too narrow.
      - text: IBANs never start with two letters
        feedback: >-
          They always do: a country code, then two check digits.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Redact an IBAN typed in groups of four
          correct: true
          feedback: >-
            Yes. That's how people type IBANs, and the pattern missed it.
        - text: Redact two IBANs in one message
          feedback: >-
            `sub` already replaces every match. Both unspaced IBANs would be caught.
        - text: Redact a message with no IBAN in it
          feedback: >-
            That checks for false matches. It can't show an IBAN slipping through.
    fix: |
      IBAN = re.compile(r"\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]){11,30}\b")

  - type: code-challenge
    id: write-redactor
    concept: aisys.pii-redaction
    difficulty: 3
    language: python
    starter: redact.starter.py
    solution: redact.solution.py
    tests: redact.tests.py
    prompt: >-
      Write `redact_pii(text)`. Replace IBANs with `[IBAN]`, emails with `[EMAIL]`, and
      phone numbers with `[PHONE]`.


      An IBAN is two capital letters, two digits, then 11 to 30 letters or digits. Single
      spaces may sit between them. A phone number is an optional `+` and at least 9
      digits, with single spaces or hyphens between them. Shorter numbers and dates stay.
    hints:
      - Three compiled patterns, applied one after another with `sub`.
      - Order matters. An IBAN's long digit run also looks like a phone number.
      - 'The fixed IBAN pattern from the review works: `r"\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]){11,30}\b"`.'

  - type: prose
    id: reversible-redaction
    body: |-
      Sometimes the reply must contain the real value, say an email the customer gave.
      Then redact **reversibly**: number each placeholder, keep a map on your side, and
      swap values back into the reply.

      ```python
      {"[EMAIL_1]": "ana@example.com"}
      ```

      The provider sees only `[EMAIL_1]`. The map never leaves your system.

  - type: fill-blank
    id: fill-pseudonymise
    concept: aisys.pii-redaction
    difficulty: 3
    language: python
    prompt: >-
      Replace each email with a numbered placeholder, remember the real value, and put the
      values back into the model's reply.
    template: |
      def pseudonymise(text):
          mapping = {}
          def swap(match):
              key = f"[EMAIL_{len(mapping) + 1}]"
              mapping[key] = match.group(0)
              return key
          return EMAIL.{{1}}(swap, text), mapping

      safe, mapping = pseudonymise(message)
      reply = ask_model(safe)
      for key, value in mapping.{{2}}():
          reply = reply.replace(key, value)
    blanks:
      - key: '1'
        answer: sub
      - key: '2'
        answer: items
    bank: [sub, items, match, keys, findall]

  - type: prose
    id: retention-and-gdpr
    body: |-
      **GDPR** is the EU law on personal data. Anything you do with it is **processing**:
      sending it to a model provider, or keeping it in a trace. Each use needs a
      reason, and you keep only what the task needs.

      People also have a **right to erasure**: ask, and their data must go. That reaches
      every copy, in logs, traces, caches, vector stores and eval sets.

  - type: multiple-choice
    id: pick-erasure-eval-set
    concept: aisys.ai-data-retention
    difficulty: 2
    question: A user asks to be deleted. Twenty of their chats sit in your eval set. What now?
    choices:
      - text: Remove or anonymise those chats too
        correct: true
        feedback: >-
          Yes. The right to erasure covers every copy you hold, test data included.
      - text: Keep them, eval sets are test data
        feedback: >-
          Test data made from real chats is still their personal data. No exemption applies.
      - text: Deleting the account row is enough
        feedback: >-
          The chats live on elsewhere. Erasure means every copy, not only the main table.
      - text: Only the model provider must delete
        feedback: >-
          You chose to keep the copies, so they're yours to delete.

  - type: explain-back
    id: explain-erasure-copies
    concept: aisys.ai-data-retention
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A user uses their right to erasure. Why is deleting their account row not enough in an
      AI system?
    rubric:
      - Their data has been copied into prompts, logs and traces.
      - It may sit in caches, vector stores or eval sets built from real traffic.
      - The model provider may keep inputs for a while, so their retention matters too.
    modelAnswer: >-
      In an AI system their words travel. Each chat went into a prompt, a log line and a
      trace. Their documents may be chunked into a vector store. Some chats may have been
      copied into an eval set. The provider may keep inputs for a set time as well.
      Erasure means finding and deleting or anonymising every one of those copies.

recap:
  - Name what counts as PII, including data that identifies only in combination.
  - Redact with patterns and entity recognition before text leaves your system.
  - Track where personal data goes, and erase it from every copy on request.
recall:
  - id: card-pii-examples
    concept: aisys.pii
    front: What does PII stand for, and what are five examples?
    back: >-
      Personally identifiable information. A name, an email, a phone number, an IBAN, an IP
      address, an address or an ID number.
  - id: card-two-layers
    concept: aisys.pii-redaction
    front: Why does PII detection need both patterns and entity recognition?
    back: >-
      Patterns catch structured data like emails and IBANs. Names and places have no
      pattern, so a trained tagger has to find them.
  - id: card-redact-where
    concept: aisys.pii-redaction
    front: At what point in a request should redaction run?
    back: >-
      Before the text leaves your system: before the prompt, the log line and the trace.
  - id: card-erasure-scope
    concept: aisys.ai-data-retention
    front: Which copies does an erasure request reach in an AI system?
    back: >-
      Every one: logs, traces, caches, vector stores, eval sets, and inputs the provider
      keeps.

