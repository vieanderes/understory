    verified: false

deepDive: >-
  **How the constraint works.** At each step the model gives every token a probability.
  With a schema, the provider masks out tokens that would break the JSON, so only valid
  continuations can be drawn. That's why it can't write `Sure!` first.


  **Names change.** Providers rename these parameters from time to time. Python's
  `output_format=` on `messages.parse` is the SDK's shortcut for the API's
  `output_config` format. When an assistant writes a parameter you don't recognise, check
  the current docs rather than trusting either of you.


  **Without schema support**, ask for JSON only, give one example, validate with Pydantic,
  and use the retry from the challenge. Some teams also strip a code fence before parsing.
  That's a patch; validation is the fix.
