term: strict equality
aka:
  - '==='
  - triple equals
short: A comparison that's true only when both sides have the same type and the same value.
explain: |
  `===` compares the values as they are. `1 === 1` is true. `1 === '1'` is false, because
  one is a number and the other is a string.

  Use it by default. For objects and arrays it checks identity, not contents. Two arrays
  holding the same items are still not equal, because they are two different arrays.
analogy: A passport check. The name must match, and so must the photo.
example:
  language: js
  code: |
    1 === 1; // true
    1 === '1'; // false
    [1] === [1]; // false: two different arrays
usage: Use strict equality here, because the id from the URL is a string.
twin:
  term: loose-equality
  difference: Strict equality, `===`, never converts, so different types mean false. Loose equality, `==`, converts both sides first, which is why `0 == ''` is true.
related:
  - loose-equality
  - type-coercion
  - boolean
  - if-statement
level: 1
lessons:
