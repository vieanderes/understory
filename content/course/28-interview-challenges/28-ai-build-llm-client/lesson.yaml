    verified: false

deepDive: >-
  **The real timeout.** Outside the sandbox you'd pass `AbortSignal.timeout(30_000)` to
  `fetch`. It aborts the request itself, so the socket closes and the provider can stop
  generating. A race alone only stops you waiting, which is why the challenge flips the
  signal too.


  **Retry-After.** A `429` or `503` may carry a `Retry-After` header. When it does, wait
  that long instead of your own backoff.


  **Where retries live.** Official SDKs already retry 429s and 5xx errors a few times. Retry
  in one layer only, or the attempts multiply.
