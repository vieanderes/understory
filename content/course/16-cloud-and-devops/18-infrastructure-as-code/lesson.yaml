deepDive: >-
  Every plan here came from OpenTofu 1.12.6 in Docker. The AWS plan for the server, the DNS
  record and both IAM policies ran with the `aws` provider and fake keys. The settings
  `skip_credentials_validation`, `skip_requesting_account_id` and `skip_metadata_api_check`
  let it print `Plan: 4 to add` without an account. It was never applied. The replacement,
  the state and the hand-made change ran for real with the `kreuzwerker/docker` and
  `random` providers against a local Docker. Changing `postgres:16` to `postgres:17` gave
  the `-/+` plan in the lesson. The password from `random_password` sat in
  `terraform.tfstate` in plain text. After `docker rm -f orders-db` by hand, the next plan
  said `docker_container.db will be created`.


  A hand-made change is called drift. `tofu plan -refresh-only` shows drift without
  proposing to undo it, so you can decide whether to copy the change into the code instead.


  Terraform and OpenTofu share HCL, the language of these files, and most commands.
  OpenTofu split off in 2023 after Terraform's licence change, and it can also encrypt state
  and plan files on the client. Pulumi keeps the same idea, desired state, a diff and an
  apply, with programs in TypeScript or Python. For a shared S3 backend, `use_lockfile =
  true` now locks with the bucket itself, where older setups needed a DynamoDB table. Run
  `plan` in CI on every pull request and post it as a comment, so reviewers read the plan,
  not only the diff.
