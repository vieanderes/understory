term: breadth-first search
aka: [BFS, breadth first search, level-order traversal, multi-source BFS]
short: Exploring a network in rings, every node one step away first, then two steps, and so on.
explain: |
  You want the fewest moves from A to B. Try everywhere one step from A. Then everywhere
  one step from those. The first time you reach B, no shorter route exists.

  A first-in, first-out queue keeps the rings in order. A seen set stops you revisiting
  nodes. Each node and edge is handled once, so it's O(V + E).

  It finds the shortest path only when every step costs the same. With different costs,
  like road distances, you need Dijkstra's algorithm and a priority queue.
analogy: A stone dropped in a pond. The ripple reaches everything one ring at a time, nearest first.
example:
  language: python
  code: |
    from collections import deque
    def steps(graph, start, goal):
        queue, seen = deque([(start, 0)]), {start}
        while queue:
            node, dist = queue.popleft()
            if node == goal:
                return dist
            for nxt in graph[node]:
                if nxt not in seen:
                    seen.add(nxt)
                    queue.append((nxt, dist + 1))
        return -1
usage: It asks for the fewest moves, so it's breadth-first search; DFS would find a path, not the shortest.
twin:
  term: depth-first-search
  difference: Breadth-first search goes ring by ring with a queue, so it finds the shortest path. Depth-first search follows one path to its end with a stack, and finds a path, not the shortest.
related: [depth-first-search, fifo-queue, graph, adjacency-list, hash-set, priority-queue]
