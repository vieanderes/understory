term: OAuth
aka: [ OAuth 2.0, OAuth flow, authorisation code flow, authorization code flow ]
short: A standard way to let one app use your data in another, without sharing your password.
explain: |
  An app wants to read your calendar. Giving it your calendar password would give it
  everything, forever. Instead, the calendar asks you to approve, then hands the app a limited
  key.

  You are sent to the provider, sign in there and approve a list of scopes. The provider
  redirects back with a one-time code. The app swaps it for an access token and usually a
  refresh token. The app never sees your password, and you can revoke access without changing
  it.
analogy: A valet key for your car. It drives and parks, but won't open the boot, and you can cancel it.
usage: Connect the vendor through OAuth, and store the refresh token encrypted per customer.
related: [ access-token, refresh-token, oauth-scope, authorisation, authentication ]
level: 2
lessons: [integrations.tokens-that-expire, backend.oauth-and-passkeys]
