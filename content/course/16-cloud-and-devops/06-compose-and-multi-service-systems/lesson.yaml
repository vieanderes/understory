deepDive: >-
  All of this ran on Docker 28.3 with Compose 2.39: a to-do API on `node:24-slim` using the
  `pg` driver, and PostgreSQL 17. `curl localhost:5432` exited with code 7 because nothing
  publishes that port. From inside the API container, the name `db` resolved to the
  database's address on the network.


  With plain `depends_on`, `psql` right after `up` printed `FATAL: the database system is
  starting up`, and the API's first query failed with `connect ECONNREFUSED`. With a
  `pg_isready` health check and `service_healthy`, Compose printed `todoh-db-1 Healthy`
  before it started the API. An app should still retry its first connection: health checks
  order the start, and they can't promise the database stays up.


  After `docker compose stop db`, the always-OK `/health` returned `200 OK` while `/todos`
  returned `500` with `getaddrinfo ENOTFOUND db`. One more real catch: without
  `pool.on("error", ...)`, the `pg` pool threw when the database went away and the whole API
  process exited. Handle that event, then let `/health` report the problem.


  Keep health checks cheap and quick, like `SELECT 1`, because they run every few seconds.
  Kubernetes, in lesson 19, splits them into two: readiness, which takes an instance out of
  traffic, and liveness, which restarts it. A liveness check that tests the database
  restarts every copy when the database blips.


  The password in `compose.yaml` is fine for a laptop. On a server it comes from the
  environment or a secret store, as the CI lesson shows. And Docker writes its own firewall
  rules for published ports, which can bypass ufw from lesson 2. Publish only what must be
  public, or bind to `127.0.0.1:8080:3000`.
