term: event emitter
aka: [EventEmitter, event bus, on and emit]
short: An object that keeps lists of listener functions by event name and calls them when that event fires.
explain: |
  A chat app wants the badge, the sound and the message list all to react to "message
  received". The sender shouldn't know about any of them. It announces the event; whoever
  signed up gets called.

  Inside it's a map from event name to a list of functions. `on` adds one, `off` removes
  one, `emit` calls each with the data. `once` wraps a listener so it removes itself.

  Copy the list before calling it, so a listener that removes itself mid-emit doesn't skip
  its neighbour. And remove listeners when a screen closes, or they pile up and leak.
analogy: A newsletter mailing list. You sign up for a topic, and each new issue goes to everyone on that list.
example:
  language: js
  code: |
    class Emitter {
      #listeners = new Map();
      on(name, fn) {
        if (!this.#listeners.has(name)) this.#listeners.set(name, []);
        this.#listeners.get(name).push(fn);
      }
      emit(name, data) {
        for (const fn of [...(this.#listeners.get(name) ?? [])]) fn(data);
      }
    }
usage: The event emitter calls the same listener twice because the component subscribes on every mount and never unsubscribes.
related: [callback, hash-map, closure, effect, message-broker]
