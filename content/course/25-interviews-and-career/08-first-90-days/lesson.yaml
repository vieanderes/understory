id: career.first-90-days
title: The first 90 days
objective: Plan your first three months in a new team, learn a codebase by tracing one request, and ship a small first change.
level: essential
minutes: 9
concepts: [career.onboarding-plan, career.first-contribution]
prerequisites: [career.the-offer]
opening:
  text: >-
    You'll start a new job with a plan for the first three months, not a vague hope to fit
    in. Early trust comes from small, careful changes, not a big rewrite.

steps:
  - type: prose
    id: three-months
    body: |-
      A common shape for the first 90 days:

      - **Month one, learn**: run the system, meet people, ship one small change.
      - **Month two, contribute**: own a small feature from start to finish.
      - **Month three, lead**: drive one improvement you spotted while learning.

      In an AI team, learn how quality is measured before you touch a prompt.

  - type: multiple-choice
    id: pick-first-week
    concept: career.first-contribution
    difficulty: 1
    question: What's a good goal for your first week?
    choices:
      - text: Ship one small, reviewed change
        correct: true
        feedback: >-
          Yes. It proves your setup works and teaches you the review process.
      - text: Read the whole codebase first
        feedback: >-
          You'll never finish, and reading sticks better with a task in hand.
      - text: Propose a better architecture
        feedback: >-
          You don't know why things are the way they are yet. Ask first.

  - type: prose
    id: trace-one-request
    body: |-
      Don't read a codebase front to back. **Trace one request** instead: where it comes
      in, which functions it passes through, where the model is called, and where data is
      stored.

      Write down each "why is it like this?" and ask. Keep a list of rough edges, but don't
      fix them all yet. Some are there for reasons you haven't met.

  - type: ai-review
    id: review-onboarding-plan
    concept: career.onboarding-plan
    difficulty: 2
    language: yaml
    request: Draft my plan for the first month on the search team.
    flawClass: logic
    code: |
      week-1: run everything locally, trace one search request end to end
      week-2: move the retrieval code to a cleaner framework
      week-3: learn how the eval set is built and run
      week-4: pick up a small feature with a teammate
    prompt: >-
      One week changes things before you understand them. Tap it.
    lines: [2]
    reasons:
      - text: It rewrites code you've barely met
        correct: true
        feedback: >-
          Yes. And before week 3, you couldn't even measure whether it made things worse.
      - text: Tracing a request takes too long
        feedback: >-
          A day or two well spent. It's the fastest way into a codebase.
      - text: Pairing on a feature is too cautious
        feedback: >-
          Pairing teaches you the team's habits. It's a strong first feature.
    fix: |
      week-1: run everything locally, trace one search request end to end
      week-2: fix one small bug, and keep a list of rough edges
      week-3: learn how the eval set is built and run
      week-4: pick up a small feature with a teammate

  - type: prose
    id: first-change
    body: |-
      Your first pull request is a small introduction to the team. Keep it small, and make
      the description do the work.

      Say what changed, why, and how you tested it. Ask for review early, and thank people
      for comments. Reviewers remember a pleasant first review.

  - type: ai-review
    id: review-first-pr
    concept: career.first-contribution
    difficulty: 2
    language: yaml
    request: Write the description for my first pull request.
    flawClass: logic
    code: |
      title: Stop duplicate passages in search results
      why: two files sharing a page returned the same passage twice
      change: remove duplicates by document and page before ranking
      tested: seems fine locally
    prompt: >-
      The reviewer will ask about one line. Tap it.
    lines: [4]
    reasons:
      - text: It gives no evidence the fix works
        correct: true
        feedback: >-
          Right. Name the test you added, or the query you checked.
      - text: The title is too plain
        feedback: >-
          Plain is good. It says what changes in a way anyone can search.
      - text: Explaining why isn't needed for a small fix
        feedback: >-
          The why is what reviewers need most. It's the strongest line here.
    verify:
      question: Which test belongs in the tested line?
      choices:
        - text: Two files sharing a page return that passage once
          correct: true
          feedback: >-
            Yes. It fails before the fix and passes after.
        - text: A search with one matching file returns results
          feedback: >-
            That passed before the change too. It can't show the duplicate is gone.
        - text: The search page loads without errors
          feedback: >-
            A smoke check, not proof. Duplicates load without any error.
    fix: |
      title: Stop duplicate passages in search results
      why: two files sharing a page returned the same passage twice
      change: remove duplicates by document and page before ranking
      tested: added a test with two files sharing a page; eval score unchanged

  - type: parsons
    id: order-first-month
    concept: career.onboarding-plan
    difficulty: 3
    prompt: Put your first month on an AI team in order.
    language: yaml
    blocks:
      - id: setup
        code: 'first: get the system running on your machine'
        subgoal: Learn
      - id: trace
        code: 'then: trace one request from the API to the model and back'
      - id: small-fix
        code: 'then: ship one small, reviewed fix'
        subgoal: Contribute
      - id: evals
        code: 'then: learn how answer quality is measured'
      - id: feature
        code: 'last: take on a small feature with a teammate'
        subgoal: Own
    distractors:
      - id: rewrite
        code: 'then: propose replacing the prompt pipeline'
        feedback: >-
          Too soon. Earn context and trust first, then propose changes with evidence.

  - type: explain-back
    id: explain-first-90
    concept: career.onboarding-plan
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Your new manager asks for your plan for the first 90 days. Give one goal per month,
      in three sentences.
    rubric:
      - Month one is about learning the system, with one small change shipped.
      - Month two is owning something small from start to finish.
      - Month three drives one improvement, backed by what you learnt.
    modelAnswer: >-
      In month one I'll get the system running, trace a request end to end and ship a small
      fix. In month two I'll own a small feature, from design to release. In month three
      I'll pick one rough edge I found, show its cost with data, and lead the fix.

recap:
  - Plan the first three months as learn, contribute, lead.
  - Learn a codebase by tracing one request, and ask why before changing.
  - Ship a small first change with a clear description and evidence.
recall:
  - id: card-three-months
    concept: career.onboarding-plan
    front: What's the shape of a first 90-day plan?
    back: >-
      Month one learn and ship something small, month two own a feature, month three lead
      one improvement.
  - id: card-trace
    concept: career.onboarding-plan
    front: How do you learn an unfamiliar codebase fast?
    back: >-
      Trace one request end to end, and write down every "why" to ask about.
  - id: card-first-pr
    concept: career.first-contribution
    front: What should the description of your first pull request say?
    back: >-
      What changed, why, and how you tested it.
  - id: card-before-prompts
    concept: career.onboarding-plan
    front: In an AI team, what do you learn before changing a prompt?
    back: >-
      How answer quality is measured, so you can tell if your change helps.

references:
  - kind: book
    title: 'The First 90 Days, Updated and Expanded: Proven Strategies for Getting Up to Speed Faster and Smarter'
    authors: Michael D. Watkins
    venue: Harvard Business Review Press
    year: 2013
    url: https://hbr.org/books/watkins
    note: The book that made the 90-day plan a standard, written for new leaders.
    primary: true
    verified: true
  - kind: docs
    title: Writing good CL descriptions
    authors: Google
    venue: Google Engineering Practices Documentation
    url: https://google.github.io/eng-practices/review/developer/cl-descriptions.html
    note: What a change description should say, from Google's public review guide.
    verified: true

deepDive: >-
  Meet people on purpose. In the first two weeks, ask your manager for five people to
  have a short chat with, and ask each: what should I know that isn't written down, and who
  else should I meet?


  Keep a running document of what you learn: how to run things, who owns what, and your
  list of rough edges. It becomes the onboarding guide the next person wishes they had,
  and a good first contribution in itself.


  Agree what success looks like at 90 days with your manager in week one. Checking in
  against it at 30 and 60 days avoids surprises in both directions.
