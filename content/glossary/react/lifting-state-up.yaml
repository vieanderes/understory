term: lifting state up
aka:
  - lift state up
short: Moving a value two siblings both need into their nearest shared parent, which passes it down.
explain: |
  A search box and a results list both need the search text. If the box holds it, the list
  can't see it. Move it to the parent of both, then pass the value to the list and a setter
  to the box.

  Now there's one source of truth. Lift only as far as the nearest shared parent: higher up,
  more of the page draws again on each change, and more props have to travel down.
analogy: Two flatmates sharing one shopping list on the fridge, instead of each keeping their own.
example:
  language: tsx
  code: |
    function SearchPage() {
      const [query, setQuery] = useState('');
      return (
        <>
          <SearchBox query={query} onChange={setQuery} />
          <Results query={query} />
        </>
      );
    }
usage: Lift state up to the page, so the filter and the count stop disagreeing.
twin:
  term: prop-drilling
  difference: Lifting state up moves a value to a shared parent. Prop drilling is what can follow, when that value has to pass through many layers to reach the child that needs it.
related:
  - state
  - props
  - prop-drilling
level: 2
lessons:
  - react.sharing-state
