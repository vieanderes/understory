term: autoscaling
aka: [ auto-scaling, autoscaler, scale to zero ]
short: Adding or removing app instances on their own as load rises and falls, within limits you set.
explain: |
  Traffic peaks at lunch and drops at night. Sized for the peak, you pay for idle servers all
  night. Sized for the night, lunch falls over.

  A rule watches a signal, such as CPU or requests per instance. It adjusts the count between
  a minimum and a maximum. It only helps if instances are stateless and the bottleneck is the
  app, not the database. New instances take time to start, so sudden spikes still hurt. Always
  set a maximum, or a bug or an attack sets your bill.
analogy: A supermarket opening more tills when the queues grow, and closing them when it's quiet.
example:
  language: yaml
  code: |
    autoscaling:
      min_instances: 2
      max_instances: 20
      target_cpu_percent: 60
usage: Autoscaling added forty instances, and all of them hit the database's connection limit.
related: [ horizontal-scaling, stateless, load-balancer, serverless, health-check ]
level: 2
lessons: [ cloud.scaling-and-cost ]
