id: scripted-agent
title: ScriptedAgent
topic: agents
difficulty: medium
type: coding
recommendedMinutes: 25
signature:
  params:
    - { name: T, type: "string[]" }
    - { name: W, type: "string[]" }
    - { name: A, type: "string[]" }
    - { name: K, type: int }
  returns: string
statement: |-
  An agent runs in a loop: the model either asks for a tool call or gives its final answer,
  the runner carries out the call, and the model takes its next turn. To test the runner's
  safety rules without a real model, the turns are scripted. Turn J is T[J]: either
  `"final"`, or a tool call written as the tool name, one space and an argument, such as
  `"search flights"`. Two calls are the same when their whole strings are equal.

  W lists the tools that change something (write tools). A lists the tools a person has
  approved. The runner takes the turns in order and, for each one, checks in this order:

  1. `"final"`: the agent has answered, and the run stops with **answered**.
  2. If K calls have already run, the step cap is reached: **step-cap**.
  3. If the call is the same as the last call that ran, or if it and the last call repeat
     the two calls before them (A, B, A, B), the agent is looping: **loop**.
  4. If the tool is a write tool that is not approved: **needs-approval**.
  5. Otherwise the call runs.

  If the script ends without any of these, the run stops with **no-answer**. A call that
  was stopped never runs.

  Write a function:

  {{signature}}

  that, given arrays T, W and A of strings and an integer K, returns the outcome and the
  number of calls that ran, as one string with a single space, such as `"answered 2"`.

  For example, given T = ["search flights", "read page-1", "final"], W = ["book"], A = []
  and K = 5, the function should return "answered 2".

  Given T = ["search a", "read b", "search a", "read b", "final"], W = [], A = [] and K = 10,
  the function should return "loop 3": the fourth call would repeat the pair before it.

  Given T = ["search a", "book seat-4", "final"], W = ["book"], A = [] and K = 5, the
  function should return "needs-approval 1".

  Assume that:

  - the length of array T is an integer within the range [0..100];
  - the lengths of arrays W and A are integers within the range [0..10];
  - every tool name and argument is a non-empty string of lower-case letters, digits and
    hyphens, and is never "final";
  - K is an integer within the range [1..50].

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [["search flights", "read page-1", "final"], ["book"], [], 5], expected: "answered 2" }
  - { args: [["search a", "read b", "search a", "read b", "final"], [], [], 10], expected: "loop 3" }
  - { args: [["search a", "book seat-4", "final"], ["book"], [], 5], expected: "needs-approval 1" }
tests:
  - name: extreme_empty
    description: an empty script, and an answer straight away
    group: correctness
    cases:
      - { args: [[], [], [], 1], expected: "no-answer 0" }
      - { args: [["final"], ["write"], [], 1], expected: "answered 0" }
      - { args: [["final", "search x"], [], [], 1], expected: "answered 0" }
  - name: step_cap
    description: the cap is checked before the loop rule and only when a call is asked for
    group: correctness
    cases:
      - { args: [["search a", "search b", "search c"], [], [], 2], expected: "step-cap 2" }
      - { args: [["search a", "search b", "final"], [], [], 2], expected: "answered 2" }
      - { args: [["search a", "search a"], [], [], 1], expected: "step-cap 1" }
  - name: one_call_loop
    description: the same call twice in a row
    group: correctness
    cases:
      - { args: [["read x", "read y", "read y", "final"], [], [], 10], expected: "loop 2" }
      - { args: [["read x", "read y", "read x", "final"], [], [], 10], expected: "answered 3" }
  - name: pair_loop
    description: A, B, A, B is a loop, other repeats are not
    group: correctness
    cases:
      - { args: [["get a", "get b", "get a", "get c", "get a", "get b", "final"], [], [], 20], expected: "answered 6" }
      - { args: [["get z", "get a", "get b", "get a", "get b"], [], [], 20], expected: "loop 4" }
      - { args: [["get a", "get b", "get b"], [], [], 20], expected: "loop 2" }
  - name: approval
    description: approved and unapproved write tools, approval for a read tool
    group: correctness
    cases:
      - { args: [["book seat-1", "send note", "final"], ["book", "send"], ["book"], 10], expected: "needs-approval 1" }
      - { args: [["book seat-1", "send note", "final"], ["book", "send"], ["send", "book"], 10], expected: "answered 2" }
      - { args: [["read a", "final"], [], ["read"], 10], expected: "answered 1" }
  - name: same_tool_new_argument
    description: a repeated tool with a new argument is not a loop
    group: correctness
    cases:
      - { args: [["page 1", "page 2", "page 3", "page 4"], [], [], 50], expected: "no-answer 4" }
      - { args: [["page 1", "page 1-x", "page 1", "page 1-x"], [], [], 50], expected: "loop 3" }
  - name: rule_order
    description: a stopped call is a loop before it needs approval
    group: correctness
    cases:
      - { args: [["write a", "write a"], ["write"], ["write"], 5], expected: "loop 1" }
      - { args: [["read a", "write a", "read a"], ["write"], [], 5], expected: "needs-approval 1" }
