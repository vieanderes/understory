term: reducer
aka: [useReducer, dispatch, reducer function]
short: A pure function that takes the current state and an action, and returns the next state.
explain: |
  When several values change together, the rules for changing them end up scattered across
  handlers. One handler forgets to reset the error; another forgets the count. Moving every
  rule into one function puts them in one place.

  Handlers then only report what happened, as an action like `{ type: 'added', item }`. The
  function decides what that means. It must be pure: no fetching, no mutating, the same
  answer every time. That makes every rule testable without rendering anything. Returning
  the same state object tells React nothing changed.
analogy: A referee with a rulebook. Players call out what happened; only the referee changes the score.
example:
  language: ts
  code: |
    type Action = { type: 'added'; item: string } | { type: 'cleared' };

    function cartReducer(state: string[], action: Action): string[] {
      switch (action.type) {
        case 'added': return [...state, action.item];
        case 'cleared': return [];
      }
    }
usage: Four setters change together in that form, so move them into a reducer and test the rules on their own.
related: [state, pure-function, discriminated-union, react-context, immutability]
level: 2
lessons: [react.state-placement]
