id: arch.monorepos
title: Monorepos and workspaces
objective: Link a repository's packages with workspaces, use a package's `exports` as its public API, and tell a real boundary from files moved into a folder.
level: essential
minutes: 10
concepts: [arch.monorepos, arch.workspaces]
prerequisites: [arch.project-structure, tooling.node-and-npm, tooling.remotes]
opening:
  text: >-
    You'll keep several apps and their shared code in one repository, with boundaries a tool
    can check. And you'll spot a refactor that moves files around without changing a thing.

steps:
  - type: prose
    id: what-a-monorepo-is
    body: >-
      A shop might have a web app, an admin app and a package of shared buttons. A
      **monorepo** keeps them all in one Git repository. One commit can change a button and
      both apps that use it, and one pull request reviews the lot.


      ```text
      apps/web/         the shop
      apps/admin/       the back office
      packages/ui/      buttons, inputs
      ```

  - type: multiple-choice
    id: pick-monorepo-win
    concept: arch.monorepos
    difficulty: 1
    question: The shared button gets a required `label` prop. What does a monorepo give you here?
    choices:
      - text: One pull request that updates all three
        correct: true
        feedback: >-
          Right. The break and its fix arrive together, in one review.
      - text: Apps that can't break any more
        feedback: >-
          They still can. The difference is that you see the break in the same review, not
          after a release.
      - text: No need to test the apps
        feedback: >-
          Tests matter more, not less. They're what tells you the change reached every app
          that uses the button.

  - type: prose
    id: what-a-workspace-is
    body: >-
      Each folder is still an npm package with its own `package.json` and `name`, such as
      `@shop/ui`. A **workspace** is the package manager linking them. With pnpm, a
      `pnpm-workspace.yaml` file lists the folders.


      An app then depends on `"@shop/ui": "workspace:*"`, which means "the copy in this
      repository". After `pnpm install`, `import { Button } from '@shop/ui'` works as if it
      came from the registry.

  - type: fill-blank
    id: fill-workspace-dependency
    concept: arch.workspaces
    difficulty: 2
    language: json
    prompt: >-
      The web app should use the button package from this repository, not the registry.
      Fill in the dependency.
    template: |
      {
        "name": "web",
        "private": true,
        "dependencies": {
          "{{1}}": "{{2}}",
          "react": "^19.0.0"
        }
      }
    blanks:
      - key: '1'
        answer: '@shop/ui'
      - key: '2'
        answer: 'workspace:*'
    bank: ['@shop/ui', 'packages/ui', 'workspace:*', '^1.0.0']

  - type: prose
    id: package-exports
    body: >-
      A package's public API is the `exports` field in its `package.json`. It's lesson 2's
      entry file, at package size. Node refuses to import any path that `exports` doesn't
      list, with `ERR_PACKAGE_PATH_NOT_EXPORTED`.


      A relative path, like `../../packages/ui/src/format.js`, skips the package and its
      rule. So does one app importing another app's files.

  - type: bug-hunt
    id: hunt-relative-reach
    concept: arch.workspaces
    difficulty: 3
    language: js
    code: |
      // apps/admin/src/orders-page.js
      import { Button } from '@shop/ui';
      import { formatPrice } from '../../../packages/ui/src/internal/format.js';
      import { listOrders } from './orders-api.js';

      export function ordersPage(orders) {
        return orders.map((order) => `${order.id}: ${formatPrice(order.pence)}`);
      }
    prompt: >-
      It works today. Next week the UI team moves `format.js` and runs their own tests.
      Tap the import that breaks admin.
    lines: [3]
    reasons:
      - text: It walks past the package's `exports`
        correct: true
        feedback: >-
          Yes. The UI team never promised that path. Import it from `@shop/ui`, once it's
          exported.
      - text: '`@shop/ui` should be a relative path too'
        feedback: >-
          The package name is the stable door. A relative path is what ties admin to the UI
          team's folders.
      - text: '`listOrders` should come from a package'
        feedback: >-
          It's admin's own file, so a relative import is right. Relative paths are fine inside
          one package.

  - type: ai-review
    id: review-detour-package
    concept: arch.monorepos
    difficulty: 4
    language: js
    request: Admin imports files from the web app. Stop that, and share the code properly.
    flawClass: logic
    code: |
      // packages/shared/src/index.js, the assistant's new package
      export { Button } from './button.js';
      export { formatPrice } from './format-price.js';
      export { priceBasket } from '../../../apps/web/src/checkout/price-basket.js';
      export { refundOrder } from '../../../apps/web/src/orders/refund-order.js';
    prompt: >-
      An assistant wrote this. Admin now imports only `@shop/shared`, and the lint passes.
      Admin still breaks when web changes checkout. Tap the two lines that explain it.
    lines: [4, 5]
    reasons:
      - text: They re-export web's own files by a detour
        correct: true
        feedback: >-
          Yes. New path, same dependency. Move those rules out of web into a package.
      - text: '`Button` needs a package of its own'
        feedback: >-
          Maybe one day, but buttons aren't why admin breaks. Look at where the checkout code
          still lives.
      - text: Re-exports load slower than imports
        feedback: >-
          Any difference is tiny. The trouble is design: admin still depends on web's
          internal files.
    fix: |
      // packages/checkout/src/index.js: the rules now live here, and web imports them too
      export { priceBasket } from './price-basket.js';
      export { refundOrder } from './refund-order.js';

  - type: explain-back
    id: explain-moved-files
    concept: arch.monorepos
    difficulty: 4
    prompt: >-
      An assistant moved 60 files into `packages/`, and every import now starts with
      `@shop/`. Has coupling gone down? How would you check?
    rubric:
      - Moving files changes paths, not dependencies, so coupling is the same until what imports what changes.
      - Check each package's imports and its `exports`, and whether a change in one still forces changes in others.
      - A real boundary is a short `exports` list and dependencies that point one way, which a lint rule can enforce.
    modelAnswer: >-
      Not by itself. Coupling is about what depends on what, and a move keeps every
      dependency, only with new paths. I'd look at each package's `exports` and at what it
      imports. If `@shop/shared` re-exports half the web app, admin still depends on web.
      Then I'd take a change that used to hurt, like a checkout tweak, and see which
      packages it touches now. A real boundary shows up as a short `exports` list and arrows
      that only point one way.

recap:
  - Keep apps and shared packages in one repository, so a change and its fixes land in one review.
  - Link your own packages with `workspace:*`, and treat each package's `exports` as its public API.
  - Judge a refactor by what imports what, not by where the files now sit.

recall:
  - id: card-monorepo
    concept: arch.monorepos
    front: What is a monorepo, and what does it give you?
    back: >-
      One repository holding several apps and packages. A change that crosses them lands in
      one commit and one pull request.
  - id: card-workspace-star
    concept: arch.workspaces
    front: 'What does `"@shop/ui": "workspace:*"` mean in a `package.json`?'
    back: >-
      Use the `@shop/ui` package from this repository. The package manager links it into
      `node_modules` instead of downloading it.
  - id: card-exports
    concept: arch.workspaces
    front: What stops another package importing your internal files?
    back: >-
      The `exports` field in `package.json`. Node refuses any path it doesn't list. Relative
      paths skip it, so a lint rule should ban them across packages.
  - id: card-moved-files
    concept: arch.monorepos
    front: Why doesn't moving code into packages reduce coupling on its own?
    back: >-
      A move changes paths, not dependencies. Coupling drops only when what imports what
      changes.

