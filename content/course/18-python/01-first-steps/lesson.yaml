deepDive: >-
  **Getting Python.** macOS and Linux often ship a `python3`, and python.org has installers
  for every system. The uv tool, from lesson 12, installs and pins a version per project. This
  app runs CPython 3.13 in the browser, through Pyodide. Type `python3` with no file name and
  you get the **REPL**, a `>>>` prompt that runs each line as you type it. It's handy for
  trying one line before it goes in a file.


  **Types at run time.** Python checks types as each line runs and refuses to mix text and
  numbers, where JavaScript quietly converts. A name has no fixed type, so `score = 10`
  followed by `score = "ten"` is allowed; type hints, later in this chapter, let a checker
  catch that.


  **More formats.** After the colon in an f-string, `{n:,}` adds thousands separators
  (`1,234,567`) and `{x:>8}` right-aligns in eight characters. `{value=}` prints the
  expression and its value, which is handy for debugging.
