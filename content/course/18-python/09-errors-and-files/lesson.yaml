id: python.errors-and-files
title: Exceptions and tracebacks
objective: Raise and catch exceptions, catch only what you expect, and read a traceback from the bottom up.
level: essential
minutes: 10
concepts: [python.exceptions, python.tracebacks]
prerequisites: [python.comprehensions]
opening:
  text: >-
    You'll catch the errors you expect and let the rest fail loudly. Then you'll read a
    Python traceback straight to the line that broke, a skill that saves hours every week.

steps:
  - type: prose
    id: exceptions
    body: |-
      An **exception** is how Python reports a failure, like a thrown `Error` in JavaScript.
      `try` and `except` work like `try` and `catch`, but `except` names the type it
      handles:

      ```python
      try:
          count = int(text)
      except ValueError:
          count = 0
      ```

      `int("12")` gives `12`, and `int("12a")` raises `ValueError`. Any other error still
      escapes. `raise ValueError("too many")` starts one yourself, like `throw`.

  - type: fill-blank
    id: fill-except-raise
    concept: python.exceptions
    difficulty: 2
    prompt: Read a price from text. Bad text becomes `None`, and a negative price is an error.
    language: python
    template: |
      try:
          price = float(text)
      {{1}} ValueError:
          price = None
      if price is not None and price < 0:
          {{2}} ValueError(f"negative price: {text}")
    blanks:
      - key: '1'
        answer: except
      - key: '2'
        answer: raise
    bank: [except, catch, raise, throw]

  - type: prose
    id: reading-a-traceback
    body: |-
      When nothing catches an exception, Python stops and prints a **traceback**. Each
      `File` line and the code under it is a **frame**: one call that was still running,
      oldest first. `<module>` means the top level of the file.

      ```text
      Traceback (most recent call last):
        File "eval.py", line 10, in <module>
          print(report([]))
        File "eval.py", line 7, in report
          return f"Pass rate: {pass_rate(results)}"
        File "eval.py", line 3, in pass_rate
          return passed / len(results)
      ZeroDivisionError: division by zero
      ```

      Read it from the bottom. The last line names the error, and the frame right above it is
      the line that failed. JavaScript prints the newest call on top instead.

  - type: multiple-choice
    id: pick-failing-line
    concept: python.tracebacks
    difficulty: 2
    question: Which line of `app.py` raised the error?
    language: text
    code: |
      Traceback (most recent call last):
        File "app.py", line 10, in <module>
          welcome_all([{"name": "Ana"}, {"id": 7}])
        File "app.py", line 7, in welcome_all
          print(greeting(user))
        File "app.py", line 2, in greeting
          return f"Welcome, {user['name']}"
      KeyError: 'name'
    choices:
      - text: Line 2, in `greeting`
        correct: true
        feedback: >-
          Yes. The frame right above the error line is where it broke.
      - text: Line 10, where the program started
        feedback: >-
          Most people read from the top, as in JavaScript. That's where the chain began.
      - text: Line 7, in `welcome_all`
        feedback: >-
          That call led there. The error came one call deeper, in `greeting`.

  - type: bug-hunt
    id: hunt-bad-data
    concept: python.tracebacks
    difficulty: 3
    language: python
    code: |
      def greeting(user):
          return f"Welcome, {user['name']}"


      def welcome_all(users):
          for user in users:
              print(greeting(user))


      welcome_all([{"name": "Ana"}, {"id": 7}])
    prompt: "This is `app.py`. It failed on line 2 with `KeyError: 'name'`. Which line brought in the bad value?"
    lines: [10]
    reasons:
      - text: The second user has no `name` key
        correct: true
        feedback: >-
          Right. It crashed on line 2, but the bad data came in on line 10.
      - text: The quotes inside the f-string clash
        feedback: >-
          Single quotes inside double quotes are fine. The dict has no `name`.
      - text: '`welcome_all` skips the first user'
        feedback: >-
          Ana is greeted first. The crash comes on the second user.
    fix: |
      welcome_all([{"name": "Ana"}, {"id": 7, "name": "Ben"}])

  - type: prose
    id: catch-narrowly
    body: |-
      Catch only the errors you expect, and let the rest fail loudly.

      A bare `except:` or `except Exception:` catches nearly everything: typos, missing
      keys, your own bugs. The program carries on with a wrong value, and the traceback that
      would have told you why never appears.

      Name the type instead: `except ValueError:`. Keep your own `raise` outside the `try`,
      or your own `except` catches it too.

  - type: ai-review
    id: review-broad-except
    concept: python.exceptions
    difficulty: 3
    language: python
    request: Write parse_quantity(text), returning 0 when the text isn't a number.
    flawClass: logic
    code: |
      def parse_quantity(text):
          try:
              return int(text.strip())
          except Exception:
              return 0
    prompt: >-
      An assistant wrote this. For a week, a bug upstream sent `None`, and every order
      quietly became quantity 0. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It catches every error, not only bad numbers
        correct: true
        feedback: >-
          Yes. `except ValueError:` handles bad text and lets the `None` bug crash loudly.
      - text: '`strip` should come after `int`'
        feedback: >-
          `int` needs text, so `strip` goes first. The trouble is what the `except`
          swallows.
      - text: '`return 0` should be `return None`'
        feedback: >-
          Either fallback is a choice. The bug is that a crash on `None` is hidden too.
    fix: |
      def parse_quantity(text):
          try:
              return int(text.strip())
          except ValueError:
              return 0

  - type: code-challenge
    id: write-total-quantity
    concept: python.exceptions
    difficulty: 3
    language: python
    starter: quantity.starter.py
    solution: quantity.solution.py
    tests: quantity.tests.py
    prompt: >-
      Write `total_quantity(lines)`. Each line is text from an order form. Add up the lines
      that are whole numbers and skip the rest. A negative number raises `ValueError`, with
      `negative` in its message.


      Example: `["2", "x", "5"]` gives `7`, and `["3", "-1"]` raises `ValueError`.
    hints:
      - 'The first step catches the `ValueError` that `int` raises.'
      - 'Keep your own `raise` out of the `try`, or your `except` catches it too.'
      - 'In the loop, try `quantity = int(line)`, and set it to 0 in the `except`.'

  - type: explain-back
    id: explain-read-bottom-up
    concept: python.tracebacks
    difficulty: 3
    prompt: >-
      A teammate reads a Python traceback from the top and ends up in the wrong function.
      How should they read it?
    rubric:
      - The last line names the exception and its message.
      - The frame right above it is the line that failed.
      - The top is where the program started, oldest call first.
    modelAnswer: >-
      Start at the bottom. The last line says what went wrong, and the frame right above it
      is the line that raised it. Each frame above that is the call that led there, back to
      where the program started at the top.

recap:
  - Catch named exceptions with `try` and `except`, and `raise` your own.
  - Catch only what you expect, so real bugs still fail loudly.
  - Read a traceback from the bottom up, then look for where the bad value came in.
recall:
  - id: card-except-type
    concept: python.exceptions
    front: What's wrong with `except Exception:` around a small parse?
    back: >-
      It hides every error, bugs included. Catch the type you expect, such as `ValueError`.
  - id: card-raise
    concept: python.exceptions
    front: How do you signal bad input from your own function?
    back: >-
      `raise ValueError("what went wrong")`, Python's `throw`.
  - id: card-traceback-bottom
    concept: python.tracebacks
    front: Where in a Python traceback is the line that failed?
    back: >-
      At the bottom, right above the last line, which names the error.
  - id: card-crash-vs-cause
    concept: python.tracebacks
    front: The traceback points at a line that looks fine. Where do you look next?
    back: >-
      At where its values came from: a caller higher in the traceback, or the data passed in.

