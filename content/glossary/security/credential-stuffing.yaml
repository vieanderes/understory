term: credential stuffing
short: Trying email and password pairs leaked from other sites against your login, at machine speed.
explain: |
  People reuse passwords. When one site is breached, its email and password pairs end up
  in lists that anyone can download. Attackers replay those pairs on every other login page
  they can find, and some of them work.

  Each account sees only one attempt, so a per-account limit misses it. Its cousin, password
  spraying, tries one common password on many accounts. Key limits by account and by IP together, and check new passwords against breach lists.
  Offer MFA, and alert on many accounts failing from one source.
analogy: Someone finds a bag of house keys and walks down every street trying each key in each door.
usage: That spike of failed logins across ten thousand accounts is credential stuffing; turn on the per-IP limit.
related: [rate-limiting, authentication, account-enumeration, alerting]
level: 2
lessons: [security.abuse-and-privacy, security.detection-and-logging]
