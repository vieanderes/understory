term: continuous delivery
aka:
  - CD
  - continuous deployment
short: Keeping every tested change ready to release, so shipping to users is a routine button press or automatic.
explain: |
  Releasing once a month means a month of changes go out at once. When something breaks,
  which of the two hundred changes did it?

  So the pipeline doesn't stop at a green build. It packages the change, deploys it to a
  staging environment, and makes production one approval away. **Continuous deployment**
  removes even that approval: every passing change goes live. Small, frequent releases are
  easier to check and easier to roll back.
analogy: A bakery that sends out each tray as it cools, instead of piling up a week's bread for one delivery.
example:
  language: yaml
  code: |
    # runs after check passes on main
    deploy:
      needs: check
      branch: main
      environment: production
      steps:
        - ./scripts/deploy.sh
usage: With continuous delivery in place, the fix was live twenty minutes after the merge.
twin:
  term: continuous-integration
  difference: Continuous delivery is about releasing, keeping every passing change ready to go live. Continuous integration is the step before, checking every change by building and testing it.
related:
  - continuous-integration
  - feature-flag
  - trunk-based-development
level: 2
lessons:
