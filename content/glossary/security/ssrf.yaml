term: SSRF
aka:
  - server-side request forgery
short: An attack that tricks a server into fetching a URL the attacker chose, often an internal one.
explain: |
  Your app fetches a URL the user gives it: a link preview, a webhook, an image import. The
  attacker gives an address only your server can reach. Think of an internal admin page, or
  the cloud metadata service that hands out credentials.

  The server makes the request from inside your network, with its trust. Defend with an
  allow list of hosts. Resolve the address and refuse private ranges, and don't follow
  redirects blindly. A blocklist of strings is always one encoding away from a bypass.
analogy: Asking the receptionist to pop into the server room and read you what's on the screen. They have the badge; you don't.
example:
  language: http
  code: |
    POST /api/preview HTTP/1.1
    Content-Type: application/json

    {"url": "http://169.254.169.254/latest/meta-data/"}
usage: The image import fetches any URL from the server, so that's SSRF into the metadata endpoint.
