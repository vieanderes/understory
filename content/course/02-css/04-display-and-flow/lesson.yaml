id: css.display-and-flow
title: Block, inline and display
objective: "Predict how boxes flow down a page, switch it with `display`, and tame content that overflows."
level: essential
minutes: 10
concepts: [css.normal-flow, css.display, css.overflow]
prerequisites: [css.box-model]
opening:
  text: >-
    You'll see why some boxes stack while others sit in a line, and switch between the two.
    You'll also stop text from spilling out of a box it doesn't fit.

steps:
  - type: prose
    id: block-and-inline
    body: >-
      With no layout rules, boxes follow the **normal flow**. Block boxes, such as `h1`, `p`
      and `div`, start on a new line and stretch the full width. They stack down the page.


      Inline boxes, such as `a`, `strong` and `span`, sit inside a line of text. They're only
      as wide as their words. `span` is a plain inline box, the way `div` is a plain block.

  - type: playground
    id: see-the-boxes
    concept: css.normal-flow
    difficulty: 1
    prompt: >-
      The paragraph already has a red border. Give the `strong` rule `border: 2px solid
      royalblue;`. Compare the two: one box fills the width, the other hugs its words.
    html: |
      <h1>Sourdough starter</h1>
      <p>Feed it <strong>every day</strong> with flour and water.</p>
      <p>Keep it somewhere warm.</p>
    css: |
      body { font-family: sans-serif; }
      p { border: 2px solid tomato; }
      strong { }
    editable: [css]
    checks:
      - label: The strong text has a solid border
        selector: strong
        style: { property: border-top-style, value: solid }
      - label: Its border is royal blue
        selector: strong
        style: { property: border-top-color, value: 'rgb(65, 105, 225)' }
    solution:
      css: |
        body { font-family: sans-serif; }
        p { border: 2px solid tomato; }
        strong { border: 2px solid royalblue; }
    hints:
      - The declaration goes between the braces of `strong { }`.
      - A border needs a width, a style and a colour.
      - 'Write `strong { border: 2px solid royalblue; }`.'

  - type: prose
    id: the-display-property
    body: |-
      The `display` property switches how a box behaves:

      - `block`: starts a new line and fills the width
      - `inline`: flows with the text and ignores `width` and `height`
      - `inline-block`: flows with the text, but takes a width, a height and margins like a block
      - `none`: removes the box from the page entirely

      Two more values, `flex` and `grid`, get lessons of their own.

  - type: multiple-choice
    id: pick-inline-width
    concept: css.display
    difficulty: 2
    language: html
    code: |
      <style>
        .price { width: 120px; background: gold; }
      </style>
      <p>Total: <span class="price">£48</span></p>
    question: The gold box stays as narrow as `£48`. Which declaration makes the width apply?
    choices:
      - text: '`display: inline-block;`'
        correct: true
        feedback: >-
          Yes. It stays in the line but takes a width like a block.
      - text: '`display: inline;`'
        feedback: >-
          A `span` is inline already, and inline boxes ignore `width`. That's the problem.
      - text: '`height: 40px;`'
        feedback: >-
          An inline box ignores `height` too. It needs a different `display` value first.
      - text: '`display: none;`'
        feedback: >-
          That removes the price from the page altogether.

  - type: playground
    id: space-the-tags
    concept: css.display
    difficulty: 2
    prompt: >-
      The tags overlap, and one even splits across two lines. Inline boxes do that: their
      top and bottom margins don't count. Make `.tag` `display: inline-block;` and watch them
      sort themselves out.
    html: |
      <div class="tags">
        <span class="tag">baking</span>
        <span class="tag">bread</span>
        <span class="tag">fermentation</span>
        <span class="tag">weekend projects</span>
        <span class="tag">beginner</span>
      </div>
    css: |
      body { font-family: sans-serif; }
      .tags { max-width: 260px; }
      .tag {
        background: lavender;
        border-radius: 16px;
        padding: 4px 12px;
        margin: 6px 2px;
      }
    editable: [css]
    checks:
      - label: The tags are inline-block
        selector: .tag
        style: { property: display, value: inline-block }
    solution:
      css: |
        body { font-family: sans-serif; }
        .tags { max-width: 260px; }
        .tag {
          display: inline-block;
          background: lavender;
          border-radius: 16px;
          padding: 4px 12px;
          margin: 6px 2px;
        }
    hints:
      - The change goes inside the `.tag` rule.
      - The tags should stay in a line, but act like blocks for spacing.
      - 'Add `display: inline-block;`.'

  - type: prose
    id: overflow
    body: |-
      A box with a set `height` can be too small for its content. Then the content spills out
      and draws over whatever comes next. The **`overflow`** property decides what happens:

      - `visible`: it spills out, the default
      - `hidden`: whatever doesn't fit is cut off
      - `auto`: the box gets a scroll bar, only when it's needed

  - type: predict-output
    id: predict-spilling-text
    concept: css.overflow
    difficulty: 2
    language: html
    code: |
      <style>
        .note { height: 40px; border: 1px solid; }
      </style>
      <div class="note">Four lines of text, about 80px tall...</div>
      <p>Next up: the recipe.</p>
    question: The note's text needs 80px. What happens to the next paragraph?
    choices:
      - text: It overlaps the spilled text
        correct: true
        feedback: >-
          Right. The page still thinks the note is 40px tall, so the paragraph starts there.
      - text: It moves down, below all the text
        feedback: >-
          Most people expect that. But the box stays 40px, and only the box pushes things down.
      - text: The extra text is cut off
        feedback: >-
          That's `overflow: hidden`. The default, `visible`, lets it spill out.

  - type: playground
    id: scroll-the-chat
    concept: css.overflow
    difficulty: 2
    prompt: >-
      The chat box is 160px tall, and the messages spill out over the reply field. Give
      `.messages` `overflow: auto;` and scroll the messages inside their box.
    html: |
      <div class="messages" tabindex="0">
        <p>Are we still on for Saturday?</p>
        <p>Yes. Ten at the market?</p>
        <p>Perfect. I'll bring coffee.</p>
        <p>Oat milk for me.</p>
        <p>Noted. See you there.</p>
        <p>Running five minutes late.</p>
        <p>No rush. I'm by the flowers.</p>
      </div>
      <input placeholder="Reply">
    css: |
      body { font-family: sans-serif; }
      .messages {
        height: 160px;
        border: 2px solid slateblue;
        padding: 0 8px;
      }
      input { margin-top: 8px; padding: 8px; }
    editable: [css]
    checks:
      - label: The messages scroll when they overflow
        selector: .messages
        style: { property: overflow, value: auto }
    solution:
      css: |
        body { font-family: sans-serif; }
        .messages {
          height: 160px;
          border: 2px solid slateblue;
          padding: 0 8px;
          overflow: auto;
        }
        input { margin-top: 8px; padding: 8px; }
    hints:
      - The fix goes on the box that's too small.
      - '`hidden` would cut the messages off. You want to scroll to them.'
      - 'Add `overflow: auto;` inside the `.messages` rule.'

  - type: explain-back
    id: explain-inline-width
    concept: css.display
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why does `width: 120px` do nothing on a `span`, and why does `display: inline-block`
      make it work?
    rubric:
      - A `span` is an inline box, which sits in a line of text and is as wide as its words.
      - Inline boxes ignore `width`, `height` and top and bottom margins.
      - '`inline-block` keeps it in the line but sizes it like a block, so the width applies.'
    modelAnswer: >-
      A `span` is inline: it's part of a line of text, as wide as its words. Inline boxes
      ignore `width`, `height` and vertical margins, so the 120px does nothing. With
      `display: inline-block` it still sits in the line, but it's sized like a block, so the
      width applies.

recap:
  - Tell block boxes from inline ones, and predict how they flow.
  - Switch a box with `display`, including `inline-block` and `none`.
  - Clip or scroll content that doesn't fit with `overflow`.

recall:
  - id: card-block-or-inline
    concept: css.normal-flow
    front: How do block boxes and inline boxes differ in the normal flow?
    back: >-
      Block boxes start on a new line and fill the width. Inline boxes sit in a line of text
      and are as wide as their content.
  - id: card-inline-ignores
    concept: css.display
    front: Which declarations does an inline box such as a `span` ignore?
    back: >-
      `width`, `height`, and the top and bottom margins. `display: inline-block` makes them
      apply.
  - id: card-overflow-values
    concept: css.overflow
    front: 'What do `overflow: hidden` and `overflow: auto` each do?'
    back: >-
      `hidden` cuts off whatever doesn't fit. `auto` adds a scroll bar when the content is too
      big.
  - id: card-spill-overlaps
    concept: css.overflow
    front: Text spills out of a 40px box. Why does the next paragraph overlap it?
    back: >-
      Only the box takes up space in the flow. The spilled text doesn't push anything down.

references:
  - kind: spec
    title: CSS Display Module Level 3
    authors: Elika J. Etemad, Tab Atkins Jr.
    venue: W3C
    url: https://www.w3.org/TR/css-display-3/
    note: 'The `display` values, block and inline boxes, and `display: none`.'
    primary: true
    verified: true
  - kind: docs
    title: Block and inline layout in normal flow
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Display/Block_and_inline_layout
    note: How block and inline boxes flow, with live examples.
    verified: true
  - kind: docs
    title: Overflow
    venue: web.dev, Learn CSS
    url: https://web.dev/learn/css/overflow
    note: Every `overflow` value, scroll bars, and when content spills.
    verified: true

deepDive: >-
  `visibility: hidden` hides a box but keeps its space, so a gap stays behind. `display: none`
  removes the box, and screen readers skip it too. That makes it the right choice for content
  nobody should reach, and the wrong one for a label only a screen reader should hear.


  Inline boxes do take padding and borders, but top and bottom padding don't push the lines
  apart. On text that wraps, a padded inline link can overlap the line above it.


  A box with `overflow` other than `visible` also keeps its children's margins inside it, like
  `display: flow-root`. That's why `overflow: hidden` used to be the usual fix for escaping
  margins.


  A long unbroken word, such as a URL, can overflow a narrow box sideways. `overflow-wrap:
  anywhere` lets the browser break it.
