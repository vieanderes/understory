term: multi-tenancy
aka: [multi-tenant, tenant, tenant isolation]
short: One deployment of an app serving many customer organisations, each kept apart from the others.
explain: |
  Running a separate copy of your software for every business customer is expensive. So
  most business software runs one copy, and each customer organisation lives inside it with
  its own users and data. The defining risk is a leak: one query that forgot its filter and
  showed one company another company's invoices.

  The defence is layered. The tenant id comes from the signed-in session, never from the
  request. A store scoped to that tenant applies the filter once, and row-level security
  checks it again in the database. Isolation can be a shared table, a schema per customer or
  a database per customer, trading running cost for separation.
analogy: A block of flats. One building, shared pipes and lifts, but your key opens only your own door.
example:
  language: sql
  code: |
    CREATE TABLE invoices (
      tenant_id uuid NOT NULL,
      id uuid NOT NULL,
      total_pence integer NOT NULL,
      PRIMARY KEY (tenant_id, id)
    );
usage: Every cache key needs the tenant id too; multi-tenancy doesn't stop at the database.
related: [row-level-security, noisy-neighbour, authorisation, least-privilege]
level: 2
lessons: [arch.tenants]
