deepDive: >-
  Already know this? Two surprises worth knowing. Division doesn't round: `7 / 2` is `3.5`.
  And decimals aren't always exact: `0.1 + 0.2` shows `0.30000000000000004`, because the
  computer stores numbers in binary. That's why shops often count money in pence.


  Only `+` joins text. The other operators turn text into a number where they can, so
  `"5" - 1` is `4`, while `"5" + 1` is `51`. The JavaScript chapter looks at these rules
  closely.
