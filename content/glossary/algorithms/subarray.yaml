term: subarray
aka: [subarrays, contiguous subarray, substring]
short: A run of neighbouring items taken from a list, with no gaps and the order kept.
explain: |
  From `[4, 2, 7, 1]`, `[2, 7]` is one, and so is `[4, 2, 7]`. But `[4, 7]` isn't, because
  it skips the 2. For text, the same idea is called a substring.

  A list of n items has about n²/2 of them, so checking each one is slow. The word "contiguous" is the hint. It points at a sliding window, prefix sums or
  Kadane's algorithm, which handle them all in one pass.

  Read the task carefully. "Subsequence" sounds similar but allows gaps, and needs
  different tools.
analogy: A slice of bread from a loaf. Neighbouring pieces, cut in one go, never two slices from opposite ends.
example:
  language: js
  code: |
    const nums = [4, 2, 7, 1];
    nums.slice(1, 3); // [2, 7]: neighbours, in order
    // [4, 7] is not one: it skips the 2
usage: It says contiguous subarray, so a sliding window works; if gaps were allowed we'd need DP.
twin:
  term: subsequence
  difference: A subarray is a run of neighbours with no gaps. A subsequence keeps the order but may skip items, so there are far more of them.
related: [subsequence, sliding-window, prefix-sum, kadanes-algorithm]
level: 2
lessons: [algo.sliding-window, algo.maximum-slice]
