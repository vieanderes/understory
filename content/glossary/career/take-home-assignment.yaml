term: take-home assignment
aka:
  - take-home
  - take-home test
  - take-home exercise
short: A small project a hiring team sets you to build on your own time, then review together.
explain: |
  Instead of coding live, you get a brief and a few days. You build it at home, send it back,
  and often walk the team through it.

  Reviewers read the README first. Then they run it from a fresh clone, run the tests, and try
  something that should fail. Only after that do they read the code. A clear setup and
  honest notes on what you left out score more than extra features.

  Keep to the time budget and the rules on AI tools, and say how you used them. Twenty hours
  on a four-hour brief doesn't impress; it tells them you can't scope.
analogy: A trial shift at a restaurant. They care whether the food arrives on time, not how fancy it is.
usage: The take-home asked for four hours, so I listed what I'd add next instead of building it.
related:
  - scope-creep
  - non-goal
  - project-deep-dive
level: 2
