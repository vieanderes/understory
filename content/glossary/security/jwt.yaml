term: JWT
aka:
  - JSON Web Token
short: A signed, readable string carrying claims about a user, trusted by its signature instead of a lookup.
explain: |
  After login, the server hands you a string in three parts. There's a header, some claims
  such as your user id and expiry, and a signature. Any server holding the key can check the
  signature and trust the claims, without asking a database.

  The traps: the claims are encoded, not encrypted, so anyone can read them. You can't
  revoke one before it expires without adding back the lookup you avoided. And the server
  must pin the algorithm it expects, or a forged token claiming `alg: none` may pass.
analogy: A wristband at a gig. Staff trust it on sight without phoning the box office. That's also why a lost one keeps working until the night ends.
usage: The JWT lives for 30 days and we can't revoke it, so shorten it and add a refresh step.
twin:
  term: session
  difference: A JWT carries the user's state itself, signed, so no lookup is needed and revoking it is hard. A session keeps the state on the server and gives the browser only an id.
related:
  - session
  - authentication
  - secret
level: 2
lessons: [security.jwt-pitfalls, backend.oauth-and-passkeys]
