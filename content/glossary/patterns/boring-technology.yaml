term: boring technology
aka:
  - choose boring technology
  - innovation tokens
short: Preferring well-known tools whose failure modes are understood, and spending novelty only where it clearly pays.
explain: |
  A new database promises to be faster. It may be. It also brings bugs nobody has written about and missing tools. Nobody on call knows how it fails
  at three in the morning.

  Old, widely used tools fail in documented ways. That makes them cheaper to run, even when
  they're less exciting.

  A team gets a few "innovation tokens" to spend on new things. Spend them where the new thing is why people choose your product, not on problems you don't have.
analogy: A restaurant using a standard oven, so any chef can cook in it and any repairer can fix it.
usage: Postgres can do this with a queue table; boring technology beats adding a new broker for one feature.
