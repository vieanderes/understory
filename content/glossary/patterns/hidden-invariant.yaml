term: hidden invariant
aka:
  - unstated invariant
  - implicit invariant
short: A rule the code relies on but never states or checks, such as a list always being sorted.
explain: |
  The search assumes the list is sorted. Nothing says so. It works because the only caller
  happens to sort first. Then someone adds a second caller, and the search starts returning
  wrong answers without an error.

  An invariant is a rule that must always hold. When it lives only in someone's head, the
  first person who doesn't know it breaks it.

  Make it visible. Put it in a type, enforce it in one constructor, or assert it. At the least,
  write it in a comment beside the code that relies on it.
analogy: A shared fridge where everyone "knows" the top shelf is for milk. The new flatmate doesn't.
usage: The cache key assumes ids never repeat across tenants; that hidden invariant broke when we added a second region.
related:
  - principle-of-least-surprise
  - assertion
  - information-hiding
  - discriminated-union
level: 3
