id: basics.objects
title: Objects
objective: Group related values in an object and work with a list of objects.
level: essential
minutes: 10
concepts: [basics.objects, basics.lists-of-objects]
prerequisites: [basics.arrays]
opening:
  text: >-
    You'll group related facts into one object, like a contact with a name and an email. Then
    you'll handle a whole list of them, the way real apps store data.

steps:
  - type: prose
    id: what-an-object-is
    body: |-
      An **object** groups values under names, called properties:

      ```js
      const book = {
        title: "Dune",
        pages: 412,
      };
      ```

      Read a property with a dot: `book.title` is `"Dune"`. Change one the same way:
      `book.pages = 500;`. Ask for a property that isn't there, like `book.author`, and you
      get `undefined`.

  - type: predict-output
    id: predict-property
    concept: basics.objects
    difficulty: 1
    language: js
    code: |
      const user = { name: "Mia", age: 31 };
      console.log(user.age);
    question: What does this show?
    choices:
      - text: '`31`'
        correct: true
        feedback: >-
          Yes. The dot reads the value stored under `age`.
      - text: '`age`'
        feedback: >-
          `age` is the property's name. The dot gives you its value.
      - text: '`Mia`'
        feedback: >-
          That's `user.name`. This line asks for `age`.

  - type: fill-blank
    id: fill-mark-done
    concept: basics.objects
    difficulty: 2
    language: js
    prompt: You bought the milk. Finish line 3, so the task is marked done.
    template: |
      const task = { title: "Buy milk", done: false };
      // Mark it done:
      {{1}} = {{2}};
    blanks:
      - key: '1'
        answer: task.done
      - key: '2'
        answer: 'true'
    bank: [task.done, done, 'true', '"true"']

  - type: prose
    id: lists-of-objects
    body: |-
      Real data is often a list of objects with the same shape:

      ```js
      const tasks = [
        { title: "Buy milk", done: true },
        { title: "Call the dentist", done: false },
      ];
      ```

      `tasks[1]` is the second task, and `tasks[1].title` is its title. Loop over the list to
      work with each one.

      `done` already holds `true` or `false`, so it can be a condition on its own:
      `if (task.done)`.

  - type: multiple-choice
    id: pick-path
    concept: basics.lists-of-objects
    difficulty: 2
    language: js
    code: |
      const tasks = [
        { title: "Buy milk", done: true },
        { title: "Call the dentist", done: false },
      ];
    question: Which shows `Buy milk`?
    choices:
      - text: '`console.log(tasks[0].title);`'
        correct: true
        feedback: >-
          Yes. First item, index 0, then its `title`.
      - text: '`console.log(tasks.title[0]);`'
        feedback: >-
          The list itself has no `title`. Pick the item first, then the property.
      - text: '`console.log(tasks[1].title);`'
        feedback: >-
          Index 1 is the second task, `Call the dentist`.

  - type: fill-blank
    id: fill-open-tasks
    concept: basics.lists-of-objects
    difficulty: 2
    language: js
    prompt: Show the title of every task in `tasks` that isn't done yet.
    template: |
      for (const task of {{1}}) {
        if ({{2}} === false) {
          console.log({{3}});
        }
      }
    blanks:
      - key: '1'
        answer: tasks
      - key: '2'
        answer: task.done
      - key: '3'
        answer: task.title
    bank: [tasks, task, task.done, tasks.done, task.title, tasks.title]

  - type: bug-hunt
    id: hunt-wrong-property
    concept: basics.objects
    difficulty: 3
    language: js
    code: |
      const contact = { name: "Leo", email: "leo@example.com" };
      console.log(`Email: ${contact.Email}`);
    prompt: 'This shows `Email: undefined`. Tap the line at fault.'
    lines: [2]
    reasons:
      - text: '`Email` and `email` are different names'
        correct: true
        feedback: >-
          Exactly. Capital letters count, and there's no `Email` property.
      - text: A template literal can't read properties
        feedback: >-
          It can. `${contact.name}` would show `Leo` without any trouble.
      - text: '`contact` should be a `let`'
        feedback: >-
          Nothing is changed here, so `const` is right.
    fix: |
      const contact = { name: "Leo", email: "leo@example.com" };
      console.log(`Email: ${contact.email}`);

  - type: code-challenge
    id: write-cart-total
    concept: basics.lists-of-objects
    difficulty: 3
    language: js
    starter: starter.js
    editable: '2'
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write the function `cartTotal(items)`. Each item is an object with a `price` and a
      `quantity`. Return the price times the quantity, added up over all items.


      For example, `cartTotal([{ price: 3, quantity: 2 }, { price: 5, quantity: 1 }])` returns
      `11`. An empty cart returns `0`.
    hints:
      - Loop over `items`, and keep a running total outside the loop.
      - For one item, the cost is `item.price * item.quantity`.
      - 'Start with `let total = 0;` and `for (const item of items) {`'

  - type: explain-back
    id: explain-object-vs-array
    concept: basics.lists-of-objects
    difficulty: 3
    prompt: When would you use an object, and when an array?
    rubric:
      - An object groups different facts about one thing, each under a name.
      - An array keeps an ordered list of similar things.
      - Real data often combines them, as a list of objects.
    modelAnswer: >-
      An object describes one thing, like a task with a title and a done flag. Each fact has a
      name. An array holds many similar things in order, like all your tasks. Most real data
      is both: an array of objects.

recap:
  - "Group related values in one object."
  - "Read and change a property by its name."
  - "Work through a list of objects with a loop."
recall:
  - id: card-dot
    concept: basics.objects
    front: How do you read the `title` property of an object called `book`?
    back: >-
      With a dot: `book.title`.
  - id: card-case
    concept: basics.objects
    front: What do you get when you read a property that doesn't exist?
    back: >-
      `undefined`. Check the spelling, including capital letters.
  - id: card-list-of-objects
    concept: basics.lists-of-objects
    front: How do you read the title of the first task in a `tasks` list?
    back: >-
      `tasks[0].title`. Pick the item first, then the property.

references:
  - kind: docs
    title: Objects
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/object
    note: Properties, reading and changing them.
    primary: true
    verified: true
  - kind: docs
    title: JavaScript object basics
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Object_basics
    note: A beginner's guide to objects.
    primary: true
    verified: true

deepDive: >-
  Already know this? Properties can also be read with square brackets: `book["title"]`. That
  form lets you use a name stored in a variable, like `book[field]`.


  Objects can hold other objects and lists, as deep as you like. That's exactly the shape of
  JSON, the format most web APIs use to send data.
