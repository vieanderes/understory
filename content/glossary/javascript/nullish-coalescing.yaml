term: nullish coalescing
aka:
  - '??'
  - nullish coalescing operator
short: An operator that picks a fallback only when the value on its left is null or undefined.
explain: |
  You often want a default, like a page size of 20 when none is given. `||` does that, but
  it also replaces `0` and `''`, which may be real answers.

  `??` steps in only for `null` and `undefined`, so `0 ?? 20` stays `0`. Pair it with
  optional chaining to read deep values safely: `user?.settings?.pageSize ?? 20`.
analogy: A spare key under the mat. You use it only when your own key is missing, not when you don't like it.
example:
  language: js
  code: |
    const volume = 0;
    volume || 50; // 50: 0 is falsy
    volume ?? 50; // 0: a real setting
usage: Use nullish coalescing there, because a volume of 0 is a valid setting.
twin:
  term: falsy
  difference: Falsy covers eight values, 0 and '' among them. Nullish covers only null and undefined, so `??` keeps a 0 that `||` would throw away.
related:
