approach: >-
  Turn each list into a map from id to hash, so a repeated id keeps its later row and every
  lookup is O(1). Walk the fetched map: an id missing from the snapshot is a create, a
  different hash is an update. Walk the snapshot map: an id missing from the fetch is a
  delete. Sort each group, then apply the safety valve with whole-number arithmetic: more
  than T distinct ids before, and fetched × 100 < Q × before.
complexity: O((N + M) log(N + M)) time for the sorts, O(N + M) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N and M reach 100,000** and the word **efficient** is
      there, so looking each id up by scanning the other list (100,000 × 100,000) will time
      out.

      Then mark the two traps in the story: a repeated id keeps its **later** row, and the
      valve counts **distinct** ids.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the three kinds of change and the valve in one comment.
    code:
      ts: |-
        // Diff id -> hash maps: create (new id), update (new hash), delete (gone id), unless the valve holds deletes.
      python: |-
        # Diff id -> hash maps: create (new id), update (new hash), delete (gone id), unless the valve holds deletes.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - an empty fetch with the valve off, then on;
      - a fetch at exactly Q percent, which must not trigger the valve;
      - a repeated id whose later row changes the answer;
      - ids that sort differently as text and as numbers.
    input:
      - "([[7, 1], [3, 1]], [], 50, 5)"
      - "([[7, 1], [3, 1]], [], 50, 1)"
      - "([[1, 1], [2, 1], [3, 1], [4, 1]], [[1, 1], [2, 1]], 50, 3)"
      - "([[5, 1], [6, 1], [5, 2]], [[5, 3], [5, 2], [6, 1]], 50, 0)"
      - "([[100, 1], [9, 1], [20, 1]], [[1000, 1], [3, 1]], 0, 100000)"
  - kind: ask-ai
    title: Check the percentage test, not the method
    minutes: 1
    body: |-
      A percentage with division invites rounding slips. Ask one narrow question about the
      boundary.
    prompt: >-
      Without writing code: to test "fetched is fewer than Q percent of before" with whole
      numbers and no rounding, is fetched * 100 < Q * before the exact condition? One
      sentence.
    expect: >-
      Yes. Multiplying both sides by 100 removes the division, so 2 of 4 at Q = 50 is not
      fewer.
  - kind: write
    title: Bank a correct version first
    minutes: 6
    body: |-
      Build the maps first, then diff them. This version uses maps already, which is the
      natural way to keep the later row. If you started with nested loops instead, that
      version is correct but O(N × M): it passes correctness and fails the large tests.
    code:
      ts: |-
        // Diff id -> hash maps: create (new id), update (new hash), delete (gone id), unless the valve holds deletes.
        function solution(P: number[][], F: number[][], Q: number, T: number): string[] {
          const before = new Map<number, number>();
          for (const [id, hash] of P) before.set(id, hash);
          const after = new Map<number, number>();
          for (const [id, hash] of F) after.set(id, hash);
          const created: number[] = [];
          const updated: number[] = [];
          for (const [id, hash] of after) {
            if (!before.has(id)) created.push(id);
            else if (before.get(id) !== hash) updated.push(id);
          }
          const deleted: number[] = [];
          for (const id of before.keys()) if (!after.has(id)) deleted.push(id);
          const ascending = (a: number, b: number) => a - b;
          const changes = [
            ...created.sort(ascending).map((id) => `create ${id}`),
            ...updated.sort(ascending).map((id) => `update ${id}`),
          ];
          if (before.size > T && after.size * 100 < Q * before.size) {
            changes.push(`abort ${deleted.length}`);
          } else {
            changes.push(...deleted.sort(ascending).map((id) => `delete ${id}`));
          }
          return changes;
        }
      python: |-
        # Diff id -> hash maps: create (new id), update (new hash), delete (gone id), unless the valve holds deletes.
        def solution(P, F, Q, T):
            before = {}
            for record_id, content in P:
                before[record_id] = content
            after = {}
            for record_id, content in F:
                after[record_id] = content
            created = [i for i in after if i not in before]
            updated = [i for i in after if i in before and before[i] != after[i]]
            deleted = [i for i in before if i not in after]
            changes = ['create ' + str(i) for i in sorted(created)]
            changes += ['update ' + str(i) for i in sorted(updated)]
            if len(before) > T and len(after) * 100 < Q * len(before):
                changes.append('abort ' + str(len(deleted)))
            else:
                changes += ['delete ' + str(i) for i in sorted(deleted)]
            return changes
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Check each of your cases against
      the rules.
    expect: >-
      Three OKs, then ["delete 3", "delete 7"], ["abort 2"], ["delete 3", "delete 4"], [] and
      ["create 3", "create 1000", "delete 9", "delete 20", "delete 100"].
  - kind: test
    title: Check the sort is numeric
    minutes: 1
    body: |-
      In TypeScript, `sort()` with no comparator sorts numbers as text, so 100 comes before
      9. Your last case catches that. If it failed, pass `(a, b) => a - b`.
    expect: The last case lists 3 before 1000 and 9 before 100.
  - kind: ai-writes
    title: Let the assistant write a stress input
    minutes: 2
    body: |-
      A long input with many repeated ids is tedious to type. Ask for the line only; you
      judge the answer by the rules.
    prompt: >-
      Give me one test input line in the format ([[1, 10], [2, 20]], [[2, 21]], 50, 3) with
      12 rows in each list, ids between 1 and 8 so several repeat, and hashes between 1 and
      3. The line only, no answer and no code.
    expect: >-
      One line. Every id in the output is listed once, and each group is in ascending
      order.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution for repeated ids (the later row wins), the safety valve at
      its boundary, numeric sorting and time complexity. List any problems in one line
      each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O((N + M) log(N + M)) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output: printing 100,000 rows slows the performance tests. Then
      submit.
