term: birthday problem
aka: [birthday paradox, birthday bound]
short: The surprise that random picks start to repeat far sooner than the number of choices suggests.
explain: |
  With 365 birthdays, 23 people give a better-than-even chance that two share one. Every
  new person can match every earlier person, so the pairs grow quickly.

  Random ids hit the same wall. With N possible codes, a repeat becomes likely after about
  the square root of N picks. So random short codes need a uniqueness check, or far more
  room than you'd guess.
analogy: A class of thirty where two children share a birthday more often than not.
usage: Seven random characters sound like plenty, but the birthday problem says we'll see collisions within a few million links.
related: [hash-collision, base62]
level: 3
lessons: [sysdesign.case-url-shortener]
