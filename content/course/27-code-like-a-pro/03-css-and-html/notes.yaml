summary: >-
  Professional HTML chooses each element for what it is. A `button` for an action, an `a`
  for navigation, a `label` tied to every field, landmarks such as `header`, `nav` and
  `main`, and headings in order. The browser then gives you keyboard support, focus, form
  behaviour and a meaningful structure for screen readers, with no JavaScript. Styled `div`s
  can imitate the look, but every behaviour has to be rebuilt by hand, and it rarely is.


  Professional CSS is written to be changed. Colours and sizes come from custom properties,
  selectors stay flat and low in specificity, cascade layers decide which group of rules wins
  instead of ever stronger selectors, and layout uses grid, flex, `gap`, `clamp()` and
  logical properties so one stylesheet fits a phone, a wide screen and right-to-left text.


  The two meet in accessibility. A visible focus ring, motion that respects
  `prefers-reduced-motion`, enough contrast and targets big enough to tap are CSS decisions,
  and WCAG 2.2 AA is the bar most teams and many laws hold you to. Reviewers check these in
  seconds, the same way they spot a leftover `console.log`.
remember:
  - Use the native element before any ARIA, because a `button` already brings focus, Enter and Space, and the right role.
  - A link goes somewhere and a button does something, so never build either from a `div`.
  - Every form field needs a programmatic name, from a `label` with a matching `for` and `id` or by wrapping the input.
  - Specificity compares ids, then classes, then element types, and an id beats any number of classes.
  - Later cascade layers beat earlier ones whatever their specificity, and unlayered styles beat all layers.
  - Custom properties cascade and inherit, so a theme or a component can redefine a token in one place.
  - Style `:focus-visible` and never remove the outline without a clear replacement.
  - 'Make motion opt-in with `prefers-reduced-motion: no-preference`, so people who asked for less motion get none by default.'
sections:
  - title: What native elements give you for free
    body: |-
      A clickable `div` looks like a button and works with a mouse. For a keyboard or a
      screen reader, it isn't there. To match a real button you'd need all of this:

      ```html
      <!-- Imitation: every behaviour added by hand, and still incomplete -->
      <div class="button" role="button" tabindex="0">Add to cart</div>
      <script>
        const fake = document.querySelector(".button");
        fake.addEventListener("click", addToCart);
        fake.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            addToCart();
          }
        });
      </script>

      <!-- Native: focusable, Enter and Space, announced as a button, disabled works -->
      <button type="button" class="button">Add to cart</button>
      ```

      That's the **first rule of ARIA**: if a native element does the job, use it. ARIA
      changes what assistive technology announces, never how the element behaves. A
      `role="button"` on a `div` promises keyboard support that you then have to deliver.

      A few choices come up in every review:

      - **Link or button.** If it changes the URL, it's an `a` with an `href`, which can be
        opened in a new tab and bookmarked. If it acts on the page, it's a `button`.
      - **Button type.** Inside a `form`, a `button` submits by default. Write
        `type="button"` on buttons that don't submit, or a "Show password" toggle sends the form.
      - **Landmarks.** One `main` per page, plus `header`, `nav`, `aside` and `footer`. Screen
        reader users jump between them the way sighted users glance at regions.
      - **Headings.** One `h1`, then `h2` and `h3` in order. Pick the level for the outline
        and the size with CSS.
      - **Images.** `alt` describes what the image tells you. A decorative image gets
        `alt=""`, so it's skipped rather than read out as a file name.
      - **Built-in widgets.** `details` and `summary` give a disclosure with no script. A
        `dialog` opened with `showModal()` makes the rest of the page inert, moves focus
        inside and closes on Escape, which a home-made modal usually gets wrong.
  - title: Forms that work for everyone
    body: |-
      Forms are where semantic markup pays off most, and where amateur markup fails people
      most. Here's a checkout fragment with the details reviewers look for:

      ```html
      <form>
        <fieldset>
          <legend>Delivery</legend>
          <label><input type="radio" name="delivery" value="standard" checked> Standard</label>
          <label><input type="radio" name="delivery" value="express"> Express</label>
        </fieldset>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               aria-describedby="email-hint email-error" aria-invalid="true">
        <p id="email-hint">We send the receipt here.</p>
        <p id="email-error">Enter an email address, like name@example.com.</p>

        <label for="postcode">Postcode</label>
        <input id="postcode" name="postcode" autocomplete="postal-code">

        <button type="submit">Pay</button>
      </form>
      ```

      What each part does:

      - `fieldset` and `legend` group radio buttons, so a screen reader announces
        "Delivery, Standard, radio button" rather than a lone "Standard".
      - The `label` is the field's name. Clicking it focuses the field, which also makes
        small checkboxes easier to hit. A `placeholder` is not a label: it disappears as you
        type and is often low contrast.
      - `type="email"` gives phones an email keyboard and basic browser validation.
        `inputmode="numeric"` gives a number pad for codes that aren't really numbers, such
        as card numbers, where `type="number"` would add spinner arrows.
      - `autocomplete` tokens such as `email`, `postal-code`, `current-password` and
        `new-password` let browsers and password managers fill fields correctly.
      - `aria-describedby` reads the hint and the error after the label, and
        `aria-invalid="true"` announces the field as invalid. Set both only after the person
        has tried to submit, not while the field is still untouched.

      Two CSS details help. `:user-invalid` matches a field only after the user has
      interacted with it, unlike `:invalid`, which marks an empty required field red before
      anyone types. And never block paste into password or code fields: password managers
      rely on it, and WCAG 2.2 counts it against accessible sign-in.
  - title: 'The cascade: specificity, :where() and layers'
    body: |-
      When two rules set the same property, the browser decides in order: importance, then
      cascade layer, then **specificity**, then order in the source. Specificity counts three
      columns: ids, then classes, attributes and pseudo-classes, then element types.
      `#sidebar .link` scores (1, 1, 0), and no number of classes beats one id.

      Two selectors give you control over the score. `:where()` always counts as zero, which
      makes it ideal for base styles that anything should override. `:is()` counts as its
      most specific argument, so `:is(#nav, .menu) a` quietly carries an id's weight.

      ```css
      :where(.prose) a { color: var(--color-link); }  /* scores (0, 0, 1) */
      .button { color: var(--color-on-accent); }      /* (0, 1, 0) wins, even inside .prose */
      ```

      Written as `.prose a`, the first rule would score (0, 1, 1) and turn every button-styled
      link in an article the link colour.

      **Cascade layers** remove the arms race altogether. You declare an order once, and a
      rule in a later layer wins over any rule in an earlier layer, whatever its specificity:

      ```css
      @layer reset, vendor, base, components, utilities;
      @import url("vendor-datepicker.css") layer(vendor);

      @layer reset {
        *, *::before, *::after { box-sizing: border-box; }
      }
      @layer base {
        :where(a) { color: var(--color-link); }
      }
      @layer components {
        #checkout .card { display: grid; gap: var(--space-2); }
      }
      @layer utilities {
        .hidden { display: none; }
      }
      ```

      Here `.hidden` hides the card even though `#checkout .card` has an id, because
      `utilities` comes after `components`. Styles that aren't in any layer beat every
      layered style, which is useful while migrating an old stylesheet. Naming `vendor` early
      in the `@layer` list puts the imported date picker's CSS low in the order, so one class
      of yours overrides it. A layer first named later, in the `@import` itself, would join
      the end of the order and beat your components.

      One twist: for `!important` declarations the order reverses, and earlier layers win.
      That lets a reset protect a rule on purpose. It also means `!important` stops being a
      tool for winning fights, which is the point.
  - title: 'Tokens, fluid sizes and layout that adapts'
    body: |-
      **Custom properties** are real CSS values that cascade and inherit. That's what makes
      them better than preprocessor variables for design tokens: you can redefine them for a
      theme, a component or a screen size, and everything that reads them follows.

      ```css
      :root {
        --color-surface: #ffffff;
        --color-text: #1a1a1a;
        --space-2: 1rem;
        --text-body: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      }
      [data-theme="dark"] {
        --color-surface: #121212;
        --color-text: #ededed;
      }
      .card {
        background: var(--color-surface);
        color: var(--color-text);
        padding-block: var(--space-2);
        padding-inline: var(--space-2);
        font-size: var(--text-body);
      }
      ```

      Many teams use two tiers: raw palette values, then semantic tokens such as
      `--color-danger` that components use. Changing the brand then touches one file.

      `clamp(min, preferred, max)` gives fluid sizes without breakpoints. Keep a `rem` part
      in the preferred value: a size in pure `vw` ignores the reader's font size and zoom.

      **Logical properties** follow the writing direction. `padding-inline`, `margin-block`,
      `inset-inline-start`, `border-inline-start` and `text-align: start` flip for Arabic or
      Hebrew with no extra rules, where `padding-left` stays on the left.

      For layout, **grid** places items in two dimensions and **flex** lines them up in one.
      Both take `gap`, which replaces margins on children. One line of grid gives a card
      layout that needs no media queries:

      ```css
      .catalogue {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(16rem, 100%), 1fr));
        gap: var(--space-2);
      }
      ```

      The `min(16rem, 100%)` stops a card overflowing a screen narrower than 16rem. When a
      component should adapt to its own space rather than the window, use a container query:
      `container-type: inline-size` on the parent, then `@container (min-width: 30rem)` for
      the wider layout.
  - title: Accessibility decisions that live in CSS
    body: |-
      Several WCAG 2.2 AA requirements are CSS choices, and reviewers check them.

      **Focus.** Keyboard users need to see where they are. Style `:focus-visible`, which
      appears for keyboard use and not after most mouse clicks, and prefer `outline` to
      `box-shadow`: Windows high-contrast mode removes shadows but keeps outlines. WCAG 2.2
      also says a focused element must not be completely hidden, for example under a sticky
      header, and `scroll-padding-top` on the scrolling element fixes that.

      ```css
      :focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
      }
      html { scroll-padding-top: var(--header-height); }
      ```

      **Motion.** Some people get dizzy or sick from movement on screen and ask their system
      for less. Make motion opt-in, so they get none unless they've said it's fine:

      ```css
      .toast { opacity: 0; }
      .toast.is-open { opacity: 1; }

      @media (prefers-reduced-motion: no-preference) {
        .toast { transition: opacity 200ms ease-out, transform 200ms ease-out; }
        .toast:not(.is-open) { transform: translateY(8px); }
      }
      ```

      **Contrast and size.** Body text needs a contrast ratio of at least 4.5:1, large text
      and the edges of controls 3:1. Targets need to be at least 24 by 24 CSS pixels, or
      spaced so a 24 pixel circle around each doesn't overlap another.

      **Hiding things.** `display: none` and `visibility: hidden` hide content from everyone,
      screen readers included. To hide a label visually but keep it for screen readers, use
      a visually-hidden class:

      ```css
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      ```

      Test with the keyboard alone, with 200% zoom, and with an automated checker such as
      axe. Automated tools catch only part of the problems, so the keyboard pass matters.
pitfalls:
  - "**A clickable `div` or `span`.** It works with a mouse and nothing else. Use a `button` for actions and an `a` with `href` for navigation."
  - "**A `button` in a form without a `type`.** It defaults to submit, so a \"Show password\" toggle sends the form. Add `type=\"button\"` to every button that doesn't submit."
  - "**A placeholder instead of a label.** It vanishes on typing and isn't a reliable name. Add a visible `label`, and keep the placeholder for an example format if at all."
  - "**`outline: none` on focus.** Keyboard users lose their place. Style `:focus-visible` with a clear outline instead of removing it."
  - "**Winning with `!important` or an id.** Each later change needs something stronger. Lower the old selector, or put the rules in cascade layers in the order you want."
  - "**ARIA added to fix what an element should do.** `role=\"button\"` changes what's announced, not how the element behaves. Use the native element first."
  - "**Fluid type in pure `vw`.** Text then ignores the reader's font size and doesn't grow with zoom. Use `clamp()` with a `rem` part in the middle value."
  - "**Physical properties in a product that may be translated.** `margin-left` stays left in right-to-left languages. Use `margin-inline-start` and the other logical properties."
verify:
  - lens: tests
    check: "Tab through every new screen with the keyboard alone, and confirm each control is reachable and shows a visible focus ring."
  - lens: breaks
    check: "Give every button in a form an explicit `type`, so a toggle doesn't submit the form."
  - lens: confuses
    check: "Prefer one class over a long or id selector, so the next change needs no `!important`."
  - lens: tests
    check: "Check each form field with a screen reader or the accessibility tree, and confirm it is announced by its label."
interview:
  - question: Why use a `button` element instead of a `div` with a click handler?
    answer: >-
      Because the `button` brings behaviour the `div` would have to rebuild, and it rarely
      gets rebuilt completely. A native button is in the tab order, activates with Enter and
      Space, is announced as a button with its label, respects `disabled`, and submits a
      form when that's wanted. A `div` needs `role="button"`, `tabindex="0"` and key
      handlers, and still misses details. That's the first rule of ARIA: use the native
      element when one exists, because ARIA changes what's announced, not what happens. I'd
      also pick between `a` and `button` by meaning: navigation is a link, so it can be
      opened in a new tab; an action is a button. The only trade-off is default styling,
      and a CSS reset handles that.
  - question: How would you organise CSS for a large application so it stays maintainable?
    answer: >-
      Tokens, flat specificity and an explicit order. Every colour, space and radius comes
      from custom properties, in two tiers: a palette, then semantic names such as
      `--color-danger` that components use, so themes and rebrands change one file.
      Selectors stay at one class, with base styles in `:where()` so they score zero and
      anything overrides them. Cascade layers declare the order, such as reset, base,
      components, utilities, so a utility beats a component without a stronger selector,
      and third-party CSS goes into its own layer via `@import ... layer()`. Components
      scope their styles through a naming scheme, CSS Modules or utility classes, one
      approach consistently. `!important` and ids for styling are banned by a linter. The
      trade-off is up-front discipline for predictable styles later.
  - question: Walk me through what makes a form accessible.
    answer: >-
      Every field has a programmatic name, the structure is announced, and errors are
      reachable without sight. Each input gets a `label` tied by `for` and `id`, never only a
      placeholder. Related radio buttons sit in a `fieldset` with a `legend`. The right
      `type`, `inputmode` and `autocomplete` values give the right keyboard and let password
      managers fill fields, and paste is never blocked. On a failed submit, each field's
      error is linked with `aria-describedby` and marked `aria-invalid`, the error text says
      how to fix it, and focus moves to the first error or a summary. Visually, focus is
      clear, contrast meets 4.5:1 and targets are at least 24 pixels. Then I test with the
      keyboard alone and a screen reader, because automated checkers find only a part of the
      problems.
  - question: What are cascade layers and what problem do they solve?
    answer: >-
      They let you decide which group of styles wins by declaring an order, instead of by
      writing stronger selectors. With `@layer reset, base, components, utilities;`, any rule
      in `utilities` beats any rule in `components`, even one with an id, because layer order
      is compared before specificity. That ends the specificity race where each fix needs a
      longer selector or `!important`. Unlayered styles beat all layers, which helps when
      migrating an existing stylesheet, and third-party CSS can be imported into a low layer
      so your own components override it with one class. One subtlety: for `!important`
      declarations the order reverses and earlier layers win. The trade-off is that the team
      must agree the order up front and put every rule in the right layer.
  - question: How do you handle animation for users who are sensitive to motion?
    answer: >-
      I make motion opt-in with `@media (prefers-reduced-motion: no-preference)`, so the
      default is still. People with vestibular disorders set "reduce motion" in their
      operating system, and large movement such as parallax, zooms or slides can make them
      dizzy or sick. With the opt-in pattern, forgetting a media query leaves an element
      still rather than moving, which is the safer failure. Reduced doesn't have to mean
      none: a short opacity fade usually replaces a slide well. In JavaScript animation
      libraries I check `matchMedia("(prefers-reduced-motion: reduce)")` too, since CSS
      media queries don't reach them. The trade-off is designing two versions of
      each motion, which is why I keep motion purposeful and small to begin with.
