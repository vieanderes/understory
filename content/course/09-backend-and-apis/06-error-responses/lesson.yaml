id: backend.error-responses
title: Errors clients can use
objective: Answer every failure with a true status and one error shape, and turn an unexpected crash into a logged 500.
level: essential
minutes: 10
concepts: [backend.error-shapes, backend.server-errors]
prerequisites: [backend.http-in-depth, js.prototypes-and-classes]
opening:
  text: >-
    You'll make every failure in your API say what went wrong, in one shape any client can
    handle. And when your own code crashes, you'll be the first to know.

steps:
  - type: prose
    id: true-status
    body: >-
      A client decides what happened from the status before it reads a word of the body. In
      the browser, `response.ok` is `true` only for a `2xx`.


      So an error needs an error status. **`4xx`** says the caller must change something: bad
      input, a missing thing, no permission. **`5xx`** says the server failed, and the same
      request might work later.

  - type: multiple-choice
    id: pick-error-status
    concept: backend.error-shapes
    difficulty: 1
    question: A client orders a quantity of `-3`. Which status should the server answer with?
    choices:
      - text: '`400`, the request was bad'
        correct: true
        feedback: >-
          Right. The caller sent something wrong and must change it, so it's a `4xx`.
      - text: '`500`, the order failed'
        feedback: >-
          Nothing broke on the server. A `5xx` would tell the client to try the same thing again.
      - text: '`200`, with an error message'
        feedback: >-
          Then `response.ok` is `true`, and the client treats the error as a finished order.

  - type: prose
    id: problem-details
    body: |-
      Give every error the same body too. The common standard is **problem details**, sent as
      `application/problem+json`:

      ```json
      {"type":"https://example.com/problems/not-found","title":"Not Found",
       "status":404,"detail":"No post with id 99","instance":"/posts/99"}
      ```

      `type` names the kind for code, and `title` is its short name. `status` repeats the code.
      `detail` explains this case to a person, and `instance` says where.

  - type: fill-blank
    id: fill-problem-response
    concept: backend.error-shapes
    difficulty: 2
    language: js
    prompt: >-
      Answer a missing post with a problem details body, the right status and the right
      type. Fill the gaps.
    template: |
      return Response.json(
        { title: "Not Found", status: 404, {{1}}: `No post with id ${id}` },
        { status: {{2}}, headers: { "Content-Type": "application/{{3}}" } },
      );
    blanks:
      - key: '1'
        answer: detail
      - key: '2'
        answer: '404'
      - key: '3'
        answer: problem+json
    bank: [detail, error, '404', '200', problem+json, text+error]

  - type: ai-review
    id: review-error-with-200
    concept: backend.error-shapes
    difficulty: 3
    language: js
    request: Return a friendly message when a post isn't found.
    flawClass: logic
    code: |
      const post = posts.find((p) => p.id === id);
      if (!post) {
        return Response.json({ error: "We couldn't find that post" });
      }
      return Response.json(post);
    prompt: >-
      An assistant wrote this. The message shows, and the test that reads it passes. A week
      later the home page shows "undefined" where a deleted post used to be. Tap the line at
      fault.
    lines: [3]
    reasons:
      - text: It answers `200`, so every client reads success
        correct: true
        feedback: >-
          Yes. The page rendered the body as a post. Answer `404` with a problem body.
      - text: The message should be in `detail`
        feedback: >-
          Good naming, but a `200` with any body still reads as success. The status is the bug.
      - text: '`find` should be `filter`'
        feedback: >-
          `find` is right for one post. The response, not the lookup, misleads the client.
    fix: |
      const post = posts.find((p) => p.id === id);
      if (!post) {
        return Response.json(
          { title: "Not Found", status: 404, detail: `No post with id ${id}` },
          { status: 404, headers: { "Content-Type": "application/problem+json" } },
        );
      }
      return Response.json(post);

  - type: prose
    id: silent-500
    body: |-
      Now the errors you didn't plan for. This handler reads `order.id`, and order 7
      doesn't exist, so it throws:

      ```bash
      $ curl -i localhost:3102/orders/7
      HTTP/1.1 500 Internal Server Error
      Transfer-Encoding: chunked

      ```

      An empty `500`, and the terminal running the server printed nothing at all. Nobody
      learns what broke.

  - type: prose
    id: catch-and-log
    body: |-
      So wrap the handler. Catch anything it throws, log it where you can read it, and answer
      with a problem that gives nothing away:

      ```js
      async function safely(request) {
        try {
          return await handle(request);
        } catch (error) {
          console.error(error);
          return Response.json(
            { title: "Internal Server Error", status: 500, detail: "Something went wrong on our side." },
            { status: 500, headers: { "Content-Type": "application/problem+json" } },
          );
        }
      }
      ```

      Pass `safely` to `serve`. The stack trace goes to your log, never to the client.

  - type: prose
    id: expected-errors
    body: |-
      Some errors you do expect. Code deep inside a handler can throw its own error class,
      like the one from the JavaScript chapter:

      ```js
      class NotFoundError extends Error {}
      throw new NotFoundError("No order with id 7");
      ```

      The wrapper checks `error instanceof NotFoundError` first and answers `404` with the
      message as `detail`. Only errors nobody expected become a `500`.

  - type: code-challenge
    id: write-with-errors
    concept: backend.server-errors
    difficulty: 3
    language: ts
    editable: '25-26'
    prompt: >-
      Write `withErrors(handler, log)`. It returns a new handler that calls `handler` and
      returns its response. The practice handlers aren't `async`, so no `await` is needed.


      If it throws a `NotFoundError`, answer `problem(404, "Not Found", <the error's
      message>)`. Anything else: pass it to `log`, which is `console.error` in a real server,
      and answer `problem(500, "Internal Server Error", "Something went wrong on our side.")`.
    hints:
      - '`withErrors` returns a function: `return (request) => { ... };`'
      - Inside it, a `try` around `handler(request)`, and a `catch (error)` that checks the kind of error.
      - '`error instanceof NotFoundError` tells the two cases apart, and `error.message` holds the text.'

  - type: explain-back
    id: explain-no-stack-in-500
    concept: backend.server-errors
    difficulty: 3
    audience: reviewer
    kind: decide
    prompt: >-
      A pull request puts `error.message` and the stack trace in every `500` body, "to make
      debugging easier". You ask for a change. Defend that choice to the author.
    rubric:
      - The details go to the server's log with `console.error`, where the team can read them.
      - The client can't act on them, and a stack trace shows file names, code and data that help an attacker.
      - "The cost: debugging needs the log, so the generic body carries an id that finds the log line."
    modelAnswer: >-
      Log it, don't send it. `console.error` puts the message and the stack in our log, where
      we can debug. The client can't act on a stack trace, and it shows an attacker our file
      names, libraries and sometimes data. The trade-off is that the answer alone no longer
      explains the failure. So the body stays generic but carries a request id, and that id
      finds the full story in the log.

recap:
  - Answer every failure with a true `4xx` or `5xx` status, never a `200`.
  - Give every error one problem details shape, with a `detail` a person can read.
  - Catch unexpected errors in one wrapper, log them, and answer a `500` that leaks nothing.

recall:
  - id: card-4xx-vs-5xx
    concept: backend.error-shapes
    front: What does a `4xx` tell the client, and what does a `5xx` tell it?
    back: >-
      `4xx`: your request was wrong, change it. `5xx`: the server failed, the same request may
      work later.
  - id: card-problem-fields
    concept: backend.error-shapes
    front: Name the five problem details fields and the media type.
    back: >-
      `type`, `title`, `status`, `detail`, `instance`, under `application/problem+json`.
  - id: card-silent-500
    concept: backend.server-errors
    front: What happens when a handler throws and nothing catches it?
    back: >-
      With `@hono/node-server` the client gets an empty `500`, and nothing is logged. Wrap the
      handler.
  - id: card-log-not-send
    concept: backend.server-errors
    front: Where does the stack trace of an unexpected error go?
    back: >-
      To the server's log with `console.error`. The client gets a generic `500` problem.

references:
  - kind: rfc
    title: 'RFC 9457: Problem Details for HTTP APIs'
    authors: M. Nottingham, E. Wilde and S. Dalal
    year: 2023
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc9457
    note: The five members, the `application/problem+json` type, and extension members.
    primary: true
    verified: true
  - kind: docs
    title: HTTP response status codes
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
    note: What a client is expected to do with each code, which is why a `200` error misleads.
    verified: true
  - kind: docs
    title: Error Handling Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    note: Why error responses must not reveal stack traces or internals, and to log them instead.
    primary: true
    verified: true

deepDive: >-
  The client side is short. `if (!response.ok)`, read the body with `await response.json()`
  and show its `detail`. Because every endpoint answers errors in the same shape, that one
  branch covers the whole API.


  APIs you call don't always follow this. Some vendors answer `200` with an error in the
  body, like `{"ok": false, "error": "rate_limited"}`. So check the body's shape too, not
  only the status, before you trust a reply.


  The `500` output above is trimmed of `Date`, `Connection` and `Keep-Alive`. Frameworks such
  as Hono and Express have their own error hooks, `app.onError` and error middleware, that do
  what `safely` does. Plain `@hono/node-server` answers an empty `500` and, in version 2.1,
  logs nothing when a handler throws.


  Problem details can carry more than five members. A validation error often adds an
  `errors` array with one entry per field. RFC 9457 calls these extension members and asks
  clients to ignore any they don't know. In production, send the log to a service that
  alerts you, so a spike of `500`s wakes someone up.
