term: ACID
aka: [atomicity consistency isolation durability]
short: The four promises a database makes about grouped changes, which stop half-done or lost writes.
explain: |
  When money moves between accounts, you need guarantees. The four letters name them.
  **Atomic**: all of it or none of it. **Consistent**: rules such as constraints hold
  afterwards. **Isolated**: work running at the same time doesn't trip over itself.
  **Durable**: once committed, it survives a crash.

  The I is the slippery one. Most databases don't give full isolation by default, because
  it costs throughput. Postgres defaults to read committed, which still allows a lost
  update. "It's ACID" doesn't mean "concurrency is handled".
analogy: A recorded delivery parcel. It arrives whole or not at all, it's signed for, nobody else's parcel gets mixed in, and the receipt survives if the van crashes.
usage: Postgres is ACID, but that doesn't save us here; two requests can still read the same stock count.
related: [transaction, isolation-level, lost-update]
level: 2
