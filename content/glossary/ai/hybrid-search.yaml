term: hybrid search
aka:
  - hybrid retrieval
  - keyword plus vector search
short: Running keyword search and meaning-based search together, then merging their results into one list.
explain: |
  Search by meaning finds "refund" when someone types "money back". It's weak on exact
  strings, though. A part number like `KX-204` looks like noise to an embedding.

  Keyword search is the opposite. It nails exact identifiers and misses paraphrases. So
  you run both and merge the two rankings, often with reciprocal rank fusion.

  It costs a second index and a merge step. Worth it when users search for codes, names
  or error messages.
analogy: Asking a librarian who knows the topic and also checking the catalogue for the exact title.
usage: Users paste error codes, so switch to hybrid search; vectors alone keep missing them.
