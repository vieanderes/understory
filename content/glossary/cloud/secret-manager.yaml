term: secret manager
aka: [secret store, secrets manager, vault]
short: A service that stores passwords, keys and tokens encrypted, and hands them only to the systems allowed them.
explain: |
  API keys pasted into code end up in Git history forever. Kept in a shared document, they
  never get changed when someone leaves.

  A central store keeps them encrypted, controls who may read each one, and logs every
  read. Apps and pipelines fetch them at start-up or deploy time, scoped to one environment.
  Rotating a key becomes one change in one place. It still matters what the app does next:
  printing a secret into a log undoes all of it.
analogy: A hotel's key desk. Guests get only their own room key, and the desk knows who took what.
usage: Move the payment key into the secret manager and rotate it, because it's in the Git history.
related: [secret, environment-variable, least-privilege, infrastructure-as-code]
level: 2
lessons: [cloud.ci-cd]
