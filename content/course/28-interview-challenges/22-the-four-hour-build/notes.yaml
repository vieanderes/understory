summary: >-
  A four-hour build is a take-home or on-site exercise where you turn a short brief into a
  working product slice, then usually present it. The brief is deliberately bigger than
  four hours. What is being assessed is not how much you build but how you decide: what
  you cut, what you finish, what you prove with tests, and how clearly you explain it.


  The winning shape is always the same. Scope in the first twenty minutes: questions,
  written assumptions, three must-haves. Build one thin path from the interface to the
  data and back, so something works end to end within the first forty minutes. Spend the
  middle on the core flow, then the states people forget (empty, loading, error), then
  tests on the core logic, then a README that a reviewer reads before the code. Stop
  adding features twenty minutes before the end.


  Reviewers often spend only minutes on a first pass, and the discussion afterwards often
  counts more than the code. So every choice should be one you can defend in a sentence,
  and every shortcut should be written down as a trade-off rather than discovered by the
  reviewer.
remember:
  - Scope first, in twenty minutes, into questions, written assumptions and three must-haves; everything else goes under next steps.
  - Build a thin vertical slice first, one path from UI through API to data, running, before polishing any layer.
  - Commit each time something new works, so the history shows the build step by step and you always have a working point to return to.
  - Tests on the core logic and error, empty and loading states are graded; extra features past the must-haves mostly are not.
  - The README is read before the code, and needs what, how to run, assumptions, architecture, trade-offs, AI use and next steps.
  - Before stopping, clone the repository into a fresh folder and follow your own README from the top.
  - Never commit secrets; commit a `.env.example`, and rotate any key that was ever pushed.
  - Stop adding features at 3:40 and rehearse the demo with a fallback ready.
sections:
  - title: The playbook, with checkpoints and cut rules
    body: |-
      The deep dive gives the time plan. What makes it work is knowing what "done" means at
      each checkpoint, and what to cut when you are behind.

      - **0:20, scope written.** A short `NOTES.md` with your questions (and the answers,
        or your assumption if nobody answers), three must-haves, and a "later" list. If you
        cannot name three must-haves, re-read the brief: they are usually its verbs.
      - **0:35, the skeleton runs.** One command starts it. A page posts to one API route,
        which calls a stub of the core and returns a fixed answer. First commit.
      - **1:30, the core works for the happy path.** Replace the stub with the real logic
        for one realistic input. If you are not here by 1:45, cut scope now: drop the
        second must-have to "later" rather than start rushing everything.
      - **2:15, the core flow is complete.** All must-haves work for a normal input.
        From here, no new features.
      - **2:50, the product is honest.** Empty, loading and error states exist; input is
        validated; for AI builds, the refusal path and a small eval set exist.
      - **3:15, core tests pass.** Tests on the pure logic and one on the API route.
      - **3:40, the README is written** and the clean-clone check passed.
      - **4:00, rehearsed.** You have run the demo twice and saved screenshots or a short
        recording in case the network or the model fails.

      The cut rules, in order: cut polish before states, states before tests, and never
      cut the README. A reviewer can forgive a plain page; they cannot run a project whose
      setup is unexplained.
  - title: The first twenty minutes, concretely
    body: |-
      Scoping is where seniors separate themselves, because it is the part a less
      experienced candidate skips. For a brief like "a support assistant that answers from
      these help articles", the notes might read:

      ```text
      Questions (asked at 0:05)
        - Who are the users, customers or support staff?  -> customers
        - How many articles, how often do they change?     -> about 30, weekly
        - Must it work without a model key?                -> no answer; assume a key is provided

      Assumptions
        - English only, no login, articles are markdown files in the repo
        - Answers must cite the article; "I don't know" when nothing matches

      Must-haves
        1. Ask a question, get an answer from the articles
        2. Every answer cites its article
        3. Refuses when nothing relevant is found

      Later
        - streaming answers, feedback buttons, admin upload, a vector database
      ```

      The questions show you think about users and constraints. The assumptions protect
      you: a reviewer who disagrees with one sees you made a conscious choice. The "later"
      list is the backbone of your next-steps slide, and it quietly answers "why didn't you
      build X?" before anyone asks.
  - title: What an ideal submission contains
    body: |-
      Reviewers open the repository, read the README, try to run it, skim the structure and
      the tests, and read a few commits. Give each of those something to find. A structure
      that reads at a glance:

      ```text
      README.md
      NOTES.md              scope, assumptions, decisions log
      .env.example          MODEL_API_KEY=
      package.json          "dev", "test", "eval" scripts
      src/
        core/               pure logic: chunking, retrieval, refusal (no framework)
        app/api/ask/        thin route: validate, call core, one error shape
        app/page.tsx        the one screen, with empty, loading and error states
      tests/                core tests and one route test
      evals/golden.json     15 to 30 questions, including ones to refuse
      ```

      The README, in full:

      ```text
      # Help-article assistant
      Answers customer questions from 30 help articles, cites the article, and says
      "I don't have that information" when nothing matches.

      ## Run it
      cp .env.example .env    # add MODEL_API_KEY
      npm install && npm run dev    # http://localhost:3000
      npm test && npm run eval

      ## Assumptions
      English only, no login, articles live in /content and change weekly.

      ## Architecture
      page -> POST /api/ask -> core.answer -> in-memory index -> model
      Articles are chunked (200 words, 40 overlap) and embedded once at start-up.

      ## Decisions and trade-offs
      - In-memory index, not a vector database: 30 articles fit in memory; I'd switch
        past roughly 100k chunks or when filters are needed.
      - Refusal is an early return below a similarity threshold, not a prompt rule.

      ## Evidence
      12 tests on core logic and the route. Eval: recall@4 0.93, refusals 5/5.
      Known gaps: no streaming, threshold tuned on 20 questions only.

      ## How I used AI
      Drafted the chunker and test scaffolding; I rewrote the refusal check and
      verified every generated test by making it fail first.

      ## Next steps
      Streaming, answer feedback, a larger eval set from real questions.
      ```

      A commit history that tells the story in eight to fifteen lines, such as "Add
      skeleton: page posts to /api/ask stub", "Add chunker with overlap and tests",
      "Refuse below similarity threshold", "Add empty and error states", beats one commit
      called "done" at 3:58.
  - title: A thin API route, and the tests that prove it
    body: |-
      Keep the route thin and the core pure, so the core is tested without a server and the
      route is tested without a model. This route validates input, calls the core, and maps
      any failure to one error shape without leaking internals.

      ```ts
      export type Answer = { text: string; citations: string[] };
      export type Deps = { answer: (question: string) => Promise<Answer> };

      export function makeAskHandler(deps: Deps) {
        return async function POST(request: Request): Promise<Response> {
          const body = await request.json().catch(() => null);
          const question = typeof body?.question === 'string' ? body.question.trim() : '';
          if (question === '' || question.length > 500) {
            return Response.json(
              { error: { code: 'invalid_question', message: 'Ask a question of 1 to 500 characters.' } },
              { status: 400 },
            );
          }
          try {
            return Response.json(await deps.answer(question));
          } catch {
            return Response.json(
              { error: { code: 'upstream_failed', message: 'The answer service failed. Try again.' } },
              { status: 502 },
            );
          }
        };
      }
      ```

      ```ts
      import { test } from 'node:test';
      import assert from 'node:assert/strict';
      import { makeAskHandler } from './ask.ts';

      const post = (body: unknown) =>
        new Request('http://test/api/ask', { method: 'POST', body: JSON.stringify(body) });

      test('rejects an empty question without calling the model', async () => {
        let called = false;
        const handler = makeAskHandler({ answer: async () => { called = true; return { text: '', citations: [] }; } });
        const response = await handler(post({ question: '   ' }));
        assert.equal(response.status, 400);
        assert.equal(called, false);
      });

      test('a failing model becomes one error shape, not a stack trace', async () => {
        const handler = makeAskHandler({ answer: async () => { throw new Error('secret provider detail'); } });
        const response = await handler(post({ question: 'Hello?' }));
        assert.equal(response.status, 502);
        const body = await response.json();
        assert.equal(body.error.code, 'upstream_failed');
        assert.doesNotMatch(JSON.stringify(body), /secret/);
      });
      ```

      These ran with Node's built-in test runner. Injecting `answer` is the design choice
      that makes them possible: the route never imports the model client directly. Aim for
      a handful of tests that each protect a rule a reviewer cares about, rather than many
      that restate the implementation.
pitfalls:
  - >-
    **Building layer by layer.** A finished database layer with no UI at 2:30 means nothing
    runs. Build the thin slice first, then deepen it.
  - >-
    **Starting with the part you can see.** A polished chat screen with a fake backend
    demos well and proves nothing. Make the core path real first.
  - >-
    **Infrastructure nobody asked for.** A hosted vector database, queues or Kubernetes for
    40 records invite "why is this here?". Choose the simplest thing that fits the stated
    scale, and write down when you would change it.
  - >-
    **Late rewrites.** Refactoring working retrieval at 3:00 risks the only path you can
    demo. Note the improvement in the README instead.
  - >-
    **Setup that only works on your machine.** A missing step, an undeclared global tool or
    a hard-coded path fails the reviewer's first minute. Do the clean-clone check.
  - >-
    **Committed secrets.** Anyone with the repository can use the key. Commit
    `.env.example`, keep `.env` in `.gitignore`, and rotate any key that was pushed.
  - >-
    **One giant commit.** It hides how you worked. Commit whenever something new works.
  - >-
    **Unwritten assumptions.** A reviewer who disagrees with an unstated choice sees a
    mistake; a written one reads as a decision.
interview:
  - question: You have four hours and a brief that clearly needs eight. How do you decide what to build?
    answer: >-
      I spend the first twenty minutes turning the brief into three must-haves, written
      assumptions and a later list, and I ask the questions that change scope, such as who
      the users are and how much data there is. The must-haves are usually the brief's
      verbs; everything else waits. Then I build one thin path end to end before deepening
      anything, so every later hour improves a working product. At fixed checkpoints I
      check progress and cut from the later list rather than rushing everything. The
      trade-off is that the product looks smaller than some others, but it works, it is
      tested, and every omission is a written decision rather than an accident.
  - question: It's 2:45. The main flow works, there are no tests, and you'd love to add streaming. What do you do?
    answer: >-
      I write tests on the core logic and put streaming under next steps. Tests on the core
      are something reviewers grade directly, and they protect the one path I can demo.
      Streaming is visible and tempting, but if it overruns I end with a feature half done
      and still no tests. I would test the rules that matter, such as refusing below the
      threshold, citing the right ids and rejecting invalid input, plus one route test.
      In the README I would say streaming is the first next step and how I would add it,
      which shows I considered it. If I finish early, I can still add it with a safety net.
  - question: What do you put in the README of a take-home, and why does it matter so much?
    answer: >-
      What it does in two lines, how to run it in copyable commands, assumptions,
      architecture as a one-line flow or small diagram, decisions with the option I
      rejected, evidence such as tests and eval numbers with known gaps, how I used AI, and
      next steps. It matters because reviewers read it first and often decide how
      carefully to read the code from it. It is also my presentation script, and the place
      where shortcuts become trade-offs instead of findings. Before submitting I clone the
      repository into a fresh folder and follow it from the top, which catches missing
      steps and committed secrets.
  - question: How did you structure the code, given the time limit?
    answer: >-
      Pure core, thin edges. The logic that matters, chunking, retrieval, the refusal rule,
      lives in a framework-free module with unit tests. The API route only validates input,
      calls the core through an injected dependency, and maps failures to one error shape.
      The page renders the states the core can produce. That split let me test the rules
      without a server or a model, swap the model client for a fake in tests, and keep the
      route small enough to read in a minute. I avoided extra layers such as repositories
      or services for their own sake, because four hours rewards clarity over ceremony.
