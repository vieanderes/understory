term: rest parameters
aka:
  - rest syntax
  - rest element
short: Three dots in a parameter list or pattern that gather all the remaining items into one array.
explain: |
  `function sum(...numbers)` accepts any number of arguments and hands them over as a real
  array. In a pattern, `const { id, ...fields } = note` takes `id` out and puts every other
  property into `fields`.

  It has to come last, since there's nothing left to gather after it. It looks identical to
  spread, so read where it sits. Where values are received, it gathers. Where values are
  given, it spreads.
analogy: The "everything else" drawer in a kitchen. Name the things you want, and the rest goes in one place.
example:
  language: js
  code: |
    function sum(...numbers) {
      return numbers.reduce((total, n) => total + n, 0);
    }
    sum(1, 2, 3); // 6

    const { id, ...fields } = { id: 7, title: 'Note', done: false };
usage: Pull the id out with a rest element and pass the other fields to the form.
twin:
  term: spread-syntax
  difference: Rest gathers separate items into one array or object, on the receiving side. Spread does the opposite, unpacking a collection into separate items.
related:
  - spread-syntax
  - destructuring
level: 3
lessons:
  - js.destructuring-and-spread
