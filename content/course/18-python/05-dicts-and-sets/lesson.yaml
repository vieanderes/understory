id: python.dicts-and-sets
title: Dictionaries and sets
objective: Look up, count and group with dicts, get, defaultdict and Counter, and use sets for fast membership.
level: essential
minutes: 10
concepts: [python.dicts, python.dict-tools, python.sets, python.hashability]
prerequisites: [python.lists-and-tuples]
opening:
  text: >-
    You'll look things up by key, count and group in a line or two, and check membership
    instantly. Dictionaries are how Python holds JSON, settings and model responses.

steps:
  - type: prose
    id: dict-basics
    body: |-
      A **dictionary**, or dict, maps keys to values. It looks like a JavaScript object
      literal, with quoted keys:

      ```python
      prices = {"tea": 3}
      prices["cake"] = 4
      print("tea" in prices)      # True
      print(prices.get("pie", 0)) # 0
      for name, price in prices.items():
          print(name, price)
      ```

      Read a missing key with brackets, as in `prices["pie"]`, and Python stops with
      `KeyError: 'pie'`. `get` returns a fallback instead, or `None`.

  - type: bug-hunt
    id: hunt-missing-key
    concept: python.dicts
    difficulty: 2
    language: python
    code: |
      def reply_text(reply):
          return reply["text"]

      print(reply_text({"text": "Hi there"}))
      print(reply_text({"error": "overloaded"}))
    prompt: "A model API sometimes sends an error instead of text. This crashes with `KeyError: 'text'`. Tap the line to fix."
    lines: [2]
    reasons:
      - text: Brackets raise for a missing key
        correct: true
        feedback: >-
          Right. `reply.get("text", "")` gives a fallback instead of crashing.
      - text: Line 5 sends the wrong dict
        feedback: >-
          That's real data from the API, and it will come again. The reading code must cope.
      - text: '`reply` must be turned into a dict first'
        feedback: >-
          It already is a dict. The trouble is reading a key that isn't there.
    fix: |
      def reply_text(reply):
          return reply.get("text", "")

  - type: prose
    id: counter-and-defaultdict
    body: |-
      Counting and grouping are so common that Python ships tools for them. `from ... import`
      brings them in from the **standard library**, the modules that come with Python:

      ```python
      from collections import Counter, defaultdict
      counts = Counter(["tea", "coffee", "tea"])
      groups = defaultdict(list)
      groups["a"].append("ant")
      ```

      `counts["tea"]` is `2`, and a missing key counts as `0`. A **defaultdict** builds a
      value, here an empty list, the first time a key is read.

  - type: fill-blank
    id: fill-group-by-label
    concept: python.dict-tools
    difficulty: 2
    prompt: A model has labelled some tickets. Group the ticket ids by label.
    language: python
    template: |
      from collections import defaultdict

      results = [("t1", "refund"), ("t2", "bug"), ("t3", "refund")]
      by_label = {{1}}(list)
      for ticket, label in results:
          by_label[label].{{2}}(ticket)
    blanks:
      - key: '1'
        answer: defaultdict
      - key: '2'
        answer: append
    bank: [defaultdict, dict, Counter, append, add, push]

  - type: prose
    id: sets
    body: |-
      A **set** holds unique items, with no order. It's a dict with keys and no values:

      ```python
      tags = {"red", "blue", "red"}
      print(len(tags))   # 2
      seen = set()       # an empty set
      seen.add("red")
      ```

      Checking `x in tags` takes about the same time for ten items or ten million, as it does
      for dict keys. A list is checked item by item. Sets also combine: `a | b` is
      everything, `a & b` what they share, and `a - b` what only `a` has.

  - type: ai-review
    id: review-list-membership
    concept: python.sets
    difficulty: 4
    language: python
    request: Write new_emails(incoming, known), returning the addresses not seen before.
    flawClass: performance
    code: |
      def new_emails(incoming, known):
          result = []
          for email in incoming:
              if email not in known:
                  result.append(email)
          return result
    prompt: >-
      An assistant wrote this, and a test with ten addresses passed. With 200,000 known
      addresses, it took over four seconds. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`in` on a list checks every item'
        correct: true
        feedback: >-
          Right. Turn `known` into a set first. The same run then took about 30 milliseconds.
      - text: '`append` copies the whole list'
        feedback: >-
          `append` adds one item at the end, cheaply. The slow part is the search.
      - text: '`not in` is slower than `in`'
        feedback: >-
          They cost the same. Either one scans a list item by item.
    fix: |
      def new_emails(incoming, known):
          known_set = set(known)
          result = []
          for email in incoming:
              if email not in known_set:
                  result.append(email)
          return result

  - type: prose
    id: hashing
    body: |-
      A dict or set doesn't search its keys one by one. It turns each key into a number, its
      **hash**, and files the value under that number. To find the key again, it works out
      the same hash.

      So a key must never change after it's filed. Strings, numbers and tuples are fine. A
      list is refused. A value that can be used this way is **hashable**.

  - type: bug-hunt
    id: hunt-unhashable
    concept: python.hashability
    difficulty: 3
    language: python
    code: |
      visited = set()
      point = [3, 4]
      visited.add(point)
    prompt: >-
      This stops with `TypeError: unhashable type: 'list'`. Tap the line that needs the
      fix.
    lines: [2]
    reasons:
      - text: A list can change, so sets refuse it
        correct: true
        feedback: >-
          Exactly. Make it a tuple, `(3, 4)`, which can never change.
      - text: '`set()` makes an empty dict'
        feedback: >-
          `set()` really is an empty set. It's `{}` on its own that makes an empty dict.
      - text: Sets only hold text
        feedback: >-
          Sets hold numbers and tuples too. Only changeable values are refused.
    fix: |
      visited = set()
      point = (3, 4)
      visited.add(point)

  - type: code-challenge
    id: write-first-repeat
    concept: python.sets
    difficulty: 3
    language: python
    starter: starter.py
    solution: solution.py
    tests: tests.py
    prompt: >-
      Write `first_repeat(values)`. Return the first value that turns up a second time, or
      `None` if nothing repeats. Lists can hold 100,000 readings, so keep it fast.


      Example: `[4, 7, 2, 7, 4]` gives `7`, because the second 7 comes before the second 4.
    hints:
      - 'The review step timed `in` on a list against `in` on a set.'
      - 'Remember what you''ve seen so far, in something where `in` is fast.'
      - 'Start with `seen = set()`. In the loop, check `value in seen` before you `add` it.'

  - type: explain-back
    id: explain-hashable-keys
    concept: python.hashability
    difficulty: 4
    prompt: Why will Python accept the tuple `(3, 4)` as a dict key but refuse the list `[3, 4]`?
    rubric:
      - Dicts and sets find a key by a hash worked out from its value.
      - A list can change after it's stored, which would change its hash.
      - Then the key could never be found again, so changeable values are refused.
    modelAnswer: >-
      A dict files each key under a hash worked out from its value. It finds the key again
      by the same hash. A list can change after it's stored, so its hash would change and the
      key would be lost. A tuple can't change, so its hash stays put and it's safe as a key.

recap:
  - Store and read values by key, and loop over `items()`.
  - Count with `Counter`, group with `defaultdict`, and read safely with `get`.
  - Use sets for unique items and fast `in` checks, with unchangeable items only.
recall:
  - id: card-keyerror
    concept: python.dicts
    front: What happens when you read a missing key with `prices["coffee"]`?
    back: >-
      Python raises `KeyError: 'coffee'`. Use `in` or `get` when the key may be missing.
  - id: card-get-default
    concept: python.dict-tools
    front: How do you read a key with a fallback of `0` when it's missing?
    back: >-
      `prices.get("coffee", 0)`. Without the second argument, `get` returns `None`.
  - id: card-set-membership
    concept: python.sets
    front: Why check membership in a set rather than a list?
    back: >-
      A set finds an item in about constant time. A list is scanned item by item.
  - id: card-hashable
    concept: python.hashability
    front: Which values can be dict keys or set items?
    back: >-
      Unchangeable ones: strings, numbers and tuples of them. Lists, dicts and sets can't.

