id: react.hooks-and-refs
title: Refs and custom hooks
objective: Keep values and DOM nodes in refs, and move repeated stateful logic into hooks of your own.
level: advanced
minutes: 10
concepts: [react.refs, react.custom-hooks]
prerequisites: [react.build-a-small-app]
opening:
  text: >-
    You'll keep a timer you can really stop, and put the cursor in a field with one click.
    Then you'll pull repeated logic out of your components into hooks you name yourself.

steps:
  - type: prose
    id: what-refs-are
    body: >-
      Sometimes a component must remember something the screen never shows, like a timer's
      id. A **ref** is a box that keeps a value between renders: `const timer =
      useRef(null)`. The value lives in `timer.current`, and changing it never redraws
      anything.


      A ref can also hold an element. Write `<input ref={box} />`, and React puts the real
      DOM element in `box.current`. Then `box.current.focus()` puts the cursor in it.

  - type: predict-output
    id: predict-ref-no-render
    concept: react.refs
    difficulty: 1
    language: tsx
    code: |
      function Clicker() {
        const clicks = useRef(0);
        return (
          <button onClick={() => { clicks.current++; }}>
            {clicks.current}
          </button>
        );
      }
    question: You click the button three times. What does it show?
    choices:
      - text: '`0`'
        correct: true
        feedback: >-
          Yes. `current` is 3 now, but changing a ref never asks React to render.
      - text: '`3`'
        feedback: >-
          The count did reach 3. But nothing rendered again, so the screen still shows 0.
      - text: '`1`'
        feedback: >-
          Every click added one, and none of them rendered. The button still shows the first
          render's 0.

  - type: ai-review
    id: review-interval-in-variable
    concept: react.refs
    difficulty: 3
    language: tsx
    request: Add a stopwatch with Start and Stop buttons to the gym timer.
    flawClass: logic
    code: |
      function Stopwatch() {
        const [seconds, setSeconds] = useState(0);
        let intervalId;
        const start = () => {
          intervalId = setInterval(() => setSeconds((s) => s + 1), 1000);
        };
        const stop = () => clearInterval(intervalId);
        return (
          <div>
            <p>{seconds} s</p>
            <button onClick={start}>Start</button>
            <button onClick={stop}>Stop</button>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. Start works, and the seconds tick up. Then Stop does nothing,
      and the clock keeps counting. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Each render makes a fresh, empty `intervalId`
        correct: true
        feedback: >-
          Yes. The tick re-rendered, so `stop` sees a new variable. `useRef` keeps the id.
      - text: The updater `(s) => s + 1` is wrong here
        feedback: >-
          The updater is right: it's why the seconds count up properly. Stopping is the
          problem.
      - text: '`clearInterval` needs the number of seconds'
        feedback: >-
          It takes the id `setInterval` returned. The trouble is that `stop` no longer has it.
    fix: |
      function Stopwatch() {
        const [seconds, setSeconds] = useState(0);
        const intervalId = useRef(null);
        const start = () => {
          intervalId.current = setInterval(() => setSeconds((s) => s + 1), 1000);
        };
        const stop = () => clearInterval(intervalId.current);
        return (
          <div>
            <p>{seconds} s</p>
            <button onClick={start}>Start</button>
            <button onClick={stop}>Stop</button>
          </div>
        );
      }

  - type: fill-blank
    id: fill-focus-ref
    concept: react.refs
    difficulty: 2
    language: tsx
    prompt: >-
      Make the Search button put the cursor in the field. Fill the gaps.
    template: |
      function Search() {
        const inputRef = {{1}}(null);
        return (
          <div>
            <input {{2}}={inputRef} aria-label="Search recipes" />
            <button onClick={() => inputRef.{{3}}.focus()}>Search</button>
          </div>
        );
      }
    blanks:
      - key: '1'
        answer: useRef
      - key: '2'
        answer: ref
      - key: '3'
        answer: current
    bank: [useRef, useState, ref, id, current, value]

  - type: prose
    id: what-custom-hooks-are
    body: |-
      Two components with the same open-and-close logic? Move it into a function:

      ```tsx
      function useToggle() {
        const [on, setOn] = useState(false);
        return [on, () => setOn(!on)];
      }
      ```

      A function whose name starts with `use` and that calls other hooks is a **custom
      hook**. It shares logic, never state. Each component that calls it gets fresh state of
      its own.

  - type: predict-output
    id: predict-hook-shares-logic
    concept: react.custom-hooks
    difficulty: 2
    language: tsx
    code: |
      function Lamp({ name }) {
        const [on, toggle] = useToggle();
        return <button onClick={toggle}>{name} {on ? 'on' : 'off'}</button>;
      }

      <div><Lamp name="Hall" /><Lamp name="Desk" /></div>
    question: '`useToggle` is the hook above. You click the Hall button once. What do the buttons say?'
    choices:
      - text: Hall on, Desk off
        correct: true
        feedback: >-
          Right. Each `Lamp` calls `useToggle`, and each call gets its own state.
      - text: Hall on, Desk on
        feedback: >-
          The two share the hook's code, not its state. It works like calling `useState` twice.
      - text: Hall off, Desk off
        feedback: >-
          The click did reach Hall's toggle. Its own `on` flipped to true.

  - type: code-challenge
    id: build-use-disclosure
    concept: react.custom-hooks
    difficulty: 4
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A help page has several `Faq`s. Each has a question button and an answer that opens and
      closes. `Faq` is done. Its logic lives in `useDisclosure()`, which returns `{ open,
      toggle, close, buttonRef }`, and that hook is a stub.


      Write the hook. Each `Faq` must keep its own `open`. `toggle` flips it. `close` shuts it
      and puts focus back on the question button, because focus was inside the answer that's
      now hidden. The tests click and press Escape.
    hints:
      - Look at what `open` is now. It never changes, so nothing opens.
      - A hook can call `useState`. Each component that calls the hook gets its own copy.
      - 'Start with `const [open, setOpen] = useState(false);`, then `buttonRef.current?.focus()` in `close`.'

  - type: prose
    id: naming-hooks
    body: >-
      Name a hook for what it gives you: `useOnlineStatus`, `useDisclosure`. Not for when it
      runs, like `useMount`.


      The `use` start matters. React's linter, a tool that reads your code for mistakes,
      finds hooks by that prefix. A helper that calls no hooks shouldn't start with `use`.


      Next, a browser fact: `navigator.onLine` says if there's a connection. `window` fires
      `online` and `offline` events when it changes.

  - type: ai-review
    id: review-hook-name
    concept: react.custom-hooks
    difficulty: 3
    language: tsx
    request: Move the online check out of the header, so the chat box can use it too.
    flawClass: logic
    code: |
      function getOnlineStatus() {
        const [online, setOnline] = useState(navigator.onLine);
        useEffect(() => {
          const update = () => setOnline(navigator.onLine);
          window.addEventListener('online', update);
          window.addEventListener('offline', update);
          return () => {
            window.removeEventListener('online', update);
            window.removeEventListener('offline', update);
          };
        }, []);
        return online;
      }
    prompt: >-
      An assistant wrote this. It works in the header and the chat box. But the linter checks
      none of it. Tap the line at fault.
    lines: [1]
    reasons:
      - text: It calls hooks, but its name doesn't start with `use`
        correct: true
        feedback: >-
          Yes. Call it inside an `if` and nothing warns. Name it `useOnlineStatus`.
      - text: A custom hook can't call `useEffect`
        feedback: >-
          Custom hooks call other hooks all the time. That's what makes them hooks.
      - text: It should return `setOnline` as well
        feedback: >-
          Callers only read the status. The browser's events do the setting.
    fix: |
      function useOnlineStatus() {
        const [online, setOnline] = useState(navigator.onLine);
        useEffect(() => {
          const update = () => setOnline(navigator.onLine);
          window.addEventListener('online', update);
          window.addEventListener('offline', update);
          return () => {
            window.removeEventListener('online', update);
            window.removeEventListener('offline', update);
          };
        }, []);
        return online;
      }

  - type: explain-back
    id: explain-logic-not-state
    concept: react.custom-hooks
    difficulty: 4
    prompt: >-
      Two components call `useCart()`, a custom hook with `useState` inside. Why don't they see
      the same cart?
    rubric:
      - A custom hook is an ordinary function, and its hooks run inside whichever component calls it.
      - React keeps state per component, per hook position, so each caller gets its own `useState`.
      - Sharing one cart means holding it once, in a common parent or context, and reading it there.
    modelAnswer: >-
      `useCart` isn't a store. It's a function that runs during each component's render, so its
      `useState` belongs to whichever component called it. React keeps state per component and
      per hook position. Two callers mean two carts. To share one, keep the cart in a common
      parent or in context. The hook then reads it from there.

recap:
  - Keep values the screen doesn't show, like a timer's id, in a ref.
  - Reach a DOM element through `ref={box}` and `box.current`, in handlers and effects.
  - Move repeated stateful logic into a well-named custom hook, knowing each caller gets its own state.

recall:
  - id: card-ref-no-render
    concept: react.refs
    front: What happens on screen when you change `ref.current`?
    back: >-
      Nothing. A ref keeps the value, but changing it never asks React to render.
  - id: card-interval-ref
    concept: react.refs
    front: Why keep an interval's id in a ref instead of a `let` inside the component?
    back: >-
      Each render runs the component again and makes a fresh `let`. The ref keeps the same id,
      so Stop can clear it.
  - id: card-hook-shares-logic
    concept: react.custom-hooks
    front: Do two components that call the same custom hook share its state?
    back: >-
      No. Each call runs inside its own component, so each gets its own state.
  - id: card-hook-naming
    concept: react.custom-hooks
    front: How should you name a custom hook?
    back: >-
      Start with `use`, and name what it gives the caller, such as `useOnlineStatus`. The
      linter finds hooks by that prefix.

