term: two pointers
aka: [two-pointer technique, opposite pointers, read and write pointers, fast and slow pointers]
short: Walking through a list with two positions at once, moving each by a rule, instead of nested loops.
explain: |
  To find two numbers in a sorted list that add up to a target, you could try every pair.
  That's O(n²). Instead, start one marker at each end.

  Too small? Move the left one right. Too big? Move the right one left. Each step rules
  out one number for good, so the whole search is one pass, O(n), with no extra memory.

  Another version keeps a read marker and a write marker moving the same way. It removes
  duplicates or filters an array in place. The pattern needs order, or a rule that says
  which marker to move.
analogy: Two people folding a long tablecloth, walking towards each other from opposite ends until they meet.
example:
  language: js
  code: |
    function pairWithSum(sorted, target) {
      let left = 0, right = sorted.length - 1;
      while (left < right) {
        const sum = sorted[left] + sorted[right];
        if (sum === target) return [left, right];
        if (sum < target) left++;
        else right--;
      }
      return null;
    }
usage: The input's sorted, so two pointers from both ends gets it to O(n) with no hash map.
twin:
  term: sliding-window
  difference: Two pointers often start at opposite ends and close in. A sliding window keeps both edges moving forwards and cares about everything between them.
related: [sliding-window, in-place, invariant, brute-force]
level: 2
lessons: [algo.two-pointers]
