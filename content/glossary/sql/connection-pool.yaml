term: connection pool
aka: [connection pooling, pooler]
short: A small set of open database connections that requests borrow and hand back, instead of opening new ones.
explain: |
  Opening a database connection is slow, and each one uses memory on the database server.
  If every request opened its own, a busy app would spend more time connecting than
  querying, and the database would run out of slots.

  So the app keeps a few connections open and lends them out. Size it from the database's
  limit divided by the number of server copies, not from guesswork. Serverless functions
  each hold their own pool, so they need an external pooler such as PgBouncer in front of
  the database.
analogy: Shopping trolleys at the supermarket door. You take one, use it, and put it back for the next shopper.
example:
  language: ts
  code: |
    import { Pool } from 'pg';

    const pool = new Pool({ max: 10 });
    const { rows } = await pool.query('SELECT now()');
usage: We're out of connections at peak; with 20 servers and a connection pool of 10 each, we ask Postgres for 200.
related: [replication, sharding]
level: 2
lessons: [db.storage-and-pooling, cloud.serverless]