summary: >-
  More and more companies let you, or expect you to, use an AI assistant in coding
  interviews. The rubric barely changes: problem solving, code quality, verification and
  communication. What is added is judgement. The reviewer watches how you plan, what you
  ask for, how you check the answer, and whether you can explain every line you keep.


  One assessment platform names the three skills it scores: computational thinking (you plan the
  solution), prompt writing (clear, checkable questions) and AI proofreading (catching what
  the assistant gets wrong). So in an AI-assisted coding test the assistant never writes
  the solution. It clarifies the task, looks up syntax, suggests tests and reviews your code.


  When a round hands you generated code, it is often wrong about the task, not about the
  language. It breaks the tie the other way, uses the wrong unit, treats
  touching ranges as separate, or calls an API that does not exist, and it explains itself
  with total confidence. The defence is to decide what correct means before you prompt:
  restate the task, name the edge cases, write the test cases, then ask for small pieces
  and hold every answer against that standard.


  The first rule of every process comes before any of this: ask, for each round, whether AI
  tools are allowed. Some companies insist on them, some forbid them, and the answer can
  differ between the take-home and the live round.
remember:
  - Plan aloud and write your test cases before the first prompt, so every answer has a standard to fail against.
  - Check each answer against the task statement and your tests, never against how confident its explanation sounds.
  - In an AI-assisted coding test the assistant does four jobs, Clarify, Syntax, Tests and Review, in about five prompts; "solve this for me" is the one prompt that fails outright.
  - Give Tests, Review and hint prompts five parts, Job, Why, Context, Constraints and Done, and keep one-line factual questions one line.
  - When stuck, bank a working brute force first, then ask for a hint with the constraint "hint only, no code".
  - Fix a one-character bug by hand and say why; prompting for it suggests you cannot read the code.
  - You own every line you submit, so be ready to walk through generated code and say how you checked it.
  - Ask for every round whether AI tools are allowed, because policies differ between companies and between rounds.
sections:
  - title: A round, minute by minute
    body: |-
      A common shape is 60 minutes on one multi-file problem in three phases: fix a bug,
      build a feature, then make it fast on larger inputs. A plan that fits it:

      - Minutes 0 to 5: read the task and the files. Restate the task aloud, ask about the
        edge cases, and say what you will do in each phase.
      - Minutes 5 to 15, the bug: read the failing test and the code around it, form a
        hypothesis, and fix it by hand. Bugs in this phase are usually a wrong condition,
        an off-by-one or a type slip, and reading finds them faster than prompting.
      - Minutes 15 to 40, the feature: write the test cases first, including the nasty
        ones. Then prompt for one piece at a time, read each piece, run the tests, and
        fix small problems by hand.
      - Minutes 40 to 55, the optimisation: state the current complexity and the target.
        Decide the data structure yourself, then use the assistant to type it.
      - Minutes 55 to 60: run everything, state the final complexity, and name what you
        would do next.

      Narrate at checkpoints, not keystrokes: "the plan is X", "this test fails because
      Y", "I'm changing `>=` to `>` because a Map keeps first-use order". Those sentences
      are the evidence a reviewer writes down.
  - title: The prompt shape, worked
    body: |-
      Prompting guides, Anthropic's included, give the same advice: say what you want, why
      you want it, and what a finished answer looks like. In an interview that becomes five
      parts. **Job** is the ask. **Why** tells the model what matters, so it makes better
      choices. **Context** is what it needs to know: the signature, the limits, your
      approach. **Constraints** say what it must not do, and in a scored round the key one
      is "don't write or change the solution". **Done** says what the answer looks like, so
      you can check it.

      ```text
      Job: Suggest inputs that might break my solution.
      Why: Hidden tests decide my score, and I want to find failures first.
      Context: solution(A: number[]): number returns the largest K > 0 such that
        both K and -K are in A, else 0. A has up to 100,000 numbers. I put all
        numbers in a Set and check each positive x for -x. My tests already cover
        [0, 0], duplicates and several pairs.
      Constraints: Don't rewrite the code.
      Done: Up to 5 inputs my tests don't cover yet, each with the expected output.
      ```

      Use the shape for the bigger asks: test ideas, a review, a hint, an explanation.
      Keep short factual questions short. "Can A be empty?" with five labels on it reads as
      robotic, and it wastes the clock.

      When the assistant suggests a good case, add it to your test table and run again.
      When it suggests a wrong one, say why: "That input can't happen, the task says N is at
      least 1." Rejecting a wrong suggestion with a reason is AI proofreading, and it is
      scored.
  - title: Two transcripts
    body: |-
      Reviewers read the transcript next to the code. The one they like has about five
      prompts, and every one is a question an engineer would ask a colleague:

      ```text
      Clarify: Can A contain 0? Since K must be greater than 0, should [0, 0] return 0?
      Clarify: Can the same number appear several times? Does it matter?
      Syntax:  How do I build a Set from an array in TypeScript?
      Tests:   (the five-part prompt above)
      Review:  Job: review my function. Why: duplicates worry me. Context: ...
               Constraints: don't rewrite it, point to lines. Done: each problem
               with its line and a failing input, or "no problems" and what you checked.
      ```

      At most one more prompt corrects or questions the assistant, and it names the
      failure: "Your case [5, -5, 5] expects 10, but K must be in the array."

      The transcript that hurts has two lines: the task pasted in with "solve this", then
      "it fails, fix it". It shows no planning, no testing and no reading.

      If you are stuck halfway, submit a working brute force first, since correctness
      tests often pass it. Then ask for a hint in the full shape:

      ```text
      Job: Give me a hint to speed up my solution.
      Why: It's O(n^2) and n can be 100,000, so it will fail the speed tests.
      Context: It compares every pair. I think a Set could remove the inner loop,
        but I don't see how to handle duplicates.
      Constraints: Hint only, no code.
      Done: One or two sentences I can act on.
      ```

      Other formats allow more. In a round where the assistant may type code, the same
      habits apply: you decide the approach, you name the rule and the edge cases, and you
      read and test every line it produces.
  - title: Verifying generated code in minutes
    body: |-
      Reading every line catches most problems. For logic with many cases, add a
      **differential test**: compare the fast answer with a slow one too plain to be wrong,
      on thousands of small random inputs. It takes three minutes to write and finds the
      cases you did not think of.

      ```ts
      type Booking = [number, number];

      // A slow version too plain to be wrong. Work in half minutes, so a booking [s, e] covers
      // the points 2s to 2e and two touching bookings share a point. Runs of points are blocks.
      function mergeSlow(bookings: Booking[]): Booking[] {
        const busy = new Set<number>();
        for (const [s, e] of bookings) for (let p = 2 * s; p <= 2 * e; p++) busy.add(p);
        const runs: Booking[] = [];
        for (const p of [...busy].sort((a, b) => a - b)) {
          const last = runs[runs.length - 1];
          if (last && p === last[1] + 1) last[1] = p;
          else runs.push([p, p]);
        }
        return runs.map(([p, q]) => [p / 2, q / 2]);
      }

      function randomBookings(): Booking[] {
        const n = Math.floor(Math.random() * 6);
        return Array.from({ length: n }, () => {
          const start = Math.floor(Math.random() * 20);
          return [start, start + 1 + Math.floor(Math.random() * 6)] as Booking;
        });
      }

      for (let run = 0; run < 5000; run++) {
        const input = randomBookings();
        const copy = JSON.stringify(input);
        const fast = JSON.stringify(mergeBookings(input));
        const slow = JSON.stringify(mergeSlow(input));
        if (fast !== slow || JSON.stringify(input) !== copy) {
          console.log('Mismatch on', copy, { fast, slow });
          break;
        }
      }
      ```

      Run against the assistant's version with `start < last[1]`, it stopped at once on
      `[[0,4],[10,11],[2,4],[11,13]]`: the fast answer kept `[10, 11]` and `[11, 13]`
      apart. It also checks that the input was not mutated, another common slip. Keep the
      inputs small, so the slow version finishes and a failing case can be traced by hand.
  - title: The proofreading checklist
    body: |-
      Generated code fails in a handful of recurring ways. Knowing the list turns reviewing
      into a checklist rather than a hunch.

      - **Off-by-one.** `<` against `<=`, `length` against `length - 1`, a `slice` end that
        is not included.
      - **Empty and tiny inputs.** `[]`, one item, two equal items.
      - **Solves the example, not the task.** Hard-coded values, or a special case for what
        the example shows.
      - **Over-engineered.** Classes and helpers for a 15-line task. Simpler is easier to
        check, so ask for less.

      - **Misread rules.** Ties broken the wrong way (`>=` instead of `>`), touching ranges
        treated as separate, inclusive bounds made exclusive. Check each rule in the
        statement against one line of code.
      - **Wrong units.** Milliseconds divided by 1000 labelled as minutes, cents treated as
        pounds. The comment says one thing and the arithmetic another.
      - **Invented APIs.** `Math.clamp`, a plausible array method, an ARIA attribute that
        does not exist. If you do not recognise a call, check it or run it.
      - **Hidden mutation.** `bookings.sort(...)` sorts the caller's array in place. Copy
        first, or use `toSorted`.
      - **JavaScript defaults.** `sort()` with no comparator compares strings, so
        `[10, 9, 1].sort()` gives `[1, 10, 9]`.
      - **Complexity.** `includes` or `shift()` inside a loop turns O(n) into O(n²), which
        only shows on the large tier.

      After reading, run the tests, then add one test for each slip that could apply.
      A reviewer who sees you add the tie test before touching the code learns that you
      verify by habit.
pitfalls:
  - >-
    **Pasting the whole task into the chat.** It is the fastest start and shows the reviewer
    none of your judgement. Restate the task aloud and plan first.
  - >-
    **Trusting the explanation.** Generated explanations are fluent whether or not the code
    is right. Trust the test run and the statement, not the prose.
  - >-
    **Testing only the example.** The example rarely contains a tie, a touching range or an
    empty input, which is why the plausible answer passes it. Write the missing cases first.
  - >-
    **Re-prompting for tiny fixes.** Asking the assistant to change one character, or to
    rewrite a whole function for one bug, costs time and brings new lines to check. Fix it
    by hand and say why.
  - >-
    **"Still broken, try again."** A vague loop of retries reads as hands-off. Say what is
    wrong and what the rule is, so the next answer is targeted.
  - >-
    **Submitting code you cannot explain.** "The assistant wrote that part" is not an
    answer to "walk me through this". Read and understand every line you keep.
  - >-
    **Assuming AI is allowed.** Some processes forbid it and treat use as a breach. Ask
    for each round.
interview:
  - question: How did you use the AI assistant during this task?
    answer: >-
      I used it to check my work, not to write it. I restated the task and wrote the test
      cases first, including the tie, the touching ranges and the empty input, because
      those are where a plausible answer breaks. I asked two clarifying questions, one
      syntax question, then a Tests prompt with the job, the reason, the signature and the
      constraint "don't write the solution". It suggested a nested booking, which I added
      to the table. Last, I asked for a review that lists problems without rewriting. The
      trade-off is a slower start for far fewer surprises, and I can explain every line.
  - question: The assistant's answer passes the example. Why don't you move on?
    answer: >-
      Because the example is exactly the case the assistant was most likely to get right,
      and it says nothing about the rules the task added. Tasks in these rounds are often
      designed so the common answer is wrong on a tie, a boundary or a unit. So I check the
      code against each rule in the statement, run my own cases for the corners, and if the
      logic is intricate I compare it with a slow reference on random small inputs. It
      takes a few minutes. The alternative is finding the bug when the hidden tests run,
      when I can no longer fix it or explain it.
  - question: When would you not use the assistant, even if it is allowed?
    answer: >-
      When reading is faster or the decision is the point. A failing test with a short
      diff is quicker to fix by reading than by describing it to a chat. Choosing the
      algorithm or data structure for the optimisation phase is the judgement being scored,
      so I decide it myself and at most let the assistant type the heap or the map. I also
      skip it for tiny edits, since prompting for a one-character change suggests I cannot
      read the code. I do use it for boilerplate, test scaffolding and APIs I half
      remember, and I check any API it names before relying on it.
  - question: Walk me through this function. Your assistant wrote it.
    answer: >-
      I own it, so I walk through it like my own code: what it takes, what it returns, and
      the rule each branch implements. For the merge: it copies and sorts by start so the
      caller's array is untouched, then keeps a list of blocks. Each booking either extends
      the last block, when its start is at or before that block's end, which is how
      touching joins, or starts a new block. `Math.max` keeps a long block from being
      shortened by one inside it. Then I say how I checked it: the example, my edge cases,
      and a random comparison with a slow version. It is O(n log n) for the sort and O(n)
      extra space.
  - question: What do you think an AI-assisted coding test is really measuring?
    answer: >-
      Three things beside the code: whether I can plan a solution myself, whether I can
      ask an assistant clear questions whose answers I can check, and whether I catch what
      it gets wrong. One platform names them computational thinking, prompt writing and AI
      proofreading. So I plan aloud first, keep factual questions short, give bigger asks
      a job, a reason, context, constraints and a definition of done, and I test every
      suggestion before I trust it. The risk in the other direction is over-prompting:
      twenty prompts for a 15-line task reads as dependence, so I aim for about five.
terms:
  - term: AI-assisted round
    say: An easier round, because the AI solves it.
    means: "A round that still scores problem solving, code quality, verification and communication, and
      adds judgement: how you plan, what you ask and how you check the answers."
  - term: Computational thinking
    say: Knowing lots of algorithms.
    means: Planning the solution yourself, aloud and with test cases, before the first prompt, so every
      answer has a standard it can fail against.
  - term: AI proofreading
    say: Reading the answer to see if it looks right.
    means: Checking generated code against the task statement and your own tests. It is more often wrong
      about the task, such as a tie-break or a unit, than about the language.
  - term: Verification
    say: It passes the example.
    means: Evidence that it follows the rules and edge cases in the statement, from tests you chose
      before you saw the code.
  - term: Owning the code
    say: The assistant wrote that part.
    means: You answer for every line you submit, so you can explain each one and say how you checked it.
