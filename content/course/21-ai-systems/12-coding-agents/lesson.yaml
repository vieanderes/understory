deepDive: >-
  A test-first loop suits agents well. Write the failing test yourself, or ask for it and
  read it closely, then ask for the change. The test is a target the agent can check
  alone, and it stops the agent from quietly redefining the task.


  **In an interview**, say what you delegate, such as boilerplate, exploration and first
  drafts of tests. Say how you check it. And say what you keep: design decisions, and
  understanding every line you ship.


  Keep context files lean. A long file costs tokens on every session, and instructions
  that are out of date do more harm than none. Link to deeper docs instead of copying them.
