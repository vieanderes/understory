term: breaking change
aka: [breaking API change, backwards-incompatible change, compatible change]
short: A change to an interface that makes code written against the old version stop working.
explain: |
  Phone apps, partners' scripts and old integrations keep calling an API the way they were
  built to. You can't update them on your next deploy. So every change you ship either keeps
  them working or breaks them.

  Adding an optional field or a new endpoint is compatible, as long as clients ignore what
  they don't know. Removing, renaming or retyping a field breaks old readers. Making a
  request field required breaks old writers. Breaks you can't avoid go in a new version,
  announced well ahead.
analogy: Moving the light switches in someone else's house. It's still a light switch, but everyone fumbles in the dark.
example:
  language: js
  code: |
    // v1: clients read name
    const v1 = { id: 7, name: 'Robin Hale' };
    // Breaking: name is gone
    const breaking = { id: 7, firstName: 'Robin', lastName: 'Hale' };
    // Compatible: new fields beside the old one
    const compatible = { id: 7, name: 'Robin Hale', firstName: 'Robin' };
usage: Renaming `name` is a breaking change for the mobile app, so add the new fields beside it first.
related: [expand-and-contract, semantic-versioning, tolerant-reader, rest]
level: 2
lessons: [backend.api-evolution]
