term: alt text
aka: [alt attribute, alternative text]
short: A description of an image in words, read aloud by screen readers and shown if it fails.
explain: |
  Not everyone sees your images. A screen reader user hears them, and on a slow train the
  file may never load. The `alt` attribute gives the words to use instead.

  Write what the image tells the reader in this spot, not "image of". A chart's alt says its
  finding. A purely decorative image gets `alt=""`, empty, so it's skipped. Leave `alt` out
  and some screen readers read the file name aloud.
analogy: Describing a photo to a friend over the phone. You say what matters, not every pixel.
example:
  language: html
  code: |
    <img src="sales-chart.png" alt="Sales doubled between March and June">
    <img src="divider.png" alt="">
usage: The logo's alt text says logo.png, so give it the site's name, because it's also the home link.
related: [html-attribute, screen-reader, accessible-name, responsive-image]
level: 1
lessons: [html.everyday-elements, design.accessibility-foundations]
