summary: >-
  A list in React is an array of elements, usually built with `map`. Showing it takes one line.
  The work starts when the list changes: an item is added at the top, one is removed,
  the order flips. React has to decide which old row each new row is, because that decides
  where state, DOM nodes and focus end up.


  **Keys** answer that question. A key is a name for an element among its siblings, and React
  matches old and new children by it. Get the key right, a stable id from the data, and every
  row keeps its own tick, its half-typed note and its DOM node through any reorder. Get it
  wrong, the index or a random number, and state stays with a position or is thrown away on
  every render.


  The same rule works outside lists. React keeps a component's state while its position, type
  and key stay the same. So a key is also the tool for the opposite job: making a component start fresh on purpose.
  Think of an edit form that should reset when you pick another contact.
remember:
  - React matches old and new children by key, so state, DOM nodes and focus follow the key, not the position.
  - A key must be stable across renders, unique among its siblings, and come from the data, such as a database id.
  - An index key ties state to a position, so any reorder, insert or filter moves state onto the wrong item.
  - A key made during render, such as `Math.random()`, never matches, so every item is unmounted and rebuilt each time.
  - React keeps a component's state while its position, type and key stay the same, and changing any of them resets it.
  - Changing a component's key on purpose is the standard way to reset all of its state, such as `<EditContact key={contact.id} />`.
  - '`key` is not a prop: the child can''t read it, so pass the id again under another name if the child needs it.'
  - The key goes on the outermost element returned from `map`, and a keyed fragment is written `<Fragment key={id}>`, not `<>`.
sections:
  - title: How React matches a changed list
    body: |-
      When a parent renders again, React compares its new children with the old ones. Without
      keys it pairs them by position: first with first, second with second. With keys it
      builds a lookup of the old children by key. Each new child finds its old self by key.
      A match of the same type is updated in place, and its DOM node moves if it has to. A new
      key mounts a fresh component. An old key with no match is unmounted, state and all.

      This is a heuristic, not a full tree comparison. Comparing two arbitrary trees perfectly
      is far too slow for every render, so React assumes that keys and types tell it which
      elements are the same. That keeps each update close to linear in the number of children.

      What moves with a key is more than React state. The DOM node moves too, and with it
      whatever the browser keeps inside it: an uncontrolled input's text, focus, scroll
      position, a running CSS transition. This test shows both outcomes.

      ```tsx
      function List({ byIndex }: { byIndex: boolean }) {
        const [items, setItems] = useState([
          { id: 'a', title: 'Bread' },
          { id: 'b', title: 'Milk' },
        ]);
        return (
          <>
            <button onClick={() => setItems(items.toReversed())}>Reverse</button>
            <ul>
              {items.map((task, i) => (
                <li key={byIndex ? i : task.id}>
                  <input aria-label={task.title} />
                </li>
              ))}
            </ul>
          </>
        );
      }

      // Type "2 loaves" into Bread, then press Reverse.
      // key={task.id}: the Bread input is the same DOM node, moved, and still says "2 loaves".
      // key={i}: the top input keeps "2 loaves" but is now labelled Milk.
      ```

      With the index key, React saw the same keys, 0 and 1, in the same order. It concluded
      nothing moved and only updated the labels. The typed text stayed in the top node.
  - title: Resetting a component with a key
    body: |-
      Props changing never resets state. An edit form that copies `contact.name` into state
      keeps showing the first contact's name after you pick another, because React sees one
      `EditContact` in one place with new props. A key tied to the contact fixes it:

      ```tsx
      type Contact = { id: string; name: string };

      function EditContact({ contact }: { contact: Contact }) {
        const [name, setName] = useState(contact.name);
        return <input aria-label="Name" value={name} onChange={(e) => setName(e.target.value)} />;
      }

      // In the parent: a new contact id means a new instance with fresh state.
      <EditContact key={contact.id} contact={contact} />;
      ```

      The key does not need a list around it. Any element can take one, and a changed key
      tells React this is a different thing. The cost is a full remount: every piece of state
      below is dropped, DOM nodes are rebuilt, and effects in the subtree run their cleanups
      and set up again. For a form that is what you want. For a large subtree where only one
      value should reset, it can be too much.

      For that narrower case React documents a second pattern: remember the previous prop in
      state and adjust during render.

      ```tsx
      function EditContact({ contact }: { contact: Contact }) {
        const [name, setName] = useState(contact.name);
        const [prevId, setPrevId] = useState(contact.id);
        if (contact.id !== prevId) {
          setPrevId(contact.id);
          setName(contact.name);
        }
        return <input aria-label="Name" value={name} onChange={(e) => setName(e.target.value)} />;
      }
      ```

      React re-runs the component at once with the new state, before touching the page, so
      no stale frame shows. It's harder to read than a key, so reach for the key first. Both
      beat an effect that calls `setName` after the render, which shows the old name for one
      frame and costs an extra render.
  - title: Where good keys come from
    body: |-
      The best key is an id the data already has: a database primary key, a product SKU, a
      message id from the server. It stays with the item for its whole life and is unique by
      construction.

      Items created in the browser need an id at the moment they are created, not while
      rendering:

      ```tsx
      function addTask(title: string) {
        setTasks((prev) => [...prev, { id: crypto.randomUUID(), title }]);
      }
      ```

      The id is stored with the item, so every later render reads the same value.
      `crypto.randomUUID()` needs a secure context in the browser, which means HTTPS or
      localhost. A counter kept outside the component works too. What doesn't work is an id derived from something that can repeat.
      `list.length` repeats after a removal. `Date.now()` can collide when two items arrive in
      the same millisecond. A title breaks as soon as two songs share one.

      When items come from two sources, combine them: ``key={`${order.id}-${line.sku}`}``. Keys
      only need to be unique among siblings, so the same ids can appear in another list on the
      page.

      Two details trip people up. First, the key belongs on the element `map` returns, not on
      the root inside the child component; React matches the elements it receives from `map`.
      Second, when each item renders more than one element, wrap them in a keyed fragment.
      The short `<>` syntax cannot take a key, so import `Fragment`:

      ```tsx
      <dl>
        {terms.map((term) => (
          <Fragment key={term.id}>
            <dt>{term.word}</dt>
            <dd>{term.meaning}</dd>
          </Fragment>
        ))}
      </dl>
      ```
  - title: What bad keys cost, beyond wrong state
    body: |-
      Index keys cause a correctness bug when rows hold state, and a performance cost even when
      they don't. Add an item at the top of a list keyed by index: every key now points at a
      different item, so React updates every row's props and text. With id keys, React mounts
      one new row and moves nothing else.

      Random keys are worse. Every render produces keys React has never seen, so it unmounts
      every row and mounts new ones. Inputs lose focus mid-word, images flash as they reload,
      and effects inside each row clean up and start again. The console stays quiet, because
      there is a key and it is unique, which is why this bug survives code review.

      Duplicate keys get a development warning: React says non-unique keys may cause children
      to be duplicated or omitted, and calls the behaviour unsupported. Treat that warning as a
      bug, not noise. And remember the child can't see its key: React warns that `key` is not a
      prop and gives the child `undefined` if it tries. Pass `id={task.id}` as well when the row
      needs its own id, for example to build an `aria-label` or call `onRemove(id)`.
pitfalls:
  - >-
    **Using the index because the warning goes away.** It silences the console but ties state to
    positions, so ticks and typed text land on the wrong row after a reorder. Use an id that
    travels with the item.
  - >-
    **Generating the key during render.** `key={Math.random()}` or `key={crypto.randomUUID()}`
    inside `map` makes new keys every render and rebuilds every row. Create the id once, when the
    item is created, and store it.
  - >-
    **Putting the key inside the child.** A `key` on the `<li>` that `TaskRow` returns does
    nothing for the list. Put it on `<TaskRow key={task.id} />` in the `map`.
  - >-
    **Keying by content that can repeat.** Two songs called "Intro" share a key, and React may
    drop or duplicate one. Use a real id, or combine fields until the key is unique.
  - >-
    **Resetting state with an effect.** `useEffect(() => setName(contact.name), [contact])` shows
    the old name for a frame and renders twice. Give the component `key={contact.id}` instead.
  - >-
    **Reading `props.key` in the child.** It is always `undefined`. Pass the id again under
    another prop name.
interview:
  - question: Why does React need keys on list items?
    answer: >-
      Keys tell React which element in the new render is the same item as one in the last
      render. When a list re-renders, React matches old and new children to decide what to
      update, move, mount or unmount. Without keys it matches by position, which is only right
      if nothing was inserted, removed or reordered. With a stable key from the data, a moved item keeps its component state and its DOM node,
      including focus and an uncontrolled input's text. React also moves one node instead of
      rewriting every row. The trade-off is
      that you need a real identity in the data. If the data has none, create an id when the
      item is created, never during render.
  - question: When is it acceptable to use the array index as a key?
    answer: >-
      Only when the list never reorders, filters or inserts anywhere but the end, and its rows
      hold no state of their own, React or DOM. A static footer menu qualifies. Anywhere else
      the index describes a position, not an item, so after a reorder the state for position
      zero lands on whatever item is now first. Prepending with index keys also makes React
      update every row, where id keys mount one. In practice I treat an index key as a code smell to justify. Lists that start static tend to
      gain sorting or deletion later, and then the bug appears without any warning.
  - question: How would you reset a form's state when the user picks a different record?
    answer: >-
      Give the form a key tied to the record, `<EditForm key={record.id} record={record} />`.
      React keeps state while position, type and key match, so a new key makes it a new
      instance and every piece of state starts again from the new props. It is declarative and
      impossible to half-do. The alternative people reach for, an effect that copies props into
      state when they change, renders the stale values first and then renders again. The cost
      of a key is a full remount of the subtree, effects included. If only one value should
      reset and the subtree is heavy, I would store the previous id and adjust that value during
      render, which React supports.
  - question: A list uses `key={Math.random()}`. The warning is gone. What's wrong?
    answer: >-
      Every render creates keys React has never seen, so it unmounts every item and mounts new
      ones. All row state is lost, inputs lose focus while you type, images reload and effects
      in each row restart. It's also slower than any other choice, because nothing is reused.
      The warning only checks that a key exists and is unique among siblings, not that it is
      stable, so this passes review easily. The fix is an id stored with each item. If the data
      has none, generate one with `crypto.randomUUID()` when the item is created or loaded, and
      keep it in state with the item.
