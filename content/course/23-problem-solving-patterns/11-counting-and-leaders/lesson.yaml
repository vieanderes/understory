id: algo.counting-and-leaders
title: Counting and the majority value
objective: Count with an array or a map instead of sorting, find the smallest missing number in one pass, and find a majority value with a verified candidate.
level: essential
minutes: 10
concepts: [algo.counting-array, algo.leader]
prerequisites: [algo.stacks-and-queues]
opening:
  text: >-
    You'll answer "what's missing" and "what's most common" in one pass, without
    sorting. Counting tasks are among the most common warm-ups in timed tests.

steps:
  - type: prose
    id: picture-counting
    body: |-
      Counting is a tally sheet. When values are small whole numbers, an array indexed by
      value does the job:

      ```js
      const counts = new Array(6).fill(0); // ratings 0 to 5
      for (const rating of ratings) counts[rating]++;
      ```

      Reach for counting when a task says: "each number from 1 to N", "missing",
      "duplicate", "appears more than half the time" or "most frequent".

  - type: multiple-choice
    id: spot-counting-signal
    concept: algo.counting-array
    difficulty: 1
    question: Which task is a counting job?
    choices:
      - text: Find the smallest order number not used yet
        correct: true
        feedback: >-
          Yes. Tick off what's there, then look for the first gap.
      - text: Total the sales between two dates, many times
        feedback: >-
          Many range totals on fixed data is a prefix sum.
      - text: Check that the brackets in a file nest
        feedback: >-
          Nesting wants a stack: the latest opener closes first.
      - text: Show "warmer in N days" for each day
        feedback: >-
          "Next warmer" is the monotonic stack from the last lesson.

  - type: prose
    id: name-counting-array
    body: |-
      That's a **counting array**: the value is the index, and the slot holds how many.

      It needs no sorting and no hashing. One pass costs O(n), plus O(k) for k possible
      values. It fits values in a small known range: ratings, ages, positions from 1 to n.
      For anything else, a `Map` from value to count does the same job.

  - type: multiple-choice
    id: pick-counting-store
    concept: algo.counting-array
    difficulty: 2
    question: User ids go up to 2,000,000,000. What should count visits per user?
    choices:
      - text: A `Map` from id to count
        correct: true
        feedback: >-
          Right. It holds only the ids that appear, and each update is O(1).
      - text: An array with two billion slots
        feedback: >-
          Index by value only works for small ranges. This one needs gigabytes, mostly zeros.
      - text: Sort the ids, then count runs
        feedback: >-
          It works, but costs O(n log n). A map counts in one pass.

  - type: ai-review
    id: review-sort-missing
    concept: algo.counting-array
    difficulty: 2
    language: js
    request: Write firstFreeNumber(used), the smallest positive whole number not in the list.
    flawClass: logic
    code: |
      function firstFreeNumber(used) {
        const sorted = [...used].sort();
        let next = 1;
        for (const n of sorted) {
          if (n === next) next++;
        }
        return next;
      }
    prompt: >-
      An assistant wrote this. It passed `[3, 1, 2]`. For the numbers 1 to 10 it returned
      `10`, which is taken. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`sort()` compares the numbers as text'
        correct: true
        feedback: >-
          Yes. `'10'` sorts before `'2'`. Pass `(a, b) => a - b`.
      - text: Copying with `[...used]` loses numbers
        feedback: >-
          The copy keeps every number. It's good manners too: `sort` changes the array it's called on.
      - text: Duplicates make `next` skip a number
        feedback: >-
          A duplicate fails `n === next`, so it's skipped harmlessly. The order is what's off.
    fix: |
      const sorted = [...used].sort((a, b) => a - b);

  - type: code-challenge
    id: write-first-free
    concept: algo.counting-array
    difficulty: 3
    language: ts
    twin:
      language: python
      starter: free.starter.py
      solution: free.solution.py
      tests: free.tests.py
    prompt: >-
      An invoicing tool gives each new invoice the smallest positive number not in use.
      Deleted drafts free their numbers. Write `firstFreeNumber(used)`.


      `firstFreeNumber([3, 1, 6, 4, 1, 2])` is `5`. The list may hold duplicates,
      negatives and huge numbers.


      **Target:** O(n) for up to 300,000 numbers. The tests include an empty list, only
      negatives, 1 to 10 in order, and a full-size run. Checking 1, 2, 3 and so on with
      `includes` runs out of time.
    hints:
      - With n numbers in the list, how large can the answer be?
      - The answer is at most `n + 1`, so values below 1 or above `n + 1` can't matter.
      - 'Tick `seen[value]` for every value from 1 to `n + 1`, then walk up from 1 to the first gap.'

  - type: prose
    id: name-leader
    body: |-
      Another counting classic: the value in more than half the items, called the
      **leader** or majority. A `Map` of counts finds it in O(n) time and O(n) memory.

      There's a trick for O(1) memory. Pair off any two different values and throw both
      away. The leader can't run out first, so it survives. But with no leader something
      still survives, so count that candidate in a second pass.

  - type: ai-review
    id: review-leader-check
    concept: algo.leader
    difficulty: 3
    language: js
    request: Write dominant(readings), the value in more than half the readings, or -1 if none.
    flawClass: logic
    code: |
      function dominant(readings) {
        let candidate = null;
        let count = 0;
        for (const value of readings) {
          if (count === 0) candidate = value;
          count += value === candidate ? 1 : -1;
        }
        return candidate;
      }
    prompt: >-
      An assistant wrote this. It passed `[2, 2, 1]`. For `[4, 4, 1, 2, 3]` it returned
      `3`, which appears once. Tap the line at fault.
    lines: [8]
    reasons:
      - text: The candidate is returned without counting it
        correct: true
        feedback: >-
          Yes. Count it in a second pass. Return it only if it's more than half.
      - text: The count should never go below 0
        feedback: >-
          It can't: it resets the candidate at 0. The loop is fine; the ending isn't.
      - text: '`candidate` should start as `readings[0]`'
        feedback: >-
          Starting at `null` is fine, since the first value takes over at count 0.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A list with no majority value
          correct: true
          feedback: >-
            Yes. Something always survives the vote, so only this shows the missing count.
        - text: A list where every reading is the same
          feedback: >-
            That value really is the majority, so returning the candidate is right.
        - text: A list with a single reading
          feedback: >-
            One reading is more than half of one, so the candidate is right again.
    fix: |
      let seen = 0;
      for (const value of readings) if (value === candidate) seen++;
      return seen * 2 > readings.length ? candidate : -1;

  - type: code-challenge
    id: write-dominant-status
    concept: algo.leader
    difficulty: 4
    language: python
    starter: dominant.starter.py
    solution: dominant.solution.py
    tests: dominant.tests.py
    prompt: >-
      An incident dashboard asks: did one status code make up more than half of the
      responses? Write `dominant(codes)` in Python. Return that code, or `-1`.


      `dominant([200, 500, 200, 200, 404])` is `200`. `dominant([200, 404])` is `-1`.


      **Target:** O(n) time for up to 100,000 codes. The tests include an empty list, a code
      at exactly half, and a full-size run. Calling `codes.count` for every code runs out
      of time.
    hints:
      - '"More than half" means strictly more: half isn''t enough.'
      - A `dict` of counts works in one pass. For O(1) memory, keep one candidate and a count.
      - 'Whichever you choose, check the winner with `count * 2 > len(codes)` before returning it.'

  - type: explain-back
    id: explain-leader-survives
    concept: algo.leader
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer asks for O(1) extra memory. Talk them through your majority solution
      and why it needs a second pass.
    rubric:
      - Keep one candidate and a count; a different value cancels one, and at 0 a new candidate starts.
      - The leader holds more than half the items, so other values run out before it does.
      - With no leader something still survives, so a second pass counts it. O(n) time, O(1) space.
    modelAnswer: >-
      I keep a candidate and a count. A matching value adds one, a different value cancels
      one, and at zero the next value becomes the candidate. Each cancel removes at most one
      leader item. The leader has more than all the rest together, so it's what's left.
      Without a leader, anything can be left, so I count the candidate again. That's two
      passes: O(n) time and O(1) extra space.

recap:
  - Count small whole numbers with an array, anything else with a `Map`.
  - Sort numbers in JavaScript with `(a, b) => a - b`, never bare `sort()`.
  - Find a majority with a candidate and a count, then verify it.
recall:
  - id: card-counting-fit
    concept: algo.counting-array
    front: When is a counting array a better fit than a `Map`?
    back: >-
      When values are small whole numbers in a known range, like 1 to n.
  - id: card-sort-numbers
    concept: algo.counting-array
    front: How do you sort an array of numbers in JavaScript, and why not bare `sort()`?
    back: >-
      `sort((a, b) => a - b)`. Without a comparator, `sort` compares values as strings,
      so 10 comes before 2.
  - id: card-leader-def
    concept: algo.leader
    front: What makes a value the leader of a list?
    back: >-
      It appears in more than half of the items.
  - id: card-leader-verify
    concept: algo.leader
    front: Why does the voting pass need a second pass?
    back: >-
      Without a leader, some value still survives. Counting it tells you whether it really
      has more than half.

references:
  - kind: paper
    title: 'MJRTY: A Fast Majority Vote Algorithm'
    authors: Robert S. Boyer and J Strother Moore
    year: 1991
    venue: 'Automated Reasoning: Essays in Honor of Woody Bledsoe, Kluwer, pp. 105-117'
    url: https://doi.org/10.1007/978-94-011-3488-0_5
    note: The original voting algorithm, at most two comparisons per vote, with a machine-checked proof of its code.
    primary: true
    verified: true

deepDive: >-
  **Raise every counter at once.** A classic counting task has a "set every counter to the
  current maximum" event. Looping over every counter makes it O(n × m). Instead keep a
  `floor`: the event only sets `floor = top`. When a counter is next touched, raise it to
  `floor` first, and apply the floor to all of them once at the end. Each event is then
  O(1). The same lazy idea powers range updates in segment trees.


  **Permutation checks.** "Does this list hold each of 1 to n exactly once?" is a counting
  array of size n + 1: fail on anything out of range or counted twice.


  **Split points.** Some tasks ask where a list can be cut so both halves share a leader.
  Any such leader must lead the whole list, so find it first, then walk from the left
  keeping its count.


  The voting pass extends to "every value in more than a third of the items": keep two
  candidates and two counts, then verify both.
