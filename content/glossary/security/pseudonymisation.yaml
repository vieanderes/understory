term: pseudonymisation
aka: [pseudonymization, pseudonymise, reversible redaction, tokenisation of personal data]
short: Replacing personal values with placeholders that only a separately kept table can turn back into real values.
explain: |
  Sometimes the reply must contain the real value, like the customer's name in an email.
  So you swap the name for `PERSON_1` before the prompt goes out. You keep the mapping
  on your side, and put the name back into the reply afterwards.

  The data is still personal in law, because the mapping exists. Guard the table like the
  data itself, and delete it when the data must be erased.
analogy: A cloakroom ticket. The ticket says 42, not whose coat it is, but the attendant can still match them.
usage: Use pseudonymisation for the names so the drafted reply can address the customer properly.
related: [redaction, pii, data-minimisation]
level: 3
lessons: [aisys.pii-and-privacy, security.personal-data, security.abuse-and-privacy]
