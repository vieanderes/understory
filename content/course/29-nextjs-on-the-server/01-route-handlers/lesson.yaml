id: nextserver.route-handlers
title: Route handlers
objective: Build a JSON endpoint in Next.js with a route handler, and say what the proxy file is for.
level: essential
minutes: 10
concepts: [nextserver.route-handlers, nextserver.handler-errors, nextserver.proxy]
prerequisites: [backend.validation, next.loading-data]
opening:
  text: >-
    You'll give a book club app a JSON endpoint, in the same Next.js project as its pages.
    And you'll answer a bad request with a clear `400`, not a crash.

steps:
  - type: prose
    id: same-endpoint-in-next
    body: >-
      In this chapter you built endpoints on a Node server. Next.js can hold them too, next to
      your pages. You write a **route handler**: a file called `route.ts` inside `app`.


      ```ts
      // app/api/books/route.ts
      const books = [{ id: 1, title: "Small Island" }];

      export async function GET() {
        return Response.json(books);
      }
      ```


      The function's name is the method it answers. `Response.json` sends the list as JSON.

  - type: multiple-choice
    id: pick-handler-url
    concept: nextserver.route-handlers
    difficulty: 1
    language: text
    code: |
      app/
        page.tsx
        api/
          books/
            route.ts
    question: Which URL does `route.ts` answer?
    choices:
      - text: '`/api/books`'
        correct: true
        feedback: >-
          Right. Folders make the URL, the same way they do for pages.
      - text: '`/books`'
        feedback: >-
          The `api` folder is part of the path too. Every folder above the file counts.
      - text: '`/api/books/route`'
        feedback: >-
          Like `page.tsx`, the file name never shows in the URL. The folders do.

  - type: prose
    id: request-in-response-out
    body: >-
      A handler gets the **request** as its first argument. It's the same `Request` object
      that `fetch` uses. `await request.json()` reads a JSON body.


      ```ts
      export async function POST(request: Request) {
        const body = await request.json();
        return Response.json({ title: body.title }, { status: 201 });
      }
      ```


      The second argument to `Response.json` sets the status. Leave it out, and it's `200`.

  - type: predict-output
    id: predict-missing-method
    concept: nextserver.route-handlers
    difficulty: 2
    language: bash
    code: |
      $ cat app/api/books/route.ts
      export async function GET() {
        return Response.json(books);
      }
      $ curl -i -X POST localhost:3000/api/books
    question: What status line comes back?
    choices:
      - text: '`405 Method Not Allowed`'
        correct: true
        feedback: >-
          Right. The path exists, but no `POST` function does.
      - text: '`404 Not Found`'
        feedback: >-
          The path is real, so it isn't a 404. The method is what's missing.
      - text: '`200 OK`, with the book list'
        feedback: >-
          Next.js never runs `GET` for a `POST`. Each method needs its own function.
      - text: '`500 Internal Server Error`'
        feedback: >-
          Nothing crashed. Next.js answers a missing method itself, before any code of yours runs.

  - type: fill-blank
    id: fill-create-handler
    concept: nextserver.route-handlers
    difficulty: 2
    language: ts
    prompt: >-
      Members suggest a book with a POST. Read the JSON body and answer "created". Fill the
      gaps.
    template: |
      // app/api/suggestions/route.ts
      export async function {{1}}(request: Request) {
        const body = await request.{{2}}();
        const saved = await saveSuggestion(body.title);
        return Response.json(saved, { {{3}}: 201 });
      }
    blanks:
      - key: '1'
        answer: POST
      - key: '2'
        answer: json
      - key: '3'
        answer: status
    bank: [POST, GET, json, text, status, code]

  - type: prose
    id: bad-json-is-a-crash
    body: >-
      Here's the catch. Someone sends a form body instead of JSON. `request.json()` throws, and
      an error nobody catches becomes a `500`:


      ```text
      $ curl -i -d 'title=Emma' localhost:3000/api/suggestions
      HTTP/1.1 500 Internal Server Error

      ⨯ SyntaxError: Unexpected token 'i', "title=Emma" is not valid JSON
      ```


      But the caller made the mistake, so it's a `400`. Catch the parse error, answer `400`,
      then check the fields, as in the validation lesson.

  - type: code-challenge
    id: write-answer-suggestion
    concept: nextserver.handler-errors
    difficulty: 3
    language: ts
    prompt: >-
      Write `answerSuggestion(text)`. It gets the raw body text and returns `{ status, body }`.
      The route then only does `Response.json(body, { status })`.


      Text that isn't JSON gives `400` and `{ error: 'Send JSON' }`. JSON without a `title`
      that's a non-blank string gives `400` and `{ error: 'Add a title' }`. Otherwise give
      `201` and `{ title }`, trimmed, with nothing else.


      Example: `'{"title":" Emma "}'` gives `{ status: 201, body: { title: 'Emma' } }`.
    hints:
      - There are three outcomes. Deal with the text that can't be parsed first.
      - '`JSON.parse` throws on bad text, and `null` is valid JSON with no fields.'
      - 'Start with `let data: unknown;` and a `try` around `data = JSON.parse(text);`.'

  - type: prose
    id: what-the-proxy-is
    body: >-
      One more file. **`proxy.ts`** sits at the root of the project and runs before a request
      reaches any page or handler. It can send the visitor somewhere else, or answer itself.


      ```ts
      export function proxy(request: NextRequest) {
        return NextResponse.redirect(new URL("/closed", request.url));
      }

      export const config = { matcher: ["/shop/:path*"] };
      ```


      The **matcher** lists the paths it runs for. `NextRequest` is a `Request` with a few
      extras. Before Next.js 16, this file was called `middleware.ts`.

  - type: ai-review
    id: review-closed-loop
    concept: nextserver.proxy
    difficulty: 3
    language: ts
    request: Send every visitor to the closed page while we do the stocktake.
    flawClass: logic
    code: |
      import { NextResponse } from "next/server";
      import type { NextRequest } from "next/server";

      export function proxy(request: NextRequest) {
        return NextResponse.redirect(new URL("/closed", request.url));
      }

      export const config = { matcher: ["/:path*"] };
    prompt: >-
      An assistant wrote this. Its test opens `/about` and sees a redirect. In a real browser,
      the page says it redirected too many times. Tap the line at fault.
    lines: [5]
    reasons:
      - text: It also redirects visits to `/closed` itself
        correct: true
        feedback: >-
          Yes. `/closed` matches `/:path*` too, so it redirects to itself for ever.
      - text: '`redirect` should be `rewrite`'
        feedback: >-
          A rewrite would hide the loop's symptom. The real flaw is that `/closed` is sent to
          `/closed`.
      - text: The proxy has to be `async`
        feedback: >-
          It awaits nothing, so a plain function is fine. The trouble is which paths it
          redirects.
    fix: |
      import { NextResponse } from "next/server";
      import type { NextRequest } from "next/server";

      export function proxy(request: NextRequest) {
        if (new URL(request.url).pathname === "/closed") return NextResponse.next();
        return NextResponse.redirect(new URL("/closed", request.url));
      }

      export const config = { matcher: ["/:path*"] };

  - type: explain-back
    id: explain-proxy-not-alone
    concept: nextserver.proxy
    difficulty: 4
    prompt: >-
      The proxy checks a staff key on every `/admin` path. Why should the handler that deletes
      stock check the key too?
    rubric:
      - The proxy only runs for paths its matcher lists, and matchers and URLs change.
      - A handler added or moved outside the matcher quietly loses the check, and nothing fails.
      - A check next to the data, inside the handler, can't be skipped that way.
    modelAnswer: >-
      The proxy only runs where its matcher says. Someone moves the delete handler to
      `/api/stock`, or narrows the matcher, and that handler loses its check without any
      error. The proxy is a good first filter. The check that counts sits where the data
      changes, inside the handler itself.

recap:
  - Answer another program with a `route.ts` file and one function per HTTP method.
  - Catch bad JSON and missing fields, and answer `400` instead of crashing with `500`.
  - Use `proxy.ts` as a first filter with a tight matcher, never as the only check.

recall:
  - id: card-handler-shape
    concept: nextserver.route-handlers
    front: What does a `route.ts` file export, and what does each export return?
    back: >-
      Functions named after HTTP methods, such as `GET` and `POST`. Each gets the `Request`
      and returns a `Response`.
  - id: card-missing-method
    concept: nextserver.route-handlers
    front: What does Next.js answer for a method that `route.ts` doesn't export?
    back: >-
      `405 Method Not Allowed`. The path exists, but not for that method.
  - id: card-bad-json
    concept: nextserver.handler-errors
    front: Why wrap `await request.json()` in `try` and `catch`?
    back: >-
      It throws on a body that isn't JSON. Uncaught, that's a `500`. Caught, you answer `400`,
      which tells the caller the mistake is theirs.
  - id: card-proxy-role
    concept: nextserver.proxy
    front: Where does `proxy.ts` run, and what can it do?
    back: >-
      Before any page or handler, on the paths its matcher lists. It can redirect, rewrite, add
      headers or answer the request itself.

