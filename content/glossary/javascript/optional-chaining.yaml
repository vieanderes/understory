term: optional chaining
aka: [?., optional chaining operator, safe navigation]
short: Reading a property in a way that stops and gives `undefined` if the value before it is missing.
explain: |
  `user.address.city` crashes if `address` is missing. `user.address?.city` gives
  `undefined` instead. It works on calls too: `onDone?.()` calls the function only if
  there is one.

  It hides missing data, so use it where missing is normal, not to silence a bug. It pairs
  with `??` for a fallback: `user.address?.city ?? 'Unknown'`.
analogy: Knocking before opening a door. If nobody's home, you leave instead of walking into an empty room.
example:
  language: ts
  code: |
    const city = order.customer?.address?.city ?? 'Unknown';
    onChange?.(value);
usage: Use optional chaining on `settings.theme`, because new accounts don't have settings yet.
related: [nullish-coalescing, falsy, narrowing]
level: 1
lessons: [pro.modern-javascript]
