id: react.performance
title: Performance
objective: "Measure a slow render, then fix it with `useMemo`, `memo` or a transition, and know what the React Compiler does."
level: advanced
minutes: 10
concepts: [react.use-memo, react.use-callback, react.transitions, react.compiler]
prerequisites: [react.hooks-and-refs]
opening:
  text: >-
    You'll stop a slow search re-running on every click, and keep a page usable while the next
    part loads. You'll also know when a compiler can do this for you.

steps:
  - type: prose
    id: measure-first
    body: >-
      Most renders are cheap. React calls a few functions, compares, and changes almost
      nothing on the page. So don't guess: measure.


      **React DevTools** is a browser extension for inspecting React apps. Its **Profiler**
      records a few clicks, then shows which components rendered and how long each took. Fix
      what it shows is slow, and leave the rest alone.

  - type: prose
    id: what-memoising-is
    body: >-
      Keeping a result so you don't work it out again is **memoising**.


      `useMemo(() => rank(items), [items])` keeps a result between renders. React works it out
      again only when a listed value has changed. It compares the way `===` does, so a new
      array with the same items counts as a change.

  - type: ai-review
    id: review-missing-memo-dep
    concept: react.use-memo
    difficulty: 2
    language: tsx
    request: The film search feels slow. Speed it up.
    flawClass: logic
    code: |
      function FilmSearch({ films }: { films: Film[] }) {
        const [query, setQuery] = useState('');
        const results = useMemo(
          () => films.filter((film) => film.title.includes(query)),
          [films],
        );
        return (
          <div>
            <input value={query} onChange={(e) => setQuery(e.target.value)} />
            <p>{results.length} films</p>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. The page loads, and its test passes. Then you type `dune`, and
      the list never changes. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`query` is missing from the dependency list'
        correct: true
        feedback: >-
          Yes. The filter reads `query`, so list it: `[films, query]`.
      - text: '`useMemo` can''t keep an array'
        feedback: >-
          It keeps any value. It never works this one out again, because `films` never
          changes.
      - text: The filter belongs in an effect
        feedback: >-
          An effect would add a second render. The kept result only needs the right
          dependencies.
    fix: |
      function FilmSearch({ films }: { films: Film[] }) {
        const [query, setQuery] = useState('');
        const results = useMemo(
          () => films.filter((film) => film.title.includes(query)),
          [films, query],
        );
        return (
          <div>
            <input value={query} onChange={(e) => setQuery(e.target.value)} />
            <p>{results.length} films</p>
          </div>
        );
      }

  - type: code-challenge
    id: build-fast-search
    concept: react.use-memo
    difficulty: 4
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A shop's product search feels sluggish. The Profiler shows `rank`, a slow function
      passed in as a prop, running on every click of Dark mode. It's already inside
      `useMemo`, so something defeats the cache.


      Make `rank` run once on the first render, never for Dark mode, and again each time the
      search text changes. The tests count the calls.
    hints:
      - Look at each value in the dependency list, and ask whether it's the same object next render.
      - '`filters` is built fresh on every render, so the list always looks changed.'
      - Build the filters object inside the calculation, and list `query` instead.

  - type: prose
    id: what-memo-skips
    body: >-
      **`memo(Row)`** wraps a component so it skips rendering when every prop equals last
      time's.


      The catch: an arrow written in JSX, like `onPick={(name) => setPicked(name)}`, is a new
      function on every render. It never equals last time's. **`useCallback(fn, [])`** keeps
      one function between renders, until a listed value changes.


      The **React Compiler**, a build tool, can add all of this for you.

  - type: bug-hunt
    id: hunt-inline-arrow
    concept: react.use-callback
    difficulty: 3
    language: tsx
    code: |
      const Row = memo(function Row({ name, onPick }) {
        return <li onClick={() => onPick(name)}>{name}</li>;
      });

      function Menu({ drinks }) {
        const [picked, setPicked] = useState('');
        return (
          <div>
            <p>Picked: {picked}</p>
            <ul>
              {drinks.map((d) => <Row key={d} name={d} onPick={(name) => setPicked(name)} />)}
            </ul>
          </div>
        );
      }
    prompt: >-
      The Profiler shows every `Row` rendering on each pick, even with `memo`. Tap the line at
      fault.
    lines: [11]
    reasons:
      - text: '`onPick` gets a new arrow on every render'
        correct: true
        feedback: >-
          Right. `memo` sees a changed prop. `useCallback` keeps one function.
      - text: '`key` makes every row render again'
        feedback: >-
          Keys match rows between renders. They don't make a row render.
      - text: '`memo` needs the `picked` prop too'
        feedback: >-
          Passing `picked` would make every row render on purpose. Rows only need `name` and
          `onPick`.
    fix: |
      const Row = memo(function Row({ name, onPick }) {
        return <li onClick={() => onPick(name)}>{name}</li>;
      });

      function Menu({ drinks }) {
        const [picked, setPicked] = useState('');
        const pick = useCallback((name) => setPicked(name), []);
        return (
          <div>
            <p>Picked: {picked}</p>
            <ul>{drinks.map((d) => <Row key={d} name={d} onPick={pick} />)}</ul>
          </div>
        );
      }

  - type: prose
    id: transitions-and-suspense
    body: >-
      Some updates can wait. `const [isPending, startTransition] = useTransition()` gives you
      two things. **`startTransition`** marks an update as not urgent, and `isPending` says
      it's on its way. Meanwhile the current screen stays up and usable.


      **Suspense** shows a `fallback` while something inside is still loading. For example,
      `lazy(() => import('./Reports.js'))` makes a component whose code downloads only when
      it's first shown. `import()` loads a module later, on request.

  - type: predict-output
    id: predict-tab-transition
    concept: react.transitions
    difficulty: 3
    language: tsx
    code: |
      const Reports = lazy(() => import('./Reports.js'));

      function App() {
        const [tab, setTab] = useState('home');
        const [isPending, startTransition] = useTransition();
        return (
          <Suspense fallback={<p>Loading</p>}>
            <button onClick={() => startTransition(() => setTab('reports'))}>
              {isPending ? 'Opening' : 'Open reports'}
            </button>
            {tab === 'home' ? <p>Home</p> : <Reports />}
          </Suspense>
        );
      }
    question: You click the button. While `Reports` downloads, what's on screen?
    choices:
      - text: Home, with the button saying Opening
        correct: true
        feedback: >-
          Right. The transition keeps what's there and shows it's pending.
      - text: Loading, in place of everything
        feedback: >-
          That's what a plain `setTab` does. React hides the old content and shows the fallback.
      - text: A blank page until it arrives
        feedback: >-
          React never shows nothing here. It either keeps the old screen or shows the fallback.

  - type: multiple-choice
    id: pick-compiler-job
    concept: react.compiler
    difficulty: 3
    question: You turn on the React Compiler. What changes in your components?
    choices:
      - text: It adds memoisation for you, at build time
        correct: true
        feedback: >-
          Yes. It keeps values, handlers and elements, much like `useMemo` and `memo` by hand.
      - text: It fixes code that breaks the rules of React
        feedback: >-
          It can't. When code might break the rules, it leaves that code as it was.
      - text: It stops components rendering at all
        feedback: >-
          Components still render when their state or props change. The compiler skips the
          needless renders.
      - text: It makes every update a transition
        feedback: >-
          Transitions are your choice, with `startTransition`. The compiler only adds
          memoisation.

  - type: explain-back
    id: explain-transition-keeps-screen
    concept: react.transitions
    difficulty: 4
    prompt: |-
      ```jsx
      <Suspense fallback={<p>Loading</p>}>
        <button onClick={() => startTransition(() => setTab('reports'))}>
          Open reports
        </button>
        {tab === 'home' ? <p>Home</p> : <Reports />}
      </Suspense>
      ```

      `Reports` is still downloading. Why does wrapping `setTab` in `startTransition` keep Home on
      screen, instead of showing Loading?
    rubric:
      - A transition marks the update as not urgent, so React renders it in the background.
      - While the new tab is still loading, React keeps showing the screen it already committed.
      - Without a transition the update is urgent, so React must commit, and shows the fallback.
    modelAnswer: >-
      A plain `setTab` is urgent. React has to show the new state now, and the new tab isn't
      ready. So the nearest Suspense shows its fallback. `startTransition` says the update can
      wait. React renders it in the background, and while `Reports` is still loading it keeps
      Home on screen. `isPending` is true meanwhile, so the button can say Opening.

recap:
  - Measure with the Profiler before you optimise, since most renders are cheap.
  - Keep a slow result with `useMemo`, and keep its dependencies stable.
  - Skip a child's render with `memo` and `useCallback`, and keep a screen usable with a transition.

recall:
  - id: card-memo-compare
    concept: react.use-memo
    front: How does `useMemo` decide whether to work the value out again?
    back: >-
      It compares each dependency with last render's. Any difference, including a new object
      with the same contents, runs it again.
  - id: card-inline-arrow
    concept: react.use-callback
    front: Why does an inline arrow prop undo `memo` on a child?
    back: >-
      Each render makes a new function, so the prop never equals last time's. `useCallback`
      keeps one function.
  - id: card-transition-fallback
    concept: react.transitions
    front: What does a transition change when the next screen is still loading?
    back: >-
      React keeps the current screen, with `isPending` true, instead of showing the Suspense
      fallback.
  - id: card-compiler
    concept: react.compiler
    front: What does the React Compiler do, and when does it leave code alone?
    back: >-
      It adds memoisation at build time. It skips code that might break the rules of React.

