summary: >-
  Grid lays boxes out in rows and columns at the same time. You define the columns, and
  often the rows, on the parent, the **grid container**, and its children, the **grid
  items**, drop into the cells. A column or a row is called a **track**, the lines between
  tracks are **grid lines**, and a rectangle of cells can be named as an **area**.


  The difference from flexbox is who is in charge. In flexbox, the items' sizes push the
  layout around, and each row shares its own space. In grid, the container sets the tracks
  and the items follow, so everything lines up in both directions. That's what a card
  gallery, a dashboard or a whole page layout needs.


  Two tools make grid responsive with a single line. The `fr` unit shares out whatever space
  is left, and `repeat(auto-fit, minmax(200px, 1fr))` lets the grid decide how many columns
  fit. Items you don't place yourself are placed for you by **auto-placement**, which is
  predictable once you know its rules.
remember:
  - Grid sets rows and columns on the container, and the items fill its cells, so content lines up in both directions.
  - An `fr` shares the space left after fixed tracks, content-sized tracks and gaps are taken out.
  - '`repeat(auto-fit, minmax(200px, 1fr))` makes as many columns as fit, and `auto-fit` collapses empty ones while `auto-fill` keeps them.'
  - The tracks you list form the explicit grid, and tracks the grid adds for extra items are implicit, sized by `grid-auto-rows` and `grid-auto-columns`.
  - Auto-placement fills cells row by row and never goes back, so a wide item can leave a hole; `grid-auto-flow` of `dense` fills it.
  - Every row of `grid-template-areas` needs the same number of cells and every area must be a rectangle, or the whole declaration is ignored.
  - Line numbers such as `-1` count only the explicit grid, not the tracks the grid adds.
  - Grid changes where items appear, never the order keyboards and screen readers follow, which is the HTML order.
sections:
  - title: How fr is worked out
    body: |-
      The browser sizes tracks in a fixed order. Fixed tracks, such as `200px`, get their
      size first. Gaps are taken out next. Whatever is left is the free space, and the `fr`
      tracks share it in proportion to their numbers.

      ```css
      .forecast {
        display: grid;
        width: 620px;
        grid-template-columns: 200px 1fr 2fr;
        gap: 10px;
      }
      /* 620 - 200 - 10 - 10 = 400px free
         1fr + 2fr = 3 shares of 133.33px
         -> 200px, 133.33px, 266.67px */
      ```

      Percentages don't work that way. A percentage is a share of the whole container, and
      gaps come on top. So `grid-template-columns: 50% 50%` with a 20px gap needs 420px of a
      400px container, and the second column sticks out by 20px. `1fr 1fr` fits, because the
      gap comes out first. This is the main reason to prefer `fr` over percentages in grid.

      An `fr` track has a floor, as the deep dive explains: `1fr` never goes below its
      content's smallest size, so one long word or a wide image can widen its column. Write
      `minmax(0, 1fr)` when columns must stay equal whatever their content.

      You can check any track size from JavaScript. `getComputedStyle` on a grid container
      reports the tracks as pixel values:

      ```js
      const grid = document.querySelector('.forecast');
      console.log(getComputedStyle(grid).gridTemplateColumns);
      // 200px 133.328px 266.672px
      ```

      The tiny rounding, .328 instead of .333, comes from the browser measuring in fractions of
      a pixel. The same list appears in the developer tools, where a grid badge also draws the
      lines over the page.
  - title: auto-fill and auto-fit, measured
    body: |-
      Take a 1000px grid with `gap: 16px` and columns of `minmax(200px, 1fr)`.

      First the browser counts how many columns fit at their minimum. Each column needs 200px
      plus a 16px gap, and the last needs no gap after it. Four fit: 4 × 200 + 3 × 16 = 848px.
      Five would need 1064px.

      Then it sizes them. With `auto-fill`, there are four columns whatever the number of
      items. They share the width: (1000 − 48) ÷ 4 = **238px** each.

      With `auto-fit` and only three items, the fourth track is empty, so it collapses to
      0px, and the gap next to it goes too. The three real columns share the width:
      (1000 − 32) ÷ 3 = about **322.67px** each.

      ```css
      .gallery {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      ```

      With nine items, every track has something in it, so both keywords give the same four
      238px columns. The difference only shows when there are fewer items than columns.

      One edge case bites on small phones. The minimum is a hard 200px, so in a container
      narrower than that, the single column overflows. The fix picks the smaller of 200px and
      the container's width, with `min()`, a function that returns its smallest argument:

      ```css
      grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
      /* in a 150px container: one column of 150px instead of 200px */
      ```
  - title: The auto-placement algorithm
    body: |-
      The tracks you write in `grid-template-columns` and `grid-template-rows` form the
      **explicit grid**. When there are more items than cells, the grid adds tracks, which
      form the **implicit grid**. New rows are sized by `grid-auto-rows`.

      Auto-placement then runs in two passes:

      1. Items that you placed yourself, with `grid-area`, `grid-row` or `grid-column` line
         numbers, go in first.
      2. Every other item goes, in HTML order, into the next cell where it fits. The search
         moves along the row, then down to the next row, and it **never goes back**.

      That last rule creates holes. Here the third item is two columns wide:

      ```html
      <style>
        .board { display: grid; grid-template-columns: repeat(3, 100px); }
        .wide { grid-column: span 2; }
      </style>
      <div class="board">
        <div>1</div>
        <div>2</div>
        <div class="wide">3</div>
        <div>4</div>
      </div>
      <!-- row 1: 1, 2, empty cell
           row 2: 3 (two columns), 4 -->
      ```

      Item 3 doesn't fit in the one cell left in row 1, so it moves to row 2. Item 4 follows
      it, and the hole stays. With `grid-auto-flow: dense`, the search starts from the top
      each time, so item 4 fills the hole in row 1, and the visual order becomes 1, 2, 4, 3.

      `grid-auto-flow: column` turns the search sideways: items fill the first column top to
      bottom, then start a new column. New columns are sized by `grid-auto-columns`.
  - title: The rules of named areas
    body: |-
      `grid-template-areas` draws the layout as text. Each string is one row, and each name
      is one cell. The browser is strict about the drawing:

      - Every row must have the **same number of cells**.
      - Each named area must form a **rectangle**. An L-shape isn't allowed.
      - A full stop, `.`, marks an empty cell.

      Break a rule, and the whole declaration is invalid and ignored. The computed value is
      `none`, and all the items fall back to auto-placement:

      ```css
      .page { grid-template-areas: "top top" "top side"; }   /* L-shape: ignored */
      .page { grid-template-areas: "top top" "side"; }       /* 2 cells then 1: ignored */
      .page { grid-template-areas: "top ." "side main"; }    /* valid, one empty cell */
      ```

      The areas also create the tracks. A drawing two cells wide makes two columns even with
      no `grid-template-columns`. Each is an `auto` track: sized from its content, then
      stretched to share any spare width.

      Watch the spelling of names. An item with `grid-area: sidbar`, for an area called
      `sidebar`, doesn't match anything. It isn't ignored: the grid adds new implicit tracks
      for it, and it lands in an odd spot outside the layout you drew. When one item ends up
      somewhere strange, check its name against the drawing first.

      Areas are a strong tool for page layouts, because you can redraw the same HTML in a
      different shape for a phone. Remember that only the picture changes. Reading and tab
      order still follow the HTML, so keep the HTML in a sensible order.
pitfalls:
  - '**Percentage columns with a gap.** `50% 50%` plus a gap is wider than the container, because the gap comes on top. Use `1fr 1fr`, which takes the gap out first.'
  - '**A card grid that overflows a small phone.** `minmax(200px, 1fr)` never goes below 200px. Use `minmax(min(200px, 100%), 1fr)` so one column can shrink to the screen.'
  - '**An L-shaped or uneven area drawing.** One broken row makes the whole `grid-template-areas` invalid, and every item falls back to auto-placement. Count the cells in each row.'
  - '**Expecting `grid-column: 1 / -1` to span added columns.** `-1` is the last line of the explicit grid. If the columns come from auto-placement, there''s no explicit line to reach.'
  - '**Using `dense` for a list of links or cards people tab through.** It fills holes by moving items out of HTML order, so focus jumps around the screen. Keep `dense` for purely visual galleries.'
verify:
  - lens: breaks
    check: 'Track minimums such as `minmax(200px, 1fr)` are no wider than the narrowest phone, or the grid overflows sideways.'
  - lens: confuses
    check: 'Named areas or line numbers match what the layout shows, so the next person can find where each part sits.'
  - lens: breaks
    check: 'Items placed visually out of order keep a sensible source order, because keyboard and screen reader users follow the HTML.'
  - lens: tests
    check: 'The grid is checked at 390, 768 and 1440 pixels with real content, including one item much longer than the rest.'
interview:
  - question: When would you use grid rather than flexbox?
    answer: >-
      I use grid when items must line up in two directions, and flexbox for one row or
      column. In a flex layout each line shares out its own space, so wrapped cards don't
      form columns and a short last row stretches. In grid, the container defines the
      tracks and every item snaps to them, so a gallery or a page with header, sidebar and
      main lines up exactly. Flexbox wins when the content should decide the sizes: a nav bar,
      a toolbar, a button beside a field. They combine well: a grid for the page and the card
      gallery, and flexbox inside each card for its footer row.
  - question: What's the difference between auto-fill and auto-fit?
    answer: >-
      Both create as many tracks as fit the container, and they differ only when there are
      fewer items than tracks. `auto-fill` keeps the empty tracks, so the items keep their
      column width and space is left at the end. `auto-fit` collapses empty tracks to zero,
      with their gaps, so the existing items stretch to fill the row. In a 1000px grid with
      `minmax(200px, 1fr)` and a 16px gap, four columns fit. With three items, `auto-fill`
      gives three columns of 238px and an empty fourth, while `auto-fit` gives three of about
      323px. I pick `auto-fill` when cards should stay the same size as more arrive, and
      `auto-fit` when a few items should fill the row.
  - question: "How is `grid-template-columns: 200px 1fr 2fr` sized in a 620px container with a 10px gap?"
    answer: >-
      The first column is 200px, and the others are about 133px and 267px. Fixed tracks are
      sized first, then gaps are removed, and `fr` tracks share what's left in proportion.
      So 620 minus 200 minus two 10px gaps leaves 400px. There are three shares in total,
      1 plus 2, so one share is about 133.33px. The second column gets one share and the
      third two. The detail worth adding is that `1fr` means `minmax(auto, 1fr)`, so a track
      never shrinks below its content's minimum size; if a long word or image is wider than
      its share, that column grows and the others shrink. `minmax(0, 1fr)` prevents that.
