summary: >-
  Incident response is the agreed, practised way a team handles a security problem that is
  happening now: a leaked key being used, an account taken over, data leaving the building.
  The work runs in a known order. Prepare before anything happens, detect and analyse, contain
  the damage, remove the cause, recover safely, then review and improve.


  The problem it solves is panic. Under pressure, people skip containment to hunt for the
  cause, delete the logs that would have shown the scope, rotate one key and miss the three
  others the attacker created, and forget that a regulator has a deadline. A plan written in
  calm conditions, with roles, contacts and pre-approved actions, removes those decisions from
  the worst hour of the year.


  The lesson teaches the phases, why containment comes first and why reviews are blameless.
  These notes add where the phase models come from and how NIST's 2025 revision changed them,
  how a response is run, how to scope an incident and keep evidence, how to rotate credentials
  so the attacker is really out, and the GDPR 72-hour notification rule. Not every bug is an
  incident: a vulnerability nobody has exploited goes through normal fixing, unless there are
  signs it was used.
remember:
  - Contain first, then eradicate, then recover, because the damage grows while you investigate and a fix to the code doesn't stop a stolen key.
  - A leaked credential is revoked at its issuer, since deleting it from code or Git history doesn't disable the copies already taken.
  - Scope before you declare it over, because attackers create persistence such as new keys, accounts, OAuth grants and webhooks, and each needs removing.
  - 'Preserve evidence before you rebuild: snapshot disks and memory, export logs, and record a hash of each file.'
  - Under GDPR, a controller notifies its supervisory authority of a personal data breach without undue delay and, where feasible, within 72 hours of becoming aware of it, unless it is unlikely to risk people's rights and freedoms.
  - NIST SP 800-61 Revision 2 (2012) gave the four-phase lifecycle, and Revision 3 (April 2025) replaced it with a mapping onto the CSF 2.0 Functions.
  - A response has named roles, above all one incident commander who coordinates and doesn't debug.
  - A post-mortem produces a timeline, contributing causes and actions with owners and dates, and never a person to blame.
sections:
  - title: Where the phases come from, and what NIST changed in 2025
    body: |-
      Three models are in common use, and interviewers mix them up.

      The six phases in the lesson follow the SANS model, often shortened to PICERL:
      preparation, identification, containment, eradication, recovery and lessons learned.

      **NIST SP 800-61 Revision 2** (2012) grouped the same work into four phases:
      preparation; detection and analysis; containment, eradication and recovery; and
      post-incident activity. It drew the middle phases as a loop, because containing an
      incident often reveals more of it and sends you back to analysis. Its advice on choosing
      a containment strategy still holds: weigh the potential damage, the need to keep
      evidence, the service's availability, the time and resources needed, and how long the
      measure must last.

      **NIST SP 800-61 Revision 3**, published in April 2025, withdrew Revision 2. It is a
      Community Profile of the Cybersecurity Framework 2.0 and maps incident response onto its
      six Functions. Govern, Identify and Protect carry the preparation work: policy, roles,
      asset knowledge and safeguards. Detect, Respond and Recover carry the response itself.
      Lessons learned are not a final phase. They run through every Function by way of the
      Improvement category, so what you learn changes preparation as well as response.

      The substance barely moved. What changed is the framing: incident response is part of
      an organisation's whole risk management, not a separate playbook owned by the security
      team. In an interview, name the revision you mean. "NIST's four phases" is Revision 2;
      the current guidance is Revision 3 and the CSF Functions.
  - title: Running the response
    body: |-
      A response goes wrong most often through coordination, not technical skill. Five
      practices prevent that.

      **One incident commander.** They coordinate, decide and delegate, and they don't debug.
      Others take named roles: a technical lead, a communications lead who handles customers
      and executives, and a scribe who keeps the timeline. On a small team one person may
      hold two roles, but never commander and hands-on fixer at once.

      **A severity scale agreed in advance.** For example, severity 1 means customer data
      exposed or money moving, and pages the commander and legal at once; severity 3 means
      a suspicious signal with no confirmed impact. Severity sets who is woken and how
      often updates go out.

      **An out-of-band channel.** If the attacker may be inside your email or chat, don't
      discuss the response there. Keep a fallback channel and a phone list that don't depend
      on the systems under attack.

      **A timeline in UTC, written as you go.** Every action and finding gets a time and an
      author: "09:15 revoked key k-mail-7 at provider". It feeds the post-mortem, any
      regulator's questions, and any later legal case. Memory rewrites itself within hours.

      **Pre-approved actions.** The on-call engineer may revoke a key, lock an account or
      block an address without waiting for sign-off. Containment that needs a meeting isn't
      containment.

      Preparation is where these come from: runbooks for your likely incidents, contact lists
      for providers and your legal team, logging that already exists, and tabletop exercises
      where the team walks through a scenario on paper before a real one arrives.
  - title: Scoping the incident and keeping the evidence
    body: |-
      Before you can say it's over, you need to know everything the attacker touched. Logs
      answer that, which is why the lesson insists on keeping them. A useful habit is to
      follow the credential, not only the obvious action, because attackers create ways back
      in:

      ```js
      const lines = [
        '{"at":"2026-09-22T18:02:11Z","event":"key_used","keyId":"k-mail-7","action":"send","to":"a@example.com"}',
        '{"at":"2026-09-22T18:05:40Z","event":"key_used","keyId":"k-mail-9","action":"send","to":"b@example.com"}',
        '{"at":"2026-09-23T02:14:03Z","event":"key_used","keyId":"k-mail-7","action":"create_key","newKeyId":"k-mail-12"}',
        '{"at":"2026-09-23T03:30:00Z","event":"key_used","keyId":"k-mail-7","action":"send","to":"c@example.com"}',
        '{"at":"2026-09-23T04:00:00Z","event":"key_used","keyId":"k-mail-12","action":"send","to":"d@example.com"}',
      ];

      // Everything the leaked key did, including keys it created, which also need revoking.
      function scope(lines, leakedKeyId) {
        const suspect = new Set([leakedKeyId]);
        const actions = {};
        const recipients = new Set();
        for (const line of lines) {
          const e = JSON.parse(line);
          if (!suspect.has(e.keyId)) continue;
          actions[e.action] = (actions[e.action] ?? 0) + 1;
          if (e.to) recipients.add(e.to);
          if (e.newKeyId) suspect.add(e.newKeyId);
        }
        return { keysToRevoke: [...suspect], actions, recipients: [...recipients] };
      }

      console.log(scope(lines, 'k-mail-7'));
      ```

      It reports two keys to revoke, `k-mail-7` and `k-mail-12`, and three recipients.
      Revoking only the leaked key would have left the attacker sending through the one they
      made. Lines are in time order, so a key is marked suspect before its first use.

      Evidence goes before cleanup. Rebuilding a server destroys what was in its memory and on
      its disk. RFC 3227 advises collecting the most volatile evidence first: memory before
      disk, disk before archived logs. In the cloud, snapshot the volume and export the logs
      to a separate, locked account. Then record what you collected, when and by whom, with a
      hash of each file:

      ```js
      import { createHash } from 'node:crypto';
      import { readFile, readdir, writeFile } from 'node:fs/promises';
      import path from 'node:path';

      // Hash every collected file, so anyone can later prove it hasn't changed.
      async function writeManifest(dir, collector) {
        const files = (await readdir(dir)).filter((name) => name !== 'MANIFEST.json').sort();
        const entries = [];
        for (const name of files) {
          const bytes = await readFile(path.join(dir, name));
          entries.push({ name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
        }
        const manifest = { collectedAt: new Date().toISOString(), collector, entries };
        await writeFile(path.join(dir, 'MANIFEST.json'), JSON.stringify(manifest, null, 2));
        return manifest;
      }

      console.log(await writeManifest('evidence', 'on-call engineer'));
      ```

      This is the start of a **chain of custody**: a record showing the evidence is what was
      collected, unchanged since.
  - title: Containment, eradication and credential rotation
    body: |-
      Containment has a short-term and a long-term form. Short-term stops the bleeding now:
      revoke the key, lock the account, isolate the server from the network rather than
      powering it off, which would lose its memory. Long-term keeps the service running while
      you prepare the real fix: a patched replacement behind the load balancer, a temporary
      block on the vulnerable route.

      Containment can cost availability, and that's often the right trade. A leaked key that
      is sending spam gets revoked now, even if your own emails stop for an hour. A key you
      merely suspect, with no sign of use, can be rotated with overlap: create the new key,
      deploy it, then revoke the old one.

      **Rotate by reach, not by headline.** Ask what the attacker could read, not only what
      you know they took. A compromised server means every secret in its environment
      variables and config is burned: database passwords, API keys, signing keys. A stolen
      admin session means every credential that admin could view.

      Sessions need their own step. In many apps, changing a password doesn't end sessions
      that already exist. Revoke the account's sessions and refresh tokens. Self-contained tokens such as
      JWTs stay valid until they expire, so if their signing key leaked, rotate it, which
      signs everyone out, and keep access tokens short-lived so the window is small.

      **Eradication** removes the cause and every foothold. Close the hole the attacker used,
      for every account, not only the one reported. Remove the persistence found in scoping:
      extra keys, new admin users, OAuth grants, SSH keys, webhooks pointing somewhere odd,
      scheduled jobs. For a key pushed to a public repository, rewriting Git history is
      tidy-up, not a fix: forks, clones and caches already hold it.

      **Recovery** returns the service from known-good state: rebuilt images, not a cleaned
      machine, and backups from before the intrusion began. Watch closely afterwards. An
      attacker who kept one foothold usually comes back within days.
  - title: Telling people, and the GDPR 72-hour rule
    body: |-
      If personal data was exposed, the law may set your timetable. Under GDPR Article 33, a
      **controller** notifies its supervisory authority of a personal data breach without
      undue delay and, where feasible, within 72 hours of becoming aware of it. The exception
      is a breach unlikely to result in a risk to people's rights and freedoms. A late
      notification must give the reasons for the delay. UK GDPR has the same rule, with the
      ICO as the authority.

      Five details come up in practice.

      - The clock starts at **awareness**: a reasonable degree of certainty that a breach
        affecting personal data happened, not when the investigation ends.
      - You can notify in phases. Send what you know within 72 hours and add detail as the
        investigation finds it.
      - A **processor**, such as a hosting or email provider acting for you, must tell the
        controller without undue delay. Your contracts should say how fast.
      - Article 34 adds telling the affected people themselves, without undue delay, when the
        breach is likely to result in a high risk to them. Data encrypted with a key the
        attacker doesn't have can remove that duty.
      - Article 33(5) says to document every breach, including the ones you decide not to
        report, with the facts, effects and remedial action.

      Other duties can apply on top. Organisations in scope of the EU's NIS2 directive send an
      early warning to their national CSIRT or competent authority within 24 hours of a
      significant incident. Customer contracts often promise notice within a set time. Put legal and the data protection
      officer on the contact list during preparation, not on the day.

      Communication with customers follows the same discipline as the timeline: say what
      happened, what data was involved, what you've done and what they should do, such as
      changing a reused password. Don't guess at facts you haven't confirmed.
  - title: A post-mortem that changes something
    body: |-
      A post-mortem that ends with "be more careful" has failed. A good one has a fixed shape:
      a summary with impact in numbers, a timeline from the first sign to the all-clear, the
      contributing causes, what went well, where you got lucky, and actions, each with an
      owner and a due date.

      "Contributing causes", plural, is deliberate. Incidents rarely have one root cause.
      The leaked key needed a key in a file, no secret scanning on commits, a provider key
      with more permission than the service needed, and no alert on unusual sending volume.
      Each is a place to add a layer. Asking "why" repeatedly helps, as long as every answer
      points at a condition, not at a person.

      Blameless doesn't mean nobody is accountable. People are accountable for the actions
      they take on, and for raising problems honestly. What blameless removes is punishment
      for an honest mistake, because punishment teaches people to hide the next one, and the
      incident you never hear about is the one that grows.

      Track the actions like any other work, and review them. A team whose post-mortem
      actions never close will have the same incident again, with a different name on it.
pitfalls:
  - '**Hunting for the cause before containing.** Investigation feels productive while the key keeps working. Revoke, lock or isolate first, then investigate.'
  - '**Rotating only the credential you know leaked.** The attacker may have created keys, users or grants, and a compromised host burns every secret on it. Scope first, then rotate everything within reach.'
  - '**Wiping a compromised server straight away.** Rebuilding destroys memory, disk and local logs. Isolate it, snapshot and export first, then rebuild from a known-good image.'
  - '**Coordinating the response in a channel the attacker can read.** If email or chat is compromised, the attacker watches you. Keep an out-of-band channel ready during preparation.'
  - '**Waiting for the full picture before notifying the regulator.** The GDPR clock runs from awareness, not from the end of the investigation. Notify within 72 hours with what you know, and add the rest in phases.'
  - '**Post-mortem actions without owners.** Everyone agrees, nobody does it, and the incident repeats. Give each action one owner and a date, and track it.'
verify:
  - lens: breaks
    check: The runbook revokes a leaked credential at its issuer first, because fixing the code doesn't stop a copy already taken.
  - lens: breaks
    check: Logs are exported and kept before any rebuild or clean-up, because clearing them destroys how the attacker got in.
  - lens: breaks
    check: Before closing, someone checks for the new keys, accounts, OAuth grants and webhooks an attacker adds to keep a way back in.
  - lens: leaks
    check: The runbook names who decides on telling customers and the regulator, since a personal data breach usually has a 72-hour clock.
  - lens: confuses
    check: One named incident commander coordinates and posts updates, so nobody is debugging and briefing at once.
  - lens: tests
    check: The runbook is rehearsed in a drill, such as revoking a test key, so each step is known to work.
interview:
  - question: You find one of your cloud access keys in a public GitHub repository. Walk me through what you do.
    answer: >-
      Revoke the key first, then scope, then clean up. Deactivating it at the provider makes
      every copy useless, which deleting the commit doesn't, because forks and scrapers
      already have it. I'd accept the brief outage if production depends on it, and deploy a
      new key from the secrets manager. Then I'd scope with the provider's audit logs: every
      call that key made since the push, especially new users, keys, roles or resources,
      because attackers leave ways back in. Each of those gets removed. I'd check billing for
      unexpected compute, export the logs for evidence, and notify under GDPR if personal
      data was reachable. Finally, a blameless review: why a key could reach a repository,
      with push protection and secret scanning as the likely fix.
  - question: What's the difference between containment and eradication, and why does the order matter?
    answer: >-
      Containment stops the damage growing; eradication removes the cause and every foothold.
      Revoking a leaked key or locking a hijacked account is containment. Fixing the bug they
      used, removing the key from code and deleting the backdoor admin user they created is
      eradication. Containment comes first because the damage grows every minute the
      attacker has access, and eradication takes time: you have to understand the entry
      point and scope the persistence. The trade-off is evidence and visibility. Containing
      too bluntly, such as wiping a server, destroys what you need to understand the attack,
      so you isolate and snapshot rather than rebuild. In rare cases teams delay containment
      to watch an attacker, but that risks more damage and needs a deliberate decision.
  - question: A breach exposed customer names and email addresses. What are your obligations under GDPR?
    answer: >-
      Notify the supervisory authority without undue delay and, where feasible, within 72
      hours of becoming aware, unless the breach is unlikely to risk people's rights and
      freedoms. Names and emails enable targeted phishing, so I'd assume the risk test is met
      and notify. The clock starts when we're reasonably certain personal data was affected,
      not when the investigation ends, so we send what we know and add detail in phases. If
      the risk to people is high, Article 34 requires telling them directly too, with advice
      such as watching for phishing. We document the breach either way, as Article 33(5)
      requires. If a processor had the breach, they must tell us without undue delay.
      Legal and the DPO decide the final call.
  - question: How do you run a blameless post-mortem, and doesn't blameless mean nobody is accountable?
    answer: >-
      A blameless post-mortem looks for the conditions that let a mistake cause harm, not
      for the person who made it. I'd write a timeline from the logs and the incident
      channel, then list contributing causes, such as keys stored in files, no secret
      scanning and an over-permissioned key, and turn each into an action with an owner and a
      date. A good test is to replace every name with "someone": the lessons should read the
      same. Accountability stays, and moves to the right place: owning actions and reporting
      honestly. What goes is punishment for honest error, because people who fear blame hide
      incidents, and hidden incidents grow. The limit is deliberate misconduct, which is a
      separate process, not a post-mortem.
