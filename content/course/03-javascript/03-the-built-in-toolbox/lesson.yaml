id: js.built-in-toolbox
title: The built-in toolbox
objective: Use the string, number, object, Set, Map and JSON helpers that everyday code relies on.
level: essential
minutes: 10
concepts: [js.string-methods, js.numbers-and-math, js.object-and-set-helpers, js.json]
prerequisites: [js.coercion]
opening:
  text: >-
    You'll tidy text, read numbers out of it and save data as text, with tools the language
    already has. Most everyday code is built from these few dozen helpers.

steps:
  - type: prose
    id: name-string-methods
    body: >-
      Text comes with built-in tools called **string methods**, called with a dot:
      `name.trim()` drops the spaces at both ends. `toLowerCase()` and `toUpperCase()` change
      the case. `includes` and `endsWith` answer true or false.


      `slice(0, 3)` cuts out the first three characters. `split(" ")` breaks text into an
      array of words, and `join(", ")` glues an array back into text. `padStart(7)` pads text
      to 7 characters. None change the original.

  - type: playground
    id: accept-any-case
    concept: js.string-methods
    difficulty: 1
    prompt: >-
      `Report.PDF` is a PDF, but the page refuses it. `endsWith` compares letters exactly, so
      capitals count. Fix line 3 so the file is accepted.
    html: |
      <label for="file">File name</label>
      <input id="file" value="Report.PDF">
      <p id="verdict"></p>
    js: |
      const name = document.querySelector("#file").value;
      const verdict = document.querySelector("#verdict");
      if (name.endsWith(".pdf")) {
        verdict.textContent = "Accepted";
      } else {
        verdict.textContent = "Refused: PDF files only";
      }
    editable: [js]
    checks:
      - label: The page says Accepted
        selector: '#verdict'
        text: Accepted
    solution:
      js: |
        const name = document.querySelector("#file").value;
        const verdict = document.querySelector("#verdict");
        if (name.toLowerCase().endsWith(".pdf")) {
          verdict.textContent = "Accepted";
        } else {
          verdict.textContent = "Refused: PDF files only";
        }
    hints:
      - The name has capitals, and `".pdf"` doesn't.
      - Make the name lower case before you ask how it ends.
      - '`name.toLowerCase()` gives a new string. Call `endsWith` on that.'

  - type: prose
    id: name-numbers-and-math
    body: >-
      You met `Number(text)`. It converts all of the text or gives `NaN`. `parseInt(text)` is
      forgiving: it reads the whole number at the start and stops at the first other
      character. So `Number("42px")` is `NaN`, and `parseInt("42px")` is 42.


      `toFixed(2)` rounds to two decimals and returns text: `(4.5).toFixed(2)` is `"4.50"`.
      `Math` holds the rest: `Math.round`, `Math.floor` to round down, `Math.ceil` to round up,
      and `Math.max`. And `sum += 5` is short for `sum = sum + 5`.

  - type: ai-review
    id: review-sum-prices
    concept: js.numbers-and-math
    difficulty: 3
    language: js
    request: Sum the prices in the cart. They arrive as strings such as "30.50".
    flawClass: edge-case
    code: |
      function sumPrices(prices) {
        let sum = 0;
        for (const price of prices) {
          sum += parseInt(price);   // parseInt reads the whole number at the start of the text
        }
        return sum;
      }
      console.log(sumPrices(["30.50", "12.75"])); // 42
    prompt: >-
      An assistant wrote this, and it passed a test with whole prices. Now 30.50 and 12.75 come
      to 42. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`parseInt` stops at the decimal point'
        correct: true
        feedback: >-
          Right. It reads `30` and drops the rest. `Number` reads the whole thing.
      - text: '`sum += ...` joins text'
        feedback: >-
          `parseInt` has already returned a number, so `+=` really adds here.
      - text: '`for...of` loops over indexes'
        feedback: >-
          `for...of` hands you each value in turn, which here is each price string.
    fix: |
      function sumPrices(prices) {
        let sum = 0;
        for (const price of prices) {
          sum += Number(price);
        }
        return sum;
      }

  - type: prose
    id: name-objects-sets-maps
    body: >-
      `Object.keys(menu)` lists an object's property names as an array. `Object.values(menu)`
      lists its values.


      A **Set** is a collection that keeps each value once. `new Set(list)` builds one, since
      `new` makes a fresh object of that kind, and `size` counts what's inside. A **Map** stores
      values under keys: `prices.set("tea", 2)`, then `prices.get("tea")` gives 2.

  - type: playground
    id: count-different-dishes
    concept: js.object-and-set-helpers
    difficulty: 2
    prompt: >-
      The kitchen wants to know how many different dishes were ordered today, not how many
      orders came in. The page counts orders. Make it count different dishes with a Set.
    html: |
      <h1>Today's orders</h1>
      <p>Different dishes: <span id="kinds"></span></p>
    js: |
      const orders = ["tea", "cake", "tea", "soup", "tea", "cake"];

      document.querySelector("#kinds").textContent = orders.length;
    editable: [js]
    checks:
      - label: The page counts 3 different dishes
        selector: '#kinds'
        text: '3'
    solution:
      js: |
        const orders = ["tea", "cake", "tea", "soup", "tea", "cake"];
        const kinds = new Set(orders);
        document.querySelector("#kinds").textContent = kinds.size;
    hints:
      - '`orders.length` counts every order, repeats included.'
      - A Set keeps each value once. `new Set(orders)` builds one.
      - Show the Set's `size`, not the array's `length`.

  - type: prose
    id: name-json
    body: >-
      **JSON** is a way to write data as text, so you can save it or send it. Web services
      and AI models reply in it. `JSON.stringify(settings)` turns an object into text like
      `{"volume":7}`. `JSON.parse(text)` turns that text back into an object.


      JSON keeps each value's type. A `"7"` in quotes comes back as a string. And text that
      isn't valid JSON makes `JSON.parse` stop with a `SyntaxError`.

  - type: predict-output
    id: predict-json-types
    concept: js.json
    difficulty: 2
    language: js
    code: |
      const reply = '{"rating":"7","mood":"happy"}';
      const review = JSON.parse(reply);
      console.log(review.rating + 1);
    question: An AI model rated a review and replied in JSON. What does this log?
    choices:
      - text: '`71`'
        correct: true
        feedback: >-
          Right. The model sent the rating as text, so it comes back as text.
      - text: '`8`'
        feedback: >-
          Look at the quotes round `"7"`. JSON keeps it a string, and `+` joins strings.
      - text: A `SyntaxError`
        feedback: >-
          The text is valid JSON: keys and strings in double quotes. It parses fine.

  - type: code-challenge
    id: write-receipt-lines
    concept: js.string-methods
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `receiptLines(items)`. Each item has a `name`, a price in `pence` and a
      `quantity`. Return an array with one line per item, then a total line.


      An item line is the name, `x` and the quantity, a space, then the amount in pounds. Show
      two decimals, and pad the amount on the left to 7 characters with `padStart(7)`. The
      total line is `Total`, a space and the padded total. Don't change the input.


      So tea at 225 pence, twice, gives `'Tea x2    4.50'` and `'Total    4.50'`.
    hints:
      - Keep a running total in pence, and only divide by 100 when you show an amount.
      - '`toFixed(2)` gives the two decimals as text, and `padStart(7)` adds the spaces.'
      - Start with `const lines = [];` and `let total = 0;`, then loop with `for...of`.

  - type: explain-back
    id: explain-number-or-parseint
    concept: js.numbers-and-math
    difficulty: 4
    prompt: >-
      A form field holds `'42px'`. `Number` gives `NaN` and `parseInt` gives `42`. Which would
      you use for a quantity field, and why?
    rubric:
      - '`parseInt` reads leading digits and stops, so it accepts text that isn''t a clean number.'
      - '`Number` converts the whole text or gives `NaN`, so junk is caught instead of trimmed away.'
      - For a quantity, refusing `'42px'` is safer than reading it as 42, so `Number` plus a `NaN` check.
    modelAnswer: >-
      `parseInt` is forgiving. It reads the digits at the front and ignores the rest, so
      `'42px'` becomes 42. That's handy for a CSS width, and a trap for a quantity. `Number`
      converts all of the text or none of it. `'42px'` gives `NaN`, which I can check for and
      refuse. For a quantity I'd use `Number`. Junk should be an error, not a guess.

recap:
  - Tidy and test text with string methods, which always return a new string.
  - Pick `Number` or `parseInt` on purpose, and format with `toFixed`.
  - Count with a Set, look up with a Map, and save data as JSON text.

recall:
  - id: card-strings-immutable
    concept: js.string-methods
    front: What does `name.toUpperCase()` on its own line do to `name`?
    back: >-
      Nothing. Strings are never changed in place. The method returns a new string, which
      that line throws away.
  - id: card-tofixed-string
    concept: js.numbers-and-math
    front: What does `(3).toFixed(2) + 1` give, and why?
    back: >-
      `'3.001'`. `toFixed` returns a string, and `+` joins a string and a number as text.
  - id: card-set-unique
    concept: js.object-and-set-helpers
    front: How do you count the different values in a list with repeats?
    back: >-
      Put them in a Set with `new Set(list)`. It keeps each value once, and `size` counts
      them.
  - id: card-json-types
    concept: js.json
    front: You `JSON.parse` the text `{"volume":"7"}`. What type is `volume`?
    back: >-
      A string. JSON keeps each value's type, and `"7"` is in quotes. Convert it with `Number`
      before you do sums.

