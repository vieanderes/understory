deepDive: >-
  Python's sort is stable: items with equal keys keep their order, even with
  `reverse=True`. So you can sort by several rules with a key that returns a tuple,
  `key=lambda p: (p["team"], -p["score"])`, because tuples compare item by item. On a tie,
  `max` and `min` return the first of the equal items.


  `operator.itemgetter("score")` does what `lambda r: r["score"]` does, a little faster.
  A lambda can't hold statements, so anything longer deserves a `def` with a name. Built-ins
  live in a module called `builtins`, so after shadowing one you can still reach it as
  `builtins.list`, though renaming your own name is the real fix. ruff's `A` rules flag
  shadowed built-ins.
