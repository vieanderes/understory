summary: >-
  Dynamic programming (DP) is a way to solve problems whose answer is built from answers to
  smaller versions of the same problem, when those smaller versions repeat. A plain recursion
  solves the same subproblem again and again, which is often exponential. DP solves each
  distinct subproblem once and stores it, so the cost becomes the number of distinct states
  times the work per state.


  The signals: "how many ways", "the minimum cost", "the maximum value", "the longest" or
  "can you make exactly", with a choice at each step (take or skip, left or right, which
  coin). Another strong signal is a greedy rule that fails on a small example, such as
  making 6 from coins 1, 3 and 4. If the problem asks you to list every solution, not count
  or optimise them, it is backtracking, not DP.


  There are two ways to write it. **Memoisation** keeps the natural recursion and adds a
  cache, and it only visits states the question actually reaches. **Tabulation** fills a
  table from the smallest states upwards, which avoids recursion depth limits and often lets
  you keep only the last row. Both give the same complexity.


  The hard part is never the code. It is defining the state in one sentence, such as
  "`best[a]` is the fewest coins that make amount `a`", and writing how it depends on smaller
  states. Once those two lines are right, the loops follow.
remember:
  - A problem suits DP when its best answer is built from answers to smaller versions of itself and those smaller versions repeat.
  - Define the state in one sentence first, then the recurrence, the base cases and the order to fill the table.
  - DP costs the number of states times the work per state, for example amount × coins for coin change.
  - A memo key must include every argument that changes the answer, with a separator between parts.
  - Tabulation avoids stack overflow and often needs only the previous row, turning O(n × m) memory into O(m).
  - For counting coin combinations, loop over coins outside and amounts inside; swapping the loops counts ordered sequences instead.
  - In a 0/1 knapsack with one row, loop the capacity downwards so each item is used at most once.
  - A greedy rule that fails on a small example is a strong hint that the problem needs DP.
sections:
  - title: The template, top down and bottom up
    body: |-
      Coin change is the cleanest template because the greedy answer is wrong. The question:
      what is the fewest coins that make `amount`, or `-1` if it cannot be made? The state is
      "`best(a)` is the fewest coins that make `a`". The last coin used is one of the coins,
      so `best(a) = 1 + min(best(a - coin))` over every coin that fits, with `best(0) = 0`.

      ```js
      // Top down: the recursion as written, plus a cache. O(amount × coins) time.
      function fewestCoinsMemo(coins, amount) {
        const memo = new Map();
        function best(a) {
          if (a === 0) return 0;
          if (memo.has(a)) return memo.get(a);
          let result = Infinity;
          for (const coin of coins) {
            if (coin <= a) result = Math.min(result, best(a - coin) + 1);
          }
          memo.set(a, result);
          return result;
        }
        const answer = best(amount);
        return answer === Infinity ? -1 : answer;
      }

      // Bottom up: the same recurrence, filled from 0 upwards. O(amount) memory, no recursion.
      function fewestCoins(coins, amount) {
        const best = new Array(amount + 1).fill(Infinity);
        best[0] = 0;
        for (let a = 1; a <= amount; a++) {
          for (const coin of coins) {
            if (coin <= a && best[a - coin] + 1 < best[a]) best[a] = best[a - coin] + 1;
          }
        }
        return best[amount] === Infinity ? -1 : best[amount];
      }

      console.log(fewestCoins([1, 3, 4], 6)); // 2
      console.log(fewestCoinsMemo([1, 3, 4], 6)); // 2
      console.log(fewestCoins([2], 3)); // -1
      console.log(fewestCoins([5, 2], 0)); // 0
      ```

      Greedy takes 4, then 1, then 1: three coins. The table finds 3 and 3. `Infinity`
      marks amounts that cannot be made, and `Infinity + 1` stays `Infinity`, so no special
      case is needed inside the loop. The memo version recurses up to `amount` deep, so for
      large amounts in JavaScript the table is the safe choice.
  - title: Counting ways, and why loop order matters
    body: |-
      "In how many ways can you make `amount`?" has two readings. If 1 + 2 and 2 + 1 are the
      same way, you count **combinations**. If they differ, you count ordered sequences. The
      recurrence is the same sum; only the loop order changes.

      ```js
      // Combinations: coins outside. Each coin is added to amounts in one sweep,
      // so a combination is only ever built in coin order. O(amount × coins).
      function countCombinations(coins, amount) {
        const ways = new Array(amount + 1).fill(0);
        ways[0] = 1;
        for (const coin of coins) {
          for (let a = coin; a <= amount; a++) ways[a] += ways[a - coin];
        }
        return ways[amount];
      }

      // Ordered sequences: amounts outside. Every coin can be the last one at every amount.
      function countSequences(coins, amount) {
        const ways = new Array(amount + 1).fill(0);
        ways[0] = 1;
        for (let a = 1; a <= amount; a++) {
          for (const coin of coins) if (coin <= a) ways[a] += ways[a - coin];
        }
        return ways[amount];
      }

      console.log(countCombinations([1, 2, 5], 5)); // 4
      console.log(countSequences([1, 2], 4)); // 5
      console.log(countCombinations([2], 3)); // 0
      ```

      For `[1, 2, 5]` and 5 the four combinations are 5, 2+2+1, 2+1+1+1 and 1+1+1+1+1.
      `countSequences([1, 2], 4)` is the stairs problem from the lesson: 1+1+1+1, 1+1+2,
      1+2+1, 2+1+1 and 2+2. Say which reading you are solving before you write the loops.
      Counts grow fast: past 2^53 they lose precision in JavaScript, which is why many
      statements ask for the answer modulo 1,000,000,007, or you switch to `BigInt`.
  - title: Two strings, one table
    body: |-
      Edit distance asks for the fewest single-character inserts, deletes and replacements
      that turn one string into another. It is how spell checkers rank suggestions. The
      state is "`d[i][j]` is the distance between the first `i` letters of `a` and the first
      `j` letters of `b`". If the last letters match, `d[i][j] = d[i - 1][j - 1]`. If not,
      take one plus the cheapest of delete, insert or replace.

      ```js
      // O(n × m) time, O(m) memory: only the previous row is kept.
      function editDistance(a, b) {
        let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
        for (let i = 1; i <= a.length; i++) {
          const curr = [i];
          for (let j = 1; j <= b.length; j++) {
            curr[j] =
              a[i - 1] === b[j - 1]
                ? prev[j - 1]
                : 1 + Math.min(prev[j], curr[j - 1], prev[j - 1]);
          }
          prev = curr;
        }
        return prev[b.length];
      }

      console.log(editDistance('kitten', 'sitting')); // 3
      console.log(editDistance('', 'abc')); // 3
      console.log(editDistance('same', 'same')); // 0
      ```

      The first row and column are the base cases: turning `i` letters into nothing takes
      `i` deletes. `prev[j]` is a delete, `curr[j - 1]` an insert, and `prev[j - 1]` a
      replacement. Longest common subsequence has exactly the same shape with a different
      rule: on a match add one to the diagonal, otherwise take the larger of up and left.
  - title: The 0/1 knapsack and the backwards loop
    body: |-
      "Each item has a weight and a value; what is the most value that fits in capacity `W`,
      using each item at most once?" is the take-or-skip pattern with two numbers per state.
      The full table is `best[i][w]`, the most value from the first `i` items in capacity
      `w`. Only the previous row is ever read, so one row is enough if you are careful.

      ```js
      // O(items × capacity) time, O(capacity) memory.
      function knapsack(items, capacity) {
        const best = new Array(capacity + 1).fill(0);
        for (const { weight, value } of items) {
          // Downwards, so best[w - weight] still holds the value without this item.
          for (let w = capacity; w >= weight; w--) {
            best[w] = Math.max(best[w], best[w - weight] + value);
          }
        }
        return best[capacity];
      }

      const items = [
        { weight: 1, value: 1 },
        { weight: 3, value: 4 },
        { weight: 4, value: 5 },
        { weight: 5, value: 7 },
      ];
      console.log(knapsack(items, 7)); // 9
      console.log(knapsack([{ weight: 2, value: 3 }], 5)); // 3
      console.log(knapsack([], 10)); // 0
      ```

      With capacity 7 the answer is the items of weight 3 and 4. If the inner loop ran
      upwards, `best[w - weight]` could already include the current item, so one item would
      be taken several times: that is the unbounded knapsack, a different problem with the
      coin-change loop shape. The complexity depends on the capacity's value, not its
      number of digits, so a capacity of a billion makes this approach impractical.
  - title: From brute force to DP, aloud
    body: |-
      Every DP answer in an interview can follow the same five sentences. For coin change:

      1. **Brute force.** "Try every coin as the last one and recurse. That's exponential,
         because `best(a - 1)` and `best(a - 3)` both need `best(a - 4)`."
      2. **State.** "`best(a)` is the fewest coins that make `a`."
      3. **Recurrence and base case.** "`best(a) = 1 + min(best(a - c))` over coins `c` that
         fit, and `best(0) = 0`. Unreachable amounts are infinity."
      4. **Order.** "Each amount depends only on smaller ones, so I fill from 0 upwards."
      5. **Cost.** "amount × coins states and steps, O(amount) memory."

      Draw two or three levels of the recursion tree to show the repeats; that picture is
      the argument for DP. Then test the base cases the table depends on: amount 0, an
      amount no coin combination can make, a single coin, and the largest amount for speed.
      If the interviewer asks for the coins themselves, not only the count, store which coin
      achieved each `best[a]` and walk back from `amount`, the same trick as BFS parents.
pitfalls:
  - "**A memo key that collides.** `` `${i}${j}` `` makes (1, 12) and (11, 2) the same key. Use a separator, a nested array, or `i * cols + j`."
  - "**A memo that outlives the input.** A cache declared outside the function keeps answers from the previous call's input. Create the memo inside the function for each call."
  - "**Leaving out an argument from the key.** If the answer depends on the index and the remaining capacity, a key of the index alone returns wrong answers. Key on every argument that changes the result."
  - "**Deep recursion in JavaScript.** Memoised recursion 100,000 levels deep overflows the stack. Tabulate bottom up for large inputs."
  - "**The wrong loop order for counting.** Amounts outside and coins inside counts 1+2 and 2+1 separately. Put coins outside to count combinations."
  - "**Upwards loop in a one-row 0/1 knapsack.** Each item can then be taken more than once. Loop the capacity from high to low."
  - "**Forgetting unreachable states.** Filling with 0 instead of `Infinity` makes impossible amounts look free. Use `Infinity` for minimums and convert to `-1` at the end."
interview:
  - question: How do you recognise a dynamic programming problem?
    answer: >-
      I look for an answer built from answers to smaller versions of the same problem, where
      those smaller versions repeat. The wording helps: "how many ways", "minimum cost",
      "longest" or "can you make exactly", with a choice at each step such as take or skip.
      I confirm by writing the brute-force recursion and checking whether two branches ask
      the same subquestion, as `best(a - 1)` and `best(a - 3)` both needing `best(a - 4)` in
      coin change. A greedy rule failing on a tiny example is another hint. The contrast is
      backtracking: if I must list every solution, caching doesn't help, because the output
      itself is exponential.
  - question: Memoisation or tabulation, which do you choose?
    answer: >-
      I start with memoisation when the recursion is the clearest statement of the problem,
      and switch to tabulation when depth or memory matters. Memoisation keeps the code close
      to the recurrence and only computes states the question reaches, which helps when most
      of the table is never needed. Its costs are the call stack, which overflows around ten
      thousand frames in JavaScript, and function-call overhead. Tabulation has no recursion,
      is usually faster in practice, and lets me keep only the last row or two, turning
      O(n × m) memory into O(m). The price is working out the fill order myself so every
      state's dependencies are ready.
  - question: Walk me through the 0/1 knapsack and its complexity.
    answer: >-
      The state is the most value from the first i items within capacity w, and each item is
      either skipped, keeping the value from the row above, or taken, adding its value to the
      best at w minus its weight. That's O(items × capacity) time. Since each row only reads
      the previous one, I keep a single array and loop the capacity downwards, so the cell I
      read still holds the value without the current item; looping upwards would let an item
      be reused. The catch is that the running time depends on the capacity's value, so it is
      pseudo-polynomial: with a capacity of a billion it's impractical, and I'd look for a
      different state or an approximation.
  - question: How would you find the longest increasing subsequence?
    answer: >-
      The standard DP is O(n²): `len[i]` is the longest increasing subsequence ending at
      index i, which is one plus the best `len[j]` over earlier j with a smaller value. The
      answer is the largest `len[i]`. For large inputs there's an O(n log n) method: keep
      an array where position k holds the smallest possible tail of an increasing
      subsequence of length k plus 1, and for each value binary search the first tail that
      is not smaller and replace it, or append. The array's length is the answer. The
      trade-off is that the fast version gives the length directly; recovering the
      subsequence itself needs extra parent bookkeeping.
