    primary: true
    verified: true

deepDive: >-
  Comparisons chain: `1 < x < 10` means `1 < x and x < 10`, with `x` worked out once.
  `and` and `or` return one of their operands, not a boolean, so `name or "stranger"`
  gives a default. A class can define its own answer to "am I true?".


  `//` rounds down, towards minus infinity, so `-7 // 2` is `-4`, not `-3`. JavaScript's
  `Math.trunc` rounds towards zero instead. `round(2.5)` is `2`: Python rounds halves to the
  even neighbour, which keeps sums of many rounded values fair.


  Loops can have an `else` block, which runs only when the loop finished without `break`.
  It reads oddly, but it's the clean way to write "searched everything, found nothing".
  Python also has `match` for structural pattern matching, a far richer tool than
  JavaScript's `switch`.
