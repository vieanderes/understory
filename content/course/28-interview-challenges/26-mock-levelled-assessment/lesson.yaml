id: interview.mock-levelled
title: "Mock levelled assessment"
objective: "Sit a timed four-level task that grows a bank system, keeping every earlier level passing."
level: advanced
minutes: 90
assessment: true
concepts: [interview.levelled-design, interview.backward-compatible-change]
prerequisites: [interview.levelled-two]
opening:
  text: >-
    You'll grow one bank system through four levels in 90 minutes, like a real levelled
    test. Each level adds rules, and every earlier level's tests must keep passing.

steps:
  - type: prose
    id: brief
    body: |-
      One task, four levels, 90 minutes. The hidden tests are grouped by level, and each
      test counts the same.

      Most people don't finish level 4, and that's fine. A clean level 3 beats a broken
      level 4.

  - type: prose
    id: model-first
    body: |-
      Read all four levels before you write a line. Then pick a data model that level 4
      won't break.

      Ask what each level adds to an account, and give it a home from the start. Then
      level 4 extends your code instead of rewriting it.

  - type: prose
    id: keep-green
    body: |-
      Finish a level, then run every test before you start the next. When a new level
      makes you change old code, change it in small steps and rerun.

      Earlier levels still count. A refactor that breaks level 1 costs more than level 4
      earns. Short of time for a heap? A sorted array with a slower insert still passes
      the correctness tests.

  - type: code-challenge
    id: task-bank
    concept: interview.backward-compatible-change
    difficulty: 5
    language: ts
    starter: bank.starter.ts
    solution: bank.solution.ts
    tests: bank.tests.ts
    hidden: bank.hidden.ts
    performance: bank.performance.ts
    bruteForce: bank.brute.ts
    timeLimitMs: 2500
    prompt: |-
      **A bank system.** Write a class `Bank`. Every method takes a `timestamp` first.
      Timestamps are integers, and they strictly increase from one call to the next.
      Account ids are strings. Amounts are integers within the range [1..1,000,000,000].

      **Level 1.** Accounts, deposits and transfers.

      - `createAccount(timestamp, accountId)` returns `true`, or `false` if the id is
        already taken. An id is never reused, even after level 4 merges it away.
      - `deposit(timestamp, accountId, amount)` returns the new balance, or `null` if
        the account does not exist.
      - `transfer(timestamp, sourceId, targetId, amount)` moves money and returns the
        source's new balance. It returns `null` if either account is missing or both ids
        are the same. It also returns `null` if the source holds less than `amount`.

      For example, after `createAccount(1, "acc1")`, `deposit(2, "acc1", 500)` returns
      `500`.

      **Level 2.** `topSpenders(timestamp, n)` ranks accounts by **outgoing total**: the
      money they sent in transfers and in payments that ran. Deposits don't count.

      - It returns at most `n` strings of the form `"id(total)"`, such as `"acc1(100)"`.
      - Order by total, highest first. Break ties by id in ascending string order.
      - Accounts with a total of 0 are included.

      **Level 3.** Scheduled payments.

      - `schedulePayment(timestamp, accountId, amount, delay)` returns an id such as
        `"payment1"`. The number counts every payment scheduled in the bank, from 1. It
        returns `null` if the account does not exist. `delay` is at least 1.
      - The payment is due at `timestamp + delay`. Before any operation runs, every
        payment due at or before its timestamp runs first. They run in order of due time,
        then in the order they were scheduled.
      - A payment takes `amount` from its account and adds to its outgoing total. If the
        balance is too low, the payment is skipped and never retried.
      - `cancelPayment(timestamp, accountId, paymentId)` returns `true` if the payment is
        still waiting and belongs to that account. Otherwise it returns `false`.

      **Level 4.** Merging and history.

      - `mergeAccounts(timestamp, accountId1, accountId2)` merges the second account into
        the first and returns `true`. The first gains the second's balance, outgoing total
        and waiting payments. The second account stops existing.
      - It returns `false` if the ids are equal or either account is missing.
      - `getBalance(timestamp, accountId, timeAt)` returns the balance at time `timeAt`,
        after everything at or before `timeAt`. A payment counts at its due time.
      - It returns `null` if the account did not exist at `timeAt`. A merged-away account
        existed until, but not at, the moment of its merge.

      `timeAt` is at most `timestamp`. The tests run up to 50,000 operations, so no
      operation may scan every payment or every past change.
    hints:
      - Keep one object per account with its balance, its outgoing total and a list of timestamped balances. Every level extends it.
      - Waiting payments belong in a min-heap ordered by due time, then scheduling number. Cancel by marking, and skip marked payments when they come up.
      - The balance list is already in time order, so `getBalance` is a binary search for the last entry at or before `timeAt`.

recap:
  - Read every level first and choose a model the last one won't break.
  - Rerun all earlier tests after each change, not only the new ones.
  - Give each operation the timestamp and let one method run what is due.

recall:
  - id: card-read-all-levels
    concept: interview.levelled-design
    front: Why read level 4 before you write level 1 of a levelled task?
    back: >-
      Later levels build on your model. Knowing them lets level 1 leave room, so level 4
      extends it instead of forcing a rewrite.
  - id: card-account-object
    concept: interview.levelled-design
    front: Why store each account as an object rather than a plain balance?
    back: >-
      Each level adds facts about an account: an outgoing total, waiting payments, a
      history. An object gives them a home without changing any caller.
  - id: card-rerun
    concept: interview.backward-compatible-change
    front: You changed level 1 code to make level 3 work. What do you run next?
    back: >-
      Every test from every level. The hidden tests score all levels, so a broken level 1
      costs points again.
  - id: card-one-entry-point
    concept: interview.backward-compatible-change
    front: How do you add due payments without changing every method's logic?
    back: >-
      Call one helper at the start of every method that runs whatever is due at that
      timestamp. The rest of each method stays as it was.

references:
  - kind: book
    title: 'Refactoring: Improving the Design of Existing Code'
    authors: Martin Fowler
    year: 2018
    venue: Addison-Wesley, 2nd edition
    url: https://martinfowler.com/books/refactoring.html
    note: Changing the design in small steps with the tests green after each one.
    primary: true
    verified: true
  - kind: docs
    title: Map
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
    note: Fast lookup by account id and payment id.
    verified: true

deepDive: |-
  **The model.** One `Map` from id to an account object: balance, outgoing total, creation
  time, a list of `[timestamp, balance]` entries and a set of waiting payment ids. A second
  `Map` holds every payment by id. Levels 1 and 2 are then a few lines each.
  `topSpenders` sorts the accounts, O(A log A) for A accounts, which is fine for the sizes
  here.

  **Level 3.** A private `runDue(timestamp)` runs at the start of every method. It pops
  payments from a min-heap keyed by due time, then scheduling number. Each push and pop is
  O(log P). Cancelling marks the payment instead of searching the heap. A marked payment
  is skipped when it reaches the top. This is called **lazy deletion**.

  The slow version keeps waiting payments in an array and filters it on every operation.
  It gives the same answers, but it is O(P) per operation. With 20,000 waiting payments and
  25,000 transfers, it takes seconds, while the heap takes milliseconds.

  **Level 4.** Every balance change appends an entry to the account's list. Payments are
  recorded at their due time. Timestamps only grow, so each list stays sorted, and
  `getBalance` is a binary search, O(log H). A merge moves the second account's waiting
  payment ids to the first and records when the second closed. Its history stays, so
  earlier lookups still work.

  **The format.** A levelled-task assessment reveals one level at a time. The
  next opens when the current one passes. The bank system is one of the reported variants.
  Others include an in-memory database, a file store with quotas and a credits system. The
  score is the share of tests passed across the levels you reach. Here every level is
  visible at once, so you can practise planning for level 4.
