id: clean.functions
title: Small functions that do one thing
objective: Split functions to one job and one level of abstraction, keep parameter lists short, replace flag arguments, and separate commands from queries.
level: essential
minutes: 10
concepts: [clean.single-purpose-functions, clean.parameter-lists, clean.flag-arguments, clean.command-query-separation]
prerequisites: [js.destructuring-and-spread, clean.naming]
opening:
  text: >-
    You'll break a do-everything function into small ones you can read at a glance. Small
    functions are easier to name, test and reuse.

steps:
  - type: prose
    id: one-job
    body: |-
      A function should do **one job**. A quick test: describe it in one sentence. If you
      need "and", it does two.

      ```js
      function saveAndEmailOrder(order) { /* ... */ }
      ```

      That name admits it. Split it into `saveOrder` and `emailReceipt`, and each name says
      everything its function does.

  - type: multiple-choice
    id: count-the-jobs
    concept: clean.single-purpose-functions
    difficulty: 1
    language: js
    code: |
      function checkout(order) {
        let total = 0;
        for (const item of order.items) total += item.price;
        database.save({ order, total });
        mailer.send(order.email, `Your total: ${total}`);
        return total;
      }
    question: How many separate jobs does `checkout` do?
    choices:
      - text: Three
        correct: true
        feedback: >-
          Yes. It adds up the price, saves the order and sends an email.
      - text: One
        feedback: >-
          It's called once, but inside it sums, saves and emails. Three reasons to change.
      - text: Two
        feedback: >-
          Look again at the loop. Adding up the total is a job of its own.

  - type: prose
    id: flag-arguments
    body: |-
      Now look at this call:

      ```js
      formatPrice(5, true);
      ```

      What does `true` do? You can't tell without opening the function. A `true` or `false`
      that switches what a function does is a **flag argument**. It hides two functions in
      one. Split them, and the names say it: `formatPrice(5)` and `formatPriceWithSymbol(5)`.

  - type: prose
    id: options-object
    body: |-
      Long lists of arguments get passed in the wrong order:

      ```js
      createUser("Ana", "ana@example.com", true, false, 3);
      createUser({ name: "Ana", email: "ana@example.com", isAdmin: true });
      ```

      The second call passes one **options object**. You met the other half last lesson:
      the function destructures it, `function createUser({ name, email, isAdmin = false })`.
      Every value now has a name at the call.

  - type: bug-hunt
    id: hunt-swapped-arguments
    concept: clean.parameter-lists
    difficulty: 3
    language: js
    code: |
      function bookRoom(roomId, guestId, nights, startDay) {
        return `room ${roomId} for guest ${guestId}`;
      }
      const guest = { id: 7 };
      const room = { id: 12 };
      console.log(bookRoom(guest.id, room.id, 3, 12));
    prompt: 'This prints `room 7 for guest 12`, but the guest is 7. Tap the line at fault.'
    lines: [6]
    reasons:
      - text: The ids are passed in the wrong order
        correct: true
        feedback: >-
          Yes. Four numbers in a row swap without a sound, and nothing complains.
      - text: The function returns the wrong fields
        feedback: >-
          The function uses its parameters correctly. The call hands them over swapped.
      - text: '`guest` and `room` need `let`'
        feedback: >-
          They never change, so `const` is right. The order of the arguments is wrong.
    fix: |
      function bookRoom({ roomId, guestId, nights, startDay }) {
        return `room ${roomId} for guest ${guestId}`;
      }
      const guest = { id: 7 };
      const room = { id: 12 };
      console.log(bookRoom({ roomId: room.id, guestId: guest.id, nights: 3, startDay: 12 }));

  - type: ai-review
    id: review-missing-options-default
    concept: clean.parameter-lists
    difficulty: 3
    language: js
    request: Write paginate(items, options) with optional page and pageSize.
    flawClass: edge-case
    code: |
      function paginate(items, { page = 1, pageSize = 20 }) {
        const start = (page - 1) * pageSize;
        return items.slice(start, start + pageSize);
      }
    prompt: >-
      An assistant wrote this. Every test passed an options object. Calling
      `paginate(items)` throws `TypeError: Cannot read properties of undefined`. Tap the line.
    lines: [1]
    reasons:
      - text: The options object itself has no default
        correct: true
        feedback: >-
          Right. With nothing passed, there's no object to pull fields from.
      - text: '`slice` needs the end index minus one'
        feedback: >-
          `slice` already stops before its end index. The crash happens on line 1.
      - text: '`page` should start at 0'
        feedback: >-
          Pages from 1 is a fine choice. The crash comes from the missing object.
    fix: |
      function paginate(items, { page = 1, pageSize = 20 } = {}) {
        const start = (page - 1) * pageSize;
        return items.slice(start, start + pageSize);
      }

  - type: prose
    id: command-query
    body: |-
      Some functions answer a question: `cartTotal(cart)`. Others change something:
      `addToCart(cart, item)`. Keep the two apart. That's **command-query separation**.

      Callers ask questions freely, often twice. If asking also changes something, every
      look has a side effect nobody expects.

  - type: bug-hunt
    id: hunt-query-with-side-effect
    concept: clean.command-query-separation
    difficulty: 3
    language: js
    code: |
      let lastTicket = 100;
      function nextTicketNumber() {
        lastTicket = lastTicket + 1;
        return lastTicket;
      }
      function showNowServing() {
        console.log("Now serving " + nextTicketNumber());
      }
    prompt: >-
      A bug report: every time the screen refreshes, a ticket number gets skipped. Tap the
      line at fault.
    lines: [7]
    reasons:
      - text: Showing the number calls a function that changes it
        correct: true
        feedback: >-
          Yes. The screen only wanted to look, but each look hands out a ticket.
      - text: '`lastTicket` should be a `const`'
        feedback: >-
          It has to change when a ticket is handed out. The trouble is who changes it.
      - text: The function adds one before returning
        feedback: >-
          That's right for handing out a ticket. The screen shouldn't hand one out at all.
    fix: |
      let lastTicket = 100;
      function nextTicketNumber() {
        lastTicket = lastTicket + 1;
        return lastTicket;
      }
      function currentTicketNumber() {
        return lastTicket;
      }
      function showNowServing() {
        console.log("Now serving " + currentTicketNumber());
      }

  - type: code-challenge
    id: write-split-flag
    concept: clean.flag-arguments
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      `formatRows(rows, csv)` does two jobs, chosen by a `true` or `false`. Split it into
      `rowsToCsv(rows)` and `rowsToList(rows)`. Each row has `name` and `qty`.


      `rowsToCsv` starts with the line `name,qty`, then one `Pen,2` line per row.
      `rowsToList` writes one `Pen: 2` line per row. Lines are joined with `\n`.
    hints:
      - The two branches of the `if` are already the two functions you need.
      - Each branch builds its own lines and joins them. Neither needs the flag.
      - 'Start with `function rowsToCsv(rows) {` and move the `if (csv)` body into it.'

  - type: explain-back
    id: explain-command-query
    concept: clean.command-query-separation
    difficulty: 3
    prompt: >-
      Why should a function either change something or return an answer, but not both?
    rubric:
      - Callers expect asking a question to change nothing.
      - A query with a side effect changes state each time someone only looks.
      - Separate functions make each call's effect clear from its name.
    modelAnswer: >-
      People call a function that returns something to find out a fact, often more than
      once. If it also changes state, every look has an effect, like skipping a ticket
      number. Keeping commands and queries apart means reading is always safe.

recap:
  - Give each function one job, and a name that says it.
  - Pass an options object instead of a long list or a bare flag.
  - Keep functions that change things apart from ones that answer questions.
recall:
  - id: card-one-job
    concept: clean.single-purpose-functions
    front: How can you tell a function does too many jobs?
    back: >-
      You can't describe it without "and". Each extra job is another reason to change it.
  - id: card-options-object
    concept: clean.parameter-lists
    front: What does an options object fix in a call like `createUser("Ana", true, false, 3)`?
    back: >-
      Each value gets a name at the call site, so order no longer matters and nothing is
      swapped.
  - id: card-flag-argument
    concept: clean.flag-arguments
    front: What do you do with a function that takes a `true` or `false` to switch behaviour?
    back: >-
      Split it into two functions whose names say what each one does.
  - id: card-command-query
    concept: clean.command-query-separation
    front: What is command-query separation?
    back: >-
      A function either changes state or returns an answer, never both.

references:
  - kind: essay
    title: Flag Argument
    authors: Martin Fowler
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/FlagArgument.html
    note: Why a boolean that switches behaviour hides two functions.
    primary: true
    verified: true
  - kind: essay
    title: Command Query Separation
    authors: Martin Fowler
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/CommandQuerySeparation.html
    note: The principle and where it came from.
    primary: true
    verified: true
  - kind: docs
    title: Destructuring
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring
    note: Every form of destructuring, including defaults in parameters.
    verified: true

deepDive: >-
  "One job" is a judgement, not a line count. A useful test is levels of abstraction: a
  function that calls `saveOrder` and also glues the email text together character by
  character mixes two levels, and the low-level part usually wants its own function.


  Command-query separation has sensible exceptions. `array.pop()` both removes and returns,
  and a stack would be awkward without it. The rule is about surprise: a function named like
  a question should never change anything.


  Python gets options objects for free with keyword arguments, and can force them with a
  bare `*` in the parameter list. TypeScript adds a type for the options object, so a
  misspelt field is a compile error.
