term: narrowing
aka:
  - type narrowing
short: The checker shrinking a value's possible types after a check such as `typeof` or `if`.
explain: |
  A value typed `string | null` can't be trimmed yet. Write `if (name !== null)` and, inside
  that block, TypeScript knows it's a string. The type got smaller.

  `typeof`, `in`, `instanceof`, equality and early returns all narrow. It works only on what
  the checker can follow: a check inside another function doesn't count, unless that function
  is a type guard.
analogy: Guessing a card. "It's red" rules out half the deck; "it's a heart" rules out more.
example:
  language: ts
  code: |
    function label(id: number | string) {
      if (typeof id === 'number') {
        return id.toFixed(0); // id is number here
      }
      return id.toUpperCase(); // id is string here
    }
usage: Add an early return for null and narrowing takes care of the rest of the function.
twin:
  term: type-assertion
  difference: Narrowing proves the type with a check that runs. An assertion tells the checker to trust you, with no check at all, so it can be wrong.
related:
  - union-type
  - type-guard
  - discriminated-union
level: 2
lessons:
  - ts.narrowing
