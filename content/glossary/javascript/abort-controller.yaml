term: AbortController
aka:
  - abort signal
  - AbortSignal
  - cancelling a fetch
short: A built-in object that lets code cancel a request or other async work that's already running.
explain: |
  A user leaves the page halfway through a long answer. If nothing cancels the request, it
  keeps running and keeps costing. Ignoring the result isn't the same as stopping it.

  You create a controller and pass its `signal` to `fetch`. Calling `abort()` closes the
  connection, and the `fetch` promise rejects with an `AbortError`. Check for that error,
  so a cancel isn't reported as a failure.

  `AbortSignal.timeout(ms)` makes a signal that aborts itself, which is how you give a
  request a real deadline.
analogy: The cancel button on a print job. Closing the window doesn't stop the printer; this does.
example:
  language: js
  code: |
    const controller = new AbortController();
    stopButton.onclick = () => controller.abort();
    try {
      const res = await fetch('/api/chat', { method: 'POST', signal: controller.signal });
      await readStream(res);
    } catch (error) {
      if (error.name !== 'AbortError') throw error;
    }
usage: Pass an AbortController signal to the fetch, so Stop closes the connection.
related:
  - promise
  - async-await
  - server-sent-events
  - timeout
level: 2
