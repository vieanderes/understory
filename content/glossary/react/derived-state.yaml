term: derived state
aka: ["derive, don't sync", computed value, redundant state]
short: A value computed from props or existing state during render, instead of stored as state of its own.
explain: |
  A list and a filter are state. The filtered list is not: work it out while rendering.
  Storing it as a second piece of state, kept in step by an effect, adds a render, a
  flash of stale screen and a chance to drift.

  The rule is "derive, don't sync". If the work is expensive, memoise it, but still derive
  it. Ask of every piece of state: could I compute this from what I already have?
analogy: Not writing your age in your diary every morning. Your birthday and today's date already give it.
example:
  language: tsx
  code: |
    const [todos, setTodos] = useState<Todo[]>([]);
    const [filter, setFilter] = useState('all');
    // derived, not stored
    const visible = todos.filter((t) => matches(t, filter));
usage: Make the total derived state; the effect that copies it into state lags one render behind.
related: [state, effect, memoisation, re-render]
level: 2
lessons: [pro.react]
