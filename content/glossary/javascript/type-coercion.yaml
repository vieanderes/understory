term: type coercion
aka:
  - coercion
  - implicit conversion
short: JavaScript quietly converting a value to another type so that an operator can use it.
explain: |
  `'5' + 1` gives `'51'`, but `'5' - 1` gives `4`. Each operator converts its values to the
  types it needs, and it doesn't ask.

  `+` prefers text if either side is a string. Maths operators prefer numbers. `if` and `!`
  turn values into booleans. Convert on purpose with `Number()` or `String()` when the type
  matters, above all for form fields, which always give you strings.
analogy: A till that rounds your change without telling you. Usually fine, now and then baffling.
example:
  language: js
  code: |
    '5' + 1; // '51'
    '5' - 1; // 4
    Number('5') + 1; // 6
usage: The total reads 1050 because of coercion, since the quantity came from the form as a string.
twin:
  term: loose-equality
  difference: Coercion is any automatic conversion an operator makes. Loose equality is one operator that does it before comparing, which is where coercion bites most often.
