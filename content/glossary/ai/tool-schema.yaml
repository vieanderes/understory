term: tool schema
aka:
  - tool definition
  - input schema
  - function schema
short: The name, description and argument types a model is shown so it can request a tool correctly.
explain: |
  A model can't see your code. It knows a tool only by what you describe. A name, when to use it, and a JSON Schema for its
  arguments.

  That description is a prompt. A vague name or a missing "use this when" leads to the wrong tool, or to wrong arguments. Precise types, enums and examples in the
  description fix more misuse than any system prompt.

  Check the arguments anyway when the call arrives. The schema guides the model; it doesn't
  bind it.
analogy: The label on a machine in a shared workshop. A clear label and nobody needs to ask how to use it.
example:
  language: json
  code: |
    {
      "name": "find_order",
      "description": "Look up one order by its id. Use when the user gives an order number.",
      "input_schema": {
        "type": "object",
        "properties": { "order_id": { "type": "string", "pattern": "^ORD-[0-9]+$" } },
        "required": ["order_id"]
      }
    }
usage: The model keeps passing a name instead of an id; tighten the tool schema with a pattern and an example.
related:
  - tool-use
  - structured-output
  - mcp
level: 2
lessons:
