id: clean.duplication
title: Duplication and the wrong abstraction
objective: Tell duplicated knowledge from look-alike code, wait for the rule of three, and undo an abstraction that has grown flags.
level: advanced
minutes: 10
concepts: [clean.knowledge-duplication, clean.rule-of-three, clean.wrong-abstraction]
prerequisites: [clean.code-smells]
opening:
  text: >-
    You'll learn when to merge repeated code and when to leave it alone. Getting this wrong
    creates the tangled helpers everyone is afraid to touch.

steps:
  - type: prose
    id: knowledge-not-lines
    body: |-
      **DRY**, don't repeat yourself, is about knowledge, not text. Each rule or fact should
      live in one place. A VAT rate typed into three files is real duplication: change one,
      and the others are quietly wrong.

      Two functions that happen to look alike are different. If they change for different
      reasons, they're two ideas, and they should stay two functions.

  - type: multiple-choice
    id: pick-look-alike
    concept: clean.knowledge-duplication
    difficulty: 1
    language: ts
    code: |
      function isValidUsername(name: string): boolean {
        return name.length >= 3 && name.length <= 20;
      }
      function isValidRoomName(name: string): boolean {
        return name.length >= 3 && name.length <= 20;
      }
    question: Should these two share one helper?
    choices:
      - text: Not yet, they're separate rules
        correct: true
        feedback: >-
          Right. They match today by chance. Room names may soon allow 40 characters.
      - text: Yes, identical code is duplication
        feedback: >-
          Identical text isn't always one idea. Merge them and a room change breaks usernames.
      - text: Yes, fewer lines is always better
        feedback: >-
          Line count isn't the goal. The question is whether they change for the same reason.

  - type: bug-hunt
    id: hunt-merged-look-alikes
    concept: clean.knowledge-duplication
    difficulty: 2
    language: ts
    code: |
      // merged last month: "they were identical"
      function isValidName(name: string): boolean {
        return name.length >= 3 && name.length <= 40;
      }

      export const isValidUsername = isValidName;
      export const isValidRoomName = isValidName;
    prompt: >-
      Bug report: a 35-character username overflows the profile header. Yesterday's change
      only meant to allow longer room names. Tap the line that let it through.
    lines: [6]
    reasons:
      - text: Usernames share the room rule, so they changed too
        correct: true
        feedback: >-
          Yes. Two ideas shared one function, so a room change reached usernames.
      - text: The limit should be 20 for both
        feedback: >-
          Rooms really do need 40 now. The trouble is that usernames can't differ.
      - text: '`>= 3` should be `> 3`'
        feedback: >-
          The short end is fine. The report is about a name that's too long.
    fix: |
      export function isValidUsername(name: string): boolean {
        return name.length >= 3 && name.length <= 20;
      }
      export function isValidRoomName(name: string): boolean {
        return name.length >= 3 && name.length <= 40;
      }

  - type: prose
    id: rule-of-three
    body: |-
      So when do you extract? A common answer is the **rule of three**. Write it once. The
      second time, copy it and notice. The third time, extract.

      By the third copy you can see what really varies between them. Extract earlier and
      you're guessing, and the helper often fits none of the callers well.

  - type: multiple-choice
    id: pick-second-export
    concept: clean.rule-of-three
    difficulty: 2
    question: You're writing a second CSV export, similar to the first. What does the rule of three suggest?
    choices:
      - text: Copy it, and note the duplication
        correct: true
        feedback: >-
          Yes. Two copies don't show yet what varies. Wait for the third.
      - text: Extract a shared exporter now
        feedback: >-
          Tempting, but with two examples you're guessing which parts differ.
      - text: Add a flag to the first export
        feedback: >-
          A flag welds two callers together. That's how the wrong abstraction starts.

  - type: prose
    id: wrong-abstraction
    body: |-
      A helper starts shared. Then each new caller needs something slightly different, and
      gets a flag:

      ```ts
      formatName(person, formal, short)
      ```

      Soon nobody can say what a call returns without tracing it. That's the **wrong
      abstraction**. The fix is surprising: inline it. Give each caller its own plain code
      back, then extract only what's truly shared.

  - type: ai-review
    id: review-reused-flag
    concept: clean.wrong-abstraction
    difficulty: 3
    language: ts
    request: The name badge needs "A. Lovelace". Reuse formatName.
    flawClass: logic
    code: |
      function formatName(person: Person, formal: boolean, short: boolean): string {
        let name = short ? `${person.first[0]}. ${person.last}` : `${person.first} ${person.last}`;
        if (formal) name = `${person.title} ${name}`;
        if (formal && short) name = `${person.title} ${person.last}`;
        return name;
      }
    prompt: >-
      An assistant changed the helper for the badge. The badge test passes. The chat greeting
      calls `formatName(person, false, true)`. Tap the line that breaks it.
    lines: [2]
    reasons:
      - text: The greeting now gets "A. Lovelace", not "Ada"
        correct: true
        feedback: >-
          Yes. The badge borrowed the greeting's flag, so one change hit both callers.
      - text: '`person.first[0]` crashes on an empty name'
        feedback: >-
          It gives `undefined`, not a crash. And the greeting breaks for every name.
      - text: Line 4 overrides the badge text
        feedback: >-
          Only when `formal` is set too. The badge and greeting both pass `false`.
    fix: |
      function badgeName(person: Person): string {
        return `${person.first[0]}. ${person.last}`;
      }

  - type: code-challenge
    id: write-inline-format-name
    concept: clean.wrong-abstraction
    difficulty: 3
    language: ts
    prompt: >-
      `formatName(person, formal, short)` serves three callers through two flags. Inline it
      into three plain functions that take only the person. `fullName` gives first and last
      name. `greetingName` gives the first name.


      `letterName` gives the title and surname, like `Dr Lovelace`. With an empty title, it
      falls back to the full name.
    hints:
      - List what each pair of flags produces. Each result becomes one function.
      - None of the new functions needs a flag, because each caller knows which one it wants.
      - 'Start with `export function fullName(person: Person): string`.'

  - type: explain-back
    id: explain-flag-cost
    concept: clean.wrong-abstraction
    difficulty: 3
    prompt: Why can a shared helper with several boolean flags cost more than the duplicated code it replaced?
    rubric:
      - Each flag combination is another path that readers must trace to predict the result.
      - Changing it for one caller risks breaking the others that share it.
      - Plain separate functions can each be read and changed on their own.
    modelAnswer: >-
      Every flag doubles the paths through the helper. To know what one call does, you trace
      them all. Worse, a change for one caller can break another. Separate small functions
      repeat a little code, but each one is obvious and safe to change.

recap:
  - Remove duplicated knowledge, such as a rate or a rule written in several places.
  - Leave look-alike code apart until a third copy shows what varies.
  - Inline a helper that has grown flags, then extract only what's truly shared.
recall:
  - id: card-dry
    concept: clean.knowledge-duplication
    front: What does DRY actually ask for?
    back: >-
      One place for each piece of knowledge, such as a rule or a rate. Not the removal of
      every similar line.
  - id: card-look-alike
    concept: clean.knowledge-duplication
    front: Two functions have identical bodies. When should they stay separate?
    back: >-
      When they change for different reasons, so they're two ideas that only look alike today.
  - id: card-rule-of-three
    concept: clean.rule-of-three
    front: What is the rule of three?
    back: >-
      Tolerate a second copy. Extract on the third, when you can see what really varies.
  - id: card-wrong-abstraction
    concept: clean.wrong-abstraction
    front: How do you fix a shared helper that has grown flags for every caller?
    back: >-
      Inline it back into its callers, then extract only the parts they truly share.

references:
  - kind: essay
    title: The Wrong Abstraction
    authors: Sandi Metz
    venue: sandimetz.com
    url: https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction
    note: Why duplication is cheaper than the wrong abstraction, and how to back out.
    primary: true
    verified: true
  - kind: docs
    title: Rule of three (computer programming)
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Rule_of_three_(computer_programming)
    note: The rule, and where it comes from.
    verified: true
  - kind: docs
    title: Inline Function
    authors: Martin Fowler
    venue: Refactoring catalog
    url: https://refactoring.com/catalog/inlineFunction.html
    note: The move that undoes a bad extraction.
    verified: true

deepDive: >-
  DRY comes from a book that defines it as knowledge: every piece of knowledge should have
  a single, authoritative representation. It says nothing about lines of code. That's why
  a rate, a validation rule or a database schema repeated by hand is real duplication,
  while two loops that look alike may not be.


  A related smell is coupling through a shared helper. Once five modules import
  `formatName`, it's hard to change for one of them. Some teams prefer a little
  duplication across module boundaries for exactly that reason, so each module can change
  on its own.
