    verified: true

deepDive: >-
  Access control fails in more than one direction. Vertical: a customer reaching an admin
  action, as in the review. Horizontal: one customer reaching another's data, the IDOR from
  Backend 06. Both come from checking authentication and forgetting authorisation.


  The safest place for the ownership check is the query, `WHERE id = $1 AND owner_id = $2`. A
  foreign row is then never found, so the endpoint answers `404`, not `403`. A `403`
  confirms the row exists, which is a small leak an attacker can enumerate.


  Reset tokens should be compared with `timingSafeEqual`, not `===`, and stored hashed. A
  leaked database then doesn't hand over live reset links. The token in the email is the secret;
  the row is only how you check it.
