deepDive: >-
  Write each story down once, in about 150 words, then practise telling it aloud. Written
  stories drift into long setups; saying them aloud shows you where to cut.


  Tag each story with the questions it can answer. A scoped-down project also answers
  questions about failure, prioritisation and pushing back. For senior roles, keep one or
  two spares on leading across teams and influencing people who don't report to you.


  Be honest about the team's part. Interviewers ask follow-ups such as "what would you do
  differently?" and "what did your teammates do?", and a story that claims every decision
  unravels fast. Keep confidential details out: describe the problem's shape, not a
  client's name or internal numbers you may not share.
