id: clean.naming
title: Names that explain
objective: Choose names that reveal intent, keep one word per idea, name booleans as questions, and match a name's length to its scope.
level: essential
minutes: 10
concepts: [clean.intent-revealing-names, clean.consistent-vocabulary, clean.name-length-and-scope]
prerequisites: [js.built-in-toolbox]
opening:
  text: >-
    You'll turn names like `d` and `data2` into names that explain themselves. It's the
    cheapest way to make code easier to read, review and change.

steps:
  - type: prose
    id: intent-revealing
    body: |-
      A good name answers "what is this for?" Compare:

      ```js
      const t = price * 1.2;
      const priceWithTax = price * 1.2;
      ```

      Same maths, but only the second line explains itself. That's an
      **intent-revealing name**. Name booleans as yes-or-no questions: `isActive`,
      `hasPaid`, `canEdit`. Then `if (hasPaid)` reads like a sentence.

  - type: multiple-choice
    id: pick-a-name
    concept: clean.intent-revealing-names
    difficulty: 1
    language: js
    code: |
      const d = 14;
      if (daysSinceSignup > d) {
        sendReminder(user);
      }
    question: Which name for `d` tells the reader the most?
    choices:
      - text: '`reminderAfterDays`'
        correct: true
        feedback: >-
          Yes. It says what the number is for, and in which unit.
      - text: '`days`'
        feedback: >-
          Better than `d`, but days of what? The reader still has to guess its purpose.
      - text: '`fourteen`'
        feedback: >-
          That repeats the value. The name should say what the value means.
      - text: '`d` is fine here'
        feedback: >-
          Short names suit tiny scopes. This one decides when people get emails.

  - type: bug-hunt
    id: hunt-lying-name
    concept: clean.intent-revealing-names
    difficulty: 2
    language: js
    code: |
      const form = { email: "" };
      const isValid = validate(form);
      if (isValid) {
        submit(form);
      }
    prompt: >-
      `validate` returns a list of error messages, empty when all is well. This form has
      no email, yet it's submitted. Tap the line where the trouble starts.
    lines: [2]
    reasons:
      - text: The name promises a yes-or-no, but holds a list
        correct: true
        feedback: >-
          Exactly. An `if` treats every list as true, even one full of errors.
      - text: '`validate` should be called later'
        feedback: >-
          The timing is fine. The value it returns is misread because of its name.
      - text: '`form` needs to be a `let`'
        feedback: >-
          Nothing reassigns `form`. The name on line 2 is what misleads.
    fix: |
      const form = { email: "" };
      const errors = validate(form);
      if (errors.length === 0) {
        submit(form);
      }

  - type: prose
    id: one-word-per-idea
    body: |-
      Readers treat different words as different ideas. If one function is `getUser` and
      another is `loadOrders`, they'll wonder what "load" does that "get" doesn't.

      ```js
      getUser(id);
      getOrders(id);
      ```

      Pick one word per idea and use it everywhere. That's a **consistent vocabulary**.
      A new word then signals something really new.

  - type: multiple-choice
    id: pick-one-verb
    concept: clean.consistent-vocabulary
    difficulty: 2
    language: js
    code: |
      getOrders(userId);
      findInvoices(userId);
      loadCustomers(teamId);
      retrieveProducts(shopId);
    question: All four read a list from the same saved data. What would you change?
    choices:
      - text: Use one verb, like `get`, for all four
        correct: true
        feedback: >-
          Right. Same idea, same word. Then a new word will mean something new.
      - text: Nothing, variety reads better
        feedback: >-
          In an essay, yes. In code, a reader assumes different words mean different jobs.
      - text: Add comments explaining each verb
        feedback: >-
          The comments would say they're the same. A shared verb says it for free.

  - type: prose
    id: length-and-scope
    body: |-
      How long should a name be? It depends on how far it travels.

      ```js
      for (const p of prices) {
        total += p;
      }
      const maxUploadSizeBytes = 5000000;
      ```

      `p` lives for one line, so a letter is fine. `maxUploadSizeBytes` is read all over
      the app, so it spells out what and which unit. Skip squashed forms like `usrCnt`.

  - type: ai-review
    id: review-total-means-items
    concept: clean.intent-revealing-names
    difficulty: 3
    language: js
    request: Return the average amount spent per order.
    flawClass: logic
    code: |
      function averageOrderValue(orders) {
        let total = 0;
        for (const order of orders) {
          total += order.items.length;
        }
        return total / orders.length;
      }
    prompt: >-
      An assistant wrote this. A test with two orders, each one item at £1, passed. Tap the
      line at fault.
    lines: [4]
    reasons:
      - text: It counts items, while the name says money
        correct: true
        feedback: >-
          Yes. The £1 prices made the count and the sum match by luck.
      - text: It should divide by the number of items
        feedback: >-
          Average order value divides by orders. The trouble is what `total` adds up.
      - text: '`total` should start at 1'
        feedback: >-
          A sum starts at 0. It's the thing being summed that's wrong.
    fix: |
      function averageOrderValue(orders) {
        let totalSpent = 0;
        for (const order of orders) {
          for (const item of order.items) {
            totalSpent += item.price;
          }
        }
        return totalSpent / orders.length;
      }

  - type: fill-blank
    id: fill-boolean-names
    concept: clean.intent-revealing-names
    difficulty: 2
    prompt: Name both values as yes-or-no questions, so each `if` reads like a sentence.
    language: js
    template: |
      const {{1}} = user.role === "admin";
      const {{2}} = invoice.paidAt !== null;
      if (isAdmin) {
        showExportButton();
      }
      if (hasPaid) {
        hideReminder();
      }
    blanks:
      - key: '1'
        answer: isAdmin
      - key: '2'
        answer: hasPaid
    bank: [isAdmin, hasPaid, admin, paid, flag, check]

  - type: code-challenge
    id: write-inactive-names
    concept: clean.name-length-and-scope
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      `chk(u, d)` works, but its names say nothing. Rename it to
      `inactiveUserNames(users, today)`. It returns the names of users whose `lastLoginDay`
      is more than 30 days before `today`.


      Give the loop variable and the list real names too. The behaviour stays the same.
    hints:
      - Every name in the function is a single letter. Start from the one callers see.
      - '`u` holds users, `d` is today, `x` collects names, and `i` is one user.'
      - 'Start with `function inactiveUserNames(users, today) {` and `const names = [];`'

  - type: explain-back
    id: explain-lying-name
    concept: clean.intent-revealing-names
    difficulty: 3
    prompt: >-
      Why is a misleading name, like `isValid` holding a list, more dangerous than a short
      one like `x`?
    rubric:
      - A reader trusts a name and stops checking what the value really is.
      - A short name at least warns you to look closer.
      - A wrong name leads to wrong code that still looks right in review.
    modelAnswer: >-
      A name like `x` tells you nothing, so you check what it holds. A name like `isValid`
      tells you something false, and you believe it. You write `if (isValid)` and it looks
      right to everyone. The bug hides behind a name that sounds correct.

recap:
  - Name values and functions by what they're for.
  - Use one word per idea, and name booleans as questions.
  - Match a name's length to how far it travels.
recall:
  - id: card-intent
    concept: clean.intent-revealing-names
    front: What question should a good name answer?
    back: >-
      What the value is for, or what the function does, so no one needs to open it.
  - id: card-boolean
    concept: clean.intent-revealing-names
    front: How do you name a boolean so conditions read well?
    back: >-
      As a yes-or-no question, such as `isActive`, `hasPaid` or `canEdit`.
  - id: card-vocabulary
    concept: clean.consistent-vocabulary
    front: Why pick one verb, such as `get`, for every function of the same kind?
    back: >-
      Readers assume different words mean different jobs. One word per idea keeps that
      promise.
  - id: card-length
    concept: clean.name-length-and-scope
    front: When is a one-letter name fine?
    back: >-
      When the variable lives for a line or two, like a loop variable. The wider it
      travels, the fuller the name.

references:
  - kind: essay
    title: Two Hard Things
    authors: Martin Fowler
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/TwoHardThings.html
    note: The famous joke about naming being hard, and why it keeps being true.
    verified: true
  - kind: docs
    title: Rename Variable
    authors: Martin Fowler
    venue: Refactoring catalog
    url: https://refactoring.com/catalog/renameVariable.html
    note: The refactoring move itself, with its mechanics.
    primary: true
    verified: true
  - kind: docs
    title: Naming conventions
    authors: Google
    venue: Google JavaScript Style Guide
    url: https://google.github.io/styleguide/jsguide.html#naming
    note: Concrete rules for names in JavaScript, including when abbreviations are allowed.
    primary: true
    verified: true

deepDive: >-
  Units belong in names when a number has one: `timeoutMs`, `sizeBytes`, `priceInPence`.
  Many real outages came from a value read in the wrong unit.


  Every language has its own casing conventions, and following them matters as much as the
  words. JavaScript and TypeScript use `camelCase` for values and functions and `PascalCase`
  for classes. Python uses `snake_case` for values and functions and `PascalCase` for
  classes. Constants are often `UPPER_SNAKE_CASE` in all three.


  A name that is hard to choose is often a design signal. If you can't name a function
  without "and", it probably does two jobs. The lesson on small functions picks that up.
