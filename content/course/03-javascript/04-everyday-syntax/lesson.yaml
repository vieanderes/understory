id: js.everyday-syntax
title: Everyday syntax
objective: "Combine conditions with `&&`, `||` and `!`, read `?.` and `??`, and steer code with `switch`, `break` and `continue`."
level: essential
minutes: 10
concepts: [js.logical-operators, js.optional-chaining, js.switch, js.loop-control]
prerequisites: [js.built-in-toolbox]
opening:
  text: >-
    You'll write conditions with more than one part, and read missing data without a crash.
    These few symbols turn up in almost every file you'll open.

steps:
  - type: prose
    id: name-logical-operators
    body: |-
      Real rules have more than one part. A shop delivers free over 50, or to members:

      ```js
      if (total >= 50 || isMember) { ... }
      ```

      `||` means "or": true if either side is. `&&` means "and": true only if both are. `!`
      flips a value, so `!true` is `false`. Together they're the **logical operators**.

  - type: playground
    id: fix-cinema-entry
    concept: js.logical-operators
    difficulty: 1
    prompt: >-
      Bug report: a 15-year-old who came with a parent was turned away. The rule is 16 or
      over, or younger with an adult. Fix the condition on line 4.
    html: |
      <h1>Screen 2: tickets</h1>
      <p id="entry"></p>
    js: |
      const age = 15;
      const withAdult = true;
      const entry = document.querySelector("#entry");
      if (age >= 16 && withAdult) {
        entry.textContent = "Welcome in";
      } else {
        entry.textContent = "Sorry, no entry";
      }
    editable: [js]
    checks:
      - label: The page lets them in
        selector: '#entry'
        text: Welcome in
    solution:
      js: |
        const age = 15;
        const withAdult = true;
        const entry = document.querySelector("#entry");
        if (age >= 16 || withAdult) {
          entry.textContent = "Welcome in";
        } else {
          entry.textContent = "Sorry, no entry";
        }
    hints:
      - The rule says "or". Which operator does line 4 use?
      - '`&&` needs both sides true. Being 15 makes the left side false.'
      - Swap `&&` for `||`.

  - type: prose
    id: name-conditional-operator
    body: |-
      Sometimes an `if` only picks between two values. One line can do that:

      ```js
      const word = count === 1 ? "item" : "items";
      ```

      Read it as a question. Is `count` 1? Then `"item"`. If not, `"items"`. That's the
      **conditional operator**, often called the ternary: a test, `?`, one value, `:`, the
      other.

  - type: playground
    id: fix-item-plural
    concept: js.logical-operators
    difficulty: 2
    prompt: >-
      Bug report: with one thing in it, the basket says "1 items". Use `? :` inside
      `basketText` so 1 says "item" and 3 still says "items".
    html: |
      <p id="one"></p>
      <p id="three"></p>
    js: |
      function basketText(count) {
        return count + " items in your basket";
      }
      document.querySelector("#one").textContent = basketText(1);
      document.querySelector("#three").textContent = basketText(3);
    editable: [js]
    checks:
      - label: 1 says "1 item in your basket"
        selector: '#one'
        text: 1 item in your basket
      - label: 3 says "3 items in your basket"
        selector: '#three'
        text: 3 items in your basket
    solution:
      js: |
        function basketText(count) {
          const word = count === 1 ? "item" : "items";
          return count + " " + word + " in your basket";
        }
        document.querySelector("#one").textContent = basketText(1);
        document.querySelector("#three").textContent = basketText(3);
    hints:
      - The word "items" is fixed inside the text. It needs to depend on `count`.
      - 'Ask a question with `count === 1`, then give two answers.'
      - 'Write `const word = count === 1 ? "item" : "items";` and build the text from it.'

  - type: prose
    id: name-chaining-and-nullish
    body: >-
      Data often has gaps. `order.address.city` throws a `TypeError` when there's no address.
      `order.address?.city` doesn't: `?.` is **optional chaining**, and it gives `undefined`
      when the thing before it is `null` or `undefined`.


      To fill a gap, use `??`: `x ?? "none"` gives `"none"` only for `null` or `undefined`.
      `||` fills in for every falsy value, so `0 || 5` is 5, while `0 ?? 5` stays 0.

  - type: ai-review
    id: review-or-default
    concept: js.optional-chaining
    difficulty: 3
    language: js
    request: Charge for each line of an order. Lines with no quantity count as one.
    flawClass: logic
    code: |
      function lineTotal(line) {
        const quantity = line.quantity || 1;
        return line.pence * quantity;
      }
    prompt: >-
      The tests used quantities of 2 and 3, and a line with no quantity. All passed. Now a
      free sample, with a quantity of 0, is billed for one. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`||` swaps out `0` as well as a missing value'
        correct: true
        feedback: >-
          Yes. `0 || 1` is `1`. Use `??`, which only steps in for `null` or `undefined`.
      - text: '`line.pence` should come first'
        feedback: >-
          Multiplication doesn't care about order. The quantity is what turned into a 1.
      - text: A missing quantity should throw
        feedback: >-
          The request says to count it as one. The flaw is that a real 0 counts as one too.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'A line with a quantity of 0'
          correct: true
          feedback: >-
            Right. Zero is where `||` and `??` disagree.
        - text: 'A line with a quantity of 5'
          feedback: >-
            Like the 2 and 3 already tested, 5 is truthy, so `||` keeps it.
        - text: 'A line with no quantity'
          feedback: >-
            That test passed already. A missing quantity should become 1, and it does.
    fix: |
      const quantity = line.quantity ?? 1;   // 0 stays 0

  - type: prose
    id: name-switch-and-loop-control
    body: >-
      A **switch** compares one value with each `case`, using `===`, and starts at the first
      match. It then runs on through the cases below until it meets a `break`. `default` runs
      when nothing matches.


      `break` works in loops too: it leaves the loop at once. `continue` skips the rest of
      this turn and moves on to the next item.

  - type: playground
    id: fix-inbox-skip
    concept: js.loop-control
    difficulty: 3
    prompt: >-
      Bug report: the inbox shows only Sam. Muted senders should be skipped, not end the
      list. Change one word in the loop.
    html: |
      <h1>Inbox</h1>
      <p>New messages from: <span id="senders"></span></p>
    js: |
      const messages = [
        { from: "Sam", muted: false },
        { from: "Promo bot", muted: true },
        { from: "Lee", muted: false },
        { from: "Ada", muted: false },
      ];
      const shown = [];
      for (const message of messages) {
        if (message.muted) break;
        shown.push(message.from);
      }
      document.querySelector("#senders").textContent = shown.join(", ");
    editable: [js]
    checks:
      - label: 'The inbox shows Sam, Lee, Ada'
        selector: '#senders'
        text: Sam, Lee, Ada
    solution:
      js: |
        const messages = [
          { from: "Sam", muted: false },
          { from: "Promo bot", muted: true },
          { from: "Lee", muted: false },
          { from: "Ada", muted: false },
        ];
        const shown = [];
        for (const message of messages) {
          if (message.muted) continue;
          shown.push(message.from);
        }
        document.querySelector("#senders").textContent = shown.join(", ");
    hints:
      - The loop stops for good at the first muted sender.
      - One keyword leaves the loop. The other only skips this turn.
      - Swap `break` for `continue`.

  - type: code-challenge
    id: write-shipping-label
    concept: js.optional-chaining
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `shippingLabel(order)`. It returns `'name - city - fee'`. An order may have no
      `address`, or an address with no `city`. Neither may throw, and both read as
      `'no address'`. An empty city string stays as it is.


      The fee follows `order.shipping`: `'standard'` is 3, `'express'` is 8, anything else is 0.


      So a standard order for Ana in Leeds gives `'Ana - Leeds - 3'`.
    hints:
      - Read the city with `?.` in two places, then fill the gap with `??`.
      - A `switch` on `order.shipping` picks the fee. Give each case a `break`, and add a `default`.
      - "Start with `const city = order.address?.city ?? 'no address';`"

  - type: explain-back
    id: explain-two-cases-run
    concept: js.switch
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A teammate's `switch` logs two messages for one status, and they say the switch is
      broken. What's happening, and what stops it?
    rubric:
      - A `switch` starts at the first matching `case` and keeps running into the cases below it.
      - Only `break` (or `return`) leaves the switch, so a case without one runs on.
      - Add a `break` to each case, or return from each, and only one case runs.
    modelAnswer: >-
      The switch isn't broken. It finds the first `case` that matches and runs from there. It
      carries on through the cases below until it meets a `break`. That case had no `break`,
      so the next one ran as well. Adding a `break` at the end of each case stops it. A
      `return` does the same inside a function.

recap:
  - Combine conditions with `&&` and `||`, flip one with `!`, and pick a value with `? :`.
  - Read `a?.b` as "b, if a is there", and `x ?? y` as "y only for null or undefined".
  - Expect a `switch` to run on until a `break`, and skip or stop a loop with `continue` and `break`.

recall:
  - id: card-and-or
    concept: js.logical-operators
    front: When is `a && b` true, and when is `a || b` true?
    back: >-
      `a && b` is true only when both are. `a || b` is true when at least one is.
  - id: card-conditional-operator
    concept: js.logical-operators
    front: 'What does `a ? b : c` give?'
    back: >-
      `b` when `a` is truthy, `c` when it isn't. It's an `if` that picks one of two values.
  - id: card-nullish-vs-or
    concept: js.optional-chaining
    front: When do `x ?? y` and `x || y` give different answers?
    back: >-
      When `x` is `0`, `''` or `false`. `||` swaps those for `y`; `??` keeps them and only swaps
      `null` or `undefined`.
  - id: card-switch-break
    concept: js.switch
    front: What happens in a `switch` when a matching case has no `break`?
    back: >-
      It runs on into the next case's body, and keeps going until a `break` or the end of the
      switch.
  - id: card-continue-or-break
    concept: js.loop-control
    front: What's the difference between `continue` and `break` in a loop?
    back: >-
      `continue` skips the rest of this turn and goes on to the next. `break` leaves the loop
      altogether.

