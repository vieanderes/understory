id: python.report-tool
title: Build a report tool
objective: Build a command-line tool that reads a JSON file of eval results, prints a report and exits with a code CI can trust.
level: essential
minutes: 10
concepts: [python.command-line-args, python.exit-codes]
prerequisites: [python.type-hints]
opening:
  text: >-
    You'll put the whole chapter to work in a real tool: a script that reads eval results
    from a JSON file and reports on them. AI teams write small tools like this every week.

steps:
  - type: prose
    id: the-tool
    body: |-
      Eval results often land in a JSON file, one record per test case:

      ```json
      [
        {"id": "t1", "category": "refunds", "passed": true},
        {"id": "t2", "category": "refunds", "passed": false},
        {"id": "t3", "category": "billing", "passed": true}
      ]
      ```

      You'll write `report.py`. Run as `python3 report.py results.json`, it prints how many
      cases passed and which category is weakest. First, the part that does the counting.

  - type: code-challenge
    id: write-report-lines
    concept: python.sorting-with-key
    difficulty: 4
    language: python
    starter: lines.starter.py
    solution: lines.solution.py
    tests: lines.tests.py
    editable: '11-12'
    prompt: >-
      Write `report(results)`, returning two lines. The first says how many passed. The
      second names the category with the lowest pass rate, the first one on a tie. No
      results gives `["No results"]`.


      Example: the three records above give `["2 of 3 passed", "Weakest: refunds, 1 of 2
      passed"]`.
    hints:
      - 'Count per category in two dicts, one for cases and one for passes, as in the dicts lesson.'
      - '`min` with a `key` picks the category whose passes divided by cases is lowest.'
      - 'Start with `if not results:`, then loop with `cases[c] = cases.get(c, 0) + 1`.'

  - type: prose
    id: sys-argv
    body: |-
      Now the command line. `sys` is a standard-library module about the running program.
      When you run `python3 report.py results.json`, Python puts the words after `python3`
      in a list, `sys.argv`:

      ```python
      import sys

      print(sys.argv)   # ['report.py', 'results.json']
      ```

      Item 0 is the script itself. The file name you typed is `sys.argv[1]`.

  - type: bug-hunt
    id: hunt-argv-zero
    concept: python.command-line-args
    difficulty: 2
    language: python
    code: |
      import json
      import sys
      from pathlib import Path

      path = Path(sys.argv[0])
      results = json.loads(path.read_text())
    prompt: '`python3 report.py results.json` fails with `JSONDecodeError: Expecting value`. Tap the line at fault.'
    lines: [5]
    reasons:
      - text: '`sys.argv[0]` is the script, not the file'
        correct: true
        feedback: >-
          Right. It reads `report.py` itself. The file you typed is `sys.argv[1]`.
      - text: '`read_text` needs a `with` block'
        feedback: >-
          `read_text` opens and closes the file itself. The trouble is which file.
      - text: The JSON file is broken
        feedback: >-
          The JSON is fine. The code never opens it: it reads the script instead.
    fix: |
      path = Path(sys.argv[1])

  - type: prose
    id: exit-codes
    body: |-
      Put the work in `main(argv)`, and hand it `sys.argv` under the guard:

      ```python
      def main(argv):
          if len(argv) != 2:
              print("usage: report.py FILE")
              return 2
          ...
          return 0

      if __name__ == "__main__":
          sys.exit(main(sys.argv))
      ```

      Tests can then call `main` with any list. `sys.exit` ends the program with the number
      `main` returned, its **exit code**: 0 means success, anything else a failure. Shells
      and CI read it.

  - type: ai-review
    id: review-exit-zero
    concept: python.exit-codes
    difficulty: 3
    language: python
    request: Write main(argv) for the report tool, and handle a missing file.
    flawClass: edge-case
    code: |
      def main(argv):
          path = Path(argv[1])
          if not path.exists():
              print(f"No such file: {path}")
              return 0
          results = json.loads(path.read_text())
          for line in report(results):
              print(line)
          return 0
    prompt: >-
      An assistant wrote this. In CI, a typo in the file name printed an error, yet the build
      went green. Tap the line at fault.
    lines: [5]
    reasons:
      - text: It exits with 0, which means success
        correct: true
        feedback: >-
          Right. Return 1, and CI sees the failure.
      - text: It should raise instead of printing
        feedback: >-
          A clear message is kind to people. CI only reads the exit code, and it said success.
      - text: '`path.exists()` checks the wrong file'
        feedback: >-
          It checks the file named on the command line, as it should.
    fix: |
      def main(argv):
          path = Path(argv[1])
          if not path.exists():
              print(f"No such file: {path}")
              return 1
          results = json.loads(path.read_text())
          for line in report(results):
              print(line)
          return 0

  - type: code-challenge
    id: write-main
    concept: python.exit-codes
    difficulty: 3
    language: python
    starter: main.starter.py
    solution: main.solution.py
    tests: main.tests.py
    editable: '12-13'
    prompt: >-
      Write `main(argv)` for `report.py`. Given a file name, print each line of `report`
      for its results and return 0. Given no file name, print `usage: report.py FILE` and
      return 2. For a missing file, print `No such file: NAME` and return 1.
    hints:
      - 'The exit codes step checks `len(argv)` first, then does the work.'
      - 'The file name is `argv[1]`. `Path(...).exists()` tells you whether it is there.'
      - 'After the checks, load it with `json.loads(Path(argv[1]).read_text())` and print each line.'

  - type: explain-back
    id: explain-main-argv
    concept: python.command-line-args
    difficulty: 3
    prompt: >-
      Why does `main` take `argv` as a parameter instead of reading `sys.argv` inside?
    rubric:
      - Tests can call `main` with any list they like.
      - No real command line or terminal is needed to test it.
      - The guard passes in the real `sys.argv` when the file is run.
    modelAnswer: >-
      With `argv` as a parameter, a test can call `main(["report.py", "x.json"])`. It checks
      what `main` prints and returns, with no terminal at all. When the file is run for real,
      the guard hands in `sys.argv`, so the tool works the same way.

recap:
  - Turn records from a JSON file into a short report, with dicts, `min` and f-strings.
  - Read the file name from `sys.argv[1]`, and keep the work in a testable `main(argv)`.
  - Exit with 0 for success and another number for failure, so CI can trust the tool.
recall:
  - id: card-argv
    concept: python.command-line-args
    front: In `python3 report.py results.json`, what are `sys.argv[0]` and `sys.argv[1]`?
    back: >-
      `"report.py"`, the script itself, and `"results.json"`, the first argument.
  - id: card-exit-code
    concept: python.exit-codes
    front: What does an exit code of 0 tell a shell or CI?
    back: >-
      That the program succeeded. Any other number means it failed.
  - id: card-sys-exit
    concept: python.exit-codes
    front: How does a script end with the exit code that `main` returns?
    back: >-
      `sys.exit(main(sys.argv))`, under `if __name__ == "__main__":`.

references:
  - kind: docs
    title: sys — System-specific parameters and functions
    authors: Python Software Foundation
    venue: The Python Standard Library
    url: https://docs.python.org/3/library/sys.html#sys.argv
    note: '`sys.argv`, and `sys.exit` with an exit status.'
    primary: true
    verified: true
  - kind: docs
    title: argparse — Parser for command-line options, arguments and subcommands
    authors: Python Software Foundation
    venue: The Python Standard Library
    url: https://docs.python.org/3/library/argparse.html
    note: The standard way to accept flags, help text and several arguments.
    verified: true

deepDive: >-
  **Make it a project.** In a uv project, run the tool with `uv run report.py results.json`,
  lint it with `uvx ruff check` and type-check it with `uvx mypy report.py`. Give `report`
  the hint `list[Result]` with a `TypedDict`, and mypy catches a misspelt key such as
  `r["pased"]`.


  **More arguments.** Past one or two arguments, reach for `argparse`: it reads flags such
  as `--min-rate 0.8`, writes `--help` for you and exits with code 2 on bad input, the same
  convention used here. Errors belong on standard error, `print(..., file=sys.stderr)`, so
  they don't mix with the report when output is piped into another tool.
