id: ts.advanced-types
title: Deriving types
objective: Build types from one source with `typeof`, `as const`, `satisfies` and helpers like `Partial` and `Omit`.
level: essential
minutes: 10
concepts: [ts.keyof-and-typeof, ts.utility-types, ts.satisfies]
prerequisites: [ts.generics]
opening:
  text: >-
    You'll write a list of options once and let every type that depends on it follow. Then
    adding an option in one place stops being a bug in three others.

steps:
  - type: prose
    id: derive-from-values
    body: |-
      When the same list lives in three places, one of them goes stale. Better to write it
      once and derive the rest. Used in a type, `typeof` gives the type of a value:

      ```ts
      const defaults = { theme: "light", fontSize: 16 };
      type Settings = typeof defaults;
      // { theme: string; fontSize: number }
      ```

      Add `keyof` from the last lesson, and you get the property names too.

  - type: predict-output
    id: predict-keyof-typeof
    concept: ts.keyof-and-typeof
    difficulty: 1
    language: ts
    code: |
      const PRICES = { small: 45, medium: 120, large: 300 };
      type Size = keyof typeof PRICES;

      function priceOf(size: Size): number {
        return PRICES[size];
      }
      priceOf("huge");
    question: Nobody wrote a list of sizes. What does the checker say about the last line?
    choices:
      - text: 'An error: `"huge"` isn''t one of the sizes'
        correct: true
        feedback: >-
          Right. `Size` is worked out from the keys of the price table itself.
      - text: Nothing, and it returns `undefined`
        feedback: >-
          That would need `Size` to be `string`. It's the three keys: `"small" | "medium" | "large"`.
      - text: An error on line 2 instead
        feedback: >-
          `typeof PRICES` gives the type of the value, and `keyof` then takes its keys.

  - type: prose
    id: as-const-lists
    body: |-
      A list of options is a value too. `as const` tells the checker it will never change, so
      it keeps each exact string:

      ```ts
      const SIZES = ["small", "medium", "large"] as const;
      type Size = (typeof SIZES)[number];
      // "small" | "medium" | "large"
      ```

      `[number]` means "the type of any item". Without `as const`, `Size` would be plain
      `string`. It's the one `as` that's safe: it only makes a type narrower.

  - type: fill-blank
    id: fill-roles-union
    concept: ts.keyof-and-typeof
    difficulty: 2
    language: ts
    prompt: >-
      Make `ROLES` the only list of roles, so adding one updates the `Role` type too.
    template: |
      const ROLES = ["viewer", "editor", "owner"] {{1}};
      type Role = ({{2}} ROLES)[{{3}}];

      function canEdit(role: {{4}}): boolean {
        return role !== "viewer";
      }
    blanks:
      - key: '1'
        answer: as const
      - key: '2'
        answer: typeof
      - key: '3'
        answer: number
      - key: '4'
        answer: Role
    bank: [as const, as string, typeof, keyof, number, string, Role, ROLES]

  - type: prose
    id: utility-helpers
    body: |-
      TypeScript ships helpers that make a new type from one you have. They're called
      **utility types**:

      ```ts
      type User = { id: string; name: string; email: string; passwordHash: string };
      type UserUpdate = Partial<User>;             // every property optional
      type PublicUser = Omit<User, "passwordHash">; // all but one
      type Contact = Pick<User, "name" | "email">;  // only these two
      type Scores = Record<string, number>;         // any keys, number values
      ```

      When `User` gains a property, all four follow.

  - type: bug-hunt
    id: hunt-omit-leak
    concept: ts.utility-types
    difficulty: 2
    language: ts
    code: |
      type User = { name: string; email: string; passwordHash: string };
      type PublicUser = Omit<User, "passwordHash">;

      function toPublic(user: User): PublicUser {
        return user;
      }

      const shown = toPublic({ name: "Ada", email: "ada@example.com", passwordHash: "x9f2" });
      console.log(JSON.stringify(shown));
      // {"name":"Ada","email":"ada@example.com","passwordHash":"x9f2"}
    prompt: >-
      This compiles, yet the public profile still carries the password hash. Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: '`Omit` changes the type, not the object'
        correct: true
        feedback: >-
          Right. Types are erased. Removing the hash takes real code.
      - text: '`Omit` should list `name` and `email` instead'
        feedback: >-
          That's `Pick`. Either way it's only a type, and the object keeps every property.
      - text: The checker should reject the extra `passwordHash`
        feedback: >-
          A `User` has everything a `PublicUser` needs. Extras fit by shape.
    fix: |
      function toPublic(user: User): PublicUser {
        return { name: user.name, email: user.email };
      }

  - type: prose
    id: satisfies-checks-and-keeps
    body: |-
      An annotation replaces what the checker inferred. `satisfies` checks a value against a
      type and keeps the inferred type:

      ```ts
      const PRICES = { small: 45, large: 300 } satisfies Record<Size, number>;
      // Property 'medium' is missing in type '{ small: number; large: number; }'
      // but required in type 'Record<"small" | "medium" | "large", number>'.
      ```

      Add a size to `SIZES`, and every table marked like this asks for its price.

  - type: code-challenge
    id: fix-new-size
    concept: ts.satisfies
    difficulty: 2
    language: ts
    starter: sizes.starter.ts
    solution: sizes.solution.ts
    tests: sizes.tests.ts
    expectStarterTypeError: true
    prompt: >-
      Someone added `"xl"` to `SIZES`, and the checker underlines both tables. Fill them in:
      an XL costs 450 and its label is `"XL"`.
    hints:
      - Read the red underline on the `PRICES` line. Which property does it say is missing?
      - '`satisfies Record<Size, number>` wants a price for every size in `SIZES`.'
      - 'Start with `xl: 450` inside `PRICES`.'

  - type: code-challenge
    id: write-apply-changes
    concept: ts.utility-types
    difficulty: 3
    language: ts
    prompt: >-
      Write `applyChanges(profile, changes)`. `changes` is a `Partial<Profile>` from a settings
      form. Return a new profile with the sent fields changed.


      A field sent as `undefined` means "not changed". The starter compiles, yet
      `{ name: undefined }` wipes out the name. An age of `0` is a real change.
    hints:
      - 'Spreading `{ name: undefined }` copies the `undefined` over the old name.'
      - Copy the profile first, then change one field at a time.
      - 'Start with `const result = { ...profile };` then `if (changes.name !== undefined) result.name = changes.name;`.'

  - type: explain-back
    id: explain-one-source
    concept: ts.satisfies
    difficulty: 3
    prompt: |-
      ```ts
      type Size = "small" | "medium" | "large";
      const SIZES: Size[] = ["small", "medium", "large"];
      const PRICES: Record<string, number> = { small: 45, large: 300 };
      ```

      Three lists, each written by hand. `medium` reached two of them, so it ships with no
      price. How does deriving everything from one list turn that into a type error?
    rubric:
      - Separate declarations have no link, so one can go stale unnoticed.
      - '`(typeof SIZES)[number]` works the union out from the list, so the list is the one source.'
      - '`satisfies Record<Size, number>` then demands a price for every size.'
    modelAnswer: >-
      Each list was its own declaration, so the checker saw three unrelated facts and couldn't
      know one was stale. Deriving the type from the list with `(typeof SIZES)[number]` makes
      the list the only source. Add a size, and `satisfies Record<Size, number>` insists on a
      price for it. The edit won't compile until everything agrees.

recap:
  - Derive a union from a list with `as const` and `typeof`.
  - Make related types with `Partial`, `Pick`, `Omit` and `Record`.
  - Check a table with `satisfies` and keep its exact keys.

recall:
  - id: card-tuple-to-union
    concept: ts.keyof-and-typeof
    front: 'How do you get `"small" | "large"` from `const SIZES = ["small", "large"] as const`?'
    back: >-
      `(typeof SIZES)[number]`. Without `as const`, the list is `string[]` and you'd get
      `string`.
  - id: card-omit-at-run-time
    concept: ts.utility-types
    front: You return a `User` typed as `Omit<User, "passwordHash">`. Is the hash gone?
    back: >-
      No. Types are erased, and the object still has it. Build a new object without it.
  - id: card-partial-undefined
    concept: ts.utility-types
    front: 'Why can `{ ...profile, ...changes }` with a `Partial<Profile>` wipe out a field?'
    back: >-
      A property may be sent as `undefined`, and spread copies it over the old value.
  - id: card-satisfies-or-annotation
    concept: ts.satisfies
    front: What does `satisfies` keep that an annotation throws away?
    back: >-
      The inferred type, with its exact keys. An annotation replaces it with the wider type.

