term: alerting
aka: [alert, alert rule, paging alert]
short: Rules that notify a person, or wake them, when a measured signal shows users are being hurt.
explain: |
  Nobody watches dashboards at 3 a.m. Something has to tell a person when things break.

  Good rules page only for user-visible problems that need action now: checkout failing,
  the error budget burning fast. Everything else becomes a ticket or a dashboard. Alert on
  symptoms, such as errors users see, rather than causes, such as high CPU. Too many alerts
  and people learn to ignore them, including the real one.
analogy: A smoke alarm. Useful because it's quiet when you're making toast and loud when there's a fire.
example:
  language: yaml
  code: |
    alert: CheckoutErrorsHigh
    expr: rate(checkout_errors[5m]) / rate(checkout_requests[5m]) > 0.02
    for: 5m
    labels: { severity: page }
usage: That alerting rule woke someone for high CPU with no user impact; make it a ticket.
related: [metrics, slo, on-call, observability]
level: 2
lessons: [cloud.alerts-and-on-call]
