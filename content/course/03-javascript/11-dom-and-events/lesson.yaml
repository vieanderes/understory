deepDive: >-
  An event actually travels twice. First it goes down from the window to the target, the
  capture phase, then back up, the bubble phase. Listeners run on the way up unless you pass
  `{ capture: true }`. `event.eventPhase` says which leg is running.


  `event.stopPropagation()` stops the bubbling, so ancestors never hear the event. It doesn't
  cancel the default action, and `preventDefault()` doesn't stop bubbling: they are separate
  switches. Use `stopPropagation` sparingly, because it breaks delegated listeners further up.


  Not every event bubbles. `focus`, `blur`, `mouseenter` and `mouseleave` don't, so a delegated
  listener never hears them. `focusin` and `focusout` are the bubbling versions of focus and
  blur.


  `{ once: true }` removes a listener after its first run. `removeEventListener` removes one by
  hand, but only when given the very same function, so an arrow written twice doesn't match.
  `{ passive: true }` promises never to call `preventDefault`, which lets the browser scroll
  without waiting on a wheel or touch listener.
