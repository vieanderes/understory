summary: >-
  A **function** is a named piece of work you write once and run whenever you need it. Like a
  recipe, writing it down doesn't cook anything. The work happens when you **call** the
  function: its name followed by brackets, like `cheer()`. Every call runs the code inside
  again.


  Functions become useful with inputs and outputs. **Parameters** are names for the inputs,
  listed in the brackets when you write the function. The values you pass in when you call
  it are called **arguments**. `return` hands a result back to the code that made the call,
  and ends the function on the spot. A function with no `return` gives back `undefined`,
  JavaScript's value for "nothing".


  This is the lesson where programs start to have structure. Instead of one long list of
  instructions, you build small named pieces that each do one job, like `shippingCost` or
  `fullName`, and combine them. Each piece can be read, tested and fixed on its own. Every
  large program you'll ever work on is built this way.
remember:
  - Writing a function only stores the recipe, and the code inside runs each time you call it with brackets.
  - Parameters are the names in the function's brackets, and arguments are the values you pass in a call.
  - '`return` hands a value back to the caller and ends the function straight away.'
  - A function with no `return` gives back `undefined`, even if it shows something with `console.log`.
  - '`console.log` shows a value to a person, while `return` gives it to the program so it can be stored or used.'
  - Variables and parameters made inside a function exist only inside that function.
  - A good function does one job, has a name that says what it gives back, and gives the same result for the same inputs.
sections:
  - title: What happens during a call
    body: |-
      A call like `area(3, 4)` sets off a fixed sequence:

      1. The arguments are worked out. `area(1 + 2, 4)` passes 3, not the text `1 + 2`.
      2. Each parameter is filled with its argument, in order: `width` gets 3, `height` gets
         4.
      3. The code inside the function runs, top to bottom.
      4. When it reaches `return`, the value is handed back, and the call itself is replaced
         by that value.

      Step 4 is the one to picture. Once `area(3, 4)` has run, it's as if the code said `12`
      in its place. That's why a call can go anywhere a value can: in a variable, in maths, in
      a template literal, even as the argument of another call.

      ```js
      function area(width, height) {
        return width * height;
      }
      const floor = area(3, 4);
      console.log(floor + area(2, 2));
      console.log(`Two rooms: ${area(3, 4) + area(5, 2)} square metres`);
      // 16
      // Two rooms: 22 square metres
      ```

      Arguments are matched to parameters by position, not by name. Swap the order of two
      arguments and the function receives them swapped, with no error.

      JavaScript is relaxed about the number of arguments. Pass too few and the missing
      parameters hold `undefined`. Pass too many and the extras are ignored.

      ```js
      function greet(name) {
        console.log(`Hello, ${name}`);
      }
      greet();
      greet("Sam", "Ada");
      // Hello, undefined
      // Hello, Sam
      ```

      Neither mistake stops the program, so the first sign is often a strange word like
      `undefined` in the output. When you see it, check the call: is every argument there,
      and in the right order?
  - title: '`return` ends the function, and how to use that'
    body: |-
      `return` does two things at once: it hands back a value, and it stops the function.
      Once a `return` runs, no code after it in the function executes.

      You can use that on purpose. Deal with the special cases first, returning early, and
      the rest of the function only handles the normal case. An early `return` like this is
      called a **guard clause**, because it guards the code below it.

      ```js
      function deliveryCost(total) {
        if (total >= 50) {
          return 0;
        }
        return 5;
      }
      console.log(deliveryCost(60));
      console.log(deliveryCost(20));
      // 0
      // 5
      ```

      This does the same as the `if` and `else` version from the code challenge. When the
      total is 50 or more, the first `return` ends the function, so the last line never runs.
      Otherwise the `if` is skipped and the function reaches `return 5`. Both versions are
      correct. Guard clauses shine when there are several special cases, because the main
      logic doesn't end up buried inside layers of `else`.

      A guard clause also handles bad input before it causes trouble:

      ```js
      function pricePerPerson(total, people) {
        if (people <= 0) {
          return 0;
        }
        return total / people;
      }
      console.log(pricePerPerson(60, 4));
      console.log(pricePerPerson(60, 0));
      // 15
      // 0
      ```

      Without the guard, dividing by zero would return `Infinity`, which would then travel
      through the rest of the program.

      One trap: `return` inside a loop ends the whole function, not only the loop. That's
      handy when you're searching and can stop at the first match, and a bug when you meant
      to keep going.
  - title: Scope, and why functions shouldn't reach outside
    body: |-
      Variables made inside a function, and its parameters, are **local**: they exist only
      while that call runs, and only inside the function.

      ```js
      function makeLabel(item) {
        const label = `Item: ${item}`;
        return label;
      }
      console.log(makeLabel("lamp"));
      console.log(label);
      ```

      The first `console.log` shows `Item: lamp`. The second stops with
      `ReferenceError: label is not defined`, because `label` belonged to the call, which has
      finished. To use a result outside, return it.

      Local names are a feature. Two functions can each have a variable called `total`
      without clashing, so you can write one function without knowing the names used inside
      every other.

      The other direction is allowed: a function can read, and even change, variables made
      outside it. Changing them is where trouble starts.

      ```js
      let points = 0;
      function addPointsBadly(amount) {
        points = points + amount;
      }
      function addPoints(current, amount) {
        return current + amount;
      }
      addPointsBadly(10);
      points = addPoints(points, 5);
      console.log(points);
      // 15
      ```

      Both work here. But `addPointsBadly` quietly changes something outside itself, which is
      called a **side effect**. To know what it does, you have to know about `points`, and
      calling it twice by accident adds the points twice, with no clue in the call itself.
      `addPoints` only uses its inputs and returns a result. A function like that, same
      inputs in, same result out, no side effects, is called a **pure function**. It's the
      kind that's simplest to understand, reuse and test.
  - title: Why programs are built from small functions
    body: |-
      A function gives a piece of work a name. `shippingCost(total)` tells a reader what
      happens without making them read the `if` inside. Good function names describe what
      the function gives back or does, often starting with a verb: `formatPrice`,
      `calculateTotal`, `isValidEmail`.

      Functions also let you avoid repeating yourself. If the same five lines appear in three
      places, a change has to be made three times, and one copy gets missed. Put the lines in
      a function and there's one copy to fix.

      Small functions can call each other, which is how bigger jobs get built from smaller
      ones:

      ```js
      function itemsCost(price, quantity) {
        return price * quantity;
      }
      function shippingCost(total) {
        if (total >= 50) {
          return 0;
        }
        return 5;
      }
      function orderTotal(price, quantity) {
        const items = itemsCost(price, quantity);
        return items + shippingCost(items);
      }
      console.log(orderTotal(12, 2));
      console.log(orderTotal(12, 5));
      // 29
      // 60
      ```

      Each function does one job and can be checked on its own. That's exactly what the tests
      in the code challenge did: they called `shippingCost` with 60, 50, 49 and 10 and
      checked each returned value. They couldn't have done that if the function only showed
      its result with `console.log`. Returning values is what makes code testable.

      One more detail you may notice in real code: a function written with the `function`
      keyword can be called on a line above the one where it's written. JavaScript sets these
      functions up before running any code, a behaviour called **hoisting**. Most teams still
      write functions before they're used, because top-to-bottom code is easier to follow.
pitfalls:
  - '**Writing a function and never calling it.** The code inside only runs on a call, so nothing happens. Add a line with the name and brackets, like `cheer();`.'
  - '**Forgetting `return`.** `width * height;` on its own works out the answer and throws it away, so the call gives `undefined`. Put `return` in front of the value you want back.'
  - '**Using `console.log` where `return` was needed.** The value appears in the output, so it looks done, but the caller gets `undefined`. Return the value, and let the caller decide whether to show it.'
  - '**Writing code after `return`.** Once a `return` runs, the lines after it never execute, so a final `console.log` there stays silent. Move it above the `return`.'
  - '**Calling without brackets.** `cheer;` names the function but doesn''t run it. A call always needs brackets, even with no arguments: `cheer();`.'
  - '**Passing arguments in the wrong order.** Arguments match parameters by position, so `area(height, width)` swaps them silently. Check the order in the function''s first line.'
interview:
  - question: What's the difference between a parameter and an argument?
    answer: >-
      A parameter is the name in a function's definition, and an argument is the actual
      value passed when the function is called. In `function greet(name)`, `name` is a
      parameter. In `greet("Sam")`, `"Sam"` is the argument, and for that call the parameter
      holds it. Arguments are matched to parameters by position, so order matters. In
      JavaScript a missing argument leaves its parameter as `undefined`, and extra arguments
      are ignored, neither with an error. That flexibility is convenient, but it means a
      wrong call can fail quietly, often showing up later as `undefined` or `NaN` in a
      result. In everyday conversation people mix the two words up, and that's fine, but
      using them precisely helps in code reviews.
  - question: What's the difference between returning a value and logging it?
    answer: >-
      Logging shows a value to a person, and returning hands it back to the program. When a
      function calls `console.log`, the value appears in the console, but the caller receives
      `undefined` and can't use it. With `return`, the call works out to the value, so it can
      be stored, compared, passed to another function or checked by a test. For example,
      `shippingCost(40) + 40` only works if `shippingCost` returns its answer. So functions
      that calculate something should return it, and the decision to show it belongs to the
      code that calls them. Logging inside a function is still useful while debugging, as a
      temporary probe, but it shouldn't replace the return value.
  - question: What is a pure function, and why does it matter?
    answer: >-
      A pure function always gives the same result for the same inputs and changes nothing
      outside itself. A function that takes a price and a quantity and returns their product
      is pure. One that adds to a score variable made outside it has a side effect, so it
      isn't. Pure functions are easier to reason about, because everything they depend on is
      in their parameters. They're simple to test: call with inputs, check the result, no setup.
      And they're safe to reuse and call again. Not everything can be pure, though. Showing
      output, saving data and reading the time all touch the outside world. The usual
      approach is to keep calculations pure and push those effects to the edges of the
      program.
  - question: What is scope?
    answer: >-
      Scope is the part of a program where a name can be used. A variable made with `let` or
      `const` inside a function, or inside any block of curly brackets, can only be used
      there, and parameters are local to their function. Code inside can read names from
      outside, but not the other way round. Scope prevents clashes: two functions can each
      have a `total` without interfering, so you can write one function without knowing the
      names inside every other. It also limits who can change a value, which makes bugs
      easier to trace. The trade-off shows when you need a value later: you have to return
      it, or make the variable in the outer scope, and making too many outer variables
      brings back the clashes scope was meant to prevent.
