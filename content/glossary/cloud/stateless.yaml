term: stateless
aka: [statelessness, stateless service]
short: Describes a service instance that keeps nothing between requests, so any copy can answer any request.
explain: |
  If a server keeps your shopping basket in its memory, every one of your requests must
  reach that server. Lose it and you lose the basket.

  Keep sessions, uploads and caches outside the instance, in a database, a shared cache or
  object storage. Then instances can be added, removed or replaced at any time, and a load
  balancer can send each request anywhere. Sticky sessions hide state rather than remove it.
analogy: A call centre where every agent reads your case from the shared system, so it doesn't matter who answers.
usage: The upload handler writes to local disk, so the service isn't stateless and breaks with two instances.
related: [horizontal-scaling, autoscaling, load-balancer, session, container]
level: 2
lessons: [cloud.scaling-and-cost, sysdesign.the-method]
