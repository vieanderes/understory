id: even-seasons
title: EvenSeasons
topic: binary-search
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: K, type: int }
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A podcast has N episodes in order. Episode I lasts A[I] minutes. They must be split into
  K seasons of consecutive episodes, keeping the order. A season may be empty. A season's
  length is the sum of its episodes, and an empty season lasts 0 minutes.

  Write a function:

  {{signature}}

  that, given an integer K and an array A of N integers, returns the smallest possible
  length of the longest season.

  For example, given K = 3 and A = [20, 10, 30, 20, 20, 20, 20], the function should
  return 60. One split is [20, 10, 30], [20, 20] and [20, 20].

  Given K = 2 and A = [1, 1, 100, 1, 1], the function should return 102.

  Write an **efficient** algorithm for the following assumptions:

  - N and K are integers within the range [1..100,000];
  - each element of array A is an integer within the range [0..10,000].
examples:
  - { args: [3, [20, 10, 30, 20, 20, 20, 20]], expected: 60 }
  - { args: [2, [1, 1, 100, 1, 1]], expected: 102 }
timeLimitMs: 1500
tests:
  - name: extreme_single
    description: one episode
    group: correctness
    cases:
      - { args: [1, [40]], expected: 40 }
      - { args: [5, [40]], expected: 40 }
  - name: many_seasons
    description: K at least N gives the longest episode
    group: correctness
    cases:
      - { args: [10, [30, 50, 20]], expected: 50 }
      - { args: [4, [3, 9, 2, 6]], expected: 9 }
      - { args: [3, [1, 1, 100, 1, 1]], expected: 100 }
  - name: all_equal
    description: equal episodes, all zero minutes
    group: correctness
    cases:
      - { args: [2, [10, 10, 10, 10]], expected: 20 }
      - { args: [3, [10, 10, 10, 10]], expected: 20 }
      - { args: [2, [0, 0, 0, 0]], expected: 0 }
  - name: sorted
    description: ascending and descending episodes
    group: correctness
    cases:
      - { args: [2, [1, 2, 3, 4, 5]], expected: 9 }
      - { args: [2, [5, 4, 3, 2, 1]], expected: 9 }
  - name: extreme_min_max_value
    description: extremes of the value range, zeros between long episodes
    group: correctness
    cases:
      - { args: [2, [10000, 10000, 10000]], expected: 20000 }
      - { args: [1, [0, 10000, 0]], expected: 10000 }
      - { args: [2, [7, 0, 0, 7, 0, 7]], expected: 14 }
  - name: small_random
    description: random episodes, N = 50
    group: correctness
    cases:
      - generate: { seed: 3, args: [{ kind: int, min: 1, max: 10 }, { kind: ints, n: 50, min: 0, max: 100 }] }
      - generate: { seed: 4, args: [{ kind: value, value: 4 }, { kind: ints, n: 40, min: 0, max: 20 }] }
  - name: medium_random
    description: random episodes, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 5, args: [{ kind: value, value: 20 }, { kind: ints, n: 1000, min: 0, max: 50 }] }
  - name: large_equal
    description: equal episodes of 10,000 minutes in 3 seasons, N = 100,000
    group: performance
    cases:
      - generate: { seed: 6, args: [{ kind: value, value: 3 }, { kind: constant, n: 100000, value: 10000 }] }
  - name: large_random
    description: random episodes in 7 seasons, N = 100,000
    group: performance
    cases:
      - generate: { seed: 7, args: [{ kind: value, value: 7 }, { kind: ints, n: 100000, min: 0, max: 10000 }] }
  - name: extreme_large
    description: as many seasons as episodes, N = K = 100,000
    group: performance
    cases:
      - generate: { seed: 8, args: [{ kind: value, value: 100000 }, { kind: ints, n: 100000, min: 0, max: 10000 }] }
