term: DRY
aka:
  - don't repeat yourself
short: The rule that each piece of knowledge should live in exactly one place in the code.
explain: |
  If the VAT rate appears in five files, one day someone updates four. Keeping each fact or
  rule in one place means one change, made once.

  The trap is merging code that only looks alike. Two functions with the same lines but
  different reasons to change aren't duplicated knowledge, and joining them couples them.
  Wait for the third copy, and ask whether they'd change together.
analogy: One family calendar on the fridge, instead of everyone keeping their own and arguing about which is right.
usage: It's not a DRY violation; the two checks look the same but belong to different rules.
twin:
  term: yagni
  difference: DRY says don't repeat what you already have. YAGNI says don't build what you don't need yet. Over-applying DRY often breaks YAGNI, with a general helper for a second case that never comes.
related:
  - yagni
  - abstraction
  - refactoring
level: 1
lessons:
  - clean.duplication
