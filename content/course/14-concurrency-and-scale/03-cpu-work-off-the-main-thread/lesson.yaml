deepDive: >-
  We ran the blocked server in Node 24. A report handler that computed for 2 seconds held a
  health check, sent 10 ms later, for 2,032 ms. With the report on a worker, the health
  check answered in 45 ms.


  Messages are copied with the structured clone algorithm, which handles objects, arrays,
  maps, dates and binary data, but not functions or class methods. Copying a large buffer
  costs time, so some types can be transferred instead: the memory moves to the other
  thread, and the sender can no longer use it. `SharedArrayBuffer` and `Atomics` let
  threads share memory directly, which brings back every race in this chapter at a lower
  level. You'll rarely need them.


  Node had older ways to use more cores. `cluster` starts copies of a whole server that
  share one port, and `child_process` runs another program. Today most apps run several
  copies with their platform instead, and use worker threads for heavy computing inside one.


  Node also keeps its own small pool of helper threads, four by default, for file system
  calls, DNS lookups and some crypto. That's separate from your workers. In the browser, a
  canvas can be handed to a worker with `OffscreenCanvas`, so drawing leaves the page's
  thread too.
