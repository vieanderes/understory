id: css.custom-properties
title: Custom properties
objective: Name values once with custom properties, and switch a whole page to a dark theme.
level: essential
minutes: 10
concepts: [css.custom-properties, css.theming]
prerequisites: [css.responsive-design]
opening:
  text: >-
    You'll rebrand a whole page by changing one line, then give it a dark theme in four. It's
    how design systems keep hundreds of screens in step.

steps:
  - type: prose
    id: name-a-value
    body: |-
      A site's brand colour might appear in 30 rules. Change it, and you hunt through all 30.
      A **custom property** names the value once:

      ```css
      :root { --brand: teal; }
      .button { background: var(--brand); }
      ```

      The name starts with two dashes, and `var(--brand)` reads it. `:root` matches the
      `html` element, the top of the page, so every element can read it.

  - type: playground
    id: rebrand-the-page
    concept: css.custom-properties
    difficulty: 1
    prompt: >-
      The header, the button and the link all read `--brand`. Change its value on `:root`
      from `teal` to `crimson`, and watch all three change at once.
    html: |
      <header>Corner Bookshop</header>
      <p>New this month: <a href="#">twelve crime novels</a> for winter nights.</p>
      <button>Reserve a copy</button>
    css: |
      :root { --brand: teal; }
      body { font-family: sans-serif; }
      header { padding: 16px; background: var(--brand); color: white; }
      a { color: var(--brand); }
      button {
        padding: 8px 16px; border: 0;
        background: var(--brand); color: white;
      }
    editable: [css]
    checks:
      - label: The brand colour is crimson
        selector: html
        style: { property: '--brand', value: crimson }
    solution:
      css: |
        :root { --brand: crimson; }
        body { font-family: sans-serif; }
        header { padding: 16px; background: var(--brand); color: white; }
        a { color: var(--brand); }
        button {
          padding: 8px 16px; border: 0;
          background: var(--brand); color: white;
        }
    hints:
      - Only the first line needs to change.
      - The value comes after `--brand:`.
      - 'Write `:root { --brand: crimson; }`.'

  - type: prose
    id: set-it-lower
    body: |-
      Custom properties inherit, like `color`. Set one on `:root`, and the whole page gets it.
      Set it on one element, and only that element and its children see the new value:

      ```css
      .sale { --brand: crimson; }
      ```

      Every `var(--brand)` inside `.sale` now reads crimson. The rest of the page keeps teal.

  - type: predict-output
    id: predict-scoped-brand
    concept: css.custom-properties
    difficulty: 2
    language: html
    code: |
      <style>
        :root { --brand: teal; }
        .sale { --brand: crimson; }
        button { background: var(--brand); }
      </style>
      <section class="sale"><button>Buy now</button></section>
      <button>Subscribe</button>
    question: What colour is the Subscribe button?
    choices:
      - text: Teal
        correct: true
        feedback: >-
          Yes. It sits outside `.sale`, so it reads the value from `:root`.
      - text: Crimson
        feedback: >-
          Only elements inside `.sale` see crimson. This button sits outside it.
      - text: No colour at all
        feedback: >-
          It does get a value. Every element inherits `--brand` from `:root`.

  - type: prose
    id: themes
    body: |-
      That's how dark mode works. Give each colour a role, then redefine the roles under one
      class:

      ```css
      :root { --bg: white; --text: black; }
      .dark { --bg: black; --text: white; }
      body { background: var(--bg); color: var(--text); }
      ```

      Put `class="dark"` on `body`, and everything that reads the roles follows. That's a
      **theme**.

  - type: playground
    id: add-a-dark-theme
    concept: css.theming
    difficulty: 3
    prompt: >-
      The `body` already has `class="dark"`, but `.dark` is empty. Fill it with `--bg:
      midnightblue;`, `--text: white;` and `--card: darkslateblue;`, and watch the whole page
      go dark.
    html: |
      <html lang="en">
      <body class="dark">
        <h1>Stargazing club</h1>
        <div class="card">Next meeting: Friday, 9pm, on the common.</div>
        <div class="card">Bring a blanket and a red torch.</div>
      </body>
      </html>
    css: |
      :root { --bg: white; --text: black; --card: lavender; }
      .dark { }
      body {
        margin: 0; padding: 16px; font-family: sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card { margin-bottom: 8px; padding: 16px; background: var(--card); }
    editable: [css]
    checks:
      - label: The dark background is midnight blue
        selector: body
        style: { property: '--bg', value: midnightblue }
      - label: The dark text is white
        selector: body
        style: { property: '--text', value: white }
      - label: The dark cards are dark slate blue
        selector: body
        style: { property: '--card', value: darkslateblue }
    solution:
      css: |
        :root { --bg: white; --text: black; --card: lavender; }
        .dark { --bg: midnightblue; --text: white; --card: darkslateblue; }
        body {
          margin: 0; padding: 16px; font-family: sans-serif;
          background: var(--bg);
          color: var(--text);
        }
        .card { margin-bottom: 8px; padding: 16px; background: var(--card); }
    hints:
      - The three declarations go inside `.dark { }`.
      - They use the same names as `:root`, with new values.
      - 'Start with `.dark { --bg: midnightblue; }`.'

  - type: bug-hunt
    id: hunt-misspelt-property
    concept: css.custom-properties
    difficulty: 2
    language: css
    code: |
      :root { --brand: teal; }
      .button {
        background: var(--brnad);
        color: white;
      }
    prompt: >-
      The button's background has vanished, and there's no error anywhere. Tap the line at
      fault.
    lines: [3]
    reasons:
      - text: The name is misspelt, so there's nothing to read
        correct: true
        feedback: >-
          Right. With no value to read, `background` falls back to none.
      - text: '`var()` doesn''t work in `background`'
        feedback: >-
          It works in any property. The trouble is the name inside the brackets.
      - text: '`--brand` must be set on `.button` itself'
        feedback: >-
          The button inherits `--brand` from `:root`. It would, if the name matched.
    fix: |
      :root { --brand: teal; }
      .button {
        background: var(--brand);
        color: white;
      }

  - type: explain-back
    id: explain-theme-switch
    concept: css.theming
    difficulty: 3
    prompt: >-
      Why can one class on `body` switch a whole page to dark, without changing a single
      component rule?
    rubric:
      - The components read colours through custom properties, not fixed values.
      - The class redefines those properties on `body`.
      - Custom properties inherit, so every element inside reads the new values.
    modelAnswer: >-
      No component names a colour directly. Each one reads a role, such as `var(--bg)`. The
      `.dark` class redefines those roles on `body`. Custom properties inherit, so every
      element on the page reads the dark values. The component rules never change, only what
      their variables hold.

recap:
  - Name a value once with a custom property, and read it with `var()`.
  - Change a value for one part of the page by setting it lower down.
  - Switch a whole page to a dark theme with one class.

recall:
  - id: card-custom-property-syntax
    concept: css.custom-properties
    front: How do you define a brand colour once and use it in a rule?
    back: >-
      Define it with `:root { --brand: teal; }`, then read it with `var(--brand)`.
  - id: card-scoped-value
    concept: css.custom-properties
    front: 'You set `--brand: crimson` on `.sale`. Which elements see crimson?'
    back: >-
      `.sale` and everything inside it. The rest of the page keeps the value from `:root`.
  - id: card-dark-theme
    concept: css.theming
    front: How does a `.dark` class on `body` turn a page dark?
    back: >-
      It redefines the colour properties, such as `--bg` and `--text`. Every rule that reads
      them follows.
  - id: card-misspelt-var
    concept: css.custom-properties
    front: 'What happens to `background: var(--brnad)` when only `--brand` exists?'
    back: >-
      It finds nothing to read, so the background falls back to none, with no error.

references:
  - kind: spec
    title: CSS Custom Properties for Cascading Variables Module Level 1
    authors: Tab Atkins Jr.
    venue: W3C
    url: https://www.w3.org/TR/css-variables-1/
    note: Defines custom properties, `var()`, fallbacks and inheritance.
    primary: true
    verified: true
  - kind: docs
    title: Using CSS custom properties (variables)
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascading_variables/Using_custom_properties
    note: Defining, inheriting and reading custom properties, with examples.
    verified: true
  - kind: docs
    title: 'prefers-color-scheme: Hello darkness, my old friend'
    authors: Thomas Steiner
    venue: web.dev
    url: https://web.dev/articles/prefers-color-scheme
    note: Dark themes with custom properties, and following the system setting.
    verified: true

deepDive: >-
  `var()` takes a fallback: `color: var(--accent, teal)` uses teal when `--accent` isn't set
  at all. It doesn't help when `--accent` holds a value that makes no sense for `color`, such
  as `24px`. Then `color` behaves as if it were unset and inherits from the parent.


  To follow the reader's system setting, redefine the roles inside a media query:
  `@media (prefers-color-scheme: dark) { :root { --bg: black; } }`. Many sites combine both:
  the media query as a default, and a class for a manual switch.


  A formula inside a custom property is worked out where the property is set. With `--gap:
  calc(var(--space) * 3)` on `:root`, changing `--space` on a card doesn't change the card's
  `--gap`. It arrives already worked out.


  Custom property names are case-sensitive: `--Brand` and `--brand` are two different
  properties.
