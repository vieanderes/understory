term: in place
aka: [in-place, in-place algorithm, mutates in place]
short: Changing data inside the structure it already lives in, using only a fixed amount of extra memory.
explain: |
  Reversing a list could build a new list. Or you can swap the first and last, then the
  second and second-last, inside the original. That second way uses O(1) extra space.

  Tasks often ask for it to test that you can manage positions by hand. Two pointers,
  a read and a write index, or swaps usually do it.

  The catch is that the caller's data changes. `sort()` in JavaScript sorts in place and
  returns the same array. If the caller still needs the original, copy first, or use
  `toSorted()`.
analogy: Rearranging furniture within the same room, rather than moving everything to a new house.
example:
  language: js
  code: |
    function reverse(items) {
      for (let i = 0, j = items.length - 1; i < j; i++, j--) {
        [items[i], items[j]] = [items[j], items[i]]; // swap
      }
      return items; // same array, changed in place
    }
usage: It says in place, O(1) extra space, so no filter(); keep a write index and swap.
related: [two-pointers, space-complexity, mutation, quicksort]
level: 2
lessons: [algo.two-pointers]
