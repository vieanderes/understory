term: sharding
aka: [shard, horizontal partitioning]
short: Splitting one big dataset across several databases, each holding a different slice of the rows.
explain: |
  Copies help with reads, but every copy still takes every write and stores every row. When
  one machine can't hold or write it all, you split the data: users A to M here, N to Z
  there.

  The hard part is the **shard key**, the value that decides where a row lives. A good key
  spreads the load and keeps related rows together. A bad one makes a hot shard, and any
  query across shards, like a join or a global count, becomes slow and complicated. Most
  apps never need it; reach for it last.
analogy: A library splitting its collection across branches by surname. Each branch is smaller, but a search for every book on one topic means phoning them all.
usage: Sharding by tenant id keeps each customer's data on one shard, so most queries never cross shards.
twin:
  term: replication
  difference: Sharding splits the data so each machine holds a different part. Replication copies the whole dataset to every machine.
related: [replication, horizontal-scaling]
level: 3
lessons: [db.storage-and-pooling, sysdesign.case-news-feed]
