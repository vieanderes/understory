term: stress testing
aka: [ stress test, differential testing, brute-force checker ]
short: Comparing a fast solution against a slow but trusted one on many small random inputs.
explain: |
  Your clever solution passes the examples. It may still be wrong on an input nobody
  thought of. You need many inputs, and a way to know the right answer for each.

  Write the slow version that tries everything: it's hard to get wrong. Generate thousands
  of tiny random inputs, run both, and stop at the first disagreement. That input is your
  bug, small enough to trace by hand.

  Fix the random seed so a failure can be replayed. Keep inputs tiny so the slow version
  stays fast. It's how competitive programmers find the bugs examples never show.
analogy: Checking a new calculator against long division on a hundred random sums. Where they disagree, one of them is broken, and you know which.
example:
  language: js
  code: |
    for (let round = 0; round < 10_000; round++) {
      const nums = Array.from({ length: 1 + rand(6) }, () => rand(20) - 10);
      const expected = bruteForce(nums);
      const actual = fast(nums);
      if (actual !== expected) {
        console.log({ nums, expected, actual }); // the smallest failing case
        break;
      }
    }
usage: Ten minutes of stress testing against the brute force found the case with all negative numbers.
twin:
  term: property-based-testing
  difference: Stress testing compares your code with a second, trusted version on random inputs. Property-based testing checks rules the output must obey, with no second version, and shrinks failures for you.
related: [ property-based-testing, brute-force, edge-case, unit-test ]
level: 2
lessons: [interview.timed-strategy, interview.mock-b, testing.breaking-it-on-purpose]
