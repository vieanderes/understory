deepDive: >-
  **Abort instead of ignore.** The live search cancelled old requests with an
  `AbortController`. That works in an effect too: create it in the effect, pass its `signal`
  to `fetch`, and call `abort()` in the cleanup. The flag is simpler; aborting also saves the
  network work.


  **Why many apps don't fetch in effects.** Every component that loads data this way waits
  for its parent to render first, and nothing is cached between pages. Frameworks such as
  Next.js load data on the server, and libraries such as TanStack Query add caching and
  retries. Knowing the effect version makes both easier to understand.


  **Suspense.** React 19 can also pause a component until a promise resolves, with the `use`
  hook and a `<Suspense>` fallback. That usually comes from a framework, and you'll meet it
  in the performance lesson and in Next.js.
