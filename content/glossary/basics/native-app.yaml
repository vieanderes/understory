term: native app
aka:
  - native application
  - native code
short: An app written in a platform's own language and toolkit, such as Swift for iPhone.
explain: |
  Each phone and desktop system has its own language and UI toolkit. Each has its own way of
  reaching the camera, Bluetooth or the lock screen.

  An app built that way gets every device feature on the day it's released. It looks and feels
  exactly like the system, and runs as fast as the hardware allows.

  The price is building it again for each platform: two codebases, often two teams, and every
  feature shipped twice. Choose it when a hard constraint demands it, not by default.
analogy: A suit tailored to one person. It fits perfectly, and the next person needs their own.
usage: Background Bluetooth sync is a hard constraint, so this part has to be a native app.
twin:
  term: cross-platform-app
  difference: A native app is built separately for each platform in its own language. A cross-platform app shares one codebase across platforms and pays for it in reach to device features or polish.
related:
  - cross-platform-app
  - progressive-web-app
  - code-signing
