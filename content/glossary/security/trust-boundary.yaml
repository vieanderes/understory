term: trust boundary
aka: [system boundary, untrusted input]
short: The line where data from outside, which anyone could have written, enters code that relies on it.
explain: |
  Your form checks that the age is a number. But a script, `curl` or an edited page can send
  your server anything at all. Whatever arrives was written by someone else, so none of it
  can be trusted yet.

  The line it crosses is the top of every handler: the body, the query string, path
  parameters, headers and cookies. It is also every webhook, every third-party API reply
  and every answer from an AI model. Check and convert data once, as it crosses. Code inside
  the line can then trust what it's given.
analogy: Passport control. Whatever you were told on the plane, the check happens at the border.
example:
  language: ts
  code: |
    const Body = z.object({ title: z.string().max(200), done: z.boolean() });

    export async function POST(request: Request) {
      const parsed = Body.safeParse(await request.json());
      if (!parsed.success) return Response.json(parsed.error.issues, { status: 400 });
      await saveTask(parsed.data); // trusted from here on
    }
usage: The browser check is a nicety; the real one belongs at the trust boundary, in the handler.
related: [parse-dont-validate, mass-assignment, data-validation-model, threat-model, sql-injection]
level: 2
lessons: [backend.validation]
