deepDive: >-
  The table's owner and superusers skip policies by default. That's why the app should connect
  as a plain role, and why tests that run as the owner can pass while real users see nothing.
  `ALTER TABLE notes FORCE ROW LEVEL SECURITY` applies policies to the owner too.


  Policies run on every row a query touches, so keep them cheap. Index the owner column.
  Supabase recommends `(select auth.uid())` over a bare `auth.uid()`, so Postgres works it out
  once per query instead of once per row.


  Several permissive policies on one table combine with `OR`: a row passes if any policy lets
  it. `AS RESTRICTIVE` policies combine with `AND`, which suits a rule every access must meet,
  such as "same organisation".
