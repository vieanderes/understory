id: aisys.mcp-servers
title: Building MCP servers
objective: Write an MCP server with tools, resources and prompts, return tool errors the model can act on, keep stdout clean, and never trust the caller.
level: advanced
minutes: 10
concepts: [aisys.mcp-primitives, aisys.mcp-transports, aisys.mcp-security]
prerequisites: [ai.agents, aisys.guardrails]
opening:
  text: >-
    You'll write a server that any MCP app can plug into, and keep it safe from its callers.
    Write a tool once, and every agent your team runs can use it.

steps:
  - type: prose
    id: what-an-mcp-server-is
    body: |-
      Chapter 20 met **MCP**, the Model Context Protocol: an open standard for offering tools
      to AI apps. An **MCP server** is a program that offers them, once, to any app that
      speaks MCP. Here's a whole one, in Python:

      ```python
      from mcp.server.mcpserver import MCPServer

      mcp = MCPServer("library")

      @mcp.tool()
      def find_book(title: str) -> str:
          """Find a book in the catalogue by its exact title."""
          return lookup(title)

      mcp.run()
      ```

      The SDK builds the tool's schema from the type hints, and its description from the
      docstring.

  - type: prose
    id: name-primitives
    body: |-
      A server offers three kinds of thing, called **primitives**. They differ in who
      decides to use them. A **tool** is chosen by the model, like `find_book`. A
      **resource** is data the app reads into context, like the whole catalogue. A
      **prompt** is a template the user picks, often shown as a slash command.

      Each gets its own decorator: `@mcp.tool()`, `@mcp.resource(...)`, `@mcp.prompt()`.

  - type: multiple-choice
    id: pick-primitive
    concept: aisys.mcp-primitives
    difficulty: 1
    question: Users should pick "summarise this ticket" from a menu in their chat app. Which primitive fits?
    choices:
      - text: A prompt
        correct: true
        feedback: >-
          Yes. Prompts are templates the user picks, like a slash command.
      - text: A tool
        feedback: >-
          A tool waits for the model to decide. Here the user decides, from a menu.
      - text: A resource
        feedback: >-
          A resource is data the app reads in. It doesn't start a task by itself.

  - type: prose
    id: tool-errors
    body: |-
      Tools fail: no such book, a bad date, a service down. Return the failure as a normal
      tool result marked as an error, with a message the model can act on:

      ```json
      { "content": [{ "type": "text", "text": "No book called \"Dune II\". Did you mean: Dune?" }],
        "isError": true }
      ```

      The model reads it and tries again. In the Python SDK, raising `ToolError` produces
      exactly this.

  - type: code-challenge
    id: write-find-book
    concept: aisys.mcp-primitives
    difficulty: 3
    language: python
    starter: book.starter.py
    solution: book.solution.py
    tests: book.tests.py
    prompt: >-
      Write the logic behind the tool: `find_book(catalogue, title)`. `catalogue` maps ids
      to titles. Return a result like the one above.


      A title that matches, ignoring case and outer spaces, gives its id. An empty title
      gives the error `Give a title to search for.` Otherwise the error is `No book called
      "{title}".`, then ` Did you mean: A, B?` with close titles, or ` Check the spelling, or
      ask the user.`
    hints:
      - Write a small `result(text, is_error=False)` helper first. Every branch returns one.
      - Compare `name.lower()` with `title.strip().lower()`.
      - '`difflib.get_close_matches(title, list(catalogue.values()), n=3, cutoff=0.6)` finds the close titles.'

  - type: prose
    id: name-transports
    body: |-
      Messages travel over a **transport**. With **stdio**, the app starts your server on
      the same machine. They talk through the server's standard input and output. The server's
      stdout is the app's input channel, so nothing else may be printed there.

      **Streamable HTTP** puts the server behind one web endpoint, shared by many apps and
      people. Use it for a team's server.

  - type: ai-review
    id: review-print-on-stdout
    concept: aisys.mcp-transports
    difficulty: 3
    language: python
    request: Write a stdio MCP server for our library catalogue.
    flawClass: logic
    code: |
      from mcp.server.mcpserver import MCPServer

      mcp = MCPServer("library")
      BOOKS = {"b1": "Dune", "b2": "Emma"}
      print(f"Loaded {len(BOOKS)} books")

      @mcp.tool()
      def find_book(title: str) -> str:
          """Find a book in the catalogue by its exact title."""
          ...

      if __name__ == "__main__":
          mcp.run()
    prompt: >-
      An assistant wrote this. With the SDK's own client, the tools worked, and the log only
      showed "Failed to parse JSONRPC message". A stricter client refused to start. Tap the
      line at fault.
    lines: [5]
    reasons:
      - text: stdout must carry only protocol messages
        correct: true
        feedback: >-
          Yes. That line lands in the app's input channel. Logs belong on stderr.
      - text: '`MCPServer` needs a transport argument'
        feedback: >-
          `run()` uses stdio by default in this SDK. The server starts fine.
      - text: The tool needs a return type of `dict`
        feedback: >-
          A string return is fine. The SDK wraps it as text content.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Check every stdout line parses as JSON-RPC
          correct: true
          feedback: >-
            Yes. The startup message fails that check on the first line.
        - text: Call `find_book` through the SDK's own client
          feedback: >-
            That already worked. The SDK client skips lines it can't parse and carries on.
        - text: Assert `find_book` returns a string
          feedback: >-
            It does, and the SDK wraps it fine. The stray line comes before any tool runs.
    fix: |
      import sys
      from mcp.server.mcpserver import MCPServer

      mcp = MCPServer("library")
      BOOKS = {"b1": "Dune", "b2": "Emma"}
      print(f"Loaded {len(BOOKS)} books", file=sys.stderr)

  - type: prose
    id: name-mcp-security
    body: |-
      A model calls your tools, and a model can be talked into anything, as lesson 6
      showed. So a server never trusts its caller. It checks every argument against an
      allow-list. Each tool gets the least power it needs, and calls are rate limited.

      A shared server also checks who is calling, with a token issued for this server.
      Other servers' tool descriptions are untrusted text too.

  - type: code-challenge
    id: write-validate-args
    concept: aisys.mcp-security
    difficulty: 4
    language: python
    starter: args.starter.py
    solution: args.solution.py
    tests: args.tests.py
    prompt: >-
      Write `validate_args(schema, args)`. The schema's `"properties"` give each allowed key
      a `"type"`: `"string"`, `"integer"` or `"boolean"`, and maybe an `"enum"`. It also
      lists the `"required"` keys.


      Return error strings. First `missing: key` for each absent required key, in
      `required` order. Then one per bad argument, in order: `unknown: key`, `type: key` or
      `enum: key`. An integer must be a whole number, and not `True` or `False`.
    hints:
      - Two passes. One over the required keys, then one over the arguments you were given.
      - For each argument, only the first problem counts, so use `if`, `elif`, `elif`.
      - '`isinstance(True, int)` is `True` in Python, so check for `bool` before `int`.'

  - type: explain-back
    id: explain-validate-again
    concept: aisys.mcp-security
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Your tool has an input schema, and the model follows it nearly always. Why must the
      server still validate every argument itself?
    rubric:
      - The schema guides the model, but nothing forces its output to match.
      - Injected text in the context can steer the model to harmful arguments.
      - Any client can call the server directly, without a model at all.
    modelAnswer: >-
      The schema is advice to the model, not a lock. A model sometimes gets it wrong, and a
      poisoned document or tool result can steer it on purpose. Anyone who can reach the
      server can also send a request by hand. So the server treats every argument as
      untrusted input, checks it against an allow-list, and only then acts.

recap:
  - Offer tools, resources and prompts, and return tool errors the model can act on.
  - Use stdio for a local server with stdout kept clean, and Streamable HTTP for a shared one.
  - Validate every argument, check who is calling, and treat other servers' descriptions as untrusted.

recall:
  - id: card-primitives
    concept: aisys.mcp-primitives
    front: Who decides when an MCP tool, resource and prompt are used?
    back: >-
      The model calls tools. The application reads resources. The user picks prompts.
  - id: card-tool-error
    concept: aisys.mcp-primitives
    front: How should an MCP tool report that its input made no sense?
    back: >-
      As a normal result with `isError` true and a message the model can act on, not a
      protocol error.
  - id: card-stdio-stdout
    concept: aisys.mcp-transports
    front: Where do log lines go in a stdio MCP server, and why?
    back: >-
      To stderr. stdout carries the protocol messages, so anything else there breaks the
      stream.
  - id: card-never-trust
    concept: aisys.mcp-security
    front: Why does an MCP server validate arguments the model produced from its own schema?
    back: >-
      The model can be wrong or steered by injected text, and anyone who can reach the
      server can call it by hand. Every argument is untrusted input.

