id: backend.http-in-depth
title: Methods and status codes
objective: "Send any method with `curl`, answer with the status a client expects, and know which requests are safe to repeat."
level: essential
minutes: 10
concepts: [backend.http-methods, backend.status-codes, backend.safe-and-idempotent]
prerequisites: [backend.first-endpoint]
opening:
  text: >-
    You'll answer every request with the method and status that browsers, scripts and retrying
    clients already understand. Then they do the right thing without reading your docs.

steps:
  - type: prose
    id: methods-and-their-promises
    body: >-
      Each **method** is a promise about what a request does. `GET` reads. `POST` creates
      something new. `PUT` replaces the thing at a known address. `PATCH` changes part of it.
      `DELETE` removes it.


      The server doesn't enforce any of this. But browsers, caches and retrying clients act on
      the promise, so a handler that breaks it makes them misbehave.

  - type: prose
    id: curl-flags
    body: |-
      `curl` sends any method you like. **`-X`** sets the method, **`-H`** adds a header and
      **`-d`** sends a body:

      ```bash
      $ curl -i -X POST -H "Content-Type: application/json" \
          -d '{"title":"Emma"}' localhost:3100/books
      HTTP/1.1 201 Created
      content-type: application/json
      location: /books/2

      {"id":2,"title":"Emma"}
      ```

      The `\` lets one command continue on the next line.

  - type: fill-blank
    id: fill-curl-delete
    concept: backend.http-methods
    difficulty: 1
    language: bash
    prompt: >-
      Remove book 2, and show the status line so you can see how it went. Fill the gaps.
    template: |
      $ curl {{1}} {{2}} {{3}} localhost:3100/books/2
    blanks:
      - key: '1'
        answer: '-i'
      - key: '2'
        answer: '-X'
      - key: '3'
        answer: DELETE
    bank: ['-i', '-d', '-X', '-H', DELETE, REMOVE]

  - type: prose
    id: status-codes-that-matter
    body: >-
      The status is the line every client reads first. **`201`** Created comes with a
      `Location` header saying where the new thing lives. **`204`** No Content means done, with
      no body.


      **`400`** means the request itself was bad. **`404`** means no such thing. **`405`**
      means the thing exists but not for that method, with `Allow` listing the ones that work.

  - type: predict-output
    id: predict-post-twice
    concept: backend.http-methods
    difficulty: 2
    language: bash
    code: |
      $ curl -X POST -H "Content-Type: application/json" -d '{"title":"Emma"}' localhost:3100/books
      {"id":2,"title":"Emma"}
      $ curl -X POST -H "Content-Type: application/json" -d '{"title":"Emma"}' localhost:3100/books
    question: You send the same `POST` again. What does the second call print?
    choices:
      - text: '`{"id":3,"title":"Emma"}`, a second book'
        correct: true
        feedback: >-
          Right. `POST` creates something new each time. Two calls, two books.
      - text: '`{"id":2,"title":"Emma"}`, the same book'
        feedback: >-
          That's what a `PUT` to `/books/2` would give. A `POST` to the list adds again.
      - text: An error, since the title exists
        feedback: >-
          Nothing stops two books sharing a title. The server makes a new one with a new id.

  - type: prose
    id: safe-and-idempotent
    body: |-
      A method is **safe** if it changes nothing: `GET`. It's **idempotent** if sending it
      twice leaves things as sending it once. `DELETE` is:

      ```bash
      $ curl -s -o /dev/null -w "%{http_code}\n" -X DELETE localhost:3100/books/2
      204
      $ curl -s -o /dev/null -w "%{http_code}\n" -X DELETE localhost:3100/books/2
      404
      ```

      The status differs, but the book is gone either way. `GET`, `PUT` and `DELETE` are
      idempotent. `POST` isn't, so never repeat one blindly.

  - type: ai-review
    id: review-get-that-deletes
    concept: backend.safe-and-idempotent
    difficulty: 3
    language: js
    request: Add an endpoint so the admin can clear a book with one link in their dashboard.
    flawClass: security
    code: |
      if (request.method === "GET" && path === "/books/clear") {
        const id = Number(url.searchParams.get("id"));
        books.delete(id);
        return new Response("Cleared");
      }
    prompt: >-
      An assistant wrote this. Clicking the link works, and the test passes. A week later
      books vanish that nobody clicked. Tap the line at fault.
    lines: [1]
    reasons:
      - text: A `GET` that changes data breaks the safe promise
        correct: true
        feedback: >-
          Yes. Link previews, crawlers and prefetchers follow `GET` freely. Make it `DELETE`.
      - text: '`books.delete` should check the id exists'
        feedback: >-
          A check changes the status, not the danger. Anything that fetches the URL still deletes.
      - text: The response should be `204`
        feedback: >-
          A better status for an empty reply, but the method is the flaw. Safe methods never delete.
    fix: |
      if (request.method === "DELETE" && path.startsWith("/books/")) {
        const id = Number(path.slice("/books/".length));
        const existed = books.delete(id);
        return new Response(null, { status: existed ? 204 : 404 });
      }

  - type: code-challenge
    id: write-books-statuses
    concept: backend.status-codes
    difficulty: 3
    language: ts
    editable: '34-39'
    prompt: >-
      The books API answers with the wrong statuses. Fix it.


      `POST /books` answers `201` with a `Location` of `/books/<id>`. `DELETE /books/2`
      answers `204` with no body, and `404` when there's no such book. Any other method on
      `/books` answers `405` with `Allow: GET, POST`. `json(status, data, headers)` and
      `empty(status, headers)` build the responses.
    hints:
      - Three changes, one per status. Start with the `POST`, which only needs a new status and a header.
      - '`books.delete(id)` returns `true` if the book was there and `false` if it wasn''t.'
      - 'For the 405, add a line after the `POST` branch: `return empty(405, { Allow: "GET, POST" });`'

  - type: explain-back
    id: explain-why-not-retry-post
    concept: backend.safe-and-idempotent
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A payment request times out and the client library retries it. Why is that fine for
      `PUT /orders/42/address` and dangerous for `POST /orders/42/charges`?
    rubric:
      - '`PUT` replaces a thing at a known address, so a repeat sets the same value again.'
      - '`POST` does something new each time, so a repeat after a timeout may do it twice.'
      - A timeout doesn't say whether the first request was carried out, so only idempotent methods are safe to retry blindly.
    modelAnswer: >-
      A timeout tells the client nothing about the server. Maybe the request never arrived,
      maybe it was carried out and the reply was lost. Retrying `PUT` is harmless either way,
      because setting the address twice leaves one address. Retrying `POST` may charge the
      card twice, because each `POST` is a new charge. The method's promise decides whether a
      blind retry is safe.

recap:
  - "Send any method, header and body with `curl -X`, `-H` and `-d`."
  - "Answer with `201` and `Location`, `204`, `400`, `404` or `405` and `Allow`."
  - Tell safe from idempotent, and know which requests a client may repeat.

recall:
  - id: card-method-promises
    concept: backend.http-methods
    front: What does each of `GET`, `POST`, `PUT` and `DELETE` promise?
    back: >-
      `GET` reads. `POST` creates something new. `PUT` replaces a thing at a known address.
      `DELETE` removes it.
  - id: card-safe-vs-idempotent
    concept: backend.safe-and-idempotent
    front: Name a method that is idempotent but not safe, and one that is neither.
    back: >-
      `DELETE` changes data but repeats harmlessly. `POST` changes data and makes something
      new each time.
  - id: card-405-allow
    concept: backend.status-codes
    front: When does a server answer `405`, and what header goes with it?
    back: >-
      When the path exists but not for that method. `Allow` lists the methods it does accept.
  - id: card-curl-flags
    concept: backend.http-methods
    front: What do `-X`, `-H` and `-d` do in a `curl` command?
    back: >-
      `-X` sets the method, `-H` adds a header, and `-d` sends a body.

references:
  - kind: rfc
    title: 'RFC 9110: HTTP Semantics'
    authors: R. Fielding, M. Nottingham and J. Reschke (eds)
    year: 2022
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc9110
    note: Methods (section 9), safe and idempotent (9.2.1 and 9.2.2), and status codes (15).
    primary: true
    verified: true
  - kind: docs
    title: HTTP response status codes
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status
    note: Every status code with what a client should do about it.
    verified: true
  - kind: docs
    title: curl man page
    authors: Daniel Stenberg and contributors
    venue: curl.se
    url: https://curl.se/docs/manpage.html
    note: '`-X`, `-H`, `-d`, and `-w` with `%{http_code}`.'
    primary: true
    verified: true

deepDive: >-
  In the idempotency example, `-s` hides the progress meter, `-o /dev/null` throws the body
  away, and `-w "%{http_code}\n"` prints only the status. It's a handy way to check an
  endpoint in a script.


  A client can say which formats it reads with an `Accept` header, such as
  `Accept: application/json`. A server that offers several formats picks one and names it in
  `Content-Type`. That's content negotiation. If nothing fits, it answers `406`. A request
  body in a type the server can't read gets `415`.


  `PATCH` isn't idempotent by definition: a patch that says "add 1" adds again on a retry.
  `PUT` with the whole new value is the idempotent way to change one thing. Some APIs answer
  `POST` with `202 Accepted` when the work will happen later, and point at a status URL.
