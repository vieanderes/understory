id: css.cascade
title: Selectors and the cascade
objective: Target elements with selectors, and predict which rule wins when two clash.
level: essential
minutes: 10
concepts: [css.cascade, css.specificity, css.inheritance]
prerequisites: [css.what-css-is]
opening:
  text: >-
    You'll pick out exactly the elements you mean, and know which rule wins when two
    disagree. It's the end of "why is my button still grey?"

steps:
  - type: prose
    id: selectors-you-meet
    body: |-
      A selector can pick elements in several ways:

      ```css
      p { }        /* every p */
      .sale { }    /* every class="sale" */
      #basket { }  /* the one id="basket" */
      nav a { }    /* every a inside a nav */
      ```

      Text between `/*` and `*/` is a comment, a note the browser skips. An `id` names one
      element; no other on the page may share it. The space in `nav a` means "inside".

  - type: playground
    id: light-up-the-nav
    concept: css.cascade
    difficulty: 1
    prompt: >-
      The nav links look like any other link. Add a rule for `.menu a` that makes them
      `navy`. Watch the link in the paragraph stay blue.
    html: |
      <nav class="menu">
        <a href="#">Home</a>
        <a href="#">Recipes</a>
        <a href="#">About</a>
      </nav>
      <h1>Tomato soup</h1>
      <p>Ready in 30 minutes. Serve it with <a href="#">garlic bread</a>.</p>
    css: |
      .menu {
        background: lavender;
        padding: 16px;
      }
    editable: [css]
    checks:
      - label: The nav links are navy
        selector: .menu a
        style: { property: color, value: 'rgb(0, 0, 128)' }
      - label: The link in the text stays blue
        selector: p a
        style: { property: color, value: 'rgb(0, 0, 238)' }
    solution:
      css: |
        .menu {
          background: lavender;
          padding: 16px;
        }
        .menu a { color: navy; }
    hints:
      - The new rule goes below the `.menu` rule, not inside it.
      - The selector is `.menu a`, with a space that means "inside".
      - 'Write `.menu a { color: navy; }`.'

  - type: prose
    id: when-rules-clash
    body: |-
      Two rules can set the same property on one element:

      ```css
      .sale { color: red; }
      p { color: black; }
      ```

      A `<p class="sale">` matches both. The browser settles it with the **cascade**, its
      fixed way of choosing. The more specific selector wins, and a class is more specific
      than an element name. Only when two selectors tie does the later rule win.

  - type: predict-output
    id: predict-class-beats-later
    concept: css.cascade
    difficulty: 2
    language: html
    code: |
      <style>
        .sale { color: red; }
        p { color: black; }
        p { color: green; }
      </style>
      <p class="sale">Winter scarves</p>
    question: What colour is the text?
    choices:
      - text: Red
        correct: true
        feedback: >-
          Yes. The class is more specific, so its position doesn't matter.
      - text: Green
        feedback: >-
          The last rule only wins a tie. Here `.sale` is more specific than `p`, so there's
          no tie.
      - text: Black
        feedback: >-
          The two `p` rules tie with each other, so green beats black. But `.sale` beats both.

  - type: prose
    id: counting-specificity
    body: |-
      **Specificity** is a score in three counts: IDs, then classes, then element names.

      - `p` scores (0, 0, 1)
      - `.buy` scores (0, 1, 0)
      - `.actions button` scores (0, 1, 1)
      - `#basket` scores (1, 0, 0)

      Compare from the left and stop at the first difference. Adding `!important` forces a
      win, but the next fix then needs another. Raise the score instead.

  - type: playground
    id: win-without-important
    concept: css.specificity
    difficulty: 2
    prompt: >-
      Buy now should be gold, but it stays grey. Count the classes and elements in each
      selector. Then make the `.buy` selector more specific, without `!important`, and watch
      it turn gold.
    html: |
      <div class="actions">
        <button>Cancel</button>
        <button class="buy">Buy now</button>
      </div>
    css: |
      .actions button {
        background: lightgrey;
        border: 0;
        padding: 8px 16px;
      }
      .buy {
        background: gold;
      }
    editable: [css]
    checks:
      - label: Buy now is gold
        selector: .buy
        style: { property: background-color, value: 'rgb(255, 215, 0)' }
      - label: Cancel stays grey
        selector: '.actions button:not(.buy)'
        style: { property: background-color, value: 'rgb(211, 211, 211)' }
    solution:
      css: |
        .actions button {
          background: lightgrey;
          border: 0;
          padding: 8px 16px;
        }
        .actions .buy {
          background: gold;
        }
    hints:
      - '`.actions button` scores (0, 1, 1). `.buy` scores (0, 1, 0).'
      - Two classes beat one class and one element.
      - Change the selector `.buy` to `.actions .buy`.

  - type: ai-review
    id: review-ai-gold-button
    concept: css.specificity
    difficulty: 3
    language: css
    request: Make the Buy now button gold. It's stuck on grey.
    flawClass: logic
    code: |
      .actions button {
        background: lightgrey;
        border: 0;
        padding: 8px 16px;
      }
      .actions button {
        background: gold;
      }
    prompt: >-
      An AI assistant suggested this for the same page, and Buy now does turn gold. Tap the
      line at fault.
    lines: [6]
    reasons:
      - text: It picks every button, so Cancel turns gold too
        correct: true
        feedback: >-
          Right. Point it at the one button: `.actions .buy`.
      - text: The later rule loses the tie
        feedback: >-
          In a tie, the later rule wins. That's why Buy now turned gold.
      - text: '`gold` needs `!important` to win'
        feedback: >-
          It already wins. The trouble is how many buttons it wins on.
    fix: |
      .actions button {
        background: lightgrey;
        border: 0;
        padding: 8px 16px;
      }
      .actions .buy {
        background: gold;
      }

  - type: prose
    id: inheritance
    body: >-
      Some properties pass from parent to child. Set `color` or `font-family` on `body`, and
      every paragraph inside picks it up. That's **inheritance**. Borders and padding don't
      inherit.


      Inheritance only fills a gap. Any rule that targets the child itself beats a value
      handed down from its parent. And the browser has rules of its own, such as blue for
      links.

  - type: predict-output
    id: predict-link-colour
    concept: css.inheritance
    difficulty: 3
    language: html
    code: |
      <style>
        #footer { color: white; background: navy; }
      </style>
      <footer id="footer">
        <p>Questions? <a href="/help">Get help</a></p>
      </footer>
    question: The visitor has never opened `/help`. What colour is the link?
    choices:
      - text: The browser's usual link blue
        correct: true
        feedback: >-
          Yes. The browser styles links directly, and that beats any inherited colour.
      - text: White, because an ID is strong
        feedback: >-
          The ID only matches the footer. For the link, it's only an inherited value, and any
          direct rule beats that.
      - text: Navy, from the footer's background
        feedback: >-
          `background` doesn't set text colour, and it isn't inherited either.

  - type: explain-back
    id: explain-still-grey
    concept: css.cascade
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why does `.buy { background: gold; }` lose to `.actions button`, even though it comes
      later in the file?
    rubric:
      - Both rules match the button, so the cascade has to choose one.
      - Specificity is compared before order, and (0, 1, 1) beats (0, 1, 0).
      - Order only breaks a tie, so being later doesn't help here.
    modelAnswer: >-
      Both selectors match the Buy button, so the cascade compares them. It looks at
      specificity first. `.actions button` has a class and an element, (0, 1, 1), and `.buy`
      has only a class, (0, 1, 0). The first difference decides, so grey wins. Coming later
      only matters when the scores tie.

recap:
  - Pick elements by name, class, ID or what they sit inside.
  - Work out which of two clashing rules wins, and raise a selector's score to fix it.
  - Tell an inherited value from one set on the element itself.

recall:
  - id: card-cascade-order
    concept: css.cascade
    front: Two rules set `color` on the same element. How does the browser choose?
    back: >-
      The more specific selector wins. Only if they tie does the later rule win.
  - id: card-specificity-score
    concept: css.specificity
    front: 'What is the specificity of `nav .link`, and does it beat `.menu .link`?'
    back: >-
      (0, 1, 1). `.menu .link` is (0, 2, 0), so `.menu .link` wins.
  - id: card-descendant-selector
    concept: css.cascade
    front: What does the selector `nav a` match?
    back: >-
      Every `a` element anywhere inside a `nav`. The space means "inside".
  - id: card-inherited-value-rank
    concept: css.inheritance
    front: Why does a link inside a white footer stay blue?
    back: >-
      The browser's own rule targets the link directly. An inherited value is used only when no
      rule targets the element.

references:
  - kind: spec
    title: CSS Cascading and Inheritance Level 5
    authors: Elika J. Etemad, Miriam E. Suzanne, Tab Atkins Jr.
    venue: W3C
    url: https://www.w3.org/TR/css-cascade-5/
    note: The full order the cascade compares declarations in, and how inheritance fills gaps.
    primary: true
    verified: true
  - kind: docs
    title: The cascade
    venue: web.dev, Learn CSS
    url: https://web.dev/learn/css/the-cascade
    note: A friendly walk through origin, specificity and order, with live demos.
    verified: true
  - kind: docs
    title: Specificity
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity
    note: Worked examples for every kind of selector.
    verified: true

deepDive: >-
  Pseudo-classes such as `:hover` and attribute selectors such as `[type="email"]` count as
  classes. Pseudo-elements such as `::before` count as elements. `:where()` counts as zero, and
  `:is()` counts as its most specific argument, even one that matches nothing.


  A `style` attribute beats every selector. It isn't part of specificity at all, but a step of
  its own in the cascade.


  Before specificity, the cascade checks two more things. The first is origin and importance:
  the browser's defaults, the reader's settings and your CSS, with `!important` reversing
  their order. The second is cascade layers, made with `@layer`, which the lesson on modern CSS
  architecture covers.


  Three keywords reset a property. `inherit` takes the parent's value, `initial` the
  property's starting value, and `revert` the browser's own default.
