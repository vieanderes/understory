id: db
number: 10
title: Databases
summary: "Where your app's data lives. Write real SQL against Postgres from the first minute: read and change rows, design tables that refuse bad data, query safely from code, and keep data right when many people write at once."
why: "Data outlives the code that writes it, so mistakes here last longest."
youCanBuild: "A schema with keys and constraints, safe queries from code, an index that fixes a slow page, a transaction that can't half-happen, and row-level security."
lab: btree-index-explorer
concepts:
  - id: db.databases
    title: What a database is
    summary: A program that keeps your app's data safe on disk and answers questions about it, so many requests can read and write at once without losing anything.
  - id: db.select-basics
    title: Your first SELECT
    summary: "`SELECT` names the columns you want and `FROM` names the table, so `SELECT title FROM books;` lists every book's title."
  - id: db.filtering
    title: Filtering with WHERE
    summary: "`WHERE` keeps only the rows for which a condition is true, and `AND` binds tighter than `OR`, so brackets make the meaning plain."
  - id: db.sorting-and-limit
    title: Sorting and LIMIT
    summary: "`ORDER BY` sorts the rows and `LIMIT` keeps the first few. Without `ORDER BY`, rows come back in no promised order."
  - id: db.null
    title: "NULL"
    summary: NULL means a value is missing or unknown, so `= NULL` is never true and `IS NULL` is the test.
  - id: db.insert
    title: Adding rows
    summary: "`INSERT INTO` a table with a list of columns and `VALUES` adds rows, and naming the columns keeps the statement right when the table changes."
  - id: db.update-and-delete
    title: Changing and deleting rows
    summary: "`UPDATE` and `DELETE` change every row their `WHERE` matches, so a missing `WHERE` changes the whole table."
  - id: db.tables-and-keys
    title: Primary keys
    summary: A primary key is the column whose value identifies exactly one row, and the database refuses a second row with the same value.
  - id: db.foreign-keys
    title: Foreign keys and relations
    summary: A foreign key column holds the primary key of a row in another table, and the database refuses a value with no match.
  - id: db.normalisation
    title: One fact in one place
    summary: Each fact is stored once and pointed at with a key, so changing it once changes it everywhere.
  - id: db.joins
    title: Joins
    summary: A join pairs rows from two tables that match a condition, and a left join also keeps left rows with no match, filled with NULL.
    confusableWith: [db.join-fanout]
  - id: db.join-fanout
    title: Joins that repeat rows
    summary: A join returns one row per matching pair, so a row with three matches appears three times, and totals over the result count it three times.
    confusableWith: [db.joins]
  - id: db.aggregation
    title: Counting and grouping
    summary: "Aggregates such as `count`, `sum` and `max` summarise many rows, `GROUP BY` gives one row per group, and `count(column)` skips NULLs where `count(*)` does not."
  - id: db.select-pipeline
    title: The order a query runs in
    summary: "A query runs as FROM, WHERE, GROUP BY, HAVING, SELECT and ORDER BY, so `WHERE` can't see a name made in `SELECT` and `HAVING` filters groups."
  - id: db.column-types
    title: Column types
    summary: Every column has a type such as `integer`, `text`, `boolean` or `timestamptz`, and the database refuses a value that doesn't fit it.
  - id: db.money-and-time
    title: Money and time
    summary: Money goes in integer pence or `numeric`, never a floating-point type, and a moment in time goes in `timestamptz`.
  - id: db.constraints
    title: Constraints
    summary: "`NOT NULL`, `UNIQUE`, `CHECK` and keys are rules the database checks on every write, whatever code sent it."
  - id: db.drivers-and-parameters
    title: Querying from code
    summary: A driver sends your SQL from the server to Postgres, and `$1` placeholders send each value separately from the SQL text.
  - id: db.sql-injection
    title: SQL injection
    summary: Gluing user input into SQL text lets that input change the query itself, and parameters stop it because values never become SQL.
  - id: db.n-plus-one
    title: N+1 queries
    summary: One query for a list and then one more per item makes many round trips, where one query with a join or `= ANY($1)` makes one.
  - id: db.btree-index
    title: Indexes
    summary: An index is a sorted copy of a column with pointers to the rows, so the database finds matching rows without reading the whole table.
  - id: db.composite-index
    title: Multi-column indexes
    summary: An index on several columns is sorted by the first, then the second, so it helps a query that filters on its leading columns.
  - id: db.index-selectivity
    title: When an index can't help
    summary: Wrapping the column in a function hides it from a plain index, and a foreign key column gets no index unless you make one.
  - id: db.query-plan
    title: Query plans
    summary: A plan is a tree of steps the database chose to run a query, read from the most indented line outwards.
  - id: db.explain-analyze
    title: EXPLAIN and EXPLAIN ANALYZE
    summary: "`EXPLAIN` shows the plan with estimates, and `EXPLAIN ANALYZE` runs the statement for real and adds actual rows and times."
  - id: db.transactions
    title: Transactions
    summary: "A transaction groups statements between `BEGIN` and `COMMIT` so they all take effect or none do, and `ROLLBACK` undoes them."
  - id: db.acid
    title: ACID
    summary: Atomicity, consistency, isolation and durability are the four promises a database makes about transactions.
  - id: db.atomicity
    title: Atomicity
    summary: All the writes of a transaction take effect or none do, which says nothing about what two transactions running at once see.
    confusableWith: [db.anomalies]
  - id: db.unique-under-concurrency
    title: Unique constraints under concurrency
    summary: Checking for a row and then inserting it leaves a gap two requests can both pass, and a unique constraint closes it inside the database.
  - id: db.inventory-invariant
    title: Never sell what you don't have
    summary: "A `CHECK` or a conditional `UPDATE ... WHERE stock > 0` makes the database refuse the write that would oversell."
  - id: db.anomalies
    title: Lost updates
    summary: Two requests read the same value, each writes back its own result, and one change silently disappears.
    confusableWith: [db.atomicity]
  - id: db.read-committed
    title: Read committed
    summary: Postgres's default isolation level, where each statement sees the data committed before it began.
    confusableWith: [db.serializable]
  - id: db.row-locks
    title: Row locks and FOR UPDATE
    summary: "`SELECT ... FOR UPDATE` locks the rows it reads until the transaction ends, so another writer of those rows waits."
  - id: db.serializable
    title: Serializable
    summary: The strictest level, where Postgres aborts a transaction that would give a result no one-at-a-time order could, and the app retries.
    confusableWith: [db.read-committed]
  - id: db.migrations
    title: Migrations
    summary: A migration is a numbered file of schema changes that runs once, in order, on every copy of the database.
  - id: db.expand-contract
    title: Expand and contract
    summary: Add the new shape, move data and code over, then remove the old shape, so every deploy works with the schema before and after it.
  - id: db.ddl-locks
    title: Schema changes on a live table
    summary: Many `ALTER TABLE` forms lock the whole table, and every query queues behind the waiting change, so big changes are split or run concurrently.
  - id: db.rls-policies
    title: Row-level security policies
    summary: A policy is a condition the database adds to every query on a table, so each user sees and changes only the rows that pass it.
  - id: db.supabase-roles
    title: Supabase roles
    summary: Supabase runs each request as the `anon` or `authenticated` role, and `auth.uid()` gives a policy the signed-in user's id.
  - id: db.service-key
    title: The service key hazard
    summary: The service role key skips row-level security, so it stays on the server and never reaches a browser.
  - id: db.connection-pooling
    title: Connection pooling
    summary: Each database connection costs memory, so a pool reuses a few connections for many requests instead of opening one per request.
  - id: db.read-replicas
    title: Read replicas
    summary: A replica is a read-only copy that lags slightly behind, so reads can spread out but a read straight after a write may miss it.
  - id: db.redis
    title: Caching with Redis
    summary: An in-memory store keeps copies of slow answers for a set time, and every write must clear or refresh the copies it makes stale.
  - id: db.shard-key
    title: Sharding
    summary: Sharding splits rows across databases by a shard key, so a query with the key asks one database and a query without it asks them all.
