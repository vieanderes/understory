term: ref
aka:
  - useRef
short: A box React keeps for a component whose contents you can change without drawing the page again.
explain: |
  `useRef(null)` gives you `{ current: null }`, and React hands back the same box on every
  draw. Put a DOM element in it to focus or measure, or keep a timer id there.

  Changing `ref.current` doesn't update the screen. That's the point, and the trap: if the
  page should show the value, it belongs in state. Don't read or write refs during the draw
  itself; do it in handlers and effects.
analogy: A locker at the gym. You can swap what's inside whenever you like, and nobody announces it.
example:
  language: tsx
  code: |
    function SearchBox() {
      const input = useRef<HTMLInputElement>(null);
      return (
        <>
          <input ref={input} />
          <button onClick={() => input.current?.focus()}>Search</button>
        </>
      );
    }
usage: Keep the interval id in a ref; it never needs to show on screen.
twin:
  term: state
  difference: Changing a ref updates the value quietly and the screen stays as it was. Changing state draws the component again with the new value.
related:
  - state
  - hook
level: 2
lessons:
  - react.hooks-and-refs
