term: z-index
short: A number on a positioned element that sets whether it sits in front of or behind its neighbours.
explain: |
  Two boxes overlap. Which one do you see? Normally the later one in the page wins. Give
  one a number and you can change that.

  It only works on positioned elements or flex and grid children. And the numbers are only compared within the same **stacking context**. That's why a modal with `z-index: 9999`
  can still sit under a header with `z-index: 2`: they're in different contexts, and the
  contest was settled higher up.
analogy: Numbered sheets in a ring binder. Higher numbers sit on top, but only among the sheets in the same binder.
example:
  language: css
  code: |
    .header { position: sticky; top: 0; z-index: 2; }
    .modal  { position: fixed; z-index: 10; }
usage: Raising the z-index to 9999 won't help; the dropdown is trapped in its parent's stacking context.
twin:
  term: stacking-context
  difference: A z-index is a number that orders siblings. A stacking context is the group those numbers are compared within, and no number escapes its group.
related:
  - stacking-context
level: 2
lessons:
