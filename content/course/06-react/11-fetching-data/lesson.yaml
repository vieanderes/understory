id: react.fetching-data
title: Fetching data
objective: Load data when a component appears, show loading and error states, and ignore answers that arrive too late.
level: essential
minutes: 10
concepts: [react.fetching-data, react.stale-responses]
prerequisites: [react.effects, js.live-search]
opening:
  text: >-
    You'll build a component that loads its own data, says when it's loading and copes when
    the server fails. And it'll never show an answer to a question you've stopped asking.

steps:
  - type: prose
    id: fetch-in-an-effect
    body: |-
      Data from a server arrives later, so a component asks for it in an effect. An effect's
      function can't be `async`, so it uses `.then` instead of `await`. `promise.then(fn)`
      calls `fn` with the value once it arrives:

      ```tsx
      useEffect(() => {
        fetch(`/api/weather?city=${city}`)
          .then((response) => response.json())
          .then((data) => setForecast(data));
      }, [city]);
      ```

      With `[city]`, it asks again whenever it's shown a different city.

  - type: predict-output
    id: predict-null-before-data
    concept: react.fetching-data
    difficulty: 2
    language: tsx
    code: |
      function Profile({ id }) {
        const [user, setUser] = useState(null);
        useEffect(() => {
          fetch(`/api/users/${id}`)
            .then((response) => response.json())
            .then((data) => setUser(data));
        }, [id]);
        return <h2>{user.name}</h2>;
      }
    question: The profile page opens. What happens?
    choices:
      - text: It crashes on the first render
        correct: true
        feedback: >-
          Right. `user` is `null` until the data lands: "Cannot read properties of null".
      - text: An empty heading, then the name
        feedback: >-
          React doesn't skip the missing value. Reading `.name` on `null` throws before anything
          shows.
      - text: React waits for the data, then renders
        feedback: >-
          React renders straight away, and the effect only starts the request after that. The
          first render has no user.

  - type: prose
    id: loading-and-error
    body: |-
      So plan for three states: still loading, failed, or ready.

      ```tsx
      if (failed) return <p>Couldn't load the forecast</p>;
      if (forecast === null) return <p>Loading</p>;
      return <p>{forecast.summary}</p>;
      ```

      Put `.catch(fn)` at the end of the chain: it runs `fn` if any step failed. And remember,
      `fetch` only fails when the network does. Check `response.ok` for a 500 yourself.


      One more rule. Effects are for data the page needs because it's on screen. A request
      a person caused, like pressing Send, goes in that button's handler.

  - type: fill-blank
    id: fill-load-states
    concept: react.fetching-data
    difficulty: 2
    language: tsx
    prompt: >-
      Load the times for this bus stop, and treat a bad status as a failure. Ask again when
      the stop changes.
    template: |
      useEffect(() => {
        fetch(`/api/bus-times?stop=${stop}`)
          .then((response) => {
            if (!response.{{1}}) throw new Error('Bad status');
            return response.json();
          })
          .then((data) => setTimes(data))
          .{{2}}(() => setFailed(true));
      }, [{{3}}]);
    blanks:
      - key: '1'
        answer: ok
      - key: '2'
        answer: catch
      - key: '3'
        answer: stop
    bank: [ok, status, catch, finally, stop, times]

  - type: multiple-choice
    id: pick-where-to-fetch
    concept: react.fetching-data
    difficulty: 2
    question: A Subscribe button sends someone's email to the server. Where does that request go?
    choices:
      - text: In the button's click handler
        correct: true
        feedback: >-
          Yes. The person caused it, so it runs once, when they press the button.
      - text: In an effect that depends on `email`
        feedback: >-
          That sends a request every time the email changes, so once per letter typed.
      - text: In an effect with an empty array
        feedback: >-
          That runs once when the form appears, before anyone has typed or pressed anything.

  - type: prose
    id: late-answers
    body: |-
      You met this in the live search: answers can arrive out of order. Search `tea`, then
      `coffee`. If `tea` is slow, it lands last and wins.

      In an effect, the fix is a flag the cleanup sets:

      ```tsx
      useEffect(() => {
        let ignore = false;
        search(query).then((items) => {
          if (!ignore) setItems(items);
        });
        return () => { ignore = true; };
      }, [query]);
      ```

      When `query` changes, React cleans up first, so the old answer is ignored.

  - type: ai-review
    id: review-search-race
    concept: react.stale-responses
    difficulty: 3
    language: tsx
    request: Show search results for the query as the user types.
    flawClass: race
    code: |
      function Results({ query }: { query: string }) {
        const [items, setItems] = useState<string[]>([]);
        useEffect(() => {
          fetch(`/api/search?q=${query}`)
            .then((response) => response.json())
            .then((data) => setItems(data));
        }, [query]);
        return <ul>{items.map((item) => <li key={item}>{item}</li>)}</ul>;
      }
    prompt: >-
      An assistant wrote this. Its test searches once and passes. Someone types `tea`, then
      `coffee`, and sees tea results under "coffee". Tap the line at fault.
    lines: [6]
    reasons:
      - text: It stores an answer nobody is waiting for
        correct: true
        feedback: >-
          Yes. The late `tea` answer overwrites `coffee`. A cleanup flag would drop it.
      - text: '`query` shouldn''t be a dependency'
        feedback: >-
          Then it would never search again. Asking on each query is right. Old answers are the
          problem.
      - text: '`fetch` can''t run inside an effect'
        feedback: >-
          Fetching in an effect is fine. It needs a cleanup that marks old answers as unwanted.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Make `tea` answer after `coffee`, then check the list
          correct: true
          feedback: >-
            Yes. The bug only shows when an old answer lands last.
        - text: Search for `tea` once, then check the list
          feedback: >-
            That's the test it already passed. One search can't arrive out of order.
        - text: Search for `coffee` twice in a row
          feedback: >-
            Both answers are for the same query. Whichever lands last, the list is right.
    fix: |
      function Results({ query }: { query: string }) {
        const [items, setItems] = useState<string[]>([]);
        useEffect(() => {
          let ignore = false;
          fetch(`/api/search?q=${query}`)
            .then((response) => response.json())
            .then((data) => { if (!ignore) setItems(data); });
          return () => { ignore = true; };
        }, [query]);
        return <ul>{items.map((item) => <li key={item}>{item}</li>)}</ul>;
      }

  - type: code-challenge
    id: build-forecast
    concept: react.stale-responses
    difficulty: 4
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      `Forecast` gets a `city` and a `load(city)` function that returns a promise of `{
      summary, high }`. The tests pass a fake `load` and decide when each answer arrives.


      While loading, show `Loading`. Then show `Showers, high of 14°C`. If `load` fails, show
      `Couldn't load the forecast`.


      When the city changes, show `Loading` again, and ignore any answer for the old city.
    hints:
      - Look at what happens when the city changes before the first answer is back.
      - A flag set in the cleanup tells an old answer it's no longer wanted.
      - "Start the effect with `let ignore = false; setForecast(null); setFailed(false);`."

  - type: explain-back
    id: explain-ignore-flag
    concept: react.stale-responses
    difficulty: 4
    audience: incident
    kind: risk
    prompt: >-
      People report a product page that sometimes shows the reviews of the product they
      viewed before. Tell the incident channel the likely cause and how you'd prove the fix.
    rubric:
      - Each product change starts a request, and requests can finish in any order, so an old answer can land last.
      - With no cleanup, that late answer still calls `setReviews` and replaces the right reviews.
      - A cleanup that sets `ignore = true` drops old answers, proven by making the first request the slow one.
    modelAnswer: >-
      The page fetches reviews whenever the product changes, and answers don't arrive in
      order. If the previous product's request is slow, it lands last and overwrites the
      right reviews. The fix is a cleanup that sets `ignore = true`. React runs it before the
      new request starts, so the old answer is dropped. To prove it, a test makes the first
      product's answer the slow one. Then it checks the second product's reviews stay.

recap:
  - Load data in an effect that depends on what the component asks for.
  - Show a loading state, an error or the data, starting from no data at all.
  - Ignore answers that arrive after the question changed, with a cleanup flag.

recall:
  - id: card-null-first
    concept: react.fetching-data
    front: Why does `<h2>{user.name}</h2>` crash when `user` comes from a fetch in an effect?
    back: >-
      The first render happens before the request even starts, so `user` is still `null`.
      Handle the loading state first.
  - id: card-three-states
    concept: react.fetching-data
    front: Which three states does a component that loads data need to show?
    back: >-
      Loading, failed and ready. Check `response.ok` too, because a 500 doesn't make `fetch`
      reject.
  - id: card-handler-not-effect
    concept: react.fetching-data
    front: Where does a request go that a person causes by pressing a button?
    back: >-
      In the button's event handler, not in an effect.
  - id: card-ignore-flag
    concept: react.stale-responses
    front: How does an effect ignore an answer that arrives after its input changed?
    back: >-
      It keeps `let ignore = false`, sets it to `true` in the cleanup, and only sets state when
      `!ignore`.

