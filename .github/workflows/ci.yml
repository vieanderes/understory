# The fast gate on every push and pull request: a few minutes at most. Three small jobs run
# side by side, so the wall time is the slowest one, not the sum.
#
# What is not here is on purpose. The solution gates, coverage, the production build and
# the end-to-end suite take about an hour on a runner; they live in full-check.yml, started
# by hand before a release, and in `pnpm check` and `pnpm test:e2e` on your machine.
name: CI

on:
  # Every pull request, docs-only ones too: main requires these three checks, and a skipped
  # workflow never reports them, so the pull request could not be merged.
  pull_request:
  push:
    branches: [main]
    # Docs change nothing that runs. The news bot commits data/news/*.json every day, and
    # the news workflow validates those itself.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'data/news/**'
  # From the Actions tab, when a docs-only push left the badge without a fresh run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Content rules and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every rule a lesson file must follow, without running each solution (full-check.yml).
      - run: pnpm validate:content --no-gates
      - run: pnpm lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit
