deepDive: >-
  Everything ran with Docker 28.3 on a Mac, building a small TypeScript API bundled with
  esbuild 0.25 on `node:24-slim`. The cache log is real, trimmed of timings for the cached
  steps.


  The `Exec format error` came from copying the Mac's `node_modules` into a Linux image.
  esbuild ships a native program per platform, and `npm install` saw one already there.
  With `.dockerignore` listing `node_modules`, the install fetched the Linux one and the
  build passed. Without `.env` in `.dockerignore`, `docker run --rm image cat .env`
  printed the key. After adding it, the file wasn't there.


  `docker history --no-trunc` printed `ENV MODEL_API_KEY=sk-live-4f9a2c` for the flawed
  image. `ARG` values used in a `RUN` show up there too. A secret the build itself needs,
  such as a token for a private package registry, goes through a secret mount:
  `RUN --mount=type=secret,id=npmrc npm ci`. It's never written to a layer.


  Sizes: one stage 374 MB, multi-stage 348 MB. `node:24-slim` alone is 348 MB here, so the
  final stage adds almost nothing. The saving grows with the dev dependencies: a project
  with TypeScript, a test runner and a linter drops far more. `whoami` in the final image
  printed `node`.


  For the base image, `node:24-slim` pins the major version and still takes security fixes.
  A digest, `node:24-slim@sha256:...`, pins the exact bytes, and a bot can update it by pull
  request.
