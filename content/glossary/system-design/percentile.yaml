term: percentile
aka: [p50, p95, p99, tail latency]
short: The value a given share of measurements fall under, such as the time 95 in 100 requests beat.
explain: |
  Sort a thousand response times from fast to slow. The 950th one is the 95th of each
  hundred: 95% of requests were at least that fast, and 5% were slower.

  It shows what an average hides. An average of 120 ms can sit beside a p99 of four
  seconds, and that slow 1% is real people. One page often makes many requests, so most
  page loads meet at least one slow call. Percentiles can't be averaged across servers;
  merge the raw data or histograms instead.
analogy: Race results. The winner's time says little; how long it took for all but the last few runners to finish says how hard the course was.
usage: The average looks fine, but the p99 is four seconds; that's every user with a big cart.
related: [latency, throughput, slo]
level: 2
lessons: [perf.measure-first]
