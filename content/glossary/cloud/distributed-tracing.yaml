term: distributed tracing
aka: [trace, tracing, trace ID]
short: Following one request across every service it touches, as a tree of timed steps sharing one ID.
explain: |
  A checkout takes four seconds. It touched the API, the stock service, the payment
  service and the database. Which one was slow?

  Each step records a span: what it was, when it started, how long it took. Spans share a
  trace ID passed along in a header, so they assemble into a tree. The widest bar is where
  the time went. Traces are expensive to keep, so systems usually sample a share, keeping
  every slow or failed one.
analogy: A parcel's tracking history. Every depot scans it, so you see where it sat for two days.
example:
  language: text
  code: |
    POST /checkout                     4.1 s
    ├── stock.reserve                  0.1 s
    ├── payments.charge                3.8 s
    │   └── POST provider/charges      3.7 s
    └── db.insert order                0.1 s
usage: Distributed tracing shows the time is all in the payment call, not our database.
related: [structured-logging, metrics, observability, latency]
level: 2
lessons: [cloud.observability]
