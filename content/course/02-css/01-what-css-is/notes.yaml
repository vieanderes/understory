summary: >-
  HTML says what each part of a page is. CSS, short for Cascading Style Sheets, says how it
  looks. A style sheet is a list of **rules**. Each rule has a selector, which picks the
  elements, and a block of declarations, which set how they look. A declaration is one
  property and one value, such as `color: teal`.


  Keeping the look apart from the content is the whole point. The same HTML can wear a new
  design without a single tag changing, and one linked file can restyle every page of a site
  at once. A class, such as `class="price"`, is the hook that joins the two: the HTML labels
  what a thing is, and a `.price` rule decides how every price looks.


  CSS is forgiving in a way JavaScript isn't. When the browser meets something it can't read,
  it skips that part and carries on. That keeps pages working in old browsers, but it also
  means a typo fails in silence. Knowing how the browser reads your rules is what turns "it
  doesn't work" into a quick fix.
remember:
  - A rule is a selector plus a block of declarations, and each declaration is a property, a colon, a value and a semicolon.
  - The browser skips any declaration it can't read and carries on with the next one, with no message on the page.
  - A class selector starts with a dot and matches every element whose `class` attribute contains that name.
  - Every element has a value for every property, and the browser's own style sheet fills in the ones you never set.
  - When two rules with the same selector set the same property, the one that comes later wins.
  - A shorthand such as `border` or `background` sets several properties at once, and resets the ones you leave out.
  - Lengths need a unit, as in `20px`, and only zero may go without one.
  - One linked style sheet shared by every page means one edit restyles the whole site.
sections:
  - title: What the browser does with your CSS
    body: |-
      You met the DOM in the HTML chapter: the tree of objects the browser builds from your
      tags. CSS works on that tree, not on the file. For every element, the browser goes
      through the same steps.

      1. It finds every rule whose selector matches the element.
      2. For each property, it picks one value from those rules.
      3. For properties no rule sets, it uses a default.
      4. It works out sizes and positions, which is called **layout**.
      5. It paints the pixels.

      Step 3 matters more than it looks. Every element has a value for every property, all
      the time. Many come from the browser's own style sheet, which is why an unstyled `h1` is
      already big and bold. In Chromium it's 32px, weight 700, with a margin above and below.
      The `body` has 8px of margin on every side, which is why nothing touches the window
      edge.

      The value the browser settles on is the **computed value**, and it's often written
      differently from what you typed. JavaScript can ask for it with `getComputedStyle`,
      which takes an element and returns its final values:

      ```js
      // Page CSS: h1 { color: teal; }
      const heading = document.querySelector('h1');
      const style = getComputedStyle(heading);
      console.log(style.color); // rgb(0, 128, 128)
      console.log(style.fontSize); // 32px
      console.log(style.fontWeight); // 700
      ```

      The name `teal` has become `rgb(0, 128, 128)`: the amounts of red, green and blue, each
      from 0 to 255. That's why the checks in this course's playgrounds compare colours as
      `rgb()`, and why the browser's developer tools show them that way too.
  - title: When CSS fails, it fails quietly
    body: |-
      JavaScript stops at an error. CSS never does. The browser has a fixed recovery rule for
      each kind of mistake, and each one drops a different amount of your work.

      ```css
      p {
        colour: green;              /* unknown property: this line is skipped */
        text-align: centre;         /* unknown value: this line is skipped */
        font-size: 20;              /* no unit: this line is skipped */
        color: green font-weight: bold;
        background: gold;           /* still applies */
      }
      ```

      The first three lines each lose one declaration and nothing else. The fourth is sneakier.
      Without a semicolon after `green`, the browser reads one declaration whose value is
      `green font-weight: bold`. That isn't a colour, so both settings are lost. The next line
      is fine again, because the semicolon after `bold` ends the damage.

      A missing closing brace is worse. The browser keeps reading the next rule as part of this
      one, so the rest of that rule is lost too. When a whole rule seems to vanish, look at the
      brace above it.

      An invalid value also can't wipe out a good one. After `color: green; color: grean;`
      the text stays green, because the second line is dropped before the cascade ever sees it.

      One more quiet trap lives in the HTML. A page without `<!doctype html>` on its first line
      runs in **quirks mode**, which copies the habits of very old browsers. There,
      `font-size: 20` works and class names ignore capital letters. Then the same CSS breaks on
      a proper page. Always start with the doctype.

      The browser's developer tools show skipped declarations crossed out, with a warning
      icon. That's the fastest way to find a silent failure.
  - title: Shorthands and longhands
    body: |-
      Some properties are **shorthands**: one line that sets several properties at once. The
      ones it sets are called **longhands**.

      ```css
      .card {
        border: 3px dashed black;
        padding: 16px;
        background: gold;
      }
      ```

      `border` sets twelve longhands: a width, a style and a colour for each of the four
      sides, such as `border-top-width`. `padding: 16px` sets `padding-top`,
      `padding-right`, `padding-bottom` and `padding-left`. `background: gold` sets
      `background-color`, plus several background settings you haven't met yet.

      This is why the playground checks ask for `border-top-style` or `background-color`
      rather than `border` or `background`. Each shorthand is a bundle of longhands, and the
      longhands are what the browser compares and stores.

      Two rules follow from this. First, **a shorthand resets every longhand you leave out**.
      That can undo earlier work:

      ```css
      .notice { border-top-color: red; }
      .notice { border: 2px solid; }
      /* the top border is now black, not red: the shorthand reset its colour */
      ```

      A border colour left out of the shorthand resets to the text colour, here black.

      Second, **order decides between a shorthand and a longhand**. With
      `padding: 16px; padding-top: 4px;` the top is 4px and the rest 16px. Swap the two lines
      and all four sides are 16px, because the shorthand comes last and sets the top again.

      The same reset explains a classic puzzle. `border: 3px black` draws nothing at all. The
      style was left out, so it's reset to `none`, and a border with no style has no width.
      Always give a border its style: `solid`, `dashed` or `dotted`.
  - title: Where CSS lives, and naming classes well
    body: |-
      CSS can sit in three places, and each suits a different job.

      - **A linked file**, `<link rel="stylesheet" href="styles.css">` in the `head`. The
        browser downloads it once and keeps a copy, so the next page that links it loads
        faster. Every real site works this way.
      - **A `<style>` element** in the `head`. Handy for a one-page experiment or a demo. It
        can't be shared between pages.
      - **A `style` attribute** on one element. It styles only that element and beats your
        other rules, which the next lesson explains. Keep it for quick tests.

      A page can link several style sheets. The browser reads them in order, as if they were
      one long file, so a later sheet wins any tie with an earlier one.

      Class names deserve care, because they outlive any one design. Name a class after what
      the thing **is**, not how it looks today.

      ```html
      <p class="price">£12</p>          <!-- says what it is -->
      <p class="green-bold">£12</p>     <!-- says how it looks -->
      ```

      If prices turn blue next year, `.price { color: blue; }` still reads well.
      `.green-bold { color: blue; }` is now a lie, and renaming it means editing every page.
      Class names are case-sensitive in a proper page, so `.Price` doesn't match
      `class="price"`. Most teams write them in lower case with hyphens, such as `sold-out`.
pitfalls:
  - '**Leaving out a semicolon.** It feels optional because the last declaration works without one. In the middle of a rule it glues two declarations into one invalid value, and both are lost. End every declaration with a semicolon, the last one too.'
  - '**Writing British spellings in CSS.** The language uses American words: `color`, `center`, `gray` (though `grey` works as a colour name). `text-align: centre` is skipped in silence. When a declaration does nothing, check the spelling first.'
  - '**Forgetting a unit.** `font-size: 20` looks complete, but a length needs `px` or another unit, and the browser drops the line. Only `0` may stand alone. Also keep the number and unit together: `20 px` is invalid too.'
  - '**A dot in the wrong place.** The dot belongs in the CSS selector, `.new`, never in the HTML attribute, `class="new"`. `class=".new"` makes a class literally named `.new`, and a CSS selector without the dot, `new`, looks for a `<new>` element that doesn''t exist.'
  - '**A border with no style.** `border: 2px red` draws nothing, because the style resets to `none`. Write `border: 2px solid red`.'
interview:
  - question: What's the difference between HTML and CSS, and why keep them apart?
    answer: >-
      HTML describes what the content is, and CSS describes how it looks. An `h1` is the main
      heading whatever colour it is, and a screen reader, a search engine and a browser all
      read that meaning from the HTML. CSS then decides colour, size, spacing and layout.
      Keeping them apart means one linked style sheet can restyle every page at once, and the
      same content can wear a new design without its markup changing. It also keeps the HTML
      honest: a class names what something is, such as `price`, rather than how it looks. The
      one place the line blurs is a `style` attribute, which mixes look into the markup and is
      hard to override, so I keep that for quick experiments.
  - question: What does the browser do when it meets CSS it doesn't understand?
    answer: >-
      It skips the part it can't read and carries on, without any error on the page. An
      unknown property or an invalid value loses only that one declaration. A missing
      semicolon glues two declarations into one invalid value, so both go. A missing closing
      brace swallows the following rule. This forgiving design is deliberate: new CSS
      features can ship without breaking older browsers, which ignore what they don't know.
      The cost is that typos fail silently. So when a style doesn't apply, I open the
      developer tools, where skipped declarations are crossed out with a warning, instead of
      guessing.
  - question: When would you use a linked style sheet, a style element or a style attribute?
    answer: >-
      For real sites I use a linked file, almost always. Every page shares it, the browser
      downloads it once and keeps a copy, and one edit changes the whole site. A `<style>`
      element in the `head` suits a single page, a demo or a quick experiment, because it
      can't be shared. A `style` attribute styles one element and beats ordinary selectors,
      which makes it hard to override later and impossible to reuse, so I avoid it in
      hand-written CSS. The exception is a value set from JavaScript at run time, such as a
      progress bar's width, where the attribute is the natural home.
