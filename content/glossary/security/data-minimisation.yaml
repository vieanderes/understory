term: data minimisation
aka: [data minimization, minimisation, storage limitation]
short: Collecting and keeping only the personal data a stated purpose needs, for only as long as needed.
explain: |
  Every copy of personal data is a liability. It can leak, and it must be found when
  someone asks to be erased. The safest data is the data you never stored.

  Data protection law such as the GDPR makes this a duty. In practice: don't log full
  prompts by default, set expiry on caches and traces, and strip personal fields before
  adding real conversations to an eval set.
analogy: Packing for a weekend trip with a small bag. Less to carry, less to lose.
usage: Under data minimisation we can't keep raw chat logs forever; give them a thirty-day expiry.
related: [pii, redaction, pseudonymisation]
level: 2
lessons: [aisys.pii-and-privacy, security.abuse-and-privacy]
