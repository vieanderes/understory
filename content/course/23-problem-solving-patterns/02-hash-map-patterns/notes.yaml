summary: >-
  A hash map trades memory for time. It stores what you have already seen, so a question that
  a brute force answers by scanning the whole array again ("is its partner here?", "how many
  of these so far?") costs one lookup instead. That single change turns a large family of
  O(n²) problems into one pass, O(n) on average.


  Three shapes cover most interview questions. **Counting** maps each value to how many times
  it appears, and answers "most common", "appears once", "any duplicates" and "same letters".
  **Complement lookup** stores each item as you pass it, so a later item can ask in constant
  time whether its partner came first, as in two sum. **Grouping** computes a key that
  equivalent items share, such as sorted letters, and lets the map collect each group.


  Reach for a map when the brute force has an inner loop that searches for something, and the
  thing it searches for can be written as a key. Do not reach for one when the input is
  already sorted and memory matters (two pointers do the pair search in O(1) space), or when
  the values are small integers in a known range (a plain array of counts is faster and
  simpler).
remember:
  - A `Map` or `Set` answers "have I seen this?" and "how many so far?" in O(1) on average, which removes an inner search loop.
  - Counting, complement lookup and grouping by a key are the three hash-map shapes, and each runs in one O(n) pass.
  - In two sum, check for the complement before storing the current item, so an item never pairs with itself.
  - A grouping key must be equal for equivalent items and a primitive, such as a string, because a `Map` compares arrays and objects by reference.
  - The cost is O(n) extra memory in the worst case, and O(1) is an average, since many colliding keys make lookups slow.
  - Use a `Map`, not a plain object, when keys are numbers or user data, because object keys become strings and inherit prototype names.
  - If the values are small integers in a known range, an array indexed by value beats a map.
sections:
  - title: The three templates in JavaScript
    body: |-
      These three functions are the patterns stripped to their bones. Learn them as shapes
      you adapt, not as answers to one problem.

      ```js
      // Counting: value -> how many times it appears. O(n) time, O(d) space for d distinct values.
      function countAll(items) {
        const counts = new Map();
        for (const item of items) counts.set(item, (counts.get(item) ?? 0) + 1);
        return counts;
      }

      // Complement lookup: value -> where it was seen. O(n) time, O(n) space.
      function twoSum(nums, target) {
        const seen = new Map();
        for (let i = 0; i < nums.length; i++) {
          const need = target - nums[i];
          if (seen.has(need)) return [seen.get(need), i];
          seen.set(nums[i], i);
        }
        return null;
      }

      // Grouping: key -> the items that share it. O(n) time plus the cost of each key.
      function groupBy(items, keyOf) {
        const groups = new Map();
        for (const item of items) {
          const key = keyOf(item);
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(item);
        }
        return groups;
      }

      console.log([...countAll(['a', 'b', 'a'])]); // [['a', 2], ['b', 1]]
      console.log(twoSum([3, 8, 4, 6], 10)); // [2, 3]
      console.log(twoSum([5], 10)); // null
      console.log([...groupBy([1, 2, 3, 4], (n) => n % 2).values()]); // [[1, 3], [2, 4]]
      ```

      Two details matter in every variant. `?? 0` makes the first sighting count as 1 without
      a separate `if`. And a `Map` iterates in insertion order, so "keep groups in the order
      their first item appeared" comes free.
  - title: 'Three more classics: first unique, longest run, subarray sums'
    body: |-
      **First unique character.** Count every character, then walk the string again and
      return the first with a count of 1. Two passes, O(n) time, and O(1) space if the
      alphabet is fixed.

      ```js
      function firstUniqueIndex(text) {
        const counts = new Map();
        for (const ch of text) counts.set(ch, (counts.get(ch) ?? 0) + 1);
        for (let i = 0; i < text.length; i++) {
          if (counts.get(text[i]) === 1) return i;
        }
        return -1;
      }

      console.log(firstUniqueIndex('swiss')); // 1
      console.log(firstUniqueIndex('aabb')); // -1
      console.log(firstUniqueIndex('')); // -1
      ```

      **Longest run of consecutive values**, in any order: `[100, 4, 200, 1, 3, 2]` holds 1, 2,
      3, 4, so the answer is 4. Sorting gives O(n log n). A `Set` gives O(n): only start
      counting from a value whose predecessor is missing, so each run is walked once.

      ```js
      function longestConsecutive(nums) {
        const values = new Set(nums);
        let best = 0;
        for (const v of values) {
          if (values.has(v - 1)) continue; // not the start of a run
          let length = 1;
          while (values.has(v + length)) length++;
          best = Math.max(best, length);
        }
        return best;
      }

      console.log(longestConsecutive([100, 4, 200, 1, 3, 2])); // 4
      console.log(longestConsecutive([1, 1, 2])); // 2
      console.log(longestConsecutive([])); // 0
      ```

      **Count subarrays that sum to k.** This is complement lookup on running totals. If the
      total so far is `sum`, every earlier total equal to `sum - k` marks the start of a slice
      summing to k. It works with negative numbers, where a sliding window fails. O(n) time,
      O(n) space.

      ```js
      function countSubarraysWithSum(nums, k) {
        const seen = new Map([[0, 1]]); // the empty prefix
        let sum = 0;
        let count = 0;
        for (const x of nums) {
          sum += x;
          count += seen.get(sum - k) ?? 0;
          seen.set(sum, (seen.get(sum) ?? 0) + 1);
        }
        return count;
      }

      console.log(countSubarraysWithSum([1, 1, 1], 2)); // 2
      console.log(countSubarraysWithSum([3, -1, 1, 2], 2)); // 3
      console.log(countSubarraysWithSum([], 0)); // 0
      ```

      The `[0, 1]` seed counts slices that start at index 0. Forgetting it is the classic bug.
  - title: Choosing the key, and Map versus object
    body: |-
      A `Map` compares keys with SameValueZero: primitives by value, objects and arrays by
      reference. Two separate arrays `[1, 2]` are two different keys. So when the natural key
      is a tuple, such as a grid cell or a pair of values, turn it into a string or a number.

      ```js
      const byArray = new Map();
      byArray.set([1, 2], 'a');
      console.log(byArray.has([1, 2])); // false

      const byString = new Map();
      byString.set(`${1},${2}`, 'a');
      console.log(byString.has('1,2')); // true

      // A cell in a grid of width w also fits in one number.
      const w = 1000;
      const cellKey = (row, col) => row * w + col;
      console.log(cellKey(3, 7)); // 3007

      // Plain objects turn keys into strings.
      const obj = {};
      obj[1] = 'number';
      obj['1'] = 'string';
      console.log(Object.keys(obj)); // ['1']
      ```

      Prefer `Map` for interview code. Object keys are always strings, so `1` and `'1'`
      collide, and a key such as `constructor` already exists on every object through its
      prototype. A `Map` also has `size` and keeps insertion order for every key type.

      For anagram keys, the sorted string costs O(k log k) per word. A count key, the 26
      letter counts joined with a separator, costs O(k) for lowercase letters. The separator
      matters: without it, counts of 1 and 11 can produce the same string.

      In Python the same tools are `dict`, `set`, `collections.Counter` and
      `collections.defaultdict(list)`. Lists are not hashable there, so tuple keys are the
      idiom.

      ```python
      from collections import Counter, defaultdict

      print(Counter('banana').most_common(1))  # [('a', 3)]
      groups = defaultdict(list)
      for word in ['tab', 'eat', 'bat']:
          groups[''.join(sorted(word))].append(word)
      print(list(groups.values()))  # [['tab', 'bat'], ['eat']]
      ```
  - title: From brute force to one pass, said aloud
    body: |-
      A live answer to two sum sounds like this, and the same arc fits every map problem.

      1. "The brute force tries every pair, O(n²) time, O(1) space. For 100,000 numbers that's
         about 5 billion pairs, too slow."
      2. "The inner loop is searching for one specific value, `target - x`. Searching for a
         known value is what a hash map is for."
      3. "So I walk once. For each number I ask the map whether its complement was seen. If
         so I'm done. If not I store this number with its index."
      4. "Check before storing, so a 5 doesn't pair with itself for a target of 10. Two equal
         values still work: the second 5 finds the first."
      5. "O(n) time on average, O(n) extra space. If the input were sorted I'd use two pointers
         instead and keep O(1) space."

      Name the edge cases before the interviewer does: an empty array, no pair at all,
      duplicates, negative numbers (a map does not care), and whether the answer needs
      indices or values. If they want every pair rather than one, say so early: counting
      pairs uses a count map and adds `counts.get(need)` at each step instead of returning.
pitfalls:
  - "**Storing before checking.** Adding the current item to the map before looking up its complement lets it pair with itself: target 10 and a single 5 returns `[0, 0]`. Look up first, then store."
  - "**Arrays or objects as keys.** `map.set([r, c], v)` stores a key nothing else can find, because a new array is a new reference. Build a string such as `` `${r},${c}` `` or a number such as `r * width + c`."
  - "**Plain objects as counters.** Numeric keys become strings, and names like `constructor` or `__proto__` behave strangely. Use a `Map`, or `Object.create(null)` if you must use an object."
  - "**Forgetting the zero seed in prefix-sum counting.** Without `seen.set(0, 1)` before the loop, slices that start at index 0 are never counted."
  - "**Sorting to build a key without copying.** `word.split('').sort()` is fine because `split` makes a new array, but sorting the input array itself to build a key mutates the caller's data."
  - "**Calling it O(1) worst case.** Hash lookups are O(1) on average. If an interviewer asks about the worst case, say O(n) per lookup with many collisions, and mention that runtimes such as Python randomise string hashing to make crafted collisions hard."
interview:
  - question: Why does a hash map make two sum O(n), and what does it cost?
    answer: >-
      It replaces the inner search loop with a constant-time lookup, at the price of O(n)
      memory. The brute force pairs every number with every other one, n² work. But for a
      given `x`, only one partner can work, `target - x`, so the inner loop is really a
      search for a known value. Storing each number with its index as I pass it means each
      later number asks the map once. That's one lookup and one insert per item, so O(n)
      time on average. The trade-off is space and constant factors: for a small array the
      nested loop is fine, and if the input is sorted, two pointers find the pair in O(n)
      time with O(1) space.
  - question: How would you group a list of words into anagrams, and what's the complexity?
    answer: >-
      I compute a key that all anagrams share and group by it in a `Map`. The simplest key
      is the word's letters sorted, so `listen` and `silent` both become `eilnst`. One pass
      over n words of length up to k costs O(n × k log k) for the sorting, plus O(n × k)
      space for the keys and groups. If the alphabet is fixed, such as lowercase letters, I
      can build the key from 26 letter counts joined with a separator, which is O(k) per
      word. The `Map` keeps insertion order, so groups come out in the order their first word
      appeared, which interviewers often ask for.
  - question: When would you not use a hash map for a counting problem?
    answer: >-
      When the values are small integers in a known range, I use an array indexed by value
      instead. For example, if every value lies between 1 and n, `counts[value]++` in an
      array of length n + 1 does the same job with no hashing, less memory overhead and
      better cache behaviour. I'd also avoid extra memory when the input is sorted, because
      equal values are adjacent and one pass with a previous-value variable counts them. And
      if memory is tightly limited and the array can be reordered, sorting then scanning
      gives O(n log n) time with little extra space. A map stays the default for arbitrary
      keys like strings.
  - question: Is a hash map lookup really O(1)?
    answer: >-
      On average yes, in the worst case no. A lookup hashes the key to a bucket and compares
      the few keys there. With a good hash function and a table that grows as it fills, the
      expected number of comparisons stays constant, so n operations cost O(n) overall,
      including the occasional resize. But if many keys hash to the same bucket, a lookup
      degrades towards O(n). Attackers have exploited that with crafted keys, which is why
      many runtimes, Python among them, randomise their string hashing. In an interview I say "O(1) average" and
      mention the worst case if asked, because the distinction shows I know what the
      structure is doing.
terms:
  - term: Hash map lookup
    say: A hash map lookup is always O(1).
    means: The key is hashed to a bucket and compared with the few keys there, which is O(1) on
      *average*. When many keys collide in one bucket, a lookup degrades towards O(n).
  - term: Complement lookup
    say: Store everything in a map, then look for pairs.
    means: In one pass, each item asks whether `target - item` is already in the map, and only then
      stores itself. Checking before storing stops an item pairing with itself.
  - term: Frequency map
    say: An object where you count things.
    means: A map from each distinct value to how many times it appears, built in one O(n) pass. Use a
      `Map` when keys are numbers or user data, since object keys become strings and inherit
      prototype names.
  - term: Grouping key
    say: Group the items that look alike.
    means: A primitive, usually a string such as the sorted letters of a word, that is equal for exactly
      the items that belong together. An array can't be the key, because a `Map` compares arrays by
      reference.
  - term: Space-time trade-off
    say: The faster algorithm is always the better one.
    means: A hash map spends up to O(n) extra memory to remove an inner search loop. If memory is tight
      or the input is sorted, a sort or a single scan can be the better choice.
