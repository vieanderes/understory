term: N+1 query
aka: [N+1 problem, N+1 queries]
short: One query for a list, then one more query per item, when a single query would do.
explain: |
  You load 50 blog posts. Then, for each post, you fetch its author. That's 1 query for the
  list and 50 for the authors. Each is quick, but 51 trips to the database add up.

  It hides inside loops, ORMs and GraphQL resolvers, and it grows with your data: fine with
  ten rows in development, painful with a thousand in production. Fix it with a join, with
  one `WHERE id IN (...)` query for all the authors, or with a batching loader. Count
  queries per request in your logs to catch it.
analogy: Going to the shop fifty times for fifty items, instead of taking one list.
example:
  language: ts
  code: |
    const posts = await db.query('SELECT * FROM posts LIMIT 50');
    for (const post of posts) {
      // one more round trip per post
      post.author = await db.query(
        'SELECT * FROM users WHERE id = $1', [post.author_id]);
    }
usage: The feed makes 201 queries per request; it's a classic N+1 query on comments.
related: [join, orm, query-plan]
level: 2
lessons: [db.from-code, perf.backend-performance]
