term: time to first token
aka: [TTFT, first-token latency]
short: How long a user waits between sending a request and seeing the first word of the reply.
explain: |
  A streamed reply can take ten seconds to finish and still feel quick, because words
  start appearing after half a second. That first wait is what people feel.

  It grows with the length of the prompt the model must read before writing, and shrinks
  with prompt caching. When nobody watches a stream, as in a background job, total time
  matters instead.
analogy: A waiter bringing bread while the kitchen cooks. The meal takes as long, the wait feels shorter.
usage: The chat feels slow because time to first token is four seconds; trim the retrieved context.
related: [latency, streaming, prompt-caching, token]
level: 2
lessons: [aisys.cost-and-latency]
