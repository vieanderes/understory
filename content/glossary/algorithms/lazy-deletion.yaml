term: lazy deletion
aka:
  - tombstone marking
  - mark and skip
short: Marking an item as removed instead of taking it out, and skipping it when it is reached later.
explain: |
  Removing an item from the middle of a heap is slow, because you have to find it first.
  Yet a cancelled payment still has to stop.

  So don't remove it. Mark it cancelled, in a set or a flag. When the heap pops it later,
  check the mark and throw it away. Each operation stays O(log n).

  The cost is memory: marked items linger until they reach the top. If most items get
  cancelled, rebuild the heap now and then.
analogy: Crossing a name off a waiting list instead of rewriting the whole list.
example:
  language: python
  code: |
    cancelled = set()
    def next_due(heap):
        while heap and heap[0][1] in cancelled:
            heapq.heappop(heap)
        return heap[0] if heap else None
usage: Cancel by lazy deletion; searching the heap for the payment would be linear.
