term: timeout
aka: [ deadline, request timeout ]
short: A limit on how long code waits for a reply before giving up.
explain: |
  A call to another service can hang forever. Without a limit, your request waits too, and
  so does everyone queued behind it. One slow box takes the rest down with it.

  Every network call needs one, sized to whoever is waiting: seconds for a person, minutes
  for a batch job. Retries multiply it. Three tries of ten seconds is a thirty-second wait.
analogy: Leaving the bus stop after twenty minutes and walking, instead of waiting all night.
example:
  language: ts
  code: |
    const res = await fetch(url, {
      signal: AbortSignal.timeout(3_000),
    });
usage: The payment call has no timeout, so one slow provider ties up every worker.
related: [ retry, latency-budget, hard-dependency, circuit-breaker ]
level: 1
lessons: [sysdesign.the-method, ai.failures, interview.llm-client-build, backend.calling-other-apis, agents.when-a-part-fails]
