summary: >-
  Every running app needs the same jobs done: patching, deploys, certificates, balancing,
  restarts, backups and recovery. Choosing where to host is choosing which of those jobs
  stay with your team and which you pay a provider to do. A VPS keeps them all, a managed
  platform takes most of them, serverless functions take nearly all of them for short
  work, and Kubernetes hands you a flexible tool that someone still has to run.


  The choice is rarely about the monthly invoice. For a small team, engineer hours cost far
  more than servers, so the cheapest option on paper is often the most expensive in
  practice. For a large organisation, the sums flip: thousands of instances make platform
  margins expensive, and a platform team running Kubernetes pays for itself.


  These notes add the arithmetic that makes the choice defensible, the ownership each model
  leaves with you, how to keep an app portable so the decision isn't permanent, and what a
  platform team really builds when it builds a golden path.
remember:
  - Choosing a hosting model is choosing which operations jobs stay yours, and engineer time usually outweighs the server bill.
  - A VPS gives root and a flat price, and you own patching, deploys, TLS, backups and 3 a.m. recovery.
  - A managed platform builds, runs, balances and restarts your app, and you pay more per unit and accept its limits.
  - Kubernetes pays off with many services, several teams and people whose job is to run the cluster.
  - Redundancy means copies on different machines, ideally in different failure zones, never three processes on one box.
  - An app in a container that reads config from the environment and keeps no local state can move between models in days.
  - A golden path is a supported default for building and running a service, and a team that leaves it owns the extra work.
sections:
  - title: Putting numbers on the choice
    body: |-
      A defensible hosting decision compares total cost: the provider's price plus the hours
      your team spends keeping it running, priced at what those hours cost the business.

      ```ts
      type Option = { name: string; pricePerMonth: number; opsHoursPerMonth: number };

      function totalCost(option: Option, hourlyRate: number): number {
        return option.pricePerMonth + option.opsHoursPerMonth * hourlyRate;
      }

      const options: Option[] = [
        { name: 'one VPS', pricePerMonth: 40, opsHoursPerMonth: 12 },
        { name: 'managed platform', pricePerMonth: 180, opsHoursPerMonth: 2 },
        { name: 'own Kubernetes', pricePerMonth: 300, opsHoursPerMonth: 40 },
      ];

      for (const option of options) {
        console.log(option.name, totalCost(option, 60));
      }
      // one VPS 760, managed platform 300, own Kubernetes 2700
      ```

      The numbers are illustrative, and the shape is what matters. The platform's invoice is
      four times the VPS's, yet it's the cheapest once a dozen hours of patching and
      certificate trouble are counted. The ops hours for your own cluster are the part teams
      underestimate most: upgrades every few months, networking, policies and node pools.

      Two more costs hide outside the invoice. **Opportunity cost**: hours on servers are
      hours not spent on the product. And **risk**: a VPS run by one person has a bus
      factor of one. When that person is on holiday, nobody can restore the backup.

      Redo the sums when something big changes: traffic grows tenfold, the team doubles,
      or a compliance rule arrives that the platform can't meet.
  - title: What stays yours in each model
    body: |-
      Providers describe this as **shared responsibility**: they secure and run their layer,
      you secure and run yours. The line moves with each model.

      - **VPS.** The provider keeps the hardware, the hypervisor and the network running.
        You own the operating system, its updates, the firewall, the proxy, TLS, the
        runtime, deploys, monitoring, backups and restores.
      - **Managed platform.** The provider also owns the operating system, the runtime
        image, builds, TLS, balancing and restarts. You own your code, its dependencies,
        configuration, secrets, data and its backups unless you buy a managed database.
      - **Serverless functions.** The provider also owns scaling and idle cost. You own the
        handler, its time limit, its connections to other systems and your data.
      - **Kubernetes, managed control plane.** The provider runs the control plane. You own
        the nodes or node pools, cluster upgrades, networking policies, ingress,
        certificates inside the cluster, and every workload's manifests.

      Two jobs never leave you in any model: **your data** and **your application's
      security**. A platform restarts a crashed app, but it doesn't know your SQL injection
      bug exists, and deleting a table on a managed database is still your outage. Check
      that backups exist and that you have restored one, whatever the model.
  - title: Keeping the decision reversible
    body: |-
      Most hosting choices are two-way doors, if the app is built for it. The habits that
      keep it portable come from the twelve-factor style: one build artefact, configuration
      from the environment, no local state, and logs to standard output.

      ```ts
      function required(name: string): string {
        const value = process.env[name];
        if (!value) throw new Error(`Missing environment variable ${name}`);
        return value;
      }

      export const config = {
        port: Number(process.env.PORT ?? 3000),
        databaseUrl: required('DATABASE_URL'),
        modelApiKey: required('MODEL_API_KEY'),
      };
      ```

      This module runs the same on a laptop, a VPS, a platform or a Pod. Failing at start-up
      when a variable is missing is deliberate: a crash on deploy is found in seconds, a
      missing key found at the first model call is found by a customer. Reading `PORT` matters
      because many platforms tell the app which port to listen on.

      **Lock-in** grows with each proprietary service you adopt: a platform's own queue, its
      key-value store, its edge middleware, its image pipeline. Each can be worth it. Before
      adopting one, ask how you'd replace it, and put it behind a small interface in your
      code so a replacement touches one file. Standard PostgreSQL, S3-compatible storage and
      a container image are the most portable pieces you can pick.
  - title: What a platform team builds
    body: |-
      Once an organisation has dozens of services, the same work repeats in every team:
      Dockerfiles, CI pipelines, dashboards, alert rules, secrets wiring. A **platform team**
      builds that once and offers it as a product to the other teams, who are its customers.

      A golden path is usually a template plus the automation behind it. Creating a new
      service from it gives a repository with a Dockerfile that follows the house rules, a
      CI workflow that tests, scans and builds the image, deploy manifests, a health
      endpoint, structured logging, a default dashboard and a paging rule. The team writes
      business code on day one.

      The platform team measures itself like a product: how many services use the path, how
      long a new service takes to reach production, and what teams ask for that the path
      lacks. When several teams leave the path for the same reason, that's a feature request,
      as with the search engine in the lesson.

      The word "golden" matters. A path that's mandatory becomes a gate, and teams route
      around gates. A path that's the easiest way to do the right thing gets used because
      it's easier, and the platform team earns adoption instead of enforcing it.
pitfalls:
  - '**Comparing invoices instead of total cost.** The VPS looks cheapest because nobody priced the hours spent patching it. Add ops hours at a realistic rate before choosing.'
  - '**Choosing Kubernetes for scale you don''t have.** It front-loads months of learning and ongoing upgrades. Start on a platform and move when real limits or prices push you.'
  - '**Calling copies on one machine redundancy.** One host failure takes every copy with it. Spread copies across machines, and across zones for anything customers pay for.'
  - '**Assuming a managed service means managed backups.** Many platforms run your app but not your data''s recovery. Confirm what is backed up, how long it''s kept, and test a restore.'
  - '**Adopting every proprietary add-on on day one.** Each one ties you to the provider. Wrap them behind small interfaces, and prefer standard PostgreSQL and object storage.'
  - '**Making the golden path mandatory.** Teams with real needs get blocked and resentful. Keep it the default, let teams leave it, and treat repeated departures as feature requests.'
verify:
  - lens: breaks
    check: 'Redundant copies run on separate machines, since copies on one VPS fail together with it.'
  - lens: scales
    check: 'The hosting choice matches the team''s size, so nobody has to run a cluster when two people build the whole product.'
  - lens: confuses
    check: 'The app reads its configuration from the environment, so moving between hosting models takes days, not a rewrite.'
  - lens: tests
    check: 'A restore or failover drill on the chosen host shows how long you would really be down.'
interview:
  - question: How would you decide where to host a new product?
    answer: >-
      I'd pick the option with the lowest total cost for the team we have, which for most new
      products is a managed platform plus a managed database. Total cost means the invoice
      plus the engineer hours spent on patching, deploys, TLS, scaling and recovery, and at
      small scale the hours dominate. I'd check the platform meets hard constraints first:
      data residency, compliance, time limits, and any need for GPUs or root. I'd also keep
      the app portable, a container with config from the environment and no local state, so
      moving later costs days rather than months. The trade-off is a higher unit price and
      the platform's limits, which I'd revisit when traffic or team size changes by an order
      of magnitude.
  - question: When is Kubernetes the right choice, and when isn't it?
    answer: >-
      It's right when many services and several teams share infrastructure, and there are
      people whose job is to run the cluster. Then it gives a common way to deploy, scale,
      heal and roll back everything, and a platform team can build golden paths on top. It
      isn't right for a small team with a few services. A cluster brings upgrades,
      networking, policies, certificates and node management, which is a second job for
      three developers, and a managed platform gives them healing and rollouts without it. A
      managed control plane such as EKS or GKE removes some of the work but not the
      workload-level decisions. My rule is: adopt it when the platform you're on is the
      bottleneck, not in advance.
  - question: How do you avoid vendor lock-in without giving up managed services?
    answer: >-
      I accept lock-in where it buys a lot and make it cheap to undo everywhere else. The
      portable core is a container image, configuration from environment variables, standard
      PostgreSQL and S3-compatible object storage. Proprietary services, such as a platform's
      queue or edge middleware, go behind a small interface in the code, so a replacement
      touches one adapter. I'd also keep infrastructure in code, so the setup is written down
      and reproducible. What I wouldn't do is avoid managed services on principle: running
      your own database to stay portable usually costs more than a migration ever would. The
      goal is a reversible decision, not zero dependency.
  - question: Your team runs three copies of the app for resilience. What questions do you ask?
    answer: >-
      Where do they run, and what do they share. Three processes on one VPS survive a crash
      in one process but not a host failure, a disk filling up or a kernel update, so I'd
      want them on separate machines, ideally in separate availability zones. Then I'd look
      for shared single points: one load balancer, one database, one Redis, one region. A
      managed load balancer and a managed database with a standby usually cover the first
      two. I'd also ask whether the copies are stateless, since sessions in memory break as
      soon as traffic spreads. The trade-off is cost: each extra zone or standby is paid for
      all the time, so I'd match the redundancy to what an hour of downtime really costs.
  - question: How would you run an AI web app on Google Cloud?
    answer: >-
      Map each part to a managed service. **Cloud Run** runs the API and the front end as
      containers that scale with traffic, down to zero, and it supports streamed responses,
      though I'd raise the request timeout for long answers. **GKE** is the step up when I
      need full Kubernetes. **Vertex AI** serves Gemini and other models, embeddings and
      vector search, and hosts agents built with ADK. Data goes in **Cloud SQL** for
      Postgres or **Firestore** for documents, keys in **Secret Manager**, and **Cloud
      Build** with **Artifact Registry** builds and stores images for CI/CD. Cloud Logging,
      Monitoring and Trace cover observability. It's the same shape as AWS, with Cloud Run
      in the place of App Runner or Fargate, so the design skills carry across providers.
