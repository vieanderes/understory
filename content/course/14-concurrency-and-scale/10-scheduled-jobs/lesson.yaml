id: scale.cron
title: Scheduled jobs
objective: Run a scheduled job once across servers, survive missed runs, and keep schedules in UTC.
level: advanced
minutes: 10
concepts: [scale.single-runner, scale.leases, scale.catch-up, scale.schedule-time-zones]
prerequisites: [scale.queues-and-workers, db.constraints]
opening:
  text: >-
    You'll write a nightly job that runs once, even on four servers or after an outage. And
    it'll survive the night the clocks change, where most scheduled-job bugs hide.

steps:
  - type: prose
    id: what-cron-is
    body: |-
      Some work runs on a timetable, not on a request: a daily email, a nightly eval run over
      yesterday's model answers. **Cron** is the classic scheduler. Each line of its
      **crontab** is a time pattern, then a command:

      ```bash
      # minute hour day-of-month month day-of-week   command
      0 3 * * *   node send-digest.js
      ```

      A star means "every", so this runs at 03:00 each day. Cron starts the command on time,
      and never checks whether the last run has finished.

  - type: multiple-choice
    id: pick-overlap
    concept: scale.leases
    difficulty: 1
    question: A job runs every 5 minutes. Tonight one run takes 7. What happens at the next start?
    choices:
      - text: A second run starts beside the first
        correct: true
        feedback: >-
          Right. Cron doesn't watch its jobs, so two runs work at once.
      - text: Cron waits for the first run to finish
        feedback: >-
          That would be kind, but cron only looks at the clock. It starts the command regardless.
      - text: Cron stops the slow run
        feedback: >-
          Cron never stops a job it started. The slow run carries on, and a new one joins it.

  - type: prose
    id: claim-the-tick
    body: |-
      Now the app runs as four copies, each with the same crontab. At 03:00 all four send
      the digest, and every customer gets it four times.

      So each copy first **claims** the run in the database. The table's primary key is the
      job and its scheduled time, its **slot**:

      ```sql
      INSERT INTO job_runs (job, slot, claimed_by)
      VALUES ('digest', '2026-10-01 03:00+00', 'copy-2')
      ON CONFLICT (job, slot) DO NOTHING
      RETURNING job;
      ```

      Only the copy that gets a row back runs the job.

  - type: sql
    id: claim-two-jobs
    concept: scale.single-runner
    difficulty: 2
    prompt: >-
      Copy 2 wakes at 03:00 for two jobs. Copy 1 already claimed the digest, so the first
      insert fails and the backup never gets claimed. Make each claim quietly do nothing when
      it's taken.
    setup: |
      CREATE TABLE job_runs (
        job text,
        slot timestamptz,
        claimed_by text,
        PRIMARY KEY (job, slot)
      );
      INSERT INTO job_runs VALUES ('digest', '2026-10-01 03:00+00', 'copy-1');
    starter: |
      INSERT INTO job_runs (job, slot, claimed_by)
      VALUES ('digest', '2026-10-01 03:00+00', 'copy-2')
      RETURNING job;

      INSERT INTO job_runs (job, slot, claimed_by)
      VALUES ('backup', '2026-10-01 03:00+00', 'copy-2')
      RETURNING job;
    solution: |
      INSERT INTO job_runs (job, slot, claimed_by)
      VALUES ('digest', '2026-10-01 03:00+00', 'copy-2')
      ON CONFLICT (job, slot) DO NOTHING
      RETURNING job;

      INSERT INTO job_runs (job, slot, claimed_by)
      VALUES ('backup', '2026-10-01 03:00+00', 'copy-2')
      ON CONFLICT (job, slot) DO NOTHING
      RETURNING job;
    checks:
      query: SELECT job, claimed_by FROM job_runs ORDER BY job
    showSchema: true
    hints:
      - Run it and read the error. The primary key refuses a second claim of the same slot.
      - '`ON CONFLICT (job, slot) DO NOTHING` goes after `VALUES` and before `RETURNING`.'
      - Add it to both inserts. A claim that does nothing returns no row.

  - type: prose
    id: leases
    body: >-
      The claim stops four copies running one slot. For the 5-minute job that overran, you
      want something else: no new run while one is still going.


      That's a **lease**: a lock kept in a shared store, with an expiry time. A run takes it,
      works, then releases it. If the run crashes, the lease expires on its own. So it must
      last longer than the job ever takes.

  - type: ai-review
    id: review-short-lease
    concept: scale.leases
    difficulty: 3
    language: js
    request: Stop the price sync from running twice at once.
    flawClass: race
    code: |
      // runs every 5 minutes; a slow night takes 7
      async function syncPrices() {
        const got = await leases.take('sync-prices', { forMs: 60_000 }); // one minute
        if (!got) return;
        try {
          await copyPricesFromSupplier();
        } finally {
          await leases.release('sync-prices');
        }
      }
    prompt: >-
      Your teammate's assistant added a lease, and the review looks fine. On slow nights two
      syncs still overlap. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The lease runs out while the job is still working
        correct: true
        feedback: >-
          Yes. It expires after a minute, and the next run takes it mid-sync.
      - text: The release belongs outside the `finally`
        feedback: >-
          `finally` is right: the lease is freed even when the sync throws.
      - text: A run that misses the lease should throw
        feedback: >-
          Returning quietly is the point. Another run holds the lease and is doing the work.
    fix: |
      // longer than the slowest run we've seen
      const got = await leases.take('sync-prices', { forMs: 15 * 60_000 });

  - type: prose
    id: watermarks
    body: >-
      Servers go down. A digest that sends "the last 24 hours" skips everything from a day it
      missed. Run it twice, and it sends the same items twice.


      Instead, store a **watermark**: the time everything up to has been sent. Each run
      covers from the watermark to now, then moves it. A late run fills the gap, and a
      repeat finds nothing new.

  - type: code-challenge
    id: write-run-digest
    concept: scale.catch-up
    difficulty: 3
    language: ts
    editable: '17-20'
    prompt: >-
      `runDigest` sends "the last 24 hours", so outages leave holes and reruns send
      duplicates. Make it use the watermark in `store`.


      Read it, send what's new since then up to `now`, then save `now` as the watermark.
      Skip `send` when there's nothing new. If `send` throws, leave the watermark alone.
      Return how many items were sent.
    hints:
      - The start of the window is `await store.getWatermark()`, not `now - DAY`.
      - Save the watermark after `send`, so a failed send is covered by the next run.
      - "Start with `const from = await store.getWatermark();`"

  - type: prose
    id: schedules-in-utc
    body: >-
      One more trap: local time isn't a straight line. One night each spring, London's
      clocks jump from 00:59 to 02:00, so a job set for 01:30 never runs. One night each
      autumn, 01:30 happens twice.


      **UTC**, the world's reference time, has no daylight saving. Schedule in UTC, and make
      the job safe to run twice anyway.

  - type: explain-back
    id: explain-local-time-schedule
    concept: scale.schedule-time-zones
    difficulty: 3
    prompt: >-
      A billing job is scheduled for 01:30 London time. Twice a year it misbehaves. Why, and
      what would you change?
    rubric:
      - When the clocks go forward an hour is skipped, so a time inside it never comes and the job doesn't run.
      - When the clocks go back an hour repeats, so the job can run twice.
      - Schedule in UTC, which has no daylight saving, and keep the job safe to repeat with a claim or watermark.
    modelAnswer: >-
      Local time skips and repeats an hour each year. In spring, London goes from 00:59
      straight to 02:00, so 01:30 never happens and billing is skipped. In autumn, 01:30
      comes round twice, so it can bill twice. I'd move the schedule to UTC, where every time
      happens once a day. I'd also claim each run in the database, so a repeat bills nobody
      twice.

recap:
  - Claim each scheduled run in the database, so four servers send one email, not four.
  - Hold a lease that outlasts the job, so a slow run can't overlap the next.
  - Work from a watermark and schedule in UTC, so missed, repeated or odd nights do no harm.

recall:
  - id: card-overlap
    concept: scale.leases
    front: What does cron do when a job is still running at its next start time?
    back: >-
      Starts it again. Cron only watches the clock, so two runs work at once unless the job
      takes a lock.
  - id: card-claim-slot
    concept: scale.single-runner
    front: Four copies of your server all fire the 03:00 job. How does exactly one run it?
    back: >-
      Each inserts a row keyed by job and slot with `ON CONFLICT DO NOTHING`. Only the copy
      that gets a row back runs it.
  - id: card-lease
    concept: scale.leases
    front: Why does a lease expire, and how long should it last?
    back: >-
      So a crashed holder can't keep it for ever. It must last longer than the slowest run.
  - id: card-watermark
    concept: scale.catch-up
    front: How does a watermark make a periodic job safe after downtime?
    back: >-
      Each run covers from the stored watermark to now, so a missed day is included, and a
      repeat finds nothing new.
  - id: card-dst
    concept: scale.schedule-time-zones
    front: What goes wrong with a local-time schedule when the clocks change?
    back: >-
      One night an hour is skipped, so the job never runs. Another night an hour repeats, so
      it can run twice. UTC avoids both.

references:
  - kind: docs
    title: crontab(5)
    authors: Paul Vixie
    venue: Linux manual page
    url: https://man7.org/linux/man-pages/man5/crontab.5.html
    note: The five time fields, ranges, lists and steps.
    primary: true
    verified: true
  - kind: docs
    title: CronJob
    authors: The Kubernetes Authors
    venue: Kubernetes documentation
    url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
    note: One platform's answers to this lesson. `concurrencyPolicy`, `startingDeadlineSeconds` and `timeZone`.
    primary: true
    verified: true
  - kind: docs
    title: INSERT
    authors: The PostgreSQL Global Development Group
    venue: PostgreSQL 17 Documentation
    url: https://www.postgresql.org/docs/17/sql-insert.html
    note: "`ON CONFLICT DO NOTHING` and `RETURNING`, which together tell a copy whether its claim won."
    verified: true

deepDive: >-
  The sql step runs on real Postgres. With the plain inserts, the first fails with
  `duplicate key value violates unique constraint "job_runs_pkey"`, and the run stops
  before the backup is claimed. With `ON CONFLICT DO NOTHING`, the digest insert returns no
  row and the backup insert returns one.


  The claim table doubles as a log: which copy ran what, and when. Add a `finished_at`
  column, and a dashboard can show runs that started and never finished.


  A lease often lives in the same database, as a row with an `expires_at`, taken with a
  conditional `UPDATE`. Postgres also has advisory locks, `pg_try_advisory_lock`, which free
  themselves when the session ends. Redis offers `SET key value NX PX 60000`. A lease can
  still expire under a paused holder, so senior designs add a fencing token: a number that
  rises with each grant, which the protected store checks on every write.


  The time zone lines were checked with `Intl.DateTimeFormat` in Node 24. UK clocks go
  forward at 01:00 GMT on the last Sunday of March and back at 02:00 BST on the last Sunday
  of October. Much of Europe skips 02:00 to 03:00 instead.


  Schedulers differ on catch-up, so read yours. Kubernetes `CronJob` has
  `concurrencyPolicy: Forbid` to skip a run while the last one is going. Its docs say jobs
  should be idempotent, because in rare cases a tick can start two jobs or none. You
  can't make the scheduler perfect. You can make the job safe to run late, twice, or on
  two machines.
