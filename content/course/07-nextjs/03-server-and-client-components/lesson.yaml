id: next.server-and-client-components
title: Server and Client Components
objective: "Say where each component runs, mark the interactive parts with `'use client'`, and keep both renders equal."
level: essential
minutes: 10
concepts:
  [next.server-components, next.client-components, next.serialisable-props, next.hydration]
prerequisites: [next.app-router]
opening:
  text: >-
    You'll add a Like button to a page of plain text, and send the browser only the code it
    needs. You'll also fix the error every Next.js beginner meets first.

steps:
  - type: prose
    id: two-kinds
    body: >-
      Next.js has two kinds of component. Every component is a **Server Component** unless you
      say otherwise. It runs only on the server, turns into HTML, and its code never reaches the
      browser.


      A file that starts with `'use client'` holds **Client Components**. They render on the
      server for the first HTML, then run again in the browser. So they can use state, effects
      and clicks.


      ```text

      page.tsx           server only

      ├─ RecipeText      server only

      └─ LikeButton      'use client': server, then browser

      ```

  - type: predict-output
    id: predict-state-on-server
    concept: next.server-components
    difficulty: 1
    language: tsx
    code: |
      // app/counter/page.tsx
      import { useState } from 'react';

      export default function CounterPage() {
        const [count, setCount] = useState(0);
        return <button onClick={() => setCount(count + 1)}>{count}</button>;
      }
    question: You open `/counter`. What happens?
    choices:
      - text: An error that says to add `'use client'`
        correct: true
        feedback: >-
          Right. A Server Component never runs in the browser, so state has nowhere to live.
      - text: The counter works, starting at 0
        feedback: >-
          It would in plain React. Here, with no `'use client'`, this is a Server Component.
      - text: It shows 0, and clicks do nothing
        feedback: >-
          Close, but Next.js stops earlier. It refuses to build a Server Component that imports
          `useState`.

  - type: prose
    id: boundary
    body: >-
      That error reads:
      `You're importing a module that depends on useState into a React Server Component module.
      [...] To fix, mark the file (or its parent) with the "use client" directive.`


      Here's the catch. `'use client'` covers the marked file and everything it imports. They
      all join the **bundle**, the JavaScript files the browser downloads. So put the line on
      the smallest interactive piece, such as the button, not on the whole page.

  - type: ai-review
    id: review-client-page
    concept: next.client-components
    difficulty: 2
    language: tsx
    request: Add a Like button to the recipe page.
    flawClass: performance
    code: |
      // app/recipes/[slug]/page.tsx
      'use client';

      import { useState } from 'react';
      import { RecipeText } from './recipe-text';
      import { Comments } from './comments';

      export default function RecipePage() {
        const [likes, setLikes] = useState(0);
        const like = <button onClick={() => setLikes(likes + 1)}>Like ({likes})</button>;
        return <main><RecipeText />{like}<Comments /></main>;
      }
    prompt: >-
      An assistant wrote this. The button works, and the test clicks it. But the page's
      JavaScript for the browser grew fivefold. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The whole page became a Client Component
        correct: true
        feedback: >-
          Yes. `RecipeText` and `Comments` now ship to the browser too. Only the button needed
          to.
      - text: '`useState` should start at the real like count'
        feedback: >-
          That's worth doing, but it wouldn't change what ships. The directive's position does.
      - text: The button needs its own `key`
        feedback: >-
          `key` is for items in a list. A single button doesn't need one.
    fix: |
      // app/recipes/[slug]/like-button.tsx
      'use client';

      import { useState } from 'react';

      export function LikeButton() {
        const [likes, setLikes] = useState(0);
        return <button onClick={() => setLikes(likes + 1)}>Like ({likes})</button>;
      }

      // The page stays a Server Component and renders <LikeButton />.

  - type: prose
    id: what-crosses
    body: >-
      A Server Component can pass props to a Client Component. Those props travel to the
      browser, so React writes them down as data first.


      Text, numbers, booleans, arrays and plain objects cross. So does a `Date`. An ordinary
      function doesn't: code can't be written down as data, and it might hold a secret.

  - type: predict-output
    id: predict-function-prop
    concept: next.serialisable-props
    difficulty: 2
    language: tsx
    code: |
      // app/menu/page.tsx
      import { PriceTag } from './price-tag'; // 'use client'

      export default function MenuPage() {
        return <PriceTag pence={450} format={(p: number) => `£${(p / 100).toFixed(2)}`} />;
      }
    question: What happens when `/menu` renders?
    choices:
      - text: An error about passing a function
        correct: true
        feedback: >-
          Right. `format` is a function, and functions can't be sent to a Client Component.
      - text: It shows `£4.50`
        feedback: >-
          It would if both were Server Components. Here `format` has to travel to the browser,
          and it can't.
      - text: It shows `450`, ignoring `format`
        feedback: >-
          React doesn't drop it quietly. It stops with an error that names the prop.

  - type: prose
    id: hydration
    body: >-
      In the browser, React runs your Client Components again and attaches their click handlers
      to the server's HTML. That's **hydration**. It expects both renders to match.


      This clock breaks that rule:


      ```tsx

      'use client';

      export function Clock() {
        return <p>Loaded at {Date.now()}</p>;
      }

      ```


      The server's time and the browser's differ by a moment, so Next.js reports: `Hydration
      failed because the server rendered text didn't match the client.`

  - type: fill-blank
    id: fill-clock-after-hydration
    concept: next.hydration
    difficulty: 3
    language: tsx
    prompt: >-
      Read the clock only in the browser, after hydration, so both renders start equal. Fill
      the gaps.
    template: |
      'use client';

      import { useEffect, useState } from 'react';

      export function Clock() {
        const [time, setTime] = {{1}}<number | null>({{2}});
        {{3}}(() => {
          setTime(Date.now());
        }, []);
        return <p>Loaded at {time ?? '...'}</p>;
      }
    blanks:
      - key: '1'
        answer: useState
      - key: '2'
        answer: 'null'
      - key: '3'
        answer: useEffect
    bank: [useState, useEffect, 'null', Date.now(), useMemo]

  - type: code-challenge
    id: build-like-button
    concept: next.client-components
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write `like-button.tsx`, the only interactive part of a recipe page. The page, a Server
      Component, passes the count it read: `<LikeButton likes={12} />`.


      Show a button reading `Like (12)`. A click changes it to `Liked (13)`. Another click takes
      it back to `Like (12)`. Mark the file so it runs in the browser.
    hints:
      - The file needs `'use client'` as its first line, and one piece of state.
      - A single `liked` boolean is enough. The number shown is `likes` plus one when liked.
      - "Start with `const [liked, setLiked] = useState(false);`"

  - type: explain-back
    id: explain-bundle-growth
    concept: next.client-components
    difficulty: 3
    audience: reviewer
    kind: decide
    prompt: >-
      A reviewer asks why you moved the Like button into its own `'use client'` file instead of
      marking the page. Defend it.
    rubric:
      - "`'use client'` sends the marked file and everything it imports to the browser."
      - Marking the page would ship the recipe text and comments too, though they never change.
      - The cost is one extra small file, which buys a much smaller download.
    modelAnswer: >-
      `'use client'` puts the marked file and all its imports in the browser's bundle. On the
      page, that would ship the recipe text, the comments and their imports. None of them
      needs the browser. In its own file, only the button ships. The rest stays a Server
      Component and arrives as plain HTML. The price is one more small file, and the download
      shrinks a lot.

recap:
  - Say which components run only on the server and which also run in the browser.
  - Put `'use client'` on the smallest interactive piece, and pass it plain data.
  - Read clocks and random values after hydration, so both renders match.

recall:
  - id: card-directive-meaning
    concept: next.client-components
    front: What does `'use client'` send to the browser?
    back: >-
      The marked file and everything it imports. They still render on the server first for the
      HTML, then run again in the browser.
  - id: card-server-only
    concept: next.server-components
    front: Where does a component without `'use client'` run in Next.js?
    back: >-
      Only on the server. It turns into HTML, and its code never reaches the browser.
  - id: card-crosses
    concept: next.serialisable-props
    front: Name a kind of prop that can't cross to a Client Component.
    back: >-
      An ordinary function. Props are written down as data to reach the browser, and code can't
      be.
  - id: card-mismatch-cause
    concept: next.hydration
    front: What kind of value causes a hydration error?
    back: >-
      One that differs between the two renders, such as the clock, a random number or
      something only the browser has. Read it in an effect instead.

