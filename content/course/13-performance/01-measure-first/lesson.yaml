id: perf.measure-first
title: Measure first
objective: Name latency, throughput and percentiles, time code honestly, and set a latency budget people can feel.
level: essential
minutes: 10
concepts: [perf.latency-and-percentiles, perf.timing-code, perf.latency-budgets]
prerequisites: [testing.load-testing, js.promises]
opening:
  text: >-
    You'll time your own code and get a number you can trust, not a lucky one. That number
    is where every speed fix in this chapter starts.

steps:
  - type: prose
    id: what-performance-is
    body: >-
      Performance is about waiting: how long people wait, and how much work the machine
      does meanwhile.


      Two words carry most of it. **Latency** is how long one thing takes, such as a click
      until the page answers. **Throughput** is how many things get done per second, such
      as requests a server answers. You met both in load testing.

  - type: prose
    id: percentiles
    body: |-
      The same request never takes exactly the same time twice. So you sort the timings and read points along the line:

      ```text
      p50    120 ms
      p95    480 ms
      p99   1900 ms
      ```

      **p95** is the time that 95 in 100 requests beat. p50 is the middle one. The slow end is the **tail**, and an average hides it.

  - type: multiple-choice
    id: pick-the-tail
    concept: perf.latency-and-percentiles
    difficulty: 1
    question: People say search "sometimes hangs". Which line in that table shows it?
    choices:
      - text: 'p99, 1900 ms'
        correct: true
        feedback: >-
          Right. One search in a hundred takes nearly two seconds. That's the hang.
      - text: 'p50, 120 ms'
        feedback: >-
          That's a typical search, and it's quick. "Sometimes" points at the slow end.
      - text: The average of the three
        feedback: >-
          An average blends the slow few into the fast many, so the hang disappears.

  - type: prose
    id: timing-code
    body: |-
      To time code, read the clock before and after. `performance.now()` gives milliseconds, with decimals, in browsers and in Node:

      ```js
      const start = performance.now();
      countCheap(prices);
      console.log(performance.now() - start);
      ```

      We timed that seven times in a row: `21.9 14.8 17.6 13.8 13.8 31.5 12.4`. The first run pays to warm up the engine, and one stray run is slow. So time many runs, skip the first, and take the median.

  - type: fill-blank
    id: fill-timing
    concept: perf.timing-code
    difficulty: 2
    language: js
    prompt: Time how long `renderList(items)` takes. Fill the gaps.
    template: |
      const start = performance.{{1}}();
      renderList(items);
      const ms = performance.now() - {{2}};
      console.log(`renderList took ${ms} ms`);
    blanks:
      - key: '1'
        answer: now
      - key: '2'
        answer: start
    bank: [now, time, start, ms, Date]

  - type: ai-review
    id: review-one-run-benchmark
    concept: perf.timing-code
    difficulty: 3
    language: js
    request: Which is faster for our product filter, a loop or a Set?
    flawClass: logic
    code: |
      const t0 = performance.now();
      filterWithLoop(products);
      const loopMs = performance.now() - t0;

      const t1 = performance.now();
      filterWithSet(products);
      const setMs = performance.now() - t1;

      console.log(loopMs < setMs ? 'loop wins' : 'set wins');
    prompt: >-
      An assistant wrote this benchmark. We ran it: the loop took 3.8 ms, the `Set` 8.6 ms.
      Timed over 21 warm runs, both took about 3.7 ms. Tap the line at fault.
    lines: [2, 6]
    reasons:
      - text: Each filter is timed once, cold
        correct: true
        feedback: >-
          Yes. One cold run each is noise. Warm up, repeat, compare medians.
      - text: '`performance.now()` is too coarse for this'
        feedback: >-
          It has fractions of a millisecond. The trouble is one run each, not the clock.
      - text: The two results should be stored in variables
        feedback: >-
          Storing them changes nothing about the timing. Running each once is what lies.
    verify:
      question: 'How would you find out which filter is faster?'
      choices:
        - text: 'Compare medians of many warm runs'
          correct: true
          feedback: >-
            Yes. Warming up and repeating take the noise out of both.
        - text: 'Run the same script a second time'
          feedback: >-
            Another single cold run each is as noisy as the first. It could flip the answer.
        - text: 'Check both filters return the same products'
          feedback: >-
            Worth doing, but it proves they agree, not which one is quicker.
    fix: |
      function medianMs(filter) {
        filter(products); // warm up, not counted
        const times = [];
        for (let i = 0; i < 21; i++) {
          const t = performance.now();
          filter(products);
          times.push(performance.now() - t);
        }
        return times.sort((a, b) => a - b)[10];
      }
      console.log(medianMs(filterWithLoop), medianMs(filterWithSet));

  - type: code-challenge
    id: write-measure
    concept: perf.timing-code
    difficulty: 3
    language: ts
    editable: '4-6'
    prompt: >-
      Write `measure(fn, runs, now)`. Call `fn` once to warm up, and don't count it. Then
      time `runs` calls, reading the clock with `now()` before and after each one.


      Return the median of those times. With an even number of runs, return the average of
      the two middle times.


      `now` works like `performance.now`. The tests pass a fake clock, so the times are
      known.
    hints:
      - The warm-up call is a plain `fn();` before the loop. Only the loop's calls go into your list of times.
      - Sort a list of numbers with `(a, b) => a - b`. The median sits in the middle of the sorted list.
      - 'Start with `fn(); const times: number[] = [];`, then a `for` loop that pushes `now() - start`.'

  - type: prose
    id: latency-you-feel
    body: >-
      People feel the first sign of progress more than the finish. A model can take eight
      seconds to write a full answer. **Streamed**, its first words appear in under a
      second, and the wait feels short. That first wait is **time to first token**.


      A **latency budget** is the wait you can afford, split across the steps. Then each
      step has a number to stay under.

  - type: multiple-choice
    id: pick-feels-faster
    concept: perf.latency-budgets
    difficulty: 2
    question: A support chat's model takes six seconds per answer. Which change makes it feel fastest?
    choices:
      - text: Stream the answer as it's written
        correct: true
        feedback: >-
          Right. Words appear within a second, and people read while the rest arrives.
      - text: Show a spinner until the answer is done
        feedback: >-
          A spinner says "wait", but the wait is still six silent seconds.
      - text: Move the server nearer the user
        feedback: >-
          That saves tens of milliseconds. The six seconds are the model writing.
      - text: Send the whole answer at once, compressed
        feedback: >-
          Compression shrinks bytes. The time goes on writing the answer, not sending it.

  - type: explain-back
    id: explain-honest-number
    concept: perf.timing-code
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A teammate timed a function once and says it takes 31 ms. How would you get a number
      you trust?
    rubric:
      - One run can be the cold first run, or a stray slow one.
      - Warm up first, then time many runs.
      - Report the median, or a percentile for the slow end, not one run or an average.
    modelAnswer: >-
      One run tells you little. It might be the first, which pays for warming up the engine,
      or a stray slow one. I'd call the function once to warm up, then time it twenty times
      with `performance.now()`. I'd report the median as the typical time, and look at the
      slowest runs too if the tail matters.

recap:
  - Say what latency, throughput and p95 mean, and why an average hides the tail.
  - Time code with `performance.now()`, warm up first, and report the median of many runs.
  - Stream long answers and give each step a latency budget, so waits feel short.

recall:
  - id: card-latency-throughput
    concept: perf.latency-and-percentiles
    front: What's the difference between latency and throughput?
    back: >-
      Latency is how long one thing takes. Throughput is how many things get done per second.
  - id: card-p95
    concept: perf.latency-and-percentiles
    front: What does a p95 of 480 ms mean?
    back: >-
      95 in 100 requests took 480 ms or less. The slowest 5 took longer.
  - id: card-honest-timing
    concept: perf.timing-code
    front: How do you time a function so the number can be trusted?
    back: >-
      Warm it up once, time many runs with `performance.now()`, and take the median.
  - id: card-first-token
    concept: perf.latency-budgets
    front: Why does streaming a model's answer make it feel faster?
    back: >-
      The first words arrive in under a second. People read while the rest is written.

