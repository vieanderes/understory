id: cloud.alerts-and-on-call
title: Alerts and on-call
objective: Set an SLO, page only for trouble users feel, and handle an outage by rolling back first and writing a blameless review.
level: essential
minutes: 10
concepts: [cloud.slos, cloud.alerting, cloud.incident-response]
prerequisites: [cloud.observability, cloud.releases, security.incident-response]
opening:
  text: >-
    You'll write alerts that wake someone only when users are hurting, and sleep through
    everything else. Then you'll handle an outage the calm way: stop the harm first.

steps:
  - type: prose
    id: what-an-slo-is
    body: >-
      First, decide what "working" means, as users feel it. Count good events out of all
      events: chat replies that start within two seconds, out of all chat replies. That
      share is a **service level indicator**, or SLI.


      A **service level objective**, or SLO, puts a target on it over a window: "99.5% of
      replies start within two seconds, over 28 days."

  - type: multiple-choice
    id: pick-user-facing-sli
    concept: cloud.slos
    difficulty: 1
    question: Which of these best measures what a checkout's users feel?
    choices:
      - text: Share of checkouts that succeed within a second
        correct: true
        feedback: >-
          Yes. It counts the moments users care about: fast checkouts that work.
      - text: CPU use of the checkout servers
        feedback: >-
          Busy servers can still serve people well. Users never see the CPU.
      - text: Number of deploys this week
        feedback: >-
          That describes the team, not the experience. It says nothing about checkouts.

  - type: prose
    id: on-call-and-pages
    body: >-
      The slice the SLO lets fail is the **error budget**. While there's budget left, you ship.
      When it's gone, you fix reliability first.


      Someone watches over it. Being **on-call** means your phone rings this week if the app
      breaks. A **page** is an alert that rings it, even at 3 a.m. A **ticket** waits for
      working hours. Page only when users are hurting now and a person can act.

  - type: ai-review
    id: review-night-page
    concept: cloud.alerting
    difficulty: 2
    language: js
    request: Page the on-call engineer when more than 5% of requests fail.
    flawClass: edge-case
    code: |
      // runs every minute, over the last 5 minutes
      function shouldPage({ requests, errors }) {
        return errors / requests > 0.05;
      }
    prompt: >-
      It paged at 03:12. Over those five minutes, one request of two had failed. The app was
      fine. Tap the line at fault.
    lines: [3]
    reasons:
      - text: It judges a rate with too few requests to count
        correct: true
        feedback: >-
          Right. One failure in two is 50%, and means nothing. Require a minimum first.
      - text: 5% is too strict a threshold
        feedback: >-
          A higher line would still fire on one in two. The window held too few requests to judge.
      - text: It should count errors, not a rate
        feedback: >-
          A fixed count pages all day at peak and never at night. The rate is right, with a floor.
    fix: |
      function shouldPage({ requests, errors }) {
        if (requests < 20) return false;  // too few to judge
        return errors / requests > 0.05;
      }

  - type: code-challenge
    id: write-alert-for
    concept: cloud.alerting
    difficulty: 3
    language: ts
    prompt: >-
      Write `alertFor(window)`. A window holds the `requests` and `errors` of the last five
      minutes. Return `'page'`, `'ticket'` or `'none'`.


      With fewer than `MIN_REQUESTS` requests, return `'none'`. Otherwise, an error rate of
      5% or more is a page, and 1% or more is a ticket.


      So `alertFor({ requests: 2, errors: 1 })` is `'none'`, and `alertFor({ requests: 600,
      errors: 30 })` is `'page'`.
    hints:
      - Check the traffic before you divide. A window with no requests can't have a rate.
      - The error rate is `errors / requests`. Compare it with the page line, then the ticket line.
      - "Start with `if (window.requests < MIN_REQUESTS) return 'none';`"

  - type: prose
    id: stop-the-harm
    body: >-
      Now the page is real: checkout errors jumped at 14:03, one minute after a deploy. What
      first?


      Stop the harm. Roll back to the last good image, as in the releases lesson, and watch
      the errors fall. Finding the bug can wait: users can't. Then post a short update, so
      nobody else starts on the same problem.

  - type: parsons
    id: order-first-minutes
    concept: cloud.incident-response
    difficulty: 3
    language: text
    prompt: >-
      A deploy at 14:02 broke checkout. Put the on-call engineer's steps in order. One step
      doesn't belong.
    blocks:
      - id: acknowledge
        code: acknowledge the page, so others know you're on it
      - id: match-deploy
        code: 'check the graph: errors began at 14:03, after the 14:02 deploy'
      - id: roll-back
        code: roll back to the previous image
      - id: confirm
        code: watch the error rate return to normal
      - id: update
        code: post an update for the team and support
      - id: find-cause
        code: find the bug on the broken version, off the live path
    distractors:
      - id: debug-live
        code: debug the new version live while checkout stays broken
        feedback: >-
          Every minute of debugging is a minute of failed checkouts. Roll back, then debug.

  - type: multiple-choice
    id: pick-model-slowdown
    concept: cloud.incident-response
    difficulty: 3
    question: Replies time out because the model provider slowed down. You deployed nothing. What stops the harm?
    choices:
      - text: Roll back to yesterday's image
        feedback: >-
          Rolling back is the usual move, but your code didn't change. The old image calls the same slow provider.
      - text: Switch to a fallback model, or turn the feature off
        correct: true
        feedback: >-
          Right. The harm comes from outside, so route around it.
      - text: Wait for the provider to fix it
        feedback: >-
          They will, eventually. Meanwhile every user waits and fails. Act on what you control.

  - type: prose
    id: blameless-review
    body: >-
      Once it's calm, write a short review: what users saw, the timeline, the cause, and
      actions. Keep it **blameless**, as the security chapter showed for a leaked key. Ask
      what let the bug through, such as a missing test or a check that didn't run. Each
      action gets an owner and a date.

  - type: explain-back
    id: explain-cpu-page
    concept: cloud.alerting
    difficulty: 4
    prompt: >-
      A teammate wants to page on-call whenever CPU goes over 80%. Why is that a poor page,
      and what would you page on instead?
    rubric:
      - Users don't feel CPU; a busy machine can still answer every request fast.
      - A page nobody can act on trains people to ignore pages, so a real one gets missed.
      - Page on a symptom users feel, like the error rate or slow replies, and leave CPU on a dashboard or a ticket.
    modelAnswer: >-
      High CPU isn't a problem users feel. A server at 85% can still answer every request
      quickly. So the page wakes someone who can only look and go back to bed. After a few of
      those, people stop trusting pages, and the real one gets missed. I'd page on what users
      feel: the error rate or the share of slow replies, with enough requests to be sure. CPU
      belongs on a dashboard, or in a ticket if it keeps climbing.

recap:
  - Set an SLO on what users feel, and spend the error budget on shipping.
  - Page only for user pain now, with enough traffic to be sure; everything else is a ticket.
  - In an outage, stop the harm first, often by rolling back, then find the cause and review without blame.

recall:
  - id: card-slo
    concept: cloud.slos
    front: What's the difference between an SLI and an SLO?
    back: >-
      An SLI is the share of good events, such as fast replies out of all replies. An SLO is a
      target for it over a window, such as 99.5% over 28 days.
  - id: card-page-or-ticket
    concept: cloud.alerting
    front: When should an alert page someone instead of opening a ticket?
    back: >-
      When users are hurting now and a person can act. Anything that can wait for working
      hours is a ticket.
  - id: card-minimum-traffic
    concept: cloud.alerting
    front: Why does an error-rate alert need a minimum number of requests?
    back: >-
      At night one failure in two requests is a 50% rate. Too few requests make the rate
      meaningless, so it pages for nothing.
  - id: card-rollback-first
    concept: cloud.incident-response
    front: Errors started a minute after a deploy. What's your first move?
    back: >-
      Roll back to the last good image and check the errors fall. Find the bug afterwards,
      off the live path.

