summary: >-
  A timed set is a budgeting problem as much as a coding one. Several tasks share one clock
  that cannot be paused, and the score is the share of hidden tests passed on each. The
  points are not spread evenly: the correctness tests of every task are cheaper to earn than
  the last performance tests of the hardest one.


  So the strategy is to secure the cheap points first. Read every task before writing
  anything, start with the most familiar, give each task a time box, and bank a compiling
  brute force before chasing the fast idea. A brute force usually passes every correctness
  test, which is often around half of a task's score.


  The brute force then does a second job. It is slow but plainly correct, so it can act as
  the expected answer for any input. Running both versions on hundreds of small random inputs
  and stopping at the first disagreement is **stress testing**, and it finds the bugs your
  hand-written cases missed. Shrink the failing input until it is tiny, and the bug is usually
  visible at a glance.
remember:
  - >-
    Read every task and its complexity line in the first five minutes, then start with the one
    you know best.
  - >-
    Give each task a time box and move on when it ends; an empty task is where the cheapest
    points are.
  - >-
    Submit a compiling brute force before chasing the fast idea, because it usually banks all
    the correctness tests.
  - >-
    Keep the last five minutes to check that every submission compiles and has no debug output
    left in.
  - >-
    A stress test runs a fast and a slow version on many small random inputs and returns the
    first input where they disagree.
  - >-
    Seed the generator so a failure can be reproduced, and use small sizes and small value
    ranges so duplicates, zeros and negatives appear often.
  - >-
    Shrink a failing input until nothing more can be removed; a two-item failure shows the
    cause faster than any debugger.
sections:
  - title: Time boxes for the common shapes
    body: |-
      Candidate reports describe 90 minutes for two tasks, 90 or 100 minutes for three, and
      sometimes 120 minutes. The plans below keep the same rules: read everything first, bank
      the familiar task, brute force before brilliance, and a fixed checking slot at the end.

      Two tasks in 60 minutes:

      ```text
      0:00  read both statements and complexity lines, pick the order
      0:05  task A: brute force if unsure, then the target complexity, test edges
      0:30  task B: brute force first and submit-ready, then improve
      0:55  stop: both compile, no debug output, largest input tried
      ```

      Three tasks in 90 minutes:

      ```text
      0:00  read all three, note each target complexity
      0:05  the most familiar task, finished and tested
      0:30  the second: brute force banked by 0:40, then improve
      0:55  the third: at least a compiling brute force by 1:15
      1:15  go back to whichever task is closest to full marks
      1:25  stop and check every submission
      ```

      Three tasks in 120 minutes: the same order with 30, 35 and 35 minutes, and ten minutes
      of checking. The rule that matters most is the time box. When it ends and the fast idea
      has not come, leave the brute force in place and move on. You can come back with the
      time the other tasks free up.
  - title: A complete stress-testing kit
    body: |-
      Three parts: a seeded generator, a slow version you trust, and a loop that grows the
      input size slowly so that the first failure it finds is already small.

      ```ts
      // A seeded generator: the same seed always makes the same sequence.
      function makeRandom(seed: number): () => number {
        let state = seed;
        return () => {
          state = (state * 48271) % 2147483647;
          return state / 2147483647;
        };
      }

      function randomInt(random: () => number, lo: number, hi: number): number {
        return lo + Math.floor(random() * (hi - lo + 1));
      }

      // Slow and plainly correct: try every non-empty slice.
      function bestSliceSlow(nums: number[]): number {
        let best = -Infinity;
        for (let i = 0; i < nums.length; i++) {
          let sum = 0;
          for (let j = i; j < nums.length; j++) {
            sum += nums[j];
            best = Math.max(best, sum);
          }
        }
        return best;
      }

      // Fast, with a bug: best starts at 0, so an all-negative list returns 0.
      function bestSliceFast(nums: number[]): number {
        let best = 0;
        let run = 0;
        for (const x of nums) {
          run = Math.max(x, run + x);
          best = Math.max(best, run);
        }
        return best;
      }

      // Grow the size slowly, so the first failure found is already small.
      function findSmallestFailure(seed: number): number[] | null {
        const random = makeRandom(seed);
        for (let size = 1; size <= 8; size++) {
          for (let run = 0; run < 200; run++) {
            const nums = Array.from({ length: size }, () => randomInt(random, -5, 5));
            if (bestSliceFast(nums) !== bestSliceSlow(nums)) return nums;
          }
        }
        return null;
      }

      const failing = findSmallestFailure(42);
      console.log(failing, failing && bestSliceFast(failing), failing && bestSliceSlow(failing));
      // [ -5 ] 0 -5
      ```

      A one-item list of a negative number is the whole bug report: `best` must start at the
      first element or at `-Infinity`. In a timed test, writing this kit takes about five
      minutes once you have typed it a few times. It pays for itself on any task where the
      fast idea is clever.
  - title: Shrinking a failing input
    body: |-
      When the failure comes from a larger random input, shrink it before debugging. Remove one
      item at a time, keep the removal if the input still fails, and repeat until no single
      removal keeps it failing.

      ```ts
      function shrink<T>(input: T[], fails: (candidate: T[]) => boolean): T[] {
        let current = input;
        let changed = true;
        while (changed) {
          changed = false;
          for (let i = 0; i < current.length; i++) {
            const candidate = [...current.slice(0, i), ...current.slice(i + 1)];
            if (candidate.length > 0 && fails(candidate)) {
              current = candidate;
              changed = true;
              break;
            }
          }
        }
        return current;
      }

      // A buggy "second largest distinct value": it forgets that the maximum can repeat.
      const slow = (xs: number[]) => {
        const distinct = [...new Set(xs)].sort((a, b) => b - a);
        return distinct.length > 1 ? distinct[1] : null;
      };
      const fast = (xs: number[]) => {
        const sorted = [...xs].sort((a, b) => b - a);
        return sorted.length > 1 ? sorted[1] : null;
      };

      console.log(shrink([4, 9, 1, 9, 3, 7, 2], (xs) => fast(xs) !== slow(xs))); // [ 9, 9 ]
      ```

      `[9, 9]` names the bug immediately: duplicates of the maximum. Property-based testing
      libraries such as fast-check do this shrinking for you, but in a test environment without
      packages, twenty lines do the job.
  - title: What makes the slow version and the generator good
    body: |-
      A stress test is only as good as its two helpers.

      **The slow version must be plainly correct.** Use a different, dumber method, not a
      slower copy of the fast one: try every pair, every slice, every subset. If both versions
      share an idea, they can share its bug.

      **The generator must hit the corners.** Keep sizes from 1 to about 8 and values in a
      small range such as -5 to 5. Small ranges produce duplicates, zeros, all-equal and
      all-negative inputs far more often than realistic data does. Include the smallest size
      the statement allows. If the statement guarantees something, such as sorted input or
      distinct values, make the generator guarantee it too, or you will chase failures the
      hidden tests never send.

      **Compare the right thing.** Compare arrays with `JSON.stringify`. Compare floats with a
      tolerance. When several answers are valid, such as "return any index of a peak", write a
      checker that validates the fast answer instead of comparing it with the slow one.

      **Know its blind spot.** A stress test on small inputs cannot find a timeout or a bug
      that only appears at large sizes, such as a precision loss past 2^53 or a stack overflow.
      Pair it with one run at the largest allowed input.
pitfalls:
  - >-
    **Starting with the hardest task while fresh.** It can eat the whole clock and leave sure
    points unearned. Bank the familiar task first.
  - >-
    **Waiting for the fast idea.** Twenty minutes of thinking with nothing submitted can score
    zero. Write the brute force, submit it, then think.
  - >-
    **Polishing a task that already passes.** A hidden-test scorer gives nothing for elegance.
    Spend the time on the task with the most unearned tests.
  - >-
    **Calling the generator twice per run.** The fast and slow versions then get different
    inputs and disagree for no reason. Generate once, pass the same input to both.
  - >-
    **Generating large random inputs.** Failures on 40 items are hard to read. Keep sizes small
    and grow them slowly, then shrink whatever fails.
  - >-
    **A slow version that shares the fast one's idea.** Both can be wrong in the same way.
    Make the slow version a different, plainly correct method.
interview:
  - question: >-
      You have written an optimised solution but no expected outputs for large inputs. How do
      you gain confidence in it?
    answer: >-
      I compare it against a brute force on many small random inputs. The brute force is a
      different, plainly correct method, such as trying every pair, so it supplies the
      expected answer for any input. I seed the generator so failures reproduce, keep sizes
      and value ranges small so duplicates and negatives appear often, and stop at the first
      disagreement. Then I shrink that input until it is tiny and trace it by hand. Separately,
      I run the largest allowed input to check the time. The limitation is that small random
      inputs cannot reveal problems that only appear at scale, which is why the large run
      matters too.
  - question: >-
      Twenty minutes are left and two tasks are unfinished. How do you decide where to spend
      them?
    answer: >-
      I go where the most unearned points are cheapest. If a task has nothing submitted, a
      compiling brute force there usually earns all its correctness tests, which beats
      shaving a timeout off a task that already scores well. So first I make sure every task
      has something that compiles and passes the examples. Then, with what is left, I improve
      the task whose fast idea I can already see, rather than the one where I am still
      searching. I stop five minutes before the end to check everything compiles. The
      trade-off is accepting a lower ceiling on one task to protect the floor on all of them.
  - question: >-
      What is property-based testing, and how does it relate to stress testing?
    answer: >-
      Property-based testing checks that a property holds for many generated inputs, instead
      of checking fixed examples. A property can be "the output is sorted and has the same
      items", or "the fast version equals the slow version", which is exactly a stress test.
      Libraries such as fast-check in JavaScript and Hypothesis in Python generate the inputs,
      run the check, and shrink a failure to a minimal case automatically. I use it where
      example tests are weak: parsers, serialisation round trips, anything with many edge
      cases. The trade-off is that good properties take thought to write, and a vague property
      passes everything, so I pair them with a few concrete examples.
  - question: >-
      When is submitting a brute force the right call?
    answer: >-
      Whenever the fast idea is not ready and the clock is short. A compiling brute force
      usually passes every correctness test and some performance tests, and a timeout on a
      performance test costs nothing extra compared with an empty submission. So I bank it
      first, then improve it if time remains, keeping it as the reference for a stress test.
      The exception is a task where the brute force itself is long or risky to write; then I
      pick the simplest correct approach I can type in a few minutes. What I never do is leave
      a task empty while I think.
terms:
  - term: Triage
    say: Do the tasks in order.
    means: Read every task first, start with the most familiar and give each a time box, so the cheap
      points on every task are banked before the hard ones.
  - term: Time box
    say: A rough target for each task.
    means: A fixed limit per task. When it ends you move on, because an untouched task holds the
      cheapest points.
  - term: Stress testing
    say: Testing with huge inputs.
    means: Running a fast and a slow version on many small random inputs and stopping at the first
      disagreement. The slow, plainly correct version acts as the expected answer.
  - term: Seed
    say: Random tests can't be reproduced.
    means: A fixed starting value for the random generator, so the same inputs come out every run and a
      failure can be replayed.
  - term: Shrinking
    say: Debugging the failure.
    means: Removing parts of a failing input while it still fails, until nothing more can go. A two-item
      failure shows the cause faster than any debugger.
  - term: Property-based testing
    say: Random testing.
    means: Checking a rule that must hold for every generated input, such as a sort keeping the same
      length. Stress testing is the case where the rule is agreeing with a slow reference.
