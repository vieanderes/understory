id: pyai.threads-and-processes
title: Threads, processes and the GIL
objective: "Choose between asyncio, threads and processes for a job, and explain what the GIL changes."
level: advanced
minutes: 9
concepts: [pyai.gil, pyai.threads-vs-processes]
prerequisites: [pyai.asyncio, cs.os-and-networks]
opening:
  text: >-
    You'll know why four threads finish four downloads at once, but not four calculations.
    Then you'll pick the right tool for a slow job the first time.

steps:
  - type: prose
    id: three-kinds
    body: >-
      A **CPU core** runs one stream of instructions at a time, and laptops have several. A
      **process** is a running program with its own memory. A **thread** is a second line
      of work inside one process, sharing its memory.


      You met these in the operating systems lesson. Python adds one twist, and it decides
      which to use.

  - type: prose
    id: the-gil
    body: >-
      The usual Python has a **global interpreter lock**, the **GIL**. Only the thread
      holding it may run Python code, so threads take turns.


      A thread that's waiting, on the network or a file, lets go of the lock. So threads
      speed up waiting, like asyncio does. They don't speed up Python code that computes.

  - type: fill-blank
    id: fill-thread-pool
    concept: pyai.threads-vs-processes
    difficulty: 1
    language: python
    prompt: >-
      `download(url)` waits on the network. Run it for every URL on 8 threads, and keep the
      results in order.
    template: |
      from concurrent.futures import ThreadPoolExecutor

      with {{1}}(max_workers=8) as pool:
          pages = list(pool.{{2}}(download, urls))
    blanks:
      - key: '1'
        answer: ThreadPoolExecutor
      - key: '2'
        answer: map
    bank: [ThreadPoolExecutor, Thread, map, gather, run]

  - type: prose
    id: processes
    body: |-
      For computing, use processes. Each has its own Python and its own GIL, so four
      processes really run on four cores:

      ```python
      from concurrent.futures import ProcessPoolExecutor

      if __name__ == "__main__":
          with ProcessPoolExecutor(max_workers=4) as pool:
              counts = list(pool.map(count_words, files))
      ```

      The cost: a slower start, and every argument and result is copied between them.

  - type: multiple-choice
    id: pick-tool
    concept: pyai.threads-vs-processes
    difficulty: 2
    question: You split 2 GB of text into words with plain Python code, on 8 cores. What speeds it up?
    choices:
      - text: A pool of processes
        correct: true
        feedback: >-
          Yes. The work is computing, so it needs separate Pythons on separate cores.
      - text: A pool of threads
        feedback: >-
          Threads help waiting. Here they'd take turns on the GIL, so no faster.
      - text: '`asyncio.gather`'
        feedback: >-
          asyncio overlaps waiting. Splitting text never waits, so nothing overlaps.

  - type: bug-hunt
    id: hunt-missing-guard
    concept: pyai.threads-vs-processes
    difficulty: 3
    language: python
    code: |
      from concurrent.futures import ProcessPoolExecutor

      def count_words(path):
          return len(open(path).read().split())

      files = ["a.txt", "b.txt", "c.txt"]
      with ProcessPoolExecutor(max_workers=3) as pool:
          print(list(pool.map(count_words, files)))
    prompt: >-
      On a Mac this crashes with a `RuntimeError`. It says a process started "before the
      current process has finished its bootstrapping phase". Tap the line to fix.
    lines: [7]
    reasons:
      - text: The pool needs an `if __name__ == "__main__":` guard
        correct: true
        feedback: >-
          Right. Each new process imports this file, and starts its own pool.
      - text: '`count_words` must be async'
        feedback: >-
          Processes run ordinary functions. The crash comes from the pool starting again.
      - text: Three workers is too many for three files
        feedback: >-
          One worker per file is fine. The problem is where the pool is created.
    fix: |
      if __name__ == "__main__":
          with ProcessPoolExecutor(max_workers=3) as pool:
              print(list(pool.map(count_words, files)))

  - type: ai-review
    id: review-threads-for-cpu
    concept: pyai.gil
    difficulty: 3
    language: python
    request: Speed up scoring 50,000 model answers with our pure-Python scorer.
    flawClass: performance
    code: |
      from concurrent.futures import ThreadPoolExecutor

      def score_all(answers):
          with ThreadPoolExecutor(max_workers=8) as pool:
              return list(pool.map(score, answers))
    prompt: >-
      An assistant wrote this. It runs, and it's no faster than a plain loop on an 8-core
      machine. `score` only computes. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Threads take turns on the GIL for computing
        correct: true
        feedback: >-
          Yes. `score` never waits, so one thread computes at a time. Use processes.
      - text: Eight workers is too few for 50,000 answers
        feedback: >-
          More threads would still take turns. The limit is the lock, not the count.
      - text: '`pool.map` runs the calls one by one'
        feedback: >-
          `map` hands the calls to the threads. The threads are what can't compute together.
    verify:
      question: What else could switching to processes break?
      choices:
        - text: The pool now needs an `if __name__` guard
          correct: true
          feedback: >-
            Yes. Each process imports the file, as the last bug showed.
        - text: The scores come back in a different order
          feedback: >-
            `pool.map` returns results in the order of its input, for processes and threads alike.
        - text: '`score` can no longer return a number'
          feedback: >-
            Processes send numbers back fine. Copying data costs time, but works.
    fix: |
      from concurrent.futures import ProcessPoolExecutor

      def score_all(answers):
          with ProcessPoolExecutor() as pool:
              return list(pool.map(score, answers, chunksize=500))

  - type: explain-back
    id: explain-threads-help
    concept: pyai.gil
    difficulty: 3
    audience: interviewer
    kind: explain
    prompt: >-
      An interviewer says "threads don't work in Python" and waits. Explain when that's
      right, when it's wrong, and why.
    rubric:
      - Wrong for waiting, such as network calls or files, where threads overlap well.
      - Right for Python code that computes, since the GIL lets one thread run at a time.
      - For computing, processes use several cores, at the cost of copying data.
    modelAnswer: >-
      It's wrong for waiting. A thread waiting on the network lets go of the GIL, so many
      downloads overlap nicely. It's right for computing. Only one thread runs Python code
      at a time, so threads that compute take turns. For that I'd use processes, each with
      its own Python, and accept the cost of copying data to them.

recap:
  - Use threads or asyncio for work that waits, and processes for work that computes.
  - Explain the GIL, the lock that lets one thread run Python code at a time.
  - Guard a process pool with `if __name__ == "__main__":`.

recall:
  - id: card-gil
    concept: pyai.gil
    front: What does the GIL allow, and what does it stop?
    back: >-
      Only one thread runs Python code at a time. Waiting threads let go of it, so threads
      overlap waits but not computing.
  - id: card-pick
    concept: pyai.threads-vs-processes
    front: Which pool for 1,000 API calls, and which for scoring a million texts in Python?
    back: >-
      Threads, or asyncio, for the API calls, which wait. Processes for scoring, which
      computes.
  - id: card-guard
    concept: pyai.threads-vs-processes
    front: Why does a `ProcessPoolExecutor` need `if __name__ == "__main__":`?
    back: >-
      Each new process imports your file. Without the guard it would start its own pool,
      and Python stops it with a `RuntimeError`.

