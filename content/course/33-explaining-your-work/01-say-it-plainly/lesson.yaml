id: explain.say-it-plainly
title: Saying it plainly
objective: Explain an idea point first, one idea at a time, with an example before the term, and check that the listener followed.
level: essential
minutes: 9
concepts: [explain.point-first, explain.example-before-term, explain.checking-understanding]
prerequisites: [basics.small-program]
opening:
  text: >-
    You'll explain your to-do program so someone new gets it the first time. You'll use the
    same moves every time you ask for help, give help or show your work.

steps:
  - type: prose
    id: point-first
    body: >-
      A friend asks what your to-do program does. You could start at line 1. Or you could
      say the **point** first: "It keeps a list of tasks and ticks off the done ones."


      A listener can only hold a few new things at once. The point tells them what every
      detail is for, so each one lands somewhere.

  - type: multiple-choice
    id: pick-first-sentence
    concept: explain.point-first
    difficulty: 1
    question: A friend asks what your to-do program does. Which first sentence helps most?
    choices:
      - text: First I made an array called `tasks`.
        feedback: >-
          That's where the code starts, not where the listener does. They don't know yet what
          the array is for.
      - text: It keeps your tasks and ticks off finished ones.
        correct: true
        feedback: >-
          Yes. One sentence, and they know what everything else is for.
      - text: It uses functions, loops, arrays and objects.
        feedback: >-
          A list of parts doesn't say what it does. It's like describing a bike as metal and
          rubber.
      - text: It's a bit complicated, so bear with me.
        feedback: >-
          Friendly, but it spends their attention on nothing. Lead with what it does.

  - type: parsons
    id: arrange-complete-task
    concept: explain.point-first
    difficulty: 2
    language: text
    prompt: >-
      Put this explanation of `completeTask` in an order a newcomer can follow. One sentence
      doesn't belong.
    blocks:
      - id: point
        code: It marks one task as finished.
        subgoal: The point
      - id: example
        code: Say your list holds Buy milk, then Call the dentist.
        subgoal: An example
      - id: how
        code: completeTask(0) sets the first task's done to true.
        subgoal: How it works
      - id: result
        code: Next time the list shows, Buy milk has a tick.
        subgoal: How it works
      - id: check
        code: So what would completeTask(1) tick?
        subgoal: Check they followed
    distractors:
      - id: jargon
        code: It assigns a boolean to a property using bracket notation.
        feedback: >-
          True, but every term is new to them and none is explained. Show the effect instead.

  - type: prose
    id: example-then-term
    body: >-
      Here are two ways to explain the same thing.


      *An array is an ordered collection of values.*


      *Your tasks sit in a row: milk first, dentist second. A row like that is called an
      array.*


      The second shows the thing, then names it. The word arrives with a picture already
      attached. That's **example before term**.

  - type: ai-review
    id: review-loop-explanation
    concept: explain.example-before-term
    difficulty: 2
    language: text
    request: Explain to a newcomer how `showList` prints every task.
    flawClass: logic
    code: |
      you: how does showList print every task?
      assistant: It shows each task on its own line.
      assistant: It iterates over the iterable with a for...of loop.
      assistant: Say your list holds milk, then the dentist.
      assistant: The code inside runs for milk, then again for the dentist.
      assistant: Each time, it prints a box and the task's title.
    prompt: >-
      A newcomer read this and gave up on line 3. Every fact in it is correct. Tap the line
      that lost them.
    lines: [3]
    reasons:
      - text: It names terms before any example
        correct: true
        feedback: >-
          Right. Move the example up, then name the loop.
      - text: It should start with the code itself
        feedback: >-
          Code first is mechanics first. A newcomer needs the point and a picture before any
          syntax.
      - text: The example is too simple to help
        feedback: >-
          Simple is the idea. Two tasks are enough to see the repeat happen.
      - text: Line 2 gives the point away too soon
        feedback: >-
          Point first is right. Line 2 is the strongest line here.
    fix: |
      assistant: It shows each task on its own line.
      assistant: Say your list holds milk, then the dentist.
      assistant: The code inside runs for milk, then again for the dentist.
      assistant: Running the same code for each item is called a loop.
    verify:
      question: How would you know the fixed version works for a newcomer?
      choices:
        - text: Check every sentence is technically correct
          feedback: >-
            The old version was correct too, and it still lost them. Correct isn't the same as
            followed.
        - text: Ask them what it prints for three tasks
          correct: true
          feedback: >-
            Yes. Using the idea shows what landed.
        - text: Ask the assistant to rate its clarity
          feedback: >-
            The assistant isn't the listener. Only the person you're explaining to can show
            what landed.
        - text: Read it aloud to yourself once
          feedback: >-
            Useful for rhythm, but you already understand it. You can't hear the gaps a
            newcomer falls into.

  - type: prose
    id: check-they-followed
    body: >-
      *Does that make sense?* almost always gets a yes. People are polite, and they can't see
      what they missed.


      So ask them to use it: *what would the list show if both tasks were done?* Their answer
      tells you what landed. It works on you too. If you can't say something plainly, you've
      found the part you don't understand yet.

  - type: bug-hunt
    id: hunt-weak-check
    concept: explain.checking-understanding
    difficulty: 3
    language: text
    code: |
      you: showList prints every task, one per line.
      you: Say the list holds milk, then the dentist.
      you: It prints milk with its box, then the dentist with its box.
      you: Done tasks get [x], and the rest get [ ].
      you: So, what's the function called again?
      sam: showList.
    prompt: >-
      The next day, Sam can't say what a finished task looks like. Tap the line that should
      have caught it.
    lines: [5]
    reasons:
      - text: It asks for a name, not a use
        correct: true
        feedback: >-
          Yes. Repeating a name proves little. Ask what a done task would show.
      - text: Line 4 adds a detail too late
        feedback: >-
          After the example is the right place for it. The detail was fine; nothing checked it
          landed.
      - text: Sam should have asked more questions
        feedback: >-
          Listeners rarely know what they missed. Checking is the explainer's job.
      - text: Line 1 should name the loop
        feedback: >-
          A new word wouldn't help Sam picture the boxes. Line 5 was the chance to test that.
    fix: |
      you: So if milk is done and the dentist isn't, what does it print?
      sam: [x] Buy milk, then [ ] Call the dentist.

  - type: explain-back
    id: rewrite-add-task
    concept: explain.example-before-term
    difficulty: 3
    audience: newcomer
    kind: explain
    prompt: |-
      Here's a muddled explanation of `addTask`:

      *addTask calls push on the tasks array with an object literal whose done is false.*

      Rewrite it for a friend who's never coded: point first, an example before any term. Try
      saying it out loud before you type.
    rubric:
      - It opens with what the function does for them, adding a task to the list.
      - It gives a concrete example, such as adding Water the plants, before any term.
      - Any term, such as list or `push`, comes after the example, in plain words.
    modelAnswer: >-
      It adds a new task to your list. Say you type Water the plants. The program puts it at
      the end of your list, marked as not done yet. Adding to the end like that is what
      `push` means. So if you add one more task now, where does it go?

  - type: explain-back
    id: explain-why-loop
    concept: explain.checking-understanding
    difficulty: 4
    audience: non-technical
    kind: explain
    prompt: >-
      A neighbour who's never coded asks why your to-do program needs a loop to show the list.
      Explain why, then end with one question that checks they followed. Say it out loud
      first.
    rubric:
      - Point first, the program can't know how many tasks there will be, so it can't have one line per task.
      - An everyday example, such as reading out a shopping list item by item, comes before the word loop.
      - It ends with a question they answer by using the idea, not "Does that make sense?"
    modelAnswer: >-
      The program can't know how many tasks you'll have, so it can't have one line written
      for each. Think of reading out a shopping list: you do the same thing for every item
      until you reach the end. In code, that repeat is called a loop. So if you add a fifth
      task tomorrow, what would I need to change?

recap:
  - Start with the point, so every detail has somewhere to land.
  - Show an example first, then give it its name.
  - Check understanding by asking someone to use the idea.

recall:
  - id: card-point-first
    concept: explain.point-first
    front: Why does the main point go in your first sentence?
    back: >-
      It tells the listener what every detail is for. Each detail then lands somewhere,
      instead of piling up.
  - id: card-example-first
    concept: explain.example-before-term
    front: In what order do you give an example and a new term, and why?
    back: >-
      The example first, then the term. The word then attaches to a picture the listener
      already has.
  - id: card-weak-check
    concept: explain.checking-understanding
    front: What's a better check than "Does that make sense?"
    back: >-
      A question they answer by using the idea, such as "What would the list show if both
      tasks were done?"
  - id: card-own-gap
    concept: explain.checking-understanding
    front: What does it tell you when you can't explain something plainly?
    back: >-
      You've found the part you don't understand yet. Explaining tests your own understanding
      as well as theirs.

references:
  - kind: book
    title: 'The Sense of Style: The Thinking Person''s Guide to Writing in the 21st Century'
    authors: Steven Pinker
    year: 2014
    venue: Viking
    note: The chapter on the curse of knowledge explains why experts skip the steps a newcomer needs.
    primary: true
    verified: false
  - kind: paper
    title: Eliciting self-explanations improves understanding
    authors: Michelene T. H. Chi, Nicholas de Leeuw, Mei-Hung Chiu and Christian LaVancher
    year: 1994
    venue: Cognitive Science, 18(3)
    note: Students who explained a text to themselves as they read understood it better.
    primary: true
    verified: false
  - kind: book
    title: 'Made to Stick: Why Some Ideas Survive and Others Die'
    authors: Chip Heath and Dan Heath
    year: 2007
    venue: Random House
    note: Concrete examples, and the tapping experiment that shows the curse of knowledge.
    verified: false
  - kind: docs
    title: Writing for GOV.UK
    authors: Government Digital Service
    venue: GOV.UK
    url: https://www.gov.uk/guidance/content-design/writing-for-gov-uk
    note: Plain-language rules from a team that writes for everyone.
    verified: false

deepDive: >-
  Why do experts explain badly? Once you know something, it's hard to imagine not knowing it.
  This is called the **curse of knowledge**. In a well-known study, one person tapped the
  rhythm of a famous song on a table and another tried to name it. Tappers guessed that half
  the listeners would get it. Of 120 songs, listeners named three. The tapper hears the tune
  in their head; the listener hears knocking.


  Healthcare uses the same check this lesson ends with. In **teach-back**, a nurse explains a
  new medicine, then asks the patient to say in their own words how they'll take it. The
  question is "How will you take this tonight?", not "Any questions?" It tests the
  explanation, not the patient.


  Explaining helps the explainer too. Students who explain a text to themselves as they read
  understand it better than students who read it twice. That's why the last step of every
  Understory lesson asks you to explain in your own words.
