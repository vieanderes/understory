term: nested transaction
aka:
  - savepoint
  - inner transaction
short: A unit of changes opened inside another, which can be undone without undoing the outer one.
explain: |
  Say you begin a set of changes, then begin another inside it. If the inner one rolls
  back, only its own changes should vanish. The outer work stays.

  The usual build is a stack. Each begin pushes a record of old values for the keys it
  touches. Rollback pops the top record and writes those old values back. Commit merges
  the top record into the one below, so an outer rollback can still undo it.

  In SQL the same idea is called a savepoint. An inner commit isn't final: nothing is
  saved until the outermost commit.
analogy: Undo inside a draft. You can undo the last paragraph without throwing away the whole draft.
usage: The import uses a nested transaction per row, so one bad row rolls back alone.
related:
