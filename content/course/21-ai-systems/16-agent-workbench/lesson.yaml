id: aisys.agent-workbench
title: Working with a coding agent on a real repo
objective: "Set up a coding agent's task so it can be checked: rules it can test, a scope contract, a verification gate, a reviewer pass and a handoff note."
level: advanced
minutes: 10
concepts: [aisys.executable-instructions, aisys.scope-contracts, aisys.verification-gates, aisys.session-handoff]
prerequisites: [aisys.coding-agents]
opening:
  text: >-
    You'll set up a task so a coding agent can't drift, skip checks or lose its place
    between sessions. It's how agents get trusted with work that lasts more than an hour.

steps:
  - type: prose
    id: rules-you-can-check
    body: |-
      The last lesson gave your agent a context file. Now make its rules checkable.

      "Be careful with the database" is a wish. Nobody can tell if it held. "Never edit
      files in `migrations/`" is a **constraint**: one look at the diff shows whether it held.

      Write each rule so a person, a script or the agent can check it. "Done" too: "`pnpm
      check` exits 0", not "looks good".

  - type: multiple-choice
    id: pick-checkable-rule
    concept: aisys.executable-instructions
    difficulty: 1
    question: Which rule could a script check after the agent finishes?
    choices:
      - text: Write clean, readable code
        feedback: >-
          Everyone agrees, and no script can tell. Name something a diff or a command can show.
      - text: Be careful with anything risky
        feedback: >-
          Risky to whom? The agent can't act on it, and nobody can check it afterwards.
      - text: No new dependencies in `package.json`
        correct: true
        feedback: >-
          Yes. The diff of `package.json` shows at once whether it held.
      - text: Think hard before changing tests
        feedback: >-
          Thinking leaves no trace. "Never skip or delete a test" is something a diff shows.

  - type: ai-review
    id: review-instruction-file
    concept: aisys.executable-instructions
    difficulty: 3
    language: text
    request: Write an AGENTS.md for this repo. Keep it short.
    flawClass: logic
    code: |
      # AGENTS.md

      ## Commands
      - Install: pnpm install
      - Check: pnpm check   (lint + types + tests)

      ## Rules
      - Never edit files under generated/
      - Money is integer pence: price_pence = 1299
      - If pnpm check fails in a file you didn't touch, add an eslint-disable comment and carry on
      - Done means pnpm check exits 0
    prompt: >-
      An assistant drafted this instruction file. One rule quietly defeats the others, and
      `pnpm check` still goes green. Tap the line at fault.
    lines: [10]
    reasons:
      - text: Generated files should be editable
        feedback: >-
          Generated files are rebuilt from a source, so edits there vanish. That rule is sound.
      - text: It tells the agent to switch checks off
        correct: true
        feedback: >-
          Right. A failing check gets silenced, not reported. Tell it to stop and ask.
      - text: Money should be a decimal, not pence
        feedback: >-
          Integer pence avoids floating-point rounding errors. That line prevents a bug.
    verify:
      question: The rule is fixed. What catches an agent that ignores it?
      choices:
        - text: The agent says `pnpm check` passed
          feedback: >-
            That's the agent's claim, and a silenced check passes too. Look at the diff.
        - text: The diff adds no `eslint-disable` comments or skipped tests
          correct: true
          feedback: >-
            Yes. A rule asks; a check of the diff makes sure.
        - text: The file stays under 20 lines
          feedback: >-
            Short helps, but length can't show whether a check was switched off.
    fix: |
      - If pnpm check fails in a file you didn't touch, stop and report the output

  - type: prose
    id: scope-contract
    body: |-
      Before each task, write a **scope contract**: a short file that says where the work
      starts and stops. The agent reads it first. You check the diff against it last.

      ```yaml
      goal: Round cart totals half-up
      allowed: [src/cart/]
      forbidden: [migrations/, .github/]
      done_when: [pnpm test src/cart, pnpm check]
      proof:
        half_pence_rounds_up: test output with its command
      ask_first: [new dependency, schema change]
      ```

      The forbidden list matters as much as the allowed one. And `proof` names what the
      agent hands over for each claim: something a person can open.

  - type: fill-blank
    id: fill-scope-contract
    concept: aisys.scope-contracts
    difficulty: 2
    prompt: Add a date filter to the order search page. Billing is off limits. Fill in the contract.
    language: yaml
    template: |
      goal: Filter order search by date
      allowed: [{{1}}]
      forbidden: [{{2}}]
      done_when: [pnpm test src/orders, pnpm check]
      proof:
        end_date_included: {{3}}
        fits_on_a_phone: {{4}}
      ask_first: [new dependency]
    blanks:
      - key: '1'
        answer: src/orders/
      - key: '2'
        answer: src/billing/
      - key: '3'
        answer: test output with its command
      - key: '4'
        answer: screenshots at 390 and 1440
    bank: [src/orders/, src/billing/, src/, test output with its command, screenshots at 390 and 1440, "the agent's summary", one desktop screenshot]

  - type: prose
    id: gates-and-feedback
    body: |-
      An agent may say "all tests pass" whether they ran or not. So a **verification
      gate** decides: a script that runs the checks and reads their exit codes.

      Exit codes can't show a screen looks right. That's the proof's job: screenshots at
      phone and desktop widths, a short recording, logs. Match proof to the claim. A green
      unit test can't show a layout fits a phone.

  - type: code-challenge
    id: write-gate
    concept: aisys.verification-gates
    difficulty: 3
    language: python
    starter: gate.starter.py
    solution: gate.solution.py
    tests: gate.tests.py
    prompt: >-
      Write `gate(contract, checks, changed)`. `checks` maps a check name to its exit code,
      and a missing name never ran. `changed` lists the changed paths.


      Return the problems in order. For each name in `contract["required"]`, add `"not run:
      lint"` or `"failed: lint"`. Then for each path, add `"forbidden: <path>"` if it starts
      with a forbidden prefix, even inside an allowed folder. Otherwise add `"out of scope:
      <path>"` if no allowed prefix matches.
    hints:
      - '`checks.get(name)` gives `None` for a check that never ran.'
      - '`src/billing/` can sit inside an allowed `src/`, so test forbidden prefixes first.'
      - '`any(path.startswith(p) for p in prefixes)` tells you whether one prefix matches.'

  - type: multiple-choice
    id: pick-reviewer-context
    concept: aisys.verification-gates
    difficulty: 3
    question: A second agent reviews the date filter. What should it be given?
    code: |
      reviewer:
        task: Try to break this change
        intent: Filter order search by date, end date included
        diff: date-filter.diff
        proof: [test-output.txt, phone.png, desktop.png]
        context: authoring-chat.md
    choices:
      - text: Everything listed, chat included
        feedback: >-
          Most people pick this. But the chat hands over the author's assumptions, so it
          grades the story, not the diff.
      - text: Everything except the authoring chat
        correct: true
        feedback: >-
          Yes. It judges intent, diff and proof, and can't be talked round.
      - text: Only the diff
        feedback: >-
          Close. Without the intent, it can't tell a bug from a feature.
      - text: Only the author's summary
        feedback: >-
          A summary is the author's claim again. The reviewer exists to test that claim.

  - type: fill-blank
    id: fill-handoff
    concept: aisys.session-handoff
    difficulty: 2
    prompt: A handoff note tells the next session where things stand. One test is still red. Complete it.
    language: yaml
    template: |
      task: Filter order search by date
      changed: [orders/search.py, tests/test_search.py]
      tried: comparing datetimes, which drops orders late on the end date
      checks: {{1}}
      still_failing: {{2}}
      next_action: {{3}}
    blanks:
      - key: '1'
        answer: '1 failed, 41 passed'
      - key: '2'
        answer: test_includes_end_date
      - key: '3'
        answer: compare dates, not datetimes
    bank: ['1 failed, 41 passed', 'all good', test_includes_end_date, 'some tests', 'compare dates, not datetimes', 'keep going']

  - type: explain-back
    id: explain-agent-not-done
    concept: aisys.verification-gates
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why shouldn't a coding agent decide for itself that a task is done?
    rubric:
      - Its "done" is a claim, so a gate reads real exit codes and checks the diff against the contract.
      - It attaches proof a person can open that matches the claim, such as test output or screenshots.
      - A separate reviewer gets only the intent, diff and proof, and tries to break the change.
    modelAnswer: >-
      An agent's "done" is a claim, and it sounds as sure when it's wrong. So a gate settles
      the facts: real exit codes, and a diff checked against the scope contract. The agent
      attaches proof I can open, matched to the claim: test output for the logic,
      screenshots for the screen. Then a reviewer in a separate session tries to break it.
      It gets the intent, the diff and the proof, never the author's chat, so it can't be
      talked round.

recap:
  - Write agent rules and "done" as things a diff or a command can check.
  - Give each task a scope contract. A gate reads exit codes, and proof matches each claim.
  - A reviewer without the author's chat tries to break it. A handoff note names the next step.

recall:
  - id: card-checkable-rule
    concept: aisys.executable-instructions
    front: What makes a rule in an instruction file useful to a coding agent?
    back: >-
      It can be checked: a diff or a command shows whether it held, such as "never edit
      `migrations/`" or "`pnpm check` exits 0".
  - id: card-scope-contract
    concept: aisys.scope-contracts
    front: What goes in a scope contract for one agent task?
    back: >-
      The goal, the paths it may change, the paths it must not touch, the commands that prove
      it's done, the proof to attach, and what needs asking first.
  - id: card-gate
    concept: aisys.verification-gates
    front: Who decides that an agent's task is done?
    back: >-
      A gate that reads real exit codes, proof that matches each claim, then an independent
      reviewer. Not the agent's own report.
  - id: card-independent-reviewer
    concept: aisys.verification-gates
    front: What do you give a reviewer agent, and what do you keep from it?
    back: >-
      Give it the intent, the diff and the proof, and ask it to break the change. Keep the
      author's chat from it, or it grades the story instead of the diff.
  - id: card-handoff
    concept: aisys.session-handoff
    front: What does a handoff note between agent sessions contain?
    back: >-
      What changed, what was tried and failed, what's still failing, and the one next action.

references:
  - kind: docs
    title: AGENTS.md
    venue: agents.md
    url: https://agents.md/
    note: The open format for repository instructions to coding agents, with nested files per folder.
    primary: true
    verified: true
  - kind: essay
    title: Effective harnesses for long-running agents
    authors: Justin Young
    year: 2025
    venue: Anthropic Engineering
    url: https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents
    note: A feature list, a progress file and git history let each new session pick up where the last stopped.
    primary: true
    verified: true
  - kind: docs
    title: Create custom subagents
    venue: Claude Code documentation
    url: https://code.claude.com/docs/en/sub-agents
    note: A subagent starts with a fresh context and none of your conversation history, which is what an independent reviewer needs.
    verified: true
  - kind: essay
    title: "Harness engineering: leveraging Codex in an agent-first world"
    authors: Ryan Lopopolo
    year: 2026
    venue: OpenAI
    url: https://openai.com/index/harness-engineering/
    note: Building a product with agents writing the code, and the repo structure and checks that made it work.
    verified: true

deepDive: >-
  **Layer the instruction file.** Keep the root file short enough to read every session:
  commands, the few hard rules, and links. Put depth in topic files, such as a testing guide,
  that the agent reads when a task touches them. A link that points nowhere is worse than a
  missing rule.


  **Enforce what you can in tools.** A rule the linter, a pre-commit hook or CI enforces
  holds even when the agent ignores the file. The file then says why, and the tool makes sure.


  **Gates are code, not judges.** Keep the gate deterministic: exit codes, paths, coverage.
  Leave questions of taste, design and readability to the reviewer pass. Mixing them makes a
  gate that nobody trusts.
