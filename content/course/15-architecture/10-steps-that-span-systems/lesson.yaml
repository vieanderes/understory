deepDive: >-
  The original sagas paper, from 1987, wasn't about services. It split one long database
  transaction into steps, so it wouldn't hold locks for hours. Each step had a
  compensating transaction. The idea moved to services because the problem is the same:
  no single commit covers the whole job.


  Sagas give up isolation. Between steps, other code can see a half-done order: an oven
  slot taken by a cake that may be cancelled. Design for it. Show statuses like "pending",
  and don't let other work rely on a step until the saga finishes.


  Some steps can't be undone, and some must never fail. A common way to order a saga:
  steps you can compensate first, then one **pivot** step that commits the business to
  the outcome, then steps that are retried until they succeed. Taking the money is often
  the pivot. Sending the confirmation is a retried step after it.


  Durable engines replay by comparing what your code asks for with what the history
  recorded. Changing workflow code while orders are running can break that, because old
  histories no longer match new code. Engines offer versioning for this. Temporal's
  documentation calls it out, and so does Azure Durable Functions.


  Reconciliation is the net under all of it. A nightly job lists card holds older than a
  day with no confirmed order, and courier bookings with no matching order. It releases or
  flags each one. Sagas make drift rare; reconciliation makes it visible.
