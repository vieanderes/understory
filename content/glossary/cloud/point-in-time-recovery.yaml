term: point-in-time recovery
aka: [PITR, point-in-time restore]
short: Restoring a database to its exact state at a chosen moment, such as one minute before a mistake.
explain: |
  Someone runs a delete without a `WHERE` at 14:03. Last night's backup would lose a whole
  day of orders. You want the database as it was at 14:02.

  The system keeps a base backup plus a log of every change since. A restore replays the
  log up to the moment you choose. Replicas can't help here, because they copy the delete
  at once. And a backup is only proven by restoring it on a schedule and timing it.
analogy: A video you can rewind to the second before the glass fell off the table.
usage: Point-in-time recovery to 14:02 brought the orders back, but the restore took ninety minutes.
related: [replication, transaction, migration]
level: 3
lessons: [cloud.backups]
