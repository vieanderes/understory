id: nextserver
number: 29
title: Next.js on the server
summary: "The Next.js features that need a backend: route handlers, Server Actions, caching and deploying. These lessons are scheduled after the backend, database and cloud lessons they build on, not as a block."
why: "Once you know requests, sessions, databases and servers, Next.js lets you write an API, a form that saves and a cached page in the same project as your React code."
youCanBuild: "A Next.js app with a JSON endpoint, a form that saves safely, cached pages that refresh when data changes, and a deployment you run yourself."
lab: cache-layer-explorer
concepts:
  - id: nextserver.route-handlers
    title: Route handlers
    summary: "A `route.ts` file exports functions named after HTTP methods, such as `GET` and `POST`. Each gets the `Request` and returns a `Response`."
    confusableWith: [nextserver.server-actions]
  - id: nextserver.handler-errors
    title: Answering bad requests
    summary: "A route handler checks its input and answers with the right status code, such as `400` for bad JSON, instead of crashing with a `500`."
  - id: nextserver.proxy
    title: The proxy file
    summary: "`proxy.ts` runs before a request reaches a page or handler, and can redirect, rewrite or answer it. It's a first filter, never the only check."
  - id: nextserver.server-actions
    title: Server Actions
    summary: "A function marked `'use server'` runs on the server. A form or a Client Component calls it, and Next.js sends the call as a POST request."
    confusableWith: [nextserver.route-handlers]
  - id: nextserver.action-validation
    title: Checking inside an action
    summary: Anyone can send the POST behind a Server Action, so the action itself checks who's asking, every field, and that the data belongs to them.
  - id: nextserver.progressive-enhancement
    title: Forms before JavaScript
    summary: A form whose `action` is a Server Action is a real HTML form, so it submits even before the page's JavaScript has loaded.
  - id: nextserver.use-cache
    title: The use cache directive
    summary: "With `cacheComponents` on, `'use cache'` at the top of an async function or component keeps its result and reuses it for every visitor, keyed by its arguments."
    confusableWith: [nextserver.client-cache]
  - id: nextserver.cache-life
    title: Cache lifetimes
    summary: "`cacheLife` says how long a cached result is served before it's refreshed in the background, and when it's thrown away."
  - id: nextserver.cache-tags
    title: Cache tags
    summary: "`cacheTag` labels a cached result, and `updateTag` in a Server Action throws away every result with that label, so the next visit sees the change."
  - id: nextserver.client-cache
    title: The browser's copy
    summary: The browser keeps pages it has already shown for Back and Forward, and a server-side refresh can't reach that copy in someone else's tab.
    confusableWith: [nextserver.use-cache]
  - id: nextserver.next-start
    title: Running a production server
    summary: "`next build` then `next start` runs the built app as a Node server on a port, which is how you host Next.js on your own machine."
  - id: nextserver.standalone-output
    title: Standalone output
    summary: "`output: 'standalone'` copies the server and only the packages it needs into one folder. The `public` and `.next/static` folders must be copied in beside it."
  - id: nextserver.platform-services
    title: What a managed host adds
    summary: A managed host supplies the CDN, image resizing, shared cache and scaling. On your own servers, each copy of the app has its own memory and cache.
