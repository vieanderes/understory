summary: >-
  A backend is the code that runs on a server you control, answering requests from clients
  you don't. The frontend runs on the user's device, where anyone can read and change it. The
  backend is where shared data lives, where secrets stay secret and where rules are enforced,
  because it is the only side of the app the user can't tamper with.


  The two talk over HTTP. A client sends a request: a method, a path, headers and sometimes a
  body. The server sends back a response: a status, headers and sometimes a body. The set of
  requests a server understands is its API. Browsers, phone apps, scripts, other servers and
  AI agents are all clients of the same API.


  You reach for a backend whenever data must be shared between devices or people, whenever a
  secret such as a database password or a model API key is involved, and whenever a rule must
  hold even against a hostile user. A calculator or a single-player game that keeps everything
  on one device doesn't need one. `curl` is how you talk to a backend without a frontend in the
  way, which makes it the first tool to reach for when something breaks.
remember:
  - The backend is the only part of an app the user can't read or change, so secrets, shared data and every rule that must hold live there.
  - Anything the frontend checks, the backend checks again, because a client can send any request it likes.
  - An API is the set of endpoints a server answers, each a method plus a path, such as `GET /todos`.
  - Every HTTP response is a status line, then headers, then a blank line, then an optional body.
  - '`curl -i` shows the status line and headers as well as the body, and `curl -v` also shows what was sent.'
  - '`localhost` is your own machine and the port picks which program on it receives the request.'
  - Servers aim to be stateless between requests, keeping shared state in a database, so any copy of the server can answer any request.
sections:
  - title: Where the trust boundary sits
    body: |-
      The line between frontend and backend is a **trust boundary**. Everything on the user's
      side is under their control: the JavaScript, the page, the network requests. Browser
      developer tools let anyone edit a request and replay it. So a check in the frontend is a
      convenience for honest users, and a check in the backend is the real one.

      That decides where each job belongs:

      - **Secrets.** Database passwords, payment keys and AI provider keys never reach the
        browser. Anything bundled into frontend code is public, however it's named.
      - **Rules.** "You can only edit your own to-dos" and "the price is £4" are checked on
        the server. A frontend that sends `price: 4` is making a suggestion.
      - **Shared state.** The one copy of the data that every device agrees on lives behind
        the server, usually in a database.
      - **Slow or heavy work.** Sending email, resizing images and calling a model often run
        on the server, sometimes in a background job.

      The frontend still does a lot: rendering, instant feedback, validation that saves a round
      trip. It repeats the backend's checks for speed, never instead of them.
  - title: What an HTTP message looks like on the wire
    body: |-
      HTTP/1.1 is text over a TCP connection. You can speak it by hand. This Node script starts
      a tiny server with the built-in `node:http` module, opens a raw TCP socket to it and
      writes a request line by line:

      ```ts
      import { createServer } from 'node:http';
      import { connect } from 'node:net';

      const todos = [{ id: 1, title: 'Buy milk', done: false }];

      const server = createServer((req, res) => {
        if (req.method === 'GET' && req.url === '/todos') {
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end(JSON.stringify(todos));
          return;
        }
        res.writeHead(404, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ error: 'Not found' }));
      });

      server.listen(3000, () => {
        const socket = connect(3000, 'localhost', () => {
          socket.write('GET /todos HTTP/1.1\r\nHost: localhost:3000\r\nConnection: close\r\n\r\n');
        });
        socket.on('data', (chunk) => process.stdout.write(chunk.toString()));
        socket.on('end', () => server.close());
      });
      ```

      Run with `npx tsx`, it prints:

      ```http
      HTTP/1.1 200 OK
      content-type: application/json
      Date: Fri, 25 Sep 2026 16:37:41 GMT
      Connection: close
      Transfer-Encoding: chunked

      2a
      [{"id":1,"title":"Buy milk","done":false}]
      0
      ```

      Lines end in `\r\n`, and an empty line ends the headers. The `Host` header is required
      in HTTP/1.1. Because the handler didn't set `Content-Length`, Node sent the body in
      **chunks**: `2a` is the chunk size in hexadecimal (42 bytes) and `0` marks the end.
      `curl` hides this framing and shows you the body. HTTP/2 and HTTP/3 send the same
      methods, headers and statuses in a binary format, so what you learn here carries over.
  - title: Stateless servers and why they scale
    body: |-
      HTTP is **stateless**: each request carries everything the server needs, and the server
      doesn't rely on remembering the previous one. A login is remembered by a cookie or token
      the client sends every time, not by the connection.

      Well-built backends keep their own memory stateless too. The lesson's to-do list lives in
      a variable, which is fine for learning, but it has three problems in production. It's lost
      when the process restarts. It isn't shared when you run two copies of the server behind a
      load balancer, so a to-do saved on one copy is missing on the other. And it grows until
      memory runs out.

      So the shared data goes in a database, sessions go in a database or a store such as
      Redis, and uploaded files go in object storage. Then the server process holds nothing
      that matters, and you can run one copy or fifty, restart any of them, and deploy without
      losing data. That property is what lets a backend scale horizontally.
  - title: curl as a debugging tool
    body: |-
      When a page misbehaves, the first question is whether the backend or the frontend is
      wrong. `curl` answers it by removing the frontend.

      ```bash
      curl -i localhost:3000/todos                 # status, headers and body
      curl -v localhost:3000/todos                 # also what was sent, and the connection
      curl -s localhost:3000/todos | jq .          # silent, pretty-printed JSON (needs jq)
      curl -sS -o /dev/null -w "%{http_code}\n" localhost:3000/todos   # only the status
      ```

      If `curl` gets the right data, the bug is in the frontend: how it calls the API or what
      it does with the answer. If `curl` gets the wrong data, the bug is on the server. Browser
      developer tools can copy any request as a `curl` command from the network panel, which
      lets you replay exactly what the page sent, change one thing and try again.

      Remember that `curl` exit codes and HTTP statuses are different things. `curl` exits `0`
      after a `404`, because the HTTP conversation worked. It exits non-zero only when the
      conversation itself failed, such as `7` for a refused connection. Add `--fail` in scripts
      when a `4xx` or `5xx` should count as failure.
pitfalls:
  - '**Hiding a secret in frontend code.** A key in a bundled `.js` file, or in an environment variable exposed to the browser, is public. Keep it on the server and let the frontend call your backend instead.'
  - '**Trusting a check because the form enforces it.** Anyone can send the request without the form. Validate and authorise every request on the server.'
  - '**Keeping important state in a server variable.** It vanishes on restart and differs between copies. Put shared data in a database.'
  - '**Reading `curl` success as HTTP success.** `curl` exits `0` for a `500` response. Check the status with `-i` or `-w "%{http_code}"`, or use `--fail`.'
  - '**Testing on the wrong port.** The server prints the port it listens on. A refused connection almost always means the port or the process is wrong, not the path.'
verify:
  - lens: leaks
    check: Search the built frontend bundle for API keys and secrets, because anything shipped to the browser can be read by every visitor.
  - lens: breaks
    check: Send a request with `curl` that skips the page entirely, and confirm the backend still enforces every rule the form enforces.
  - lens: confuses
    check: Write down which side owns each rule and each piece of data, so the next person doesn't add a check only to the frontend.
interview:
  - question: What belongs on the backend rather than the frontend, and why?
    answer: >-
      Anything that must be secret, shared or enforced. The frontend runs on a device the
      user controls, so they can read its code and send any request they like. That means
      secrets such as database credentials and API keys stay on the server, the single
      shared copy of the data sits behind it, and every business rule, like ownership checks
      or prices, is enforced there. The frontend can repeat validation for instant feedback,
      but only as a convenience. The trade-off is latency: every server round trip costs time,
      so you keep rendering and pure presentation logic on the client and design the API so a
      screen needs few calls.
  - question: What does it mean that HTTP is stateless, and how do servers remember who you are?
    answer: >-
      Each request stands alone: the protocol gives the server no memory of earlier
      requests. Identity is carried on every request instead, usually in a session cookie or
      an `Authorization` header with a token, and the server looks up or verifies it each
      time. Keeping the server process itself stateless, with sessions and data in a
      database or Redis, is what lets you run many copies behind a load balancer and restart
      any of them freely. The cost is a lookup per request, which is why signed tokens are
      sometimes used to avoid it, at the price of being harder to revoke.
  - question: A page shows the wrong data. How do you tell whether the frontend or the backend is at fault?
    answer: >-
      Take the frontend out of the loop and call the API directly. I copy the request from the
      browser's network panel as `curl`, run it with `-i`, and compare the status and body with
      what the page shows. If the raw response is wrong, the bug is on the server, and I look
      at the handler, the query and the logs for that request. If the response is right, the
      frontend is misreading it, calling a different URL or caching an old answer. It's a
      bisection: one command halves the search space. The catch is authentication, so I make
      sure the copied request keeps its cookie or token.
