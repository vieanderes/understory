deepDive: >-
  You can watch all of this in any page. Open the developer tools and pick the Network panel,
  then reload. Each row is one request. Click one to see its method, URL, status code, headers
  and the body that came back. It's the first place to look when data doesn't show up.


  The messages above are simplified. A real request also carries headers such as `Accept`,
  which says which formats the client understands, and `Cookie`. A response adds headers such as
  `Cache-Control`, which says how long the answer may be reused.


  `encodeURIComponent` writes a space as `%20`, while `URLSearchParams` writes it as `+`.
  Servers read both as a space in a query string. `encodeURI` without "Component" leaves `&`
  and `?` alone, so it's the wrong tool for a single value.


  `GET` and `POST` are the two methods you'll use most. `PUT` replaces something, `PATCH`
  changes part of it, and `DELETE` removes it. The backend chapter covers them, and when a
  request is safe to send twice.
