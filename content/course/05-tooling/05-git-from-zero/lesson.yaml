id: tooling.git-basics
title: Git from zero
objective: Save snapshots of a project with `git add` and `git commit`, read its history, and keep junk out with `.gitignore`.
level: essential
minutes: 10
concepts: [tooling.git-commits, tooling.staging, tooling.gitignore]
prerequisites: [tooling.node-and-npm]
opening:
  text: >-
    You'll save your project in Git, so any version you've ever saved is one command away. You'll
    also keep secrets and clutter out of it, which is where most beginners slip.

steps:
  - type: prose
    id: what-git-is
    body: |-
      Ever wished you could go back to yesterday's version of a file? **Git** is a program that
      keeps save points for a whole project folder.

      A folder Git looks after is a **repository**, or repo. Git stores its save points in a
      hidden `.git` folder inside it. `git init` creates that folder:

      ```bash
      $ cd recipes
      $ git init
      Initialized empty Git repository in /Users/sam/recipes/.git/
      ```

      Your files stay exactly where they were.

  - type: prose
    id: three-states
    body: |-
      Git doesn't save every file automatically. You choose what goes into each save point.

      Picture a shopping basket. `git add` puts a file in the basket, called the **staging
      area**. `git status` shows what's in it. A file Git has never saved is **untracked**:

      ```bash
      $ git status
      Untracked files:
        (use "git add <file>..." to include in what will be committed)
              pancakes.txt
      ```

      A saved file you've changed since is **modified**.

  - type: predict-output
    id: predict-status-after-add
    concept: tooling.staging
    difficulty: 1
    language: bash
    code: |
      $ git add pancakes.txt
      $ git status
    question: What does `git status` say about `pancakes.txt` now?
    choices:
      - text: '`Changes to be committed: new file: pancakes.txt`'
        correct: true
        feedback: >-
          Yes. It's in the basket, ready for the next save point.
      - text: '`Untracked files: pancakes.txt`'
        feedback: >-
          That was before. `git add` moved it into the staging area.
      - text: '`nothing to commit, working tree clean`'
        feedback: >-
          Adding doesn't save yet. The file waits in the staging area until you commit.

  - type: prose
    id: commit-and-history
    body: |-
      `git commit` saves everything in the basket as one snapshot, a **commit**. `-m` adds a
      message saying what changed. `git log --oneline` lists the history, newest first:

      ```bash
      $ git commit -m "Add butter to pancakes"
      [main b433e38] Add butter to pancakes
       1 file changed, 1 insertion(+), 1 deletion(-)
      $ git log --oneline
      b433e38 Add butter to pancakes
      ca43f67 Add pancake recipe
      ```

      `b433e38` is the commit's **hash**, a unique name Git gives it.

  - type: parsons
    id: arrange-first-commit
    concept: tooling.git-commits
    difficulty: 2
    language: bash
    prompt: >-
      You wrote `pancakes.txt`. Stage it, check it's in the basket, save a commit and see it
      in the history. One block doesn't belong.
    blocks:
      - id: add
        code: git add pancakes.txt
        subgoal: Put the file in the basket
      - id: status
        code: git status
        subgoal: Check what's staged
      - id: commit
        code: git commit -m "Add pancake recipe"
        subgoal: Save the snapshot
      - id: log
        code: git log --oneline
        subgoal: See it in the history
    distractors:
      - id: add-with-message
        code: git add -m "Add pancake recipe"
        feedback: >-
          `-m` belongs to `git commit`. `git add` stops with an unknown-switch error.

  - type: bug-hunt
    id: hunt-forgot-add
    concept: tooling.staging
    difficulty: 2
    language: bash
    code: |
      $ echo "flour, eggs, milk, butter" > pancakes.txt
      $ git commit -m "Add butter"
      On branch main
      Changes not staged for commit:
        (use "git add <file>..." to update what will be committed)
        (use "git restore <file>..." to discard changes in working directory)
              modified:   pancakes.txt

      no changes added to commit (use "git add" and/or "git commit -a")
    prompt: You added butter to the recipe, but no commit was made. Tap the line where it went wrong.
    lines: [2]
    reasons:
      - text: The change was never staged with `git add`
        correct: true
        feedback: >-
          Yes. A commit saves only the basket, and the basket was empty.
      - text: The message needs more detail
        feedback: >-
          Git never judges your message. It had nothing staged to save.
      - text: '`echo` didn''t change the file'
        feedback: >-
          It did: Git lists `pancakes.txt` as modified. Nobody added the change.
    fix: |
      $ echo "flour, eggs, milk, butter" > pancakes.txt
      $ git add pancakes.txt
      $ git commit -m "Add butter"

  - type: prose
    id: ignore-files
    body: |-
      `git add .` puts everything in the folder into the basket. That includes things you never
      want saved: a `.env` file holding a secret key, `node_modules` from npm, or macOS's
      `.DS_Store`.

      A file named `.gitignore` lists what Git should pretend isn't there:

      ```text
      .DS_Store
      .env
      node_modules/
      ```

      Ignored files never show up in `git status`, so `git add .` can't sweep them in. But a
      file that's already in a commit stays in that snapshot for good.

  - type: fill-blank
    id: fill-gitignore
    concept: tooling.gitignore
    difficulty: 2
    language: text
    prompt: >-
      A weather app keeps its API key in `.env`, and npm installed packages into `node_modules`.
      Keep both out of Git. Fill the gaps.
    template: |
      # .gitignore
      {{1}}
      {{2}}
    blanks:
      - key: '1'
        answer: .env
        accept: [node_modules/, node_modules]
      - key: '2'
        answer: node_modules/
        accept: [node_modules, .env]
    bank: [.env, node_modules/, package.json, package-lock.json, app.js]

  - type: ai-review
    id: review-agent-first-commit
    concept: tooling.gitignore
    difficulty: 3
    language: bash
    request: Put my weather app in Git and make the first commit.
    flawClass: security
    code: |
      git init
      git add .
      git commit -m "First commit"
      echo ".env" > .gitignore
    prompt: >-
      An AI agent ran these in your weather app. `.env` holds your live API key. Tap the line
      where the key leaked into history.
    lines: [2]
    reasons:
      - text: Nothing ignores `.env` yet, so it gets staged
        correct: true
        feedback: >-
          Yes. The key is in the first commit now. Ignore first, then replace the key.
      - text: '`git init` should come after `git add`'
        feedback: >-
          Git can't stage anything before the repository exists. `init` has to come first.
      - text: '`git commit` should name the files'
        feedback: >-
          A commit saves whatever is staged. The trouble is what got staged.
    verify:
      question: The key is in the first commit now. What closes the leak?
      choices:
        - text: Replace the API key with a new one
          correct: true
          feedback: >-
            Yes. The old key stays in history, so it must stop working.
        - text: Delete `.env` and commit again
          feedback: >-
            The new commit drops the file, but the first snapshot still holds the key for good.
        - text: Add `.env` to `.gitignore` now
          feedback: >-
            Ignoring keeps it out of future commits. The snapshot that already holds it doesn't change.
    fix: |
      git init
      echo ".env" > .gitignore
      git add .
      git commit -m "First commit"

  - type: explain-back
    id: explain-add-then-commit
    concept: tooling.staging
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: Why does Git make you `git add` before `git commit`, instead of saving every change?
    rubric:
      - '`git add` chooses which changes go into the next snapshot.'
      - '`git commit` saves only what was added, so each commit can hold one clear change.'
      - A change you didn't add, or a file that's ignored, stays out of the commit.
    modelAnswer: >-
      The staging area lets me choose. I can change three files but save only the two that belong
      together, with a message that fits them. Anything I didn't add, like a half-done edit or
      my `.env`, stays out of the snapshot. Without that step every stray change would land in
      history.

recap:
  - Save a snapshot with `git add` and `git commit -m`.
  - Read what Git sees with `git status` and `git log --oneline`.
  - Keep secrets and installed packages out with `.gitignore`.

recall:
  - id: card-staging-area
    concept: tooling.staging
    front: What does `git add` do, and what does `git commit` do?
    back: >-
      `git add` puts changes in the staging area. `git commit` saves what's staged as one
      snapshot.
  - id: card-status-words
    concept: tooling.git-commits
    front: What do untracked, modified and staged mean in `git status`?
    back: >-
      Untracked: Git has never saved it. Modified: changed since the last commit. Staged: added,
      ready for the next commit.
  - id: card-gitignore-what
    concept: tooling.gitignore
    front: Which files belong in a JavaScript project's `.gitignore`?
    back: >-
      Secrets such as `.env`, installed packages in `node_modules/`, and system clutter such as
      `.DS_Store`.
  - id: card-secret-in-history
    concept: tooling.gitignore
    front: You committed a key in `.env`, then deleted and ignored it. What must you do?
    back: >-
      Replace the key. Old commits still hold the file, so anyone with the repository can read
      it.

references:
  - kind: book
    title: 'Pro Git, second edition: 2.2 Git Basics, Recording Changes to the Repository'
    authors: Scott Chacon and Ben Straub
    year: 2014
