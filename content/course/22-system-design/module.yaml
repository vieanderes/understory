id: sysdesign
number: 22
title: "System design"
summary: "Design systems the way a senior engineer does: requirements and estimates first, the standard shape, caching, data stores, replication, rate limits, brokers and reliability targets, then case studies ending with an AI assistant and an AI agent."
why: "Architecture decisions are expensive to reverse, and a design review or interview tests how you reason about them."
youCanBuild: "Written designs for a link shortener, a feed, a document assistant and an agent, each with requirements, numbers, a sketch, deep dives and failure modes."
concepts:
  - id: sysdesign.requirements
    title: "Functional and scale requirements"
    summary: "You list what the system must do, then how much: users, requests per second, data size, latency targets and availability."
  - id: sysdesign.standard-shape
    title: "The standard shape"
    summary: "Client, load balancer, stateless services, cache, database, and a queue with async workers is the default sketch that most designs start from."
  - id: sysdesign.failure-modes
    title: "Failure modes"
    summary: "For each component you say what happens when it is slow, down or wrong, and how the system degrades."
  - id: sysdesign.qps-estimation
    title: "Estimating load"
    summary: "Daily active users times actions per user, divided by about 100,000 seconds a day and multiplied for the peak, gives requests per second."
  - id: sysdesign.storage-estimation
    title: "Estimating storage"
    summary: "Records per day times bytes per record times the retention period, plus replicas and indexes, gives the storage to plan for."
  - id: sysdesign.latency-numbers
    title: "Latency numbers"
    summary: "Memory is nanoseconds, an SSD read is microseconds, a same-region network hop is under a millisecond and a cross-continent trip is tens of milliseconds, and designs follow from those gaps."
  - id: sysdesign.cache-aside
    title: "Cache-aside"
    summary: "The application reads the cache, loads from the database on a miss and fills the cache, which suits read-heavy data that tolerates staleness."
  - id: sysdesign.write-through-and-behind
    title: "Write-through and write-behind"
    summary: "Write-through updates cache and database together for fresh reads, and write-behind updates the cache first and the database later, faster but able to lose writes."
  - id: sysdesign.cache-invalidation
    title: "Invalidation"
    summary: "Entries are expired by TTL, deleted on write, or versioned in the key, and each choice has a window where a reader sees stale data."
  - id: sysdesign.cache-stampede
    title: "Stampedes"
    summary: "When a hot key expires, many requests miss at once and hit the database, which request coalescing, early refresh or jittered TTLs prevent."
  - id: sysdesign.data-models
    title: "Data models"
    summary: "Relational, document, key-value, wide-column and graph stores each make some access patterns cheap and others awkward."
  - id: sysdesign.nosql-trade-offs
    title: "NoSQL trade-offs"
    summary: "Many NoSQL stores scale writes horizontally by giving up joins, multi-row transactions or strong consistency, and you design tables around the queries."
  - id: sysdesign.postgres-reach
    title: "How far Postgres goes"
    summary: "JSONB, full-text search, pgvector, partitioning and read replicas let one Postgres cover most workloads well past the scale where teams first reach for another store."
  - id: sysdesign.leader-follower
    title: "Leader and followers"
    summary: "One node accepts writes and streams them to followers that serve reads, synchronously for safety or asynchronously for speed."
  - id: sysdesign.replica-lag
    title: "Replica lag"
    summary: "An asynchronous follower is behind the leader, so a user can miss their own write unless that read goes to the leader."
  - id: sysdesign.failover
    title: "Failover"
    summary: "When the leader fails a follower is promoted, and without fencing two nodes can both accept writes, which is split brain."
  - id: sysdesign.token-bucket
    title: "Token bucket"
    summary: "A bucket refills at a steady rate up to a capacity and each request spends a token, which allows short bursts and caps the average."
  - id: sysdesign.window-limits
    title: "Fixed and sliding windows"
    summary: "A fixed window counts requests per clock interval and allows double bursts at the edges, and a sliding window smooths them out."
  - id: sysdesign.distributed-rate-limits
    title: "Distributed limits"
    summary: "Servers share counters in Redis with atomic operations or a script, and a limited client gets 429 with a Retry-After header."
  - id: sysdesign.queue-vs-log
    title: "Queues and logs"
    summary: "A queue hands each message to one consumer and deletes it once acknowledged, while a log keeps messages in order so many consumers can read and replay them."
  - id: sysdesign.partitions-and-ordering
    title: "Partitions and ordering"
    summary: "A log is split into partitions by key, order holds only within a partition, and the partition count caps parallel consumers."
  - id: sysdesign.consumer-groups
    title: "Consumer groups and offsets"
    summary: "Consumers in a group share the partitions, each commits the offset it has processed, and a new group can start from the beginning."
  - id: sysdesign.idempotent-consumers
    title: "Idempotent consumers"
    summary: "At-least-once delivery means a consumer will see duplicates, so it records processed message ids or makes its writes safe to repeat."
  - id: sysdesign.slis-and-slos
    title: "SLIs and SLOs"
    summary: "An SLI measures what users feel, such as the share of requests under 300 ms, and an SLO sets its target over a window."
  - id: sysdesign.error-budgets
    title: "Error budgets"
    summary: "The gap between the SLO and 100% is the budget of allowed failure, and when it runs out the team slows releases to fix reliability."
  - id: sysdesign.burn-rate-alerts
    title: "Burn-rate alerts"
    summary: "Alerting on how fast the budget is being spent, over a short and a long window, pages for real trouble and ignores blips."
  - id: sysdesign.designing-for-a-target
    title: "Designing for a reliability target"
    summary: "A target such as 99.9% sets the downtime a design may spend, so slow or flaky work leaves the request path and every hard dependency gets a fallback."
  - id: sysdesign.id-generation
    title: "Generating short ids"
    summary: "A counter encoded in base62, a random id with a collision check, or a hash each trade length, predictability and coordination."
  - id: sysdesign.read-heavy-design
    title: "Designing for reads"
    summary: "When reads outnumber writes a hundred to one, caches, CDNs and replicas carry the load and the write path can stay simple."
  - id: sysdesign.fan-out-on-write
    title: "Fan-out on write"
    summary: "Each new post is pushed into every follower's stored feed, which makes reading fast and writing expensive."
  - id: sysdesign.fan-out-on-read
    title: "Fan-out on read"
    summary: "Each feed is assembled when it is read from the accounts a user follows, which makes writing cheap and reading slower."
  - id: sysdesign.hot-keys
    title: "Hot keys and celebrities"
    summary: "A few accounts or items get most of the traffic, so they are handled separately, merged at read time, or cached with extra copies."
  - id: sysdesign.llm-system-design
    title: "Designing an LLM system"
    summary: "An LLM feature is designed like any service, with requirements and failure modes, plus ingestion, retrieval filtered by permissions, reranking, streaming and evals around the model."
  - id: sysdesign.graceful-degradation
    title: "Graceful degradation"
    summary: "When the model is slow, rate limited or down, the system falls back to a smaller model, a cached answer, search results or a person in a planned order, while access checks fail closed."
  - id: sysdesign.agent-harness-design
    title: "Designing an agent's harness"
    summary: "The model picks tools, but code you own runs the loop with a step cap, checks each tool against the person's rights, times out tools and passes results back as data."
  - id: sysdesign.action-safety
    title: "Safe actions"
    summary: "Tools are sorted by risk: reads run freely, undoable writes run alone, costly or irreversible ones wait for a person, and every retried write carries an idempotency key."
