id: js.changing-the-page
title: Changing the page
objective: Read what someone typed, switch classes, and add and remove elements from JavaScript.
level: essential
minutes: 10
concepts: [js.form-values, js.class-list, js.creating-elements]
prerequisites: [js.meets-the-page, js.arrays]
opening:
  text: >-
    You'll read what someone typed, restyle the page with one class, and grow a list from
    code. Those three moves are most of what interactive pages do.

steps:
  - type: prose
    id: read-a-field
    body: |-
      You met `value` in the coercion lesson: the text in an input box, always a string.
      A checkbox's `value` is `"on"`, ticked or not. Its `checked` says `true` or `false`:

      ```js
      const name = document.querySelector("#name").value;
      const agreed = document.querySelector("#terms").checked;
      ```

      Read them inside a listener, so you get what's there at the moment of the click.

  - type: playground
    id: greet-by-name
    concept: js.form-values
    difficulty: 1
    prompt: >-
      The greeting ignores the box and always says Hello, stranger. Make it greet whoever is
      named in the box. The test press at the end shows the result.
    html: |
      <label for="name">Your name</label>
      <input id="name" value="Priya">
      <button>Say hello</button>
      <p id="greeting"></p>
    js: |
      const box = document.querySelector("#name");
      const button = document.querySelector("button");
      const greeting = document.querySelector("#greeting");

      function sayHello() {
        greeting.textContent = "Hello, stranger";
      }

      button.addEventListener("click", sayHello);

      // A test press, like a visitor's click.
      button.click();
    editable: [js]
    checks:
      - label: The greeting uses the typed name
        selector: '#greeting'
        text: Hello, Priya
    solution:
      js: |
        const box = document.querySelector("#name");
        const button = document.querySelector("button");
        const greeting = document.querySelector("#greeting");

        function sayHello() {
          greeting.textContent = `Hello, ${box.value}`;
        }

        button.addEventListener("click", sayHello);

        // A test press, like a visitor's click.
        button.click();
    hints:
      - The typed text lives on `box`.
      - It's the `value` property.
      - 'A template literal works: `` `Hello, ${box.value}` ``.'

  - type: playground
    id: fix-terms-check
    concept: js.form-values
    difficulty: 2
    prompt: >-
      Bug report: people who never ticked the terms box still get Thanks for signing up. Fix
      the condition so it reads whether the box is ticked.
    html: |
      <label><input type="checkbox" id="terms"> I accept the terms</label>
      <button>Sign up</button>
      <p id="status"></p>
    js: |
      const terms = document.querySelector("#terms");
      const status = document.querySelector("#status");

      function signUp() {
        if (terms.value) {
          status.textContent = "Thanks for signing up";
        } else {
          status.textContent = "Tick the box first";
        }
      }

      document.querySelector("button").addEventListener("click", signUp);

      // A test press, with the box left empty.
      document.querySelector("button").click();
    editable: [js]
    checks:
      - label: An empty box asks to tick it first
        selector: '#status'
        text: Tick the box first
    solution:
      js: |
        const terms = document.querySelector("#terms");
        const status = document.querySelector("#status");

        function signUp() {
          if (terms.checked) {
            status.textContent = "Thanks for signing up";
          } else {
            status.textContent = "Tick the box first";
          }
        }

        document.querySelector("button").addEventListener("click", signUp);

        // A test press, with the box left empty.
        document.querySelector("button").click();
    hints:
      - A checkbox's `value` is the text `"on"`, ticked or not. That's always truthy.
      - Being ticked lives in a different property.
      - Test `terms.checked` instead of `terms.value`.

  - type: prose
    id: classes-switch-looks
    body: |-
      To change how something looks, don't paint it from JavaScript. Write the look in CSS as a
      class, then switch the class on:

      ```js
      card.classList.add("read");
      card.classList.remove("read");
      card.classList.toggle("read");
      ```

      `classList` changes one class and leaves the others alone. `toggle` adds it if it's
      missing and removes it if it's there.

  - type: playground
    id: mark-as-read
    concept: js.class-list
    difficulty: 2
    prompt: >-
      The CSS already greys out a card with the class `read`. Make the button add that class to
      the card. Watch the card fade when it's pressed.
    html: |
      <article class="card">
        <h2>Your parcel has shipped</h2>
        <p>It should arrive on Thursday.</p>
        <button>Mark as read</button>
      </article>
    css: |
      .card { padding: 16px; border: 1px solid #999; color: #111; }
      .read { color: #777; }
    js: |
      const card = document.querySelector(".card");
      const button = document.querySelector("button");

      function markRead() {
        // Your line goes here.
      }

      button.addEventListener("click", markRead);

      // A test press, like a visitor's click.
      button.click();
    editable: [js]
    checks:
      - label: The card has the class `read`
        selector: .card.read
      - label: It keeps its class `card` too
        selector: article.card
      - label: The text turned grey
        selector: .card
        style: { property: color, value: 'rgb(119, 119, 119)' }
    solution:
      js: |
        const card = document.querySelector(".card");
        const button = document.querySelector("button");

        function markRead() {
          card.classList.add("read");
        }

        button.addEventListener("click", markRead);

        // A test press, like a visitor's click.
        button.click();
    hints:
      - The class goes on `card`, not on the button.
      - '`classList` has a method for adding a class.'
      - 'Write `card.classList.add("read");`.'

  - type: predict-output
    id: predict-classname-wipe
    concept: js.class-list
    difficulty: 3
    language: html
    code: |
      <p class="note urgent">Pay the gas bill</p>
      <script>
        const note = document.querySelector(".note");
        note.className = "done";
        console.log(note.className);
      </script>
    question: '`className` holds all the classes as one string. What does this log?'
    choices:
      - text: '`done`'
        correct: true
        feedback: >-
          Right. Setting `className` replaces every class. `classList.add` would keep them.
      - text: '`note urgent done`'
        feedback: >-
          That's what `classList.add("done")` gives. Assigning `className` throws the old ones
          away.
      - text: '`note done`'
        feedback: >-
          Nothing picks `note` out to keep. The whole string is replaced by `"done"`.

  - type: prose
    id: build-elements
    body: |-
      You can make elements too. Build one, fill it, then put it in the page:

      ```js
      const item = document.createElement("li");
      item.textContent = "Oats";
      list.append(item);
      ```

      `append` adds it at the end of `list`. `item.remove()` takes it away again. You'll also
      see `innerHTML`, which takes a string and reads it as HTML, tags and all.

  - type: playground
    id: add-to-list
    concept: js.creating-elements
    difficulty: 3
    prompt: >-
      Make Add put the typed item at the end of the shopping list, as a new `li`. Watch the
      tree grow.
    html: |
      <label for="item">Item</label>
      <input id="item" value="Oats">
      <button>Add</button>
      <ul>
        <li>Milk</li>
        <li>Bread</li>
      </ul>
    js: |
      const box = document.querySelector("#item");
      const button = document.querySelector("button");
      const list = document.querySelector("ul");

      function addItem() {
        // Make an li, give it the typed text, append it to the list.
      }

      button.addEventListener("click", addItem);

      // A test press, like a visitor's click.
      button.click();
    editable: [js]
    showTree: true
    checks:
      - label: The last item says Oats
        selector: 'ul li:last-child'
        text: Oats
      - label: Milk and Bread are still there
        selector: 'ul li:first-child'
        text: Milk
    solution:
      js: |
        const box = document.querySelector("#item");
        const button = document.querySelector("button");
        const list = document.querySelector("ul");

        function addItem() {
          const item = document.createElement("li");
          item.textContent = box.value;
          list.append(item);
        }

        button.addEventListener("click", addItem);

        // A test press, like a visitor's click.
        button.click();
    hints:
      - Three lines, in the order the comment gives.
      - '`document.createElement("li")` makes the element. The text comes from `box.value`.'
      - 'Finish with `list.append(item);`.'

  - type: ai-review
    id: review-innerhtml-comment
    concept: js.creating-elements
    difficulty: 3
    language: js
    request: Show each comment a visitor posts at the end of the list.
    flawClass: security
    code: |
      const box = document.querySelector("#comment");
      const list = document.querySelector("#comments");

      function post() {
        list.innerHTML += "<li>" + box.value + "</li>";
      }

      document.querySelector("button").addEventListener("click", post);
    prompt: >-
      A visitor posted `<img src=x onerror="alert(1)">` and everyone who opened the page got a
      pop-up. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`innerHTML` reads typed text as HTML'
        correct: true
        feedback: >-
          Right. The text became a real element. `textContent` keeps it as plain characters.
      - text: '`box.value` runs the code it holds'
        feedback: >-
          `value` is only a string. It's `innerHTML` that turns the string into elements.
      - text: '`+=` loses the earlier comments'
        feedback: >-
          The old comments stay. The danger is how the new text is read.
    fix: |
      function post() {
        const item = document.createElement("li");
        item.textContent = box.value;
        list.append(item);
      }

  - type: explain-back
    id: explain-class-not-style
    concept: js.class-list
    difficulty: 3
    prompt: >-
      Why is `card.classList.add("read")` better than setting the colour from JavaScript, and why
      better than `card.className = "read"`?
    rubric:
      - The look stays in the CSS, so a designer changes one rule, not the scripts.
      - One class switches several styles at once, and removing it undoes them all.
      - '`className =` replaces every class, while `classList.add` keeps the others.'
    modelAnswer: >-
      With a class, the look lives in the CSS and the script only says what state the card is
      in. One class can change colour, border and more, and removing it undoes the lot.
      Setting `className` would wipe the card's other classes, such as `card` itself, while
      `classList.add` touches only the one I name.

recap:
  - Read a text box with `value` and a checkbox with `checked`.
  - Change a look by switching a CSS class with `classList`.
  - Build elements with `createElement` and `append`, and fill them with `textContent`.

recall:
  - id: card-checkbox-checked
    concept: js.form-values
    front: How do you tell whether a checkbox is ticked?
    back: >-
      Read its `checked` property, `true` or `false`. Its `value` is `"on"` either way.
  - id: card-toggle
    concept: js.class-list
    front: What does `menu.classList.toggle("open")` do?
    back: >-
      Adds the class `open` if it's missing and removes it if it's there. Other classes stay.
  - id: card-new-element
    concept: js.creating-elements
    front: Which three lines add a list item saying Tea to the end of `list`?
    back: >-
      `const item = document.createElement("li");`, `item.textContent = "Tea";`,
      `list.append(item);`.
  - id: card-textcontent-safe
    concept: js.creating-elements
    front: Why put typed text in with `textContent` and not `innerHTML`?
    back: >-
      `innerHTML` reads the text as HTML, so a visitor could slip in elements and scripts.
      `textContent` shows it as plain characters.

