deepDive: >-
  The trailing slash matters. On `/guides`, the path `screen.png` leads to `/screen.png`,
  because `guides` is the last part and gets dropped. On `/guides/`, it leads to
  `/guides/screen.png`. JavaScript's `new URL("screen.png", base)` resolves paths the same
  way, so you can test one in the console.


  The fragment never reaches the server. The browser keeps it and scrolls once the page has
  loaded. A click on a fragment on the same page sends no request at all.


  A normal link to another page is a navigation. The browser asks the server for the new
  page and throws away the old one, JavaScript variables included. It also adds an entry to
  the history behind the Back button.


  `target="_blank"` opens a link in a new tab. Browsers now treat it as if `rel="noopener"`
  were set, so the new page can't reach back into yours.


  A `base` element in `head` changes the starting point for every relative path on the
  page. It's rare, and it surprises people, so check for one when paths behave strangely.
