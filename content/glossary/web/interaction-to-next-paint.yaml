term: Interaction to Next Paint
aka: [ INP ]
short: The time from a tap, click or key press until the screen shows the result.
explain: |
  You tap a button and nothing happens. You tap again. The page was busy and your tap waited.
  This measures that wait, across the visit, and reports one of the slowest.

  It has three parts. The input delay while the main thread is busy, your handler's run time,
  and painting the next frame. Good is 200 ms or less. The fix is usually to break long tasks
  up and do less work per event.
analogy: The pause between pressing a lift button and seeing it light up.
example:
  language: ts
  code: |
    button.addEventListener('click', async () => {
      showSpinner(); // paint something now
      await new Promise((r) => setTimeout(r, 0)); // let the frame draw
      filterTenThousandRows();
    });
usage: Interaction to Next Paint is 600 ms on the filter button, because it sorts the whole table in one go.
twin:
  term: long-task
  difference: A long task is the cause, a stretch of main-thread work over 50 ms. Interaction to Next Paint is the effect a visitor feels when their tap lands during one.
related: [ long-task, main-thread, core-web-vitals, debounce ]
level: 2
lessons: [ perf.web-vitals, perf.cost-of-javascript ]
