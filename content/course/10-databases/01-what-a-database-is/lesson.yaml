id: db.what-a-database-is
title: What a database is
objective: "Say what a database, a table and SQL are, and run your first `SELECT` against Postgres."
level: essential
minutes: 8
concepts: [db.databases, db.select-basics]
prerequisites: [backend.api-design]
opening:
  text: >-
    You'll see where an app's data really lives, and ask a real database your first question
    within a minute. Every screen you build later reads from something like this.

steps:
  - type: prose
    id: why-not-a-json-file
    body: >-
      Your server could keep its data in a JSON file. Read it, change it, write it back. Fine
      for one person.


      Then two requests arrive at once, and one change overwrites the other. A crash mid-write
      leaves half a file. A million rows take seconds to search.


      A **database** is a program built to avoid all three. It keeps data safe, handles many
      requests at once, and finds rows fast.

  - type: prose
    id: tables-rows-columns
    body: >-
      We'll use **Postgres**, a free database most web apps can run on. It keeps data in
      **tables**, like a spreadsheet that refuses bad data:


      ```text

      id | title  | author        | year

      ---+--------+---------------+-----

       1 | Dune   | Frank Herbert | 1965

       2 | Emma   | Jane Austen   | 1815

      ```


      Each **row** is one book. Each **column** has a name and a type. Put the word "soon" in
      `year`, and Postgres says no.

  - type: prose
    id: what-sql-is
    body: >-
      You talk to a database in **SQL**, a language for asking about tables. One request is a
      statement, and a semicolon ends it:


      ```sql

      SELECT title, year FROM books;

      ```


      `SELECT` names the columns you want. `FROM` names the table. `*` means every column.
      Keywords are in capitals by habit; Postgres doesn't mind either way.

  - type: sql
    id: run-first-select
    concept: db.select-basics
    difficulty: 1
    prompt: >-
      This asks for every column of every book. Press Run and look at the table. Then change it
      to show only `title` and `year`.
    setup: |
      CREATE TABLE books (
        id integer PRIMARY KEY,
        title text NOT NULL,
        author text NOT NULL,
        year integer NOT NULL,
        on_loan boolean NOT NULL
      );
      INSERT INTO books VALUES
        (1, 'Dune', 'Frank Herbert', 1965, false),
        (2, 'Pride and Prejudice', 'Jane Austen', 1813, true),
        (3, 'The Hobbit', 'J. R. R. Tolkien', 1937, false),
        (4, 'Beloved', 'Toni Morrison', 1987, true),
        (5, 'Things Fall Apart', 'Chinua Achebe', 1958, false);
    starter: |
      SELECT * FROM books;
    solution: |
      SELECT title, year FROM books;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Replace `*` with the column names you want.
      - Separate the two names with a comma.

  - type: sql
    id: fix-missing-comma
    concept: db.select-basics
    difficulty: 2
    prompt: >-
      A teammate wants each title with its author. Run their query. There's no error, yet only
      one column comes back, with an odd name. Fix it.
    setup: |
      CREATE TABLE books (
        id integer PRIMARY KEY,
        title text NOT NULL,
        author text NOT NULL,
        year integer NOT NULL,
        on_loan boolean NOT NULL
      );
      INSERT INTO books VALUES
        (1, 'Dune', 'Frank Herbert', 1965, false),
        (2, 'Pride and Prejudice', 'Jane Austen', 1813, true),
        (3, 'The Hobbit', 'J. R. R. Tolkien', 1937, false),
        (4, 'Beloved', 'Toni Morrison', 1987, true),
        (5, 'Things Fall Apart', 'Chinua Achebe', 1958, false);
    starter: |
      SELECT title author FROM books;
    solution: |
      SELECT title, author FROM books;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Look at the heading of the one column. Which word became its name?
      - Without a comma, a second word after a column renames that column.

  - type: prose
    id: read-the-error
    body: >-
      When a statement is wrong, Postgres stops and says why, in plain words. Read it before you
      change anything:


      ```text

      ERROR: column "titel" does not exist

      HINT: Perhaps you meant to reference the column "books.title".

      ```


      The error names the exact word it choked on. The hint often names the fix. Developers
      who read errors closely fix bugs fastest.

  - type: sql
    id: fix-the-typos
    concept: db.select-basics
    difficulty: 1
    prompt: >-
      This should list each book's title and whether it's on loan. Run it, read the error, fix
      that word, and run again until the rows appear.
    setup: |
      CREATE TABLE books (
        id integer PRIMARY KEY,
        title text NOT NULL,
        author text NOT NULL,
        year integer NOT NULL,
        on_loan boolean NOT NULL
      );
      INSERT INTO books VALUES
        (1, 'Dune', 'Frank Herbert', 1965, false),
        (2, 'Pride and Prejudice', 'Jane Austen', 1813, true),
        (3, 'The Hobbit', 'J. R. R. Tolkien', 1937, false),
        (4, 'Beloved', 'Toni Morrison', 1987, true),
        (5, 'Things Fall Apart', 'Chinua Achebe', 1958, false);
    starter: |
      SELECT title, onloan FROM book;
    solution: |
      SELECT title, on_loan FROM books;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Postgres reads the table name first, so that's the first complaint.
      - The table list beside the editor shows the real names.
      - Two words are wrong. The table is `books`, and the column has an underscore.

  - type: multiple-choice
    id: pick-json-race
    concept: db.databases
    difficulty: 2
    question: >-
      Two readers borrow at once. Each request reads `books.json`, changes one book, writes it
      back. What can happen?
    choices:
      - text: One borrowing silently disappears
        correct: true
        feedback: >-
          Right. Both read the old file, and the second write replaces the first.
      - text: The second request waits for the first
        feedback: >-
          Nothing makes it wait. Two requests run side by side, and a plain file has no queue.
      - text: The server stops with an error
        feedback: >-
          That would be kinder. Writing a file twice is allowed, so the loss is silent.
      - text: The file gets both changes merged
        feedback: >-
          Each request writes the whole file from its own copy. Nothing merges them.

  - type: explain-back
    id: explain-why-a-database
    concept: db.databases
    difficulty: 2
    prompt: >-
      A friend's small shop keeps orders in a JSON file on the server. Why might they want a
      database, and what would they ask it in?
    rubric:
      - Many requests at once can overwrite each other's changes in a file.
      - A crash mid-write can leave a file broken, and big files are slow to search.
      - A database such as Postgres handles all three, and you query it with SQL.
    modelAnswer: >-
      A file is fine for one person. With customers ordering at the same time, two requests read
      the old file. The second write wipes out the first order. A crash mid-write can leave
      half a file, and searching thousands of orders means reading all of them. A database like
      Postgres is built for exactly this. You'd ask it questions in SQL, such as
      `SELECT * FROM orders;`.

recap:
  - Say why an app keeps its data in a database rather than a file.
  - Read a table as rows and columns, and ask for columns with `SELECT ... FROM`.
  - Read Postgres's error and hint, and fix the word it names.

recall:
  - id: card-why-database
    concept: db.databases
    front: Name two things that go wrong when a server keeps its data in one JSON file.
    back: >-
      Two requests at once overwrite each other's changes, a crash mid-write leaves a broken
      file, and searching means reading everything.
  - id: card-select-shape
    concept: db.select-basics
    front: Write the statement that lists the `name` and `email` of every row in `users`.
    back: "`SELECT name, email FROM users;`"
  - id: card-missing-comma
    concept: db.select-basics
    front: What does `SELECT title author FROM books;` return?
    back: >-
      One column of titles, headed `author`. Without the comma, `author` renames the column
      before it.

