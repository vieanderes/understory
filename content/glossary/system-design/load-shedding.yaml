term: load shedding
aka: [shedding load]
short: Turning away some requests on purpose when overloaded, so the ones accepted still succeed in time.
explain: |
  A server at full capacity that keeps accepting work gets slower for everyone. Soon every
  request times out, and it's doing lots of work nobody receives.

  Better to say no early and cheaply: reply `503` with `Retry-After` once a queue passes a
  limit or a request has waited too long. Shed the least important work first, such as
  analytics before checkout. The client must back off, or the refusals become a retry
  storm.
analogy: A restaurant that stops seating new groups when the kitchen is full, so the diners inside still get their food.
example:
  language: http
  code: |
    HTTP/1.1 503 Service Unavailable
    Retry-After: 5
    Content-Type: application/json

    {"error": "overloaded"}
usage: Add load shedding at 200 queued requests, so checkout keeps working when the report endpoint gets hammered.
twin:
  term: backpressure
  difference: Load shedding drops the extra work. Backpressure asks the sender to slow down and keeps all of it.
related: [backpressure, rate-limiting, circuit-breaker, retry]
level: 3
lessons: [scale.failure-handling, scale.backpressure]
