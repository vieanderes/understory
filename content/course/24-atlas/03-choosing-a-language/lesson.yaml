    note: Why Go programs are statically linked into one binary.
    verified: true

deepDive: >-
  The fill-blank's module is illustrative: `instantiateStreaming` compiles a module as it
  downloads, and the functions it exports appear on `instance.exports`. Passing numbers in
  and out is direct. Passing an image means writing its bytes into the module's memory
  first, which is why most teams use a generated wrapper rather than calling exports by
  hand.


  Libraries that run models in the page, such as ONNX Runtime Web, use WebAssembly, and
  WebGPU where the browser has it. It suits small models and private data that shouldn't
  leave the device. Large language models still mostly run at a provider.


  Real decisions add limits: start-up time, memory, latency. A function that starts per
  request wants Go's quick start. And a team's knowledge is a cost that falls with time,
  where a missing library is a cost that doesn't.
