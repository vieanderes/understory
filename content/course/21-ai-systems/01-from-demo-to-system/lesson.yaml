deepDive: >-
  **In a system design round**, draw this pipeline first, then walk one request through
  it. For each box, name what fails without it and what the box costs in latency. Redaction
  and rules take milliseconds, a classifier tens of milliseconds, and the agent seconds.


  **Synchronous or not.** Triage and guards sit on the request path, so they must be fast.
  Evals, judge scoring of live samples and eval-set curation run beside it, on a schedule
  or in CI, and never slow a user down.


  **Fallbacks per box.** A classifier that times out sends the ticket to a person. A guard
  that errors blocks the action rather than allowing it. A model that's overloaded falls
  back to another model or a plain "we'll get back to you". Decide each one before launch,
  not during the incident.
