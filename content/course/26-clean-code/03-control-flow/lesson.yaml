id: clean.control-flow
title: Flat control flow
objective: Flatten nested conditions with guard clauses and early returns, drop else after return, and replace long if chains with lookup tables.
level: essential
minutes: 10
concepts: [clean.guard-clauses, clean.nesting-depth, clean.lookup-tables]
prerequisites: [js.everyday-syntax, clean.functions]
opening:
  text: >-
    You'll turn a staircase of nested `if`s into a flat function you can read top to
    bottom. Flat code hides fewer bugs, and you'll see one hiding in a staircase.

steps:
  - type: prose
    id: nesting-staircase
    body: |-
      Every `if` inside another `if` adds a step to a staircase:

      ```js
      if (user) {
        if (user.isMember) {
          if (room.isOpen) {
            book(room);
          }
        }
      }
      ```

      To know when `book` runs, you hold all three conditions in your head at once. Each
      level is called **nesting**, and every extra level costs the reader a little more.

  - type: predict-output
    id: predict-nested
    concept: clean.nesting-depth
    difficulty: 2
    language: js
    code: |
      function shippingCost(order) {
        if (order) {
          if (order.items.length > 0) {
            if (order.country === "UK") {
              return 0;
            } else {
              return 5;
            }
          }
        }
        return null;
      }
      console.log(shippingCost({ items: [], country: "UK" }));
    question: What does this print?
    choices:
      - text: '`null`'
        correct: true
        feedback: >-
          Yes. No items, so it skips to the last line. Took a moment, didn't it?
      - text: '`0`'
        feedback: >-
          The country is UK, but the empty basket stops it one level earlier.
      - text: '`5`'
        feedback: >-
          The `else` only runs for other countries, and only with items in the basket.

  - type: prose
    id: guard-clauses
    body: |-
      Here's the same function, flat:

      ```js
      function shippingCost(order) {
        if (!order || order.items.length === 0) return null;
        if (order.country === "UK") return 0;
        return 5;
      }
      ```

      Special cases leave first. That's a **guard clause**. After a `return`, no `else` is
      needed. The main path ends the function, with nothing to hold in your head.

  - type: parsons
    id: arrange-guards
    concept: clean.guard-clauses
    difficulty: 2
    language: js
    prompt: >-
      Build `discount(user, total)`. No user gets 0, staff get half off, everyone else
      gets 10% off. Arrange it flat, guards first.
    blocks:
      - id: start
        code: 'function discount(user, total) {'
        subgoal: Start the function
      - id: guard
        code: 'if (!user) return 0;'
        indent: 1
        subgoal: Reject what can't be priced
      - id: staff
        code: 'if (user.isStaff) return total * 0.5;'
        indent: 1
        subgoal: Handle the special case
      - id: main
        code: 'return total * 0.1;'
        indent: 1
        subgoal: Finish the main path
      - id: end
        code: '}'
        subgoal: Finish the main path
    distractors:
      - id: else-branch
        code: '} else {'
        feedback: >-
          After a `return`, an `else` adds nothing. The next line only runs if the guard
          didn't return.

  - type: bug-hunt
    id: hunt-wrong-else
    concept: clean.nesting-depth
    difficulty: 3
    language: js
    code: |
      function canBook(room, user) {
        if (room.isOpen) {
          if (user.isMember) {
            return true;
          }
        } else {
          return false;
        }
      }
    prompt: >-
      `canBook` should always return `true` or `false`. For an open room and a guest who
      isn't a member, it returns `undefined`. Tap the line at fault.
    lines: [6]
    reasons:
      - text: This `else` belongs to the outer `if`
        correct: true
        feedback: >-
          Exactly. The non-member path inside has no `return` at all.
      - text: '`return true` should be `return false`'
        feedback: >-
          Members may book, so that's right. The missing case is the non-member one.
      - text: '`room.isOpen` needs `=== true`'
        feedback: >-
          The check itself works. The nesting hid a path that returns nothing.
    fix: |
      function canBook(room, user) {
        if (!room.isOpen) return false;
        return user.isMember;
      }

  - type: prose
    id: lookup-tables
    body: |-
      A chain that only picks a value can become a table:

      ```js
      const STATUS_LABELS = new Map([
        ["new", "New"],
        ["paid", "Paid"],
        ["shipped", "On its way"],
      ]);
      const label = STATUS_LABELS.get(status) ?? "Unknown";
      ```

      `new Map` takes a list of `[key, value]` pairs. That's a **lookup table**. Adding a
      status is one line, not one more branch.

      Why not a plain object? Every object comes with hidden built-in keys, such as
      `constructor`. A lookup on user input can land on one. A `Map` holds only what you put
      in.

  - type: predict-output
    id: predict-map-miss
    concept: clean.lookup-tables
    difficulty: 2
    language: js
    code: |
      const PRICES = new Map([["small", 2], ["large", 3]]);
      console.log(PRICES.get("medium") ?? 0);
    question: What does this print?
    choices:
      - text: '`0`'
        correct: true
        feedback: >-
          Right. A missing key gives `undefined`, and `??` swaps in 0.
      - text: '`undefined`'
        feedback: >-
          `get` does return `undefined`, but `??` replaces it with the 0.
      - text: An error
        feedback: >-
          A `Map` never throws for a missing key. It returns `undefined`.

  - type: ai-review
    id: review-object-lookup
    concept: clean.lookup-tables
    difficulty: 4
    language: js
    request: Turn the status if-chain into a lookup, with "Unknown" for anything else.
    flawClass: edge-case
    code: |
      const LABELS = { new: "New", paid: "Paid", shipped: "On its way" };
      function statusLabel(status) {
        return LABELS[status] ?? "Unknown";
      }
    prompt: >-
      An assistant wrote this. Tests for the three statuses and `"lost"` passed. The status
      is typed by users, and typing `constructor` shows code, not a label. Tap the line.
    lines: [1]
    reasons:
      - text: A plain object inherits keys like `constructor`
        correct: true
        feedback: >-
          Yes. Every object has built-in keys. A `Map` holds only what you put in.
      - text: '`??` should be `||`'
        feedback: >-
          `||` wouldn't help: the inherited function counts as true. The table is the problem.
      - text: '`status` needs `toLowerCase()`'
        feedback: >-
          Casing isn't the issue. `constructor` is found on every plain object.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A status named after a built-in key, like `toString`
          correct: true
          feedback: >-
            Yes. Any inherited key returns a function instead of "Unknown".
        - text: A known status in capitals, like `PAID`
          feedback: >-
            That gives "Unknown", which is fine. It never touches the keys every object
            inherits.
        - text: No status at all, `undefined`
          feedback: >-
            Objects have no key called `undefined`, so it gives "Unknown". The inherited keys
            stay untested.
    fix: |
      const LABELS = new Map([
        ["new", "New"],
        ["paid", "Paid"],
        ["shipped", "On its way"],
      ]);
      function statusLabel(status) {
        return LABELS.get(status) ?? "Unknown";
      }

  - type: code-challenge
    id: write-flat-price
    concept: clean.lookup-tables
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      `monthlyPrice(plan, seats)` works but nests three deep. Flatten it with guard clauses.
      Move the prices into a `Map` called `PRICE_PER_SEAT`: solo 5, team 4, business 3.


      Return the price per seat times `seats`. Return `null` for an unknown plan or fewer
      than one seat.
    hints:
      - The outer `if` checks seats, and the inner chain only picks a number.
      - The seat check can be a guard at the top. The chain becomes a `Map` lookup.
      - 'Start with `const PRICE_PER_SEAT = new Map([["solo", 5], ...]);` and `if (seats < 1) return null;`'

  - type: explain-back
    id: explain-guards
    concept: clean.guard-clauses
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: Why is a function with guard clauses easier to check than the same logic nested three deep?
    rubric:
      - Each guard handles one case and leaves, so it can be read on its own.
      - Nesting makes you hold every outer condition in mind at once.
      - Deep nesting hides paths, such as one with no return.
    modelAnswer: >-
      With guards, each special case is handled and gone by the next line. You read the main
      path with nothing else to remember. Nested, every line depends on all the conditions
      above it. That's where a missing `else` or a missing return hides.

recap:
  - Handle special cases first with guard clauses and early returns.
  - Treat deep nesting as a warning, and flatten it.
  - Replace a chain that only picks a value with a `Map`.
recall:
  - id: card-guard
    concept: clean.guard-clauses
    front: What is a guard clause?
    back: >-
      A check at the top of a function that returns early for a special case, so the main
      path stays unindented.
  - id: card-else-after-return
    concept: clean.guard-clauses
    front: Why drop the `else` after an `if` that returns?
    back: >-
      The code after the `if` only runs when it didn't return, so the `else` adds a level
      and nothing else.
  - id: card-nesting
    concept: clean.nesting-depth
    front: Why is each extra level of nesting a cost?
    back: >-
      Every level is one more condition the reader must hold in mind, and it hides paths.
  - id: card-lookup
    concept: clean.lookup-tables
    front: Why use a `Map` rather than a plain object for a lookup on outside input?
    back: >-
      A plain object inherits keys like `constructor`. A `Map` holds only the keys you put in.

references:
  - kind: docs
    title: Replace Nested Conditional with Guard Clauses
    authors: Martin Fowler
    venue: Refactoring catalog
    url: https://refactoring.com/catalog/replaceNestedConditionalWithGuardClauses.html
    note: The refactoring move, step by step.
    primary: true
    verified: true
  - kind: docs
    title: Map
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
    note: Includes a comparison of Map and plain objects, with the inherited-keys risk.
    primary: true
    verified: true

deepDive: >-
  Some style guides once required a single return per function. That rule came from
  languages with manual clean-up, where an early return could skip freeing memory. JavaScript
  frees memory for you, so early returns are safe and usually clearer.


  A lookup table can hold functions too: `new Map([["csv", toCsv], ["json", toJson]])` picks
  behaviour, not only a value. When the branches share a shape but differ in behaviour,
  that's also where classes with a shared method name come in.


  In Python, a `dict` lookup with `.get(key, default)` is the idiom, and a `dict` has no
  inherited keys to trip over.
