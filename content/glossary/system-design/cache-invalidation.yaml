term: cache invalidation
aka: [invalidating the cache, cache busting, purge]
short: Throwing away or refreshing a stored copy because the original data it came from has changed.
explain: |
  A stored copy is only useful while it's right. When a price changes in the database, the
  old copy keeps serving the old price until something removes it.

  You can let copies expire after a set time, delete the key when you write, or put a
  version in the key (`product:42:v7`) so a change makes a new key. Deleting after the
  database write is safer than updating the copy, because two writers updating it can leave
  the older value last. It's famously hard because every place that changes the data has to
  remember.
analogy: Taking down the "today's special" board when the kitchen runs out, so nobody orders a dish that no longer exists.
example:
  language: ts
  code: |
    await db.updatePrice(productId, newPrice);
    // delete after the write, so the next read loads the new price
    await redis.del(`product:${productId}`);
usage: The old prices are still showing because the admin screen skips cache invalidation when it saves.
related: [cache, cache-stampede, cdn]
level: 2
lessons: [perf.server-caching, sysdesign.caching-patterns]
