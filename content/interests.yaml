# Signal: the reader profile. scripts/news reads this file on every run.
# Schema: interestsSchema in src/core/news/schema.ts. How scoring uses it: docs/SIGNAL.md.
#
# The default reader builds for the web with TypeScript and works with AI tools. Tune for one
# person: a topic weight says how much a match is worth, not how important the field is.

# Hours until the recency part of a score halves. 48 keeps a two-day-old release in play
# when a louder day crowded it out, and the 72 hour cut-off in the pipeline ends the tail.
halfLifeHours: 48

# An item must reach this score to enter a day. A quiet day is better than a padded one.
minScore: 1.2

# score = topic * T + source * S + engagement * E + recency * R. Each part is 0 to about 1.
weights:
  topic: 1.0
  source: 0.6
  engagement: 0.5
  recency: 0.9

# Trust in a source, 0 to 1. Feed weights come from feeds.yaml and are merged into `ids`.
sourceWeights:
  kinds:
    hn: 0.5
    # Low on purpose: a paper ranks on its topic alone unless Hacker News also carries it,
    # in which case dedupe folds the points into the paper.
    arxiv: 0.3
    feed: 0.6
  ids: {}

