id: css.responsive-design
title: Units and responsive design
objective: Size with relative units, and adapt a layout with media queries, container queries and `clamp()`.
level: essential
minutes: 10
concepts: [css.relative-units, css.media-queries, css.container-queries, css.fluid-sizing]
prerequisites: [css.positioning]
opening:
  text: >-
    You'll make one page work on a phone and a laptop, and a card that fits wherever it's
    dropped. That's the difference between a layout that bends and one that breaks.

steps:
  - type: prose
    id: relative-units
    body: |-
      So far, sizes have been in `px`, which never change. Relative units follow something
      else:

      - `%`: a share of the parent's width
      - `rem`: the root font size, usually 16px, so `2rem` is 32px
      - `em`: the element's own font size
      - `vw`: 1% of the **viewport**, the visible part of the browser window

      Text in `rem` grows when a reader turns up their browser's font size. Text in `px`
      doesn't.

  - type: playground
    id: size-in-rem
    concept: css.relative-units
    difficulty: 1
    prompt: >-
      Switch the page to `rem`. Set the `h1` to `font-size: 2rem` and the `.intro` padding to
      `1.5rem`. With a 16px root, that's 32px and 24px.
    html: |
      <h1>Hill walks near town</h1>
      <p class="intro">Five routes, from a gentle hour to a full day out.</p>
    css: |
      body { font-family: sans-serif; }
      h1 { font-size: 20px; }
      .intro {
        padding: 8px;
        background: honeydew;
      }
    editable: [css]
    checks:
      - label: The heading is 2rem, which is 32px
        selector: h1
        style: { property: font-size, value: 32px }
      - label: The intro has 1.5rem of padding
        selector: .intro
        style: { property: padding-top, value: 24px }
    solution:
      css: |
        body { font-family: sans-serif; }
        h1 { font-size: 2rem; }
        .intro {
          padding: 1.5rem;
          background: honeydew;
        }
    hints:
      - Replace the `px` values, keeping the properties.
      - One `rem` is the root font size, 16px here.
      - 'Write `font-size: 2rem;` and `padding: 1.5rem;`.'

  - type: prose
    id: media-queries
    body: |-
      A **media query** applies rules only when the viewport matches a condition. Write the
      phone layout first, then add rules for wider screens:

      ```css
      .cards { display: grid; gap: 16px; }
      @media (min-width: 600px) {
        .cards { grid-template-columns: 1fr 1fr; }
      }
      ```

      That's mobile first. A phone reports its real width only if the page has the viewport
      tag from the HTML chapter.

  - type: playground
    id: move-the-breakpoint
    prompt: >-
      The preview is wider or narrower than 600px, depending on your screen. Change `600px` to
      `300px`, then to `1200px`, and watch the cards switch between one column and two.
    html: |
      <div class="cards">
        <div class="card">Riverside loop</div>
        <div class="card">Beacon Hill</div>
        <div class="card">Old railway line</div>
        <div class="card">Bluebell woods</div>
      </div>
    css: |
      body { font-family: sans-serif; }
      .cards { display: grid; gap: 16px; }
      .card { padding: 24px; background: honeydew; border: 2px solid darkgreen; }
      @media (min-width: 600px) {
        .cards { grid-template-columns: 1fr 1fr; }
      }
    editable: [css]

  - type: predict-output
    id: predict-media-in-sidebar
    concept: css.media-queries
    difficulty: 2
    language: css
    code: |
      /* A laptop 1280px wide. The summary sits in a 320px sidebar. */
      .summary {
        display: grid;
        grid-template-columns: 1fr;
      }
      @media (min-width: 600px) {
        .summary { grid-template-columns: 1fr 1fr; }
      }
    question: How many columns does the summary get in that narrow sidebar?
    choices:
      - text: Two, squeezed into the sidebar
        correct: true
        feedback: >-
          Right. The query asks about the screen, which is 1280px wide.
      - text: One, because the sidebar is narrow
        feedback: >-
          You'd hope so. But a media query measures the viewport, not the box the component
          sits in.
      - text: Two, spilling out of the sidebar
        feedback: >-
          The columns share the room the summary has. The query only decides how many.

  - type: prose
    id: component-does-not-know
    body: |-
      A media query only knows the screen. A card in a narrow sidebar gets the same answer as
      one in a wide column. A **container query** asks a better question: how wide is the box
      I'm in? Mark the box, then query it:

      ```css
      .sidebar { container-type: inline-size; }
      @container (min-width: 250px) { .card { display: flex; } }
      ```

      The query reads the nearest marked ancestor.

  - type: playground
    id: mark-the-containers
    concept: css.container-queries
    difficulty: 3
    prompt: >-
      The same event card sits in a wide box and a narrow one. The `@container` rule does
      nothing yet. Give `.wide` and `.narrow` `container-type: inline-size;`, then compare the
      two cards.
    html: |
      <div class="wide">
        <div class="card"><div class="date">12 Jun</div><p>Night walk on Beacon Hill</p></div>
      </div>
      <div class="narrow">
        <div class="card"><div class="date">12 Jun</div><p>Night walk on Beacon Hill</p></div>
      </div>
    css: |
      body { font-family: sans-serif; }
      .narrow { width: 180px; margin-top: 16px; }
      .card { padding: 8px; background: honeydew; border: 2px solid darkgreen; }
      .date { padding: 8px; background: darkgreen; color: white; }
      @container (min-width: 250px) {
        .card { display: flex; gap: 16px; align-items: center; }
      }
    editable: [css]
    checks:
      - label: The wide box is a container
        selector: .wide
        style: { property: container-type, value: inline-size }
      - label: The narrow box is a container
        selector: .narrow
        style: { property: container-type, value: inline-size }
    solution:
      css: |
        body { font-family: sans-serif; }
        .wide, .narrow { container-type: inline-size; }
        .narrow { width: 180px; margin-top: 16px; }
        .card { padding: 8px; background: honeydew; border: 2px solid darkgreen; }
        .date { padding: 8px; background: darkgreen; color: white; }
        @container (min-width: 250px) {
          .card { display: flex; gap: 16px; align-items: center; }
        }
    hints:
      - The declaration goes on the boxes around the cards, not on the cards.
      - One rule can list both selectors, separated by a comma.
      - 'Write `.wide, .narrow { container-type: inline-size; }`.'

  - type: prose
    id: fluid-sizing
    body: |-
      `clamp(min, preferred, max)` uses the preferred value, kept between the two limits.
      With `vw` in the middle, a heading grows with the screen:

      ```css
      h1 { font-size: clamp(1.5rem, 1rem + 2.5vw, 2.5rem); }
      ```

      With a 16px root, it's 24px on a 320px phone and 40px from 960px up. In between, it
      slides smoothly, with no media query.

  - type: fill-blank
    id: fill-clamp-limits
    concept: css.fluid-sizing
    difficulty: 2
    language: css
    prompt: >-
      The heading should grow with the screen, but never below `1.5rem` and never above
      `2.5rem`. Fill in the limits.
    template: |
      h1 {
        font-size: clamp({{1}}, 1rem + 2.5vw, {{2}});
      }
    blanks:
      - key: '1'
        answer: 1.5rem
      - key: '2'
        answer: 2.5rem
    bank: [1.5rem, 2.5rem, 2.5vw, 100%]

  - type: explain-back
    id: explain-container-over-media
    concept: css.container-queries
    difficulty: 3
    prompt: >-
      The same card appears in a wide column and in a narrow sidebar. Why does a container
      query suit it better than a media query?
    rubric:
      - A media query measures the viewport, so both copies get the same answer.
      - A container query measures the box the component was placed in.
      - So the component decides from the room it has, and can be reused anywhere.
    modelAnswer: >-
      A media query only knows the screen. So both copies of the card get the same layout,
      however much room they have. A container query measures the nearest ancestor marked as a
      container. The narrow sidebar gets the stacked card and the wide column the side-by-side
      one, from the same rule.

recap:
  - Size text and spacing in `rem`, and tell `rem`, `em`, `%` and `vw` apart.
  - Write a mobile-first layout with a media query.
  - Adapt a card to its box with a container query, and grow a heading with `clamp()`.

recall:
  - id: card-rem-or-em
    concept: css.relative-units
    front: What does `2rem` measure against, and what does `2em` measure against?
    back: >-
      `2rem` is twice the root font size. `2em` is twice the element's own font size.
  - id: card-mobile-first
    concept: css.media-queries
    front: What does "mobile first" mean when writing media queries?
    back: >-
      Write the phone layout as the plain rules, then add `min-width` media queries for wider
      screens.
  - id: card-media-or-container
    concept: css.container-queries
    front: What does `@media` measure, and what does `@container` measure?
    back: >-
      `@media` measures the viewport. `@container` measures the nearest ancestor with a
      `container-type`.
  - id: card-clamp-value
    concept: css.fluid-sizing
    front: What do the three values in `clamp(1.5rem, 1rem + 2.5vw, 2.5rem)` mean?
    back: >-
      The smallest it may get, the size it would like to be, and the largest it may get.

