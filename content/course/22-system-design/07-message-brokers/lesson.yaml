deepDive: >-
  The Kafka output in this lesson is real: Kafka 4.3.1 in Docker, a topic with three
  partitions, and six keyed events from the console producer. The partition comes from a hash of
  the key modulo the partition count. So cart-7 went to 0, cart-3 and cart-9 shared 2, and
  partition 1 got nothing. Adding partitions later changes that
  mapping, so per-key order can break across the change. Pick a partition count with room to
  grow.


  Choosing a broker, roughly. SQS is a managed queue with almost nothing to run. Standard
  queues are at least once with best-effort order. FIFO queues keep order per message group
  and drop duplicate sends within five minutes. RabbitMQ is a flexible queue with
  routing between exchanges and queues, and it also offers streams, a log-like queue type.
  Kafka is a replicated log for high-volume events that several systems read and replay.
  Many teams run a queue for jobs and a log for events side by side.


  Exactly-once in Kafka exists, as idempotent producers plus transactions, but it covers
  reading from and writing to Kafka itself. The moment your consumer writes to a database or
  calls an API, you're back to at-least-once, and the idempotent consumer is what makes the
  effect happen once. The outbox pattern from the architecture module solves the mirror
  problem on the producer side.


  A chain of consumers, each doing one step of an order, is a process spread across
  systems. "Steps that span systems" shows how to run it as a saga with compensations.
  "Writing into someone else's system" applies the same idempotency to calls into another
  company's API.
