term: context file
aka: [instruction file, agent instructions file, AGENTS.md]
short: A file in a repository that a coding agent reads at the start of every session.
explain: |
  Every new agent session starts knowing nothing about your project. A short file at the
  root gives it what a new colleague would need: how to run the tests, the conventions,
  the rules, where things live.

  Write rules a diff or a command can check, like "run `pnpm test` before finishing". Vague
  advice like "write clean code" changes nothing. Keep it short, because every line is
  spent from the context window in every session.
analogy: 'The note you leave for a house-sitter: where the fuse box is, which door sticks, when the bins go out.'
usage: The agent keeps using npm; add the package manager to the context file.
related: [agent, context-engineering, harness, scope-contract]
level: 2
lessons: [aisys.coding-agents, aisys.agent-workbench]
