deepDive: >-
  No model was called. The gate and the challenge ran in Python 3.12 on made-up scores, and
  the thresholds are examples: choose yours with lesson 4's method.


  Order guardrails by cost. Cheap rules run first: the tool allow-list, a recipient count, a
  regular expression for card numbers. Fast classifiers come next. An expensive check, like
  a large model acting as a judge, runs only on what's left. Input screening can run in
  parallel with the main call and cancel it, so a check adds little latency.


  Grounding checks work best claim by claim. Split the draft into short factual statements,
  then ask of each: does a source support it? An answer is as weak as its weakest claim. When
  a claim fails, retry with the sources and a note, drop the claim, or say the documents
  don't answer that.


  Approval needs care too. If people approve hundreds of alerts a day, they stop reading.
  Keep the human band narrow with good thresholds, show the evidence, and measure how often
  approvers change or reject what they see. A rate near zero may mean rubber-stamping.
