deepDive: >-
  The output above is from Vitest 5 with its default reporter, trimmed. Add `--reporter
  verbose` to see a tick for every passing test. `npx vitest` keeps watching and reruns
  the tests whenever you save. `npx vitest run` runs them once, which is what CI wants.
  Tooling's `npm test` usually points at one of these.


  `it` is another name for `test`, and `describe` groups tests under a heading. Jest, the
  older runner, has the same `test` and `expect`, so most of what you learn here carries
  over.


  The challenges in this app run on a small harness with the same `test` and `expect`.
  In the challenge above your tests were functions, so we could run them again on broken
  copies of `total`. That's the idea behind mutation testing, two lessons from now.
