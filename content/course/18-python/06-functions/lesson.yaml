deepDive: >-
  The full signature grammar has two markers. Parameters after a bare `*` or after `*args`
  are keyword-only: `def send(to, *, retry=False)` refuses `send("a", True)`. Parameters
  before a `/` are positional-only, which lets a library rename them later without breaking
  anyone. The order is always positional-only, normal, `*args`, keyword-only, `**kwargs`.


  The same stars work at the call site: `total(*prices)` spreads a list into separate
  arguments, and `book(**options)` spreads a dictionary into named ones, much like
  JavaScript's spread syntax. Functions are values too, so you can pass one as an argument,
  which is how `sorted(key=...)` works in the next lesson.
