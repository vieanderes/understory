id: cloud.progressive-delivery
title: "Trunk-based development and progressive delivery"
objective: "Merge small changes to trunk behind feature flags, release to a growing share of users with canaries, and measure delivery with the DORA metrics."
level: advanced
minutes: 10
concepts: [cloud.trunk-based-development, cloud.feature-flags, cloud.canary-release, cloud.dora-metrics]
prerequisites: [cloud.releases, cloud.alerts-and-on-call]
opening:
  text: >-
    You'll ship unfinished work safely, and let real users judge a release before everyone
    gets it. Deploys become boring, which is exactly what you want.

steps:
  - type: prose
    id: name-feature-flags
    body: |-
      Shipping code and turning a feature on can be two separate moments.

      ```js
      const flags = { newCheckout: false };

      function checkout(cart) {
        if (flags.newCheckout) return newCheckout(cart);
        return oldCheckout(cart);
      }
      ```

      That's a **feature flag**: a switch read while the app runs. The new code is deployed,
      but nobody sees it until the flag is on. A bad feature turns off in seconds, with no
      deploy.

  - type: fill-blank
    id: fill-flag-check
    concept: cloud.feature-flags
    difficulty: 1
    language: js
    prompt: >-
      A new search is deployed but not ready. Show it only when its flag is on. Fill the gaps.
    template: |
      const flags = { newSearch: false };

      function search(query) {
        if ({{1}}.{{2}}) return newSearch(query);
        return {{3}}(query);
      }
    blanks:
      - key: '1'
        answer: flags
      - key: '2'
        answer: newSearch
      - key: '3'
        answer: oldSearch
    bank: [flags, newSearch, oldSearch, query, 'true']

  - type: prose
    id: name-trunk-based
    body: |-
      Flags make **trunk-based development** possible. Everyone merges small changes into
      one main branch, the trunk, at least once a day. Branches live for hours, not weeks.

      Unfinished work hides behind a flag, so main is always ready to release. Merges stay
      tiny, and nobody spends a Friday untangling a three-week branch.

  - type: prose
    id: name-sticky-rollout
    body: >-
      A flag can also go on for 10% of users. The obvious way is `Math.random() * 100 < 10`
      on each request. In our run, about 6,500 of 10,000 users saw both checkouts in ten
      page loads.


      So use a **hash** instead: a function that turns text into a number, always the same
      number for the same text. Hash the user id, and each user lands in the same bucket
      every time.

  - type: code-challenge
    id: write-bucket-for
    concept: cloud.feature-flags
    difficulty: 3
    language: ts
    editable: '13'
    prompt: >-
      Write `bucketFor(userId, flag, percent)`. It returns `true` when this user gets the
      feature.


      Hash the text `` `${flag}:${userId}` `` with the given `hash`, and take the remainder
      after dividing by 100. That's the user's bucket, from 0 to 99. They're in when the
      bucket is below `percent`.


      So a user in bucket 7 is in at 10%, and still in at 20%.
    hints:
      - Replace `Math.random()` with something that depends only on the flag and the user.
      - Put the flag name in the text, so each flag picks a different group of users.
      - Call `hash` on the flag and the user id joined by a colon, then take `% 100`.

  - type: prose
    id: name-canary
    body: >-
      A whole new version can roll out the same way. A **canary** release sends a small
      share of traffic, say 5%, to it first.


      Treat it as an experiment. Before launch, write down the **guardrails** that mustn't
      get worse: crash rate, error rate, p95 latency, checkouts completed. Once enough
      requests are in, a breach means rollback: all traffic returns to the old version.
      Otherwise the share grows.

  - type: ai-review
    id: review-canary-verdict
    concept: cloud.canary-release
    difficulty: 3
    language: ts
    request: >-
      Apply the guardrails we set before launch: errors at most 1 point above the old
      version, p95 at most 20% above. Decide whether the canary goes to everyone.
    flawClass: edge-case
    code: |
      type Stats = { requests: number; errors: number; p95Ms: number };

      export function canaryVerdict(old: Stats, canary: Stats) {
        const oldRate = old.errors / old.requests;
        const canaryRate = canary.errors / canary.requests;
        if (canaryRate > oldRate + 0.01) return 'rollback';
        if (canary.p95Ms > old.p95Ms * 1.2) return 'rollback';
        return 'promote';
      }
    prompt: >-
      Two minutes in, after 14 requests, the canary went to everyone. An hour later errors
      spiked. Tap the line at fault.
    lines: [8]
    reasons:
      - text: It promotes before the canary has enough requests
        correct: true
        feedback: >-
          Yes. Fourteen clean requests prove nothing. Return `'wait'` below a minimum count.
      - text: The error margin should be zero
        feedback: >-
          A zero margin rolls back on one unlucky request. A small allowance is normal.
      - text: p95 can't be compared across versions
        feedback: >-
          It can, and should. Same traffic, same measure: that's the whole point of a canary.
    verify:
      question: 'Which test would have caught this?'
      choices:
        - text: '14 requests with no errors, expecting `''wait''`'
          correct: true
          feedback: >-
            Yes. The edge is a tiny sample that looks perfect.
        - text: 'Many requests with twice the errors, expecting `''rollback''`'
          feedback: >-
            Good to have, and the broken version passes it. The flaw is promoting too early.
        - text: 'Identical stats for both, expecting `''promote''`'
          feedback: >-
            That passes at any request count, so it can't test the minimum.
    fix: |
      export function canaryVerdict(old: Stats, canary: Stats) {
        if (canary.requests < 1_000) return 'wait';   // not enough to judge yet
        const oldRate = old.errors / old.requests;
        const canaryRate = canary.errors / canary.requests;
        if (canaryRate > oldRate + 0.01) return 'rollback';
        if (canary.p95Ms > old.p95Ms * 1.2) return 'rollback';
        return 'promote';
      }

  - type: prose
    id: name-dora-metrics
    body: |-
      How do you know delivery is getting better? The **DORA metrics** measure speed and
      stability together. The four best known:

      - **Deployment frequency**: how often you ship to production.
      - **Change lead time**: from commit to running in production.
      - **Change fail rate**: the share of deploys that need an urgent fix.
      - **Recovery time**: how long a failed deploy takes to put right.

  - type: multiple-choice
    id: pick-dora-metric
    concept: cloud.dora-metrics
    difficulty: 2
    question: Deploys doubled this quarter, and one in four now needs an urgent fix. Which metric shows it?
    choices:
      - text: Change fail rate
        correct: true
        feedback: >-
          Yes. It's the share of deploys that broke something. Speed rose, safety fell.
      - text: Deployment frequency
        feedback: >-
          That's the part that improved. The fixes show up in a different number.
      - text: Change lead time
        feedback: >-
          Lead time is how fast a commit reaches production. It says nothing about breakage.
      - text: Recovery time
        feedback: >-
          That's how long each fix takes. How often deploys need one is a different metric.

  - type: explain-back
    id: explain-flags-and-trunk
    concept: cloud.trunk-based-development
    difficulty: 4
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer asks how the team can merge half-built features into main every day without
      breaking production. Explain the part feature flags play.
    rubric:
      - 'Everyone merges small changes into main at least daily, finished or not, so branches stay short.'
      - 'Main must stay releasable at all times, because any commit on it may be deployed.'
      - 'A flag keeps unfinished work switched off in production until it''s ready, so deploying isn''t releasing.'
    modelAnswer: >-
      In trunk-based development, everyone merges small changes into main at least once a
      day, finished or not. Yet main must always be safe to deploy. A feature flag squares
      that circle: the half-built code ships, but stays switched off until the feature is
      ready. Deploying the code and releasing the feature become two separate moments.
      Without flags, unfinished work would wait on long branches, and we'd be back to big,
      painful merges.

recap:
  - Separate deploying code from releasing it with feature flags, and merge small changes to trunk daily.
  - Roll a feature out to a steady share of users by hashing the user id, never with `Math.random`.
  - Run a canary as an experiment with guardrails written in advance, and track delivery with the DORA metrics.

recall:
  - id: card-deploy-release
    concept: cloud.feature-flags
    front: What does a feature flag separate?
    back: >-
      Deploying code from releasing a feature. The code can be live while the feature stays
      off.
  - id: card-sticky-rollout
    concept: cloud.feature-flags
    front: Why hash the user id for a percentage rollout instead of calling `Math.random`?
    back: >-
      The hash gives each user the same answer every time. Random flips them between old and
      new on each request.
  - id: card-canary
    concept: cloud.canary-release
    front: What decides whether a canary grows or rolls back?
    back: >-
      Guardrails written down before it starts, such as crash rate, errors, p95 latency and
      a product signal, checked once it has seen enough requests.
  - id: card-dora-four
    concept: cloud.dora-metrics
    front: Name the four best-known DORA metrics.
    back: >-
      Deployment frequency, change lead time, change fail rate and failed deployment recovery
      time. The current guide adds a fifth, deployment rework rate.
  - id: card-trunk-daily
    concept: cloud.trunk-based-development
    front: How long does a branch live in trunk-based development, and what hides unfinished work?
    back: >-
      Hours, merged at least daily. Unfinished work ships switched off behind a feature flag.

