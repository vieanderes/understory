summary: >-
  Two pointers are two indices that move through an array by a rule, so one pass does the
  work of a nested loop. The rule is what makes it correct: every move must rule out
  something for good. On sorted data that is possible because order tells you which way to
  move. If a pair's sum is too small, the left number is too small for every partner still in
  play, so it can go.


  There are two families. **Opposite pointers** start at both ends and move inwards: pair and
  triple sums on sorted input, palindromes, the widest container, merging from the outside
  in. **Read and write pointers** move the same way at different speeds: one reads every item,
  the other marks where the next kept item goes, which filters or deduplicates an array in
  place with O(1) extra space. A third variant, slow and fast pointers on a linked list, finds
  cycles and middles.


  The signals are "sorted", "in place", "without extra memory", "pair" or "triplet", and
  "reads the same both ways". If the input is unsorted and you need original indices, a hash
  map usually wins, unless sorting first is allowed and O(n log n) is fast enough.
remember:
  - Two pointers work when each move can rule out one candidate for good, which on sorted data follows from the order.
  - In a sorted pair sum, move the left pointer when the sum is too small and the right pointer when it is too big.
  - Use `left < right` when an item cannot pair with itself, and `left <= right` only when the middle item needs its own check.
  - A read pointer visits every item and a write pointer marks where the next kept item goes, and the write index is the count kept.
  - Two-pointer passes cost O(n) time and O(1) extra space, because each pointer only moves in one direction.
  - Three sum is sort once plus a pair search for each fixed item, O(n²), with duplicate skipping to keep triples unique.
  - If the data is unsorted and indices matter, use a hash map, or sort pairs of value and index first.
sections:
  - title: The two templates
    body: |-
      Both templates are loops with an invariant you can say in one sentence.

      ```js
      // Opposite ends. Invariant: any answer lies within [left, right].
      // O(n) time, O(1) space. Input must be sorted ascending.
      function pairWithSum(sorted, target) {
        let left = 0;
        let right = sorted.length - 1;
        while (left < right) {
          const sum = sorted[left] + sorted[right];
          if (sum === target) return [left, right];
          if (sum < target) left++;
          else right--;
        }
        return null;
      }

      // Read and write. Invariant: arr[0..write) holds the kept items, in order.
      // O(n) time, O(1) space. Returns the new length.
      function keepInPlace(arr, keep) {
        let write = 0;
        for (let read = 0; read < arr.length; read++) {
          if (keep(arr[read])) {
            arr[write] = arr[read];
            write++;
          }
        }
        arr.length = write; // drop the leftovers if the caller wants a shorter array
        return write;
      }

      console.log(pairWithSum([1, 3, 4, 6, 9], 10)); // [0, 4]
      console.log(pairWithSum([2, 5, 9], 10)); // null
      const readings = [3, -1, 4, -5, 9];
      console.log(keepInPlace(readings, (x) => x >= 0)); // 3
      console.log(readings); // [3, 4, 9]
      ```

      A variant of the second template moves every zero to the end while keeping the order
      of the rest: after the loop, fill `arr[write..]` with zeros instead of shortening. And
      the lesson's duplicate removal is the same template where `keep` compares with the last
      kept item, `arr[write - 1]`.
  - title: 'Three classics: three sum, the widest container, sorted squares'
    body: |-
      **Three sum.** Find every unique triple that sums to zero. Sort, fix each `i`, and run
      the pair search on the rest. Skipping equal neighbours keeps triples unique without a
      set. O(n²) time, O(1) extra space beyond the output and the sort.

      ```js
      function threeSum(nums) {
        const a = [...nums].sort((x, y) => x - y);
        const out = [];
        for (let i = 0; i < a.length - 2; i++) {
          if (i > 0 && a[i] === a[i - 1]) continue; // same first value, same triples
          let left = i + 1;
          let right = a.length - 1;
          while (left < right) {
            const sum = a[i] + a[left] + a[right];
            if (sum < 0) left++;
            else if (sum > 0) right--;
            else {
              out.push([a[i], a[left], a[right]]);
              left++;
              right--;
              while (left < right && a[left] === a[left - 1]) left++;
            }
          }
        }
        return out;
      }

      console.log(threeSum([-1, 0, 1, 2, -1, -4])); // [[-1, -1, 2], [-1, 0, 1]]
      console.log(threeSum([0, 0, 0, 0])); // [[0, 0, 0]]
      console.log(threeSum([1, 2])); // []
      ```

      **The widest container.** Given wall heights, pick two walls that hold the most water:
      width times the shorter height. Start at both ends and always move the shorter wall.
      Keeping it can never help, because any narrower pair with it is shorter or equal in
      height and narrower. O(n) time, O(1) space.

      ```js
      function maxWater(heights) {
        let left = 0;
        let right = heights.length - 1;
        let best = 0;
        while (left < right) {
          const area = (right - left) * Math.min(heights[left], heights[right]);
          best = Math.max(best, area);
          if (heights[left] < heights[right]) left++;
          else right--;
        }
        return best;
      }

      console.log(maxWater([1, 8, 6, 2, 5, 4, 8, 3, 7])); // 49
      console.log(maxWater([4])); // 0
      ```

      **Squares of a sorted array**, in sorted order. Negatives make the squares unsorted,
      but the largest square is always at one of the two ends. Fill the output from the back.
      O(n) time, O(n) for the output.

      ```js
      function sortedSquares(sorted) {
        const out = new Array(sorted.length);
        let left = 0;
        let right = sorted.length - 1;
        for (let k = sorted.length - 1; k >= 0; k--) {
          if (Math.abs(sorted[left]) > Math.abs(sorted[right])) {
            out[k] = sorted[left] * sorted[left];
            left++;
          } else {
            out[k] = sorted[right] * sorted[right];
            right--;
          }
        }
        return out;
      }

      console.log(sortedSquares([-4, -1, 0, 3, 10])); // [0, 1, 9, 16, 100]
      console.log(sortedSquares([])); // []
      ```
  - title: Why moving a pointer is safe
    body: |-
      Interviewers push on correctness, because a two-pointer solution looks like a guess
      until you justify it. The argument is always an **exclusion argument**: show that the
      item you drop cannot be part of any answer you have not yet checked.

      For the sorted pair sum, suppose `sorted[left] + sorted[right]` is too big. Every other
      index still in play, `left + 1` up to `right - 1`, holds a value at least
      `sorted[left]`. So `sorted[right]` plus any of them is at least as big, still too big.
      No answer uses `right`, and dropping it is safe. The mirror argument covers a sum that
      is too small.

      The same shape proves the container: the shorter wall's best possible partner is the
      one at the other end, already measured, so the shorter wall is finished.

      Edge cases to test for any two-pointer loop:

      - An empty array and a single item: the loop must not run, and must not read
        `arr[-1]`.
      - Pointers meeting: with `left <= right`, one item pairs with itself.
      - Duplicates: equal values at both pointers, and runs of equal values when triples must
        be unique.
      - All negative values, and the target at the extremes (the first and last item).
      - Unsorted input: the method gives wrong answers silently, so check the statement says
        sorted, or sort a copy first.
  - title: From brute force to two pointers, said aloud
    body: |-
      Two sum on a sorted array is a common opener, and the interviewer wants to hear why you
      do not reach for the map from the last lesson.

      1. "The brute force checks every pair: O(n²) time, O(1) space."
      2. "A hash map gives O(n) time, but costs O(n) memory, and it ignores that the input is
         sorted."
      3. "Sorted means I can reason about sums. With pointers at both ends: if the sum is too
         small, the left value is too small with every partner, so I drop it. Too big, I drop
         the right. Each step removes one item, so it's O(n) time and O(1) space."
      4. "I stop when the pointers meet, because one element can't be both numbers of the
         pair."

      If the array is unsorted, say the trade-off out loud: sorting costs O(n log n) and
      loses the original indices, so for indices a map is better. If the interviewer asks for
      all pairs rather than one, keep going after a match and move both pointers, taking care
      over runs of equal values. For k sum, the pattern nests: fix one value, reduce to k - 1
      sum, down to the two-pointer base case, O(n^(k-1)).
pitfalls:
  - "**Using `left <= right` for pairs.** When the pointers meet, one item is added to itself and a false pair appears. Use `left < right` whenever the two positions must differ."
  - "**Running it on unsorted data.** The exclusion argument needs order. On unsorted input the loop finishes and returns a wrong answer without complaint. Sort a copy first, or use a hash map."
  - "**Sorting the caller's array.** `nums.sort(...)` reorders the input, which breaks callers that relied on positions. Sort a copy with `[...nums].sort((a, b) => a - b)`."
  - "**Duplicate triples.** Three sum without skipping equal neighbours returns `[-1, 0, 1]` twice. Skip equal values for the fixed index and after each match, or dedupe with a set of string keys."
  - "**Deleting inside the loop.** `splice` in a loop shifts every later item, O(n) each time, so the whole pass becomes O(n²) and the indices shift under you. Use the read and write template instead."
  - "**Reading past the ends.** A skip loop such as `while (!isAlnum(s[left])) left++` can run off the array. Keep `left < right` in every inner loop condition."
interview:
  - question: When would you choose two pointers over a hash map for a pair sum?
    answer: >-
      When the input is already sorted, or memory is tight, I use two pointers. On sorted
      data they find a pair in O(n) time with O(1) extra space, while a map needs O(n)
      memory. If the data is unsorted, the map is usually better: it stays O(n) and keeps
      the original indices, whereas sorting first costs O(n log n) and loses positions unless
      I sort pairs of value and index. Pointers also extend cleanly to three sum and k sum,
      where sorting once and running the pair search per fixed element gives O(n²) for three
      sum. The trade-off is that pointers depend on order: an unsorted input produces wrong
      answers silently.
  - question: How do you know the two-pointer pair search doesn't skip the answer?
    answer: >-
      Each move drops a value that provably cannot be in any remaining pair. The invariant
      is that if an answer exists, both its indices lie between `left` and `right`. Suppose
      the current sum is too big. Every value between the pointers is at least
      `sorted[left]`, because the array is sorted, so `sorted[right]` plus any of them is also
      too big. So `right` belongs to no remaining answer, and moving it keeps the invariant.
      The too-small case is symmetric. Since every step removes one index and there are n,
      the loop ends in O(n) steps. The same exclusion reasoning is how I'd justify the
      container-with-most-water solution, where the shorter wall is the one that's finished.
  - question: Remove all occurrences of a value from an array in place and return the new length.
    answer: >-
      I use a read pointer and a write pointer in one pass, O(n) time and O(1) space. The
      read pointer visits every index. Whenever the item is not the value to remove, I copy
      it to `arr[write]` and increment `write`. At the end, the first `write` items are the
      kept ones in their original order, and `write` is the new length. It avoids `splice`
      inside a loop, which shifts the rest of the array each time and makes the pass O(n²).
      If order doesn't matter and removals are rare, a variant swaps the removed item with
      the last one and shrinks the length, which does fewer writes.
  - question: Walk me through three sum and its complexity.
    answer: >-
      Sort once, then for each index run the two-pointer pair search on the rest, for O(n²)
      total. After sorting, I fix `a[i]` and look for two values to its right summing to
      `-a[i]`, moving the pointers inwards by the usual rule. To keep triples unique I skip
      an `i` whose value equals the previous one, and after each match I move `left` past
      equal values. Sorting costs O(n log n), dominated by the O(n²) loops, and extra space
      is O(1) beyond the output, or O(n) if I copy the input to avoid mutating it. A hash-set
      version is also O(n²) but uses more memory and makes deduplication messier.
