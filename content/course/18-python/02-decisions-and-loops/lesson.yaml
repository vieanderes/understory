id: python.decisions-and-loops
title: Decisions, loops and numbers
objective: Branch with if, elif and else, spot the values Python treats as false, loop with for and range, and divide without surprises.
level: essential
minutes: 10
concepts: [python.conditionals, python.truthiness, python.range, python.division]
prerequisites: [python.first-steps]
opening:
  text: >-
    You'll make Python choose, repeat and divide, and meet the three places where your
    JavaScript habits will trip you up. Each one is a real bug in real scripts.

steps:
  - type: prose
    id: elif-and-or
    body: |-
      `if` works as in JavaScript, in Python's spelling. `elif` means "else if". Python runs
      the first block whose condition is true:

      ```python
      if temp > 25:
          label = "Hot"
      elif temp > 15:
          label = "Mild"
      else:
          label = "Cold"
      ```

      Combine conditions with the words `and`, `or` and `not`, where JavaScript uses `&&`,
      `||` and `!`. A one-line choice reads `"Hot" if temp > 25 else "Fine"`: Python's
      `? :`.

  - type: parsons
    id: arrange-confidence
    concept: python.conditionals
    difficulty: 2
    language: python
    prompt: >-
      A model says how sure it is, from 0 to 1. Arrange `level` so 0.8 or more gives `high`,
      0.5 or more gives `medium`, and anything else `low`.
    checkIndent: true
    blocks:
      - id: def
        code: 'def level(confidence):'
      - id: if-high
        code: 'if confidence >= 0.8:'
        indent: 1
      - id: high
        code: return "high"
        indent: 2
      - id: elif-medium
        code: 'elif confidence >= 0.5:'
        indent: 1
      - id: medium
        code: return "medium"
        indent: 2
      - id: else
        code: 'else:'
        indent: 1
      - id: low
        code: return "low"
        indent: 2
    distractors:
      - id: else-if
        code: 'else if confidence >= 0.5:'
        feedback: >-
          That's JavaScript's spelling. Python writes `elif`.
      - id: braces
        code: 'if (confidence >= 0.8) {'
        feedback: >-
          No braces in Python. A colon and an indent open the block.

  - type: prose
    id: truthiness
    body: |-
      Any value can go in a condition. These count as false: `False`, `None`, `0`, `""`, and
      empty containers such as `[]` and `{}`. Everything else counts as true.

      One catch coming from JavaScript: there, an empty array `[]` counts as true. In
      Python it counts as false.

      To ask "is it missing?", compare with `None` itself: `if reading is None:`. That's
      never true for `0`, unlike `if not reading:`.

  - type: predict-output
    id: predict-empty-list
    concept: python.truthiness
    difficulty: 2
    language: python
    code: |
      results = []
      if results:
          print("Found some")
      else:
          print("Nothing found")
    question: What does this show?
    choices:
      - text: '`Nothing found`'
        correct: true
        feedback: >-
          Yes. An empty list counts as false in Python.
      - text: '`Found some`'
        feedback: >-
          That's JavaScript's answer, where `[]` counts as true. Python treats every empty
          container as false.
      - text: It stops with an error
        feedback: >-
          Any value can go in a condition. Python decides whether it counts as true.

  - type: prose
    id: for-and-range
    body: |-
      A `for` loop walks the items of something, one at a time: `for letter in "cat":` runs
      three times. There's no index to manage.

      For counting, use **range**:

      ```python
      for i in range(1, 4):
          print(i)
      ```

      This shows `1`, `2`, `3`. `range(start, stop)` counts up to, but not including,
      `stop`. `while` works as in JavaScript, and `break` leaves a loop early.

  - type: bug-hunt
    id: hunt-range-stop
    concept: python.range
    difficulty: 2
    language: python
    code: |
      for day in range(1, 7):
          print(f"Day {day}")
    prompt: A week planner should show `Day 1` to `Day 7`. It stops at `Day 6`. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The stop value is never included
        correct: true
        feedback: >-
          Exactly. To reach 7, the stop has to be 8: `range(1, 8)`.
      - text: '`range` must start at 0'
        feedback: >-
          It can start anywhere. The start is included. It's the stop that's left out.
      - text: The f-string drops the last value
        feedback: >-
          The f-string shows each `day` it's given. The loop never hands it a 7.
    fix: |
      for day in range(1, 8):
          print(f"Day {day}")

  - type: prose
    id: division
    body: |-
      Python has two divisions. `/` always gives a **float**, a number with a decimal
      point, even when it divides exactly:

      ```python
      10 / 2    # 5.0
      7 // 2    # 3, rounded down
      7 % 2     # 1, the remainder
      2 ** 3    # 8, a power
      ```

      `//` is **floor division**: it rounds down to a whole number. Use it wherever a count
      must be whole, like pages, batches or halves.

  - type: bug-hunt
    id: hunt-float-range
    concept: python.division
    difficulty: 3
    language: python
    code: |
      steps = 9
      halfway = steps / 2
      for step in range(halfway):
          print(f"Step {step + 1}")
    prompt: "Line 3 fails: `'float' object cannot be interpreted as an integer`. Tap the line at fault."
    lines: [2]
    reasons:
      - text: '`/` makes a float, and `range` needs a whole number'
        correct: true
        feedback: >-
          Right. `steps // 2` gives `4`, a whole number.
      - text: Line 3, because that's where it failed
        feedback: >-
          Line 3 is where it crashed. The float was made a line earlier, by `/`.
      - text: '`range` needs a start value'
        feedback: >-
          The start is optional and defaults to 0. The trouble is the float it's given.
    fix: |
      steps = 9
      halfway = steps // 2
      for step in range(halfway):
          print(f"Step {step + 1}")

  - type: code-challenge
    id: write-batches
    concept: python.range
    difficulty: 3
    language: python
    starter: batches.starter.py
    solution: batches.solution.py
    tests: batches.tests.py
    prompt: >-
      A script sends prompts to a model in batches of at most `size`. Write
      `announce_batches(items, size)`, printing one line per batch.


      Example: `announce_batches(250, 100)` prints `Batch 1 of 3`, `Batch 2 of 3` and
      `Batch 3 of 3`. With 0 items it prints nothing.
    hints:
      - 'The division step: `//` rounds down, and `%` gives what is left over.'
      - 'Leftover prompts need one more batch. Check the remainder before you loop.'
      - 'After the first line, add `if items % size > 0:`. Then loop with `range(1, batches + 1)`.'

  - type: explain-back
    id: explain-zero-quantity
    concept: python.truthiness
    difficulty: 3
    prompt: >-
      A shop checks `if quantity:` to see whether a quantity was entered. Why does this
      go wrong when someone enters 0 on purpose?
    rubric:
      - '`if quantity:` tests whether the value counts as true, not whether it exists.'
      - Zero counts as false, the same as `None`.
      - So a real 0 is handled as if nothing was entered.
    modelAnswer: >-
      `if quantity:` doesn't ask "was something entered?". It asks whether the value counts
      as true, and 0 counts as false. So a real zero takes the same path as a missing value.
      `if quantity is None:` asks what you actually mean.

recap:
  - Choose a path with `if`, `elif` and `else`, joined with `and`, `or` and `not`.
  - Spot the values that count as false, like `0`, `""` and an empty list.
  - Loop with `for` and `range`, and use `//` wherever a count must be whole.
recall:
  - id: card-elif
    concept: python.conditionals
    front: With `if`, `elif` and `else`, how many blocks can run?
    back: >-
      At most one: the first whose condition is true, or `else` if none is.
  - id: card-falsy
    concept: python.truthiness
    front: Which values count as false in a Python `if`?
    back: >-
      `False`, `None`, zero, `""` and every empty container, such as `[]` and `{}`. Unlike
      JavaScript, an empty list is false.
  - id: card-for
    concept: python.for-loops
    front: What does a Python `for` loop walk through?
    back: >-
      The items of something iterable, such as the letters of a string or the numbers of a
      `range`.
  - id: card-range-stop
    concept: python.range
    front: Which numbers does `range(1, 4)` give?
    back: >-
      `1`, `2` and `3`. The stop value is never included.
  - id: card-floor-division
    concept: python.division
    front: What do `9 / 2` and `9 // 2` give?
    back: >-
      `4.5` and `4`. `/` always gives a float; `//` rounds down to a whole number.

references:
  - kind: docs
    title: More Control Flow Tools
    authors: Python Software Foundation
    venue: The Python Tutorial
    url: https://docs.python.org/3/tutorial/controlflow.html
    note: '`if`, `for`, `range`, `break` and `else` on loops, with examples.'
    primary: true
    verified: true
  - kind: docs
    title: Built-in Types
    authors: Python Software Foundation
    venue: The Python Standard Library
    url: https://docs.python.org/3/library/stdtypes.html
