term: DOM
aka: [Document Object Model, DOM tree]
short: The tree of objects a browser builds from a page's HTML, one per element, which scripts can change.
explain: |
  The browser doesn't draw your HTML file directly. It reads it, repairs any mistakes, and
  builds a tree: `html` at the root, `head` and `body` below it, and so on. The screen is
  drawn from that tree.

  JavaScript changes the tree, not the file. `document.querySelector` finds an element,
  `textContent` changes its text, and the screen follows. The Elements panel in the
  developer tools shows the tree as it really is, repairs included.
analogy: A family tree drawn from a pile of birth certificates. The certificates are the HTML, and the tree is what you look things up in.
example:
  language: js
  code: |
    const title = document.querySelector("h1");
    title.textContent = "Lemon cake";
    title.classList.add("highlight");
usage: View source still shows the old heading, because the script changed the DOM and not the file.
twin:
  term: accessibility-tree
  difference: The DOM holds every element, styled or hidden. The accessibility tree is built from it for assistive technology, and keeps only each element's role, name and state.
related: [html-element, accessibility-tree, semantic-html]
level: 1
lessons: [html.the-dom]
