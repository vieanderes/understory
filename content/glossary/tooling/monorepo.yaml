term: monorepo
aka: [mono-repo, monorepository]
short: One Git repository holding several apps and shared packages that change together.
explain: |
  Picture a web app and a mobile app sharing a component library, each in its own repository.
  One breaking change needs three pull requests, merged in the right order. Something always
  lands out of step.

  Keep them in one repository instead. The change and every fix it needs land in one
  commit and one review. Moving folders changes paths, not coupling, though. A package
  boundary is only real when its `exports` field and declared dependencies say so. The costs
  are slower installs and CI as it grows, and coarser access control.
analogy: One shared kitchen for a household instead of a kitchenette in every bedroom. Easier to cook together, harder to keep tidy.
example:
  language: text
  code: |
    apps/
      web/
      admin/
    packages/
      ui/
      prices/
    package.json
usage: The admin and the shop share half their code, so a monorepo would let one pull request update both.
twin:
  term: workspace
  difference: The monorepo is the single repository. A workspace is the package manager feature that links its packages together inside it.
related: [workspace, package-manager, coupling, trunk-based-development]
level: 2
lessons: [arch.monorepos]
