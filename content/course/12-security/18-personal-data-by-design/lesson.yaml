id: security.personal-data
title: Personal data by design
objective: Tell personal, pseudonymised and anonymised data apart, pick a lawful basis, and handle processors, retention, erasure requests and transfers.
level: advanced
minutes: 10
concepts: [security.pseudonymisation, security.lawful-basis, security.controller-and-processor, security.data-subject-requests]
prerequisites: [security.abuse-and-privacy]
opening:
  text: >-
    You'll build the parts of an app that data protection law reaches: what you keep, who
    sees it, and what you hand back. Lawyers interpret the law, but engineers decide what the
    code can actually do.

steps:
  - type: prose
    id: three-kinds-of-data
    body: >-
      Abuse, bots and privacy said personal data identifies a person. GDPR's wording is wider:
      any information relating to someone **identifiable**, directly or indirectly.


      Swap the name for a code, and keep the lookup key elsewhere. That's **pseudonymised**
      data, and it's still personal data. Only data nobody can reasonably link back to a
      person is **anonymised**, and that falls outside the law.

  - type: predict-output
    id: predict-hashed-export
    concept: security.pseudonymisation
    difficulty: 1
    language: js
    code: |
      // member: an HMAC of the member id. The key sits in the gym's secrets manager.
      const row = { member: "7f3c9a1e44b2", class: "spin", booked: "2026-09-14T18:00" };
    question: The gym's analytics team calls this export anonymous. Is it?
    choices:
      - text: No, it's pseudonymised, so still personal data
        correct: true
        feedback: >-
          Right. Whoever holds the key can link every row back to a member.
      - text: Yes, no name or email appears
        feedback: >-
          Most people pick this. But a stable code plus the key still links back to one person.
      - text: Yes, an HMAC can't be reversed
        feedback: >-
          Nobody needs to reverse it. With the key, you hash each member id and match.

  - type: prose
    id: lawful-basis
    body: >-
      Every purpose needs a **lawful basis** from Article 6. Contract covers what the service
      needs. Legal obligation covers what a law makes you keep. Consent covers optional
      extras, and can be withdrawn. Legitimate interests needs a balancing test.


      Article 9 lists **special categories**, such as health, religion and union membership.
      These also need a condition from Article 9(2), such as explicit consent.

  - type: fill-blank
    id: fill-processing-register
    concept: security.lawful-basis
    difficulty: 2
    language: ts
    prompt: >-
      A bakery writes its record of processing as code. Pick each lawful basis. Mark the payroll
      line special if it is.
    template: |
      const register = [
        { purpose: 'Deliver the order', data: ['address'], basis: '{{1}}' },
        { purpose: 'Customer photo in an advert', data: ['photo'], basis: '{{2}}' },
        { purpose: 'Keep sales records for tax', data: ['sales'], basis: '{{3}}' },
        { purpose: 'Block card fraud at checkout', data: ['ip', 'card'], basis: '{{4}}' },
        { purpose: 'Withhold church tax from pay', data: ['churchTax'],
          basis: 'legal-obligation', special: {{5}} },
      ];
    blanks:
      - key: '1'
        answer: contract
      - key: '2'
        answer: consent
      - key: '3'
        answer: legal-obligation
      - key: '4'
        answer: legitimate-interests
      - key: '5'
        answer: 'true'
    bank: [contract, consent, legal-obligation, legitimate-interests, vital-interests, 'true', 'false']

  - type: prose
    id: controller-and-processor
    body: >-
      The **controller** decides why and how data is processed. A **processor** handles it on
      the controller's behalf, under a **data processing agreement** (Article 28).


      Say your booking tool serves many gyms. Each gym is the controller, and you're its
      processor. A vendor you use, like a transcription service, is your **sub-processor**.
      Adding one needs the gyms' authorisation, so you tell them first and they can object.

  - type: multiple-choice
    id: pick-vendor-trains
    concept: security.controller-and-processor
    difficulty: 3
    question: Your transcription vendor wants to train its own model on the gyms' call recordings. What does that make it?
    choices:
      - text: A controller for that use
        correct: true
        feedback: >-
          Yes. Choosing its own purpose makes it a controller for it, outside your agreement.
      - text: Still a processor, it's the same data
        feedback: >-
          The data is the same, but the purpose is now the vendor's own. That's the controller's role.
      - text: A sub-processor of the gyms
        feedback: >-
          It already is one. Training for itself goes beyond any instruction the gyms gave.
      - text: Fine, as long as recordings are encrypted
        feedback: >-
          Encryption protects data in storage. It doesn't decide who may use it, or why.

  - type: prose
    id: data-subject-requests
    body: >-
      People can ask for a copy of their data (Article 15) or for erasure (Article 17). They
      can also ask for **portability**, a machine-readable export (Article 20). You answer
      within one month.


      Two limits matter in code. A copy mustn't adversely affect others, so other people's
      data stays out. And erasure gives way to a legal duty to keep, such as tax records.

  - type: ai-review
    id: review-export-other-members
    concept: security.data-subject-requests
    difficulty: 3
    language: js
    request: Build the 'Download my data' export for a chess club app.
    flawClass: data-exposure
    code: |
      async function exportMyData(memberId) {
        const profile = await sql`SELECT * FROM members WHERE id = ${memberId}`;
        const games = await sql`
          SELECT g.played_at, g.result, opp.*
          FROM games g JOIN members opp ON opp.id = g.opponent_id
          WHERE g.player_id = ${memberId}`;
        return { profile, games };
      }
    prompt: >-
      The tester exported a fresh account with no games, and the file looked right. Then a
      member opened their export and found every opponent's phone number. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`opp.*` copies each opponent''s whole member row'
        correct: true
        feedback: >-
          Yes. Their phone, email and birthday ride along. Select only the opponent's display name.
      - text: '`SELECT *` on the profile exposes too much'
        feedback: >-
          That row is the requester's own data. Article 15 gives them all of it.
      - text: The export needs the member's password first
        feedback: >-
          Checking who asks matters, but this leak hits every honest member too.
    fix: |
      SELECT g.played_at, g.result, opp.display_name AS opponent
    verify:
      question: Which test would have caught this?
      choices:
        - text: Export a member with games, check for opponents' emails
          correct: true
          feedback: >-
            Only an export with opponents can show their data leaking in.
        - text: Snapshot the export of a fresh test account
          feedback: >-
            A fresh account has no games, so there's no opponent to leak. That's what the tester did.
        - text: Check the export is valid JSON
          feedback: >-
            A leaking file is perfectly valid JSON. The shape was never the problem.

  - type: code-challenge
    id: write-retention-sweep
    concept: security.data-subject-requests
    difficulty: 4
    language: ts
    prompt: >-
      Write `sweep(records, policy, erasureRequests, today)` for a gym. It returns
      `{ id, action }` per record, in order, with action `keep`, `delete` or `anonymise`.


      A record with `legalHold` is kept. A record at least `keepDays` old gets the rule's
      `afterwards`. A record whose member asked for erasure gets `afterwards` early, unless
      the rule is `requiredByLaw`. Everything else is kept. A kind with no rule throws.
    hints:
      - Look up the rule first, then check the legal hold, then the age, then the erasure list.
      - Age in days is the gap between the two `Date.parse` values, divided by `DAY_MS`. Exactly `keepDays` counts as expired.
      - 'Turn the erasure list into a set once: `const erased = new Set(erasureRequests);`'

  - type: explain-back
    id: explain-new-vendor
    concept: security.controller-and-processor
    difficulty: 4
    audience: non-technical
    kind: explain
    prompt: >-
      The founder wants the new AI transcription vendor live tomorrow for every gym. Explain
      what has to happen before it's switched on.
    rubric:
      - The vendor would process the gyms' member data for us, so it needs a data processing agreement.
      - The gyms are the controllers, so they must hear about the new sub-processor first and can object.
      - If the vendor works from outside the EU, the transfer needs a legal mechanism too.
    modelAnswer: >-
      The recordings belong to the gyms' members, and the gyms decide how they're used. We
      only handle them on the gyms' behalf. A new vendor touching them needs a contract that
      says it follows our instructions and deletes on request. The gyms must be told before
      it starts, and they can object. If the vendor is outside the EU, sending data there
      needs its own legal footing.

recap:
  - Treat pseudonymised data as personal data, and claim anonymity only when nobody can link back.
  - Give each purpose a lawful basis, and spot special categories such as health or religion.
  - Answer access and erasure requests without leaking others' data or deleting what law requires.

recall:
  - id: card-pseudonymised
    concept: security.pseudonymisation
    front: Why is pseudonymised data still personal data?
    back: >-
      Someone holding the extra information, such as the key, can link it back to the person.
      Only data nobody can reasonably link back is anonymous.
  - id: card-special-categories
    concept: security.lawful-basis
    front: Name three special categories of data, and what they need beyond an Article 6 basis.
    back: >-
      Health, religion and trade union membership, among others. They also need a condition
      from Article 9(2), such as explicit consent.
  - id: card-sub-processor
    concept: security.controller-and-processor
    front: What must a processor do before adding a sub-processor?
    back: >-
      Get the controller's written authorisation. Under a general one, it tells the controller
      of the change first, so the controller can object.
  - id: card-erasure-limit
    concept: security.data-subject-requests
    front: When can a record survive an erasure request?
    back: >-
      When a legal obligation requires keeping it, such as sales records for tax. Delete the
      rest, and delete that record once its period ends.

references:
  - kind: spec
    title: Regulation (EU) 2016/679 (General Data Protection Regulation)
    authors: European Parliament and Council of the European Union
    year: 2016
    venue: Official Journal of the European Union, L 119
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    note: The official text. Articles 4, 6, 9, 12, 15, 17, 20 and 28, and Recital 26.
    primary: true
    verified: false
  - kind: spec
    title: Art. 28 GDPR, Processor
    venue: gdpr-info.eu
    url: https://gdpr-info.eu/art-28-gdpr/
    note: What a data processing agreement must contain, and the rules for sub-processors.
    primary: true
    verified: false
  - kind: spec
    title: Art. 15 GDPR, Right of access by the data subject
    venue: gdpr-info.eu
    url: https://gdpr-info.eu/art-15-gdpr/
    note: What a copy must include, and why it must not adversely affect others.
    verified: false
  - kind: docs
    title: Guidelines 07/2020 on the concepts of controller and processor in the GDPR
    authors: European Data Protection Board
    year: 2021
    venue: EDPB
    note: How to tell a controller from a processor in real arrangements.
    verified: false

deepDive: >-
  Recital 26 sets the test for anonymity: account for all the means reasonably likely to be
  used to identify someone, such as singling them out. A 2025 Court of Justice ruling,
  EDPS v SRB, added a twist. Pseudonymised data can stay personal for the controller, yet not
  be personal for a recipient who has no realistic way to re-identify it.


  Religion turns up in unexpected places. A payroll system that withholds church tax holds an
  employee's religious affiliation, so it's special category data, even though tax law
  requires it.


  Residency and transfers are separate questions. Chapter V governs sending data outside the
  EEA: an adequacy decision, or safeguards such as standard contractual clauses. EDPB guidance
  treats data made available to another organisation abroad, by remote access too, as a
  transfer. Your own employee abroad is not. So "the servers are in Frankfurt" doesn't settle it.


  Portability is narrower than access. It covers data the person provided, processed by
  consent or contract and by automated means. Access covers everything you hold about them.
