summary: >-
  This mock copies the shape of a real timed online test: three tasks, one ninety-minute
  clock, scored by hidden tests you never see. Correctness tests use small inputs and
  corner cases; performance tests use inputs at the maximum size and time out anything
  slower than the intended complexity. The example in the statement does not count.


  The three tasks are reskinned classics from the public training syllabus: lazy updates
  (the scoreboard is "max counters"), prefix sums with a hash map (counting subarrays with
  a given sum), and a monotonic stack (the largest rectangle in a histogram). Recognising
  the pattern behind the story is most of the work, and the assumptions block usually
  tells you which pattern: N up to 100,000 rules out anything quadratic.


  These notes walk through each task the way a strong candidate would: the brute force and
  why it fails, the observation that removes the slow part, the complete solution, a trace
  of the example, and the traps the hidden tests use. They finish with a stress test that
  checks all three fast solutions against their slow versions.
remember:
  - Read all three tasks and their assumptions first; N up to 100,000 means O(N) or O(N log N), since O(N²) is ten billion steps.
  - A correct brute force banks the correctness tests, so submit one when the fast idea is late; code that does not compile scores zero.
  - Lazy updates replace "touch everything" with a recorded floor applied when an item is next touched and once at the end.
  - The sum of a subarray is a difference of two prefix sums, so counting subarrays with sum K is counting earlier prefixes equal to the current prefix minus K.
  - A sliding window needs values that never shrink the sum as it widens; negative values break it, and prefix sums with a map do not care.
  - A monotonic stack finds each element's nearest smaller neighbour on both sides in one pass, O(N) because each index is pushed and popped once.
  - In JavaScript, check whether results can pass 2^53; here the largest area, 10^14, and the largest count, about 5 billion, are both exact.
  - Stress test a fast solution against the brute force on thousands of small random inputs before submitting.
sections:
  - title: Task 1, the scoreboard, and lazy updates
    body: |-
      The brute force applies each catch-up round to all N teams. With N and M both
      100,000 and every other operation a catch-up, that is about five billion writes. It
      passes every correctness test and times out on performance.

      The observation: a catch-up does not need to change anyone now. It only sets a
      **floor**, the highest score so far, below which no score may be read again. So
      record the floor, and apply it lazily: when a team scores, first lift it to the
      floor, then add one. At the end, lift every team still below the floor.

      ```ts
      export function scoreboard(N: number, A: number[]): number[] {
        const counters = new Array<number>(N).fill(0);
        let floor = 0;
        let max = 0;
        for (const operation of A) {
          if (operation === N + 1) {
            floor = max;
            continue;
          }
          const i = operation - 1;
          counters[i] = Math.max(counters[i]!, floor) + 1;
          if (counters[i]! > max) max = counters[i]!;
        }
        return counters.map((value) => Math.max(value, floor));
      }
      ```

      The example, `N = 5`, `A = [3, 4, 4, 6, 1, 4, 4]`: after the first three operations
      the array is `[0, 0, 1, 2, 0]` and `max` is 2. The catch-up sets `floor = 2` and
      changes nothing else. Team 1 scores: lifted from 0 to 2, then 3. Team 4 scores twice:
      4. The final pass lifts teams 2, 3 and 5 to the floor: `[3, 2, 2, 4, 2]`.

      Each operation is O(1) and the final pass is O(N), so the whole task is O(N + M) time
      and O(N) space. The trap in writing it: `max` must track the real maximum including
      lifted values, which it does because the lift happens before the comparison. Hidden
      tests: a catch-up first (floor stays 0), two catch-ups in a row, a catch-up last, and
      teams nobody touches after a catch-up.
  - title: Task 2, balanced periods, and prefix sums with a map
    body: |-
      The brute force tries every start and extends the end with a running sum, O(N²):
      five billion additions at N = 100,000. The tempting "fast" answer, a sliding window,
      is wrong here, because the changes can be negative. A window's sum no longer grows as
      it widens, so there is no rule for when to move the left edge.

      The observation: with `S` the running total and `S = 0` before day 0, the total of
      days P to Q is `S(after Q) - S(before P)`. It equals K exactly when an earlier
      running total equals `S - K`. So walk once, and at each day add how many earlier
      running totals equal the current one minus K.

      ```ts
      const LIMIT = 1_000_000_000;

      export function countPeriods(A: number[], K: number): number {
        const seen = new Map<number, number>([[0, 1]]);
        let prefix = 0;
        let count = 0;
        for (const change of A) {
          prefix += change;
          count += seen.get(prefix - K) ?? 0;
          if (count > LIMIT) return -1;
          seen.set(prefix, (seen.get(prefix) ?? 0) + 1);
        }
        return count;
      }
      ```

      The trace for `A = [3, -1, 2, 1, -2]`, `K = 2`:

      ```text
      day 0: prefix 3, look for 1, found 0, count 0
      day 1: prefix 2, look for 0, found 1, count 1    period (0, 1)
      day 2: prefix 4, look for 2, found 1, count 2    period (2, 2)
      day 3: prefix 5, look for 3, found 1, count 3    period (1, 3)
      day 4: prefix 3, look for 1, found 0, count 3
      ```

      Three details matter. The seed `0 → 1` counts periods that start on day 0. The
      lookup happens before the current prefix is added, or K = 0 would count the empty
      period. And the cap: 100,000 zeros with K = 0 give 5,000,050,000 periods, so the
      function must return `-1`. Checking inside the loop returns early; the count is
      still exact in a JavaScript number, since it stays far below 2^53. O(N) time and
      O(N) space on average.
  - title: Task 3, the widest banner, and the monotonic stack
    body: |-
      Every banner is as tall as the lowest building it covers. So fix each building as
      the lowest one: its banner stretches left and right until the first strictly lower
      building on each side. The answer is the best of those N rectangles. Finding both
      edges naively is O(N) per building, O(N²) in total.

      A stack of indices with rising heights finds both edges in one pass. When the
      current building is not taller than the one on top of the stack, the top has found
      its right edge (the current index), and the index beneath it on the stack is its
      left edge. Pop, measure, repeat. A sentinel height of 0 after the last building
      flushes the stack.

      ```ts
      export function largestBanner(H: number[]): number {
        const stack: number[] = [];
        let best = 0;
        for (let i = 0; i <= H.length; i++) {
          const height = i === H.length ? 0 : H[i]!;
          while (stack.length > 0 && H[stack[stack.length - 1]!]! >= height) {
            const top = stack.pop()!;
            const left = stack.length === 0 ? -1 : stack[stack.length - 1]!;
            best = Math.max(best, H[top]! * (i - left - 1));
          }
          stack.push(i);
        }
        return best;
      }
      ```

      The trace for `H = [2, 1, 5, 6, 2, 3]`:

      ```text
      i=1: pop 0 (h=2), width 1, area 2
      i=4: pop 3 (h=6), width 1, area 6
      i=4: pop 2 (h=5), width 2, area 10
      i=6: pop 5 (h=3), width 1, area 3
      i=6: pop 4 (h=2), width 4, area 8
      i=6: pop 1 (h=1), width 6, area 6
      best 10
      ```

      Why `>=` and not `>`: with equal heights, popping the earlier one early gives it a
      too-short width, but the last of the equal run is popped later with the full width,
      so the maximum is still found, and the stack stays strictly rising. Each index is
      pushed once and popped once, so the loop is O(N) amortised despite the inner
      `while`. Areas reach 10^9 × 10^5 = 10^14, below 2^53, so plain numbers are exact.
      Traps: all zeros (answer 0), all equal (full width), strictly rising and strictly
      falling (the stack's two extremes).
  - title: Stress testing the three solutions
    body: |-
      Once a fast version passes the examples, compare it with the brute force on many
      small random inputs. Small, so the brute force is instant and a failing input is
      short enough to trace by hand. This harness covers all three tasks:

      ```ts
      // scoreboardSlow, countPeriodsSlow and largestBannerSlow are the brute-force versions.
      const int = (lo: number, hi: number) => lo + Math.floor(Math.random() * (hi - lo + 1));
      const list = (n: number, lo: number, hi: number) => Array.from({ length: n }, () => int(lo, hi));

      function stress(name: string, make: () => unknown[], fast: (...a: any[]) => unknown, slow: (...a: any[]) => unknown, runs = 2000) {
        for (let i = 0; i < runs; i++) {
          const args = make();
          const a = JSON.stringify(fast(...args));
          const b = JSON.stringify(slow(...args));
          if (a !== b) {
            console.log(`${name} differs on`, JSON.stringify(args), { fast: a, slow: b });
            return;
          }
        }
        console.log(`${name}: ${runs} random cases agree`);
      }

      stress('scoreboard', () => { const N = int(1, 5); return [N, list(int(1, 10), 1, N + 1)]; }, scoreboard, scoreboardSlow);
      stress('countPeriods', () => [list(int(1, 10), -3, 3), int(-4, 4)], countPeriods, countPeriodsSlow);
      stress('largestBanner', () => [list(int(1, 8), 0, 6)], largestBanner, largestBannerSlow);
      ```

      All three agreed on 2,000 cases each. Choose generator ranges that make collisions
      likely: few teams so catch-ups matter, values from -3 to 3 so prefix sums repeat,
      heights from 0 to 6 so equal heights appear. Wide random ranges rarely produce the
      duplicates where bugs live. Delete the harness, or keep it out of the submitted
      function, before you submit.
  - title: Running the ninety minutes
    body: |-
      A plan that fits this mock:

      - 0 to 8 minutes: read all three statements and assumptions. Name the pattern for
        each in a comment: lazy floor, prefix map, monotonic stack.
      - 8 to 25: the scoreboard, the warm-up. Write the brute force in two minutes if the
        floor idea is not immediate, then replace it.
      - 25 to 50: balanced periods. Test K = 0, all zeros, negative values, and the cap.
      - 50 to 80: the banner. If the stack does not come together by minute 65, submit the
        O(N²) brute force, which scores the correctness tests, and keep working on the
        stack in the time left.
      - 80 to 90: run every task against your edge cases once more and submit. Never leave
        a task that does not compile.

      The order is a suggestion, not a rule: start with whichever task you recognise
      fastest, because banked points reduce pressure on the hard one.
pitfalls:
  - >-
    **Resetting every counter on a catch-up.** It is correct and O(N × M), so the
    performance tests time out. Record a floor and apply it lazily.
  - >-
    **A sliding window with negative values.** The window's sum does not grow as it widens,
    so moving the left edge skips valid periods. Use prefix sums with a count map.
  - >-
    **Adding the current prefix before looking it up.** With K = 0 every day then counts an
    empty period. Look up first, then record.
  - >-
    **Forgetting the seed `0 → 1`.** Periods starting on day 0 are missed. Seed the map
    before the loop.
  - >-
    **No sentinel in the stack.** Buildings still on the stack at the end are never
    measured, and a rising row returns 0. Process one extra height of 0 after the last.
  - >-
    **Using `Math.max(...H)` or recursion on big inputs.** Spreading 100,000 arguments or
    recursing that deep can overflow the stack. Use loops.
  - >-
    **Testing only the example.** It rarely contains the corner the hidden tests use. Test
    one element, all equal, all zeros, extremes and a maximum-size input.
interview:
  - question: Why is the stack solution for the largest rectangle O(N) when it has a loop inside a loop?
    answer: >-
      Because the total work of the inner loop is bounded by the number of pushes. Each
      index is pushed exactly once, and each pop removes one index that is never pushed
      again, so across the whole run there are at most N pops. The outer loop runs N plus
      one times, and the inner `while` runs N times in total, not per iteration, so the
      whole thing is O(N) amortised. It is the same argument as for a dynamic array's
      doubling. The space is O(N) in the worst case, a strictly rising row, where every
      index waits on the stack until the sentinel flushes it.
  - question: Count the subarrays that sum to K. Why not a sliding window?
    answer: >-
      A sliding window works only when widening the window never decreases its sum, which
      needs all values non-negative. With negative values there is no rule for when to
      shrink, so the window skips valid answers. The general solution uses prefix sums: the
      sum from P to Q is `S[Q + 1] - S[P]`, so at each position I count earlier prefixes
      equal to the current one minus K, using a map from prefix value to count, seeded with
      zero seen once. That is one pass, O(N) time and O(N) space. If the values were known
      to be positive, the window would use O(1) space, which is the trade-off.
  - question: You have ninety minutes and three tasks. How do you allocate the time?
    answer: >-
      I spend the first five to eight minutes reading all three, including the assumptions,
      and naming the likely pattern for each. Then I start with the task I recognise best,
      because banked points reduce pressure. For each task I set a checkpoint: if the fast
      idea has not come by then, I submit a correct brute force, which scores the
      correctness tests and often some performance tests, and move on. I test each against
      the corners the hidden tests use before leaving it. I keep the last ten minutes to
      rerun everything and make sure every task compiles, since a compile error scores zero.
  - question: What is a lazy update, and where else does the idea appear?
    answer: >-
      Instead of applying a change to many items now, you record it and apply it to each
      item when it is next read, plus once at the end if needed. In the scoreboard, a
      catch-up round records a floor, and each team is lifted to it only when it scores or
      in the final pass, which turns O(N) per catch-up into O(1). The same idea is behind
      lazy propagation in segment trees, lazy deletion in heaps, where cancelled items are
      skipped when they reach the top, and copy-on-write. The trade-off is that every read
      must remember to apply the pending change, and one forgotten code path is a bug.
terms:
  - term: N up to 100,000
    say: Big, but a nested loop will do.
    means: O(N²) is ten billion steps, far past any time limit. It calls for O(N) or O(N log N).
  - term: Max counters
    say: Set every counter to the maximum in a loop.
    means: That loop makes the task O(N × M). Record the floor and apply it lazily, when a counter is
      next touched and once at the end, for O(N + M).
  - term: Counting subarrays with sum K
    say: Use a sliding window.
    means: A window breaks once values can be negative. Count earlier prefix sums equal to the current
      prefix minus K in a map, which works for any values in O(N).
  - term: Largest rectangle in a histogram
    say: Try every pair of bars.
    means: Each bar's widest rectangle stretches to its nearest smaller bar on each side. A monotonic
      stack finds those in one O(N) pass.
  - term: Exact integers
    say: Numbers overflow at about two billion.
    means: That's a 32-bit integer limit. JavaScript numbers are exact for integers up to 2^53 - 1,
      about 9 × 10^15, so an area of 10^14 is still exact.
