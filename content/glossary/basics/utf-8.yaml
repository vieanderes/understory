term: UTF-8
aka: [utf8, character encoding, text encoding]
short: The common way of turning each character's number into bytes, using one to four bytes per character.
explain: |
  Every character has a number. To save or send text, those numbers have to become bytes.
  This scheme does it with a variable length.

  Plain English letters take one byte each, the same as old ASCII. Accented letters take
  two, most other scripts three, and emoji four. Nearly every web page, file and API uses
  it.

  The traps are length and mixing. A string's length in characters isn't its size in
  bytes. And reading bytes as the wrong encoding turns "café" into "cafÃ©".
analogy: Shipping parcels in boxes of different sizes. Small items go in one box, bulky ones need up to four, and the label says how many belong together.
example:
  language: js
  code: |
    const bytes = new TextEncoder().encode('café');
    bytes.length;  // 5: c, a, f take 1 byte each, é takes 2
    'café'.length; // 4 characters
usage: The column limit is 255 bytes, not characters, so names in UTF-8 with accents get cut short.
twin:
  term: unicode
  difference: UTF-8 is how character numbers are written as bytes. Unicode is the catalogue that gives each character its number in the first place.
related: [unicode, string, http-header]
level: 2
lessons: [cs.data-representation]
