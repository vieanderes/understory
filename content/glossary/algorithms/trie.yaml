term: trie
aka: [prefix tree, tries, digital tree]
short: A branching structure for words where each step down adds one letter, so shared beginnings are stored once.
explain: |
  Autocomplete asks: which words start with "cat"? Checking every word in a list is slow
  when the list is long and the questions keep coming.

  Here, the root has a branch per first letter, each of those a branch per second letter,
  and so on. "cat", "car" and "cart" share the path c, a. Finding everything under a
  prefix costs the prefix's length, then the matches, never the whole list.

  It spends memory on all those nodes. For one or two prefix questions, a sorted list
  and binary search is often enough.
analogy: A phone's contact search. Type "J", then "Ja", and the list narrows at each letter down one branch.
example:
  language: js
  code: |
    const root = {};
    function insert(word) {
      let node = root;
      for (const ch of word) node = node[ch] ??= {};
      node.end = true; // a whole word ends here
    }
    function hasPrefix(prefix) {
      let node = root;
      for (const ch of prefix) if (!(node = node[ch])) return false;
      return true;
    }
usage: With thousands of prefix scans, a trie over the field names beats sorting the keys every time.
related: [tree, hash-map, binary-search]
level: 3
lessons: [interview.levelled-one]
