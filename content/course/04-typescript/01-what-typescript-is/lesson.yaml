id: ts.what-typescript-is
title: What TypeScript is
objective: Write type annotations, read a type error, and know that types are gone when the code runs.
level: essential
minutes: 10
concepts: [ts.type-checker, ts.annotations, ts.type-erasure]
prerequisites: [js.coercion]
opening:
  text: >-
    You'll write your first TypeScript and watch it catch a bug before the code ever runs.
    It's the JavaScript you already know, plus short notes that a checker reads first.

steps:
  - type: predict-output
    id: predict-text-total
    concept: ts.type-checker
    difficulty: 1
    language: js
    code: |
      function addDelivery(total) {
        return total + 3.5;
      }
      console.log(addDelivery("12"));
    question: A form field hands over the total as text. What gets logged?
    choices:
      - text: '`"123.5"`'
        correct: true
        feedback: >-
          Right. With text on one side, `+` joins instead of adding.
      - text: '`15.5`'
        feedback: >-
          That's what you meant. But `"12"` is text, and `+` with text joins the two.
      - text: A `TypeError`
        feedback: >-
          JavaScript doesn't complain here. It quietly joins, which is why this bug ships.

  - type: prose
    id: what-typescript-is
    body: |-
      Plain JavaScript only finds that bug when the code runs. Sometimes that's on a
      customer's phone.

      **TypeScript** is JavaScript with notes saying what kind of value each thing holds:

      ```ts
      function addDelivery(total: number): number {
        return total + 3.5;
      }
      ```

      `: number` is a **type annotation**. The first says `total` must be a number. The one
      after the brackets says the result is a number too.

  - type: prose
    id: reading-a-type-error
    body: |-
      Before any code runs, a program called the **type checker** reads it. It compares each
      value with its annotation. A mismatch is a **type error**:

      ```text
      addDelivery("12");
      Argument of type 'string' is not assignable to parameter of type 'number'.
      ```

      Read it as: you passed text where a number was promised. In an editor such as VS Code,
      the checker runs as you type and underlines the mistake in red.

  - type: bug-hunt
    id: hunt-misspelt-property
    concept: ts.type-checker
    difficulty: 1
    language: ts
    code: |
      function nightlyPrice(total: number, nights: number): number {
        return total / nights;
      }
      const booking = { guests: 2, nights: 3, total: 270 };
      console.log(nightlyPrice(booking.total, booking.nigths));
    prompt: >-
      Plain JavaScript would log `NaN` here. Tap the line the checker underlines.
    lines: [5]
    reasons:
      - text: '`booking` has no property called `nigths`'
        correct: true
        feedback: >-
          Yes. It even asks: "Did you mean 'nights'?"
      - text: '`booking` needs an annotation first'
        feedback: >-
          The checker reads the shape from the object itself. It knows `booking` has `nights`.
      - text: Dividing might give a fraction
        feedback: >-
          A fraction is still a `number`, so line 2 is fine. The typo is what's wrong.
    fix: |
      console.log(nightlyPrice(booking.total, booking.nights));

  - type: prose
    id: types-are-erased
    body: |-
      Browsers only run JavaScript, and so does **Node**, the program that runs JavaScript
      outside a browser. So TypeScript is **compiled**: a tool turns it into plain JavaScript.
      The checker has its say first. Then every annotation is deleted:

      ```js
      function addDelivery(total) {
        return total + 3.5;
      }
      ```

      That's **type erasure**. While the code runs, no types exist at all.

  - type: multiple-choice
    id: pick-what-runs
    concept: ts.type-erasure
    difficulty: 2
    language: ts
    code: |
      function addDelivery(total: number): number {
        return total + 3.5;
      }
    question: This compiled cleanly. An old script on the page calls `addDelivery("12")`. What happens?
    choices:
      - text: It returns `"123.5"`
        correct: true
        feedback: >-
          Right. The annotation was erased, so nothing checks that call.
      - text: It throws a `TypeError`
        feedback: >-
          Nothing is left to throw one. The running code has no idea `total` should be a number.
      - text: It returns `15.5`
        feedback: >-
          Types never convert values. The text arrives as text, and `+` joins it.
      - text: The checker reports an error
        feedback: >-
          The checker only reads the TypeScript files you give it. It never sees that old script.

  - type: fill-blank
    id: fill-first-annotations
    concept: ts.annotations
    difficulty: 2
    language: ts
    prompt: >-
      Annotate both functions. `splitBill` divides a total between people. `thanks` builds a
      message, and `tipped` is true or false.
    template: |
      function splitBill(total: number, people: {{1}}): {{2}} {
        return total / people;
      }

      function thanks(name: {{3}}, tipped: {{4}}): string {
        if (tipped) {
          return `Thanks, ${name}`;
        }
        return `Hi, ${name}`;
      }
    blanks:
      - key: '1'
        answer: number
      - key: '2'
        answer: number
      - key: '3'
        answer: string
      - key: '4'
        answer: boolean
    bank: [number, number, string, boolean, text, int]

  - type: code-challenge
    id: fix-checkout-total
    concept: ts.annotations
    difficulty: 2
    language: ts
    expectStarterTypeError: true
    prompt: >-
      The checker has underlined `fieldValue` in red. Tap or hover on it to read the error.
      Fix the call, so `checkoutTotal("12")` returns `15.5` and the underline goes away.
    hints:
      - '`fieldValue` is a `string`. `addDelivery` wants a `number`.'
      - You met the fix in the JavaScript chapter. `Number("12")` gives `12`.
      - 'Change the call to `addDelivery(Number(fieldValue))`.'

  - type: explain-back
    id: explain-what-the-checker-promises
    concept: ts.type-erasure
    difficulty: 2
    audience: teammate
    kind: explain
    prompt: >-
      A teammate says: "TypeScript checks my types, so bad values can never reach my
      functions." What's right about that, and what isn't?
    rubric:
      - The checker reads your code before it runs and catches values that don't match their annotations.
      - Compiling erases every type, so nothing checks values while the program runs.
      - Values the checker never saw, like old scripts or data from a server, can still be wrong.
    modelAnswer: >-
      The first half is right. The checker reads the code before it runs. A call that passes
      text where a number is promised gets flagged. But compiling deletes every type, so
      nothing checks anything while the program runs. A value the checker never saw, from an
      old script or a server, can still be the wrong kind.

recap:
  - 'Write `: number`, `: string` and `: boolean` annotations on a function.'
  - Read a type error and find the line it points at.
  - Explain why types can't protect you while the code runs.

recall:
  - id: card-when-checker-runs
    concept: ts.type-checker
    front: When does the type checker look at your code?
    back: >-
      Before it runs: in your editor as you type, and when the project is built. It never
      runs alongside the program.
  - id: card-annotation-syntax
    concept: ts.annotations
    front: How do you say `price` must be a number and the function returns text?
    back: >-
      `function label(price: number): string`. The annotation after the brackets is the
      return type.
  - id: card-erased-function
    concept: ts.type-erasure
    front: 'What''s left of `function area(width: number): number` after compiling?'
    back: >-
      `function area(width)`. Every annotation is deleted, so the running code has no types.
  - id: card-read-assignable
    concept: ts.type-checker
    front: "What does `Argument of type 'string' is not assignable to parameter of type 'number'` mean?"
    back: >-
      You passed text to a parameter whose annotation promises a number.

