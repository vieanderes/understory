term: feedback loop
aka: [fast feedback loop, verification loop, inner loop]
short: The cycle of making a change, running a check and reading the result before the next change.
explain: |
  The quicker you learn a change is wrong, the cheaper it is to fix. A type checker answers
  in seconds, unit tests in a minute, a code review in a day, a customer in a month.

  For coding agents it matters even more. An agent that can run tests, types and a linter
  itself fixes most of its own mistakes before you look. Put the fastest checks first, and
  make every check give a clear pass or fail.
analogy: Tasting the soup while you cook, not after the guests have eaten.
usage: The agent needs a faster feedback loop; give it a command that runs only the tests for the changed files.
related: [continuous-integration, linter, unit-test, verification-gate]
level: 1
lessons: [aisys.coding-agents, career.how-you-work]
