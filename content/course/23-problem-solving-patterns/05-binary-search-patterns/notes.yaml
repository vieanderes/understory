summary: >-
  Binary search is not really about sorted arrays. It finds the point where a yes-or-no
  check flips, provided it flips exactly once: all no, then all yes. A sorted array is one
  case, where the check is "is `a[i]` at least x?". A build history is another, where the
  check is "is this build broken?". Each check halves the range, so a billion candidates need
  about 30 checks.


  Two shapes cover most interview questions. **Boundary search** finds the first index where
  the check turns true: lower bound, upper bound, insert position, first bad version, the
  minimum of a rotated array. **Searching the answer** applies the same loop to a range of
  possible answers rather than indices, when checking one guess is cheap and a bigger guess
  always works if a smaller one does: the smallest ship capacity, the lowest eating speed, the
  largest minimum gap.


  The signals are "sorted", "first" or "last" position, "smallest value that works", "largest
  value that still works", an answer range far too big to scan, and an expected complexity
  with a log in it. The one requirement to check aloud is **monotonicity**: once the check
  says yes, it says yes for everything beyond.
remember:
  - Binary search finds where a yes-or-no check flips, and works only if it flips exactly once.
  - The first-true template is `while (lo < hi)`, `mid = Math.floor((lo + hi) / 2)`, `hi = mid` on yes, `lo = mid + 1` on no, then return `lo`.
  - Start `hi` at a value that surely answers yes, or one past the end, so the range always contains the answer.
  - Lower bound finds the first item at least x, upper bound the first item greater than x, and their difference counts copies of x.
  - Search the answer when checking one guess takes one pass and a bigger guess always works, for O(n log range).
  - For the last true value, round `mid` up with `Math.floor((lo + hi + 1) / 2)`, or the loop can stop moving.
  - The exact-match loop uses `lo <= hi` and `hi = mid - 1`, and a boundary loop never excludes `mid` on a yes.
sections:
  - title: The template, and the four searches it covers
    body: |-
      One function, `firstTrue`, covers every boundary search. Lower bound, upper bound and
      the insert position are one-line wrappers around it.

      ```js
      // Smallest i in [lo, hi) where check(i) is true, or hi if none.
      // check must be false, false, ..., true, true. O(log(hi - lo)) calls.
      function firstTrue(lo, hi, check) {
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (check(mid)) hi = mid;
          else lo = mid + 1;
        }
        return lo;
      }

      const lowerBound = (a, x) => firstTrue(0, a.length, (i) => a[i] >= x); // first >= x
      const upperBound = (a, x) => firstTrue(0, a.length, (i) => a[i] > x); // first > x
      const countOf = (a, x) => upperBound(a, x) - lowerBound(a, x);
      const contains = (a, x) => {
        const i = lowerBound(a, x);
        return i < a.length && a[i] === x;
      };

      const prices = [2, 4, 4, 4, 7, 9];
      console.log(lowerBound(prices, 4)); // 1
      console.log(upperBound(prices, 4)); // 4
      console.log(countOf(prices, 4)); // 3
      console.log(lowerBound(prices, 10)); // 6
      console.log(contains(prices, 5)); // false
      console.log(lowerBound([], 3)); // 0
      ```

      Using a half-open range `[lo, hi)` with `hi = a.length` means "not found" has an
      answer: the length. The loop never reads `a[hi]`, because `mid` is always below `hi`.

      The last item at most x is `upperBound(a, x) - 1`, and the last item below x is
      `lowerBound(a, x) - 1`. Both return -1 when nothing qualifies. Deriving every variant
      from one template is safer under pressure than remembering four loops.

      Python has these built in, and they match the JavaScript above:

      ```python
      from bisect import bisect_left, bisect_right

      prices = [2, 4, 4, 4, 7, 9]
      print(bisect_left(prices, 4))  # 1
      print(bisect_right(prices, 4))  # 4
      print(bisect_right(prices, 4) - bisect_left(prices, 4))  # 3
      ```
  - title: Rotated arrays, and the largest minimum gap
    body: |-
      **Minimum of a rotated sorted array.** `[4, 5, 6, 7, 0, 1, 2]` was sorted, then
      rotated. The check "is `a[i]` at most the last item?" is false on the left block and
      true on the right block, so the minimum is the first true. Values must be distinct.
      O(log n) time, O(1) space. **Searching a rotated array** reuses it: find the rotation
      point, then search the one sorted half that can hold the target.

      ```js
      function rotatedMinIndex(a) {
        const last = a[a.length - 1];
        let lo = 0;
        let hi = a.length - 1;
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (a[mid] <= last) hi = mid;
          else lo = mid + 1;
        }
        return lo;
      }

      console.log(rotatedMinIndex([4, 5, 6, 7, 0, 1, 2])); // 4
      console.log(rotatedMinIndex([1, 2, 3])); // 0
      console.log(rotatedMinIndex([9])); // 0

      // Search: find the rotation point, pick the sorted half that can hold the target,
      // and run a lower bound there. Two binary searches, still O(log n).
      function searchRotated(a, target) {
        if (a.length === 0) return -1;
        const pivot = rotatedMinIndex(a);
        const inRight = target <= a[a.length - 1];
        let lo = inRight ? pivot : 0;
        let hi = inRight ? a.length : pivot;
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (a[mid] >= target) hi = mid;
          else lo = mid + 1;
        }
        return lo < a.length && a[lo] === target ? lo : -1;
      }

      console.log(searchRotated([4, 5, 6, 7, 0, 1, 2], 0)); // 4
      console.log(searchRotated([4, 5, 6, 7, 0, 1, 2], 5)); // 1
      console.log(searchRotated([4, 5, 6, 7, 0, 1, 2], 3)); // -1
      console.log(searchRotated([], 3)); // -1
      ```

      **Largest minimum gap.** Place k chargers at given positions along a car park so the
      closest two are as far apart as possible. If a gap g is achievable, every smaller gap
      is too, so the check runs yes, yes, no, no. We want the **last true**, so round `mid`
      up. Checking a guess is a greedy pass: place a charger whenever the gap allows. Sorting
      costs O(n log n) and the search O(n log range).

      ```js
      function largestMinGap(positions, k) {
        const p = [...positions].sort((a, b) => a - b);
        const fits = (gap) => {
          let placed = 1;
          let lastAt = p[0];
          for (let i = 1; i < p.length; i++) {
            if (p[i] - lastAt >= gap) {
              placed++;
              lastAt = p[i];
            }
          }
          return placed >= k;
        };
        let lo = 0; // a gap of 0 always fits
        let hi = p[p.length - 1] - p[0];
        while (lo < hi) {
          const mid = Math.floor((lo + hi + 1) / 2); // round up for last true
          if (fits(mid)) lo = mid;
          else hi = mid - 1;
        }
        return lo;
      }

      console.log(largestMinGap([1, 2, 8, 4, 9], 3)); // 3
      console.log(largestMinGap([5, 1], 2)); // 4
      ```

      This assumes `2 <= k <= positions.length`. Say that assumption aloud, or guard it.
  - title: Proving the loop ends and returns the right index
    body: |-
      Off-by-one bugs in binary search are famous, so interviewers ask you to justify the
      loop. Two facts do it.

      **The invariant.** The first true index always lies in `[lo, hi]`. It holds at the
      start because `hi` is chosen to answer yes, or to mean "none". On a yes at `mid`, the
      first true is `mid` or earlier, so `hi = mid` keeps it. On a no, everything up to `mid`
      is false by monotonicity, so `lo = mid + 1` keeps it. When `lo === hi`, the range has
      one index, and that is the answer.

      **Progress.** With `mid = Math.floor((lo + hi) / 2)` and `lo < hi`, `mid` is at least
      `lo` and strictly below `hi`. So `hi = mid` shrinks the range, and so does
      `lo = mid + 1`. The loop always ends.

      That second fact is why the last-true loop must round up. With `lo = mid` on a yes and
      `mid` rounded down, the range `[3, 4]` gives `mid = 3` forever. Rounding up makes `mid`
      strictly above `lo`.

      The checks worth running on any binary search:

      - An empty range and a single item.
      - The answer at the first index, at the last index, and "none".
      - Duplicates of the target, which separate lower bound from upper bound.
      - For search on the answer: a guess range whose bottom is truly feasible or infeasible,
        such as the heaviest parcel, not 1.

      In JavaScript `(lo + hi) / 2` cannot overflow for array indices, since numbers are
      exact up to 2^53. The `lo + (hi - lo) / 2` form matters in languages with 32-bit
      integers, and it does no harm here.
  - title: Explaining search on the answer aloud
    body: |-
      Search on the answer surprises interviewers when you spot it, so narrate the reasoning
      rather than only the code. For "the lowest speed to eat all piles within h hours", say:

      1. "Brute force: try speeds 1, 2, 3 and so on until one fits. Each try is O(n), and the
         speed can be as large as the biggest pile, up to 10⁹. Far too slow."
      2. "But if speed s is enough, any faster speed is too. So 'is s enough?' is false then
         true over the range. That's a boundary."
      3. "The range is 1 to the largest pile, since at that speed every pile takes one hour.
         About 30 guesses, each an O(n) pass: O(n log max)."

      ```js
      function minEatingSpeed(piles, hours) {
        let hi = 0;
        for (const p of piles) hi = Math.max(hi, p);
        const enough = (speed) => {
          let needed = 0;
          for (const p of piles) needed += Math.ceil(p / speed);
          return needed <= hours;
        };
        let lo = 1;
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (enough(mid)) hi = mid;
          else lo = mid + 1;
        }
        return lo;
      }

      console.log(minEatingSpeed([3, 6, 7, 11], 8)); // 4
      console.log(minEatingSpeed([30, 11, 23, 4, 20], 5)); // 30
      ```

      The pattern names itself once you say the three parts: a check that takes one pass, a
      proof that the check is monotonic, and a range with a feasible top. If you can't prove
      monotonicity, binary search is the wrong tool, and dynamic programming or a greedy pass
      is likelier.
pitfalls:
  - "**Mixing two templates.** Writing `while (lo <= hi)` with `hi = mid` loops forever when `lo === hi` and the check says yes. Pick one template and keep all three lines consistent."
  - "**A range that excludes the answer.** Starting the ship-capacity search at 1 lets the check accept capacities below the heaviest parcel. The bottom must be the smallest candidate that makes sense, and `hi` must surely work."
  - "**Rounding down in a last-true search.** With `lo = mid` on a yes, `mid` must round up, or `lo` and `hi` one apart never move."
  - "**A check that is not monotonic.** Binary search on a condition that flips back and forth returns an arbitrary boundary with no error. State why a bigger guess always works before coding."
  - "**Rotated arrays with duplicates.** `[1, 1, 1, 0, 1]` breaks the `a[mid] <= last` test, because equal values say nothing about the side. The worst case becomes O(n), and interviewers expect you to say so."
  - "**Spreading a huge array.** `Math.max(...weights)` throws a `RangeError` for large arrays in Node 24. Find the maximum and the total in one loop."
  - "**Floating ceilings.** `Math.ceil(p / speed)` is exact for integers in safe range, but mixing floats elsewhere in a check can shift the boundary. Keep the check in integers where you can."
interview:
  - question: How do you decide a problem can be solved with binary search when there's no sorted array?
    answer: >-
      I look for a yes-or-no check over a range that flips exactly once. For example, in
      "the smallest ship capacity that delivers everything within d days", if capacity c
      works then every larger capacity works, so the check runs no, no, yes, yes across
      capacities. The range is ordered even though no array is. Then I need two more things:
      a cheap way to test one guess, here a single O(n) greedy pass, and a range whose top
      surely works, here the total weight. That gives O(n log total). If I can't argue that a
      bigger guess always works, binary search would return a wrong boundary silently, so
      I'd look at greedy or dynamic programming instead.
  - question: Explain the difference between lower bound and upper bound, and where you'd use each.
    answer: >-
      Lower bound is the first index whose value is at least x. Upper bound is the first
      index whose value is greater than x. On `[2, 4, 4, 4, 7]` with x = 4 they return 1 and
      4, so their difference counts the copies of x. Lower bound is also the insert position
      that keeps equal items after the new one, and the membership test is "lower bound is in
      range and holds x". Upper bound minus one gives the last item at most x, which answers
      "the latest event at or before this time". Both are the same first-true loop with a
      different check, `>=` or `>`, which is why I keep one template.
  - question: Your binary search sometimes loops forever. How do you debug it?
    answer: >-
      I check that every branch shrinks the range, which almost always means `mid` is rounded
      the wrong way for the update. With `hi = mid` and `lo = mid + 1`, `mid` must round down
      so it's strictly below `hi`. With `lo = mid` and `hi = mid - 1`, it must round up so
      it's strictly above `lo`. The other common cause is mixing templates: `while (lo <= hi)`
      with `hi = mid` stalls once `lo` equals `hi`. I'd trace a two-element range by hand,
      since every stall shows up there, and assert the invariant that the answer stays inside
      `[lo, hi]`. In languages with 32-bit integers I'd also check for overflow in `lo + hi`.
  - question: What's the complexity of searching the answer, and when is it not worth it?
    answer: >-
      It's O(C × log R), where C is the cost of one check and R is the size of the answer
      range. For ship capacity, C is O(n) and R is the total weight, so about 30 to 50 passes
      even for totals near 10¹⁵. It's not worth it when the answer range is tiny, where a
      linear scan is clearer, or when a direct formula or greedy pass gives the optimum in
      one go. It also fails when the check is not monotonic, for example "can we split into
      exactly k groups", which may flip back. Then I'd rephrase it as "at most k groups",
      which usually is monotonic.
terms:
  - term: Binary search
    say: A way to search a sorted array.
    means: A way to find where a yes-or-no check flips, halving the range each step. It needs the check
      to flip exactly once, and a sorted array is one case of that.
  - term: Monotonic predicate
    say: The data has to be sorted.
    means: A check that is false for every candidate up to some point and true for every one after it.
      That single flip is all binary search needs.
  - term: Lower bound
    say: The index of the element.
    means: The first index whose value is at least x, or the length if there is none. It is also the
      insert position that keeps the array sorted.
  - term: Upper bound
    say: The last index of the element.
    means: The first index whose value is *greater* than x, one past the last copy. Upper bound minus
      lower bound counts the copies of x.
  - term: Search on the answer
    say: Binary search over the input.
    means: Binary search over a range of possible answers, when one guess can be checked in a pass and a
      bigger guess works whenever a smaller one does. It costs O(n log range).
