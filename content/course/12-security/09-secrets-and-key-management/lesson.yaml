id: security.secrets
title: Secrets and key management
objective: "Keep secrets out of the repository and the browser bundle, give each key only the access it needs, and rotate one after a leak."
level: essential
minutes: 10
concepts: [security.secret-storage, security.key-rotation, security.least-privilege]
prerequisites: [tooling.configuration-and-environment, next.loading-data, security.encryption-and-tls]
opening:
  text: >-
    You'll keep your keys out of the places they leak from. And you'll know what to do the
    day one leaks anyway, because one will.

steps:
  - type: prose
    id: what-a-secret-is
    body: >-
      A **secret** is any value that grants access, such as a database password. An **API key**
      is one too: a password your code sends to call a service, like a payments provider.


      Secrets reach your server through **environment variables**, which you met in the tooling
      chapter. Or a **secrets manager** hands them over at start-up. The code names a secret. It
      never contains one.

  - type: bug-hunt
    id: find-bundled-secret
    concept: security.secret-storage
    difficulty: 1
    language: js
    code: |
      // config.js, used by server and browser code
      export const config = {
        siteName: process.env.NEXT_PUBLIC_SITE_NAME,
        paymentsKey: process.env.NEXT_PUBLIC_PAYMENTS_SECRET_KEY,
        databaseUrl: process.env.DATABASE_URL,
      };
    prompt: >-
      Remember the Next.js chapter: a `NEXT_PUBLIC_` name is copied into the **bundle**, the
      JavaScript every visitor downloads. Tap the line that leaks a secret.
    lines: [4]
    reasons:
      - text: The payments secret is copied into the bundle
        correct: true
        feedback: >-
          Right. Any visitor can read it in their browser. Only server code should see it.
      - text: The site name shouldn't be public
        feedback: >-
          A site name is on every page anyway. `NEXT_PUBLIC_` is fine for values that aren't secret.
      - text: '`DATABASE_URL` reaches the browser'
        feedback: >-
          Without the prefix, Next.js keeps it on the server. In the browser it's `undefined`.
    fix: |
      // config.js, used by server and browser code
      export const config = {
        siteName: process.env.NEXT_PUBLIC_SITE_NAME,
        paymentsKey: process.env.PAYMENTS_SECRET_KEY, // read only in server code
        databaseUrl: process.env.DATABASE_URL,
      };

  - type: prose
    id: copies-persist
    body: >-
      Secrets leak through copies. A key pushed to a repository sits in every clone and every
      old commit. A key printed with `console.log` lands in log files that get shipped and
      searched. A key in the bundle is on every visitor's disk.


      Deleting the line doesn't undo any of that. Once a copy exists, you can't know who has it.

  - type: prose
    id: rotate-after-leak
    body: >-
      So a leaked key must be **rotated**: replaced with a new one, with the old one switched
      off at the provider. Then the copies are worthless.


      Most providers let two keys work at once, so nothing breaks midway. Create the new key,
      deploy it, check it works, then revoke the old one. If the key is already public, revoke
      it first and accept a short outage.

  - type: parsons
    id: order-key-rotation
    concept: security.key-rotation
    difficulty: 2
    language: text
    prompt: >-
      Your email API key sat in a log file that an old contractor account could read. Rotate
      it without breaking emails. Put the steps in order.
    blocks:
      - id: create
        code: Create a new key in the email provider's dashboard
      - id: deploy
        code: Put the new key in the environment and deploy
      - id: verify
        code: Check that emails still send with the new key
      - id: revoke
        code: Revoke the old key at the provider
      - id: audit
        code: Read the provider's log for what the old key sent
    distractors:
      - id: force-push
        code: Delete the log file, and you're done
        feedback: >-
          The key still works for anyone who copied it. Revoking it is what protects you.

  - type: ai-review
    id: review-deleted-key
    concept: security.key-rotation
    difficulty: 3
    language: bash
    request: I pushed our email API key to GitHub by mistake. Clean it up.
    flawClass: security
    code: |
      # Stop tracking .env, but keep the file on disk
      git rm --cached .env
      echo ".env" >> .gitignore
      git commit -m "Stop tracking .env"
      git push
      # Done: the key is safe again.
    prompt: >-
      An assistant ran these commands. `.env` is gone from the repository, and it won't be
      added again. Tap the line that's wrong.
    lines: [6]
    reasons:
      - text: The leaked key still works and must be rotated
        correct: true
        feedback: >-
          Yes. It's in the old commit and every copy. Revoking it makes it useless.
      - text: '`.gitignore` should list `.env.local` instead'
        feedback: >-
          Ignoring `.env` is right. It stops the next leak, not this one.
      - text: '`git rm --cached` deletes the file from disk'
        feedback: >-
          `--cached` only stops Git tracking it. The file stays, which is what you want here.
    verify:
      question: How would you prove the cleanup worked?
      choices:
        - text: A call with the old key is refused
          correct: true
          feedback: >-
            Yes. A revoked key failing proves every copy is dead.
        - text: '`.env` is gone from the latest commit'
          feedback: >-
            It is, but the key is still in the history and in any copy taken. That check sees
            neither.
        - text: '`git status` shows a clean tree'
          feedback: >-
            A clean tree means nothing is waiting to commit. The pushed key still works.
    fix: |
      # Stop tracking .env, but keep the file on disk
      git rm --cached .env
      echo ".env" >> .gitignore
      git commit -m "Stop tracking .env"
      git push
      # Then rotate: new key deployed, old key revoked at the provider.

  - type: prose
    id: least-privilege
    body: >-
      Give each key only what its one job needs. That's **least privilege**. Most providers let
      you set a key's **scope**, the list of things it may do.


      A key that only reads products can't refund payments. The test server's key can't touch
      real customers. When a key leaks, and one eventually will, its scope is the size of the
      damage.

  - type: multiple-choice
    id: pick-report-key
    concept: security.least-privilege
    difficulty: 2
    question: A nightly job exports yesterday's orders to a spreadsheet. Which key should it get?
    choices:
      - text: A key that can only read orders
        correct: true
        feedback: >-
          Right. It only reads, so a leak can't change or refund anything.
      - text: The same key the website uses
        feedback: >-
          Then one leak exposes everything the site can do. Separate jobs, separate keys.
      - text: An admin key, so it never fails
        feedback: >-
          It never fails, and neither would an attacker holding it. Scope it to reading.

  - type: code-challenge
    id: write-public-config
    concept: security.secret-storage
    difficulty: 3
    language: ts
    editable: '6-11'
    prompt: >-
      `publicConfig(env)` picks the settings that are safe to send to the browser. Right now it
      copies every name without `SECRET` in it, so `DATABASE_URL` slips through. Return only
      the names listed in `PUBLIC_NAMES`, and skip any that aren't set.
    hints:
      - A list of bad words is never complete. Start from the list of good names instead.
      - Loop over `PUBLIC_NAMES`, not over `env`.
      - '`if (env[name] !== undefined) out[name] = env[name];`'

  - type: explain-back
    id: explain-rotate-anyway
    concept: security.key-rotation
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      An API key sat in a public repository for ten minutes, then was deleted. Why rotate it
      anyway, and how does least privilege change how bad it was?
    rubric:
      - Copies persist in the history and wherever it was copied, so deleting it doesn't make it secret again.
      - Rotating replaces the key and revokes the old one, so every copy stops working.
      - A narrowly scoped key could only do its one job, which limits what anyone could do with it.
    modelAnswer: >-
      Ten minutes is plenty for a bot that scans public repositories. The key is still in the
      old commit and in any copy made meanwhile, so deleting the line changes nothing. Rotating
      does: a new key goes live and the old one is revoked, so every copy is dead. Least
      privilege decides how bad those ten minutes were. A read-only key could only read.

recap:
  - Keep secrets in the environment or a secrets manager, never in the repo, bundle or logs.
  - Rotate a leaked key at once, because deleting it doesn't make it secret again.
  - Scope each key to its one job, so a leak does as little damage as possible.

recall:
  - id: card-where-secrets
    concept: security.secret-storage
    front: Where should a secret live, and where must it never?
    back: >-
      In the environment or a secrets manager. Never in the repository, the browser bundle or
      the logs.
  - id: card-rotate-after-leak
    concept: security.key-rotation
    front: A key was pushed and then deleted. What still has to happen?
    back: >-
      Rotate it: deploy a new key and revoke the old one at the provider. Copies of the old key
      then stop working.
  - id: card-least-privilege
    concept: security.least-privilege
    front: What does least privilege limit when a key leaks?
    back: >-
      The damage. A key scoped to one job can only do that job in the wrong hands.
  - id: card-allow-list-config
    concept: security.secret-storage
    front: Why build browser settings from a list of safe names, not by filtering out secret-looking ones?
    back: >-
      A new secret with an unexpected name gets through a filter. A list of safe names leaves it
      out by default.

references:
  - kind: docs
    title: Secrets Management Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    note: Keeping secrets out of code, injecting them at runtime, and rotating them.
    primary: true
    verified: true
  - kind: docs
    title: Removing sensitive data from a repository
    authors: GitHub
    venue: GitHub Docs
    url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository
    note: Revoke or rotate a leaked secret first; rewriting history comes second, if at all.
    primary: true
    verified: true
  - kind: paper
    title: The protection of information in computer systems
    authors: J. H. Saltzer and M. D. Schroeder
    year: 1975
    venue: Proceedings of the IEEE, 63(9)
    url: https://doi.org/10.1109/PROC.1975.9939
    note: Least privilege stated as a design principle.
    verified: true

deepDive: >-
  Git history keeps everything by default. Tools such as `git filter-repo` can rewrite it, but
  every clone, fork and cached copy still holds the old commits. That's why rotation comes
  first, and rewriting history is optional tidying.


  Rotating a key that signs things, such as session tokens, needs an overlap. Keep accepting
  the old key until everything it signed has expired, while signing new tokens with the new
  one. Otherwise everyone signed in is logged out at once.


  A secrets manager adds what plain environment variables lack: a log of who read each
  secret, automatic rotation, and separate values per environment. Secret scanners, such as
  the one GitHub runs on pushes, catch many known key formats soon after they leak.
