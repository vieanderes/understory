term: em
aka:
  - em unit
short: A length unit that's a multiple of the current element's own font size.
explain: |
  A button's padding should look right whether its label is small or large. Tie the
  padding to the label's text size and it scales with it.

  `1em` equals the element's computed font size. That's handy for padding and icon sizes.
  The trap is font sizes: set `font-size: 1.2em` on nested lists and each level grows by
  another 20 percent, because each one measures from its parent.
analogy: A recipe that says "a pinch for every egg". Double the eggs and the pinches double too.
example:
  language: css
  code: |
    .btn { font-size: 1.125rem; padding: 0.5em 1em; }
    /* padding scales with the button's own text */

    li { font-size: 1.2em; }
    /* nested lists: 1.2, 1.44, 1.73 ... */
usage: The padding is in em, so the small button gets small padding without another rule.
twin:
  term: rem
  difference: An em measures from the element's own font size and compounds when nested. A rem measures from the root, so it stays the same wherever you use it.
related:
  - rem
level: 2
lessons:
  - css.responsive-design
  - css.typography
