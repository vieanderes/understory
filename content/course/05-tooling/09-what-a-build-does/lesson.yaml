id: tooling.what-a-build-does
title: What a build does
objective: Tell a dev server from a production build, follow source through transpiling and bundling, and read a source map.
level: essential
minutes: 10
concepts: [tooling.transpiling, tooling.bundling, tooling.tree-shaking, tooling.source-maps]
prerequisites: [tooling.node-and-npm, js.modules]
opening:
  text: >-
    You'll know what happens to your code between saving a file and a visitor running it.
    And when a crash points at line 1 of a squashed file, you'll find the real line.

steps:
  - type: prose
    id: why-a-build
    body: |-
      Web projects run two ways. While you work, a **dev server** hands your files to the
      browser as you wrote them. It reloads the page on every save:

      ```text
      $ npm run dev
        VITE v8.3.0  ready in 405 ms
        ➜  Local:   http://localhost:5173/
      ```

      Before you publish, a **build** turns your files into small, fast ones for visitors:

      ```text
      $ npm run build
      dist/index.html                0.11 kB │ gzip: 0.12 kB
      dist/assets/index-Co9_76t9.js  0.75 kB │ gzip: 0.43 kB
      ```

      Next.js has the same pair: `next dev` and `next build`.

  - type: prose
    id: what-transpiling-is
    body: |-
      A build's first job is **transpiling**: rewriting code into JavaScript the target can
      run. For TypeScript, that means deleting the types. The build tool esbuild does it here:

      ```text
      $ esbuild price.ts
      export function total(items) {
        return items.reduce((sum, item) => sum + item.price, 0);
      }
      ```

      The `type Item` line and every `: number` are gone. The logic is untouched.

  - type: predict-output
    id: predict-types-stripped
    concept: tooling.transpiling
    difficulty: 1
    language: bash
    code: |
      $ cat stock.ts
      const count: number = "three";
      console.log(count);
      $ esbuild stock.ts
    question: The type says number, but the value is text. What happens?
    choices:
      - text: It prints the code without the type
        correct: true
        feedback: >-
          Right. esbuild only deletes types. It never checks them.
      - text: It stops with a type error
        feedback: >-
          Most people expect that. Checking is a separate step: `tsc --noEmit` would catch it.
      - text: It prints the file unchanged
        feedback: >-
          The `: number` has to go, since JavaScript can't read it. So the output differs.

  - type: prose
    id: bundling-and-shaking
    body: >-
      Next, **bundling**. The bundler starts at your main file, follows each `import`, and
      joins what it reaches into one file. One download instead of a chain of them.


      On the way it leaves out functions nothing imports. That's **tree-shaking**.


      A dynamic `import()` goes the other way. Its module gets a file of its own, a
      **chunk**, downloaded only when that line runs. That's **code splitting**.

  - type: predict-output
    id: predict-bundle-contents
    concept: tooling.bundling
    difficulty: 2
    language: js
    code: |
      // convert.js
      export function toFahrenheit(celsius) {
        return celsius * 9 / 5 + 32;
      }
      export function toKelvin(celsius) {
        return celsius + 273.15;
      }

      // main.js
      import { toFahrenheit } from './convert.js';
      console.log(toFahrenheit(20));
    question: You run `esbuild main.js --bundle`. What ends up in the output?
    choices:
      - text: '`toFahrenheit` and the log, in one file'
        correct: true
        feedback: >-
          Yes. Both files became one, and the unused function was left behind.
      - text: Both functions and the log, in one file
        feedback: >-
          They are joined into one file. But nothing imports `toKelvin`, so it doesn't make the
          trip.
      - text: '`main.js` alone, still importing `./convert.js`'
        feedback: >-
          That's what you get without `--bundle`. The flag tells esbuild to pull the import in.

  - type: fill-blank
    id: fill-lazy-chart
    concept: tooling.bundling
    difficulty: 3
    language: js
    prompt: >-
      Only visitors who open the chart should download its code. Fill the gaps, so the
      bundler puts `chart.js` in a chunk of its own.
    template: |
      // main.js
      async function showChart() {
        const { drawChart } = {{1}} {{2}}('./chart.js');
        console.log(drawChart([1, 3, 2]));
      }
    blanks:
      - key: '1'
        answer: await
      - key: '2'
        answer: import
    bank: [await, import, fetch, async, return]

  - type: prose
    id: minify-and-maps
    body: |-
      Last, the build **minifies**: short names, no spaces, one line. Smaller to download.
      But now a crash says `at r (app.js:1:38)`. Which function is `r`?

      So the build can also write a **source map**, `app.js.map`. It links each spot in the
      built file back to your file, line and name. Browser dev tools read it by themselves.
      Node needs a flag:

      ```text
      $ node --enable-source-maps dist/app.js
      Error: Bad quantity for tea
          at checkQty (/app/src/cart.ts:5:11)
      ```

  - type: fill-blank
    id: fill-build-flags
    concept: tooling.source-maps
    difficulty: 3
    language: json
    prompt: >-
      Your shop's build should make one file, squash it and write a map. And `npm start`
      should show crashes at your own lines. Fill the gaps.
    template: |
      {
        "scripts": {
          "build": "esbuild src/main.ts {{1}} {{2}} {{3}} --outfile=dist/app.js",
          "start": "node {{4}} dist/app.js"
        }
      }
    blanks:
      - key: '1'
        answer: --bundle
        accept: [--minify, --sourcemap]
      - key: '2'
        answer: --minify
        accept: [--bundle, --sourcemap]
      - key: '3'
        answer: --sourcemap
        accept: [--bundle, --minify]
      - key: '4'
        answer: --enable-source-maps
    bank: [--bundle, --minify, --sourcemap, --enable-source-maps, --splitting, --watch]

  - type: ai-review
    id: review-object-export
    concept: tooling.tree-shaking
    difficulty: 4
    language: js
    request: Group our temperature helpers so the imports look tidier.
    flawClass: performance
    code: |
      // convert.js
      export const convert = {
        toFahrenheit(celsius) {
          return celsius * 9 / 5 + 32;
        },
        toKelvin(celsius) {
          return celsius + 273.15;
        },
      };

      // main.js
      import { convert } from './convert.js';
      console.log(convert.toFahrenheit(20));
    prompt: >-
      An assistant wrote this. Every test still passes. But the bundle now holds `toKelvin`,
      which the page never calls. Tap the line at fault.
    lines: [2]
    reasons:
      - text: One exported object can't be shaken apart
        correct: true
        feedback: >-
          Yes. `convert` is used, so all of it stays. Separate exports drop one by one.
      - text: Methods can't be tree-shaken, only arrows
        feedback: >-
          The kind of function doesn't matter. What's kept is whatever the import names, here
          the whole object.
      - text: The import should be `import *`
        feedback: >-
          `import *` still lets esbuild see which names you use. The object is what hides them.
    verify:
      question: How would you prove the fix keeps `toKelvin` out of the bundle?
      choices:
        - text: Build it, then search the output for `toKelvin`
          correct: true
          feedback: >-
            Yes. The built file is the thing visitors download, so check it.
        - text: Run the tests again
          feedback: >-
            The tests passed with the bloated bundle too. They check behaviour, not what's shipped.
        - text: Open the page with `npm run dev`
          feedback: >-
            The dev server serves your files as written. It never bundles, so it can't show this.
    fix: |
      // convert.js
      export function toFahrenheit(celsius) {
        return celsius * 9 / 5 + 32;
      }
      export function toKelvin(celsius) {
        return celsius + 273.15;
      }

      // main.js
      import { toFahrenheit } from './convert.js';
      console.log(toFahrenheit(20));

  - type: explain-back
    id: explain-dev-and-build
    concept: tooling.bundling
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why do you work with `npm run dev` but publish the output of `npm run build`?
    rubric:
      - The dev server serves your files as written and reloads on every save, which suits editing.
      - The build transpiles, bundles and minifies into a few small files, which suits visitors.
      - The build's output is what you publish, with a source map to trace errors back.
    modelAnswer: >-
      While I edit, I want to see each change at once. The dev server serves my files as they
      are and reloads the page. Visitors want a fast page. The build strips types, joins
      the modules into a few files, drops unused code and squashes it. That output is what I
      publish, and its source map leads errors back to my own lines.

recap:
  - Use the dev server while you work, and publish what the build makes.
  - Say what transpiling, bundling, tree-shaking and code splitting each do to your code.
  - Turn a minified stack trace back into your own file and line with a source map.

recall:
  - id: card-dev-vs-build
    concept: tooling.bundling
    front: What does a dev server do that a build doesn't?
    back: >-
      It serves your files as written and reloads the page on every save. A build makes the
      small files you publish.
  - id: card-transpiler-types
    concept: tooling.transpiling
    front: Why can a TypeScript file with a type error still build with esbuild?
    back: >-
      esbuild only removes the types and never checks them. Run `tsc --noEmit` for that.
  - id: card-dynamic-import-chunk
    concept: tooling.bundling
    front: What does a dynamic `import()` do to a bundle with splitting on?
    back: >-
      Its module goes into a separate chunk, downloaded only when that line runs.
  - id: card-shake-object
    concept: tooling.tree-shaking
    front: Why does exporting helpers as one object stop tree-shaking?
    back: >-
      The import names the whole object, so the bundler keeps all of it. Separate exports can be
      dropped one by one.
  - id: card-enable-source-maps
    concept: tooling.source-maps
    front: What must you add for Node to print your source lines in a stack trace?
    back: >-
      Build with a source map, and run Node with `--enable-source-maps`. Browser dev tools read
      the map on their own.

