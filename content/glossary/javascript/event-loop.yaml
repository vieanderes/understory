term: event loop
short: The cycle that runs one piece of JavaScript to the end, then picks the next waiting job.
explain: |
  JavaScript in a page runs on one thread, so it does one thing at a time. When you wait
  for a timer or a network reply, the waiting happens elsewhere. Your callback joins a queue.

  The loop takes one task and runs it to the end. Then it runs every queued microtask, such
  as promise callbacks. Then the browser may paint. Then the next task. A slow loop in your
  code holds all of it up: no clicks, no paint.
analogy: One cashier and a queue. Each customer is served to the end, and nobody is served halfway.
example:
  language: js
  code: |
    setTimeout(() => console.log('task'), 0);
    Promise.resolve().then(() => console.log('microtask'));
    console.log('now');
    // now, microtask, task
usage: That sort takes two seconds and blocks the event loop, so the button feels dead.
twin:
  term: microtask
  difference: The event loop is the whole cycle that chooses what runs next. A microtask is one kind of job in it, the kind that always runs before the next task.
