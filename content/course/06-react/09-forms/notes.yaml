summary: >-
  A form field keeps its text in one of two places. In an **uncontrolled** field the browser's
  DOM holds it, and you read it when the form is sent. In a **controlled** field React state
  holds it: `value` shows the state and `onChange` updates it on every keystroke. Neither is
  better. Control a field when the interface needs its value while someone types, such as a
  character counter, live validation or a filter. Leave it uncontrolled when you only need the
  value on submit.


  React 19 adds actions to forms. Pass a function as `<form action={fn}>` and React prevents the page reload. It collects the
  named fields into a `FormData`, calls your function inside a transition, and resets the
  uncontrolled fields when it finishes. `useFormStatus` lets a
  component inside the form know it's pending. `useActionState` keeps whatever the action
  returns, such as a validation message, and hands it to the next render.


  Together they cover most forms with little code: uncontrolled fields, one action, a submit
  button that shows it's working and a message from the result. Controlled state is added only
  for the fields that need it. The same `action` prop is what lets a framework such as Next.js
  run the function on the server.
remember:
  - A controlled input shows `value` from state and changes it through `onChange`; an uncontrolled one keeps its text in the DOM and starts from `defaultValue`.
  - Control a field only when something must react while the user types; otherwise read the value from `FormData` on submit.
  - '`<form action={fn}>` calls `fn` with a `FormData` of every named, enabled field, in a transition, with no page reload.'
  - After a form action finishes, React resets the form's uncontrolled fields, so return submitted values and feed them back through `defaultValue` when validation fails.
  - '`useFormStatus` reads the status of the form above the component that calls it, so it lives in a child such as the submit button.'
  - '`useActionState(action, initialState)` returns `[state, formAction, isPending]`, and the action receives the previous state first and the form data second.'
  - Errors thrown by a form action go to the nearest error boundary; expected failures such as validation are returned as state.
  - A controlled value must never be `undefined`, or React warns that the input switched from uncontrolled to controlled; use `''` as the empty value.
sections:
  - title: Choosing controlled or uncontrolled, field by field
    body: |-
      The choice is per field, not per form. Ask one question: does anything on screen depend on
      this value before submit? A counter, a disabled button, a live error, a preview, a list
      filtered as you type. If yes, control it. If no, leave it to the DOM.

      Controlled fields have a cost. Every keystroke sets state, so the component that owns
      the state renders again, with all its children. For a login form that doesn't matter. For
      a large form where one component owns thirty controlled fields, typing can start to lag.
      Keep controlled state in the smallest component that needs it, or leave most fields
      uncontrolled.

      Uncontrolled fields have a different cost: you can't change them from code without a ref.
      `defaultValue` is read when the input mounts. Changing it later doesn't change what the
      field shows, only what a form reset returns to. To load a different record into an
      uncontrolled form, remount it with a key: `<EditForm key={record.id} record={record} />`.

      Each input type has its own controlled prop: `value` for text, `textarea` and `select`,
      `checked` for checkboxes and radio buttons. A `textarea` takes `value`, not children. A
      file input is always uncontrolled, because code can't set which file a user picked.

      Two warnings point at mixed-up fields. `value` without `onChange` gives a read-only field
      and a warning; add `onChange`, `readOnly`, or use `defaultValue`. And a value that starts
      as `undefined` and later becomes a string makes React warn that "a component is changing
      an uncontrolled input to be controlled". That usually comes from data that hasn't loaded
      yet. Write `value={title ?? ''}` so the field is controlled from its first render.
  - title: What happens when a form action runs
    body: |-
      Pressing a submit button in `<form action={fn}>` sets off a fixed sequence. React stops the
      browser's own submit, builds a `FormData` from the form and calls `fn` inside a transition.
      While the returned promise is pending, `useFormStatus` reports `pending: true` to
      components inside the form, together with `data`, the `FormData` being sent. When the
      action finishes, React resets the uncontrolled fields. If the action throws, the error goes
      to the nearest error boundary, like an error thrown while rendering.

      `useActionState` wraps the action to add memory. Its action receives the previous state and
      the form data, and whatever it returns becomes the new state. Submissions through the same
      `useActionState` are queued: in our test, two dispatches ran one after the other, and the
      second received the state the first returned.

      So the division of labour is clear. Things you expect, like a missing name or an email
      address already in use, are returned as state and shown next to the field. Things you
      don't expect, like the network going down, throw and reach an error boundary. Returning a
      plain value keeps the component in control of what the user sees.

      The reset has a consequence people trip over. When validation fails, the action returns
      an error, React resets the form, and the user's text disappears. The fix is to return the
      submitted values in the state and render them with `defaultValue`. The reset then puts back
      what the user typed, because `defaultValue` is what a reset returns to.
  - title: A complete sign-up form with field errors
    body: |-
      This form validates in the action, keeps the user's input on error, links each error to
      its field for screen readers and shows who is being signed up while it saves. We ran it
      in jsdom with Testing Library: a bad email kept both values and set `aria-invalid`, and a
      valid submit showed the pending label, called `register` once and cleared the fields.

      ```tsx
      import { useActionState } from 'react';
      import { useFormStatus } from 'react-dom';

      type Fields = { name: string; email: string };
      type SignUpState = { errors: Partial<Record<keyof Fields, string>>; values: Fields; done: boolean };

      const initial: SignUpState = { errors: {}, values: { name: '', email: '' }, done: false };

      function SubmitButton() {
        const { pending, data } = useFormStatus();
        const who = data ? String(data.get('name')) : '';
        return <button disabled={pending}>{pending ? `Signing up ${who}` : 'Sign up'}</button>;
      }

      export function SignUpForm({ register }: { register: (fields: Fields) => Promise<void> }) {
        async function signUp(_previous: SignUpState, formData: FormData): Promise<SignUpState> {
          const values = {
            name: String(formData.get('name') ?? '').trim(),
            email: String(formData.get('email') ?? '').trim(),
          };
          const errors: SignUpState['errors'] = {};
          if (values.name === '') errors.name = 'Enter your name.';
          if (!values.email.includes('@')) errors.email = 'Enter an email address, like ada@example.com.';
          // Return the values, so the fields can show them again after React resets the form.
          if (Object.keys(errors).length > 0) return { errors, values, done: false };
          await register(values);
          return { ...initial, done: true };
        }

        const [state, formAction] = useActionState(signUp, initial);

        return (
          <form action={formAction} noValidate>
            <label htmlFor="name">Name</label>
            <input
              id="name"
              name="name"
              defaultValue={state.values.name}
              aria-invalid={state.errors.name ? true : undefined}
              aria-describedby={state.errors.name ? 'name-error' : undefined}
            />
            {state.errors.name && <p id="name-error">{state.errors.name}</p>}

            <label htmlFor="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              defaultValue={state.values.email}
              aria-invalid={state.errors.email ? true : undefined}
              aria-describedby={state.errors.email ? 'email-error' : undefined}
            />
            {state.errors.email && <p id="email-error">{state.errors.email}</p>}

            <SubmitButton />
            <p role="status">{state.done ? 'You are signed up.' : ''}</p>
          </form>
        );
      }
      ```

      `noValidate` turns off the browser's own bubbles so every message comes from one place.
      `aria-describedby` makes a screen reader read the error with the field's label, and the
      `role="status"` paragraph announces success without moving focus. Client checks like
      these are for speed only. Anything that matters is checked again wherever the data is
      saved.
  - title: Reading FormData without surprises
    body: |-
      `FormData` holds the named, enabled fields of a form as string pairs, plus `File` objects
      for file inputs. A few behaviours catch people out:

      ```js
      const formData = new FormData();
      formData.append('title', 'Dune');
      formData.append('tags', 'sci-fi');
      formData.append('tags', 'classic');
      formData.append('copies', '3');

      console.log(formData.get('title')); // 'Dune'
      console.log(formData.get('subtitle')); // null
      console.log(formData.get('tags')); // 'sci-fi' (the first only)
      console.log(formData.getAll('tags')); // [ 'sci-fi', 'classic' ]
      console.log(typeof formData.get('copies')); // 'string'
      console.log(Number(formData.get('copies'))); // 3
      console.log(Object.fromEntries(formData)); // { title: 'Dune', tags: 'classic', copies: '3' }
      ```

      `get` returns a string, a `File` or `null`, never a number or a boolean, so convert and
      check every value. Several checkboxes with one name send several entries: read them with
      `getAll`, because `get` returns only the first and `Object.fromEntries` keeps only the
      last. An unticked checkbox sends nothing at all, and a ticked one without a `value` sends
      `"on"`, so test with `formData.has('newsletter')`. A disabled field is left out entirely;
      use `readOnly` if the value must be sent but not edited. And a field without a `name`
      never appears, which is the usual reason `get` returns `null`.
pitfalls:
  - >-
    **Controlling every field by habit.** Thirty `useState` calls re-render the whole form on
    every keystroke. Control only the fields the interface reacts to, and read the rest from
    `FormData`.
  - >-
    **Losing the user's input on a validation error.** React resets uncontrolled fields after
    the action, so a returned error arrives with empty fields. Return the submitted values and
    render them with `defaultValue`.
  - >-
    **Calling `useFormStatus` in the component that renders the form.** It finds no form above
    and `pending` stays false. Move it into a child rendered inside the form.
  - >-
    **Forgetting `name`.** `FormData` only collects named fields, so `formData.get('email')`
    returns `null`. Give every field a `name`.
  - >-
    **Disabling a field that must be submitted.** Disabled fields are left out of `FormData`.
    Use `readOnly` instead.
  - >-
    **Starting a controlled value as `undefined`.** The field flips from uncontrolled to
    controlled when data arrives, with a warning. Start from `''` or write `value ?? ''`.
  - >-
    **Throwing for validation.** A thrown error replaces the form with the nearest error
    boundary. Return expected failures as state, and throw only for the unexpected.
interview:
  - question: Controlled or uncontrolled inputs? How do you choose?
    answer: >-
      I decide per field by asking whether anything on screen depends on its value before
      submit. If a counter, a live error or a filter reacts to each keystroke, the field is
      controlled, with `value` from state and `onChange` updating it. Otherwise I leave it
      uncontrolled and read it from `FormData` when the form is sent. Controlled gives full
      power, like formatting or rejecting input, but every keystroke re-renders the owner, which
      adds up in big forms. Uncontrolled is less code and less rendering, but code can't change
      the value without a ref or a remount. Most real forms mix both.
  - question: What does `<form action={fn}>` do in React 19, compared with `onSubmit`?
    answer: >-
      React takes over the submit: it prevents the reload, builds a `FormData` from the named
      fields and calls `fn` inside a transition. Components inside the form can read the
      pending state with `useFormStatus`, and when the action finishes React resets the
      uncontrolled fields. A thrown error goes to the nearest error boundary. With `onSubmit` I
      would call `preventDefault`, build the `FormData` and track pending state myself.
      Wrapping the action in `useActionState` adds a returned state for messages and an
      `isPending` flag. In a framework such as Next.js the same prop can point at a server
      function. The trade-off is the automatic reset, which clears the user's input after a
      validation error unless I return the values.
  - question: Why must `useFormStatus` be called in a child of the form?
    answer: >-
      Because it reads the status of the nearest form above the component that calls it, the
      same way `useContext` reads the nearest provider. The component that renders the `<form>`
      is above that form, not inside it, so it finds nothing and `pending` stays false. The
      usual shape is a small `SubmitButton` that calls `useFormStatus` and disables itself while
      pending. A side benefit is reuse: one button component works in every form without
      props. If I need pending state in the component that owns the form, `useActionState`
      gives it as the third item, `isPending`.
  - question: How do you show server-side validation errors without losing what the user typed?
    answer: >-
      I return the errors and the submitted values from the action as state, and render each
      field with `defaultValue={state.values.name}`. React resets uncontrolled fields when an
      action finishes, and a reset returns each field to its default value, so the text comes
      back. Each error is linked to its field with `aria-describedby` and the field gets
      `aria-invalid`, so a screen reader announces both. I return expected failures rather than
      throwing, because a throw replaces the form with an error boundary. Client checks still
      help for speed, but the server's answer is the one that counts.
