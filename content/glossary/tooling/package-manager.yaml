term: package manager
aka:
  - dependency manager
  - npm
short: A tool that downloads the libraries a project depends on, with the right versions, and records them.
explain: |
  Your project needs a date library, which needs two more libraries, which need others.
  Fetching all of those by hand, at compatible versions, is impossible.

  This tool reads your list of dependencies and works out the whole tree. It downloads it into the project and writes a lockfile with the exact versions. It also runs project
  scripts like `test` and `build`. Every package you add is someone else's code running
  with your permissions, so check what you install.
analogy: A grocery delivery service. You write the shopping list; they find every item, including the ones the recipe quietly needs.
example:
  language: bash
  code: |
    $ pnpm add zod
    $ pnpm install --frozen-lockfile
    $ uv add httpx
usage: Use the package manager to add it, so the version lands in the lockfile too.
twin:
  term: bundler
  difference: A package manager installs dependencies into your project. A bundler takes the code you've written plus those dependencies and packs it into files to ship.
related:
  - lockfile
  - semantic-versioning
  - virtual-environment
level: 1
