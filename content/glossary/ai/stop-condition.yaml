term: stop condition
aka:
  - stopping condition
  - exit condition
  - done condition
short: A rule written in advance that tells an automated loop when it has finished or must give up.
explain: |
  An agent left alone keeps going. It retries the same fix, or polishes forever, and the
  bill grows. It needs to know when to stop.

  Name the stops up front. Done: the checks pass and the review is approved. Stuck: the
  same failure twice in a row. Over budget: a step cap, a time limit or a cost limit. Each
  one ends the loop and reports why.

  Stopping on "stuck" matters most. Repeating an identical attempt is the costliest way to
  learn nothing.
analogy: A recipe that says "bake until golden, but take it out at forty minutes regardless".
usage: Add a stop condition for the same test failing twice, or it'll loop all night.
