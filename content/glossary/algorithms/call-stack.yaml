term: call stack
aka: [stack frame, stack overflow, maximum call stack size exceeded]
short: The pile of unfinished function calls, each with its own local variables and a place to return to.
explain: |
  When a function calls another, it pauses. The computer has to remember where it was and
  what its variables held. It puts that on top of a pile, called a frame, and removes it
  when the call returns. A stack trace is this pile, printed at the moment of an error.

  The pile has a limit, often a few thousand frames. Recurse deeper and you get a **stack
  overflow**: "Maximum call stack size exceeded" in JavaScript, `RecursionError` in Python.

  Spreading a huge array into `Math.max(...nums)` can hit the same limit. Every item
  becomes an argument on the stack.
analogy: A stack of sticky notes on your desk. Each interruption gets a new note on top, and you finish them from the top down.
example:
  language: js
  code: |
    function depth(n) {
      return n === 0 ? 0 : 1 + depth(n - 1);
    }
    depth(1_000);     // fine: 1,000 frames
    depth(1_000_000); // RangeError: Maximum call stack size exceeded
usage: The call stack overflows at about ten thousand frames, so this recursive flood fill fails on a big grid.
twin:
  term: heap-memory
  difference: The call stack holds each call's frame and frees it the moment the call returns. Heap memory holds objects that outlive a single call, until nothing refers to them.
related: [stack-trace, recursion, base-case, heap-memory, stack, event-loop, debugger, function]
level: 2
lessons: [basics.debugging, cs.recursion, interview.js-traps, cs.memory-and-runtimes]
