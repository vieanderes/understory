term: IDOR
aka: [insecure direct object reference, broken object level authorisation, BOLA]
short: A flaw where changing an id in a request reaches a record that belongs to someone else.
explain: |
  You're signed in and open `/orders/1041`. Out of curiosity you try `/orders/1040`, and see
  a stranger's order. The server checked that you were signed in, but never that the order
  was yours.

  It is the most common serious flaw in real APIs, because the code looks finished. The fix
  is to put the caller into the lookup, `WHERE id = $1 AND owner_id = $2`, so a record that
  isn't theirs is never found. Answer `404`, not `403`, so the response doesn't confirm the
  record exists.
analogy: A cloakroom that hands over any coat for any ticket number you say out loud.
example:
  language: sql
  code: |
    -- Vulnerable: any signed-in user can read any order
    SELECT * FROM orders WHERE id = $1;

    -- Safe: the owner is part of the lookup
    SELECT * FROM orders WHERE id = $1 AND customer_id = $2;
usage: The invoice endpoint only checks the session, so it's an IDOR; scope the query by account.
related: [authorisation, authentication, role-based-access-control, row-level-security]
level: 2
lessons: [backend.authorisation]
