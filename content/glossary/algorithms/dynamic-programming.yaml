term: dynamic programming
aka: [DP, dynamic programing]
short: Solving a problem by building its answer from saved answers to smaller versions of the same problem.
explain: |
  How many ways are there to climb 40 stairs, one or two at a time? The ways to reach step
  40 are the ways to reach 39 plus the ways to reach 38. Plain recursion recomputes those
  same steps billions of times.

  Two things make a problem fit. Its answer is built from answers to smaller versions, and
  those smaller versions repeat. Save each one and the exponential tree of calls collapses
  to one visit per state.

  Saving inside the recursion is memoisation. Filling a table from the smallest up is
  tabulation. The hard part is never the code: it's naming the state and the rule.
analogy: Working out 40 times 7 when you already know 39 times 7. You add one more 7 instead of starting over.
example:
  language: python
  code: |
    def ways(n):
        a, b = 1, 1           # ways to reach step 0 and step 1
        for _ in range(n - 1):
            a, b = b, a + b   # ways(i) = ways(i - 1) + ways(i - 2)
        return b

    ways(40)  # 165580141, in 40 steps, not billions
usage: The subproblems overlap, so this is dynamic programming; define dp[i] as the best total using the first i houses.
twin:
  term: greedy-algorithm
  difference: Dynamic programming weighs every option for each smaller problem and keeps the best. A greedy algorithm commits to the best-looking choice now and never looks back.
related: [memoisation, tabulation, greedy-algorithm, recursion, kadanes-algorithm, backtracking]
level: 2
lessons: [algo.dynamic-programming]
