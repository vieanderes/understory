summary: >-
  Complexity analysis answers one question before you run anything: as the input grows, how
  fast does the cost grow? The cost can be time, counted as the number of basic steps, or
  memory. You describe the answer as a function of the input size n, and keep only its shape.


  **Big-O** is the notation for that shape. Strictly, O(f) is an upper bound, Ω(f) a lower
  bound and Θ(f) both at once, but in everyday talk "O" usually means the tightest bound you
  can give for the worst case. Most real code falls into a handful of classes: O(1),
  O(log n), O(n), O(n log n), O(n²) and O(2ⁿ). You can usually read the class off the shape
  of the loops and the recursion.


  Complexity tells you who wins as n gets large. It doesn't tell you who wins at n = 50,
  because it throws constants away, and it says nothing about caches or the engine. Use it to
  rule out designs that can't scale, then measure the ones that can.
remember:
  - Complexity describes how time or memory grows as the input size n grows, not how many milliseconds the code takes.
  - O(f) is an upper bound, Ω(f) a lower bound and Θ(f) a tight bound, meaning both at once.
  - Keep the fastest-growing term and drop constant factors, so 3n² + 5n + 2 is Θ(n²).
  - Steps in sequence add and steps nested inside each other multiply, and a loop that halves its range runs O(log n) times.
  - Amortised cost is the average over any sequence of operations, which is why array `push` is O(1) amortised even though a resize copies everything.
  - Space complexity counts the extra memory an algorithm needs, and a recursion's call stack counts too.
  - Library calls like `includes`, `indexOf`, `shift` and a spread each hide a loop over the data they touch.
  - Worst, best and average case are separate questions from O, Ω and Θ, and each case can have its own bound.
sections:
  - title: O, Omega and Theta, precisely
    body: |-
      The definitions are short. For cost functions f(n) and g(n):

      - f is **O(g)** if there are constants c and n₀ with f(n) ≤ c·g(n) for every n ≥ n₀.
        It grows no faster than g.
      - f is **Ω(g)** if there are constants c and n₀ with f(n) ≥ c·g(n) for every n ≥ n₀.
        It grows at least as fast as g.
      - f is **Θ(g)** if it's both. It grows exactly like g, up to constant factors.

      Take f(n) = 3n² + 5n + 2. For n ≥ 6, it's at most 4n², so it's O(n²). It's always at
      least 3n², so it's Ω(n²). So it's Θ(n²). The constants c and n₀ are what let you drop the
      smaller terms and the leading 3.

      Because O is only an upper bound, a linear function is also O(n²) and O(2ⁿ). That's true
      and useless. When engineers say "this is O(n)", they mean the tight bound, which is
      strictly Θ(n).

      The second confusion is between **bounds** and **cases**. Linear search over an array
      has a best case (the item is first, Θ(1)), a worst case (the item is missing, Θ(n)) and
      an average case (about n/2 comparisons, still Θ(n)). O, Ω and Θ can describe any of
      them. "O means worst case, Ω means best case" is a common mix-up in interviews. What's
      true is that a statement without a case usually means the worst case, because that's
      the one that bites on unlucky input.

      There are also tight lower bounds for whole problems, not only for algorithms. Any sort
      that only compares items needs Ω(n log n) comparisons in the worst case, which is why
      merge sort's O(n log n) counts as optimal.
  - title: Deriving the common classes
    body: |-
      You rarely need the formal definition. Four rules cover most code: count the innermost
      step, add costs that run one after another, multiply costs that are nested, and watch
      how fast the loop variable moves. This counts three shapes that trip people up:

      ```js
      function countSteps(n) {
        let halving = 0;
        for (let size = n; size > 1; size = Math.floor(size / 2)) halving++;

        let pairs = 0;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) pairs++; // each pair once
        }

        let doubling = 0;
        for (let i = 1; i < n; i = i * 2) {
          for (let j = 0; j < i; j++) doubling++; // 1 + 2 + 4 + ... < 2n
        }
        return { halving, pairs, doubling };
      }

      console.log(countSteps(1000)); // { halving: 9, pairs: 499500, doubling: 1023 }
      console.log(countSteps(2000)); // { halving: 10, pairs: 1999000, doubling: 2047 }
      ```

      **Halving** adds one step when n doubles: that's O(log n). The base of the log doesn't
      matter in Big-O, because logs of different bases differ by a constant factor.

      **Pairs** with `j` starting at `i + 1` does n(n − 1)/2 steps. Half of n² is still
      Θ(n²), and doubling n quadruples the count, as the output shows.

      **Doubling** looks like a loop in a loop, but the inner counts are 1, 2, 4 and so on up
      to n. That geometric series sums to less than 2n, so it's O(n). Nested loops don't
      always multiply: check what the inner loop depends on.

      Recursion needs a **recursion tree**. Merge sort splits in half, so the tree is
      log n levels deep, and each level does O(n) merging in total: O(n log n). A naive
      Fibonacci makes two calls per call, so the tree roughly doubles per level: exponential.

      Finally, name every input. Comparing each of n orders with each of m blocked emails is
      O(n·m), not O(n²). If m stays small, that matters a lot.
  - title: 'Amortised cost: why `push` is O(1)'
    body: |-
      A JavaScript array grows as you push. Underneath, an engine keeps a backing store with
      some spare capacity. When it's full, it allocates a bigger block and copies every item
      across. That one push costs O(n). So how can push be O(1)?

      Because the capacity grows by a **factor**, not a fixed amount, the expensive pushes get
      rarer as the array grows. Here's the idea with doubling, counting every copy:

      ```js
      // A growable array that doubles its capacity when full, counting every copy.
      class GrowableArray {
        constructor() {
          this.capacity = 1;
          this.length = 0;
          this.slots = new Array(1);
          this.copies = 0;
        }
        push(value) {
          if (this.length === this.capacity) {
            this.capacity = this.capacity * 2;
            const bigger = new Array(this.capacity);
            for (let i = 0; i < this.length; i++) {
              bigger[i] = this.slots[i];
              this.copies++;
            }
            this.slots = bigger;
          }
          this.slots[this.length] = value;
          this.length++;
        }
      }

      for (const n of [1000, 1_000_000]) {
        const list = new GrowableArray();
        for (let i = 0; i < n; i++) list.push(i);
        console.log(n, list.copies, (list.copies / n).toFixed(2));
      }
      // 1000 1023 1.02
      // 1000000 1048575 1.05
      ```

      A million pushes cost about a million copies in total, roughly one per push. The copies
      are 1 + 2 + 4 + ... up to n, the same geometric series as before, so the total is under
      2n. Spread over n pushes, each costs O(1) **amortised**.

      Amortised is a guarantee over any sequence of operations, which makes it stronger than
      an average over random inputs. It's still an average, though: the one push that
      triggers a resize is slow. For most code that doesn't matter. For a hard real-time
      loop, it can, and you'd preallocate.

      If the capacity grew by a fixed 100 slots instead, copies would total about n²/200, and
      push would be O(n) amortised. Real engines grow by a factor for this reason. The exact
      factor is an engine detail.
  - title: Space complexity
    body: |-
      Space complexity asks how much **extra** memory an algorithm needs as n grows. The input
      usually isn't counted, only what the algorithm allocates on top. Some texts call this
      auxiliary space, to be clear about it.

      A few common cases:

      - A loop with a few counters: O(1).
      - Building a `Set` or `Map` from the input: O(n).
      - `toSorted`, `map`, `filter` and spreading: O(n), because each returns a new array.
      - `sort` in place: the caller's array is reordered, so no copy is needed. The engine's
        algorithm may still use working memory; V8's TimSort can use up to O(n).
      - A recursion that goes d levels deep: O(d), because every waiting call keeps a frame on
        the call stack. A recursive sum over an n-item list is O(n) space even though it
        allocates nothing itself.

      The last one is the one people forget. It's also why deep recursion throws a
      `RangeError` in Node: the stack is a fixed-size region, and O(n) frames outgrow it.

      Time and space trade against each other constantly. The Set in the lesson spends O(n)
      memory to turn an O(n·m) check into O(n + m). Memoisation stores past answers to skip
      repeated work. Going the other way, when memory is tight, a sorted array with binary
      search uses no extra space and pays O(log n) per lookup instead of O(1).

      When you state a complexity in a review or an interview, give both: "O(n) time and O(n)
      space, because of the Set". It shows you know what you spent to get the speed.
  - title: Hidden loops in everyday JavaScript
    body: |-
      The most common way to write quadratic code by accident is a library call inside a loop.
      These are all O(n) in the length of the array or string they work on: `includes`,
      `indexOf`, `find`, `some`, `filter`, `slice`, `concat`, spreading `[...list]`, `join`,
      `Object.keys`, and `splice` or `unshift` near the front. `shift` is described in the spec
      as moving every remaining item down one place. Engines have tricks for some arrays, but
      you can't rely on them.

      Here's a pattern that reads as one pass and isn't:

      ```js
      const items = Array.from({ length: 2000 }, (_, i) => i);

      // Looks like one pass. Each spread copies everything built so far.
      let copied = 0;
      const slow = items.reduce((acc, x) => {
        copied += acc.length;
        return [...acc, x];
      }, []);

      // One pass for real: push adds to the end in amortised O(1).
      const fast = [];
      for (const x of items) fast.push(x);

      console.log(slow.length, fast.length, copied); // 2000 2000 1999000
      ```

      Two thousand items meant about two million copies: n(n − 1)/2, so Θ(n²). The same
      applies to `{ ...acc, [key]: value }` inside a `reduce` over many keys.

      The O(1) operations to lean on are indexing an array, `push` and `pop` at the end, and
      `get`, `set`, `has` and `delete` on a `Map` or `Set`, which are O(1) on average. When a
      loop body calls anything else, ask what it costs on the size it touches.
pitfalls:
  - '**Saying O means worst case and Ω means best case.** The letters are bounds and the cases are separate. Linear search has a Θ(1) best case and a Θ(n) worst case. Name the case, then give its bound.'
  - '**Writing O(n²) for two different inputs.** Checking n orders against m blocked emails is O(n·m). If m is tiny, the code is effectively linear, and calling it O(n²) hides that. Give each input its own letter.'
  - '**Counting a library call as one step.** `list.includes(x)` inside a `filter` is a loop inside a loop. Read the cost of each call on the data it touches, and swap in a `Set` or `Map` where lookups repeat.'
  - '**Forgetting the call stack in space.** A recursion d levels deep holds d frames. Calling it O(1) space is wrong, and on deep input it throws a `RangeError`. Count the depth, or rewrite it as a loop.'
  - '**Trusting Big-O at small n.** An O(n log n) algorithm with heavy constants can lose to an O(n²) one on 20 items, which is why production sorts switch to insertion sort for short runs. Measure when n is small or the choice is close.'
  - '**Reading amortised O(1) as every call being fast.** One `push` in many triggers a copy of the whole array. For latency-sensitive loops, preallocate or pick a structure without resizes.'
interview:
  - question: Explain Big O, Big Omega and Big Theta. How are they different from worst and average case?
    answer: >-
      Big O is an upper bound on growth, Big Omega a lower bound, and Big Theta both, a tight
      bound. Formally, f is O(g) if f(n) ≤ c·g(n) for all n past some n₀, Omega flips the
      inequality, and Theta needs both. They describe a function. Worst, best and average
      case choose which function you're describing. Linear search is Θ(n) in the worst case
      and Θ(1) in the best case, so "O is worst case" is a category error. In practice, when
      someone says "this is O(n)" with no case, they mean the tight bound for the worst case,
      and I'd say so explicitly. The caveat is that all three drop constant factors, so two
      Θ(n) algorithms can still differ several times in real speed.
  - question: Array `push` sometimes copies the whole array. Why do we still call it O(1)?
    answer: >-
      Because it's O(1) amortised: averaged over any sequence of pushes, each costs a
      constant. The array keeps spare capacity. When it runs out, the engine allocates a
      larger block, grown by a factor rather than a fixed amount, and copies everything. With
      doubling, the copies over n pushes are 1 + 2 + 4 + ... up to n, which sums to less than
      2n, so the total work is O(n) and each push is O(1) on average. Amortised is a
      worst-case guarantee over the whole sequence, not a hope about typical inputs. The
      trade-off is latency: the push that triggers a resize is O(n) on its own, so a
      real-time loop might preallocate. If growth were additive, say 100 slots each time,
      push would become O(n) amortised.
  - question: What's the time complexity of looping over n items and doing a binary search over an m-item sorted array for each? How do you derive it?
    answer: >-
      It's O(n log m). The outer loop runs n times, and each binary search halves its range
      until one item is left, which takes about log₂ m steps. Nested costs multiply, so the
      total is n times log m. I keep separate letters because the inputs are independent: if
      m is fixed and small, this is effectively linear in n. If the sorted array isn't given
      and I have to sort it first, add O(m log m), so the whole thing is O((n + m) log m).
      The alternative is to put the m items in a `Set`, which costs O(m) time and O(m) space
      to build and gives O(n + m) overall. Binary search wins when memory is tight, or when I
      need ranges and nearest matches, not only exact lookups.
  - question: What's the space complexity of a recursive function that sums an array by calling itself on the rest of the array?
    answer: >-
      At least O(n), even if it allocates nothing, because each call waits on the next and
      keeps a stack frame, and there are n of them at the deepest point. If it's written as
      `sum(list.slice(1))`, it's worse: each call copies the rest of the array, so time is
      O(n²) and the copies alive at once add up to O(n²) space too. Passing an index instead
      of slicing brings it back to O(n) time with O(n) stack. In JavaScript the stack depth
      is also a hard limit: V8 doesn't do tail call optimisation, so a large n throws
      `RangeError: Maximum call stack size exceeded`. For a flat array I'd write a loop,
      which is O(n) time and O(1) space. Recursion earns its place on tree-shaped data, where
      depth stays small.
  - question: When would you pick an O(n²) algorithm over an O(n log n) one?
    answer: >-
      When n is small or the data is nearly sorted, and the O(n²) algorithm has much smaller
      constants. Insertion sort is the classic case: it does very little work per step, reads
      memory in order, needs no extra space and is stable. On nearly sorted input it's close
      to O(n). That's why production sorts like TimSort, which V8 uses, sort short runs with
      insertion sort and merge them. Big-O describes growth as n becomes large, so below some
      crossover the "worse" algorithm is faster. The other reason is simplicity: a nested
      loop over 30 settings is clearer than a clever structure, and it will never be the
      bottleneck. The risk is that n grows later, so I'd leave a note about the assumption,
      or add a test with realistic sizes.
  - question: What does O(n log n) mean, and where does it show up?
    answer: >-
      The work grows a little faster than the input: n items, each costing about log n
      steps, where log n grows by one each time n doubles. Going from a thousand items to a
      million multiplies the work by roughly two thousand, not a million. It's the cost of
      good comparison sorting, such as merge sort or the sort built into JavaScript and
      Python, and of doing n operations on a balanced tree or a heap. The practical rule:
      if a solution sorts, it's at least O(n log n), so when an interviewer asks for O(n),
      look for a hash map or a single pass instead of a sort.
  - question: What's a time-space trade-off? Give an example.
    answer: >-
      Spending extra memory to save time, or the reverse. Two sum is the classic: checking
      every pair takes O(n²) time and no extra memory, while storing each number's index in
      a hash map as you go finds the pair in one pass, O(n) time, for O(n) extra memory.
      Caching, memoisation, indexes in a database and precomputed prefix sums are all the
      same trade. Most interview speed-ups are this move, so it's worth saying out loud.
      It's not free: memory can run out on big inputs, and a cache has to be kept correct,
      so I'd name the memory cost alongside the time saved.
terms:
  - term: Big-O
    say: The worst case.
    means: An upper bound on how cost grows with n. Worst, best and average case are separate questions,
      and each can have its own O, Ω and Θ bound.
  - term: Big Theta (Θ)
    say: The same as Big-O.
    means: "A tight bound: upper and lower at once. When people say O in everyday talk, they usually
      mean the tightest bound they can give, which is Θ."
  - term: O(n log n)
    say: A bit slower than linear.
    means: About n times the number of times n can be halved, the cost of good sorting and divide and
      conquer. A million items take roughly 20 million steps.
  - term: Amortised cost
    say: The average case.
    means: The average cost per operation over any sequence of operations, a guarantee rather than a
      probability. `push` is O(1) amortised even though one resize copies everything.
  - term: Space complexity
    say: How big the input is.
    means: The *extra* memory an algorithm needs as n grows. A recursion's call stack counts, so summing
      an array recursively uses O(n) space.
  - term: Constant factors
    say: An O(n log n) algorithm always beats an O(n²) one.
    means: Only for large enough n. Big-O drops constants, so at n = 50 a simple O(n²) loop can win;
      measure when n is small.
