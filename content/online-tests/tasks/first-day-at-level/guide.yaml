approach: >-
  The search keeps the best day found so far in answer and moves hi left whenever the day
  at mid is good enough. "Good enough" means the level is at least X, so the test must be
  A[mid] >= X. The buggy code uses >, which skips every day where the level equals X
  exactly. Changing that one comparison fixes it.
complexity: O(log N) time, O(1) extra space
steps:
  - kind: read
    title: Read the rules of a bug-fix task first
    minutes: 1
    body: |-
      This is a bug-fix task: you may change **at most one line**, and correctness is all
      that is scored. So do not rewrite the search, even if you would write it differently.

      Note the key words in the story: the level is **at least** X, and A never falls.
  - kind: explain
    title: Say what the function should return
    minutes: 1
    body: |-
      Put it in one sentence: the first index whose level is at least X, or −1. Keep the
      sentence in your head or on paper, not in the file. In a bug-fix task an added comment
      counts as a changed line.
  - kind: read
    title: Read the code line by line
    minutes: 2
    body: |-
      Follow what each variable means. `answer` is the best day found so far. When the day
      at `mid` qualifies, it is saved and the search moves left to find an earlier one.
      Otherwise the search moves right.

      Now compare the condition on the `if` line with the sentence you just said.
  - kind: edge-cases
    title: List the cases that test the boundary
    minutes: 2
    body: |-
      Binary search bugs live at the boundary, so pick cases where a level **equals** X:

      - a single day that matches X exactly;
      - X equal to the last level;
      - every day equal to X;
      - X below every level, and X above every level.
    input:
      - "([5], 5)"
      - "([1, 3, 3, 5, 8], 8)"
      - "([2, 2, 2], 2)"
      - "([4, 6], 1)"
      - "([4, 6], 7)"
  - kind: run
    title: Run the buggy code to see it fail
    minutes: 1
    body: |-
      Press **Run code** before you change anything. A failing case you can point to is
      proof of the bug, and it will prove the fix later.
    expect: >-
      The second example fails, and your first three cases return −1 where the answer is
      0, 4 and 0. The cases with no equal level pass.
  - kind: plan
    title: Name the bug from the pattern
    minutes: 2
    body: |-
      Every failing case has a level equal to X. The code only accepts a day when
      `A[mid] > X`, so a day at exactly X is treated as too low. The story says "at least",
      which is `>=`. That is the one line to change.
  - kind: ask-ai
    title: Check the reasoning, not the fix
    minutes: 1
    body: |-
      A narrow question about behaviour confirms your reading without handing the task to
      the assistant. It also shows the reviewer you found the bug yourself.
    prompt: >-
      Without changing any code: in this function, what happens to a day whose level equals
      X exactly? Is it ever saved in answer? One sentence.
    expect: The assistant says such a day is never saved, because the test is strictly greater.
  - kind: write
    title: Change the comparison and nothing else
    minutes: 1
    body: |-
      Edit only the `if` line: `>` becomes `>=`. Do not add comments or reformat other lines:
      the checker counts every changed line.
    code:
      ts: |-
        function solution(A: number[], X: number): number {
            let lo = 0;
            let hi = A.length - 1;
            let answer = -1;
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                if (A[mid] >= X) {
                    answer = mid;
                    hi = mid - 1;
                } else {
                    lo = mid + 1;
                }
            }
            return answer;
        }
      python: |-
        def solution(A, X):
            lo = 0
            hi = len(A) - 1
            answer = -1
            while lo <= hi:
                mid = (lo + hi) // 2
                if A[mid] >= X:
                    answer = mid
                    hi = mid - 1
                else:
                    lo = mid + 1
            return answer
    codeMode: full
  - kind: run
    title: Run everything again
    minutes: 1
    body: |-
      Press **Run code**. The examples and all your cases should now pass. Check each
      returned value against the rule, not against the old output.
    expect: Three OKs, then 0, 4, 0, 0 and −1 for your five cases.
  - kind: ai-writes
    title: Let the assistant suggest more inputs
    minutes: 1
    body: |-
      Extra inputs are a fair job for the assistant. You decide the right answers yourself,
      so ask for inputs only.
    prompt: >-
      Give me 4 more test inputs for this function, one per line, in the format
      ([1, 3, 3, 5, 8], 4). Include long runs of equal values and X equal to the first
      level. Inputs only, no answers and no code.
    expect: Four lines to paste into test-input.txt. Each returned value matches the rule.
  - kind: review
    title: Ask for a problem list
    minutes: 1
    body: |-
      Ask the assistant to look for anything else wrong, without rewriting. If it suggests a
      second change, remember the one-line limit before you act on it.
    prompt: >-
      Review this binary search for correctness only. List any remaining problems in one
      line each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Check the diff and submit
    minutes: 1
    body: |-
      Make sure exactly one line differs from the original and there is no debug output.
      Then submit.
