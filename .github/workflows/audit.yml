# Checks the dependencies against the vulnerability database once a week, even when
# nobody pushes: new advisories appear for old versions all the time. Weekly, not daily, to
# save Actions minutes; Dependabot security alerts cover the days between, and CI audits
# every push. A failure here means: run `pnpm audit` locally, update the package, push.
name: Dependency audit

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
