term: commit
aka:
  - git commit
short: One saved snapshot in a project's history, with an author, a message and a link to its parent.
explain: |
  Saving a file overwrites it. Version control keeps every save point you choose, so you
  can see what changed, when and why.

  Each one is a full snapshot with a unique hash. It points back at the one before it, forming a chain. Keep each one small and about one thing, with a message in the
  imperative, like `Add search to the booking list`. That's what makes `git log`,
  `git bisect` and a clean revert possible months later.
analogy: A page in a lab notebook. Dated, signed, describing one experiment, and never torn out.
example:
  language: bash
  code: |
    $ git add src/search.ts
    $ git commit -m "Add search to the booking list"
    [add-search 3f2a1c9] Add search to the booking list
     1 file changed, 24 insertions(+)
usage: Split that into two commits; the rename and the bug fix are separate changes.
twin:
  term: branch
  difference: A commit is a fixed snapshot that never changes. A branch is only a movable name that points at one commit and moves forward each time you add another.
related:
  - branch
  - git
  - pull-request
level: 1
lessons:
  - tooling.git-basics
  - pro.commits-and-prs
