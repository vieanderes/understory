    verified: true

deepDive: >-
  A regex for IBANs finds candidates; a real validator also checks the two check digits.
  Move the first four characters to the end and turn letters into numbers (A is 10, B is 11).
  The whole number modulo 97 must then be 1. That removes most false positives.


  Reversible redaction has a cost: the model can't reason about what it can't see. It
  can't check that two placeholders are the same person, or that an address is abroad.
  Keep the fields the task needs, like the country, and redact the rest.


  Removing direct identifiers is pseudonymisation, and GDPR still treats pseudonymised data
  as personal data. Only data that can no longer be linked to a person at all, by anyone
  with reasonable means, falls outside it. Free text is hard to anonymise fully, so treat
  redacted chats as personal data unless you have checked otherwise.
