term: props
aka:
  - prop
short: The inputs a parent passes to a child component, like arguments to a function.
explain: |
  `<Avatar size={48} name="Sam" />` hands `Avatar` an object: `{ size: 48, name: 'Sam' }`. The
  component reads it and draws itself.

  They belong to the parent, so the child must never change them. To change what the child
  shows, the parent passes new values. If the child needs to ask for a change, the parent
  passes a function too, such as `onSelect`.
analogy: The order slip handed to a chef. The chef cooks from it but doesn't rewrite it.
example:
  language: tsx
  code: |
    function Avatar({ name, size }: { name: string; size: number }) {
      return <img alt={name} width={size} src={`/avatars/${name}.png`} />;
    }

    <Avatar name="Sam" size={48} />;
usage: Don't copy the props into state; read them directly or the two will drift apart.
twin:
  term: state
  difference: Props come in from the parent and are read-only. State lives inside the component, which updates it with its setter.
related:
  - state
  - component
  - prop-drilling
level: 1
lessons:
  - react.props-and-composition
