term: upsert
aka: [ON CONFLICT, insert or update, create or update]
short: One statement that inserts a row, or updates the existing one if that key is already taken.
explain: |
  "Check whether the row exists, then insert it" is two steps. Two requests can both check,
  both see nothing, and both insert, so you get duplicates or an error.

  Postgres does it in one statement with `INSERT ... ON CONFLICT`. It needs a unique
  constraint or index on the conflict columns, because that is how the database spots the
  clash. `DO NOTHING` skips a duplicate quietly; `DO UPDATE SET col = EXCLUDED.col` writes the
  new values over the old ones.
analogy: Writing a name in a class register. If it's already there, you update the phone number instead of adding the child twice.
example:
  language: sql
  code: |
    INSERT INTO preferences (user_id, theme)
    VALUES ($1, $2)
    ON CONFLICT (user_id)
    DO UPDATE SET theme = EXCLUDED.theme;
usage: Two tabs saving settings at once gave us duplicate rows; make it an upsert on user_id.
related: [database-constraint, race-condition, primary-key, lost-update]
level: 2
lessons: [db.changing-rows, db.constraints]
