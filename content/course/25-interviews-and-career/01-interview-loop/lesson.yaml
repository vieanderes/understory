id: career.interview-loop
title: The senior AI engineering loop
objective: Know what each round of a senior AI engineering loop tests, and turn a mid-level answer into a senior one.
level: essential
minutes: 9
concepts: [career.interview-rounds, career.seniority-signals]
opening:
  text: >-
    You'll know what each round of a senior AI loop checks, and how to make an
    answer land as senior. The same facts sound mid-level or senior by their order.

steps:
  - type: prose
    id: the-rounds
    body: |-
      A **loop** is the set of interviews after the first screen. Each round has its own interviewer and a **rubric**, a written list of what earns marks.

      - **Coding**: one problem, working code, the cost said out loud.
      - **System design**: a vague brief turned into boxes, data and trade-offs.
      - **Project deep dive**: one system you built, questioned choice by choice.
      - **Behavioural**: stories about decisions you made with people.

  - type: multiple-choice
    id: pick-deep-dive
    concept: career.interview-rounds
    difficulty: 1
    question: >-
      You walk through an assistant you shipped, and they question each choice. Which round
      is this?
    choices:
      - text: A project deep dive
        correct: true
        feedback: >-
          Right. It tests whether you owned the decisions, not only the tickets.
      - text: A system design round
        feedback: >-
          Close. Design rounds hand you a new problem. This one digs into your own past work.
      - text: A behavioural round
        feedback: >-
          Behavioural rounds ask how you acted with people. This asks why the system looks as
          it does.

  - type: prose
    id: ai-rounds
    body: |-
      AI engineering loops bend those rounds towards models. The design brief is often an
      assistant over documents or an agent that takes actions.

      Many add an **applied AI round**: how you'd measure quality, why answers go wrong,
      what it costs. Some let you code with an assistant and watch how you check its work.
      Ask the recruiter which rounds you'll get.

  - type: multiple-choice
    id: pick-design-round
    concept: career.interview-rounds
    difficulty: 2
    question: You're asked how you'd spot a prompt change making answers worse. Which round is this?
    choices:
      - text: The applied AI round
        correct: true
        feedback: >-
          Yes. Measuring model quality is exactly what that round probes.
      - text: The coding round
        feedback: >-
          Coding rounds want a working function. This asks how you'd measure a system.
      - text: The behavioural round
        feedback: >-
          It's not about a past decision with people. It's about how you'd judge quality.

  - type: prose
    id: senior-signals
    body: |-
      What moves an answer from mid-level to senior is rarely more facts. It's the order you
      think in.

      You start from **requirements** before solutions. You name the **trade-off** of each
      choice. You say how it **fails** before anyone asks. And you say how you'd **measure**
      it: for a model, that means a fixed set of test questions you score, called an eval.

  - type: parsons
    id: order-strong-answer
    concept: career.seniority-signals
    difficulty: 2
    prompt: '"Should the help assistant answer from our docs?" Put a senior answer in order.'
    language: yaml
    blocks:
      - id: requirement
        code: 'ask: which questions come in, and how wrong may an answer be?'
        subgoal: Requirements
      - id: proposal
        code: 'propose: search the docs, answer only from what the search found'
        subgoal: Design
      - id: trade-off
        code: 'trade-off: one search adds latency, but answers cite a source'
      - id: failure
        code: 'fails when: search finds nothing, so it must say it does not know'
        subgoal: Failure and measure
      - id: measure
        code: 'measure: 50 real questions with known answers, scored every release'
    distractors:
      - id: best-model
        code: 'pick: the largest model, since it rarely gets things wrong'
        feedback: >-
          A bigger model still invents answers it can't find. Size doesn't replace a measure.

  - type: ai-review
    id: review-cache-answer
    concept: career.seniority-signals
    difficulty: 3
    language: yaml
    request: Draft my answer to "Should we cache the assistant's answers?"
    flawClass: security
    code: |
      requirement: how stale may an answer be when a doc changes?
      design: cache answers for an hour, keyed by the question text
      trade-off: repeat questions get faster and cheaper
      trade-off: an edited doc shows the old answer for up to an hour
      failure: if the cache is down, call the model as normal
    prompt: >-
      You're rehearsing a design round, and an assistant drafted this. Each user may only
      see some documents. Tap the line an interviewer would pounce on.
    lines: [2]
    reasons:
      - text: One user's answer can reach another user
        correct: true
        feedback: >-
          Yes. Answers depend on what each user may read, so the key needs that too.
      - text: An hour is far too long to cache
        feedback: >-
          The next line already names that trade-off. The length depends on the requirement.
      - text: Falling back to the model is wasteful
        feedback: >-
          Failing open to the model keeps the product working. That's a good call.
    fix: |
      requirement: how stale may an answer be when a doc changes?
      design: cache for an hour, keyed by question and the user's access group
      trade-off: repeat questions get faster and cheaper
      trade-off: an edited doc shows the old answer for up to an hour
      failure: if the cache is down, call the model as normal

  - type: ai-review
    id: review-deep-dive-answer
    concept: career.seniority-signals
    difficulty: 3
    language: yaml
    request: Tighten my deep-dive answer about the ticket triage model.
    flawClass: logic
    code: |
      situation: support tickets waited a day to reach the right team
      decision: I chose a small classifier over a large model per ticket
      reason: it answered in 50 ms and cost a hundredth as much
      result: the team moved to the latest framework
      next: I'd add a review queue for low-confidence tickets
    prompt: >-
      A deep-dive answer needs a decision, its reason and what it changed. Tap the line that
      breaks the chain.
    lines: [4]
    reasons:
      - text: It names a tool, not an outcome
        correct: true
        feedback: >-
          Right. Say what changed: tickets routed in minutes, fewer handed back.
      - text: '"I chose" should be "we chose"'
        feedback: >-
          They're scoring you, so "I" is right. Credit the team elsewhere in the story.
      - text: Mentioning what's next looks unfinished
        feedback: >-
          Naming the next step shows judgement. Interviewers often ask for it anyway.
    fix: |
      situation: support tickets waited a day to reach the right team
      decision: I chose a small classifier over a large model per ticket
      reason: it answered in 50 ms and cost a hundredth as much
      result: tickets reached the right team within minutes, not a day
      next: I'd add a review queue for low-confidence tickets

  - type: explain-back
    id: explain-senior-answer
    concept: career.seniority-signals
    difficulty: 4
    prompt: >-
      An interviewer asks: "Should our assistant use a larger model?" Answer in three
      sentences, the way you would in the room.
    rubric:
      - It asks what the requirement is first, such as quality, speed or cost.
      - It names a trade-off, such as a larger model being slower and dearer.
      - It says how you'd decide, such as running both on the same eval set.
    modelAnswer: >-
      First I'd ask what's wrong today: wrong answers, slow answers or cost. A larger model
      may answer better, but it's slower and costs more per call. So I'd run both on our eval
      set of real questions. I'd switch only if quality rises enough to pay for it.

recap:
  - Name the rounds of a senior AI loop and what each one scores.
  - Answer in order, requirements, design, trade-off, failure, measure.
  - Tell a deep dive as a decision, its reason and its result.
recall:
  - id: card-rounds
    concept: career.interview-rounds
    front: Which rounds does a senior AI engineering loop usually include?
    back: >-
      Coding, system design, a project deep dive, behavioural, and often an applied AI round
      on quality, failures and cost.
  - id: card-deep-dive
    concept: career.interview-rounds
    front: What does a project deep dive test that a design round doesn't?
    back: >-
      Whether you owned the real decisions in a system you built, and can defend them.
  - id: card-senior-order
    concept: career.seniority-signals
    front: In what order does a senior answer to a design question go?
    back: >-
      Requirements, the design, its trade-off, how it fails, and how you'd measure it.
  - id: card-senior-signal
    concept: career.seniority-signals
    front: What should a deep-dive answer end with, besides the decision?
    back: >-
      Its reason and a checkable result, not a tool name.

