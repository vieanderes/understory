term: authentication
aka:
  - authn
  - auth
short: Checking that someone really is who they say they are.
explain: |
  Logging in with a password, a passkey or a code from your phone proves who you are. The
  server then remembers that proof, usually with a session cookie or a token.

  It answers one question only: *who is this?* Whether they may do something is a separate
  question, and mixing the two up is behind many security bugs.
analogy: Showing your passport at the airport. It proves you're you; it doesn't say which plane you may board.
usage: Authentication passed, but we never checked the user owns that invoice.
twin:
  term: authorisation
  difference: Authentication asks who you are. Authorisation asks what you're allowed to do, and it happens on every request, after authentication.
related:
  - authorisation
  - cookie
  - session
  - jwt
level: 1
lessons:
  - security.broken-auth
