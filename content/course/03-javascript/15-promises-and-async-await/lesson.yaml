deepDive: >-
  Before `await` there was `then`. `loadForecast("Leeds").then((forecast) => show(forecast))`
  runs the callback when the value arrives, and returns a new promise holding whatever the
  callback returns. Forget the `return` inside braces, and the next `then` receives
  `undefined`. `await` is built on the same machinery.


  `new Promise((resolve) => setTimeout(resolve, 400))` turns a timer into a promise. The
  function you pass runs at once, and calling `resolve` fulfils the promise. The playground's
  stand-in server works that way.


  There are two more combinators. `Promise.race` settles like the first input to settle,
  success or failure, which suits a timeout. `Promise.any` fulfils with the first success.


  A rejection nobody handles is reported by the host. Browsers fire an `unhandledrejection`
  event and log "Uncaught (in promise)". Node, which runs JavaScript outside the browser,
  stops the program with an error by default.


  `Promise.all` cancels nothing. When one input rejects, the others keep running and their
  results are dropped. Unlimited parallel work also has a cost: a small pool, as in
  `mapWithLimit`, keeps most of the speed and caps the load on the server.
