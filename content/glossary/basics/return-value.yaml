term: return value
aka: [return]
short: The result a function hands back to the code that called it.
explain: |
  A function that works out a total is no use if the total stays inside it. `return total;`
  sends it back, so the caller can keep it: `const bill = sum(prices);`.

  `return` also ends the function at once, so code after it never runs. A function without
  `return` hands back `undefined`. That's why a function that only logs its answer leaves
  the caller with nothing.
analogy: A cash machine. You put in a request, and something comes out of the slot for you to keep.
example:
  language: js
  code: |
    function double(n) {
      return n * 2;
    }
    const result = double(4);
    console.log(result); // 8
usage: It prints the right number but the total is undefined, so the function needs a return value, not a log.
twin:
  term: console-log
  difference: A return value goes back to your code, which can store it and work with it. `console.log` only shows a value to a person reading the output.
related: [function, console-log, expression, guard-clause]
level: 1
lessons: [basics.functions]
