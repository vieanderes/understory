term: structured output
aka:
  - JSON mode
short: A model reply in a fixed machine-readable shape, usually JSON matching a schema, so code can read it.
explain: |
  Code can't read "Sure, the category is probably billing." It needs
  `{"category": "billing"}`. So you ask the model, or force it, to answer in an exact JSON
  shape.

  Even then, treat the reply as untrusted input. Parse it, validate it against the schema,
  and on failure retry once with the error or reject it. A valid shape can still hold a wrong
  value.
analogy: A form with boxes instead of a blank page. Far quicker to process, but someone can still write nonsense in a box.
example:
  language: ts
  code: |
    const Ticket = z.object({
      category: z.enum(['billing', 'bug', 'other']),
      urgent: z.boolean(),
    });
    const ticket = Ticket.parse(JSON.parse(reply));
usage: Switch to structured output and validate it; the regex on the reply breaks every week.
