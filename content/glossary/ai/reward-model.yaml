term: reward model
aka: [outcome reward model, process reward model]
short: A model trained to score answers, used as the target when another model is trained.
explain: |
  Reinforcement learning needs a score for every attempt. People can't score millions of
  answers, so a model learns to do it from their rankings. That scorer is the reward model.

  An outcome reward model scores only the final answer. A process reward model scores each
  step, which shows where the reasoning broke but costs far more to label. Either way, the
  trained model learns to satisfy the scorer, not the truth, so scorer flaws become habits.
analogy: A practice examiner who marks your mock papers. You get very good at whatever that examiner rewards.
usage: The reward model loves long answers, so the fine-tuned version pads everything.
related: [rlhf, reward-hacking, llm-as-judge]
level: 3
lessons: [ai.reasoning-and-training]
