summary: >-
  Control flow is the shape of a function: which lines run, in what order, under which
  conditions. Deeply nested `if`s make that shape hard to see. To know whether a line runs,
  the reader has to hold every condition above it in mind, and a missing `else` or a path
  with no `return` hides easily in the staircase.


  Three techniques flatten it. **Guard clauses** deal with special cases at the top and
  return early, so the main path runs unindented to the end of the function. **Dropping
  `else` after `return`** removes a level that adds nothing. **Lookup tables** replace a
  chain of branches that only choose a value, or a function, with data: a `Map` from key to
  result.


  TypeScript adds one more tool. A **discriminated union** lists every case a value can be,
  and an exhaustiveness check with `never` turns a forgotten case into a compile error
  rather than a silent `undefined` in production. Together these keep functions readable
  top to bottom and make the compiler, not the reviewer, catch the missing branch.
remember:
  - A guard clause handles a special case at the top of a function and returns, so the main path stays unindented.
  - After an `if` that returns, an `else` adds a level of nesting and nothing else.
  - Each level of nesting is one more condition the reader must hold in mind, so treat three or more as a warning.
  - A chain of branches that only picks a value or a function becomes a lookup table, usually a `Map`.
  - Use a `Map` for lookups on outside input, because a plain object also finds inherited keys like `constructor`.
  - A discriminated union plus a `never` check in the `default` branch makes the compiler reject a switch that misses a case.
  - "In a loop, `continue` is the guard clause: skip the items you don't want and keep the main work flat."
sections:
  - title: Guard clauses in practice, including loops
    body: |-
      Guards work anywhere a nested condition protects the real work. Validation at the top
      of a function is the common case, and loops have their own guard: `continue`.

      ```js
      // Before: the real work sits three levels deep.
      function remindersToSendBefore(bookings, today) {
        const reminders = [];
        for (const booking of bookings) {
          if (booking.status === 'confirmed') {
            if (booking.guestEmail) {
              if (booking.startDay - today === 1) {
                reminders.push({ to: booking.guestEmail, bookingId: booking.id });
              }
            }
          }
        }
        return reminders;
      }

      // After: each rule is one line, and the main path is flat.
      function remindersToSend(bookings, today) {
        const reminders = [];
        for (const booking of bookings) {
          if (booking.status !== 'confirmed') continue;
          if (!booking.guestEmail) continue;
          if (booking.startDay - today !== 1) continue;
          reminders.push({ to: booking.guestEmail, bookingId: booking.id });
        }
        return reminders;
      }

      const bookings = [
        { id: 1, status: 'confirmed', guestEmail: 'a@example.com', startDay: 11 },
        { id: 2, status: 'cancelled', guestEmail: 'b@example.com', startDay: 11 },
        { id: 3, status: 'confirmed', guestEmail: '', startDay: 11 },
        { id: 4, status: 'confirmed', guestEmail: 'd@example.com', startDay: 12 },
      ];
      console.log(remindersToSend(bookings, 10)); // [ { to: 'a@example.com', bookingId: 1 } ]
      console.log(remindersToSendBefore(bookings, 10)); // the same
      ```

      Inverting a condition is where bugs creep in. `a && b` inverted is `!a || !b`, not
      `!a && !b`. Writing one guard per condition, as above, avoids the algebra and makes
      each rule deletable on its own. Run the old and new versions against the same data
      before you delete the old one.

      Optional chaining and `??` flatten a different staircase: a chain of null checks.
      `order?.customer?.address?.city ?? 'Unknown'` replaces three nested `if`s.

      Guards are for exceptions to the main path. When two branches are equally normal,
      such as members and guests paying different prices, a plain `if` and `else` says
      "one of these two" more honestly than a guard that pretends one is special.
  - title: Lookup tables beyond values, and when a switch is better
    body: |-
      A lookup table can hold behaviour as well as values. Each entry maps a key to the
      function that handles it, and adding a case is one line.

      ```js
      const EXPORTERS = new Map([
        ['csv', (rows) => rows.map((row) => `${row.name},${row.qty}`).join('\n')],
        ['json', (rows) => JSON.stringify(rows)],
      ]);

      function exportRows(rows, format) {
        const exporter = EXPORTERS.get(format);
        if (!exporter) throw new RangeError(`Unknown format: ${format}`);
        return exporter(rows);
      }

      const rows = [{ name: 'Pen', qty: 2 }];
      console.log(exportRows(rows, 'csv')); // Pen,2
      console.log(exportRows(rows, 'json')); // [{"name":"Pen","qty":2}]
      ```

      A table is also data, so it can be tested on its own, loaded from configuration, or
      extended by a plug-in without touching the function.

      If you do use a plain object, protect the lookup. `Object.hasOwn(LABELS, key)` checks
      only the object's own keys, and `Object.create(null)` makes an object with no
      prototype, so `constructor` isn't there to find. A `Map` avoids the question
      entirely and keeps keys of any type, not only strings.

      Tables fit when the choice is a pure key match. They fit badly when conditions are
      ranges or combinations, such as "over 65, or a student on a weekday". An `if` chain or
      a `switch` says that more clearly. With `switch`, remember that a `case` without
      `break` or `return` falls through into the next one. Returning from every case, as
      in the next section, removes that risk.
  - title: Discriminated unions and exhaustiveness checks
    body: |-
      A **discriminated union** is a TypeScript type made of several object shapes that
      share one literal field, the discriminant. Checking that field narrows the value to
      one shape, so each branch sees only the fields that exist for its case.

      ```ts
      type Shape =
        | { kind: 'circle'; radius: number }
        | { kind: 'square'; side: number }
        | { kind: 'rectangle'; width: number; height: number };

      function assertNever(value: never): never {
        throw new Error(`Unhandled case: ${JSON.stringify(value)}`);
      }

      function area(shape: Shape): number {
        switch (shape.kind) {
          case 'circle':
            return Math.PI * shape.radius ** 2;
          case 'square':
            return shape.side ** 2;
          case 'rectangle':
            return shape.width * shape.height;
          default:
            return assertNever(shape);
        }
      }

      console.log(area({ kind: 'rectangle', width: 2, height: 3 })); // 6
      ```

      In the `default` branch, every case has been handled, so TypeScript narrows `shape`
      to `never`, the type with no values. Passing it to a parameter of type `never` is
      allowed. Now delete the `rectangle` case, and the call no longer compiles:

      ```text
      error TS2345: Argument of type '{ kind: "rectangle"; width: number; height: number; }'
      is not assignable to parameter of type 'never'.
      ```

      Adding a `triangle` to the union gives the same error, naming the triangle. It points
      at every switch on `Shape` that needs the new case. At run time, `assertNever` still
      throws if bad data sneaks past the types, for example from an API.

      Lookup tables get the same guarantee from `satisfies Record<Status, string>`. The
      table then must have exactly one entry per member of `Status`: a missing key and an
      unknown key are both compile errors.

      ```ts
      type Status = 'new' | 'paid' | 'shipped';

      const STATUS_LABELS = {
        new: 'New',
        paid: 'Paid',
        shipped: 'On its way',
      } satisfies Record<Status, string>;

      function statusLabel(status: Status): string {
        return STATUS_LABELS[status];
      }

      console.log(statusLabel('shipped')); // On its way
      ```

      This object lookup is safe because `status` is typed as `Status`. For raw user input,
      validate the string into a `Status` first, or use a `Map`.
pitfalls:
  - "**Inverting a compound condition wrongly.** Turning `if (a && b)` into a guard needs `if (!a || !b) return`, and people write `!a && !b`. Split it into one guard per condition instead."
  - "**Keeping `else` after `return`.** `if (x) { return 1; } else { return 2; }` adds a level for nothing. Drop the `else`; the code after the `if` only runs when it didn't return."
  - "**A nested path with no return.** An `else` attached to the wrong `if` leaves one path falling off the end and returning `undefined`. Flatten with guards, and in TypeScript declare the return type so a missing return is a compile error."
  - "**Plain objects as lookup tables for user input.** `LABELS[input]` finds `constructor` and `toString` on every object. Use a `Map`, `Object.hasOwn` or `Object.create(null)`."
  - "**`switch` fall-through.** A `case` without `break` or `return` runs into the next case. Return from every case, or enable the `noFallthroughCasesInSwitch` compiler option."
  - "**A `default` branch that hides new cases.** `default: return 0` on a union means a newly added case silently gets 0. Use `assertNever` in `default` so the compiler flags it."
  - "**Guarding a normal case.** When two branches are equally expected, a guard makes one look like an exception. Use a plain `if` and `else` for a real two-way choice."
verify:
  - lens: breaks
    check: Every path through the function returns a value, and in TypeScript a declared return type makes a missing return a compile error.
  - lens: breaks
    check: Any lookup keyed by user input uses a `Map` or `Object.hasOwn`, so keys like `constructor` can't match inherited properties.
  - lens: confuses
    check: Special cases leave first through guard clauses, and no function nests conditions more than two or three levels deep.
  - lens: confuses
    check: A `switch` over a union ends in `assertNever`, so adding a new case is flagged instead of quietly taking the default.
  - lens: tests
    check: Tests cover each guard's early return and at least one input that should fall through to the default.
interview:
  - question: What is a guard clause and why would you use one?
    answer: >-
      A guard clause is a check at the top of a function, or a loop body, that handles a
      special case and returns or continues immediately. The rest of the function is then
      the main path, unindented, with no conditions to hold in your head. Compared with
      nested `if`s, each rule is one line that can be read, tested or deleted alone, and
      it's much harder to leave a path without a return. The old single-exit rule came from
      languages with manual clean-up, which JavaScript doesn't need. The trade-off: I don't
      use guards for two equally normal branches, where an `if` and `else` says "one of two"
      more honestly.
  - question: When would you replace a switch or if chain with a lookup table?
    answer: >-
      When every branch only maps a key to a value or a handler function, with no other
      logic. Then a `Map` states the mapping as data: adding a case is one line, the table
      can be tested and configured on its own, and the function shrinks to a lookup plus a
      miss case. I use a `Map` rather than a plain object for outside input, because an
      object also finds inherited keys like `constructor`. I keep a `switch` or `if` chain
      when conditions are ranges or combinations, or when TypeScript's narrowing on a
      discriminated union is the point, since each case then gets its own typed fields.
  - question: How do you make TypeScript catch a missing case in a switch?
    answer: >-
      I model the cases as a discriminated union and put an exhaustiveness check in the
      `default` branch. After every case is handled, TypeScript narrows the value to
      `never`, so passing it to `assertNever(value: never)` compiles. If someone adds a new
      member to the union, the value in `default` is no longer `never`, and every switch that
      forgot the case fails to compile, pointing at the exact place. `assertNever` also
      throws at run time in case unvalidated data slips through. For lookup tables, `satisfies
      Record<Status, string>` gives the same guarantee. The cost is small: one helper
      function and the discipline of never writing a catch-all default on a union.
  - question: How much nesting is too much?
    answer: >-
      As a rule of thumb, more than two levels inside a function deserves a second look,
      and three or more is a signal to refactor. Each level is another condition the reader
      has to keep in mind to understand a line, and nesting hides bugs such as an `else`
      attached to the wrong `if` or a path that returns nothing. The fixes are guard clauses
      and early returns, `continue` in loops, extracting the inner block into a named
      function, and lookup tables for value-picking chains. Linters can enforce a limit, for
      example ESLint's `max-depth` rule. It's a heuristic, not a law: a short, clear nested
      block can beat a contorted flat one.
