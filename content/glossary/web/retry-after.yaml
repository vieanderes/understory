term: Retry-After
aka: [ Retry-After header, rate limit headers ]
short: A response header saying how long a client should wait before trying the same request again.
explain: |
  When a server is overloaded or you hit its limit, it answers `429` or `503`. Retrying at
  once makes things worse for everyone, including you.

  This header says how long to wait, in seconds or as a date. Honour it before your own
  backoff. Many APIs also send headers with the remaining quota. A careful client slows down
  before it hits the wall.
analogy: A sign on a shop door saying back in fifteen minutes. Knocking harder won't open it sooner.
example:
  language: http
  code: |
    HTTP/1.1 429 Too Many Requests
    Retry-After: 30
    RateLimit-Remaining: 0
usage: Read Retry-After on a 429 and sleep that long; our fixed one-second retry got us blocked.
related: [ rate-limiting, retry, status-code, http-header ]
level: 2
lessons: [integrations.systems-you-dont-control, interview.llm-client-build, backend.rate-limits]
