id: algo.dependencies
title: 'Dependencies: topological sort'
objective: Order tasks that depend on each other with Kahn's algorithm, run independent ones in stages, and detect when a cycle makes any order impossible.
level: advanced
minutes: 10
concepts: [algo.topological-sort]
prerequisites: [algo.bfs-and-dfs, cs.graphs]
opening:
  text: >-
    You'll put jobs in an order that respects every dependency, and prove when no order
    exists. It's how package managers install and how CI pipelines decide what runs next.

steps:
  - type: prose
    id: picture-topo
    body: |-
      A package manager can't install `app` before `utils` if `app` needs it. Draw each
      package as a box and each "must come first" as an arrow. That's a **dependency
      graph**.

      A **topological sort** lists the boxes so every arrow points forwards. If the arrows
      form a loop, a **cycle**, no such order exists.

      Signals: "depends on", "prerequisite", "must run before", "in what order".

  - type: multiple-choice
    id: spot-topo-signal
    concept: algo.topological-sort
    difficulty: 1
    question: Which task is a topological sort?
    choices:
      - text: Order database migrations that name the ones they need
        correct: true
        feedback: >-
          Yes. "Needs" arrows between items, and you want an order.
      - text: Find the fewest hops between two servers
        feedback: >-
          Fewest hops is breadth-first search on the network, not an ordering.
      - text: List every order six talks could run in
        feedback: >-
          "Every order" is backtracking. Here you want one order that obeys the arrows.
      - text: Merge overlapping maintenance windows
        feedback: >-
          Overlapping windows want a sort by start and one pass.

  - type: prose
    id: kahn-idea
    body: |-
      Give each job a count of unmet dependencies, its **in-degree**. Jobs at zero are
      ready, so they go in a queue.

      Take a job from the front, run it, and lower the count of every job it unlocks. Any
      that hit zero join the queue. That's **Kahn's algorithm**: O(jobs + dependencies).
      In Python, `collections.deque` is the queue, with an O(1) `popleft()`.

  - type: parsons
    id: arrange-kahn
    concept: algo.topological-sort
    difficulty: 2
    language: python
    prompt: >-
      `needs` counts each package's unmet dependencies. `unlocks` lists what each one
      unlocks. Arrange Kahn's loop, returning `None` when a cycle blocks the install.
    blocks:
      - id: fill-ready
        code: ready = deque(p for p in packages if needs[p] == 0)
        subgoal: Queue what's ready
      - id: start-order
        code: order = []
      - id: loop
        code: 'while ready:'
        subgoal: Run one, unlock the rest
      - id: take-front
        code: package = ready.popleft()
        indent: 1
      - id: record
        code: order.append(package)
        indent: 1
      - id: each-unlocked
        code: 'for nxt in unlocks[package]:'
        indent: 1
      - id: lower-count
        code: needs[nxt] -= 1
        indent: 2
      - id: check-zero
        code: 'if needs[nxt] == 0:'
        indent: 2
      - id: enqueue
        code: ready.append(nxt)
        indent: 3
      - id: finish
        code: return order if len(order) == len(packages) else None
        subgoal: Check nothing was left behind
    distractors:
      - id: return-order
        code: return order
        feedback: >-
          With a cycle, that returns a partial order as if all is well.
      - id: check-positive
        code: 'if needs[nxt] > 0:'
        feedback: >-
          A package is ready when nothing is left to wait for: zero, not more than zero.

  - type: multiple-choice
    id: leftover-jobs
    concept: algo.topological-sort
    difficulty: 2
    question: Kahn's loop ends with 3 of 5 jobs run. What do the other two tell you?
    choices:
      - text: They sit on a cycle, or wait on one
        correct: true
        feedback: >-
          Right. Their counts never reached zero, so no valid order exists.
      - text: They have no dependencies
        feedback: >-
          Jobs with no dependencies start at zero and run first. These never got to zero.
      - text: The queue ran them out of order
        feedback: >-
          The queue only holds ready jobs. These two were never ready, so they never went in.
      - text: The loop needs one more pass
        feedback: >-
          Another pass would find the same counts. Nothing is left that could lower them.

  - type: ai-review
    id: review-missing-cycle-check
    concept: algo.topological-sort
    difficulty: 3
    language: js
    request: Return an install order for the packages, where deps are [before, after] pairs.
    flawClass: edge-case
    code: |
      function installOrder(packages, deps) {
        const needs = new Map(packages.map((p) => [p, 0]));
        const unlocks = new Map(packages.map((p) => [p, []]));
        for (const [before, after] of deps) {
          needs.set(after, needs.get(after) + 1);
          unlocks.get(before).push(after);
        }
        const ready = packages.filter((p) => needs.get(p) === 0);
        for (const job of ready) for (const next of unlocks.get(job)) {
          needs.set(next, needs.get(next) - 1);
          if (needs.get(next) === 0) ready.push(next);
        }
        return ready;
      }
    prompt: >-
      An assistant wrote this. With `a` needing `b` and `b` needing `a`, it returned
      `['c']`, and the install went ahead. Tap the line at fault.
    lines: [13]
    reasons:
      - text: A short order comes back as if complete
        correct: true
        feedback: >-
          Yes. Compare lengths, and return `null` when jobs were left behind.
      - text: The loop skips items pushed during it
        feedback: >-
          `for...of` on an array also visits items pushed during the loop. New ones are reached.
      - text: '`filter` runs before the counts are ready'
        feedback: >-
          It runs after the counting loop, so the counts are complete by then.
    fix: |
      return ready.length === packages.length ? ready : null;

  - type: code-challenge
    id: write-build-stages
    concept: algo.topological-sort
    difficulty: 4
    language: ts
    prompt: >-
      A CI runner starts every job whose dependencies are done, in parallel. Write
      `buildStages(jobs, deps)`: each dependency is `[before, after]`. Return the stages:
      first the jobs with no dependencies, then each job in the stage after its last
      dependency. Sort each stage with `sort()`. On a cycle, return `null`.


      Jobs `a`, `b`, `c` with deps `[['a', 'b'], ['a', 'c']]` give `[['a'], ['b', 'c']]`.


      **Target:** O(jobs + deps), plus the sorts, for up to 200,000 jobs. The tests include
      no jobs, a job that needs itself, and a chain of 200,000. Scanning every job for ready
      ones, stage after stage, runs out of time.
    hints:
      - Count each job's unmet dependencies, and list which jobs each one unlocks.
      - The first stage is every job at zero. Finishing a stage lowers counts; jobs reaching zero form the next stage.
      - 'Count the jobs you placed. If it''s fewer than `jobs.length`, return `null`.'

  - type: explain-back
    id: explain-leftover-cycle
    concept: algo.topological-sort
    difficulty: 4
    prompt: >-
      Talk the interviewer through `buildStages`: how it works, why leftover jobs prove a
      cycle, and what it costs.
    rubric:
      - Count unmet dependencies; zero-count jobs form a stage, and running a stage lowers counts.
      - Each leftover job waits on another leftover job, so following the waits must loop.
      - Each job and each dependency is handled once, so O(jobs + deps) plus sorting each stage.
    modelAnswer: >-
      I count each job's unmet dependencies. Jobs at zero form the first stage. Running a
      stage lowers the counts of what it unlocks, and jobs reaching zero form the next. If
      some jobs never reach zero, each still waits on another leftover job. Follow those
      waits and you must come back round, which is a cycle. Each job and dependency is
      touched once, so it's O(jobs + deps), plus sorting each stage.

recap:
  - Spot a dependency order from "needs", "before" and "prerequisite".
  - Order jobs with Kahn's algorithm and a queue that takes from the front in O(1).
  - Treat leftover jobs as proof of a cycle, and return null.
recall:
  - id: card-in-degree
    concept: algo.topological-sort
    front: In Kahn's algorithm, when does a job join the queue?
    back: >-
      When its count of unmet dependencies, its in-degree, drops to zero.
  - id: card-cycle-check
    concept: algo.topological-sort
    front: How does Kahn's algorithm detect a cycle?
    back: >-
      Fewer jobs come out than went in. The leftover ones wait on each other in a loop.
  - id: card-topo-signals
    concept: algo.topological-sort
    front: What words in a task point at a topological sort?
    back: >-
      "Depends on", "prerequisite", "must run before" or "in what order", with items that
      name other items.

