term: shadow mode
aka: [shadow run, shadow deployment, shadow traffic, dark launch]
short: Running a new version on real traffic in parallel, recording its results without letting them reach users.
explain: |
  Tests use cases you thought of. Real traffic has the ones you didn't. In shadow mode the
  new model or rule sees every live request, but only the old one's answer is used.

  You compare the two side by side: where they disagree, what each would have cost, how
  often the new one would have acted alone. Users see no risk, but you pay for every
  request twice.
analogy: A trainee driver with dual controls. They steer every lesson, but the instructor's pedals decide.
usage: Run the new classifier in shadow mode for a week before it closes any tickets by itself.
twin:
  term: canary-release
  difference: In shadow mode the new version's results are discarded. In a canary release a small share of users really get them.
related: [canary-release, eval, feature-flag, confidence-threshold]
level: 2
lessons: [aisys.llmops, aisys.thresholds-and-calibration]
