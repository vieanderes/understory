    verified: true

deepDive: >-
  The ratio compares relative luminance, a measure of lightness weighted for the eye:
  `(L1 + 0.05) / (L2 + 0.05)`, lighter over darker. `#777777` on white is 4.48 and fails;
  `#767676` is 4.54 and passes. Checkers don't round in your favour.


  Large text means 24 CSS pixels, or about 18.7 pixels in bold. The 3 to 1 line for
  controls, from rule 1.4.11, covers input borders, icons and focus rings.


  A checker such as axe finds the problems it can measure: contrast, missing names, missing
  labels. It can't tell whether a name makes sense or whether focus order matches
  the layout. That's what the keyboard and the screen reader are for.


  About 8% of men and 0.5% of women with northern European ancestry have a red-green colour
  vision deficiency.
