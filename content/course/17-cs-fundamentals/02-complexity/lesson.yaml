id: cs.complexity
title: Complexity
objective: Spot code that slows down as data grows, and swap in a faster lookup.
level: essential
minutes: 10
concepts: [cs.counting-operations, cs.big-o, cs.growth-rates]
prerequisites: [js.arrays]
opening:
  text: >-
    Some code is instant with ten items and freezes the page with ten thousand. You'll learn
    to spot it by its shape, and fix the most common case with a Set.

steps:
  - type: prose
    id: name-counting
    body: >-
      Speed depends on the line that **runs most often**, as the input grows. We call the
      input's size **n**.


      ```js
      for (const guest of guests) {
        printBadge(guest);          // n times
      }

      for (const host of guests) {
        for (const guest of guests) {
          compare(host, guest);     // n × n times
        }
      }
      ```


      A loop **inside** a loop does a pass for every item: a million steps for 1,000 guests.
      You read the shape instead of counting.

  - type: prose
    id: name-big-o
    body: >-
      **Big-O** is shorthand for that answer. One loop over n items is **O(n)**, said "order
      n". A loop inside a loop is **O(n²)**.


      It keeps only the part that grows fastest, and drops fixed numbers. A loop that does 3
      steps per item is still O(n). What matters is the shape: double n, and O(n) doubles,
      while O(n²) goes up four times.

  - type: multiple-choice
    id: pick-two-loops-in-a-row
    concept: cs.big-o
    difficulty: 2
    language: js
    code: |
      let steps = 0;
      for (const guest of guests) {
        steps = steps + 1;      // print a name badge
      }
      for (const guest of guests) {
        steps = steps + 1;      // print a place card
      }
    question: With 1,000 guests this made 2,000 steps. What's its Big-O?
    choices:
      - text: O(n)
        correct: true
        feedback: >-
          Right. Twice n is still a straight line. Big-O drops the 2.
      - text: O(n²)
        feedback: >-
          The loops run one after the other, not one inside the other. The counts add. They
          don't multiply.
      - text: O(2n)
        feedback: >-
          The count is right, but Big-O drops fixed numbers. It only keeps how the cost
          grows.

  - type: prose
    id: name-growth-rates
    body: >-
      A few shapes cover nearly all code. From cheapest:


      - **O(1)**, constant: the same cost at any size, like `list[0]`.

      - **O(log n)**, logarithmic: each step throws half away, like opening a dictionary in
        the middle to find a word.

      - **O(n)**, one loop.

      - **O(n log n)**, what `sort` costs.

      - **O(n²)**, a loop in a loop.

      - **O(2ⁿ)**, doubling with every extra item, like trying every mix of pizza toppings.

  - type: playground
    id: race-three-loops
    concept: cs.growth-rates
    difficulty: 2
    prompt: >-
      Three loops race on the same input. At n = 10 they look alike. Change `n` to 1000, and
      watch which bar takes over and which one all but vanishes.
    html: |
      <p id="size"></p>
      <p>One loop: <span id="one"></span></p>
      <div class="bar" id="one-bar"></div>
      <p>Loop in a loop: <span id="nested"></span></p>
      <div class="bar" id="nested-bar"></div>
      <p>Halving: <span id="halving"></span></p>
      <div class="bar" id="halving-bar"></div>
    css: |
      .bar { height: 12px; background: #333; min-width: 2px; }
    js: |
      let n = 10;
      let one = 0;
      let nested = 0;
      let halving = 0;
      for (let i = 0; i < n; i++) {
        one = one + 1;
        for (let j = 0; j < n; j++) nested = nested + 1;
      }
      for (let size = n; size > 1; size = Math.floor(size / 2)) halving = halving + 1;
      function show(id, steps) {
        document.querySelector("#" + id).textContent = steps + " steps";
        document.querySelector("#" + id + "-bar").style.width = (100 * steps) / nested + "%";
      }
      show("one", one); show("nested", nested); show("halving", halving);
      document.querySelector("#size").textContent = "n = " + n;
    editable: [js]
    checks:
      - label: The race runs with `n` at 1000
        selector: '#size'
        text: n = 1000
    solution:
      js: |
        let n = 1000;
        let one = 0;
        let nested = 0;
        let halving = 0;
        for (let i = 0; i < n; i++) {
          one = one + 1;
          for (let j = 0; j < n; j++) nested = nested + 1;
        }
        for (let size = n; size > 1; size = Math.floor(size / 2)) halving = halving + 1;
        function show(id, steps) {
          document.querySelector("#" + id).textContent = steps + " steps";
          document.querySelector("#" + id + "-bar").style.width = (100 * steps) / nested + "%";
        }
        show("one", one); show("nested", nested); show("halving", halving);
        document.querySelector("#size").textContent = "n = " + n;
    hints:
      - '`n` is set on the first line of the script.'
      - Each bar is drawn against the loop in a loop, the biggest count.
      - 'Change the first line to `let n = 1000;`.'

  - type: prose
    id: name-set-lookup
    body: >-
      The most common slow shape hides the inner loop. `list.includes(x)` walks the list from
      the start until it finds `x`. Call it inside a loop, and you have a loop in a loop.


      A **Set** fixes it. You met `new Set(list)` already. Its `has` method
      answers "is this in here?" without walking anything. It jumps straight to the right
      spot, which is O(1).


      ```js
      const blockedSet = new Set(blocked);   // one pass to build it
      blockedSet.has("spam3@mail.test");     // true, without a loop
      ```

  - type: playground
    id: fix-slow-blocklist
    concept: cs.big-o
    difficulty: 3
    prompt: >-
      Bug report: the order screen hangs on every load. It checks 3,000 orders against 3,003
      blocked emails. Run it and read the counter. Then change `isBlocked` to use a Set, and
      count one look per order.
    html: |
      <h1>Order check</h1>
      <p id="result"></p>
    js: |
      const orders = [];
      const blocked = ["buyer7@mail.test", "buyer420@mail.test", "buyer2999@mail.test"];
      for (let i = 0; i < 3000; i++) {
        orders.push("buyer" + i + "@mail.test");
        blocked.push("spam" + i + "@mail.test");
      }
      let looks = 0;
      function isBlocked(email) {
        looks = looks + blocked.length;    // includes can walk the whole list
        return blocked.includes(email);
      }
      const flagged = orders.filter((email) => isBlocked(email));
      document.querySelector("#result").textContent = flagged.length + " flagged after " + looks + " looks";
    editable: [js]
    checks:
      - label: The same 3 orders are flagged, after 3000 looks
        selector: '#result'
        text: 3 flagged after 3000 looks
    solution:
      js: |
        const orders = [];
        const blocked = ["buyer7@mail.test", "buyer420@mail.test", "buyer2999@mail.test"];
        for (let i = 0; i < 3000; i++) {
          orders.push("buyer" + i + "@mail.test");
          blocked.push("spam" + i + "@mail.test");
        }
        let looks = 0;
        const blockedSet = new Set(blocked);
        function isBlocked(email) {
          looks = looks + 1;                 // has jumps straight to the answer
          return blockedSet.has(email);
        }
        const flagged = orders.filter((email) => isBlocked(email));
        document.querySelector("#result").textContent = flagged.length + " flagged after " + looks + " looks";
    hints:
      - '`includes` walks `blocked` for every order. That''s the hidden loop in a loop.'
      - Build `new Set(blocked)` once, outside the function.
      - 'Inside `isBlocked`, add 1 to `looks` and return `blockedSet.has(email)`.'

  - type: ai-review
    id: review-nested-duplicate-check
    concept: cs.counting-operations
    difficulty: 4
    language: js
    request: Write a function that says whether a guest list has the same name twice.
    flawClass: performance
    code: |
      function hasDuplicate(names) {
        for (let i = 0; i < names.length; i++) {
          for (let j = 0; j < names.length; j++) {
            if (i !== j) {
              if (names[i] === names[j]) return true;
            }
          }
        }
        return false;
      }
    prompt: >-
      An assistant wrote this. It's correct, and the test list had 10 names, so it answered at
      once. On a real list of 20,000 names with no duplicate, it froze the page for a second
      and a half. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`i !== j` should be `i === j`'
        feedback: >-
          That check stops a name matching itself, and it's right. The answers are correct.
          The cost is the trouble.
      - text: The inner loop makes it O(n²)
        correct: true
        feedback: >-
          Yes. Every name meets every other name. A Set's size check takes milliseconds.
      - text: '`return true` ends the search too early'
        feedback: >-
          One duplicate is all the question asks for, so stopping there is fine. It's the
          no-duplicate case that crawls.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Time it on 20,000 names with no repeat
          correct: true
          feedback: >-
            Yes. No repeat means every pair gets compared.
        - text: Check a list with a repeat returns true
          feedback: >-
            A repeat ends the search early. The slowest case is a list with no repeat.
        - text: Check an empty list returns false
          feedback: >-
            That's correct and instant. Small inputs hide the cost.
    fix: |
      function hasDuplicate(names) {
        // a Set drops repeats, so a smaller Set means a name came twice
        return new Set(names).size !== names.length;
      }

  - type: code-challenge
    id: write-repeat-customers
    concept: cs.big-o
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: repeat.starter.py
      solution: repeat.solution.py
      tests: repeat.tests.py
    prompt: >-
      A shop wants to thank returning customers. Write `repeatCustomers(yesterday, today)`.
      Both are arrays of emails. Return the emails in `today` that also appear in
      `yesterday`, in `today`'s order.


      The tests use 20,000 emails a day. A loop in a loop runs out of time, so use a Set.
    hints:
      - '`today.filter(...)` keeps the emails you want. The question is how each one checks.'
      - '`yesterday.includes(email)` walks the whole list for every email. Build a Set first.'
      - 'Start with `const seen = new Set(yesterday);`, then filter with `seen.has(email)`.'

  - type: explain-back
    id: explain-fine-in-testing
    concept: cs.big-o
    difficulty: 4
    audience: incident
    kind: risk
    prompt: >-
      In the incident channel: search froze once the real catalogue of 50,000 products went
      live. Tests with 100 passed. What's your likely cause, and how would you check?
    rubric:
      - The cost likely grows faster than the data, such as a loop inside a loop, which is O(n²).
      - With 100 items even O(n²) feels instant, so small test data hid the shape.
      - Check by timing the search at 1,000 and 10,000 items, then find the inner loop and use a Set or Map.
    modelAnswer: >-
      Most likely the search does a whole pass over the products for every product: a loop
      inside a loop, O(n²). With 100 items that's too quick to feel. With 50,000 it's 2.5
      billion steps. To check, I'd time it at 1,000 and 10,000 items. If ten times the data
      takes about a hundred times longer, that's the shape. Then I'd find the hidden inner
      loop, often an `includes` in a `filter`, and swap in a Set.

recap:
  - Find the line that runs most often, and ask how it grows with the input size n.
  - Read Big-O from the loops, where one loop is O(n) and a loop in a loop is O(n²).
  - Spot `includes` inside a loop, and swap it for a Set's `has`.

recall:
  - id: card-count-steps
    concept: cs.counting-operations
    front: How do you find the cost of a piece of code?
    back: >-
      Find the line that runs most often, and ask how its runs grow with the input size n.
      Read the shape of the loops rather than counting by hand.
  - id: card-big-o-drops
    concept: cs.big-o
    front: A function makes 2n + 3 steps. What's its Big-O, and why?
    back: >-
      O(n). Big-O keeps the fastest-growing part and drops fixed numbers, because only the
      shape of the growth matters.
  - id: card-nested-loop
    concept: cs.big-o
    front: n grows 10 times. What happens to the cost of a loop inside a loop?
    back: >-
      It grows 100 times. A nested loop over the same list is O(n²), so the growth is squared.
  - id: card-growth-order
    concept: cs.growth-rates
    front: Put these in order, cheapest first. O(n²), O(log n), O(n), O(1).
    back: >-
      O(1), O(log n), O(n), O(n²). Constant, halving, one loop, a loop in a loop.
  - id: card-set-lookup
    concept: cs.big-o
    front: Why is `list.includes(x)` inside a loop slow on big data, and what's the fix?
    back: >-
      `includes` walks the list, so inside a loop it's a loop in a loop, O(n²). Build
      `new Set(list)` once and use `has`, which jumps straight to the answer.

references:
  - kind: paper
    title: Big Omicron and big Omega and big Theta
    authors: Donald E. Knuth
    year: 1976
    venue: ACM SIGACT News, 8(2)
    url: https://doi.org/10.1145/1008328.1008329
    note: Where the O, Omega and Theta notation used in computing today was pinned down.
    primary: true
    verified: true
  - kind: spec
    title: 'ECMAScript Language Specification: Array.prototype.sort'
    authors: Ecma TC39
    venue: Ecma International, ECMA-262
    url: https://tc39.es/ecma262/multipage/indexed-collections.html#sec-array.prototype.sort
    note: The sort behind the O(n log n) shape. Engines implement it in O(n log n).
    verified: true

deepDive: >-
  The timings are from Node 24 on a laptop. The nested duplicate check took 6 ms for 1,000
  names and 1.5 seconds for 20,000. The Set version took 11 ms for 100,000. The order screen
  counted about nine million looks with `includes`, and 3,000 with the Set.


  Big-O is an upper bound: "grows no faster than this". Strictly, an O(n) function is also
  O(n²). In daily use people mean the tightest bound they can give. They also usually mean
  the worst case. The duplicate check is quick when a duplicate sits at the front. It's the
  unlucky input that sets the bound.


  Dropping fixed numbers has limits. An O(n) function with a huge cost per step can lose to an
  O(n²) one while n is small. Big-O tells you who wins in the end, not who wins at n = 10.
  That's why you still measure, as the performance chapter will show.


  A Set's `has` is O(1) on average. It works out a number from the value, called a hash, and
  looks in that one spot. The arrays and hash maps lesson shows how.


  Memory has a Big-O as well. Building a Set from a list costs O(n) extra space. Sorting a
  list in place costs O(1). The same question works: ask how much extra you hold as n grows.
