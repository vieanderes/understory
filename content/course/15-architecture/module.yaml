id: arch
number: 15
title: Architecture
summary: The shape of the code as it grows. Draw boundaries between modules, point dependencies at the business rules, keep the model call behind a port, and split into services only when the costs are paid for.
why: "When every change touches twelve files, the structure is the problem."
youCanBuild: "A modular monolith refactored under tests, with thin handlers, ports for storage and the model, an outbox, and decision records."
concepts:
  - id: arch.coupling
    title: Coupling
    summary: Coupling is how much a change in one module forces a change in another.
    confusableWith: [arch.cohesion]
  - id: arch.cohesion
    title: Cohesion
    summary: Cohesion is how closely the parts of one module serve a single purpose, so a module with high cohesion has one reason to change.
    confusableWith: [arch.coupling]
  - id: arch.information-hiding
    title: Information hiding
    summary: A module hides a design decision that is likely to change behind an interface that is not.
  - id: arch.feature-folders
    title: Feature folders
    summary: Code is grouped by the feature it serves, not by its technical kind, so a change touches one folder.
  - id: arch.public-module-api
    title: Public module APIs
    summary: Each module exposes one entry file, and a lint rule rejects imports that reach past it.
  - id: arch.circular-dependencies
    title: Circular dependencies
    summary: Two modules that import each other, directly or through others, can't be loaded, tested or changed alone, and a value read while the loop is still loading isn't ready yet.
  - id: arch.monorepos
    title: Monorepos
    summary: One repository holds several apps and packages, so a change that crosses them lands in one commit and one review.
    confusableWith: [arch.workspaces]
  - id: arch.workspaces
    title: Workspaces
    summary: "The package manager links a repository's own packages to each other by name, with `workspace:*`, and each package's `exports` field is its public API."
    confusableWith: [arch.monorepos]
  - id: arch.layering
    title: Layering
    summary: Code is arranged in layers, such as handlers, the domain and data access, where each layer calls only the one below it.
    confusableWith: [arch.ports-and-adapters]
  - id: arch.thin-handlers
    title: Thin handlers
    summary: A handler translates between HTTP and one call into the domain, so business rules are testable without a server and every entry point passes them.
  - id: arch.ports-and-adapters
    title: Ports and adapters
    summary: The domain defines a port, an interface for something it needs, and an adapter implements it for one technology.
    confusableWith: [arch.layering]
  - id: arch.dependency-rule
    title: The dependency rule
    summary: Source code dependencies point inward, towards the domain, so the domain imports nothing from frameworks, databases or the network.
  - id: arch.dependency-injection
    title: Dependency injection
    summary: A function is handed what it depends on, such as a store or a model client, instead of importing it, so the caller or a test chooses the adapter.
  - id: arch.model-port
    title: The model behind a port
    summary: The call to a language model lives in one adapter behind a port the app defines, so the prompt, the provider's reply shape and its failures stay in one place and the provider can be swapped.
    confusableWith: [arch.evals-at-the-boundary]
  - id: arch.evals-at-the-boundary
    title: Evals at the boundary
    summary: Unit tests check the app's rules against a fake model, and an eval runs the real adapter on fixed examples and scores the answers, so a prompt or provider change is judged before it ships.
    confusableWith: [arch.model-port]
  - id: arch.invariants
    title: Domain invariants
    summary: An invariant is a rule about the domain that is true after every operation and is enforced in one place.
  - id: arch.state-machines
    title: State machines
    summary: An order or hold is in exactly one named state, and only the listed transitions between states are allowed.
  - id: arch.value-objects
    title: Value objects
    summary: A value object is immutable, compared by its contents, and valid from construction, such as Money or an email address.
  - id: arch.monolith
    title: Monolith
    summary: One deployable unit in which modules call each other in process.
    confusableWith: [arch.modular-monolith]
  - id: arch.modular-monolith
    title: Modular monolith
    summary: One deployable unit whose modules have enforced boundaries and talk only through their public APIs.
    confusableWith: [arch.monolith, arch.services]
  - id: arch.services
    title: Services
    summary: Separately deployed units that communicate over the network and own their data.
    confusableWith: [arch.modular-monolith]
  - id: arch.network-boundary-costs
    title: The cost of a network boundary
    summary: A call across the network adds latency, partial failure, versioning and the loss of a shared transaction.
  - id: arch.events-and-commands
    title: Events and commands
    summary: A command asks one receiver to do something and may be refused, and an event states that something happened to whoever listens.
  - id: arch.outbox
    title: The transactional outbox
    summary: The event is written to a table in the same transaction as the state change, and a relay publishes it afterwards, so neither is lost.
  - id: arch.read-models
    title: Read models and projections
    summary: A projection builds a copy of the data shaped for one screen or query, such as a search index, and it lags behind the writes.
  - id: arch.cqrs
    title: CQRS
    summary: Command query responsibility segregation. Commands change state through one model, and queries read from a separate model shaped for reading.
    confusableWith: [arch.event-sourcing]
  - id: arch.event-sourcing
    title: Event sourcing
    summary: The log of events is the source of truth, and current state is computed by replaying it.
    confusableWith: [arch.cqrs]
  - id: arch.multi-tenancy
    title: Multi-tenancy
    summary: One deployment serves several customers, with their data separated by a tenant column, a schema or a database per tenant.
  - id: arch.tenant-context
    title: Tenant context
    summary: The tenant comes from the signed-in session on the server, never from the request, and one scoped store applies it to every query.
  - id: arch.adrs
    title: Architecture decision records
    summary: A short, numbered note in the repository that records the context of a decision, the choice made and its consequences, and is superseded rather than edited.
  - id: arch.trade-offs
    title: Trade-offs
    summary: Every design choice buys something and costs something, so a decision names both, and the change that would make you revisit it.
  - id: arch.saga-pattern
    title: "Sagas"
    summary: "A saga runs a business process as a series of local steps across systems, because no single transaction can cover them all."
  - id: arch.compensation
    title: "Compensating steps"
    summary: "Each saga step that can fail later is paired with an action that undoes its effect, run in reverse order when the process aborts."
  - id: arch.durable-workflows
    title: "Durable workflow engines"
    summary: "A workflow engine records each step, retries activities and resumes after a crash, so a long process survives restarts."
  - id: arch.deterministic-replay
    title: "Deterministic replay"
    summary: "A durable workflow rebuilds its state by replaying its history, so workflow code must not read the clock or random values directly."
