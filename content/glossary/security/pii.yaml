term: PII
aka: [personally identifiable information, personal data, personal information]
short: Any information that identifies a living person, on its own or combined with other data.
explain: |
  Names, email addresses, phone numbers and bank details are the obvious ones. Less
  obvious: a postcode plus a birth date plus a job title can point at one person too.

  In an AI system it travels far: into prompts, logs, traces, caches, vector stores and eval
  sets. Each copy can leak, and each must be found when someone asks to be deleted. So know
  where it goes, and keep only what the task needs.
analogy: Glitter. Once it's in the room, it turns up on everything, and cleaning it out takes far longer than spilling it.
usage: The trace spans store the full prompt, so they're full of PII; redact before we export them.
related: [redaction, pseudonymisation, data-minimisation, encryption]
level: 1
lessons: [aisys.pii-and-privacy, security.personal-data]
