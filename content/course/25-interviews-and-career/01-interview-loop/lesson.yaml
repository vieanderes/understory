deepDive: >-
  Loops vary a lot. Some companies send a take-home project instead of live coding. Some pair
  program on a real codebase. Some let you code with an AI assistant and grade how you
  check it. Ask the recruiter for the format of every round, and whether AI tools are
  allowed in each. It's a normal question. The chapter Interview challenges trains each
  coding format, from timed tests to a four-hour build you present.


  The applied AI round has no fixed name. It may be called ML depth, LLM systems or
  practical AI. Expect questions such as how you'd build an eval set, and why retrieval
  might return the wrong passage. Others ask how you stop the model inventing an answer,
  or what you'd cut if each request cost too much. The AI engineering and AI systems
  chapters cover each one.


  Hiring panels usually score each round separately against its rubric, then meet to
  decide. One weaker round rarely sinks a strong loop, but a round where you can't explain
  your own past decisions often does.
