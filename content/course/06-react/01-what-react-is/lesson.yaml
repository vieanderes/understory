id: react.what-react-is
title: What React is
objective: "Describe part of a page as a component, write JSX with braces and `className`, and put it on the page with `createRoot`."
level: essential
minutes: 10
concepts: [react.declarative-ui, react.components, react.jsx]
prerequisites: [js.dom-events, js.modules]
opening:
  text: >-
    You'll write your first React component and put it on a page. You'll also see the job
    React takes off your hands, the one behind most interface bugs.

steps:
  - type: prose
    id: by-hand-is-fragile
    body: |-
      In chapter 3 you changed the page by hand. Add an item, and you write two things:

      ```js
      list.append(row);
      count.textContent = "3 items";
      ```

      Every change to the data needs a matching change to the page. Forget the second line
      and the count is wrong.

      There's another way. Keep the data in one place, and draw the page from it.

  - type: playground
    id: draw-from-data
    concept: react.declarative-ui
    difficulty: 1
    prompt: >-
      `render()` draws this page from the `items` array. Add `"Eggs"` to the array. Watch the
      list and the count change together.
    html: |
      <h2>Shopping list</h2>
      <ul id="list"></ul>
      <p id="count"></p>
    js: |
      const items = ["Bread", "Milk"];

      function render() {
        const list = document.querySelector("#list");
        list.textContent = "";
        for (const item of items) {
          const row = document.createElement("li");
          row.textContent = item;
          list.append(row);
        }
        document.querySelector("#count").textContent = `${items.length} items`;
      }

      render();
    editable: [js]
    checks:
      - label: The list has three items
        selector: '#list li'
        count: 3
      - label: The count says 3 items
        selector: '#count'
        text: 3 items
    solution:
      js: |
        const items = ["Bread", "Milk", "Eggs"];

        function render() {
          const list = document.querySelector("#list");
          list.textContent = "";
          for (const item of items) {
            const row = document.createElement("li");
            row.textContent = item;
            list.append(row);
          }
          document.querySelector("#count").textContent = `${items.length} items`;
        }

        render();
    hints:
      - Only the first line needs to change.
      - Put a comma after `"Milk"`, then `"Eggs"` in quotes.

  - type: prose
    id: what-react-is
    body: >-
      You changed the data, and the page followed. That's the idea behind React.


      **React** is a JavaScript **library**: code other people wrote that you import. You
      describe what the page should show for the current data. React works out what to
      change in the DOM, the page's tree of elements, and changes only that. No more
      forgotten second lines.

  - type: prose
    id: components-and-jsx
    body: |-
      In React you build the page from **components**. A component is a function that
      returns what one piece of the page looks like:

      ```jsx
      function Greeting() {
        const name = "Sam";
        return <h1>Hello, {name}</h1>;
      }
      ```

      The HTML-like part is **JSX**. Braces `{}` hold any JavaScript value. Browsers can't
      read JSX, so a build tool turns it into plain JavaScript first.

  - type: fill-blank
    id: fill-weather-braces
    concept: react.jsx
    difficulty: 1
    language: jsx
    prompt: >-
      The card should read `Oslo is sunny today`, taken from the two variables. Fill the gaps.
    template: |
      function Weather() {
        const city = "Oslo";
        const sky = "sunny";
        return <p>{{1}} is {{2}} today</p>;
      }
    blanks:
      - key: '1'
        answer: '{city}'
      - key: '2'
        answer: '{sky}'
    bank: ['{city}', '{sky}', city, sky, '"sky"']

  - type: prose
    id: jsx-rules
    body: >-
      JSX looks like HTML, with a few differences. Write `className`, not `class`. Close
      every tag, so `<img />` and `<br />`.


      A component returns one outer element. For two side by side, wrap them in a
      **fragment**, `<>` and `</>`, which adds nothing to the page. And a component's name
      starts with a capital letter. Lowercase names are HTML tags.

  - type: playground
    id: fix-lowercase-component
    concept: react.components
    difficulty: 2
    prompt: >-
      The card should show a New badge, but it doesn't. Look at the DOM tree, then fix the
      component so New appears.
    jsx: |
      function badge() {
        return <span className="badge">New</span>;
      }

      export default function Card() {
        return (
          <div className="card">
            <badge />
            <h3>Blue mug</h3>
          </div>
        );
      }
    css: |
      .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; font-family: sans-serif; }
      .badge { background: #2f5d50; color: white; padding: 2px 8px; border-radius: 4px; }
    editable: [jsx]
    showTree: true
    checks:
      - label: The card shows the New badge
        selector: span.badge
        text: New
      - label: No `badge` element is left in the tree
        selector: badge
        count: 0
    solution:
      jsx: |
        function Badge() {
          return <span className="badge">New</span>;
        }

        export default function Card() {
          return (
            <div className="card">
              <Badge />
              <h3>Blue mug</h3>
            </div>
          );
        }
    hints:
      - Look at the tree. What sits where the badge should be?
      - JSX reads a lowercase tag as an HTML element, so `badge()` never runs.
      - Rename the function to `Badge`, and write `<Badge />`.

  - type: prose
    id: create-root
    body: |-
      Last step: put a component on the page. The page has one empty `<div id="app">`, and
      React fills it:

      ```jsx
      import { createRoot } from "react-dom/client";

      const root = createRoot(document.querySelector("#app"));
      root.render(<Greeting />);
      ```

      `react-dom` is the part of React that changes the browser's page. A project tool such as
      Vite writes these lines for you.

  - type: code-challenge
    id: build-recipe-card
    concept: react.components
    difficulty: 2
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write `RecipeCard`. It returns an `article` with `className="recipe"`. Inside, an `h2`
      with the recipe's name, then `Serves 4` and `Ready in 20 minutes`, each in a `p`. Use
      braces to read the values from `recipe`.


      Then write `show(container)`. It makes a root in `container` and renders
      `<RecipeCard />` into it.
    hints:
      - The `return` in `RecipeCard` needs one outer element, the `article`, with the rest inside.
      - '`{recipe.name}` puts the name in the heading. Round brackets let JSX run over several lines.'
      - 'In `show`, import `createRoot` from `"react-dom/client"`, then `createRoot(container).render(...)`.'

  - type: explain-back
    id: explain-no-update-line
    concept: react.declarative-ui
    difficulty: 2
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer has only ever changed pages by hand. Their shopping list needs a line that
      updates the count after each new item. Why doesn't a React version need that line?
    rubric:
      - In React you describe what the page should show for the current data.
      - The count is part of that description, worked out from the data each time.
      - React compares and changes the real page itself, so nothing is left to forget.
    modelAnswer: >-
      By hand, the page and the data are two things I keep in step myself, one line at a
      time. In React I write one description: the list and the count, both worked out from
      the items. When the items change, React draws from that description again and changes
      the page to match. There's no separate count update to forget.

recap:
  - Describe a piece of the page as a component that returns JSX.
  - Put values in JSX with braces, and use `className`, fragments and capital names.
  - Put a component on the page with `createRoot` and `root.render`.

recall:
  - id: card-what-react-does
    concept: react.declarative-ui
    front: What do you tell React, and what does React do in return?
    back: >-
      You describe what the page should show for the current data. React works out what to
      change on the real page, and changes only that.
  - id: card-capital-name
    concept: react.components
    front: Why must a component's name start with a capital letter?
    back: >-
      JSX reads a lowercase tag as an HTML element. `<badge />` makes an empty `badge`
      element and never calls your function.
  - id: card-jsx-rules
    concept: react.jsx
    front: Name three ways JSX differs from HTML.
    back: >-
      `className` instead of `class`, every tag closed (`<img />`), and one outer element or a
      fragment `<>...</>`. Braces hold JavaScript values.
  - id: card-create-root
    concept: react.components
    front: Which two lines put `<App />` into `<div id="app">`?
    back: >-
      `const root = createRoot(document.querySelector("#app"));` then `root.render(<App />);`.

