term: document database
aka: [document store, document-oriented database]
short: A data store that keeps each record as one nested JSON-like document, fetched whole.
explain: |
  An order, its lines and its address live together in one document. Read the order, get
  everything in one fetch, with no joins. Each document can have a slightly different shape.

  It's fast when you always read the record whole. It gets awkward when you need to query
  across documents, or keep a copy of shared data in step. A relational database with a
  `jsonb` column covers many of the same needs.
analogy: A folder per customer with every letter inside, instead of one drawer for letters and another for invoices.
usage: The product catalogue suits a document database; each product has different attributes and is read whole.
related: [nosql, relational-database, denormalisation, json]
level: 2
lessons: [sysdesign.sql-or-nosql]
