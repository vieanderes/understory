title: Syntax refresher for coding rounds
summary: >-
  A compact reference for writing code by hand under a timer. It puts JavaScript, TypeScript
  and Python side by side, so you can map one language onto another, and adds the standard
  library calls a coding round expects: stacks, queues, heaps, binary search and memoisation.
  It closes with the HTML and CSS you need to read a front-end task, a complexity cheat sheet
  and a checklist to run before you submit. Every block has been run, and the comment after a
  print shows its output.
sections:
  - title: Variables and types
    body: |-
      JavaScript has `const` (no reassignment) and `let`. Reach for `const` first. `typeof` tells
      you the runtime type, with two traps: `null` reports `"object"`, and arrays need
      `Array.isArray`.

      ```js
      const name = "Ada"; // cannot be reassigned
      let count = 0; // can be reassigned
      count += 1;
      console.log(typeof name, typeof count); // string number
      console.log(typeof null, typeof undefined); // object undefined
      console.log(Array.isArray([1, 2]), typeof [1, 2]); // true object
      ```

      TypeScript adds annotations after a colon. Most of the time inference is enough, so you
      annotate empty collections, parameters and return types.

      ```ts
      const price = 9.99; // inferred as number
      let label: string = "total";
      const tags: string[] = [];
      let maybe: number | undefined;
      tags.push(label);
      console.log(price, tags, maybe); // 9.99 [ 'total' ] undefined
      ```

      Python has no keyword and no constants; `UPPER_CASE` names signal "do not change". There
      is no `++`.

      ```python
      name = "Ada"
      count = 0
      count += 1
      MAX_ITEMS = 50
      print(type(name).__name__, type(count).__name__)  # str int
      print(type(None).__name__, isinstance([1, 2], list))  # NoneType True
      ```

  - title: Truthiness and equality
    body: |-
      Falsy in JavaScript: `false`, `0`, `-0`, `0n`, `""`, `null`, `undefined` and `NaN`.
      Everything else is truthy, including `[]` and `{}`. Use `===`, which never converts types.
      Objects and arrays compare by reference.

      ```js
      console.log(Boolean([]), Boolean({}), Boolean("")); // true true false
      console.log(0 == "", 0 === ""); // true false
      console.log(null == undefined, null === undefined); // true false
      console.log(NaN === NaN, Number.isNaN(NaN)); // false true
      const a = [1, 2];
      console.log(a === [1, 2], a === a); // false true
      ```

      `||` falls back on any falsy value, `??` only on `null` or `undefined`. `?.` stops at a
      missing value instead of throwing.

      ```js
      const qty = 0;
      console.log(qty || 10, qty ?? 10); // 10 0
      const order = { customer: null };
      console.log(order.customer?.name); // undefined
      ```

      Falsy in Python: `False`, `None`, `0`, `0.0`, `""` and every empty collection. `==`
      compares values, including lists and dicts. `is` compares identity; use it only for `None`.

      ```python
      print(bool([]), bool({}), bool(""), bool([0]))  # False False False True
      a, b = [1, 2], [1, 2]
      print(a == b, a is b)  # True False
      x = None
      print(x is None)  # True
      qty = 0
      print(qty or 10, 10 if qty is None else qty)  # 10 0
      ```

  - title: Strings and formatting
    body: |-
      Strings are immutable in both languages. JavaScript formats with template literals in
      backticks; they can span lines.

      ```js
      const item = "tea", qty = 3, price = 2.5;
      console.log(`${qty} x ${item} = ${(qty * price).toFixed(2)}`); // 3 x tea = 7.50
      console.log("ab".repeat(3), "abc".length); // ababab 3
      console.log("5".padStart(3, "0"), "tea".padEnd(5, ".")); // 005 tea..
      const multi = `line one
      line two`;
      console.log(multi.split("\n").length); // 2
      ```

      Python uses f-strings. The format spec after `:` handles decimals, padding and thousands.
      `{x=}` prints the name and value, which helps when debugging.

      ```python
      item, qty, price = "tea", 3, 2.5
      print(f"{qty} x {item} = {qty * price:.2f}")  # 3 x tea = 7.50
      print(f"{qty=}")  # qty=3
      print("ab" * 3, len("abc"))  # ababab 3
      print("5".zfill(3), f"{5:03d}", f"[{'tea':>5}]")  # 005 005 [  tea]
      print(f"{1234567:,}", f"{0.256:.1%}")  # 1,234,567 25.6%
      ```

  - title: Numbers, division and rounding
    body: |-
      JavaScript has one `number` type, a 64-bit float. Integers are exact up to
      `Number.MAX_SAFE_INTEGER`; past that, use `BigInt` with an `n` suffix. `%` keeps the sign
      of the left operand.

      ```js
      console.log(7 / 2, Math.floor(7 / 2), Math.trunc(-7 / 2)); // 3.5 3 -3
      console.log(-7 % 3, ((-7 % 3) + 3) % 3); // -1 2
      console.log(Math.round(2.5), Math.round(-2.5)); // 3 -2
      console.log(0.1 + 0.2 === 0.3, Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON); // false true
      console.log(Number.MAX_SAFE_INTEGER, 2n ** 64n); // 9007199254740991 18446744073709551616n
      console.log(parseInt("42px", 10), Number("42px"), Number("")); // 42 NaN 0
      console.log((2.345).toFixed(1), Math.max(...[3, 9, 4])); // 2.3 9
      ```

      You cannot mix `BigInt` and `number` in one expression: convert with `BigInt(x)` or
      `Number(x)`.

      Python has `int` and `float`. Integers never overflow. `//` floors, so it rounds towards
      minus infinity, and `%` takes the sign of the right operand. `round` rounds halves to
      even.

      ```python
      import math

      print(7 / 2, 7 // 2, -7 // 2)  # 3.5 3 -4
      print(-7 % 3, divmod(17, 5))  # 2 (3, 2)
      print(round(2.5), round(3.5), round(2.675, 2))  # 2 4 2.67
      print(0.1 + 0.2 == 0.3, math.isclose(0.1 + 0.2, 0.3))  # False True
      print(2**64, int("42"), int(3.9), float("1.5"))  # 18446744073709551616 42 3 1.5
      print(math.floor(-3.5), math.ceil(3.1), abs(-4))  # -4 4 4
      print(float("inf") > 10**100, math.inf == float("inf"))  # True True
      ```

  - title: Arrays and lists, creating, indexing and slicing
    body: |-
      Reading past the end gives `undefined` in JavaScript and raises `IndexError` in Python.
      `slice(start, end)` excludes `end` and copies. `at(-1)` reads from the end.

      ```js
      const scores = [40, 75, 90, 60];
      console.log(scores[0], scores.at(-1), scores.length); // 40 60 4
      console.log(scores.slice(1, 3), scores.slice(-2)); // [ 75, 90 ] [ 90, 60 ]
      const zeros = new Array(3).fill(0);
      const squares = Array.from({ length: 4 }, (_, i) => i * i);
      console.log(zeros, squares); // [ 0, 0, 0 ] [ 0, 1, 4, 9 ]
      console.log(scores[10]); // undefined
      ```

      In TypeScript, `number[]` is a list and `[string, number]` is a tuple of fixed length.
      Under plain `strict`, `scores[10]` is typed `number` even though it is `undefined` at
      runtime; the `noUncheckedIndexedAccess` option makes it `number | undefined`.

      ```ts
      const scores: number[] = [40, 75, 90];
      const pair: [string, number] = ["tea", 3];
      const ids: readonly number[] = [1, 2];
      const [label, amount] = pair;
      console.log(label, amount, ids.includes(2), scores.length); // tea 3 true 3
      ```

      Python slices take `[start:stop:step]` and never raise, even out of range.

      ```python
      scores = [40, 75, 90, 60]
      print(scores[0], scores[-1], len(scores))  # 40 60 4
      print(scores[1:3], scores[-2:], scores[::-1])  # [75, 90] [90, 60] [60, 90, 75, 40]
      print(scores[2:100], scores[::2])  # [90, 60] [40, 90]
      zeros = [0] * 3
      squares = [i * i for i in range(4)]
      copy = scores[:]  # shallow copy, same as list(scores)
      print(zeros, squares, copy == scores)  # [0, 0, 0] [0, 1, 4, 9] True
      ```

  - title: Adding and removing items
    body: |-
      Working at the end of an array is O(1). Working at the front, or in the middle, shifts
      every later item, so it is O(n). `splice(index, deleteCount, ...items)` does both
      inserting and removing, in place.

      ```js
      const cart = ["tea", "milk"];
      cart.push("bread"); // add at the end
      cart.unshift("jam"); // add at the start, O(n)
      const last = cart.pop(); // "bread"
      const first = cart.shift(); // "jam", O(n)
      cart.splice(1, 0, "eggs"); // insert at index 1
      cart.splice(0, 1); // remove one item at index 0
      console.log(cart, last, first); // [ 'eggs', 'milk' ] bread jam
      const i = cart.indexOf("milk");
      if (i !== -1) cart.splice(i, 1);
      console.log(cart, cart.with(0, "rice"), cart.toSpliced(0, 1)); // [ 'eggs' ] [ 'rice' ] []
      ```

      `with`, `toSpliced`, `toSorted` and `toReversed` return a new array and leave the
      original alone.

      ```python
      cart = ["tea", "milk"]
      cart.append("bread")
      cart.insert(0, "jam")  # O(n)
      last = cart.pop()  # "bread"
      first = cart.pop(0)  # "jam", O(n)
      cart.insert(1, "eggs")
      del cart[0]
      cart.remove("milk")  # first match; ValueError if missing
      cart.extend(["rice", "oil"])
      print(cart, last, first)  # ['eggs', 'rice', 'oil'] bread jam
      ```

  - title: Sorting and reversing
    body: |-
      The trap: JavaScript's `sort()` with no comparator sorts as **strings**. Pass
      `(a, b) => a - b` for numbers. A negative result puts `a` first. Chain tie-breaks with
      `||`. `sort` mutates and is stable.

      ```js
      const nums = [10, 9, 1, 100];
      console.log([...nums].sort()); // [ 1, 10, 100, 9 ]
      console.log(nums.toSorted((a, b) => a - b)); // [ 1, 9, 10, 100 ]
      const orders = [
        { id: "b", total: 30 },
        { id: "a", total: 30 },
        { id: "c", total: 12 },
      ];
      orders.sort((x, y) => y.total - x.total || x.id.localeCompare(y.id));
      console.log(orders.map((o) => o.id)); // [ 'a', 'b', 'c' ]
      console.log(nums.toReversed(), nums); // [ 100, 1, 9, 10 ] [ 10, 9, 1, 100 ]
      ```

      Python sorts with a `key` function instead of a comparator. A tuple key sorts by several
      fields; negate a number to reverse one of them. `sorted` returns a new list, `.sort()`
      works in place.

      ```python
      from functools import cmp_to_key

      nums = [10, 9, 1, 100]
      print(sorted(nums), sorted(nums, reverse=True))  # [1, 9, 10, 100] [100, 10, 9, 1]
      orders = [{"id": "b", "total": 30}, {"id": "a", "total": 30}, {"id": "c", "total": 12}]
      orders.sort(key=lambda o: (-o["total"], o["id"]))
      print([o["id"] for o in orders])  # ['a', 'b', 'c']
      print(sorted(["pear", "Fig", "apple"], key=str.lower))  # ['apple', 'Fig', 'pear']
      print(sorted([3, 1, 2], key=cmp_to_key(lambda a, b: b - a)))  # [3, 2, 1]
      nums.reverse()
      print(nums, list(reversed(nums)))  # [100, 1, 9, 10] [10, 9, 1, 100]
      ```

  - title: Finding items
    body: |-
      `find` returns the first match or `undefined`. `findIndex` returns `-1` when nothing
      matches. `includes` handles `NaN`, `indexOf` does not.

      ```js
      const bookings = [
        { id: 1, room: "A", nights: 2 },
        { id: 2, room: "B", nights: 5 },
      ];
      console.log(bookings.find((b) => b.nights > 3)?.id); // 2
      console.log(bookings.findIndex((b) => b.room === "C")); // -1
      console.log(bookings.some((b) => b.nights > 4), bookings.every((b) => b.nights > 1)); // true true
      console.log([1, NaN].includes(NaN), [1, NaN].indexOf(NaN)); // true -1
      console.log(bookings.findLast((b) => b.nights > 1)?.id); // 2
      ```

      Python uses `next` over a generator for "first match or a default". `in` works on lists,
      strings, sets and dict keys. `list.index` raises `ValueError` when missing.

      ```python
      bookings = [{"id": 1, "room": "A", "nights": 2}, {"id": 2, "room": "B", "nights": 5}]
      found = next((b for b in bookings if b["nights"] > 3), None)
      print(found["id"] if found else None)  # 2
      print(any(b["nights"] > 4 for b in bookings), all(b["nights"] > 1 for b in bookings))  # True True
      print(3 in [1, 2, 3], [1, 2, 3].index(2))  # True 1
      print("king" in "booking", "room" in bookings[0])  # True True
      ```

  - title: Map, filter and reduce against comprehensions
    body: |-
      JavaScript chains array methods. Always give `reduce` a starting value, or it fails on
      an empty array.

      ```js
      const prices = [4, 12, 7, 20];
      const doubled = prices.map((p) => p * 2);
      const big = prices.filter((p) => p >= 10);
      const total = prices.reduce((sum, p) => sum + p, 0);
      console.log(doubled, big, total); // [ 8, 24, 14, 40 ] [ 12, 20 ] 43
      console.log([[1, 2], [3]].flat(), [1, 2].flatMap((x) => [x, x])); // [ 1, 2, 3 ] [ 1, 1, 2, 2 ]
      const byId = Object.fromEntries(prices.map((p, i) => [i, p]));
      console.log(byId); // { '0': 4, '1': 12, '2': 7, '3': 20 }
      ```

      Python prefers comprehensions: `[expr for x in items if condition]`. The same shape
      builds dicts and sets. `sum`, `min`, `max`, `any` and `all` cover most reductions.

      ```python
      from functools import reduce

      prices = [4, 12, 7, 20]
      doubled = [p * 2 for p in prices]
      big = [p for p in prices if p >= 10]
      by_index = {i: p for i, p in enumerate(prices)}
      print(doubled, big, sum(prices))  # [8, 24, 14, 40] [12, 20] 43
      print(list(map(str, prices)), max(prices), min(prices))  # ['4', '12', '7', '20'] 20 4
      print([x for row in [[1, 2], [3]] for x in row], by_index[1])  # [1, 2, 3] 12
      print(reduce(lambda acc, p: acc * p, [2, 3, 4], 1))  # 24
      ```

  - title: Spread, destructuring and unpacking
    body: |-
      Spread copies one level deep. Nested objects are still shared; `structuredClone` makes a
      deep copy.

      ```js
      const [first, , ...rest] = [1, 2, 3, 4];
      let a = 1, b = 2;
      [a, b] = [b, a]; // swap
      const user = { name: "Sam", city: "Leeds", age: 30 };
      const { name, ...others } = user;
      const { country = "UK", city: town } = user; // default, rename
      const merged = { ...user, age: 31 };
      console.log(first, rest, a, b); // 1 [ 3, 4 ] 2 1
      console.log(name, others, country, town, merged.age); // Sam { city: 'Leeds', age: 30 } UK Leeds 31
      console.log(Math.max(...rest), [...rest, 5]); // 4 [ 3, 4, 5 ]
      ```

      Python unpacks with `*` for sequences and `**` for dicts. `a | b` merges dicts, with the
      right side winning.

      ```python
      first, _, *rest = [1, 2, 3, 4]
      a, b = 1, 2
      a, b = b, a  # swap
      user = {"name": "Sam", "city": "Leeds", "age": 30}
      merged = {**user, "age": 31}
      also = user | {"age": 32}
      print(first, rest, a, b, merged["age"], also["age"], [*rest, 5])  # 1 [3, 4] 2 1 31 32 [3, 4, 5]

      def total(*nums: int, **opts: int) -> int:
          return sum(nums) + opts.get("tip", 0)

      print(total(*[1, 2, 3], **{"tip": 4}))  # 10
      ```

  - title: 2D grids
    body: |-
      Build each row separately. `new Array(n).fill([])` and `[[0] * n] * m` both put the
      **same** row object in every slot, so one write changes every row.

      ```js
      const rows = 3, cols = 4;
      const grid = Array.from({ length: rows }, () => new Array(cols).fill(0));
      const bad = new Array(2).fill([]);
      bad[0].push("x");
      console.log(bad); // [ [ 'x' ], [ 'x' ] ]
      grid[1][2] = 5;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const r = 1 + dr, c = 2 + dc;
        if (r >= 0 && r < rows && c >= 0 && c < cols) grid[r][c] += 1;
      }
      console.log(grid.map((row) => row.join(""))); // [ '0010', '0151', '0010' ]
      const t = [[1, 2], [3, 4]];
      console.log(t[0].map((_, c) => t.map((row) => row[c]))); // [ [ 1, 3 ], [ 2, 4 ] ]
      ```

      Python allows chained comparisons such as `0 <= r < rows`. `zip(*grid)` transposes.

      ```python
      rows, cols = 3, 4
      grid = [[0] * cols for _ in range(rows)]
      bad = [[0] * 2] * 2
      bad[0][0] = 9
      print(bad)  # [[9, 0], [9, 0]]
      grid[1][2] = 5
      for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
          r, c = 1 + dr, 2 + dc
          if 0 <= r < rows and 0 <= c < cols:
              grid[r][c] += 1
      print(["".join(map(str, row)) for row in grid])  # ['0010', '0151', '0010']
      print([list(col) for col in zip(*[[1, 2], [3, 4]])])  # [[1, 3], [2, 4]]
      ```

  - title: Objects, Map and dict
    body: |-
      A plain object works as a record with string keys. A `Map` takes any key type, keeps
      insertion order, knows its `size` and has no inherited keys, so prefer it for lookups
      built at runtime.

      ```js
      const stock = { tea: 3, milk: 0 };
      stock.bread = 5;
      console.log(stock.jam ?? 0, "milk" in stock, Object.hasOwn(stock, "tea")); // 0 true true
      delete stock.milk;
      console.log(Object.keys(stock), Object.values(stock)); // [ 'tea', 'bread' ] [ 3, 5 ]
      console.log(Object.entries(stock)); // [ [ 'tea', 3 ], [ 'bread', 5 ] ]
      const prices = new Map([["tea", 2.5]]);
      prices.set("milk", 1.2);
      console.log(prices.get("jam") ?? 0, prices.has("tea"), prices.size); // 0 true 2
      console.log([...prices.keys()], [...prices.entries()][1]); // [ 'tea', 'milk' ] [ 'milk', 1.2 ]
      prices.delete("tea");
      ```

      Iterate with `for (const [key, value] of Object.entries(obj))` or
      `for (const [key, value] of map)`.

      A Python dict keeps insertion order. Square brackets raise `KeyError` on a missing key;
      `get` returns a default instead.

      ```python
      stock = {"tea": 3, "milk": 0}
      stock["bread"] = 5
      print(stock.get("jam", 0), "milk" in stock)  # 0 True
      stock.setdefault("jam", 1)  # sets only if missing
      del stock["milk"]
      print(list(stock.keys()), list(stock.values()))  # ['tea', 'bread', 'jam'] [3, 5, 1]
      for item, qty in stock.items():
          print(item, qty)
      print(stock.pop("jam", None), len(stock))  # 1 2
      ```

  - title: Counting, grouping and sorting by value
    body: |-
      Count with a `Map` and `(get ?? 0) + 1`. `Map.groupBy` and `Object.groupBy` group an array
      by a key. To sort by value, spread the entries into an array first.

      ```js
      const words = ["tea", "milk", "tea", "jam", "tea"];
      const counts = new Map();
      for (const w of words) counts.set(w, (counts.get(w) ?? 0) + 1);
      console.log(counts); // Map(3) { 'tea' => 3, 'milk' => 1, 'jam' => 1 }
      console.log([...counts].sort((a, b) => b[1] - a[1])[0]); // [ 'tea', 3 ]
      const orders = [{ city: "York", id: 1 }, { city: "Bath", id: 2 }, { city: "York", id: 3 }];
      console.log(Map.groupBy(orders, (o) => o.city).get("York").map((o) => o.id)); // [ 1, 3 ]
      console.log(Object.keys(Object.groupBy(orders, (o) => o.city))); // [ 'York', 'Bath' ]
      const scores = { ann: 70, bo: 95, cy: 80 };
      console.log(Object.entries(scores).sort((a, b) => b[1] - a[1])); // [ [ 'bo', 95 ], [ 'cy', 80 ], [ 'ann', 70 ] ]
      ```

      In TypeScript, give an empty `Map` its types, or use a `Record` for string keys.

      ```ts
      const counts = new Map<string, number>();
      for (const ch of "banana") counts.set(ch, (counts.get(ch) ?? 0) + 1);
      const ranked = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      console.log(ranked); // [ [ 'a', 3 ], [ 'n', 2 ], [ 'b', 1 ] ]
      const tally: Record<string, number> = {};
      for (const w of ["x", "y", "x"]) tally[w] = (tally[w] ?? 0) + 1;
      console.log(tally); // { x: 2, y: 1 }
      ```

      Python has both in `collections`. A `Counter` returns 0 for a missing key. A
      `defaultdict(list)` creates an empty list the first time you touch a key.

      ```python
      from collections import Counter, defaultdict

      counts = Counter(["tea", "milk", "tea", "jam", "tea"])
      print(counts["tea"], counts["rice"], counts.most_common(2))  # 3 0 [('tea', 3), ('milk', 1)]
      by_city: defaultdict[str, list[int]] = defaultdict(list)
      for city, order_id in [("York", 1), ("Bath", 2), ("York", 3)]:
          by_city[city].append(order_id)
      print(dict(by_city))  # {'York': [1, 3], 'Bath': [2]}
      scores = {"ann": 70, "bo": 95, "cy": 80}
      print(sorted(scores.items(), key=lambda kv: kv[1], reverse=True))  # [('bo', 95), ('cy', 80), ('ann', 70)]
      print(max(scores, key=scores.get), Counter("banana") == Counter("nabana"))  # bo True
      ```

  - title: Sets for seen-checks
    body: |-
      A set answers "have I seen this?" in O(1) on average, where searching an array is O(n).
      A JavaScript `Set` compares objects and arrays by reference, so store a string key such
      as `` `${r},${c}` `` for a pair.

      ```js
      const seen = new Set();
      const dupes = [];
      for (const id of [3, 1, 3, 2, 1]) {
        if (seen.has(id)) dupes.push(id);
        else seen.add(id);
      }
      console.log(dupes, seen.size, [...seen]); // [ 3, 1 ] 3 [ 3, 1, 2 ]
      const a = new Set([1, 2, 3]), b = new Set([2, 3, 4]);
      console.log(a.intersection(b), a.union(b), a.difference(b)); // Set(2) { 2, 3 } Set(4) { 1, 2, 3, 4 } Set(1) { 1 }
      console.log(new Set([[0, 1]]).has([0, 1]), new Set(["0,1"]).has(`${0},${1}`)); // false true
      ```

      Python sets use operators for set algebra. Tuples can go in a set; lists cannot, because
      they are not hashable. `{}` is an empty dict, so write `set()`.

      ```python
      seen: set[int] = set()
      dupes = []
      for order_id in [3, 1, 3, 2, 1]:
          if order_id in seen:
              dupes.append(order_id)
          seen.add(order_id)
      print(dupes, len(seen))  # [3, 1] 3
      a, b = {1, 2, 3}, {2, 3, 4}
      print(a & b, a | b, a - b, a ^ b)  # {2, 3} {1, 2, 3, 4} {1} {1, 4}
      visited = {(0, 0), (1, 2)}
      print((1, 2) in visited, len(set("banana")))  # True 3
      ```

  - title: String methods
    body: |-
      `split` and `join` are the pair you use most. `replace` with a string changes the first
      match only; `replaceAll` changes every match. `slice` accepts negative indexes.

      ```js
      const line = "  tea, milk ,jam  ";
      const items = line.trim().split(",").map((s) => s.trim());
      console.log(items, items.join(" | ")); // [ 'tea', 'milk', 'jam' ] tea | milk | jam
      console.log("a-b-c".replace("-", "+"), "a-b-c".replaceAll("-", "+")); // a+b-c a+b+c
      console.log("Order-42".slice(6), "Order-42".slice(-2), "order".toUpperCase()); // 42 42 ORDER
      console.log("booking".startsWith("book"), "booking".includes("king"), "abc".indexOf("z")); // true true -1
      console.log("a  b c".split(/\s+/), "tea".split("")); // [ 'a', 'b', 'c' ] [ 't', 'e', 'a' ]
      ```

      Python's `split()` with no argument splits on any run of whitespace and drops empty
      pieces. `join` takes strings only, so convert numbers first. To build a long string,
      collect parts in a list and join once.

      ```python
      line = "  tea, milk ,jam  "
      items = [s.strip() for s in line.strip().split(",")]
      print(items, " | ".join(items))  # ['tea', 'milk', 'jam'] tea | milk | jam
      print("a-b-c".replace("-", "+", 1), "a-b-c".replace("-", "+"))  # a+b-c a+b+c
      print("Order-42"[6:], "Order-42"[-2:], "order".upper())  # 42 42 ORDER
      print("booking".startswith("book"), "king" in "booking", "abc".find("z"))  # True True -1
      print("a  b c".split(), list("tea"))  # ['a', 'b', 'c'] ['t', 'e', 'a']
      print(", ".join(map(str, [1, 2])), "tea".count("e"))  # 1, 2 1
      ```

  - title: Characters, codes and reversing
    body: |-
      `charCodeAt` and `ord` turn a character into a number; `String.fromCharCode` and `chr`
      turn it back. Subtracting the code of `"a"` gives a 0 to 25 index, which suits letter
      counts and shifts.

      ```js
      console.log("a".charCodeAt(0), String.fromCharCode(98), "c".codePointAt(0)); // 97 b 99
      const shift = (ch) => String.fromCharCode(((ch.charCodeAt(0) - 97 + 1) % 26) + 97);
      console.log(shift("z")); // a
      console.log([..."stressed"].reverse().join("")); // desserts
      console.log(/^\d+$/.test("2024"), /^[a-z]+$/i.test("Tea"), /\s/.test("a b")); // true true true
      const isDigit = (ch) => ch >= "0" && ch <= "9";
      console.log(isDigit("7"), Number("7") + 1); // true 8
      const freq = new Array(26).fill(0);
      for (const ch of "abca") freq[ch.charCodeAt(0) - 97] += 1;
      console.log(freq.slice(0, 3)); // [ 2, 1, 1 ]
      ```

      Python has string methods for character checks, and `[::-1]` reverses.

      ```python
      import string

      def shift(ch: str) -> str:
          return chr((ord(ch) - ord("a") + 1) % 26 + ord("a"))

      print(ord("a"), chr(98), shift("z"))  # 97 b a
      print("stressed"[::-1])  # desserts
      print("2024".isdigit(), "Tea".isalpha(), "a1".isalnum(), " ".isspace())  # True True True True
      print("Tea".lower(), "tea".capitalize(), "Tea".islower())  # tea Tea False
      print(int("7") + 1, str(8), string.ascii_lowercase[:5])  # 8 8 abcde
      ```

  - title: Loops
    body: |-
      `for...of` gives values, and works on arrays, strings, maps and sets. `for...in` gives an
      object's keys as **strings**; avoid it on arrays. `entries()` gives the index and the
      value together.

      ```js
      const items = ["tea", "milk"];
      for (let i = 0; i < items.length; i++) console.log(i, items[i]);
      for (const [i, item] of items.entries()) console.log(i, item);
      for (const item of items) console.log(item);
      for (const key in { a: 1 }) console.log(key); // a
      for (const i in ["x"]) console.log(i, typeof i); // 0 string
      let n = 3;
      while (n > 0) n--;
      for (let i = items.length - 1; i >= 0; i--) console.log(items[i]);
      ```

      Python loops over values. `enumerate` adds the index, `zip` walks two lists together, and
      `range(start, stop, step)` stops before `stop`. A loop's `else` runs when the loop ends
      without `break`.

      ```python
      items = ["tea", "milk"]
      for i, item in enumerate(items):
          print(i, item)
      for i in range(len(items) - 1, -1, -1):  # backwards
          print(items[i])
      for name, price in zip(["tea", "jam"], [2.5, 3.0]):
          print(name, price)
      n = 3
      while n > 0:
          n -= 1
      for x in [1, 2, 3]:
          if x == 5:
              break
      else:
          print("no break")  # no break
      ```

  - title: Functions and closures
    body: |-
      Default parameters fill in `undefined` arguments. A rest parameter collects the extra
      arguments into an array. An arrow function returning an object literal needs it wrapped
      in round brackets.

      ```js
      function total(prices, discount = 0, ...extras) {
        if (prices.length === 0) return 0; // early return for the edge case
        const sum = prices.reduce((a, b) => a + b, 0) + extras.reduce((a, b) => a + b, 0);
        return sum - discount;
      }
      console.log(total([], 5), total([10, 20], 5, 1, 2)); // 0 28
      const double = (x) => x * 2;
      const toPair = (k, v) => ({ [k]: v });
      console.log(double(4), toPair("tea", 2)); // 8 { tea: 2 }
      ```

      TypeScript annotates parameters and the return type. `?` marks an optional parameter.

      ```ts
      function total(prices: number[], discount = 0, ...extras: number[]): number {
        return prices.reduce((a, b) => a + b, 0) + extras.reduce((a, b) => a + b, 0) - discount;
      }
      const greet = (name: string, title?: string): string => (title ? `${title} ${name}` : name);
      type Handler = (message: string) => void;
      const log: Handler = (message) => console.log(message);
      log(greet("Ada", "Dr")); // Dr Ada
      console.log(total([10, 20], 5, 1)); // 26
      ```

      In Python, parameters after `*args` are keyword-only. A `lambda` holds one expression.
      Never use a mutable default such as `cart=[]`: it is created once and shared by every
      call.

      ```python
      def total(prices, discount=0, *extras, rounding=2):
          if not prices:
              return 0
          return round(sum(prices) + sum(extras) - discount, rounding)

      def add_item(item, cart=None):
          cart = [] if cart is None else cart
          cart.append(item)
          return cart

      double = lambda x: x * 2
      print(total([]), total([10, 20], 5, 1, 2), double(4))  # 0 28 8
      print(add_item("tea"), add_item("jam"))  # ['tea'] ['jam']
      ```

      A closure is a function that keeps the variables of the scope it was created in. Python
      needs `nonlocal` to reassign such a variable.

      ```js
      function makeCounter() {
        let count = 0;
        return () => ++count;
      }
      const next = makeCounter();
      next();
      console.log(next()); // 2
      ```

      ```python
      def make_counter():
          count = 0

          def next_value():
              nonlocal count
              count += 1
              return count

          return next_value

      counter = make_counter()
      counter()
      print(counter())  # 2
      ```

  - title: Recursion and the recursion limit
    body: |-
      Write the base case first. Node throws a `RangeError` when the call stack runs out,
      somewhere in the thousands of frames, depending on frame size. There is no setting to
      raise it from inside the code, so convert deep recursion into a loop with an explicit
      stack.

      ```js
      function sumTo(n) {
        if (n === 0) return 0;
        return n + sumTo(n - 1);
      }
      console.log(sumTo(100)); // 5050
      try {
        sumTo(1e6);
      } catch (err) {
        console.log(err instanceof RangeError); // true
      }
      ```

      Python's default limit is 1000 frames, and going past it raises `RecursionError`.
      `sys.setrecursionlimit` raises the limit. A recursive DFS on a 100 000-node path still
      calls for the iterative version.

      ```python
      import sys

      def sum_to(n: int) -> int:
          if n == 0:
              return 0
          return n + sum_to(n - 1)

      print(sum_to(100), sys.getrecursionlimit())  # 5050 1000
      try:
          sum_to(10_000)
      except RecursionError:
          print("too deep")  # too deep
      sys.setrecursionlimit(20_000)
      print(sum_to(10_000))  # 50005000
      ```

  - title: Stacks
    body: |-
      A stack is an array or list used only at the end: push, pop and peek are all O(1). It
      suits matching brackets, undo, and depth-first search without recursion.

      ```js
      function isBalanced(text) {
        const pairs = { ")": "(", "]": "[", "}": "{" };
        const stack = [];
        for (const ch of text) {
          if ("([{".includes(ch)) stack.push(ch);
          else if (ch in pairs && stack.pop() !== pairs[ch]) return false;
        }
        return stack.length === 0;
      }
      console.log(isBalanced("{[()]}"), isBalanced("(]"), isBalanced("((")); // true false false
      const stack = [1, 2];
      console.log(stack.at(-1), stack.length); // 2 2
      ```

      ```python
      def dfs(graph: dict[str, list[str]], start: str) -> list[str]:
          stack, seen, order = [start], {start}, []
          while stack:
              node = stack.pop()
              order.append(node)
              for nxt in reversed(graph.get(node, [])):
                  if nxt not in seen:
                      seen.add(nxt)
                      stack.append(nxt)
          return order

      print(dfs({"a": ["b", "c"], "b": ["d"], "c": []}, "a"))  # ['a', 'b', 'd', 'c']
      stack = [1, 2]
      print(stack[-1], len(stack))  # 2 2
      ```

  - title: Queues and deques
    body: |-
      `shift()` removes the first item and moves every other item down one place, so it is
      O(n), and a loop of shifts is O(n²). In JavaScript, keep a head index instead and read
      forward; it makes each dequeue O(1).

      ```js
      function bfs(graph, start) {
        const queue = [start];
        const seen = new Set([start]);
        for (let head = 0; head < queue.length; head++) {
          const node = queue[head]; // dequeue without shift()
          for (const next of graph[node] ?? []) {
            if (!seen.has(next)) {
              seen.add(next);
              queue.push(next);
            }
          }
        }
        return queue; // the visit order
      }
      console.log(bfs({ a: ["b", "c"], b: ["d"], c: ["d"] }, "a")); // [ 'a', 'b', 'c', 'd' ]
      ```

      Python's `collections.deque` gives O(1) at both ends. `list.pop(0)` is O(n), like
      `shift()`. A `deque(maxlen=n)` keeps the last `n` items.

      ```python
      from collections import deque

      def bfs(graph: dict[str, list[str]], start: str) -> list[str]:
          queue, seen, order = deque([start]), {start}, []
          while queue:
              node = queue.popleft()
              order.append(node)
              for nxt in graph.get(node, []):
                  if nxt not in seen:
                      seen.add(nxt)
                      queue.append(nxt)
          return order

      print(bfs({"a": ["b", "c"], "b": ["d"], "c": ["d"]}, "a"))  # ['a', 'b', 'c', 'd']
      recent = deque([0, 1, 2, 3, 4], maxlen=3)
      recent.appendleft(9)
      print(list(recent))  # [9, 2, 3]
      ```

  - title: Heaps and priority queues
    body: |-
      A heap gives the smallest item in O(1) and pushes or pops in O(log n). JavaScript has no
      built-in heap, so write one. These two functions keep a heap inside a plain array, the
      same design as Python's `heapq`. `less(a, b)` returns true when `a` should come out first.
      Drop the types and they are plain JavaScript.

      ```ts
      type Less<T> = (a: T, b: T) => boolean;

      function heapPush<T>(heap: T[], item: T, less: Less<T>): void {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!less(heap[i], heap[parent])) break;
          [heap[i], heap[parent]] = [heap[parent], heap[i]];
          i = parent;
        }
      }
      ```

      Pop swaps the last item into the root, then sinks it below its smaller child until the
      order holds again.

      ```ts
      function heapPop<T>(heap: T[], less: Less<T>): T | undefined {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length === 0 || last === undefined) return top;
        heap[0] = last;
        let i = 0;
        while (true) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < heap.length && less(heap[l], heap[m])) m = l;
          if (r < heap.length && less(heap[r], heap[m])) m = r;
          if (m === i) return top;
          [heap[i], heap[m]] = [heap[m], heap[i]];
          i = m;
        }
      }
      ```

      Use it with tuples of priority and value. A max-heap is the same code with
      `(a, b) => a > b`. The last lines test it against a sort.

      ```ts
      const tasks: [number, string][] = [];
      const byPriority: Less<[number, string]> = (a, b) => a[0] < b[0];
      heapPush(tasks, [3, "email"], byPriority);
      heapPush(tasks, [1, "deploy"], byPriority);
      heapPush(tasks, [2, "review"], byPriority);
      console.log(heapPop(tasks, byPriority)?.[1], heapPop(tasks, byPriority)?.[1]); // deploy review

      const nums = Array.from({ length: 1000 }, () => Math.floor(Math.random() * 100));
      const heap: number[] = [];
      for (const n of nums) heapPush(heap, n, (a, b) => a < b);
      const out: number[] = [];
      while (heap.length > 0) out.push(heapPop(heap, (a, b) => a < b) ?? -1);
      console.log(out.join() === nums.toSorted((a, b) => a - b).join()); // true
      ```

      Python's `heapq` works on a plain list and is always a min-heap. Tuples compare element
      by element, so `(priority, value)` sorts by priority. For a max-heap, push negated
      numbers.

      ```python
      import heapq

      tasks: list[tuple[int, str]] = []
      heapq.heappush(tasks, (3, "email"))
      heapq.heappush(tasks, (1, "deploy"))
      heapq.heappush(tasks, (2, "review"))
      print(heapq.heappop(tasks), tasks[0])  # (1, 'deploy') (2, 'review')
      nums = [5, 1, 8, 3]
      heapq.heapify(nums)  # O(n), in place
      print(nums[0], heapq.nsmallest(2, [5, 1, 8, 3]), heapq.nlargest(1, [5, 1, 8, 3]))  # 1 [1, 3] [8]
      max_heap: list[int] = []
      for n in [5, 1, 8]:
          heapq.heappush(max_heap, -n)
      print(-heapq.heappop(max_heap))  # 8
      ```

      If two priorities tie and the values cannot be compared, such as dicts, add a counter
      as the middle element: `(priority, next(counter), value)` with `itertools.count()`.

  - title: Binary search
    body: |-
      Binary search needs sorted input and runs in O(log n). Most interview variants are a
      **lower bound**: the first index whose value is at least the target. Search the half-open
      range `[lo, hi)` and the loop has one exit.

      ```js
      function lowerBound(sorted, target) {
        let lo = 0, hi = sorted.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (sorted[mid] < target) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      }
      const times = [900, 930, 1000, 1000, 1130];
      console.log(lowerBound(times, 1000), lowerBound(times, 1200)); // 2 5
      const i = lowerBound(times, 1130);
      console.log(i < times.length && times[i] === 1130); // true
      ```

      Python's `bisect` module does this for you. `bisect_left` is the lower bound;
      `bisect_right` returns the index after the last equal value. `insort` keeps a list
      sorted, but the insert itself is O(n).

      ```python
      from bisect import bisect_left, bisect_right, insort

      times = [900, 930, 1000, 1000, 1130]
      print(bisect_left(times, 1000), bisect_right(times, 1000))  # 2 4
      i = bisect_left(times, 1130)
      print(i < len(times) and times[i] == 1130)  # True
      insort(times, 945)
      print(times)  # [900, 930, 945, 1000, 1000, 1130]
      people = [("ann", 20), ("bo", 31), ("cy", 45)]
      print(bisect_left(people, 31, key=lambda p: p[1]))  # 1
      ```

  - title: Memoisation
    body: |-
      Memoisation stores each result by its arguments, so repeated subproblems run once. In
      JavaScript, keep a `Map` and build a string key when there are several arguments.

      ```js
      function countPaths(rows, cols, memo = new Map()) {
        if (rows === 1 || cols === 1) return 1;
        const key = `${rows},${cols}`;
        if (memo.has(key)) return memo.get(key);
        const result = countPaths(rows - 1, cols, memo) + countPaths(rows, cols - 1, memo);
        memo.set(key, result);
        return result;
      }
      console.log(countPaths(3, 3), countPaths(16, 16)); // 6 155117520
      ```

      Python's `functools.cache` does it with a decorator. The arguments must be hashable, so
      pass tuples, not lists. Call `cache_clear()` between test cases if state could leak.
      `lru_cache(maxsize=n)` bounds the memory.

      ```python
      from functools import cache

      @cache
      def count_paths(rows: int, cols: int) -> int:
          if rows == 1 or cols == 1:
              return 1
          return count_paths(rows - 1, cols) + count_paths(rows, cols - 1)

      print(count_paths(3, 3), count_paths(16, 16))  # 6 155117520
      count_paths.cache_clear()
      ```

      The same problem bottom-up, with a table and no recursion limit to worry about:

      ```python
      def count_paths_table(rows: int, cols: int) -> int:
          dp = [[1] * cols for _ in range(rows)]
          for r in range(1, rows):
              for c in range(1, cols):
                  dp[r][c] = dp[r - 1][c] + dp[r][c - 1]
          return dp[-1][-1]

      print(count_paths_table(16, 16))  # 155117520
      ```

  - title: Classes in JavaScript and TypeScript
    body: |-
      A `#` field is private at runtime: code outside the class cannot read it. A getter reads
      like a property. `static` members belong to the class, not to each instance.

      ```js
      class Account {
        #balance = 0;
        static count = 0;
        constructor(owner) {
          this.owner = owner;
          Account.count += 1;
        }
        deposit(amount) {
          if (amount <= 0) throw new RangeError("amount must be positive");
          this.#balance += amount;
          return this; // allows chaining
        }
        get balance() {
          return this.#balance;
        }
      }
      const acc = new Account("Sam").deposit(50).deposit(25);
      console.log(acc.balance, Account.count); // 75 1
      ```

      A subclass calls `super()` before it touches `this`. Overridden methods are found at
      runtime, so the parent's `describe` calls the child's `area`.

      ```js
      class Shape {
        constructor(name) {
          this.name = name;
        }
        area() { return 0; }
        describe() { return `${this.name} with area ${this.area()}`; }
      }
      class Rect extends Shape {
        constructor(w, h) {
          super("rect");
          this.w = w;
          this.h = h;
        }
        area() { return this.w * this.h; }
      }
      console.log(new Rect(2, 3).describe(), new Rect(1, 1) instanceof Shape); // rect with area 6 true
      ```

      TypeScript adds `abstract`, `implements` and parameter properties, which declare and
      assign a field in the constructor signature. Its `private` is checked at compile time
      only; `#` is private at runtime too.

      ```ts
      interface HasArea {
        area(): number;
      }
      abstract class Shape implements HasArea {
        constructor(public readonly name: string) {}
        abstract area(): number;
      }
      class Circle extends Shape {
        constructor(private radius: number) {
          super("circle");
        }
        area(): number {
          return Math.PI * this.radius ** 2;
        }
      }
      const shapes: Shape[] = [new Circle(1)];
      console.log(shapes.map((s) => `${s.name} ${s.area().toFixed(2)}`)); // [ 'circle 3.14' ]
      ```

  - title: Classes in Python
    body: |-
      `__init__` sets up the instance, and every method takes `self` first. A leading `_` means
      private by convention only. `@property` makes a method read like an attribute.
      `__repr__` controls how the object prints.

      ```python
      class Account:
          def __init__(self, owner: str) -> None:
              self.owner = owner
              self._balance = 0

          def deposit(self, amount: int) -> "Account":
              if amount <= 0:
                  raise ValueError("amount must be positive")
              self._balance += amount
              return self

          @property
          def balance(self) -> int:
              return self._balance

          def __repr__(self) -> str:
              return f"Account({self.owner!r}, {self._balance})"

      acc = Account("Sam").deposit(50).deposit(25)
      print(acc.balance, acc)  # 75 Account('Sam', 75)
      ```

      `@dataclass` writes `__init__`, `__repr__` and `__eq__` from the fields. `order=True`
      adds comparisons in field order, so instances sort. Use `field(default_factory=list)`
      for a mutable default.

      ```python
      from dataclasses import dataclass, field

      @dataclass(order=True)
      class Booking:
          start: int
          room: str
          guests: list[str] = field(default_factory=list, compare=False)

      a = Booking(900, "B")
      b = Booking(900, "A", ["Ann"])
      print(sorted([a, b])[0].room, a == Booking(900, "B"))  # A True
      print(a)  # Booking(start=900, room='B', guests=[])
      ```

      Inheritance uses `class Child(Parent)` and `super().__init__()`. Dunder methods plug a
      class into the language: `__lt__` for sorting and `min`, `__str__` for `print`, `__len__`
      for `len`.

      ```python
      class Shape:
          def __init__(self, name: str) -> None:
              self.name = name
          def area(self) -> float:
              raise NotImplementedError
          def __str__(self) -> str:
              return f"{self.name} with area {self.area()}"
          def __lt__(self, other: "Shape") -> bool:
              return self.area() < other.area()

      class Rect(Shape):
          def __init__(self, w: float, h: float) -> None:
              super().__init__("rect")
              self.w, self.h = w, h
          def area(self) -> float:
              return self.w * self.h

      print(min([Rect(2, 3), Rect(1, 1)]), isinstance(Rect(1, 1), Shape))  # rect with area 1 True
      ```

  - title: Errors
    body: |-
      Throw an `Error` or a subclass, never a bare string, so you keep the stack trace.
      `finally` runs whether or not something was thrown. Rethrow what you cannot handle.

      ```js
      class OutOfStockError extends Error {
        constructor(item) {
          super(`${item} is out of stock`);
          this.name = "OutOfStockError";
          this.item = item;
        }
      }
      function reserve(item, stock) {
        if (!stock[item]) throw new OutOfStockError(item);
        stock[item] -= 1;
      }
      try {
        reserve("tea", { tea: 0 });
      } catch (err) {
        if (err instanceof OutOfStockError) console.log(err.message); // tea is out of stock
        else throw err;
      } finally {
        console.log("always runs"); // always runs
      }
      ```

      Under `strict`, TypeScript types the caught value as `unknown`, because anything can be
      thrown. Narrow it before you read `.message`. `cause` keeps the original error.

      ```ts
      function parse(text: string): unknown {
        try {
          return JSON.parse(text);
        } catch (err) {
          const message = err instanceof Error ? err.message : String(err);
          throw new Error(`bad input: ${message}`, { cause: err });
        }
      }
      try {
        parse("{");
      } catch (err) {
        console.log(err instanceof Error && err.message.startsWith("bad input")); // true
      }
      ```

      Python raises and catches with `raise` and `except`. `else` runs only when nothing was
      raised. `raise NewError(...) from err` chains the cause.

      ```python
      class OutOfStockError(Exception):
          def __init__(self, item: str) -> None:
              super().__init__(f"{item} is out of stock")
              self.item = item

      def reserve(item: str, stock: dict[str, int]) -> None:
          if stock.get(item, 0) == 0:
              raise OutOfStockError(item)
          stock[item] -= 1

      try:
          reserve("tea", {"tea": 0})
      except OutOfStockError as err:
          print(err, "|", err.item)  # tea is out of stock | tea
      except (KeyError, ValueError):
          print("bad input")
      else:
          print("reserved")
      finally:
          print("always runs")  # always runs
      ```

  - title: Promises and async/await in JavaScript
    body: |-
      An `async` function always returns a promise, and `await` pauses it until that promise
      settles. Start independent work together with `Promise.all`, which rejects as soon as
      one fails. `Promise.allSettled` waits for all and reports each outcome. Top-level
      `await` works in ES modules.

      ```js
      const sleep = (ms, value) => new Promise((resolve) => setTimeout(resolve, ms, value));
      async function loadOrder(id) {
        await sleep(10);
        if (id < 0) throw new Error(`no order ${id}`);
        return { id, total: id * 10 };
      }
      const orders = await Promise.all([loadOrder(1), loadOrder(2)]);
      console.log(orders.map((o) => o.total)); // [ 10, 20 ]
      const results = await Promise.allSettled([loadOrder(3), loadOrder(-1)]);
      console.log(results.map((r) => r.status)); // [ 'fulfilled', 'rejected' ]
      console.log(await Promise.race([sleep(50, "slow"), sleep(5, "fast")])); // fast
      try {
        await loadOrder(-2);
      } catch (err) {
        console.log(err.message); // no order -2
      }
      ```

      A `for` loop with `await` inside runs one call after another. Map to promises first when
      the calls do not depend on each other.

      Cancel with an `AbortSignal`. `AbortSignal.timeout(ms)` aborts on its own with a
      `TimeoutError`; an `AbortController` aborts when you call `abort()`. With `fetch`, pass it
      as `fetch(url, { signal: AbortSignal.timeout(5000) })`.

      ```js
      function slowTask(signal) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => resolve("done"), 1000);
          signal.addEventListener("abort", () => {
            clearTimeout(timer);
            reject(signal.reason);
          });
        });
      }
      await slowTask(AbortSignal.timeout(50)).catch((err) => console.log(err.name)); // TimeoutError
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 10);
      await slowTask(controller.signal).catch((err) => console.log(err.name)); // AbortError
      ```

  - title: Async in Python
    body: |-
      `asyncio.run` starts the event loop for one top-level coroutine. `gather` runs coroutines
      together; with `return_exceptions=True` it returns errors instead of raising the first.
      `create_task` starts a coroutine now, while you carry on. `asyncio.timeout` cancels the
      block when time runs out and raises `TimeoutError`.

      ```python
      import asyncio

      async def load_order(order_id: int) -> dict[str, int]:
          await asyncio.sleep(0.01)
          if order_id < 0:
              raise ValueError(f"no order {order_id}")
          return {"id": order_id, "total": order_id * 10}

      async def main() -> None:
          orders = await asyncio.gather(load_order(1), load_order(2))
          print([o["total"] for o in orders])  # [10, 20]
          results = await asyncio.gather(load_order(3), load_order(-1), return_exceptions=True)
          print([type(r).__name__ for r in results])  # ['dict', 'ValueError']
          task = asyncio.create_task(load_order(4))
          print((await task)["total"])  # 40

      asyncio.run(main())
      ```

      `asyncio.TaskGroup` is the structured version of `gather`: if one task fails, the group
      cancels the others and raises an `ExceptionGroup`. `asyncio.timeout` works the same way
      as `AbortSignal.timeout`.

      ```python
      import asyncio

      async def double(n: int) -> int:
          await asyncio.sleep(0.01)
          return n * 2

      async def main() -> None:
          async with asyncio.TaskGroup() as group:
              tasks = [group.create_task(double(n)) for n in range(3)]
          print([t.result() for t in tasks])  # [0, 2, 4]
          try:
              async with asyncio.timeout(0.05):
                  await asyncio.sleep(1)
          except TimeoutError:
              print("timed out")  # timed out

      asyncio.run(main())
      ```

  - title: Modules and imports
    body: |-
      ES modules use `export` and `import`. A file can have one default export and any number
      of named ones. Node treats `.mjs` files, and `.js` files under a `package.json` with
      `"type": "module"`, as ES modules. Relative imports need the file extension.

      ```js
      // pricing.mjs
      export const VAT = 0.2;
      export function addVat(price) {
        return Math.round(price * (1 + VAT) * 100) / 100;
      }
      export default class Cart {}

      // main.mjs
      import Cart, { addVat, VAT as rate } from "./pricing.mjs";
      import * as pricing from "./pricing.mjs";
      console.log(addVat(10), rate, pricing.VAT, typeof Cart); // 12 0.2 0.2 function
      ```

      CommonJS is the older Node format, still common in scripts and older packages. It uses
      `require` and `module.exports`, and is the default for `.js` files without
      `"type": "module"`.

      ```js
      // pricing.cjs
      const VAT = 0.2;
      function addVat(price) {
        return Math.round(price * (1 + VAT) * 100) / 100;
      }
      module.exports = { VAT, addVat };

      // main.cjs
      const { addVat } = require("./pricing.cjs");
      console.log(addVat(10)); // 12
      ```

      In Python, every file is a module. The code under `if __name__ == "__main__":` runs when
      you start the file directly, not when another file imports it.

      ```python
      # pricing.py
      VAT = 0.2

      def add_vat(price: float) -> float:
          return round(price * (1 + VAT), 2)

      if __name__ == "__main__":
          print(add_vat(10))  # 12.0

      # main.py
      import pricing as p
      from pricing import VAT, add_vat

      print(add_vat(10), VAT, p.VAT)  # 12.0 0.2 0.2
      ```

  - title: Input and output on timed platforms
    body: |-
      Most online assessment platforms ask you to complete a function such as
      `solution(A)`. **Return** the answer; do not print it. Printing is for your own
      debugging and is often ignored by the grader, so remove it before you submit.

      ```js
      function solution(A) {
        const seen = new Set(A);
        let i = 1;
        while (seen.has(i)) i++;
        return i; // smallest positive integer not in A
      }
      console.log(solution([1, 3, 6, 4, 1, 2]), solution([-1, -3])); // 5 1
      ```

      ```python
      def solution(A: list[int]) -> int:
          seen = set(A)
          i = 1
          while i in seen:
              i += 1
          return i

      print(solution([1, 3, 6, 4, 1, 2]), solution([-1, -3]))  # 5 1
      ```

      Some platforms feed input on stdin instead. In Node, `readFileSync(0)` reads all of
      stdin at once; file descriptor 0 is stdin. Given the input `3` then `1 2 3` on two
      lines, both programs print `3 6`.

      ```js
      import { readFileSync } from "node:fs";

      const lines = readFileSync(0, "utf8").trim().split("\n");
      const n = Number(lines[0]);
      const nums = lines[1].split(" ").map(Number);
      console.log(n, nums.reduce((a, b) => a + b, 0));
      ```

      In Python, `sys.stdin.read().split()` turns the whole input into tokens, whatever the line
      breaks. `input()` reads one line at a time.

      ```python
      import sys

      def main() -> None:
          data = sys.stdin.read().split()
          n = int(data[0])
          nums = list(map(int, data[1 : 1 + n]))
          print(n, sum(nums))

      if __name__ == "__main__":
          main()
      ```

  - title: TypeScript types, interfaces, unions and narrowing
    body: |-
      `interface` and `type` both describe an object's shape. An interface can be extended and
      merged; a `type` alias can also name unions, tuples and mapped types. Pick one per
      codebase for objects and use `type` for the rest. `?` marks an optional property.

      ```ts
      interface Product {
        readonly sku: string;
        name: string;
        price: number;
        tags?: string[];
      }
      interface DigitalProduct extends Product {
        url: string;
      }
      type Status = "pending" | "paid" | "shipped";
      type OrderLine = { product: Product; qty: number };

      function lineTotal(line: OrderLine): number {
        return line.product.price * line.qty;
      }
      const tea: Product = { sku: "T-1", name: "Tea", price: 2.5 };
      const ebook: DigitalProduct = { sku: "E-1", name: "Guide", price: 5, url: "/guide.pdf" };
      const status: Status = "paid";
      console.log(lineTotal({ product: tea, qty: 2 }), ebook.url, status); // 5 /guide.pdf paid
      ```

      Narrowing is how TypeScript learns the exact type inside a branch: `typeof`, `=== null`,
      `in`, `instanceof`, or a shared literal field. That last one is a **discriminated union**,
      and a `switch` on it is checked for missing cases.

      ```ts
      type Result = { kind: "ok"; value: number } | { kind: "error"; message: string };

      function describe(r: Result): string {
        switch (r.kind) {
          case "ok":
            return `value ${r.value}`;
          case "error":
            return `failed: ${r.message}`;
        }
      }
      function format(input: string | number | null): string {
        if (input === null) return "none";
        if (typeof input === "number") return input.toFixed(1);
        return input.toUpperCase();
      }
      console.log(describe({ kind: "ok", value: 3 }), format(2), format("a"), format(null)); // value 3 2.0 A none
      ```

  - title: TypeScript generics, utility types and unknown
    body: |-
      A generic keeps the link between input and output types. `K extends keyof T` restricts a
      parameter to real keys of `T`, and `T[K]` is the type at that key. Type an array of
      objects as `Booking[]`, and a string-keyed lookup as `Record<string, number>`.

      ```ts
      interface Booking {
        id: number;
        guest: string;
        nights: number;
      }
      function first<T>(items: T[]): T | undefined {
        return items[0];
      }
      function pluck<T, K extends keyof T>(items: T[], key: K): T[K][] {
        return items.map((item) => item[key]);
      }
      const bookings: Booking[] = [
        { id: 1, guest: "Ann", nights: 2 },
        { id: 2, guest: "Bo", nights: 4 },
      ];
      const nightsByGuest: Record<string, number> = {};
      for (const b of bookings) nightsByGuest[b.guest] = b.nights;
      console.log(first(bookings)?.guest, pluck(bookings, "nights"), nightsByGuest); // Ann [ 2, 4 ] { Ann: 2, Bo: 4 }
      ```

      Utility types derive new types from old ones. `as const` freezes a literal into its
      narrowest type, which lets you build a union from an array. `satisfies` checks a value
      against a type without widening it.

      ```ts
      interface User {
        id: number;
        name: string;
        email: string;
      }
      type UserUpdate = Partial<Omit<User, "id">>; // every field optional, no id
      type UserPreview = Pick<User, "id" | "name">;
      type Loaded = Awaited<ReturnType<() => Promise<User>>>; // User
      const ROLES = ["admin", "editor", "viewer"] as const;
      type Role = (typeof ROLES)[number]; // "admin" | "editor" | "viewer"
      const limits = { free: 3, pro: 50 } satisfies Record<string, number>;
      const update: UserUpdate = { name: "Ann" };
      const preview: UserPreview = { id: 1, name: "Ann" };
      const role: Role = "editor";
      const user: Loaded = { id: 2, name: "Bo", email: "bo@example.com" };
      console.log(update, preview.id, role, limits.pro, user.name); // { name: 'Ann' } 1 editor 50 Bo
      ```

      Use `unknown`, not `any`, for data from outside such as `JSON.parse`. The compiler then
      makes you check the shape before you use it.

      ```ts
      function parseScore(json: string): number {
        const data: unknown = JSON.parse(json);
        if (typeof data === "object" && data !== null && "score" in data && typeof data.score === "number") {
          return data.score;
        }
        throw new Error("invalid score");
      }
      console.log(parseScore('{"score": 42}')); // 42
      ```

  - title: Python type hints and Pydantic
    body: |-
      Hints document intent and feed type checkers such as mypy or Pyright. Python ignores them
      at runtime. Use the built-in generics (`list[int]`, `dict[str, int]`) and `X | None`,
      which means the same as `Optional[X]`. A `TypedDict` types a plain dict with known keys.

      ```python
      from typing import NotRequired, Optional, TypedDict

      def average(scores: list[int]) -> float:
          return sum(scores) / len(scores) if scores else 0.0

      def find_price(prices: dict[str, float], item: str) -> float | None:
          return prices.get(item)

      def label(name: Optional[str] = None) -> str:
          return name or "guest"

      class OrderDict(TypedDict):
          id: int
          items: list[str]
          note: NotRequired[str]

      order: OrderDict = {"id": 1, "items": ["tea"]}
      print(average([70, 80]), find_price({"tea": 2.5}, "jam"), label(), order["items"])  # 75.0 None guest ['tea']
      ```

      Callables and generics:

      ```python
      from collections.abc import Callable, Iterable

      type Grid = list[list[int]]

      def first[T](items: list[T]) -> T | None:
          return items[0] if items else None

      def apply(fn: Callable[[int], int], values: Iterable[int]) -> list[int]:
          return [fn(v) for v in values]

      grid: Grid = [[0, 1]]
      print(first(["a"]), apply(lambda x: x * 2, range(3)), grid)  # a [0, 2, 4] [[0, 1]]
      ```

      Pydantic checks data at runtime, which hints alone do not. A model validates on the way
      in, converts where it safely can (the string `"7"` becomes the int `7`), and raises one
      `ValidationError` that lists every problem.

      ```python
      from pydantic import BaseModel, Field, ValidationError

      class LineItem(BaseModel):
          sku: str
          qty: int = Field(gt=0)

      class Order(BaseModel):
          id: int
          items: list[LineItem]
          note: str | None = None

      order = Order.model_validate({"id": "7", "items": [{"sku": "T-1", "qty": 2}]})
      print(order.id, order.items[0].qty, order.model_dump()["note"])  # 7 2 None
      try:
          Order.model_validate({"id": 1, "items": [{"sku": "T-1", "qty": 0}]})
      except ValidationError as err:
          print(err.error_count())  # 1
      print(Order.model_validate_json('{"id": 2, "items": []}').model_dump_json())  # {"id":2,"items":[],"note":null}
      ```

  - title: HTML document skeleton and landmarks
    body: |-
      Every page starts the same way. `lang` sets the language for screen readers, the viewport
      meta makes phones render at device width, and `defer` runs the script after the HTML is
      parsed.

      ```html
      <!doctype html>
      <html lang="en-GB">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Orders</title>
          <link rel="stylesheet" href="styles.css" />
          <script src="app.js" defer></script>
        </head>
        <body></body>
      </html>
      ```

      Landmark elements tell assistive technology what each region is. Use one `main` and one
      `h1` per page, and do not skip heading levels. Reach for `div` and `span` only when no
      element has the right meaning.

      ```html
      <body>
        <header>
          <nav aria-label="Main">
            <a href="/">Home</a>
            <a href="/orders" aria-current="page">Orders</a>
          </nav>
        </header>
        <main>
          <h1>Orders</h1>
          <section aria-labelledby="recent-heading">
            <h2 id="recent-heading">Recent orders</h2>
            <article>
              <h3>Order 1042</h3>
              <p>Three items, dispatched on <time datetime="2026-09-21">21 September</time>.</p>
            </article>
          </section>
        </main>
        <footer><p>Customer service</p></footer>
      </body>
      ```

  - title: HTML forms, buttons, links, lists, tables and images
    body: |-
      Every input needs a label. Tie them together with `for` and `id`, or wrap the input in the
      label. The `type` gives the right phone keyboard and built-in checks. Group radio buttons
      in a `fieldset` with a `legend`.

      ```html
      <form action="/bookings" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label>Guests <input name="guests" type="number" min="1" max="8" value="2" /></label>
        <label for="date">Date</label>
        <input id="date" name="date" type="date" />
        <fieldset>
          <legend>Room</legend>
          <label><input type="radio" name="room" value="single" checked /> Single</label>
          <label><input type="radio" name="room" value="double" /> Double</label>
        </fieldset>
        <label for="note">Note</label>
        <textarea id="note" name="note" rows="3"></textarea>
        <button type="submit">Book</button>
      </form>
      ```

      A link goes somewhere; a button does something on this page. A button inside a form
      submits it unless you set `type="button"`. Images need `alt` text that says what the
      image shows; a decorative image gets an empty `alt=""`. Width and height stop the layout
      jumping while it loads.

      ```html
      <a href="/orders/1042">View order</a>
      <button type="button">Refresh</button>
      <ul>
        <li>Tea</li>
        <li>Milk</li>
      </ul>
      <ol>
        <li>Pick</li>
        <li>Pack</li>
      </ol>
      <img src="teapot.jpg" alt="A white teapot on a wooden table" width="400" height="300" />
      <img src="divider.svg" alt="" />
      ```

      Tables are for tabular data, not layout. A `caption` names the table and `th` with
      `scope` marks header cells.

      ```html
      <table>
        <caption>Orders this week</caption>
        <thead>
          <tr><th scope="col">Order</th><th scope="col">Total</th></tr>
        </thead>
        <tbody>
          <tr><th scope="row">1042</th><td>£24.00</td></tr>
          <tr><th scope="row">1043</th><td>£9.50</td></tr>
        </tbody>
      </table>
      ```

  - title: CSS box model, selectors and specificity
    body: |-
      Every element is a box: content, then padding, then border, then margin. By default
      `width` sets the content only, so padding and border add to it. `border-box` makes
      `width` include them, which is what you expect. Vertical margins between blocks
      collapse into the larger one.

      ```css
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .card {
        width: 300px; /* 300px wide in total with border-box; 334px without */
        padding: 16px;
        border: 1px solid #cccccc;
        margin: 24px auto; /* auto on the sides centres a block that has a width */
      }
      ```

      The selectors you read most often:

      ```css
      nav a { color: inherit; } /* any a inside nav */
      ul > li { margin: 0; } /* direct children only */
      h2 + p { margin-top: 0; } /* the p right after an h2 */
      input[type="email"] { width: 100%; }
      a:hover, a:focus-visible { text-decoration: underline; }
      li:nth-child(odd) { background: #f5f5f5; }
      .card:has(img) { padding: 0; } /* a card that contains an image */
      ```

      When two rules clash, the more specific selector wins. Count IDs, then classes
      (including attributes and pseudo-classes), then elements. On a tie, the later rule wins.
      Inline styles beat all of these, and `!important` beats inline styles. `:where()` adds
      nothing to specificity.

      ```text
      a                        0,0,1
      .card a                  0,1,1
      nav .card a:hover        0,2,2
      input[type="email"]      0,1,1
      #checkout .total         1,1,0
      :where(.card) a          0,0,1
      ```

  - title: Flexbox and grid
    body: |-
      Flexbox lays items out in one direction. Five properties on the container cover most
      layouts: `display`, `flex-direction`, `justify-content` (along the main axis),
      `align-items` (across it) and `gap`. On a child, `flex: 1` takes the spare space.

      ```css
      .toolbar {
        display: flex;
        flex-direction: row; /* column stacks the items */
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap; /* let items move to a new line */
      }
      .toolbar .search {
        flex: 1;
      }
      .toolbar .logo {
        flex-shrink: 0;
      }
      ```

      Grid lays items out in rows and columns at once. `repeat(auto-fit, minmax(200px, 1fr))`
      fits as many columns of at least 200px as the width allows, with no media query.
      `auto-fit` collapses empty tracks so the items stretch; `auto-fill` keeps them.

      ```css
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 24px;
      }
      .layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-areas: "side main";
      }
      .layout > aside {
        grid-area: side;
      }
      .banner {
        grid-column: 1 / -1; /* span every column */
      }
      .centre {
        display: grid;
        place-items: center; /* centres a child both ways */
      }
      ```

  - title: CSS positioning, units, queries and custom properties
    body: |-
      `relative` leaves an element in the flow and makes it the anchor for `absolute`
      children. `absolute` takes the element out of the flow. `fixed` pins it to the viewport.
      `sticky` scrolls with the page until it reaches its offset, then stays.

      ```css
      .card {
        position: relative;
      }
      .card .badge {
        position: absolute; /* placed against the nearest positioned ancestor */
        top: 8px;
        right: 8px;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .toast {
        position: fixed;
        bottom: 16px;
        right: 16px;
      }
      ```

      `rem` is relative to the root font size, usually 16px, and follows the user's browser
      setting. `em` is relative to the element's own font size. `%` is relative to the parent.
      `vh` and `vw` are 1% of the viewport; `dvh` tracks the visible height on phones.
      `clamp(min, preferred, max)` keeps a fluid value within bounds.

      ```css
      h1 {
        font-size: clamp(1.5rem, 4vw, 3rem);
      }
      .panel {
        width: 50%;
        max-width: 40rem;
        padding: 1em;
        min-height: 100dvh;
      }
      ```

      Custom properties are variables that cascade and can change inside a media query.
      Media queries respond to the viewport; container queries respond to the size of a parent
      marked with `container-type`.

      ```css
      :root {
        --space: 16px;
        --brand: #0a6640;
      }
      .button {
        padding: var(--space);
        background: var(--brand);
      }
      @media (min-width: 768px) {
        :root {
          --space: 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none;
        }
      }
      ```

      A container query styles the card by the width of its sidebar, wherever the sidebar
      sits on the page.

      ```css
      .sidebar {
        container-type: inline-size;
      }
      @container (min-width: 400px) {
        .card {
          display: flex;
        }
      }
      ```

  - title: Complexity cheat sheet and a pre-submit checklist
    body: |-
      Average costs for the operations a coding round leans on. "Amortised" means an
      occasional slow step, averaged out over many calls.

      ```text
      Operation                  JavaScript                          Python
      read or write by index     arr[i]  O(1)                        lst[i]  O(1)
      add or remove at end       push, pop  O(1) amortised           append, pop()  O(1) amortised
      add or remove at front     unshift, shift  O(n)                insert(0, x), pop(0)  O(n)
      both ends                  array plus head index  O(1)         deque append, popleft  O(1)
      search unsorted            includes, indexOf, find  O(n)       in, index  O(n)
      lookup by key              Map, Set, object  O(1) average      dict, set  O(1) average
      sort                       sort  O(n log n)                    sort, sorted  O(n log n)
      slice                      slice(a, b)  O(b - a)               lst[a:b]  O(b - a)
      heap push or pop           your heap  O(log n)                 heappush, heappop  O(log n)
      build a heap               push one by one  O(n log n)         heapify  O(n)
      binary search              lowerBound  O(log n)                bisect  O(log n)
      keep a list sorted         splice  O(n)                        insort  O(n)
      min, max, sum              O(n)                                O(n)
      build a string of n parts  parts.join("")  O(n)                "".join(parts)  O(n)
      ```

      As a rough guide, for n around 100 000 aim for O(n log n) or better; O(n²) is ten billion
      steps and will time out.

