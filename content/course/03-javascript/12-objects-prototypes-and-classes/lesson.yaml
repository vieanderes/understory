id: js.prototypes-and-classes
title: Classes and prototypes
objective: Write a class with a constructor and methods, and see the prototype link underneath.
level: essential
minutes: 10
concepts: [js.classes, js.prototypes, js.own-properties]
prerequisites: [js.dom-events]
opening:
  text: >-
    You'll write a class that stamps out objects of the same shape, each with its own data and
    shared methods. It's how most code organises things that have both data and behaviour.

steps:
  - type: prose
    id: why-classes
    body: |-
      A playlist app needs hundreds of song objects, all the same shape. A **class** is the
      blueprint:

      ```js
      class Song {
        constructor(title, seconds) {
          this.title = title;
          this.seconds = seconds;
        }
        minutes() {
          return Math.round(this.seconds / 60);
        }
      }
      const song = new Song("Clair de lune", 300);
      ```

      `new` builds an object and runs the **constructor** on it. `minutes` is a **method**. Inside
      it, `this` is the object the method was called on.

  - type: playground
    id: menu-from-a-class
    concept: js.classes
    difficulty: 1
    prompt: >-
      Each dish on this menu is made from the `Dish` class. Change the `label` method so every
      card shows its price too, like `Soup: £5`. One edit changes all three.
    html: |
      <h1>Today's menu</h1>
      <ul id="menu"></ul>
    js: |
      class Dish {
        constructor(name, price) {
          this.name = name;
          this.price = price;
        }
        label() {
          return this.name;
        }
      }
      const dishes = [new Dish("Soup", 5), new Dish("Pie", 9), new Dish("Tart", 4)];
      for (const dish of dishes) {
        const item = document.createElement("li");
        item.textContent = dish.label();
        document.querySelector("#menu").append(item);
      }
    editable: [js]
    showTree: true
    checks:
      - label: The menu still has three dishes
        selector: '#menu li'
        count: 3
      - label: The first card says Soup and its price
        selector: '#menu li:first-child'
        text: 'Soup: £5'
      - label: The last card says Tart and its price
        selector: '#menu li:last-child'
        text: 'Tart: £4'
    solution:
      js: |
        class Dish {
          constructor(name, price) {
            this.name = name;
            this.price = price;
          }
          label() {
            return this.name + ": £" + this.price;
          }
        }
        const dishes = [new Dish("Soup", 5), new Dish("Pie", 9), new Dish("Tart", 4)];
        for (const dish of dishes) {
          const item = document.createElement("li");
          item.textContent = dish.label();
          document.querySelector("#menu").append(item);
        }
    hints:
      - Only the `return` line inside `label` needs to change.
      - Inside the method, `this.name` and `this.price` belong to the dish being labelled.
      - 'Join them with `+`: `this.name + ": £" + this.price`.'

  - type: prose
    id: extends-and-super
    body: |-
      `extends` makes a more specific kind of an existing class. Custom errors are the classic
      case:

      ```js
      class NotFoundError extends Error {
        constructor(title) {
          super(title + " isn't in the catalogue");
          this.name = "NotFoundError";
        }
      }
      ```

      `super(...)` runs the parent's constructor first, so the message is set. A
      `NotFoundError` is still an `Error`, and `instanceof` can pick it out in a `catch`.

  - type: fill-blank
    id: fill-not-found-error
    concept: js.classes
    difficulty: 2
    language: js
    prompt: >-
      A library search throws its own error when a book is missing. Complete the class and the
      check in the `catch`.
    template: |
      class NotFoundError {{1}} Error {
        constructor(title) {
          {{2}}(title + " isn't in the catalogue");
          this.name = "NotFoundError";
        }
      }
      try {
        throw new NotFoundError("Emma");
      } catch (error) {
        console.log(error {{3}} NotFoundError); // true
      }
    blanks:
      - key: '1'
        answer: extends
      - key: '2'
        answer: super
      - key: '3'
        answer: instanceof
    bank: [extends, super, instanceof, this, Error, typeof]

  - type: prose
    id: the-prototype-link
    body: >-
      Where does `minutes` live? Not on each song. The class keeps one copy on an object called
      `Song.prototype`, and every song links to it. That link is the **prototype**.


      Reading `song.minutes` misses on the song, so the lookup follows the link and finds it
      there. What an object stores itself are its **own properties**. `Object.keys` and
      `JSON.stringify` see only those.

  - type: predict-output
    id: predict-own-keys
    concept: js.own-properties
    difficulty: 2
    language: js
    code: |
      class Song {
        constructor(title, seconds) {
          this.title = title;
          this.seconds = seconds;
        }
        minutes() {
          return Math.round(this.seconds / 60);
        }
      }
      const first = new Song("Clair de lune", 300);
      const second = new Song("Blue in green", 337);
      console.log(Object.keys(first));
      console.log(first.minutes === second.minutes);
    question: What do the last two lines log?
    choices:
      - text: "`[ 'title', 'seconds' ]`, then `true`"
        correct: true
        feedback: >-
          Right. The method isn't own, and both songs reach the one copy.
      - text: "`[ 'title', 'seconds', 'minutes' ]`, then `true`"
        feedback: >-
          `minutes` sits on `Song.prototype`, not on the song. `Object.keys` lists own
          properties only.
      - text: "`[ 'title', 'seconds' ]`, then `false`"
        feedback: >-
          Methods aren't copied into each object. Both songs follow their link to the same
          function.
      - text: "`[ 'title', 'seconds', 'minutes' ]`, then `false`"
        feedback: >-
          That's the picture of copying the method into every song. A class shares one copy
          instead.

  - type: bug-hunt
    id: hunt-shared-lines
    concept: js.prototypes
    difficulty: 3
    language: js
    code: |
      class Playlist {
        constructor(name) {
          this.name = name;
        }
        add(title) {
          this.songs.push(title);
        }
      }
      Playlist.prototype.songs = [];
      const road = new Playlist("Road trip");
      const study = new Playlist("Study");
      road.add("Holiday");
      console.log(study.songs); // [ 'Holiday' ]
    prompt: >-
      A song added to one playlist shows up in every other playlist. Tap the line that lets it
      leak.
    lines: [9]
    reasons:
      - text: One array sits on the prototype, shared by all
        correct: true
        feedback: >-
          Right. `this.songs` finds that one array through the link, and `push` changes it.
      - text: '`this` inside `add` is the `Playlist` class'
        feedback: >-
          `road.add(...)` makes `this` the road playlist. It's the lookup of `songs` that walks
          up.
      - text: '`new` copies the array into each playlist'
        feedback: >-
          `new` copies nothing from the prototype. Each playlist only links to it.
    fix: |
      class Playlist {
        constructor(name) {
          this.name = name;
          this.songs = []; // an own array for each playlist
        }
        add(title) {
          this.songs.push(title);
        }
      }

  - type: code-challenge
    id: write-playlist-class
    concept: js.classes
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Finish the `Playlist` class.


      `add(title, seconds)` stores a song and returns how many songs the playlist now holds.
      `totalMinutes()` adds up the seconds and returns whole minutes, rounded down. Two
      playlists never share songs.


      Example: after `add("Holiday", 200)` and `add("Home", 190)`, `totalMinutes()` returns
      `6`.
    hints:
      - Each playlist needs somewhere of its own to keep songs. Where is `this.name` set?
      - Give the constructor a `this.songs = []`, not the prototype.
      - '`Math.floor(seconds / 60)` rounds down once you''ve added up every song''s seconds.'

  - type: explain-back
    id: explain-json-minutes
    concept: js.own-properties
    difficulty: 3
    prompt: |-
      ```js
      const song = new Song("Clair de lune", 300);
      console.log(song.minutes());       // 5
      console.log(JSON.stringify(song)); // {"title":"Clair de lune","seconds":300}
      ```

      The song can call `minutes()`, yet the JSON has no trace of it. Where does `minutes` live, and why does JSON miss it?
    rubric:
      - The method is stored once, on `Song.prototype`, not on each song.
      - Reading `song.minutes` misses on the song and follows the prototype link to find it.
      - '`JSON.stringify` writes only own properties, the ones the song stores itself.'
    modelAnswer: >-
      The class keeps one `minutes` on `Song.prototype`, and every song links to it. When I call
      `song.minutes()`, the lookup misses on the song and follows that link. `JSON.stringify`
      doesn't follow links. It writes only what the song stores itself, which is `title` and
      `seconds`. So the method works but never appears in the JSON.

recap:
  - Write a class with a constructor and methods, and make objects with `new`.
  - Extend a class, such as `Error`, with `extends` and `super`.
  - Explain why methods live once on the prototype and don't show up in JSON.

recall:
  - id: card-class-creates
    concept: js.classes
    front: What does `new Song("Clair de lune", 300)` do?
    back: >-
      It builds a new object linked to `Song.prototype`, runs the constructor with `this` set to
      it, and returns it.
  - id: card-lookup-walk
    concept: js.prototypes
    front: What happens when you read a property an object doesn't hold?
    back: >-
      The lookup follows the prototype link and returns the first match it finds, or
      `undefined` if the chain runs out.
  - id: card-extends-super
    concept: js.classes
    front: In a class that `extends` another, what must its constructor call first?
    back: >-
      `super(...)`, which runs the parent's constructor. Only then can it use `this`.
  - id: card-own-json
    concept: js.own-properties
    front: Which properties does `JSON.stringify` write for a class instance?
    back: >-
      Only its own properties, the ones set on the object itself. Methods on the prototype
      are left out.

