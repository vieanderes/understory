term: long task
aka: [long tasks, blocking the main thread]
short: A single stretch of JavaScript work over 50 milliseconds that stops the browser responding meanwhile.
explain: |
  The browser has one main thread for your scripts, layout and input. While it runs one
  piece of work, a tap has to wait in line.

  Any task over 50 ms counts. Parsing a big bundle, hydrating a large page or sorting ten
  thousand rows in one go are typical. Split the work into batches and yield between them,
  with `await scheduler.yield()` or a `setTimeout`, so input gets a turn.
analogy: One customer at the only till paying in coins. Everyone behind them waits, however small their shopping.
example:
  language: ts
  code: |
    for (const [i, row] of rows.entries()) {
      process(row);
      if (i % 500 === 0) await scheduler.yield(); // let input in
    }
usage: The profile shows one 900 ms long task during hydration, right when people try to type.
twin:
  term: interaction-to-next-paint
  difference: A long task is the cause, main-thread work that blocks. Interaction to Next Paint is what a visitor measures when their tap waits behind it.
related: [interaction-to-next-paint, main-thread, event-loop, code-splitting]
level: 2
lessons: [perf.cost-of-javascript, perf.web-vitals]
