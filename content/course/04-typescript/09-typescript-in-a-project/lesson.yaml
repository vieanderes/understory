deepDive: >-
  `isolatedModules` makes `tsc` report code that a one-file-at-a-time tool can't handle, such
  as the type re-export above. `verbatimModuleSyntax` goes further: every type import must say
  `type`, and everything else is kept exactly as written.


  `skipLibCheck` stops checking every `.d.ts` file, yours included. It saves time and hides
  broken declarations.


  A large repository can split into several projects. **Project references** let one
  `tsconfig.json` depend on another's built declarations, and `tsc -b` builds them in order,
  skipping what hasn't changed. The referenced project sets `"composite": true`.


  Inside a module, `declare global { interface Window { ... } }` adds a property to the
  browser's own `Window` type. It's a promise like any other declaration.
