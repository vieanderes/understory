summary: >-
  Interval problems are about pairs of `[start, end]`: bookings, meetings, shifts, time
  ranges in a log. The questions repeat: merge the overlaps, count how many overlap at once,
  fit the most in without overlap, or remove the fewest so the rest fit. Almost every one
  starts with a sort, because once intervals are ordered, each one only needs comparing with
  its neighbour or with a single running value. Sort by start to merge and to sweep; sort by
  end to choose the most that fit.


  Greedy algorithms commit to the best-looking option at each step and never look back. They
  are short and fast, usually a sort plus one pass, but they are only correct when you can
  argue that no optimal answer needs a different choice. The standard argument is the
  exchange: take any optimal answer and show its first choice can be swapped for the greedy
  one without making it worse. When the swap fails, a small counterexample usually appears,
  and the problem needs dynamic programming instead.


  The signals are "overlapping", "busy", "free slots", "rooms needed", "at the same time",
  "the most meetings", "the fewest removals", "schedule", and an expected complexity of
  O(n log n), which hints at a sort. A statement that says intervals arrive sorted and asks
  for O(n) is telling you not to sort again.
remember:
  - Sort intervals by start to merge them or sweep through them, and by end to fit the most without overlap.
  - When merging, stretch the last block with `Math.max(last[1], end)`, because an interval can sit inside another.
  - Two half-open intervals overlap exactly when `a.start < b.end && b.start < a.end`.
  - Ask whether touching intervals like `[1, 3]` and `[3, 5]` overlap; the answer is the difference between `<` and `<=`.
  - The earliest-finishing interval is a safe greedy first pick, and the fewest removals equals n minus the most that fit.
  - The rooms needed equals the largest number of intervals open at one moment, found with sorted starts and ends in O(n log n).
  - A greedy rule is trusted only after an exchange argument or a failed search for a small counterexample.
  - When intervals carry weights, greedy by end fails and you need dynamic programming with a binary search.
sections:
  - title: The interval toolkit
    body: |-
      Three small pieces cover most interval code. Write them the same way every time, with
      the overlap rule decided once.

      ```js
      // Half-open intervals [start, end): touching intervals do not overlap.
      const overlaps = (a, b) => a[0] < b[1] && b[0] < a[1];

      // Intersections of two lists that are each sorted and non-overlapping.
      function intersect(first, second) {
        const out = [];
        let i = 0;
        let j = 0;
        while (i < first.length && j < second.length) {
          const start = Math.max(first[i][0], second[j][0]);
          const end = Math.min(first[i][1], second[j][1]);
          if (start < end) out.push([start, end]);
          // The interval that ends first cannot meet anything later in the other list.
          if (first[i][1] < second[j][1]) i++;
          else j++;
        }
        return out;
      }

      console.log(overlaps([1, 3], [2, 5])); // true
      console.log(overlaps([1, 3], [3, 5])); // false
      console.log(intersect([[0, 2], [5, 10]], [[1, 5], [8, 12]])); // [[1, 2], [8, 10]]
      console.log(intersect([], [[1, 2]])); // []
      ```

      The overlap test reads as "each starts before the other ends". Its negation, "one
      ends before the other starts", is how most people reason, and it is simple to get
      backwards under pressure, so memorise the positive form. `intersect` is two pointers,
      O(n + m) time, and is the answer to "find the free time common to two calendars" once
      you merge each calendar first.
  - title: 'Classic problem: how many rooms?'
    body: |-
      The deep dive describes the two sorted arrays. The code is short, and the one detail
      that matters is the tie: a meeting ending at 10 frees its room for one starting at 10.
      Handling ends before starts at the same time is what `<=` below does.

      ```js
      function roomsNeeded(meetings) {
        const starts = meetings.map((m) => m[0]).sort((a, b) => a - b);
        const ends = meetings.map((m) => m[1]).sort((a, b) => a - b);
        let open = 0;
        let most = 0;
        let e = 0;
        for (const start of starts) {
          // Free every room whose meeting has ended by now.
          while (ends[e] <= start) {
            e++;
            open--;
          }
          open++;
          most = Math.max(most, open);
        }
        return most;
      }

      console.log(roomsNeeded([[0, 30], [5, 10], [15, 20]])); // 2
      console.log(roomsNeeded([[1, 3], [3, 5]])); // 1
      console.log(roomsNeeded([])); // 0
      ```

      O(n log n) time for the two sorts, O(n) space. It works because only counts matter,
      not which meeting sits in which room, so starts and ends can be sorted separately. If
      the task asks which room each meeting gets, switch to a min-heap of end times keyed
      with the room number. The same sweep answers "the most concurrent users" or "the
      busiest moment" in a log of sessions.
  - title: 'Classic greedy problems: removals and ropes'
    body: |-
      **Fewest removals so nothing overlaps.** Removing the fewest is keeping the most, so
      this is the lesson's talks problem in disguise: n minus the maximum you can keep.

      ```js
      function fewestRemovals(intervals) {
        const sorted = [...intervals].sort((a, b) => a[1] - b[1]);
        let kept = 0;
        let free = -Infinity;
        for (const [start, end] of sorted) {
          if (start >= free) {
            kept++;
            free = end;
          }
        }
        return intervals.length - kept;
      }

      console.log(fewestRemovals([[1, 2], [2, 3], [3, 4], [1, 3]])); // 1
      console.log(fewestRemovals([[1, 2], [1, 2], [1, 2]])); // 2
      ```

      O(n log n) time, O(n) for the copy. Recognising "fewest to remove" as "most to keep"
      is the whole trick, and interviewers use it to see whether you spot a known problem.

      **Tying ropes.** The classic TieRopes task: adjacent ropes may be tied together, and you want
      the most ropes of length at least K. Greedy: tie from the left until the length reaches
      K, count it, start again.

      ```js
      function tieRopes(k, ropes) {
        let count = 0;
        let length = 0;
        for (const rope of ropes) {
          length += rope;
          if (length >= k) {
            count++;
            length = 0;
          }
        }
        return count;
      }

      console.log(tieRopes(4, [1, 2, 3, 4, 1, 1, 3])); // 3
      console.log(tieRopes(10, [1, 2])); // 0
      ```

      O(n) time, O(1) space. The exchange argument: stopping as soon as a rope reaches K
      leaves the most material for the rest, and adding more to a finished rope never helps
      it count twice.
  - title: When greedy fails, and what replaces it
    body: |-
      Give each interval a value, say the fee for a booking, and ask for the largest total
      of non-overlapping bookings. Earliest finish now fails: a short cheap booking can block
      a long valuable one. Largest value first also fails: one valuable booking can block two
      that are worth more together. This is **weighted interval scheduling**, and it needs
      dynamic programming.

      Sort by end. For booking i, either skip it, keeping the best of the first i − 1, or
      take it, adding its value to the best among bookings that end by its start. Because
      ends are sorted, that last compatible booking is found by binary search.

      ```js
      // jobs: [start, end, value], half-open, so a job ending at t fits one starting at t.
      function bestWeighted(jobs) {
        const sorted = [...jobs].sort((a, b) => a[1] - b[1]);
        const best = new Array(sorted.length + 1).fill(0); // best[i]: using the first i jobs
        for (let i = 1; i <= sorted.length; i++) {
          const [start, , value] = sorted[i - 1];
          // The largest count p of earlier jobs whose last one ends by `start`.
          let lo = 0;
          let hi = i - 1;
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (sorted[mid - 1][1] <= start) lo = mid;
            else hi = mid - 1;
          }
          best[i] = Math.max(best[i - 1], best[lo] + value);
        }
        return best[sorted.length];
      }

      console.log(bestWeighted([[1, 3, 5], [2, 5, 6], [4, 6, 5]])); // 10
      console.log(bestWeighted([[1, 10, 20], [1, 2, 5], [2, 3, 5]])); // 20
      console.log(bestWeighted([])); // 0
      ```

      O(n log n) time, O(n) space. Saying "the unweighted version is greedy, the weighted one
      is DP, and here is the counterexample" is a strong senior answer, because it shows you
      know where the greedy argument stops.
  - title: How to present an interval solution
    body: |-
      Open with the sort and its reason, since that is the decision the interviewer is
      checking: "I'll sort by start, so any interval that overlaps the current block is next
      to it." Or, for choosing: "I'll sort by end, because the meeting that finishes first
      leaves the most room." Then give the cost: the sort is O(n log n), the pass O(n).

      For a greedy, say the exchange argument in two sentences before coding, and offer a
      counterexample for the rule you rejected. For activity selection: "Sorting by start
      fails on `[[1, 10], [2, 3], [4, 5]]`, where the long first meeting blocks two short
      ones. Sorting by duration fails on `[[1, 5], [4, 7], [6, 10]]`, where the shortest
      meeting clashes with both others."

      Then test these, because each one breaks a different line:

      - no intervals, and one interval;
      - touching intervals, to confirm your `<` or `<=` decision;
      - an interval nested inside another;
      - identical intervals;
      - input in reverse order, and already sorted;
      - the input array unchanged afterwards, since `sort` works in place.
pitfalls:
  - "**Sorting without a comparator.** `sort()` on pairs compares them as strings, so `[10, 12]` sorts before `[9, 11]`. Pass `(a, b) => a[0] - b[0]`."
  - "**Shrinking a block with a nested interval.** Setting `last[1] = end` loses time when the new interval sits inside the last block. Use `Math.max(last[1], end)`."
  - "**Sorting the caller's array.** `sort` mutates. Sort a copy with `[...intervals]`, and push copies of intervals into the result so later stretching does not change the input pairs."
  - "**Deciding touching intervals by accident.** `<` and `<=` give different answers for `[1, 3]` and `[3, 5]`. Ask, write the rule down, and add a test for it."
  - "**Sorting by start to pick the most intervals.** An early, long interval blocks many short ones. Sort by end for selection."
  - "**Trusting a greedy that passed the example.** Largest coin first works for 1, 2 and 5 but fails for 1, 5 and 6. Try a few tiny inputs against a brute force before committing."
interview:
  - question: Merge overlapping intervals. What's the complexity and why sort by start?
    answer: >-
      Sort by start, then merge in one pass, for O(n log n) time and O(n) space for the
      output. After sorting, if the next interval overlaps anything already merged, it must
      overlap the last merged block, because every earlier block ends before that block
      starts. So I compare each interval with the last block only: if it starts at or before
      the block's end, I extend the end with `Math.max`, otherwise I start a new block.
      `Math.max` matters for nested intervals like `[1, 10]` and `[2, 3]`. I sort a copy so
      the caller's array is untouched, and I ask whether touching intervals should merge. If
      the input is already sorted, the pass alone is O(n).
  - question: How many meeting rooms do these meetings need?
    answer: >-
      The largest number of meetings in progress at one moment, found by sweeping sorted
      start and end times, in O(n log n). I sort the starts and the ends separately. For each
      start in order, I first release every meeting whose end is at or before that start,
      then open a room, tracking the maximum open. Sorting separately is fine because only
      the count matters, not which meeting holds which room. A meeting ending at 10 frees
      its room for one starting at 10, which is why the release uses `<=`. The alternative is
      a min-heap of end times, same complexity, and better when I must also assign room
      numbers.
  - question: How do you know a greedy algorithm is correct?
    answer: >-
      I prove it with an exchange argument, or I stop trusting it when a small
      counterexample appears. The exchange argument takes any optimal solution and shows its
      first choice can be replaced by the greedy choice without making it worse; repeating
      that turns the optimal solution into the greedy one. For picking the most meetings,
      the one that ends first can replace the first meeting of any optimal schedule, since
      it ends no later and so clashes with nothing that followed. In practice I also compare
      against a brute force on tiny inputs, because that finds failures quickly, like
      largest-coin-first with coins 1, 5 and 6 for 10. If the swap fails, the problem usually
      needs dynamic programming.
  - question: Now each meeting has a value. Maximise the total value you can attend.
    answer: >-
      Greedy no longer works, so I use dynamic programming over meetings sorted by end time,
      O(n log n) overall. For the i-th meeting I choose the better of skipping it, which
      keeps the best total of the first i − 1, or taking it, which adds its value to the best
      total among meetings that end by its start. Because ends are sorted, that last
      compatible meeting is found by binary search, so each step is O(log n). Earliest
      finish fails on a short cheap meeting that blocks a long valuable one, and highest
      value fails when one big meeting blocks two that add up to more. Space is O(n) for the
      table.
terms:
  - term: Overlap
    say: Two intervals overlap when they touch.
    means: It depends on whether ends are included. Half-open intervals overlap exactly when `a.start <
      b.end && b.start < a.end`, so `[1, 3)` and `[3, 5)` don't.
  - term: Merging intervals
    say: Compare every pair and join the overlaps.
    means: Sort by start, then either stretch the last merged block with `Math.max(last[1], end)` or
      start a new one, for O(n log n). The `max` matters because one interval can sit inside
      another.
  - term: Greedy algorithm
    say: Take the best-looking option at each step.
    means: It commits to a locally best choice and never revisits it. It is only correct when you can
      show that some optimal answer starts with that same choice.
  - term: Exchange argument
    say: It worked on every example I tried.
    means: A proof that the first choice of any optimal answer can be swapped for the greedy choice
      without making it worse, so the greedy rule loses nothing.
  - term: Interval scheduling
    say: Pick the shortest meetings first.
    means: To fit the most non-overlapping intervals, pick by earliest end. Shortest-first fails when
      one short interval overlaps two others that would both have fitted.
  - term: Rooms needed
    say: The number of overlapping pairs.
    means: The largest number of intervals open at one moment, found by sweeping sorted starts and
      sorted ends in O(n log n).
