term: pseudo-class
aka:
  - pseudo class
short: A selector keyword after a single colon that matches elements by their state or position.
explain: |
  You want a link to change colour when hovered, or the first item in a list to have no
  border. The HTML doesn't change, so there's no class to target.

  Keywords with one colon match a state: `:hover`, `:focus-visible`, `:checked`,
  `:disabled`, `:invalid`. Others match a position: `:first-child`, `:nth-child(2n)`.
  Newer ones take selectors, such as `:has()` and `:not()`. Each counts as a class in
  specificity.
analogy: 'A game rule for "whoever is holding the ball". It is not a name tag; it picks out whoever fits right now.'
example:
  language: css
  code: |
    a:hover { text-decoration: underline; }
    button:focus-visible { outline: 2px solid; }
    li:nth-child(odd) { background: whitesmoke; }
    .card:has(img) { padding-top: 0; }
usage: Style the focus ring with the focus-visible pseudo-class so mouse clicks don't show it.
twin:
  term: pseudo-element
  difference: A pseudo-class picks out a real element in a certain state, with one colon. A pseudo-element styles a part that isn't its own element, like the first line or generated content, with two colons.
related:
  - pseudo-element
  - specificity
  - focus-indicator
level: 2
