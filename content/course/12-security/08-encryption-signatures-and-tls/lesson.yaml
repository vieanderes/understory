id: security.encryption-and-tls
title: Encryption, signatures and TLS
objective: "Choose encryption, a MAC or a signature for a job, and say what HTTPS protects and what it doesn't."
level: advanced
minutes: 10
concepts: [security.encryption, security.mac-and-signatures, security.tls-guarantees]
prerequisites: [security.cryptography, backend.webhooks]
opening:
  text: >-
    You'll pick the right tool when data must stay private or arrive unchanged. And you'll
    know exactly what the padlock in the address bar promises, so you never lean on it for
    more.

steps:
  - type: prose
    id: symmetric-encryption
    body: >-
      Last lesson, **encryption** scrambled data with a key so that only a key holder can read
      it. The simplest kind uses one key for both jobs: lock and unlock. That's **symmetric
      encryption**, like a house key.


      It's fast, and it's what protects a backup file or a column of card numbers. The catch:
      everyone who must read the data needs a copy of that one key.

  - type: prose
    id: public-key
    body: >-
      **Public-key encryption** splits the key in two, a **key pair**. Think of an open
      padlock. You hand out padlocks (the **public key**) to anyone. Only you keep the key that
      opens them (the **private key**).


      It also runs backwards. Only the private key can make a **signature** on a message, and
      anyone with the public key can check it. So a signature proves who sent something.

  - type: multiple-choice
    id: pick-signing-key
    concept: security.encryption
    difficulty: 1
    question: Anyone should be able to check that a download really came from you. What do you sign it with?
    choices:
      - text: Your private key
        correct: true
        feedback: >-
          Right. Only you hold it, and your public key lets anyone check the signature.
      - text: Your public key
        feedback: >-
          Everyone has your public key, so anyone could sign with it. It's for checking.
      - text: A key you email to each user
        feedback: >-
          Then every user holds the key, and any of them could fake a signature.

  - type: prose
    id: mac-vs-signature
    body: |-
      A **MAC** is a fingerprint made with a secret key, so only key holders can make it. The
      usual one is **HMAC**, a hash mixed with a secret:

      ```js
      createHmac("sha256", secret).update(body).digest("hex");
      ```

      Webhooks use this: sender and receiver share the secret. A signature is for when the
      checker mustn't be able to forge. A login provider signs its tokens, so every app can
      check them and none can make one.

  - type: ai-review
    id: review-unkeyed-checksum
    concept: security.mac-and-signatures
    difficulty: 3
    language: js
    request: Let partners check that our order webhooks weren't changed on the way.
    flawClass: security
    code: |
      import { createHash } from "node:crypto";

      async function sendOrderWebhook(url, order) {
        const body = JSON.stringify(order);
        const checksum = createHash("sha256").update(body).digest("hex");
        await fetch(url, {
          method: "POST",
          headers: { "X-Checksum": checksum },
          body,
        });
      }
    prompt: >-
      An assistant wrote this. Partners compare the checksum, and it always matches. Then
      someone sends a fake order with a matching checksum. Tap the line at fault.
    lines: [5]
    reasons:
      - text: Anyone can compute a plain hash of their own body
        correct: true
        feedback: >-
          Yes. No secret goes in, so it proves nothing. Use `createHmac` with a shared secret.
      - text: '`sha256` digests are too short to be safe'
        feedback: >-
          The length is fine. The flaw is that no key goes in, so a forger can make one too.
      - text: The checksum belongs in the body, not a header
        feedback: >-
          Moving it changes nothing. Anyone can still hash a fake body and attach the result.
    fix: |
      import { createHmac } from "node:crypto";

      async function sendOrderWebhook(url, order) {
        const body = JSON.stringify(order);
        const signature = createHmac("sha256", process.env.WEBHOOK_SECRET).update(body).digest("hex");
        await fetch(url, {
          method: "POST",
          headers: { "X-Signature": signature },
          body,
        });
      }

  - type: prose
    id: compare-safely
    body: >-
      The receiver makes its own HMAC of the body and compares. One trap: `===` stops at the
      first different character, so it answers faster the more you get right. An attacker can
      time that.


      `timingSafeEqual` from `node:crypto` always reads everything. It takes two **Buffers**,
      Node's type for raw bytes, of equal length. `Buffer.from(text, "hex")` turns hex text
      into one.

  - type: fill-blank
    id: fill-verify-webhook
    concept: security.mac-and-signatures
    difficulty: 3
    language: js
    prompt: >-
      Check an incoming webhook. Make the HMAC of the body with the shared secret. Then compare
      it with the header without leaking timing. Fill the gaps.
    template: |
      import { createHmac, timingSafeEqual } from "node:crypto";

      const expected = {{1}}("sha256", secret).update(body).digest();
      const sent = Buffer.from(header, "hex");
      const ok = expected.length === sent.length && {{2}}(expected, sent);
    blanks:
      - key: '1'
        answer: createHmac
      - key: '2'
        answer: timingSafeEqual
    bank: [createHmac, createHash, timingSafeEqual, Buffer.compare]

  - type: prose
    id: what-tls-does
    body: >-
      **HTTPS** is HTTP sent through **TLS**, which encrypts the connection. Nobody on the
      network, such as a café's wi-fi, can read or change the traffic.


      TLS also checks the server's **certificate**. It's a document, signed by a trusted
      authority, that says "this public key belongs to `bank.example`". If Node can't verify it, the
      request fails with an error such as `self-signed certificate`. That error protects you.

  - type: bug-hunt
    id: find-tls-check-off
    concept: security.tls-guarantees
    difficulty: 3
    language: json
    code: |
      {
        "scripts": {
          "dev": "node --watch server.js",
          "start": "NODE_TLS_REJECT_UNAUTHORIZED=0 node server.js",
          "test": "node --test"
        }
      }
    prompt: >-
      Calls to a partner's API failed with `self-signed certificate`. This commit made them
      work. Tap the line that should never ship.
    lines: [4]
    reasons:
      - text: It turns off certificate checks for every HTTPS call
        correct: true
        feedback: >-
          Yes. Anyone in between can now pretend to be any server. Fix the certificate instead.
      - text: '`node server.js` should be `next start`'
        feedback: >-
          How the server starts isn't the problem. The variable in front of it is.
      - text: The `dev` script should use the same variable
        feedback: >-
          That would spread the hole. The variable switches off the check that stops impostors.
    fix: |
      {
        "scripts": {
          "dev": "node --watch server.js",
          "start": "node server.js",
          "test": "node --test"
        }
      }

  - type: explain-back
    id: explain-what-tls-does-not-do
    concept: security.tls-guarantees
    difficulty: 4
    prompt: >-
      A teammate says "we're on HTTPS, so the input is safe". What does TLS actually
      guarantee, and why doesn't it stop SQL injection?
    rubric:
      - TLS keeps the traffic private and unchanged between the browser and the server.
      - The certificate proves the server's name, so you're talking to the right server.
      - It says nothing about what the server does with the data, so injection and XSS are untouched.
    modelAnswer: >-
      TLS protects the connection. Nobody in between can read the bytes or change them. The
      certificate proves the server is who it says it is. That's all in transit. Once the
      request arrives, TLS is done. A malicious query in the body arrives intact and private.
      Then your code runs it. Injection, XSS and broken access control all happen at the ends,
      where TLS never reaches.

recap:
  - Encrypt with one shared key, or a key pair when others only need to lock or check.
  - Prove a message is unchanged with an HMAC when both sides share a secret, a signature when they mustn't.
  - Trust HTTPS for the connection only, and never switch off certificate checks.

recall:
  - id: card-private-vs-public
    concept: security.encryption
    front: In a key pair, which key signs and which one checks?
    back: >-
      The private key signs, and only its owner has it. The public key checks, and anyone can
      have it.
  - id: card-unkeyed-hash
    concept: security.mac-and-signatures
    front: Why doesn't a plain `sha256` of a message prove it wasn't changed?
    back: >-
      No secret goes in, so whoever changes the message can compute a new hash too. An HMAC
      needs the key.
  - id: card-mac-vs-sig
    concept: security.mac-and-signatures
    front: When do you need a signature rather than a MAC?
    back: >-
      When the checker must not be able to forge. A MAC's secret is shared, so either side
      could have made it.
  - id: card-tls-scope
    concept: security.tls-guarantees
    front: What does TLS not protect against?
    back: >-
      Anything an endpoint does with the data, such as injection or XSS. It protects the
      connection, not the code at either end.

references:
  - kind: rfc
    title: 'RFC 8446: The Transport Layer Security (TLS) Protocol Version 1.3'
    authors: E. Rescorla
    year: 2018
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc8446
    note: What TLS provides between two endpoints, and where its guarantees end.
    primary: true
    verified: true
  - kind: rfc
    title: 'RFC 2104: HMAC: Keyed-Hashing for Message Authentication'
    authors: H. Krawczyk, M. Bellare and R. Canetti
    year: 1997
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc2104
    note: How a hash and a shared secret make a MAC.
    primary: true
    verified: true
  - kind: docs
    title: Crypto
    authors: Node.js
    venue: Node.js documentation
    url: https://nodejs.org/api/crypto.html
    note: '`createHmac`, `timingSafeEqual`, and `sign` and `verify` for key pairs.'
    verified: true
  - kind: docs
    title: 'Command-line API: NODE_TLS_REJECT_UNAUTHORIZED=value'
    authors: Node.js
    venue: Node.js documentation
    url: https://nodejs.org/api/cli.html#node_tls_reject_unauthorizedvalue
    note: The variable that switches off certificate checks, which Node warns about when set to 0.
    verified: true

deepDive: >-
  Public-key encryption is slow, so real systems combine the two kinds. TLS uses key pairs
  to agree a fresh symmetric key with the server, then encrypts the traffic with that fast
  key. Each connection gets its own.


  A signature gives something a MAC can't: the signer can't later deny it, because nobody
  else holds the private key. With a MAC both sides hold the secret, so either could have
  made the tag. In Node, `generateKeyPairSync("ed25519")`, `sign` and `verify` do signatures.


  Setting `NODE_TLS_REJECT_UNAUTHORIZED=0` makes Node print a warning that every HTTPS
  request is now insecure. The code option `rejectUnauthorized: false` does the same for one
  request, silently. For a partner with a private certificate, add their authority's
  certificate to what Node trusts (the `ca` option, or `--use-system-ca`) instead of turning
  checks off.
