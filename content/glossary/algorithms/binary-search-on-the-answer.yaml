term: binary search on the answer
aka:
  - binary search over the answer
  - parametric search
short: Guessing the result itself and halving the range of guesses, using a yes or no check each time.
explain: |
  Some tasks ask for the smallest value that works. "What's the least daily limit that
  fits these episodes into K seasons?" Trying every limit is too slow.

  Notice the shape. If a limit works, every bigger limit works too. So the answers form
  "no, no, no, yes, yes". Binary search finds the first yes, checking each guess with a
  simple greedy pass.

  The cost is the check times the log of the range. Spot it when the expected complexity
  has a log in it but the input isn't sorted.
analogy: Finding the right shoe size by trying a middle size, then going up or down half the gap.
example:
  language: python
  code: |
    def smallest_limit(lengths, seasons):
        lo, hi = max(lengths), sum(lengths)
        while lo < hi:
            mid = (lo + hi) // 2
            if fits(lengths, mid, seasons):
                hi = mid
            else:
                lo = mid + 1
        return lo
usage: The check is monotonic, so use binary search on the answer between the max and the sum.
