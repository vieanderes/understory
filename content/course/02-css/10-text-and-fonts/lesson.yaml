id: css.typography
title: Text and fonts
objective: Choose a font stack, set comfortable lines of text, and load a web font without surprises.
level: essential
minutes: 10
concepts: [css.text-styling, css.measure-and-scale, css.font-loading]
prerequisites: [css.custom-properties]
opening:
  text: >-
    You'll turn a wall of text into something people enjoy reading, with the right fonts,
    line lengths and spacing. Most of a web page is text, so this shows everywhere.

steps:
  - type: prose
    id: font-stacks
    body: |-
      `font-family` takes a list. The browser uses the first font it has, so the list ends
      with a generic family that always exists:

      ```css
      body { font-family: Georgia, serif; }
      ```

      `serif` fonts have small strokes at the ends of letters, and `sans-serif` fonts don't.
      `system-ui` uses the device's own interface font. This list is called a **font stack**.

  - type: playground
    id: style-the-article
    concept: css.text-styling
    difficulty: 1
    prompt: >-
      Give `body` the stack `Georgia, serif`, and give `h1` the stack `system-ui,
      sans-serif`. Then make `.byline` `14px`. Watch the article take on a voice.
    html: |
      <h1>Cooking with a cast-iron pan</h1>
      <p class="byline">Five minutes to read</p>
      <p>A cast-iron pan lasts a lifetime if you treat it well. Heat it slowly, oil it
      lightly, and never leave it to soak. It rewards you with the best crust on a steak and
      the crispest edges on a potato cake.</p>
    css: |
      body { }
      h1 { }
      .byline { color: dimgrey; }
    editable: [css]
    checks:
      - label: The body text uses Georgia
        selector: body
        style: { property: font-family, value: 'Georgia, serif' }
      - label: The heading uses the system font
        selector: h1
        style: { property: font-family, value: 'system-ui, sans-serif' }
      - label: The byline is 14px
        selector: .byline
        style: { property: font-size, value: 14px }
    solution:
      css: |
        body { font-family: Georgia, serif; }
        h1 { font-family: system-ui, sans-serif; }
        .byline { color: dimgrey; font-size: 14px; }
    hints:
      - Each font stack is a comma-separated list after `font-family:`.
      - The byline needs a `font-size`.
      - 'Start with `body { font-family: Georgia, serif; }`.'

  - type: prose
    id: readable-lines
    body: >-
      Long lines are tiring: your eye loses its place on the way back. Aim for 45 to 75
      characters a line. That length is called the **measure**. The `ch` unit is about one
      character wide, so `max-width: 65ch` keeps a column readable.


      Lines need room too. `line-height: 1.5` puts one and a half times the font size from
      one line to the next.

  - type: playground
    id: try-the-measure
    prompt: >-
      Change `max-width` to `100ch`, then to `30ch`, then back to `65ch`. Then try
      `line-height` at `1.1` and `1.8`. Notice which one feels easiest to read.
    html: |
      <article>
        <p>A cast-iron pan lasts a lifetime if you treat it well. Heat it slowly, oil it
        lightly, and never leave it to soak. Clean it while it's still warm, with hot water
        and a stiff brush. Dry it on the hob, then rub in a few drops of oil. Over the months,
        the oil builds a dark, glassy layer that food won't stick to. That layer is the
        seasoning, and it's why an old pan often cooks better than a new one.</p>
      </article>
    css: |
      article {
        max-width: 65ch;
        line-height: 1.5;
        font-family: Georgia, serif;
      }
    editable: [css]

  - type: prose
    id: unitless-line-height
    body: >-
      Write `line-height` as a plain number, with no unit.


      A number is handed down as a number, so each element multiplies it by its own font
      size. A length like `1.5em` is worked out once, where you write it. Everything inside
      then inherits that one pixel value, even much bigger text.

  - type: bug-hunt
    id: hunt-line-height-em
    concept: css.measure-and-scale
    difficulty: 3
    language: css
    code: |
      .article {
        font-size: 16px;
        line-height: 1.5em;
      }
      .article h2 { font-size: 32px; }
    prompt: >-
      Body text looks fine, but a heading that wraps squashes its two lines together. Tap the
      line at fault.
    lines: [3]
    reasons:
      - text: '`1.5em` is worked out once, then inherited as pixels'
        correct: true
        feedback: >-
          Right. The heading gets the paragraph's spacing. Write `line-height: 1.5`.
      - text: The heading's font size is too big
        feedback: >-
          Big headings are fine. They need spacing that grows with them, and this doesn't.
      - text: '`line-height` needs a `px` value'
        feedback: >-
          A pixel value has the same problem: every element inherits it, whatever its size.
    fix: |
      .article {
        font-size: 16px;
        line-height: 1.5;
      }
      .article h2 { font-size: 32px; }

  - type: prose
    id: web-fonts
    body: |-
      A **web font** is a font file the page downloads:

      ```css
      @font-face {
        font-family: "Grove";
        src: url("grove.woff2") format("woff2");
        font-display: swap;
      }
      ```

      Until the file arrives, `swap` shows the text in the next font of the stack. Then Grove
      takes over. The catch: two fonts have different letter widths, so text can reflow.

  - type: fill-blank
    id: fill-font-face
    concept: css.font-loading
    difficulty: 2
    language: css
    prompt: >-
      Load `grove.woff2` as the font Grove. Show the fallback font until it arrives. Then use
      Grove for the page.
    template: |
      @font-face {
        font-family: "Grove";
        src: {{1}}("grove.woff2") format("woff2");
        font-display: {{2}};
      }
      body { font-family: {{3}}, Arial, sans-serif; }
    blanks:
      - key: '1'
        answer: url
      - key: '2'
        answer: swap
      - key: '3'
        answer: '"Grove"'
    bank: [url, href, swap, wait, '"Grove"', '"grove.woff2"']

  - type: explain-back
    id: explain-font-shift
    concept: css.font-loading
    difficulty: 3
    prompt: >-
      A Save button jumps down a moment after the page appears, as the brand font
      arrives. Why?
    rubric:
      - With `swap`, the text first shows in a fallback font from the stack.
      - The web font's letters are wider, so a line that fitted now wraps.
      - The extra line pushes everything below it down, including the button.
    modelAnswer: >-
      `swap` shows the text in the fallback font while the web font downloads. When the web
      font arrives, the same words take more room. The title no longer fits on one line, so
      it wraps onto a second one. Everything below moves down a line. A fallback with
      similar widths makes the jump smaller.

recap:
  - Choose a font stack that ends in a generic family.
  - Keep text readable with a `ch` measure and a unitless `line-height`.
  - Load a web font with `swap`, and expect text to reflow when it lands.

recall:
  - id: card-font-stack
    concept: css.text-styling
    front: Why should a font stack end with `serif` or `sans-serif`?
    back: >-
      A generic family always exists, so the text still gets a sensible font when none of the
      named ones is available.
  - id: card-unitless-line-height
    concept: css.measure-and-scale
    front: "Why write `line-height: 1.5` rather than `1.5em`?"
    back: >-
      A number is inherited as a number, so every element multiplies it by its own size. An
      `em` value is worked out once and inherited as pixels.
  - id: card-ch-unit
    concept: css.measure-and-scale
    front: How wide should a column of text be, and which unit helps?
    back: >-
      About 45 to 75 characters. `ch` is roughly one character wide, so `max-width: 65ch`
      works.
  - id: card-font-display-swap
    concept: css.font-loading
    front: 'What does `font-display: swap` show while a web font downloads?'
    back: >-
      The text in the next font of the stack. The web font replaces it when the file arrives.

references:
  - kind: spec
    title: CSS Fonts Module Level 4
    authors: Chris Lilley
    venue: W3C
    url: https://www.w3.org/TR/css-fonts-4/#font-display-desc
    note: Font stacks, `@font-face` and the `font-display` values.
    primary: true
    verified: true
  - kind: docs
    title: Fundamental text and font styling
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Text_styling/Fundamentals
    note: Font stacks, sizes, weights, alignment and line height, with examples.
    verified: true
  - kind: docs
    title: line-height CSS property
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/line-height
    note: Why a unitless number behaves differently from a length when inherited.
    verified: true

deepDive: >-
  `font-display` has five values. `block` hides text for up to about three seconds while the
  font loads. `swap` shows the fallback at once and swaps whenever the font lands. `fallback`
  hides text for about 100ms, then allows a swap only for about three seconds. `optional`
  gives the font about 100ms and otherwise keeps the fallback for that visit. `auto` leaves
  it to the browser.


  A fallback can be tuned to take the same room as the web font. Wrap a local font in its own
  `@font-face` with `src: local("Arial")` and `size-adjust: 110%`, and the letters grow to
  match, so the swap barely moves anything.


  Strictly, `1ch` is the width of the `0` in the element's own font and size, so a `ch` measure
  grows with the text.


  A type scale multiplies one size by the same ratio, step after step: 16px, 20px, 25px,
  31.25px with a ratio of 1.25. Headings drawn from one scale look related.
