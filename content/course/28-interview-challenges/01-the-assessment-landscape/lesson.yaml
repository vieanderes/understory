id: interview.landscape
title: The assessment landscape
objective: Tell the six kinds of coding round apart, know how each is scored, and ask the recruiter the questions that change your preparation.
level: essential
minutes: 9
concepts: [interview.round-formats, interview.recruiter-questions]
prerequisites: [algo.mock-round]
opening:
  text: >-
    You'll know which kind of coding round you're walking into and what it rewards. Then
    you can practise for the round you'll actually sit.

steps:
  - type: prose
    id: six-formats
    body: |-
      You need no more than some coding experience for this chapter. This first lesson is
      the map.

      Coding rounds come in six shapes. Two are scored by a machine:

      - **Timed online test**, 60 to 120 minutes: hidden tests check your code's answers
        and its speed.
      - **Levelled task**, about 90 minutes: one project in four levels. Passing a level's
        tests unlocks the next.

  - type: multiple-choice
    id: name-the-format
    concept: interview.round-formats
    difficulty: 1
    question: 'The invite says: 90 minutes, three tasks, scored automatically. What is it?'
    choices:
      - text: A timed online test
        correct: true
        feedback: >-
          Yes. One timer, several tasks, and a machine runs hidden tests on your code.
      - text: A levelled task
        feedback: >-
          Close, since both are automatic. A levelled task is one project that grows, not three tasks.
      - text: A take-home project
        feedback: >-
          A take-home runs for hours and a person reads it. Three tasks in 90 minutes is a test.

  - type: prose
    id: online-task-types
    body: |-
      Inside a timed online test, each task has a type:

      - **Algorithmic**: big inputs. Correctness and speed are scored.
      - **Coding**: a normal function. Correctness only, so edge cases win.
      - **Business context**: a task told as a story. Find the inputs and outputs.
      - **AI literacy quiz**: multiple choice on ML, LLM tools and responsible AI.
      - **Regex or SQL**: a short pattern or query.

  - type: ai-review
    id: review-task-type-plan
    concept: interview.round-formats
    difficulty: 2
    language: yaml
    request: Plan how I play each task type in a 90-minute online test.
    flawClass: logic
    code: |
      algorithmic: read the limits, aim for O(n log n) or better
      coding: skip edge cases, speed is what's scored
      business: turn the story into inputs and outputs first
      ai-literacy: revise ML basics, LLM tools, responsible AI
      regex: practise a few patterns, since the role lists them
    prompt: >-
      An assistant drafted this plan. One line gets its task type backwards. Tap it.
    lines: [2]
    reasons:
      - text: A coding task scores correctness, so edge cases matter most
        correct: true
        feedback: >-
          Yes. Coding tasks have no speed tests. The corners carry the points.
      - text: Business tasks need industry knowledge first
        feedback: >-
          The story is decoration. Inputs and outputs are what the tests check.
      - text: A literacy quiz can't be revised for
        feedback: >-
          It's multiple choice on known topics, so revising them pays off.
    fix: |
      coding: edge cases first, correctness is what's scored

  - type: prose
    id: live-formats
    body: |-
      Two formats are live, with an interviewer watching:

      - **Live pair coding**, 45 to 60 minutes. It's scored on four areas: communication,
        problem solving, the code itself, and testing.
      - **AI-assisted round**, about 60 minutes. The same four, plus judgement: how you plan
        before prompting, check what the assistant wrote and own every line.

  - type: prose
    id: build-formats
    body: |-
      The last two are builds:

      - **Take-home**, 3 to 8 hours on your own. Reviewers look for a working slice, tests
        and a README, then ask you to defend your choices.
      - **Build and present**, a day on site. You build, then give a 10 to 20 minute talk and
        take questions. The questions often count more than the code.

  - type: prose
    id: ask-the-recruiter
    body: |-
      You're allowed to ask how you'll be tested. Recruiters expect it.

      Ask about the **platform**, and the **language and version**. Ask the **length** and
      the number of tasks. Ask if **AI tools are allowed** in this round, and how it's
      **scored**. Rules change from round to round, even inside one company, so ask every
      time.

  - type: ai-review
    id: review-recruiter-email
    concept: interview.recruiter-questions
    difficulty: 3
    language: yaml
    request: Turn my notes into questions for the recruiter before the live round.
    flawClass: logic
    code: |
      to: recruiter
      subject: preparing for the live coding round
      ask:
        - platform: which one, and which language version?
        - length: how many tasks, and how long?
        - ai: round one allowed an assistant, so I'll use one again
        - scoring: hidden tests, or an interviewer's rubric?
        - editor: can I use my own?
    prompt: >-
      An assistant drafted the questions from your notes. One line isn't a question at all,
      and it could end the process. Tap it.
    lines: [6]
    reasons:
      - text: It assumes round one's AI rule carries over
        correct: true
        feedback: >-
          Yes. Some rounds forbid AI even when others allow it. Ask about this round.
      - text: Asking about scoring sounds pushy
        feedback: >-
          Recruiters expect it. Knowing the rubric is how you prepare for the right thing.
      - text: The language version doesn't matter
        feedback: >-
          It does. Platforms pin versions, and a recent API may not exist there.
    fix: |
      to: recruiter
      subject: preparing for the live coding round
      ask:
        - platform: which one, and which language version?
        - length: how many tasks, and how long?
        - ai: are AI assistants allowed in this round, and which?
        - scoring: hidden tests, or an interviewer's rubric?
        - editor: can I use my own?

  - type: parsons
    id: order-after-invite
    concept: interview.recruiter-questions
    difficulty: 2
    language: text
    prompt: An invite lands in your inbox. Put your first moves in order.
    blocks:
      - id: read-invite
        code: Read the invite for length, tasks and who scores
        subgoal: Find the format
      - id: name-format
        code: Name the format from the map
      - id: email
        code: Send the recruiter your questions, AI rules included
        subgoal: Close the gaps
      - id: match-practice
        code: Pick practice that matches that format
        subgoal: Prepare
      - id: mock
        code: Sit one timed mock in the same format
    distractors:
      - id: grind
        code: Grind algorithm puzzles, whatever the format
        feedback: >-
          Puzzles train one format. The invite tells you which one you'll actually sit.
      - id: assume-ai
        code: Assume the AI rules from your last interview
        feedback: >-
          Rules differ between companies and between rounds. Ask each time.

  - type: explain-back
    id: explain-format-fit
    concept: interview.round-formats
    difficulty: 4
    prompt: >-
      A friend prepares for every round by grinding algorithm puzzles. Why might that cost
      them a take-home?
    rubric:
      - Each format scores different things.
      - A take-home is judged on a working slice, scope, tests, a README and defending decisions.
      - Puzzle practice trains hidden-test speed, which a take-home barely rewards.
    modelAnswer: >-
      A take-home isn't scored by hidden tests on a puzzle. Reviewers look for a working
      slice, sensible scope and tests on the core logic. They read a README that explains
      the trade-offs, then ask you to defend them. Puzzle practice builds speed on small
      algorithms, so the time goes into a skill this round barely measures.

recap:
  - Name the six kinds of coding round from an invite.
  - Say what each one scores and practise for that.
  - Ask the recruiter about platform, language, AI rules and scoring.
recall:
  - id: card-six-formats
    concept: interview.round-formats
    front: What are the six kinds of coding round?
    back: >-
      Timed online test, levelled task, live pair coding, AI-assisted round, take-home, and
      build and present.
  - id: card-online-test-scoring
    concept: interview.round-formats
    front: How is a timed online test scored?
    back: >-
      By hidden tests: correctness on small and tricky inputs, and performance on large ones.
  - id: card-task-types
    concept: interview.round-formats
    front: How does an algorithmic task differ from a coding task in an online test?
    back: >-
      An algorithmic task is scored on correctness and speed, with large inputs. A coding
      task is scored on correctness only, so edge cases matter most.
  - id: card-live-scoring
    concept: interview.round-formats
    front: What four areas does a live coding round usually score?
    back: >-
      Communication, problem solving, technical skill in the code, and testing.
  - id: card-recruiter-questions
    concept: interview.recruiter-questions
    front: What do you ask the recruiter before a coding round?
    back: >-
      The platform, language and version, length and number of tasks. Whether AI is allowed
      in that round, how it's scored, and whether you can use your own editor.

references:
  - kind: essay
    title: How candidates are evaluated in coding interviews at top tech companies
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/coding-interview-rubrics/
    note: The four rubric areas of a live round, and what each level of each looks like.
    primary: true
    verified: true
  - kind: essay
    title: Yes, You Can Use AI in Our Interviews. In fact, we insist
    authors: Simon Newton
    year: 2025
    venue: Canva Engineering Blog
    url: https://www.canva.dev/blog/engineering/yes-you-can-use-ai-in-our-interviews/
    note: One company's AI-assisted round, and what it grades.
    verified: true
  - kind: docs
    title: "Guidance on Candidates' AI Usage"
    authors: Anthropic
    url: https://www.anthropic.com/candidate-ai-guidance
    note: An example of rules that differ between stages of one process.
    verified: true

deepDive: |-
  Typical lengths, from candidate reports and platform guides. Timed online tests run 60
  to 120 minutes, often two or three tasks with a warm-up first. A levelled-task assessment
  is one project in four levels over 90 minutes. Live pair rounds
  run 45 to 60 minutes. AI-assisted rounds are about 60 minutes. Take-homes run 3 to 8
  hours. On-site build-and-present days run 4 to 8 hours, then a 10 to 20 minute talk.

  The trend in 2025 and 2026 is away from puzzles and towards feature-sized problems where
  later requirements build on your earlier code.

  AI rules vary more than anything else. Meta's AI-enabled round (since October 2025) gives
  an assistant that can read but not edit files. Canva expects you to use an assistant and
  grades how you check its output. Shopify lets you bring your own tools. Other companies
  forbid AI in interviews and take-homes unless they say otherwise. So ask, for every round.

  **Where this chapter trains each format.** Online tests: Online assessments inside out, reading the
  task, the JavaScript traps, strategy, bug fixing, the tasks candidates report, and mocks A, B and C. Levelled tasks:
  the two levelled-task lessons, the transactions store and the levelled mock. Live rounds:
  live-coding communication, the utilities, the backend, frontend and component rounds.
  AI-assisted rounds: the AI-assisted lesson. Take-homes and build days: evals first, the
  three AI builds, the four-hour build and presenting it.
