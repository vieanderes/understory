term: link
aka: [hyperlink, anchor element]
short: Clickable text or an image that takes you to another page, or another spot on this one.
explain: |
  The web is pages pointing at each other. `<a href="/menu">Menu</a>` makes the word "Menu"
  take you to the menu page. It can also jump to a spot on the same page, with
  `href="#method"`.

  These go somewhere. They appear in the browser's history, open in a new tab with a middle
  click, and respond to Enter. Make the text say where it goes, because "click here" tells a
  screen reader user nothing.
analogy: A signpost. It does nothing by itself, and tells you where the road leads.
example:
  language: html
  code: |
    <a href="/recipes/pancakes">Pancake recipe</a>
    <a href="#method">Skip to the method</a>
usage: That Save is a link to the same page, but nothing is navigated to, so it should be a button.
twin:
  term: button
  difference: A link takes you somewhere new, a page or a spot on the page. A button does something where you are, like saving or opening a menu.
related: [button, url, relative-url, html-attribute]
level: 1
lessons: [html.everyday-elements, html.links-and-urls]
