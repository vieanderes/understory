summary: >-
  A maximum slice problem asks for the best contiguous run of items: the largest sum, the
  best profit between a buy and a later sale, the longest good stretch. The brute force tries
  every start and end. The one-pass method, Kadane's algorithm, asks a smaller question at
  each index instead: what is the best slice that ends exactly here? It is either this item
  alone or this item added to the best slice ending one step earlier.


  That idea is the simplest form of dynamic programming: the answer at each position depends
  only on a value carried from the previous position. Once you see it that way, the variants
  are a matter of choosing what to carry. The lowest price so far solves buy and sell. The
  largest and smallest product so far solve the best product. A forward pass and a backward
  pass solve two slices around a gap.


  The signals are "contiguous", "consecutive", "subarray", "slice", "stretch", "buy then
  sell" and "best period". Before coding, settle one question aloud: may the slice be empty?
  If yes, the answer is never below 0. If not, an all-negative input must return its largest
  single item. That one decision is the most common source of lost points on this pattern.
remember:
  - The best slice ending at index i is either item i alone or item i plus the best slice ending at i − 1.
  - Kadane's algorithm is one pass with two running values, `ending` and `best`, so O(n) time and O(1) space.
  - Ask whether a slice may be empty; if not, start both running values at the first item or `-Infinity`.
  - The best slice sum equals the largest prefix sum minus the smallest earlier prefix sum, the same shape as buy low, sell high.
  - For one buy and one later sale, check `price - lowest` before updating `lowest`, so you never sell before buying.
  - For the best product, carry both the largest and the smallest product ending here, because two negatives make a positive.
  - For two slices around a gap, fill the best slice ending at each index forwards and starting at each index backwards.
  - To return the slice itself, record the start whenever the running slice starts afresh.
sections:
  - title: The template, returning the slice as well as the sum
    body: |-
      In a real task you are often asked for the days, not only the total. Remember where
      the current run began each time it starts afresh, and copy that start whenever the
      best improves.

      ```js
      // The best non-empty contiguous slice: its sum and its inclusive bounds.
      function bestSlice(values) {
        let ending = -Infinity;
        let best = -Infinity;
        let start = 0;
        let bestStart = 0;
        let bestEnd = -1;
        for (let i = 0; i < values.length; i++) {
          if (ending + values[i] < values[i]) {
            ending = values[i]; // the run so far only drags us down: start afresh
            start = i;
          } else {
            ending += values[i];
          }
          if (ending > best) {
            best = ending;
            bestStart = start;
            bestEnd = i;
          }
        }
        return { sum: best, start: bestStart, end: bestEnd };
      }

      console.log(bestSlice([2, -5, 3, 4, -1])); // { sum: 7, start: 2, end: 3 }
      console.log(bestSlice([-3, -1, -2])); // { sum: -1, start: 1, end: 1 }
      console.log(bestSlice([4])); // { sum: 4, start: 0, end: 0 }
      ```

      O(n) time, O(1) space. Ties are a choice you should state: the strict `>` keeps the
      earliest best slice, and the strict `<` keeps extending through a run that sums to
      zero, so it prefers the longer slice among equal sums ending at the same place. If
      the statement wants the shortest or the latest slice, those two comparisons are
      exactly what changes. An empty input returns `-Infinity`; guard it if the constraints
      allow empty input.
  - title: Why Kadane and buy-and-sell are the same problem
    body: |-
      Write `prefix[j]` for the sum of the first j items. The sum of the slice from `i` to
      `j − 1` is `prefix[j] − prefix[i]`. So the best slice is the largest
      `prefix[j] − prefix[i]` with `i < j`: the best "sell" at `prefix[j]` after the
      cheapest earlier "buy" at `prefix[i]`. The best slice problem on changes and the best
      profit problem on prices are the same problem, one in differences and one in running
      totals.

      ```js
      function bestSliceByPrefix(values) {
        let prefix = 0;
        let lowestPrefix = 0; // prefix of the empty start
        let best = -Infinity;
        for (const value of values) {
          prefix += value;
          best = Math.max(best, prefix - lowestPrefix); // sell here
          lowestPrefix = Math.min(lowestPrefix, prefix); // then allow buying here
        }
        return best;
      }

      console.log(bestSliceByPrefix([2, -5, 3, 4, -1])); // 7
      console.log(bestSliceByPrefix([-3, -1, -2])); // -1
      ```

      This view is also the road from brute force to optimal, and it is worth telling in an
      interview. Summing every slice from scratch is O(n³). Extending each start's sum as the
      end moves right is O(n²). Seeing the sum as a difference of prefixes, and keeping the
      smallest earlier prefix, is O(n). It also explains the deep dive's "at least k items"
      variant: only prefixes at least k positions back may be the buy.
  - title: 'Classic problem: the best double slice'
    body: |-
      The assessment version: pick indexes `X < Y < Z` and add the items strictly between X and
      Y and strictly between Y and Z. Either part may be empty, the items at X, Y and Z are
      never counted, and so the first and last items can never be counted either. The deep
      dive sketches the two passes; the boundaries are where solutions fail.

      ```js
      function maxDoubleSlice(a) {
        const n = a.length;
        const left = new Array(n).fill(0); // best (possibly empty) slice ending at i, from index 1
        const right = new Array(n).fill(0); // best (possibly empty) slice starting at i, up to n - 2
        for (let i = 1; i < n - 1; i++) left[i] = Math.max(0, left[i - 1] + a[i]);
        for (let i = n - 2; i > 0; i--) right[i] = Math.max(0, right[i + 1] + a[i]);
        let best = 0;
        for (let y = 1; y < n - 1; y++) best = Math.max(best, left[y - 1] + right[y + 1]);
        return best;
      }

      console.log(maxDoubleSlice([3, 2, 6, -1, 4, 5, -1, 2])); // 17
      console.log(maxDoubleSlice([5, 5, 5])); // 0
      console.log(maxDoubleSlice([-1, -2, -3, -4])); // 0
      ```

      O(n) time and O(n) space. Here the slices may be empty, so the running values clamp at
      0, the opposite choice from `bestStreak`. `left[0]` and `right[n - 1]` stay 0 because
      X and Z themselves are excluded. In `[5, 5, 5]` the middle 5 must be Y, so the answer
      is 0.
  - title: 'Classic problems: the best product and the circular slice'
    body: |-
      **Best product.** A negative item turns the smallest product into the largest, so
      carry both. At each item the new largest and smallest come from three candidates: the
      item alone, or the item times either running value.

      ```js
      function maxProduct(values) {
        let high = values[0];
        let low = values[0];
        let best = values[0];
        for (let i = 1; i < values.length; i++) {
          const v = values[i];
          const options = [v, high * v, low * v];
          high = Math.max(...options);
          low = Math.min(...options);
          best = Math.max(best, high);
        }
        return best;
      }

      console.log(maxProduct([2, 3, -2, 4])); // 6
      console.log(maxProduct([-2, 3, -4])); // 24
      ```

      **Circular slice.** When the list wraps around, the best slice either does not wrap,
      which is plain Kadane, or it wraps, which means it is everything except a middle slice.
      The best wrapping slice is the total minus the smallest slice.

      ```js
      function maxCircular(values) {
        let total = 0;
        let endHigh = -Infinity;
        let high = -Infinity;
        let endLow = Infinity;
        let low = Infinity;
        for (const v of values) {
          total += v;
          endHigh = Math.max(v, endHigh + v);
          high = Math.max(high, endHigh);
          endLow = Math.min(v, endLow + v);
          low = Math.min(low, endLow);
        }
        // All negative: total - low would be the empty slice, which is not allowed.
        return high < 0 ? high : Math.max(high, total - low);
      }

      console.log(maxCircular([5, -3, 5])); // 10
      console.log(maxCircular([-3, -2, -3])); // -2
      ```

      Both are O(n) time and O(1) space. The guard in `maxCircular` is the classic bug: with
      every item negative, the smallest slice is the whole list and `total - low` is 0.
  - title: Edge cases and how to present the solution
    body: |-
      Present it in three sentences: "The best slice ending at i is item i alone or item i
      plus the best slice ending at i − 1, because anything earlier is already folded into
      that value. I keep that and the best seen so far. One pass, O(n) time, O(1) space."
      Then state your empty-slice decision explicitly, since that is the question the
      interviewer is waiting for.

      The tests that catch real bugs on this pattern:

      - every value negative, which separates the empty and non-empty variants;
      - a single item, positive and negative;
      - zeros between negatives, which tests your tie rule;
      - the best slice at the very start and at the very end;
      - for buy and sell, prices that only fall (answer 0) and the lowest price last;
      - large values: 300,000 changes of up to 10⁹ sum to 3 × 10¹⁴, still exact in a
        JavaScript number, but products are not, so the best-product variant may need
        `BigInt` or a stated bound.

      A common follow-up is unlimited buys and sells, one share at a time. That is no longer
      a slice problem: the answer is the sum of every positive day-to-day rise, a greedy
      argument you can state in one line.
pitfalls:
  - "**Starting `best` at 0 when a slice must be non-empty.** An all-negative input then returns 0, the empty slice. Start at the first item or `-Infinity`, and ask which variant the task wants."
  - "**Updating `lowest` before computing the profit.** Then today counts as both the buy and the sale, which is harmless for profit but wrong in variants that need at least one day between. Compute with yesterday's state first, then update."
  - "**Taking the global maximum and minimum.** `highest - lowest` ignores order and sells before buying. The minimum must come from days before the sale."
  - "**Resetting to 0 in the non-empty variant.** `Math.max(0, ending + value)` is the empty-slice rule. For non-empty slices use `Math.max(value, ending + value)`."
  - "**Carrying only the largest product.** A negative item flips signs, so the smallest product ending here can become the largest. Carry both and take three candidates each step."
  - "**The circular all-negative case.** `total - smallest` becomes 0 when every item is negative. Return the plain Kadane answer when it is negative."
interview:
  - question: Explain Kadane's algorithm and why it's correct.
    answer: >-
      It finds the best contiguous slice in one pass by carrying the best slice that ends at
      the current index. Any slice ending at index i is either item i alone or item i
      appended to a slice ending at i − 1. To maximise it, I append to the best slice ending
      at i − 1, unless that best is negative, in which case starting afresh is better. So
      `ending = max(item, ending + item)`, and the overall answer is the largest `ending`
      seen. Every slice ends somewhere, so the maximum over all ending positions is the
      global answer. That is O(n) time and O(1) space. The trade-off to raise is the
      empty-slice rule: allowing it means clamping at 0, forbidding it means starting at
      `-Infinity`.
  - question: Best time to buy and sell a stock once. Go.
    answer: >-
      One pass, carrying the lowest price seen so far: O(n) time, O(1) space. For each price
      I first compute the profit of selling today, `price - lowest`, and keep the best, then
      update `lowest` with today's price. That order guarantees the buy happens before the
      sale. The answer starts at 0, because not trading is allowed. The brute force checks
      every buy and later sell, O(n²), and the tempting wrong answer is highest minus lowest
      overall, which can sell before buying, as in `[9, 2, 5]`. It is the same problem as
      the maximum slice on day-to-day changes, since profit is a sum of consecutive changes.
  - question: How would you find the maximum product subarray?
    answer: >-
      With Kadane's structure, but carrying both the largest and the smallest product ending
      at each index. A negative item turns the most negative product into the most positive
      one, so the smallest is not useless: it is the next largest in waiting. At each item
      the new pair comes from three candidates, the item alone, the item times the previous
      largest, and the item times the previous smallest. A zero resets both, which the "item
      alone" candidate handles. It is O(n) time and O(1) space. I would also mention
      overflow: products grow exponentially, so with large values I would ask for bounds or
      use `BigInt`, and I would watch for `-0` when comparing results.
  - question: What changes if the array is circular?
    answer: >-
      The best slice either does not wrap, which is ordinary Kadane, or it wraps, in which
      case it is the whole array minus one contiguous middle slice. The best wrapping slice
      is therefore the total minus the minimum slice, found with the same pass using `min`
      instead of `max`. I run both in one loop and take the larger. The edge case is an
      array of all negatives: the minimum slice is then the whole array, `total - min` is 0,
      which corresponds to an empty slice, so I return the plain Kadane answer instead. It
      stays O(n) time and O(1) space.
terms:
  - term: Maximum slice
    say: The largest sum you can pick from the array.
    means: The largest sum of a *contiguous* run. Whether an empty slice with sum 0 is allowed changes
      the answer when every value is negative.
  - term: Kadane's algorithm
    say: Reset the sum when it goes negative.
    means: "At each index keep the best slice ending exactly there: the item alone, or the item plus the
      best slice ending one step earlier. The answer is the best of those, in O(n) time and O(1)
      space."
  - term: Dynamic programming
    say: Recursion with a cache.
    means: Building an answer from answers to smaller, overlapping subproblems. Kadane is its simplest
      form, where each position needs only one value carried from the last.
  - term: Best single trade
    say: Buy at the lowest price, sell at the highest.
    means: The highest price may come before the lowest. Track the lowest price so far and check `price
      - lowest` before updating it, so you never sell before buying.
  - term: Maximum product subarray
    say: Kadane with multiplication.
    means: Carry both the largest and the smallest product ending here, because one negative number
      turns the smallest into the largest.
