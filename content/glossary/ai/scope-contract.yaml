term: scope contract
aka: [task contract, task brief]
short: A short file stating one task's goal, allowed and forbidden paths, and the commands that prove it's done.
explain: |
  Left alone, an agent widens the task. It refactors a file it passed, edits a config,
  touches thirty files for a one-line bug. A scope contract fixes the edges before work
  starts.

  Because it lists paths and commands, a script can check the final diff against it. A
  change outside the allowed paths fails, whatever the agent says about it.
analogy: A builder's quote that names the rooms. Knocking through to the kitchen wasn't on it.
usage: The diff touches the billing module, which the scope contract forbids; send it back.
related: [definition-of-done, verification-gate, context-file, non-goal]
level: 3
lessons: [aisys.agent-workbench]
