deepDive: >-
  Browsers use a placeholder as a last-resort name, so a field with only a placeholder isn't
  silent to a screen reader. It still fails sighted users, and its pale grey often fails
  contrast too.


  `aria-describedby` can list several ids, separated by spaces: a hint and an error, for
  example. They're read in the order listed.


  For a long form, many sites add an error summary at the top: a heading, then a list of
  links to each field with a problem. Move focus to the summary, and each link takes the
  user to a field.


  Say which fields are required in the label text or with `required`, not only with a red
  asterisk. The asterisk is colour and shape, and a screen reader may read it as "star".


  `autocomplete` values, such as `email`, `postal-code` and `cc-number`, let the browser
  fill fields in. That helps everyone, and people with motor or memory difficulties most.
