summary: >-
  An event is the browser telling your code that something happened: a click, a keystroke, a
  form submit, a scroll. You register a listener with `addEventListener`, and the browser
  calls it with an event object that describes what happened and where.


  Events don't stay where they start. Each one travels down the tree from the window to the
  target, then back up again. That journey is what makes **event delegation** possible: one
  listener on a list serves every row, including rows added later. It also explains the
  classic bugs: the handler that hears the icon instead of the button, and the parent that
  reacts to a click meant for a child.


  Many events come with a **default action**, such as a form loading a new page or a link
  navigating. `preventDefault()` cancels that action, and `stopPropagation()` stops the
  journey. They are separate switches. Production code also cares about the listener's life
  cycle: removing listeners when a widget closes, and marking scroll and touch listeners
  **passive** so they never block scrolling.
remember:
  - 'An event runs in three phases, capture down from the window, the target, then bubble back up, and listeners run in the bubble phase unless you pass `{ capture: true }`.'
  - "`event.target` is the deepest element the event happened on, and `event.currentTarget` is the element whose listener is running now."
  - Event delegation puts one listener on a parent and uses `event.target.closest(selector)` to find the row or button that was hit.
  - "`preventDefault()` cancels the browser's own action and `stopPropagation()` stops the event reaching other elements, and neither does the other's job."
  - "`removeEventListener` only works with the same function reference, so keep it, or pass an `AbortController`'s `signal` and call `abort()` to remove many at once."
  - A passive listener promises not to call `preventDefault()`, which lets the browser scroll without waiting for your code.
  - "`focus`, `blur`, `mouseenter` and `mouseleave` don't bubble, so delegate with `focusin`, `focusout`, `mouseover` and `mouseout` instead."
  - Returning `false` from an `addEventListener` callback does nothing, so call `event.preventDefault()` explicitly.
sections:
  - title: Capture, target, bubble
    body: |-
      When you click a button, the browser works out the **propagation path**: the button, its
      parent, and every ancestor up to `document` and `window`. Then it dispatches the event
      along that path in three phases.

      1. **Capture**: from `window` down to the target's parent. Only listeners registered
         with `{ capture: true }` (or `true` as the third argument) run here.
      2. **Target**: at the element itself. Capture listeners run first, then the others.
      3. **Bubble**: back up from the parent to `window`. Ordinary listeners run here.

      `event.eventPhase` reports which one is running: 1, 2 or 3.

      ```html
      <ul id="list"><li id="row"><button id="done">Done</button></li></ul>
      <script>
        const list = document.querySelector("#list");
        const button = document.querySelector("#done");
        const log = (label) => (event) =>
          console.log(label, "phase", event.eventPhase, "current", event.currentTarget.id);

        list.addEventListener("click", log("list bubble"));
        list.addEventListener("click", log("list capture"), { capture: true });
        button.addEventListener("click", log("button bubble"));
        button.addEventListener("click", log("button capture"), true);

        button.click();
        // list capture phase 1 current list
        // button capture phase 2 current done
        // button bubble phase 2 current done
        // list bubble phase 3 current list
      </script>
      ```

      Registration order doesn't decide who runs first across elements: the path does. On one
      element, listeners for the same phase run in the order they were added.

      You rarely need capture, but it has real uses. A listener on `document` in the capture
      phase sees every click before any component can stop it, which suits analytics or
      closing a menu when someone clicks outside it. When removing a capture listener, pass
      the same `capture` flag, because `capture: true` and `false` count as two different
      registrations.
  - title: Delegation done properly
    body: |-
      Delegation trades many listeners for one. Instead of a listener per row, you put one on
      the container and ask, on each event, which row it came from.

      ```html
      <ul id="todos">
        <li>Buy stamps <button class="remove"><span class="icon">x</span> Remove</button></li>
      </ul>
      <script>
        const todos = document.querySelector("#todos");
        todos.addEventListener("click", function (event) {
          console.log(event.target.tagName, event.currentTarget.id, this === event.currentTarget);
          const button = event.target.closest(".remove");
          if (!button || !todos.contains(button)) return;
          button.closest("li").remove();
        });
        document.querySelector(".icon").click(); // SPAN todos true
        console.log(todos.children.length); // 0
      </script>
      ```

      Three details make it solid. `event.target` is the deepest element hit, here the `span`,
      so you walk up with `closest`. `closest` checks the element itself and then its
      ancestors, and it can walk right out of your container. The `contains` check matters
      when lists nest, so an outer list doesn't act on a button that belongs to an inner one.
      And inside a `function` listener, `this` is `event.currentTarget`, the element the
      listener is on. An arrow listener has no `this` of its own, so use `currentTarget`.

      The gains are real: one function instead of a thousand, rows added later work with no
      extra wiring, and nothing needs cleaning up when a row is removed. The limits are real
      too. Events that don't bubble never reach the container, so delegate focus with
      `focusin` and `focusout`. And any `stopPropagation()` below the container silently
      breaks the delegated listener. Store what a row represents in a `data-` attribute, such
      as `data-id="42"`, and read it back with `row.dataset.id`.
  - title: Default actions and stopping propagation
    body: |-
      Two methods on the event object sound alike and do unrelated things.

      - `event.preventDefault()` cancels the **default action**: following a link, submitting
        a form, ticking a checkbox, scrolling on a wheel event. The event keeps travelling.
        Only events with `event.cancelable === true` can be cancelled, and
        `event.defaultPrevented` tells later listeners that someone did.
      - `event.stopPropagation()` stops the event moving to further elements on its path. The
        default action still happens. `stopImmediatePropagation()` also skips the remaining
        listeners on the current element.

      ```html
      <a id="link" href="#next">Next</a>
      <script>
        const link = document.querySelector("#link");
        document.addEventListener("click", () => console.log("document heard the click"));
        link.addEventListener("click", (event) => {
          event.preventDefault(); // no navigation, but the click still bubbles
          console.log("prevented", event.defaultPrevented);
        });
        link.click();
        // prevented true
        // document heard the click
      </script>
      ```

      One old habit causes confusion. Returning `false` from an `onclick` or `onsubmit`
      property handler cancels the default action. Returning `false` from an
      `addEventListener` callback does nothing at all. Call `preventDefault()` explicitly.

      Reach for `stopPropagation()` rarely. It hides the event from delegated listeners,
      analytics and "click outside to close" logic further up, which leads to bugs far from
      the line that caused them. If a parent must ignore clicks from one child, have the
      parent check `event.target.closest(...)`, or check `event.defaultPrevented`, instead.
  - title: Removing listeners, AbortSignal and passive listeners
    body: |-
      A listener keeps its function alive, and everything that function's closure refers to.
      A widget that adds listeners to `document` or `window` and never removes them leaks
      memory, and it keeps reacting after it's gone. `removeEventListener` needs the exact same
      function, and the same `capture` flag, that was added. An inline arrow can never be
      removed, because nobody holds a reference to it.

      The modern answer is the `signal` option. Every listener registered with an
      `AbortController`'s signal is removed when you call `abort()`.

      ```html
      <button id="next">Next</button>
      <script>
        class Slideshow {
          #controller = null;
          slide = 0;

          open() {
            this.#controller = new AbortController();
            const { signal } = this.#controller;
            document.addEventListener("keydown", (event) => this.onKey(event), { signal });
            document.querySelector("#next").addEventListener("click", () => this.move(1), { signal });
          }

          close() {
            this.#controller?.abort(); // removes every listener registered with this signal
          }

          onKey(event) {
            if (event.key === "ArrowRight") this.move(1);
          }

          move(step) {
            this.slide += step;
          }
        }

        const show = new Slideshow();
        show.open();
        document.querySelector("#next").click();
        show.close();
        document.querySelector("#next").click();
        console.log(show.slide); // 1, the second click found no listener
      </script>
      ```

      `{ once: true }` removes a listener after its first call, handy for one-off setup.

      **Passive listeners** exist for scrolling. The browser can't scroll on a `wheel`,
      `touchstart` or `touchmove` until every listener has run, in case one calls
      `preventDefault()`. `{ passive: true }` promises it won't, so scrolling starts at once.
      Chromium and Firefox treat `touchstart`, `touchmove` and `wheel` listeners on `window`,
      `document` and `body` as passive by default. Calling `preventDefault()` inside a
      passive listener is ignored, and Chromium logs a console warning. If you really must
      block scrolling, say so with `{ passive: false }`.
  - title: Firing your own events, and taming noisy ones
    body: |-
      Components can talk through events too. `CustomEvent` carries data in `detail`, and
      `bubbles: true` lets a container hear it, so a button doesn't need to know who handles
      it.

      ```html
      <div id="shop"><button id="add">Add</button></div>
      <script>
        document.querySelector("#shop").addEventListener("cart:add", (event) => {
          console.log("added", event.detail.sku, "from", event.target.id);
        });
        document.querySelector("#add").dispatchEvent(
          new CustomEvent("cart:add", { detail: { sku: "TEA-01" }, bubbles: true }),
        );
        // added TEA-01 from add
      </script>
      ```

      `dispatchEvent` runs listeners synchronously, before it returns, unlike a real click,
      which the browser queues as a task. Events you create are also marked untrusted:
      `event.isTrusted` is `false`, and they don't trigger most default actions.

      Some events fire far more often than you want to do work: `input` on every keystroke,
      `scroll` and `resize` many times a second. **Debouncing** waits until the events stop
      for a moment and then runs once. It suits search-as-you-type. **Throttling** runs at most
      once per interval, which suits scroll tracking. A debounce fits in a few lines:

      ```js
      function debounce(fn, wait) {
        let timer;
        return function (...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      const search = debounce((query) => console.log("search for", query), 200);
      search("t");
      search("te");
      search("tea"); // only this one survives the 200 ms quiet period
      // search for tea
      ```

      In a page you'd write `box.addEventListener("input", debounce(runSearch, 300))`.
pitfalls:
  - >-
    **Testing `event.target` with `matches` in a delegated listener.** When the click lands on
    an icon or a `strong` inside the button, the target is that inner element and the check
    fails. Use `event.target.closest(".remove")`, then check the result isn't `null`.
  - >-
    **Using `stopPropagation()` to stop a parent reacting.** It also blinds every delegated
    listener, analytics and outside-click handler above. Let the parent check what was
    clicked instead, or use `preventDefault()` and have others check `defaultPrevented`.
  - >-
    **Removing a listener with a new function.** `removeEventListener("click", () => save())`
    or `fn.bind(this)` written again creates a different function, so nothing is removed.
    Keep the reference, or register with an `AbortController` signal and call `abort()`.
  - >-
    **Returning `false` to cancel.** That only works for `on...` property handlers. In an
    `addEventListener` callback the return value is ignored, so the form still submits. Call
    `event.preventDefault()`.
  - >-
    **Delegating an event that doesn't bubble.** A `focus` listener on a form never hears its
    inputs being focused. Use `focusin` and `focusout`, or `{ capture: true }`.
  - >-
    **Heavy work in `scroll`, `input` or `resize` listeners.** They fire many times a second,
    and each run can force layout. Debounce or throttle, and read layout inside
    `requestAnimationFrame`.
verify:
  - lens: breaks
    check: 'Delegated handlers find their element with `closest`, so a click on an icon inside a button still counts.'
  - lens: breaks
    check: 'A form handled in JavaScript calls `event.preventDefault()`, because `addEventListener` ignores a returned `false`.'
  - lens: scales
    check: 'Listeners on `scroll`, `input` or `resize` are debounced or throttled, since they fire many times a second.'
  - lens: confuses
    check: 'Avoid `stopPropagation`, because it silently blinds every delegated listener further up the page.'
  - lens: tests
    check: 'Test a delegated list by clicking an inner icon, and a row added after the listener was attached.'
interview:
  - question: Explain event bubbling and capturing.
    answer: >-
      Every event travels a path from `window` down to the target and back up. The way down is
      the capture phase, the element itself is the target phase, and the way up is the bubble
      phase. `addEventListener` registers for bubbling by default. Passing `{ capture: true }`
      registers for the way down, so an ancestor can see the event before its children. In
      practice bubbling is what I use: it's what makes delegation work. Capture is for cases
      like a document-level listener that must see every click before a component can call
      `stopPropagation()`, such as closing a dropdown. Some events, such as `focus` and
      `mouseenter`, don't bubble, so they have bubbling siblings like `focusin`.
  - question: What is event delegation, and why use it?
    answer: >-
      Delegation is putting one listener on a common ancestor instead of one on each child, and
      working out the child from the event. In the handler I call
      `event.target.closest(".row")`, because the target may be an inner element like an icon,
      and I check the match is inside my container. The benefits are fewer listeners, rows
      added later work automatically, and there's nothing to clean up when rows are removed.
      It suits lists, tables and menus. The limits: events that don't bubble need their
      bubbling versions, and any `stopPropagation()` below the container breaks it. For a
      handful of static buttons, direct listeners are clearer.
  - question: What's the difference between `preventDefault()` and `stopPropagation()`?
    answer: >-
      `preventDefault()` cancels the browser's default action, and `stopPropagation()` stops
      the event travelling to other elements. They're independent. A link listener that calls
      `preventDefault()` stops navigation, but ancestors still hear the click. One that calls
      `stopPropagation()` hides the click from ancestors, but the link still navigates.
      `stopImmediatePropagation()` also skips the other listeners on the same element.
      Returning `false` only cancels in `on...` property handlers, never in
      `addEventListener`. I use `preventDefault()` freely, for forms and custom controls, and
      `stopPropagation()` almost never, because it silently breaks delegated and global
      listeners.
  - question: What's the difference between `event.target` and `event.currentTarget`?
    answer: >-
      `target` is where the event started, the deepest element hit, and it stays the same for
      the whole journey. `currentTarget` is the element whose listener is running right now,
      so it changes as the event bubbles. In a delegated listener on a list, `currentTarget`
      is the list and `target` might be a `span` inside a button inside a row. Inside a
      `function` listener, `this` equals `currentTarget`, but an arrow listener doesn't get
      that `this`, so I read `currentTarget` explicitly. One catch: `currentTarget` is `null`
      once dispatch is over, so reading it after an `await` gives nothing.
  - question: How do you avoid memory leaks with event listeners?
    answer: >-
      Remove listeners when the thing that added them goes away, especially on long-lived
      targets like `window` and `document`. A listener keeps its function and closure alive,
      so a closed modal can keep reacting and hold onto data. `removeEventListener` needs the
      same function reference and capture flag, which is why inline arrows and repeated
      `bind` calls fail to remove anything. The cleanest tool is an `AbortController`: pass
      its `signal` to every `addEventListener` call and call `abort()` on teardown. It also
      works with `fetch`, so one abort can cancel requests and listeners together. In React,
      that teardown belongs in the effect's cleanup function.
  - question: What is a passive event listener?
    answer: >-
      It's a listener registered with `{ passive: true }`, which promises never to call
      `preventDefault()`. That matters for `touchstart`, `touchmove` and `wheel`. Without the
      promise, the browser must wait for the listener before it scrolls, in case it cancels,
      so slow handlers make scrolling janky. With it, scrolling runs straight away while the
      listener runs alongside. Chromium and Firefox make those listeners passive by default
      when they're on `window`, `document` or `body`, and a `preventDefault()` inside a
      passive listener is ignored with a console warning. When I genuinely need to block
      scrolling, such as in a custom drag gesture, I pass `{ passive: false }` explicitly.
