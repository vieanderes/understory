term: internationalisation
aka: [i18n, internationalization]
short: Building software so it can work in any language and region without changing its code.
explain: |
  Hard-code "You have 1 items" and English dates, and every new language means a rewrite.
  This work prepares the code instead. Text lives in message files, and dates, numbers and
  money go through `Intl`.

  The traps are in the details. Plurals differ by language, so pick the form with
  `Intl.PluralRules`. Some languages read right to left. Set `lang` on the page, so screen
  readers pronounce the words properly.
analogy: Fitting a kitchen with adjustable shelves. Whoever moves in, their things will fit.
example:
  language: js
  code: |
    new Intl.NumberFormat("de-DE", {
      style: "currency",
      currency: "EUR",
    }).format(1234.5); // "1.234,50 €"
    new Intl.DateTimeFormat("en-GB").format(date);
usage: Internationalisation comes first, because translating is quick once no sentence is glued together in code.
twin:
  term: localisation
  difference: Internationalisation is the engineering that makes other languages possible. Localisation is the work for one place, its translations, formats and pictures.
related: [localisation, screen-reader]
level: 2
lessons: [design.i18n-and-forms]
