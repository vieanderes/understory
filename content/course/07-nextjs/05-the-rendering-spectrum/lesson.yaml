id: next.rendering-spectrum
title: Static and dynamic pages
objective: Read the build output, tell static pages from dynamic ones, and keep a page's data fresh.
level: essential
minutes: 10
concepts: [next.static-rendering, next.dynamic-rendering, next.client-rendering]
prerequisites: [next.loading-data]
opening:
  text: >-
    You'll read what `npm run build` says about each page, and know which ones every visitor
    shares. Then you'll fix the page that looked fine on your laptop and froze once it went live.

steps:
  - type: prose
    id: built-once-or-per-visit
    body: >-
      `npm run build` makes the version visitors get. For each page, Next.js asks: does it read
      anything from the visit, such as the URL's query string? A page gets that in its
      `searchParams` prop, a promise like `params`.


      ```text

      Route (app)

      ┌ ○ /

      ├ ○ /about

      ├ ƒ /search

      └ ƒ /recipes/[slug]


      ○  (Static)   prerendered as static content

      ƒ  (Dynamic)  server-rendered on demand

      ```


      If not, the page is **static**: rendered once, during the build, and shared by every
      visitor. If it does, it's **dynamic**: rendered for each request.

  - type: predict-output
    id: predict-build-symbol
    concept: next.dynamic-rendering
    difficulty: 1
    language: tsx
    code: |
      // app/news/page.tsx
      export default async function NewsPage({ searchParams }: PageProps<'/news'>) {
        const { topic = 'all' } = await searchParams;
        return <h1>News: {topic}</h1>;
      }
    question: Which symbol does the build print next to `/news`?
    choices:
      - text: '`ƒ`, dynamic'
        correct: true
        feedback: >-
          Right. The query string only exists when someone visits, so it renders per request.
      - text: '`○`, static'
        feedback: >-
          A static page is made before any visit. `?topic=rain` can't be known that early.

  - type: bug-hunt
    id: hunt-stale-weather
    concept: next.static-rendering
    difficulty: 2
    language: text
    code: |
      Route (app)
      ┌ ○ /
      ├ ○ /about
      ├ ○ /weather
      └ ƒ /search

      ○  (Static)   prerendered as static content
      ƒ  (Dynamic)  server-rendered on demand
    prompt: >-
      After the deploy, `/weather` shows the same temperature all day. In `npm run dev` it was
      always fresh. Tap the line in the build output that explains it.
    lines: [4]
    reasons:
      - text: The build rendered `/weather` once and saved it
        correct: true
        feedback: >-
          Right. The page fetched the weather during the build. Every visitor gets that copy.
      - text: The weather service keeps sending an old answer
        feedback: >-
          Nobody asks the service again. The page was saved at build time, with that
          temperature in it.
      - text: The build failed for `/weather`
        feedback: >-
          A failed build prints an error, not a route. `○` means it built fine, once.

  - type: prose
    id: two-fixes
    body: >-
      That's the classic "fine on my laptop, stale in production" bug. The dev server renders
      every page on every visit, so it hides it. Two fixes:


      ```tsx

      export const revalidate = 60; // rebuild this page at most once a minute

      ```


      ```tsx

      import { connection } from 'next/server';

      await connection(); // at the top of the page: render per request

      ```


      The first keeps the page static but refreshes it in the background. The second makes it
      dynamic.

  - type: fill-blank
    id: fill-revalidate
    concept: next.static-rendering
    difficulty: 2
    language: tsx
    prompt: >-
      A league table changes a few times a day. Keep it static, but let it refresh at most
      every 300 seconds. Fill the gaps.
    template: |
      // app/league/page.tsx
      export const {{1}} = {{2}};

      export default async function LeaguePage() {
        const response = await fetch('https://api.football.example/table');
        const table = await response.json();
        return <LeagueTable rows={table.rows} />;
      }
    blanks:
      - key: '1'
        answer: revalidate
      - key: '2'
        answer: '300'
    bank: [revalidate, refresh, cache, '300', "'300s'", "'5m'"]

  - type: ai-review
    id: review-hourly-departures
    concept: next.dynamic-rendering
    difficulty: 3
    language: tsx
    request: Show the next trains from this station, and make sure they're never stale.
    flawClass: logic
    code: |
      // app/station/page.tsx
      export const revalidate = 3600;

      export default async function StationPage() {
        const response = await fetch('https://api.trains.example/departures');
        const trains = await response.json();
        return <DepartureBoard trains={trains} />;
      }
    prompt: >-
      An assistant wrote this. It checked the page twice in a row, and the times were correct.
      Then people started missing trains. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The board can be an hour old
        correct: true
        feedback: >-
          Yes. Departures need rendering per request. Use `await connection()` instead.
      - text: The fetch needs `await` removed
        feedback: >-
          Without `await`, `trains` would be a promise, not data. The await is right.
      - text: '`revalidate` must be written in minutes'
        feedback: >-
          It's in seconds, so 3600 is an hour. That's the problem: an hour is far too long here.
    fix: |
      // app/station/page.tsx
      import { connection } from 'next/server';

      export default async function StationPage() {
        await connection();
        const response = await fetch('https://api.trains.example/departures');
        const trains = await response.json();
        return <DepartureBoard trains={trains} />;
      }

  - type: prose
    id: client-rendering
    body: >-
      There's a third place a page can get its data: the browser. A Client Component that
      fetches in an effect, as in the React chapter, fills in after its JavaScript runs.
      That's **client rendering**.


      Its content is missing from the HTML the server sent. Right-click a page and choose View
      Page Source to see that HTML. Link previews and some search engines read only that.

  - type: predict-output
    id: predict-view-source
    concept: next.client-rendering
    difficulty: 2
    language: tsx
    code: |
      'use client';

      import { useEffect, useState } from 'react';

      export function Likes() {
        const [likes, setLikes] = useState<number | null>(null);
        useEffect(() => {
          fetch('/api/likes').then((r) => r.json()).then((d) => setLikes(d.likes));
        }, []);
        return <p>{likes === null ? 'Loading' : `${likes} likes`}</p>;
      }
    question: A post shows 12 likes on screen. What does View Page Source show for this part?
    choices:
      - text: '`<p>Loading</p>`'
        correct: true
        feedback: >-
          Right. The server rendered the starting state. The effect only ran in the browser.
      - text: '`<p>12 likes</p>`'
        feedback: >-
          That's on screen, after the effect ran. The source shows what the server sent before.
      - text: Nothing for this component
        feedback: >-
          Client Components render on the server too, with their starting state.

  - type: code-challenge
    id: build-search-page
    concept: next.dynamic-rendering
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write `app/films/page.tsx`, a dynamic page that searches the list `films`. It reads the
      query string, so each visit renders on the server.


      Await `searchParams` and read `q`. Show an `h1` reading `Results for "sea"`, and a list
      item for each film whose title contains `q`, ignoring case. With no `q`, show `All films`
      as the heading and every film.
    hints:
      - "`searchParams` is a promise, like `params`. Await it, then read `q`."
      - Compare `title.toLowerCase()` with `q.toLowerCase()` using `includes`.
      - "Start with `const { q } = await searchParams;`, then filter only when `q` is set."

  - type: explain-back
    id: explain-lost-freshness
    concept: next.static-rendering
    difficulty: 3
    prompt: >-
      The weather page showed fresh data in `npm run dev` but froze after deploying. Why, and
      what are two ways to fix it?
    rubric:
      - The dev server renders every page on every visit, so it never shows the problem.
      - The build saw no request data, rendered the page once and served that copy to everyone.
      - "`export const revalidate` refreshes it every so often; `await connection()` renders it per request."
    modelAnswer: >-
      In development every page renders on every visit, so the temperature was always new. The
      build saw a page that reads nothing from the visit, marked it static, fetched once and
      saved the HTML. Everyone got that copy. `export const revalidate = 600` rebuilds it in the
      background every ten minutes. `await connection()` makes it render for each request.

recap:
  - Read `○` and `ƒ` in the build output, and say why each page got its symbol.
  - Keep a static page fresh with `revalidate`, or make it dynamic with `connection()`.
  - Tell server-rendered content from client-rendered content with View Page Source.

recall:
  - id: card-static-shell
    concept: next.static-rendering
    front: When is a static page's HTML made?
    back: >-
      Once, by `next build`, and again only when it revalidates. Every visitor gets the same
      copy.
  - id: card-dynamic-trigger
    concept: next.dynamic-rendering
    front: Name two things that make a page dynamic.
    back: >-
      Reading the visit, such as awaiting `searchParams`, or calling `await connection()`.
  - id: card-dev-hides-it
    concept: next.static-rendering
    front: Why can't `npm run dev` show you a stale static page?
    back: >-
      The dev server renders every page on every visit. Only a build decides what's static.
  - id: card-client-vs-dynamic
    concept: next.client-rendering
    front: How can you tell client-rendered content from server-rendered content?
    back: >-
      View Page Source. Server-rendered content is in that HTML. Client-rendered content isn't,
      because it appears only after the browser runs scripts.

