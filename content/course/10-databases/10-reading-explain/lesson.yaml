deepDive: >-
  `cost` is in made-up units: roughly, reading one page in order costs 1. The two numbers are
  the cost to produce the first row and all rows. They compare plans; they aren't milliseconds.


  When estimated and actual rows differ a lot, the planner is working from stale statistics
  and may pick a bad plan. `ANALYZE orders;` refreshes them, and autovacuum usually does it for
  you in the background.


  There are three ways to join. A **Nested Loop** looks up the inner side once per outer row,
  great for a few rows. A **Hash Join** builds a hash table from one side, good for many rows.
  A **Merge Join** walks two sorted inputs together.


  Since Postgres 18, `EXPLAIN ANALYZE` adds `Buffers` lines by default: how many 8 kB pages
  each node read from memory (`hit`) or disk (`read`). On a real server, `pg_stat_statements`
  lists which queries take the most total time, so you know which plan to read first.
