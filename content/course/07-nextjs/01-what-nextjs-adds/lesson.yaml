deepDive: >-
  **Other React frameworks.** React Router in framework mode and Remix, TanStack Start and
  Astro also render React on the server. Next.js is the most used, and its ideas carry over.


  **What `--yes` picked.** TypeScript, Tailwind CSS, ESLint, the App Router and Turbopack, the
  bundler Next.js uses by default. It also adds an `AGENTS.md` file for coding assistants,
  because Next.js changes between versions faster than their training data.


  **`next build` and `next start`.** The dev server rebuilds on every save and shows detailed
  errors. For visitors, `npm run build` makes an optimised version and `npm run start` serves
  it. A later lesson reads what the build prints.
