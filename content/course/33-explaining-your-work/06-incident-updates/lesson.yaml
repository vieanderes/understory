id: explain.incident-updates
title: Writing an incident update
objective: Write an incident update with impact, status and the time of the next update, in plain words and without blame.
level: advanced
minutes: 10
concepts: [explain.incident-update-shape, explain.blameless-wording]
prerequisites: [cloud.alerts-and-on-call, explain.audiences]
opening:
  text: >-
    You'll write the update everyone reads while something is broken. Done well, support
    stops guessing, people stop asking, and you get time to fix it.

steps:
  - type: prose
    id: four-parts
    body: >-
      It's 10:05. Since 09:40, about a third of episode uploads on your podcast host have
      failed. Listening works. Support is asking what to tell people.


      In Alerts and on-call you rolled back first, then posted an update. This is that
      update. An **incident update** says four things, in order: the impact, the status, what
      you're doing, and when the next update comes.

  - type: multiple-choice
    id: pick-update-opening
    concept: explain.incident-update-shape
    difficulty: 1
    question: Which line should the 10:05 update open with?
    choices:
      - text: We're investigating an issue with our storage layer.
        feedback: >-
          Vague, and about your systems. Readers can't tell whether they're affected.
      - text: Since 09:40, about a third of uploads fail. Listening works.
        correct: true
        feedback: >-
          Yes. Who's affected, since when, and what still works.
      - text: Sorry for any inconvenience this may cause.
        feedback: >-
          An apology with no facts. People still have to ask what's broken.
      - text: A config change at 09:38 broke uploads.
        feedback: >-
          A cause before the impact, and one you haven't confirmed. Most people pick a cause
          first.

  - type: parsons
    id: arrange-update
    concept: explain.incident-update-shape
    difficulty: 2
    language: text
    prompt: >-
      Put the 10:05 update in order. One line doesn't belong.
    blocks:
      - id: impact
        code: 'Impact: since 09:40 UTC, about 1 in 3 episode uploads fail.'
        subgoal: Impact
      - id: unaffected
        code: Listening and published episodes are not affected.
        subgoal: Impact
      - id: status
        code: 'Status: investigating. The cause isn''t known yet.'
        subgoal: Status
      - id: doing
        code: 'Now: rolling back this morning''s storage change, our first lead.'
        subgoal: What we're doing
      - id: workaround
        code: If an upload fails, retrying in a few minutes usually works.
        subgoal: What we're doing
      - id: next
        code: 'Next update: 10:35 UTC, or sooner if anything changes.'
        subgoal: Next update
    distractors:
      - id: blame
        code: 'Cause: Sam''s config change at 09:38 broke storage.'
        feedback: >-
          It names a person and states a guess as fact. Both cost you trust later.

  - type: prose
    id: clock-time
    body: >-
      Give the next update as a clock time with a time zone, like *10:35 UTC*. Someone
      reading at 10:20 can't use *in 30 minutes*.


      Then keep the promise. Even *no change, still working on it* counts. Silence makes
      people guess, and guesses spread faster than updates.

  - type: code-challenge
    id: write-update
    concept: explain.incident-update-shape
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '2-3'
    prompt: >-
      Build the incident bot's update writer. Write `writeUpdate(update)`. An update has
      `impact`, `status`, `doing`, `now` as `"HH:MM"`, and `everyMinutes`.


      Return four lines: `Impact: ...`, `Status: ...`, `Now: ...`, then `Next update: HH:MM
      UTC`, which is `now` plus `everyMinutes`. Pad to two digits, and wrap past midnight. A
      `resolved` status ends with `No more updates. A summary follows.` instead. With no
      impact, or only spaces, throw an `Error` with the message `Impact first`.


      Example: at `"10:05"` every 30 minutes, the last line is `Next update: 10:35 UTC`.
    hints:
      - Check the impact first. Then build the three lines every update shares, and join with `"\n"`.
      - >-
        Turn `now` into minutes since midnight, add `everyMinutes`, and take the remainder
        after `24 * 60` to wrap.
      - >-
        `update.now.split(':').map(Number)` gives hours and minutes. `String(n).padStart(2,
        '0')` pads a number.

  - type: prose
    id: systems-not-people
    body: >-
      Two habits keep updates trusted. Say what systems did, not who slipped: *a storage
      change at 09:38*, not *Sam's change*. That's **blameless wording**.


      And mark what you don't know: *we suspect*, *not confirmed yet*. A guess stated as fact
      gets repeated by support, then corrected in public. The full blameless review comes
      later, as in Alerts and on-call.

  - type: bug-hunt
    id: hunt-blame
    concept: explain.blameless-wording
    difficulty: 3
    language: yaml
    code: |
      impact: about 1 in 3 uploads still fail, since 09:40 UTC
      status: identified, the storage change is the likely cause
      doing: rolling it back, which should finish by 10:50
      note: the change skipped review because Alex was in a hurry
      workaround: retry a failed upload after a few minutes
      next update: 11:05 UTC
    prompt: >-
      The next week, nobody mentions their risky changes in the channel any more. Tap the
      line that taught them to stay quiet.
    lines: [4]
    reasons:
      - text: It blames a person in front of everyone
        correct: true
        feedback: >-
          Right. Ask what let a change skip review, and fix that instead.
      - text: Line 2 shouldn't say "likely"
        feedback: >-
          "Likely" is honest about what isn't confirmed. That line is doing its job.
      - text: Thirty minutes is too long between updates
        feedback: >-
          Thirty minutes is common for an incident like this. The trouble is the name on line
          4.
      - text: The workaround gives away the cause
        feedback: >-
          A workaround helps people now and reveals nothing sensitive. Keep it.
    fix: |
      note: the change went out without review; the follow-up will ask why that was possible

  - type: ai-review
    id: review-follow-up
    concept: explain.blameless-wording
    difficulty: 4
    language: yaml
    request: Draft the follow-up summary from this morning's incident channel.
    flawClass: logic
    code: |
      summary: from 09:40 to 10:55 UTC, about 1 in 3 episode uploads failed
      impact: 1,840 uploads failed; listening was not affected
      cause: a 09:38 storage change left one of three upload servers read-only
      cause: the storage provider was also degraded that morning
      fixed: rolled back at 10:52; uploads recovered by 10:55
      action: deploy checks will test write access on every upload server
    prompt: >-
      It reads well, and it's blameless. But the provider's status page was green all
      morning. Someone only asked about it in the channel. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It turns a question into a stated fact
        correct: true
        feedback: >-
          Right. A passing "maybe the provider?" became a cause. Cut it.
      - text: It should name who rolled back
        feedback: >-
          Who did the work doesn't help readers, and naming people drifts towards blame.
      - text: The impact needs a percentage, not a count
        feedback: >-
          A count is clear and checkable. The invented second cause is the problem.
      - text: The action needs no owner
        feedback: >-
          An owner and a date make it happen. But the bigger problem is a cause nobody showed.
    fix: |
      cause: a 09:38 storage change left one of three upload servers read-only
      (Line 4 removed: the provider was checked and ruled out at 10:12.)
    verify:
      question: How do you check a summary like this before you send it?
      choices:
        - text: Match each claim to a log, graph or message
          correct: true
          feedback: >-
            Yes. A claim with nothing behind it goes, however well it reads.
        - text: Ask the assistant to double-check its facts
          feedback: >-
            It may confirm its own guess. Check against the record, not the writer.
        - text: Have the on-call engineer skim it
          feedback: >-
            Skimming passes plausible lines, and this one is plausible. Each claim needs a
            source.
        - text: Compare it with the summary template
          feedback: >-
            A template checks the shape. This one has the right shape and a false line.

  - type: explain-back
    id: post-the-next-update
    concept: explain.incident-update-shape
    difficulty: 4
    audience: incident
    kind: risk
    prompt: >-
      Suppose the 10:52 rollback had fixed most uploads, but about 1 in 20 still failed. Nobody
      knows why. Write the 11:05 update for the incident channel. Say it out loud first.
    rubric:
      - Impact first, current and specific, such as 1 in 20 uploads failing, with listening fine.
      - Status says plainly what isn't known, with no guess stated as fact and no names.
      - What you're doing, any workaround, and a clock time with a time zone for the next update.
    modelAnswer: >-
      Impact: since the 10:52 rollback, about 1 in 20 uploads still fail, down from 1 in 3.
      Listening is fine. Status: the rollback fixed most failures, and we don't know the cause
      of the rest yet. Now: we're comparing failed uploads for anything they share. Retrying
      usually works. Next update: 11:35 UTC, or sooner if anything changes.

  - type: explain-back
    id: defend-not-known
    concept: explain.blameless-wording
    difficulty: 4
    audience: newcomer
    kind: decide
    prompt: >-
      Everyone suspected the storage change. Yet your 10:05 update said the cause wasn't
      known. A new on-call engineer asks why. Defend that choice. Try saying it out loud
      first.
    rubric:
      - Readers repeat updates as fact, so a guess spreads to support and customers.
      - Correcting a wrong cause in public costs more trust than saying it isn't known.
      - The suspicion can still be shared as a lead, with what you're doing to test it.
    modelAnswer: >-
      Whatever we write, support repeats to customers as fact. If the storage change had been
      innocent, we'd have corrected it in public and looked like we were guessing. "Not known
      yet" is honest and still useful. I did share the suspicion, as a lead: we were rolling
      back the storage change to test it. Once it was confirmed, the next update said so.

recap:
  - 'Write updates in order: impact, status, what you''re doing, the next update time.'
  - Give the next update as a clock time with a time zone, and keep the promise.
  - Describe what systems did, not who slipped, and mark guesses as guesses.

recall:
  - id: card-four-parts
    concept: explain.incident-update-shape
    front: What four things does an incident update say, in order?
    back: >-
      The impact, the current status, what you're doing, and when the next update will come.
  - id: card-clock-time
    concept: explain.incident-update-shape
    front: Why give the next update as "10:35 UTC" and not "in 30 minutes"?
    back: >-
      People read updates late. A clock time with a zone means the same whenever and wherever
      it's read.
  - id: card-blameless-update
    concept: explain.blameless-wording
    front: How do you describe a cause in an update without blame?
    back: >-
      Say what the system or process did, such as "a change went out without review", not
      who did it.
  - id: card-guesses
    concept: explain.blameless-wording
    front: Why mark a suspected cause as unconfirmed in an update?
    back: >-
      Readers repeat updates as fact. A wrong cause stated firmly gets corrected in public
      and costs trust.

