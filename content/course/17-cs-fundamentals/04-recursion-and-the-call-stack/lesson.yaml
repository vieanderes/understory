deepDive: >-
  We built a chain of 100,000 folders, each inside the last. The recursive count threw a
  `RangeError`. The loop with its own pile counted 100,001 files. Use recursion when the data
  is shallow, like real folders. Use a loop when depth comes from user data.


  The outputs are from Node 24. `total(5000)` returned 12,502,500. `total(10000)` threw
  `RangeError: Maximum call stack size exceeded`. A bare function that only calls itself
  reached a depth of 10,393 first. The limit isn't a number of calls. It's a size in bytes,
  so bigger frames mean fewer of them. It varies by engine, version and machine. Never
  design around a figure.


  The explicit stack visits folders in a different order from the recursion. It takes the
  last subfolder first. For a sum that doesn't matter. When order matters, push the
  subfolders in reverse.


  Some languages reuse the frame when a function's last act is to call itself. That's tail
  call optimisation, and it makes such recursion as cheap as a loop. It's in the JavaScript
  standard, but V8 doesn't do it, so Node and Chrome don't either. `total` wouldn't qualify
  anyway. It still has an addition to do after the inner call returns.


  Recursion also isn't free in time. Each call costs a little more than a loop step. For
  tree-shaped data the clarity is usually worth it. For a plain count from 1 to n, a loop is
  the honest tool. Ours summed to 100,000 without complaint.
