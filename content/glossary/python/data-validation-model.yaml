term: data validation model
aka:
  - validation model
  - schema class
short: A class whose typed fields check and convert incoming data the moment an instance is created.
explain: |
  Data from outside lies. A request body says `"3"` where you wanted a number. A model's
  reply wraps its JSON in a friendly sentence. Type hints alone check none of this when the
  program runs.

  So you describe the shape you expect as a class with typed fields. Creating an instance parses the data and converts what it safely can. Anything wrong raises one
  error listing every bad field. Past that line, the rest of your code can trust the types.

  The trap is validating everywhere. Check once, at the boundary where data arrives. Inside
  your own code, between functions that already trust each other, a plain dataclass is
  enough.
analogy: A bouncer with a guest list. Checked once at the door, nobody inside asks for ID again.
example:
  language: python
  code: |
    from pydantic import BaseModel, Field

    class Refund(BaseModel):
        order_id: int
        amount: float = Field(gt=0)
        reason: str

    refund = Refund.model_validate_json(reply_text)
usage: Parse the model's reply into a data validation model before anything else touches it.
twin:
  term: dataclass
  difference: A dataclass stores fields and trusts what you give it. A data validation model checks and converts every value on the way in.
related:
