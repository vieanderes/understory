term: edge function
aka: [ edge compute, edge runtime, edge middleware ]
short: Code that runs at a delivery network's locations near each visitor, in a small, restricted runtime.
explain: |
  A request from the other side of the world crosses an ocean to reach your one server. Small
  decisions, such as a redirect, could be made close to the visitor instead.

  This code runs at many points of presence, in a cut-down runtime with tight limits on time
  and packages. It suits redirects, headers, sign-in checks and personalising cached pages.
  The trap is data. Code at the edge that queries a database in one region pays the long round
  trip every time.
analogy: A ticket inspector at each station, rather than one central office every passenger must visit.
usage: Do the language redirect in an edge function, but keep the checkout next to the database.
twin:
  term: serverless
  difference: An edge function runs at many locations near users, in a restricted runtime. A serverless function runs in one region, with the full runtime and close to its data.
related: [ serverless, cdn, latency, cloud-region ]
level: 3
lessons: [ cloud.edge ]
