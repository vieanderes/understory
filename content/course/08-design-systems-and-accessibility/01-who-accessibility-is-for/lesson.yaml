deepDive: >-
  The **accessible name** comes from a fixed order of sources: `aria-labelledby`, then
  `aria-label`, then the element's own label or content, then `title`. The first that gives
  text wins. That's why `aria-label` beats visible text, and why `title` on a button with
  text adds nothing.


  `aria-hidden="true"` removes an element and everything inside it from the tree. It suits a
  decorative icon. Never put it on something that can take focus: a keyboard user would land
  on a control that doesn't exist for their screen reader.


  An image with `alt=""` leaves the tree entirely. An image with no `alt` at all stays as an
  unnamed image, and some screen readers read out its file name.
