# Path: AI engineering for the technical rounds. Schema: fastTrackSchema in src/core/content/notes.ts.
title: "AI engineering: build and explain AI systems"
name: AI engineering
order: 5
promise: Build a RAG pipeline, a production model client and an agent loop, and answer the questions about them.
outcomes:
  - Build a small RAG pipeline and say how you would measure it
  - Wrap a model call with timeouts, retries, a concurrency cap, caching and validated JSON
  - Write a tool-calling agent loop with a step limit and a clean stop
  - Explain prompting, RAG, agents, evals, injection and reasoning models in a minute each
  - Stream answers from a backend to a UI and handle errors mid-stream
decision: Is the role about building products on top of language models?
readyWhen:
  - You can build a small RAG pipeline and name two ways you would measure it.
  - You can wrap a model call with a timeout, retries, a concurrency cap, caching and validated JSON.
  - You can write an agent loop with a step limit, a clean stop and approval before risky tools.
  - You can explain prompting, RAG, agents, evals, injection and reasoning models in a minute each.
  - You can work with a coding agent on a real repository behind tests and review.
proof:
  title: A small AI feature, built and measured
  evidence:
    - A RAG or agent feature with a typed contract for its output
    - An eval set with at least 20 cases and a pass rate
    - A cost and latency figure per request
    - A written note on its failure modes and guardrails
coverage:
  covered: [RAG, tools and agents, Evals and guardrails, Cost, latency and streaming, Working with coding agents]
  partial: [Fine-tuning, MCP servers, Multi-agent systems]
  outside: [Training models from scratch, Computer vision and speech]
summary: >-
  The three builds AI engineering interviews ask for, then the questions they lead to, from how
  models work to running them in production. Agents that act over many steps continue in the
  agent engineering path.
method:
  - Do the lesson in the app, then read its notes.
  - Cover the strong answers. Say yours out loud in under a minute, then compare.
  - Rebuild each project once without the lesson open.
shapes:
  - label: Any technical question
    text: >-
      The point in one sentence, then the reason, then one trade-off or "when not to". Stop
      there and let them ask.
  - label: AI design
    text: >-
      Start from the eval: what good looks like and how you measure it. Then retrieval, the
      model call with validated output, guardrails, cost and latency, and monitoring.
days:
  - title: The three builds
    why: >-
      A mini RAG pipeline, a production model client and a tool-calling agent. Build them once
      and most AI questions have an example ready.
    artifact: "Three working builds you can explain"
    must: [interview.rag-build, interview.llm-client-build, interview.agent-build]
    capstone: aiengineering
  - title: How it works
    why: >-
      The questions every AI loop asks: prompts and context, structured output and tools,
      retrieval, agents, evals, injection, failure modes and reasoning models.
    artifact: "A minute-long answer for each core question"
    must: [ai.prompting-and-context, ai.structured-output-and-tools, ai.rag, ai.agents, ai.evals, ai.injection-and-leakage, ai.failures, ai.reasoning-and-training]
    should: [ai.tools]
  - title: In production
    why: >-
      What separates an AI engineer from a prompt writer: retrieval quality, guardrails, evals
      at scale, cost and latency, and streaming it to a user.
    artifact: "A plan to run it in production"
    must: [ai.production, aisys.retrieval-in-depth, aisys.reading-documents, aisys.checking-extractions, aisys.guardrails, aisys.evals-in-depth, aisys.cost-and-latency, aisys.choosing-models, pyai.fastapi, backend.realtime]
    should: [react.performance, testing.components]
    tests: [{ lab: request-journey }, { lab: cache-layer-explorer }]
  - title: Coding agents
    why: >-
      AI engineers now ship with coding agents. Know how to give one a repository, a scope and
      gates it must pass, and how to shape the build before anyone writes code.
    artifact: "An instruction file, a scope contract and a handoff note"
    must: [aisys.coding-agents, aisys.agent-workbench, aisys.shaping-the-build]
    tests: [{ test: ai-screen }]
