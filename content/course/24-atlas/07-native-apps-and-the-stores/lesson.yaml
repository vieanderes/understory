id: atlas.native-ui
title: Native apps and the stores
objective: Read a SwiftUI screen as you'd read React, keep an app's signing key safe, and keep a server working for app versions that update slowly.
level: advanced
minutes: 10
concepts: [atlas.declarative-native-ui, atlas.code-signing, atlas.store-release]
prerequisites: [atlas.cross-platform, react.ui-as-a-function-of-state, security.secrets, backend.api-evolution]
opening:
  text: >-
    You'll read a native iPhone screen with what you know from React. Then you'll get a build
    from your laptop to a stranger's phone, and keep it working there for months.

steps:
  - type: prose
    id: name-declarative-native-ui
    body: >-
      Native screens today are written the React way. **SwiftUI** on Apple devices and
      **Jetpack Compose** on Android both describe the screen from state. You never set a
      label by hand. You change the value, and the framework redraws what reads it.


      In SwiftUI, `@State` marks a value the view owns, like `useState` in React.

  - type: predict-output
    id: predict-swiftui-label
    concept: atlas.declarative-native-ui
    difficulty: 1
    language: text
    code: |
      // SwiftUI
      struct Counter: View {
        @State private var count = 0
        var body: some View {
          Button("Tapped \(count)") { count += 1 }
        }
      }
    question: The user taps the button twice. What does its label read?
    choices:
      - text: '`Tapped 2`'
        correct: true
        feedback: >-
          Right. Same as React: the label is built from `count`, and rebuilt when it changes.
      - text: '`Tapped 0`, the label was set once'
        feedback: >-
          Older toolkits worked that way. Here the label comes from `count` each time it changes.
      - text: It fails, `count` is private
        feedback: >-
          `private` hides it from other views. The view's own body reads it fine.

  - type: prose
    id: name-code-signing
    body: >-
      Before a phone installs a build, it checks a **signature**: proof the build came from
      the app's owner and wasn't changed. You sign with a private key tied to your developer
      account.


      On Android that key lives in a **keystore**, a password-protected file. Every update
      must be signed with the same key. Whoever holds it can ship updates as you.

  - type: ai-review
    id: review-keystore-in-repo
    concept: atlas.code-signing
    difficulty: 3
    language: bash
    request: Set up release signing so CI can build the Android release.
    flawClass: security
    code: |
      # android/app/build.gradle, release signing
      #   storeFile file('release.keystore')
      #   storePassword 'recipes-2026'
      git add android/app/release.keystore android/app/build.gradle
      git commit -m "Add release signing so CI builds work"
    prompt: >-
      An assistant wrote this. CI now makes a signed release, and it installs on every test
      phone. Tap the line at fault.
    lines: [4]
    reasons:
      - text: The signing key and password are in the repo
        correct: true
        feedback: >-
          Yes. Anyone who can read the repo can sign updates. Keep both in CI secrets.
      - text: The keystore file should be renamed
        feedback: >-
          The name doesn't matter. Where the file lives, and who can read it, does.
      - text: CI should build with a debug key instead
        feedback: >-
          A debug-signed build can't update the release app. CI needs the real key, kept secret.
    fix: |
      # keep the keystore and its password out of the repo
      echo "android/app/release.keystore" >> .gitignore
      # CI reads both from its secret store at build time
      #   storeFile file(System.getenv('KEYSTORE_PATH'))
      #   storePassword System.getenv('KEYSTORE_PASSWORD')

  - type: prose
    id: name-store-release
    body: >-
      Web deploys take seconds. A store release waits for **review**, then each user installs
      it in their own time. So teams ship on a **release train**, a fixed date, and use a
      **phased roll-out**: the update goes to a few users first.


      Old versions linger for months. So the server keeps them working. And an app can check a minimum version with
      the server, to ask for an update.

  - type: ai-review
    id: review-version-as-text
    concept: atlas.store-release
    difficulty: 3
    language: js
    request: Tell the app when it's too old and must be updated.
    flawClass: logic
    code: |
      const MINIMUM = '2.9.0';

      export function mustUpdate(appVersion) {
        return appVersion < MINIMUM;
      }
    prompt: >-
      An assistant wrote this. Versions 2.8 and 2.9 behaved. The day 2.10.0 shipped, its users
      were all told to update. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It compares versions as text, character by character
        correct: true
        feedback: >-
          Yes. As text, "2.1" sorts before "2.9". Compare each number as a number.
      - text: '`MINIMUM` should be `2.10.0`'
        feedback: >-
          Then 2.9 users would be told to update too. The comparison itself is wrong.
      - text: It should use `<=`
        feedback: >-
          That would also flag 2.9.0 itself. The trouble is comparing text, not the operator.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A version with a two-digit part, like 2.10.0
          correct: true
          feedback: >-
            Yes. Two-digit parts are where text order and number order split.
        - text: Exactly the minimum version, 2.9.0
          feedback: >-
            Equal text is not less than itself, so that passes. Text and numbers agree
            there.
        - text: A much older version, like 1.0.0
          feedback: >-
            As text, '1' still sorts before '2', so that passes too.
    fix: |
      export function mustUpdate(appVersion) {
        return isOlder(appVersion, MINIMUM);   // compares 2, then 10 against 9, as numbers
      }

  - type: code-challenge
    id: write-is-older
    concept: atlas.store-release
    difficulty: 3
    language: ts
    editable: '3'
    prompt: >-
      Write `isOlder(version, minimum)` for versions like `"2.10.0"`. Split each on `"."`,
      turn the parts into numbers, and compare them left to right.


      So `isOlder("2.10.0", "2.9.0")` is `false`. Throw when a version isn't three whole numbers.
    hints:
      - '`"2.10.0".split(".").map(Number)` gives `[2, 10, 0]`.'
      - The first pair of numbers that differ decides. If none differ, it isn't older.
      - '`Number.isInteger` is `false` for `NaN`, which is what `Number("two")` gives.'

  - type: explain-back
    id: explain-week-to-users
    concept: atlas.store-release
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      The web team ships fixes ten times a day. The app team says a fix takes a week to reach
      most users. Why, and what does that force on the server?
    rubric:
      - A store build must pass review, and then each user installs the update in their own time.
      - Teams answer with release trains and phased roll-outs, and send JavaScript-only changes over the air where they can.
      - Old versions stay in use for months, so the server must keep every API they call working.
    modelAnswer: >-
      A web fix is one deploy and everyone has it. An app fix is a build, a store review,
      and then a slow wave of installs as users update. Even a phased roll-out done well takes
      days to reach most people. So the app team batches work into release trains. And the
      server can't assume anyone has the latest build. Every version still in use has to
      keep working, which means old endpoints stay up and new fields stay optional.

recap:
  - Read SwiftUI and Compose as React's model, with the screen built from state.
  - Keep the signing key out of the repo, since whoever holds it ships as you.
  - Compare versions as numbers, and keep the server working for old ones.

recall:
  - id: card-declarative-native
    concept: atlas.declarative-native-ui
    front: What do SwiftUI, Compose and React share in how a screen updates?
    back: >-
      The screen is built from state. You change the value, and the framework redraws what
      reads it. Nobody sets a label by hand.
  - id: card-signing
    concept: atlas.code-signing
    front: Why guard an Android app's signing key so closely?
    back: >-
      Every update must be signed with it, and phones trust whatever it signs. Whoever holds
      it can ship updates as you.
  - id: card-release-train
    concept: atlas.store-release
    front: Why do app teams ship on a fixed schedule?
    back: >-
      Review adds a delay and installs trickle in, so each release is expensive. A train with
      a phased roll-out makes the cost predictable.
  - id: card-version-compare
    concept: atlas.store-release
    front: Why is `"2.10.0" < "2.9.0"` true in JavaScript?
    back: >-
      Strings compare character by character, and "1" comes before "9". Split the version and
      compare the numbers.

