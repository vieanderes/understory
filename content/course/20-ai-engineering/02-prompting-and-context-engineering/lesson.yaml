deepDive: >-
  **Why "be specific" works.** A model predicts likely text. A vague prompt leaves many
  likely replies open, and your code gets one of them at random. A precise one narrows the
  likely replies to the shape you want. Saying why a rule exists also helps, since the
  model can apply the reason to cases you didn't list.


  **Bigger windows aren't free.** Some models read a million tokens. Every token sent is
  paid for on every call, and answers often get worse when the key fact is buried in a
  lot of unrelated text. Send what the task needs.


  **Summaries.** A long-running chat can replace old turns with a short summary the model
  writes. Some APIs can do this for you, and chapter 21 covers the trade-offs.
