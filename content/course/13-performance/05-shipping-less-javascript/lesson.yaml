id: perf.shipping-less-javascript
title: Shipping less JavaScript
objective: "Read a bundle report, load code only when it's needed with `import()`, and fail the build when the bundle grows past a budget."
level: essential
minutes: 10
concepts: [perf.bundle-analysis, perf.code-splitting, perf.performance-budgets]
prerequisites: [perf.cost-of-javascript, tooling.what-a-build-does, js.modules]
opening:
  text: >-
    You'll find what makes a bundle big, and move code the first screen doesn't need out of
    it. Then a budget in CI keeps it small after you've moved on.

steps:
  - type: prose
    id: read-a-bundle-report
    body: |-
      The cheapest script is the one a page never loads. A **bundle report** lists what's inside a bundle and how big each part is. Here's esbuild's, for a small notes app, from `--analyze`:

      ```text
      out/app.js                       262.1kb  100.0%
       ├ react-dom-client.production   200.2kb   76.4%
       ├ marked.esm.js                  43.5kb   16.6%
       ├ react.production                7.8kb    3.0%
       └ app.jsx                         0.4kb    0.2%
      ```

      `marked` turns Markdown into HTML. Vite and Next.js have plugins that draw the same report.

  - type: multiple-choice
    id: pick-the-easy-win
    concept: perf.bundle-analysis
    difficulty: 1
    question: The app uses `marked` only when you press Preview. Which line is the easiest win?
    choices:
      - text: '`marked.esm.js`, 43.5 kB'
        correct: true
        feedback: >-
          Right. Most visits never press Preview, yet every visit downloads it.
      - text: '`react-dom-client`, 200.2 kB'
        feedback: >-
          It's bigger, but it draws every screen. The app can't start without it.
      - text: '`app.jsx`, 0.4 kB'
        feedback: >-
          Your own code is tiny here. The weight is in the packages.

  - type: prose
    id: dynamic-import
    body: |-
      `import()` written like a function loads a module when that line runs, and gives you a promise of it:

      ```js
      async function showPreview() {
        const { marked } = await import("marked");
        preview.innerHTML = marked.parse(notes.value);
      }
      ```

      The bundler puts `marked` in a file of its own. That's **code splitting**. We built it: `app.js` fell from 262.1 kB to 218.1 kB, and the 43.6 kB file loads on the first Preview.

  - type: fill-blank
    id: fill-dynamic-import
    concept: perf.code-splitting
    difficulty: 2
    language: js
    prompt: Load the chart library only when someone opens the Stats tab. Fill the gaps.
    template: |
      statsTab.addEventListener("click", async () => {
        const { drawChart } = {{1}} {{2}}("./chart.js");
        drawChart(statsPanel, visits);
      });
    blanks:
      - key: '1'
        answer: await
      - key: '2'
        answer: import
    bank: [await, async, import, require, fetch]

  - type: ai-review
    id: review-static-import-left
    concept: perf.code-splitting
    difficulty: 3
    language: js
    request: Only load marked when someone presses Preview.
    flawClass: performance
    code: |
      import { marked } from "marked";

      previewButton.addEventListener("click", async () => {
        await new Promise((resolve) => setTimeout(resolve, 0));
        preview.innerHTML = marked.parse(notes.value);
      });
    prompt: >-
      An assistant wrote this and said "marked now loads lazily". The bundle report still
      shows `marked` inside `app.js`. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The top-level import still loads marked with the page
        correct: true
        feedback: >-
          Yes. Waiting before using it changes nothing. Only `await import()` splits it out.
      - text: The timer should wait longer than 0 ms
        feedback: >-
          Any wait is beside the point. The library arrived with the page already.
      - text: '`marked.parse` needs `await`'
        feedback: >-
          It returns the HTML straight away. The trouble is when the library is loaded.
    fix: |
      previewButton.addEventListener("click", async () => {
        const { marked } = await import("marked");
        preview.innerHTML = marked.parse(notes.value);
      });

  - type: prose
    id: dev-build-and-budgets
    body: >-
      Measure the production build. Built for development, the same notes app was 1.2 MB,
      not 262 kB. Dev builds skip minifying and keep React's extra checks.


      A size nobody guards creeps up. A **performance budget** is a limit on a size or a
      metric. A change that crosses it fails the CI build. The slow change gets caught
      in review, like a failing test.

  - type: multiple-choice
    id: pick-dev-build
    concept: perf.performance-budgets
    difficulty: 2
    question: Your bundle report says 1.2 MB, but the live site loads 262 kB. What happened?
    choices:
      - text: The report came from a development build
        correct: true
        feedback: >-
          Right. Dev builds are unminified and carry extra checks. Report on the production build.
      - text: The server compresses the file
        feedback: >-
          Compression helps, but the report counts the file before it's sent. The builds differ.
      - text: The browser skips code it doesn't need
        feedback: >-
          The browser downloads the whole file it's given. The files themselves differ.

  - type: code-challenge
    id: write-budget-report
    concept: perf.performance-budgets
    difficulty: 3
    language: ts
    editable: '9-10'
    prompt: >-
      Write `budgetReport(files, budgets)` for CI. `budgets` maps a file's name up to the
      first `-` to its limit in kB, so `app-3f9a1c.js` uses `budgets.app`.


      Round each size with `Math.round(bytes / 1000)`. For every file over its budget, add
      the line `app-3f9a1c.js is 262 kB, over its 200 kB budget`. Skip files with no budget.
      At the budget exactly is fine.
    hints:
      - '`file.name.split("-")[0]` gives the part before the hash.'
      - A missing budget reads as `undefined`, so check for that before comparing.
      - 'Loop with `for (const file of files)`, and push a template string such as `${file.name} is ${kb} kB, ...`.'

  - type: explain-back
    id: explain-what-to-split
    concept: perf.code-splitting
    difficulty: 3
    prompt: >-
      A page's bundle is 900 kB, and taps feel slow on phones. How would you find what to
      cut, and how would you cut it?
    rubric:
      - Build for production and read a bundle report to see which parts are biggest.
      - Code the first screen doesn't need moves behind `await import()`, so it loads when used.
      - A budget in CI keeps the bundle from growing back.
    modelAnswer: >-
      I'd build for production and open a bundle report, then look at the biggest parts.
      Anything the first screen doesn't use, such as a chart or an editor, goes behind
      `await import()`. Then it loads when someone needs it. Then I'd add a budget in CI, so
      the next big package fails the build instead of reaching users.

recap:
  - Read a bundle report from a production build and find the biggest part the page doesn't need.
  - "Load that code on demand with `await import()`, which splits it into its own file."
  - Guard sizes with a budget that fails CI, like a test for speed.

recall:
  - id: card-bundle-report
    concept: perf.bundle-analysis
    front: What does a bundle report show you?
    back: >-
      What's inside the bundle and how big each part is, so you cut the biggest waste first.
  - id: card-dynamic-import
    concept: perf.code-splitting
    front: How do you load a module only when it's needed?
    back: >-
      `const { name } = await import("./module.js")` at the moment you need it. The bundler
      puts it in its own file.
  - id: card-static-import-stays
    concept: perf.code-splitting
    front: Why doesn't waiting before using a statically imported library make it lazy?
    back: >-
      An `import` at the top of the file loads the library with the page, whenever you use it.
  - id: card-budget
    concept: perf.performance-budgets
    front: What does a performance budget do?
    back: >-
      It fails the CI build when a size or a metric crosses a limit, so a slow change is
      caught in review.

