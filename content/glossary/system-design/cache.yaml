term: cache
aka: [ caching, cached ]
short: A quick-to-reach copy of data kept close by, so you skip the slow trip to the original.
explain: |
  Some answers are slow to get and asked for again and again: a product page, a user's
  settings, an exchange rate. Keeping a copy somewhere fast, like memory or Redis, means
  the second request doesn't pay the full price.

  Every copy can go stale. So a good one has a plan: how long a copy lives (its **TTL**),
  what happens on a **miss**, and how it's cleared when the original changes. The most
  common pattern is **cache-aside**: read the copy, and on a miss load from the database
  and store the result.
analogy: The snack drawer by your desk. The supermarket has everything, but the drawer is right there, until it runs out or the biscuits go stale.
example:
  language: ts
  code: |
    async function getProduct(id: string) {
      const hit = await redis.get(`product:${id}`);
      if (hit) return JSON.parse(hit);
      const product = await db.findProduct(id);
      await redis.set(`product:${id}`, JSON.stringify(product), 'EX', 300);
      return product;
    }
usage: Put a cache in front of the pricing call; it's the same answer for every visitor for five minutes.
related: [ cache-invalidation, cache-stampede, cdn, latency, memoisation, cache-control ]
level: 1
lessons: [ perf.server-caching, sysdesign.caching-patterns ]
