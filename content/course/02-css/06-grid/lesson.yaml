deepDive: >-
  Grid lines are numbered from 1, so three columns have four lines, and `-1` is the last line.
  `grid-column: 1 / -1` makes an item span the full width, and `grid-column: span 2` makes it
  two columns wide wherever it lands.


  `1fr` is short for `minmax(auto, 1fr)`. The `auto` minimum is the content's smallest size,
  so a wide image or a long unbroken word holds its column open. In a 600px grid of `1fr 1fr`,
  a 500px map gives columns of 500px and 100px. `minmax(0, 1fr)` keeps them equal and lets the
  content overflow instead.


  Flex can wrap too, with `flex-wrap: wrap`. But each wrapped flex line shares out its own
  space, so a short last line stretches and the cards don't line up in columns. That's the
  usual sign you want grid.


  `grid-auto-flow: dense` lets later items fill gaps that auto-placement skipped. Keyboard and
  screen reader order still follows the HTML, so a dense grid of links can be read in an order
  the eye doesn't see.
