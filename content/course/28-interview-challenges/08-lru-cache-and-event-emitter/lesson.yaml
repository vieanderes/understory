id: interview.utilities
title: LRU cache and event emitter
objective: Write the two classes live utility rounds ask for most, an LRU cache on a Map and an event emitter with on, off and once.
level: essential
minutes: 10
concepts: [interview.lru-cache, interview.event-emitter]
prerequisites: [js.prototypes-and-classes, js.closures]
opening:
  text: >-
    You'll write the two small classes that live utility rounds ask for most: an LRU cache
    and an event emitter. Each hides one trap that costs the points.

steps:
  - type: prose
    id: what-you-need
    body: |-
      You need a JavaScript `class` and a `Map`. A **Map** stores key and value pairs, with
      `set`, `get`, `has`, `delete` and `size`. It remembers the order keys were added.

      A field written `#capacity` is **private**: only code inside the class can read it.

      Expect about 20 minutes per class. The interviewer scores the interface, the edge
      cases, each method's cost said aloud, and a test or two.

  - type: prose
    id: lru-with-map
    body: |-
      A **cache** keeps recent answers, up to a size limit. When it's full, one entry must
      go: that's **evicting** it. An **LRU cache** evicts the least recently used key.

      Picture a `Map` with room for two:

      - `put a`, `put b`: the order is a, b
      - `get a`: a should move to the end, so b, a
      - `put c`: over the limit, so the first key, b, goes

  - type: predict-output
    id: predict-map-order
    concept: interview.lru-cache
    difficulty: 1
    language: js
    code: |
      const cache = new Map();
      cache.set('a', 1);
      cache.set('b', 2);
      cache.get('a');
      cache.set('c', 3);
      console.log([...cache.keys()]);
    question: What does this log?
    choices:
      - text: "`['a', 'b', 'c']`"
        correct: true
        feedback: >-
          Yes. A `Map` keeps insertion order, and reading a key doesn't move it.
      - text: "`['b', 'a', 'c']`"
        feedback: >-
          That's what an LRU cache needs, so most people pick it. A plain `get` never
          changes the order.
      - text: "`['c', 'b', 'a']`"
        feedback: >-
          Newest first is how a stack reads. A `Map` iterates oldest first.

  - type: fill-blank
    id: fill-lru-get
    concept: interview.lru-cache
    difficulty: 2
    prompt: >-
      So a read must move the key itself. Deleting it and setting it again puts it at the
      end. Finish `get`.
    language: ts
    template: |
      get(key: K): V | undefined {
        if (!this.entries.has(key)) return undefined;
        const value = this.entries.get(key) as V;
        this.entries.{{1}}(key);
        this.entries.{{2}}(key, value);
        return value;
      }
    blanks:
      - key: '1'
        answer: delete
      - key: '2'
        answer: set
    bank: [delete, set, get, clear, push]

  - type: code-challenge
    id: write-lru-cache
    concept: interview.lru-cache
    difficulty: 3
    language: ts
    twin:
      language: python
      starter: lru.starter.py
      solution: lru.solution.py
      tests: lru.tests.py
    prompt: >-
      Finish the class `LRUCache<K, V>`. `new LRUCache(capacity)` makes an empty cache.


      `get(key)` returns the value, or `undefined`, and marks the key as recently used.
      `put(key, value)` stores or updates it, then evicts the least recently used key when
      there are more than `capacity`.


      Updating a key keeps one entry. A cache of 50,000 keys must stay fast, so no array
      scans. The oldest key is `this.#entries.keys().next().value`.
    hints:
      - Look at the first step. Reading a key didn't change the order of the `Map`.
      - Deleting a key and setting it again puts it at the end. The first key is the oldest.
      - 'In `put`, delete the key first, then set it, then check `size` against `#capacity`.'

  - type: prose
    id: emitter-picture
    body: |-
      An **event emitter** lets one part of an app announce something, and others react.
      It's a `Map` from an event name to a list of listener functions.

      - `on('saved', fn)` adds `fn`, and returns a function that removes it
      - `off('saved', fn)` removes `fn`
      - `once('saved', fn)` adds a listener that runs one time only
      - `emit('saved', ...args)` calls every listener with the arguments

      Node's `EventEmitter` and the browser's `addEventListener` work this way.

  - type: bug-hunt
    id: hunt-emitter-skip
    concept: interview.event-emitter
    difficulty: 3
    language: js
    code: |
      const listeners = { saved: [] };
      function on(event, fn) { listeners[event].push(fn); }
      function off(event, fn) {
        const list = listeners[event];
        list.splice(list.indexOf(fn), 1);
      }
      function emit(event) {
        for (const fn of listeners[event]) fn();
      }
      const toast = () => { off('saved', toast); console.log('toast'); };
      on('saved', toast);
      on('saved', () => console.log('badge'));
      emit('saved');
    prompt: >-
      `toast` removes itself, the way `once` works. This logs only `toast`, and the badge
      never updates. Tap the line at fault.
    lines: [8]
    reasons:
      - text: The loop walks the live list as it shrinks
        correct: true
        feedback: >-
          Yes. Removing index 0 shifts `badge` into it, then the loop reads index 1.
      - text: '`splice` removes the wrong listener'
        feedback: >-
          It removes `toast`, which is right. The trouble is the loop still reading that list.
      - text: '`toast` should call `off` after logging'
        feedback: >-
          The order inside `toast` doesn't matter. Either way the list shrinks mid-loop.
    fix: |
      for (const fn of [...listeners[event]]) fn();

  - type: code-challenge
    id: write-emitter
    concept: interview.event-emitter
    difficulty: 4
    language: ts
    starter: emitter.starter.ts
    solution: emitter.solution.ts
    tests: emitter.tests.ts
    twin:
      language: python
      starter: emitter.starter.py
      solution: emitter.solution.py
      tests: emitter.tests.py
    prompt: >-
      Finish the class `Emitter`. `on(event, fn)` adds a listener and returns a function
      that removes it. `off(event, fn)` removes it too. `once(event, fn)` runs at most one
      time, and `off` can still remove it first.


      `emit(event, ...args)` calls the listeners in the order they were added, and returns
      whether any ran. A listener that removes itself mustn't make the next one skip.
    hints:
      - Run the tests. The skip and the `once` tests fail for the reason in the last step.
      - Store each registration as an object, `{ fn, once }`. Then `once` and the returned remover need no wrapper.
      - In `emit`, loop over a copy, `[...list]`, and remove a `once` entry before calling it.

  - type: explain-back
    id: explain-emitter-copy
    concept: interview.event-emitter
    difficulty: 4
    prompt: >-
      The interviewer asks why your `emit` loops over a copy of the listener list. What do
      you say?
    rubric:
      - A listener may call `off` or `once` may remove itself while the loop is running.
      - Removing from the live array shifts the later listeners, so the loop skips one.
      - A copy fixes the list for this emit, and the cost is one short array per emit.
    modelAnswer: >-
      Listeners can change the list while I'm calling them. A `once` listener removes itself,
      and any listener can call `off`. On the live array that shifts everything after it, so
      the loop steps over the next listener. Looping over a copy freezes the list for this
      emit. It costs one small array each time, which is fine for a handful of listeners.

recap:
  - Build an LRU cache on a Map by re-setting keys on read.
  - Evict the first key in the Map when the cache is over capacity.
  - Write an emitter with on, off and once, and loop over a copy in emit.
recall:
  - id: card-lru-read
    concept: interview.lru-cache
    front: How does a Map-based LRU cache mark a key as recently used?
    back: >-
      It deletes the key and sets it again, which moves it to the end of the insertion
      order.
  - id: card-lru-evict
    concept: interview.lru-cache
    front: Which key does a Map-based LRU cache evict, and how do you get it?
    back: >-
      The first key in insertion order, the least recently used: `entries.keys().next().value`.
  - id: card-emitter-copy
    concept: interview.event-emitter
    front: Why should `emit` loop over a copy of the listener list?
    back: >-
      A listener may call `off` during the emit. On the live array that shifts the others
      and skips the next listener.
  - id: card-emitter-once
    concept: interview.event-emitter
    front: How can `off(event, fn)` remove a listener added with `once`?
    back: >-
      Store each registration as `{ fn, once }` and match on `fn`, or keep the original `fn`
      on the wrapper that `once` adds.

references:
  - kind: docs
    title: Map
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
    note: Iteration follows insertion order, which is what the LRU cache relies on.
    primary: true
    verified: true
  - kind: spec
    title: 'ECMAScript Language Specification, Map objects'
    authors: Ecma TC39
    venue: ECMA-262
    url: https://tc39.es/ecma262/#sec-map-objects
    note: The normative definition of Map iteration order.
    verified: true
  - kind: docs
    title: Events
    authors: Node.js contributors
    venue: Node.js documentation
    url: https://nodejs.org/api/events.html
    note: The EventEmitter interface that interview emitters imitate, including `once` and the copy made on emit.
    primary: true
    verified: true

deepDive: |-
  **When the Map version slows down.** V8 keeps a deleted `Map` entry as a hole until the
  table is rebuilt. `keys().next()` walks past every hole at the front. Under heavy
  churn at a large capacity, eviction stops being constant time. On Node 24 we measured
  200,000 put-and-get pairs at capacity 50,000. They took about 10 seconds, against 50 ms
  at capacity 100. Production caches such as `lru-cache` use a doubly linked list instead.
  A `Map` goes from key to node, and each node has `prev` and `next` links. Moving a node
  and dropping the tail are then true O(1). Offer the `Map` version first, then name this
  trade-off. That's the senior signal.


  **Extensions interviewers add to the LRU.** A time to live per entry: store `expiresAt`
  next to the value and check it on `get`. A `peek` that reads without refreshing. A size
  measured in bytes rather than entries.


  **The emitter in Node.** `emit` works on a copy of the listener array. So a listener
  removed mid-emit still runs in that emit, and one added mid-emit waits for the next.
  `once` wraps `fn` and keeps the original on the wrapper, which is how `off(event, fn)`
  still finds it. An `error` event with no listener throws. Mention that last one if the
  interviewer asks how failures surface.


  **Where the assistant helps.** In an AI-assisted round, the boilerplate (the class shell,
  the test file) is fine to generate. The ordering trap and the copy in `emit` are the
  parts you're scored on, so write those yourself and say why.


  **Related lessons.** Debounce and throttle come next. A concurrency pool
  (`mapWithLimit`) is in the promises lesson, and retry with backoff is in the fetch
  lesson. Both come up in this round too.
