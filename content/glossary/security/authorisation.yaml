term: authorisation
aka:
  - authorization
  - authz
  - access control
short: Deciding whether a known user may do a particular thing.
explain: |
  Once the server knows who you are, it still has to decide, on every request, whether you
  may read this record or change that setting.

  Most leaks aren't stolen passwords. They're a missing check: the server takes `invoiceId`
  from the URL and returns it without asking whether this user owns it.
analogy: Your boarding pass. Everyone at the gate has shown a passport, but only some of them may board this plane.
usage: The endpoint does authorisation in the client only, so anyone with curl can skip it.
twin:
  term: authentication
  difference: Authorisation asks what you may do. Authentication asks who you are. You need the first answer before you can work out the second.
related:
  - authentication
  - least-privilege
level: 1
lessons: [security.broken-auth, backend.authorisation, db.row-level-security, security.owasp-top-ten]
