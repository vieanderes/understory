summary: >-
  A program is a list of instructions, and **running** it means the computer carries them
  out, one at a time, from the top down. This lesson gives you the first instruction every
  programmer learns: `console.log`, which shows a value in the output. The output is the
  place where a program's results appear, like a screen the program writes on.


  You also meet the two most common kinds of value. A **value** is one piece of data a
  program works with. A **number** is written as it is, like `42`. A **string** is a piece
  of text, and it always sits inside quotes, like `"Hello"`. The quotes tell the computer
  "this is text, show it as written". Without them, the computer tries to read the word as
  a name, or the sum as maths.


  That one rule explains most first-day surprises. `console.log(6 * 7)` shows `42`, because
  the computer works out the maths first. `console.log("6 * 7")` shows `6 * 7`, because
  text is never calculated. Every lesson after this one builds on the difference between a
  value the computer works with and text it only repeats.
remember:
  - '`console.log(...)` shows the value inside its brackets in the output, each call on a new line.'
  - Code runs from top to bottom, one instruction at a time, in exactly the order you wrote it.
  - Text goes inside quotes and is called a string, while numbers are written without quotes.
  - The computer works out maths before it shows it, but it never calculates anything inside quotes.
  - A word without quotes is read as a name, and a name that doesn't exist stops the program with an error.
  - '`console.log("42")` and `console.log(42)` look the same in the output, even though one is text and one is a number.'
  - Lines that start with `//` are comments, notes for people that the computer skips.
sections:
  - title: Where your code runs, and what "the output" is
    body: |-
      JavaScript, the language this course starts with, runs in two main places. The first
      is a **browser**, the program you use to visit websites. The second is **Node**, a
      program that runs JavaScript on its own, outside any browser. The editor in this app
      runs your code for you and shows what it printed under Console.

      Wherever it runs, the output of `console.log` goes to a **console**: a plain text
      window for messages from the program. In a browser it lives in the developer tools. In
      Node it's the terminal window, the text screen where you type commands.

      Here's a complete program with three instructions. Each one is a **statement**, one
      complete instruction, ended with `;`.

      ```js
      console.log("Starting");
      console.log(6 * 7);
      console.log("Done");
      // Starting
      // 42
      // Done
      ```

      Swap the first and last lines and the output swaps too. The computer never reorders
      your code or skips ahead. That sounds obvious now, but it's the idea you'll lean on
      most when you read someone else's code: start at the top and follow it line by line.

      Spaces outside quotes don't matter. `console.log( 6*7 );` shows `42`, the same as
      `console.log(6 * 7);`. Spaces inside quotes do matter: they are part of the text and
      appear in the output. Capital letters matter everywhere. `Console.log` with a capital C
      is a different name, and it fails.
  - title: 'Strings and numbers: why the quotes decide everything'
    body: |-
      Every value in JavaScript has a **type**, the kind of value it is. So far you know two
      types: numbers and strings.

      The quotes are how the computer tells them apart. `42` is a number, so the computer can
      calculate with it. `"42"` is a string of two characters, a 4 and a 2. It can't be
      multiplied like a number, because to the computer it's text that happens to look like
      one.

      Here's the catch: the output hides the difference.

      ```js
      console.log(42);
      console.log("42");
      // 42
      // 42
      ```

      Both lines show `42`, because `console.log` shows text without its quotes. So when a
      result looks right but behaves strangely later, check the quotes in your code, not the
      output. You'll see this matter in lesson 3, where `+` adds numbers but joins strings.

      You can write strings with double quotes or single quotes. `"Hello"` and `'Hello'` are
      the same string. Pick one style and stay with it. What you can't do is mix them in one
      string: `"Hello'` never finds its closing quote. Quotes pasted from a word processor
      are another trap. Curly quotes like `“Hello”` aren't quotes to JavaScript at all, and
      the program stops with an error. Always type quotes in the code editor.
  - title: Reading your first error messages
    body: |-
      An **error** is the computer telling you it can't carry out your code. In Node, the
      message names the line, points at the problem with a `^`, and gives the kind of error.
      Two kinds show up in this lesson, and they behave differently.

      A **syntax error** means the code isn't written in a form JavaScript understands, like
      a sentence with no full stop. The computer checks the whole program before it runs any
      of it, so nothing runs at all.

      ```js
      console.log("one");
      console.log("banana);
      ```

      This shows no `one`. Node stops before line 1 with this message:

      ```text
      console.log("banana);
                  ^^^^^^^^^
      SyntaxError: Invalid or unexpected token
      ```

      A **reference error** happens while the program runs. The code is well formed, but it
      uses a name that doesn't exist. Lines above it have already run.

      ```js
      console.log("one");
      console.log(banana);
      console.log("three");
      ```

      This shows `one`, then stops on line 2 with `ReferenceError: banana is not defined`.
      Line 3 never runs.

      So the output itself is a clue. If nothing printed, look for a syntax error: a missing
      quote or bracket. If some lines printed, the problem is at the first line that didn't.
      Read the last line of the message first. It names the problem in a few words.
  - title: Comments, and using them to test ideas
    body: |-
      A **comment** is a note in the code for people. Everything after `//` on a line is
      skipped by the computer.

      ```js
      // Minutes in a day, worked out by the computer
      console.log(24 * 60);
      // console.log("This line is switched off");
      // 1440
      ```

      Only `1440` appears. The first comment explains the line below it, and the last one
      turns a line of code into a note, so it doesn't run.

      Programmers use comments in both ways. The first is to explain *why* code is written
      the way it is, when that isn't clear from the code itself. "Shows the answer" above a
      `console.log` adds nothing. "Counted in minutes, because the timer expects minutes"
      does.

      The second is to switch code off for a moment while you test an idea. If a program
      misbehaves, putting `//` in front of a line and running it again tells you whether
      that line is involved. It's the simplest debugging trick there is. **Debugging** means
      finding and fixing mistakes in code, and you'll do it every day you write software.

      One habit to start now: remove switched-off code once you're done testing. Old
      commented-out lines pile up and confuse the next reader, who can't tell whether
      they're still needed.
pitfalls:
  - '**Putting quotes around maths.** `console.log("24 * 60")` shows `24 * 60`, because quotes make it text. It happens when you think of the quotes as "what to show". Leave maths without quotes and let the computer work it out.'
  - '**Forgetting the quotes around text.** `console.log(Hello)` stops with `ReferenceError: Hello is not defined`, because a bare word is read as a name. Put every piece of text inside quotes.'
  - '**Losing a closing quote or bracket.** `console.log("Hi);` never finds the end of the string, so nothing runs at all. When no line prints, count your quotes and brackets in pairs.'
  - '**Writing `Console.log` or `console.Log`.** JavaScript cares about capital letters, so these are different names that don''t exist. Type `console.log` in lower case.'
  - '**Pasting curly quotes.** Text copied from a document or a chat can bring curly quotes like `“Hi”`, which JavaScript rejects with a syntax error. Retype the quotes in the editor.'
interview:
  - question: What's the difference between a string and a number in JavaScript?
    answer: >-
      A number is a value you can calculate with, and a string is text, written inside
      quotes. `42` is a number, so `42 * 2` gives `84`. `"42"` is a string of two
      characters that only looks like a number. The difference matters because operators
      behave differently: in JavaScript, `+` adds two numbers but joins two strings, so
      `"42" + "2"` gives `422`. It's also hard to spot, because `console.log` shows both
      without quotes. So when a value looks right in the output but misbehaves, I check
      where it came from. Text typed into a form, for example, arrives as a string even when
      someone types digits, and needs turning into a number before any maths.
  - question: What does `console.log` do, and when would you use it?
    answer: >-
      `console.log` writes a value to the console, the text window for a program's messages,
      so it's how you see what your code is doing. In a browser the console is part of the
      developer tools, and in Node it's the terminal. I use it most while developing: to
      check a value at a certain point, to confirm a line runs at all, or to follow the order
      things happen in. It isn't how a real app talks to its users, though. Visitors to a
      website never see the console, so user-facing messages go on the page instead. The
      trade-off is clutter: logs left in finished code make the console noisy and can leak
      data, so I remove them once they've done their job.
  - question: What's the difference between a syntax error and a runtime error?
    answer: >-
      A syntax error means the code isn't valid JavaScript, so none of it runs, while a
      runtime error happens partway through a program that started fine. A missing closing
      quote is a syntax error: the computer checks the whole file first, finds text that
      never ends and refuses to start. Using a name that doesn't exist, like
      `console.log(banana)`, is a runtime error. The lines above it have already run and
      printed their output, and the program stops at that line. Knowing the difference
      speeds up debugging. If nothing printed, I look for a typo in the structure: quotes,
      brackets, a misspelt keyword. If some output appeared, I go to the first line that
      didn't do its job and read the error's last line, which names the problem.
