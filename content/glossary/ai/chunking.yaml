term: chunking
short: Cutting long documents into smaller passages before indexing them for search.
explain: |
  You can't embed a 60-page manual as one piece. Its meaning blurs, and you'd paste all of
  it into every prompt. So you cut it into passages of a few hundred tokens and search
  those.

  Where you cut matters. Split mid-table or mid-step and each half loses its meaning. Cut
  along headings and keep a little overlap. Adding the section title to each chunk helps it
  stand on its own.
analogy: Cutting a cookbook into recipe cards. Cut between recipes and each card works alone; cut every 300 words and you get half a cake.
usage: The chunking splits every table in half, so retrieval returns rows with no headers.
