term: static generation
aka: [SSG, static rendering, static site generation, prerendering, static page]
short: Building a page's HTML once, at build time, and serving that same file to every visitor.
explain: |
  An about page is the same for everyone. Building it again for each visit wastes work. Build
  it once, store the file, and hand out copies.

  Next.js builds a page during `next build` when it reads nothing from the request. The
  file can sit on a CDN, so it is fast and cheap. The trap is staleness: it shows the data
  from build time until the next build or a revalidation. For `[slug]` pages,
  `generateStaticParams` lists which ones to build.
analogy: A printed leaflet. Printed once in bulk, handed to everyone, and wrong the day the prices change.
example:
  language: tsx
  code: |
    // app/blog/[slug]/page.tsx: builds one HTML file per post
    export async function generateStaticParams() {
      const posts = await getPosts();
      return posts.map((p) => ({ slug: p.slug }));
    }
usage: The docs pages use static generation, so they load from the CDN in a few milliseconds.
twin:
  term: server-side-rendering
  difference: Static generation builds the page once, before anyone asks. Server-side rendering builds it again for every request, so it can be personal and fresh.
related: [server-side-rendering, incremental-static-regeneration, cdn, dynamic-route]
level: 2
lessons: [next.rendering-spectrum, next.content-and-static-sites]
