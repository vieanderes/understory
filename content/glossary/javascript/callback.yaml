term: callback
aka:
  - callback function
short: A function you hand to other code, so that code can call it later.
explain: |
  Some work finishes later or happens many times: a click, a timer, a file read. Instead of
  waiting, you pass a function and say "run this when it happens".

  `addEventListener('click', onClick)` takes a callback. So does `array.map(fn)`. Callbacks
  nested inside callbacks are hard to follow, which is one reason promises exist.
analogy: Leaving your number with a busy shop. You don't stand at the counter; they ring you when it's ready.
example:
  language: js
  code: |
    button.addEventListener('click', () => {
      console.log('clicked');
    });
    [1, 2, 3].map((n) => n * 2);
usage: Pass a callback to the retry helper and it'll run it after each failed attempt.
related:
  - closure
  - decorator
