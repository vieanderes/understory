term: availability zone
aka: [AZ]
short: One of several separate data centres within a region, each with its own power, cooling and network.
explain: |
  Buildings fail: a power cut, a flood, a cut cable. If all your servers sit in one, one
  bad day takes everything down.

  A region contains several of these, close enough for fast links and far enough apart to
  fail on their own. Spread instances and database replicas across two or three. Traffic
  between them is fast but often billed, so chatty services can cost more than expected.
analogy: Keeping spare house keys at two neighbours' houses on different streets.
usage: All three instances are in the same availability zone, so one outage there takes us offline.
twin:
  term: cloud-region
  difference: An availability zone is one data centre within a region, for surviving a building's failure. A cloud region is the wider geographic area, chosen for distance to users.
related: [cloud-region, single-point-of-failure, replication, load-balancer]
level: 3
lessons: [cloud.where-code-runs, cloud.scaling-and-cost]
