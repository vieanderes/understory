id: judgment.workflows-on-paper
title: Drawing the workflow
objective: Draw a workflow as swimlanes for people, AI and system, then as sequence and state diagrams in Mermaid, failure paths included.
level: advanced
minutes: 10
concepts: [judgment.swimlanes, judgment.sequence-diagrams, judgment.state-diagrams, judgment.failure-paths]
prerequisites: [judgment.intents-and-priorities, judgment.what-breaks]
opening:
  text: >-
    You'll draw a workflow where an AI drafts and a person approves, from rough sketch to every
    state. A drawing finds the missing step in minutes, before
    it becomes a bug.

steps:
  - type: prose
    id: lanes-for-each-actor
    body: |-
      A podcast host uploads an episode. The system transcribes it, an AI drafts show notes,
      and the host approves them. A **swimlane** diagram gives each actor a lane. Arrows
      that cross lanes are handovers, where work waits. Mermaid draws diagrams from text:

      ```text
      flowchart LR
        subgraph Host
          upload[Upload episode]
          review{Approve notes?}
        end
        subgraph AI
          draft[Draft show notes]
        end
        subgraph System
          transcribe[Transcribe audio]
          publish[Publish episode]
        end
        upload --> transcribe --> draft --> review
        review -- yes --> publish
        review -- no --> draft
      ```

  - type: multiple-choice
    id: pick-where-work-waits
    concept: judgment.swimlanes
    difficulty: 1
    question: In that diagram, where is work most likely to sit and wait?
    choices:
      - text: Between the AI's draft and the host's approval
        correct: true
        feedback: >-
          Yes. A person must act there, and people are busy.
      - text: Between the upload and the transcription
        feedback: >-
          That hands over to the system, which picks the work up at once.
      - text: Inside the transcription step
        feedback: >-
          Transcribing takes minutes, but it runs by itself. Nobody has to notice it.
      - text: Between approval and publishing
        feedback: >-
          Once the host says yes, the system publishes straight away. No one else has to act.

  - type: prose
    id: messages-in-time-order
    body: |-
      A **sequence diagram** shows the same flow in time order. Each participant gets a line
      down the page, and each arrow is a message. `->>` is a call and `-->>` is a reply.
      Later, `alt` and `else` will show two possible outcomes.

      ```text
      sequenceDiagram
        participant H as Host
        participant S as System
        participant M as Model
        H->>S: upload episode
        S->>M: draft notes from transcript
        M-->>S: draft notes
        S->>H: notes ready for review
      ```

  - type: parsons
    id: arrange-the-sequence
    concept: judgment.sequence-diagrams
    difficulty: 2
    language: text
    prompt: Arrange the Mermaid source so the episode publishes only after the host approves. One block doesn't belong.
    blocks:
      - id: header
        code: |-
          sequenceDiagram
            participant H as Host
            participant S as System
            participant M as Model
        subgoal: Name the participants
      - id: upload
        code: '  H->>S: upload episode'
        subgoal: Get a draft
      - id: ask-model
        code: '  S->>M: draft notes from transcript'
      - id: model-replies
        code: '  M-->>S: draft notes'
      - id: notify-host
        code: '  S->>H: notes ready for review'
        subgoal: Ask the host
      - id: approved
        code: |2-
            alt approved
              H->>S: approve
              S->>S: publish episode
        subgoal: Handle both answers
      - id: changes
        code: |2-
            else changes needed
              H->>S: comments
              S->>M: redraft with comments
            end
    distractors:
      - id: publish-early
        code: '  S->>S: publish episode'
        feedback: >-
          Publishing on its own, outside the approved branch, skips the host. It belongs only
          after the approval.

  - type: ai-review
    id: review-skipped-approval
    concept: judgment.swimlanes
    difficulty: 3
    language: text
    request: Turn the episode workflow spec into a swimlane diagram.
    flawClass: logic
    code: |
      flowchart LR
        subgraph Host
          upload[Upload episode]
          review{Approve notes?}
        end
        subgraph AI
          draft[Draft show notes]
        end
        subgraph System
          transcribe[Transcribe audio]
          publish[Publish episode]
        end
        upload --> transcribe --> draft --> publish
        draft --> review
        review -- no --> draft
    prompt: >-
      An assistant drew this from the spec, and the team built from it. The first episode
      went out with notes the host never saw. Tap the line at fault.
    lines: [13]
    reasons:
      - text: The draft goes straight to publish, skipping the host
        correct: true
        feedback: >-
          Yes. The only way into publish must pass the host's yes.
      - text: Publish belongs in the AI lane
        feedback: >-
          The system publishes, so that lane is right. The arrow into it is the problem.
      - text: Rejected notes should go back to transcription
        feedback: >-
          Rejected notes need a redraft, not a new transcript. That arrow is fine.
      - text: The review should be a box, not a diamond
        feedback: >-
          A diamond marks a decision, and approving is one. The shape is right.
    fix: |
      upload --> transcribe --> draft --> review
      review -- yes --> publish
      review -- no --> draft
    verify:
      question: Which test proves publishing now waits for the host?
      choices:
        - text: Try to publish an episode with no approval
          correct: true
          feedback: >-
            Yes. It must be refused. That's exactly what the diagram lost.
        - text: Approve an episode and check it publishes
          feedback: >-
            That's the happy path, and it passed all along. It can't see a way around the
            host.
        - text: Check the diagram renders without errors
          feedback: >-
            It rendered fine. A valid drawing of the wrong flow is still the wrong flow.
        - text: Load test the publishing step
          feedback: >-
            Speed was never the problem. Publishing too early was, and load can't show that.

  - type: prose
    id: every-state-and-move
    body: |-
      A **state diagram** follows one thing, the episode, through every state it can be in.
      Each arrow is a move, labelled with its cause. `[*]` marks the start and the end.

      ```text
      stateDiagram-v2
        [*] --> Transcribing
        Transcribing --> Drafting : transcript ready
        Drafting --> AwaitingApproval : draft ready
        AwaitingApproval --> Published : approved
        AwaitingApproval --> Drafting : changes requested
        Published --> [*]
      ```

      Every state needs a way out, unless it's an end.

  - type: bug-hunt
    id: hunt-endless-retry
    concept: judgment.failure-paths
    difficulty: 3
    language: text
    code: |
      stateDiagram-v2
        [*] --> Transcribing
        Transcribing --> Drafting : transcript ready
        Transcribing --> TranscribeFailed : error
        TranscribeFailed --> Transcribing : retry, at most 3
        TranscribeFailed --> NeedsHelp : third failure
        Drafting --> AwaitingApproval : draft ready
        AwaitingApproval --> Publishing : approved
        AwaitingApproval --> Drafting : changes requested
        Publishing --> Published : feed updated
        Publishing --> PublishFailed : feed error
        PublishFailed --> PublishFailed : retry
        NeedsHelp --> [*]
        Published --> [*]
    prompt: >-
      An episode's feed update failed on Friday. On Monday it was still unpublished, and
      nobody knew. Tap the line at fault.
    lines: [12]
    reasons:
      - text: PublishFailed loops on itself with no way out
        correct: true
        feedback: >-
          Yes. No cap, no alert, no end. Episodes wait there for ever.
      - text: Retrying a failed publish is never safe
        feedback: >-
          Retrying is fine when publishing twice does no harm. The trouble is retrying for
          ever, in silence.
      - text: TranscribeFailed should go straight to the end
        feedback: >-
          A few retries first is sensible. That path ends in NeedsHelp, which does finish.
      - text: Publishing needs its own start marker
        feedback: >-
          One `[*]` start is enough. Every episode enters through Transcribing.
    fix: |
      PublishFailed --> Publishing : retry, at most 3
      PublishFailed --> NeedsHelp : third failure, alert the host

  - type: code-challenge
    id: write-check-workflow
    concept: judgment.state-diagrams
    difficulty: 4
    language: ts
    editable: '15'
    prompt: >-
      Write `checkWorkflow(machine)`. A machine has an `initial` state, a list of `terminal`
      states and `transitions`, each `{ from, to, event }`. Visit every state in order of first
      appearance: the initial state, each transition's `from` then `to`, then the terminals.


      Add `'unreachable: X'` if X can't be reached from the initial state. Add `'stuck: X'` if
      no terminal state can be reached from X. A retry loop is fine if it can still finish.
    hints:
      - A `Set` built from that list of names gives the order of first appearance with no repeats.
      - '"Can reach an end" is easier to compute backwards: start at the terminals and follow arrows in reverse.'
      - 'Write one helper, `walk(starts, next)`, that returns every state reached. Use it forwards from the initial state and backwards from the terminals.'

  - type: explain-back
    id: explain-why-draw-failures
    concept: judgment.failure-paths
    difficulty: 4
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer asks why you drew every failure path, when listeners only ever see the happy
      path. Explain why it's worth the time.
    rubric:
      - The happy path is the one everyone builds and tests, so bugs hide in the failure paths.
      - Drawing each failure forces a decision, such as retry, give up or ask a person, and shows stuck states.
      - Each failure arrow becomes a test, and often an alert, before a listener notices.
    modelAnswer: >-
      The happy path is the one everyone builds and tests, so it rarely breaks. Bugs hide in
      the other paths: a feed that won't update, a host who never answers. Drawing them forces
      a choice for each one: retry, give up, or ask a person. A state with no way out jumps
      off the page. Then every failure arrow becomes a test, and often an alert, before a
      listener notices.

recap:
  - Draw swimlanes for people, AI and system, and watch the arrows that cross lanes.
  - Write the same flow as a sequence diagram and a state diagram in Mermaid.
  - Give every failure a capped retry or an end, and turn each arrow into a test.

recall:
  - id: card-swimlane
    concept: judgment.swimlanes
    front: In a swimlane diagram, what do arrows that cross lanes show?
    back: >-
      Handovers between actors, such as the AI handing a draft to a person. That's where
      work waits or gets lost.
  - id: card-sequence
    concept: judgment.sequence-diagrams
    front: What does a sequence diagram show that a swimlane diagram doesn't?
    back: >-
      The messages between participants in time order: each call, each reply, and the
      alternative outcomes.
  - id: card-state
    concept: judgment.state-diagrams
    front: Which two problems does a state diagram expose?
    back: >-
      States that can never reach an end, so work gets stuck, and states that nothing ever
      leads to.
  - id: card-failure-path
    concept: judgment.failure-paths
    front: How should every failure path on a workflow end?
    back: >-
      In a capped retry that can still finish, or in an end state such as handing to a
      person, with an alert.

