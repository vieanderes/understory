term: cookie
aka:
  - HTTP cookie
short: A small named value a server asks the browser to store and send back on later requests.
explain: |
  HTTP forgets you between requests. So after you sign in, the server hands the browser a little note. The browser shows that note on every later request to the same site. Now the server recognises you.

  The server sets it with `Set-Cookie`, and attributes decide its safety. `HttpOnly` hides it from page scripts. `Secure` sends it only over HTTPS. `SameSite` limits when other sites can trigger it. A session id without `HttpOnly` is one XSS bug away
  from being stolen.
analogy: A cloakroom ticket. It means nothing on its own, but hand it over and they know which coat is yours.
example:
  language: http
  code: |
    HTTP/1.1 200 OK
    Set-Cookie: session=a81f9c; HttpOnly; Secure; SameSite=Lax; Path=/

    GET /account HTTP/1.1
    Cookie: session=a81f9c
usage: The session cookie isn't HttpOnly, so any injected script can read it.
