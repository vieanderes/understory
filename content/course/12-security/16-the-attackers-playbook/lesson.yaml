id: security.attacker-playbook
title: Attacking your own app, legally
objective: "See your app the way an attacker does, find a privilege escalation, stay inside the law, and report a flaw responsibly."
level: essential
minutes: 10
concepts: [security.authorised-testing, security.reconnaissance, security.privilege-escalation, security.responsible-disclosure]
prerequisites: [security.defence-in-depth, security.broken-auth]
opening:
  text: >-
    You'll test your own app the way an attacker would, and fix what you find. You'll also know
    where the law draws the line, and what to do about a flaw in someone else's site.

steps:
  - type: prose
    id: the-legal-line
    body: >-
      One rule comes before any technique. Testing a system for weaknesses is legal only on
      **your own systems**, or with **written permission** that sets a scope: which systems,
      which methods, when.


      Without that, the same keystrokes are a crime, whatever your intent. In the UK that's the
      Computer Misuse Act, in the US the CFAA. That's why every attack in this chapter runs
      against your own code, in a sandbox.

  - type: multiple-choice
    id: pick-allowed-test
    concept: security.authorised-testing
    difficulty: 1
    question: Which of these tests is allowed?
    choices:
      - text: Your own app, running on your laptop
        correct: true
        feedback: >-
          Right. It's yours. Test it as hard as you like.
      - text: A shop's login page you use every week
        feedback: >-
          Being a customer isn't permission. Without a written scope, testing it is an offence.
      - text: A friend's site, after they said "sure" in passing
        feedback: >-
          Kind, but not a scope. Get it in writing: which systems, which methods, when.

  - type: ai-review
    id: review-scan-without-scope
    concept: security.authorised-testing
    difficulty: 2
    language: yaml
    request: A supplier's site looks old. Plan how we could help them.
    flawClass: security
    code: |
      plan:
        - scan: supplier.example # with a vulnerability scanner
        - if_login_flaw: try /admin
        - email: findings to the supplier, as a favour
    prompt: >-
      An assistant suggested this plan. The aim really is to help, and the email sounds
      responsible. Tap the step where it becomes an offence.
    lines: [2]
    reasons:
      - text: Scanning a system nobody authorised you to test
        correct: true
        feedback: >-
          Yes. No permission, no scope. The scan itself is the offence, however kind the aim.
      - text: Trying the admin page
        feedback: >-
          That's worse, but the line was crossed earlier. The scan alone was enough.
      - text: Emailing them the findings
        feedback: >-
          Telling them is right. It doesn't undo a test you were never allowed to run.
    fix: |
      plan:
        - ask: supplier for written permission and a scope
        - test: only what the scope allows
        - report: through the channel the scope names

  - type: prose
    id: what-recon-is
    body: >-
      An attacker's first step is **reconnaissance**: learning what a system gives away about
      itself. Your own app is the right place to practise it.


      A classic leak is the error reply. When something breaks, some apps send the full error
      back: file paths, library names, a line of SQL. To a stranger, that's a map. Log those
      details on the server, and send the visitor a plain message.

  - type: bug-hunt
    id: find-leaky-error
    concept: security.reconnaissance
    difficulty: 2
    language: js
    code: |
      async function handle(request) {
        try {
          return await route(request);
        } catch (error) {
          return Response.json({ error: error.stack }, { status: 500 });
        }
      }
    prompt: This handler catches every error. Tap the line that tells a stranger too much.
    lines: [5]
    reasons:
      - text: It sends the stack trace to whoever asked
        correct: true
        feedback: >-
          Right. Paths and library names belong in your logs, not the reply.
      - text: '`try` should wrap only `route`'
        feedback: >-
          It does wrap only `route`. The trouble is what the `catch` sends back.
      - text: A `500` status reveals too much
        feedback: >-
          A `500` only says "our fault". The body is where the details leak.
    fix: |
      async function handle(request) {
        try {
          return await route(request);
        } catch (error) {
          console.error(error); // the details stay in your logs
          return Response.json({ error: "Something went wrong" }, { status: 500 });
        }
      }

  - type: prose
    id: mass-assignment
    body: >-
      **Privilege escalation** is turning a little access into more: a normal user becoming an
      admin, or reading someone else's data.


      A common way in is **mass assignment**. A profile form sends `name` and `bio`, and the
      server copies the whole request body into the user record. So an attacker adds
      `"role": "admin"` to the body, and the server copies that too.

  - type: code-challenge
    id: write-profile-update
    concept: security.privilege-escalation
    difficulty: 3
    language: ts
    prompt: >-
      Fix `applyProfileUpdate(user, body)`. It copies every field in `body`, so `role` gets
      through. Return a new user where only `name` and `bio` can change, and only when they're
      strings. Leave `user` itself unchanged.
    hints:
      - The spread `{ ...user, ...body }` is the hole. Start from `user` alone.
      - Copy `user` first, then set each allowed field you find in `body`.
      - '`if (typeof body.name === "string") updated.name = body.name;`'

  - type: prose
    id: responsible-disclosure
    body: >-
      Sometimes you notice a flaw in someone else's site by accident. That comes with a duty.
      **Responsible disclosure** means telling the owner privately. Then you give them time to
      fix it before anything goes public.


      Look for the channel first. Many sites publish a contact in `/.well-known/security.txt`.
      Some run a **bug bounty**: a programme with written rules that invites reports.

  - type: ai-review
    id: review-publish-first
    concept: security.responsible-disclosure
    difficulty: 3
    language: yaml
    request: I noticed a booking site shows other people's bookings. Plan what to do.
    flawClass: security
    code: |
      plan:
        - stop: note what you saw, look no further
        - post: the details publicly today
        - report: privately, via security.txt or bug bounty
    prompt: >-
      An assistant drafted this plan. Tap the step that puts the site's users at risk.
    lines: [3]
    reasons:
      - text: Going public before the owner can fix it
        correct: true
        feedback: >-
          Yes. It tells every attacker too. Report privately first, and give them time.
      - text: Stopping without looking further
        feedback: >-
          That's right. Digging further would be testing without permission.
      - text: Reporting through security.txt
        feedback: >-
          That's the proper channel. It belongs before anything public.
    fix: |
      plan:
        - stop: note what you saw, look no further
        - report: privately, via security.txt or bug bounty
        - publish: only on a date agreed with the owner

  - type: explain-back
    id: explain-authorisation-line
    concept: security.authorised-testing
    difficulty: 3
    prompt: >-
      A friend wants to practise security testing on a popular website "to learn, not to
      harm". What would you tell them, and where could they practise instead?
    rubric:
      - Testing without written permission is a crime, whatever the intent.
      - Permission means a written scope, such as a bug bounty's rules.
      - Practise on your own apps, sandboxes or sites built for practice.
    modelAnswer: >-
      Intent doesn't matter. Testing a site without written permission is an offence. In the UK
      that's the Computer Misuse Act, and in the US the CFAA. If the site runs a bug bounty,
      its rules are that permission, so read them and stay inside the scope. Otherwise, practise
      on your own apps, in sandboxes like this course's, or on sites built for practice.

recap:
  - Test only your own systems, or with written permission and a scope.
  - Keep error details in your logs, and copy only allowed fields from a request.
  - Report a flaw you find privately, through the owner's channel, before anything goes public.

recall:
  - id: card-authorisation
    concept: security.authorised-testing
    front: What makes security testing lawful?
    back: >-
      It's your own system, or you have written permission with a scope. Without that, the
      same test is an offence.
  - id: card-recon-leak
    concept: security.reconnaissance
    front: What should a `500` reply contain, and where do the error details go?
    back: >-
      A plain message such as "Something went wrong". The stack trace and details go to the
      server's logs.
  - id: card-mass-assignment
    concept: security.privilege-escalation
    front: What is mass assignment, and how do you prevent it?
    back: >-
      Copying the whole request body into a record, so extra fields like `role` get saved. Copy
      only the fields you allow.
  - id: card-disclosure
    concept: security.responsible-disclosure
    front: You find a flaw in someone else's site by accident. What's the first thing to do?
    back: >-
      Stop, and report it privately through their security.txt contact or bug bounty, with time
      to fix it before anything is public.

