id: aisys.llmops
title: Prompts and evals as code
objective: Version prompts with the code, gate changes in CI with evals, trace every model call, and monitor quality in production.
level: advanced
minutes: 10
concepts: [aisys.prompt-versioning, aisys.eval-gates-in-ci, aisys.llm-tracing, aisys.quality-monitoring]
prerequisites: [aisys.evals-in-depth, cloud.ci-cd, cloud.observability]
opening:
  text: >-
    You'll treat a prompt like any other code: reviewed, tested, traced and watched. Then a
    bad answer from last Tuesday becomes a bug you can find, not a mystery.

steps:
  - type: prose
    id: prompts-as-code
    body: |-
      Keep prompts in the repository, next to the code that calls them. Pin the model and
      its settings in the same place. A prompt change is then a pull request, reviewed and
      tested like any other.

      Give each prompt a name and a **version**, like `support-answer` `v7`. Record both on
      every response, so any answer points back to the exact text that produced it.

  - type: multiple-choice
    id: pick-reproduce
    concept: aisys.prompt-versioning
    difficulty: 1
    question: A user reports a bad answer from Tuesday. What do you need to reproduce it?
    choices:
      - text: The prompt version, model and settings used
        correct: true
        feedback: >-
          Yes. Those three decide the answer, so each response must record them.
      - text: The prompt file as it is today
        feedback: >-
          It may have changed since Tuesday. You need the version that actually ran.
      - text: Tuesday's server error log
        feedback: >-
          A bad answer usually isn't an error. Nothing in that log says which prompt ran.

  - type: ai-review
    id: review-prompt-registry
    concept: aisys.prompt-versioning
    difficulty: 2
    language: python
    request: Load the support prompt from Anthropic instead of hard-coding it.
    flawClass: hallucinated-api
    code: |
      import anthropic

      client = anthropic.Anthropic()

      def answer(question):
          prompt = client.prompts.get("support-answer", version="latest")
          return client.messages.create(
              model="claude-opus-5-5", max_tokens=1024, system=prompt.text,
              messages=[{"role": "user", "content": question}],
          )
    prompt: >-
      An assistant wrote this. The unit tests mocked the whole client, so they passed. The
      first real request crashes with an `AttributeError`. Tap the line at fault.
    lines: [6]
    reasons:
      - text: The SDK has no prompts API at all
        correct: true
        feedback: >-
          Right. The mock hid an invented method. Keep the prompt in the repo instead.
      - text: '`max_tokens` is too low for support answers'
        feedback: >-
          1,024 tokens is plenty for a support reply, and it wouldn't crash anything.
      - text: '`system` can''t take a string'
        feedback: >-
          `system` accepts a plain string. The crash happens two lines earlier.
    fix: |
      from prompts import SUPPORT_ANSWER   # {"name": ..., "version": "v7", "text": ...}

      def answer(question):
          return client.messages.create(
              model="claude-opus-5-5", max_tokens=1024, system=SUPPORT_ANSWER["text"],
              messages=[{"role": "user", "content": question}],
          )

  - type: prose
    id: eval-gates
    body: |-
      Now wire evals into CI. A pull request that touches a prompt, a model setting or the
      retrieval code runs a small eval suite. Each slice is compared with the main branch.

      A drop below the threshold fails the build, and the score changes appear on the pull
      request. The full suite runs nightly, where slow and costly items can wait.

  - type: fill-blank
    id: fill-eval-trigger
    concept: aisys.eval-gates-in-ci
    difficulty: 2
    prompt: Run the eval job only for pull requests that change prompts or retrieval code.
    language: yaml
    template: |
      on:
        {{1}}:
          {{2}}:
            - 'prompts/**'
            - 'src/retrieval/**'
      jobs:
        evals:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v7
            - run: uv run pytest evals/smoke
    blanks:
      - key: '1'
        answer: pull_request
      - key: '2'
        answer: paths
    bank: [pull_request, paths, push, schedule, files, branches]

  - type: prose
    id: tracing
    body: >-
      A **trace** follows one request through your system, and each step inside it is a
      **span**, as in chapter 16. Give every model call a span. It records the prompt name
      and version, the model, tokens in and out, cost, latency and stop reason.


      OpenTelemetry has draft names for these fields. Leave message text out by default. It
      carries personal data.

  - type: code-challenge
    id: write-find-regression
    concept: aisys.llm-tracing
    difficulty: 3
    language: python
    starter: regression.starter.py
    solution: regression.solution.py
    tests: regression.tests.py
    prompt: >-
      Quality dropped last week. Write `find_regression(traces, drop=0.1)`. Each trace is
      like `{"prompt_version": "v7", "score": 0.9}`, in the order they happened, and versions
      ship one after another.


      Average the scores per version. Return the first version whose average is more than
      `drop` below the version before it, or `None`.
    hints:
      - Group the scores by version in a dict of lists. A dict keeps the order keys arrived in.
      - Turn the groups into a list of `(version, average)` pairs.
      - '`zip(means, means[1:])` walks each version next to the one before it.'

  - type: multiple-choice
    id: pick-quality-signal
    concept: aisys.quality-monitoring
    difficulty: 2
    question: The provider updates a model, and answers quietly get worse. Which dashboard shows it first?
    choices:
      - text: Online eval score and retries, per slice
        correct: true
        feedback: >-
          Yes. Quality signals move when answers get worse. System metrics don't.
      - text: p95 latency
        feedback: >-
          A worse answer can arrive as fast as a good one. Latency stays green.
      - text: The 5xx error rate
        feedback: >-
          Every call still returns 200. Bad text isn't an HTTP error.
      - text: Tokens per request
        feedback: >-
          Token counts may not change at all. They measure size, not quality.

  - type: parsons
    id: arrange-rollout
    concept: aisys.quality-monitoring
    difficulty: 3
    language: yaml
    prompt: Prompt `v8` passed the CI gate. Arrange its rollout, safest stage first. One stage doesn't belong.
    blocks:
      - id: shadow
        code: '- stage: shadow    # v8 answers copies of live requests; users still see v7'
        subgoal: Score it on real traffic, unseen
      - id: canary
        code: '- stage: canary    # 5% of users get v8; roll back if its online score drops'
        subgoal: Expose a few people
      - id: ab-test
        code: '- stage: ab-test   # 50/50 split; compare resolved tickets per slice'
        subgoal: Measure the outcome
      - id: full
        code: '- stage: full      # everyone on v8; v7 stays one flag away'
        subgoal: Ship it, reversibly
    distractors:
      - id: big-bang
        code: '- stage: full      # everyone on v8 as soon as CI is green'
        feedback: >-
          CI tests the questions you thought of. Live traffic brings the rest, so expose a few users first.

  - type: explain-back
    id: explain-find-regression
    concept: aisys.eval-gates-in-ci
    difficulty: 3
    prompt: >-
      Quality scores dropped on Thursday, and nobody knows why. Walk through how versioned
      prompts, traces and CI evals help you find and stop it.
    rubric:
      - Every trace records the prompt version and model, so scores can be grouped by what produced them.
      - The version where the drop starts points to one pull request, whose diff shows the change, and it can be reverted.
      - An eval gate per slice in CI would have blocked that change before it shipped.
    modelAnswer: >-
      Each trace carries the prompt version and the model, so I'd split Thursday's scores by
      version. If the drop starts where `v8` replaced `v7`, that pull request is the
      suspect. Its diff shows the change, and I can revert it like code. Then I'd add the
      failing cases to the eval set, so the CI gate blocks the next change like it.

recap:
  - Keep prompts and model settings in the repo, versioned and reviewed.
  - Gate prompt changes in CI with evals, per slice.
  - Trace each call with its prompt version, find regressions by version, and watch quality like uptime.
recall:
  - id: card-record-version
    concept: aisys.prompt-versioning
    front: What should every model response record so you can reproduce it?
    back: >-
      The prompt name and version, the model, and its settings.
  - id: card-ci-trigger
    concept: aisys.eval-gates-in-ci
    front: Which pull requests should run the eval suite?
    back: >-
      Any that change a prompt, a model setting or retrieval code, each compared with the
      main branch per slice.
  - id: card-span-fields
    concept: aisys.llm-tracing
    front: What should the span for one model call record, and what should it leave out?
    back: >-
      The prompt name and version, the model, tokens, cost, latency and stop reason. Leave
      the message text out by default, since it carries personal data.
  - id: card-quality-signals
    concept: aisys.quality-monitoring
    front: Why don't latency and error rate catch a drop in answer quality?
    back: >-
      Worse answers arrive as fast as good ones and still return 200. Only eval scores and user
      signals move.
  - id: card-staged-rollout
    concept: aisys.quality-monitoring
    front: In what order does a new prompt version reach users, and why?
    back: >-
      Shadow first, unseen, then a small canary share, then an A/B test on the outcome, then
      everyone, with the old version one flag away. Each stage risks fewer users than the next.

references:
  - kind: spec
    title: OpenTelemetry GenAI Semantic Conventions
    authors: OpenTelemetry authors
    venue: GitHub, open-telemetry/semantic-conventions-genai
    url: https://github.com/open-telemetry/semantic-conventions-genai
    note: Span names and attributes for model calls, including prompt version and token usage.
    primary: true
    verified: true
  - kind: docs
    title: Prompt caching
    authors: Anthropic
    venue: Claude Platform Docs
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    note: The usage fields for cached input that a trace should record.
    verified: true
  - kind: essay
    title: Your AI Product Needs Evals
    authors: Hamel Husain
    year: 2024
    venue: hamel.dev
    url: https://hamel.dev/blog/posts/evals/
    note: Tests, traces and review loops for model features.
    primary: true
    verified: true

deepDive: >-
  No model was called. The regression finder ran in Python 3.12 on made-up traces.


  **OpenTelemetry for model calls.** The GenAI semantic conventions name span attributes
  such as `gen_ai.request.model` and `gen_ai.usage.input_tokens`. They live in their own
  repository and are still marked as in development, so expect renames. Map your fields
  through one function, so a rename touches one file.


  **Cached tokens.** Anthropic reports cached input apart from `input_tokens`, in
  `cache_read_input_tokens` and `cache_creation_input_tokens`. The convention's input total
  includes them. Record the split too, because cache reads are billed at a fraction of
  fresh input.


  **Cheap gates.** Keep the pull request suite small enough to run every time: a smoke set
  of a few dozen items catches most breaks. Mark items that must never regress, such as a
  refusal on a dangerous request, and fail on any one of them regardless of the average.
