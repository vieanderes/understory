term: log injection
aka: [log forging, newline forging]
short: Putting crafted text into a field that gets logged, so it forges or corrupts log lines.
explain: |
  If a username is written straight into a plain-text log, an attacker can choose a name
  that contains a newline. The next line then looks like a genuine entry, such as a
  successful admin login that never happened.

  Structured logs stop it. Write one JSON object per line, and the encoder escapes control
  characters inside each string. Keep user input in its own field, never glued into the
  message, and cap its length.
analogy: Writing a fake entry into a visitors' book by squeezing an extra line under your own name.
example:
  language: ts
  code: |
    // flawed: a newline in username forges a second line
    log(`login failed for ${username}`);

    // fixed: input stays inside one escaped field
    console.log(JSON.stringify({ event: 'login_failed', username }));
usage: The audit log writes raw usernames into plain text; that's open to log injection, so switch to JSON lines.
related: [structured-logging, xss, sql-injection]
level: 3
lessons: [security.detection-and-logging]
