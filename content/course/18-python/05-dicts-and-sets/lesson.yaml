deepDive: >-
  A dict is a hash table. Each key's `__hash__` picks a slot, and `__eq__` settles clashes,
  so lookup, insert and delete are constant time on average. Since Python 3.7 the language
  guarantees that dicts keep insertion order. Sets use the same machinery without values,
  and they don't promise any order, so never rely on how a set prints.


  Equal values must have equal hashes, which is why `1`, `1.0` and `True` are the same key.
  `Counter` adds `most_common(n)` and arithmetic between counters. `dict | other` merges two
  dicts into a new one, and `setdefault` is the older, clumsier cousin of `defaultdict`.
  `frozenset` is the unchangeable set, and it can be a key.
