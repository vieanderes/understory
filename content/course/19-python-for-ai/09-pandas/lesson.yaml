deepDive: >-
  **Checked with pandas 2.2.3** on CPython 3.12, the versions the code challenge runs in
  your browser. The first run downloads pandas and NumPy, about 10 MB, and takes a few
  seconds to start. Every sample runs as printed with `uv add pandas`.


  **pandas 3** changes two defaults. Text columns load as a dedicated string type, and
  copy-on-write is always on, so changing a filtered table never changes the original.


  **Averages hide slices.** A version can win overall and still fail every refund. Always
  read the per-category table before the overall number. Chapter 20's evals lesson turns
  that into a gate that blocks a release.


  **Notebooks** suit exploring. Move code you rely on into a module, and test it there.
