id: design.contrast-colour-and-motion
title: Contrast, colour and motion
objective: Check text against the WCAG contrast rules, never let colour carry a message alone, and calm motion for people who ask.
level: essential
minutes: 10
concepts: [design.wcag, design.contrast, design.colour-alone, design.reduced-motion]
prerequisites: [design.keyboard-and-focus, css.transitions]
opening:
  text: >-
    You'll fix the pale grey text, the red-only warning and the swooping panel that fail real
    people every day. And you'll know the rulebook that says how good is good enough.

steps:
  - type: prose
    id: what-wcag-is
    body: >-
      How good is good enough? **WCAG**, the Web Content Accessibility Guidelines, answers
      that. It's a list of testable rules from the W3C, the group that writes web standards.


      Each rule has a level: A, AA or AAA. Level AA means every A rule and every AA rule.
      It's the level most laws and contracts ask for.

  - type: multiple-choice
    id: pick-what-aa-means
    concept: design.wcag
    difficulty: 1
    question: A contract asks for WCAG 2.2 level AA. Which rules must the site pass?
    choices:
      - text: Every A rule and every AA rule
        correct: true
        feedback: >-
          Right. Each level includes the ones below it.
      - text: Only the AA rules
        feedback: >-
          The levels stack. AA without A would skip the most basic rules.
      - text: Every rule, AAA included
        feedback: >-
          AAA is a stretch goal. Contracts rarely ask for it across a whole site.

  - type: prose
    id: what-contrast-is
    body: >-
      One AA rule is about **contrast**: how far apart text and background are in lightness.
      It's written as a ratio, from 1 to 1 (none) to 21 to 1 (black on white).


      Body text needs at least 4.5 to 1. Large text, and the edges of controls, need 3 to 1.
      A checker such as axe measures it for you, and so does your browser's colour picker.

  - type: predict-output
    id: predict-grey-fails
    concept: design.contrast
    difficulty: 2
    language: css
    code: |
      .hint { color: #9ca3af; background: #ffffff; font-size: 16px; }

      /* axe: color-contrast, ratio 2.54 */
    question: This grey hint text is 16 px. Does it pass level AA?
    choices:
      - text: No, it needs 4.5 to 1
        correct: true
        feedback: >-
          Right. 2.54 is far short. Many people can't read it in sunlight.
      - text: Yes, it needs 2 to 1
        feedback: >-
          There's no 2 to 1 rule. Body text needs 4.5, and even large text needs 3.
      - text: Yes, hint text doesn't count
        feedback: >-
          Most people hope so. But a hint is text someone needs, so the rule covers it.

  - type: playground
    id: darken-the-hint
    concept: design.contrast
    difficulty: 2
    prompt: >-
      The hint under the password box fails. The CSS comment lists three greys the team
      measured with axe. Give `.hint` the one that passes for body text.
    html: |
      <label for="password">Password</label>
      <input id="password" type="password">
      <p class="hint">At least 12 characters</p>
    css: |
      /* Greys on white, measured with axe:
         #9ca3af  2.54 to 1
         #8a8a8a  3.45 to 1
         #6b7280  4.83 to 1 */
      body { font-family: sans-serif; }
      input { display: block; margin-top: 8px; }
      .hint { color: #9ca3af; font-size: 16px; }
    editable: [css]
    checks:
      - label: The hint passes 4.5 to 1
        selector: .hint
        style: { property: color, value: 'rgb(107, 114, 128)' }
    solution:
      css: |
        /* Greys on white, measured with axe:
           #9ca3af  2.54 to 1
           #8a8a8a  3.45 to 1
           #6b7280  4.83 to 1 */
        body { font-family: sans-serif; }
        input { display: block; margin-top: 8px; }
        .hint { color: #6b7280; font-size: 16px; }
    hints:
      - Body text needs at least 4.5 to 1.
      - Only one grey in the comment reaches that.
      - 'Write `.hint { color: #6b7280; font-size: 16px; }`.'

  - type: prose
    id: colour-alone
    body: >-
      About one man in twelve can't tell some colours apart, most often red from green. So
      colour can back up a message, but never carry it alone.


      An error needs words, not only a red border. A late order needs the word "Late", not
      only a red dot. A link in a paragraph needs an underline, not only blue.

  - type: ai-review
    id: review-dot-only
    concept: design.colour-alone
    difficulty: 2
    language: tsx
    request: Show whether each order is late in the orders table.
    flawClass: edge-case
    code: |
      function OrderStatus({ late }: { late: boolean }) {
        return (
          <span className={late ? "dot red" : "dot green"} />
        );
      }
    prompt: >-
      An assistant wrote this. The dots look clear to the team, and the test checks the
      class. A colour-blind manager can't tell late orders from the rest. Tap the line at
      fault.
    lines: [3]
    reasons:
      - text: Only colour says whether it's late
        correct: true
        feedback: >-
          Yes. Add the words "Late" and "On time", and the dot becomes a bonus.
      - text: Red and green need more contrast
        feedback: >-
          Contrast helps, but red and green can match in lightness. Words work for everyone.
      - text: The span needs `role="status"`
        feedback: >-
          A role wouldn't give it any words. There's still nothing to read or announce.
    fix: |
      function OrderStatus({ late }: { late: boolean }) {
        return (
          <span className={late ? "dot red" : "dot green"}>{late ? "Late" : "On time"}</span>
        );
      }

  - type: prose
    id: reduced-motion
    body: |-
      You met transitions in the CSS chapter. For some people, movement on screen brings on
      dizziness or nausea. Phones and computers have a Reduce motion setting, and CSS can
      read it:

      ```css
      @media (prefers-reduced-motion: reduce) {
        .panel { transition: none; }
      }
      ```

      The query changes only the rules inside it. Remove the movement, or swap it for a fade.

  - type: playground
    id: calm-the-panel
    concept: design.reduced-motion
    difficulty: 3
    prompt: >-
      Press Filters: the panel swoops in. Add a `prefers-reduced-motion: reduce` query that
      sets `transition: none` on `.panel`. In Chrome's tools, Rendering can pretend the
      setting is on.
    html: |
      <style>
        body { font-family: sans-serif; }
        .panel { padding: 16px; background: #e0f2f1; transform: translateX(-110%); transition: transform 400ms ease-out; }
        .panel.open { transform: none; }
      </style>
      <button class="filters">Filters</button>
      <div class="panel">Price, size and colour</div>
    js: |
      const panel = document.querySelector(".panel");
      const button = document.querySelector(".filters");
      button.addEventListener("click", () => panel.classList.toggle("open"));
    editable: [html]
    checks:
      - label: The page asks for reduced motion
        selector: style
        text: 'prefers-reduced-motion: reduce'
      - label: The panel's transition is switched off
        selector: style
        text: '.panel { transition: none; }'
    solution:
      html: |
        <style>
          body { font-family: sans-serif; }
          .panel { padding: 16px; background: #e0f2f1; transform: translateX(-110%); transition: transform 400ms ease-out; }
          .panel.open { transform: none; }
          @media (prefers-reduced-motion: reduce) {
            .panel { transition: none; }
          }
        </style>
        <button class="filters">Filters</button>
        <div class="panel">Price, size and colour</div>
    hints:
      - The new rule goes at the end of the `style` element.
      - A media query wraps an ordinary rule in `@media (...) { }`.
      - Copy the query from the step before, inside `style`.

  - type: explain-back
    id: explain-red-border
    concept: design.colour-alone
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A form marks a wrong postcode with a red border and nothing else. Who misses the
      error, and what would you add?
    rubric:
      - Colour-blind people may not see the red, and a screen reader doesn't announce a border.
      - Colour can back up a message but must not carry it alone.
      - Add a written message by the field, and maybe an icon, so everyone gets it.
    modelAnswer: >-
      Anyone who can't tell red from its neighbours misses it. So does everyone using a
      screen reader, because a border isn't announced. Keep the red border as a bonus, but
      put the message in words next to the field: "Enter a postcode, like SW1A 1AA". Now it
      works for every eye and every ear.

recap:
  - Read WCAG level AA as the usual target, with every A and AA rule.
  - Check text for 4.5 to 1 contrast, and fix it by changing the colour.
  - Put every message in words, and switch motion off when people ask.

recall:
  - id: card-level-aa
    concept: design.wcag
    front: What is WCAG, and what does level AA include?
    back: >-
      The Web Content Accessibility Guidelines, a W3C list of testable rules. AA means every A
      rule and every AA rule.
  - id: card-contrast-lines
    concept: design.contrast
    front: What contrast ratios does level AA ask for?
    back: >-
      4.5 to 1 for body text. 3 to 1 for large text and for the edges of controls.
  - id: card-colour-alone
    concept: design.colour-alone
    front: How should a table show that an order is late?
    back: >-
      In words, such as "Late", with colour as a bonus. Colour alone fails colour-blind people
      and screen readers.
  - id: card-reduced-motion
    concept: design.reduced-motion
    front: 'What does `prefers-reduced-motion: reduce` report, and how does a page answer?'
    back: >-
      That someone asked for less movement. The page removes the motion, or swaps it for a
      fade.

