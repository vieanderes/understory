term: memory leak
aka: [ leak, leaking memory ]
short: Memory a program keeps after it stops needing it, so usage grows until things slow or crash.
explain: |
  JavaScript frees memory nobody can reach any more. A leak is something you forgot that still
  reaches it. A listener never removed, a timer never cleared, a cache that only grows.

  A page or server gets slower the longer it runs, then crashes. To find one, take a heap
  snapshot, repeat the action a few times, take another, and compare what grew. In React, the
  usual cure is a cleanup function in the effect.
analogy: A bath with the tap dripping and the plug in. Fine for an hour; flooded by morning.
example:
  language: ts
  code: |
    useEffect(() => {
      const onResize = () => setWidth(window.innerWidth);
      window.addEventListener('resize', onResize);
      return () => window.removeEventListener('resize', onResize); // no leak
    }, []);
usage: Memory climbs by 2 MB per page change; it's a memory leak in the chart's resize listener.
related: [ effect, profiling, cache, closure ]
level: 2
lessons: [ perf.memory-leaks ]
