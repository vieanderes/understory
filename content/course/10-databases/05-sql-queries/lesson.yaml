id: db.sql-queries
title: Joining tables
objective: "Combine tables with `JOIN` and `LEFT JOIN`, and spot a join that repeats rows."
level: essential
minutes: 9
concepts: [db.joins, db.join-fanout]
prerequisites: [db.relational-model]
opening:
  text: >-
    You'll put two tables back together in one query, as every "order and its customer" page does.
    You'll also catch the join that quietly sends someone two texts.

steps:
  - type: prose
    id: what-a-join-is
    body: >-
      A vet's clinic keeps `owners` and `pets`, and each pet has an `owner_id`. A **join** pairs
      each pet with the owner whose `id` matches:


      ```sql

      SELECT pets.name AS pet, owners.name AS owner

      FROM pets JOIN owners ON owners.id = pets.owner_id;

      ```


      `ON` says which rows belong together. Both tables have a `name`, so `pets.name` says
      whose. `AS` gives a result column a clearer name.

  - type: sql
    id: pets-with-owners
    concept: db.joins
    difficulty: 1
    prompt: >-
      The waiting-room screen shows each pet with its owner. Join the tables, and name the
      columns `pet` and `owner`.
    setup: &clinic |
      CREATE TABLE owners (id integer PRIMARY KEY, name text NOT NULL, phone text NOT NULL);
      CREATE TABLE pets (
        id integer PRIMARY KEY,
        owner_id integer NOT NULL REFERENCES owners(id),
        name text NOT NULL,
        species text NOT NULL
      );
      INSERT INTO owners VALUES
        (1, 'Ana', '07700 900101'), (2, 'Ben', '07700 900102'),
        (3, 'Chloe', '07700 900103'), (4, 'Dev', '07700 900104');
      INSERT INTO pets VALUES
        (1, 1, 'Biscuit', 'dog'), (2, 1, 'Miso', 'cat'), (3, 1, 'Pepper', 'cat'),
        (4, 2, 'Rex', 'dog'), (5, 3, 'Luna', 'cat');
    starter: |
      SELECT pets.name AS pet
      FROM pets;
    solution: |
      SELECT pets.name AS pet, owners.name AS owner
      FROM pets JOIN owners ON owners.id = pets.owner_id;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Add `JOIN owners ON ...` after `FROM pets`.
      - The match is `owners.id = pets.owner_id`. Then add `owners.name AS owner` to the columns.

  - type: prose
    id: left-join
    body: >-
      Dev has no pets yet. In a plain `JOIN`, a row with no match vanishes, so Dev never
      appears.


      A **left join** keeps every row of the table on the left, match or not. Where nothing
      matches, the right table's columns are NULL:


      ```sql

      FROM owners LEFT JOIN pets ON pets.owner_id = owners.id

      ```


      Use it whenever "everyone, and their things if any" is the question.

  - type: sql
    id: every-owner
    concept: db.joins
    difficulty: 2
    prompt: >-
      The yearly reminder goes to every owner, with their pets' names if they have any. Dev is
      missing from this query. Fix it.
    setup: *clinic
    starter: |
      SELECT owners.name AS owner, pets.name AS pet
      FROM owners JOIN pets ON pets.owner_id = owners.id;
    solution: |
      SELECT owners.name AS owner, pets.name AS pet
      FROM owners LEFT JOIN pets ON pets.owner_id = owners.id;
    checks:
      ordered: false
    showSchema: true
    hints:
      - A plain join drops owners with no match.
      - One word goes before `JOIN`.

  - type: prose
    id: joins-repeat-rows
    body: >-
      A join gives one row per matching pair. Ana has three pets, so she appears three times.
      That's what you want in a list of pets. It's a bug when you meant a list of owners.


      `SELECT DISTINCT` removes rows that are exact repeats:


      ```sql

      SELECT DISTINCT owners.name FROM owners JOIN pets ON pets.owner_id = owners.id;

      ```


      Each owner with a pet now appears once.

  - type: sql
    id: cat-owners-once
    concept: db.join-fanout
    difficulty: 2
    prompt: >-
      A cat food offer goes by text to every owner with a cat. Run it: Ana would get two texts.
      Make each owner appear once.
    setup: *clinic
    starter: |
      SELECT owners.name, owners.phone
      FROM owners JOIN pets ON pets.owner_id = owners.id
      WHERE pets.species = 'cat';
    solution: |
      SELECT DISTINCT owners.name, owners.phone
      FROM owners JOIN pets ON pets.owner_id = owners.id
      WHERE pets.species = 'cat';
    checks:
      ordered: false
    showSchema: true
    hints:
      - Ana has two cats, so the join pairs her with each.
      - One word after `SELECT` removes repeated rows.

  - type: ai-review
    id: review-left-join-where
    concept: db.joins
    difficulty: 3
    language: sql
    request: List every owner with their dogs. Owners without a dog should still appear.
    flawClass: logic
    code: |
      SELECT owners.name AS owner, pets.name AS dog
      FROM owners
      LEFT JOIN pets ON pets.owner_id = owners.id
      WHERE pets.species = 'dog';
    prompt: >-
      An assistant wrote this. It returns Ana and Ben with their dogs, and nobody else. Chloe
      and Dev are missing. Tap the line at fault.
    lines: [4]
    reasons:
      - text: The `WHERE` drops rows whose pet columns are NULL
        correct: true
        feedback: >-
          Right. The dog test belongs in the `ON`, so unmatched owners survive.
      - text: The join should be a plain `JOIN`
        feedback: >-
          A plain join drops owners with no match too. That's the opposite of the request.
      - text: '`pets.name AS dog` hides the other pets'
        feedback: >-
          Renaming a column changes its heading, not which rows come back.
    fix: |
      SELECT owners.name AS owner, pets.name AS dog
      FROM owners
      LEFT JOIN pets ON pets.owner_id = owners.id AND pets.species = 'dog'
      ORDER BY owner;

  - type: explain-back
    id: explain-join-fanout
    concept: db.join-fanout
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A report joins `customers` to `orders` to list customers, and some names appear many
      times. Why, and how would you list each customer once?
    rubric:
      - A join returns one row for each matching pair of rows.
      - A customer with several orders matches several times, so they repeat.
      - '`SELECT DISTINCT` on the customer columns, or not joining orders at all, lists each once.'
    modelAnswer: >-
      A join makes one row per matching pair. A customer with four orders matches four order
      rows, so they appear four times. If the report only needs customers, `SELECT DISTINCT`
      on their columns collapses the repeats. Better still, drop the join to orders when the
      columns from orders aren't used.

recap:
  - Pair rows from two tables with `JOIN ... ON`, naming columns with `AS`.
  - Keep rows with no match using `LEFT JOIN`, and filter the right table in `ON`.
  - Expect a join to repeat rows, and use `DISTINCT` when you want each once.

recall:
  - id: card-join-on
    concept: db.joins
    front: Write the join that pairs each `pets` row with its owner in `owners`.
    back: "`FROM pets JOIN owners ON owners.id = pets.owner_id`"
  - id: card-left-join
    concept: db.joins
    front: What does a left join return for a left row with no match?
    back: The row once, with every column from the right table set to NULL.
  - id: card-where-after-left-join
    concept: db.joins
    front: Why does `WHERE pets.species = 'dog'` after a left join lose owners without dogs?
    back: >-
      Their pet columns are NULL, so the condition isn't true and `WHERE` drops them. Put the
      test in `ON`.
  - id: card-fanout
    concept: db.join-fanout
    front: A customer has three orders. How many rows do they get in a customers-to-orders join?
    back: Three, one per matching order.

references:
