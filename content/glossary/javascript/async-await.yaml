term: async/await
aka:
  - async function
  - await
short: Syntax that pauses a function until a pending result settles, so waiting code reads top to bottom.
explain: |
  Long chains of `.then` get hard to read. Mark a function `async` and you can put `await`
  in front of a promise. The function pauses there; the rest of the page carries on.

  Two traps. An `async` function always returns a promise, so its caller must wait too. And
  `await` inside a loop runs requests one after another. For independent requests, start
  them all and `await Promise.all(...)`.
analogy: A bookmark in a recipe while the oven heats. You do other things, then come back to the exact line.
example:
  language: js
  code: |
    async function loadBooks() {
      try {
        const res = await fetch('/api/books');
        return await res.json();
      } catch (error) {
        console.error(error);
        return [];
      }
    }
usage: These two requests don't depend on each other, so don't await them one by one; use Promise.all.
twin:
  term: promise
  difference: '`async`/`await` is syntax for waiting. A promise is the value being waited on, and an `async` function hands one back even when it looks like it returns a plain value.'
related:
  - promise
  - event-loop
level: 1
lessons:
