term: relational database
aka: [RDBMS, relational model, SQL database]
short: A store that keeps data in tables of typed columns, linked by keys, and answers questions in SQL.
explain: |
  A plain file fails as soon as an app gets real. Two writers overwrite each other and a crash leaves half a write on disk. Finding one row
  means reading all of them. A database
  server fixes all three with transactions, a log and indexes.

  This kind stores rows in tables and links them with keys. You describe the rows you want,
  and its planner decides how to fetch them. Every column has a type, which is a rule
  enforced on every write. It's the right default for anything with users, orders or
  bookings. Document and key-value stores fit narrower shapes.
analogy: A set of well-kept spreadsheets with strict columns, where each sheet can point to rows on another by number.
example:
  language: sql
  code: |
    SELECT title, due_on
    FROM tasks
    WHERE owner_id = 42 AND done = false;
usage: Start with a relational database; the data is all users, bookings and rooms pointing at each other.
related: [primary-key, foreign-key, transaction, index, normalisation]
level: 1
lessons: [db.what-a-database-is, sysdesign.sql-or-nosql]
