term: AI-assisted coding
aka: [AI pair programming, coding with AI]
short: Writing software with a model drafting code, while you plan, check and own what ships.
explain: |
  The tool writes fast. You decide what to build, hand it pieces small enough to review,
  read every diff, and run checks you trust. Whatever ships is yours, however it was typed.

  Interviewers ask about it to find out whether your code is correct and understood. A
  strong answer names what you hand over, how you check it, and a time the checks caught a
  mistake.
analogy: Working with a very fast junior colleague. Their output is welcome; your name is on the review.
usage: Our AI-assisted coding rule is that no diff merges until someone has read every line.
related: [automation-bias, code-review, feedback-loop, agent]
level: 1
lessons: [career.how-you-work]
