summary: |-
  Behavioural rounds ask "tell me about a time..." because past behaviour is the best available clue to future behaviour. At senior level the interviewer is listening for three things: scope (did your decision matter beyond your own tickets?), judgement (did you choose between real options, for reasons?), and how you work with people when you disagree or when things go wrong.

  STAR gives each answer a shape: a sentence of situation, a sentence of task, most of the time on the action you chose and why, a result someone could check, then one line on what you learnt. Two minutes is plenty. The action is where marks are earned, so it says "I", names the option you turned down, and shows the reasoning.

  You don't need a story per question. Five stories from your own work, each tagged with the questions it can answer, cover almost every behavioural round. These notes give no model stories to borrow: a borrowed story collapses at the first follow-up. Instead they show how to find your five, how to map questions to them, and, for each classic question, what the interviewer is really asking, the structure to use and two things to avoid.
remember:
  - STAR is situation, task, action, result, with a sentence each for the first two, most of the time on the action, and one closing line on what you learnt.
  - The action says "I", names what you decided and the option you rejected, and gives the reason, because that's what the interviewer scores.
  - A result is something a stranger could check, ideally a number or a before and after, never "it went well".
  - Five stories cover most questions, a hard trade-off, an incident, a disagreement, helping someone grow, and a project you scoped down or stopped.
  - A disagreement story ends with what the evidence decided and how you both agreed, never with rank settling it.
  - A failure story must be a real failure you caused or owned, with what you changed afterwards, since invented or disguised failures collapse under follow-up questions.
  - Senior stories show influence over people who don't report to you, through evidence, writing and listening.
  - Prepare for the follow-ups, "what would you do differently?" and "what did your teammates do?", because that's where rehearsed but hollow stories break.
sections:
  - title: The shape of every behavioural answer
    body: |-
      Every "tell me about a time" answer has the same five beats. Learn the beats, not sentences.

      - **Situation**, one sentence: enough context to follow, no more. A reader who knows nothing about your company should picture it.
      - **Task**, one sentence: what you owned or were asked to do, and why it was hard.
      - **Action**, most of the answer: what *you* decided and did, in "I", in the order you did it. Name the option you turned down and the evidence against it.
      - **Result**, one or two sentences: what changed, with a number or a before and after.
      - **Lesson**, one sentence: what you'd do differently, or what you now do every time.

      A useful check is the split of time. On a two-minute answer, the situation and task together take about twenty seconds, and the action takes at least a minute. If your setup runs longer, cut context the interviewer doesn't need to follow the decision.

      Use "we" only for what the team did, and credit people by role for their parts. It makes your own part more believable, not less.
  - title: Finding your five stories
    body: |-
      Most people have the stories; they don't remember them under pressure. Mine your last two or three years with these prompts, and write a line for every answer:

      - **A hard trade-off.** When did you choose between two good options, such as quality against cost, or speed against safety? What did you measure before choosing?
      - **An incident.** When did something break while you were responsible? What did you do first, and what did you change so it couldn't happen again?
      - **A disagreement.** When did you think a colleague or manager was wrong? What evidence did you bring, and how did it end?
      - **Helping someone grow, or leading.** Who got better because of something you did on purpose? What could they do afterwards that they couldn't before?
      - **Scoping down or stopping.** When did you cut a plan, or stop one? What told you to, and who did you have to convince?

      Pick the five with the clearest decision and a result you can put a number on. Write each once, in about 150 words, in the STAR beats. Keep a separate, true story of a mistake you made yourself, since an incident caused by someone else's change isn't your mistake.

      Keep confidential details out: describe the shape of the problem ("a large retailer", "the biggest line in our cloud bill"), round numbers or use percentages, and never name a client you aren't allowed to name.
  - title: Mapping classic questions to your five stories
    body: |-
      Each story answers several questions. The job is to recognise which one fits, and shift the emphasis.

      ```text
      Question                                   Story            Emphasis
      A challenge and how you dealt with it      trade-off        options, evidence, why
      Your greatest achievement                  trade-off        scope, impact, your part
      A time you disagreed / conflict            disagreement     evidence, private first
      Influence without authority                disagreement     persuading a peer
      A failure / something went wrong           scoping down     the call, what you learnt
      A mistake you made                         own mistake      what you changed after
      Handling pressure / a crisis               incident         mitigate first, then fix
      A tight deadline                           scoping down     what you cut, who you told
      Leadership / mentoring                     growth           ownership, stepping back
      Pushing back on a stakeholder              scoping down     the written case
      Delivering with ambiguity                  trade-off        measuring before choosing
      ```

      Don't retrofit a story to a question it doesn't fit: interviewers notice. For senior roles, keep one or two spares: leading work across teams, and changing a decision above your level.
  - title: The follow-up questions that test a story
    body: |-
      A prepared story takes two minutes. The follow-ups take the next five, and they decide the score. Prepare an answer to each of these for every story:

      - **What would you do differently?** Have one real answer, such as measuring earlier or involving someone sooner. "Nothing" signals no reflection.
      - **What did your teammates do?** Credit specific people for specific parts. It shows honesty and makes your own part more believable.
      - **Why that option and not the other?** Name the rejected option and the evidence against it.
      - **How did you measure the result?** Know where the number came from, and its limits.
      - **What did the other person think?** For a disagreement, state their view fairly and why it was reasonable.
      - **What happened next?** Know the six-month outcome, even if it's mixed.

      If a follow-up exposes a weakness, own it briefly: agree it's a fair point and say what you'd add now. Defensiveness scores worse than the gap.

      Practise out loud, not in your head. Tell each story to someone who interrupts with these follow-ups, or record yourself and listen back. Aloud, you'll hear where the setup drags. Say each answer twice, then run a mock round: ask a chat assistant in voice mode to put your ten questions to you one at a time, as a friendly but critical interviewer, and to tell you after each answer what to cut and what to add.
  - title: The ten questions most loops ask
    body: |-
      Most behavioural rounds draw from the same short list. Know which shape each one takes:

      - **Tell me about yourself.** Now, before, next, in a minute. See the lesson on your narrative.
      - **Your strengths and weaknesses.** Two strengths with evidence, one real weakness you're fixing. Same lesson.
      - **Why do you want to work here?** Three researched specifics. Same lesson.
      - **Where do you see yourself in five years?** A direction, not a title, tied to this role. Same lesson.
      - **Why should we hire you?** Their top three requirements, one proof each. Same lesson.
      - **A challenge and how you dealt with it.** STAR, from your trade-off story. Below.
      - **Your greatest achievement.** STAR, with scope and your own part. Below.
      - **Why are you leaving?** What you're moving towards. The narrative lesson.
      - **How do you handle stress and pressure?** Your method in a sentence, then a STAR example. Below.
      - **Do you have any questions for us?** Always yes, two or three. See the lesson on questions to ask.
pitfalls:
  - >-
    **"We" throughout the action.** It hides what you did, and the interviewer can't score
    the team. Use "I" for your decisions, and credit others by role for theirs.
  - >-
    **A long setup.** Three minutes of context leaves no time for the action. One sentence
    of situation, one of task, then straight to what you decided.
  - >-
    **A result with no evidence.** "It went really well" can't be written down as evidence.
    Give a number, a before and after, or what someone did differently as a result.
  - >-
    **The disguised failure.** "I care too much about quality" answers nothing. Pick a real
    failure you owned, and spend most of the time on what you changed afterwards.
  - >-
    **Winning by rank.** "My manager backed me" ends a disagreement story badly. End on the
    evidence and on how you and the other person agreed.
  - >-
    **Claiming every decision.** A story where you did everything unravels at "what did your
    teammates do?". Be precise about your part.
  - >-
    **Borrowing a story or a script.** A story that isn't yours, or one memorised word for
    word, breaks at the first follow-up. Use your own work, and memorise the beats and the
    numbers, not the sentences.
interview:
  - question: Tell me about a challenge at work and how you dealt with it.
    answer: |-
      **What they're really asking:** how do you think when a problem has no obvious answer? They want to see options, evidence and a choice you can defend.

      **The structure:** use your hard trade-off story.

      - Situation and task in a sentence each: what was at stake, and what you owned.
      - Action, the longest part, in "I": what you measured first, the options you saw, the one you rejected and why, what you built or changed.
      - Result with a number, such as a cost, a time or an error rate, before and after.
      - The lesson in one line, plus the downside you accepted.

      **Avoid:**

      - A challenge that was only hard work, with no decision in it.
      - "We solved it", which leaves them nothing to score about you.
  - question: What's your greatest professional achievement?
    answer: |-
      **What they're really asking:** what do you count as success, how big a scope have you handled, and was it really yours?

      **The structure:** pick the achievement closest to this role's work, not the most impressive-sounding one.

      - Situation and task: the problem and why it mattered to users or the business.
      - Action, the longest part: the decisions you made, in "I", and what made them hard.
      - Result with a number: people served, time saved, errors caught, the system still running.
      - Why you're proud of it, in one line. It tells them what you value.

      **Avoid:**

      - A team result where your part is unclear. Say exactly what was yours.
      - A list of features. One decision told well beats ten things built.
  - question: How do you handle stress and pressure?
    answer: |-
      **What they're really asking:** will you stay clear-headed and honest when things go wrong or a deadline tightens?

      **The structure:** your method in a sentence, then prove it with a STAR example.

      - The method: for example, make the next step small, cut scope rather than quality, and tell people early what moves.
      - The example, from your incident or a tight deadline: what was at risk, what you did first, what you cut and who you told.
      - The result, with a number if you have one, such as time to recover or what still shipped on time.
      - The lesson: what you now prepare in advance, such as tests, a rollback plan or a checklist.

      **Avoid:**

      - "I don't get stressed", which nobody believes.
      - Heroics, like working every weekend. Interviewers read it as poor planning.
  - question: Tell me about a time you had a conflict with a colleague.
    answer: |-
      **What they're really asking:** can you disagree about work without damaging the relationship, and do you let evidence decide?

      **The structure:** use your disagreement story.

      - Situation: the decision you disagreed on, with the colleague's view stated fairly.
      - Task: why it mattered enough to raise.
      - Action, in "I": the evidence you gathered, how you raised it (often one to one first, so nobody backs down in public), and any test you agreed.
      - Result: what the evidence showed, with a number, and how the relationship ended up.
      - Lesson: what you'd do the same or differently next time.

      **Avoid:**

      - A conflict about personalities rather than work.
      - An ending where rank settles it, or where the other person comes off as a fool.
  - question: Tell me about a time you disagreed with your manager.
    answer: |-
      **What they're really asking:** will you speak up with evidence, and will you commit once a decision is made, even if it goes against you?

      **The structure:** STAR, with the commitment at the end.

      - Situation and task: the decision and what worried you about it.
      - Action, in "I": how you put the risk in writing, the alternative you proposed, and how you kept their goal intact, such as a staged roll-out that still met the date.
      - Result: what was decided and what happened, with a number if you have one.
      - Lesson: if it went the other way, say you committed fully and made it as safe as you could. That's the "disagree and commit" signal.

      **Avoid:**

      - Going around your manager, even if it worked.
      - A story where you were proved right and say so at length.
  - question: Tell me about a time you failed, or a mistake you made.
    answer: |-
      **What they're really asking:** do you take responsibility without drama, and do you fix the system, not only the symptom?

      **The structure:** a real failure you caused or owned.

      - Situation and task in a sentence each.
      - What went wrong, and your part in it, said plainly in "I".
      - Action: what you did first to limit the damage, who you told and when, and the fix.
      - Result: the cost, honestly, and what recovered.
      - The lesson gets real time here: the change you made to how you work, such as a checklist step or measuring before committing. Show it has held since.

      **Avoid:**

      - A disguised strength ("I cared too much"), or a mistake so small it's trivial.
      - Blaming others, the tools or the deadline.
  - question: Tell me about a time you influenced a decision without having authority.
    answer: |-
      **What they're really asking:** can you change things beyond your own team, through evidence and patience rather than force? It's the most senior of the classic questions.

      **The structure:** STAR, with the persuasion in the action.

      - Situation and task: the practice you wanted to change, and why you had no authority over it.
      - Action, in "I": how you proved it worked on your own work first, how you wrote the case down, and how you lowered the cost of saying yes, for example by doing the first setup yourself.
      - Result: how many people or teams adopted it, and what it caught or saved.
      - Lesson: what you adapted for the ones who resisted.

      **Avoid:**

      - Escalating to someone senior as the main move.
      - A story where everyone agreed at once. It isn't influence if nobody needed persuading.
  - question: Tell me about a time you helped someone grow.
    answer: |-
      **What they're really asking:** do you make the people around you better, on purpose?

      **The structure:** STAR, measured by the other person's progress.

      - Situation and task: who they were, what they couldn't yet do, and your role.
      - Action, in "I": the deliberate approach, such as real ownership of a small problem, regular review of their choices, then stepping back on purpose.
      - Result: what they could do afterwards on their own, and roughly how soon.
      - Lesson: what you'd change about how you mentor.

      **Avoid:**

      - Measuring success by your own involvement rather than their independence.
      - Taking credit for their work in the result.
terms:
  - term: STAR
    say: A template to recite in order.
    means: "Situation, task, action, result: a sentence each for situation and task, most of the
      time on the action you chose and why, a checkable result, and a line on what you
      learnt."
  - term: Behavioural question
    say: A soft question with no right answer.
    means: A request for a specific past example, because past behaviour is the best clue to
      future behaviour. It is scored on scope, judgement and how you work with people.
  - term: Story bank
    say: A script for every possible question.
    means: About five true, prepared stories, such as a hard trade-off, an incident, a
      disagreement, helping someone grow and a project you stopped, that you map to most
      questions.
  - term: Culture fit
    say: Being someone the team would enjoy a drink with.
    means: "Evidence that you work well within the team's stated values: how you disagree, own
      mistakes and share credit. Many companies now score it as values or \"culture add\" to
      avoid hiring for sameness."
  - term: Leadership principle
    say: A corporate slogan to quote back.
    means: One of a company's published behaviours, Amazon's list being the best known, that
      interviewers use as a scoring rubric. You answer with a story that shows the
      behaviour, not by naming the principle.
  - term: Influence without authority
    say: Getting your way with the team.
    means: Changing a decision made by people who don't report to you, through evidence, writing
      and listening. It is one of the clearest senior signals in a behavioural round.
