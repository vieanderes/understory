id: react.state-as-a-snapshot
title: State as a snapshot
objective: Predict what a render sees, with batching and updater functions.
level: essential
minutes: 10
concepts: [react.state-snapshot, react.batching, react.updater-functions]
prerequisites: [react.ui-as-a-function-of-state]
opening:
  text: >-
    You'll know what a click will show before you click it, even with three updates in a row.
    It's the fix for the counter that counts once when you tapped three times.

steps:
  - type: prose
    id: what-a-render-sees
    body: >-
      Think of each render as a photo. When React calls your component, `count` is fixed for
      that whole call. Every handler made in that render sees the same value.


      Calling `setCount(5)` doesn't change the photo you're holding. It asks React for a new
      render, a new photo, where `count` is 5. That's **state as a snapshot**.

  - type: predict-output
    id: predict-three-sets
    concept: react.state-snapshot
    difficulty: 2
    language: tsx
    code: |
      function Counter() {
        const [count, setCount] = useState(0);
        function handleClick() {
          setCount(count + 1);
          setCount(count + 1);
          setCount(count + 1);
        }
        return <button onClick={handleClick}>{count}</button>;
      }
    question: You click once. What does the button show?
    choices:
      - text: '`1`'
        correct: true
        feedback: >-
          Yes. `count` is `0` on all three lines, so each asks for `0 + 1`.
      - text: '`3`'
        feedback: >-
          Most people expect 3. But `count` doesn't change inside this render, so every line
          asks for 1.
      - text: '`0`'
        feedback: >-
          The setter did its job: a new render happens, with `count` at 1.

  - type: ai-review
    id: review-read-after-set
    concept: react.state-snapshot
    difficulty: 3
    language: tsx
    request: Check the address has an @ when Send is pressed. Show an error, or send the invite.
    flawClass: logic
    code: |
      function InviteButton({ email }: { email: string }) {
        const [error, setError] = useState("");
        function handleSend() {
          setError(email.includes("@") ? "" : "Add an @");
          if (error === "") sendInvite(email);
        }
        return (
          <div>
            <button onClick={handleSend}>Send invite</button>
            <p>{error}</p>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. Its test sends a good address and passes. Someone sends
      `sam.example.com`: the error shows, and the invite goes anyway. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`error` still holds this render''s old value'
        correct: true
        feedback: >-
          Yes. The setter is for the next render. Keep the check in a `const`.
      - text: '`includes` can''t look for `@`'
        feedback: >-
          It can, and the error text proves it found none. The send reads a stale `error`.
      - text: '`setError` should come after the `if`'
        feedback: >-
          Order won't help. `error` is this render's snapshot on every line of the handler.
    fix: |
      function InviteButton({ email }: { email: string }) {
        const [error, setError] = useState("");
        function handleSend() {
          const problem = email.includes("@") ? "" : "Add an @";
          setError(problem);
          if (problem === "") sendInvite(email);
        }
        return (
          <div>
            <button onClick={handleSend}>Send invite</button>
            <p>{error}</p>
          </div>
        );
      }

  - type: prose
    id: snapshot-and-batching
    body: >-
      Three setters in one handler: does React draw three times? No. It waits until your
      handler has finished, then renders once with every update it queued. That's
      **batching**.


      Think of a waiter who takes the whole table's order before walking to the kitchen. Fewer
      trips, and nobody sees a half-updated screen.

  - type: multiple-choice
    id: pick-batched-checkout
    concept: react.batching
    difficulty: 2
    language: tsx
    code: |
      function handleNext() {
        setName(form.name);
        setCard(form.card);
        setStep("review");
      }
    question: >-
      A teammate fears people glimpse a half-updated screen between these lines. Are they
      right?
    choices:
      - text: No, React renders once, after the handler
        correct: true
        feedback: >-
          Right. The three updates are batched into one render.
      - text: Yes, each setter redraws the page at once
        feedback: >-
          Setters queue updates. React waits for the handler to finish, then renders once.
      - text: Yes, unless `setStep` comes first
        feedback: >-
          The order doesn't reach the screen. All three updates land in the same render.
      - text: No, React drops updates that come too fast
        feedback: >-
          Nothing is dropped. All three arrive, together, in one render.

  - type: prose
    id: updater-functions
    body: |-
      So how do you add three in one click? Pass the setter a function instead of a value:

      ```tsx
      setCount((n) => n + 1);
      ```

      That's an **updater function**. React queues it, then calls it with the latest pending
      value. Three updaters in a row get 0, then 1, then 2, and the next render shows 3.

  - type: fill-blank
    id: fill-updater-scoops
    concept: react.updater-functions
    difficulty: 2
    language: tsx
    prompt: >-
      Double scoop calls `addScoop` twice in one click, and must add two scoops. Fill the gaps.
    template: |
      const [scoops, {{1}}] = useState(0);

      function addScoop() {
        setScoops({{2}});
      }

      function addDouble() {
        addScoop();
        addScoop();
      }
    blanks:
      - key: '1'
        answer: setScoops
      - key: '2'
        answer: '(n) => n + 1'
    bank: [setScoops, useScoops, '(n) => n + 1', 'scoops + 1', '(n) => scoops + 1']

  - type: ai-review
    id: review-stale-like
    concept: react.state-snapshot
    difficulty: 4
    language: tsx
    request: Add a like button that saves each like to the server.
    flawClass: race
    code: |
      function LikeButton({ postId }: { postId: string }) {
        const [likes, setLikes] = useState(0);
        async function handleLike() {
          await saveLike(postId);
          setLikes(likes + 1);
        }
        return <button onClick={handleLike}>{likes} likes</button>;
      }
    prompt: >-
      An assistant wrote this. Its test clicks once and sees `1 likes`. Someone taps three
      times quickly, all three saves succeed, and it shows `1 likes`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: Each tap adds one to the same old `likes`
        correct: true
        feedback: >-
          Yes. All three handlers saw `0`. `setLikes((n) => n + 1)` builds on the pending value.
      - text: '`useState(0)` resets `likes` on every tap'
        feedback: >-
          State survives renders, which is the point of `useState`. The three taps all read the
          same `0`.
      - text: '`handleLike` must not be `async`'
        feedback: >-
          Handlers can be async. The trouble is what `likes` means once the `await` is over.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Tap three times quickly, expect `3 likes`
          correct: true
          feedback: >-
            Yes. Only taps that overlap share the same old `likes`.
        - text: Tap once, expect `1 likes`
          feedback: >-
            That's the test it already passed. One tap never meets a stale value.
        - text: Make `saveLike` fail, expect `0 likes`
          feedback: >-
            Worth testing, but it checks errors. The bug here needs taps that overlap.
    fix: |
      function LikeButton({ postId }: { postId: string }) {
        const [likes, setLikes] = useState(0);
        async function handleLike() {
          await saveLike(postId);
          setLikes((n) => n + 1);
        }
        return <button onClick={handleLike}>{likes} likes</button>;
      }

  - type: code-challenge
    id: build-ticket-picker
    concept: react.updater-functions
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A ticket picker for a museum shows `Tickets: 0` and two buttons. "Add three" calls
      `addOne` three times, yet one click adds only one. The tests click it the way a person
      would.


      Make one click on "Add three" add three. Never let the count pass `MAX`, which is 8,
      even partway through a click. When it's full, disable both buttons.
    hints:
      - Look at what `tickets` holds on each of the three `addOne` calls in one click.
      - An updater gets the pending value, so each call can build on the one before.
      - 'Start with `setTickets((n) => (n < MAX ? n + 1 : n));`, then add `disabled` to the buttons.'

  - type: explain-back
    id: explain-sent-to-alice
    concept: react.state-snapshot
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A Send button waits two seconds, then sends to the person picked in `to`. You press Send
      with Alice picked, then switch to Bob. Why does it still send to Alice?
    rubric:
      - The handler belongs to the render where `to` was Alice.
      - State in a render is a fixed snapshot, and a later change makes a new render.
      - The delayed code reads the snapshot it was created with, so it sends to Alice.
    modelAnswer: >-
      The click ran in the render where `to` was Alice, and that render's values never change.
      Picking Bob asks React for a new render with a new `to`. The waiting code still belongs to
      the old render, so after two seconds it reads Alice. That's the snapshot working as
      designed: what you clicked is what gets sent.

recap:
  - Predict what a handler sees, since every render's state is a fixed snapshot.
  - Expect one render after a handler, however many setters it calls.
  - Build on pending state with an updater like `(n) => n + 1`.

recall:
  - id: card-log-after-set
    concept: react.state-snapshot
    front: A handler calls `setCount(5)`, then logs `count` on the next line. What's logged?
    back: >-
      The old value. The setter asks for a new render, and this render's `count` never changes.
  - id: card-three-sets
    concept: react.state-snapshot
    front: With `count` at 0, what does calling `setCount(count + 1)` three times give?
    back: >-
      1. Every call reads the same snapshot, so each asks for `0 + 1`.
  - id: card-batching
    concept: react.batching
    front: A handler calls three different setters. How many renders follow?
    back: >-
      One. React batches the updates and renders after the handler finishes.
  - id: card-updater
    concept: react.updater-functions
    front: When do you pass a function to a setter instead of a value?
    back: >-
      When the next value depends on the pending one. Think of several updates in a row, or
      one after an `await`.

