id: explain.walking-through-code
title: Walking someone through code
objective: Walk someone through code with the intent before the mechanics, one path at a time, and the reason behind each choice.
level: essential
minutes: 9
concepts: [explain.intent-before-mechanics, explain.one-path-at-a-time]
prerequisites: [clean.functions, explain.say-it-plainly]
opening:
  text: >-
    You'll walk a teammate through code so they understand it, not only hear it. You'll need
    it in code reviews, in interviews and every time someone new joins.

steps:
  - type: prose
    id: intent-first
    body: |-
      A teammate asks you to walk them through this:

      ```js
      function rideCost(ride, member) {
        if (ride.minutes <= 1) return 0;
        if (member.hasPass) return 0;
        const cost = UNLOCK_FEE + ride.minutes * PER_MINUTE;
        return Math.min(cost, DAILY_CAP);
      }
      ```

      Don't start at line 1. Start with what it's for: *it works out what a bike-share ride
      costs, in pence.* That's **intent before mechanics**. Now every line has a job they can
      hang it on.

  - type: multiple-choice
    id: pick-walkthrough-opening
    concept: explain.intent-before-mechanics
    difficulty: 1
    question: A new teammate asks about `rideCost`. Which opening helps them most?
    choices:
      - text: Line 2 returns zero if minutes is at most one.
        feedback: >-
          That's reading the code aloud. They can see line 2. They can't see what it's for.
      - text: It takes two parameters, `ride` and `member`.
        feedback: >-
          True, and they can read it in the first line. It doesn't say what the function is
          for.
      - text: It works out what a ride costs, in pence.
        correct: true
        feedback: >-
          Yes. Every line that follows now serves a purpose they know.
      - text: It uses `Math.min` and two early returns.
        feedback: >-
          Those are the mechanics. Lead with the purpose, and the parts make sense.

  - type: prose
    id: one-path
    body: >-
      Next, follow one ordinary input through it: *a 20-minute ride, no pass.* It skips both
      early returns. It pays the unlock fee plus 20 minutes, and stays under the cap.


      Read top to bottom, the first two lines are exceptions. The listener meets the special
      cases before the normal one. So follow **one path** first, then each branch.

  - type: parsons
    id: arrange-walkthrough
    concept: explain.one-path-at-a-time
    difficulty: 2
    language: text
    prompt: >-
      Put this walkthrough of `rideCost` in an order a teammate can follow. One line doesn't
      belong.
    blocks:
      - id: intent
        code: It works out what a ride costs, in pence.
        subgoal: What it's for
      - id: ordinary
        code: 'Take an ordinary case: a 20-minute ride, no pass.'
        subgoal: One real path
      - id: through
        code: It skips both early returns and pays unlock plus minutes.
        subgoal: One real path
      - id: price
        code: That's under the daily cap, so that's the price.
        subgoal: One real path
      - id: short
        code: 'Now the exceptions: a ride of a minute or less is free.'
        subgoal: Then the branches
      - id: rest
        code: Pass holders pay nothing, and long rides stop at the cap.
        subgoal: Then the branches
    distractors:
      - id: read-aloud
        code: Line 2 says if ride dot minutes is at most 1, return 0.
        feedback: >-
          That reads the code aloud. They can read it too. Say what it means and why it's
          there.

  - type: prose
    id: name-the-why
    body: >-
      The code already says *what*. Your words add *why*.


      Why is a one-minute ride free? People undock a bike, spot a flat tyre and put it back.
      Why the cap? So a day out never costs more than a day pass. The why is the one part
      nobody can read off the screen.

  - type: fill-blank
    id: fill-why-comments
    concept: explain.intent-before-mechanics
    difficulty: 2
    language: js
    prompt: >-
      Write comments a teammate can't read off the code. Fill each gap with the why, not the
      what.
    template: |
      // {{1}}
      if (ride.minutes <= 1) return 0;
      const cost = UNLOCK_FEE + ride.minutes * PER_MINUTE;
      // {{2}}
      return Math.min(cost, DAILY_CAP);
    blanks:
      - key: '1'
        answer: Undocking by mistake shouldn't cost anything
      - key: '2'
        answer: A day out shouldn't cost more than a day pass
    bank:
      - Undocking by mistake shouldn't cost anything
      - A day out shouldn't cost more than a day pass
      - Return 0 if minutes is 1 or less
      - Return the smaller of cost and DAILY_CAP

  - type: ai-review
    id: review-walkthrough-comments
    concept: explain.one-path-at-a-time
    difficulty: 3
    language: js
    request: Add comments that walk a new teammate through `rideCost`.
    flawClass: logic
    code: |
      // Works out what a ride costs, in pence.
      function rideCost(ride, member) {
        // Undocking by mistake shouldn't cost anything.
        if (ride.minutes <= 1) return 0;
        // Pass holders have already paid for the day.
        if (member.hasPass) return 0;
        const cost = UNLOCK_FEE + ride.minutes * PER_MINUTE;
        // Never charge less than the daily cap.
        return Math.min(cost, DAILY_CAP);
      }
    prompt: >-
      The code didn't change, and every test passed. Then support told a rider that every
      ride costs at least the cap. Tap the line at fault.
    lines: [8]
    reasons:
      - text: It promises a floor, but the code sets a ceiling
        correct: true
        feedback: >-
          Right. `Math.min` keeps the price at or *below* the cap.
      - text: Line 3 should say what the line does
        feedback: >-
          It gives the why, which is the useful part. A comment that repeats the code adds
          nothing.
      - text: Line 1 should list the parameters
        feedback: >-
          The signature already shows them. Line 1 gives the intent, which a newcomer needs
          first.
      - text: Comments can't be wrong if tests pass
        feedback: >-
          Tests run code, never comments. A wrong comment passes every test and misleads every
          reader.
    fix: |
      // A day out never costs more than the daily cap.
      return Math.min(cost, DAILY_CAP);
    verify:
      question: How could you have caught this comment before support did?
      choices:
        - text: Run the test suite again
          feedback: >-
            The tests check the code, and the code was right. They'll pass again.
        - text: Follow a 10-minute ride through and compare
          correct: true
          feedback: >-
            Yes. It costs well under the cap, which the comment says can't happen.
        - text: Ask the assistant to double-check it
          feedback: >-
            It wrote the mistake once and may repeat it. A real input through the code is the
            check.
        - text: Check the comments read fluently
          feedback: >-
            Fluent and wrong is the danger here. Compare what the comment claims with what the
            code does.

  - type: explain-back
    id: walk-interviewer-through
    concept: explain.one-path-at-a-time
    difficulty: 3
    audience: interviewer
    kind: explain
    prompt: |-
      An interviewer points at this and says, "Walk me through it." Say it out loud first.
      Then type what you said.

      ```js
      function canBorrow(member, book) {
        if (member.overdue > 0) return false;
        if (book.heldFor && book.heldFor !== member.id) return false;
        return member.loans.length < MAX_LOANS;
      }
      ```
    rubric:
      - It opens with the intent, deciding whether this member may borrow this book.
      - It follows one ordinary case, nothing overdue and no hold, down to the loan limit.
      - It then covers each branch with its why, such as overdue books blocking new loans.
    modelAnswer: >-
      It decides whether a member can borrow a book. Take the usual case: nothing overdue,
      and nobody has a hold on it. Then it comes down to the last line, which allows it under
      the loan limit. Two things stop it earlier. Overdue books block new loans, to get the
      old ones back. And a book held for someone else stays for them.

  - type: explain-back
    id: defend-walkthrough-order
    concept: explain.intent-before-mechanics
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      A reviewer asks why your walkthrough of `rideCost` began with a 20-minute ride, not
      with line 2. Defend the order you chose.
    rubric:
      - The intent and an ordinary ride show what the function is for before any detail.
      - The first lines are exceptions, which only make sense once the normal case is known.
      - Top to bottom is easier to point at on screen, but each early return lands without context.
    modelAnswer: >-
      Line 2 is an exception: rides under a minute are free. Start there and the listener
      meets the special cases before the normal one. So I said what it's for, then followed
      an ordinary ride to its price. Each early return then reads as "except when", with its
      reason. Top to bottom is easier to point at, but each line arrives with nothing to hang
      on.

recap:
  - Say what the code is for before how it works.
  - Follow one ordinary input through, then each branch.
  - Add the why that nobody can read off the screen.

recall:
  - id: card-first-sentence
    concept: explain.intent-before-mechanics
    front: What's the first sentence of a good code walkthrough?
    back: >-
      What the code is for, such as "It works out what a ride costs." Every line after it then
      has a job.
  - id: card-one-path
    concept: explain.one-path-at-a-time
    front: Why follow one input instead of reading a function top to bottom?
    back: >-
      Functions often start with exceptions. One ordinary input shows the main path first, so
      the exceptions make sense.
  - id: card-the-why
    concept: explain.intent-before-mechanics
    front: What should your words add that the code can't?
    back: >-
      The why: the reason a branch or a limit exists, such as free rides for bikes put
      straight back.
  - id: card-check-claims
    concept: explain.one-path-at-a-time
    front: How do you check that a walkthrough or a comment is right?
    back: >-
      Follow a real input through the code and compare what it does with what the words
      claim.

references:
  - kind: book
    title: The Programmer's Brain
    authors: Felienne Hermans
    year: 2021
    venue: Manning
    note: How people read unfamiliar code, and why a purpose to hang details on helps.
    primary: true
    verified: false
  - kind: paper
    title: Design and code inspections to reduce errors in program development
    authors: Michael E. Fagan
    year: 1976
    venue: IBM Systems Journal, 15(3)
    note: In a code inspection, a reader paraphrases the code for the group instead of reading it out.
    primary: true
    verified: false
  - kind: book
    title: A Philosophy of Software Design
    authors: John Ousterhout
    year: 2018
    venue: Yaknyam Press
    note: Why comments should say what isn't obvious from the code.
    verified: false

deepDive: >-
  Reading code aloud line by line isn't always wrong. Explaining code to a rubber duck, one
  line at a time, is an old debugging trick: saying each line forces you to notice what it
  really does. That's for you, though. For a listener, the same recital is noise.


  Formal code inspections, used since the 1970s, give one person the role of **reader**. The
  reader paraphrases each part in their own words for the group, rather than reading it out.
  When the paraphrase and the code disagree, the group has found a defect or a confusing
  piece of code.


  On a shared screen, say where you are before what it does: "line 4, where the cost is
  worked out". Scroll less than you think you need to. Each jump costs the listener their
  place. In a long function, pick the one path that matters for the question at hand, and
  say out loud which branches you're skipping.
