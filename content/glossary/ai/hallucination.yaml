term: hallucination
aka:
  - confabulation
short: A fluent, confident answer from a model that is made up or false.
explain: |
  A model is built to produce likely-sounding text, not to check facts. When it doesn't
  know, it rarely says so. It fills the gap with something that sounds right. A function
  that doesn't exist, a citation nobody wrote, a confident wrong date.

  You can't prompt it away entirely. You reduce it in a few ways. Give the model the facts,
  ask it to cite its sources, and check claims against them. And let it say "I don't know"
  without penalty.
analogy: A student bluffing through an oral exam. Fluent, confident, and nothing behind it.
usage: The answer cites a config flag that doesn't exist; that's a hallucination, not a docs bug.
related:
