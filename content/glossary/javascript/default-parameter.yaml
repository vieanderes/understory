term: default parameter
aka: [default parameters, default argument, default value]
short: A value a function uses for a parameter when the caller leaves it out.
explain: |
  `function greet(name = 'friend')` uses "friend" when called with no name. It replaces
  the older `name = name || 'friend'` line inside the body.

  The trap: defaults apply only to `undefined`. Pass `null`, `0` or `''` and the default is
  skipped, which is usually what you want, and occasionally a surprise.
analogy: A coffee order that comes with milk unless you say otherwise.
example:
  language: ts
  code: |
    function page(items: Item[], size = 20) { /* ... */ }
    page(items);       // size is 20
    page(items, null); // size is null, not 20
usage: Give `limit` a default parameter of 20 instead of the `||` line in the body.
related: [parameter, nullish-coalescing, argument]
level: 1
lessons: [pro.modern-javascript]
