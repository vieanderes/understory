    title: curl man page
    authors: Daniel Stenberg and contributors
    venue: curl.se
    url: https://curl.se/docs/manpage.html
    note: '`-v` and the exit codes, such as 6 for an unresolved host and 7 for a failed connection.'
    verified: true

deepDive: >-
  The journey is often shorter than the full list. Your computer caches DNS answers for as long
  as the record allows. Browsers also keep connections open, so a second request to the same
  host skips DNS, TCP and TLS.


  With `https`, `curl -v` prints the TLS handshake between the connection and the request:
  lines such as `TLS handshake, Server hello` and `SSL certificate verify ok`. A certificate
  for the wrong name or an expired one stops the journey there, with an error that names the
  certificate.


  HTTP/3 changes the middle. It runs over QUIC, which uses UDP instead of TCP and builds the TLS
  1.3 handshake into its own setup. The order of duties stays the same: find, connect, secure,
  ask.


  The `Host` header exists because one IP address can serve many sites. The `.invalid` domain
  used above is reserved so that it never resolves, which makes it safe for examples.
