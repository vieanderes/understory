term: CORS
aka:
  - cross-origin resource sharing
short: Response headers by which a server lets pages from other origins read its responses.
explain: |
  Browsers stop a page on one site from reading responses from another site. That rule, the
  **same-origin policy**, protects your logged-in data. When an API does want another site to
  read it, it says so with headers such as `Access-Control-Allow-Origin`.

  The trap: CORS loosens a browser rule. It doesn't protect your server, and anyone with
  curl ignores it. A wildcard origin combined with credentials is the misconfiguration to
  look for.
analogy: A guest list that only the browser bothers to check. Everyone else walks round the back.
example:
  language: http
  code: |
    HTTP/1.1 200 OK
    Access-Control-Allow-Origin: https://app.example.com
    Access-Control-Allow-Credentials: true
usage: The CORS error is the browser protecting us, so add the front end's origin to the list, not a wildcard.
twin:
  term: content-security-policy
  difference: CORS is a server saying which other sites may read its responses. A Content Security Policy is a page saying which sources its own scripts and styles may load from.
related:
  - csrf
  - content-security-policy
  - xss
level: 2
lessons: [security.same-origin-and-cors, js.requests-and-responses]
