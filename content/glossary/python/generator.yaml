term: generator
aka:
  - generator function
  - generator expression
  - yield
short: A function that pauses after each value it hands out, resuming only when the next is asked for.
explain: |
  Reading a ten-gigabyte log into a list fills your memory before you've looked at one
  line. You want the lines one at a time, only as you need them.

  A function with `yield` in it doesn't run when called. It returns an object instead. Each time you ask for a value, it runs to the next `yield` and pauses there, local state intact. A generator expression, `(x for x in rows)`, does the same inline. The catch:
  it's used up after one pass, so a second loop over it sees nothing.
analogy: A ticket machine at a deli counter. It doesn't print a hundred tickets in advance; it gives the next one when someone pulls.
example:
  language: python
  code: |
    def read_lines(path):
        with open(path) as f:
            for line in f:
                yield line.rstrip()

    errors = (l for l in read_lines("app.log") if "ERROR" in l)
    first = next(errors)
usage: Return a generator here, so we stream the rows instead of loading the whole export.
twin:
  term: list-comprehension
  difference: A generator produces values lazily and only once, using almost no memory. A list comprehension builds every value up front into a list you can read again and again.
related:
  - iterator
  - iterable
  - list-comprehension
