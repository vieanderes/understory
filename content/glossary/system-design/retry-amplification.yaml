term: retry amplification
aka: [retry storm, retry multiplication]
short: Retries at several layers multiplying the calls that reach the bottom of a system during an outage.
explain: |
  The browser retries three times. The API retries each of those three times. The service
  behind it does too. One click becomes 27 calls on the database that was already
  struggling.

  Retry in one layer only, usually the one nearest the user or the one that knows the
  call is safe. Use backoff with jitter, a retry budget and a circuit breaker.
analogy: A rumour passed down a chain where everyone tells three people. The last layer hears it a lot.
usage: The outage lasted an hour because of retry amplification; three layers each retried five times.
related: [retry, jitter, circuit-breaker, load-shedding]
level: 3
lessons: [sysdesign.the-method]
