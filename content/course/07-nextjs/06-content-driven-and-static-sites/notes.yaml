summary: >-
  Content sites live or die by what the first HTML says about them. The tab title, the
  search description and the picture in a shared link all come from the `<head>`, and the
  crawlers and chat apps that read it often run no JavaScript. Next.js builds the `<head>`
  from `metadata` exports and `generateMetadata` functions, merged from the root layout down
  to the page.


  Two built-in components handle the heaviest parts of a content page. `next/image` serves
  each picture at a size that suits the screen, lazy by default, with its space reserved so
  text doesn't jump. `next/font` downloads fonts at build time and serves them from your own
  domain with a fallback tuned to match, so text doesn't reflow when the font arrives. MDX
  lets writers use Markdown and still drop in React components.


  When no page needs a server at visit time, `output: 'export'` turns the whole site into
  files for any static host. The price is every feature that runs code per request: image
  resizing with the default loader, cookies, redirects, Server Actions, revalidation. Knowing
  that list is what lets you choose between an export and a server deployment.
remember:
  - >-
    Metadata objects from the layouts and the page are merged shallowly, so a page that sets
    `openGraph` replaces the layout's whole `openGraph` object.
  - >-
    A title template in a layout applies to its child segments only, needs a `default`, and
    `title.absolute` skips it.
  - >-
    `metadata` and `generateMetadata` work only in Server Components, and `fetch` calls in
    `generateMetadata` are memoised with the same calls in the page.
  - >-
    `<Image>` needs `width` and `height` for the aspect ratio (not the rendered size), or
    `fill` inside a positioned parent, and loads lazily unless told otherwise.
  - >-
    `next/font` self-hosts fonts at build time, so the browser sends no request to the font
    provider and the fallback is sized to avoid layout shift.
  - >-
    A static export runs every page once at build time; anything that needs a server per
    request, including default image optimisation, ISR, cookies and Server Actions, isn't
    available.
  - >-
    A relative Open Graph image is resolved against `metadataBase`, so set it to the real
    domain or previews point at localhost.
sections:
  - title: How metadata is merged from layout to page
    body: |-
      Next.js evaluates metadata from the root layout down to the page and merges the
      objects **shallowly**: each top-level key from a later segment replaces the same key
      from an earlier one. Nested objects aren't combined.

      ```tsx
      // app/layout.tsx
      import type { Metadata } from 'next';

      export const metadata: Metadata = {
        metadataBase: new URL('https://bakery.example'),
        title: { template: '%s | Bakery', default: 'Bakery' },
        description: 'Bread baked every morning',
        openGraph: { siteName: 'Bakery', images: ['/og/default.png'] },
      };
      ```

      ```tsx
      // app/journal/page.tsx
      import type { Metadata } from 'next';

      export const metadata: Metadata = {
        title: 'Journal',
        openGraph: { images: ['/og/journal.png'] },
      };
      ```

      The journal page gets the title "Journal | Bakery" from the template, inherits the
      description, and loses `siteName`, because its `openGraph` replaced the layout's
      object wholesale. To share nested fields, put them in a variable and spread it into
      each segment's `openGraph`.

      Three more rules explain most surprises. A `title.template` applies to child segments,
      not to the segment that defines it, and it requires a `default`. `title.absolute` on a
      page ignores any template above it. And `metadataBase` turns relative URLs into
      absolute ones, which preview crawlers need; without it the build falls back to
      localhost.

      File-based metadata, such as an `opengraph-image.png` placed in a route folder, takes
      priority over both the `metadata` object and `generateMetadata`.
  - title: generateMetadata, data and bots
    body: |-
      A page whose title depends on data exports `generateMetadata`. It receives the same
      `params` promise as the page. The obvious worry is a double fetch: once for the title,
      once for the page. Next.js memoises identical `fetch` calls across
      `generateMetadata`, `generateStaticParams`, layouts, pages and Server Components in
      one render, so the product is fetched once. For a database call, wrap the loader in
      React's `cache` to get the same effect.

      ```tsx
      import type { Metadata } from 'next';
      import { cache } from 'react';

      type Recipe = { title: string; summary: string };
      const recipes: Record<string, Recipe> = {
        'lemon-cake': { title: 'Lemon cake', summary: 'A sharp, soft sponge in one bowl.' },
      };

      const getRecipe = cache(async (slug: string) => recipes[slug] ?? null);

      type Props = { params: Promise<{ slug: string }> };

      export async function generateMetadata({ params }: Props): Promise<Metadata> {
        const recipe = await getRecipe((await params).slug);
        return recipe ? { title: recipe.title, description: recipe.summary } : { title: 'Recipe not found' };
      }

      export default async function RecipePage({ params }: Props) {
        const recipe = await getRecipe((await params).slug);
        return <h1>{recipe?.title ?? 'Recipe not found'}</h1>;
      }
      ```

      Metadata must be resolved on the server, which is why the exports only work in Server
      Components. For ordinary browsers, Next.js can stream metadata alongside the page so
      slow metadata doesn't hold back visible content. Bots that only read HTML, such as
      link-preview crawlers, are detected by user agent and get the metadata in the first
      `<head>` instead. That's why a slow `generateMetadata` can still slow a shared link's
      preview: keep it fast, or cache what it reads.
  - title: What `next/image` does, and the props that matter
    body: |-
      A plain `<img>` downloads one file at one size and, without dimensions, pushes text
      down when it arrives. `<Image>` renders an `<img>` with a generated `srcset`, so the
      browser picks a suitable size, and it goes through an optimiser that resizes on
      request, which is the `/_next/image?url=...&w=...` address the lesson's bug showed.

      ```tsx
      import Image from 'next/image';

      export function Hero() {
        return (
          <div style={{ position: 'relative', aspectRatio: '16 / 9' }}>
            <Image
              src="/photos/sourdough.jpg"
              alt="A sourdough loaf, sliced, on a wooden board"
              fill
              sizes="(max-width: 768px) 100vw, 50vw"
              loading="eager"
              style={{ objectFit: 'cover' }}
            />
          </div>
        );
      }
      ```

      `width` and `height` are the image's **intrinsic** size in pixels. They set the aspect
      ratio used to reserve space; CSS sets the rendered size. When dimensions are unknown,
      `fill` stretches the image over a parent that must be positioned, and `objectFit`
      chooses cropping. A static import supplies the dimensions for you.

      `sizes` tells the browser how wide the image will be at each breakpoint. Without it,
      Next.js generates a small `srcset` for fixed sizes; with it, a full set of widths for
      responsive layouts. Images load lazily by default. For the hero that's likely your
      largest contentful paint, the docs recommend `loading="eager"` or
      `fetchPriority="high"`; the old `priority` prop is deprecated in Next.js 16 in favour
      of `preload`.

      Images from other domains must be allowed with `images.remotePatterns` in the config,
      which stops anyone using your optimiser for arbitrary URLs. And `alt` is the text a
      screen reader reads; for a purely decorative image it's an empty string.
  - title: Fonts without the jump
    body: |-
      A web font normally loads after the page, so text first renders in a fallback and
      then reflows when the font arrives. Lines change length, and whatever is below moves.
      That shift counts against cumulative layout shift, one of the Core Web Vitals.

      ```tsx
      import { Inter } from 'next/font/google';
      import type { ReactNode } from 'react';

      const inter = Inter({ subsets: ['latin'] });

      export default function RootLayout({ children }: { children: ReactNode }) {
        return (
          <html lang="en-GB" className={inter.className}>
            <body>{children}</body>
          </html>
        );
      }
      ```

      `next/font` does three things with this call. It downloads the font files at build
      time and serves them as static assets from your own domain, so the visitor's browser
      makes no request to Google. There's no extra connection to a third party, and visitor
      requests never reach one. It injects a preload tag for the subsets you list, since
      `preload` defaults to true. And for Google fonts it adds an adjusted fallback font,
      the `adjustFontFallback` option on by default, so the fallback takes nearly the same
      space, which is what removes the jump. The default `display` is `'swap'`.

      `subsets` limits the files to the characters you need. `next/font/local` does the same
      for font files you ship yourself. Every call to a font function is hosted as its own
      instance, so load each font once in a shared module and import the result where you
      need it.
  - title: What survives a static export
    body: |-
      With `output: 'export'`, `next build` runs every page once and writes an `out` folder:
      HTML for first loads and payload files for client-side navigation between pages. The
      site then behaves like a single-page app after the first load, and any web server can
      host it.

      Supported, because it can be computed at build time:

      - Server Components that fetch data, run during the build.
      - Client Components, rendered to HTML at build and hydrated in the browser. Browser
        APIs such as `window` must be read in effects, since the build runs on the server.
      - Dynamic routes with `generateStaticParams` and `dynamicParams = false`.
      - `GET` Route Handlers marked `export const dynamic = 'force-static'`, which become
        files such as `data.json`.
      - `next/image` with a custom `loader` that points at an image service, or with
        `unoptimized`.

      Not supported, because it needs a server per request: cookies, rewrites, redirects and
      headers from the config, `proxy.ts`, ISR, default image optimisation, draft mode,
      Server Actions and intercepting routes. With the export setting on, the dev server
      reports an error when you use one, so you find out before deploying.

      One hosting detail catches people out. With the default `trailingSlash: false`, the
      export writes `about.html`, so a request for `/about` needs the host to try the
      `.html` file. Nginx does it with `try_files $uri $uri.html $uri/ =404;`.

      MDX fits exports well. Each `.mdx` file compiles to a component at build time. A page
      for `/blog/[slug]` can load the post with a dynamic `import()` of the matching `.mdx`
      file, list the slugs in `generateStaticParams` and set `dynamicParams = false`, so an
      unknown slug is a 404. Custom components for headings and images go in
      `useMDXComponents` in `mdx-components.tsx`.
pitfalls:
  - >-
    **Setting `openGraph` on a page and losing the layout's fields.** Merging is shallow.
    Spread shared fields into each segment's `openGraph`.
  - >-
    **Leaving `metadataBase` unset.** Relative preview images resolve against localhost,
    which no crawler can reach. Set it to the production domain.
  - >-
    **Inventing metadata fields.** `ogImage` or `image` are ignored silently. Type the
    export as `Metadata` so TypeScript rejects unknown keys.
  - >-
    **Treating `width` and `height` as display size.** They set the aspect ratio. Size the
    image with CSS, and give `fill` images a positioned parent and `sizes`.
  - >-
    **Lazy-loading the hero image.** The largest image on screen arrives late. Use
    `loading="eager"` or `fetchPriority="high"` on it, not on every image.
  - >-
    **Exporting a site that uses the default image loader.** The `/_next/image` URLs have
    nothing to answer them. Set `images.unoptimized`, or a custom loader.
  - >-
    **Adding `<title>` or `<meta>` tags by hand in the root layout.** The docs say not to:
    the Metadata API dedupes head tags and handles streaming. Export `metadata` instead.
interview:
  - question: How does Next.js build a page's metadata when a layout and a page both define it?
    answer: >-
      It evaluates metadata from the root layout down to the page and merges the objects
      shallowly, so each top-level key from a deeper segment replaces the one above. That's
      convenient for `title` and `description`, and a trap for nested objects: a page that
      sets `openGraph.images` loses the layout's `openGraph.siteName`. I share nested fields
      through a spread variable. Titles use a template in the layout, `'%s | Site'`, which
      applies only to child segments and requires a default. I set `metadataBase` so
      relative image URLs become absolute for crawlers. For data-driven titles I use
      `generateMetadata`, and fetch memoisation means the page doesn't fetch twice.
  - question: What problems does `next/image` solve, and what does it cost?
    answer: >-
      It solves oversized downloads and layout shift. It generates a `srcset`, and with
      `sizes` a full set of widths, so a phone doesn't download a desktop image. It
      requires dimensions or `fill`, so the browser reserves the right space before the
      file arrives, and it lazy-loads by default. The cost is an optimiser that resizes on
      request: it needs a server or a paid image service, it doesn't forward auth headers,
      and remote domains must be allowed in `remotePatterns`. For a static export I use a
      custom loader pointing at an image CDN, or `unoptimized`. For the hero image I opt
      out of lazy loading so it doesn't hurt largest contentful paint.
  - question: When would you choose a static export over a Next.js server, and what do you give up?
    answer: >-
      When every page can be computed at build time and content changes with deploys: a
      documentation site, a portfolio, a marketing site. The export is plain files, so
      hosting is cheap, fast from a CDN and has no server to patch or scale. I give up
      everything that runs per request: ISR and on-demand revalidation, cookies, redirects
      and rewrites from the config, proxy, Server Actions, draft mode and the default image
      optimiser. Dynamic routes need `generateStaticParams` with `dynamicParams` false. If
      content changes hourly, or pages need personalisation or forms that write data, a
      server deployment with static pages plus revalidation is the better fit.
