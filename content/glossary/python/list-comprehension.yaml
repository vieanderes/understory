term: list comprehension
aka:
  - comprehension
  - dict comprehension
short: A one-line expression in square brackets that builds a new list from a loop and an optional filter.
explain: |
  Building a list usually takes four lines: make an empty list, loop, check, append.
  Python lets you say the same thing in one line that reads like a sentence.

  `[expression for item in items if condition]` runs the loop and collects the results.
  The same shape with braces builds a dict or a set. Use it to build a value, not for
  side effects: a comprehension full of `print` calls makes a list of `None` nobody wants.
  If it needs two lines of conditions, a plain loop reads better.
analogy: Telling a shop assistant "the red ones in size ten, each one wrapped". One sentence instead of handing over shoes one by one.
example:
  language: python
  code: |
    prices = [4.5, 12.0, 0.99, 30.0]
    with_tax = [round(p * 1.2, 2) for p in prices if p > 1]
    # [5.4, 14.4, 36.0]

    stock = {"pens": 3, "ink": 0}
    in_stock = {name: n for name, n in stock.items() if n}
usage: That loop only builds a filtered list, so a list comprehension says it in one line.
twin:
  term: generator
  difference: A list comprehension builds the whole list in memory at once. A generator expression, with round brackets instead, hands over one item at a time and can only be read once.
related:
  - generator
  - iterable
level: 1
