term: recursion
aka: [recursive, recursive function]
short: A function solving a problem by calling itself on a smaller piece, until the piece is trivial.
explain: |
  Some problems contain smaller copies of themselves. A folder holds files and more
  folders. To count every file, count this folder's files, then ask the same question of
  each subfolder.

  Each call must make the problem smaller and stop at a base case. Miss either and the
  calls never end. Every waiting call holds a frame on the call stack, so the depth costs
  memory.

  JavaScript and Python cap that depth at a few thousand calls. For a list of a million
  items, a loop or an explicit stack is safer than recursion.
analogy: Russian dolls. Open one, and inside is a smaller version of the same job, until the tiny one that doesn't open.
example:
  language: js
  code: |
    function countFiles(folder) {
      let total = folder.files.length;
      for (const sub of folder.folders) {
        total += countFiles(sub); // same question, smaller folder
      }
      return total; // a folder with no subfolders stops here
    }
usage: Recursion reads nicely here, but the input can be 100,000 deep, so it'll overflow the stack.
twin:
  term: loop
  difference: Recursion repeats work by calling the function again, and each call waits on the stack. A loop repeats work inside a single call, with no depth limit.
related: [base-case, call-stack, loop, depth-first-search, backtracking, dynamic-programming]
level: 1
lessons: [cs.recursion]
