deepDive: >-
  The part of the browser that reads HTML is the parser. It reads the file in two stages. The
  tokeniser cuts the text into start tags, end tags and text. The tree builder then adds
  each token to the DOM.


  The repairs follow rules written in the HTML Standard, so every browser builds the same
  tree from the same mistakes. The runaway bold you fixed is one of them. When a paragraph
  ends while `strong` is still open, the builder reopens `strong` for whatever comes next.
  The standard calls this the adoption agency algorithm.


  Tables have their own repair. A `p` written straight inside a `table` is moved out in
  front of it, which the standard calls foster parenting. Rows written straight inside a
  `table` get a `tbody` wrapped around them.


  The DOM holds more than elements. The text between tags becomes text nodes, and comments
  become comment nodes. `children` lists only the element children, while `childNodes`
  lists them all.


  `textContent` treats what you give it as plain text, so `<b>` shows up as those
  characters. `innerHTML` parses HTML instead, which is why it's unsafe with text a user
  typed. The JavaScript chapter shows how to react to clicks.
