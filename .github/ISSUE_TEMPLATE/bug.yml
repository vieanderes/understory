name: Bug
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or lesson URL.
      placeholder: /learn/javascript/values-types-coercion
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 26
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
