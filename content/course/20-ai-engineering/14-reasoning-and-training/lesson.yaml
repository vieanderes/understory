id: ai.reasoning-and-training
title: Reasoning models and how they are trained
objective: "Explain chain of thought, test-time compute, best-of-n and voting, tree search, outcome and process reward models, and how RLHF with PPO and GRPO trains a reasoning model."
level: advanced
minutes: 10
concepts: [ai.test-time-compute, ai.reward-models]
prerequisites: [ai.how-llms-work, ai.evals]
opening:
  text: >-
    You'll know how reasoning models think longer, search and get trained to be right. It's
    what AI lab interviewers ask about, and it changes how you spend on a hard task.

steps:
  - type: prose
    id: chain-of-thought
    body: >-
      Ask a model a tricky logic question and it may blurt out a wrong answer. Ask it to
      work step by step first, and it often gets it right. That's **chain of thought**: each
      written step becomes context for the next token.


      **Reasoning models** do this by themselves, in thinking tokens you pay for. It's one
      way to spend more work while answering, called **test-time compute**.

  - type: prose
    id: best-of-n
    body: >-
      Another way is **best-of-n**: generate n answers and keep the one a checker scores
      highest. For code, the checker can be the tests.


      Its cousin is **majority voting**: sample several answers and keep the one most of
      them agree on. Both cost n times as much as one answer.

  - type: fill-blank
    id: fill-majority-vote
    concept: ai.test-time-compute
    difficulty: 1
    language: python
    prompt: >-
      `solve(question)` samples one reasoning path and returns its final answer. Keep the
      answer most samples agree on.
    template: |
      from collections import Counter

      answers = [{{1}}(question) for _ in range(5)]
      votes = {{2}}(answers)
      best, count = votes.{{3}}(1)[0]
    blanks:
      - key: '1'
        answer: solve
      - key: '2'
        answer: Counter
      - key: '3'
        answer: most_common
    bank: [solve, question, Counter, max, most_common, sorted]

  - type: ai-review
    id: review-self-rated-best-of-n
    concept: ai.test-time-compute
    difficulty: 3
    language: python
    request: Generate eight solutions and return one that works.
    flawClass: logic
    code: |
      def best_of_n(task, n=8):
          best, best_score = None, -1
          for _ in range(n):
              code = generate_code(task)
              score = int(ask_model(f"Rate this code from 1 to 10:\n{code}"))
              if score > best_score:
                  best, best_score = code, score
          return best
    prompt: >-
      An assistant wrote this. It often returns code that fails the task's tests. Tap the
      line at fault.
    lines: [5]
    reasons:
      - text: The model rates its own code instead of testing it
        correct: true
        feedback: >-
          Right. A judge that can be fooled will be. Run the tests.
      - text: Eight samples are too few to find one
        feedback: >-
          More samples won't help while the judge can't spot a working one.
      - text: '`best_score` should start at 0'
        feedback: >-
          Any rating beats both -1 and 0. The ratings themselves are the problem.
    fix: |
      score = run_tests(code, task.tests)   # share of tests passed

  - type: prose
    id: tree-search
    body: >-
      Best-of-n judges whole answers. **Monte Carlo tree search** (MCTS) judges partial
      ones. AlphaGo used it to beat a Go champion.


      Picture each possible next move as a branch of a tree. MCTS repeats four steps.
      **Select** a promising branch and **expand** it with one new move. **Evaluate** the new
      position, then **back up** its score to every branch above. For a language model, a
      move is one reasoning step.

  - type: parsons
    id: arrange-mcts-loop
    concept: ai.test-time-compute
    difficulty: 2
    language: python
    prompt: >-
      Arrange one search: repeat the four steps until the budget runs out, then pick the
      move. One block doesn't belong.
    checkIndent: true
    blocks:
      - id: loop
        code: 'for _ in range(budget):'
        subgoal: Repeat within a budget
      - id: select
        code: node = select(root)
        indent: 1
        subgoal: Select
      - id: expand
        code: child = expand(node)
        indent: 1
        subgoal: Expand
      - id: evaluate
        code: score = evaluate(child)
        indent: 1
        subgoal: Evaluate
      - id: back-up
        code: back_up(child, score)
        indent: 1
        subgoal: Back up
      - id: choose
        code: return most_visited_child(root)
        subgoal: Choose a move
    distractors:
      - id: evaluate-root
        code: score = evaluate(root)
        feedback: >-
          The root never changes. Score the new child you added.

  - type: prose
    id: reward-models
    body: >-
      Who scores the answers and branches? Often another model, a **reward model**.


      An **outcome reward model** (ORM) scores only the final answer: right or wrong. A
      **process reward model** (PRM) scores every step. So a PRM shows where the reasoning
      went wrong, which lets a search drop a bad branch early. The catch: labelling every
      step costs far more than labelling answers.

  - type: multiple-choice
    id: pick-prm-or-orm
    concept: ai.reward-models
    difficulty: 2
    question: Your tree search must drop bad reasoning steps early. Which scorer fits?
    choices:
      - text: A process reward model, scoring each step
        correct: true
        feedback: >-
          Yes. Step scores let the search prune a branch halfway.
      - text: An outcome reward model, scoring the final answer
        feedback: >-
          It only speaks at the end, so the search can't tell which step failed.
      - text: A count of tokens in each step
        feedback: >-
          Length says nothing about quality. A long step can be wrong too.
      - text: A larger model with no scorer
        feedback: >-
          Search needs a score to choose between branches. Size alone gives none.

  - type: prose
    id: rl-training
    body: >-
      How do models learn to reason? By **reinforcement learning**: try, get scored, and
      shift towards what scored well. **RLHF** gets its scores from a reward model trained
      on people's rankings.


      **PPO**, the classic method, clips each update so the model changes a little at a
      time. It also trains a second network, a **value model**, to predict scores. **GRPO**
      drops it, and scores each answer against its group's average.

  - type: explain-back
    id: explain-grpo
    concept: ai.reward-models
    difficulty: 3
    prompt: >-
      A teammate asks how GRPO makes a model better at maths without a value model. Explain
      it to them.
    rubric:
      - It samples a group of answers to one problem and scores each, for example by checking the result.
      - Each answer is compared with the group's average score.
      - Training makes above-average answers more likely, so the average replaces the value model.
    modelAnswer: >-
      For each maths problem, GRPO samples a group of answers and checks each result. Each
      answer is compared with the group's average score. Training then makes
      above-average answers more likely and below-average ones less. The group average does
      the value model's job, so there's no second network to train.

recap:
  - Explain chain of thought, and when thinking first is worth its cost.
  - Spend test-time compute with best-of-n, voting or tree search, judged by a checker you trust.
  - Tell process from outcome rewards, and explain how PPO and GRPO train reasoning models.

recall:
  - id: card-chain-of-thought
    concept: ai.test-time-compute
    front: Why does chain of thought help on multi-step problems?
    back: >-
      Each written step becomes context for the next token, so the model works it out on
      paper instead of in one jump.
  - id: card-best-of-n
    concept: ai.test-time-compute
    front: What is best-of-n, and what can go wrong with it?
    back: >-
      Generate n answers and keep the one a checker scores highest. It costs n times as
      much, and a weak checker picks answers that look right but aren't.
  - id: card-mcts
    concept: ai.test-time-compute
    front: What are the four steps of Monte Carlo tree search?
    back: >-
      Select a promising branch, expand it with a new move, evaluate the new position, and
      back up the score to the branches above.
  - id: card-prm-orm
    concept: ai.reward-models
    front: How does a process reward model differ from an outcome reward model?
    back: >-
      A process reward model scores every step, so it shows where the reasoning broke. An
      outcome reward model scores only the final answer.
  - id: card-grpo
    concept: ai.reward-models
    front: What does GRPO replace from PPO, and with what?
    back: >-
      PPO's value model. GRPO samples a group of answers to each prompt and scores each
      against the group's average.

