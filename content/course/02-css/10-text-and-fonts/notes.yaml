summary: >-
  Most of a web page is text, so typography decides whether people read it or leave. Three
  things do most of the work. A **font stack** is the list of fonts the browser tries in
  order. The **measure** is the length of a line. And lines need enough space between them.
  Get those right and even a plain system font reads well.


  A **web font** is a font file your page downloads, so everyone sees the same letters. It
  costs something: a download before the text looks right, and a jump when the font arrives
  and the words take a different amount of room. `font-display` decides what readers see in
  the meantime, and a few other tools make the jump smaller.


  Reach for a web font when the brand needs it, and load as few files as you can. Reach for
  `system-ui` or a plain stack when speed matters more than a signature look. Either way, size
  text in `rem`, keep `line-height` unitless, and let the reader's own settings win.
remember:
  - A font stack is tried in order, and it ends with a generic family such as `serif` or `sans-serif` that always exists.
  - The browser falls back per character, so a letter the first font lacks is drawn by the next font that has it.
  - A browser downloads a web font only when some text on the page uses it, and only the weights and styles that text uses.
  - '`font-display: swap` shows fallback text at once and swaps in the web font when it arrives, which can make the text reflow.'
  - A font preload needs the `crossorigin` attribute, even for a font on your own site, or the browser downloads the file twice.
  - A unitless `line-height` is inherited as a ratio, so every element multiplies it by its own font size.
  - '`1ch` is the width of the digit 0, which is wider than an average letter, so `65ch` holds more than 65 characters of prose.'
  - Text must survive the reader's own spacing, so never give a box of text a fixed height.
sections:
  - title: How the browser picks a font for each letter
    body: |-
      A font stack isn't a choice made once for the whole element. The browser goes through
      the text character by character. For each one, it takes the first font in the list
      that is available and has a drawing, a **glyph**, for that character.

      That matters for mixed text. We tested a paragraph in Chromium on a Mac with
      `font-family: Georgia, serif`, holding "Hello" and an Arabic greeting. It used two
      fonts: Georgia for the Latin letters, and the system's Arabic font for the rest. Georgia has
      no Arabic glyphs, so the browser kept looking.

      Some details about writing the stack:

      - Quote a family name with spaces, as in `"Times New Roman"`. Unquoted works too, but
        quotes are clearer and required if a name contains unusual characters.
      - Never quote a generic family. `serif` is the generic family, while `"serif"` asks for
        a font literally called serif.
      - `system-ui` uses the device's interface font: San Francisco on Apple devices, Segoe
        UI on Windows, Roboto on many Android phones. It looks native and costs no download.
      - `monospace` gives every character the same width, which suits code and columns of
        figures.

      The generic family at the end is your safety net. If none of the named fonts exists,
      you still get the right kind of font rather than the browser's default, which is
      often a serif.

      Here's a full stack for body text that falls back gracefully:

      ```css
      body {
        font-family: "Grove", Georgia, "Times New Roman", serif;
        font-size: 1rem;
        line-height: 1.5;
      }
      ```

      If Grove hasn't loaded yet, Georgia takes over, then Times New Roman, then any serif.
  - title: Loading web fonts without surprises
    body: |-
      Declaring an `@font-face` doesn't download anything. The browser fetches the file only
      when an element that uses the family has text to draw. In our test, a page with the
      `@font-face` but no element using it made no request, and an element using it with no
      text inside made none either. Declare two weights, use only the regular one, and only
      the regular file arrives.

      Because the browser only learns it needs the font after reading the CSS and building
      the page, the download starts late. A **preload** asks for it early, from the HTML head:

      ```html
      <link rel="preload" href="/fonts/grove.woff2" as="font" type="font/woff2" crossorigin>
      ```

      The `crossorigin` attribute matters even when the font is on your own site, because
      browsers always fetch fonts in a special mode, and the preload must match it. In our
      Chromium test, the preload without `crossorigin` was ignored, the console warned
      about it, and the font was downloaded twice. Preload only the one or two fonts the
      first screen needs.

      Use the WOFF2 format. It's compressed, and every current browser supports it.

      Then make the swap gentle. When the web font replaces the fallback, lines can wrap
      differently and push the page down. That movement counts towards **layout shift**,
      content jumping after it first appeared. `size-adjust` in a fallback `@font-face`
      scales the fallback's letters to take the web font's room:

      ```css
      @font-face {
        font-family: "Grove fallback";
        src: local("Arial");
        size-adjust: 110%;
      }
      body { font-family: "Grove", "Grove fallback", sans-serif; }
      ```

      In our test, the same phrase at 20px measured 179px wide in Arial and 197px in the
      adjusted fallback, 10% wider, while `font-size` still read 20px. You pick the percentage
      by comparing the two fonts side by side.
  - title: Measure, spacing and the reader's settings
    body: |-
      The `ch` unit is the width of the digit 0 in the element's font. Digits are wide and
      spaces are narrow, so a line of prose fits more characters than its `ch` width. We set
      `max-width: 65ch` on the same English paragraph at 18px and counted characters per line
      in Chromium:

      ```text
      Georgia     94 to 97 characters
      Arial       83 to 91 characters
      system-ui   95 to 103 characters
      ```

      So treat `ch` as a ruler that grows with the font, not as a character count. If you
      want lines of about 65 characters, something near `45ch` is closer. Check a real
      paragraph in your real font.

      Readers also change text themselves. Some raise the browser's text size, some zoom,
      and some use extensions that widen spacing for easier reading. WCAG 2.2 success
      criterion 1.4.12, Text Spacing, asks that nothing is lost when a reader widens spacing
      to these amounts, all relative to the font size: line height 1.5 times, paragraph
      spacing 2 times, letter spacing 0.12 times and word spacing 0.16 times. That's a level AA requirement.

      Text that has room to grow passes it. The usual way to fail is a fixed `height` on a
      box of text. A card set to `height: 120px` looks fine until spacing grows, and then
      the last line spills out or gets clipped. Use `min-height` if the box needs a minimum, and let
      the content decide the rest.

      The same goes for sizes. Text in `rem` follows the reader's text-size setting, and a
      unitless `line-height` keeps lines in proportion. In our test, a 32px heading inside a
      box with `line-height: 1.5em` or `150%` inherited a squashed 24px, while `1.5` gave it
      48px.
  - title: Long words, ragged edges and headings
    body: |-
      A long web address or a product code with no spaces can't wrap, so it pushes past its
      box and can make a phone page scroll sideways. `overflow-wrap` lets the browser break
      such a word anywhere when nothing else fits. It has two values that look alike and
      behave differently inside a grid or a flex item:

      ```css
      .comment { overflow-wrap: anywhere; }
      ```

      In a 150px grid column, a long address with `overflow-wrap: break-word` still forced
      the column to 445px, while `anywhere` kept it at 150px. The difference is that
      `anywhere` also shrinks the word's smallest possible width, which is what grid and
      flex use to size tracks. Use `anywhere` for user content such as comments and chat
      messages.

      Headings have a different problem: a two-line heading often breaks with one lonely word
      on the second line. `text-wrap: balance` evens out the lines. In our test, a heading
      in a 500px box went from lines of 475px and 233px to 403px and 297px. It's meant for
      short text such as headings, not whole paragraphs. For paragraphs, `text-wrap: pretty`
      asks the browser to avoid a single short word on the last line, at a small cost in
      speed.

      Two more tools are worth knowing. `hyphens: auto` lets the browser hyphenate long words,
      but it needs the page's `lang` attribute, set in the HTML chapter, to know the
      language's rules. And `font-variant-numeric: tabular-nums` gives every digit the same
      width, so prices in a shopping cart line up in a column.
pitfalls:
  - '**Quoting the generic family.** `font-family: Georgia, "serif"` asks for a font named serif, which doesn''t exist, so the safety net is gone. Write generic families without quotes.'
  - '**A preload without `crossorigin`.** The browser fetches fonts in CORS mode, so a plain preload doesn''t match, gets thrown away and the font downloads twice. Add `crossorigin`, even for your own domain.'
  - '**Too many font files.** Four weights, two styles and a second family can mean eight downloads before the text settles. Use two or three files, or one variable font that holds every weight.'
  - '**Fixed heights on text.** A card with `height: 120px` clips or spills its text when the reader enlarges the text or widens its spacing. Use `min-height`, or no height at all.'
  - '**Trusting `ch` as a character count.** `65ch` holds 80 to 100 characters of prose in common fonts, because `ch` is the width of a wide digit. Measure a real paragraph and choose the width by eye.'
  - '**`line-height` with a unit.** `1.5em` or `150%` is worked out once and inherited as pixels, so large headings get cramped lines. Write a plain number such as `1.5`.'
verify:
  - lens: breaks
    check: '`line-height` is a plain number, never `em` or `px`, so headings of every size keep sensible spacing.'
  - lens: breaks
    check: 'The font stack ends in a fallback with similar widths and a generic family, so text still shows if the web font never arrives.'
  - lens: scales
    check: 'Only the font weights and styles the page uses are downloaded, in `woff2`, because every extra file delays the text.'
  - lens: tests
    check: 'The page is viewed with only the fallback font, to see how much the layout moves when the web font swaps in.'
interview:
  - question: How do you load web fonts without hurting performance?
    answer: >-
      I load as few font files as possible, in WOFF2, and I make the first screen readable
      before they arrive. Each weight and style is a separate download, so I limit the set,
      or use one variable font. I preload the one or two files the first screen needs, with
      `crossorigin` so the preload is used. `font-display: swap` shows text at once in a
      fallback. A fallback `@font-face` with `size-adjust` makes that fallback take the same
      room, so the swap causes little layout shift. The trade-off with `swap` is a
      visible change of font. If the brand font isn't essential, `optional` avoids the jump
      entirely, at the cost of some visitors never seeing the web font on a first visit.
  - question: Why should `line-height` usually be unitless?
    answer: >-
      A unitless `line-height` is inherited as a ratio, so every element multiplies it by its
      own font size. With `line-height: 1.5` on the body, 16px text gets 24px lines and a
      32px heading gets 48px lines. A value with a unit, like `1.5em` or `150%`, is turned
      into pixels once, on the element where it's written, and children inherit that fixed
      24px. A large heading that wraps then has its lines crammed together. A fixed value
      does have one use. When a component must line up exactly, such as an icon beside one
      line of text, a length can be intentional. For body text, a plain number is
      the safe default.
  - question: What makes text accessible from a CSS point of view?
    answer: >-
      Text must stay readable when the reader changes it, and it must contrast with its
      background. I size text in `rem`, so it follows the browser's text-size setting. I
      avoid fixed heights on text boxes, so content survives zoom and the spacing overrides
      in WCAG's Text Spacing criterion. I keep a comfortable measure and a unitless line
      height of about 1.5 for body text. For contrast I aim for at least 4.5 to 1 for normal
      text. I don't set font sizes in `vw` alone, because zoom stops enlarging them. The
      trade-off is design control: a layout that tolerates bigger text can't be pixel-exact,
      so I design components to grow rather than to fit an exact box.
