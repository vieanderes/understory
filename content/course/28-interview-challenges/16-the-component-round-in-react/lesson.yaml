    authors: W3C Web Accessibility Initiative
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/patterns/menu-button/
    note: The button's `aria-haspopup` and `aria-expanded`, and focus on the first item when it opens.
    primary: true
    verified: true
  - kind: spec
    title: Menu and Menubar Pattern
    authors: W3C Web Accessibility Initiative
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/patterns/menubar/
    note: Arrow keys with optional wrapping, and Escape returning focus to the menu button.
    verified: true

deepDive: |-
  **Talking it through.** Start with the markup and roles, then state, then keys, then
  focus. Say which you're skipping: typeahead by first letter, Home and End, and closing on
  a click outside are all in the APG pattern, and naming them shows you know the full job.

  **Why the focus effect survives Strict Mode.** In `ConfirmDelete` the effect reads
  `document.activeElement` before moving focus. Strict Mode runs setup, cleanup, setup.
  The cleanup hands focus back to the opener, so the second setup reads the opener again.
  An effect that's correct with cleanup is correct twice.

  **Native first, still.** A real `<dialog>` opened with `showModal()` traps focus and closes
  on Escape by itself. In React you open it from an effect with a ref. Many teams still
  hand-build dialogs for styling reasons, which is why the round asks you to manage focus.

  **Refs to many items.** `ref={(node) => { refs.current[i] = node; }}` fills an array.
  Keep the braces. Since React 19 a ref callback may return a cleanup function, and
  React's types reject one that returns anything else.

  **Testing it.** Query by role and name, as the tests here do. A test that passes with
  `getByRole('menuitem', { name: 'Delete' })` is accessible by construction.
