term: dependency injection
aka:
  - DI
short: Handing a piece of code the things it needs from outside, instead of letting it create them itself.
explain: |
  A class that creates its own database connection is welded to that database. Pass the
  connection in instead, and the caller decides: the real database in production, an
  in-memory fake in a test.

  It needn't involve a framework. A parameter or a constructor argument is dependency
  injection. Containers and decorators come later, if ever.
analogy: A torch that takes any AA batteries, instead of one with the battery soldered in.
example:
  language: ts
  code: |
    class Checkout {
      constructor(private payments: PaymentGateway) {}
    }

    new Checkout(new CardGateway()); // in production
    new Checkout(new FakeGateway()); // in tests
usage: Use dependency injection for the clock, so the test can set it to midnight.
