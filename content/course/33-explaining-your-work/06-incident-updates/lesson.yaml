    verified: false

deepDive: >-
  Many teams split the incident role in two. The **incident commander** coordinates the
  fix. A **communications lead** writes the updates, so the people fixing it aren't
  interrupted every ten minutes. On a small team that may be one person, but the jobs still
  differ.


  Updates usually go to more than one place: the incident channel for engineers, and a
  status page for customers. Write the customer version from the internal one, stakes first,
  as in Same idea, different listeners. Leave out internal names and anything that helps an
  attacker.


  The follow-up summary closes the incident: what happened, the impact, the cause as far as
  it's known, the fix and the actions. It isn't the review itself. The blameless review
  you met in Alerts and on-call comes later, and the summary links to it.
