deepDive: >-
  **Mixing values and updaters.** React works through the queue in order. With `count` at 0,
  `setCount(count + 5)` then `setCount((n) => n + 1)` gives 6: the first replaces the pending
  value with 5, the updater adds 1. A plain value after an updater replaces whatever was
  pending.


  **Batching everywhere.** Since React 18, updates inside a timeout, a promise or a native
  event listener are batched too. React never batches across separate user events, like two
  clicks. Each click is handled, and rendered, on its own.


  **Pure updaters.** In development, Strict Mode calls each updater twice to catch impure
  ones. An updater that pushes to an outside array pushes twice. Take the pending value and
  return the next, nothing else.
