term: hashing
aka:
  - hash
  - hash function
short: Turning data into a fixed-length fingerprint that can't be turned back into the original.
explain: |
  The same input always gives the same fingerprint, and a tiny change gives a completely
  different one. You can check for a match, but you can't run it backwards.

  That's why passwords are stored this way: the server compares fingerprints and never keeps
  the password. But fast hashes are wrong for passwords, because attackers can try billions
  of guesses a second. Use a slow password hash such as Argon2id or bcrypt, with a salt.
analogy: A fingerprint. It proves a match, but nobody can rebuild you from it.
example:
  language: js
  code: |
    // At sign-up: store the hash, never the password
    const stored = await argon2.hash(password);

    // At login: compare, never decrypt
    const ok = await argon2.verify(stored, attempt);
usage: Don't encrypt the passwords, use hashing; we never need them back.
twin:
  term: encryption
  difference: Hashing is one-way, so you can check a match but never get the original back. Encryption is two-way, so with the key you get the original back.
related:
  - salt
  - encryption
  - secret
  - hash-map
level: 2
lessons:
