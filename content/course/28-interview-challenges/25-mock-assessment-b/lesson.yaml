id: interview.mock-b
title: "Mock assessment B"
objective: "Sit a second timed three-task assessment on different patterns."
level: advanced
minutes: 90
assessment: true
concepts: [interview.expected-complexity, interview.stress-testing]
prerequisites: [interview.mock-a]
opening:
  text: >-
    You'll sit three new tasks in 90 minutes: brackets, a binary search and a route to
    optimise. Each states its complexity, so let that line pick the algorithm.

steps:
  - type: prose
    id: brief
    body: |-
      Three tasks, 90 minutes, scored on hidden tests.

      This time every task gives its **expected worst-case complexity**. Read it before
      you plan. The performance tests are sized so that anything slower times out.

      Once a fast version works, **stress test** it against a slow one on small inputs.
      **Run** shows what you `console.log`, so log what your `stressTest` finds. Delete it
      before you submit.

  - type: code-challenge
    id: task-brackets
    concept: interview.stress-testing
    difficulty: 2
    language: ts
    starter: brackets.starter.ts
    solution: brackets.solution.ts
    tests: brackets.tests.ts
    hidden: brackets.hidden.ts
    performance: brackets.performance.ts
    bruteForce: brackets.brute.ts
    timeLimitMs: 1500
    prompt: |-
      **Task 1: where the nesting breaks.** A template editor checks the brackets in a
      string `S` of N characters. `S` is **properly nested** in three cases. It is empty.
      It has the form "(U)", "[U]" or "{U}" with U properly nested. Or it has the form "VW"
      with V and W properly nested.

      Write a function:

      ```ts
      function firstBreak(S: string): number
      ```

      that returns `-1` if `S` is properly nested. Otherwise it returns the index of the
      first closing bracket that has no matching opening bracket. If there is no such
      bracket but some brackets are never closed, it returns N.

      For example, given `S = "{[()()]}"`, the function should return `-1`. Given
      `S = "([)()]"`, it should return `2`. Given `S = "(()"`, it should return `3`.

      Write an efficient algorithm for the following assumptions:

      - N is an integer within the range [0..200,000].
      - String S is made only of the characters "(", ")", "[", "]", "{" and "}".

      Expected worst-case time complexity is O(N).
    hints:
      - Each closing bracket must match the most recent bracket that is still open.
      - Most recent first means a stack.
      - Push each opening bracket. On a closing one, pop and compare the type. Check the stack is empty at the end.

  - type: code-challenge
    id: task-seasons
    concept: interview.expected-complexity
    difficulty: 4
    language: ts
    starter: seasons.starter.ts
    solution: seasons.solution.ts
    tests: seasons.tests.ts
    hidden: seasons.hidden.ts
    performance: seasons.performance.ts
    bruteForce: seasons.brute.ts
    timeLimitMs: 2000
    prompt: |-
      **Task 2: even seasons.** A podcast has N episodes in order. Episode I lasts A[I]
      minutes. They must be split into K seasons of consecutive episodes, keeping the
      order. A season may be empty. A season's length is the sum of its episodes, and an
      empty season lasts 0 minutes.

      Write a function:

      ```ts
      function largestSeason(K: number, A: number[]): number
      ```

      that returns the smallest possible length of the longest season.

      For example, given `K = 3` and `A = [20, 10, 30, 20, 20, 20, 20]`, the function
      should return `60`. One split is [20, 10, 30], [20, 20] and [20, 20].

      Write an efficient algorithm for the following assumptions:

      - N and K are integers within the range [1..100,000].
      - Each element of array A is an integer within the range [0..10,000].

      Expected worst-case time complexity is O(N * log(N * M)), where M is the largest
      element of A.
    hints:
      - The log in the complexity line points at a binary search. What could you search over?
      - Given a limit on season length, a greedy pass tells you how many seasons you need. A higher limit never needs more.
      - Binary search the smallest limit that fits in K seasons, between the longest episode and the total.

  - type: code-challenge
    id: task-stones
    concept: interview.stress-testing
    difficulty: 5
    language: ts
    starter: stones.starter.ts
    solution: stones.solution.ts
    tests: stones.tests.ts
    hidden: stones.hidden.ts
    performance: stones.performance.ts
    bruteForce: stones.brute.ts
    timeLimitMs: 2000
    prompt: |-
      **Task 3: stepping stones.** A path crosses a pond on N stones, numbered 0 to N - 1.
      Stone I carries A[I] points, which may be negative. You start on stone 0 and must
      finish on stone N - 1. Each jump moves forward by 1 to K stones.

      Your total is the sum of the points on every stone you land on, including the
      first and the last.

      Write a function:

      ```ts
      function bestRoute(A: number[], K: number): number
      ```

      that returns the highest total you can reach. If N is 1, return A[0].

      For example, given `A = [1, -2, 0, 9, -1, -2]` and `K = 3`, the function should
      return `8`. The route lands on stones 0, 2, 3 and 5.

      Write an efficient algorithm for the following assumptions:

      - N and K are integers within the range [1..100,000].
      - Each element of array A is an integer within the range [-10,000..10,000].

      Expected worst-case time complexity is O(N).
    hints:
      - The best total ending on stone I is A[I] plus the best total on one of the K stones before it.
      - That works in O(N * K). The O(N) line means the maximum of a sliding window must cost O(1).
      - Keep a deque of indices whose best totals fall from front to back. Drop the front when it leaves the window.

recap:
  - Read the complexity line first and let it name the algorithm.
  - Search over the answer when checking a guess is easier than finding it.
  - Stress test a fast solution against a slow one on small inputs.

recall:
  - id: card-log-hint
    concept: interview.expected-complexity
    front: A task's expected complexity is O(N log N). Which ideas does that suggest?
    back: >-
      Sorting first, or a binary search, over the input or over the answer.
  - id: card-linear-hint
    concept: interview.expected-complexity
    front: The limits say N up to 100,000 and the complexity line says O(N). What does that rule out?
    back: >-
      Any nested loop over the input. Even O(N log N) is often fine, but O(N²) is 10
      billion steps and times out.
  - id: card-stress-test
    concept: interview.stress-testing
    front: How does a stress test find a bug in a fast solution?
    back: >-
      It runs the fast solution and a slow one you trust on many small generated inputs.
      It stops at the first input where they disagree.
  - id: card-stress-size
    concept: interview.stress-testing
    front: Why does a stress test use small inputs?
    back: >-
      The slow solution must finish, and a small failing input can be traced by hand.

references:
  - kind: book
    title: "Competitive Programmer's Handbook"
    authors: Antti Laaksonen
    year: 2018
    venue: CSES
    url: https://cses.fi/book/book.pdf
    note: Sliding window minimum with a deque (8.3), and binary search (3.3).
    verified: true

deepDive: |-
  **Task 1, where the nesting breaks.** Push each opening bracket onto a stack. On a
  closing bracket, pop and compare. A mismatch or an empty stack returns that index. After
  the loop, a non-empty stack returns N. That is O(N) time and O(N) space.

  The slow version deletes "()", "[]" and "{}" pairs until none are left. You can trust it at a
  glance, which makes it a good stress-test partner. Rebuilding strings over and over makes it
  O(N²) or worse. The hidden traps are the empty string, a closing bracket at index 0,
  "(]" with the right count but the wrong type, and a break before an unclosed tail.

  **Task 2, even seasons.** This is binary search over the answer. Checking one limit is a
  greedy O(N) pass: start a new season when the next episode would overflow. The check is
  monotonic, so search between the longest episode and the total. That is O(N log S),
  where S is the total, at most 10^9.

  The slow version tries every limit upward from the longest episode. It is correct, and
  it is fine on small tests, but 100,000 long episodes need millions of tries. Traps: K
  larger than N, all zeros, and one long episode that sets the floor.

  **Task 3, stepping stones.** Let best[I] be the highest total ending on stone I. It is
  A[I] plus the maximum of best over the previous K stones. Computed directly that is
  O(N · K): 5 billion steps for N = 100,000 and K = 50,000. A monotonic deque keeps
  the window maximum at the front. Each index enters and leaves once, so the whole pass
  is O(N).

  Traps: all negative stones, where the best route jumps as far as it can. And K larger
  than N. The O(N · K) version is the perfect stress-test partner here: write it first,
  then compare on a few hundred small random paths.
