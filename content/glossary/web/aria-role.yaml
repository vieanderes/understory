term: role
aka: [ARIA role, role attribute]
short: The kind of thing an element is to assistive technology, such as button, link, heading or tab.
explain: |
  A screen reader announces what a thing is before what it's called: "button, Save". That
  "button" is the role. It tells people how to use it: press a button, follow a link, pick
  a tab.

  Native elements bring the right one. `role="..."` sets it by hand for custom widgets, and
  it's a promise. `role="button"` means Enter and Space must work, and you write that code
  yourself. States sit beside it, such as `aria-expanded="true"`.
analogy: The job title on a staff badge. It tells you what to ask that person for.
example:
  language: html
  code: |
    <button>Save</button>         <!-- role: button, for free -->
    <div role="tab" aria-selected="true" tabindex="0">
      Details
    </div>
usage: That div has role="button", but it can't be focused and ignores Enter.
twin:
  term: accessible-name
  difference: The role says what kind of control it is, such as a button. The accessible name says which one, such as "Delete task".
related: [accessible-name, aria, accessibility-tree, semantic-html]
level: 2
lessons: [design.accessibility-foundations, design.accessible-widgets]
