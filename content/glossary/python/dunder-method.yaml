term: dunder method
aka:
  - magic method
  - special method
short: A method named with two underscores on each side that Python calls for built-in operations.
explain: |
  How does `len(cart)` know what to do with your own `Cart` class? Or `a + b` with two of
  your `Money` objects? Python calls a method with a specially shaped name.

  `__len__` answers `len()`, `__eq__` answers `==`, `__repr__` gives the text you see when
  debugging, `__iter__` makes it loopable. "Dunder" is short for double underscore. You
  define them; you rarely call them directly. Define `__eq__` without `__hash__` and
  instances can no longer go in a set.
analogy: The standard sockets on a wall. Build your appliance with the right plug and it works with every outlet in the house.
example:
  language: python
  code: |
    class Cart:
        def __init__(self, items):
            self.items = items
        def __len__(self):
            return len(self.items)
        def __repr__(self):
            return f"Cart({len(self)} items)"

    len(Cart(["tea", "milk"]))   # 2
usage: Add a __repr__ dunder method, so the logs show the order id instead of a memory address.
