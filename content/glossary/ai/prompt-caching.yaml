term: prompt caching
aka: [prefix caching, cache breakpoint, cached input]
short: Reusing a model's work on a long, identical start of a prompt, so repeat requests cost less.
explain: |
  Many requests start with the same long text: instructions, tool definitions, a policy
  document. The provider can store its work on that opening part and reuse it. Those
  input tokens then cost a fraction and arrive faster.

  The opening must match exactly, from the first byte. Put stable content first and
  anything per user or per request after it. A timestamp at the top quietly breaks it for
  every call.
analogy: A teacher who photocopies the worksheet once and only writes each pupil's name by hand.
usage: Move the date below the tool list; it's breaking prompt caching on every request.
twin:
  term: semantic-cache
  difference: Prompt caching still calls the model, only cheaper. A semantic cache skips the model and returns an old answer to a similar question.
related: [cache, token, time-to-first-token, context-window]
level: 2
lessons: [aisys.cost-and-latency]
