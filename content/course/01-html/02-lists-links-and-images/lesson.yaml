id: html.everyday-elements
title: Lists, links and images
objective: Build lists, link pages together and add images with useful `alt` text.
level: essential
minutes: 10
concepts: [html.lists, html.attributes, html.alt-text]
prerequisites: [html.first-page]
opening:
  text: >-
    You'll add lists, links and pictures, the parts almost every page is made of. You'll also
    make sure people who can't see your images still know what's in them.

steps:
  - type: prose
    id: lists
    body: |-
      Remember the paragraph that squashed three lines into one? A list fixes that:

      ```html
      <ul>
        <li>Eggs</li>
        <li>Flour</li>
      </ul>
      ```

      `ul` is a bullet list, and `li` is one item in it. For steps that must go in order, use
      `ol` instead. It numbers the items for you.

  - type: playground
    id: build-shopping-list
    concept: html.lists
    difficulty: 1
    prompt: >-
      Add two more things to the shopping list. Each one needs its own `li`.
    html: |
      <h1>Shopping</h1>
      <ul>
        <li>Eggs</li>
      </ul>
    editable: [html]
    checks:
      - label: The list has three items
        selector: ul li
        count: 3
    solution:
      html: |
        <h1>Shopping</h1>
        <ul>
          <li>Eggs</li>
          <li>Flour</li>
          <li>Milk</li>
        </ul>
    hints:
      - New items go inside the `ul`, before `</ul>`.
      - Copy the `Eggs` line and change the words.
      - '`<li>Flour</li>` is one whole item.'

  - type: multiple-choice
    id: pick-ordered-list
    concept: html.lists
    difficulty: 1
    question: A recipe's steps must be followed in order. Which list suits them?
    choices:
      - text: '`ol`, a numbered list'
        correct: true
        feedback: >-
          Yes. The order matters, and `ol` numbers each step.
      - text: '`ul`, a bullet list'
        feedback: >-
          Bullets work when order doesn't matter, like a shopping list. Steps need numbers.
      - text: Several `p` elements
        feedback: >-
          It would show, but nothing says the lines belong together or in order. A list does.

  - type: prose
    id: attributes-and-links
    body: |-
      A start tag can carry extra settings, called **attributes**. Each is a name, an equals
      sign and a value in quotes. A link uses one:

      ```html
      <a href="https://example.com/menu">See the menu</a>
      ```

      `a` makes a link. `href` says where it goes. The content is the text people click.

  - type: predict-output
    id: predict-link-text
    concept: html.attributes
    difficulty: 1
    language: html
    code: |
      <p>Hungry? <a href="https://example.com/menu">See the menu</a></p>
    question: Which words can people click?
    choices:
      - text: See the menu
        correct: true
        feedback: >-
          Right. The content of the `a` is the link text.
      - text: '`https://example.com/menu`'
        feedback: >-
          That's where the link goes. The address stays hidden in the attribute.
      - text: The whole paragraph
        feedback: >-
          Only what's inside the `a` is a link. "Hungry?" stays plain text.

  - type: playground
    id: build-a-link
    concept: html.attributes
    difficulty: 2
    prompt: >-
      Turn the word "map" into a link to `https://example.com/map`. Wrap it in an `a` with an
      `href`, and watch it turn into a link.
    html: |
      <h1>Harbour walk</h1>
      <p>Start at the pier. Here's the map.</p>
    editable: [html]
    checks:
      - label: The page has one link
        selector: a
        count: 1
      - label: The link goes to the map
        selector: a
        attribute: { name: href, value: 'https://example.com/map' }
      - label: The link text is "map"
        selector: a
        text: map
    solution:
      html: |
        <h1>Harbour walk</h1>
        <p>Start at the pier. Here's the <a href="https://example.com/map">map</a>.</p>
    hints:
      - The link goes around the word, inside the paragraph.
      - The start tag carries the address, `<a href="...">`.
      - Close it straight after the word with `</a>`.

  - type: prose
    id: images-and-alt
    body: |-
      An image uses the `img` element:

      ```html
      <img src="lighthouse.jpg" alt="A red lighthouse on a rocky shore">
      ```

      `src` names the picture file. It has no end tag, because there's no content. `alt` is
      the **alt text**: words that stand in for the picture. Screen readers, apps that read a
      page aloud, speak it. Browsers show it when the file won't load.

  - type: bug-hunt
    id: hunt-image-href
    concept: html.attributes
    difficulty: 2
    language: html
    code: |
      <h1>Harbour walk</h1>
      <p>The lighthouse is at the end of the pier.</p>
      <img href="lighthouse.jpg" alt="A red lighthouse on a rocky shore">
    prompt: The file `lighthouse.jpg` exists, but no picture appears. Tap the line at fault.
    lines: [3]
    reasons:
      - text: An image takes its file from `src`, not `href`
        correct: true
        feedback: >-
          Yes. `href` is for links. An `img` only reads `src`.
      - text: The `img` needs an end tag
        feedback: >-
          `img` has no content, so it never gets an end tag. The attribute name is the problem.
      - text: The `alt` text is too long
        feedback: >-
          Alt text can be a full sentence. It doesn't stop a picture loading.
    fix: |
      <h1>Harbour walk</h1>
      <p>The lighthouse is at the end of the pier.</p>
      <img src="lighthouse.jpg" alt="A red lighthouse on a rocky shore">

  - type: playground
    id: add-alt-text
    concept: html.alt-text
    difficulty: 2
    prompt: >-
      This picture has no `alt`, so some screen readers would read out "IMG_4032.jpg". The
      file is missing too. Describe the photo, a bowl of tomato soup, and watch your words
      take its place.
    html: |
      <h1>Tomato soup</h1>
      <img src="IMG_4032.jpg">
    editable: [html]
    checks:
      - label: The image has alt text that isn't empty
        selector: 'img[alt]:not([alt=""])'
        count: 1
      - label: The alt text mentions soup
        selector: 'img[alt*="soup" i]'
        count: 1
    solution:
      html: |
        <h1>Tomato soup</h1>
        <img src="IMG_4032.jpg" alt="A bowl of tomato soup">
    hints:
      - The new attribute goes inside the `img` start tag, after `src`.
      - It's written like `src`, a name, `=` and a value in quotes.
      - Try `alt="A bowl of tomato soup"`.

  - type: explain-back
    id: explain-why-alt
    concept: html.alt-text
    difficulty: 3
    audience: non-technical
    kind: explain
    prompt: >-
      The shop owner, who doesn't code, asks why every photo on the site needs a short
      description. The photos look fine. Explain it in plain words.
    rubric:
      - Some people use a screen reader, which reads the description aloud instead of showing the photo.
      - Without one, some screen readers read out the file name, which means nothing.
      - The description also shows in the photo's place when the file fails to load.
    modelAnswer: >-
      Not everyone sees the photos. Some people use a screen reader, an app that reads the page
      aloud. It reads the description instead of the photo. Without one, some read out the file
      name, like "IMG_4032.jpg", which tells a customer nothing. And if a photo fails to load,
      the description still shows in its place.

recap:
  - Group items in a `ul` or a numbered `ol`.
  - Add a link with `a` and `href`, and an image with `img` and `src`.
  - Describe every meaningful picture in its `alt` text.

recall:
  - id: card-ul-and-ol
    concept: html.lists
    front: When do you use `ol` instead of `ul`?
    back: >-
      When the order matters, like the steps of a recipe. `ol` numbers the items, and `ul`
      shows bullets.
  - id: card-attribute-shape
    concept: html.attributes
    front: How is an attribute written, and where does it go?
    back: >-
      Inside the start tag, as a name, `=` and a value in quotes, like `href="/menu"`.
  - id: card-src-versus-href
    concept: html.attributes
    front: Which attribute names the file for an `img`, and which gives a link its address?
    back: >-
      `src` for an `img`, and `href` for an `a`.
  - id: card-alt-purpose
    concept: html.alt-text
    front: Who reads an image's `alt` text?
    back: >-
      Screen reader users hear it, and everyone sees it when the image fails to load.

