id: aisys
number: 21
title: "AI systems in production"
summary: "The engineering around a model once it serves real users: the pipeline as a whole, deeper retrieval, classifiers and thresholds at decision points, agent harnesses, guardrails, PII, evals, prompts as code, cost, latency and failures, MCP servers, and coding agents."
why: "A demo needs a prompt, but a product needs routing, guardrails, evals and budgets around it."
youCanBuild: "A support pipeline where code owns the flow: a classifier routes each ticket, a guarded agent acts, humans approve risky steps, and evals gate every prompt change."
concepts:
  - id: aisys.production-pipeline
    title: "The production pipeline"
    summary: "Code owns the flow around the model: it redacts personal data, routes with a classifier, runs a capped agent, guards its actions, asks people when unsure, traces each call, and gates every change with evals."
  - id: aisys.demo-failure-modes
    title: "Where demos break"
    summary: "A demo that lets one call decide everything breaks on real traffic: free text triggers actions, personal data reaches logs, agents loop, prompt edits regress quietly and costs run away."
  - id: aisys.chunking-strategies
    title: "Chunking strategies"
    summary: "Fixed-size, structure-aware and semantic chunking trade simplicity against keeping each passage about one thing, and overlap or added context helps chunks stand alone."
  - id: aisys.reranking
    title: "Reranking"
    summary: "A cross-encoder scores each query and passage pair together, so a cheap first search can fetch many candidates and the reranker keeps the best few."
  - id: aisys.query-rewriting
    title: "Query rewriting"
    summary: "A model turns a vague or conversational question into one or more precise search queries before retrieval."
  - id: aisys.metadata-filtering
    title: "Metadata filtering"
    summary: "Filters on fields such as tenant, date or permission narrow the search before ranking, which improves precision and enforces access."
  - id: aisys.mcp-primitives
    title: "Tools, resources and prompts"
    summary: "An MCP server offers tools the model can call, resources the application can read, and prompt templates the user can pick."
  - id: aisys.mcp-transports
    title: "Transports"
    summary: "stdio suits a local server started by the client, and Streamable HTTP suits a remote one shared by many clients."
  - id: aisys.mcp-security
    title: "Securing an MCP server"
    summary: "A remote server authorises with OAuth, scopes each tool to least privilege, validates every argument, and treats tool descriptions from others as untrusted."
  - id: aisys.workflows-vs-agents
    title: "Workflows and agents"
    summary: "A workflow runs model calls along paths fixed in code, while an agent lets the model choose the next step, so use an agent only where the path cannot be known ahead."
  - id: aisys.step-budgets
    title: "Step and spend budgets"
    summary: "The harness caps turns, tokens, time and money per task, and stops with a clear state when a cap is reached."
  - id: aisys.loop-detection
    title: "Loop detection"
    summary: "Repeated identical tool calls, no new information across turns, or a classifier's stuck score trigger the harness to cut the loop."
  - id: aisys.harness-state
    title: "Harness state"
    summary: "The harness, not the model, owns the task state, the step count and the history, so a run can be inspected, resumed or replayed."
  - id: aisys.classifiers
    title: "What a classifier is"
    summary: "A model that picks one label from a fixed list and says how sure it is, from a prompted LLM limited to the labels, a small model trained on embeddings, or a fine-tuned small model."
  - id: aisys.decision-points
    title: "Decision points"
    summary: "A pipeline has forks where one fuzzy question decides the branch, such as which category, how urgent, or whether a task is done."
  - id: aisys.classifier-outputs
    title: "Choice, score and yes-or-no outputs"
    summary: "A classifier answers a fork as a choice among labels, a score on a scale, or a yes-or-no, each with a probability your code can compare."
  - id: aisys.classifier-routing
    title: "Routing with classifiers"
    summary: "A small classifier call of tens of milliseconds replaces several large-model calls for triage, document routing, next-step choice and real-time decisions."
  - id: aisys.confidence-bands
    title: "Confidence bands"
    summary: "Above a high threshold the system acts, between two thresholds a human decides, and below the low one it refuses or asks."
  - id: aisys.precision-recall-trade-off
    title: "The precision-recall trade-off"
    summary: "Raising a threshold makes automatic actions more often right but sends more cases to people, so the cut-off follows the cost of each kind of error."
  - id: aisys.calibration
    title: "Calibration"
    summary: "A calibrated score of 0.9 is right about nine times in ten, which you check by bucketing scores against labelled outcomes."
  - id: aisys.guardrails
    title: "Guardrails"
    summary: "Deterministic checks and classifiers around the model block unsafe input, invalid output and disallowed actions, independent of the prompt."
  - id: aisys.human-in-the-loop
    title: "Human in the loop"
    summary: "An irreversible or high-risk action waits for a person to approve it, with the proposed action, the reason and the risk shown."
  - id: aisys.grounding-checks
    title: "Grounding checks"
    summary: "Before an answer ships, a check confirms its claims appear in the retrieved sources, and a weak score triggers a retry or a warning."
  - id: aisys.content-moderation
    title: "Content moderation"
    summary: "Every message is scored for harm categories by meaning rather than keywords, fast enough to run on all traffic."
  - id: aisys.pii
    title: "Personally identifiable information"
    summary: "PII is any data that identifies a person alone or combined, such as a name, email, phone number, address, IBAN, ID number or IP address."
  - id: aisys.pii-redaction
    title: "Detection and redaction"
    summary: "Patterns catch structured PII, entity recognition catches names and places, and redaction replaces them with placeholders before text leaves your system."
  - id: aisys.ai-data-retention
    title: "Retention and processing"
    summary: "You record what personal data goes to which provider, why, and for how long, and you honour deletion across logs, traces and eval sets."
  - id: aisys.eval-set-building
    title: "Building eval sets"
    summary: "Real failures from production, edge cases and adversarial inputs are labelled and added, so the set tracks what users actually send."
  - id: aisys.judge-calibration
    title: "Calibrating an LLM judge"
    summary: "A judge is trusted only after its verdicts agree with human labels on a sample, measured with agreement rates, and rechecked when the prompt or model changes."
  - id: aisys.pairwise-comparison
    title: "Pairwise comparison"
    summary: "Asking which of two outputs is better is more reliable than an absolute score, as long as the order is swapped to cancel position bias."
  - id: aisys.online-evals
    title: "Online evals"
    summary: "Sampled production traffic is scored continuously, alongside user signals such as edits, retries and thumbs, to catch what offline sets miss."
  - id: aisys.prompt-versioning
    title: "Versioning prompts"
    summary: "Prompts live in the repository with the code and model settings, are reviewed like code, and every response records the version that produced it."
  - id: aisys.eval-gates-in-ci
    title: "Eval gates in CI"
    summary: "A pull request that changes a prompt, model or retrieval setting runs the eval suite and fails if a score drops below its threshold."
  - id: aisys.llm-tracing
    title: "Tracing model calls"
    summary: "Each request records its prompt version, inputs, retrieved context, tool calls, tokens, cost and latency as spans, for example with OpenTelemetry."
  - id: aisys.quality-monitoring
    title: "Monitoring quality"
    summary: "Dashboards track eval scores, refusal rates, user feedback and drift over time, with alerts like any other service level."
  - id: aisys.token-budgets
    title: "Token budgets"
    summary: "Cost follows input, cached and output tokens times the model's rates, so each feature gets a token budget per request and per user, and a stable cached prefix keeps repeat calls cheap."
  - id: aisys.latency-budgets
    title: "Latency budgets"
    summary: "Time to first token and total time are split across retrieval, classification, generation and tools, and each step gets its share."
  - id: aisys.model-routing
    title: "Model routing"
    summary: "Easy requests go to a small, fast model and hard ones to a large model, chosen by rules or a classifier."
  - id: aisys.fallbacks
    title: "Fallbacks and circuit breakers"
    summary: "When a provider is busy, down or slow, the system falls back by plan to another model or a smaller answer, and a circuit breaker stops calling a dependency that keeps failing."
  - id: aisys.agent-context-files
    title: "Context files"
    summary: "A file such as AGENTS.md tells a coding agent the commands, conventions and rules of a repository, so each session starts informed."
  - id: aisys.agent-feedback-loops
    title: "Tight feedback loops"
    summary: "Tests, type checks and linters that the agent runs after each change catch its mistakes in seconds rather than in review."
  - id: aisys.owning-generated-code
    title: "Owning generated code"
    summary: "The engineer who merges a change owns its correctness, tests and design, whoever or whatever typed it."
  - id: aisys.executable-instructions
    title: "Instructions as checkable rules"
    summary: "An instruction file for agents holds rules and a definition of done that a diff or a command can check, not wishes such as \"be careful\"."
  - id: aisys.scope-contracts
    title: "Scope contracts"
    summary: "A short file per task names the goal, the paths the agent may and may not change, the commands that prove it's done, and what needs asking first."
  - id: aisys.verification-gates
    title: "Verification gates and review"
    summary: "A script decides whether a task is done by reading real exit codes and checking the diff against the scope contract, then a reviewer with fresh context reads the change."
  - id: aisys.session-handoff
    title: "Handoff between sessions"
    summary: "Each session ends with a note of what changed, what was tried and failed, what's still failing and the one next action, so the next session starts at once."
  - id: aisys.outcomes-and-metrics
    title: "Outcomes and success metrics"
    summary: "A feature is framed by the change it should cause, with a metric, baseline, target and guardrail set before building."
  - id: aisys.assumption-mapping
    title: "Mapping assumptions and risk"
    summary: "The bets a build rests on are written as claims that could be false and ranked by impact and uncertainty, so the riskiest and least reversible are tested first."
  - id: aisys.smallest-testable-slice
    title: "The smallest testable slice"
    summary: "The first build runs end to end through the riskiest assumption on real data, with little else and a stop rule."
  - id: aisys.judgement-preserving-specs
    title: "Specs that preserve judgement"
    summary: "A spec fixes the outcome, invariants, non-goals and proof, and marks each decision as locked, bounded or delegated."
