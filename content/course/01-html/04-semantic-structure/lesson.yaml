id: html.semantic-structure
title: Semantic structure
objective: Choose buttons, landmarks and heading levels so every visitor can find their way.
level: essential
minutes: 10
concepts: [html.semantic-elements, html.landmarks, html.headings, html.accessibility-tree]
prerequisites: [html.the-dom]
opening:
  text: >-
    You'll pick the elements that tell a screen reader what each part of a page is. A page
    that looks right can still be a maze for someone who can't see it.

steps:
  - type: prose
    id: second-tree
    body: >-
      A screen reader doesn't see the screen. From the DOM, the browser builds it a list of
      what's on the page: the **accessibility tree**. Each entry has a role, like heading,
      button or link, and a name, like "Borrow".


      The role comes from the tag. A `div` is a plain box with no role. A `class` attribute is
      a label for styling, and it adds no role either.

  - type: predict-output
    id: predict-div-page
    concept: html.accessibility-tree
    difficulty: 1
    language: html
    code: |
      <div class="heading">The Hobbit</div>
      <div class="button">Borrow</div>
    question: What does a screen reader announce?
    choices:
      - text: Two pieces of plain text
        correct: true
        feedback: >-
          Right. A `div` has no role, whatever its class says.
      - text: A heading, then a button
        feedback: >-
          Most people pick this. But a class is only a label for styling. The browser never
          reads meaning into it.
      - text: Nothing, because `div` elements are hidden
        feedback: >-
          The text still reaches the screen reader. What's lost is what each part is.

  - type: prose
    id: semantic-elements
    body: >-
      A **semantic element** is one whose tag says what it is. `button` is the clearest case.
      A screen reader says "button". The Tab key reaches it, and Enter presses it.


      A `div` styled to look like a button gets none of that. You'd have to rebuild each part
      with JavaScript, and people often miss one.

  - type: multiple-choice
    id: pick-buy-control
    concept: html.semantic-elements
    difficulty: 2
    language: html
    code: |
      <div class="button">Borrow</div>
    question: Keyboard users can't reach "Borrow" with Tab. Which markup fixes it?
    choices:
      - text: '`<button>Borrow</button>`'
        correct: true
        feedback: >-
          Yes. A `button` has the role, takes focus and answers Enter.
      - text: '`<p class="button">Borrow</p>`'
        feedback: >-
          A paragraph is text, whatever its class. It has no button role and takes no focus.
      - text: '`<a>Borrow</a>`'
        feedback: >-
          An `a` without `href` isn't a link at all. It takes no focus, so Tab skips it too.

  - type: prose
    id: landmarks-and-scope
    body: >-
      Most pages share a shape: a top bar, a menu, the main content, a footer. HTML has an
      element for each: `header`, `nav`, `main` and `footer`.


      Screen reader users can jump straight to any of them, so they're called **landmarks**.
      A page has one `main`: the part that's unique to that page.

  - type: playground
    id: build-landmarks
    concept: html.landmarks
    difficulty: 2
    prompt: >-
      Every region here is a `div`, so a screen reader sees no landmarks. Swap each `div` for
      `header`, `nav`, `main` or `footer`. The page looks the same.
    html: |
      <div class="top">City Library</div>
      <div class="menu">
        <a href="/books">Books</a>
        <a href="/events">Events</a>
      </div>
      <div class="content">
        <h1>Welcome</h1>
        <p>Open every day from 9.</p>
      </div>
      <div class="bottom">Contact us</div>
    editable: [html]
    showTree: true
    checks:
      - label: The top bar is a `header`
        selector: header
        text: City Library
      - label: The links sit in a `nav`
        selector: nav a
        count: 2
      - label: The content is in `main`
        selector: main h1
        count: 1
      - label: The last line is a `footer`
        selector: footer
        text: Contact us
      - label: No `div` is left
        selector: div
        count: 0
    solution:
      html: |
        <header>City Library</header>
        <nav>
          <a href="/books">Books</a>
          <a href="/events">Events</a>
        </nav>
        <main>
          <h1>Welcome</h1>
          <p>Open every day from 9.</p>
        </main>
        <footer>Contact us</footer>
    hints:
      - The class names hint at each region's job.
      - Change both the start tag and the end tag of each `div`.
      - '`<div class="top">` becomes `<header>`, and its `</div>` becomes `</header>`.'

  - type: prose
    id: headings-outline
    body: >-
      Headings form the outline of a page. Screen reader users often list them, then jump to
      the one they want.


      So choose the level by position, not size. An `h3` belongs under an `h2`, like a
      subsection. Bold text that looks like a heading isn't one, so it's missing from the list.

  - type: playground
    id: fix-heading-levels
    concept: html.headings
    difficulty: 2
    prompt: >-
      Fiction is part of New books, so it should be one level below it. Opening hours is its
      own section, but it's only bold text. Fix both.
    html: |
      <h1>City Library</h1>
      <h2>New books</h2>
      <h4>Fiction</h4>
      <p>Twelve new novels this week.</p>
      <p><strong>Opening hours</strong></p>
      <p>Every day from 9.</p>
    editable: [html]
    checks:
      - label: Fiction is an `h3`
        selector: h3
        text: Fiction
      - label: No level is skipped
        selector: h4
        count: 0
      - label: Opening hours is an `h2`
        selector: 'h2:nth-of-type(2)'
        text: Opening hours
      - label: No bold text stands in for a heading
        selector: strong
        count: 0
    solution:
      html: |
        <h1>City Library</h1>
        <h2>New books</h2>
        <h3>Fiction</h3>
        <p>Twelve new novels this week.</p>
        <h2>Opening hours</h2>
        <p>Every day from 9.</p>
    hints:
      - One heading skips a level, and one line only looks like a heading.
      - Under an `h2`, the next level down is `h3`.
      - Replace the whole `p` and `strong` around Opening hours with an `h2`.

  - type: bug-hunt
    id: hunt-unnamed-button
    concept: html.accessibility-tree
    difficulty: 3
    language: html
    code: |
      <ul>
        <li>
          The Hobbit
          <button>
            <img src="/icons/bin.svg" alt="">
          </button>
        </li>
      </ul>
    prompt: >-
      The button shows a bin icon, and it removes the book from a list. A screen reader says
      only "button". Tap the line at fault.
    lines: [5]
    reasons:
      - text: The empty `alt` leaves the button with no name
        correct: true
        feedback: >-
          Right. The icon is the button's only content, so it needs text like "Remove".
      - text: A `button` can't hold an image
        feedback: >-
          A `button` may hold an image. Its `alt` text then becomes the button's name.
      - text: The button needs a `class`
        feedback: >-
          A class only helps styling. The screen reader needs a name, and there's none.
    fix: |
      <ul>
        <li>
          The Hobbit
          <button>
            <img src="/icons/bin.svg" alt="Remove">
          </button>
        </li>
      </ul>

  - type: explain-back
    id: explain-missing-button
    concept: html.accessibility-tree
    difficulty: 4
    prompt: >-
      A sighted user clicks a styled `div` that says "Borrow". Why can't a screen reader user
      find that button?
    rubric:
      - A screen reader reads the accessibility tree, not the pixels.
      - The role comes from the element, and a `div` has no role, whatever its class or style.
      - A `button` element brings the role, a name from its text, and keyboard focus.
    modelAnswer: >-
      A screen reader doesn't see the screen. It reads the accessibility tree, which the
      browser builds from the DOM. Each entry's role comes from its element, and styling adds
      nothing. So the `div` is read as plain text, "Borrow". A `button` element has the button
      role, takes its name from its text and takes focus.

recap:
  - Explain why a screen reader hears roles and names, not looks.
  - Mark up a page with `header`, `nav`, `main` and `footer`.
  - Pick heading levels by structure, and use `button` for buttons.

recall:
  - id: card-tree-contents
    concept: html.accessibility-tree
    front: What does each entry in the accessibility tree hold?
    back: >-
      A role, such as button or heading, and a name, such as "Borrow".
  - id: card-div-button
    concept: html.semantic-elements
    front: What does a `button` give you that a styled `div` doesn't?
    back: >-
      The button role, focus with the Tab key, and presses with Enter and Space.
  - id: card-four-landmarks
    concept: html.landmarks
    front: Which four elements mark the main regions of a page?
    back: >-
      `header`, `nav`, `main` and `footer`. Screen reader users can jump to each one.
  - id: card-heading-level
    concept: html.headings
    front: What should decide which heading level you use?
    back: >-
      Its place in the page's structure, one level below its parent heading. Never how big the
      text should look.

references:
  - kind: docs
    title: Structuring documents
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Structuring_documents
    note: '`header`, `nav`, `main`, `footer` and when to use each.'
    primary: true
    verified: true
  - kind: docs
    title: 'HTML: A good basis for accessibility'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
    note: Why a real `button` beats a styled `div`, and how screen readers use headings.
    primary: true
    verified: true
  - kind: spec
    title: 'HTML Standard: Sections'
    authors: WHATWG
    venue: WHATWG
    url: https://html.spec.whatwg.org/multipage/sections.html
    note: Defines `article`, `section`, `nav`, `aside`, `h1` to `h6`, `header` and `footer`.
    verified: true
  - kind: docs
    title: Landmark Regions
    authors: W3C WAI
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/
    note: When to use each landmark and how to label two of the same kind.
    verified: true

deepDive: >-
  Each landmark element has an ARIA role behind it: `header` is banner, `nav` is navigation,
  `main` is main and `footer` is contentinfo. A `header` or `footer` inside an `article` or
  `section` belongs to that part, so it isn't a page landmark.


  A `role` attribute can give a `div` a role by hand, as in `role="button"`. It changes what
  the screen reader hears and nothing else. Focus and keys still need script, which is why
  the first rule of ARIA is to prefer the native element.


  `aria-label` names an element by hand, and it wins over the element's own text. It suits
  an icon button with no text.


  `article` marks a piece that makes sense on its own, like a post or a product card.
  `section` groups a themed part of a page, and normally starts with a heading. `aside`
  holds related but separate content.


  Search engines read headings too. A clear outline helps them understand what the page is
  about.
