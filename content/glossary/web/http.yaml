term: HTTP
aka:
  - Hypertext Transfer Protocol
  - HTTPS
short: The agreed set of rules a browser and a server use to ask for things and answer.
explain: |
  A browser and a server are strangers. To talk, they need a shared script: who speaks
  first, what a question looks like, how an answer starts. That script is HTTP.

  Every exchange is one **request** and one **response**. Both are text with a start line, some headers and an optional body. The protocol keeps no memory between requests,
  which is why cookies and tokens exist. HTTPS is the same conversation inside a TLS
  connection, so nobody on the way can read or change it.
analogy: Ordering at a café counter. You say what you want in a set way, and the barista answers in a set way, every single time.
example:
  language: http
  code: |
    GET /books/42 HTTP/1.1
    Host: library.example
    Accept: application/json

    HTTP/1.1 200 OK
    Content-Type: application/json

    {"id": 42, "title": "Tide Tables"}
usage: It's plain HTTP between the load balancer and the app, so keep that network private.
twin:
  term: rest
  difference: HTTP is the protocol, the actual wire format of requests and responses. REST is a style for designing an API on top of it, and plenty of HTTP APIs aren't RESTful at all.
