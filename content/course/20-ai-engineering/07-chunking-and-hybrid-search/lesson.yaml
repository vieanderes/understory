id: ai.chunking-and-hybrid
title: Chunking and hybrid search
objective: "Split documents into overlapping chunks, and combine keyword and vector search so exact codes and paraphrases both match."
level: advanced
minutes: 10
concepts: [ai.chunking, ai.hybrid-search]
prerequisites: [ai.embeddings]
opening:
  text: >-
    You'll cut a long handbook into pieces search can find, and catch exact error codes
    as well as paraphrases. Real documents need both.

steps:
  - type: prose
    id: why-chunk
    body: >-
      Embed a 40-page handbook as one vector, and it means "a bit of everything". Nothing
      matches it well.


      So you split documents into **chunks**, often a few hundred words each, and embed each
      one. Too small, and a chunk loses its context: "It takes five days" what does? Too
      big, and it blurs again.

  - type: prose
    id: overlap
    body: |-
      A cut can land mid-thought. So neighbouring chunks share a few words, an **overlap**,
      and every sentence is whole in at least one chunk:

      ```python
      words = "one two three four five six seven".split()
      # size 4, overlap 1:
      # "one two three four"   "four five six seven"
      ```

      `split()` turns text into a list of words, and `" ".join(words)` glues them back,
      like `split` and `join` in JavaScript.

  - type: ai-review
    id: review-lost-tail
    concept: ai.chunking
    difficulty: 2
    language: python
    request: Split each help article into chunks of 200 words, overlapping by 20.
    flawClass: edge-case
    code: |
      def chunk_article(text):
          words = text.split()
          chunks = []
          for start in range(0, len(words) - 200, 180):
              chunks.append(" ".join(words[start:start + 200]))
          return chunks
    prompt: >-
      An assistant wrote this. Search never finds anything from the end of an article, and
      short articles vanish entirely. Tap the line at fault.
    lines: [4]
    reasons:
      - text: The range stops before the last, shorter chunk
        correct: true
        feedback: >-
          Yes. `len(words) - 200` cuts the tail off. Under 200 words, there's no chunk at all.
      - text: The step should be 200, not 180
        feedback: >-
          180 is right for an overlap of 20. The range ends too early.
      - text: '`join` loses the punctuation'
        feedback: >-
          `split` keeps punctuation attached to the words. Nothing is lost there.
    fix: |
      def chunk_article(text):
          words = text.split()
          chunks = []
          for start in range(0, len(words), 180):
              chunks.append(" ".join(words[start:start + 200]))
              if start + 200 >= len(words):
                  break
          return chunks

  - type: code-challenge
    id: write-chunk-words
    concept: ai.chunking
    difficulty: 3
    language: python
    starter: chunk.starter.py
    solution: chunk.solution.py
    tests: chunk.tests.py
    prompt: >-
      Write `chunk_words(text, size, overlap)`. Return a list of chunks of `size` words, each
      starting `size - overlap` words after the last. Keep the last chunk even if it's
      shorter, and stop once a chunk reaches the end.


      Empty text gives `[]`. Raise `ValueError` if `overlap` isn't at least 0 and less than
      `size`. Example: ten words, size 4, overlap 1, gives three chunks.
    hints:
      - Keep a `start` position, and move it on by `size - overlap` each time.
      - '`words[start:start + size]` is one chunk. A slice past the end is shorter.'
      - 'Loop `while start < len(words):`, and `break` once `start + size >= len(words)`.'

  - type: prose
    id: keyword-misses
    body: >-
      Vector search matches meaning. It's poor at exact strings: an error code like
      `E-4417`, a product number, a surname. To an embedding, `E-4417` and `E-4471` look
      almost the same.


      **Keyword search** is the opposite. It finds exact words, ranked by how rare and
      frequent they are, but misses paraphrases. **Hybrid search** runs both and merges the
      two rankings.

  - type: bug-hunt
    id: hunt-vector-only
    concept: ai.hybrid-search
    difficulty: 2
    language: python
    code: |
      def search(question):
          query_vector = embed([question])[0]
          return top_k(query_vector, stored_chunks, 5)

      search("What does error E-4417 mean?")
      # returns: "Error E-4471: printer offline", "Common errors", ...
    prompt: >-
      A user searched for an exact error code and got the wrong one. Tap the line that needs
      to change.
    lines: [3]
    reasons:
      - text: Only vector search runs, which blurs exact codes
        correct: true
        feedback: >-
          Right. Add a keyword search, and merge both rankings.
      - text: '`k` of 5 is too small'
        feedback: >-
          The right chunk may not be near the top at all. More results won't fix that.
      - text: The question should be shorter
        feedback: >-
          The code itself is what gets blurred, however short the question.
    fix: |
      def search(question):
          query_vector = embed([question])[0]
          by_meaning = top_k(query_vector, stored_chunks, 20)
          by_words = keyword_search(question, stored_chunks, 20)
          return merge(by_words, by_meaning)[:5]

  - type: prose
    id: merging
    body: >-
      How do you merge two ranked lists? A common way is **reciprocal rank fusion**. Each
      list gives a chunk points for its position: `1 / (60 + rank)`. A chunk on both lists
      adds both.


      Near the top of either list, it scores well. Near the top of both, it wins. The 60
      keeps one list from swamping the other. The code does the sums.

  - type: fill-blank
    id: fill-rrf
    concept: ai.hybrid-search
    difficulty: 3
    language: python
    prompt: Merge two lists of chunk ids, best first, with reciprocal rank fusion.
    template: |
      def merge(keyword_ids, vector_ids):
          scores = defaultdict(float)
          for ranking in (keyword_ids, vector_ids):
              for rank, chunk_id in {{1}}(ranking, start=1):
                  scores[chunk_id] {{2}} 1 / (60 + rank)
          return sorted(scores, key=scores.get, {{3}}=True)
    blanks:
      - key: '1'
        answer: enumerate
      - key: '2'
        answer: '+='
      - key: '3'
        answer: reverse
    bank: [enumerate, zip, '+=', '=', reverse, ascending]

  - type: explain-back
    id: explain-hybrid
    concept: ai.hybrid-search
    difficulty: 3
    prompt: >-
      Why does a help centre search do better with keyword and vector search together than
      with either alone?
    rubric:
      - Vector search finds paraphrases but blurs exact codes and names.
      - Keyword search finds exact strings but misses different wording.
      - Merging the rankings keeps what each finds, so both kinds of question work.
    modelAnswer: >-
      People search both ways. "My money back" needs meaning, which vector search finds and
      keywords miss. "E-4417" needs the exact string, which keywords find and embeddings
      blur. Running both and merging the rankings answers both kinds of question.

recap:
  - Split documents into overlapping chunks, keeping the last, shorter one.
  - Explain why vector search blurs exact codes, and keyword search misses paraphrases.
  - Merge keyword and vector rankings with reciprocal rank fusion.

recall:
  - id: card-chunk-size
    concept: ai.chunking
    front: What goes wrong with chunks that are too small, or too big?
    back: >-
      Too small, and a chunk loses its context. Too big, and its vector blurs many topics, so
      nothing matches it well.
  - id: card-overlap
    concept: ai.chunking
    front: Why do neighbouring chunks overlap?
    back: >-
      So a sentence cut at a chunk's edge is whole in at least one chunk.
  - id: card-hybrid
    concept: ai.hybrid-search
    front: What does each search miss, and how does hybrid search fix it?
    back: >-
      Vector search blurs exact codes and names, keyword search misses paraphrases. Hybrid
      runs both and merges the rankings.
  - id: card-rrf
    concept: ai.hybrid-search
    front: How does reciprocal rank fusion score a chunk?
    back: >-
      Each list adds `1 / (60 + rank)` for the chunk's place in it. Chunks high on both lists
      win.

references:
  - kind: paper
    title: Reciprocal Rank Fusion outperforms Condorcet and individual Rank Learning Methods
    authors: Gordon V. Cormack, Charles L. A. Clarke and Stefan Büttcher
    year: 2009
    venue: SIGIR 2009
    url: https://dl.acm.org/doi/10.1145/1571941.1572114
    note: The fusion formula, with k = 60.
    primary: true
    verified: true
  - kind: essay
    title: Introducing Contextual Retrieval
    authors: Anthropic
    year: 2024
    venue: Anthropic blog
    url: https://www.anthropic.com/news/contextual-retrieval
    note: Chunking, keyword search with BM25, and how combining them cut failed retrievals.
    primary: true
    verified: true

deepDive: >-
  **BM25.** The usual keyword ranking scores a chunk higher when it contains the search
  words, more so for rare words, and less for very long chunks. Postgres full-text search
  and search engines such as Elasticsearch do this for you.


  **Smarter cuts.** Real chunkers split on headings, paragraphs and sentences before
  falling back to word counts, so chunks follow the document's own shape. Some add a
  sentence of context to each chunk, such as the document title, before embedding.
  Chapter 21 compares these strategies.


  **Measure it.** Chunk size and overlap are guesses until you test them. Keep a set of
  questions with the chunk that should answer each, and check how often it comes back.
  The RAG lesson does that next.
