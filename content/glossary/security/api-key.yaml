term: API key
aka: [API keys, secret key, server key]
short: A long secret string a service issues you, sent with each call to show which account is calling.
explain: |
  A paid service needs to know whose account each call comes from. It gives you a long
  random string to send in a header. Anyone who has the string can spend your money.

  So it lives on your server, read from an environment variable, and never in browser code.
  A variable your build tool inlines into the page is public. Keep it out of logs and error
  messages, give each environment its own key, and plan rotation. Add the new key, switch
  over, then revoke the old one.
analogy: A company credit card. Whoever holds it can spend, so it stays in the office safe.
example:
  language: ts
  code: |
    const response = await fetch('https://api.example.com/v1/summaries', {
      method: 'POST',
      headers: { Authorization: `Bearer ${process.env.SUMMARY_API_KEY}` },
      body: JSON.stringify({ text }),
      signal: AbortSignal.timeout(10_000),
    });
usage: The API key was in the client bundle, so rotate it today and move the call to the server.
twin:
  term: access-token
  difference: An API key identifies your app or account and lasts until you revoke it. An access token stands for one user's permission and expires within hours.
related: [secret, environment-variable, secret-manager, access-token, rate-limiting]
level: 1
lessons: [backend.calling-other-apis]
