approach: >-
  Treat each booking as two events: a start, and the minute its room is free again (end
  plus cleaning). Sort the starts and sort the free-again minutes separately. Walk the
  starts in order: if some room is already free by this start, reuse it and move the
  free-again pointer on; otherwise open a new room. The number of rooms opened is the
  answer.
complexity: O(N log N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Read the bottom first. **N up to 100,000** and **efficient** point to sorting,
      O(N log N). One performance test has every booking overlapping every other, so
      anything that scans all open rooms per booking will time out.

      Note the rule: a room is free again from minute E + C, and a booking may start then.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words. Folding the cleaning into the end time makes the
      problem simpler to say, and simpler to solve.
    code:
      ts: |-
        // Each booking holds a room from S[i] until E[i] + C; return the fewest rooms needed.
      python: |-
        # Each booking holds a room from S[i] until E[i] + C; return the fewest rooms needed.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      The boundaries are where this task bites:

      - back-to-back bookings with cleaning, which need a second room;
      - a start exactly at E + C, which may reuse the room;
      - identical bookings, which each need a room;
      - a long booking with short ones nested inside.

      Put them in test-input.txt now.
    input:
      - "([0, 10, 20], [10, 20, 30], 1)"
      - "([0, 15], [10, 25], 5)"
      - "([3, 3, 3, 3], [8, 8, 8, 8], 0)"
      - "([0, 1, 5], [100, 4, 9], 0)"
      - "([0], [1], 0)"
  - kind: write
    title: Bank a correct version first
    minutes: 5
    body: |-
      Take bookings in order of start and put each into any room that is free by then, or
      open a new one. It is correct, and it scores the correctness tests. It scans every
      room per booking, so when all bookings overlap it is O(N²).
    code:
      ts: |-
        // Each booking holds a room from S[i] until E[i] + C; return the fewest rooms needed.
        // First pass: first free room, O(N²) when every booking overlaps.
        function solution(S: number[], E: number[], C: number): number {
            const order = S.map((_, i) => i).sort((a, b) => S[a] - S[b]);
            const freeAt: number[] = [];
            for (const i of order) {
                let room = -1;
                for (let r = 0; r < freeAt.length; r++) {
                    if (freeAt[r] <= S[i]) {
                        room = r;
                        break;
                    }
                }
                if (room === -1) freeAt.push(E[i] + C);
                else freeAt[room] = E[i] + C;
            }
            return freeAt.length;
        }
      python: |-
        # Each booking holds a room from S[i] until E[i] + C; return the fewest rooms needed.
        # First pass: first free room, O(N²) when every booking overlaps.
        def solution(S, E, C):
            order = sorted(range(len(S)), key=lambda i: S[i])
            free_at = []
            for i in order:
                room = -1
                for r in range(len(free_at)):
                    if free_at[r] <= S[i]:
                        room = r
                        break
                if room == -1:
                    free_at.append(E[i] + C)
                else:
                    free_at[room] = E[i] + C
            return len(free_at)
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check each of your cases against the
      rule, especially the two boundary cases.
    expect: >-
      Two OKs, then 2 for back to back with cleaning, 1 when the start is exactly E + C, 4
      for the identical bookings, 2 for the nested case and 1 for the single booking.
  - kind: plan
    title: Sweep two sorted lists instead of scanning rooms
    minutes: 3
    body: |-
      You never need to know which room is free, only whether one is. Sort all starts, and
      sort all free-again minutes (E + C). Walk the starts with a pointer into the free
      list.

      If the earliest unused free-again minute is at or before this start, a room is free:
      reuse it and advance the pointer. Otherwise open a room. Two sorts and one pass.
  - kind: ask-ai
    title: Check a sorting trap in the language
    minutes: 1
    body: |-
      Sorting numbers is where TypeScript surprises people. One narrow question avoids a
      wrong answer that only shows on large values.
    prompt: >-
      In JavaScript, does Array.prototype.sort() with no compare function sort numbers
      numerically? If not, what are two correct ways? One line each.
    expect: >-
      No, it compares them as strings. Pass (a, b) => a - b, or sort a Float64Array, which
      sorts numerically.
  - kind: optimise
    title: Write the sweep yourself
    minutes: 5
    body: |-
      This is the core logic, so type it. Use `<=` for the free check: a start at exactly
      E + C may reuse the room. Rerun your boundary cases straight after.
    code:
      ts: |-
        // Each booking holds a room from S[i] until E[i] + C; return the fewest rooms needed.
        // Sort the starts and the free-again minutes separately and sweep them. A start opens
        // a new room only when no room is free by then: O(N log N) time, O(N) space.
        function solution(S: number[], E: number[], C: number): number {
          const starts = Float64Array.from(S).sort();
          const frees = Float64Array.from(E, (end) => end + C).sort();
          let rooms = 0;
          let freed = 0;
          for (const start of starts) {
            if (frees[freed]! <= start) freed += 1;
            else rooms += 1;
          }
          return rooms;
        }
      python: |-
        # Each booking holds a room from S[i] until E[i] + C; return the fewest rooms needed.
        # Sort the starts and the free-again minutes separately and sweep them. A start opens
        # a new room only when no room is free by then: O(N log N) time, O(N) space.
        def solution(S, E, C):
            starts = sorted(S)
            frees = sorted(end + C for end in E)
            rooms = 0
            freed = 0
            for start in starts:
                if frees[freed] <= start:
                    freed += 1
                else:
                    rooms += 1
            return rooms
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Ask for inputs only, and check each result against the rule yourself. Keep the slow
      version in a scratch tab: both must agree on every input.
    prompt: >-
      Give me 5 test inputs for solution(S, E, C), one per line, in the format
      ([30, 0], [75, 40], 10). Cover bookings given out of order, C = 0, a large C that
      forces extra rooms, values near 1000000000 and one booking that overlaps all the
      others. Inputs only, no answers and no code.
    expect: Five lines to paste into test-input.txt, with the same results from both versions.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The boundary at E + C and the sort order are the two
      things worth a second look.
    prompt: >-
      Review my current solution for correctness at the E + C boundary, numeric sorting and
      time complexity. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N log N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove debug output and the slow version. Check the header comment states
      O(N log N). Then submit, and open the report to see the all-overlapping test pass.
