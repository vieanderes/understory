term: context window
aka:
  - context length
short: The most text a model can take in one call, counting the instructions, the history and its reply.
explain: |
  A model has no memory between calls. Each time, your app sends everything it should know:
  the instructions, the conversation so far, any documents. There's a cap on how much fits,
  measured in tokens, and the reply has to fit inside it too.

  A bigger window isn't a free pass. Models attend less reliably to facts buried in the
  middle of a long context. And every token costs money and time. Choosing what to send is
  the real skill, often called **context engineering**.
analogy: A desk, not a filing cabinet. The model works only with the papers on the desk right now. A cluttered desk hides the one that matters.
usage: The chat history is eating the context window, so summarise the older turns before the next call.
twin:
  term: context-rot
  difference: The context window is the hard limit on what a model can take in. Context rot is the quality loss that starts long before that limit.
