term: preload
aka: [ rel=preload, resource hint, fetchpriority ]
short: A hint telling the browser to fetch a file now that it would otherwise discover late.
explain: |
  The browser finds files as it reads. A font named inside a CSS file is found late. The
  browser sees it only after that CSS has downloaded.

  `<link rel="preload">` names the file up front, so the download starts at once. Use it for
  one or two files on the critical path. Preload everything and nothing is early, because they
  all fight for the same bandwidth. `fetchpriority` moves a file up or down the queue instead.
analogy: Phoning ahead so the order's ready when you walk in.
example:
  language: html
  code: |
    <link rel="preload" href="/fonts/body.woff2" as="font"
          type="font/woff2" crossorigin>
usage: Preload the body font, otherwise the text appears late and jumps when it swaps in.
related: [ critical-rendering-path, render-blocking, largest-contentful-paint ]
level: 3
lessons: [ perf.critical-rendering-path ]
