summary: >-
  Git history is a graph. Every commit points back at its parent, or at two parents for a merge,
  and branches are movable labels, each holding the hash of one commit. `HEAD` says which label
  you're on. Almost every Git command is one of two things: making new commits, or moving
  labels around the graph.


  That view makes branching cheap and merging understandable. Creating a branch writes one
  small file. A fast-forward merge moves a label. A real merge finds the last commit both sides
  share, compares each side with it, and records a commit with two parents. A rebase copies
  your commits onto a new base, which gives a straight history at the price of new hashes.


  It also explains why Git rarely loses work. Commits aren't deleted when a label stops pointing
  at them, and the reflog records every place `HEAD` and each branch has been. After a bad
  reset, a deleted branch or a rebase gone wrong, the old commits are still there for weeks.
remember:
  - A branch is a file holding one commit hash, and committing moves the branch you're on to the new commit.
  - '`HEAD` normally names a branch, and when it holds a commit hash directly you''re in detached HEAD, where new commits belong to no branch.'
  - A merge compares both branch tips with their merge base, the latest commit they share, and records a commit with two parents.
  - A fast-forward merge happens when your branch has no commits of its own, so Git moves the label and makes no commit.
  - Rebase replays your commits on a new base as new commits with new hashes, so only rebase commits nobody else has built on.
  - '`HEAD~1` follows the first parent in the graph, `HEAD^2` is a merge''s second parent, and `HEAD@{1}` is where `HEAD` was before its last move.'
  - The reflog is a local log of where `HEAD` and each branch pointed, and it can recover commits after a reset, rebase or deleted branch.
  - Uncommitted changes aren't in the reflog, so commit before any risky command.
sections:
  - title: Refs, HEAD and what a commit does to them
    body: |-
      A branch lives as a file under `.git/refs/heads/`, holding one hash. `HEAD` is a file too,
      and usually holds the name of a branch rather than a hash:

      ```text
      $ cat .git/HEAD
      ref: refs/heads/main
      $ cat .git/refs/heads/main
      04073e27c93eaf64469250b4e056670b8d586ad8
      ```

      Git may later move branch hashes into one file, `.git/packed-refs`, so use
      `git rev-parse main` rather than reading files in scripts. Your hashes will differ from
      the ones in these examples.

      `git commit` does three things: it writes a commit whose parent is the commit `HEAD`
      resolves to, it follows `HEAD` to the branch it names, and it writes the new hash into
      that branch's file. Only the current branch moves. Every other branch stays where it was.
      That's the whole mechanism behind "work on a branch without touching `main`".

      When `HEAD` holds a hash instead of a branch name, you're in **detached HEAD**. That
      happens after `git switch --detach <hash>`, `git checkout <hash>` or during a rebase.
      You can commit, but no branch moves, so switching away leaves those commits behind. Git
      warns you and prints the command to keep them:

      ```text
      Warning: you are leaving 1 commit behind, not connected to
      any of your branches:

        2030199 Try a new heading

      If you want to keep it by creating a new branch, this may be a good time
      to do so with:

       git branch <new-branch-name> 2030199
      ```

      Tags live in `.git/refs/tags/` and are labels that stay put when you commit, which is why
      releases are tagged rather than branched.
  - title: Naming commits and finding the merge base
    body: |-
      You'll often name commits relative to others:

      - `HEAD~1` is the first parent, `HEAD~2` its first parent, and so on.
      - `HEAD^2` is the second parent of a merge commit, the tip of the branch that was merged
        in. `HEAD^1` is the same as `HEAD~1`.
      - `main..add-booking` means commits reachable from `add-booking` but not from `main`:
        what the branch would bring in.

      Here's a booking site where `main` gained a footer while `add-booking` gained two
      commits:

      ```text
      $ git log --graph --oneline --all
      * 71ba07b Add opening times
      * 391e5e4 Add booking form
      | * 04073e2 Add footer
      |/
      * 5cf467f Add menu page
      * d07fd13 Add home page
      $ git merge-base main add-booking
      5cf467fbdc3f822b7ca2ffab2be429d401db49de
      $ git log --oneline main..add-booking
      71ba07b Add opening times
      391e5e4 Add booking form
      ```

      The **merge base** is the latest commit both branches share, here `Add menu page`. A merge
      is a three-way comparison: Git diffs the base against each tip and combines the two sets
      of changes. A line changed on one side only takes that side's version. A line changed
      differently on both sides is a conflict. That's why Git can merge edits to different
      parts of the same file without asking, and why it needs you only when both sides touched
      the same lines.

      After merging, the merge commit has two parents:

      ```text
      $ git log --graph --oneline
      *   9836671 Merge branch 'add-booking'
      |\
      | * 71ba07b Add opening times
      | * 391e5e4 Add booking form
      * | 04073e2 Add footer
      |/
      * 5cf467f Add menu page
      * d07fd13 Add home page
      $ git log --oneline -1 HEAD^2
      71ba07b Add opening times
      ```
  - title: Merge or rebase
    body: |-
      Both bring the branch's work onto `main`. They differ in what history looks like after.

      Rebasing the same branch onto `main` instead replays its two commits after the footer:

      ```text
      $ git switch add-booking
      $ git rebase main
      $ git log --graph --oneline
      * d812b1a Add opening times
      * 3fd09d1 Add booking form
      * 04073e2 Add footer
      * 5cf467f Add menu page
      * d07fd13 Add home page
      ```

      The commit messages survive, but the hashes are new: `391e5e4` became `3fd09d1`, because
      its parent changed and a hash covers the parent. The originals still exist, unreferenced.
      Merging `add-booking` into `main` now is a fast-forward.

      The trade-offs:

      - **Merge** keeps history exactly as it happened and never rewrites a commit. It's safe on
        shared branches. The cost is a graph with merge commits that some find noisy.
      - **Rebase** gives a straight line that reads and bisects cleanly. The cost is rewritten
        commits: anyone who built on the old ones now has duplicates, and publishing the new
        branch needs a force push, where `git push --force-with-lease` refuses if someone else
        pushed meanwhile.

      The working rule most teams use: rebase your own unpublished branch onto `main` to keep
      it current, and merge (often squash-merge through a pull request) to bring it in. Never
      rebase a branch other people have pulled.

      Conflicts during a rebase look the same but read differently. The rebase replays your
      commits onto `main`, so `HEAD` in the markers is `main` plus what's replayed so far, and
      the lower part is your commit:

      ```text
      <<<<<<< HEAD
      Mon to Fri: 10 to 5
      =======
      Mon to Fri: 9 to 8
      >>>>>>> a955ec5 (Open until 8)
      ```

      Fix the file, `git add` it and run `git rebase --continue`, or `git rebase --abort` to
      go back to where you started. Setting `git config --global merge.conflictStyle zdiff3`
      adds a third section, marked `|||||||`, with the merge base's version, which often makes
      the right resolution obvious at a glance.
  - title: Recovering with the reflog
    body: |-
      Each time `HEAD` or a branch moves, Git appends a line to that ref's log in `.git/logs/`.
      `git reflog` reads `HEAD`'s. Suppose you undo a merge with a hard reset, then realise you
      wanted it:

      ```text
      $ git reset --hard HEAD~1
      HEAD is now at 04073e2 Add footer
      $ git reflog -3
      04073e2 HEAD@{0}: reset: moving to HEAD~1
      9836671 HEAD@{1}: merge add-booking: Merge made by the 'ort' strategy.
      04073e2 HEAD@{2}: commit: Add footer
      $ git reset --hard HEAD@{1}
      HEAD is now at 9836671 Merge branch 'add-booking'
      ```

      `git reset --hard <commit>` moves the current branch to that commit and makes the index
      and working tree match it. Other places to look:

      - `ORIG_HEAD` holds where `HEAD` was before the last reset, merge or rebase, so
        `git reset --hard ORIG_HEAD` undoes a rebase straight after it.
      - `git reflog show add-booking` reads one branch's own log, such as
        `add-booking@{1}` for the branch before its rebase.
      - `git branch rescue <hash>` puts a label on any commit you found, which is the
        safest first move: nothing is overwritten.

      The limits matter as much. The reflog is local to one clone and never pushed. Entries
      expire: by default after 90 days, or 30 days for commits no branch can reach, and only
      then can garbage collection delete those commits. And it only knows about commits.
      Changes you never committed aren't in it. Staged-but-uncommitted content survives as
      loose blobs that `git fsck --lost-found` can dig out, but without file names. So the
      practical rule is: commit, even as a scrappy "wip" on a branch, before any command that
      rewrites or resets.

      For a commit that's already shared, don't reset at all. `git revert <hash>` adds a new
      commit that undoes it, so nobody's history is rewritten. Reverting a merge commit needs
      `-m 1` to say which parent is the mainline.
pitfalls:
  - '**Rebasing a branch someone else has pulled.** Their copy still has the old commits, so the next pull brings duplicates and conflicts. Rebase only unpublished work, and merge anything shared.'
  - '**Committing in detached HEAD and switching away.** No branch points at those commits, so they fall out of `git log`. Run `git switch -c <name>` before switching, or recover the hash from the reflog.'
  - '**Using `git reset --hard` with uncommitted work.** It overwrites the working tree, and uncommitted changes aren''t in the reflog. Commit or `git stash` first, then reset.'
  - '**Committing conflict markers.** Git records whatever the file contains once you `git add` it. Search for `<<<<<<<` before committing, or run the tests and let a linter catch it.'
  - '**Plain `--force` after a rebase.** It overwrites anything a teammate pushed in the meantime. Use `git push --force-with-lease`, which refuses when the remote moved.'
  - '**Reverting a merge without `-m`.** `git revert <merge>` stops with "is a merge but no -m option was given". Pass `-m 1` to keep the mainline side, and know that re-merging the branch later needs the revert reverted.'
interview:
  - question: When would you merge and when would you rebase?
    answer: >-
      I rebase my own unpublished branch to keep it current, and merge to integrate shared
      work. Rebase replays my commits on top of the latest `main`, giving a linear history
      that's clear to read, review and bisect, and it lets me resolve conflicts one commit at a
      time. But it rewrites every replayed commit with a new hash, so anyone who pulled the
      old ones ends up with duplicates, and pushing needs `--force-with-lease`. Merge never
      rewrites anything and records exactly how work came together, at the cost of merge
      commits in the graph. Many teams combine them: rebase feature branches locally, then
      squash-merge or merge through a pull request, and never rebase `main` or any branch
      someone else is working on.
  - question: What is HEAD, and what does "detached HEAD" mean?
    answer: >-
      `HEAD` is Git's pointer to what you have checked out. Normally it names a branch, stored
      as `ref: refs/heads/main` in `.git/HEAD`, and committing moves that branch forward. In
      detached HEAD it holds a commit hash directly, which happens when you check out a
      commit, a tag, or during a rebase. You can look around and even commit, but no branch
      moves, so when you switch away those new commits are reachable only through the
      reflog, and Git warns you with the hash. It's useful for inspecting an old version or
      running a quick experiment. If the experiment is worth keeping,
      `git switch -c new-branch` gives it a label before you leave.
  - question: You ran `git reset --hard` and lost commits. How do you get them back?
    answer: >-
      Look in the reflog and point a branch back at the commit. `git reflog` lists every
      position `HEAD` has had, newest first, with the command that moved it, so the commit
      before the reset is usually `HEAD@{1}`. I'd first run `git branch rescue HEAD@{1}` to
      label it safely, check it with `git log rescue`, then `git reset --hard rescue` if I
      want the branch back where it was. `ORIG_HEAD` also holds the pre-reset position right
      after the command. The limits: the reflog is local, entries for unreachable commits
      expire after 30 days by default, and uncommitted working-tree changes were never
      recorded, so a hard reset over unsaved edits can't be undone by Git.
  - question: How does Git perform a merge, and when does it produce a conflict?
    answer: >-
      Git does a three-way merge between the two branch tips and their merge base. It finds
      the base, the most recent commit both branches share, then diffs the base against each
      tip. Changes on only one side apply automatically, even in the same file, as long as
      they touch different lines. A conflict happens when both sides changed the same region
      differently, or when one side edited a file the other deleted. Git then writes both
      versions between markers and stops for a human. If the current branch has no commits of
      its own since the base, there's nothing to combine, so Git fast-forwards the label
      instead of creating a merge commit, unless you pass `--no-ff` to record the merge
      anyway.
  - question: What's the difference between `git reset`, `git revert` and `git restore`?
    answer: >-
      `reset` moves the current branch, `revert` adds a commit that undoes another, and
      `restore` changes files without touching history. `git reset --hard HEAD~1` moves the
      branch back one commit and rewrites the working tree to match, which is fine for local
      commits but rewrites history if they were pushed. `git revert <hash>` creates a new
      commit with the inverse change, so it's the safe way to undo something already shared,
      and it needs `-m 1` for a merge commit. `git restore <file>` discards working-tree edits,
      and `git restore --staged <file>` unstages, neither creating a commit. Choosing between
      them is mostly about whether other people already have the commit.
