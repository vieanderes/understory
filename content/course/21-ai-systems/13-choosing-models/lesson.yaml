    note: Per-token prices per model, and the batch discount.
    verified: false

deepDive: >-
  No model was called. The router and the train-test split ran in Python on made-up
  models and scores.


  **Sizing a self-hosted model.** The weights alone need about the parameter count times
  the bytes per parameter. A 70-billion-parameter model at 16 bits is about 140 GB, more
  than one large GPU holds. Quantised to 4 bits it's about 35 GB, often with some loss of
  quality you must measure. Add memory for each request's context. Throughput comes from
  batching many requests on one GPU, which is why steady, high volume favours self-hosting
  and spiky, low volume favours an API.


  **Data terms differ per model.** At Anthropic, for example, zero data retention is
  available to approved organisations on most models, but not all of them: some require
  30-day retention unless specially authorised. Cloud platforms that resell a model add
  their own terms and regions. So record, per model and per platform, which data classes
  each one is approved for, and make the router read that list.


  **Fine-tuning has running costs too.** Every base model upgrade means training and
  evaluating again. Keep the corrected examples, a held-out test set no training run ever
  sees, and the eval that compares tuned, prompted and retrieval versions on it. Lesson 12
  covered routing to save money. This lesson's router adds the cost of a wrong answer.
