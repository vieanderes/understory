id: pyai.pydantic
title: Pydantic
objective: "Check data at the boundary with Pydantic models, read validation errors, validate a model's JSON reply, and load settings from the environment."
level: essential
minutes: 10
concepts: [pyai.pydantic-models, pyai.validation-errors, pyai.typed-output, pyai.pydantic-settings]
prerequisites: [pyai.first-model-call]
opening:
  text: >-
    You'll make bad data fail at the door, with a message that names the field. You'll need
    it the first time a model's JSON reply is subtly wrong.

steps:
  - type: prose
    id: hints-that-run
    body: |-
      Data from outside, such as a request or a model's reply, can be wrong. The
      **boundary** is where it enters your code. In chapter 18, Python ignored type hints.
      **Pydantic** reads them and checks every field there:

      ```python
      from pydantic import BaseModel

      class Booking(BaseModel):
          room: str
          guests: int

      booking = Booking(room="Maple", guests="3")
      print(booking.guests + 1)   # 4
      ```

      Where it's safe, it converts: `"3"` became `3`. A class like this is a **Pydantic
      model**. That's a description of data, not a language model.

  - type: prose
    id: from-json
    body: |-
      A model's reply arrives as text. `model_validate_json` parses the JSON and checks it
      in one step. `Literal`, from chapter 18, limits a field to fixed values:

      ```python
      class Ticket(BaseModel):
          category: Literal["refund", "delivery", "other"]
          urgent: bool

      ticket = Ticket.model_validate_json(reply_text)
      ```

      After that line, `ticket.category` is one of the three, and `ticket.urgent` is a real
      `True` or `False`.

  - type: fill-blank
    id: fill-review-model
    concept: pyai.pydantic-models
    difficulty: 1
    language: python
    prompt: A model rates product reviews. Complete the class and the line that checks its reply.
    template: |
      class Review(BaseModel):
          sentiment: Literal["positive", "negative"]
          stars: {{1}}

      review = Review.{{2}}(reply_text)
    blanks:
      - key: '1'
        answer: int
      - key: '2'
        answer: model_validate_json
    bank: [int, '"int"', model_validate_json, json.loads, parse]

  - type: prose
    id: reading-errors
    body: |-
      Data that can't be made valid raises a **ValidationError**. It lists every bad field
      at once, with where it is and what was wrong:

      ```text
      2 validation errors for Ticket
      category
        Input should be 'refund', 'delivery' or 'other' [type=literal_error, ...]
      urgent
        Field required [type=missing, ...]
      ```

      The reply said `"Refund"`, with a capital, and forgot `urgent`. `error.errors()` gives
      the same list as dicts your code can read.

  - type: ai-review
    id: review-unvalidated-reply
    concept: pyai.typed-output
    difficulty: 3
    language: python
    request: Ask the model if a support email is urgent, and page the on-call engineer if so.
    flawClass: edge-case
    code: |
      import json

      def handle(email, client):
          reply = ask(client, f"Reply as JSON with an urgent boolean. {email}")
          data = json.loads(reply)
          if data["urgent"]:
              page_on_call(email)
    prompt: >-
      An assistant wrote this. At 3 a.m. it paged the on-call engineer about a thank-you
      note. The reply was `{"urgent": "false"}`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: The JSON is used without checking its types
        correct: true
        feedback: >-
          Yes. `"false"` is a non-empty string, so it counts as true.
      - text: '`json.loads` fails on the reply'
        feedback: >-
          The reply is valid JSON. It parses fine, into a string where a boolean belongs.
      - text: The prompt should say "true or false"
        feedback: >-
          Helps, but models still slip. Only a check in code catches the slip every time.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'A fake reply of `{"urgent": "false"}` that expects no page'
          correct: true
          feedback: >-
            Yes. It's the exact reply that paged someone at 3 a.m.
        - text: 'A fake reply of `{"urgent": true}` that expects a page'
          feedback: >-
            That passes with the bug too. The trouble is a string where a boolean belongs.
        - text: A reply that isn't JSON at all
          feedback: >-
            A good test, but `json.loads` raises there. The bug hides in JSON that parses.
    fix: |
      from pydantic import BaseModel

      class Triage(BaseModel):
          urgent: bool

      def handle(email, client):
          reply = ask(client, f"Reply as JSON with an urgent boolean. {email}")
          triage = Triage.model_validate_json(reply)   # "false" becomes False
          if triage.urgent:
              page_on_call(email)

  - type: code-challenge
    id: write-read-ticket
    concept: pyai.validation-errors
    difficulty: 2
    language: python
    starter: ticket.starter.py
    solution: ticket.solution.py
    tests: ticket.tests.py
    packages: [pydantic]
    prompt: >-
      Write `read_ticket(reply_text)`. Return a checked `Ticket` from the model's reply, or
      `None` if the reply is invalid.


      Before returning `None`, print the error, so the log shows which fields were wrong.
      Catch `ValidationError` only. A broader `except` would hide bugs in your own code.
    hints:
      - The starter already parses. What happens when that line raises?
      - 'Wrap the parse in `try`, and add `except ValidationError as error:`.'
      - 'In the `except` block, `print(error)`, then `return None`.'

  - type: prose
    id: typed-output
    body: |-
      The SDK can run this check for you. Pass the class, and the model is held to its
      shape:

      ```python
      response = client.messages.parse(
          model="claude-opus-5-5",
          max_tokens=1024,
          messages=[{"role": "user", "content": email}],
          output_format=Ticket,
      )
      ticket = response.parsed_output
      ```

      `parsed_output` is a checked `Ticket`. Chapter 20 shows how that works, and what can
      still go wrong.

  - type: prose
    id: settings
    body: |-
      Config is outside data too. **pydantic-settings** fills a model from environment
      variables, so a missing API key fails at start-up, not on the first request:

      ```python
      from pydantic_settings import BaseSettings

      class Settings(BaseSettings):
          api_key: str
          timeout: float = 30.0
      ```

      The variable `API_KEY` fills `api_key`. Upper or lower case doesn't matter.

  - type: ai-review
    id: review-default-key
    concept: pyai.pydantic-settings
    difficulty: 3
    language: python
    request: Load the API key and timeout from the environment.
    flawClass: security
    code: |
      from pydantic_settings import BaseSettings

      class Settings(BaseSettings):
          api_key: str = "sk-test-4f9a1c"
          timeout: float = 30.0

      settings = Settings()
    prompt: >-
      An assistant wrote this. It ran fine on a laptop with no `API_KEY` set, which is exactly
      the problem. Tap the line at fault.
    lines: [4]
    reasons:
      - text: A secret is committed as the default
        correct: true
        feedback: >-
          Yes. The key sits in Git, and a missing variable quietly falls back to it.
      - text: '`timeout` should be an `int`'
        feedback: >-
          A float timeout is fine. The risk is the value on the line above.
      - text: '`Settings()` needs the key passed in'
        feedback: >-
          `BaseSettings` reads the environment itself. That part works as intended.
    fix: |
      from pydantic_settings import BaseSettings

      class Settings(BaseSettings):
          api_key: str
          timeout: float = 30.0

      settings = Settings()

  - type: explain-back
    id: explain-boundary
    concept: pyai.validation-errors
    difficulty: 3
    audience: reviewer
    kind: decide
    prompt: >-
      You parse the reply with a Pydantic model as it arrives. A reviewer asks why not check
      `urgent` later, where the code uses it. Defend the choice, and name its cost.
    rubric:
      - Bad data fails at once, with an error naming the field and the reason.
      - Everything after the boundary can trust the types, so no check is repeated or forgotten.
      - The cost is a model class to keep in step with the prompt, and a failure to handle.
    modelAnswer: >-
      At the boundary, a bad reply fails straight away, and the error names the field. After
      that every line can trust the types, so nobody has to remember a check. Checked later,
      `"false"` travels on and pages someone at 3 a.m. The cost is small: a class to keep in
      step with the prompt, and a validation error to catch and retry.

recap:
  - Describe outside data as a `BaseModel`, and let Pydantic check and convert it.
  - Validate a model's JSON reply with `model_validate_json`, and read a `ValidationError`.
  - Load config with `BaseSettings`, with no secret as a default.

recall:
  - id: card-model-checks
    concept: pyai.pydantic-models
    front: What does Pydantic do with `guests="3"` for a field typed `int`?
    back: >-
      It converts it to the integer `3`. Text that can't become an integer raises a
      `ValidationError`.
  - id: card-validate-json
    concept: pyai.typed-output
    front: How do you parse and check a model's JSON reply in one step?
    back: >-
      `MyModel.model_validate_json(reply_text)`. It raises `ValidationError` if the JSON is
      invalid or a field is wrong.
  - id: card-validation-error
    concept: pyai.validation-errors
    front: What does a `ValidationError` tell you?
    back: >-
      Every failing field at once: where it is, what was wrong, and a `type` code such as
      `missing` or `literal_error`.
  - id: card-string-false
    concept: pyai.typed-output
    front: >-
      Why is `if data["urgent"]:` wrong after `json.loads` of `{"urgent": "false"}`?
    back: >-
      `"false"` is a non-empty string, so it counts as true. Validate with a `bool` field,
      which turns `"false"` into `False`.

