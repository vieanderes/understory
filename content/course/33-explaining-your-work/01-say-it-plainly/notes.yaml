summary: >-
  Explaining is a skill with a few moves you can practise, not a gift some people are born
  with. This lesson covers the three that matter most. Say the **point first**, so the
  listener knows what every detail is for. Give an **example before the term**, so a new word
  attaches to a picture they already have. Then **check they followed** by asking them to
  use the idea, because "Does that make sense?" nearly always gets a polite yes.


  The problem these moves solve is that the explainer knows too much. Once you understand
  something, you forget what it was like not to. You skip steps that feel obvious, use words
  that feel ordinary, and start from the part you find interesting. The listener, holding
  only a few new things at once, falls behind by the second sentence and rarely says so.


  You use these moves every day as a developer: answering a question in chat, describing a
  pull request, asking for help, onboarding someone, or talking to an AI assistant. They also
  work in reverse. Explaining something plainly is the quickest test of whether you
  understand it yourself, and the gap you hit is exactly the part to study next.
remember:
  - Say the point first, in one sentence, so every detail that follows has somewhere to land.
  - Give a concrete example before the term, and name the idea only once the listener can picture it.
  - Keep to one new idea at a time, because a listener holds only a few new things at once.
  - '"Does that make sense?" tests politeness; a question that makes them use the idea tests understanding.'
  - Experts explain badly by default, because once you know something it is hard to imagine not knowing it.
  - If you can't explain something plainly, you have found the part you don't understand yet.
  - Correct is not the same as followed, so judge an explanation by what the listener can do afterwards.
sections:
  - title: Why experts explain badly
    body: |-
      The trouble has a name: the **curse of knowledge**. Once you know something, your brain
      fills in every gap without asking you, so you can't hear the gaps a newcomer falls into.

      You can see it in your own code. To you, this line is one idea:

      ```js
      tasks[index].done = true;
      ```

      To someone in their first week it's five: a list, a position in it, an object at that
      position, a property on the object, and changing that property. If you say "it sets
      done on the task", you've explained the first idea and skipped four.

      Three habits counter it. First, name the listener and what they already know before
      you start: "she's built a web page but never used a list". Second, count the new words
      in your explanation; each one needs an example before it, or it should go. Third,
      watch for phrases that hide steps, such as "of course" or "all you do is". When you
      reach for one, you have usually skipped something.

      None of this means talking down. A newcomer is not slow; they're missing context.
      Give the context, and they follow at full speed. An experienced listener skims the
      example and loses nothing, so you can usually explain for the newcomer in the room.
  - title: Explaining to learn
    body: |-
      Explaining an idea out loud, in your own words, helps you understand it. Students who
      explain a text to themselves as they read it understand it better than students who
      read it twice. This is the **self-explanation effect**, and it's one of the reasons
      every Understory lesson ends with an explain-back.

      A popular routine built on it is often called the **Feynman technique**:

      1. Pick an idea and explain it on paper as if to someone new.
      2. Where you get stuck, or reach for jargon, go back to the source.
      3. Rewrite the explanation in plainer words, with an example.
      4. Repeat until it's short and has no gaps.

      The second step is the valuable one. A gap you find on your own costs you a few
      minutes; a gap a reviewer finds in your code costs a lot more.

      Saying it out loud works better than thinking it, because you can't skip a step in a
      spoken sentence the way you can in your head. That's why the explain-back steps offer
      a microphone. Try it even when you'd rather type: the first spoken attempt is usually
      clumsy, and that clumsiness is the gap showing itself.
  - title: Checking that it landed
    body: |-
      A good check makes the listener produce something with the idea. Compare:

      ```text
      Weak:   Does that make sense?
      Weak:   Any questions?
      Weak:   What's the function called again?
      Strong: If milk is done and the dentist isn't, what does showList print?
      Strong: Where would a new task go?
      Strong: What would you change to show only unfinished tasks?
      ```

      The weak checks can be passed without understanding. People say yes out of
      politeness, and they can't ask about a gap they don't know is there. Repeating a name
      proves memory, not understanding.

      The strong checks ask for a prediction or a small change. If the answer is wrong, you
      learn exactly which part didn't land, and you can explain that part again with a
      different example. Healthcare calls this **teach-back**: after explaining a treatment,
      the nurse asks the patient to explain in their own words how they'll take it.

      Frame the check as a test of your explanation, not of them: "Let me check I explained
      that well. What would happen if...?" It keeps the question friendly, and it's true.
pitfalls:
  - '**Starting at the beginning of the code.** It feels natural because that is where the code starts, but the listener needs to know what it is for first. Say the point, then the parts.'
  - '**Defining a term before showing it.** "An array is an ordered collection" gives a word with nothing to attach it to. Show the row of tasks first, then name it.'
  - '**Explaining three ideas in one breath.** Each new idea needs a moment to settle. Finish one, check it, then add the next.'
  - '**Asking "Does that make sense?"** It nearly always gets a yes. Ask a question they can only answer by using the idea.'
  - '**Trusting a fluent AI explanation.** Assistants write correct, confident text that still uses terms before examples. Read it as the newcomer would, and reorder it.'
verify:
  - lens: confuses
    check: Count the new terms in your explanation and confirm each one comes after an example the listener can picture.
  - lens: confuses
    check: Check the first sentence alone tells the listener what the thing does for them, with no setup before it.
  - lens: tests
    check: End with a question the listener answers by predicting or changing something, and listen for which part they get wrong.
  - lens: breaks
    check: Ask who the listener is and what they already know, because an explanation pitched at the wrong level fails however correct it is.
interview:
  - question: Explain a technical concept to me as if I weren't technical.
    answer: >-
      I'd pick the point first, then an everyday example, then the term. Take a cache. "It
      keeps a copy of something you asked for recently, so the next time is faster. It's like
      keeping the milk on the top shelf of the fridge because you use it every day. In
      software that top shelf is called a cache." Then I'd check, not ask if it made sense:
      "So why might the page show yesterday's price?" If they say the copy is old, it landed.
      The trade-off is precision: I've left out expiry and invalidation on purpose. If they
      want more, I add one idea at a time, each with its own example.
  - question: How do you know whether someone understood your explanation?
    answer: >-
      I ask them to use it. "Does that make sense?" gets a yes almost every time, because
      people are polite and can't see what they missed. So I ask for a prediction or a small
      change: "What would this return for an empty list?" or "Where would you add the
      check?" A wrong answer is useful. It tells me exactly which part didn't land, so I can
      explain that piece again with a different example. I frame it as checking my
      explanation, not testing them, which keeps it friendly. In code review I do the same
      in writing: I ask the author a concrete question rather than "Is this clear?"
  - question: How would you onboard a junior developer to a large codebase?
    answer: >-
      Point first, then one path, then depth on demand. I'd start with what the system does
      for its users in two sentences, then follow one real request end to end, from the
      button to the database and back. That one path gives them a skeleton to hang
      everything else on. I'd hold back the exceptions and the history until they've seen
      the normal case. I'd ask them to explain the path back to me or make a small change on
      it in the first week, because that shows me what landed. The trade-off is coverage:
      they won't know every module early, but they'll know how to find their way, which
      matters more.
