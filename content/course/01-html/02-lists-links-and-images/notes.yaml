summary: >-
  Almost every page is built from the same few parts: lists of things, links to other pages
  and pictures. HTML has an **element**, a
  start tag, its content and an end tag, for each. `ul` and `ol` group items into a bullet or a
  numbered list, `a` makes a link, and `img` places a picture for the browser, the app you read
  websites in, to draw. Links and images need extra
  settings, called **attributes**, written inside the start tag: `href` says where a link
  goes, `src` names an image file.


  The deeper point is that these elements carry information beyond their looks. A list tells
  a screen reader, an app that reads the page aloud, that the items belong together and how
  many there are. A link's text is what a screen reader says when someone jumps from link to
  link. An image's `alt` text is the only thing a blind visitor gets from the picture, and
  it's what everyone sees when the file fails to load.


  So the craft in this lesson is small but real. Pick the list that matches the content,
  write link text that makes sense on its own, and give every image the right `alt`: a
  description for a picture that informs, and an empty `alt=""` for one that only decorates.
remember:
  - 'Give every `img` an `alt` attribute: words that do the picture''s job for a meaningful image, and `alt=""` for a purely decorative one.'
  - Leaving `alt` out is a bug, because the browser then has no text for the image and some screen readers read out the file name instead.
  - A link's text is its name, so it must make sense on its own, like "Opening times", never "click here".
  - An `a` without `href` isn't a link at all, so the Tab key skips it and a screen reader reads it as plain text.
  - An image that is the only content of a link gives the link its name, so its `alt` describes where the link goes.
  - Use `ol` when the order matters and `ul` when it doesn't, and put only `li` elements directly inside either.
  - An attribute is written inside the start tag as a name, `=` and a quoted value, and quoting every value avoids surprises.
  - '`src` names the file of an `img`, and `href` gives the address of an `a`; the other way round, nothing loads or links.'
sections:
  - title: How the browser reads attributes
    body: |-
      An attribute is a setting on an element, written inside its start tag. The parser, the
      part of the browser that reads your file, reads a name, then `=`, then a value. Quotes
      mark exactly where the value starts and ends, and that's why they matter.

      Here's what Chrome builds when a value with a space has no quotes:

      ```html
      <img src=my photo.jpg alt="Our kitchen">
      ```

      ```text
      src="my"          the file name stops at the space
      photo.jpg=""      a second, meaningless attribute
      alt="Our kitchen"
      ```

      The browser asks for a file called `my`, which doesn't exist. With quotes,
      `src="my photo.jpg"`, it works. So quote every value, even ones without spaces.

      A few more rules the parser follows:

      - **Names ignore case.** `HREF` and `href` are the same attribute. Write lower case.
      - **The first copy wins.** In `<a href="/menu" href="/about">`, the link goes to
        `/menu` and the second `href` is thrown away, with no error.
      - **Some attributes are on or off.** They need no value, and being present is enough.
        `<ol reversed>` counts down, and there's no way to write `reversed="no"`. To switch
        it off, remove it.

      Some attributes work on any element. `title` is one: it shows a small tooltip when the
      mouse rests on an element. It's no substitute for `alt`. Touch screens and keyboards
      can't show it, and screen readers handle it inconsistently.
  - title: Lists are structure, not bullets
    body: |-
      A list does more than draw bullets or numbers. The browser tells assistive technology,
      the software disabled people use to read and operate a page, that these items belong
      together. A screen reader announces something like "list, 3 items" before the first one,
      so the listener knows how much is coming and can skip past it. Three paragraphs in a row
      give none of that.

      That's why so much of the web is lists underneath. A menu is a list of links. Search
      results, a to-do list and the steps of a recipe are lists too.

      Numbered lists have a few useful attributes:

      ```html
      <ol start="4">
        <li>Fold in the cheese</li>
        <li>Bake for 20 minutes</li>
      </ol>
      ```

      `start="4"` makes the list count 4, 5, handy when a list continues after a paragraph.
      `reversed` counts down, for a top ten.

      Lists nest, but only inside an item. The sub-list goes inside the `li` it belongs to:

      ```html
      <ul>
        <li>Dairy
          <ul>
            <li>Milk</li>
            <li>Butter</li>
          </ul>
        </li>
        <li>Bread</li>
      </ul>
      ```

      A common slip is to put the inner `ul` between two `li` elements. Chrome doesn't repair
      that: it keeps the `ul` directly inside the outer list. It still draws, but it breaks
      the rule that only `li` sits directly inside `ul` or `ol`, and a validator flags it.

      For pairs of a term and its explanation, like a glossary or product details, HTML has a
      third list: `dl` holds the pairs, `dt` each term and `dd` its description.
  - title: Writing alt text that does the picture's job
    body: |-
      The question to ask is: if I phoned someone and read the page aloud, what would I say
      in place of this picture? That answer is the `alt` text. It depends on why the picture
      is there, not only on what it shows.

      ```html
      <!-- Informative: describe what matters here -->
      <img src="soup.jpg" alt="A bowl of tomato soup topped with basil">

      <!-- Decorative: empty alt, so it's skipped -->
      <img src="swirl.svg" alt="">

      <!-- The only content of a link: say where it goes -->
      <a href="/"><img src="logo.svg" alt="Home"></a>

      <!-- A picture of words: the alt is the words -->
      <img src="sale-banner.png" alt="Half price on all soups this week">
      ```

      Chrome's accessibility tree, the list of roles and names it gives screen readers, shows
      why the difference matters. The soup is an image named "A bowl of tomato soup topped
      with basil". The swirl with `alt=""` is left out entirely, which is right for
      decoration. An image with no `alt` at all stays in as an image with no name. What the
      listener hears then depends on the screen reader, and some read out the file name.

      A chart or a diagram needs more than a short phrase. Give it a short `alt` that says
      what it is, and put the full information in the text around it.

      This is the first rule of the Web Content Accessibility Guidelines (WCAG) 2.2: success
      criterion 1.1.1, Non-text Content, level A. Every image needs a text alternative that
      serves the same purpose, and decoration must be ignorable by assistive technology.
  - title: 'Links: where they go, and what they say'
    body: |-
      An `a` element becomes a link only when it has an `href`. Without one, Chrome treats it
      as ordinary text. It gets no link role, the Tab key skips it, and Enter does nothing. So
      `<a>Borrow</a>` is never a working control, however it's styled.

      The `href` can hold more than web addresses. Two schemes, the part before the colon,
      open other apps:

      ```html
      <a href="mailto:hello@example.com">Email us</a>
      <a href="tel:+441632960000">Call the box office</a>
      ```

      A link's **name**, what a screen reader says, comes from its content. That has two
      consequences.

      First, the text must make sense out of context. Screen reader users often list every
      link on a page, and a list of "click here, click here, read more" tells them nothing.
      WCAG 2.2 success criterion 2.4.4, Link Purpose (In Context), is level A.
      It asks that each link's purpose be clear from its text, or from its text plus its
      sentence.

      ```html
      <!-- Vague -->
      <p>To see our opening times, <a href="/hours">click here</a>.</p>
      <!-- Clear on its own -->
      <p>See our <a href="/hours">opening times</a>.</p>
      ```

      Second, a link that holds only an image takes its name from the image's `alt`. If that
      `alt` is empty or missing, Chrome exposes a link with no name at all, and a screen
      reader may fall back to reading the address. Describe the destination, "Home", rather
      than the picture, "Blue logo".
pitfalls:
  - '**Leaving `alt` out.** It looks optional because the page draws fine without it. But the image then has no text at all. Write a description, or `alt=""` if the picture is only decoration.'
  - '**Starting alt text with "image of".** Screen readers already announce it as an image, so the words are heard twice. Start with what the picture shows: "A red lighthouse on a rocky shore".'
  - '**Mixing up `src` and `href`.** `img` only reads `src` and `a` only reads `href`. With the wrong one, the image never loads or the text never links, and no error appears.'
  - '**Writing "click here".** The words make sense next to the sentence, but not in a list of links. Put the link on the words that say where it goes.'
  - '**Faking a list with line breaks.** Separate paragraphs or `br` elements look like a list but lose the "list, 3 items" announcement. Use `ul` or `ol` with an `li` per item.'
  - '**Leaving a value unquoted.** `src=my photo.jpg` stops at the space and asks for a file called `my`. Quote every attribute value.'
interview:
  - question: What's the difference between an empty alt attribute and a missing one?
    answer: >-
      `alt=""` says the image is decorative, and a missing `alt` says nothing, which is a bug.
      With an empty `alt`, the browser leaves the image out of the accessibility tree, so a
      screen reader skips it. That's right for a divider or a background flourish. With no
      `alt` at all, the image stays in the tree with no name, and some screen readers fall
      back to the file name, like "IMG 4032 dot jpg". WCAG 2.2 success criterion 1.1.1 needs
      a text alternative for every meaningful image. So I decide per image. If it adds
      information, I describe that information in context. If removing it would lose nothing,
      I use `alt=""`. The trap is using `alt=""` on an image that's the only content of a
      link or button, which leaves the control with no name.
  - question: How do you write good alt text?
    answer: >-
      I write what the picture contributes in this spot, in the words I'd use reading the page
      aloud. The same photo can need different text: on a recipe page, "A bowl of tomato soup
      topped with basil"; on a pottery shop, "A hand-glazed blue bowl". I leave out "image of",
      because the screen reader already says it's an image. If the image is a link or a button,
      I describe the action or the destination, like "Home" or "Remove". If it's a picture of
      text, the alt is that text. For a chart, a short alt names it and the full data goes in
      nearby text or a table, because a long alt can't be skimmed. A decorative image gets
      `alt=""`. The trade-off is length: aim for a sentence, and move anything longer into the
      page.
  - question: A designer wants the menu links to say "Learn more". What do you tell them?
    answer: >-
      I'd push for link text that names the destination, because a link's text is its name
      for assistive technology. Screen reader users often pull up a list of every link on the
      page. Five links that all say "Learn more" are indistinguishable there, and the same
      happens for voice control users who say "click" plus the link text. WCAG 2.2 success
      criterion 2.4.4, Link Purpose (In Context), is level A, so it's a baseline requirement.
      The fix usually costs nothing visually: "Learn more about delivery" or "Delivery
      details". If the design truly needs the short visible text, you can add hidden text
      for screen readers. But visible, specific text is better for everyone, including people
      scanning quickly.
