id: design.design-tokens
title: Design systems and tokens
objective: Explain what a design system is, split tokens into a palette and roles, and theme a page for dark mode.
level: essential
minutes: 10
concepts: [design.tokens, design.colour-roles, design.theming, design.colour-scheme]
prerequisites: [design.contrast-colour-and-motion, css.custom-properties]
opening:
  text: >-
    You'll recolour a whole site by changing one line, then give it a dark theme without
    touching a single component. It's how big teams keep hundreds of screens looking like
    one product.

steps:
  - type: prose
    id: what-a-design-system-is
    body: >-
      Forty people build screens for one app. Without help, they'd pick forty slightly
      different blues.


      A **design system** is the shared kit that stops that. It has three parts: the values,
      such as colours and sizes; the components, such as buttons and cards; and the rules
      for using them. You've already built the first part.

  - type: prose
    id: what-a-token-is
    body: |-
      In the CSS chapter, `--brand` named a colour once. That's a **design token**: a named
      design decision, stored once and used everywhere.

      Tokens come in two layers:

      ```css
      :root {
        --indigo-700: #3a41b8;         /* palette: what it is */
        --accent: var(--indigo-700);   /* role: what it's for */
      }
      ```

      A **role** names a job, like `--surface`, `--ink` or `--accent`. Components use roles
      only.

  - type: playground
    id: repoint-the-accent
    concept: design.tokens
    difficulty: 1
    prompt: >-
      The button, the link and the heading all read `--accent`. The brand is moving to
      teal. Change `--accent` to `#0f766e`, and watch all three follow.
    html: |
      <h1>Harbour Cabins</h1>
      <p>Sleeps four, with a <a href="#">sea view</a>.</p>
      <button>Book a stay</button>
    css: |
      :root { --surface: #f5f3ee; --ink: #1b1d2e; --accent: #3a41b8; }
      body { font-family: sans-serif; background: var(--surface); color: var(--ink); }
      h1, a { color: var(--accent); }
      button { padding: 8px 16px; border: 0; background: var(--accent); color: var(--surface); }
    editable: [css]
    checks:
      - label: The accent is `#0f766e`
        selector: html
        style: { property: '--accent', value: '#0f766e' }
    solution:
      css: |
        :root { --surface: #f5f3ee; --ink: #1b1d2e; --accent: #0f766e; }
        body { font-family: sans-serif; background: var(--surface); color: var(--ink); }
        h1, a { color: var(--accent); }
        button { padding: 8px 16px; border: 0; background: var(--accent); color: var(--surface); }
    hints:
      - Only the first line holds values.
      - Change the value after `--accent:`.
      - '`--accent: #0f766e;`'

  - type: prose
    id: roles-and-theming
    body: |-
      A dark theme gives the roles new values. `[data-theme="dark"]` matches any element with
      that attribute:

      ```css
      [data-theme="dark"] {
        --surface: #1b1d2e;
        --ink: #f5f3ee;
      }
      ```

      Put `data-theme="dark"` on `html`, and every component that reads a role follows.
      That's **theming**. It works because components never name a colour, only a role.

  - type: playground
    id: add-a-dark-theme
    concept: design.theming
    difficulty: 2
    prompt: >-
      The page already has `data-theme="dark"`, but the dark block is empty. Give it
      `--surface: #1b1d2e`, `--ink: #f5f3ee` and `--accent: #c5c8ff`. Then press Theme to flip
      between the two.
    html: |
      <html lang="en" data-theme="dark">
      <head><title>Harbour Cabins</title></head>
      <body>
        <h1>Harbour Cabins</h1>
        <p>Sleeps four, with a sea view.</p>
        <button class="theme">Theme</button>
      </body>
      </html>
    css: |
      :root { --surface: #f5f3ee; --ink: #1b1d2e; --accent: #3a41b8; }
      [data-theme="dark"] { }
      body { font-family: sans-serif; background: var(--surface); color: var(--ink); }
      h1 { color: var(--accent); }
      button { padding: 8px 16px; border: 0; background: var(--accent); color: var(--surface); }
    js: |
      // document.documentElement is the page's html element.
      const page = document.documentElement;
      document.querySelector(".theme").addEventListener("click", () => {
        page.dataset.theme = page.dataset.theme === "dark" ? "light" : "dark";
      });
    editable: [css]
    checks:
      - label: The dark surface is `#1b1d2e`
        selector: html
        style: { property: '--surface', value: '#1b1d2e' }
      - label: The dark ink is `#f5f3ee`
        selector: html
        style: { property: '--ink', value: '#f5f3ee' }
      - label: The dark accent is `#c5c8ff`
        selector: html
        style: { property: '--accent', value: '#c5c8ff' }
    solution:
      css: |
        :root { --surface: #f5f3ee; --ink: #1b1d2e; --accent: #3a41b8; }
        [data-theme="dark"] { --surface: #1b1d2e; --ink: #f5f3ee; --accent: #c5c8ff; }
        body { font-family: sans-serif; background: var(--surface); color: var(--ink); }
        h1 { color: var(--accent); }
        button { padding: 8px 16px; border: 0; background: var(--accent); color: var(--surface); }
    hints:
      - The three declarations go inside `[data-theme="dark"] { }`.
      - They use the same names as `:root`, with new values.
      - 'Start with `[data-theme="dark"] { --surface: #1b1d2e; }`.'

  - type: predict-output
    id: predict-role-in-dark
    concept: design.colour-roles
    difficulty: 2
    language: css
    code: |
      :root { --indigo-700: #3a41b8; --accent: var(--indigo-700); }
      [data-theme="dark"] { --accent: #c5c8ff; }

      .book  { background: var(--accent); }
      .badge { background: var(--indigo-700); }
    question: The page switches to dark. Which background changes?
    choices:
      - text: Only `.book`
        correct: true
        feedback: >-
          Yes. `accent` is a role, and the theme gave it a new value.
      - text: Both
        feedback: >-
          The theme never touched `--indigo-700`. The badge stays indigo on a dark page.
      - text: Neither, the palette didn't change
        feedback: >-
          The palette stayed put, but the role moved. `.book` reads the role.

  - type: prose
    id: follow-the-system
    body: |-
      Phones and computers have a dark mode setting, and CSS can read it:

      ```css
      @media (prefers-color-scheme: dark) {
        :root { --surface: #1b1d2e; --ink: #f5f3ee; }
      }
      ```

      Many sites do both. The media query picks the starting theme from the setting, and a
      Theme button with `data-theme` lets people override it.

  - type: fill-blank
    id: fill-color-scheme-query
    concept: design.colour-scheme
    difficulty: 2
    language: css
    prompt: >-
      Follow the system setting: when someone prefers dark, swap the surface and ink roles.
      Fill the gaps.
    template: |
      @media ({{1}}: {{2}}) {
        {{3}} {
          --surface: #1b1d2e;
          --ink: #f5f3ee;
        }
      }
    blanks:
      - key: '1'
        answer: prefers-color-scheme
      - key: '2'
        answer: dark
      - key: '3'
        answer: ':root'
    bank: [prefers-color-scheme, prefers-reduced-motion, dark, night, ':root', '.button']

  - type: ai-review
    id: review-raw-palette-in-component
    concept: design.colour-roles
    difficulty: 3
    language: css
    request: Style the price on the booking card so it stands out in both themes.
    flawClass: logic
    code: |
      .card {
        background: var(--surface);
        color: var(--ink);
      }
      .card .price {
        color: var(--indigo-700);
      }
    prompt: >-
      An assistant wrote this. In the light theme the price looks right. Switch to dark, and
      it's dark indigo on a dark card, at 2.08 to 1. Tap the line at fault.
    lines: [6]
    reasons:
      - text: It names a palette colour, which no theme moves
        correct: true
        feedback: >-
          Yes. `var(--accent)` would follow the theme to its light dark-mode value.
      - text: The card needs its own dark rule
        feedback: >-
          Then every component would need one. Roles let one theme block do it for all.
      - text: '`.card .price` is too specific'
        feedback: >-
          The selector is fine. The value it picks is the one no theme touches.
    fix: |
      .card {
        background: var(--surface);
        color: var(--ink);
      }
      .card .price {
        color: var(--accent);
      }

  - type: explain-back
    id: explain-roles-over-palette
    concept: design.theming
    difficulty: 3
    prompt: >-
      A teammate asks why components can't use `var(--indigo-700)`, when indigo is the
      accent anyway. What breaks if they do?
    rubric:
      - A palette token is a fixed colour, and a theme only gives the roles new values.
      - In the dark theme the accent moves, but `--indigo-700` stays, often with poor contrast.
      - Using roles lets one theme block restyle every component, with no component edits.
    modelAnswer: >-
      Indigo is the accent today, in the light theme. `var(--indigo-700)` promises to stay
      indigo whatever happens. The dark theme moves `--accent` to a light lilac, but that
      component doesn't move, so it sits dark on dark. With `var(--accent)`, one theme block
      moves the role and every component follows.

recap:
  - Describe a design system as tokens, components and rules.
  - Keep a palette and point roles at it, and use only roles in components.
  - Theme with `data-theme` and follow `prefers-color-scheme` by default.

recall:
  - id: card-design-system
    concept: design.tokens
    front: What are the three parts of a design system?
    back: >-
      Tokens, the named values. Components, the shared parts. Rules, for how to use both.
  - id: card-token-definition
    concept: design.tokens
    front: What is a design token, and why does one edit reach forty components?
    back: >-
      A named design decision stored once. Components read the token, so changing its value
      changes every use.
  - id: card-role-vs-palette
    concept: design.colour-roles
    front: What's the difference between `--indigo-700` and `--accent`?
    back: >-
      `--indigo-700` names what the colour is, a palette value. `--accent` names what it's
      for, and a theme can move it.
  - id: card-theming
    concept: design.theming
    front: How does a dark theme change every component without editing any of them?
    back: >-
      `[data-theme="dark"]` gives the roles new values, and the components only read roles.
  - id: card-color-scheme
    concept: design.colour-scheme
    front: How does a page follow the system's dark mode setting?
    back: >-
      With `@media (prefers-color-scheme: dark)`, giving the role tokens their dark values.

references:
  - kind: spec
    title: Design Tokens Format Module 2025.10
    authors: Design Tokens Community Group
    venue: W3C Community Group
    url: https://www.designtokens.org/tr/drafts/format/
    note: The shared file format for tokens, including aliases from one token to another.
    primary: true
    verified: true
  - kind: docs
    title: prefers-color-scheme CSS media feature
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-color-scheme
    note: How the browser reports a light or dark preference.
    primary: true
    verified: true
  - kind: docs
    title: Using CSS custom properties (variables)
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascading_variables/Using_custom_properties
    note: How a custom property set on an ancestor is read by everything below it.
    verified: true
  - kind: docs
    title: Attribute selectors
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Attribute_selectors
    note: '`[data-theme="dark"]` and the other attribute selector forms.'
    verified: true

deepDive: >-
  To use the system setting and a manual switch together, scope the query:
  `@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ... } }`. The
  setting gives the default, and `data-theme` on `html` wins when someone picks.


  Set the attribute before the first paint, with a small inline script in the `head` that
  reads the stored choice. Set it later and the page flashes the light theme first.


  Add `color-scheme: light dark` on `:root` too. It tells the browser to draw its own parts,
  such as scroll bars and form fields, in the matching scheme.


  Check both themes for contrast. A role that passes on paper can fail on night, and each
  theme is a separate set of pairs to measure.


  The token format in the first reference stores an alias as `{color.indigo.700}`. A build
  step turns token files into CSS custom properties, often for several platforms at once.
