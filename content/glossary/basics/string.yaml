term: string
aka: [text string]
short: A piece of text in a program, written inside quotes.
explain: |
  Programs handle words as well as numbers: names, messages, a line of a poem. Text goes
  inside quotes, `"like this"`, so the computer knows to keep it exactly as written.

  The quotes change everything. `6 * 7` is maths and gives `42`. `"6 * 7"` is five
  characters and stays that way. Text that looks like a number is still text, so
  `"2" + "2"` is `"22"`.
analogy: Words in speech marks. You're quoting them exactly, not acting on them.
example:
  language: js
  code: |
    console.log(6 * 7);     // 42
    console.log("6 * 7");   // 6 * 7
    console.log("2" + "2"); // 22
usage: The age arrives from the form as a string, so make it a number before adding.
twin:
  term: variable
  difference: In quotes, `"total"` is a string, the word itself. Without quotes, `total` is a variable, and the computer swaps in the value it holds.
related: [variable, operator, type-coercion]
level: 1
lessons: [basics.first-program, basics.operators]
