approach: >-
  Decide once, for every number up to N, whether it is a two-prime product. A
  smallest-prime-factor sieve makes that instant: x qualifies when x divided by its
  smallest prime factor is a different prime. Then build prefix counts, so the answer to
  any question [A, B] is count[B] minus count[A - 1].
complexity: O(N log log N + M) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N up to 50,000 and M up to 30,000**. Walking each
      range for every question could cost 1,500,000,000 steps. That times out.

      So the shape is: prepare something for all numbers up to N once, then answer each
      question fast.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the rule in your own words. Say "different" out loud: 4 = 2 · 2 does not count,
      and that detail fails many answers.
    code:
      ts: |-
        // For each [A, B] in R, count x in A..B with x = p * q for two different primes p and q.
      python: |-
        # For each [A, B] in R, count x in A..B with x = p * q for two different primes p and q.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - N = 1, where nothing qualifies;
      - a range of a single number that does qualify;
      - squares, cubes and products of three primes, none of which count;
      - a range starting at 1.
    input:
      - "(1, [[1, 1]])"
      - "(6, [[6, 6]])"
      - "(30, [[4, 4], [8, 8], [9, 9], [30, 30]])"
      - "(15, [[1, 15]])"
  - kind: plan
    title: Plan a simple correct version first
    minutes: 2
    body: |-
      For each number up to N, test it by trial division: find its smallest factor p, then
      check that x / p is a prime different from p. Store the result in a flag array.

      Then answer each question by counting flags in its range. Correct, but O(N · M) on
      the questions.
  - kind: write
    title: Bank the slow version yourself
    minutes: 5
    body: |-
      Type it yourself. The rule "x / p is a prime, and not p" is the heart of the task, so
      it has to come from you. This version passes the correctness tests.
    code:
      ts: |-
        // For each [A, B] in R, count x in A..B with x = p * q for two different primes p and q.
        // Trial division per number, then a loop per question: O(N * M) on the questions, slow.
        function solution(N: number, R: number[][]): number[] {
            const smallest = (x: number): number => {
                for (let d = 2; d * d <= x; d++) if (x % d === 0) return d;
                return x;
            };
            const hit = new Array<boolean>(N + 1).fill(false);
            for (let x = 2; x <= N; x++) {
                const p = smallest(x);
                const q = x / p;
                if (q !== 1 && q !== p && smallest(q) === q) hit[x] = true;
            }
            return R.map(([a, b]) => {
                let count = 0;
                for (let x = a; x <= b; x++) if (hit[x]) count++;
                return count;
            });
        }
      python: |-
        # For each [A, B] in R, count x in A..B with x = p * q for two different primes p and q.
        # Trial division per number, then a loop per question: O(N * M) on the questions, slow.
        def solution(N, R):
            def smallest(x):
                d = 2
                while d * d <= x:
                    if x % d == 0:
                        return d
                    d += 1
                return x

            hit = [False] * (N + 1)
            for x in range(2, N + 1):
                p = smallest(x)
                q = x // p
                if q != 1 and q != p and smallest(q) == q:
                    hit[x] = True
            out = []
            for a, b in R:
                out.append(sum(1 for x in range(a, b + 1) if hit[x]))
            return out
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check the squares-and-cubes line
      carefully: 30 needs three primes, so it does not count.
    expect: >-
      Two OKs, then [0], [1], [0, 0, 0, 0] and [4].
  - kind: plan
    title: Precompute counts, and sieve the factors
    minutes: 3
    body: |-
      The questions are the slow part. **Prefix counts** fix it: count[x] is how many
      qualifying numbers are at most x. Each answer is count[B] minus count[A - 1].

      A **smallest-prime-factor sieve** also replaces trial division. A number whose entry
      stays 0 is prime.
  - kind: ai-writes
    title: Let the assistant write the sieve
    minutes: 3
    body: |-
      A sieve is a standard helper, fair to delegate. Keep the qualifying rule and the
      prefix counts for yourself. Read the sieve before you use it: the inner loop should
      start at i · i.
    prompt: >-
      In TypeScript and in Python, write only a smallest-prime-factor sieve up to N: an
      array spf of length N + 1 where spf[x] is the smallest prime factor of composite x,
      and 0 when x is prime or below 2. No other code.
    expect: >-
      spf[12] is 2, spf[35] is 5 and spf[13] is 0. Print them once, then remove the prints.
  - kind: optimise
    title: Combine the sieve with prefix counts
    minutes: 5
    body: |-
      Now write the rest yourself. x qualifies when spf[x] is not 0, q = x / spf[x] is a
      prime (spf[q] is 0) and q is not spf[x]. Run again: every result must match the slow
      version.
    code:
      ts: |-
        // For each [A, B] in R, count x in A..B with x = p * q for two different primes p and q.
        // Smallest-factor sieve, then prefix counts: O(N log log N + M) time, O(N) space.
        function solution(N: number, R: number[][]): number[] {
          // Smallest-factor sieve: x is a two-prime product when x / spf(x) is a different prime.
          const spf = new Int32Array(N + 1);
          for (let i = 2; i * i <= N; i++) {
            if (spf[i] !== 0) continue;
            for (let j = i * i; j <= N; j += i) if (spf[j] === 0) spf[j] = i;
          }
          // Prefix counts answer every query in O(1).
          const count = new Int32Array(N + 1);
          for (let x = 2; x <= N; x++) {
            let hit = 0;
            if (spf[x] !== 0) {
              const q = x / spf[x];
              if (spf[q] === 0 && q !== spf[x]) hit = 1;
            }
            count[x] = count[x - 1] + hit;
          }
          return R.map(([a, b]) => count[b] - count[a - 1]);
        }
      python: |-
        # For each [A, B] in R, count x in A..B with x = p * q for two different primes p and q.
        # Smallest-factor sieve, then prefix counts: O(N log log N + M) time, O(N) space.
        def solution(N, R):
            # Smallest-factor sieve: x is a two-prime product when x // spf(x) is a different prime.
            spf = [0] * (N + 1)
            i = 2
            while i * i <= N:
                if spf[i] == 0:
                    for j in range(i * i, N + 1, i):
                        if spf[j] == 0:
                            spf[j] = i
                i += 1
            # Prefix counts answer every query in O(1).
            count = [0] * (N + 1)
            for x in range(2, N + 1):
                hit = 0
                p = spf[x]
                if p != 0:
                    q = x // p
                    if spf[q] == 0 and q != p:
                        hit = 1
                count[x] = count[x - 1] + hit
            return [count[b] - count[a - 1] for a, b in R]
    codeMode: full
  - kind: test
    title: Add a range that starts at 1
    minutes: 1
    body: |-
      count[A - 1] reads count[0] when A is 1. Make sure that entry exists and is 0. The
      first example already covers it, but one more line at the top of the range helps.
    input:
      - "(50000, [[1, 50000], [49990, 50000]])"
    expect: Two numbers, returned at once, with no index error.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours. Squares of primes and the A = 1 edge
      are the two places to look.
    prompt: >-
      Review my current solution for correctness on squares of primes, ranges starting at
      1, and time complexity. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms each question is O(1).
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the sieve prints and any other debug output. Check the header comment states
      the complexity. Then submit.
