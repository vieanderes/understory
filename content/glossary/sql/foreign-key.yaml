term: foreign key
aka: [FK]
short: A column that stores another table's row id, and the rule that the row must exist.
explain: |
  An order belongs to a customer. Instead of copying the customer's name onto every order,
  the order stores the customer's `id`. That pointer is how tables relate to each other.

  Declaring it with `REFERENCES` makes the database guard it. An order for customer 99 is
  refused if customer 99 doesn't exist, and deleting a customer with orders fails unless you
  say what should happen (`ON DELETE CASCADE`, for instance). Index the column too: the
  database doesn't do that for you, and joins on it will crawl.
analogy: The "see page 212" note in a cookbook. The recipe isn't repeated; you follow the pointer, and the page had better exist.
example:
  language: sql
  code: |
    CREATE TABLE orders (
      id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      customer_id bigint NOT NULL REFERENCES customers (id),
      total_pence integer NOT NULL
    );
usage: Add a foreign key on customer_id, or we'll keep finding orders for customers who were deleted.
twin:
  term: primary-key
  difference: A primary key names a row in its own table. A foreign key holds another table's primary key, so it points elsewhere and may repeat.
related: [primary-key, join, normalisation]
level: 1
lessons: [db.relational-model]
