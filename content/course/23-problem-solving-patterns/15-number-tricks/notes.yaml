summary: >-
  Number tasks look like arithmetic but test two engineering habits: bounding a loop by what
  the maths guarantees, and knowing where your number type stops being exact. The first
  habit turns a two-billion-step loop into a 46,000-step one, because divisors pair up
  around the square root. The second stops an answer drifting silently once a total passes
  2^53, or an index going negative after a `%`.


  Recognise the family by its wording and constraints. "Divisors", "factors", "prime",
  "rectangle with area n", "greatest common", "every m-th item round a circle", an n up to
  2,147,483,647, or "return the answer modulo 1,000,000,007" all belong here. So does any
  statement where values multiply or where sums run over a million items.


  The toolkit is small and reused everywhere: the square-root loop for divisors and primality,
  the sieve when you need many primes or many factorisations, Euclid's algorithm for gcd and
  lcm, and exact arithmetic with `BigInt` or a modulus applied at every step. Public
  training lessons on primes, sieves and Euclid draw from exactly these, and they reappear reskinned in
  timed tests.
remember:
  - Divisors come in pairs `i` and `n / i`, so a loop while `i * i <= n` finds them all in O(√n).
  - Count a perfect square's root once, because it pairs with itself.
  - A sieve marks every prime up to n in O(n log log n), and storing each number's smallest prime factor factorises any of them in O(log n).
  - Euclid's `gcd(a, b) = gcd(b, a % b)` runs in O(log min(a, b)), and `lcm = a / gcd(a, b) * b` divides first to stay small.
  - JavaScript numbers are exact only up to 2^53 − 1; past it use `BigInt`, which cannot be mixed with numbers in one expression.
  - The product of two values below 10⁹ + 7 can pass 2^53, so modular products need `BigInt` or a split multiplication.
  - In JavaScript `%` keeps the sign of the left side, so wrap with `((x % m) + m) % m`.
sections:
  - title: The square-root loop and what it solves
    body: |-
      The pairing argument covers more than counting divisors. Any question of the form "does
      some factor exist" or "which factor pair is best" needs only the smaller half of each
      pair, and the loop `for (let i = 1; i * i <= n; i++)` visits every one of those.

      ```js
      // All divisors in ascending order: small ones on the way up, partners on the way back.
      function divisors(n) {
        const small = [];
        const large = [];
        for (let i = 1; i * i <= n; i++) {
          if (n % i === 0) {
            small.push(i);
            if (i * i !== n) large.push(n / i);
          }
        }
        return small.concat(large.reverse());
      }

      function isPrime(n) {
        if (n < 2) return false;
        for (let i = 2; i * i <= n; i++) {
          if (n % i === 0) return false;
        }
        return true;
      }

      // The rectangle of area n with the smallest perimeter uses the divisor closest to √n.
      function minPerimeter(n) {
        let best = Infinity;
        for (let i = 1; i * i <= n; i++) {
          if (n % i === 0) best = Math.min(best, 2 * (i + n / i));
        }
        return best;
      }

      console.log(divisors(24)); // [1, 2, 3, 4, 6, 8, 12, 24]
      console.log(divisors(36)); // [1, 2, 3, 4, 6, 9, 12, 18, 36]
      console.log(divisors(1)); // [1]
      console.log(isPrime(1)); // false
      console.log(isPrime(2147483647)); // true
      console.log(minPerimeter(30)); // 22
      console.log(minPerimeter(1)); // 4
      ```

      Each runs in O(√n) time. `divisors` uses O(d) space for the d divisors it returns;
      the other two use O(1). Comparing `i * i <= n` in whole numbers avoids any doubt about
      rounding in `Math.sqrt`, and in JavaScript `i * i` stays exact because i never passes
      about 46,341 for n below 2^31. In a language with 32-bit integers, `i * i` can
      overflow near that bound, which is why some solutions write `i <= n / i` instead.
  - title: Many primes at once, the sieve and smallest factors
    body: |-
      Trial division costs O(√n) per number. When a task needs primality or factors for every
      number up to n, or answers many range queries, sieve once instead. Recording the
      smallest prime factor of each number, rather than a yes or no flag, lets you factorise
      any number up to n by repeated division.

      A classic built on it: count the **semiprimes** (products of two primes, such as 4, 6,
      9 and 10) in many ranges `[P[k], Q[k]]`. Sieve smallest factors, mark each semiprime,
      take prefix sums, and answer each query with one subtraction.

      ```js
      function smallestFactors(n) {
        const spf = new Int32Array(n + 1); // 0 means "not yet claimed", so prime
        for (let p = 2; p * p <= n; p++) {
          if (spf[p] !== 0) continue;
          for (let m = p * p; m <= n; m += p) {
            if (spf[m] === 0) spf[m] = p;
          }
        }
        return spf;
      }

      function factorise(x, spf) {
        const factors = [];
        while (x > 1) {
          const p = spf[x] === 0 ? x : spf[x];
          factors.push(p);
          x /= p;
        }
        return factors;
      }

      function countSemiprimes(n, P, Q) {
        const spf = smallestFactors(n);
        const prefix = new Int32Array(n + 1);
        for (let x = 1; x <= n; x++) {
          const p = spf[x];
          const semi = p !== 0 && spf[x / p] === 0 && x / p > 1;
          prefix[x] = prefix[x - 1] + (semi ? 1 : 0);
        }
        return P.map((from, k) => prefix[Q[k]] - prefix[from - 1]);
      }

      const spf = smallestFactors(100);
      console.log(factorise(84, spf)); // [2, 2, 3, 7]
      console.log(factorise(97, spf)); // [97]
      console.log(countSemiprimes(26, [1, 4, 16], [26, 10, 20])); // [10, 4, 0]
      ```

      The sieve costs O(n log log n) time and O(n) space; each factorisation is O(log x),
      since every division at least halves x. Each query is O(1), so m queries cost O(n log
      log n + m) in total, against O(m × n × √n) for checking each number of each range. An
      `Int32Array` keeps the memory to 4 bytes per number, so 10 million entries fit in 40 MB.
  - title: gcd, lcm and the circle problems
    body: |-
      Euclid's algorithm replaces the pair `(a, b)` with `(b, a % b)` until the second value
      is 0. Every two steps at least halve the larger value, which is where the logarithmic
      bound comes from. Iterative code avoids any stack depth question.

      ```js
      function gcd(a, b) {
        while (b !== 0) [a, b] = [b, a % b];
        return a;
      }

      function lcm(a, b) {
        return (a / gcd(a, b)) * b;
      }

      // n chocolates in a circle. Eat one, skip m - 1, eat the next, and stop on a wrapper.
      // You return to 0 after lcm(n, m) steps of length m, which is n / gcd(n, m) eaten.
      function chocolatesEaten(n, m) {
        return n / gcd(n, m);
      }

      console.log(gcd(24, 36)); // 12
      console.log(gcd(17, 5)); // 1
      console.log(gcd(0, 9)); // 9
      console.log(lcm(4, 6)); // 12
      console.log(lcm(1_000_000_007, 1_000_000_009)); // 1000000016000000000
      console.log(1_000_000_007n * 1_000_000_009n); // 1000000016000000063n
      console.log(chocolatesEaten(10, 4)); // 5
      console.log(chocolatesEaten(1e9, 1)); // 1000000000
      ```

      Time is O(log min(a, b)) and space O(1). The brute-force simulation of the chocolate
      circle walks up to n positions, so at n = 10⁹ it times out where the gcd takes about
      40 steps. Look at the second lcm: the two inputs share no factor, so the lcm is their
      product, about 10¹⁸. That is past 2^53, so the number result is off by 63 and nothing
      warns you. The `BigInt` line is exact. When an lcm or product can be that large,
      compute it in `BigInt`.
  - title: Exact arithmetic, BigInt and the modulus
    body: |-
      Three rules keep answers exact. Sums of safe values stay exact while the total stays
      below 2^53, so check the worst case: 10⁵ values of 10⁹ is 10¹⁴, safe; 10⁶ values of
      10¹² is 10¹⁸, not safe. Products are the usual culprit: two numbers below 10⁹ + 7 can
      multiply to about 10¹⁸. And a modulus applied after every operation keeps each value
      small, as long as the multiplication itself is exact.

      ```js
      const MOD = 1_000_000_007n;

      // Fast exponentiation: square the base and halve the exponent, O(log e) steps.
      function modPow(base, exp, mod) {
        let result = 1n;
        base %= mod;
        while (exp > 0n) {
          if (exp & 1n) result = (result * base) % mod;
          base = (base * base) % mod;
          exp >>= 1n;
        }
        return result;
      }

      function modMultiply(a, b) {
        return Number((BigInt(a) * BigInt(b)) % MOD);
      }

      const a = 999_999_999;
      const b = 999_999_998;
      console.log((a * b) % 1_000_000_007 === modMultiply(a, b)); // false
      console.log((a * b) % 1_000_000_007); // 70
      console.log(modMultiply(a, b)); // 72
      console.log(modPow(2n, 10n, MOD)); // 1024n
      console.log(modPow(2n, MOD - 1n, MOD)); // 1n
      console.log(((-7 % 3) + 3) % 3); // 2
      ```

      `BigInt` arithmetic is slower than number arithmetic, so use it where exactness is at
      risk, not for every loop counter. It cannot mix with numbers: `1n + 1` throws a
      `TypeError`, and so does `Math.max(1n, 2n)`. `JSON.stringify` throws on a `BigInt`, so
      convert with `Number(x)` when the value is safe, or `String(x)` when it is not.
  - title: From brute force to optimal, and saying it aloud
    body: |-
      Number problems have a clear ladder, and naming each rung is a good narration.

      1. "Loop from 1 to n and test each value: O(n), two billion steps at the limit, too
         slow."
      2. "Halving to n / 2 is still O(n). The real insight is that divisors pair up, so I
         only need values up to √n: about 46,000 steps."
      3. "If I need this for every number up to n, or for many queries, I sieve once in
         O(n log log n) and answer each question in O(1) or O(log n)."
      4. "Values can reach 10⁹ and I multiply them, so I'll do the product in `BigInt` and
         reduce modulo the given number after each step."

      Then list the edge cases for the interviewer: n = 1 (one divisor, not prime), a prime
      (two divisors), a perfect square (odd count), the largest n, and 0 or negative input if
      the constraints allow it. Ask about 0 explicitly: every integer divides 0, so "the
      divisors of 0" is not a finite list, and the statement usually starts n at 1 for that
      reason.

      The same ladder works for gcd problems: "simulating the circle is O(n); the positions
      repeat after lcm(n, m) / m steps, which is n / gcd(n, m), so the answer is one gcd:
      O(log n)."
  - title: 'Practice task: the binary gap'
    body: |-
      The first lesson of a well-known training syllabus, Iterations, has one task: **BinaryGap**. Write N in binary
      and return the longest run of zeros with a 1 at both ends. 529 is `1000010001`, so 4.
      32 is `100000`: its zeros never meet a closing 1, so 0.

      ```ts
      function binaryGap(n: number): number {
        let best = 0;
        let zeros = 0;
        for (const bit of n.toString(2)) {
          if (bit === '1') {
            best = Math.max(best, zeros); // a 1 closes the gap before it
            zeros = 0;
          } else {
            zeros++;
          }
        }
        return best;
      }
      // 9 -> 2, 529 -> 4, 20 -> 1, 32 -> 0
      ```

      N is at most 2,147,483,647, so the string has at most 31 characters: the loop is
      O(log N). The trap is counting the trailing zeros as a gap. Because `best` only
      updates when a 1 arrives, zeros at the end are dropped for free. The same shape, a
      running count that is saved when a run ends, solves the reported task about runs of
      identical letters.

pitfalls:
  - "**Counting the square root twice.** For a perfect square, `i` and `n / i` are the same number. Count it once, or `divisors(36)` has 10 entries instead of 9."
  - "**Looping to n / 2.** It feels like an optimisation but it is still O(n). The bound that matters is `i * i <= n`."
  - "**Calling 1 a prime.** Start primality checks with `if (n < 2) return false`, and start a sieve's loop at 2."
  - "**Negative remainders.** `-1 % 3` is `-1` in JavaScript, so a wrapped index becomes `undefined`. Use `((x % m) + m) % m`, and add the modulus back after any modular subtraction."
  - "**Multiplying before reducing.** `(a * b) % MOD` rounds when `a * b` passes 2^53, and the error is silent. Multiply as `BigInt`, or reduce each factor and use a type that holds the product."
  - "**Mixing BigInt and number.** `total + 1` throws a `TypeError` when `total` is a `BigInt`. Convert at the boundary with `BigInt(x)` on the way in and `Number(x)` on the way out."
  - "**lcm as `a * b / gcd`.** The product can pass 2^53 even when the lcm itself is small. Divide first: `a / gcd(a, b) * b`."
interview:
  - question: How would you check whether a number up to two billion is prime?
    answer: >-
      Trial division up to the square root: if nothing from 2 to √n divides n, it's prime.
      Any factor above the root pairs with one below it, so checking below is enough. That is
      at most about 46,000 divisions for n below 2^31, instant for a single number. I handle n
      below 2 as not prime and write the loop as `i * i <= n` to stay in whole numbers. If I
      had to test many numbers up to a limit, I would sieve once in O(n log log n) instead,
      and for numbers far beyond 10¹², where √n is too many steps, a probabilistic test like
      Miller-Rabin is the standard choice. The trade-off is that the sieve costs O(n) memory,
      so it only pays when n is bounded and the queries are many.
  - question: What's wrong with `(a * b) % 1_000_000_007` in JavaScript?
    answer: >-
      The product can pass 2^53 and round before the modulus is taken, so the result is
      silently wrong. Two values below 10⁹ + 7 multiply to around 10¹⁸, and JavaScript numbers
      only hold every whole value up to about 9 × 10¹⁵. The fix is to multiply as `BigInt`,
      `Number((BigInt(a) * BigInt(b)) % MOD)`, or to keep all state as `BigInt` if most of the
      work is products. Additions are safe as long as I reduce after each one, since two
      values below the modulus sum to about 2 × 10⁹. The trade-off is speed: `BigInt` is
      noticeably slower, so in a tight loop I use it only for the product and keep the rest
      as numbers.
  - question: Explain Euclid's algorithm and its complexity.
    answer: >-
      It computes the gcd by replacing `(a, b)` with `(b, a % b)` until b is 0, then returns
      a. It works because any number dividing both a and b also divides `a % b`, which is a
      minus a multiple of b, so the set of common divisors never changes. It runs in O(log
      min(a, b)) steps, because every two steps at least halve the larger value; consecutive
      Fibonacci numbers are the worst case. I write it as a loop, not recursion, so depth is
      never a concern. Its main uses are the lcm, computed as `a / gcd * b` to avoid
      overflow, reducing fractions, and cycle questions such as how many positions a step of
      m visits round a circle of n, which is n / gcd(n, m).
  - question: When would you reach for a sieve instead of trial division?
    answer: >-
      When I need primes or factorisations for many numbers up to a known limit. Trial
      division is O(√n) per number, so checking every number up to n costs O(n√n). A sieve
      does all of them in O(n log log n), and storing each number's smallest prime factor
      turns any factorisation into O(log n) divisions. Combined with prefix sums it answers
      range questions, like counting primes or semiprimes between P and Q, in O(1) each.
      The trade-off is memory: one entry per number, so a limit of 10⁷ is fine in a typed
      array, but 10¹⁰ is not. For one or two numbers, trial division is simpler and cheaper.
