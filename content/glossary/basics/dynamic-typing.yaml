term: dynamic typing
aka:
  - dynamically typed
  - runtime type checking
short: Checking a value's type only when the line using it runs, so mistakes appear while the program runs.
explain: |
  In Python or plain JavaScript, a variable can hold a number now and a string later. Nobody
  complains until an operation meets a value it can't handle.

  That makes small scripts quick to write and experiments cheap. The cost arrives with size.
  A typo in a rarely used branch waits silently until the day that branch runs.

  Dynamic doesn't mean untyped. Values still have types, and Python refuses `"3" + 4`. Teams
  add optional type hints and a checker to get some static safety back where it pays.
analogy: Finding out the parcel is too big for the letterbox when the postman tries to post it.
example:
  language: python
  code: |
    def total(prices):
        return sum(prices)

    total([12, 8])      # 20
    total(["12", "8"])  # TypeError, but only when this line runs
usage: It's dynamic typing, so the bug only shows when someone hits the refund path with a missing amount.
twin:
  term: static-typing
  difference: Dynamic typing finds a type mistake when the faulty line runs. Static typing finds it before the program starts, on every path at once.
