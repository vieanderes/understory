term: README
aka:
  - README.md
  - readme file
short: The front-page text file of a project, saying what it is and how to run it.
explain: |
  It's the first file anyone opens. A new teammate, a reviewer, you in six months. If it's
  missing or wrong, they lose an hour before they start.

  A good one is short. What it does, how to set it up and run it, how to run the tests.
  For a take-home, add the trade-offs you made, what you left out and how you used AI.

  Test it like code. Clone the repo into a new folder and follow your own steps. If you
  need to do anything the file doesn't say, add it.
analogy: The note on a borrowed flat's fridge, saying where the keys are, how the boiler works and what not to touch.
usage: Put the setup steps in the README; I couldn't get it running from a fresh clone.
related:
  - repository-host
  - take-home-assignment
  - design-doc
level: 1
