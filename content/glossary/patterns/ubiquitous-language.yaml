term: ubiquitous language
aka: [domain language, consistent vocabulary, shared vocabulary]
short: One agreed word per idea, used the same way by the team, the users and the code.
explain: |
  If the business says "booking" and the code says `reservation`, every conversation
  needs a translation. If `fetch`, `get` and `load` mean the same thing in three files, a
  reader can't tell when something really is different.

  Pick one word per idea, from the people who use the product, and use it everywhere.
  Then a new word signals a new idea.
analogy: A hospital where every ward calls the same thing by the same name, so nothing gets lost at handover.
usage: Stick to the ubiquitous language; the users call it a "member", so the table shouldn't be `customers`.
related: [intent-revealing-name, cohesion, principle-of-least-surprise]
level: 2
lessons: [clean.naming]
