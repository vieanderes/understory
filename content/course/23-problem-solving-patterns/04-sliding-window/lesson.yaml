id: algo.sliding-window
title: Sliding window
objective: Keep a running window over a sequence, grow and shrink it, and solve longest and shortest subarray problems in linear time.
level: essential
minutes: 10
concepts: [algo.fixed-window, algo.variable-window]
prerequisites: [algo.two-pointers]
opening:
  text: >-
    You'll answer "best run of consecutive items" questions in one pass. The trick is to
    update the window you have, instead of rebuilding it every time.

steps:
  - type: prose
    id: picture-window
    body: |-
      A **window** is a run of neighbouring items you look at together: days 3 to 5 of a
      list. A run inside an array is a **subarray**; inside a string, a **substring**.

      Instead of rebuilding each window, update the one you have. When it slides one place,
      one item enters and one leaves:

      ```js
      sum = sum + values[i] - values[i - k];
      ```

      Signals: "consecutive", "subarray", "substring", "longest run with no repeats".

  - type: multiple-choice
    id: spot-window-signal
    concept: algo.fixed-window
    difficulty: 1
    question: Which task wants a sliding window?
    choices:
      - text: The longest stretch of a playlist with no repeated song
        correct: true
        feedback: >-
          Yes. A run of neighbours that grows and shrinks as you scan.
      - text: Two prices that add up to a voucher
        feedback: >-
          Two items anywhere in the list is a complement lookup.
      - text: The status code in more than half the logs
        feedback: >-
          "More than half" is the majority count, not a run of neighbours.
      - text: Revenue between any two dates, asked many times
        feedback: >-
          Many range questions on fixed data want a prefix sum.

  - type: prose
    id: name-fixed-window
    body: |-
      That's a **fixed-size window**. Sum the first k items once. Then each step adds the
      item entering and subtracts the one leaving.

      Recomputing each window costs O(n × k). Sliding costs O(n), whatever the size of k.

  - type: code-challenge
    id: write-max-sum-of-k
    concept: algo.fixed-window
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: window.starter.py
      solution: window.solution.py
      tests: window.tests.py
    prompt: >-
      A shop dashboard shows its busiest run of `k` consecutive days. Write
      `maxSumOfK(values, k)`: the largest sum of `k` consecutive values, or `null` if `k` is 0
      or bigger than the list.


      `maxSumOfK([4, 2, 7, 1, 5], 3)` is `13`. Values can be negative.


      **Target:** O(n) for up to 1,000,000 values and any `k`. The tests include all
      negatives, `k` equal to the length, and a full-size run. Re-adding every window runs
      out of time.
    hints:
      - Neighbouring windows share all but two values. What changes when the window moves one place?
      - Start `best` at the first window's sum, not at 0.
      - 'Check `k` first. Then sum the first `k` values in a loop, and slide from index `k`.'

  - type: prose
    id: name-variable-window
    body: |-
      Some windows change size. Take the longest stretch of text with no repeated letter.

      Move `right` to grow the window. While the new letter is already inside, shrink from
      `left`. This is a **variable-size window**. A `Set` knows what's inside. Its `delete`
      method takes a letter out.

  - type: ai-review
    id: review-set-remove
    concept: algo.variable-window
    difficulty: 3
    language: js
    request: Write longestUnique(text), the length of the longest stretch with no repeated letter.
    flawClass: hallucinated-api
    code: |
      function longestUnique(text) {
        const inWindow = new Set();
        let left = 0;
        let best = 0;
        for (let right = 0; right < text.length; right++) {
          while (inWindow.has(text[right])) {
            inWindow.remove(text[left]);
            left++;
          }
          inWindow.add(text[right]);
          best = Math.max(best, right - left + 1);
        }
        return best;
      }
    prompt: >-
      An assistant wrote this. The test with `'abc'` passed, since no letter repeats. With
      `'abca'` it throws a `TypeError`. Tap the line at fault.
    lines: [7]
    reasons:
      - text: '`Set` has no `remove` method'
        correct: true
        feedback: >-
          Right. It's `delete`. `remove` exists in Python and Java, which fooled the assistant.
      - text: '`left++` should come before the removal'
        feedback: >-
          The order is right: remove the leftmost letter, then move past it.
      - text: '`inWindow.has` needs an index, not a letter'
        feedback: >-
          `has` takes the value itself. The crash comes from a method that doesn't exist.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Any text with a repeated letter
          correct: true
          feedback: >-
            Yes. Only a repeat reaches the line that calls `remove`.
        - text: An empty string
          feedback: >-
            The loop never runs, so it returns 0 without touching the broken line.
        - text: Text where every letter is different
          feedback: >-
            That's the `'abc'` test that already passed. No repeat, no shrinking.
    fix: |
      while (inWindow.has(text[right])) {
        inWindow.delete(text[left]);
        left++;
      }

  - type: code-challenge
    id: write-longest-unique
    concept: algo.variable-window
    difficulty: 4
    language: python
    starter: unique.starter.py
    solution: unique.solution.py
    tests: unique.tests.py
    twin:
      language: ts
      starter: unique.starter.ts
      solution: unique.solution.ts
      tests: unique.tests.ts
    prompt: >-
      A music app finds the longest stretch of a playlist with no repeated song. Write
      `longest_unique(songs)`, or `longestUnique` in TypeScript: the length of the longest
      run of consecutive songs with no id repeated.


      `longest_unique([3, 1, 4, 1, 5, 9])` is `4`: the run `4, 1, 5, 9`.


      **Target:** O(n) for up to 200,000 songs. The tests include no songs, all the same,
      and a full-size run. Restarting from every song runs out of time.
    hints:
      - Keep a window of songs with no repeats. What must happen when a repeat enters?
      - 'Grow `right` one song at a time. If the new song is already in the window, move `left` past its earlier copy.'
      - 'After adding the new song, keep the larger of `best` and `right - left + 1`.'

  - type: multiple-choice
    id: pick-why-linear
    concept: algo.variable-window
    difficulty: 3
    question: There's a `while` inside a `for`. Why is this still O(n)?
    choices:
      - text: Each letter enters once and leaves at most once
        correct: true
        feedback: >-
          Exactly. `left` only moves forward, so the inner loop runs n times in total.
      - text: The `while` loop never runs more than once
        feedback: >-
          It can run several times in one pass. But across all passes, n times at most.
      - text: A `Set` makes loops faster
        feedback: >-
          The `Set` makes each check fast. The loop count comes from `left` never moving back.

  - type: explain-back
    id: explain-sliding
    concept: algo.fixed-window
    difficulty: 3
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer asks why sliding the window beats adding up every window from
      scratch. What do you say?
    rubric:
      - Neighbouring windows share all but two items.
      - Sliding reuses the shared sum and changes only the entering and leaving items.
      - So each step costs constant work, O(n) in total, not O(n × k).
    modelAnswer: >-
      Two neighbouring windows share every item except the one entering and the one leaving.
      Recomputing adds all k items again. Sliding keeps the running sum and does one add and
      one subtract. So the whole pass is O(n) instead of O(n × k).

recap:
  - Slide a fixed window by adding the entering item and removing the leaving one.
  - Grow a variable window with `right`, and shrink it with `left` while a rule is broken.
  - Explain why a nested `while` can still be O(n).
recall:
  - id: card-window-signal
    concept: algo.fixed-window
    front: Which words in a problem point to a sliding window?
    back: >-
      "Consecutive", "subarray", "substring" and "every k items". Anything about a contiguous
      run.
  - id: card-fixed-step
    concept: algo.fixed-window
    front: What happens to the running sum when a fixed window slides one place?
    back: >-
      Add the item entering, subtract the item leaving. Nothing else changes.
  - id: card-variable-rule
    concept: algo.variable-window
    front: In a variable window, when does `left` move?
    back: >-
      While the window breaks the rule, for example while it holds a repeated letter.
  - id: card-variable-cost
    concept: algo.variable-window
    front: Why is a variable window O(n) despite its inner loop?
    back: >-
      `left` and `right` only move forward, so each item enters once and leaves at most once.

references:
  - kind: docs
    title: String cheatsheet for coding interviews
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/algorithms/string/
    note: Sliding windows over strings, including the longest substring without repeats.
    primary: true
    verified: true
  - kind: docs
    title: Sliding Window Technique
    authors: GeeksforGeeks
    venue: GeeksforGeeks
    url: https://www.geeksforgeeks.org/dsa/window-sliding-technique/
    note: Fixed and variable windows, with more worked problems.
    verified: true
  - kind: docs
    title: Set.prototype.delete()
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set/delete
    note: The method the review step is about.
    verified: true

deepDive: >-
  Every output here was run on Node 24.


  The variable window has a shortest form too: the smallest window whose sum reaches a
  target. Grow `right` until the sum is enough, then shrink `left` while it stays enough,
  recording the length each time. The same "each item enters and leaves once" argument
  gives O(n).


  A window only works when shrinking it makes things "less": fewer repeats, a smaller sum.
  With negative numbers, dropping an item can raise a sum, so "shortest window reaching a
  target" needs prefix sums or a deque instead. That's a good trap to name in an interview.
