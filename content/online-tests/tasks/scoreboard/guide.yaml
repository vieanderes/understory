approach: >-
  Do not raise every score on a catch-up. Remember the highest score at that moment as a
  floor instead. When a team scores, first lift it to the floor if it is below, then add
  the point. At the end, lift every score still below the floor. Each operation costs
  O(1), and the final pass costs O(N).
complexity: O(N + M) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N and M both reach 100,000**, and the word
      **efficient** is there. So a catch-up that touches all N scores could cost
      100,000 × 100,000 steps in the worst case. That will time out.

      Now read the story. Two operations: one point for a team, or everyone up to the top.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words at the top of the file. Note that N + 1 is the
      special value, not 0 or -1. Getting that wrong fails every catch-up test.
    code:
      ts: |-
        // Replay A on N scores: X adds a point to team X, N + 1 lifts everyone to the top score.
      python: |-
        # Replay A on N scores: X adds a point to team X, N + 1 lifts everyone to the top score.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - a single team, and a catch-up when nobody has scored yet;
      - a catch-up as the very first operation;
      - a catch-up as the very last operation, so nothing lifts the scores afterwards;
      - two catch-ups in a row.

      Put them in test-input.txt now.
    input:
      - "(1, [2])"
      - "(3, [4, 4, 2])"
      - "(3, [1, 2, 2, 4])"
      - "(2, [1, 3, 3, 2])"
  - kind: ask-ai
    title: Confirm the output shape, not the method
    minutes: 1
    body: |-
      A cheap question now saves a wrong answer later. Team numbers start at 1 but arrays
      start at 0, so check how the answer is laid out. It is narrow, and it asks nothing
      about the algorithm.
    prompt: >-
      Without solving it: the returned array has N entries, and entry 0 is team 1's score.
      Is that right? One sentence.
    expect: The assistant agrees. You will index with X - 1.
  - kind: write
    title: Bank a correct version first
    minutes: 4
    body: |-
      Write the direct replay yourself: a point is one update, a catch-up fills the whole
      array with the top score. It is too slow for the big tests, but it is correct. A
      correct slow answer already earns the correctness points.
    code:
      ts: |-
        // Replay A on N scores: X adds a point to team X, N + 1 lifts everyone to the top score.
        // Direct replay: a catch-up costs O(N), so O(N * M) in the worst case.
        function solution(N: number, A: number[]): number[] {
            const scores = new Array<number>(N).fill(0);
            let max = 0;
            for (const op of A) {
                if (op === N + 1) {
                    scores.fill(max);
                } else {
                    scores[op - 1] += 1;
                    if (scores[op - 1] > max) max = scores[op - 1];
                }
            }
            return scores;
        }
      python: |-
        # Replay A on N scores: X adds a point to team X, N + 1 lifts everyone to the top score.
        # Direct replay: a catch-up costs O(N), so O(N * M) in the worst case.
        def solution(N, A):
            scores = [0] * N
            best = 0
            for op in A:
                if op == N + 1:
                    scores = [best] * N
                else:
                    scores[op - 1] += 1
                    if scores[op - 1] > best:
                        best = scores[op - 1]
            return scores
    codeMode: full
  - kind: run
    title: Run the example and your cases
    minutes: 1
    body: |-
      Press **Run code**. The example must say OK. Then check each "Returned value" for your
      own cases against the rules, one operation at a time.
    expect: >-
      OK on the example, then [0], [0, 1, 0], [2, 2, 2] and [1, 2].
  - kind: plan
    title: Make the catch-up cost O(1)
    minutes: 3
    body: |-
      The slow part is filling N scores on every catch-up. You do not need to do it then.
      Store the top score as a **floor**: every team is at least that high now.

      When team X scores, lift it to the floor first if it is below, then add 1. At the
      end, lift every score still below the floor. One pass over A, one over the scores.
  - kind: optimise
    title: Replace the fill with a floor
    minutes: 4
    body: |-
      Type the change yourself: it touches three lines, and the reasoning is the whole
      task. Keep your edge cases in test-input.txt; they will catch a missed final lift.
    code:
      ts: |-
        // Replay A on N scores: X adds a point to team X, N + 1 lifts everyone to the top score.
        // A catch-up only records a floor; scores below it are lifted lazily: O(N + M) time.
        function solution(N: number, A: number[]): number[] {
          const scores = new Array<number>(N).fill(0);
          let floor = 0;
          let max = 0;
          for (const operation of A) {
            if (operation === N + 1) {
              floor = max;
              continue;
            }
            const i = operation - 1;
            scores[i] = Math.max(scores[i]!, floor) + 1;
            if (scores[i]! > max) max = scores[i]!;
          }
          return scores.map((score) => Math.max(score, floor));
        }
      python: |-
        # Replay A on N scores: X adds a point to team X, N + 1 lifts everyone to the top score.
        # A catch-up only records a floor; scores below it are lifted lazily: O(N + M) time.
        def solution(N, A):
            scores = [0] * N
            floor = 0
            best = 0
            for operation in A:
                if operation == N + 1:
                    floor = best
                    continue
                i = operation - 1
                scores[i] = max(scores[i], floor) + 1
                if scores[i] > best:
                    best = scores[i]
            return [max(score, floor) for score in scores]
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write a stress input
    minutes: 2
    body: |-
      Typing a long array by hand is a waste of your time. Ask for one input line that
      stresses the catch-up path. Do not ask it for the expected output: you check that by
      reasoning, or against your slow version.
    prompt: >-
      Give me one test input line in the format (3, [1, 4, 2]) with N = 4 and 30
      operations, where about a third of them are the catch-up value 5 and two catch-ups
      come in a row at least once. The line only, no answer and no code.
    expect: >-
      One line you can paste. Run it with the fast version, then with the slow one, and the
      two results match.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      A second look catches the classic slip here: forgetting the final lift. Ask for
      problems only, so the code stays yours.
    prompt: >-
      Review my current solution for correctness and time complexity. List any problems in
      one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N + M) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output: printing inside the loop slows the performance tests. Check
      the header comment states the complexity. Then submit.

      In the report, the all-catch-up test is the one the slow version would have failed.
