term: parallelism
aka: [parallel, running in parallel]
short: Several computations running at the very same instant, on separate processor cores or machines.
explain: |
  Resizing a thousand photos is pure computing, with no waiting. Taking turns on one core
  won't make it faster. Splitting the photos across four cores, each working at the same
  time, can make it nearly four times quicker.

  In JavaScript that means worker threads or Web Workers, which share no memory and pass
  messages. Only work that computes gains from it. And it has overhead: sending data
  between workers costs time, so tiny tasks can end up slower.
analogy: Four cooks, each with their own pan, all frying at the same moment.
usage: Image resizing is CPU-bound, so we need parallelism across worker threads, not more async code.
twin:
  term: concurrency
  difference: Parallelism does many things at the same instant on separate cores. Concurrency handles many things over the same period by taking turns.
related: [concurrency, throughput, thread, process]
level: 2
lessons: [scale.concurrency-vs-parallelism]
