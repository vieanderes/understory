id: cs.recursion
title: Recursion and the call stack
objective: Trace frames, and convert recursion to iteration.
level: essential
minutes: 10
concepts: [cs.recursion, cs.call-stack, cs.recursion-to-iteration]
prerequisites: [js.errors, cs.arrays-lists-hash-maps]
opening:
  text: >-
    You'll read a function that calls itself without getting lost, and know when it will
    crash. Folders, comment threads and page trees are all shaped for it.

steps:
  - type: prose
    id: name-recursion
    body: >-
      A function that calls itself is **recursive**. It needs two parts. The **base case**
      answers the smallest input directly. The **recursive case** does a little work and
      passes on a smaller problem.


      ```js
      function countdown(n) {
        if (n === 0) return;      // base case: nothing left
        console.log(n);
        countdown(n - 1);         // recursive case: a smaller n
      }
      ```


      Each call must move towards the base case. If it doesn't, the calls never stop.

  - type: prose
    id: name-trees
    body: >-
      Recursion shines on data shaped like a tree: folders in folders, replies to replies.
      Here's a comment thread. Each comment holds a list of replies, and each reply is a
      comment of the same shape.


      ```js
      const sameHere = { text: "Same here", replies: [] };
      const onPhones = { text: "Yes, on phones", replies: [sameHere] };
      const thread = { text: "Is this a bug?", replies: [onPhones] };
      ```


      To handle a comment, handle its own part, then call the same function on each reply.

  - type: playground
    id: fix-reply-count
    concept: cs.recursion
    difficulty: 2
    prompt: >-
      Bug report: the thread says "2 replies", but there are 3. The count skips replies to
      replies. Make `countReplies` call itself on each reply.
    html: |
      <p id="count"></p>
    js: |
      const sameHere = { text: "Same here", replies: [] };
      const onPhones = { text: "Yes, on phones", replies: [sameHere] };
      const fixed = { text: "Fixed in 2.1", replies: [] };
      const thread = { text: "Is this a bug?", replies: [onPhones, fixed] };

      function countReplies(comment) {
        let count = 0;
        for (const reply of comment.replies) {
          count = count + 1;
        }
        return count;
      }
      document.querySelector("#count").textContent = countReplies(thread) + " replies";
    editable: [js]
    checks:
      - label: The thread says 3 replies
        selector: '#count'
        text: 3 replies
    solution:
      js: |
        const sameHere = { text: "Same here", replies: [] };
        const onPhones = { text: "Yes, on phones", replies: [sameHere] };
        const fixed = { text: "Fixed in 2.1", replies: [] };
        const thread = { text: "Is this a bug?", replies: [onPhones, fixed] };

        function countReplies(comment) {
          let count = 0;
          for (const reply of comment.replies) {
            count = count + 1 + countReplies(reply);
          }
          return count;
        }
        document.querySelector("#count").textContent = countReplies(thread) + " replies";
    hints:
      - Each reply counts as 1, plus however many replies it has itself.
      - '`countReplies(reply)` gives the replies under one reply.'
      - 'Make the loop line `count = count + 1 + countReplies(reply);`.'

  - type: prose
    id: name-call-stack
    body: >-
      While `countReplies(thread)` waits for `countReplies(onPhones)`, both are running, each
      with its own `count`. They sit on the **call stack**: a pile of running calls, newest on
      top. Each call adds a **frame** with its variables. A return removes it.


      You've seen this pile: it's the stack trace in an error. It has a fixed size. Recursion
      that goes too deep overflows it, and JavaScript throws a `RangeError`.

  - type: predict-output
    id: predict-stack-overflow
    concept: cs.call-stack
    difficulty: 3
    language: js
    code: |
      function total(n) {
        if (n === 0) return 0;
        return n + total(n - 1);
      }

      console.log(total(5000));      // 12502500
      console.log(total(100000));
    question: The first call works. What does the second line do?
    choices:
      - text: It logs `5000050000`
        feedback: >-
          That's the right sum, and a loop gave us exactly that. But this version needs
          100,000 frames at once.
      - text: It throws a `RangeError`
        correct: true
        feedback: >-
          Right. "Maximum call stack size exceeded". Ours gave out near 9,000 frames.
      - text: It runs for ever
        feedback: >-
          It does head for the base case, so it would finish. The stack fills up long
          before it gets there.

  - type: prose
    id: name-explicit-stack
    body: >-
      A loop can do the same job with its own pile: an array of work still to do. `push` adds
      to the end, and `pop()` removes the last item and returns it. An array can grow far
      past the call stack's limit.


      Each folder here is `{ files: 3, folders: [...] }`. Start the pile with the top folder.
      Take one off, count its files, push its subfolders on. Stop when the pile is empty.

  - type: parsons
    id: arrange-explicit-stack
    concept: cs.recursion-to-iteration
    difficulty: 3
    language: js
    prompt: >-
      Count the files in a folder tree without recursion, using your own pile of folders
      still to visit.
    blocks:
      - id: open-function
        code: function countFiles(root) {
      - id: start-stack
        code: const stack = [root];
        indent: 1
        subgoal: Start with one folder to visit
      - id: start-count
        code: let count = 0;
        indent: 1
      - id: loop-open
        code: while (stack.length > 0) {
        indent: 1
        subgoal: Visit folders until none are left
      - id: take-folder
        code: const folder = stack.pop();
        indent: 2
      - id: add-files
        code: count = count + folder.files;
        indent: 2
      - id: push-subfolders
        code: stack.push(...folder.folders);
        indent: 2
        subgoal: Its subfolders still need a visit
      - id: loop-close
        code: '}'
        indent: 1
      - id: return-count
        code: return count;
        indent: 1
      - id: close-function
        code: '}'
    distractors:
      - id: recursive-call
        code: count = count + countFiles(folder);
        feedback: >-
          That's the recursive version creeping back in. Here the array does the remembering,
          so the function never calls itself.

  - type: ai-review
    id: review-base-case-misses
    concept: cs.recursion
    difficulty: 4
    language: js
    request: Write a function that adds up the whole numbers from 1 to n.
    flawClass: edge-case
    code: |
      function total(n) {
        if (n === 0) return 0;
        return n + total(n - 1);
      }
    prompt: >-
      An assistant wrote this. The tests tried 3 and 10, and both sums were right. Then a form
      sent `2.5`, and the page crashed with "Maximum call stack size exceeded". Tap the line at
      fault.
    lines: [2]
    reasons:
      - text: '`n - 1` should be `n - 2`'
        feedback: >-
          Stepping by 2 would skip numbers, and odd inputs would still miss 0. The step is
          fine. The stopping rule isn't.
      - text: The base case only catches exactly 0
        correct: true
        feedback: >-
          Yes. 2.5 goes to 1.5, 0.5, then -0.5, and never equals 0. Test `n <= 0`.
      - text: Recursion can't handle decimals
        feedback: >-
          It can handle any value. What matters is that every input reaches a base case, and
          this one steps over it.
    fix: |
      function total(n) {
        if (n <= 0) return 0;        // catches 0, negatives, and anything that steps past 0
        return n + total(n - 1);
      }

  - type: code-challenge
    id: write-sum-nested
    concept: cs.recursion
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `sumNested(list)`. The list holds numbers, and lists of the same kind, nested to
      any depth. Return the sum of every number in it.


      An empty list adds nothing. Don't change the input.


      So `sumNested([1, [2, [3, 4]], 5])` is `15`.
    hints:
      - Look at one item at a time. It's either a number or another list.
      - '`typeof item === "number"` tells them apart. A number is the base case.'
      - An inner list is a smaller version of the same problem, so the same function can sum it.

  - type: explain-back
    id: explain-stack-overflow
    concept: cs.call-stack
    difficulty: 4
    prompt: >-
      A recursive function works on a list of 100 items and throws a `RangeError` on a list of
      100,000. The logic is correct. Why does the longer list crash it?
    rubric:
      - Each call adds a frame to the call stack, and the frame stays until that call returns.
      - No call can return until the ones below it do, so 100,000 items need 100,000 frames at once.
      - The call stack has a fixed size, so deep recursion overflows it, and a loop with its own stack doesn't.
    modelAnswer: >-
      Every call gets a frame on the call stack, holding its variables and where to go back
      to. In this function no call can finish until the next one does. So with 100,000 items,
      100,000 frames are all waiting at once. The stack is a fixed size, and ours held about
      9,000. Past that, JavaScript throws "Maximum call stack size exceeded". Nothing is wrong
      with the logic. I'd rewrite it as a loop that keeps its own stack in an array. That can grow as far as
      memory allows.

recap:
  - Read a recursive function as a base case plus a step towards it.
  - Picture the call stack, where each waiting call holds a frame until it returns.
  - Swap deep recursion for a loop with your own pile, so depth can't overflow.

recall:
  - id: card-two-parts
    concept: cs.recursion
    front: What two parts does every recursive function need?
    back: >-
      A base case that answers the smallest input directly, and a recursive case that passes
      on a smaller problem.
  - id: card-frame
    concept: cs.call-stack
    front: What is a stack frame?
    back: >-
      One call's entry on the call stack. It holds that call's variables and where to carry
      on when it returns.
  - id: card-overflow
    concept: cs.call-stack
    front: Why does very deep recursion throw a `RangeError`?
    back: >-
      Each waiting call keeps a frame, and the call stack has a fixed size. Too many frames
      at once overflow it.
  - id: card-explicit-stack
    concept: cs.recursion-to-iteration
    front: How do you turn a recursion into a loop?
    back: >-
      Keep your own stack in an array. Pop an item, do its work, and push whatever it would
      have recursed into.

