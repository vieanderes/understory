term: dataframe
aka:
  - data frame
  - DataFrame
short: An in-memory table of named, typed columns that you filter, group and join in code.
explain: |
  Eval results, logs and usage reports are tables. Lists of dicts work for ten rows. At ten
  thousand, filtering and averaging by hand gets slow and full of bugs.

  A dataframe holds each column as a typed array. You filter with a boolean mask, group by a key, or merge two tables on a shared column. Each takes
  one line. It reads CSV,
  JSON and Parquet directly.

  Two traps catch everyone. Merging on a key that repeats multiplies rows. And looping over
  rows in Python throws away the speed, so stay with whole-column operations.
analogy: A spreadsheet you drive with code instead of a mouse.
example:
  language: python
  code: |
    import pandas as pd

    runs = pd.read_csv("eval_runs.csv")
    passed = runs[runs["score"] >= 0.8]
    by_model = runs.groupby("model").agg(mean_score=("score", "mean"))
usage: Load the eval results into a dataframe and group by prompt version before we argue about it.
