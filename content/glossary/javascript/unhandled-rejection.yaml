term: unhandled rejection
aka: [unhandled promise rejection, floating promise, unhandledrejection]
short: A failed promise that nothing awaits or catches, so its error escapes every try block.
explain: |
  A `try` only catches what it awaits. Call an async function without `await` and its
  failure happens later, outside the `try`. Node may crash the process; browsers log a
  warning and carry on.

  Await every promise, or return it, or attach a `.catch`. A linter rule for floating
  promises finds the ones you missed.
analogy: Posting a letter with no return address. If it can't be delivered, nobody hears back.
example:
  language: ts
  code: |
    try {
      sendEmail(user); // no await: its failure escapes this try
    } catch (err) {
      log(err);
    }
usage: The worker died on an unhandled rejection from a call nobody awaited.
related: [promise, async-await, exception, swallowed-error]
level: 2
lessons: [clean.errors]
