term: state diagram
aka:
  - state machine diagram
  - state chart
short: A drawing of every condition one thing can be in, and the events that move it between them.
explain: |
  An order is draft, then paid, then shipped. Or cancelled. Or refunded. A drawing with a
  box per state and an arrow per allowed move makes the rules visible.

  It shows what's missing. Can a shipped order be cancelled? What happens if payment fails
  twice? If no arrow exists, the code shouldn't allow it either.

  Keep it to one thing. When the boxes start being different things, you want a sequence
  diagram instead.
analogy: A board game's rules for one piece, showing where it can move from each square.
example:
  language: text
  code: |
    stateDiagram-v2
      [*] --> Draft
      Draft --> Paid: payment ok
      Paid --> Shipped: dispatched
      Paid --> Refunded: refund
      Shipped --> [*]
usage: Draw the state diagram for an episode; nobody knows if "rejected" can go back to "draft".
