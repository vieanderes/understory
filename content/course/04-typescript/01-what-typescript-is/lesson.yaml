deepDive: >-
  TypeScript comes from Microsoft and first shipped in 2012. The compiler is called `tsc`. You'll
  run it from the terminal in the Tooling chapter, where a build step checks the whole project.


  Recent versions of Node run a `.ts` file directly. They don't check it: they replace each
  annotation with spaces and run what's left. That's erasure again, done at start-up. A few
  TypeScript features, such as `enum`, produce real code, so they can't be erased that way.


  `// @ts-expect-error` tells the checker that the next line has an error on purpose. When the
  error goes away, the comment itself becomes an error, so it can't linger. Its older cousin,
  `// @ts-ignore`, stays silent forever, which is why reviewers dislike it.
