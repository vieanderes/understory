id: pyai.pytest
title: Testing with pytest
objective: "Write tests with plain assert, share setup with fixtures, cover cases with parametrize, and fake a model call."
level: essential
minutes: 10
concepts: [pyai.pytest-basics, pyai.fixtures, pyai.parametrize, pyai.faking-model-calls]
prerequisites: [pyai.threads-and-processes, testing.what-to-test]
opening:
  text: >-
    You'll test Python code that calls a model, without calling the model. Your tests will
    run in milliseconds, cost nothing, and give the same answer every time.

steps:
  - type: prose
    id: pytest-basics
    body: |-
      In chapter 11 you wrote tests with a test runner. **pytest** is Python's usual one.
      It runs every function whose name starts with `test_`, in files named `test_*.py`.
      A test is a plain `assert`:

      ```python
      def test_total_applies_discount():
          assert total([10, 10], discount=0.1) == 19.0
      ```

      ```text
      $ uv run pytest -q
      E   assert 18.0 == 19.0
      1 failed in 0.02s
      ```

      On a failure it shows both sides, so you see the real value.

  - type: multiple-choice
    id: pick-collected
    concept: pyai.pytest-basics
    difficulty: 1
    question: Which one does pytest run on its own?
    choices:
      - text: '`test_refund()` in `test_orders.py`'
        correct: true
        feedback: >-
          Right. Both the file and the function start with `test_`.
      - text: '`check_refund()` in `test_orders.py`'
        feedback: >-
          The file is found, but the function name must start with `test_` too.
      - text: '`test_refund()` in `orders_check.py`'
        feedback: >-
          The function fits, but pytest only looks in files named `test_*.py` or `*_test.py`.

  - type: prose
    id: fixtures
    body: |-
      A **fixture** builds something tests need. A test asks for it by naming it as a
      parameter:

      ```python
      @pytest.fixture
      def fake_client():
          client = FakeClient([{"label": "refund", "confidence": 0.95}])
          yield client
          assert client.calls, "the model was never called"

      def test_triage(fake_client):
          assert triage(fake_client, "Money back") == "auto:refund"
      ```

      Code before `yield` runs first, and the test gets the value. Code after `yield` runs
      when the test ends, pass or fail.

  - type: fill-blank
    id: fill-fixture
    concept: pyai.fixtures
    difficulty: 2
    language: python
    prompt: Give every test that asks for `orders` a fresh empty list.
    template: |
      @pytest.{{1}}
      def orders():
          {{2}} []

      def test_starts_empty({{3}}):
          assert len(orders) == 0
    blanks:
      - key: '1'
        answer: fixture
      - key: '2'
        answer: yield
      - key: '3'
        answer: orders
    bank: [fixture, mark, yield, print, orders, self]

  - type: prose
    id: parametrize
    body: |-
      Say a **classifier**, a model that sorts text into labels, also returns its
      **confidence**: how sure it is, from 0 to 1. Code routes on that number. One test body
      can check many rows:

      ```python
      @pytest.mark.parametrize("confidence, expected", [
          (0.95, "auto"),
          (0.3, "human"),
      ])
      def test_route(confidence, expected):
          assert route(confidence) == expected
      ```

      Each row runs as its own test. Pick rows where bugs hide: on the boundary.

  - type: ai-review
    id: review-missing-boundary
    concept: pyai.parametrize
    difficulty: 3
    language: python
    request: 'Route by confidence: 0.9 or more is automatic, 0.6 or more goes to a human. Add tests.'
    flawClass: edge-case
    code: |
      def route(label, confidence):
          if confidence > 0.9:
              return f"auto:{label}"
          if confidence >= 0.6:
              return "human"
          return "refuse"

      @pytest.mark.parametrize("confidence, expected", [
          (0.95, "auto:refund"),
          (0.7, "human"),
          (0.2, "refuse"),
      ])
      def test_route(confidence, expected):
          assert route("refund", confidence) == expected
    prompt: >-
      An assistant wrote this, and all three tests pass. Tap the line that breaks the
      request.
    lines: [2]
    reasons:
      - text: A score of exactly 0.9 goes to a human
        correct: true
        feedback: >-
          Yes. `>` leaves out 0.9. A row for `(0.9, "auto:refund")` would catch it.
      - text: A score of exactly 0.6 is refused
        feedback: >-
          Line 4 uses `>=`, so 0.6 reaches a human as asked. Look at 0.9 instead.
      - text: The label is lost for automatic routes
        feedback: >-
          The f-string keeps it: `auto:refund`. The boundary is the problem.
    fix: |
      def route(label, confidence):
          if confidence >= 0.9:
              return f"auto:{label}"
          if confidence >= 0.6:
              return "human"
          return "refuse"

      @pytest.mark.parametrize("confidence, expected", [
          (0.9, "auto:refund"),
          (0.89, "human"),
          (0.6, "human"),
          (0.59, "refuse"),
      ])
      def test_route(confidence, expected):
          assert route("refund", confidence) == expected

  - type: prose
    id: fakes
    body: >-
      Never call the real model in a unit test. It's slow and it costs money. Its answer
      can change from run to run, so a test could pass today and fail tomorrow.


      Pass a **fake client** instead, like the one in lesson 1. It returns recorded replies
      and notes every call, so the test checks what your code does with a reply.

  - type: code-challenge
    id: write-triage-tests
    concept: pyai.faking-model-calls
    difficulty: 3
    language: python
    starter: fake.starter.py
    solution: fake.solution.py
    tests: fake.tests.py
    prompt: >-
      First write `FakeClient(replies)`. `classify(ticket)` notes the ticket in
      `self.calls` and returns the next reply, in order. When they run out, raise
      `AssertionError("no more replies")`.


      Then fill in the two tests for `triage`, using the fake. Use a confidence of exactly
      `0.9` in the first. We'll run your tests against three broken versions of `triage`,
      and they should catch each one.
    hints:
      - The number of calls so far tells you which reply comes next.
      - >-
        A reply is a dict like `{"label": "refund", "confidence": 0.9}`.
      - >-
        In a test, `fake = FakeClient([...])`, then `assert triage(fake, "...") == "auto:refund"`.

  - type: explain-back
    id: explain-why-fake
    concept: pyai.faking-model-calls
    difficulty: 3
    prompt: Why do unit tests use a fake model client instead of calling the real model?
    rubric:
      - Real calls are slow, cost money and need a key and a network.
      - Real replies vary, so the same test could pass once and fail the next time.
      - The fake tests your own code's handling of a reply, the same way every run.
    modelAnswer: >-
      A real call is slow, costs money and fails when the network or key is missing. Its
      replies also vary, so the test would be flaky. A fake returns a fixed reply, so the
      test checks what my code does with it, every time. How good the model is belongs in
      evals, which chapter 20 covers.

recap:
  - Write `test_` functions with plain `assert`, and read both values when one fails.
  - Share setup with fixtures, and cover many rows with `parametrize`, boundaries included.
  - Pass a fake model client in tests, so they're fast, free and repeatable.

recall:
  - id: card-collect
    concept: pyai.pytest-basics
    front: Which files and functions does pytest run?
    back: >-
      Functions starting with `test_` in files named `test_*.py` or `*_test.py`.
  - id: card-fixture-yield
    concept: pyai.fixtures
    front: In a fixture, when does the code after `yield` run?
    back: >-
      After the test that used it finishes, whether it passed or failed.
  - id: card-parametrize
    concept: pyai.parametrize
    front: Which rows should a table for a threshold always include?
    back: >-
      The boundary itself and the value right below it, such as `0.9` and `0.89`.
  - id: card-fake
    concept: pyai.faking-model-calls
    front: What does a fake model client do in a test?
    back: >-
      It returns recorded replies and notes each call, so the test runs fast, free and the
      same every time.

