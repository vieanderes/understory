term: pre-mortem
aka:
  - premortem
short: Imagining before launch that the project has already failed, then listing the likeliest reasons why.
explain: |
  Asking "what could go wrong?" gets polite answers. Asking "it's three months from now and
  this failed; what happened?" gets honest ones. The failure is a given, so naming a cause
  isn't pessimism.

  Each person writes reasons alone first, then the team pools them and ranks them by
  likelihood and harm. The top few get a check, a test or a rollback plan before launch.
analogy: Packing for a hike by picturing yourself soaked and lost on the hill, then packing for exactly that.
usage: Run a pre-mortem on the migration before Friday; I'd rather find the failure on paper.
twin:
  term: blameless-postmortem
  difference: A pre-mortem imagines a failure before launch to prevent it. A postmortem studies a real failure after it happened.
related:
  - blameless-postmortem
  - design-doc
  - threat-model
level: 3
lessons:
