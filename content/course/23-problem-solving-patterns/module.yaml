id: algo
number: 23
title: "Problem-solving patterns"
summary: "The patterns behind most coding-round problems: hash maps, two pointers, sliding windows, prefix sums, stacks, binary search, BFS and DFS, heaps, intervals, dynamic programming and backtracking, with a method for any problem."
why: "A coding round tests whether you can turn a problem into a known pattern and explain the cost."
youCanBuild: "A solved set of classic problems, one per pattern, each with tests and a complexity note."
concepts:
  - id: algo.constraints-first
    title: "Constraints first"
    summary: "Input size, value ranges and edge cases decide which complexity is acceptable, so you ask before choosing an approach."
  - id: algo.brute-force-first
    title: "Brute force, then better"
    summary: "A correct slow solution stated first gives a baseline, and naming its bottleneck points at the pattern that removes it."
  - id: algo.edge-cases
    title: "Edge cases"
    summary: "Empty input, one item, duplicates, negatives and the largest size are checked before you call a solution done."
  - id: algo.frequency-counting
    title: "Counting"
    summary: "A map from value to count answers questions about duplicates, anagrams and majorities in one pass."
  - id: algo.complement-lookup
    title: "Complement lookup"
    summary: "Storing what you have seen lets each new item ask in constant time whether its partner came before, as in two sum."
  - id: algo.grouping-by-key
    title: "Grouping by a key"
    summary: "Computing a canonical key for each item, such as its sorted letters, groups equivalent items in one pass."
  - id: algo.opposite-pointers
    title: "Pointers from both ends"
    summary: "On sorted data a left and a right pointer move inwards, each step ruling out one candidate, in linear time."
  - id: algo.fast-and-slow-pointers
    title: "Read and write pointers"
    summary: "One pointer reads every item and one marks where the next kept item goes, which changes an array in place in one pass."
  - id: algo.fixed-window
    title: "Fixed-size windows"
    summary: "A window of k items slides by adding the entering item and removing the leaving one, instead of summing k items each time."
    confusableWith: [algo.kadane]
  - id: algo.variable-window
    title: "Variable-size windows"
    summary: "The right edge grows the window and the left edge shrinks it while a condition is broken, so each item enters and leaves once."
  - id: algo.boundary-search
    title: "Finding a boundary"
    summary: "Binary search finds the first index where a monotonic condition becomes true, which covers lower bound, upper bound and insert position."
  - id: algo.search-on-answer
    title: "Searching the answer"
    summary: "When checking a candidate answer is easy and the check is monotonic, binary search over the range of answers finds the best one."
  - id: algo.bfs-shortest-path
    title: "BFS for shortest paths"
    summary: "Breadth-first search visits nodes in order of distance with a queue, so the first time it reaches a node is by a shortest path."
  - id: algo.dfs-components
    title: "DFS and connected components"
    summary: "Depth-first search explores one branch fully before backtracking, and starting it from each unvisited node counts the components."
  - id: algo.grid-graphs
    title: "Grids as graphs"
    summary: "Each cell of a grid is a node with up to four neighbours, and a visited set stops the search going round in circles."
  - id: algo.binary-heap
    title: "Binary heaps"
    summary: "A binary heap in an array keeps the smallest item at the root, with push and pop in O(log n)."
  - id: algo.top-k
    title: "Top k with a heap"
    summary: "A min-heap of size k keeps the k largest items seen so far, so each new item costs O(log k)."
  - id: algo.k-way-merge
    title: "Merging k sorted lists"
    summary: "A heap holding the head of each list always yields the next smallest item across all of them."
  - id: algo.overlapping-subproblems
    title: "Overlapping subproblems"
    summary: "A problem suits dynamic programming when its best answer is built from answers to smaller versions that repeat."
  - id: algo.memoisation
    title: "Memoisation"
    summary: "Caching each subproblem's answer by its arguments turns an exponential recursion into one that solves each state once."
  - id: algo.tabulation
    title: "Tabulation"
    summary: "Filling a table from the smallest states upwards gives the same answers without recursion, and often needs only the last row."
    confusableWith: [algo.greedy-choice]
  - id: algo.pattern-recognition
    title: "Recognising the pattern"
    summary: "Signals in a problem, such as sorted input, a contiguous range, shortest steps or the best k, point at the pattern to try first."
  - id: algo.communicating-solutions
    title: "Thinking aloud"
    summary: "Saying your plan, its complexity and your tests as you go lets the interviewer follow and help, and shows how you work."
  - id: algo.prefix-sums
    title: "Prefix sums"
    summary: "A running total stored at every index turns the sum of any range into one subtraction."
  - id: algo.difference-arrays
    title: "Difference arrays"
    summary: "Recording where each range update starts and stops, then taking a running total, applies many range updates in one pass."
  - id: algo.stack-matching
    title: "Matching with a stack"
    summary: "The most recent unmatched opener sits on top of a stack, so each closer checks and pops it in constant time."
    confusableWith: [algo.monotonic-stack]
  - id: algo.monotonic-stack
    title: "Monotonic stack"
    summary: "A stack kept in sorted order pops every item that a new, larger item answers, so next-greater questions take one pass."
    confusableWith: [algo.stack-matching]
  - id: algo.counting-array
    title: "Counting arrays"
    summary: "When values fall in a small known range, an array indexed by value counts them without sorting or hashing."
  - id: algo.leader
    title: "The leader"
    summary: "A value held by more than half the items survives pairing off different values, so one pass with a candidate and a count finds it."
  - id: algo.kadane
    title: "Best slice ending here"
    summary: "The best slice ending at each index either extends the previous one or starts afresh, so one pass finds the best slice overall."
    confusableWith: [algo.fixed-window]
  - id: algo.slice-state
    title: "Carrying state through a pass"
    summary: "Variants such as the lowest price so far or the best slice from each side are solved by carrying the right running values forwards and backwards."
  - id: algo.interval-sorting
    title: "Sorting intervals"
    summary: "Sorted by start, overlapping intervals sit next to each other, so one pass merges them or counts how many overlap."
  - id: algo.greedy-choice
    title: "A safe greedy choice"
    summary: "A greedy algorithm commits to the locally best option, which is only correct when you can argue no better answer needs a different choice."
    confusableWith: [algo.tabulation]
  - id: algo.backtracking
    title: "Choose, explore, undo"
    summary: "Backtracking builds candidates one choice at a time, recurses, then undoes the choice, visiting every combination once."
  - id: algo.pruning
    title: "Pruning"
    summary: "Stopping a branch as soon as it cannot lead to a valid answer is what keeps an exponential search usable."
  - id: algo.divisors-and-gcd
    title: "Divisors and gcd"
    summary: "Divisors come in pairs around the square root, and Euclid's algorithm finds the greatest common divisor in logarithmic steps."
  - id: algo.sieve
    title: "The sieve"
    summary: "Crossing out multiples of each prime marks every prime up to n in O(n log log n), and can store the smallest factor too."
  - id: algo.safe-integers
    title: "Exact integers in JavaScript"
    summary: "Numbers are exact only up to 2^53, so large sums and products need BigInt, modular arithmetic or a different order of operations."
  - id: algo.topological-sort
    title: "Topological sort"
    summary: "Repeatedly taking a task with no unmet dependencies gives a valid order, and leftover tasks prove a cycle."
  - id: algo.union-find
    title: "Union-find"
    summary: "Each item points towards a group representative, and path compression keeps finding it close to constant time."
