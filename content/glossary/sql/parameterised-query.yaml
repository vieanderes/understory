term: parameterised query
aka: [parameterized query, prepared statement, bind parameter, query parameter placeholder]
short: A SQL statement with placeholders, where user values are sent separately and never read as SQL.
explain: |
  Gluing user input into a SQL string lets a crafted value rewrite the query. That's SQL
  injection. With placeholders like `$1`, the database receives the statement and the
  values apart, so a value can only ever be a value.

  Every database driver supports it. Use it for every value, including ones you think are
  safe. Table and column names can't be parameters, so check those against a fixed list.
analogy: A form with boxes to fill in. Whatever you write in the name box can't change the questions on the form.
example:
  language: ts
  code: |
    // never: `... WHERE email = '${email}'`
    await db.query('SELECT id FROM users WHERE email = $1', [email]);
usage: This query builds its WHERE clause from a string; switch it to a parameterised query.
twin:
  term: sql-injection
  difference: SQL injection is the attack, where input is read as code. A parameterised query is the defence that keeps input as data.
related: [sql-injection, orm]
level: 1
lessons: [pro.sql]
