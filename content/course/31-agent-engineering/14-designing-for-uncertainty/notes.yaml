summary: >-
  An agent will sometimes be wrong. That isn't a bug you fix once: it's a property of the
  system, like network latency. So the interface has to be designed for it, from the side
  of the person using the agent, not the engineer watching the traces.


  Four habits carry the design. **Set expectations** up front: say what the agent can do and
  what goes to a person. **Show confidence honestly**, in plain words with the sources an
  answer rests on, never a self-rated percentage. **Ask a clarifying question** when a
  request has two readings and a wrong guess is costly, and only then. And make actions
  safe to get wrong: **preview** before acting, **undo** where possible, a clear warning
  where not, and a **handoff** to a person that carries the whole conversation along.


  Designing the human's part covered the reviewer behind the agent. This lesson covers the
  person in front of it, who never sees a trace and only knows what the screen tells them.
remember:
  - Design for the agent being wrong sometimes, because it will be, and the screen is all the user sees.
  - Say up front what the agent can and can't do, so requests it can't handle never start.
  - Show confidence as plain words plus the sources behind the answer, so a person can check it.
  - A confidence the model states about itself tends to run high and hasn't been checked, so never show it as a percentage.
  - Ask one short question with options only when a request is ambiguous and a wrong guess is costly.
  - Never report an action as done until the system has confirmed it.
  - Preview every action, offer undo where you can, and say plainly before the click when you can't.
  - A handoff passes the request, what the agent tried and the whole chat, so the user never repeats themselves.
sections:
  - title: What honest confidence looks like on screen
    body: |-
      Users read an agent's tone as its certainty. A fluent, confident sentence feels right
      whether or not it is. So the interface has to carry the uncertainty the prose hides.

      Three levels cover most products, each with its own wording:

      ```text
      Found:      Refunds take five working days. [Refund policy, section 2]
      Likely:     It looks like the 7pm slot is free. Check before you set off.
      Not found:  I couldn't find a rule about that. Staff can answer.
      ```

      The level comes from evidence you can measure, not from asking the model how sure it
      is. Good signals are whether retrieval returned a source above a similarity bar,
      whether the answer quotes it, and whether two samples of the answer agree. Each can be
      checked against labelled outcomes, as Confidence thresholds and calibration showed.

      Sources do two jobs. They let the person check a claim in one click, and they make a
      wrong answer visible: a citation that doesn't say what the answer claims is the fastest
      way a user spots a mistake. RAG built the "say you don't know" rule into the prompt.
      The interface is where that rule becomes a sentence the user can act on: what wasn't
      found, and who can help.

      Avoid the two common failures. A percentage on every answer looks scientific and isn't.
      A blanket "AI can make mistakes" footer is true and useless, because it doesn't say
      which answers to check.
  - title: Choosing when to ask
    body: |-
      A clarifying question trades a turn for certainty. It pays only when the certainty is
      worth more than the turn.

      Two conditions must both hold. The request has more than one reading that leads to
      different actions, and acting on the wrong one costs something real: money, a lost
      table, an email that can't be recalled. "Show my bookings" from a guest with two
      bookings is ambiguous but cheap: show both. "Cancel my booking" is ambiguous and
      costly: ask.

      A good question is short and closed:

      ```text
      Which booking should I cancel?
      [Fri 12 June, 2 people]  [Sat 20 June, 6 people]
      ```

      It names the options the agent found, so the user taps instead of typing. It asks one
      thing. And it changes nothing until answered, using the same interrupt and resume as
      an approval in Designing the human's part.

      Watch the cost of asking, too. If users nearly always pick the option the agent would
      have guessed, the question is friction. Log each question with the guess the agent
      would have made and the answer it got, and drop questions whose answer is predictable.
  - title: Actions that are safe to get wrong
    body: |-
      For an action, the question isn't only "is the agent right" but "what happens if it
      isn't". Design so a wrong action is cheap.

      **Preview** first: one line saying exactly what will change, with the details filled
      in, and a Confirm button. "Cancel Sat 20 June, 6 people, at 7pm" beats "Cancel booking".

      **Report only confirmed results.** The status says "Cancelling..." until the server
      answers, then the real outcome. A failure says what is still true: "Your booking is
      still on".

      **Undo** where you can. Many actions can be held briefly and committed later, which
      turns a mistake into one click. Where the action leaves your system at once, a payment
      or a message to another person, say so before the click: "This can't be undone."

      **Hand off** with context. The ticket carries the original request, the tool calls the
      agent made and the transcript, and the user hears when a person will reply.

      ```ts
      staffQueue.add({
        request: chat.firstMessage,
        tried: chat.toolCalls,
        transcript: chat.messages,
      });
      ```

      Offer the handoff without making people fight for it. A visible "Talk to a person"
      option is a safety valve, not a failure.
pitfalls:
  - '**Showing the model''s self-rated confidence.** It looks precise and runs high. Show plain words and sources, or a band measured against outcomes.'
  - '**A generic "may make mistakes" footer.** It warns about everything and so about nothing. Mark the specific answers that lack support.'
  - '**Asking about every request.** Each question costs a turn. Ask only when the request is ambiguous and a wrong guess is costly.'
  - '**Open-ended clarifying questions.** "Can you say more?" makes people write. Offer the options the agent found, as buttons.'
  - '**Saying done before it is.** An optimistic success message turns a server error into a user who believes the wrong thing. Wait for the confirmation.'
  - '**Silent irreversibility.** People assume undo exists. Say before the click when it does not.'
  - '**A handoff that starts from zero.** Making users repeat themselves to a person is the moment they give up. Send the whole chat.'
verify:
  - lens: breaks
    check: When the action call fails or times out, the screen says what is still true instead of a success message.
  - lens: confuses
    check: Every answer either cites a source the user can open or says plainly that nothing was found.
  - lens: tests
    check: A test with a request that has two readings and a costly action checks that the agent asks and changes nothing.
  - lens: scales
    check: Track how often each clarifying question is answered with the agent's own guess, and drop the ones that are.
  - lens: leaks
    check: A handoff ticket carries only the chat and the booking it concerns, not the user's whole account history.
interview:
  - question: How would you show an LLM agent's confidence to end users?
    answer: >-
      In words and evidence, not a self-reported number. A model's own rating of how sure it
      is runs high, so "92% sure" misleads and people trust it anyway. I'd show the answer
      with the source it rests on, linked, and use a small set of plain levels: found in a
      source, likely and worth checking, or not found with a route to a person. The level
      comes from signals I can calibrate against labelled outcomes, such as whether retrieval
      found a source above a bar or whether two samples agree. The trade-off is less apparent
      precision, which is the point: the user's attention goes to the claims that need it.
  - question: When should an agent ask a clarifying question, and when should it just act?
    answer: >-
      Ask when two things are true at once: the request has more than one reading that leads
      to different actions, and a wrong guess is costly. "Cancel my booking" from a guest with
      two bookings qualifies; "show my bookings" doesn't, because showing both costs nothing.
      The question should be short and closed, listing the options the agent found as
      buttons, and nothing should change until it's answered. Asking too often is its own
      failure, so I'd log the guess the agent would have made beside each answer, and stop
      asking questions whose answer matches the guess almost every time.
  - question: An agent can take actions for users. How do you make its mistakes recoverable?
    answer: >-
      Assume some actions will be wrong and make each one cheap to undo. Preview first: one
      line with exactly what will change and a Confirm button. Report only confirmed results,
      so a timeout shows "your booking is still on", not a false success. Offer undo where
      the action can be held or reversed, often a short delay before committing, and state
      plainly before the click when it can't be undone. Finally, a visible handoff to a
      person that carries the request, the agent's tool calls and the transcript, so nobody
      repeats themselves. The cost is a little friction on every action, which is cheaper
      than one wrong cancellation.
