id: react.updating-objects-and-arrays
title: Updating objects and arrays
objective: Change objects and arrays in state by making new copies, so React sees the change and renders.
level: essential
minutes: 10
concepts: [react.updating-objects, react.updating-arrays]
prerequisites: [react.lists-and-keys, js.references-and-copying]
opening:
  text: >-
    You'll fix the button that adds an item to a list and seems to do nothing. It's one of
    the first React bugs almost everyone writes.

steps:
  - type: prose
    id: same-array-no-render
    body: |-
      When you call a setter, React compares the new value with the old one. If they're the
      same, there's nothing to draw, so it skips the render.

      For an array or an object, "the same" means the same one in memory. You met this in
      chapter 3: two names can point at one array.

      ```tsx
      guests.push("Cleo");
      setGuests(guests); // the very same array
      ```

      React sees the same array it already has.

  - type: predict-output
    id: predict-push-then-set
    concept: react.updating-arrays
    difficulty: 2
    language: tsx
    code: |
      function Guests() {
        const [guests, setGuests] = useState(["Ana", "Ben"]);
        function add() {
          guests.push("Cleo");
          setGuests(guests);
        }
        return (
          <div>
            <p>{guests.join(", ")}</p>
            <button onClick={add}>Add Cleo</button>
          </div>
        );
      }
    question: You click Add Cleo. What does the paragraph show?
    choices:
      - text: '`Ana, Ben`'
        correct: true
        feedback: >-
          Right. Same array, so React skips the render. The page never hears about Cleo.
      - text: '`Ana, Ben, Cleo`'
        feedback: >-
          Most people expect this. The array did change, but React compared it with itself
          and found nothing new.
      - text: An error about changing state
        feedback: >-
          React doesn't stop you changing the array. It stays silent, which is what makes this
          bug hard to spot.

  - type: predict-output
    id: predict-shows-up-later
    concept: react.updating-arrays
    difficulty: 3
    language: tsx
    code: |
      const [guests, setGuests] = useState(["Ana", "Ben"]);
      const [dark, setDark] = useState(false);

      // Add Cleo was clicked: guests.push("Cleo"); setGuests(guests);

      <p>{guests.join(", ")}</p>
      <button onClick={() => setDark(!dark)}>Dark mode</button>
    question: After that click, you press Dark mode. What does the paragraph show now?
    choices:
      - text: '`Ana, Ben, Cleo`'
        correct: true
        feedback: >-
          Yes. Dark mode renders again, and reads the changed array. Cleo pops up late.
      - text: '`Ana, Ben`'
        feedback: >-
          The array really holds Cleo now. Any render reads it, and Dark mode causes one.
      - text: '`Ana, Ben, Cleo, Cleo`'
        feedback: >-
          `push` ran once, on the click. Dark mode doesn't run `add` again, it only renders.

  - type: prose
    id: copy-then-change
    body: |-
      The fix: never change the array in state. Make a new one with the change in it, and set
      that.

      ```tsx
      setGuests([...guests, "Cleo"]);                   // add
      setGuests(guests.filter((g) => g !== "Ben"));     // remove
      setGuests(guests.map((g) => (g === "Ana" ? "Anna" : g))); // change one
      setGuests(guests.toSorted());                     // sort
      ```

      `push`, `splice`, `sort` and `reverse` change the old array. Leave them out of state.

  - type: fill-blank
    id: fill-guest-list
    concept: react.updating-arrays
    difficulty: 2
    language: tsx
    prompt: >-
      Each function hands React a new array. Fill the gaps.
    template: |
      function addGuest(name) {
        setGuests({{1}});
      }

      function removeGuest(name) {
        setGuests(guests.{{2}}((guest) => guest !== name));
      }

      function renameGuest(from, to) {
        setGuests(guests.{{3}}((guest) => (guest === from ? to : guest)));
      }
    blanks:
      - key: '1'
        answer: '[...guests, name]'
      - key: '2'
        answer: filter
      - key: '3'
        answer: map
    bank: ['[...guests, name]', 'guests.push(name)', filter, splice, map, forEach]

  - type: prose
    id: objects-too
    body: |-
      Objects work the same way. Copy with spread, then change what you need:

      ```tsx
      setUser({ ...user, name: "Bea" });
      ```

      Spread copies only the top level. An object inside, like `user.address`, is still the
      old one. So copy each level you change:

      ```tsx
      setUser({ ...user, address: { ...user.address, city: "York" } });
      ```

  - type: fill-blank
    id: fill-nested-copy
    concept: react.updating-objects
    difficulty: 3
    language: tsx
    prompt: >-
      Make the dish spicy by handing React a new order. Fill the gaps.
    template: |
      const [order, setOrder] = useState({
        table: 4,
        dish: { name: "Soup", spicy: false },
      });

      function makeSpicy() {
        setOrder({ {{1}}, dish: { {{2}}, spicy: true } });
      }
    blanks:
      - key: '1'
        answer: '...order'
      - key: '2'
        answer: '...order.dish'
    bank: ['...order', '...order.dish', '...dish', 'order', 'order.dish']

  - type: ai-review
    id: review-sort-in-place
    concept: react.updating-arrays
    difficulty: 3
    language: tsx
    request: Add a button that sorts the playlist by title.
    flawClass: logic
    code: |
      function Playlist() {
        const [songs, setSongs] = useState(["Yellow", "Angie", "Mercy"]);
        return (
          <div>
            <button onClick={() => setSongs(songs.sort())}>Sort by title</button>
            <ol>
              {songs.map((song) => (
                <li key={song}>{song}</li>
              ))}
            </ol>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. Its test only checks the button exists. You click Sort by title
      and nothing moves. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`sort` changes the same array React already has'
        correct: true
        feedback: >-
          Yes. React sees one array and skips the render. `toSorted()` returns a new one.
      - text: '`sort` needs a compare function for text'
        feedback: >-
          For plain titles like these, `sort()` orders them fine. The list still doesn't move.
      - text: The key should be the index
        feedback: >-
          Titles make fine keys here, and index keys cause their own bugs. No render happened at all.
    fix: |
      <button onClick={() => setSongs(songs.toSorted())}>Sort by title</button>

  - type: code-challenge
    id: build-packing-list
    concept: react.updating-arrays
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A holiday packing list gets its `items` as a prop, each `{ id, name, packed }`. Ticking a
      box, Remove and Add sun cream all do nothing, because each one changes the list in place.


      Make every button hand React a new array. Ticking flips `packed` on a copy of that item.
      The counter, like `1 of 3 packed`, must follow. The tests also check that the `items`
      passed in are never changed.
    hints:
      - Look at `toggle`, `remove` and `add`. Each calls `setList(list)` with the array it already had.
      - '`map`, `filter` and spread all build new arrays. For the ticked item, spread it into a new object too.'
      - 'Start `remove` with `setList(list.filter((item) => item.id !== id));`.'

  - type: explain-back
    id: explain-new-array
    concept: react.updating-arrays
    difficulty: 3
    prompt: >-
      A teammate's Add button calls `items.push(newItem)` and then `setItems(items)`. Nothing
      shows up. What would you tell them?
    rubric:
      - React compares the new state with the old one and skips the render when they're the same object.
      - '`push` changed the existing array, so the setter got the same array back.'
      - Build a new array, such as `[...items, newItem]`, and set that.
    modelAnswer: >-
      React only draws again when the new state differs from the old. For arrays, that
      means a different array. `push` added to the array React already had. The setter got
      that same array back, so React skipped the render. Make a new array with the item
      in it, `[...items, newItem]`, and set that. React sees a new array and redraws.

recap:
  - Add, remove and change items with spread, `filter` and `map`, never `push` or `splice`.
  - Update an object with `{ ...old, change }`, copying each level you touch.
  - Spot the button that seems to do nothing because it changed state in place.

recall:
  - id: card-same-array
    concept: react.updating-arrays
    front: Why does `items.push(x); setItems(items)` leave the screen unchanged?
    back: >-
      The setter gets the same array React already has, so React sees no change and skips
      the render.
  - id: card-array-copies
    concept: react.updating-arrays
    front: How do you add, remove and change one item without changing the array in state?
    back: >-
      Add with `[...items, x]`, remove with `filter`, change one with `map`. Sort with
      `toSorted`.
  - id: card-nested-object
    concept: react.updating-objects
    front: 'How do you set `user.address.city` to "York" in state?'
    back: >-
      `setUser({ ...user, address: { ...user.address, city: "York" } })`. Copy each level
      you change.
  - id: card-late-change
    concept: react.updating-arrays
    front: A pushed item didn't show, then appeared after an unrelated click. Why?
    back: >-
      The push did change the array. The other click caused a render, and that render read
      the changed array.

