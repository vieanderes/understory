term: declaration file
aka: [.d.ts, type declarations, ambient declarations]
short: A file holding only the types for code that lives somewhere else, often a package written in JavaScript.
explain: |
  A package written in plain JavaScript carries no types. TypeScript can't check your calls
  to it, so every value comes back as `any`. A file of types alone fills that gap: names,
  parameters and return types, with no code inside.

  Packages ship these files beside their JavaScript and point to them in `package.json`.
  For older packages, the community publishes them separately under `@types/`. You can also
  write one for a global your page gets from a script tag. Nothing checks a declaration
  against the real code, so a wrong one lies quietly.
analogy: The menu outside a restaurant. It tells you what's on offer, but it isn't the kitchen.
example:
  language: ts
  code: |
    // slugify.d.ts
    declare module 'slugify' {
      export default function slugify(text: string, separator?: string): string;
    }
usage: The package has no declaration file, so install its `@types` package before importing it.
related: [tsconfig, type-erasure, any-type, package-manager]
level: 2
lessons: [ts.configuration]
