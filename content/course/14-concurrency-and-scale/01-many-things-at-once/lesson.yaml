deepDive: >-
  We ran the challenge's tasks in Node 24. Three 30 ms waits took about 31 ms together.
  Three 30 ms computations took about 91 ms. Your numbers will differ a little, and the
  ratio won't.


  How much can more cores help? Only the part of a job that can be split gets faster. If a
  fifth of a job must run in order, no number of cores makes it more than five times
  faster. That ceiling is Amdahl's law, and it's why the database that every copy shares so
  often ends up as the limit.


  Node isn't strictly one thread. It keeps a small pool of helper threads for some file,
  DNS and crypto work, and lesson 3 adds your own. Your JavaScript still runs on one thread
  per copy unless you ask for more.


  Platforms name copies differently: instances, replicas, pods, dynos. Serverless platforms
  start copies for you as traffic grows, so the same rule applies there. The cloud chapter
  covers keeping servers stateless in depth.
