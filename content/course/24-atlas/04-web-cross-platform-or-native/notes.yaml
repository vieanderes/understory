summary: |-
  One product can reach people three ways: a website, a cross-platform app from one codebase, or native apps written separately for each platform. The choice shapes the team, the budget, the release process and what the product can ever do, so it's worth making deliberately and writing down.

  The method has two stages. First, hard limits: a device capability the product needs and a route can't reach rules that route out, whatever else it offers. On iPhones every browser uses Safari's engine outside the EU, so Safari's missing APIs, such as Web Bluetooth, are the web's limits there. Second, among the routes that survive, a weighted decision: criteria such as team, reach, device access and cost, weights agreed before scoring, every score on the same 1 to 5 scale, and code doing the sums.

  Distribution is a criterion of its own. A website needs a link, and a fix is live on the next visit. A store adds discovery, trust and payments against review, fees, an install step and users who update when they like. These notes add the full procedure, a check that the answer survives small changes in weights, worked comparisons for three products, and how to present the decision so it survives a design review.
remember:
  - Check device APIs first, because a capability the product needs and a route can't reach rules that route out before any scoring.
  - On iPhones outside the EU every browser uses Safari's engine, so a feature Safari lacks, such as Web Bluetooth or Web NFC, is missing from the whole platform's web.
  - Write the weights down before scoring anything, because weights set afterwards get tuned to the answer someone wanted.
  - Score every criterion on the same 1 to 5 scale, since a raw figure such as pounds swamps the others and decides alone.
  - Check that the winner survives nudging each weight, because a decision that flips on one point is a tie and should be presented as one.
  - A store brings discovery, trust and payments, and costs a developer account, a review of every release, an install step and slow updates.
  - Web first and an app later is a legitimate plan when no hard limit forces an app, because the web is the cheapest way to learn what users need.
sections:
  - title: The full decision procedure
    body: |-
      **1. Hard limits.** List what the product must do that depends on the platform. The usual candidates:

      - Hardware access: Bluetooth, NFC, USB, advanced camera control, sensors.
      - Background work: tracking location or playing audio with the app closed, syncing on a schedule.
      - Notifications: push, including on iPhones.
      - Offline use and how much data must survive on the device.
      - Distribution: must it be in a store for trust, corporate device management, or payments?

      Check each against each route with current compatibility data, such as MDN's tables. One "no" on a must-have removes the route.

      **2. Criteria and weights.** Agree three to six criteria with the people who own the outcome, such as team skills, reach, device access, time to market, cost and upkeep. Give each a weight and record them before anyone scores.

      **3. Scores.** Score every surviving route 1 to 5 on each criterion, with a sentence of evidence per score. Convert raw figures (pounds, weeks) to the scale first.

      **4. Totals and a robustness check.** Let code do the sums, then check whether the winner survives small changes in the weights.

      **5. The record.** Write the decision, the rejected routes, the costs you accept, and what would make you revisit it.

      The procedure's real value isn't the arithmetic. It's that disagreements move from "I prefer native" to "I think device access deserves a higher weight, because the strap is the whole product", which can be discussed and settled.
  - title: Does the answer survive a nudge?
    body: |-
      A weighted total gives a false sense of precision. Before presenting a winner, check how fragile it is: change each weight by one in each direction and see whether the winner changes.

      ```ts
      type Scores = Record<string, number>;
      const weights: Scores = { team: 3, reach: 2, device: 4, cost: 1 };
      const routes: Record<string, Scores> = {
        website: { team: 5, reach: 5, device: 1, cost: 5 },
        crossPlatform: { team: 4, reach: 4, device: 4, cost: 3 },
        native: { team: 1, reach: 3, device: 5, cost: 1 },
      };

      function winner(w: Scores): string {
        const total = (s: Scores) => Object.keys(w).reduce((sum, k) => sum + s[k]! * w[k]!, 0);
        return Object.entries(routes).sort(([, a], [, b]) => total(b) - total(a))[0]![0];
      }

      // Nudge each weight up and down by one. Does the answer survive?
      const baseline = winner(weights);
      const flips: string[] = [];
      for (const key of Object.keys(weights)) {
        for (const delta of [-1, 1]) {
          const result = winner({ ...weights, [key]: Math.max(0, weights[key]! + delta) });
          if (result !== baseline) flips.push(`${key} ${delta > 0 ? '+1' : '-1'} gives ${result}`);
        }
      }
      console.log(baseline, flips); // crossPlatform [] : no single nudge changes the answer
      ```

      For the running club it prints `crossPlatform []`: the winner holds under every single nudge, so you can present it with confidence. If the list weren't empty, say so plainly: "Cross-platform wins, but if reach mattered one point more, the website would." That turns a fragile number into a clear question for the stakeholders, which is more useful than a false certainty.
  - title: Three products, three routes
    body: |-
      **A gym's class-booking tool.** Must-haves: book and cancel, reminders, works on any phone. Nothing needs hardware. Reminders can be email or text messages, and web push works on Android and on iPhones for web apps added to the Home Screen. Members already visit weekly, so discovery doesn't matter. Route: a website, installable as a PWA. Rejected: an app, whose store review and slow updates buy nothing here.

      **A cycling app reading a Bluetooth cadence sensor.** Must-have: Bluetooth on iPhones and Android. Safari has no Web Bluetooth, so the website is out. The team writes React. Route: React Native, using a community or custom native module for Bluetooth. Rejected: two native apps, since the team would have to learn Swift and Kotlin and build everything twice. Risk accepted: the Bluetooth module is native code the team must maintain, and its updates need store releases.

      **A professional audio recorder with low-latency effects.** Must-haves: tight control over the audio pipeline and background recording. This is the platform's core strength and changes with each OS release. Route: native apps in Swift and Kotlin. Rejected: cross-platform, where the audio work would be native modules anyway, and the shared layer would save little.

      Notice what decided each one. The booking tool was decided by the absence of hard limits and by distribution. The cycling app was decided by one hard limit, then the team. The recorder was decided by where the product's value lives: when the hard part is platform-specific, sharing code saves little.
  - title: Presenting the decision in a design review
    body: |-
      Structure the presentation so objections land where they can be answered.

      - **Start with the must-haves and the eliminations.** "The strap needs Bluetooth on iPhones; Safari doesn't offer it, so the website is out." Few people argue with a compatibility table.
      - **Show the weights and who agreed them.** If someone disagrees with the result, the conversation goes to the weights, where it belongs.
      - **Show scores with one line of evidence each.** "Team: 4, because we write React daily; not 5, because nobody has shipped a store app."
      - **Show the robustness check.** "No single weight change flips it" or "it's close; here's the question that decides it."
      - **Name the costs you're accepting.** A native module to maintain, a store account, release trains.
      - **Say what would change your mind.** "If Safari ships Web Bluetooth, or the strap becomes optional, revisit."

      Also offer staged routes when they fit. Web first, then an app once demand is proven, is often the cheapest way to learn. A PWA and a store app can share one web codebase through a shell such as Capacitor. Shared business logic with native screens, via Kotlin Multiplatform, suits teams that already write native code.

      Expect the question "what did you get wrong last time?" in interviews about decisions like this. Have an honest example where the weights missed something, such as upkeep, and what you now add.
pitfalls:
  - >-
    **Scoring before agreeing weights.** People then tune weights until their favourite wins.
    Record the weights first, with the people who own the outcome.
  - >-
    **Mixing scales.** A raw cost in pounds dwarfs 1 to 5 scores and decides alone. Convert
    every criterion to the same scale before weighting.
  - >-
    **Treating a missing device API as a low score.** If the product can't work without
    Bluetooth, a route without it isn't a 1, it's out. Filter before you score.
  - >-
    **Testing the web on Android only.** Chrome on Android offers APIs that iPhones lack.
    Check Safari's support, since every iPhone browser uses its engine outside the EU.
  - >-
    **Presenting a close call as certain.** A winner that flips on one weight is a tie. Say
    so, and name the question that decides it.
  - >-
    **Forgetting upkeep.** Two native apps mean every feature twice, for years. Include
    maintenance as a criterion, not only the first build.
interview:
  - question: Should we build a native app, a cross-platform app or a website?
    answer: >-
      "Start from what the product must do on the device, then weigh the rest." I'd list the
      must-haves that depend on the platform, such as Bluetooth, background location, push
      on iPhones, and offline storage, and check each route against current compatibility
      data. Any route missing a must-have is out. For the rest, I'd agree criteria and
      weights with the stakeholders before scoring: team skills, reach, time to market, cost
      and upkeep. With no hard limits, I'd usually start with the web, because it ships fastest
      and updates instantly. With a hard limit and a React team, React Native is often the
      best fit. Native wins when the product's core is platform-specific, like pro audio.
  - question: How do you stop a weighted decision matrix becoming a rationalisation?
    answer: >-
      Three rules. Agree and write down the weights before anyone scores, ideally with the
      people who own the outcome, so they can't be tuned towards a favourite. Put every
      criterion on the same scale with a line of evidence per score, so a raw figure can't
      dominate and each number can be challenged. And check robustness: nudge each weight by
      one and see whether the winner changes. If it does, it's a tie, and I'd present it as
      one with the question that decides it. Hard limits, such as a missing device API, are
      filtered out before scoring, because a route that can't do the job isn't a low score.
  - question: When is it worth being in the app stores?
    answer: >-
      When you need what stores provide more than you mind what they cost. Stores bring
      discovery for people searching for your kind of product, the trust of an installed app,
      built-in payments, and access to device APIs the web lacks. They cost a paid developer
      account, a review before every release, an install step that loses some users, and slow
      updates, since each user updates in their own time. A product whose users already know
      it, like a club or an internal tool, gains little. A consumer product competing for
      attention, or one needing Bluetooth or background work on iPhones, usually needs the
      store. Store rules on digital purchases vary by store and region, so check the current
      guidelines.
  - question: A start-up asks you whether to go cross-platform or native for its first app. What do you advise?
    answer: >-
      Usually cross-platform, unless the product's core is platform-specific. A start-up's
      scarcest resource is engineering time, and one codebase for iPhone and Android means
      building most features once rather than twice. If the team writes React, React Native with Expo gets them
      shipping fastest; Flutter is a good choice for a team willing to learn Dart who want a
      single look everywhere. Native makes sense when the value is in deep platform
      integration, such as advanced camera work, low-latency audio or heavy use of new OS
      features on release day. The cost of cross-platform is native modules for anything the
      framework lacks, and sometimes waiting for support for new OS features.
