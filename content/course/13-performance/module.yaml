id: perf
number: 13
title: Performance
summary: "Make pages and servers fast on the devices people really use. Measure first, find the slow part, fix it, and keep it fixed."
why: "Slow pages lose people before they read a word."
youCanBuild: "A page and an API measured before and after: no blocking scripts, no jumping content, no leaks, honest caches and one query instead of 201."
concepts:
  - id: perf.latency-and-percentiles
    title: Latency and percentiles
    summary: Latency is how long one thing takes and throughput how many get done per second; percentiles such as p95 show the slow tail an average hides.
  - id: perf.timing-code
    title: Timing code honestly
    summary: Time code with `performance.now()`, warm it up, repeat it and report the median, on a production build.
  - id: perf.latency-budgets
    title: Latency budgets
    summary: A latency budget splits the wait people will accept across the steps, and streaming makes the first words arrive early.
  - id: perf.core-web-vitals
    title: Core Web Vitals
    summary: LCP measures loading, INP responsiveness and CLS visual stability, each judged at the 75th percentile of visits.
  - id: perf.lab-and-field-data
    title: Lab and field data
    summary: Lab data comes from one controlled load such as Lighthouse and is repeatable; field data comes from real visits and shows what people feel.
  - id: perf.layout-shift
    title: Layout shift
    summary: Content jumps when something arrives late without reserved space, so images get sizes and late content gets a `min-height`.
  - id: perf.critical-rendering-path
    title: The critical rendering path
    summary: The browser needs the HTML so far and all the CSS before it can paint the first frame.
  - id: perf.render-blocking
    title: Render-blocking resources
    summary: A stylesheet blocks rendering and a plain script blocks parsing, while `defer` and `async` scripts do not block the parser.
  - id: perf.resource-hints
    title: Preload and fetch priority
    summary: "`preload` fetches early a file the parser would find late, and `fetchpriority` moves a file up or down the queue."
  - id: perf.lcp-assets
    title: The main image
    summary: The LCP image is sized, not lazy-loaded, and fetched at high priority.
  - id: perf.javascript-cost
    title: The cost of JavaScript
    summary: Every byte of script is downloaded, parsed, compiled and run, mostly on the main thread, and slow phones take several times longer.
  - id: perf.long-tasks
    title: Long tasks
    summary: A main-thread task over 50 ms makes input wait, so heavy work is split into batches with a yield between them.
    confusableWith: [perf.inp]
  - id: perf.inp
    title: Interaction to Next Paint (INP)
    summary: INP is the time from an input to the next frame painted, made of input delay, processing and presentation delay.
    confusableWith: [perf.long-tasks]
  - id: perf.hydration-cost
    title: Hydration cost
    summary: Hydration runs the bundle to attach handlers to server-rendered HTML, so the page can look ready before it answers.
  - id: perf.bundle-analysis
    title: Reading a bundle
    summary: A bundle report shows what each package adds to the JavaScript a page loads, so the biggest cost is found before guessing.
  - id: perf.code-splitting
    title: Code splitting
    summary: "A dynamic `import()` moves code the first screen doesn't need into a separate file, loaded only when it's used."
  - id: perf.performance-budgets
    title: Performance budgets
    summary: A budget is a limit on a metric or a file size that fails the CI build when a change crosses it.
  - id: perf.render-loop
    title: Frames and the render loop
    summary: "`requestAnimationFrame` runs code once per frame, about every 16.7 ms at 60 Hz, and movement is scaled by the time since the last frame."
  - id: perf.compositor-animation
    title: Animating transform and opacity
    summary: Animating `transform` and `opacity` skips layout and paint, while animating `left`, `top` or `width` redoes them every frame.
  - id: perf.layout-thrashing
    title: Layout thrashing
    summary: Reading a size right after a style change forces a fresh layout, so a loop that alternates reads and writes lays out again and again.
  - id: perf.memory-leaks
    title: Memory leaks
    summary: The garbage collector frees only what nothing can reach, so a leak is memory that stays reachable by mistake and grows with use.
  - id: perf.heap-snapshots
    title: Heap snapshots
    summary: A heap snapshot lists what lives on the heap, and comparing two taken around a repeated action shows what grew.
  - id: perf.cleanup
    title: Cleaning up
    summary: Whatever adds a listener, starts a timer or fills a cache also removes, clears or limits it when it's done.
  - id: perf.http-caching
    title: HTTP caching
    summary: "`Cache-Control` says how long a response stays fresh, and an `ETag` lets a stale copy be checked cheaply with a `304`."
    confusableWith: [perf.cdn-caching]
  - id: perf.cdn-caching
    title: CDN caching
    summary: A CDN keeps one shared copy of a response near users, so only `public` responses that are the same for everyone may be stored there.
    confusableWith: [perf.http-caching]
  - id: perf.application-caching
    title: Caching on the server
    summary: A server cache keeps the result of slow work in memory, keyed by every input that changes the result, for a set time.
  - id: perf.cache-invalidation
    title: Cache invalidation
    summary: A cached entry is corrected by expiry, by deleting it when the data changes, or by a new key.
  - id: perf.caching-model-calls
    title: Caching model calls
    summary: A model answer can be cached when the model, the prompt and the settings match, and never shared across users when it holds private data.
  - id: perf.profiling
    title: Finding the slow part
    summary: A timing breakdown or a profile shows where a request's time goes, so the fix lands on the measured bottleneck.
  - id: perf.n-plus-one
    title: N+1 queries
    summary: One query loads a list and one more runs per item; a join or one batched query replaces them.
  - id: perf.tail-latency
    title: Tail latency
    summary: A page that waits on many calls is as slow as its slowest one, so it meets the rare slow call often.
