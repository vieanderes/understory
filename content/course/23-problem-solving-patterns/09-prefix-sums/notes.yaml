summary: >-
  A prefix sum is a running total stored at every position. Once you have it, the sum of any
  contiguous range is one subtraction, so a hundred thousand range questions cost a hundred
  thousand lookups instead of a hundred thousand loops. Building it is one O(n) pass; each
  question afterwards is O(1).


  The signals are "many queries", "sum (or count) between index a and b", "the data does not
  change between queries", and anything about "subarrays whose sum is k". Counting works
  the same as summing: a prefix count of how many items so far are vowels, errors or a given
  letter answers "how many in this range" in O(1). A difference array is the mirror image:
  many range updates recorded in O(1) each, then one running total applies them all.


  The idea reaches further than range queries. "How many subarrays sum to k" becomes "how
  many earlier prefix sums equal the current one minus k", a hash-map lookup. "Is there an
  index where the left and right sides balance" becomes "total minus prefix". Rectangles in
  a grid get the same trick in two dimensions.


  Reach for something else when the data changes between queries: a prefix array must be
  rebuilt after every update. For mixed updates and queries, a Fenwick tree or segment tree
  gives O(log n) for both. For a range that slides forward over positive numbers, a sliding
  window is simpler.
remember:
  - With `prefix[0] = 0` and `prefix[i + 1] = prefix[i] + a[i]`, the sum of `a[from..to]` inclusive is `prefix[to + 1] - prefix[from]`.
  - Build once in O(n), answer each range query in O(1), and use O(n) extra memory.
  - A subarray sums to k exactly when two prefix sums differ by k, so a map of prefix-sum counts finds them all in O(n), negatives included.
  - A difference array records "add v to a range" as `+v` at the start and `-v` one past the end, then a running total applies every update.
  - A prefix count per category answers "how many of X in this range" in O(1), which is how many online-assessment range-query tasks are solved.
  - "In two dimensions, a rectangle's sum is four lookups: bottom-right minus top-right minus bottom-left plus top-left."
  - In JavaScript, `%` keeps the sign of the dividend, so normalise remainders with `((x % k) + k) % k`.
  - Prefix sums suit static data; with interleaved updates and queries use a Fenwick tree or a segment tree.
sections:
  - title: The template, for sums and for counts
    body: |-
      The template is always the same: an array one longer than the input, a leading zero,
      and a subtraction. The leading zero is what makes a range starting at index 0 work
      without a special case. The same shape counts things: store how many items so far
      match, and a range count is again one subtraction.

      ```js
      // O(n) to build, O(1) per query, O(n) memory.
      function makeRangeSum(values) {
        const prefix = new Array(values.length + 1);
        prefix[0] = 0;
        for (let i = 0; i < values.length; i++) prefix[i + 1] = prefix[i] + values[i];
        return (from, to) => prefix[to + 1] - prefix[from];
      }

      const sum = makeRangeSum([3, -1, 4, 1, 5]);
      console.log(sum(0, 4)); // 12
      console.log(sum(1, 3)); // 4
      console.log(sum(2, 2)); // 4

      // One prefix count per letter: how many of each letter in s[from..to].
      function makeLetterCounter(s, letters) {
        const prefix = {};
        for (const letter of letters) {
          const counts = [0];
          for (let i = 0; i < s.length; i++) counts.push(counts[i] + (s[i] === letter ? 1 : 0));
          prefix[letter] = counts;
        }
        return (letter, from, to) => prefix[letter][to + 1] - prefix[letter][from];
      }

      const count = makeLetterCounter('CAGCCTA', 'ACGT');
      console.log(count('C', 1, 4)); // 2
      console.log(count('T', 0, 3)); // 0
      ```

      The letter counter is the core of the classic genomic range query task: with one prefix
      array per letter, "what is the smallest letter present in this range" becomes checking
      the letters in order and returning the first whose count is above zero. That is
      O(n × letters) to build and O(letters) per query.
  - title: Subarrays that sum to k
    body: |-
      "Count the contiguous runs of transactions that total exactly k" is the classic
      follow-up. A sliding window fails as soon as values can be negative, because adding an
      item no longer only increases the sum. Prefix sums handle it: the run from `i + 1` to
      `j` sums to k when `prefix[j] - prefix[i] = k`, so at each position you ask how many
      earlier prefix sums equal `prefix - k`.

      ```js
      // O(n) time, O(n) memory. Works with negatives and zeros.
      function countSubarraysWithSum(nums, k) {
        const seen = new Map([[0, 1]]); // the empty prefix, so runs from index 0 count
        let prefix = 0;
        let count = 0;
        for (const x of nums) {
          prefix += x;
          count += seen.get(prefix - k) ?? 0;
          seen.set(prefix, (seen.get(prefix) ?? 0) + 1);
        }
        return count;
      }

      console.log(countSubarraysWithSum([1, 1, 1], 2)); // 2
      console.log(countSubarraysWithSum([3, -1, 1, 2], 3)); // 3
      console.log(countSubarraysWithSum([0, 0], 0)); // 3
      console.log(countSubarraysWithSum([], 0)); // 0
      ```

      The order inside the loop matters: look up first, then record the current prefix, or
      an empty run would count when `k` is 0. The same shape answers "subarrays whose sum is
      divisible by k": two prefixes with the same remainder bound a run whose sum is a
      multiple of k. In JavaScript the remainder of a negative number is negative, so
      normalise it.

      ```js
      function countDivisible(nums, k) {
        const seen = new Map([[0, 1]]);
        let prefix = 0;
        let count = 0;
        for (const x of nums) {
          prefix = (((prefix + x) % k) + k) % k;
          count += seen.get(prefix) ?? 0;
          seen.set(prefix, (seen.get(prefix) ?? 0) + 1);
        }
        return count;
      }

      console.log(-7 % 5); // -2
      console.log(countDivisible([4, 5, 0, -2, -3, 1], 5)); // 7
      ```
  - title: Running totals without storing the array
    body: |-
      Some problems need only the total so far and the grand total, not the whole prefix
      array. Two online-assessment favourites show the shape.

      **Balance point.** Find the first index where the sum to its left equals the sum to its
      right. The right side is the total minus the left minus the item itself.

      ```js
      // O(n) time, O(1) memory. Returns -1 if no index balances.
      function balanceIndex(nums) {
        let total = 0;
        for (const x of nums) total += x;
        let left = 0;
        for (let i = 0; i < nums.length; i++) {
          if (left === total - left - nums[i]) return i;
          left += nums[i];
        }
        return -1;
      }

      console.log(balanceIndex([1, 7, 3, 6, 5, 6])); // 3
      console.log(balanceIndex([1, 2, 3])); // -1
      console.log(balanceIndex([5])); // 0
      ```

      **Passing pairs.** A road has cars going east (0) and west (1). Count the pairs where
      an east-going car is before a west-going one. Each west car pairs with every east car
      seen so far, a prefix count carried in one variable.

      ```js
      // O(n) time, O(1) memory. The assessment version returns -1 past one billion pairs.
      function passingPairs(cars) {
        let east = 0;
        let pairs = 0;
        for (const car of cars) {
          if (car === 0) east++;
          else pairs += east;
          if (pairs > 1_000_000_000) return -1;
        }
        return pairs;
      }

      console.log(passingPairs([0, 1, 0, 1, 1])); // 5
      console.log(passingPairs([1, 1, 0])); // 0
      ```

      Read the cap word by word. "More than 1,000,000,000" means exactly one billion is
      still an answer, so the check is `>`, not `>=`, and the hidden tests probe both sides.
      Checking inside the loop also keeps `pairs` small: it never passes one billion plus
      100,000, far below 2^53, where JavaScript numbers stop being exact.

      The brute force for both is a nested loop, O(n²). The move that removes it is the same
      each time: ask what the inner loop recomputes, and carry that as a running total.
  - title: Rectangles in a grid
    body: |-
      For a grid, `prefix[r][c]` holds the sum of the rectangle above and to the left of
      cell `(r, c)`, exclusive, with an extra row and column of zeros. Any rectangle's sum is
      then four lookups. The top-left block is subtracted twice, so it is added back once.

      ```js
      // O(rows × cols) to build, O(1) per rectangle.
      function makeRectSum(grid) {
        const rows = grid.length;
        const cols = rows === 0 ? 0 : grid[0].length;
        const p = Array.from({ length: rows + 1 }, () => new Array(cols + 1).fill(0));
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            p[r + 1][c + 1] = grid[r][c] + p[r][c + 1] + p[r + 1][c] - p[r][c];
          }
        }
        // Rows r1..r2 and columns c1..c2, all inclusive.
        return (r1, c1, r2, c2) => p[r2 + 1][c2 + 1] - p[r1][c2 + 1] - p[r2 + 1][c1] + p[r1][c1];
      }

      const rect = makeRectSum([
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9],
      ]);
      console.log(rect(0, 0, 2, 2)); // 45
      console.log(rect(1, 1, 2, 2)); // 28
      console.log(rect(0, 2, 0, 2)); // 3
      ```

      This turns "the densest 3 by 3 area of a heat map" from O(rows × cols × 9) into
      O(rows × cols) after the build, and the saving grows with the size of the area.
  - title: Brute force to prefix sums, aloud, with the edge cases
    body: |-
      A range-query answer in a live round follows a predictable arc:

      1. "The brute force loops over each range: O(n) per query, O(n × q) in total. With
         100,000 of each that's 10 billion steps."
      2. "The waste is re-adding the same values for every query. I'll add them once into a
         running total."
      3. "I'll put a 0 in front, so the range `from..to` is `prefix[to + 1] - prefix[from]`
         with no special case for 0."
      4. "Build O(n), each query O(1), O(n) extra memory. Total O(n + q)."

      Then test the edges out loud: a range starting at 0, a range ending at the last index,
      a single-element range, negative values, zero queries, and an empty input if allowed.
      Check the size of the totals: 100,000 values up to a billion reach 10¹⁴, still exact in
      a JavaScript number, but squaring or multiplying totals is not.

      If the interviewer then adds updates between queries, say that a prefix array would
      need an O(n) rebuild per update, and offer a Fenwick tree, which gives O(log n) for
      both point updates and prefix queries in about fifteen lines.
  - title: 'Practice task: the slice with the smallest average'
    body: |-
      A well-known training syllabus has four prefix-sum tasks. PassingCars is in the lesson, and
      CountDiv and GenomicRangeQuery are above. The fourth, **MinAvgTwoSlice**, asks for the
      start of the slice of length 2 or more with the smallest average.

      With prefix sums, every slice's average is O(1), but there are O(n²) slices. The
      trick is a small proof: any slice of length 4 or more splits into two shorter ones,
      and one half's average is at most the whole's. So the best slice always has length 2
      or 3, and checking those at every start is O(n).

      ```ts
      function minAvgTwoSlice(a: number[]): number {
        let bestStart = 0;
        let bestAvg = Infinity;
        for (let i = 0; i < a.length - 1; i++) {
          const two = (a[i] + a[i + 1]) / 2;
          const three = i + 2 < a.length ? (a[i] + a[i + 1] + a[i + 2]) / 3 : Infinity;
          // Strictly smaller, so a tie keeps the earlier start, as the task asks.
          if (Math.min(two, three) < bestAvg) {
            bestAvg = Math.min(two, three);
            bestStart = i;
          }
        }
        return bestStart;
      }
      // [4, 2, 2, 5, 1, 5, 8] -> 1
      ```

      We checked it against a brute force over every slice on 5,000 random arrays. In an
      interview, say the proof in one sentence; the code alone looks like a guess.

pitfalls:
  - "**No leading zero.** Without it, a range starting at 0 reads `prefix[-1]`, which is `undefined`, and the answer becomes `NaN`. Start the array with 0 and use `prefix[to + 1] - prefix[from]`."
  - "**Mixing inclusive and exclusive ends.** Off-by-one errors come from not deciding whether `to` is included. Write the formula once as a comment and derive every lookup from it."
  - "**A sliding window over negative numbers.** Shrinking the window no longer lowers the sum, so the window logic is wrong. Use prefix sums with a hash map."
  - "**Recording the prefix before looking it up.** In subarray-sum counting this counts the empty run when k is 0. Look up `prefix - k` first, then record `prefix`."
  - "**Negative remainders.** In JavaScript `-7 % 5` is `-2`, so remainders of the same class land in different map keys. Normalise with `((x % k) + k) % k`."
  - "**The difference array one slot short.** A range ending on the last index writes to `last + 1`. Make the array `n + 1` long."
  - "**Totals past 2^53.** Long runs of large values, or products of totals, lose precision. Check the range and use `BigInt` or a modulus when needed."
verify:
  - lens: breaks
    check: The prefix array starts with 0, so a range from index 0 never reads `prefix[-1]`.
  - lens: breaks
    check: A prefix array is rebuilt, or swapped for another structure, when the values change after it was built.
  - lens: scales
    check: Totals over long runs of large values are checked against 2^53, with `BigInt` or a modulus where needed.
  - lens: tests
    check: Tests cover a range starting at 0, a range ending on the last item, and a one-item range.
interview:
  - question: You get an array and 100,000 range-sum queries. How do you answer them?
    answer: >-
      I build a prefix-sum array once and answer each query with one subtraction, O(n + q)
      in total. `prefix[i]` holds the sum of the first i items, with a leading 0, so the sum
      of `from..to` inclusive is `prefix[to + 1] - prefix[from]`, and a range starting at 0
      needs no special case. Looping per query would be O(n × q), 10 billion steps at full
      size. The cost is O(n) extra memory, and the array must be rebuilt if the data changes.
      If updates are interleaved with queries, I'd use a Fenwick tree for O(log n) per
      update and per query instead.
  - question: Count the subarrays whose sum equals k. The array can contain negatives.
    answer: >-
      I walk once with a running prefix sum and a map from each prefix sum seen to how often
      it appeared, adding the count for `prefix - k` at every step. That's O(n) time and
      O(n) memory. The reason it works is that a subarray from i plus 1 to j sums to k
      exactly when `prefix[j] - prefix[i]` is k. I seed the map with prefix 0 seen once, so
      subarrays starting at index 0 are counted, and I look up before recording, so an empty
      subarray isn't counted when k is 0. A sliding window would be O(1) memory but only
      works when every value is positive, because negatives break the idea that shrinking
      the window lowers the sum.
  - question: What is a difference array and when would you use it?
    answer: >-
      A difference array records range updates in O(1) each and applies them all with one
      running total. To add v to every position from a to b, I add v at index a and subtract
      v at b plus 1; a prefix sum over the markers then gives each position's total change.
      So b bookings over n nights cost O(n + b) instead of O(n × b). It's the inverse of a
      prefix sum. I use it when all the updates come before the reads, such as counting
      rooms in use per night or seats booked per flight. If reads and updates interleave, I'd
      move to a Fenwick tree with range updates, or a segment tree with lazy propagation.
  - question: How would you find an index where the left and right sums are equal?
    answer: >-
      I compute the total once, then walk left to right keeping the sum of everything before
      the current index, and the right side is the total minus the left minus the current
      item. The first index where both sides match is the answer, in O(n) time and O(1)
      memory. The brute force sums both sides for each index, which is O(n²). The edge cases
      are a one-item array, where both sides are 0 so index 0 balances, an array with no
      balance point returning -1, and negative values, which the formula handles without
      change. If sums can be very large, I check they stay under 2^53 in JavaScript.
terms:
  - term: Prefix sum
    say: A running total.
    means: An array where `prefix[i]` is the sum of the first i items, with `prefix[0] = 0`. The sum of
      `a[from..to]` is then `prefix[to + 1] - prefix[from]`, one subtraction.
  - term: Range query
    say: Loop over the range each time.
    means: With a prefix array built once in O(n), each range sum or count is O(1), as long as the data
      doesn't change between queries.
  - term: Subarray sum equals k
    say: A sliding window finds subarrays that sum to k.
    means: Only when no value is negative. Counting earlier prefix sums equal to `current - k` in a map
      works for any values, in O(n).
  - term: Difference array
    say: Apply each range update item by item.
    means: Record 'add v to a range' as `+v` at its start and `-v` one past its end. One running total
      then applies every update, so each update costs O(1).
  - term: Fenwick tree
    say: Prefix sums handle updates too.
    means: A prefix array must be rebuilt after any change. With updates mixed into queries, a Fenwick
      tree or a segment tree gives O(log n) for both.
  - term: "`%` in JavaScript"
    say: The modulo operator.
    means: A remainder that keeps the sign of the dividend, so `-7 % 3` is `-1`. Normalise it with `((x
      % k) + k) % k`.
