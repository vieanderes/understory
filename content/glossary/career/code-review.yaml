term: code review
aka:
  - PR review
  - peer review
short: A teammate reading your change before it merges, to catch problems and share knowledge.
explain: |
  Every change gets a second pair of eyes. The reviewer checks that it works, that it's safe,
  and that the next person can follow it.

  Review in order of cost: correctness and security first, then design, then readability,
  and leave formatting to the tools. Label each comment, blocking or a nit, so the author
  knows what must change. Small pull requests get real reviews; a 2,000-line one gets a skim
  and an approval.
analogy: A second climber checking your knots before you leave the ground. It takes a minute, and it's how you both get home.
usage: Mark the naming points as nits in the code review; only the missing auth check blocks.
