deepDive: >-
  The shared list in the review is a class attribute. Python looks a name up on the instance
  first, then on the class, so `self.items.append` finds the class list and changes it for
  everyone. Assigning `self.items = []` in `__init__` creates one list per instance.


  Dataclasses refuse the same trap: `items: list = []` raises `ValueError: mutable default
  <class 'list'> for field items is not allowed: use default_factory`. Write `items: list =
  field(default_factory=list)` instead. `frozen=True` makes an instance immutable and
  hashable, so it can be a dict key. A frozen dataclass raises `FrozenInstanceError: cannot
  assign to field 'x'` on assignment.
