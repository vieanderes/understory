# Signal: the feed list. scripts/news/sources/feeds.ts fetches every entry once per run.
# Schema: feedsFileSchema in scripts/news/config.ts. How to add a feed: docs/SIGNAL.md.
#
# Every URL here answered with a parseable RSS or Atom document on 2026-09-17.
#   weight  trust in the source, 0 to 1. Primary sources and careful writers rank highest.
#   topics  topic ids from interests.yaml given to every item of the feed, after any
#           keyword matches. Keep it to what the feed is reliably about.
#
# Checked and left out on 2026-09-17:
#   Anthropic            no RSS or Atom feed (news, engineering and claude.com/blog all 404).
#                        Anthropic posts still arrive through Hacker News and Simon Willison.
#   Rauno Freiberg       rauno.me publishes no feed (404, and 500 on /craft/rss.xml).
#   Point-Free blog      the blog feed is gone (404). The episodes feed is video only.
#   Emil Kowalski        no feed (404).
#   Linear blog          no feed (404). The changelog feed below works.
#   The Morning Paper    the feed works but the last post is from February 2021.
#                        Murat Demirbas writes paper reviews in the same style and is active.
#   Chrome feeds/blog.xml  404. The static/blog/feed.xml URL below works.

