id: security.cryptography
title: Hashing and passwords
objective: "Tell hashing from encryption, and store and check passwords with a slow, salted hash."
level: essential
minutes: 10
concepts: [security.hashing, security.password-hashing]
prerequisites: [security.broken-auth, tooling.node]
opening:
  text: >-
    You'll know the difference between hashing and encryption, and store passwords so a
    stolen database gives an attacker almost nothing. It's the first thing a sign-up form
    has to get right.

steps:
  - type: prose
    id: what-a-hash-is
    body: |-
      A **hash** is a fingerprint of some data. A hash function turns any input into a short,
      fixed-size string called a **digest**. Node has one built in, called `sha256`:

      ```js
      createHash("sha256").update("hello").digest("hex");
      // hello   2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824
      // hello!  ce06092fb948d9ffac7d1a376e404b26b7575bcc11ee05a4615fef4fec3a308b
      ```

      One extra character, a completely different digest. And it only goes one way: nobody can
      turn a digest back into `hello`.

  - type: multiple-choice
    id: pick-same-digest
    concept: security.hashing
    difficulty: 1
    question: You hash the word `tea` today, and again next year. What do you get?
    choices:
      - text: The same digest both times
        correct: true
        feedback: >-
          Right. Same input, same fingerprint, every time. That's what makes it useful.
      - text: A different digest each time
        feedback: >-
          A hash function has no randomness in it. Same input, same digest, on any computer.
      - text: The word `tea` back
        feedback: >-
          A hash only goes one way. There's no function that turns the digest back into text.

  - type: prose
    id: hashing-vs-encryption
    body: >-
      **Encryption** is different. It scrambles data with a **key**, a secret value, and
      whoever holds the key can unscramble it again. It's a locked box: the point is to open
      it later.


      A hash has no key and no way back. So a login never needs the password itself. It hashes
      what you typed and compares the two digests.

  - type: ai-review
    id: review-encrypted-passwords
    concept: security.hashing
    difficulty: 2
    language: js
    request: Add "forgot password", so we can email people their password.
    flawClass: security
    code: |
      async function signUp(email, password) {
        const stored = encrypt(password, process.env.PASSWORD_KEY);
        await db.users.insert({ email, password: stored });
      }

      async function forgotPassword(email) {
        const user = await db.users.find({ email });
        const password = decrypt(user.password, process.env.PASSWORD_KEY);
        await sendEmail(email, `Your password is ${password}`);
      }
    prompt: >-
      An assistant wrote this. It works, and support loves it. Tap the line that puts every
      password at risk.
    lines: [2]
    reasons:
      - text: Anyone with the key can read every password
        correct: true
        feedback: >-
          Yes. Store a hash, which can't be undone, and send a reset link instead.
      - text: The key should be longer
        feedback: >-
          A longer key doesn't help. Whoever gets the key, or this code, reads every password.
      - text: '`encrypt` is too slow for a sign-up'
        feedback: >-
          Encryption is fast. The trouble is that it can be undone, and passwords never should be.
    fix: |
      async function signUp(email, password) {
        const stored = hashPassword(password);
        await db.users.insert({ email, password: stored });
      }

      async function forgotPassword(email) {
        await sendResetLink(email);
      }

  - type: prose
    id: fast-is-bad
    body: >-
      Now the database leaks. The attacker can't reverse a hash, so they guess: hash `123456`,
      compare, hash `password1`, compare.


      With `sha256` that's cheap. A laptop hashed a million guesses in under a second. So
      passwords need a hash that's slow on purpose: **scrypt**, **Argon2id** or **bcrypt**.
      One scrypt hash took that laptop about 40 milliseconds. You won't notice at login. An
      attacker notices on every guess.

  - type: prose
    id: salt
    body: |-
      One more problem. Two people with the password `sunshine` get the same digest, so one
      guess cracks both. A **salt** fixes that: random text made per user and mixed into the
      hash. It isn't secret. It's stored next to the digest:

      ```js
      import { scryptSync, randomBytes } from "node:crypto";

      const salt = randomBytes(16).toString("hex");
      const hash = scryptSync(password, salt, 64).toString("hex");
      const stored = `${salt}:${hash}`;
      ```

      `randomBytes(16)` makes 16 random bytes. `scryptSync` is the slow hash; 64 is the digest
      length in bytes.

  - type: ai-review
    id: review-sha256-password
    concept: security.password-hashing
    difficulty: 3
    language: js
    request: Store passwords securely. Hash them before saving, and salt the hash.
    flawClass: security
    code: |
      import { createHash, randomBytes } from "node:crypto";

      export function hashPassword(password) {
        const salt = randomBytes(16).toString("hex");
        const digest = createHash("sha256").update(salt + password).digest("hex");
        return `${salt}:${digest}`;
      }
    prompt: >-
      An assistant wrote this. It's salted, and every user's hash is unique. Then the table
      leaks, and every weak password falls overnight. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`sha256` is fast, so guessing is cheap'
        correct: true
        feedback: >-
          Yes. A salt stops shared guesses, not fast ones. Use scrypt, Argon2id or bcrypt.
      - text: The salt should be longer than 16 bytes
        feedback: >-
          16 random bytes is plenty. A longer salt doesn't make one guess any slower.
      - text: '`salt + password` should be `password + salt`'
        feedback: >-
          The order doesn't matter here. The speed of the hash is what the attacker uses.
    fix: |
      import { scryptSync, randomBytes } from "node:crypto";

      export function hashPassword(password) {
        const salt = randomBytes(16).toString("hex");
        const digest = scryptSync(password, salt, 64).toString("hex");
        return `${salt}:${digest}`;
      }

  - type: code-challenge
    id: write-salted-password
    concept: security.password-hashing
    difficulty: 3
    language: ts
    prompt: >-
      Finish sign-up and login. `hashPassword(password, makeSalt, slowHash)` stores
      `salt:hash`, with a fresh salt from `makeSalt()` and the hash from
      `slowHash(password, salt)`.


      `checkPassword(stored, attempt, slowHash)` splits `stored` at the `:` and returns `true`
      only if `slowHash(attempt, salt)` equals the stored hash. The tests pass in stand-ins for
      `randomBytes` and `scryptSync`.
    hints:
      - Two users with the same password must end up with different stored strings.
      - The login has to reuse the salt that was stored, not make a new one.
      - '`const [salt, hash] = stored.split(":");` gives you both halves.'

  - type: bug-hunt
    id: find-fresh-salt
    concept: security.password-hashing
    difficulty: 3
    language: js
    code: |
      import { scryptSync, randomBytes } from "node:crypto";

      export function checkPassword(stored, attempt) {
        const [salt, hash] = stored.split(":");
        const fresh = randomBytes(16).toString("hex");
        const attemptHash = scryptSync(attempt, fresh, 64).toString("hex");
        return attemptHash === hash;
      }
    prompt: >-
      Bug report: sign-up works, but nobody can ever log in, even with the right password.
      Tap the line at fault.
    lines: [6]
    reasons:
      - text: It hashes with a new salt, not the stored one
        correct: true
        feedback: >-
          Right. A different salt gives a different digest every time. Use `salt` here.
      - text: '`split(":")` loses part of the hash'
        feedback: >-
          The hash is hex, which never contains `:`. The split gives both halves intact.
      - text: '`scryptSync` can''t hash the same password twice'
        feedback: >-
          It can, and with the same salt it gives the same digest. The salt is what changed.
    fix: |
      import { scryptSync } from "node:crypto";

      export function checkPassword(stored, attempt) {
        const [salt, hash] = stored.split(":");
        const attemptHash = scryptSync(attempt, salt, 64).toString("hex");
        return attemptHash === hash;
      }

  - type: explain-back
    id: explain-leaked-table
    concept: security.password-hashing
    difficulty: 4
    prompt: >-
      Your users table leaks. What does a slow, salted hash protect that plain `sha256` or
      encryption wouldn't?
    rubric:
      - Encryption can be undone by anyone who gets the key, while a hash can't be undone at all.
      - A slow hash makes each of the attacker's guesses expensive, where `sha256` lets them try millions a second.
      - A per-user salt means one guess only tests one account, and equal passwords don't share a digest.
    modelAnswer: >-
      Encrypted passwords are only as safe as the key, and a key tends to leak with the data.
      A hash can't be reversed, so the attacker has to guess. With `sha256` guessing is cheap,
      millions a second, so weak passwords fall fast. A slow hash like scrypt or Argon2id makes
      every guess cost real time. And the salt means each account has to be attacked on its
      own: two people with the same password still have different digests.

recap:
  - Tell a hash, which can't be undone, from encryption, which can with the key.
  - Store passwords with a slow hash like scrypt, Argon2id or bcrypt, never `sha256`.
  - Give each password its own salt, store it with the hash, and reuse it at login.

recall:
  - id: card-hash-vs-encryption
    concept: security.hashing
    front: What can you do with encrypted data that you can't do with a hash?
    back: >-
      Turn it back into the original, with the key. A hash only goes one way.
  - id: card-why-slow-hash
    concept: security.password-hashing
    front: Why store a password with a deliberately slow function?
    back: >-
      To make each of an attacker's guesses expensive. A fast hash lets them try millions a
      second.
  - id: card-salt-job
    concept: security.password-hashing
    front: What does a salt do, and what does it not do?
    back: >-
      It gives equal passwords different digests, so one guess tests one account. It doesn't
      make a single guess slower.
  - id: card-login-salt
    concept: security.password-hashing
    front: At login, which salt do you hash the typed password with?
    back: >-
      The one stored with that user's hash. A new salt gives a different digest every time.

references:
  - kind: docs
    title: Password Storage Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    note: Argon2id, scrypt and bcrypt, salting, and why hashing beats encryption for passwords.
    primary: true
    verified: true
  - kind: docs
    title: Crypto
    authors: Node.js
    venue: Node.js documentation
    url: https://nodejs.org/api/crypto.html
    note: '`createHash`, `scryptSync`, `randomBytes` and `timingSafeEqual`.'
    verified: true

deepDive: >-
  The timings in this lesson come from one laptop core running Node: a million `sha256`
  hashes in about 0.65 seconds, and about 40 ms for one `scryptSync` with its default cost.
  Attackers use graphics cards built for this, which run fast hashes far quicker still.
  Memory-hard functions such as scrypt and Argon2id need a lot of memory per guess, which
  blunts that hardware.


  Comparing digests with `===` can leak timing, because it stops at the first different
  character. `timingSafeEqual` from `node:crypto` always reads the whole value. For password
  digests the salt already makes this hard to exploit, but it's a good habit, and it matters
  for tokens and signatures (next lesson).


  Tune the cost so one hash takes tens of milliseconds on your server, and raise it over the
  years. When a user logs in and their stored hash used an old cost, hash the password again
  with the new one and save it.
