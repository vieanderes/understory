term: button
aka: [button element]
short: A control that performs an action on the current page, like saving or opening a menu.
explain: |
  Some clicks don't go anywhere. They do something: saving a draft, adding to a basket,
  opening a menu. The `button` element is for those.

  It brings a lot for free: keyboard focus, Enter and Space to press it, and the right role
  for screen readers. Inside a form, one submits the form unless you write `type="button"`.
  A `div` with a click handler gets none of this.
analogy: A light switch on the wall. It doesn't take you to another room, it changes something in this one.
example:
  language: html
  code: |
    <button type="button">Add to basket</button>
    <form>
      <button>Send</button> <!-- submits the form -->
    </form>
usage: The menu button inside the form needs type="button", or opening the menu submits the whole form.
twin:
  term: hyperlink
  difference: A button acts where you are, like saving or opening a menu. A link takes you somewhere else, a new page or another spot on this one.
related: [hyperlink, html-form, semantic-html, keyboard-navigation]
level: 1
lessons: [html.forms, design.keyboard-and-focus]
