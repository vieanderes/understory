deepDive: >-
  **No `Allow` header.** The HTTP lesson said a `405` should carry `Allow`, listing the
  methods that work. Next.js 16.3 sends the `405` without one. It does answer an `OPTIONS`
  request with `Allow` for you, so a client can ask that way. If a client needs the header on
  the `405` itself, answer that method yourself and set it.


  **Dynamic segments.** A handler in `app/api/books/[id]/route.ts` gets a second argument.
  Its `params` is a promise, as it is for pages: `const { id } = await ctx.params`.


  **One file per folder.** A `route.ts` and a `page.tsx` can't share a folder, since each
  would answer the same URL. That's why endpoints usually live under `app/api`.


  **Caching.** Route handlers aren't cached by default, so the build marks them `ƒ`, run on
  every request. A `GET` can opt in to being built once, with the route option
  `export const dynamic = 'force-static'`.
