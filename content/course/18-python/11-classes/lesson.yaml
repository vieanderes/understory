id: python.classes
title: Classes and dataclasses
objective: Write classes with methods, keep data on self, and use dataclasses for plain data.
level: essential
minutes: 10
concepts: [python.classes, python.dunder-methods, python.dataclasses, python.inheritance-and-composition]
prerequisites: [python.files-and-json]
opening:
  text: >-
    You'll bundle data and behaviour into your own types, and let Python write the boring
    parts. Every model reply, tool result and config object you'll handle is one of these.

steps:
  - type: prose
    id: classes-and-self
    body: |-
      A **class** is a blueprint for objects, as in JavaScript, with different spelling:

      ```python
      class Tally:
          def __init__(self):
              self.count = 0

          def add(self):
              self.count = self.count + 1

      clicks = Tally()   # no new
      clicks.add()
      ```

      `__init__` is the constructor. Every method takes the object as its first parameter,
      `self`, Python's `this`, and you write it out. Calling the class makes an
      **instance**.

  - type: fill-blank
    id: fill-init
    concept: python.classes
    difficulty: 2
    prompt: Give each timer its own label, set when the timer is made.
    language: python
    template: |
      class Timer:
          def {{1}}(self, label):
              {{2}}.label = label
              self.seconds = 0
    blanks:
      - key: '1'
        answer: __init__
      - key: '2'
        answer: self
    bank: [__init__, constructor, self, this]

  - type: prose
    id: class-vs-instance
    body: |-
      Where you assign decides who owns the value. In `__init__`, `self.items = []` gives
      each instance its own list. In the class body, outside any method, a name belongs to
      the class, and every instance shares it:

      ```python
      class Basket:
          shared = []            # one list for every basket

          def __init__(self):
              self.items = []    # a new list for each basket
      ```

  - type: ai-review
    id: review-shared-list
    concept: python.classes
    difficulty: 4
    language: python
    request: Write a Cart class where each cart keeps its own items.
    flawClass: logic
    code: |
      class Cart:
          items = []

          def add(self, item):
              self.items.append(item)

          def count(self):
              return len(self.items)
    prompt: >-
      An assistant wrote this. A test with one cart passed. In production, a second customer
      sees the first customer's tea. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The list belongs to the class, so carts share it
        correct: true
        feedback: >-
          Right. Create the list in `__init__` with `self.items = []`.
      - text: '`append` should be `extend`'
        feedback: >-
          `append` adds one item, which is right. The trouble is whose list it is.
      - text: '`count` should use `self.count`'
        feedback: >-
          `len(self.items)` is fine. Every cart reads the same shared list.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Fill one cart, check a second is empty
          correct: true
          feedback: >-
            Yes. Two carts are the only way to see the sharing.
        - text: One cart with two items counts 2
          feedback: >-
            One cart passes that test even with the shared list. The bug needs a second cart.
        - text: Check a new cart counts 0
          feedback: >-
            The first new cart does count 0. Only after another cart adds an item does it go wrong.
    fix: |
      class Cart:
          def __init__(self):
              self.items = []

          def add(self, item):
              self.items.append(item)

          def count(self):
              return len(self.items)

  - type: prose
    id: dunder-and-dataclass
    body: |-
      By default, `==` on two objects asks whether they're the very same object. Python
      calls **dunder methods**, named with double underscores, for operators like that:
      `__eq__` for `==`, `__repr__` for printing.

      `@dataclass`, a **decorator** written above the class, writes them from the fields:

      ```python
      from dataclasses import dataclass

      @dataclass
      class Room:
          name: str
          seats: int = 4
      ```

      A field is a name, a type and an optional default. Now `Room("Blue") == Room("Blue")`.

  - type: code-challenge
    id: write-message-dataclass
    concept: python.dataclasses
    difficulty: 2
    language: python
    starter: message.starter.py
    solution: message.solution.py
    tests: message.tests.py
    prompt: >-
      Turn `Message` into a dataclass. Keep `role` and `content`, both text. Add `tokens`, a
      whole number that defaults to 0. Two messages with the same fields must be equal.


      Example: `Message("user", "Hi")` prints as `Message(role='user', content='Hi', tokens=0)`.
    hints:
      - 'The dataclass step shows `@dataclass` above the class, and one line per field.'
      - 'A dataclass writes `__init__` for you, so the hand-written one goes.'
      - 'Fields read `role: str`, `content: str` and `tokens: int = 0`.'

  - type: prose
    id: inheritance-and-composition
    body: |-
      A class can **inherit** from another: `class Admin(User):` gets every `User` method,
      and `super().__init__()` runs the parent's setup.

      Often it's simpler to hold another object as a field instead. That's
      **composition**. A `Report` that has an `emailer` can swap it for a fake in tests,
      which a subclass can't do.

  - type: multiple-choice
    id: pick-composition
    concept: python.inheritance-and-composition
    difficulty: 3
    question: An `OrderService` needs to send emails. Which design is easiest to test?
    choices:
      - text: It holds an emailer passed into `__init__`
        correct: true
        feedback: >-
          Yes. A test passes in a fake emailer and nothing real is sent.
      - text: It inherits from an `Emailer` class
        feedback: >-
          Then it is an emailer, forever. You can't swap the sending out in a test.
      - text: It copies the email code into its methods
        feedback: >-
          That works once, then two copies drift apart. Holding an emailer keeps one.

  - type: code-challenge
    id: write-account
    concept: python.classes
    difficulty: 3
    language: python
    starter: account.starter.py
    solution: account.solution.py
    tests: account.tests.py
    prompt: >-
      Write an `Account` class. `Account("Ana")` starts with a `balance` of 0. `deposit(amount)`
      adds to it and `withdraw(amount)` takes away. Withdrawing more than the balance raises
      `ValueError` and changes nothing.


      Example: deposit 50, withdraw 20, and `balance` is `30`.
    hints:
      - 'The first step''s `Tally` keeps its count on `self`.'
      - 'Set `self.balance` in `__init__`, so every account gets its own.'
      - 'In `withdraw`, check `amount > self.balance` and `raise` before you subtract.'

  - type: explain-back
    id: explain-dataclass-equality
    concept: python.dunder-methods
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Two plain `Room("Blue")` objects are not equal, but two dataclass ones are. What does
      `@dataclass` change to cause that?
    rubric:
      - '`==` calls the `__eq__` method.'
      - A plain class inherits an `__eq__` that checks for the same object.
      - '`@dataclass` writes an `__eq__` that compares the fields.'
    modelAnswer: >-
      `==` calls `__eq__`. A plain class uses the default, which asks whether both sides are
      the same object. `@dataclass` writes its own `__eq__` that compares every field, so two
      rooms named Blue are equal.

recap:
  - Write a class with `__init__`, methods and `self`.
  - Give objects a readable `__repr__` and field-wise `==` with `@dataclass`.
  - Prefer holding another object over inheriting from it.
recall:
  - id: card-self
    concept: python.classes
    front: What is `self` in a method?
    back: >-
      The instance the method was called on. Python passes it in as the first argument.
  - id: card-default-eq
    concept: python.dunder-methods
    front: What does `==` compare for two objects of a plain class?
    back: >-
      Whether they're the same object. Define `__eq__`, or use a dataclass, to compare fields.
  - id: card-dataclass-writes
    concept: python.dataclasses
    front: Which methods does `@dataclass` write for you from the fields?
    back: >-
      `__init__`, `__repr__` and `__eq__`, so instances build, print and compare by their
      fields.
  - id: card-composition
    concept: python.inheritance-and-composition
    front: What is composition, and why does it help testing?
    back: >-
      Holding another object as a field. A test can pass in a fake in its place.

