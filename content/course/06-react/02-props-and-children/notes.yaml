summary: >-
  Props are how a parent configures a child. React gathers the attributes you write on a
  component tag into one object and passes it as the function's only argument. Data flows one
  way, down the tree: a child reads its props and never changes them. When the parent renders
  again with new values, the child receives a new props object.


  `children` is the prop that makes components composable. Whatever sits between the tags
  arrives there, already built by the parent, and the component only decides where it goes.
  Any other prop can carry JSX the same way, which gives a component named slots such as
  `actions` or `sidebar`. This is how design system pieces like cards, dialogs and layouts
  stay generic.


  Conditional rendering is ordinary JavaScript in braces: `&&`, `? :`, or an early `return
  null`. It works because React draws nothing for `false`, `null` and `undefined`. The catch
  is that it does draw numbers, so a count on the left of `&&` leaks a `0`. And a condition
  that removes a component also throws away its state, which is sometimes what you want and
  sometimes a bug.
remember:
  - Props are one read-only object the parent builds on every render; the child reads them and never assigns to them.
  - Data flows down through props, and changes flow up through callback props such as `onSelect`.
  - '`children` holds whatever the parent wrote between the tags, and any prop can carry JSX as a named slot.'
  - React renders nothing for `false`, `null`, `undefined` and `true`, but renders `0` and `NaN`, so the left side of `&&` must be a real boolean.
  - Rendering a component conditionally unmounts it when the condition is false, and its state is lost; hiding it with CSS keeps the state.
  - Type slots and children as `React.ReactNode`, which accepts anything React can render, including strings, numbers, arrays and `null`.
  - Destructuring defaults such as `size = 40` apply only when the prop is missing or `undefined`.
sections:
  - title: Composition instead of passing props through
    body: |-
      Say a page holds the signed-in user, and a small avatar four levels down needs it. The
      obvious fix threads a `user` prop through three components that never use it. That's
      called **prop drilling**, and every layer in between now has to know about users.

      Composition is often the better fix. The page builds the avatar itself and passes it
      down as `children` or a slot. The layers in between only place it.

      ```tsx
      import type { ReactNode } from 'react';

      type User = { name: string; photo: string };

      function Header({ end }: { end: ReactNode }) {
        return (
          <header className="header">
            <a href="/">Home</a>
            {end}
          </header>
        );
      }

      function Layout({ header, children }: { header: ReactNode; children: ReactNode }) {
        return (
          <div className="layout">
            {header}
            <main>{children}</main>
          </div>
        );
      }

      export function Page({ user }: { user: User }) {
        return (
          <Layout header={<Header end={<img src={user.photo} alt={user.name} />} />}>
            <p>Welcome back, {user.name}</p>
          </Layout>
        );
      }
      ```

      `Layout` and `Header` don't mention `User` at all. The element `<img ... />` was created
      in `Page`, so it closes over `Page`'s data, including any state or handlers. That's the
      key idea: an element is a finished description, and whoever creates it decides what goes
      in it. Reach for context, a later lesson, when many distant components need the same
      value; reach for composition first when one parent can build the piece itself.
  - title: Unmounting versus hiding
    body: |-
      `{open && <Panel />}` doesn't only hide the panel. When `open` turns false, React removes
      `Panel` from the tree, and its state goes with it. When `open` turns true again, React
      creates a fresh `Panel` with fresh state.

      ```tsx
      import { useState } from 'react';

      function Notes() {
        const [text, setText] = useState('');
        return <textarea aria-label="Notes" value={text} onChange={(e) => setText(e.target.value)} />;
      }

      // Typed notes are lost each time the panel closes.
      export function Unmounting({ open }: { open: boolean }) {
        return <div>{open && <Notes />}</div>;
      }

      // Typed notes survive, because Notes stays in the tree.
      export function Hiding({ open }: { open: boolean }) {
        return (
          <div hidden={!open}>
            <Notes />
          </div>
        );
      }
      ```

      We rendered both with React Testing Library, typed into the textarea, closed and reopened
      them. `Unmounting` came back empty. `Hiding` kept the text.

      Which to pick is a product decision. Unmounting is cheaper when the hidden part is large
      or rarely opened, and it resets forms for free. Hiding keeps drafts, scroll position and
      video playback, at the cost of keeping the subtree alive. The `hidden` attribute also
      removes the content from the accessibility tree, so a screen reader skips it as a
      sighted user does. A third option is to lift the state to the parent, so the child can
      unmount without losing the data.
  - title: Typing props in TypeScript
    body: |-
      Give each component a props type, and let TypeScript catch a missing or misspelt prop at
      the call site. A few types come up again and again.

      ```tsx
      import type { ComponentProps, ReactNode } from 'react';

      type AlertProps = {
        tone?: 'info' | 'danger';
        title: string;
        children: ReactNode;
      };

      export function Alert({ tone = 'info', title, children }: AlertProps) {
        return (
          <div role="alert" className={`alert alert-${tone}`}>
            <strong>{title}</strong>
            {children}
          </div>
        );
      }

      // Accept every native button prop, and add one of our own.
      type ButtonProps = ComponentProps<'button'> & { variant?: 'primary' | 'quiet' };

      export function Button({ variant = 'quiet', className, ...rest }: ButtonProps) {
        return <button {...rest} className={`button button-${variant} ${className ?? ''}`} />;
      }

      export const demo = (
        <Alert title="Saved">
          <Button type="button" onClick={() => console.log('undo')}>Undo</Button>
        </Alert>
      );
      ```

      `ReactNode` is the right type for children and slots: it accepts elements, strings,
      numbers, arrays, `null` and booleans. `ReactElement`, or `JSX.Element`, accepts only an
      element, so a plain string child fails to type-check; use it only when you truly need an
      element, for example to read its props. A union such as `'info' | 'danger'` turns a
      variant into a closed list that autocompletes. `ComponentProps<'button'>` with a rest
      spread lets a wrapper accept `type`, `disabled`, `aria-*` and every handler without
      listing them. Put `{...rest}` before your own props when yours must win.
  - title: Choosing a conditional form
    body: |-
      Each form reads best in its own place.

      - `cond && <X />` when there's nothing to show otherwise. Keep the left side a boolean:
        `items.length > 0`, `Boolean(error)`, or `!!error`.
      - `cond ? <A /> : <B />` when both branches show something.
      - An early `return null` or `return <Spinner />` when the whole component depends on the
        condition. It keeps the main JSX flat.
      - A variable set by `if` or a lookup object when there are three or more cases, such as a
        status of `'idle'`, `'loading'`, `'error'` or `'done'`.

      Nested ternaries inside JSX are legal but hard to read; most teams ban them in review.
      And remember what else renders: `NaN` shows as text, while an empty string renders an
      empty text node you can't see. A number from an API that's sometimes `NaN` is a reason to
      compare explicitly rather than trust truthiness.

      One subtle case: an early return must come after every hook call. The next lesson
      explains why hooks can't sit behind a condition, and an early return above a hook is a
      condition in disguise.
pitfalls:
  - >-
    **A number on the left of `&&`.** `{count && <Badge />}` shows `0` when the count is zero.
    Write `count > 0 &&`, or use a ternary that returns `null`.
  - >-
    **Assigning to a prop.** `props.items.push(x)` changes the parent's array behind its back,
    and the parent won't re-render. Ask the parent to change it through a callback prop.
  - >-
    **Copying a prop into state.** `useState(props.title)` reads the prop on the first render
    only, so later changes are ignored. Read the prop directly, or compute from it.
  - >-
    **Forgetting to place `children`.** The content is passed, silently dropped, and no error
    appears. Destructure `children` and put it in the JSX.
  - >-
    **Expecting a default for `null`.** `{ size = 40 }` keeps `null` as `null`. Pass
    `undefined`, or leave the prop out, when you want the default.
  - >-
    **Losing a form by closing it.** `{open && <Form />}` unmounts the form and wipes what was
    typed. Hide it instead, or keep the draft in the parent.
interview:
  - question: Why are props read-only, and how does a child change something the parent owns?
    answer: >-
      Because the parent owns the data, and one owner per value keeps the flow predictable.
      Props are a snapshot the parent builds during its render; if the child mutated them, the
      parent wouldn't know, nothing would re-render, and the next parent render would overwrite
      the change. So data flows down and requests flow up: the parent passes the value and a
      callback such as `onChange`, and the child calls the callback. The parent updates its
      state, re-renders, and the child receives new props. In development React freezes the
      props object, so assigning to it throws. The cost is some wiring for deep trees, which is
      where composition or context comes in.
  - question: When would you pass JSX as a prop instead of passing data?
    answer: >-
      When the parent knows what to show and the child only knows where to put it. A `Card`
      with `title` and `actions` slots doesn't need to know whether the action is a button, a
      link or a menu; the page decides. It also cures prop drilling: the page can build an
      avatar with the user it already has and pass the element down, so the layouts in between
      never see a `user` prop. Passing data is better when the child must control the
      rendering, for example a list that decides how to lay out each row. Then pass the data
      and, if the caller needs control over each item, a render function prop.
  - question: What's the difference between hiding a component and not rendering it?
    answer: >-
      Not rendering it unmounts it, so its state and DOM are thrown away; hiding keeps both. With
      `{open && <Panel />}`, closing removes the panel, and reopening builds a fresh one with
      initial state, so a half-typed form is gone. With `hidden` or a CSS class, the panel stays
      mounted and keeps its draft, its scroll position and anything it subscribed to. I unmount
      heavy or rarely used content, and anything that should reset. I hide tabs or drawers
      people switch between often. If the data matters but the subtree is heavy, I lift the
      state up and unmount anyway.
  - question: What type do you give `children` in TypeScript, and why?
    answer: >-
      `React.ReactNode`, because it matches what React can actually render: elements, strings,
      numbers, arrays, fragments, `null`, `undefined` and booleans. `JSX.Element` or
      `ReactElement` is narrower: it accepts one element only, so `<Card>Hello</Card>` with a
      string child fails to type-check, and so do lists and conditional `null`. I use the narrow
      type only when the component needs to inspect an element, which is rare and usually a sign
      the API should take data instead. For a wrapper around a native element I use
      `ComponentProps<'button'>`, which already includes `children` and every native attribute.
