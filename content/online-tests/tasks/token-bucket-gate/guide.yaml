approach: >-
  Keep the number of tokens in one variable. When a request arrives, first add R for every
  second since the previous request, and cap the total at C. Then accept the request if a
  token is left and take it, or reject it and take nothing. Refilling only when a request
  arrives gives the same answer as a timer, without simulating empty seconds.
complexity: O(N) time, O(N) space for the result
steps:
  - kind: read
    title: Read the rules in the order they apply
    minutes: 2
    body: |-
      Three rules decide every answer: the bucket starts **full**, refills happen **before**
      the requests of that second, and a rejected request takes **nothing**.

      Note the ranges too. T reaches 1,000,000,000, so you cannot loop over every second.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Name the state you keep. If the comment says "tokens", the loop is easy to write.
    code:
      ts: |-
        // Replay requests on a bucket of at most C tokens, +R per second; 1 = accepted, 0 = rejected.
      python: |-
        # Replay requests on a bucket of at most C tokens, +R per second; 1 = accepted, 0 = rejected.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - a single request at a huge time;
      - no refill at all, R = 0;
      - a burst in one second, larger than the bucket;
      - a long gap, where a missing cap lets the bucket overfill.
    input:
      - "(5, 5, [1000000000])"
      - "(2, 0, [0, 10, 20, 30])"
      - "(3, 10, [7, 7, 7, 7, 7])"
      - "(2, 1, [0, 0, 100, 100, 100])"
  - kind: ask-ai
    title: Check the refill rule, not the code
    minutes: 1
    body: |-
      The statement could be read as "refill after the requests". Confirm your reading with
      one narrow question about the first example.
    prompt: >-
      Without writing code: in a token bucket where tokens for a second are added before the
      requests of that second, with C = 2 and R = 1, a request at second 1 after two requests
      at second 0 is accepted. Is that right? One sentence.
    expect: >-
      The assistant agrees: one token arrives at second 1, so that request is accepted.
  - kind: write
    title: Write the solution yourself
    minutes: 4
    body: |-
      It is a dozen lines. Refill from the time since the last request, cap at C, then take a
      token or reject. Type it yourself: the order of those three lines is the task.
    code:
      ts: |-
        // Replay requests on a bucket of at most C tokens, +R per second; 1 = accepted, 0 = rejected.
        function solution(C: number, R: number, T: number[]): number[] {
          // Refill lazily: only when a request arrives, add R for every second since the last one,
          // capped at C. No timer is needed, and a long gap costs one multiplication.
          let tokens = C;
          let last = T[0]!;
          const verdicts: number[] = [];
          for (const time of T) {
            tokens = Math.min(C, tokens + R * (time - last));
            last = time;
            if (tokens > 0) {
              tokens -= 1;
              verdicts.push(1);
            } else {
              verdicts.push(0);
            }
          }
          return verdicts;
        }
      python: |-
        # Replay requests on a bucket of at most C tokens, +R per second; 1 = accepted, 0 = rejected.
        def solution(C, R, T):
            # Refill lazily: on each request, add R per second since the last one, capped at C.
            tokens = C
            last = T[0]
            verdicts = []
            for time in T:
                tokens = min(C, tokens + R * (time - last))
                last = time
                if tokens > 0:
                    tokens -= 1
                    verdicts.append(1)
                else:
                    verdicts.append(0)
            return verdicts
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check each of your own results against
      the three rules, one request at a time.
    expect: Two OKs, then [1], [1, 1, 0, 0], [1, 1, 1, 0, 0] and [1, 1, 1, 1, 0].
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      A missing cap or a refill counted from the wrong time are the usual slips. Ask for
      problems only, so the code stays yours.
    prompt: >-
      Review my current solution against the rules: the bucket starts full, refills are
      capped at C and come before the requests of that second, and a rejected request takes
      nothing. List any problems in one line each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
