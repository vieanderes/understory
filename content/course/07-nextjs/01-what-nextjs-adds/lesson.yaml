id: next.what-nextjs-adds
title: What Next.js adds
objective: Create a Next.js app, run it, and say what Next.js adds to React.
level: essential
minutes: 10
concepts: [next.framework, next.create-and-run, next.server-rendering]
prerequisites: [react.state-placement, tooling.node-and-npm]
opening:
  text: >-
    You'll create a real Next.js app, run it on your computer and change its home page. You'll
    also see why its pages appear before any JavaScript has loaded.

steps:
  - type: prose
    id: what-react-leaves-out
    body: >-
      React draws a page from components. A real site needs more than that. Each page needs its
      own address. The first visit should show text quickly, even on a slow phone. And data
      needs a safe place to load.


      A **framework** is a ready-made structure you fill in. You write the pieces, and it calls
      them at the right moment. **Next.js** is a framework for React that handles all three.

  - type: prose
    id: two-first-loads
    body: >-
      Remember the client and the server from the JavaScript chapter. For a plain React app, the
      server sends an almost empty page:


      ```html

      <body><div id="root"></div><script src="/app.js"></script></body>

      ```


      The browser must download and run `app.js` before anything appears. A Next.js server runs
      your components first and sends the result:


      ```html

      <body><main><h1>Recipes</h1><a href="/recipes">See all recipes</a></main>...</body>

      ```


      That's **rendering on the server**: the page arrives finished, and React in the browser
      takes over afterwards.

  - type: predict-output
    id: predict-slow-phone
    concept: next.server-rendering
    difficulty: 1
    language: tsx
    code: |
      export default function Page() {
        return (
          <main>
            <h1>Recipes</h1>
            <a href="/recipes">See all recipes</a>
          </main>
        );
      }
    question: >-
      This is a Next.js page. On a slow phone, the JavaScript is still downloading. What's on
      screen?
    choices:
      - text: The heading and the link
        correct: true
        feedback: >-
          Right. The server already turned the component into HTML, and browsers show HTML
          at once.
      - text: A blank page
        feedback: >-
          That's the plain React picture, where the browser builds everything. Here the server
          sent finished HTML.
      - text: The heading, but no link yet
        feedback: >-
          The link is ordinary HTML too. It works as soon as it arrives, before any JavaScript.

  - type: prose
    id: create-and-run
    body: >-
      `npx` runs a package's command without adding it to a project first. `create-next-app`
      builds a new project folder, and `--yes` accepts the usual settings. We've cut the
      install lines.


      ```text

      $ npx create-next-app@latest recipes --yes

      Success! Created recipes at /home/dev/recipes

      $ cd recipes

      $ npm run dev

      ▲ Next.js 16.3.6 (Turbopack)

      - Local:         http://localhost:3000

      ✓ Ready in 420ms

      ```


      `npm run dev` starts the **dev server** from the tooling chapter. Open that address, and
      your app is there.

  - type: multiple-choice
    id: pick-localhost
    concept: next.create-and-run
    difficulty: 1
    question: >-
      Your dev server shows `http://localhost:3000`. You send that link to a friend. What do
      they see?
    choices:
      - text: Nothing, because it points at their own computer
        correct: true
        feedback: >-
          Right. `localhost` always means "this computer", and theirs has no server on port
          3000.
      - text: Your app, as long as your laptop is on
        feedback: >-
          It looks like a web address, but `localhost` never leaves the computer typing it.
          Sharing needs a deploy.
      - text: A Next.js error page
        feedback: >-
          Nothing answers at all, so nothing can send an error page. Their browser can't
          connect.

  - type: prose
    id: the-folder
    body: >-
      Here's what `create-next-app` made, without the config files:


      ```text

      $ ls

      app/  node_modules/  package.json  public/

      $ ls app

      favicon.ico  globals.css  layout.tsx  page.tsx

      ```


      `app/page.tsx` is the home page, at `/`. `app/layout.tsx` wraps every page and holds the
      `<html>` and `<body>` tags. `public` holds images and other files, served as they are.
      Edit `page.tsx`, save, and the open tab updates by itself.

  - type: parsons
    id: arrange-first-run
    concept: next.create-and-run
    difficulty: 2
    language: bash
    prompt: >-
      You want a new app called `tide-times` open in your browser. Put the commands in order.
    blocks:
      - id: create
        code: npx create-next-app@latest tide-times --yes
        subgoal: Make the project
      - id: enter
        code: cd tide-times
        subgoal: Run it
      - id: dev
        code: npm run dev
    distractors:
      - id: node-page
        code: node app/page.tsx
        feedback: >-
          Node can't run a page on its own. Next.js reads your pages and runs them for you.
      - id: install-next
        code: npm install next
        feedback: >-
          `create-next-app` already installed Next.js and React into the project.

  - type: code-challenge
    id: build-home-page
    concept: next.framework
    difficulty: 2
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write the home page of a tide-times app, as `app/page.tsx` would hold it. Next.js calls the
      file's default export, so export the component with `export default`.


      Show a heading, `Tide times`, and one list item for each harbour in `harbours`. Below the
      list, add a link with the text `All harbours` that goes to `/harbours`.
    hints:
      - The list is a `map` over `harbours`, like the lists in the React chapter.
      - Each list item needs a `key`. The harbour name is unique, so it works.
      - 'Start with `export default function Page() {`, then return a `main` holding the rest.'

  - type: ai-review
    id: review-named-export
    concept: next.framework
    difficulty: 2
    language: tsx
    request: Add a page at /harbours that shows a heading.
    flawClass: hallucinated-api
    code: |
      // app/harbours/page.tsx
      export function HarboursPage() {
        return <h1>Harbours</h1>;
      }
    prompt: >-
      An assistant wrote this. Visiting `/harbours` shows an error, and the terminal says
      `The default export is not a React Component in "/harbours/page"`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: Next.js only calls a page's default export
        correct: true
        feedback: >-
          Yes. The framework looks for `export default`, so a named export is invisible to it.
      - text: The component's name must be `Page`
        feedback: >-
          Any name works. What matters is that it's the default export of `page.tsx`.
      - text: A page must return a `main` element
        feedback: >-
          A page can return any JSX. The error is about the export, not what's inside.
    fix: |
      // app/harbours/page.tsx
      export default function HarboursPage() {
        return <h1>Harbours</h1>;
      }

  - type: explain-back
    id: explain-first-load
    concept: next.server-rendering
    difficulty: 3
    prompt: >-
      On a slow phone, a plain React app stays blank for a while. A Next.js page shows text at
      once. Why?
    rubric:
      - A plain React app sends a nearly empty page, and the browser builds it after the JavaScript downloads.
      - Next.js runs the components on the server and sends finished HTML.
      - The browser shows HTML straight away, and React takes over clicks once the JavaScript arrives.
    modelAnswer: >-
      A plain React app sends a page with an empty `div` and a script. Nothing shows until the
      browser has downloaded that script and run React. Next.js runs the components on the
      server first and sends the finished HTML. The browser can show HTML the moment it
      arrives. React loads afterwards and makes the page interactive.

recap:
  - Create a Next.js app with `create-next-app` and run it with `npm run dev`.
  - Find the home page in `app/page.tsx` and change it.
  - Explain why a server-rendered page shows before its JavaScript loads.

recall:
  - id: card-what-a-framework-is
    concept: next.framework
    front: How is a framework different from a library you call?
    back: >-
      You fill in a structure, and the framework calls your code. Next.js calls the default
      export of each `page.tsx`.
  - id: card-run-an-app
    concept: next.create-and-run
    front: Which two commands create a Next.js app and start it?
    back: >-
      `npx create-next-app@latest my-app --yes`, then `npm run dev` inside the new folder. It
      serves the app at `http://localhost:3000`.
  - id: card-server-rendering
    concept: next.server-rendering
    front: What does rendering on the server mean?
    back: >-
      The server runs your components and sends finished HTML. The page shows before any
      JavaScript arrives, and React takes over in the browser afterwards.
  - id: card-home-page-file
    concept: next.create-and-run
    front: Which file is the home page of a new Next.js app?
    back: >-
      `app/page.tsx`. It's served at `/`, and `app/layout.tsx` wraps it.

