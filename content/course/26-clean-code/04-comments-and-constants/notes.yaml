summary: >-
  Code can say what it does, but it can't say why. A good comment carries the knowledge the
  code can't: the rule from outside, the trade-off you chose, the bug report behind an odd
  line. A comment that restates the code adds reading, and the day someone changes the line
  and not the comment, it starts to lie. Nothing tests a comment, so the fewer and more
  durable they are, the more a reader can trust them.


  Magic values are the same problem in a smaller package. A bare `86400` or `0.2` hides its
  meaning, and a rule typed in two places drifts apart. A **named constant** gives the value
  a meaning, a unit and one home, so a change happens once.


  **Dead code**, meaning unused functions, lines after a `return` and commented-out blocks,
  costs every reader a moment of "does this matter?" and pays nothing back, because version
  control already keeps the history. Doc comments on public functions, and `TODO`s tied to a
  real issue, are the exceptions that earn their keep.
remember:
  - A comment earns its place by saying why, such as a constraint, a trade-off or a link to a bug, because the code already says what.
  - A comment that restates the code goes stale when the code changes, and then it misleads.
  - Before writing a comment, try a better name or an extracted function, which says the same thing and can't drift.
  - A magic value is an unexplained literal, and naming it as a constant gives it a meaning, a unit and one place to change.
  - The same rule typed in two places will drift apart, so one rule gets one constant.
  - Delete dead and commented-out code, because Git keeps every committed version.
  - A doc comment on a public function states the contract, what each parameter means, what it returns and what it throws.
  - A `TODO` needs a reason and an issue link, or it becomes dead code's cousin.
sections:
  - title: Replace what-comments with code, keep why-comments
    body: |-
      Most "what" comments are a name waiting to happen. The comment labels a block, so
      extract the block and use the label as its name. The code can't drift from a name the
      way it drifts from a comment.

      ```js
      // Before: comments narrate the code.
      function canCheckInBefore(booking, now) {
        // check the booking is paid and not cancelled
        if (booking.paidAt && !booking.cancelledAt) {
          // check-in opens 24 hours before the start
          if (booking.startMs - now < 24 * 60 * 60 * 1000) return true;
        }
        return false;
      }

      // After: names carry the what; one comment carries the why.
      // Check-in opens a day early because the key-code system needs a day to issue codes.
      const CHECK_IN_WINDOW_MS = 24 * 60 * 60 * 1000;

      function isActiveBooking(booking) {
        return Boolean(booking.paidAt) && !booking.cancelledAt;
      }

      function canCheckIn(booking, now) {
        if (!isActiveBooking(booking)) return false;
        return booking.startMs - now < CHECK_IN_WINDOW_MS;
      }

      const booking = { paidAt: 1, cancelledAt: null, startMs: 100_000_000 };
      console.log(canCheckIn(booking, 50_000_000), canCheckInBefore(booking, 50_000_000)); // true true
      console.log(canCheckIn(booking, 0), canCheckInBefore(booking, 0)); // false false
      ```

      Comments that survive this treatment are the valuable ones. The kinds worth writing:

      - **A reason from outside the code**: a law, a partner's API limit, a product rule.
      - **A trade-off**: "Linear scan: the list never exceeds 20 items, and a map cost more
        to keep in sync."
      - **A workaround with a link**: the browser bug or library issue that forced the odd
        line, so someone can delete it once the issue is fixed.
      - **A warning of consequences**: "Changing this order breaks invoices already
        issued."
      - **A dense expression explained**: what a regular expression is meant to match, with
        an example.

      A comment about why stays true longer because it describes the situation, not the
      line. The line can be rewritten three times and the reason still holds.
  - title: Doc comments for public contracts
    body: |-
      A function other people call deserves a different kind of comment: a **doc comment**
      that states the contract. In JavaScript and TypeScript that is a JSDoc block,
      `/** ... */`, directly above the declaration. Editors show it on hover and in
      autocomplete, so callers read it without opening your file.

      ```ts
      export class InvalidQuantityError extends Error {
        constructor(quantity: number) {
          super(`Quantity must be a whole number from 1 to 99, got ${quantity}`);
          this.name = 'InvalidQuantityError';
        }
      }

      /**
       * Adds a line to the basket, merging it with an existing line for the same product.
       *
       * @param basket - The current basket. It is not changed.
       * @param productId - The product to add.
       * @param quantity - Whole units, from 1 to 99.
       * @returns A new basket with the line added or merged.
       * @throws {InvalidQuantityError} If `quantity` is outside 1 to 99 or not whole.
       * @example
       * addLine({ lines: [] }, 'mug', 2); // { lines: [{ productId: 'mug', quantity: 2 }] }
       */
      export function addLine(
        basket: { lines: { productId: string; quantity: number }[] },
        productId: string,
        quantity: number,
      ) {
        if (!Number.isInteger(quantity) || quantity < 1 || quantity > 99) {
          throw new InvalidQuantityError(quantity);
        }
        const existing = basket.lines.find((line) => line.productId === productId);
        const lines = existing
          ? basket.lines.map((line) =>
              line === existing ? { ...line, quantity: line.quantity + quantity } : line,
            )
          : [...basket.lines, { productId, quantity }];
        return { lines };
      }

      console.log(addLine({ lines: [] }, 'mug', 2).lines); // [ { productId: 'mug', quantity: 2 } ]
      ```

      In TypeScript, don't repeat the types in the JSDoc: the signature already has them,
      and a second copy can disagree. Spend the words on what the types can't say: units,
      ranges, whether an argument is changed, what is thrown and when. Plain JavaScript
      projects can put types in JSDoc (`@param {number} quantity`), and TypeScript's
      checker can read them with `checkJs` switched on.

      Internal helpers rarely need doc comments. A clear name and a short signature are the
      documentation. Save the ceremony for code with callers you don't sit next to.
  - title: Constants done well
    body: |-
      A good constant name says what the value means and its unit, not what the value is.
      `FIFTY = 50` names the literal and is useless the day the threshold becomes 60.
      `FREE_DELIVERY_THRESHOLD_POUNDS = 50` survives the change.

      Write derived values as the calculation, not the result. `24 * 60 * 60 * 1000` shows
      it is a day in milliseconds; `86400000` makes the reader count zeros. Numeric
      separators help with long literals: `5_000_000` reads as five million.

      Related constants can live together in one object. `as const` makes TypeScript treat
      the values as read-only literals, and `Object.freeze` blocks changes at run time. Both
      are shallow: a nested object inside is still changeable unless you freeze it too.

      ```ts
      const LIMITS = Object.freeze({
        maxBasketItems: 50,
        maxUploadBytes: 5_000_000,
        sessionIdleMs: 30 * 60 * 1000,
      });

      const ROLES = ['guest', 'member', 'admin'] as const;
      type Role = (typeof ROLES)[number]; // 'guest' | 'member' | 'admin'

      function isRole(value: string): value is Role {
        return (ROLES as readonly string[]).includes(value);
      }

      console.log(LIMITS.sessionIdleMs, Object.isFrozen(LIMITS)); // 1800000 true
      console.log(isRole('admin'), isRole('owner')); // true false
      ```

      Where a constant lives follows its reach. Used by one function, keep it at the top of
      that module. Shared across features, give it a small module of its own, named after
      the domain, such as `delivery.ts`, not a giant `constants.ts` that everything imports.

      A constant is not configuration. Values that differ between environments or change
      without a release, such as an API URL or a feature switch, belong in environment
      variables or a config service, validated at start-up. Constants are facts of the code
      that only change with a code change.

      Not every literal is magic. `0` and `1` as starting points, `/ 2` for a midpoint and
      `100` in a percentage read fine. Name a value when its meaning or origin isn't obvious,
      or when it appears in more than one place.
  - title: TODOs, dead code and the tools that find them
    body: |-
      A `TODO` is a promise with no owner unless you give it one. The useful form names the
      reason and links the issue that tracks it, so someone can find the context and
      delete the comment when the work is done.

      ```ts
      const FIRST_APP_VERSION_SENDING_PENCE = 3;

      // TODO(#482): remove once no app older than version 3 is in use; they send pounds.
      function amountInPence(body: { amount: number; appVersion: number }): number {
        if (body.appVersion < FIRST_APP_VERSION_SENDING_PENCE) return Math.round(body.amount * 100);
        return body.amount;
      }

      console.log(amountInPence({ amount: 4.99, appVersion: 2 })); // 499
      console.log(amountInPence({ amount: 499, appVersion: 3 })); // 499
      ```

      Dead code hides in several forms: a function nobody calls, a branch behind a feature
      flag that has been on for everyone for a year, lines after a `return`, parameters no
      caller passes, and commented-out blocks. Tools find most of it:

      - ESLint's `no-unused-vars` flags unused variables, functions and imports, and
        `no-unreachable` flags code after `return`, `throw`, `break` or `continue`.
      - TypeScript's `noUnusedLocals` and `noUnusedParameters` make unused names a compile
        error, and setting `allowUnreachableCode` to `false` does the same for unreachable
        lines.
      - Unused exports, which a single-file check can't see, need a whole-project tool such
        as knip.

      Deleting is safe because history keeps everything that was committed. If you need a
      removed block back, Git's pickaxe search finds the commits that added or removed a
      string:

      ```bash
      git log -S "applyLegacyDiscount" --oneline
      ```

      Then `git show <commit>` prints the old code. That is a far better archive than a
      commented-out block that every future reader has to skip.
pitfalls:
  - "**Comments that narrate the code.** `// loop over users` above a loop adds reading and nothing else, and it will drift. Delete it, or turn a block label into a function name."
  - "**Fixing the code and not the comment.** A limit changes from 3 to 5 and the comment still says 3, so support tells customers the wrong rule. When you change a line, read the comment above it, or better, remove the need for it."
  - "**Units in a comment instead of the name.** `const IDLE_LIMIT = 30; // minutes` gets multiplied by 1000 and becomes 30 seconds. Put the unit in the name: `IDLE_LIMIT_MS = 30 * 60 * 1000`."
  - "**Naming the value, not the meaning.** `const FIVE = 5` or `const TWENTY_PERCENT = 0.2` break the day the rule changes. Name what it is for: `MAX_LOGIN_ATTEMPTS`, `VAT_RATE`."
  - "**Keeping commented-out code \"in case\".** It rots, it confuses search results and reviewers, and it is rarely brought back. Delete it; `git log -S` finds it if you ever need it."
  - "**Assuming `Object.freeze` or `as const` is deep.** Both protect only the top level, so a nested object can still change. Freeze nested objects too, or keep constants flat."
  - "**A giant shared constants file.** A single `constants.ts` couples every feature to every other and hides where a value is used. Keep constants beside the code that owns them."
interview:
  - question: When is a comment a good idea, and when is it a smell?
    answer: >-
      A comment is good when it says something the code can't: why a decision was made,
      a constraint from outside such as a partner's rate limit, a trade-off, or a link to
      the bug behind a workaround. It's a smell when it restates what the code does,
      because nothing keeps it in sync, so it eventually lies, and readers believe it. My
      first move with a "what" comment is to turn it into a name, by extracting a variable
      or a function, which can't drift. Doc comments on public APIs are the exception,
      because they state a contract for callers who never read the body. The trade-off is
      that over-extracting to avoid comments can scatter logic, so a short why-comment is
      sometimes the clearer choice.
  - question: What is a magic number, and is every literal magic?
    answer: >-
      A magic number is a literal whose meaning isn't clear from the code, like `86400`,
      `0.2` or `5`. Replacing it with a named constant, such as `SECONDS_PER_DAY` or
      `VAT_RATE`, says what it means, can carry the unit and gives the rule one place to
      change, so two copies can't drift, as when sign-up checks 8 characters and reset
      checks 10. Not every literal is magic, though: `0` as a starting total, `1` in an
      off-by-one adjustment or `/ 2` for a midpoint are clear in context. I name a value
      when its meaning isn't obvious or it appears more than once. I also keep constants
      separate from configuration, which varies by environment and belongs in validated
      settings.
  - question: A teammate wants to keep commented-out code in case it's needed later. What do you say?
    answer: >-
      I'd suggest deleting it, because version control is the better archive. Commented-out
      code costs every reader a moment of wondering whether it matters, shows up in searches,
      and rots as the code around it changes, so it rarely even works if you uncomment it.
      Everything committed is recoverable: `git log -S "functionName"` finds the commit that
      removed it and `git show` prints it. If the real worry is that a feature might come
      back, a short note in the issue tracker or the pull request description preserves the
      intent better. If it's a behaviour we might switch between, a proper feature flag is
      the honest version.
  - question: What belongs in a doc comment on a public function?
    answer: >-
      The contract a caller needs without reading the body: what the function does in one
      line, what each parameter means including units and allowed ranges, what it returns,
      whether it changes its arguments, and which errors it throws and when. In TypeScript I
      leave types out of the JSDoc because the signature has them and a second copy can
      disagree. `@example` is worth adding for anything non-obvious, and `@deprecated` with
      the replacement when retiring an API, since editors strike the name through. I skip
      doc comments on small internal helpers, where a clear name and signature say enough
      and extra comments only add maintenance.
