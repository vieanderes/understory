id: ai.rag
title: RAG
objective: "Build retrieval-augmented generation end to end: retrieve, build a grounded prompt with sources, cite, and say when the answer isn't there."
level: advanced
minutes: 10
concepts: [ai.rag, ai.retrieval-quality, ai.grounding]
prerequisites: [ai.chunking-and-hybrid, ai.prompting-and-context]
opening:
  text: >-
    You'll build an assistant that answers from your own documents and shows its sources.
    It's the most common AI feature companies ship.

steps:
  - type: prose
    id: what-rag-is
    body: >-
      A model knows nothing about your returns policy, and what it learnt in training may be
      out of date. Ask anyway, and it answers with confidence. That's how a bot invents a
      60-day refund window.


      **Retrieval-augmented generation**, or **RAG**, is an open-book exam. At question time, search your documents and put the best chunks in the prompt.
      Then tell the model to answer from them.
    figure:
      id: rag-pipeline
      caption: The model only sees the 3 chunks that search kept. Every claim in the answer should trace back to one of them.

  - type: prose
    id: grounded-prompt
    body: |-
      The prompt numbers each source and sets the rules:

      ```text
      System: Answer only from the numbered sources. Cite them like [1].
      If the sources don't answer the question, say you don't know.

      User: [1] Refunds take five working days.
      [2] Return an item within 30 days.

      Question: How long do refunds take?
      ```

      An answer that sticks to its sources is **grounded**. Citations let a reader check it.

  - type: parsons
    id: arrange-rag-pipeline
    concept: ai.rag
    difficulty: 1
    language: python
    prompt: Put the steps of a RAG answer in order. Mind the indentation.
    checkIndent: true
    blocks:
      - id: def
        code: 'def answer(question):'
      - id: search
        code: chunks = search(question, k=5)
        indent: 1
      - id: none
        code: 'if not chunks:'
        indent: 1
      - id: sorry
        code: return NOT_FOUND
        indent: 2
      - id: prompt
        code: prompt = build_prompt(question, chunks)
        indent: 1
      - id: ask
        code: return ask(client, prompt, system=RULES)
        indent: 1
    distractors:
      - id: ask-first
        code: reply = ask(client, question)
        feedback: >-
          Asking before searching means the model answers from memory. Retrieve first.

  - type: ai-review
    id: review-no-dont-know
    concept: ai.grounding
    difficulty: 2
    language: python
    request: Answer customer questions from the help pages.
    flawClass: logic
    code: |
      RULES = "You are a friendly shop assistant. Use the sources to help the customer."

      def answer(question):
          chunks = search(question, k=5)
          prompt = build_prompt(question, chunks)
          return ask(client, prompt, system=RULES)
    prompt: >-
      An assistant wrote this. Asked about returns on gift cards, which no page covers, the
      bot promised a full refund. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The rules never say to answer only from the sources
        correct: true
        feedback: >-
          Yes. "Use the sources to help" leaves room to fill gaps from memory.
      - text: '`k=5` retrieves too few chunks'
        feedback: >-
          No page covers gift cards, so more chunks wouldn't help. The rules invite guessing.
      - text: The question should go in the system prompt
        feedback: >-
          The question changes each time, so it belongs in the message. The rules are the gap.
    fix: |
      RULES = """Answer only from the numbered sources, and cite them like [1].
      If the sources don't answer the question, say you don't know."""

  - type: prose
    id: check-citations
    body: >-
      Rules lower the risk of made-up answers. They don't remove it. So check in code too.


      Every cited number should be a source you actually sent in this prompt. An answer
      that cites nothing, or cites a source it never saw, goes to a fallback, not to the
      customer.

  - type: ai-review
    id: review-grounding-against-index
    concept: ai.grounding
    difficulty: 3
    language: python
    request: Check that every citation in an answer is grounded before we show it.
    flawClass: logic
    code: |
      # all_ids holds the id of every chunk we have indexed.
      def is_grounded(cited_ids, sent_ids, all_ids):
          for chunk_id in cited_ids:
              if chunk_id not in all_ids:
                  return False
          return True
    prompt: >-
      An assistant wrote this. An answer about bank holidays cited `c41`, a chunk about
      parking that wasn't in the prompt, and the check passed. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It checks every indexed chunk, not the ones sent
        correct: true
        feedback: >-
          Yes. `c41` exists, but the model never saw it. Check against `sent_ids`.
      - text: A set is the wrong type for ids
        feedback: >-
          A set is a fine place for ids, and `in` is quick. The trouble is which set.
      - text: No citations at all should fail
        feedback: >-
          Worth checking too, but separately. This loop checks the wrong set.
    verify:
      question: "Which test would have caught this?"
      choices:
        - text: "Cite an indexed chunk that wasn't sent, expecting `False`"
          correct: true
          feedback: "Yes. That's exactly the case the bug lets through."
        - text: "Cite only chunks that were sent, expecting `True`"
          feedback: "That passes with the bug in place. Both sets contain those ids."
        - text: "Cite an id that isn't in the index at all"
          feedback: "The buggy check already rejects that one. The gap is indexed but unsent chunks."
    fix: |
      def is_grounded(cited_ids, sent_ids):
          if not cited_ids:
              return False
          return all(chunk_id in sent_ids for chunk_id in cited_ids)

  - type: prose
    id: retrieval-quality
    body: >-
      If the right chunk never reaches the prompt, no wording saves the answer. So measure
      **retrieval quality** on its own.


      Keep real questions, each labelled with the chunk that answers it. Then count how often
      that chunk lands in the top 5. That share is the **hit rate**, and it's the ceiling
      for your answers.

  - type: multiple-choice
    id: pick-ceiling
    concept: ai.retrieval-quality
    difficulty: 2
    question: A third of answers are wrong. The right chunk reaches the top 5 for 60% of questions. Fix what first?
    choices:
      - text: Retrieval, such as chunking or hybrid search
        correct: true
        feedback: >-
          Yes. When the chunk is missing, the model never had a chance.
      - text: The system prompt's wording
        feedback: >-
          Wording can't add a missing chunk. Fix what reaches the prompt first.
      - text: A larger model
        feedback: >-
          A larger model can't read a chunk it was never sent.
      - text: A higher temperature
        feedback: >-
          More randomness helps nothing here. The source is missing.

  - type: code-challenge
    id: write-answer
    concept: ai.rag
    difficulty: 3
    language: python
    starter: rag.starter.py
    solution: rag.solution.py
    tests: rag.tests.py
    prompt: >-
      Write `answer(question, search, ask_model, min_score=0.5, k=3)`. `search(question)`
      returns `(score, text)` pairs, best first. Keep the texts scoring at least
      `min_score`, up to `k` of them.


      If none are left, return `NOT_FOUND` without calling the model. Otherwise number them
      as `[1] text` lines, add a blank line and `Question: ...`, and return
      `ask_model(system=RULES, prompt=...)`.
    hints:
      - A comprehension with a condition keeps the good texts, and a slice keeps `k`.
      - '`enumerate(texts, start=1)` gives the numbers, and `"\n".join(...)` makes the lines.'
      - 'The prompt is `f"{sources}\n\nQuestion: {question}"`.'

  - type: explain-back
    id: explain-confident-and-wrong
    concept: ai.grounding
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Without RAG, the bot said refunds take 60 days, and sounded sure. Why did it sound
      sure, and how does RAG change it?
    rubric:
      - The model writes likely text, and confident wording is likely, true or not.
      - With RAG the relevant policy is in the prompt, and the rules say to use only that.
      - Citations and a check in code show where each claim came from.
    modelAnswer: >-
      The model had never seen our policy, so it wrote a likely-sounding number. Sounding
      sure costs it nothing. With RAG, our real policy is in the prompt and the rules say to
      use only the sources. The answer cites them, and my code checks the citations.

recap:
  - Retrieve the best chunks at question time, and put them in the prompt as numbered sources.
  - Tell the model to answer only from them, cite them, and admit when they don't say.
  - Measure retrieval on its own, since a missing chunk caps every answer.

recall:
  - id: card-rag
    concept: ai.rag
    front: What does RAG add to a model call?
    back: >-
      Relevant chunks from your own documents, found at question time and put in the prompt
      as sources.
  - id: card-grounding-rules
    concept: ai.grounding
    front: What two rules keep a RAG answer grounded?
    back: >-
      Answer only from the numbered sources, citing them. If they don't answer it, say you
      don't know.
  - id: card-check-citations
    concept: ai.grounding
    front: What should a citation check compare against?
    back: >-
      The chunks sent in this prompt, not everything in the index.
  - id: card-hit-rate
    concept: ai.retrieval-quality
    front: What is a retrieval hit rate, and why measure it first?
    back: >-
      The share of labelled questions whose answering chunk lands in the top k. If it's low,
      no prompt can fix the answers.

references:
  - kind: paper
    title: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks
    authors: Patrick Lewis et al.
    year: 2020
    venue: NeurIPS 2020
    url: https://arxiv.org/abs/2005.11401
    note: The paper that named RAG.
    primary: true
    verified: true
  - kind: docs
    title: Citations
    authors: Anthropic
    venue: Claude Platform documentation
    url: https://platform.claude.com/docs/en/build-with-claude/citations
    note: Sending documents and getting answers that point at the exact passages.
    primary: true
    verified: true
  - kind: docs
    title: Reduce hallucinations
    authors: Anthropic
    venue: Claude Platform documentation
    url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
    note: Letting the model say "I don't know", and asking it to quote its sources.
    verified: true

deepDive: >-
  **Built-in citations.** Some APIs take documents as their own content blocks and return
  citations pointing at exact passages, so you don't parse `[1]` yourself. The check that
  every citation points at a document you sent still belongs in your code.


  **Hit rate and friends.** Hit rate at 5 asks "was it in the top 5?". Recall counts how
  many of several right chunks you found. Precision counts how much of what you returned
  was relevant. With one right chunk per question, hit rate is the simple place to start.


  **Where RAG goes wrong.** Wrong chunk size, a search that blurs exact codes, stale
  documents, and prompts that let the model fill gaps. Each has a fix in this chapter or
  the next.
