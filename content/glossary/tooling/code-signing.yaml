term: code signing
aka:
  - signed build
  - signing certificate
short: Stamping a build with a private key tied to the developer, so devices can verify who made it.
explain: |
  Anyone can build an app called "Your Bank". A phone or laptop needs to know an install came from the developer and wasn't changed on the way.

  The build is signed with a private key linked to the developer's account. The system checks
  the signature before installing, and every update must carry the same one. Desktop systems
  warn loudly about unsigned apps, and phones won't install them at all.

  The key is precious. Lose it and some platforms won't let you update existing installs.
  Leak it and someone else can ship updates as you. Keep it in a secrets store, not in the
  repository.
analogy: A wax seal on a letter. The recipient knows who sent it and that nobody opened it.
usage: The update was rejected because CI signed it with a new key; code signing has to use the original.
related:
  - secret
  - native-app
  - over-the-air-update
