deepDive: >-
  **Prices change.** The figures here were checked in September 2026. Check the pricing
  page before you budget, and read the price from config, not code.


  **Smaller models.** Simple jobs, such as tagging an email, often run as well on a smaller,
  cheaper, faster model. Only your eval set can tell you. Sending each request to the
  cheapest model that passes is called model routing, and chapter 21 builds it.


  **Batches.** Work nobody waits for, like a nightly report, can go through a batch API
  that answers within hours at about half the price.


  **Cache lifetime.** A cached prefix lasts about five minutes by default, renewed each
  time it's read. A longer lifetime costs more to write. Very short prefixes aren't cached
  at all, below a minimum length that depends on the model.
