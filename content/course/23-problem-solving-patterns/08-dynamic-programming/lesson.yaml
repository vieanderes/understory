deepDive: >-
  A recipe that works in interviews. Define the state in words: "best(i) is the most you
  can earn from the first i shifts". Write the recurrence, name the base cases, then pick
  the order to fill it in. Say the complexity as states times work per state.


  Coin change shows why greedy isn't enough. With coins 1, 3 and 4, making 6 greedily takes
  4, 1, 1: three coins. The table finds 3, 3: two. When greedy fails on a small example,
  that's often the hint to use dynamic programming.


  The best-slice pattern in the maximum slice lesson is dynamic programming too: the best
  run ending today builds on the best run ending yesterday, carried as one number.


  Tabulation often shrinks memory. `bestPay` only ever reads the last two answers, so O(n)
  space becomes O(1). Grid problems usually need only the previous row. Memoisation has the
  opposite strength: it only solves the states a question actually reaches, which helps when
  most of the table is never needed.
