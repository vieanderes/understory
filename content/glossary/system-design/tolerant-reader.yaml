term: tolerant reader
aka: [tolerant reader pattern, be liberal in what you accept]
short: A client that reads only the fields it needs and copes with unknown extras, surviving supplier changes.
explain: |
  Other people's APIs change: a new field, a new status value, a field that's sometimes
  missing. A client that demands the exact shape breaks on every harmless change.

  Read only what you use, ignore the rest, and map unknown enum values to a fallback you
  report. Still validate the fields you do rely on, loudly, at the boundary. Tolerance
  means not caring about extras, not accepting nonsense.
analogy: A postman who delivers any envelope with a readable address, whatever stickers are on it.
example:
  language: ts
  code: |
    const status = z
      .enum(['open', 'won', 'lost'])
      .catch('unknown'); // a new vendor value won't crash the sync
usage: Make the parser a tolerant reader; the vendor added a status and the whole sync stopped.
related: [adapter, contract-test, ports-and-adapters]
level: 3
lessons: [integrations.systems-you-dont-control, integrations.normalising-data, backend.api-evolution]
