id: cs.what-a-computer-does
title: What a computer does
objective: Trace a program from disk to process, covering CPU, memory and storage.
level: essential
minutes: 10
concepts: [cs.process, cs.memory-hierarchy]
prerequisites: [tooling.node]
opening:
  text: >-
    You'll know where your program's data lives while it runs, and where it must go to
    survive a restart. It explains a classic bug: everyone logged out after an update.

steps:
  - type: prose
    id: the-parts
    body: >-
      Picture a kitchen. Three parts of a computer do the work.


      The **CPU** is the cook. It carries out instructions, one after another, very fast.


      **Memory** is the worktop. It's quick to reach, but it's cleared when the work stops.


      **Storage**, the disk, is the cupboard. Files stay there when the power's off. Fetching
      from it is far slower than from memory.

  - type: prose
    id: program-and-process
    body: >-
      A **program** is a file in storage, like `visits.js`. It's a recipe on the shelf.


      Run it, and the **operating system**, such as macOS, Windows or Linux, starts a
      **process**: one running copy of the program, with memory of its own. Your variables
      live in that memory.


      When the process ends, its memory is wiped. Each new run starts from nothing.

  - type: multiple-choice
    id: pick-where-it-lives
    concept: cs.process
    difficulty: 1
    language: js
    code: |
      let count = 0;
      count = count + 1;
      console.log(count);
    question: You run this with `node`. Where does `count` live while it runs?
    choices:
      - text: In the process's memory
        correct: true
        feedback: >-
          Yes. Variables live in memory, and they go when the process ends.
      - text: In storage, next to the file
        feedback: >-
          The file holds the code, not the values. Values live in memory while it runs.
      - text: Inside the CPU, for good
        feedback: >-
          The CPU works on values, but it doesn't keep them. They sit in memory.

  - type: prose
    id: saving-to-a-file
    body: |-
      To keep something after the process ends, save it to storage. Node comes with a module
      for files, `node:fs`:

      ```js
      import { readFileSync, writeFileSync } from "node:fs";

      writeFileSync("note.txt", "Buy milk");
      const note = readFileSync("note.txt", "utf8");
      console.log(note); // Buy milk
      ```

      `writeFileSync` saves text to a file. `readFileSync` reads it back, and `"utf8"` asks
      for text. Files hold only text, so `String(5)` turns a number into text first.

  - type: predict-output
    id: predict-second-run
    concept: cs.process
    difficulty: 2
    language: bash
    code: |
      $ cat visits.js
      import { readFileSync, writeFileSync } from "node:fs";
      let inMemory = 0;
      inMemory = inMemory + 1;
      const onDisk = Number(readFileSync("visits.txt", "utf8")) + 1;
      writeFileSync("visits.txt", String(onDisk));
      console.log("memory:", inMemory, "disk:", onDisk);
      $ echo 0 > visits.txt
      $ node visits.js
      memory: 1 disk: 1
      $ node visits.js
    question: This counts each run twice, in a variable and in a file. What does the second run print?
    choices:
      - text: '`memory: 1 disk: 2`'
        correct: true
        feedback: >-
          Yes. The variable starts over on every run. The file remembers.
      - text: '`memory: 2 disk: 2`'
        feedback: >-
          A fair guess. But each run is a new process with fresh memory, so the variable starts
          at 0.
      - text: '`memory: 1 disk: 1`'
        feedback: >-
          The variable does reset. The file doesn't: the first run already wrote 1 into it.

  - type: parsons
    id: arrange-disk-to-process
    concept: cs.memory-hierarchy
    difficulty: 3
    language: text
    prompt: You type `node visits.js` and press Enter. Put what happens in order. One step doesn't belong.
    blocks:
      - id: find-file
        code: The operating system finds Node in storage
        subgoal: From storage
      - id: create-process
        code: It starts a new process
        subgoal: Into memory
      - id: load-code
        code: It loads the program's instructions into memory
        subgoal: Into memory
      - id: fetch-execute
        code: The CPU runs the instructions one by one
        subgoal: On the CPU
      - id: exit
        code: The process ends and its memory is wiped
        subgoal: Clean up
    distractors:
      - id: cpu-reads-disk
        code: The CPU reads each instruction straight from storage
        feedback: >-
          Storage is far too slow for that. Instructions go into memory first.

  - type: prose
    id: servers-and-deploys
    body: >-
      A **server** is a program that keeps running and answers browsers. It's
      one process, with one memory.


      To **deploy** is to put a new version live. The old process stops, and a new one
      starts from the new files.


      So a deploy is a restart. Whatever lived only in memory is gone.


      Busy sites run several copies of one server at once. Each copy is its own process.

  - type: bug-hunt
    id: hunt-holds-in-memory
    concept: cs.memory-hierarchy
    difficulty: 3
    language: js
    code: |
      const loggedIn = [];

      function logIn(name) {
        loggedIn.push(name);
      }

      function isLoggedIn(name) {
        return loggedIn.includes(name);
      }
    prompt: A server uses this. Logging in works. After every deploy, everyone is logged out. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The list lives in memory, and a restart wipes it
        correct: true
        feedback: >-
          Exactly. The new process runs line 1 again and starts empty.
      - text: '`const` stops the list from changing'
        feedback: >-
          `const` only stops you reassigning `loggedIn`. `push` still works, which is why
          logging in works.
      - text: '`includes` can''t find names after a deploy'
        feedback: >-
          `includes` works fine. There's nothing left to find, because the list is new and
          empty.
    fix: |
      import { readFileSync, writeFileSync } from "node:fs";

      function logIn(name) {
        const saved = readFileSync("logged-in.txt", "utf8");
        writeFileSync("logged-in.txt", saved + name + "\n");
      }

      function isLoggedIn(name) {
        const saved = readFileSync("logged-in.txt", "utf8");
        return saved.split("\n").includes(name);
      }

  - type: ai-review
    id: pick-two-servers
    concept: cs.process
    difficulty: 4
    language: js
    request: Users get logged out after every deploy. Fix it.
    flawClass: logic
    code: |
      import { readFileSync, writeFileSync } from "node:fs";
      const loggedIn = readFileSync("logged-in.txt", "utf8").split("\n");

      function logIn(name) {
        loggedIn.push(name);
        writeFileSync("logged-in.txt", loggedIn.join("\n"));
      }

      function isLoggedIn(name) {
        return loggedIn.includes(name);
      }
    prompt: >-
      An assistant wrote this fix, and deploys no longer log anyone out. Two copies now run.
      You log in on copy A, then copy B calls you a stranger. Tap the line at fault.
    lines: [2]
    reasons:
      - text: Each copy reads the file once, when it starts
        correct: true
        feedback: >-
          Yes. B loaded its list before you logged in on A, and never looks again.
      - text: '`push` should come after `writeFileSync`'
        feedback: >-
          The order inside `logIn` is fine. B never reads the file after it starts.
      - text: '`includes` is case-sensitive'
        feedback: >-
          True, but the name matches exactly. B's list is an old copy.
    fix: |
      import { readFileSync, writeFileSync } from "node:fs";

      function readLoggedIn() {
        return readFileSync("logged-in.txt", "utf8").split("\n");
      }

      function logIn(name) {
        const loggedIn = readLoggedIn();
        loggedIn.push(name);
        writeFileSync("logged-in.txt", loggedIn.join("\n"));
      }

      function isLoggedIn(name) {
        return readLoggedIn().includes(name);
      }

  - type: explain-back
    id: explain-lost-holds
    concept: cs.memory-hierarchy
    difficulty: 3
    prompt: >-
      The logged-in list lives in a variable. The visit count is saved to `visits.txt`. Why
      does a deploy log everyone out, while `visits.txt` keeps its count?
    rubric:
      - The list lives in one process's memory. The file lives in storage.
      - A deploy ends the process and wipes its memory, so the new one starts empty.
      - Storage survives restarts but is slower, so it holds what must last.
    modelAnswer: >-
      The list is a variable in the server's memory. A deploy stops that process, and its
      memory goes with it. The new process starts with an empty list. The file is in storage,
      which survives restarts. Storage is slower, so programs work in memory and save what
      must last.

recap:
  - "Tell a program on disk from a running process."
  - "Say what the CPU, memory and storage are each for."
  - "Save what must survive a restart to storage."
recall:
  - id: card-program-process
    concept: cs.process
    front: What's the difference between a program and a process?
    back: >-
      A program is a file in storage. A process is one running copy of it, with its own memory.
  - id: card-process-memory
    concept: cs.process
    front: Two processes run the same server. What memory do they share?
    back: >-
      None. Each has its own variables, so shared data must live somewhere both can reach.
  - id: card-memory-vs-storage
    concept: cs.memory-hierarchy
    front: How do memory and storage differ?
    back: >-
      Memory is fast and is wiped when the process ends. Storage lasts, but reading it is
      far slower.
  - id: card-cpu-works-in-memory
    concept: cs.memory-hierarchy
    front: Where must code and data be before the CPU can use them?
    back: >-
      In memory. That's why a program is loaded from storage before it runs.

