deepDive: |-
  **Three streams.** A program prints results to standard output and complaints to standard
  error. Both show in your terminal, but `>` only catches standard output. That's why
  `mkdir drafts > log.txt` still prints `File exists` on screen. `2>` sends errors to a file.

  **More pipe tools.** `sort` sorts lines, `uniq -c` counts runs of equal lines, `head -n 1`
  keeps the first line, and `cut -d' ' -f3` keeps the third space-separated field. Together:

  ```text
  $ grep " 404" access.log | cut -d' ' -f3 | sort | uniq -c | sort -rn | head -n 1
     3 /pricing
  ```

  **grep's other code.** `grep` exits with `1` for no match, and `2` for real trouble, like a
  missing file. Test for `0`, not for a particular failure number.

  **Pipelines hide failures.** A pipeline's exit code is its last command's. So `cat
  missing.txt | wc -l` reports success. Bash and zsh offer `set -o pipefail` to make any
  failure count. Careful scripts start with `set -euo pipefail`.

  **Padding.** On a Mac, `wc` and `uniq -c` pad their numbers with spaces, so you'll see
  `       4` rather than `4`. Linux prints `4`.
