summary: >-
  A **selector** is the part of a rule that picks elements: by tag name (`p`), by class
  (`.sale`), by ID (`#basket`) or by where they sit (`nav a`, every `a` inside a `nav`).
  Real pages have hundreds of rules, so one element is often matched by several that
  disagree. The **cascade** is the browser's fixed procedure for settling every one of those
  disagreements. It's the "C" in CSS.


  The cascade never guesses. For each property of each element it compares the competing
  declarations in a set order: where they come from, whether they're marked `!important`,
  which cascade layer they're in, how **specific** their selector is, and finally which came
  last. The first step that finds a difference decides. Most everyday clashes are settled by
  specificity, a score counted from the selector.


  **Inheritance** is a separate mechanism that runs after the cascade. When nothing sets a
  property on an element, some properties, mostly text ones such as `color`, copy the
  parent's value. Knowing which of the two is at work explains nearly every "why is this
  still grey?" moment.
remember:
  - The cascade picks one value per property per element, checking origin and importance, then the `style` attribute, then layers, then specificity, then order.
  - Specificity is three separate counts, IDs then classes then elements, compared from the left with no carrying between columns.
  - Pseudo-classes such as `:hover` and attribute selectors count as classes, and the space in `nav a` counts as nothing.
  - Order of appearance only breaks a tie, so a later rule loses to an earlier, more specific one.
  - An inherited value is used only when no rule targets the element itself, so even a weak direct rule beats it.
  - Text properties such as `color`, `font-family` and `text-align` inherit, and box properties such as `margin`, `padding`, `border` and `background` don't.
  - '`!important` lifts a declaration above every normal one, so the next change needs another `!important`; raise the selector''s specificity instead.'
  - Styling with single classes keeps specificity low and even, so the order of your file stays in control.
sections:
  - title: The whole order the cascade checks
    body: |-
      The lesson covered the last two steps. Here's the full list, from most to least
      decisive. The browser stops at the first step where the competing declarations differ.

      1. **Origin and importance.** Declarations come from three origins: the browser's own
         style sheet, the reader's settings (for example a larger minimum font), and the
         author, which is you. Normal author styles beat the browser's defaults.
         `!important` flips the order, so an important reader setting beats even your
         important one. That protects people who need, say, bigger text.
      2. **The `style` attribute.** A declaration in `style="..."` beats any selector.
      3. **Cascade layers.** You can sort author CSS into named layers, a later lesson on
         architecture teaches how. A later layer beats an earlier one whatever the
         specificity, and CSS in no layer beats every layer.
      4. **Specificity.** The selector's score.
      5. **Order of appearance.** The later declaration wins. Several linked sheets count as
         one long file, read in order.

      The unit of competition is one declaration, not one rule. Each property is settled on
      its own, so two rules can each win a different property on the same element:

      ```css
      .sale { color: red; }
      p { color: black; font-weight: bold; }
      ```

      A `<p class="sale">` is red, because `.sale` wins `color`. It's also bold, because
      nothing competes with `p` for `font-weight`. The losing rule isn't thrown away, only
      the declarations that lost.

      `!important` reverses step 3 too: among important declarations, an earlier layer beats
      a later one. That's deliberate, so a base layer can protect a rule that must never be
      overridden.
  - title: Specificity arithmetic
    body: |-
      Count three columns, written (IDs, classes, elements):

      - IDs, such as `#basket`, go in the first column.
      - Classes, attribute selectors such as `[type="email"]` and pseudo-classes such as
        `:hover` go in the second.
      - Element names such as `a`, and pseudo-elements such as `::before`, go in the third.
      - The space between selectors adds nothing.

      Some worked scores:

      ```text
      nav ul li a              (0, 0, 4)
      .menu a                  (0, 1, 1)
      .menu a:hover            (0, 2, 1)
      input[type="email"]      (0, 1, 1)
      .new.vegan               (0, 2, 0)
      #basket .item a          (1, 1, 1)
      :where(#basket) p        (0, 0, 1)   :where() counts as zero
      :is(#basket, .x) p       (1, 0, 1)   :is() counts its strongest argument
      ```

      Compare column by column from the left. **The columns never carry over.** Eleven
      classes are not "more than" one ID, because the first column decides before the
      second is looked at:

      ```html
      <style>
        .a.b.c.d.e.f.g.h.i.j.k { color: red; }   /* (0, 11, 0) */
        #total { color: blue; }                  /* (1, 0, 0) */
      </style>
      <p id="total" class="a b c d e f g h i j k">£48</p>
      <!-- blue: one ID beats any number of classes -->
      ```

      That's why IDs are awkward for styling. Anything you later want to override needs
      another ID, or `!important`. Most teams give IDs to links and JavaScript and style
      with classes only.

      Counting also explains a common surprise. `.x .y` is (0, 2, 0) and `div p.y` is
      (0, 1, 2). The two elements don't help `div p.y`: two classes win, because the second
      column differs first.
  - title: Inheritance in depth
    body: |-
      Inheritance is what makes `body { font-family: Georgia; }` style the whole page. Only
      some properties inherit, and the split follows common sense. Text settings would be
      tiresome to repeat on every element, so they pass down: `color`, `font-family`,
      `font-size`, `font-weight`, `line-height`, `text-align` and `visibility`. Box settings
      would be chaos if they passed down. Imagine a border on a card redrawn around every
      paragraph inside it. So `margin`, `padding`, `border`, `background`, `width` and
      `display` don't inherit.

      The key rule: **an inherited value has no specificity at all**. It's used only when
      nothing targets the element. Even the weakest direct rule wins:

      ```html
      <style>
        #box { color: red; }  /* (1, 0, 0), but it matches the div, not the p */
        p { color: blue; }    /* (0, 0, 1), and it matches the p itself */
      </style>
      <div id="box"><p>Delivery on Friday</p></div>
      <!-- the p is blue -->
      ```

      The browser's style sheet counts as a direct rule too. That's why links stay blue
      inside a white footer, and why buttons and inputs ignore the body's font: the browser
      gives form controls a font of their own.

      The fix is the keyword `inherit`, which turns a property into "copy my parent":

      ```css
      footer a { color: inherit; }        /* links take the footer's colour */
      button { font-family: inherit; }    /* buttons match the page's font */
      ```

      Two sibling keywords are worth knowing. `initial` sets the property's starting value
      from the specification. For `color` that's the default text colour, black on a normal
      page, not the browser's link blue.
      `revert` goes back to what the browser's own style sheet would give, which for a link
      is blue again.
  - title: Keeping specificity under control
    body: |-
      Every override you write raises the bar for the next one. On a large site that turns
      into a specificity war: selectors grow longer, IDs creep in, then `!important`, then
      `!important` to beat `!important`. The cure is to keep scores low and even from the
      start.

      Habits that help:

      - **Style with one class per selector where you can.** `.card-title` scores (0, 1, 0).
        If everything scores the same, order decides, and order is plain to see.
      - **Don't qualify a class with its element.** `button.buy` scores (0, 1, 1) where
        `.buy` would do. The extra element only makes it harder to override, and it breaks if
        the button becomes a link.
      - **Keep nesting shallow.** `.menu a` is fine. `body div.page nav ul li a` is fragile:
        it breaks when the HTML changes shape, and it's hard to beat.
      - **Avoid ID selectors for styling.** One ID outweighs any number of classes.
      - **Treat `!important` as a last resort,** for example to override a third-party
        widget you can't edit.

      When a rule doesn't apply, open the browser's developer tools and inspect the element.
      The styles panel lists every matching rule, strongest first, with the losing
      declarations crossed out. You can see at a glance whether you lost on specificity, on
      order, or never matched at all.

      A later lesson on CSS architecture adds cascade layers and `:where()`, which let you
      write base styles that any single class can override.
pitfalls:
  - '**Expecting the later rule to win.** "Last one wins" is true only in a tie. People learn it first and apply it everywhere. Count specificity before you look at order.'
  - '**Styling with IDs.** `#nav a` scores (1, 0, 1), and no number of classes can beat it. Give the element a class and style that instead.'
  - '**Reaching for `!important`.** It works today and costs you tomorrow, because the next override needs `!important` too. Raise the selector by one class, such as `.actions .buy`, or remove the rule that''s too strong.'
  - '**Setting a colour on a parent and expecting links to follow.** Links, buttons and inputs get direct rules from the browser, which beat any inherited value. Add `color: inherit` or `font-family: inherit` on them.'
  - '**Over-qualified selectors.** `ul.menu li a.link` is long, high-scoring and tied to the exact HTML. `.menu .link` does the same job and survives a change of tags.'
interview:
  - question: How does the browser decide which CSS declaration applies when several match?
    answer: >-
      It runs the cascade, which compares the competing declarations for one property in a
      fixed order and stops at the first difference. First origin and importance: author
      styles beat the browser's defaults, and `!important` reverses the origins. Then a
      `style` attribute beats any selector. Then cascade layers, where a later layer wins and
      unlayered CSS beats all layers. Then specificity, IDs then classes then elements. Then
      order, where the last one wins. Each property is settled separately, so two rules can
      each win a different property on the same element. In practice most clashes come down
      to specificity, and when one surprises me I check the developer tools, which cross out
      the declarations that lost.
  - question: What's the specificity of `#cart .item a:hover`, and does it beat `.cart .item .link:hover`?
    answer: >-
      The first scores (1, 2, 1) and the second (0, 4, 0), so the first wins. For the first:
      one ID; `.item` and `:hover` are two in the class column, because pseudo-classes count
      as classes; and `a` is one element. For the second: four class-level parts and no ID
      or element. Comparison goes column by column from the left, and the ID column already
      differs, so the class count never matters. Columns never carry, which is why even
      eleven classes lose to one ID. That's the main argument against styling with IDs: any
      later override needs another ID or `!important`.
  - question: What's the difference between the cascade and inheritance?
    answer: >-
      The cascade chooses between declarations that target an element. Inheritance supplies
      a value only when no declaration targets it at all. So an inherited value always loses
      to a direct rule, however weak. A footer with `#footer { color: white; }` has an ID,
      yet its links stay blue, because the browser's own `a` rule targets the link directly
      and the white only reaches it by inheritance. Only some properties inherit, mostly text
      ones like `color` and `font-family`; box ones like `padding` and `border` don't. To
      force inheritance where a direct rule exists, use `color: inherit` on the child.
  - question: Why do many teams avoid `!important`?
    answer: >-
      Because it wins by skipping the normal rules, and the only thing that beats it is
      another `!important`. Each use raises the bar for the next change, and over time the
      style sheet fills with importance battles that nobody can follow. It also hides the
      real problem, which is usually one selector that's too specific. The better fix is to
      lower that selector or raise the new one by a single class. There are fair uses:
      overriding third-party CSS you can't edit, or a utility class that must always apply,
      such as one that hides an element. I'd keep those few and deliberate.
