summary: >-
  Scope answers one question: when code uses a name, which variable does it mean? JavaScript
  answers it **lexically**, from where the code is written, not from where it's called. Each
  block, function and module makes a new scope, and a name lookup walks outwards through the
  enclosing scopes until it finds a match.


  A closure is what you get when a function outlives the scope it was written in. The
  function keeps a live link to the variables around it, not a copy of their values. That
  single fact explains the classic bugs, such as every handler in a `var` loop seeing the last
  index, and a React effect that keeps reading an old value. It also explains the useful
  patterns: private state, the module pattern, `once`, memoisation and debouncing.


  You use closures every time you pass a callback that mentions an outer variable, so the
  skill isn't writing them. It's predicting which variable a function will read and when it
  will read it, and knowing what that link keeps alive in memory.
remember:
  - A closure keeps a live link to the variables where the function was written, so it reads their current value when it runs.
  - Scope is lexical, so a function looks names up where it was defined, never where it was called.
  - '`var` is function-scoped and makes one variable for a whole loop; `let` and `const` are block-scoped, and a `for (let ...)` loop makes a fresh binding each turn.'
  - '`let`, `const` and `class` are hoisted but sit in the temporal dead zone until their line runs, so an early read throws a `ReferenceError`, while an early `var` read gives `undefined`.'
  - Function declarations are hoisted with their body, but a function expression assigned to `var` is `undefined` until its line runs.
  - Each call to an outer function creates new variables, so each closure it returns gets its own private state.
  - A stale closure is a function created during an earlier run that still reads that run's variables; read the latest value through a functional update or a ref instead.
  - Whatever a live closure references stays in memory, so a forgotten listener or an unbounded memo cache is a leak.
sections:
  - title: Lexical scope and the scope chain
    body: |-
      Every time a block, a function call or a module runs, the engine creates an
      **environment**: a table of the names declared there, with a link to the environment
      the code was written inside. A lookup checks the current table, then follows the links
      outwards to the global scope. If nothing matches, it's a `ReferenceError`.

      The link is fixed when the function is created, from its position in the source. The
      caller's variables are not on the chain at all.

      ```js
      const label = "outer";
      function show() {
        console.log(label);
      }
      function run() {
        const label = "inner";
        show();
      }
      run(); // outer
      ```

      `show` was written at the top level, so its chain goes straight to the top-level
      `label`. The `label` inside `run` **shadows** the outer one only for code written
      inside `run`.

      A closure is this same mechanism, seen after the outer function has returned. Normally
      an environment is thrown away when its code finishes. If a function created inside it
      is still reachable, through a return value, a listener or a timer, the environment
      stays alive because the function links to it. Nothing is copied: the closure and the
      outer code share the same variables, so a change made by one is seen by the other.

      Engines only keep variables that some inner function could read. That's an
      optimisation, not a promise, so treat every closure as holding its whole surrounding
      scope when you think about memory.

      Lexical scope is also why `this` is the odd one out. `this` in a normal function is
      decided by how the function is called. Arrow functions don't have their own `this`, so
      they look it up lexically like any other name. That's covered in the lesson on
      functions and `this`.
  - title: Hoisting and the temporal dead zone
    body: |-
      Before a scope's code runs, the engine registers every name declared in it. That's
      **hoisting**. What differs is the value a name has before its line runs.

      ```js
      console.log(typeof hoisted); // function
      console.log(early); // undefined
      var early = 1;
      function hoisted() {}

      try {
        console.log(late);
      } catch (e) {
        console.log(e.name + ": " + e.message); // ReferenceError: Cannot access 'late' before initialization
      }
      let late = 2;

      console.log(typeof neverDeclared); // undefined

      try {
        greet();
      } catch (e) {
        console.log(e.name, e.message); // TypeError greet is not a function
      }
      var greet = function () {};
      ```

      A function declaration is created with its body, so you can call it above its line. A
      `var` starts as `undefined`. A `let`, `const` or `class` exists but is uninitialised:
      from the top of the block to its declaration it's in the **temporal dead zone**, and
      any read throws. Even `typeof`, which is safe on a name that was never declared, throws
      on a name in its dead zone.

      The dead zone is a feature. A `var` read too early gives `undefined` and the bug
      travels on. A `let` read too early fails on the line that's wrong.

      Two more `var` quirks. In a classic browser script, a top-level `var` becomes a
      property of `window`, which is how scripts used to clash. And `var` ignores blocks, so
      a `var` inside an `if` is visible across the whole function. ES modules and `let`
      remove both problems, which is why modern code uses `const` by default and `let` when
      a variable must change.
  - title: The loop classic, three ways
    body: |-
      Interviewers love this one because it tests whether you know a closure captures a
      variable, not a value.

      ```js
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log("var", i), 0);
      }
      // var 3, var 3, var 3

      for (let j = 0; j < 3; j++) {
        setTimeout(() => console.log("let", j), 0);
      }
      // let 0, let 1, let 2

      for (var k = 0; k < 3; k++) {
        ((k) => setTimeout(() => console.log("iife", k), 0))(k);
      }
      // iife 0, iife 1, iife 2

      for (var m = 0; m < 3; m++) {
        setTimeout((n) => console.log("arg", n), 0, m);
      }
      // arg 0, arg 1, arg 2
      ```

      The timers run after the loop has finished. With `var` there's one `i` for the whole
      function, and the loop leaves it at 3, the value that failed the test.

      With `let`, the specification creates a new environment for every iteration. It copies
      the current value into the new binding before running the update, so `j++` works on
      the next turn's copy and each callback keeps its own `j`.

      Before `let`, the fix was an **IIFE**, an immediately invoked function expression.
      Calling a function makes a new scope, so passing `k` in gives each callback a
      parameter of its own. The last version uses a parameter too: `setTimeout` passes its
      extra arguments to the callback.

      The same bug appears without loops. Any callback that reads a variable which later
      changes will see the change. The question to ask is always: when this function runs,
      what does that variable hold?
  - title: 'Closures at work: modules, memoisation, once and debounce'
    body: |-
      Private state is the main job of a closure. Before ES modules, the **module pattern**
      used an IIFE to hide state and return only the public functions.

      ```js
      const cart = (() => {
        const items = [];
        function add(name, price) {
          items.push({ name, price });
        }
        function total() {
          return items.reduce((sum, item) => sum + item.price, 0);
        }
        return { add, total };
      })();
      cart.add("mug", 8);
      cart.add("tea", 4);
      console.log(cart.total()); // 12
      console.log(cart.items); // undefined
      ```

      An ES module does the same thing with files: top-level names are private unless you
      export them. Class private fields (`#items`) are the third way to get the same
      guarantee.

      **Memoisation** keeps a cache in a closure so a pure function computes each input once.

      ```js
      function memoise(fn) {
        const cache = new Map();
        return (arg) => {
          if (cache.has(arg)) return cache.get(arg);
          const result = fn(arg);
          cache.set(arg, result);
          return result;
        };
      }
      let calls = 0;
      const slowSquare = (n) => {
        calls++;
        return n * n;
      };
      const fastSquare = memoise(slowSquare);
      fastSquare(9);
      fastSquare(9);
      console.log(fastSquare(9), calls); // 81 1
      ```

      The cache compares keys with `SameValueZero`, so object arguments hit only for the same
      object, and the cache grows forever. Bound it, or use a `WeakMap` when keys are objects
      so entries can be collected.

      **Debounce** shares one timer id between every call, so only the last call in a burst
      runs.

      ```js
      function debounce(fn, ms) {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), ms);
        };
      }
      const search = debounce((q) => console.log("search", q), 50);
      search("c");
      search("ca");
      search("cat"); // after 50 ms: search cat
      ```

      `once`, from the lesson, is the same shape: a flag in the outer scope, read and set by
      the inner function.
  - title: Stale closures
    body: |-
      A **stale closure** is a function made during an earlier run that still reads that
      run's variables. In plain JavaScript it looks like this: each call to `render` has its
      own `count`, and a function made in the first call reads the first `count` forever.

      ```js
      function render(count) {
        const logLater = () => console.log("count is", count);
        return logLater;
      }
      const fromFirstRender = render(0);
      render(1);
      render(2);
      fromFirstRender(); // count is 0
      ```

      React components are exactly this. Every render is a new call with new `const`
      variables, so a timer set up in the first render sees the first render's state.

      ```jsx
      import { useEffect, useState } from "react";

      function Ticker() {
        const [count, setCount] = useState(0);
        useEffect(() => {
          const id = setInterval(() => setCount(count + 1), 1000); // count is always 0 here
          return () => clearInterval(id);
        }, []);
        return <p>{count}</p>;
      }
      ```

      The counter stops at 1: the interval's callback belongs to the first render. There
      are three fixes. A **functional update**, `setCount((c) => c + 1)`, asks React for the
      latest value, so the closure needs no state at all. Listing `count` in the dependency
      array recreates the effect with a fresh closure each time, at the cost of resetting the
      interval. A ref, `useRef`, is one mutable box shared by every render, so reading
      `ref.current` always gets the latest value.

      The general rule holds outside React too. If a long-lived callback must see the latest
      value, read it from something shared at the time it runs, not from a variable captured
      when it was made.
pitfalls:
  - "**Using `var` in a loop that creates callbacks.** Every callback shares one variable and sees its final value. Use `let`, which gives each iteration its own binding."
  - "**Declaring the private state inside the returned function.** A `let called = false` inside the inner function is recreated on every call, so it remembers nothing. Put state in the outer function, which runs once per instance."
  - "**Sharing module-level state by accident.** A `let count` at the top of a file is shared by every caller, so two counters interfere. Create the variable inside the factory so each call gets its own."
  - "**Reading state inside a long-lived callback in React.** An interval or listener set up once keeps the first render's values. Use a functional update, list the value as a dependency, or read it from a ref."
  - "**Leaking memory through closures.** A listener that is never removed keeps everything it closes over alive, including large arrays and detached DOM nodes. Remove listeners, clear timers in cleanup, and bound caches."
  - "**Relying on hoisting.** Calling a `var` function expression before its line gives `TypeError: ... is not a function`, and reading a `let` early throws. Declare before use, and let the dead zone catch mistakes."
interview:
  - question: What does this log, and how would you fix it? `for (var i = 0; i < 3; i++) setTimeout(() => console.log(i), 0);`
    answer: >-
      It logs 3 three times. The callbacks run after the loop ends, and they close over the
      variable `i`, not its value at the time. `var` is function-scoped, so there's a single
      `i`, and the loop leaves it at 3, the value that failed the condition. The cleanest fix
      is `let`: a `for (let ...)` loop creates a fresh binding per iteration and copies the
      value forward before the increment, so each callback sees 0, 1 and 2. Before ES2015
      you'd wrap the body in an IIFE that takes `i` as a parameter, or pass `i` as an extra
      argument to `setTimeout`. The underlying lesson is that a closure reads a variable when
      it runs, so I always ask what the variable holds at that moment.
  - question: What is a closure, and where do you use one in real code?
    answer: >-
      A closure is a function together with the scope it was created in, so it can keep
      reading and writing those variables after the outer function has returned. JavaScript
      scope is lexical, and every function holds a link to its surrounding environment. I
      use them constantly: callbacks and event handlers that mention outer variables,
      factories that give each instance private state, `once`, `debounce` and `throttle`,
      memoisation caches, and React hooks, which are closures over each render. The
      trade-offs are memory and staleness. A closure keeps its environment alive, so a
      listener that isn't removed leaks what it references, and a long-lived closure can
      read values from an old run.
  - question: Explain hoisting and the temporal dead zone.
    answer: >-
      Hoisting means every declaration in a scope is registered before the scope's code
      runs; the difference is the initial value. Function declarations are created with
      their body, so you can call them earlier. `var` starts as `undefined`, which hides
      ordering bugs. `let`, `const` and `class` are registered but uninitialised: from the
      start of the block to the declaration they're in the temporal dead zone, and any
      access, even `typeof`, throws a `ReferenceError`. I see the dead zone as a safety
      feature, because it turns a silent `undefined` into an error on the wrong line. In
      practice I use `const` by default, `let` when I must reassign, and never rely on
      reading anything before its declaration.
  - question: Write a `memoise` function. What are its limits?
    answer: >-
      I'd return a function that closes over a `Map`: check `cache.has(arg)`, return the
      stored value if present, otherwise compute, store and return it. The closure makes the
      cache private and per memoised function. The limits are important. It's only correct
      for pure functions, since a function that depends on time or outside state would
      return stale results. Keys compare by identity, so two equal objects are two cache
      misses, and multiple arguments need a key strategy, such as a nested map or a
      serialised key when arguments are simple. The cache also grows without limit, so in
      production I'd add a size cap with least-recently-used eviction, or a `WeakMap` when
      keys are objects so entries can be garbage-collected.
  - question: What is a stale closure in React, and how do you avoid it?
    answer: >-
      It's a callback created in an earlier render that still reads that render's props or
      state. Each render is a function call with its own constants, so an interval set up
      in a `useEffect` with an empty dependency array keeps seeing the first value. A
      counter doing `setCount(count + 1)` inside it sticks at 1. The fixes depend on the
      need. A functional update, `setCount((c) => c + 1)`, removes the dependency entirely.
      Listing the value in the dependency array recreates the effect with a fresh closure,
      at the cost of re-running setup and cleanup. A ref holds a mutable value shared across
      renders when a long-lived callback must read the latest value. I'd keep the
      exhaustive-deps lint rule on, because it flags most of these.
terms:
  - term: Closure
    say: A function inside a function.
    means: A function together with a live link to the variables of the scope where it was written. It
      reads their current values when it runs, even after that scope has finished.
  - term: Lexical scope
    say: A function sees the variables where it's called.
    means: A function looks names up where it was *written*, walking outwards through the enclosing
      scopes. Where it's called makes no difference.
  - term: Hoisting
    say: Declarations move to the top of the file.
    means: "Nothing moves: a scope registers its declarations before its code runs. Function
      declarations arrive with their body, `var` as `undefined`, and `let`, `const` and `class` stay
      unreadable until their line."
  - term: Temporal dead zone
    say: "`let` isn't hoisted."
    means: "`let` and `const` are hoisted, but reading one before its line runs throws a
      `ReferenceError`. That stretch of code is the temporal dead zone."
  - term: "`var` in a loop"
    say: Each turn of the loop gets its own `i`.
    means: "`var` is function-scoped, so the whole loop shares one `i` and later callbacks see its final
      value. `for (let ...)` makes a fresh binding each turn."
  - term: Stale closure
    say: A React bug.
    means: A function created during an earlier run that still reads that run's variables. Read the
      latest value through a functional update or a ref.
