term: verification gate
aka: [done gate, completion gate]
short: A script that decides if a task is done from real exit codes and the diff, not claims.
explain: |
  Agents report success generously. "All tests pass" can mean the tests never ran. A
  verification gate runs the checks itself and reads their exit codes. It also compares
  the diff with what the task allowed.

  The agent can't override it. Only the gate says done, so a confident summary counts for
  nothing on its own.
analogy: The ticket barrier at a station. It doesn't care how sure you are that you paid.
usage: Don't trust the agent's summary; the verification gate says two type errors are still there.
related: [scope-contract, definition-of-done, feedback-loop, continuous-integration]
level: 3
lessons: [aisys.agent-workbench]
