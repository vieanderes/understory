id: db.relational-model
title: Keys and relations
objective: Give each table a primary key, link tables with foreign keys, and keep each fact in one place.
level: essential
minutes: 10
concepts: [db.tables-and-keys, db.foreign-keys, db.normalisation]
prerequisites: [db.changing-rows]
opening:
  text: >-
    You'll link customers to their orders so the database itself refuses an order for nobody.
    Every bug of the kind "that can't happen" then really can't.

steps:
  - type: prose
    id: tables-and-keys
    body: >-
      Last lesson, two people were both called Sam Lee. Names repeat, so every table needs a
      column that never does.


      That column is the **primary key**. Mark it `PRIMARY KEY` and Postgres guarantees two
      things: every row has a value there, and no two rows share one. Most tables use a number
      called `id`.

  - type: sql
    id: run-duplicate-key
    concept: db.tables-and-keys
    difficulty: 1
    prompt: >-
      Cara is signing up, but the insert reuses Ana's id. Run it and read the refusal. Then give
      Cara id `3` and run again.
    setup: |
      CREATE TABLE customers (id integer PRIMARY KEY, name text NOT NULL);
      INSERT INTO customers VALUES (1, 'Ana'), (2, 'Ben');
    starter: |
      INSERT INTO customers VALUES (1, 'Cara');
      SELECT * FROM customers;
    solution: |
      INSERT INTO customers VALUES (3, 'Cara');
      SELECT * FROM customers;
    checks:
      query: SELECT * FROM customers ORDER BY id
    showSchema: true
    hints:
      - The detail line says which key already exists.
      - Only the first value changes.

  - type: prose
    id: foreign-keys
    body: >-
      An order belongs to a customer. Rather than copy the customer's name onto the order, the
      order stores the customer's id:


      ```sql

      customer_id integer NOT NULL REFERENCES customers(id)

      ```


      That's a **foreign key**: a column that must match a primary key in another table. It's
      how two tables relate. Postgres checks it on every write, whatever code sends it.

  - type: sql
    id: run-orphan-order
    concept: db.foreign-keys
    difficulty: 2
    prompt: >-
      Order 12 names customer 9, who isn't there. Run it and read the refusal. Then give the
      order to Ben, customer 2, and run it again.
    setup: |
      CREATE TABLE customers (id integer PRIMARY KEY, name text NOT NULL);
      CREATE TABLE orders (
        id integer PRIMARY KEY,
        customer_id integer NOT NULL REFERENCES customers(id),
        total_pence integer NOT NULL
      );
      INSERT INTO customers VALUES (1, 'Ana'), (2, 'Ben');
      INSERT INTO orders VALUES (10, 1, 1250);
    starter: |
      INSERT INTO orders VALUES (12, 9, 500);
      SELECT * FROM orders;
    solution: |
      INSERT INTO orders VALUES (12, 2, 500);
      SELECT * FROM orders;
    checks:
      query: SELECT * FROM orders ORDER BY id
    showSchema: true
    hints:
      - The error's detail line names the value that has no match.
      - Ben's id is 2. Only the middle value changes.

  - type: sql
    id: close-an-account
    concept: db.foreign-keys
    difficulty: 2
    prompt: >-
      Ana wants her account closed. Run the starter: Postgres refuses, because she still has an
      order. Delete her order first, then her.
    setup: |
      CREATE TABLE customers (id integer PRIMARY KEY, name text NOT NULL);
      CREATE TABLE orders (
        id integer PRIMARY KEY,
        customer_id integer NOT NULL REFERENCES customers(id),
        total_pence integer NOT NULL
      );
      INSERT INTO customers VALUES (1, 'Ana'), (2, 'Ben');
      INSERT INTO orders VALUES (10, 1, 1250), (11, 2, 800);
    starter: |
      DELETE FROM customers WHERE id = 1;
    solution: |
      DELETE FROM orders WHERE customer_id = 1;
      DELETE FROM customers WHERE id = 1;
    checks:
      query: >-
        SELECT 'customer' AS kind, id FROM customers
        UNION ALL SELECT 'order', id FROM orders ORDER BY kind, id
    showSchema: true
    hints:
      - The foreign key works both ways. No order may point at a customer who's gone.
      - Order 10 belongs to Ana. Remove it with a `DELETE` on `orders` before the other one.

  - type: fill-blank
    id: fill-order-lines-table
    concept: db.foreign-keys
    difficulty: 2
    language: sql
    prompt: >-
      An order holds several lines, each for one product. Every line must belong to a real
      order and name a real product. Fill the gaps.
    template: |
      CREATE TABLE order_lines (
        id integer {{1}},
        order_id integer NOT NULL {{2}} orders(id),
        product_id integer NOT NULL REFERENCES {{3}}(id),
        qty integer NOT NULL
      );
    blanks:
      - key: '1'
        answer: PRIMARY KEY
      - key: '2'
        answer: REFERENCES
      - key: '3'
        answer: products
    bank: [PRIMARY KEY, UNIQUE, REFERENCES, POINTS TO, products, orders]

  - type: prose
    id: normalisation
    body: >-
      Say each order line kept a copy of the customer's name. Ana becomes Anna, and one
      `UPDATE` misses a line:


      ```text

      order_id | customer_name | product

      ---------+---------------+--------

            10 | Anna          | Kettle

            10 | Ana           | Mug

      ```


      Order 10 now has two customers. Keep each fact in one row of one table, and point at it
      with a key. That's called **normalisation**: change a fact once, and everything sees it.

  - type: ai-review
    id: review-status-text-per-row
    concept: db.normalisation
    difficulty: 3
    language: sql
    request: Add order statuses, and keep a friendly description for each so the UI can show it.
    flawClass: logic
    code: |
      CREATE TABLE orders (
        id integer PRIMARY KEY,
        customer_id integer NOT NULL REFERENCES customers(id),
        status text NOT NULL,
        status_description text NOT NULL,
        total_pence integer NOT NULL
      );
    prompt: >-
      An assistant wrote this. Orders save, the UI shows the description, and the tests pass.
      Then the team rewords one status, and old orders keep the old wording. Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: The description belongs to the status, not the order
        correct: true
        feedback: >-
          Right. One fact copied onto every row. A `statuses` table holds it once.
      - text: '`status` should be an integer'
        feedback: >-
          Text or number, the copy is the problem. Changing the type leaves the duplicated
          description.
      - text: '`total_pence` should live in a separate table'
        feedback: >-
          The total is a fact about this order. It sits where it belongs.
    fix: |
      CREATE TABLE statuses (code text PRIMARY KEY, description text NOT NULL);
      CREATE TABLE orders (
        id integer PRIMARY KEY,
        customer_id integer NOT NULL REFERENCES customers(id),
        status text NOT NULL REFERENCES statuses(code),
        total_pence integer NOT NULL
      );

  - type: explain-back
    id: explain-why-not-copy-name
    concept: db.normalisation
    difficulty: 3
    prompt: >-
      A teammate wants `customer_name` on every order, so the orders page needs no second
      lookup. What goes wrong, and what does the foreign key give instead?
    rubric:
      - A copied name has to be changed in every order, and a missed one contradicts the rest.
      - The foreign key keeps the name in one row, so a change is made once and seen everywhere.
      - The page can still show the name by joining the two tables when it reads.
    modelAnswer: >-
      The copy is the problem. When Ana becomes Anna, every order holding her name must change
      too. Miss one, and it disagrees with the rest. With `customer_id`, the name lives in one
      row of `customers`. Change it there and every order shows it. The page joins the two
      tables to read the name, which is the next lesson.

recap:
  - Give every table a primary key, so no row can be duplicated.
  - Relate tables with foreign keys, and let the database refuse orphans both ways.
  - Store each fact once and point at it, so an update can't leave two versions.

recall:
  - id: card-primary-key
    concept: db.tables-and-keys
    front: What does `PRIMARY KEY` on a column guarantee?
    back: >-
      Every row has a value there, and no two rows share it. A second insert with the same
      key is refused.
  - id: card-foreign-key-both-ways
    concept: db.foreign-keys
    front: Name the two writes a foreign key refuses.
    back: >-
      Inserting a row that points at a missing parent, and deleting a parent that rows still
      point at.
  - id: card-update-anomaly
    concept: db.normalisation
    front: A customer's name is copied onto each of their orders. What goes wrong when it changes?
    back: >-
      Every copy must change. Miss one, and the orders disagree about who the customer is.

