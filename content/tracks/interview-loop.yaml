# Path: the non-coding rounds. Schema: fastTrackSchema in src/core/content/notes.ts.
title: Interviews and system design
name: Interview skills
order: 7
promise: Talk through your work, design an AI system on a whiteboard and answer behavioural questions with structure.
outcomes:
  - Think out loud in a way interviewers can follow and score
  - Shape any behavioural answer with STAR, a number and what you learnt
  - Design an AI assistant or agent from requirements to failure modes
  - Ask questions that tell you whether to take the job
decision: Do you have rounds coming that are about talking, not coding?
readyWhen:
  - You can tell the story of your last role in two minutes, with one number in it.
  - You have five stories ready, each fitting several behavioural questions.
  - You can answer any behavioural question with STAR, the action longest, in "I" not "we".
  - You can design an AI assistant or agent on a whiteboard from requirements to failure modes.
  - You have three questions ready to ask each interviewer.
proof:
  title: A mock loop, out loud
  evidence:
    - A two-minute introduction, recorded once
    - Five stories mapped to the ten common questions
    - One AI system design, drawn and explained in 30 minutes
    - Your questions for the interviewers, written down
coverage:
  covered: [Behavioural answers, Communication while you work, AI system design, Questions to ask and the offer]
  partial: [Classic system design at scale]
  outside: [Negotiating equity in depth, Management rounds]
summary: >-
  How to answer, not what to say: communication, behavioural questions, AI system design and
  the questions you ask back.
method:
  - Do the lesson in the app, then read its notes.
  - Draft your own answer to each question from your own work, then check it against the guidance.
  - Say each answer out loud once. Two minutes at most.
shapes:
  - label: Behavioural
    text: >-
      STAR, with the action as the longest part, in "I" not "we", and a number in the result.
      Close with what you learnt.
  - label: System design
    text: >-
      Clarify requirements and numbers, draw the simplest design that works, go deep on the
      risky part, then failure modes and how you would measure it.
  - label: Your questions
    text: >-
      Ask about how work is judged, what is broken right now and what the first three months
      look like. One question per round is enough.
days:
  - title: How you come across
    why: >-
      Most rounds are decided by how clearly you think out loud and how well you tell the story
      of your own work.
    artifact: "Your introduction and five stories"
    must: [interview.communication, career.your-narrative, career.behavioural-stories, career.how-you-work]
    should: [career.interview-loop]
  - title: AI system design
    why: >-
      The design round for an AI role: the method, then the two case studies that come up most.
    artifact: "One AI system design you can draw"
    must: [sysdesign.the-method, sysdesign.case-ai-assistant, sysdesign.case-ai-agent]
    should: [sysdesign.estimation]
    tests: [{ lab: btree-index-explorer }, { lab: isolation-anomaly-stepper }, { lab: overselling-simulator }]
  - title: Closing
    why: >-
      The questions you ask back, and what to do when an offer arrives.
    artifact: "Your questions and your offer plan"
    must: [career.questions-to-ask, career.the-offer]
practice:
  - label: A three-task test before the loop
    href: /practise/online-test/screen-b
    text: Most loops start with an online test. Sit one so the first round is not the surprise.
