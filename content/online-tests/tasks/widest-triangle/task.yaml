id: widest-triangle
title: WidestTriangle
topic: sorting
difficulty: medium
type: algorithmic
recommendedMinutes: 25
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A carpenter has N wooden planks. Plank K is A[K] centimetres long. She wants to nail three
  of them together, end to end, into a triangular frame. Three planks form a frame only if
  each of them is shorter than the other two together.

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the largest possible perimeter (the sum of
  the three lengths) of a frame, or 0 if no three planks form one.

  For example, given A = [10, 2, 5, 1, 8, 20], the function should return 23: the planks 10,
  5 and 8 form a frame, and no frame is larger.

  Given A = [10, 50, 5, 1], the function should return 0.

  Given A = [3, 3, 3], the function should return 9.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..100,000];
  - each element of array A is an integer within the range [1..1,000,000,000].
examples:
  - { args: [[10, 2, 5, 1, 8, 20]], expected: 23 }
  - { args: [[10, 50, 5, 1]], expected: 0 }
  - { args: [[3, 3, 3]], expected: 9 }
timeLimitMs: 500
tests:
  - name: extreme_empty
    description: fewer than three planks
    group: correctness
    cases:
      - { args: [[]], expected: 0 }
      - { args: [[5]], expected: 0 }
      - { args: [[5, 5]], expected: 0 }
  - name: degenerate
    description: the longest plank equals the other two together
    group: correctness
    cases:
      - { args: [[1, 2, 3]], expected: 0 }
      - { args: [[5, 10, 5, 20, 40]], expected: 0 }
      - { args: [[2, 3, 4, 7]], expected: 9 }
  - name: all_equal
    description: every plank the same length
    group: correctness
    cases:
      - { args: [[7, 7, 7, 7, 7]], expected: 21 }
      - generate: { seed: 501, args: [{ kind: constant, n: 200, value: 1000000000 }] }
  - name: extreme_max_value
    description: lengths close to 1,000,000,000
    group: correctness
    cases:
      - { args: [[1000000000, 1000000000, 1]], expected: 2000000001 }
      - { args: [[1000000000, 999999999, 1, 1]], expected: 0 }
      - { args: [[1000000000, 500000000, 500000001, 1]], expected: 2000000001 }
  - name: small_random
    description: random, N = 200
    group: correctness
    cases:
      - generate: { seed: 502, args: [{ kind: ints, n: 200, min: 1, max: 1000000000 }] }
      - generate: { seed: 503, args: [{ kind: ints, n: 200, min: 1, max: 50 }] }
  - name: doubling
    description: each plank twice the one before, a few frames only
    group: correctness
    cases:
      - { args: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]], expected: 0 }
      - { args: [[512, 1, 2048, 4, 8, 16, 1000, 32, 64, 1024]], expected: 2536 }
  - name: large_random
    description: random, N = 100,000
    group: performance
    cases:
      - generate: { seed: 504, args: [{ kind: ints, n: 100000, min: 1, max: 1000000000 }] }
  - name: extreme_large
    description: short planks, many equal lengths, N = 100,000
    group: performance
    cases:
      - generate: { seed: 505, args: [{ kind: ints, n: 100000, min: 1, max: 30 }] }
