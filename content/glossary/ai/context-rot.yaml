term: context rot
aka:
  - lost in the middle
  - context degradation
short: The drop in a model's attention to its input as that input grows long, worst for facts mid-way.
explain: |
  Fit a hundred thousand tokens into a window and the model can technically see them all. It
  doesn't use them all equally. A rule stated early sinks into the middle of a long history,
  where models attend least.

  The agent hasn't lost the fact; it has stopped noticing it. Quality falls long before the
  window is full, often with no error at all.

  So the softer limit arrives first. Keep the context small on purpose. Compact old turns, repeat the task near the end, and fetch
  details only when a step needs them.
analogy: A long meeting. Everyone remembers the opening and the last ten minutes; the middle is a blur.
usage: It ignored the "never delete" rule at step forty; that's context rot, so restate the rules after compaction.
twin:
  term: context-window
  difference: The context window is the hard limit on how much a model can take in. Context rot is the quality loss that starts well before that limit.
related:
  - context-window
  - context-engineering
  - compaction
level: 3
lessons:
