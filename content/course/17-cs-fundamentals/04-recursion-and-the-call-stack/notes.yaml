summary: >-
  A recursive function solves a problem by solving a smaller copy of the same problem. It
  has a **base case**, answered directly, and a **recursive case**, which does a little work
  and calls itself on something smaller. It fits data that contains smaller data of the
  same shape: folders in folders, replies to replies, a menu with submenus, a JSON document.


  Every call that hasn't returned yet keeps a **frame** on the call stack, with its
  arguments, its local variables and where to carry on. That makes recursion cost memory in
  proportion to its depth. In JavaScript the stack is a fixed-size region, and V8 doesn't
  reuse frames for tail calls, so recursion that goes deep enough throws
  `RangeError: Maximum call stack size exceeded`.


  So recursion is a tool for shape, not a replacement for loops. Use it when the depth stays
  small, like a real folder tree. When depth comes from user data, rewrite it as a loop with
  an explicit stack. When the same subproblem comes up again and again, add memoisation.
remember:
  - Every recursive function needs a base case that every input reaches and a recursive case that moves strictly towards it.
  - Each call pushes a frame holding its arguments, locals and return point, and the frame is popped when that call returns.
  - Recursion costs O(depth) stack space even when the function allocates nothing else.
  - In Node, recursion that is too deep throws `RangeError` with the message "Maximum call stack size exceeded", and the limit varies by engine, version and machine.
  - V8 doesn't do tail call optimisation, so a tail-recursive function in Node still uses one frame per call.
  - Any recursion can become a loop, with an accumulator for a single chain of calls or an explicit stack array for tree-shaped work.
  - Memoisation caches results by argument, which turns overlapping subproblems like naive Fibonacci from exponential to linear time.
  - Recurse when the data is tree-shaped and shallow, and loop when the depth comes from input you don't control.
sections:
  - title: Frames, traced
    body: |-
      A frame is created when a call starts and destroyed when it returns. While a call waits
      for the one it made, its frame sits underneath, with its own copy of every parameter and
      local variable. Indenting by depth makes the pile visible:

      ```js
      function factorial(n, depth = 0) {
        const pad = '  '.repeat(depth);
        console.log(`${pad}factorial(${n}) starts`);
        const result = n <= 1 ? 1 : n * factorial(n - 1, depth + 1);
        console.log(`${pad}factorial(${n}) returns ${result}`);
        return result;
      }
      factorial(3);
      ```

      ```text
      factorial(3) starts
        factorial(2) starts
          factorial(1) starts
          factorial(1) returns 1
        factorial(2) returns 2
      factorial(3) returns 6
      ```

      The calls go down until the base case, then the returns come back up in reverse order,
      each finishing the multiplication it left pending. That pending work is why every frame
      has to stay: `factorial(3)` still needs to multiply by 3 after `factorial(2)` answers.

      Each frame holds the arguments, the local variables, and the **return address**, the
      spot in the caller to resume at. The engine may keep some values in CPU registers
      instead, but the model is the same.

      A stack trace in an error message is a printout of these frames, newest first. Node
      shows 10 frames by default, set by `Error.stackTraceLimit`. When you debug a recursion
      that fails deep down, raise it, for example `Error.stackTraceLimit = 50`, to see more
      of the chain.
  - title: 'Stack overflow in Node, and why tail calls don''t help'
    body: |-
      The call stack is a region of memory with a fixed size. The limit is in bytes, not a
      number of calls, so a function with more locals overflows at a smaller depth. Here's a
      function written so that the recursive call is the very last thing it does, a **tail
      call**:

      ```js
      function sumTo(n, total = 0) {
        if (n === 0) return total;
        return sumTo(n - 1, total + n); // a tail call: nothing left to do after it
      }

      try {
        console.log(sumTo(1000)); // 500500
        console.log(sumTo(1_000_000));
      } catch (error) {
        console.log(error instanceof RangeError, error.message);
        // true Maximum call stack size exceeded
      }

      function sumToLoop(n) {
        let total = 0;
        while (n > 0) {
          total = total + n;
          n = n - 1;
        }
        return total;
      }
      console.log(sumToLoop(1_000_000)); // 500000500000
      ```

      With tail call optimisation, the engine would reuse the frame, since nothing in it is
      needed after the call. ECMAScript 2015 specified proper tail calls, in strict mode
      code. Safari's engine ships them, but V8 doesn't, so neither Node nor Chrome does. In
      Node, the tail-recursive version overflows exactly like the plain one.

      The error is an ordinary `RangeError`, so `try` and `catch` can catch it. That's handy
      for a clear error message, but not as a strategy: code that overflows on some inputs is
      broken on those inputs.

      V8 has a `--stack-size` option. Raising it past the stack the operating system gave the
      thread can crash the whole process with a segmentation fault instead of a catchable
      error. Treat the limit as fixed, and change the algorithm.
  - title: Converting recursion to iteration
    body: |-
      There are two recipes, depending on the shape of the recursion.

      **A single chain of calls**, like `sumTo`, becomes a loop. Turn the pending work into
      an accumulator variable, and the "smaller problem" into updating the loop variable. The
      `sumToLoop` above is that transformation, and it uses O(1) space.

      **Tree-shaped recursion**, where a call can make several calls, needs an explicit stack.
      The array does the remembering that frames used to do. The detail people miss is order:
      a stack pops the last item pushed, so push children in reverse to visit them in the
      same order as the recursion.

      ```js
      const menu = {
        name: 'Home',
        children: [
          { name: 'Shop', children: [{ name: 'Shoes', children: [] }, { name: 'Bags', children: [] }] },
          { name: 'Help', children: [] },
        ],
      };

      function namesRecursive(node, out = []) {
        out.push(node.name);
        for (const child of node.children) namesRecursive(child, out);
        return out;
      }

      function namesIterative(root) {
        const out = [];
        const stack = [root];
        while (stack.length > 0) {
          const node = stack.pop();
          out.push(node.name);
          // Push in reverse, so the first child is popped first, as in the recursion.
          for (let i = node.children.length - 1; i >= 0; i--) stack.push(node.children[i]);
        }
        return out;
      }

      console.log(namesRecursive(menu).join(' > ')); // Home > Shop > Shoes > Bags > Help
      console.log(namesIterative(menu).join(' > ')); // Home > Shop > Shoes > Bags > Help

      // A chain 100,000 levels deep, as user data can be.
      let deep = { name: 'leaf', children: [] };
      for (let i = 0; i < 100_000; i++) deep = { name: 'level', children: [deep] };
      console.log(namesIterative(deep).length); // 100001
      try {
        namesRecursive(deep);
      } catch (error) {
        console.log(error.name); // RangeError
      }
      ```

      Swap the array for a queue, taking from the front, and the same loop visits level by
      level instead: breadth-first search. When a node's answer depends on its children's
      answers, like a folder size, the iterative version is harder. You either push each node
      twice, once to expand and once to combine, or store partial results in a `Map`.
  - title: 'Memoisation: stop solving the same problem twice'
    body: |-
      Some recursions call themselves on the same arguments many times. Naive Fibonacci is the
      classic: `fib(n)` calls `fib(n - 1)` and `fib(n - 2)`, and both of those call `fib(n - 3)`,
      and so on down. The call tree roughly doubles at each level.

      ```js
      let calls = 0;
      function fib(n) {
        calls++;
        if (n < 2) return n;
        return fib(n - 1) + fib(n - 2);
      }
      console.log(fib(25), calls); // 75025 242785

      let memoCalls = 0;
      function fibMemo(n, memo = new Map()) {
        memoCalls++;
        if (n < 2) return n;
        if (memo.has(n)) return memo.get(n);
        const value = fibMemo(n - 1, memo) + fibMemo(n - 2, memo);
        memo.set(n, value);
        return value;
      }
      console.log(fibMemo(25), memoCalls); // 75025 49

      function fibLoop(n) {
        let [previous, current] = [0, 1];
        for (let i = 0; i < n; i++) [previous, current] = [current, previous + current];
        return previous;
      }
      console.log(fibLoop(25), fibLoop(50)); // 75025 12586269025
      ```

      **Memoisation** stores each answer the first time it's computed and returns the stored
      one after that. It took 242,785 calls down to 49: exponential to linear. The price is
      memory, one entry per distinct argument, plus the recursion depth.

      It only works on **pure** functions, whose result depends on nothing but the arguments.
      It only helps when subproblems **overlap**. Merge sort's halves never repeat, so a memo
      would add cost and save nothing.

      The last version, `fibLoop`, builds up from the smallest cases instead and keeps only
      the two it needs: O(n) time, O(1) space, no stack at all. That bottom-up style is what
      dynamic programming usually means in practice. For several arguments, build a string
      key such as `` `${row},${col}` ``, since a `Map` compares arrays by identity.
pitfalls:
  - '**Forgetting to return the recursive result.** Writing `sumNested(item);` on its own line instead of adding or returning it throws the answer away, and the function returns `undefined` or a partial total. Every path through the function must return a value built from the recursive call.'
  - '**Slicing the array on every call.** `sum(list.slice(1))` copies the rest of the list each time, which makes a linear job O(n²) in time and memory. Pass an index along instead, or use a loop.'
  - '**Counting on tail calls in Node.** Rewriting a function to be tail-recursive changes nothing in V8, which doesn''t optimise tail calls. Convert it to a loop.'
  - '**Recursing to a depth the user controls.** A deeply nested JSON body, comment thread or menu from an import can overflow the stack and crash a request. Use an explicit stack, or reject input deeper than a sensible limit.'
  - '**Recursing over data that can contain a cycle.** A graph, or objects that point back to a parent, sends naive recursion round for ever until the stack overflows. Keep a `Set` of visited nodes and skip any you''ve seen.'
  - '**A memo cache that never empties.** A module-level `Map` used as a memo grows with every distinct argument for the life of the process. Create the memo per top-level call, as `fibMemo` does, or cap its size.'
verify:
  - lens: breaks
    check: 'Every input reaches a base case, including negatives, decimals and empty values, not only the cases in the examples.'
  - lens: breaks
    check: 'Recursion over user-supplied nesting, such as JSON or comment threads, has a depth limit or an explicit stack.'
  - lens: scales
    check: 'Recursive calls pass an index instead of slicing, so a linear job doesn''t copy the list at every level.'
  - lens: tests
    check: 'Recursive functions are tested on input deep enough to overflow the default stack, and on data with a cycle.'
interview:
  - question: What happens on the call stack when a recursive function runs, and why can deep recursion crash?
    answer: >-
      Each call pushes a frame holding its arguments, local variables and return address, and
      the frame stays until that call returns. In a recursion, a call can't return until the
      calls it made have returned, so at the deepest point every level has a frame at once.
      A recursion n levels deep needs O(n) stack space even if it allocates nothing else. The
      stack is a fixed-size region, so past some depth it runs out. In Node that's
      `RangeError: Maximum call stack size exceeded`. The limit is in bytes, so it depends on
      frame size, engine version and platform, and you shouldn't design around a number. For
      shallow, tree-shaped data recursion is fine and clearer. When depth comes from input, I
      convert it to a loop with an explicit stack.
  - question: Does JavaScript have tail call optimisation?
    answer: >-
      In the specification yes, in practice mostly no. ECMAScript 2015 defined proper tail
      calls for strict mode code: if a function's last action is to return the result of
      another call, the engine can reuse the current frame, so tail recursion runs in
      constant stack space. Safari's JavaScriptCore implements it, but V8 doesn't, so Node
      and Chrome don't either. A tail-recursive function in Node still pushes one frame per
      call and overflows like any other. So in JavaScript I don't rely on it. If a recursion
      can go deep, I rewrite it as a loop, which is mechanical for tail recursion: the
      accumulator parameter becomes a local variable and the recursive call becomes the next
      loop iteration. That also tends to make the code easier to step through in a debugger.
  - question: How do you convert a recursive function into an iterative one?
    answer: >-
      Replace the call stack with a stack you manage. For a single chain of calls, like
      summing 1 to n, I turn the pending work into an accumulator and loop, which needs O(1)
      space. For tree-shaped recursion, I keep an array as a stack: push the root, then loop
      while it's not empty, pop a node, process it and push its children. Pushing children in
      reverse keeps the same visiting order as the recursion. The array lives on the heap, so
      it's limited by memory, not stack size, and a 100,000-level chain works. When a node
      needs its children's results first, like totalling folder sizes, I push each node twice
      or store partial results in a map. The cost is readability: the recursive version is
      usually shorter, so I convert only when depth can be large.
  - question: What is memoisation, and when does it help?
    answer: >-
      Memoisation caches a function's result by its arguments, so repeated calls return the
      stored answer instead of recomputing. It helps when a recursion has overlapping
      subproblems. Naive Fibonacci calls `fib(n - 2)` from two places, and the duplication
      compounds, so the call count grows exponentially. For `fib(25)` that's 242,785 calls,
      and with a `Map` as a memo it's 49, turning exponential time into linear. It needs a
      pure function, since a cached answer is only right if nothing but the arguments affects
      the result. The trade-offs are memory, one entry per distinct input, and a cache that
      can grow without bound if it outlives the call. When the subproblems have a clear
      order, I'd often go bottom-up instead: a loop that builds from the smallest case and
      keeps only what it still needs.
  - question: When would you choose recursion over a loop?
    answer: >-
      I choose recursion when the data or the problem is recursive in shape and the depth is
      bounded: walking a DOM tree, a folder tree, a parsed expression, or trying choices in a
      backtracking search. The code mirrors the structure, with one case per kind of node, and
      the call stack does the bookkeeping. I choose a loop when the problem is a straight
      sequence, like summing or searching a list, where recursion adds a frame per item for
      nothing. I also switch to a loop with an explicit stack when depth depends on external
      input, because in V8 there's no tail call optimisation to save me. The trade-off is
      clarity against control: recursion reads better, while iteration gives predictable
      memory use and no overflow.
