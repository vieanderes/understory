# Path: judgment for senior work. Schema: fastTrackSchema in src/core/content/notes.ts.
title: "Senior judgment: know what to verify"
name: Senior judgment
order: 8
promise: Spot what will break, scale badly, confuse or leak before it ships, and explain your call so others act on it.
outcomes:
  - Review any change, yours or an assistant's, with five questions and the tests that prove it
  - Design integrations and multi-step work that survive systems you don't control
  - Shape a build from intent to a ranked list and a workflow on paper
  - Pressure-test a design and make a trade-off you can defend
  - Explain a decision, an incident or a design to any listener
decision: Are you reviewing more code than you write, or moving to senior?
readyWhen:
  - You can review an AI-written pull request and rank what it gets wrong by severity.
  - You can name the test that would catch a flaw, and what else a change could break.
  - You can design a sync with a vendor that survives retries, deletions and outages.
  - You can draw a workflow with its failure paths and defend one trade-off in it.
  - You can explain a decision to an engineer and to someone who isn't one.
proof:
  title: A design review pack
  evidence:
    - A review of a real pull request, findings ranked by severity
    - A one-page design doc with goals, non-goals, options and the trade-off taken
    - A workflow diagram with its failure paths
    - An incident update written for users
coverage:
  covered: [Verification and review, Integrations and data sync, Steps that span systems, Design before code, Explaining your work]
  partial: [Running production systems]
  outside: [People management, Hiring]
summary: >-
  The part of the job an assistant can't do for you: knowing what to check, deciding well and
  saying why.
method:
  - Do the lesson in the app, then read its notes and its Before you ship list.
  - Take one change you shipped recently and run the five questions over it.
  - Say each explain-back out loud once before you type it.
shapes:
  - label: A review
    text: >-
      What could break, what holds at 10x, what confuses the next person, what it could expose,
      and how you'd prove it works. Most severe first, each with the fix.
  - label: A decision
    text: >-
      The options, the criteria, the one you recommend, the trade-off you accept and what
      would change your mind.
days:
  - title: The verification lens
    why: >-
      Five questions turn reading code into finding what matters, whoever wrote it.
    artifact: "A ranked review of one change"
    must: [judgment.what-to-verify, judgment.what-breaks, judgment.what-scales, judgment.next-reader, judgment.what-leaks, judgment.regressions, judgment.reviewing-a-change]
    should: [clean.code-review, ai.reviewing-ai-code]
  - title: Systems that don't break
    why: >-
      Most production bugs live between two systems: retries, partial failures, deletions and
      vendors that break their own spec.
    artifact: "A sync design that survives an outage"
    must: [integrations.systems-you-dont-control, integrations.paging-through, integrations.tokens-that-expire, integrations.full-and-delta-sync, integrations.deletions, integrations.normalising-data, integrations.adapters-and-models, integrations.webhooks-and-polling, integrations.writing-to-other-systems, arch.sagas-and-workflows, scale.fair-queues, testing.breaking-it-on-purpose]
    should: [testing.testing-other-services, backend.long-running-and-bulk, security.personal-data]
    tests:
      - { test: practical-screen }
      - { task: token-bucket-gate }
      - { task: retry-plan }
      - { task: stable-cursor }
      - { task: delta-diff }
      - { task: webhook-ledger }
      - { task: saga-steps }
  - title: Design before code
    why: >-
      Deciding what to build, in what order and with which trade-off, before anyone writes code.
    artifact: "A ranked list, a workflow and one decision record"
    must: [judgment.intents-and-priorities, judgment.workflows-on-paper, judgment.pressure-testing, judgment.trade-offs]
    should: [aisys.shaping-the-build, arch.adrs-and-twelve-factor]
  - title: Explain it
    why: >-
      A good call nobody understands changes nothing. Practise saying it so people act on it.
    artifact: "A design doc, an incident update and one recorded explanation"
    must: [explain.say-it-plainly, explain.asking-for-help, explain.walking-through-code, explain.explaining-a-decision, explain.audiences, explain.incident-updates, explain.design-docs, explain.talking-through-a-diagram]
    should: [interview.communication]
