id: clean.comments-and-constants
title: Comments, constants and dead code
objective: Write comments that explain why, name magic values as constants, and delete dead and commented-out code.
level: essential
minutes: 10
concepts: [clean.why-comments, clean.magic-values, clean.dead-code]
prerequisites: [tooling.git-as-a-graph, clean.control-flow]
opening:
  text: >-
    You'll learn which comments help and which ones rot, and how a named number prevents
    a real bug. It's the fastest way to make old code trustworthy again.

steps:
  - type: prose
    id: why-comments
    body: |-
      Code shows *what* happens. A comment earns its place by saying **why**:

      ```js
      // Round down: the bank rejects fractions of a penny.
      const pence = Math.floor(amount * 100);
      ```

      A reason, a rule from outside, a trade-off, a link to the bug report. Comments that restate the code
      go stale the day someone edits the line and forgets the comment.

  - type: multiple-choice
    id: pick-useful-comment
    concept: clean.why-comments
    difficulty: 1
    language: js
    code: |
      page = page + 1;
    question: Which comment above this line earns its place?
    choices:
      - text: '`// People count pages from 1, not 0`'
        correct: true
        feedback: >-
          Yes. It explains why, which the code can't say for itself.
      - text: '`// add one to page`'
        feedback: >-
          The code already says that. A comment that repeats it only adds reading.
      - text: '`// increment`'
        feedback: >-
          Same trouble: it restates the line. The useful part is the reason.

  - type: bug-hunt
    id: hunt-stale-comment
    concept: clean.why-comments
    difficulty: 2
    language: js
    code: |
      // Lock the account after 3 failed tries
      if (failedTries >= 5) {
        lockAccount(user);
      }
    prompt: >-
      Last month the team raised the limit to 5 tries. Support still tells people they get
      3. Tap the line that misled them.
    lines: [1]
    reasons:
      - text: The comment repeats the code, and went stale
        correct: true
        feedback: >-
          Yes. Someone changed the number and nothing made them fix the comment.
      - text: The limit on line 2 should be 3
        feedback: >-
          The team chose 5, so the code is right. The comment is what's out of date.
      - text: '`>=` should be `>`'
        feedback: >-
          That shifts the limit by one try. The real problem is a comment that lies.
    fix: |
      if (failedTries >= 5) {
        lockAccount(user);
      }
  - type: prose
    id: magic-values
    body: |-
      An unexplained literal like `86400` or `0.2` is a **magic value**. Name it:

      ```js
      const SECONDS_PER_DAY = 24 * 60 * 60;
      const VAT_RATE = 0.2;
      ```

      Now the meaning travels with the number, and changing it happens in one place.
      `UPPER_SNAKE_CASE` marks a fixed setting. Put units in the name when there are any.

  - type: bug-hunt
    id: hunt-drifted-number
    concept: clean.magic-values
    difficulty: 2
    language: js
    code: |
      function canSignUp(password) {
        return password.length >= 8;
      }
      function canResetTo(password) {
        return password.length >= 10;
      }
    prompt: >-
      Sign-up accepts an 8-letter password, then the reset page rejects the same one. The
      rule is 8. Tap the line at fault.
    lines: [5]
    reasons:
      - text: The same rule was typed twice, and one copy changed
        correct: true
        feedback: >-
          Right. A named constant keeps one rule in one place.
      - text: '`>=` should be `>`'
        feedback: >-
          `>= 8` is right for "at least 8". The two numbers disagree.
      - text: Reset should use `password.trim()`
        feedback: >-
          Spaces aren't the issue here. The two functions check different lengths.
    fix: |
      const MIN_PASSWORD_LENGTH = 8;
      function canSignUp(password) {
        return password.length >= MIN_PASSWORD_LENGTH;
      }
      function canResetTo(password) {
        return password.length >= MIN_PASSWORD_LENGTH;
      }

  - type: ai-review
    id: review-unit-in-comment
    concept: clean.magic-values
    difficulty: 3
    language: js
    request: Log a user out after 30 minutes idle. Times are in milliseconds.
    flawClass: logic
    code: |
      const IDLE_LIMIT = 30; // minutes
      function isIdleTooLong(lastSeenMs, nowMs) {
        return nowMs - lastSeenMs > IDLE_LIMIT * 1000;
      }
    prompt: >-
      An assistant wrote this. A test with a user idle for two hours passed. Users now
      get logged out after 30 seconds. Tap the line at fault.
    lines: [3]
    reasons:
      - text: 30 times 1000 is 30 seconds, not minutes
        correct: true
        feedback: >-
          Exactly. The unit lived in a comment, and the maths ignored it.
      - text: The subtraction is the wrong way round
        feedback: >-
          Now minus last seen is the idle time. The limit it's compared to is wrong.
      - text: '`>` should be `>=`'
        feedback: >-
          That moves the edge by one millisecond. The limit is 60 times too small.
    fix: |
      const IDLE_LIMIT_MS = 30 * 60 * 1000;
      function isIdleTooLong(lastSeenMs, nowMs) {
        return nowMs - lastSeenMs > IDLE_LIMIT_MS;
      }

  - type: prose
    id: dead-code
    body: |-
      **Dead code** is code that never runs: a function nobody calls, lines after a
      `return`, or old code kept "in case" behind `//`.

      It still costs the reader, who has to work out whether it matters. And you don't need
      it as a backup. Git already keeps every committed version, so the old lines are one
      `git log` away.
  - type: multiple-choice
    id: pick-dead-code
    concept: clean.dead-code
    difficulty: 2
    language: js
    code: |
      function total(cart) {
        // const discount = cart.coupon ? 5 : 0;
        // return sum(cart) - discount;
        return sum(cart);
      }
    question: Why delete the two commented-out lines rather than keep them?
    choices:
      - text: Git already keeps the old version
        correct: true
        feedback: >-
          Yes. History holds it, and the file stays honest about what runs.
      - text: Comments slow the code down
        feedback: >-
          Comments cost nothing at run time. They cost the reader, who wonders if they matter.
      - text: Keep them, they might be needed
        feedback: >-
          That's the usual reason, and it rarely happens. Git can bring them back if it does.

  - type: code-challenge
    id: write-named-fee
    concept: clean.magic-values
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      `deliveryFee(basketTotal)` is free from 50 up, and 4.99 below. Name the numbers as
      `FREE_DELIVERY_THRESHOLD` and `DELIVERY_FEE`, and use them.


      Delete the comments that repeat the code and the old rule. Keep one comment only if it
      says why.
    hints:
      - Two numbers carry the rule. Three comments add nothing the code doesn't say.
      - Constants go above the function, so the tests can read them too.
      - 'Start with `const FREE_DELIVERY_THRESHOLD = 50;` and `const DELIVERY_FEE = 4.99;`'

  - type: explain-back
    id: explain-stale-comments
    concept: clean.why-comments
    difficulty: 3
    prompt: Why do comments that describe what the code does tend to become wrong over time?
    rubric:
      - The code changes and the comment doesn't, because nothing checks it.
      - Then the comment says something the code no longer does.
      - A reason why stays true longer, because it's about the situation, not the line.
    modelAnswer: >-
      Nothing tests a comment. When someone changes the line, the comment beside it often
      stays as it was. Soon it describes code that's gone, and readers believe it. A comment
      about why ages better, because the reason usually outlives the exact code.

recap:
  - Write comments that say why, and let the code say what.
  - Replace magic numbers with named constants that carry their unit.
  - Delete dead and commented-out code, because Git keeps it.
recall:
  - id: card-why
    concept: clean.why-comments
    front: What makes a comment worth keeping?
    back: >-
      It says why: a reason, constraint or trade-off the code can't show.
  - id: card-magic
    concept: clean.magic-values
    front: What is a magic value, and what do you do with it?
    back: >-
      An unexplained literal like `86400`. Give it a named constant, with its unit in the
      name.
  - id: card-drift
    concept: clean.magic-values
    front: What bug does a named constant prevent when a rule appears in two places?
    back: >-
      The copies drifting apart, like 8 in one check and 10 in another.
  - id: card-dead
    concept: clean.dead-code
    front: Why delete commented-out code instead of keeping it?
    back: >-
      It misleads readers and rots, and version control already keeps the old version.

references:
  - kind: docs
    title: Replace Magic Literal
    authors: Martin Fowler
    venue: Refactoring catalog
    url: https://refactoring.com/catalog/replaceMagicLiteral.html
    note: The move from a bare number to a named constant.
    primary: true
    verified: true
  - kind: essay
    title: Code As Documentation
    authors: Martin Fowler
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/CodeAsDocumentation.html
    note: Why clear code does most of what comments try to do, and where comments still help.
    verified: true

deepDive: >-
  Not every literal is magic. `0` and `1` in a loop, `/ 2` for a midpoint, or `100` when
  converting to a percentage read fine on their own. Name a value when its meaning or origin
  isn't obvious, or when it appears in more than one place.


  Public functions deserve a different kind of comment: a doc comment that states the
  contract, such as what each parameter means and what it throws. JavaScript and TypeScript
  use JSDoc blocks (`/** ... */`), and editors show them on hover. Python uses docstrings,
  the first string inside a function.


  A `TODO` is fine if it names why and ideally links an issue. A `TODO` with no owner is
  dead code's cousin.
