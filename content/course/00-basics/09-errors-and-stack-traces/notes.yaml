summary: >-
  An **error** is the computer telling you it reached a line it couldn't carry out. It stops
  the program right there and prints a message with three parts: the kind of error, where it
  happened, and what went wrong. Read those three parts before you change anything, and most
  errors fix themselves in a minute.


  Errors often happen inside a function that was called by another function. To follow them,
  you need one picture: the **call stack**, the pile of functions that are still running, with
  the newest on top. When an error stops the program, JavaScript prints that pile as a **stack
  trace**. The top line is where it broke. Each line below is the function that called the one
  above it.


  The skill this lesson builds is the one working developers use every day. The line that
  breaks is often not the line with the bug. A bad value like `undefined` can be made in one
  function and passed along quietly until another function tries to use it. The trace is the
  map that leads you from where it broke back to where the bad value was made.
remember:
  - An error message has three parts, the kind, the place and what went wrong, so read all three before changing code.
  - A reference error means a name doesn't exist, usually a typo, and a type error means the value exists but can't do what you asked.
  - The call stack is the pile of functions still running, newest on top; a call adds a frame and a return takes it off.
  - A stack trace lists the call stack at the moment of the error, top first, and each line was called by the line below it.
  - '`file.js:6:15` means line 6, character 15 of that file.'
  - The line that breaks is often not the buggy one, because `undefined` travels silently until something uses it.
  - Start at the first trace line that names your own file, and skip lines that start with `node:internal`.
  - A syntax error stops the program before any line runs, because JavaScript reads the whole file before running it.
sections:
  - title: What Node really prints
    body: |-
      The lesson shows a tidied trace. Here's the whole thing, so you recognise it when you run
      a file yourself. **Node** is a program that runs JavaScript outside a browser. You run a
      file by typing `node todo.js` in a **terminal**, the text window where you type commands.

      This is the lesson's to-do example, saved as `todo.js` and run with Node 24. Node prints
      the full path to the file, such as a folder on your computer. Here the folder part is left
      out, so you see `todo.js`:

      ```text
      todo.js:6
        return task.title + " by " + task.due;
                    ^

      TypeError: Cannot read properties of undefined (reading 'title')
          at formatTask (todo.js:6:15)
          at lastTask (todo.js:10:10)
          at renderList (todo.js:13:26)
          at Object.<anonymous> (todo.js:15:1)
          at Module._compile (node:internal/modules/cjs/loader:1929:14)
          at Object..js (node:internal/modules/cjs/loader:2060:10)
          at Module.load (node:internal/modules/cjs/loader:1651:32)
          at Module._load (node:internal/modules/cjs/loader:1443:12)
          at wrapModuleLoad (node:internal/modules/cjs/loader:261:19)
          at Module.executeUserEntryPoint [as runMain] (node:internal/modules/run_main:154:5)

      Node.js v24.21.0
      ```

      Read it in this order:

      1. The first three lines show the broken line of code. The `^` points at the exact spot,
         here the start of `title`, character 15.
      2. The `TypeError:` line gives the kind and the message.
      3. The `at` lines are the stack trace, top first.

      Two parts look strange. `Object.<anonymous>` is how Node names the top level of your
      file: the code that isn't inside any function, here the `renderList();` call on line 15.
      The lines with `node:internal` are Node's own code, which loaded and started your file.
      They're never where your bug is, so stop reading at the first of them.

      The trace also stops at 10 lines. That's a default limit, and it's why this one ends
      part-way through Node's own lines.
  - title: Frames, and why the stack is a pile
    body: |-
      Each entry on the call stack is called a **frame**. A frame is one function call that
      hasn't finished yet. It remembers three things: which function it is, the values of that
      call's variables and parameters, and the line it has reached.

      Calling the same function twice, one inside the other, makes two frames. They're
      separate, each with its own values. That's how a function can call itself: every call
      gets a fresh frame.

      A pile is the right picture because only the top frame is running. The frames below are
      paused, each waiting on the line where it made its call. When the top function returns,
      its frame comes off, and the one underneath carries on from where it waited.

      If frames keep going on and never come off, the pile runs out of room. Here a function
      calls itself with no way to stop:

      ```js
      function countDown(n) {
        return countDown(n - 1);
      }
      countDown(3);
      ```

      ```text
      RangeError: Maximum call stack size exceeded
          at countDown (rec.js:2:3)
          at countDown (rec.js:2:10)
          at countDown (rec.js:2:10)
      ```

      Node prints ten `countDown` lines. Three are shown here. This is a **stack overflow**, and
      a `RangeError` means a value went outside the range allowed, here the depth of the pile.
      A trace where one function repeats down the whole page almost always means a function
      that keeps calling itself, or two functions that keep calling each other. The fix is a
      condition that stops the calls, like a countdown that stops at 0.
  - title: 'The four kinds, and the messages you''ll see most'
    body: |-
      The kind of error narrows the search before you read another word.

      A **ReferenceError** means a name doesn't exist. Check the spelling of the name the
      message quotes, then check it was made with `let` or `const` before this line.

      ```text
      ReferenceError: task is not defined
      ```

      A **TypeError** means the value exists but can't do what you asked. These three cover most
      of them:

      ```text
      TypeError: tasks is not a function
      TypeError: Cannot read properties of undefined (reading 'title')
      TypeError: Assignment to constant variable.
      ```

      The first means you put `()` after something that isn't a function. The second means the
      value before the dot is `undefined`, so ask where it came from. The third means a line
      gave a `const` a new value.

      A **RangeError** means a number went outside what's allowed, like the stack overflow
      above.

      A **SyntaxError** is different from the other three. It means the code isn't valid
      JavaScript at all, like a missing closing quote. JavaScript reads the whole file before
      running any of it, so a syntax error stops everything before line 1 runs:

      ```js
      console.log("Start");
      console.log("Hello);
      ```

      ```text
      syn2.js:2
      console.log("Hello);
                  ^^^^^^^^

      SyntaxError: Invalid or unexpected token
      ```

      `Start` never appears, although line 1 is fine. A missing closing curly bracket gives
      `SyntaxError: Unexpected end of input`, and Node points at the end of the file, not at
      the bracket you forgot. Look for the opening bracket that has no partner.
  - title: A routine for any error
    body: |-
      Guessing wastes time. A routine gets you there faster, and it's the same for a three-line
      exercise and a large app.

      1. **Read the kind.** Reference error: look at names. Type error: look at values. Syntax
         error: look at brackets and quotes.
      2. **Read the message.** It usually quotes the name or property involved, like
         `(reading 'title')`.
      3. **Find the top line in your own file.** Skip anything from `node:internal`. Open that
         line.
      4. **Ask which value is wrong.** For `Cannot read properties of undefined`, it's whatever
         stands before the dot. Here that's `task`.
      5. **Walk down the trace.** Each line below is a caller. Look at what it passed in, until
         you find the line that made the bad value.
      6. **Fix it where it was made**, then run again.

      Step 6 is the one people skip. It's tempting to add a check in `formatTask` so it copes
      with `undefined`. The error goes away, but the real bug stays. `lastTask` still reads
      past the end of the list, and now nothing tells you. Fixing where the value was made
      removes the cause.

      After a fix, run the program again even if you're sure. A new error on a later line is
      good news: it means the program got further.
pitfalls:
  - '**Fixing the line the error names without asking why.** The top of the trace shows where a bad value was used, not where it was made. Walk down the trace to the caller that produced it.'
  - '**Reading only the message and skipping the kind.** `ReferenceError` and `TypeError` point at different problems, a missing name or a wrong value. Read the kind first, it halves the search.'
  - '**Starting in Node''s own lines.** Lines with `node:internal` are the code that loaded your file. Start at the first line that names your file.'
  - '**Hiding the error with a check.** Making `formatTask` accept `undefined` silences the message but keeps the bug. Fix the line that made the bad value.'
  - '**Looking for a syntax error where Node points.** For a missing closing bracket, Node points at the end of the file. Look for the opening bracket without a partner.'
  - '**Changing several things at once.** If the error changes, you won''t know which edit did it. Make one change, run, and read the new output.'
verify:
  - lens: breaks
    check: A value that can be `undefined`, like an item read by index, is checked before the code reads a property of it.
  - lens: breaks
    check: Code that reads the last item uses `length - 1` and is tried on an empty list, which has no last item.
  - lens: leaks
    check: A stack trace can reveal file paths and function names, so a real app logs it and shows users a plain message.
  - lens: tests
    check: After a fix, the program runs again with the exact input that broke it, and the error is gone.
interview:
  - question: Walk me through how you read a stack trace.
    answer: >-
      I read the error line first, then the trace from the top down, starting at my own code.
      The error line gives the kind and the message, for example `TypeError: Cannot read
      properties of undefined (reading 'title')`, so I know some value before `.title` is
      `undefined`. The top trace line with my file name shows where it broke, as file, line and
      character. Each line below it is the function that called the one above, so walking down
      follows the chain of calls backwards. I skip lines from the runtime itself, like
      `node:internal` in Node. I keep walking until I find where the bad value was made, which
      is often a caller, not the top line. One caveat: a trace shows at most ten lines by
      default, so a very deep chain can cut off the start.
  - question: What's the difference between a ReferenceError and a TypeError?
    answer: >-
      A ReferenceError means the name doesn't exist, and a TypeError means the name exists but
      its value can't do what you asked. `task.length`, when only `tasks` was defined, gives
      `ReferenceError: task is not defined`, usually a typo or a variable used before it's made.
      `tasks()` on a list gives `TypeError: tasks is not a function`, because lists can't be
      called. Reading a property of `undefined` is also a TypeError, and it's the one you'll see
      most. The practical difference is where you look. For a ReferenceError, check spelling
      and whether the variable was made. For a TypeError, the name is fine, so ask where the
      value came from, which often means following the stack trace down to a caller.
  - question: What is the call stack, and what's a stack overflow?
    answer: >-
      The call stack is how the computer keeps track of which functions are running and where
      each one should carry on. Every call pushes a frame on top, holding that call's variables
      and its current line. Only the top frame runs. The ones below wait at the line where they
      made their call, and a return pops the top frame so the one beneath resumes. A stack
      overflow happens when frames keep being added and never removed, usually a function that
      calls itself with no condition to stop. The stack has a size limit, so JavaScript stops
      with `RangeError: Maximum call stack size exceeded`. The trace shows the same function
      again and again, which is the giveaway. The fix is a stopping condition, not a bigger
      stack.
