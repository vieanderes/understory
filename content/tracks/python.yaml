# Python by hand: the language of AI engineering and of many coding rounds, from its core
# data structures to classes, type hints and tests. Schema: fastTrackSchema in
# src/core/content/notes.ts.
title: Python fundamentals
name: Python
order: 3
promise: Write clean, typed Python by hand, the way coding rounds and AI engineering expect.
outcomes:
  - Pick the right built-in structure and write comprehensions without looking them up
  - Write functions and classes with type hints, and handle errors well
  - Organise a small project and test it with pytest
  - Spot the habits that make Python read as unpythonic
decision: Is Python the language your next role or round uses?
readyWhen:
  - You can choose between a list, a tuple, a dict and a set and say why.
  - You can write list, dict and set comprehensions without looking them up.
  - You can write a small class with type hints and a dataclass.
  - You can write a pytest test and read a traceback to the failing line.
proof:
  title: A small command-line tool in typed Python
  evidence:
    - Functions and a dataclass, all with type hints
    - Errors handled, with a clear message
    - Tests that pass under pytest
coverage:
  covered: [Core data structures, Comprehensions, Functions and classes, Type hints, Errors and files, Testing]
  partial: [Async Python, Packaging]
  outside: [Data science libraries in depth, JavaScript]
summary: >-
  For anyone who needs Python by hand: coming from JavaScript, or after letting an assistant
  write it for a while. The parts coding rounds and AI engineering actually use.
method:
  - Read the key idea, then type the example yourself in an empty file and run it.
  - Change one thing and predict the result before you run it again.
  - Answer the interview questions out loud, then read the strong answer.
shapes:
  - label: Writing under time
    text: >-
      Plain loops and clear names first, then a comprehension where it reads better. A
      correct, readable answer beats a clever one-liner that fails an edge case.
  - label: Explaining a choice
    text: >-
      Say what you picked, why, and what it costs: "a set, because membership is O(1); it
      loses the order".
days:
  - title: The core
    why: >-
      Most Python in a coding round is lists, strings, dicts and sets. Know how each behaves
      and what each operation costs.
    artifact: "The core structures, used well"
    must: [python.first-steps, python.lists-and-tuples, python.strings, python.dicts-and-sets, python.decisions-and-loops]
    tests: [{ task: lowest-free-ticket }]
  - title: Functions and iteration
    why: >-
      Comprehensions, generators and functions as values are what make Python short and
      clear. They are also what reviewers look for.
    artifact: "Pythonic functions and loops"
    must: [python.functions, python.comprehensions, python.functions-as-values]
    should: [pyai.generators-and-decorators]
    tests: [{ task: longest-nested-fragment }]
  - title: Classes, types and errors
    why: >-
      Type hints and dataclasses keep a growing program honest, and good error handling keeps
      it usable when input is wrong.
    artifact: "A typed, well-behaved module"
    must: [python.classes, python.type-hints, python.errors-and-files, python.files-and-json]
  - title: Real projects
    why: >-
      A project needs structure, dependencies and tests. This is the Python you ship, not
      the Python you type into a console.
    artifact: "A small tool with tests"
    must: [python.projects-and-uv, pyai.pytest, python.report-tool]
    should: [pyai.asyncio, pro.pythonic, pro.production-python]
    tests: [{ test: mock-c }, { task: distinct-magnitudes }]
guides: [syntax-refresher, amateur-vs-pro]
