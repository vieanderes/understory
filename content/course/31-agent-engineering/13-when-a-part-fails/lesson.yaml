    verified: true

deepDive: >-
  The breaker ran in TypeScript against a fake clock and a fake service. No agent or real
  API was called.


  **Why the arithmetic is so bad in an agent.** In a web service, three retry layers multiply
  calls to the dependency. In an agent there's a fourth: the model itself, which reads an
  error and calls the tool again. Every one of those calls fans out into the layers below. A
  breaker is what cuts the model's layer, because an instant "unavailable" gives it nothing
  to retry.


  **A deadline for the whole call.** Per-attempt timeouts aren't enough. Two retries of a
  five-second timeout, plus backoff, can take more than fifteen seconds. Give the tool call one
  overall deadline, and stop retrying when it can't fit another attempt.


  **Half-open with many callers.** The `callTool` in the challenge lets every call through
  once the cool-down ends. With one agent that's a single trial. With fifty agents sharing a
  breaker, mark the breaker as trialling so only one call goes through. Keep the shared
  state somewhere all of them can read, such as Redis.


  **Breakers and stall detection.** Stall detection from Loops that run for hours notices
  the same result coming back. An open breaker produces exactly that, so the two agree: the
  agent re-plans around the missing tool, and escalates if it can't.
