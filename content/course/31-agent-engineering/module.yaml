id: agents
number: 31
title: "Agent engineering"
summary: "Systems where a model acts over many steps and tools: the harness around it, long-running loops, context at scale, tool design, memory, orchestration, what an agent may touch, the human in the loop, agent evals and tracing."
why: "An agent that runs for hours with real tools fails in ways a single model call never does, and the harness decides how far that goes."
youCanBuild: "A budgeted, resumable agent with permission hooks, well-designed tools, scoped memory, a review queue, a pass^k eval suite and traces that find the costly run."
concepts:
  - id: agents.action-space
    title: "The action space"
    summary: "The tools, files and network an agent can reach define what it can do, and the harness, not the prompt, sets those limits."
  - id: agents.permission-modes
    title: "Permission modes and sandboxes"
    summary: "An agent runs in a sandbox with limited egress, and a permission mode decides which actions run freely, which ask first and which are refused."
  - id: agents.hooks
    title: "Hooks"
    summary: "Code that runs before or after each tool call can block, change or log the call, so rules are enforced outside the model."
  - id: agents.harness-regressions
    title: "Harness regressions"
    summary: "A change to instruction files, skills or tool lists can make an agent worse, so the harness is versioned and tested like code."
  - id: agents.run-budgets
    title: "Token, time and cost budgets"
    summary: "A long run carries budgets for tokens, wall time and money, and stops with its state saved when one runs out."
  - id: agents.stall-detection
    title: "Stall detection"
    summary: "Hashing each tool result shows when an agent keeps getting the same answer, so the harness re-plans or escalates instead of looping."
  - id: agents.checkpoint-and-resume
    title: "Checkpoint and resume"
    summary: "The run saves its state after each step and uses the tool-call id as an idempotency key, so a resumed run never repeats a side effect."
  - id: agents.generator-evaluator
    title: "Generator and evaluator"
    summary: "One model call produces work and another checks it against criteria, and the loop continues until the check passes or the budget ends."
  - id: agents.context-rot
    title: "Context rot"
    summary: "As the context grows, a model attends less reliably to what matters, especially to facts lost in the middle of a long history."
  - id: agents.compaction
    title: "Compaction"
    summary: "Older turns are summarised into a short state note under a token budget, keeping decisions and open tasks and dropping the rest."
  - id: agents.just-in-time-retrieval
    title: "Just-in-time retrieval"
    summary: "An agent keeps references such as file paths in context and loads the content only when a step needs it."
  - id: agents.tool-granularity
    title: "Consolidated and granular tools"
    summary: "One tool that does a whole task the way people think of it beats many thin API wrappers the model must chain correctly."
  - id: agents.actionable-tool-errors
    title: "Actionable tool errors"
    summary: "A tool error says what went wrong and what to try next, and results are paged and trimmed, so the model can recover cheaply."
  - id: agents.session-identity
    title: "Identity from the session"
    summary: "A tool takes the user and tenant from the authenticated session, never from arguments the model writes."
  - id: agents.read-write-split
    title: "Read and write tools"
    summary: "Reading tools and writing tools are kept apart and annotated, so writes can be gated, confirmed and audited separately."
  - id: agents.memory-types
    title: "Kinds of memory"
    summary: "Short-term memory lives in the context, and long-term memory stores episodes, facts and procedures in files or a vector store."
  - id: agents.memory-write-policies
    title: "Memory write policies"
    summary: "Rules decide what is worth remembering, merge duplicates, update facts that changed and forget what expired."
  - id: agents.memory-staleness
    title: "Stale memories"
    summary: "A remembered fact carries its source and date and is checked before use, because the world may have changed since."
  - id: agents.memory-poisoning
    title: "Memory poisoning and scope"
    summary: "Untrusted content written to memory can steer every later run, so memory is scoped per user or tenant and writes are filtered."
  - id: agents.chaining-and-routing
    title: "Chaining, routing and parallel calls"
    summary: "Fixed patterns such as a chain of calls, a router, parallel sections or voting solve most tasks without a free-running agent."
  - id: agents.orchestrator-workers
    title: "Orchestrator and workers"
    summary: "An orchestrator splits a task, hands parts to workers with their own context, and combines what they return."
  - id: agents.multi-agent-cost
    title: "The cost of many agents"
    summary: "Every extra agent multiplies tokens and failure points, so a fan-out has a cap on workers and a shared budget."
  - id: agents.least-privilege-tools
    title: "Least privilege per tool"
    summary: "Each tool gets only the access its job needs, scoped to the user, so a misled agent can do little harm."
  - id: agents.indirect-injection
    title: "Indirect prompt injection"
    summary: "Instructions hidden in a web page, file or tool result can steer an agent, so tool output is treated as data, never as commands."
  - id: agents.lethal-trifecta
    title: "The lethal trifecta"
    summary: "An agent with private data, untrusted content and a way to send data out can be made to leak, so one of the three is removed."
  - id: agents.audit-log
    title: "Spend limits and audit logs"
    summary: "Every action an agent takes is logged with who, what and why, and spending stops at a hard limit."
  - id: agents.review-queues
    title: "Risk-ranked review queues"
    summary: "Proposed actions reach people ranked by risk and shown as diffs with sources, so reviewers spend attention where it matters."
  - id: agents.interrupt-and-resume
    title: "Interrupt and resume"
    summary: "A run pauses at an approval point or a clarifying question, waits for a person, and resumes from saved state."
  - id: agents.automation-bias
    title: "Automation bias"
    summary: "People approve what a confident system proposes, so the interface shows uncertainty and keeps each reviewer's workload realistic."
  - id: agents.corrections-as-labels
    title: "Corrections as ground truth"
    summary: "Every edit a reviewer makes is stored as a labelled example, which feeds evals and future improvements."
  - id: agents.outcome-vs-trajectory
    title: "Outcome and trajectory"
    summary: "An outcome eval checks the end state, and a trajectory eval checks the steps and tool calls that led there."
  - id: agents.pass-at-k
    title: "pass@k"
    summary: "pass@k is the chance that at least one of k attempts succeeds, which suits tasks where a person picks the best try."
  - id: agents.pass-hat-k
    title: "pass^k"
    summary: "pass^k is the chance that all k attempts succeed, which measures how reliably an agent does the task every time."
  - id: agents.repeated-trials
    title: "Repeated trials and variance"
    summary: "An agent eval runs each task several times in a real environment, because one run hides how much the results vary."
  - id: agents.agent-spans
    title: "Spans per step and tool"
    summary: "A trace has one span per model call and tool call, tagged with prompt and harness versions, so a run can be read and replayed."
  - id: agents.cost-per-run
    title: "Cost per run and tenant"
    summary: "Token use is added up per run and per tenant, so one runaway loop or one heavy customer shows up at once."
  - id: agents.agent-error-taxonomy
    title: "An error taxonomy for agents"
    summary: "Failures are sorted into kinds such as hallucination, tool misuse, loops, refusals and truncation, so trends and fixes have names."
  - id: agents.agent-replay
    title: "Replay and drift"
    summary: "A stored trace can be replayed against a new version, and changes in behaviour over time are watched as drift."
