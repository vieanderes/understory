id: js.references-and-copying
title: References, copying and immutability
objective: Predict which changes two variables share, and update data without changing the original.
level: essential
minutes: 10
concepts: [js.references, js.copying, js.immutable-updates]
prerequisites: [js.closures]
opening:
  text: >-
    You'll know when two variables are secretly the same object. That's the bug where editing
    a draft quietly rewrites the original data.

steps:
  - type: prose
    id: values-and-references
    body: >-
      A variable never holds an object. It holds a **reference**, a pointer to one object
      somewhere in memory.


      Assigning, passing an argument and returning all copy that pointer. Two names with the
      same pointer are aliases, and a change through one shows through the other. So `===`
      and `includes` on objects ask "the same object?", never "the same contents?".

  - type: predict-output
    id: predict-alias
    concept: js.references
    difficulty: 1
    language: js
    code: |
      const catalogue = { lamp: { price: 45 } };
      const line = catalogue.lamp;
      line.price = 40;
      console.log(catalogue.lamp.price);
    question: A basket line was taken from the catalogue, then discounted. What does this log?
    choices:
      - text: '`40`'
        correct: true
        feedback: >-
          Right. Line 2 didn't make a second object. Both names point at one.
      - text: '`45`'
        feedback: >-
          Most people pick this. But assignment copies the pointer, not the object. There's
          still only one lamp.
      - text: A `TypeError`, because `line` is a `const`
        feedback: >-
          `const` stops you reassigning `line`. It doesn't freeze what the object holds.

  - type: ai-review
    id: review-duplicate-check
    concept: js.references
    difficulty: 2
    language: js
    request: Add a product to the basket, but never the same product twice.
    flawClass: logic
    code: |
      function addToBasket(basket, product) {
        if (basket.includes(product)) {
          return basket;
        }
        return [...basket, product];
      }
      const basket = [{ id: 7, name: "Lamp" }];
      // The shop sends a fresh object each time someone taps Add
      console.log(addToBasket(basket, { id: 7, name: "Lamp" }).length); // 2
    prompt: >-
      An assistant wrote this, and its own test passed. In the shop, tapping Add twice puts two
      lamps in the basket. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`includes` asks for the same object, not the same contents'
        correct: true
        feedback: >-
          Right. Compare what identifies a product: `basket.some((item) => item.id === product.id)`.
      - text: Spread on line 5 copies the lamp twice
        feedback: >-
          Spread adds each item once. Line 5 only runs because the check on line 2 said no.
      - text: '`includes` only works on strings'
        feedback: >-
          Arrays have `includes` too. It found no match because it compared pointers.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'Adding a fresh object with the same id'
          correct: true
          feedback: >-
            Right. That's what the shop does on every tap.
        - text: 'Adding the very same object twice'
          feedback: >-
            That passes, because `includes` finds the same object. The shop never sends it.
        - text: 'Adding two different products'
          feedback: >-
            Both should go in, and they do. The duplicate case stays untested.
    fix: |
      function addToBasket(basket, product) {
        if (basket.some((item) => item.id === product.id)) {
          return basket;
        }
        return [...basket, product];
      }

  - type: prose
    id: shallow-and-deep-copies
    body: >-
      Spread makes a new object, so `{ ...basket }` is a real copy. But it copies one level
      only. A property that holds an array or object is copied as a pointer, so both copies
      share it. That's a **shallow copy**.


      `structuredClone(basket)` makes a **deep copy**: it copies every level, and shares
      nothing with the original.

  - type: predict-output
    id: predict-shallow-spread
    concept: js.copying
    difficulty: 3
    language: js
    code: |
      const basket = { owner: "guest", lines: [{ item: "lamp", quantity: 1 }] };
      const draft = { ...basket };
      draft.owner = "member";
      draft.lines[0].quantity = 4;
      console.log(basket.owner, basket.lines[0].quantity);
    question: The draft hasn't been saved. What does this log?
    choices:
      - text: '`guest 4`'
        correct: true
        feedback: >-
          Right. The owner is copied, but both baskets share the same lines array.
      - text: '`guest 1`'
        feedback: >-
          Spread copies one level only. `draft.lines === basket.lines` is true.
      - text: '`member 4`'
        feedback: >-
          The draft is a new object, so its own owner stays on it. Only what's nested is shared.

  - type: playground
    id: fix-shared-playlist
    concept: js.copying
    difficulty: 2
    prompt: >-
      Adding a song to the draft also changed the saved playlist. Both now say 4 songs. Make
      the draft a copy, so the saved playlist keeps its 3.
    html: |
      <h1>Road trip playlist</h1>
      <p id="saved"></p>
      <p id="draft"></p>
    js: |
      const saved = ["Sunrise", "Open road", "Rest stop"];
      const draft = saved;
      draft.push("Home again");

      document.querySelector("#saved").textContent = "Saved: " + saved.length + " songs";
      document.querySelector("#draft").textContent = "Draft: " + draft.length + " songs";
    editable: [js]
    checks:
      - label: The saved playlist still has 3 songs
        selector: '#saved'
        text: 3 songs
      - label: The draft has 4 songs
        selector: '#draft'
        text: 4 songs
    solution:
      js: |
        const saved = ["Sunrise", "Open road", "Rest stop"];
        const draft = [...saved];
        draft.push("Home again");

        document.querySelector("#saved").textContent = "Saved: " + saved.length + " songs";
        document.querySelector("#draft").textContent = "Draft: " + draft.length + " songs";
    hints:
      - Line 2 copies a pointer, so there's still one array.
      - Spread builds a new array with the same songs.
      - 'Write `const draft = [...saved];`'

  - type: prose
    id: update-without-mutation
    body: |-
      An **immutable update** leaves the old data alone and builds a new version with the
      change:

      ```js
      const next = [...songs, "Encore"];
      const renamed = { ...song, title: "Encore" };
      ```

      Anyone holding the old version still sees the old version. And one `===` tells you
      whether anything changed, which is how many pages decide when to redraw.

  - type: bug-hunt
    id: hunt-mutating-reducer
    concept: js.immutable-updates
    difficulty: 3
    language: js
    code: |
      function addSong(playlist, song) {
        playlist.push(song);
        return playlist;
      }
      const before = ["Sunrise", "Rest stop"];
      const after = addSong(before, "Open road");
      console.log(after.length, before === after); // 3 true
    prompt: >-
      The page redraws the list only when `before !== after`. The data has the new song, but
      the screen doesn't. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`push` changes the old list in place'
        correct: true
        feedback: >-
          Right. Old and new are one array, so the check sees no change.
      - text: '`push` turns `playlist` into a number'
        feedback: >-
          It returns the new length, but line 2 throws that away. The array is still an array.
      - text: '`===` compares the contents of arrays'
        feedback: >-
          For arrays it compares identity. That's why it says `true` here.
    fix: |
      function addSong(playlist, song) {
        return [...playlist, song];
      }

  - type: code-challenge
    id: write-set-quantity
    concept: js.immutable-updates
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `setQuantity(cart, ticket, quantity)` as an immutable update. A cart has an `owner`
      and `lines`, and each line has a `ticket` and a `quantity`.


      Return a new cart where that line has the new quantity. A quantity of `0` drops the line.
      The old cart, its array and its lines must not change. Unchanged lines must be the same
      objects. If no line matches, return the cart as it is.


      Example: a cart holds 1 day ticket and 2 camping tickets. Setting the day ticket to 3 gives
      a new cart. Its camping line `===` the old one.
    hints:
      - >-
        Three things sit on the path to the change: the cart, the array and one line. Each needs
        a copy. Nothing else does.
      - >-
        `filter` builds the array without a line. `map` builds one where a single line is
        replaced by `{ ...line, quantity }`.
      - >-
        Return early with `if (!cart.lines.some((line) => line.ticket === ticket))`, then end
        with `return { ...cart, lines };`.

  - type: explain-back
    id: explain-catalogue-change
    concept: js.references
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: |-
      ```js
      const catalogue = { lamp: { price: 45 } };
      const line = catalogue.lamp;
      line.price = line.price - 5;
      console.log(catalogue.lamp.price); // 40
      ```

      Discounting one basket line changed the catalogue for everyone. Why, and why wouldn't
      `{ ...catalogue }` have saved you?
    rubric:
      - The line and the catalogue entry are the same object, since assignment copies a pointer.
      - Spread copies one level, so the copy still points at the same nested objects.
      - Copy the object you're changing, as in `{ ...item, price }`.
    modelAnswer: >-
      A variable holds a pointer to an object. Taking the line from the catalogue copied that
      pointer, so both names meant one object. The discount then wrote to it. `{ ...catalogue }`
      copies the top level only, and its entries still point at the same items. Build the line
      as `{ ...item, price: item.price - 5 }` instead.

recap:
  - Spot when two names point at one object.
  - Predict which changes cross a shallow copy, and reach for `structuredClone` for a deep one.
  - Update nested data with spread, `map` and `filter`, without touching the original.

recall:
  - id: card-assignment-copies
    concept: js.references
    front: What does `const line = catalogue.lamp` copy?
    back: >-
      The pointer, not the object. Both names mean the same object, so a change through one
      shows in the other.
  - id: card-object-equality
    concept: js.references
    front: 'Why is `{ item: "lamp" } === { item: "lamp" }` false?' 
    back: >-
      `===` on objects asks whether both sides are the same object. These are two objects with
      the same contents.
  - id: card-shallow-shares
    concept: js.copying
    front: After `const draft = { ...basket }`, which changes reach the original?
    back: >-
      Changes to nested objects, which are shared. Changes to the draft's own top-level
      properties stay on the draft.
  - id: card-immutable-path
    concept: js.immutable-updates
    front: Which objects do you copy for an immutable update?
    back: >-
      Only those on the path to the change. Everything else is reused, which keeps it cheap.

references:
  - kind: docs
    title: Equality comparisons and sameness
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness
    note: Why two identical-looking objects are never equal.
    primary: true
    verified: true
  - kind: docs
    title: Spread syntax (...)
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax
    note: Copying objects and arrays one level deep.
    verified: true
  - kind: docs
    title: 'Window: structuredClone() method'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/structuredClone
    note: What the deep copy supports, and what it throws on.
    primary: true
    verified: true

deepDive: >-
  `structuredClone` copies plain data: objects, arrays, dates, maps, sets, even cycles. It
  refuses functions. An object with a method makes the whole call throw a `DataCloneError`,
  and a class instance comes back as a plain object. An older trick,
  `JSON.parse(JSON.stringify(value))`, drops functions in silence and turns dates into text.


  `Object.freeze` is shallow as well. It stops changes to the object's own properties, and
  nested objects stay editable. A deep freeze walks the structure and freezes each level,
  which is why test suites often have one.


  Immutable updates make change detection cheap. Comparing two pointers takes one step,
  while comparing two large trees does not. Reusing the parts that didn't change is called
  structural sharing: a new version of a big tree costs only the objects along one path.
