term: semantic HTML
aka:
  - semantic elements
  - semantic markup
short: Using the HTML element that matches what the content is, not only how it should look.
explain: |
  A `div` with a click handler can look exactly like a button. But a screen reader won't announce it and the keyboard can't reach it. To a search engine it's one more box.

  The right element brings behaviour for free. `button` is focusable and works with Enter
  and Space. `nav`, `main` and `header` become landmarks people can jump between. Headings
  in order form an outline. Pick by meaning first, then style it however you like.
analogy: Labelling boxes when you move house. "Kitchen, fragile" helps everyone; a pile of plain brown boxes helps nobody.
example:
  language: html
  code: |
    <!-- no meaning -->
    <div class="btn" onclick="save()">Save</div>

    <!-- meaning, focus and keyboard for free -->
    <button type="button" onclick="save()">Save</button>
usage: Swap the clickable div for a real button; semantic HTML gives you keyboard support for nothing.
twin:
  term: aria
  difference: Semantic HTML uses elements that already carry meaning and behaviour. ARIA attributes only change what assistive technology is told, and add no behaviour, so they're the fallback when no element fits.
related:
  - aria
level: 1
