term: Largest Contentful Paint
aka: [LCP]
short: The time from starting to load a page until its biggest image or text block appears on screen.
explain: |
  A page can show a logo quickly and still leave the visitor waiting for the thing they
  came for. This measure waits for the biggest element in view, usually a hero image or a
  headline.

  Good is 2.5 seconds or less. A slow one usually comes from a slow server reply, a
  render-blocking stylesheet, or the main image being found late. Lazy-loading the main
  image is a classic own goal: give it a size and `fetchpriority="high"` instead.
analogy: Judging a delivery by when the sofa arrives, not when the first leaflet drops through the letterbox.
example:
  language: html
  code: |
    <img src="/hero.avif" width="1200" height="600"
         fetchpriority="high" alt="Mountain lake at dawn">
usage: The hero image is lazy-loaded, which is why our Largest Contentful Paint is four seconds.
twin:
  term: first-contentful-paint
  difference: First Contentful Paint is when anything appears at all. Largest Contentful Paint is when the biggest thing appears, which is closer to "the page is useful".
related: [core-web-vitals, first-contentful-paint, lazy-loading, render-blocking, critical-rendering-path]
level: 2
lessons: [perf.web-vitals]
