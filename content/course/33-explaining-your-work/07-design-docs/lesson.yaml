id: explain.design-docs
title: A one-page design doc
objective: Write a one-page design doc with the problem, goals and non-goals, options, the decision, the rollout and the risks.
level: advanced
minutes: 10
concepts: [explain.one-page-design-doc, explain.rollout-and-risks]
prerequisites: [judgment.trade-offs, explain.explaining-a-decision]
opening:
  text: >-
    You'll write one page that lets people disagree with your plan before you build it.
    An hour of argument over a page saves a week of argument over code.

steps:
  - type: prose
    id: one-page
    body: >-
      You want to replace a recipe app's search. Before any code, you write one page.


      A **design doc** gives the problem, what you will and won't do, the options, your
      decision and how it ships. An ADR records a decision once it's made. A design doc
      invites the argument before it, while changing course costs a comment, not a rewrite.

  - type: multiple-choice
    id: pick-problem
    concept: explain.one-page-design-doc
    difficulty: 1
    question: Which problem statement can a reviewer check?
    choices:
      - text: We should move search to a search service.
        feedback: >-
          That's a solution dressed as a problem. Reviewers can't weigh options against it.
      - text: Search is bad, and users are unhappy.
        feedback: >-
          A feeling, with nothing to measure. How would you know the new search is better?
      - text: 1 in 5 searches find nothing, even "curry".
        correct: true
        feedback: >-
          Yes. A number to check now, and to beat later.
      - text: Postgres full-text search is the modern choice.
        feedback: >-
          A technology isn't a problem. Start with what's wrong for users.

  - type: parsons
    id: arrange-design-doc
    concept: explain.one-page-design-doc
    difficulty: 2
    language: text
    prompt: >-
      Put this one-page design doc in order. One line doesn't belong.
    blocks:
      - id: problem
        code: 'Problem: 1 in 5 searches find nothing, even "curry".'
        subgoal: Problem
      - id: goals
        code: 'Goals: match plurals and word order; results in under 300 ms.'
        subgoal: Goals and non-goals
      - id: non-goals
        code: 'Non-goals: typo correction and personal ranking, for now.'
        subgoal: Goals and non-goals
      - id: options
        code: 'Options: better LIKE queries, Postgres full-text, a search service.'
        subgoal: Options considered
      - id: decision
        code: 'Decision: Postgres full-text search. We accept weaker typo handling.'
        subgoal: Decision and trade-off
      - id: rollout
        code: 'Rollout: 10% of searches first, with the old search kept.'
        subgoal: Rollout
      - id: risks
        code: 'Risks: ranking may feel worse. Open: do we search ingredients?'
        subgoal: Risks and open questions
    distractors:
      - id: code
        code: 'Appendix: the complete search module, all 600 lines.'
        feedback: >-
          Reviewers need the reasoning, on one page. Code comes after the argument, in a pull
          request.

  - type: prose
    id: non-goals
    body: >-
      **Non-goals** are the most underrated lines in a doc. *No typo correction yet* stops a
      reviewer asking for it, and stops you building it.


      Goals carry the opposite job too. Anything users rely on today, such as saved
      searches, belongs there as *still works*. Otherwise nobody checks it.

  - type: fill-blank
    id: fill-goals
    concept: explain.one-page-design-doc
    difficulty: 2
    language: yaml
    prompt: >-
      Fill the gaps: one goal that protects what users rely on, and one thing you won't build
      yet.
    template: |
      goals:
        - "chickpea curries" finds chickpea curry
        - results in under 300 ms
        - {{1}}
      non-goals:
        - ranking by what you've cooked before
        - {{2}}
    blanks:
      - key: '1'
        answer: saved searches keep working
      - key: '2'
        answer: typo correction
    bank:
      - saved searches keep working
      - typo correction
      - make search much better
      - use Postgres full-text search

  - type: bug-hunt
    id: hunt-bare-decision
    concept: explain.one-page-design-doc
    difficulty: 3
    language: yaml
    code: |
      problem: 1 in 5 searches find nothing, even "curry"
      goals: match plurals and word order; results under 300 ms
      non-goals: typo correction, personal ranking
      options: better LIKE queries, Postgres full-text, a search service
      decision: Postgres full-text search, as it's the best option
      rollout: 10% of searches first, then everyone
    prompt: >-
      In review, three people ask "why not the search service?" The thread reaches 40
      comments. Tap the line that invited it.
    lines: [5]
    reasons:
      - text: It gives no reason and no cost
        correct: true
        feedback: >-
          Right. Say why, and what you give up, and the thread has less to ask.
      - text: Three options are too many
        feedback: >-
          Three is healthy. One option looks decided in advance, and reviewers push harder.
      - text: The non-goals should be longer
        feedback: >-
          Two clear non-goals do the job. The decision line is what left room for 40 comments.
      - text: The rollout should come first
        feedback: >-
          Rollout follows the decision it ships. The order here is right.
    fix: |
      decision: Postgres full-text search. Nothing new to run, and our data
        fits it. We accept weaker typo handling than a search service.

  - type: prose
    id: rollout-and-risks
    body: >-
      A doc says how the change ships, not only what you'll build. The **rollout** says who
      gets it first, how you'd notice trouble, and how you'd go back.


      A **feature flag** helps here: a setting that turns new code on for some users. Keep
      every step a two-way door until the last. Then list the risks, and the questions you
      haven't answered yet.

  - type: ai-review
    id: review-rollout
    concept: explain.rollout-and-risks
    difficulty: 4
    language: yaml
    request: Write the rollout section for the new recipe search.
    flawClass: regression
    code: |
      rollout:
        1: build the full-text index without blocking recipe saves
        2: new app versions call /recipes/search, flagged on for 10%
        3: compare empty results and speed for a week
        4: flag on for everyone
        5: delete the old /search endpoint and its code
      rollback: turn the flag off
    prompt: >-
      Reviewers approved it in a day. A month after step 5, people on older app versions say
      search has vanished. Tap the line at fault.
    lines: [6]
    reasons:
      - text: Older app versions still call /search
        correct: true
        feedback: >-
          Right. Old apps still use that address, and no flag brings it back.
      - text: 10% is too large a first step
        feedback: >-
          10% for a week is a common start. The harm came from what step 5 removed.
      - text: The index should block saves to be safe
        feedback: >-
          Blocking saves would hurt every cook during the build. Line 2 avoids that on
          purpose.
      - text: A week is too short to compare
        feedback: >-
          A week covers weekday and weekend searches. The failure came later, from step 5.
    fix: |
      5: keep /search, serving the new results, until no app version calls it
    verify:
      question: Which check would have caught this before step 5?
      choices:
        - text: Run the new search's test suite
          feedback: >-
            Those tests prove the new search works. They can't see who still calls the old
            one.
        - text: Count calls to /search by app version
          correct: true
          feedback: >-
            Yes. If any version still calls it, it isn't safe to delete.
        - text: Load test the new search endpoint
          feedback: >-
            Speed was never the problem. The old address had callers nobody counted.
        - text: Ask reviewers to approve it again
          feedback: >-
            They read it once and missed it. The logs know who calls what.

  - type: explain-back
    id: answer-the-reviewer
    concept: explain.rollout-and-risks
    difficulty: 4
    audience: reviewer
    kind: risk
    prompt: >-
      A reviewer comments on your doc: "What could go wrong with this rollout, and how will
      you know?" Answer them. Say it out loud first, then type it.
    rubric:
      - It names at least two concrete risks, such as worse ranking for common searches or slower recipe saves.
      - It says how each would be noticed, such as empty results, clicks or save times compared between groups.
      - It says what happens then, such as turning the flag off, and which step can't be undone.
    modelAnswer: >-
      Two risks. Ranking could feel worse for common searches like "pasta", even with fewer
      empty results. We'll compare clicks on the first result between the two groups. And
      the index could slow recipe saves, so we'll watch save times during the 10% week.
      Either way, we turn the flag off. The only one-way step is removing the old search, so
      it waits until nothing calls it.

  - type: explain-back
    id: when-to-write-one
    concept: explain.one-page-design-doc
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks: "When would you write a design doc, and when would you skip it?"
      Make the call and defend it. Try it out loud before you type.
    rubric:
      - Write one when a change is hard to undo, touches other teams, or will draw disagreement.
      - Skip it for a two-way door, where a small pull request answers the question faster.
      - It names the cost, such as a day's writing and a doc going stale, and keeps it to a page.
    modelAnswer: >-
      I write one when a change is a one-way door, touches other teams, or will draw
      disagreement. Arguing over a page costs an hour; arguing over merged code costs a week.
      For a two-way door, like a new lint rule, a small pull request is faster. A doc costs a
      day and goes stale, so I keep it to one page. Once we decide, an ADR records the
      outcome.

recap:
  - A design doc gives the problem, goals and non-goals, options, the decision and its trade-off.
  - It says how the change ships, how you'd notice trouble and how you'd go back.
  - Keep it to one page, so reviewers argue before the code exists.

recall:
  - id: card-sections
    concept: explain.one-page-design-doc
    front: What goes in a one-page design doc?
    back: >-
      The problem, goals and non-goals, the options, the decision with its trade-off, the
      rollout, and the risks and open questions.
  - id: card-non-goals
    concept: explain.one-page-design-doc
    front: What do non-goals do in a design doc?
    back: >-
      They say what you won't build, so nobody asks for it in review and you don't build it
      by accident.
  - id: card-rollout
    concept: explain.rollout-and-risks
    front: What should a rollout section answer?
    back: >-
      Who gets the change first, how you'd notice trouble, and how you'd go back, step by
      step.
  - id: card-last-step
    concept: explain.rollout-and-risks
    front: Which rollout step deserves the most care, and why?
    back: >-
      The one-way step, such as deleting the old path. Check nothing still uses it, because
      no flag undoes it.

references:
  - kind: essay
    title: Design Docs at Google
    authors: Malte Ubl
    year: 2020
    venue: Industrial Empathy
    url: https://www.industrialempathy.com/posts/design-docs-at-google/
    note: Goals and non-goals, alternatives considered, and when a design doc isn't worth writing.
    primary: true
    verified: false
  - kind: spec
    title: 'PEP 1: PEP Purpose and Guidelines'
    authors: Barry Warsaw, Jeremy Hylton, David Goodger and Alyssa Coghlan
    year: 2000
    venue: Python Enhancement Proposals
    url: https://peps.python.org/pep-0001/
    note: A long-running public design-doc process, with sections for rationale, rejected ideas and backwards compatibility.
    primary: true
    verified: false
  - kind: essay
    title: 'Painless Functional Specifications, Part 1: Why Bother?'
    authors: Joel Spolsky
    year: 2000
    venue: Joel on Software
    url: https://www.joelonsoftware.com/2000/10/02/painless-functional-specifications-part-1-why-bother/
    note: Why changing a written design is cheap and changing code is not.
    verified: false

deepDive: >-
  Teams call these docs different things: design docs, RFCs, tech specs, one-pagers. Python
  calls its version a PEP, and every one has a section for rejected ideas. That section
  saves the next reader from proposing the same thing again.


  A doc fails in two opposite ways. It can be too vague to argue with, like "improve
  search". Or it can be an implementation plan nobody can review in one sitting. One page
  is a forcing function: if it doesn't fit, the change is probably two changes.


  Ask reviewers for something specific: "Does the rollout protect old app versions?" gets
  a better answer than "Thoughts?" And give the review an end date. When it closes, the
  decision goes into an ADR, and the doc becomes history. Keep it, but stop updating it.
