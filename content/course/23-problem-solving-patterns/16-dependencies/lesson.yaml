deepDive: >-
  **The depth-first alternative.** Colour every job white. Visiting a job turns it grey,
  visits everything it unlocks, then turns it black and adds it to a list. Reverse the
  list for the order. Meeting a grey job means you've looped back into the current path: a
  cycle. It's compact, but recursion 100,000 deep overflows the JavaScript stack, so
  Kahn's queue is the safer default in a timed test.


  **A job scheduler round.** "Run jobs with dependencies" is a common live and take-home
  task. The usual levels: order them, then detect a cycle and name it. Then run independent
  jobs in parallel with a concurrency limit. The stages in this lesson's challenge are
  exactly the parallel batches. Say your tie-break out loud: alphabetical needs a sort per
  stage, or a min-heap if jobs become ready one at a time.


  **The queue trap.** `shift()` in a loop is O(n²), as the stacks lesson showed. Read by a
  `head` index in JavaScript, or use `deque` in Python.


  **Union-find, for "are these connected?".** A different dependency question: which items
  end up in one group, like accounts that share an email. Each item points at a parent;
  follow parents to a root, which names the group. Join two groups by pointing one root at
  the other. Two tricks keep it fast: path compression points everything you passed
  straight at the root, and union by size hangs the smaller group under the bigger. Then
  each operation is close to constant time. It can't undo a link, so use it only when links are only ever added.
