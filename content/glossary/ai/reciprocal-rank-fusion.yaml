term: reciprocal rank fusion
aka:
  - RRF
  - rank fusion
short: Merging several ranked lists by adding up one over each item's position plus a constant.
explain: |
  You have two ranked lists, one from keyword search and one from vector search. Their
  scores are on different scales, so you can't add them.

  Use positions instead. Each document gets `1 / (k + rank)` from every list it appears
  in, and the sums decide the final order. `k` is often 60, which stops a single first
  place from dominating.

  No tuning or normalising is needed, which is why it's the usual default. A document
  that ranks fairly well in both lists beats one that tops only one.
analogy: Judges at a talent show who each rank the acts. You add up positions, not their very different marks.
example:
  language: js
  code: |
    function fuse(lists, k = 60) {
      const score = new Map();
      for (const list of lists) {
        list.forEach((id, i) => {
          score.set(id, (score.get(id) ?? 0) + 1 / (k + i + 1));
        });
      }
      return [...score].sort((a, b) => b[1] - a[1]).map(([id]) => id);
    }
usage: Merge the keyword and vector results with reciprocal rank fusion; the scores aren't comparable.
