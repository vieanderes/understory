deepDive: >-
  `type` and `interface` overlap almost completely for object shapes. An interface can be
  reopened: declare it twice and the two merge, which is how libraries extend the browser's own
  types. A `type` can name things an interface can't, such as `string | number`. Both are
  erased.


  `Array<number>` means the same as `number[]`. You'll see the angle-bracket form in the
  Generics lesson.


  Return types are inferred too. Many teams still write them on exported functions, so a
  mistake inside the body is reported there, not at every caller.


  A template string accepts `undefined` without a word from the checker, and so does
  `String(value)`. A linter, which you'll meet in the Tooling chapter, can be set to flag it.
