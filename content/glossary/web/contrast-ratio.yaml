term: contrast ratio
aka: [colour contrast, color contrast]
short: How far apart two colours are in lightness, written as a ratio such as 4.5 to 1.
explain: |
  Pale grey text on white can look elegant and be hard to read. It's hard for everyone on a
  sunny screen, and always for people with low vision. This ratio puts a number on it: 1 to
  1 is no difference, and 21 to 1 is black on white.

  WCAG AA asks for 4.5 to 1 for body text. Large text, icons and the edges of controls
  need 3 to 1. Check both light and dark themes, and the hover and focus states too.
analogy: Reading a road sign at dusk. White on dark green carries, while grey on a slightly darker grey does not.
usage: The hint text has a contrast ratio of 2.8 to 1, which fails AA, so darken it a step.
related: [wcag, design-token, placeholder, focus-indicator]
level: 2
lessons: [design.contrast-colour-and-motion]
