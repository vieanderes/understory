deepDive: >-
  **The warning.** A `value` with no `onChange` makes React say: "You provided a `value` prop
  to a form field without an `onChange` handler. This will render a read-only field." Use
  `defaultValue` when you only want a starting text, or add `readOnly` on purpose.


  **Before actions.** You'd write `onSubmit`, call `event.preventDefault()`, and build `new
  FormData(event.currentTarget)` yourself. That still works, and you'll see it in older code.


  **A third value.** `useActionState` also returns `isPending` as its third item, for when
  the pending state is needed outside the form.


  **Feeling instant.** `useOptimistic` shows the expected result, like a new comment, while
  the action is still running, and drops it when the action ends.


  **On the server.** In a framework such as Next.js, the same `<form action={fn}>` can call a
  function that runs on the server. The form can then submit even before the page's
  JavaScript has loaded.
