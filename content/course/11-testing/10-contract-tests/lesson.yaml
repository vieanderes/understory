deepDive: >-
  The verification outputs here came from Pact JS 17.1.4 on Node 24, run against a small
  local provider. Renaming `total` failed with `Actual map is missing the following keys:
  total`. Returning `"12.99"` failed with `Expected '12.99' (String) to be an integer`. Adding
  a `status` field passed. And the exact-value contract failed on data the provider was free
  to change.


  Provider states (`given`) let the provider set up data before each interaction, so the
  contract doesn't depend on what happens to be in a shared database. A contract checks shape
  and meaning at the boundary. It won't catch a provider bug that returns the right shape with
  the wrong total, which is what the provider's own tests are for.
