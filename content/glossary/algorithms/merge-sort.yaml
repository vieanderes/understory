term: merge sort
aka: [mergesort]
short: Sorting by splitting a list in half, sorting each half, then zipping the halves together in order.
explain: |
  Two sorted piles are quick to combine. Compare the top of each, take the smaller, repeat.
  So split the list until each piece has one item, which is already sorted, then merge.

  There are log n levels of splitting and each level merges n items, so it's O(n log n)
  every time. No input makes it worse. It's also stable.

  The cost is memory: merging needs an O(n) buffer. It suits linked lists, huge files read
  in chunks and anywhere a guaranteed worst case matters.
analogy: Two people each sort half a deck of cards. Then they build one pile by always taking the lower top card.
example:
  language: js
  code: |
    function mergeSort(xs) {
      if (xs.length <= 1) return xs;
      const mid = xs.length >> 1;
      const a = mergeSort(xs.slice(0, mid)), b = mergeSort(xs.slice(mid));
      const out = [];
      let i = 0, j = 0;
      while (i < a.length && j < b.length) out.push(a[i] <= b[j] ? a[i++] : b[j++]);
      return out.concat(a.slice(i), b.slice(j));
    }
usage: Merge sort gives us O(n log n) even on the adversarial test, and it keeps ties in order.
twin:
  term: quicksort
  difference: Merge sort splits blindly and does its work while merging, always O(n log n) with extra memory. Quicksort does its work while splitting around a pivot, in place, and can degrade to O(n²).
related: [quicksort, stable-sort, recursion, time-complexity]
level: 2
lessons: [cs.searching-and-sorting]
