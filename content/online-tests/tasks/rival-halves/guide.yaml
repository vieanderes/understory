approach: >-
  Work out, for every prefix, whether it has a favourite and which song it is, in one pass:
  keep a count per song and a Boyer-Moore candidate. If a prefix has a favourite, the
  candidate is it, so one count look-up confirms it. Run the same pass over the reversed log
  to get every suffix. Then each split point is two look-ups and a comparison.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      **N up to 100,000** and **efficient** mean you cannot recount both parts at every split:
      that is O(N²). You need each part's favourite for every split, prepared in advance.

      Note the values can be **negative** and huge, so they cannot index an array.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      "Favourite" is what textbooks call a leader. Using the standard word in your comment
      helps you recall the standard tools.
    code:
      ts: |-
        // Count split points where prefix and suffix both have a leader (> half) and they differ.
      python: |-
        # Count split points where prefix and suffix both have a leader (> half) and they differ.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 3
    body: |-
      - a single caller, so there is no split point;
      - two different songs, one split;
      - two equal songs, a shared favourite;
      - the extreme values;
      - no favourite on one side;
      - a long block of each song.
    input:
      - "[1]"
      - "[1, 2]"
      - "[3, 3]"
      - "[-1000000000, 1000000000]"
      - "[1, 2, 3]"
      - "[1, 1, 1, 2, 2, 2]"
  - kind: ask-ai
    title: Confirm one rule, not the method
    minutes: 1
    body: |-
      "More than half" versus "at least half" changes answers on even lengths. Settle it with
      one question rather than a guess.
    prompt: >-
      Without solving it: in this task, does [5, 7] have a favourite? Answer yes or no and
      give the rule in one sentence.
    expect: No, because a favourite needs strictly more than half of the requests.
  - kind: plan
    title: Bank correctness with a direct version
    minutes: 2
    body: |-
      For each split, count songs in both parts with a map and look for one above half. It is
      O(N²), so it fails the large tests, but it is short, obviously right and gives you a
      reference.
  - kind: write
    title: Write the direct version yourself
    minutes: 5
    body: |-
      Type the counting helper and the loop yourself. Run it before you optimise.
    code:
      ts: |-
        // Count split points where prefix and suffix both have a leader (> half) and they differ.
        function leaderOf(values: number[]): number | undefined {
          const counts = new Map<number, number>();
          for (const x of values) counts.set(x, (counts.get(x) ?? 0) + 1);
          for (const [x, c] of counts) if (c * 2 > values.length) return x;
          return undefined;
        }

        function solution(A: number[]): number {
          let splits = 0;
          for (let s = 0; s + 1 < A.length; s++) {
            const l = leaderOf(A.slice(0, s + 1));
            const r = leaderOf(A.slice(s + 1));
            if (l !== undefined && r !== undefined && l !== r) splits++;
          }
          return splits;
        }
      python: |-
        # Count split points where prefix and suffix both have a leader (> half) and they differ.
        def leader_of(values):
            counts = {}
            for x in values:
                counts[x] = counts.get(x, 0) + 1
            for x, c in counts.items():
                if c * 2 > len(values):
                    return x
            return None


        def solution(A):
            splits = 0
            for s in range(len(A) - 1):
                left = leader_of(A[:s + 1])
                right = leader_of(A[s + 1:])
                if left is not None and right is not None and left != right:
                    splits += 1
            return splits
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code** and write the results down. They are the reference for the fast
      version.
    expect: Three OKs, then 0, 1, 0, 1, 0 and 5 for your six cases.
  - kind: optimise
    title: Leaders of every prefix in one pass
    minutes: 10
    body: |-
      Walk left to right with a count per song and a Boyer-Moore candidate. If the prefix has
      a leader, it must be the candidate, so check its count against half the length. Record
      the result for every prefix.

      Reverse the log and run the same helper for every suffix. The split loop then does two
      look-ups each.
    code:
      ts: |-
        // Count split points where prefix and suffix both have a leader (> half) and they differ.
        // Leaders of every prefix and every suffix in one pass each: O(N) time, O(N) space.
        function leaders(values: number[]): { has: Uint8Array; value: number[] } {
          // If a prefix has a leader, the running Boyer-Moore candidate is that leader, so one
          // pass with a count per value tells, for every prefix, whether it has one and which.
          const n = values.length;
          const has = new Uint8Array(n);
          const value = new Array<number>(n).fill(0);
          const counts = new Map<number, number>();
          let candidate = 0;
          let votes = 0;
          for (let i = 0; i < n; i++) {
            const x = values[i]!;
            counts.set(x, (counts.get(x) ?? 0) + 1);
            if (votes === 0) {
              candidate = x;
              votes = 1;
            } else {
              votes += x === candidate ? 1 : -1;
            }
            if ((counts.get(candidate) ?? 0) * 2 > i + 1) {
              has[i] = 1;
              value[i] = candidate;
            }
          }
          return { has, value };
        }

        function solution(A: number[]): number {
          const n = A.length;
          const left = leaders(A);
          const right = leaders(A.slice().reverse());
          let splits = 0;
          for (let s = 0; s + 1 < n; s++) {
            const r = n - 2 - s;
            if (left.has[s] && right.has[r] && left.value[s] !== right.value[r]) splits++;
          }
          return splits;
        }
      python: |-
        # Count split points where prefix and suffix both have a leader (> half) and they differ.
        # Leaders of every prefix and every suffix in one pass each: O(N) time, O(N) space.
        def leaders(values):
            # If a prefix has a leader, the running Boyer-Moore candidate is that leader, so one
            # pass with a count per value tells, for every prefix, whether it has one and which.
            out = []
            counts = {}
            candidate = None
            votes = 0
            for i, x in enumerate(values):
                counts[x] = counts.get(x, 0) + 1
                if votes == 0:
                    candidate = x
                    votes = 1
                elif x == candidate:
                    votes += 1
                else:
                    votes -= 1
                out.append((True, candidate) if counts[candidate] * 2 > i + 1 else (False, None))
            return out


        def solution(A):
            n = len(A)
            left = leaders(A)
            right = leaders(A[::-1])
            splits = 0
            for s in range(n - 1):
                has_l, lead_l = left[s]
                has_r, lead_r = right[n - 2 - s]
                if has_l and has_r and lead_l != lead_r:
                    splits += 1
            return splits
    codeMode: full
  - kind: ask-ai
    title: Check the index mapping with the assistant
    minutes: 1
    body: |-
      The suffix index is the easiest line to get wrong. Ask about that one mapping, not for
      the solution.
    prompt: >-
      For an array of length n reversed into R, the suffix that starts at index s + 1 of the
      original is the prefix of R ending at which index? One line.
    expect: At index n − 2 − s, which matches the line in the split loop.
  - kind: test
    title: Check the fast version matches the direct one
    minutes: 2
    body: |-
      Run again and compare with the results you wrote down. Any difference points at the
      suffix index or the more-than-half check.
    expect: Three OKs, then 0, 1, 0, 1, 0 and 5 again.
  - kind: ai-writes
    title: Let the assistant write more inputs
    minutes: 2
    body: |-
      Varied inputs are a good job to delegate. Ask for no answers: you can check small cases
      against your direct version, which you still have in the transcript.
    prompt: >-
      Give me 4 test inputs for this function, one per line, in the format [1, 1, 2, 2].
      Include one where the favourite changes twice along the log, and one with only one
      song. Inputs only, no answers and no code.
    expect: Four lines for test-input.txt, and a single-song log returns 0.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite, so the code stays yours.
    prompt: >-
      Review my current solution for correctness and time complexity. List any problems in
      one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the direct version and any debug output. Check the header states the
      complexity, then submit.
