term: field data
aka: [real user monitoring, RUM, real-user data]
short: Speed measurements collected from real visitors' devices and networks as they use the site.
explain: |
  Your laptop on office broadband is not your users' phone on a train. Measurements from
  real visits show what people really feel, including the slow tail.

  A small script reports metrics such as LCP and INP from each visit, and you look at
  percentiles, not averages. The data is noisy and slow to collect, and can't tell you why
  something is slow. Use it to find what hurts, then lab data to dig into it.
analogy: Reading the customer reviews, not the product's own test results.
usage: Field data says INP is fine on desktop and poor on mid-range phones, so test on one.
twin:
  term: lab-data
  difference: Field data comes from real visits and shows what people feel. Lab data comes from one controlled test run and is repeatable, so you can compare a fix.
related: [lab-data, core-web-vitals, percentile, observability]
level: 2
lessons: [perf.measure-first, perf.web-vitals]
