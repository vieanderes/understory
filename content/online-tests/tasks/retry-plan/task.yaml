id: retry-plan
title: RetryPlan
topic: reliability
difficulty: easy
type: coding
recommendedMinutes: 20
signature:
  params:
    - { name: A, type: "string[]" }
    - { name: B, type: int }
    - { name: C, type: int }
    - { name: M, type: int }
  returns: "string[]"
statement: |-
  A client calls a flaky service and retries with capped exponential backoff. The outcome of
  attempt K + 1 is A[K], one of:

  - a status code such as `"200"` or `"503"`;
  - a status code with a Retry-After value in seconds, such as `"429:7"`;
  - `"timeout"`, when no response arrived.

  After each attempt the client decides:

  - a code from 200 to 299 is a success, and the client stops;
  - `"timeout"` and the codes 408, 429, 500, 502, 503 and 504 can be retried; any other code
    is a failure, and the client stops;
  - the client makes at most M attempts. When attempt M can be retried, the client stops
    because it is out of attempts;
  - otherwise it waits and tries again. Before retry number R (the first retry is R = 1), it
    waits min(C, B × 2^(R − 1)) seconds, unless the outcome it is retrying carried a
    Retry-After value: then it waits exactly that many seconds, even above C.

  Write a function:

  {{signature}}

  that, given an array A of N strings and integers B, C and M, returns the client's log as
  an array of strings: `"wait X"` for each wait of X seconds, in order, followed by one last
  entry, `"success"`, `"fail"` or `"exhausted"`.

  For example, given A = ["503", "timeout", "429:10", "200"], B = 1, C = 8 and M = 5, the
  function should return ["wait 1", "wait 2", "wait 10", "success"]. The third wait follows
  the Retry-After value instead of the backoff, which would have been 4.

  Given A = ["500", "404", "200"], B = 3, C = 100 and M = 3, the function should return
  ["wait 3", "fail"], because 404 cannot be retried.

  Given A = ["503", "503", "503"], B = 2, C = 3 and M = 3, the function should return
  ["wait 2", "wait 3", "exhausted"]: the second wait is capped at 3.

  Assume that:

  - M is an integer within the range [1..50];
  - N is an integer within the range [M..50];
  - every status code is an integer within the range [100..599], written without leading
    zeros;
  - every Retry-After value is an integer within the range [0..100,000];
  - B is an integer within the range [1..1,000];
  - C is an integer within the range [B..1,000,000].

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [["503", "timeout", "429:10", "200"], 1, 8, 5], expected: ["wait 1", "wait 2", "wait 10", "success"] }
  - { args: [["500", "404", "200"], 3, 100, 3], expected: ["wait 3", "fail"] }
  - { args: [["503", "503", "503"], 2, 3, 3], expected: ["wait 2", "wait 3", "exhausted"] }
tests:
  - name: extreme_single
    description: one attempt allowed
    group: correctness
    cases:
      - { args: [["200"], 1, 1, 1], expected: ["success"] }
      - { args: [["503"], 1, 1, 1], expected: ["exhausted"] }
      - { args: [["timeout"], 5, 5, 1], expected: ["exhausted"] }
  - name: first_attempt
    description: success or failure on the first attempt
    group: correctness
    cases:
      - { args: [["204", "503"], 1, 10, 2], expected: ["success"] }
      - { args: [["400", "200"], 1, 10, 2], expected: ["fail"] }
      - { args: [["301", "200"], 1, 10, 2], expected: ["fail"] }
  - name: status_ranges
    description: codes at the edges of the success range and near the retryable ones
    group: correctness
    cases:
      - { args: [["299"], 1, 1, 1], expected: ["success"] }
      - { args: [["501", "200"], 1, 10, 2], expected: ["fail"] }
      - { args: [["408", "504", "502", "300"], 1, 10, 4], expected: ["wait 1", "wait 2", "wait 4", "fail"] }
  - name: backoff_cap
    description: the backoff doubles, then stays at the cap
    group: correctness
    cases:
      - { args: [["500", "500", "500", "500", "500", "500", "200"], 3, 20, 7], expected: ["wait 3", "wait 6", "wait 12", "wait 20", "wait 20", "wait 20", "success"] }
      - { args: [["503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503", "503"], 1000, 1000000, 50] }
  - name: retry_after
    description: Retry-After wins over the backoff, even above the cap or at 0
    group: correctness
    cases:
      - { args: [["429:100", "429:0", "503", "200"], 1, 10, 4], expected: ["wait 100", "wait 0", "wait 4", "success"] }
      - { args: [["503:5", "503", "503:1"], 2, 8, 3], expected: ["wait 5", "wait 4", "exhausted"] }
      - { args: [["404:30", "200"], 1, 10, 2], expected: ["fail"] }
  - name: stops_early
    description: the client stops before using every outcome
    group: correctness
    cases:
      - { args: [["timeout", "timeout", "200", "500", "500"], 2, 100, 5], expected: ["wait 2", "wait 4", "success"] }
      - { args: [["500", "500", "500", "500", "200"], 1, 100, 3], expected: ["wait 1", "wait 2", "exhausted"] }
