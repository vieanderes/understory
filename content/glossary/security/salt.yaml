term: salt
short: A random value stored with each password hash, so identical passwords produce different hashes.
explain: |
  Without one, two users with the password "summer2024" have the same stored hash. An
  attacker cracks one and gets both, and a precomputed table of common passwords cracks
  thousands at once.

  Add a random value per user before hashing, and every hash is unique. The salt isn't
  secret: it's stored beside the hash. Modern password hashes such as bcrypt and Argon2id
  generate and store it for you.
analogy: A different random spice in each pot of the same soup. Two pots now taste different, so tasting one tells you nothing about the other.
usage: Every row has the same salt, which defeats the point; generate one per password.
related:
  - hashing
level: 2
