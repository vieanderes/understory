id: design.forms-that-help
title: Forms that help
objective: Label every field so the label stays, link hints and errors to their fields, and group related choices.
level: essential
minutes: 10
concepts: [design.form-labels, design.error-messages, design.field-groups]
prerequisites: [design.accessibility-foundations, html.forms]
opening:
  text: >-
    You'll build a checkout form that tells everyone, by eye and by ear, what to type and
    what went wrong. Forms are where most people give up on a site, so this is where care
    pays.

steps:
  - type: prose
    id: labels-that-stay
    body: |-
      You wrapped fields in `label` in the HTML chapter. A label can also sit apart, linked
      by `for` and the field's `id`:

      ```html
      <label for="email">Email</label>
      <input id="email" type="email">
      ```

      A common shortcut is a **placeholder**, the grey text inside an empty box. It's not a
      label. It vanishes as you type, so you can't check what the box was for.

  - type: multiple-choice
    id: pick-placeholder-problem
    concept: design.form-labels
    difficulty: 1
    language: html
    code: |
      <input placeholder="Card number">
      <input placeholder="Expiry date">
    question: A shopper starts typing. What goes wrong first?
    choices:
      - text: The field's name disappears
        correct: true
        feedback: >-
          Right. Once there's text in the box, nothing says what the box is for.
      - text: The form can't be sent
        feedback: >-
          It sends fine. The trouble is for the person halfway through filling it in.
      - text: The text they type is grey
        feedback: >-
          Typed text uses the normal colour. It's the hint that goes, not the colour.

  - type: playground
    id: replace-placeholders
    concept: design.form-labels
    difficulty: 2
    prompt: >-
      Replace each placeholder with a real label, linked by `for`: "Full name" for `name`
      and "Email" for `email`. The labels stay visible while you type.
    html: |
      <form>
        <input id="name" placeholder="Full name">
        <input id="email" type="email" placeholder="Email">
        <button>Continue</button>
      </form>
    css: |
      body { font-family: sans-serif; }
      label, input { display: block; margin-bottom: 8px; }
    editable: [html]
    checks:
      - label: The name field has the label Full name
        selector: 'label[for="name"]'
        text: Full name
      - label: The email field has the label Email
        selector: 'label[for="email"]'
        text: Email
      - label: No placeholder is left
        selector: '[placeholder]'
        count: 0
    solution:
      html: |
        <form>
          <label for="name">Full name</label>
          <input id="name">
          <label for="email">Email</label>
          <input id="email" type="email">
          <button>Continue</button>
        </form>
    hints:
      - Each field gets its own `label`, right before it.
      - The label's `for` matches the field's `id`.
      - '`<label for="name">Full name</label>`, and remove the placeholder.'

  - type: prose
    id: hints-and-errors
    body: |-
      A hint or an error sitting near a field isn't attached to it. A screen reader on the
      field won't read it. Link it:

      ```html
      <input id="postcode" aria-describedby="postcode-error" aria-invalid="true">
      <p id="postcode-error">Enter a postcode, like SW1A 1AA</p>
      ```

      `aria-describedby` points at the text's `id`, which becomes the field's **description**,
      read after its name. `aria-invalid="true"` announces "invalid".

  - type: playground
    id: link-the-error
    concept: design.error-messages
    difficulty: 2
    prompt: >-
      The error shows, but a screen reader never reads it. On the postcode field, add
      `aria-describedby="postcode-error"` and `aria-invalid="true"`.
    html: |
      <label for="postcode">Postcode</label>
      <input id="postcode" value="12">
      <p id="postcode-error" class="error">Enter a full postcode, like SW1A 1AA</p>
    css: |
      body { font-family: sans-serif; }
      input { display: block; }
      .error { color: #b91c1c; }
      [aria-invalid="true"] { border: 2px solid #b91c1c; }
    editable: [html]
    showTree: true
    checks:
      - label: The field points at the error
        selector: 'input#postcode'
        attribute: { name: aria-describedby, value: postcode-error }
      - label: The field is marked invalid
        selector: 'input#postcode'
        attribute: { name: aria-invalid, value: 'true' }
    solution:
      html: |
        <label for="postcode">Postcode</label>
        <input id="postcode" value="12" aria-describedby="postcode-error" aria-invalid="true">
        <p id="postcode-error" class="error">Enter a full postcode, like SW1A 1AA</p>
    hints:
      - Both attributes go on the `input`.
      - '`aria-describedby` takes the `id` of the message.'
      - '`<input id="postcode" value="12" aria-describedby="postcode-error" aria-invalid="true">`.'

  - type: prose
    id: fieldsets
    body: >-
      Some questions have several fields. "Delivery speed" with three radio buttons is one
      question, but each button only says "Standard" or "Next day".


      A `fieldset` groups them, and its `legend` names the group. A screen reader then says
      "Delivery speed, group" before the first choice, so each answer makes sense.

  - type: playground
    id: group-the-radios
    concept: design.field-groups
    difficulty: 2
    prompt: >-
      Wrap the three radio buttons in a `fieldset`, and turn the question paragraph into its
      `legend`.
    html: |
      <form>
        <p>Delivery speed</p>
        <label><input type="radio" name="speed" value="standard"> Standard</label>
        <label><input type="radio" name="speed" value="express"> Express</label>
        <label><input type="radio" name="speed" value="next-day"> Next day</label>
      </form>
    css: |
      body { font-family: sans-serif; }
      label { display: block; }
    editable: [html]
    checks:
      - label: There is one `fieldset`
        selector: fieldset
        count: 1
      - label: Its `legend` says Delivery speed
        selector: fieldset > legend
        text: Delivery speed
      - label: All three radios are inside it
        selector: 'fieldset input[type="radio"]'
        count: 3
    solution:
      html: |
        <form>
          <fieldset>
            <legend>Delivery speed</legend>
            <label><input type="radio" name="speed" value="standard"> Standard</label>
            <label><input type="radio" name="speed" value="express"> Express</label>
            <label><input type="radio" name="speed" value="next-day"> Next day</label>
          </fieldset>
        </form>
    hints:
      - The `fieldset` goes round the question and all three labels.
      - The `p` becomes a `legend`, the first thing inside the `fieldset`.
      - Start with `<fieldset><legend>Delivery speed</legend>`.

  - type: prose
    id: focus-the-first-error
    body: |-
      When Send finds a problem, your script shows the message. It must also link it, as you
      did by hand for the postcode. `setAttribute` sets an attribute, and `focus()` moves
      focus:

      ```js
      field.setAttribute("aria-invalid", "true");
      field.focus();
      ```

      Move focus to the first field that needs fixing. A screen reader user then hears its
      name, "invalid" and the message at once. Without the move, they hear nothing.

  - type: playground
    id: wire-the-error-check
    concept: design.error-messages
    difficulty: 3
    prompt: >-
      The last line shows the error on load. A screen reader never hears it. In `showError`,
      mark the field invalid and point `aria-describedby` at `email-error`. After Send, move
      focus to the field.
    html: |
      <form>
        <label for="email">Email</label>
        <input id="email" type="email">
        <p id="email-error" class="error"></p>
        <button>Send</button>
      </form>
    css: |
      body { font-family: sans-serif; }
      input { display: block; margin-bottom: 8px; }
      .error { color: #b91c1c; }
      [aria-invalid="true"] { border: 2px solid #b91c1c; }
    js: |
      const field = document.querySelector("#email");
      const error = document.querySelector("#email-error");
      function showError(message) {
        error.textContent = message;
      }
      document.querySelector("form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (field.value === "") {
          showError("Enter your email address");
        }
      });
      showError("Enter your email address");
    editable: [js]
    showTree: true
    checks:
      - label: The field is marked invalid
        selector: 'input#email'
        attribute: { name: aria-invalid, value: 'true' }
      - label: The field points at its error
        selector: 'input#email'
        attribute: { name: aria-describedby, value: email-error }
    solution:
      js: |
        const field = document.querySelector("#email");
        const error = document.querySelector("#email-error");
        function showError(message) {
          error.textContent = message;
          field.setAttribute("aria-invalid", "true");
          field.setAttribute("aria-describedby", "email-error");
        }
        document.querySelector("form").addEventListener("submit", (event) => {
          event.preventDefault();
          if (field.value === "") {
            showError("Enter your email address");
            field.focus();
          }
        });
        showError("Enter your email address");
    hints:
      - Two `setAttribute` lines go at the end of `showError`.
      - '`setAttribute` takes the attribute name, then its value.'
      - 'Start with `field.setAttribute("aria-invalid", "true");`, and add `field.focus();` after `showError` in the handler.'

  - type: explain-back
    id: explain-red-text-not-enough
    concept: design.error-messages
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      After Submit, a form shows red error text under two fields, and nothing else happens.
      A screen reader user hears nothing. What would you change?
    rubric:
      - Link each message to its field with `aria-describedby`, and mark the field `aria-invalid`.
      - Move focus to the first field with an error, so the user hears it at once.
      - Word each message to say what's wrong and how to fix it, not only that it's wrong.
    modelAnswer: >-
      Red text near a field is invisible to a screen reader until it's linked. I'd point each
      field's `aria-describedby` at its message and set `aria-invalid="true"`. Then I'd move
      focus to the first field with a problem. The name, "invalid" and the message are then
      read straight away. And each message would say how to fix it, like "Enter a full
      postcode".

recap:
  - Give every field a visible label, never only a placeholder.
  - Link hints and errors with `aria-describedby`, and mark errors `aria-invalid`.
  - Group related choices in a `fieldset`, and focus the first error on Submit.

recall:
  - id: card-placeholder
    concept: design.form-labels
    front: Why is a placeholder not a label?
    back: >-
      It vanishes as soon as someone types, so nothing says what the field is for.
  - id: card-describedby
    concept: design.form-labels
    front: How does a hint under a field reach a screen reader?
    back: >-
      Give the hint an `id` and point the field's `aria-describedby` at it. It's read after
      the name.
  - id: card-error-link
    concept: design.error-messages
    front: What two attributes let a screen reader announce a field's error?
    back: >-
      `aria-describedby` pointing at the message's `id`, and `aria-invalid="true"` for the
      state.
  - id: card-fieldset
    concept: design.field-groups
    front: Why wrap a set of radio buttons in a `fieldset` with a `legend`?
    back: >-
      The legend names the group, so each choice is heard as an answer to that question.

