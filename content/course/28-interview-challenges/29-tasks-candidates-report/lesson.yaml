id: interview.reported-tasks
title: Tasks candidates report
objective: Name the pattern behind ten commonly reported online-test tasks and solve three of them against hidden tests.
level: advanced
minutes: 10
concepts: [interview.pattern-spotting, interview.one-pass-state]
prerequisites: [interview.online-assessments, algo.prefix-sums]
opening:
  text: >-
    You'll recognise the tasks candidates keep reporting from timed online tests, and the
    pattern under each. A new task then feels like one you've already solved.

steps:
  - type: prose
    id: patterns-not-tasks
    body: |-
      Candidates share their online tests on forums. You won't get those exact tasks: the
      platforms keep them private and keep writing new ones.

      But the same dozen **patterns** come back in new clothes. A set, a count per key, a
      running total, a sort, a greedy reach. Name the pattern first, and the task shrinks
      to one you know.

  - type: multiple-choice
    id: name-largest-k
    concept: interview.pattern-spotting
    difficulty: 1
    question: 'A task: find the largest K where both K and -K are in the array. Which tool?'
    choices:
      - text: A `Set` of the numbers
        correct: true
        feedback: >-
          Yes. Each "is -x here?" check is then O(1).
      - text: Two nested loops over every pair
        feedback: >-
          It's correct, but O(n²). At 100,000 numbers it times out.
      - text: A prefix sum array
        feedback: >-
          Prefix sums answer range totals. Here you only ask whether a value exists.

  - type: code-challenge
    id: write-largest-k
    concept: interview.one-pass-state
    difficulty: 2
    language: ts
    starter: pairs.starter.ts
    solution: pairs.solution.ts
    tests: pairs.tests.ts
    twin:
      language: python
      starter: pairs.starter.py
      solution: pairs.solution.py
      tests: pairs.tests.py
    prompt: >-
      Write `largestK(values)`: the largest K > 0 such that both K and -K are in `values`,
      or `0` if there's none.


      `largestK([3, 2, -2, 5, -3])` is `3`. `largestK([1, 2, 3, -4])` is `0`.


      **Target:** O(n) for up to 100,000 numbers. The hidden tests include `[0, 0]`,
      duplicates, an empty list and a full-size run.
    hints:
      - Which numbers could be K at all? And what do you need to know about each one?
      - Only positives can be K. For each one, you ask "is its negative here?"
      - 'Build `new Set(values)`, then keep the largest positive `x` where `seen.has(-x)`.'

  - type: prose
    id: counting-tasks
    body: |-
      Five reported tasks, one pass each:

      - **Largest K with -K present**: a set.
      - **Values that equal their count**: a count per value, then compare.
      - **No three identical letters in a row**: count the length of each run.
      - **Fewest deletions so all A come before all B**: a running count of Bs.
      - **Fair indexes**: prefix sums of two arrays, split at the same index.

  - type: ai-review
    id: review-three-in-a-row
    concept: interview.one-pass-state
    difficulty: 3
    language: js
    request: Return the fewest letters to delete so no three identical letters sit in a row.
    flawClass: edge-case
    code: |
      function fewestDeletions(text) {
        let deletions = 0;
        let run = 1;
        for (let i = 1; i < text.length; i++) {
          if (text[i] === text[i - 1]) {
            run++;
            if (run >= 3) deletions++;
          } else {
            run = 0;
          }
        }
        return deletions;
      }
    prompt: >-
      An assistant wrote this. `"aaab"` gives 1, as it should. `"aabbb"` gives 0, but the
      third `b` must go. Tap the line at fault.
    lines: [9]
    reasons:
      - text: A new letter starts a run of 1, not 0
        correct: true
        feedback: >-
          Yes. Resetting to 0 undercounts every run after the first.
      - text: '`run >= 3` should be `run > 3`'
        feedback: >-
          Three in a row is already too many, so the third letter must go.
      - text: The loop should start at index 0
        feedback: >-
          Index 0 has no letter before it to compare with. The reset is the slip.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Two long runs with a different letter between them
          correct: true
          feedback: >-
            Yes. Only a run after the first one exposes the reset.
        - text: One long run at the start, like `"aaab"`
          feedback: >-
            That's the case it already passed. The first run starts at 1 correctly.
        - text: An empty string
          feedback: >-
            Worth having, but the loop never runs, so the reset never happens.
    fix: |
      run = 1;

  - type: code-challenge
    id: write-min-deletions
    concept: interview.one-pass-state
    difficulty: 4
    language: ts
    starter: deletions.starter.ts
    solution: deletions.solution.ts
    tests: deletions.tests.ts
    twin:
      language: python
      starter: deletions.starter.py
      solution: deletions.solution.py
      tests: deletions.tests.py
    prompt: >-
      Write `minDeletions(letters)`. The string holds only `A` and `B`. Return the fewest
      letters to delete so every `A` comes before every `B`.


      `minDeletions('BAAABAB')` is `2`: delete the first `B` and the last `A`.
      `minDeletions('AABB')` is `0`.


      **Target:** O(n) for up to 100,000 letters. The hidden tests include an empty
      string, `'BBAA'` and a full-size run. Trying every split point runs out of time.
    hints:
      - Walk left to right. When you meet an `A` after some `B`s, what are your two choices?
      - Delete this `A` (one more deletion), or keep it and delete every `B` seen so far.
      - 'Keep `bs` and `deletions`. On `B`, add to `bs`. On `A`, set `deletions = Math.min(deletions + 1, bs)`.'

  - type: prose
    id: other-tasks
    body: |-
      Five more, each with its own trick:

      - **Network rank**: count each city's roads once, in an array or a map.
      - **Jump game**: carry the furthest index you can reach.
      - **Widest vertical gap between points**: sort the x values, compare neighbours.
      - **N unique numbers that sum to 0**: build them, don't search.
      - **Day of the week K days later**: the remainder, `% 7`.

  - type: ai-review
    id: review-day-after
    concept: interview.one-pass-state
    difficulty: 2
    language: js
    request: Return the day of the week K days after the starting day.
    flawClass: logic
    code: |
      const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      function dayAfter(start, k) {
        const index = DAYS.indexOf(start);
        return DAYS[index + k % 7];
      }
    prompt: >-
      `dayAfter('Mon', 3)` gives `'Thu'`. `dayAfter('Sat', 2)` gives `undefined`. Tap the
      line at fault.
    lines: [4]
    reasons:
      - text: '`%` runs before `+`, so the sum never wraps'
        correct: true
        feedback: >-
          Yes. Write `(index + k) % 7` so the whole sum wraps.
      - text: '`indexOf` can''t find `''Sat''`'
        feedback: >-
          It finds it at 5. The sum 5 + 2 is 7, past the end.
      - text: '`k` needs converting to a number'
        feedback: >-
          It's already a number. The order of the operators is the slip.
    fix: |
      return DAYS[(index + k) % 7];

  - type: code-challenge
    id: write-network-rank
    concept: interview.one-pass-state
    difficulty: 3
    language: ts
    starter: network.starter.ts
    solution: network.solution.ts
    tests: network.tests.ts
    twin:
      language: python
      starter: network.starter.py
      solution: network.solution.py
      tests: network.tests.py
    prompt: >-
      Cities are numbered 1 to `cities`. Road `i` joins `from[i]` and `to[i]`, and two
      cities share at most one road. The rank of a road's two cities is how many roads touch
      either of them. Write `networkRank(from, to, cities)`: the highest rank over all roads.


      `networkRank([1, 2, 3, 3], [2, 3, 1, 4], 4)` is `4`.


      **Target:** O(n + m) for up to 100,000 roads. Counting the roads again for each road
      runs out of time.
    hints:
      - Recounting the roads for every road is the slow part. What could you count once?
      - Count each city's roads in one pass. Then a road's rank is a sum of two counts.
      - The road between the pair touches both cities, so subtract 1.

  - type: explain-back
    id: explain-pattern-first
    concept: interview.pattern-spotting
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A friend says: "I'll memorise the reported tasks." Why is naming the pattern the
      better way to prepare?
    rubric:
      - The exact tasks change, but the same dozen patterns come back.
      - Naming the pattern gives you the data structure and the target Big-O at once.
      - Real tests are harder than the reports, so you need the method, not the answer.
    modelAnswer: >-
      The platforms keep writing new tasks, so the one I memorised probably won't appear. The
      patterns do: a set, a count per key, a running total, a sort, a greedy reach. Once I
      name the pattern, I know the data structure and the Big-O to aim for. And real tests
      add nastier corners, so the method is what carries over.

recap:
  - Name the pattern behind a task before you write any code.
  - Carry a set, a count or a running total through one pass.
  - Build a constructive answer instead of searching for it.
recall:
  - id: card-min-deletions
    concept: interview.one-pass-state
    front: What do you carry through one pass to get all A before all B with fewest deletions?
    back: >-
      The count of Bs so far and the deletions so far. On each A, deletions becomes the
      smaller of deletions + 1 and the Bs so far.
  - id: card-network-rank
    concept: interview.one-pass-state
    front: How do you find the network rank of a road's two cities in O(1)?
    back: >-
      Count each city's roads once. The rank is roads(a) + roads(b) - 1, since the road
      between them touches both.
  - id: card-sum-zero
    concept: interview.pattern-spotting
    front: How do you build N unique numbers that sum to 0?
    back: >-
      Pairs `i` and `-i` for i from 1 to N / 2, plus 0 when N is odd.
  - id: card-name-pattern
    concept: interview.pattern-spotting
    front: Name the pattern behind "widest vertical gap between points".
    back: >-
      Sort the x values, then take the largest difference between neighbours.

references:
  - kind: docs
    title: Remainder (%)
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Remainder
    note: How `%` works, and that it binds tighter than `+`.
    verified: false
  - kind: essay
    title: Microsoft online assessment questions
    authors: AlgoMonster
    url: https://algo.monster/problems/microsoft_online_assessment_questions
    note: A compiled list of tasks candidates reported from timed online tests.
    verified: false

deepDive: >-
  **Why these tasks come back.** Online-test tasks have to be gradable by hidden tests and
  solvable in 20 to 30 minutes. That leaves a small set of shapes: one pass with a set or a
  count, a running total, a sort then a scan, a greedy reach, a small construction. The
  reported tasks are those shapes with a story on top.


  **Jump game.** Each value says how far you may jump forward from there. Carry `reach`,
  the furthest index reachable so far. If the loop index ever passes `reach`, you're stuck.
  One pass, O(n).


  **Fair indexes.** Two arrays of equal length. An index K is fair when all four parts, the
  front and back of each array, have equal sums. Keep running front sums and the totals; K
  is fair when each front sum equals its back and both arrays agree.


  The code in this lesson was run on Node 24. The three-in-a-row version returns 0 for
  `"aabbb"`, and `dayAfter('Sat', 2)` reads `DAYS[7]`, which is `undefined`.
