id: interview.js-traps
title: JavaScript traps under time
objective: "Avoid the JavaScript habits that pass small examples and fail large hidden tests: string sorting, shift in loops, spread on huge arrays and deep recursion."
level: essential
minutes: 10
concepts: [interview.hidden-quadratic, interview.runtime-limits]
prerequisites: [interview.online-assessments]
opening:
  text: >-
    You'll spot the JavaScript habits that pass the example and fail the hidden tests. Each
    one costs points in a timed test, and each has a short fix.

steps:
  - type: prose
    id: what-you-need
    body: |-
      What you need: JavaScript arrays and Big-O. Each trap here passes the task's small
      example, then fails a **hidden test** with large or unusual input. That's how timed
      online tests score you.

      You'll meet five: the default sort, calls that hide a loop, spreading a huge array,
      deep recursion and very large sums. Each has a one-line fix.

  - type: prose
    id: why-string-sort
    body: |-
      Trap one: `[10, 9, 1].sort()` gives `[1, 10, 9]`. The default `sort` turns every item
      into a string, then compares character by character. `"10"` starts with `"1"`, so it
      lands before `"9"`.

      Small examples often use single digits, so the bug hides. Hidden tests don't. For
      numbers, always pass a comparator: `sort((a, b) => a - b)`.

  - type: bug-hunt
    id: hunt-includes-loop
    concept: interview.hidden-quadratic
    difficulty: 2
    language: js
    code: |
      function uniqueTags(tags) {
        const result = [];
        for (const tag of tags) {
          if (!result.includes(tag)) result.push(tag);
        }
        return result;
      }
    prompt: >-
      Every small test passes. With 100,000 different tags, it runs for about four seconds.
      Tap the slow line.
    lines: [4]
    reasons:
      - text: '`includes` walks the whole result every time'
        correct: true
        feedback: >-
          Right. A linear search inside a loop is O(n²). A `Set` makes each check O(1).
      - text: '`push` copies the array each time'
        feedback: >-
          `push` adds to the end in amortised O(1). The search before it is the cost.
      - text: '`for...of` is slow on big arrays'
        feedback: >-
          It's a little slower than a counting loop, but only by a constant. The growth comes from `includes`.
    fix: |
      const seen = new Set();
      for (const tag of tags) {
        if (!seen.has(tag)) { seen.add(tag); result.push(tag); }
      }

  - type: prose
    id: hidden-linear-calls
    body: |-
      Some calls look like one step but walk the array: `includes`, `indexOf`, `shift`,
      `unshift` and `splice`. Inside a loop, each turns O(n) into **O(n²)**.

      Swap them out. Use a `Set` for "have I seen it?". For a queue, keep a `head` index
      and read `queue[head++]`. `push` is fine: it's **amortised** O(1), meaning an
      occasional slow resize averages out to constant time per call.

  - type: prose
    id: stack-and-precision
    body: |-
      Two limits aren't about time. The **call stack** holds one frame for each function
      call still running, with its arguments. It has room for thousands of frames and
      arguments, not millions. Run out and you get a `RangeError`.

      Numbers are exact only up to 2^53. Past that, `+ 1` can vanish. Use `BigInt` (`10n`),
      JavaScript's whole numbers with no size limit, for sums that big.

  - type: predict-output
    id: predict-spread-max
    concept: interview.runtime-limits
    difficulty: 2
    language: js
    code: |
      const readings = new Array(1000000).fill(7);
      try {
        console.log(Math.max(...readings));
      } catch (e) {
        console.log(e.name);
      }
    question: What does this log in Node?
    choices:
      - text: '`RangeError`'
        correct: true
        feedback: >-
          Yes. Spread passes a million arguments, and the call stack can't hold them.
      - text: '`7`'
        feedback: >-
          That's the answer for a small array. A million arguments overflow the stack first.
      - text: '`Infinity`'
        feedback: >-
          `Math.max` never gets to compare anything. The call itself fails.

  - type: bug-hunt
    id: hunt-deep-recursion
    concept: interview.runtime-limits
    difficulty: 3
    language: js
    code: |
      // node is { value, next }, and the last node's next is null
      function total(node) {
        if (node === null) return 0;
        return node.value + total(node.next);
      }
    prompt: >-
      A linked list is a chain of nodes, each pointing at the next. Every small test passes.
      A hidden test passes 100,000 nodes and gets a `RangeError`. Tap the line at fault.
    lines: [4]
    reasons:
      - text: One call per node overflows the stack
        correct: true
        feedback: >-
          Yes. 100,000 nested calls need 100,000 frames. A `while` loop needs one.
      - text: '`node.value` can be undefined'
        feedback: >-
          Every node has a value here. The error comes from how deep the calls go.
      - text: The base case should come second
        feedback: >-
          Order doesn't matter for depth. Each node still adds a frame until the end.
    fix: |
      let sum = 0;
      for (let n = node; n !== null; n = n.next) sum += n.value;
      return sum;

  - type: ai-review
    id: review-shift-queue
    concept: interview.hidden-quadratic
    difficulty: 4
    language: js
    request: Serve each request in order. A request marked for retry goes to the back once.
    flawClass: performance
    code: |
      function serveAll(requests) {
        const queue = [...requests];
        const served = [];
        while (queue.length > 0) {
          const next = queue.shift();
          if (next.retry) queue.push({ ...next, retry: false });
          served.push(next.id);
        }
        return served;
      }
    prompt: >-
      An assistant wrote this. The order is right on every small test. On 100,000 requests
      it took us 19 seconds. Tap the slow line.
    lines: [5]
    reasons:
      - text: '`shift` moves every remaining item along'
        correct: true
        feedback: >-
          Yes. Each `shift` is O(n), so the loop is O(n²). Use a `head` index.
      - text: Copying `requests` up front is too slow
        feedback: >-
          One copy is O(n), done once. The cost comes from something repeated in the loop.
      - text: '`push` in a loop is quadratic'
        feedback: >-
          `push` onto the end is amortised O(1). It's the removal from the front that moves items.
    verify:
      question: 'How would you catch this before submitting?'
      choices:
        - text: 'Time one run on 100,000 requests'
          correct: true
          feedback: >-
            Yes. Only a large input shows the O(n²) cost.
        - text: 'Add a small test with one retry'
          feedback: >-
            A good order test, but small inputs finish at once. They can't show the slowdown.
        - text: 'Test an empty list of requests'
          feedback: >-
            An empty list never enters the loop, so `shift` never runs.
    fix: |
      let head = 0;
      while (head < queue.length) {
        const next = queue[head++];
        // same body as before
      }

  - type: code-challenge
    id: fix-top-distinct
    concept: interview.hidden-quadratic
    difficulty: 4
    language: ts
    prompt: >-
      `topDistinct(scores, k)` returns the `k` highest different scores, highest first. The
      starter passed a quick check with single-digit scores. Fix it for the hidden tests.


      So `topDistinct([90, 100, 85, 100, 9], 3)` is `[100, 90, 85]`. The hidden tests use
      scores with different numbers of digits, negatives, and 100,000 scores.
    hints:
      - There are two traps in two lines. One is wrong on some inputs, one is too slow.
      - '`indexOf` inside `filter` searches the whole array for every score. `sort()` with no comparator compares text.'
      - 'Spread a `new Set(scores)` into an array, then sort with `(a, b) => b - a`.'

  - type: explain-back
    id: explain-hidden-quadratic
    concept: interview.hidden-quadratic
    difficulty: 4
    audience: teammate
    kind: risk
    prompt: >-
      A teammate's practice solution calls `queue.shift()` once per item, and every small
      test passes. Warn them what could go wrong on the hidden tests, and how to check.
    rubric:
      - '`shift` moves every remaining item one place, so the loop is O(n²).'
      - Small tests finish at once, so only a large performance test shows it, as a timeout worth nothing.
      - Time one run at the largest N before submitting, and read with a `head` index instead.
    modelAnswer: >-
      `shift` removes the first item, then moves every other item down one place. Once per
      item, that's O(n²). Ten items finish instantly, so the small tests can't warn you. The
      hidden test with 100,000 items times out, and a timeout scores nothing. Before
      submitting, time one run at the largest N. If it's slow, read with a `head` index,
      which costs O(1) per item.

recap:
  - Pass a comparator whenever you sort numbers.
  - Replace `includes`, `indexOf` and `shift` in loops with a `Set` or an index.
  - Loop instead of spreading huge arrays or recursing 100,000 deep, and use `BigInt` past 2^53.
recall:
  - id: card-default-sort
    concept: interview.runtime-limits
    front: What does `[10, 9, 1].sort()` return, and why?
    back: >-
      `[1, 10, 9]`. With no comparator, `sort` compares the items as strings.
  - id: card-hidden-linear
    concept: interview.hidden-quadratic
    front: Name three array calls that are O(n) and turn a loop quadratic.
    back: >-
      Any three of `includes`, `indexOf`, `shift`, `unshift` and `splice`.
  - id: card-spread-max
    concept: interview.runtime-limits
    front: How do you take the maximum of a million numbers safely?
    back: >-
      Loop over them, or use `reduce`. `Math.max(...arr)` passes each item as an argument
      and overflows the stack.
  - id: card-safe-integer
    concept: interview.runtime-limits
    front: Past what size do JavaScript numbers lose whole-number precision, and what do you use then?
    back: >-
      Past 2^53 (`Number.MAX_SAFE_INTEGER` is 2^53 - 1). Use `BigInt` for exact sums
      beyond it.

references:
  - kind: spec
    title: 'ECMAScript Language Specification: SortCompare'
    authors: Ecma TC39
    venue: ECMA-262
    url: https://tc39.es/ecma262/#sec-sortcompare
    note: Why items with no comparator are compared as strings.
    primary: true
    verified: true
  - kind: docs
    title: Array.prototype.sort()
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort
    note: The default string order and how comparators work.
    primary: true
    verified: true
  - kind: docs
    title: Function.prototype.apply()
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/apply
    note: The engine's argument length limit, which spread on huge arrays runs into.
    verified: true
  - kind: docs
    title: Number.MAX_SAFE_INTEGER
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/MAX_SAFE_INTEGER
    note: Where exact whole numbers end, and why.
    verified: true

deepDive: |-
  More traps worth a glance before a timed test. Each one was run in Node 24.

  `%` keeps the sign of the left side: `-7 % 3` is `-1`, not `2`. For a wrap-around index,
  write `((i % n) + n) % n`.

  `parseInt` works on strings. `parseInt(0.0000005)` is `5`, because the number becomes the
  string `"5e-7"` first. Use `Math.trunc` or `Math.floor` for numbers.

  `==` converts types: `0 == ''`, `'0' == false` and `[] == false` are all `true`. Use
  `===` everywhere in an interview.

  `Array(3).fill([])` puts the same array in all three slots, so pushing into one shows up in
  all of them. Build a grid with `Array.from({ length: 3 }, () => [])`.

  Where the limits sit. In Node 24 we saw `Math.max(...arr)` work at 120,000 items and throw
  at 150,000. Recursion managed 12,000 levels and failed at 100,000. The exact numbers depend
  on the engine and the frame size, so treat anything near 100,000 as unsafe.

  Assessment platforms commonly run JavaScript and TypeScript on Node 22, so check these on
  that version if you can. `+=` on strings is fast in V8 because it builds a rope and flattens it later.
