term: WebSocket
aka: [WebSockets, ws, wss]
short: A connection that starts as HTTP, then stays open so both browser and server can send anytime.
explain: |
  Chat needs both sides talking at once: your message goes up while someone else's typing
  indicator comes down. Opening a request for every message would be slow. Instead, one
  request asks to upgrade, and the connection becomes a two-way pipe that stays open.

  You give up what HTTP gave you for free. Check the `Origin` on the handshake, because
  cookies are sent with it. Validate every message, send heartbeats to find dead
  connections, and write the client to reconnect. With several servers, a message must
  reach users connected to the others too.
analogy: A phone call. Once it connects, either person can speak whenever they like.
example:
  language: js
  code: |
    const socket = new WebSocket('wss://chat.example.com/rooms/42');
    socket.addEventListener('message', (event) => {
      showMessage(JSON.parse(event.data));
    });
    socket.send(JSON.stringify({ type: 'typing' }));
usage: Typing indicators go both ways many times a second, so this one needs a WebSocket.
related: [server-sent-events, polling, http, load-balancer, sticky-session]
level: 2
lessons: [backend.realtime]
