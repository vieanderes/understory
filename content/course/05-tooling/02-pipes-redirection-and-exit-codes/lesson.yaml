id: tooling.pipes-and-exit-codes
title: Pipes, redirection and exit codes
objective: Chain commands with `|`, save output with `>` and `>>`, and stop on failure with `&&`.
level: essential
minutes: 10
concepts: [tooling.pipes-redirection, tooling.exit-codes]
prerequisites: [tooling.terminal]
opening:
  text: >-
    You'll answer questions about a long log file with one line of commands. You'll also
    learn the one-character mistake that deletes the wrong files.

steps:
  - type: prose
    id: output-into-a-file
    body: |-
      Commands print to the screen. `>` sends that output into a file instead:

      ```text
      $ echo "milk" > list.txt
      $ cat list.txt
      milk
      ```

      If `list.txt` doesn't exist, the shell creates it. If it does, the shell empties it
      first, before the command even starts. `>>` adds to the end instead. Both are called
      **redirection**.

  - type: predict-output
    id: predict-overwrite
    concept: tooling.pipes-redirection
    difficulty: 1
    language: bash
    code: |
      $ echo "milk" > list.txt
      $ echo "eggs" > list.txt
      $ cat list.txt
    question: What does `cat list.txt` print?
    choices:
      - text: '`eggs`'
        correct: true
        feedback: >-
          Yes. `>` empties the file before writing, so `milk` is gone.
      - text: '`milk` and `eggs`, on two lines'
        feedback: >-
          Most people expect that. Adding to the end is `>>`. A single `>` replaces the file.
      - text: '`milk`'
        feedback: >-
          The shell doesn't protect existing files. `>` overwrites without asking.

  - type: prose
    id: grep-and-the-pipe
    body: |-
      `grep` prints only the lines that contain some text. `wc -l` counts lines. The **pipe**,
      `|`, joins them: the left command's output becomes the right command's input.

      ```text
      $ grep " 404" access.log
      09:00:01 GET /pricing 404
      09:00:04 GET /price 404
      ```

      Here `access.log` lists visits to a website. 404 means "page not found".

  - type: fill-blank
    id: fill-count-404s
    concept: tooling.pipes-redirection
    difficulty: 2
    language: bash
    prompt: >-
      A teammate asks how many visits hit a missing page today. Build the line that answers it,
      then save the failed visits to a new file.
    template: |
      $ {{1}} " 404" access.log {{2}} wc -l
      4
      $ grep " 404" access.log {{3}} failed.log
    blanks:
      - key: '1'
        answer: grep
      - key: '2'
        answer: '|'
      - key: '3'
        answer: '>'
    bank: [grep, cat, '|', '>', '&&', ';']

  - type: bug-hunt
    id: hunt-redirect-to-input
    concept: tooling.pipes-redirection
    difficulty: 3
    language: bash
    code: |
      $ wc -l access.log
      6 access.log
      $ grep " 404" access.log > access.log
      $ wc -l access.log
      0 access.log
    prompt: The plan was to keep only the failed visits. Now the log is empty. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The shell empties the file before `grep` reads it
        correct: true
        feedback: >-
          Exactly. Redirection happens first, so `grep` reads an empty file.
      - text: '`grep` found no matches'
        feedback: >-
          Four lines matched a moment ago. They were erased before `grep` could read them.
      - text: '`wc -l` used up the file'
        feedback: >-
          Reading never changes a file. Only the `>` on line 3 wrote to it.
    fix: |
      $ grep " 404" access.log > failed.log

  - type: prose
    id: exit-codes
    body: |-
      Every program ends with a number, its **exit code**. `0` means it worked. Anything else
      means it failed. `echo $?` shows the last one.

      ```text
      $ mkdir drafts
      $ echo $?
      0
      $ mkdir drafts
      mkdir: drafts: File exists
      $ echo $?
      1
      ```

      Each program decides what counts as failure.

  - type: predict-output
    id: predict-grep-exit
    concept: tooling.exit-codes
    difficulty: 2
    language: bash
    code: |
      $ cat list.txt
      eggs
      $ grep "butter" list.txt
      $ echo $?
    question: '`grep` found nothing and printed nothing. What does the last line print?'
    choices:
      - text: '`1`'
        correct: true
        feedback: >-
          Yes. For `grep`, success means a match. No match means exit code 1.
      - text: '`0`'
        feedback: >-
          Nothing crashed, true. But each program defines success, and for `grep` that's a
          match.
      - text: Nothing, since `grep` printed nothing
        feedback: >-
          Every program leaves an exit code, even a silent one. `echo $?` always prints a number.

  - type: prose
    id: semicolon-and-and
    body: |-
      Two ways to run commands one after another on a single line:

      - `;` runs the next command whatever happened.
      - `&&` runs it only if the one before exited with `0`.

      That matters with commands that can't be undone. `rm` deletes files for good, with no
      bin. `rm *.html` deletes every file in the working directory whose name ends in `.html`.

  - type: ai-review
    id: review-agent-cleanup
    concept: tooling.exit-codes
    difficulty: 3
    language: bash
    request: Delete the old HTML pages in /srv/blog/old-site.
    flawClass: logic
    code: |
      # Clear out the old site's pages
      cd /srv/blog/old-site; rm *.html
      echo "Old pages removed"
    prompt: >-
      An AI agent runs this in your terminal. You're in your live site's folder, and
      `old-site` was already deleted last week. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`;` runs `rm` even though `cd` failed'
        correct: true
        feedback: >-
          Yes. `rm` deletes the live site's pages. With `&&`, a failed `cd` stops it.
      - text: '`*.html` deletes folders as well as files'
        feedback: >-
          The pattern only matches file names ending in `.html`. The trouble is where it runs.
      - text: '`echo` runs before `rm` finishes'
        feedback: >-
          Commands on separate lines run in order. The damage is done on line 2.
    verify:
      question: Before letting the agent delete anything, how can you check what `rm` would get?
      choices:
        - text: Run `ls *.html` in that folder first
          correct: true
          feedback: >-
            Yes. `ls` gets the same list `rm` would, and deletes nothing.
        - text: Run `rm *.html` and check `echo $?`
          feedback: >-
            The exit code arrives after the files are gone. There's no bin to get them back.
        - text: Trust the comment on line 1
          feedback: >-
            The comment says what the agent meant. Only running a safe command shows what's there.
    fix: |
      # Clear out the old site's pages
      cd /srv/blog/old-site && rm *.html
      echo "Old pages removed"

  - type: explain-back
    id: explain-empty-log
    concept: tooling.pipes-redirection
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: Why does `grep " 404" access.log > access.log` leave an empty file?
    rubric:
      - The shell sets up `>` before it starts `grep`.
      - '`>` empties the file as soon as the shell opens it.'
      - '`grep` then reads that empty file and writes nothing.'
    modelAnswer: >-
      The shell reads the whole line first. It sees `> access.log` and empties that file. Only
      then does it start `grep`. By the time `grep` reads the log, there's nothing left in it.
      The safe way is to write to a new file, such as `failed.log`.

recap:
  - "Save output to a file with `>`, or add to one with `>>`."
  - "Feed one command's output into the next with `|`."
  - "Read an exit code, and chain commands safely with `&&`."
recall:
  - id: card-shell-job
    concept: tooling.pipes-redirection
    front: In `grep "404" access.log > failed.log`, who handles the `>`?
    back: >-
      The shell. It points output at `failed.log` before starting `grep`, which never sees the
      `>`.
  - id: card-redirect-operators
    concept: tooling.pipes-redirection
    front: What do `>`, `>>` and `|` do?
    back: >-
      `>` replaces a file, `>>` adds to the end of it, and `|` feeds output into the next
      command.
  - id: card-exit-code
    concept: tooling.exit-codes
    front: What does an exit code of `0` mean, and how do you see the last one?
    back: >-
      `0` means the program worked. Anything else means it failed. `echo $?` shows the last
      code.
  - id: card-and-vs-semicolon
    concept: tooling.exit-codes
    front: Why is `cd old && rm *.html` safer than `cd old; rm *.html`?
    back: >-
      `&&` runs `rm` only if `cd` worked. With `;`, a failed `cd` leaves `rm` deleting files
      where you already were.

