id: algo.stacks-and-queues
title: Stacks and the monotonic stack
objective: Check nesting with a stack, find the next larger item for every position in one pass, and avoid the slow end of a JavaScript array.
level: essential
minutes: 10
concepts: [algo.stack-matching, algo.monotonic-stack]
prerequisites: [algo.prefix-sums]
opening:
  text: >-
    You'll check brackets and answer "when does it next go up" in one pass each. Both
    are coding-round staples, and the slow versions look almost the same.

steps:
  - type: prose
    id: picture-stacks
    body: |-
      A **stack** is a pile of plates: you add to the top and take from the top. The newest
      item comes out first.

      In JavaScript an array is a stack when you only use its end: `push` adds, `pop`
      removes and returns the last item. Both are O(1).

      Reach for a stack when a task says: nesting, matching pairs, undo, or "the most
      recent one that's still open".

  - type: multiple-choice
    id: spot-stack-signal
    concept: algo.stack-matching
    difficulty: 1
    question: Which task wants a stack?
    choices:
      - text: Check that a template's `{{` and `}}` tags nest properly
        correct: true
        feedback: >-
          Yes. Nesting means the latest opener must close first.
      - text: Total the sales between two dates, many times
        feedback: >-
          Many range totals on fixed data is a prefix sum, not a stack.
      - text: Serve support tickets in the order they arrived
        feedback: >-
          First in, first out is a queue. A stack serves the newest first.
      - text: Find the cheapest flight in a sorted price list
        feedback: >-
          In a sorted list the cheapest is the first item. No stack needed.

  - type: prose
    id: name-stack-matching
    body: |-
      Brackets close in reverse order of opening, so a stack fits exactly:

      ```js
      const pairs = { ')': '(', ']': '[', '}': '{' };
      for (const char of text) {
        if ('([{'.includes(char)) stack.push(char);
        else if (char in pairs && stack.pop() !== pairs[char]) return false;
      }
      return stack.length === 0;
      ```

      This is **matching with a stack**. Each character costs O(1), so the check is O(n).

  - type: bug-hunt
    id: hunt-unclosed-input
    concept: algo.stack-matching
    difficulty: 2
    language: js
    code: |
      const pairs = { ')': '(', ']': '[', '}': '{' };
      function balanced(text) {
        const stack = [];
        for (const char of text) {
          if ('([{'.includes(char)) stack.push(char);
          else if (stack.pop() !== pairs[char]) return false;
        }
        return true;
      }
    prompt: >-
      A hidden test fails: `balanced('(()')` returns `true`. Tap the line at fault.
    lines: [8]
    reasons:
      - text: Openers left on the stack are never checked
        correct: true
        feedback: >-
          Yes. End with `return stack.length === 0`.
      - text: '`pop` on an empty stack throws'
        feedback: >-
          It doesn't throw in JavaScript: it returns `undefined`. That case already fails the check.
      - text: The `for...of` loop skips the last character
        feedback: >-
          `for...of` visits every character. The loop ends fine; the result ignores what's left.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Openers left unclosed, like `((`
          correct: true
          feedback: >-
            Yes. Leftover openers are exactly what the last line ignores.
        - text: A closer with no opener, like `)`
          feedback: >-
            `pop` gives `undefined`, which fails the match, so it already returns `false`.
        - text: An empty string
          feedback: >-
            `true` is the right answer for nothing at all, so this passes.
    fix: |
      return stack.length === 0;

  - type: code-challenge
    id: write-balanced
    concept: algo.stack-matching
    difficulty: 3
    language: python
    starter: balanced.starter.py
    solution: balanced.solution.py
    tests: balanced.tests.py
    twin:
      language: ts
      starter: balanced.starter.ts
      solution: balanced.solution.ts
      tests: balanced.tests.ts
    prompt: >-
      A config editor underlines unbalanced brackets. Write `is_balanced(text)`, or
      `isBalanced` in TypeScript. It returns true when every `(`, `[` and `{` closes in the
      right order. Other characters don't matter.


      `is_balanced('{"ids": [1, (2)]}')` is true. `is_balanced('(]')` is false.


      **Target:** O(n) for text up to 200,000 characters. The tests include an empty
      string, a stray closer and 100,000 nested pairs. Deleting `()` pairs until none are
      left runs out of time there.
    hints:
      - The bracket that must close next is the most recent one still open.
      - A list is a stack when you only add and remove at the end. What if a closer arrives when it's empty?
      - 'Map each closer to its opener, `")"` to `"("` and so on. After the loop, the stack must be empty.'

  - type: prose
    id: name-monotonic-stack
    body: |-
      A harder cousin: for each day's price, find the next higher one. Keep a stack of days
      still waiting for an answer:

      ```text
      prices 5, 3, 4     stack (bottom to top): 5, 3
      4 arrives          pops 3 and answers it: 4. Stack: 5, 4
      ```

      The waiting prices only fall from bottom to top. That's a **monotonic stack**: always
      in order. Signals: "next greater", "next smaller", "how many days until".

  - type: ai-review
    id: review-unshift-stack
    concept: algo.monotonic-stack
    difficulty: 3
    language: js
    request: Write nextHigher(prices), the next higher price for each day, or -1.
    flawClass: performance
    code: |
      function nextHigher(prices) {
        const next = prices.map(() => -1);
        const stack = [];
        for (let i = 0; i < prices.length; i++) {
          while (stack.length > 0 && prices[stack[0]] < prices[i]) {
            next[stack.shift()] = prices[i];
          }
          stack.unshift(i);
        }
        return next;
      }
    prompt: >-
      An assistant wrote this. Every small test passed. On 100,000 falling prices it took
      several seconds. Tap the line at fault.
    lines: [6, 8]
    reasons:
      - text: Changing the front of an array moves every item
        correct: true
        feedback: >-
          Yes. `shift` and `unshift` are O(n) each. Use the end instead.
      - text: The `while` makes it O(n²) on any input
        feedback: >-
          The `while` is fine: each index leaves once. The cost is in which end you use.
      - text: '`prices.map` runs once per loop'
        feedback: >-
          It runs once, before the loop. The slow part repeats inside the loop.
    fix: |
      while (stack.length > 0 && prices[stack[stack.length - 1]] < prices[i]) {
        next[stack.pop()] = prices[i];
      }
      stack.push(i);

  - type: prose
    id: queue-with-head
    body: |-
      Queues hit the same trap from the other end. A **queue** serves the oldest item
      first, and `shift()` takes it, then moves every other item down one place.

      Draining 100,000 tickets with `shift()` in a loop is O(n²). Keep a `head` index
      instead: read `queue[head]`, then `head++`. Each ticket costs O(1). Python has
      `collections.deque` for this.

  - type: code-challenge
    id: write-days-to-wait
    concept: algo.monotonic-stack
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: warmer.starter.py
      solution: warmer.solution.py
      tests: warmer.tests.py
    prompt: >-
      A weather app shows "warmer in N days" under each forecast. Write
      `daysToWait(temps)`: for each day, how many days until a strictly warmer one, or `0`
      if none comes.


      `daysToWait([13, 14, 12, 11, 15])` is `[1, 3, 2, 1, 0]`.


      **Target:** O(n) for up to 100,000 days. The tests include equal temperatures, one
      day, no days, and 100,000 falling days. Looking ahead from each day runs out of time.
    hints:
      - The next-higher-price review has the shape you need, once it uses the end of the array.
      - Keep day numbers on the stack, not temperatures. The wait is the difference of two days.
      - 'Pop while the day on top is cooler than today, and write `today - thatDay` for it.'

  - type: explain-back
    id: explain-monotonic-linear
    concept: algo.monotonic-stack
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer points at your `while` inside a `for` and says "so that's O(n²)".
      What do you answer?
    rubric:
      - Each day is pushed onto the stack exactly once.
      - Each day is popped at most once, and every `while` pass pops one.
      - So all the `while` passes together run at most n times, and the total is O(n).
    modelAnswer: >-
      Not here: count work per day, not per loop. Every day is pushed once. A `while` pass
      always pops a day, and a popped day never comes back. So across the whole run the
      `while` body runs at most n times. Add the n pushes and it's O(n), with O(n) space
      for the stack in the worst case.

recap:
  - Match nested brackets with a stack and check it's empty at the end.
  - Answer next-greater questions in one pass with a monotonic stack.
  - Use the end of a JavaScript array, and a head index for queues.
recall:
  - id: card-bracket-end
    concept: algo.stack-matching
    front: After the loop, what must a bracket checker still test?
    back: >-
      That the stack is empty. Leftover openers were never closed.
  - id: card-stack-ends
    concept: algo.monotonic-stack
    front: Why use `push` and `pop` for a stack in JavaScript, not `unshift` and `shift`?
    back: >-
      The end of an array changes in O(1). Changing the front moves every other item.
  - id: card-monotonic-holds
    concept: algo.monotonic-stack
    front: In a next-greater search, what does the monotonic stack hold?
    back: >-
      Indexes still waiting for a greater item, with values that fall from bottom to top.
  - id: card-queue-head
    concept: algo.stack-matching
    front: How do you take items from the front of a queue in O(1) in JavaScript?
    back: >-
      Keep a `head` index. Read `queue[head]` and increment it, instead of calling `shift()`.

references:
  - kind: docs
    title: 'Array.prototype.shift()'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/shift
    note: Shift moves every remaining element down one index.
    verified: true
  - kind: docs
    title: Minimum stack / Minimum queue
    authors: cp-algorithms contributors
    venue: Algorithms for Competitive Programming
    url: https://cp-algorithms.com/data_structures/stack_queue_modification.html
    note: A stack and a queue that answer minimum queries, including a queue built from two stacks.
    verified: true

deepDive: >-
  **Skylines and histograms.** The largest rectangle in a histogram is the monotonic stack's
  best-known task. Keep a stack of increasing heights. When a lower bar arrives, each popped
  bar learns how far it stretched, so its rectangle is its height times that width. It's
  O(n) for the same reason as `daysToWait`. "Fewest rectangular blocks to build a wall of
  these heights" is the same idea: pop taller heights, and add a block only when the top
  isn't already the current height.


  **Queues in JavaScript.** V8 may make a single `shift()` cheap on small arrays, but you
  can't rely on it for large ones. A head index is portable. For a queue that keeps
  growing and shrinking, reset the array when `head` passes half its length, or use a
  ring buffer. Breadth-first search is where this trap usually appears in an interview.


  **Python.** A list is a fine stack: `append` and `pop()` work at the end in O(1). But
  `pop(0)` and `insert(0, x)` move every item, like `shift`. Use `collections.deque` for a
  queue: `popleft()` is O(1).
