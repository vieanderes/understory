term: syntax error
aka: [SyntaxError, parse error]
short: A mistake in how code is written, such as a missing bracket, that stops the whole file running.
explain: |
  Before it runs anything, JavaScript reads the whole file to understand it. If a bracket is
  missing or a quote isn't closed, it can't make sense of it. It stops before a single line
  runs.

  The message points at where it got confused, which is often after the real slip. A
  missing `}` is noticed at the end of the file. Look at the line it names, then above it.
analogy: A sentence with a word missing. The reader gives up before acting on any of it.
example:
  language: js
  code: |
    console.log("Start");
    if (total > 10 {
      console.log("Big order");
    }
    // SyntaxError: Unexpected token '{'
    // and "Start" never prints
usage: The file fails with a syntax error on line 40, but the missing bracket is on line 12.
twin:
  term: runtime-error
  difference: A syntax error stops the program before any line runs, because the code can't be read. A runtime error happens while it runs, at the first line it can't carry out.
related: [runtime-error, bug, linter]
level: 1
lessons: [basics.debugging]
