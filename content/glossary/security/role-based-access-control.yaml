term: role-based access control
aka: [RBAC, roles and permissions, user roles]
short: Giving permissions to named groups such as editor or admin, then putting each person in a group.
explain: |
  A shop has hundreds of staff. Deciding for each person which actions they may take would
  never end. So you define a few roles, give each role its permissions, and give each person
  a role.

  The code then asks "may this caller refund?", not "is this caller an admin?". Asking about
  permissions lets you change who holds them without touching every check. Deny by default:
  a missing permission means no. Roles can't express "only their own orders", so they're
  paired with ownership checks.
analogy: Keycards in an office. Your card's level opens certain doors, whoever you are.
example:
  language: ts
  code: |
    const permissions = {
      viewer: ['order:read'],
      support: ['order:read', 'order:refund'],
    } as const;

    function can(role: keyof typeof permissions, action: string) {
      return (permissions[role] as readonly string[]).includes(action);
    }
usage: Add a refund permission to role-based access control rather than checking for the admin role in the handler.
related: [authorisation, idor, least-privilege, authentication]
level: 2
lessons: [backend.authorisation]
