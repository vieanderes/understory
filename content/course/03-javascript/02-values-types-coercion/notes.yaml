summary: >-
  Every value in JavaScript has a type, but variables don't. The same `total` can hold a
  number on one line and a string on the next, and operators decide at run time what to do
  with whatever they receive. When an operator meets a type it can't use, it converts the
  value instead of failing. That silent conversion is **coercion**, and it's behind a whole
  family of bugs: totals of `"21"`, a reading of 0 treated as missing, `NaN` spreading
  through a calculation.


  Coercion follows a small set of rules, not whims. There are three target types: number,
  string and boolean. `+` prefers strings, every other arithmetic operator wants numbers,
  and a condition wants a boolean. `==` has its own conversion table, which is why most
  teams ban it in favour of `===`.


  The professional habit is to convert once, at the edge, on purpose. Text from a form, a URL
  or a JSON reply becomes a number with `Number()`, is checked with `Number.isFinite`, and
  everything after that works with real numbers. Interviewers love this topic because a few
  lines of output show whether you know the rules or have only memorised the weird cases.
remember:
  - Use `===` and `!==`; `==` converts types first, and the one accepted exception is `value == null`, which matches `null` and `undefined` only.
  - '`+` joins as soon as either side is a string after conversion to a primitive; `-`, `*`, `/` and `%` always convert to numbers.'
  - 'The falsy values are `false`, `0`, `-0`, `0n`, `""`, `null`, `undefined` and `NaN`; everything else is truthy, including `"0"`, `"false"`, `[]` and `{}`.'
  - '`typeof null` is `"object"`, a bug kept for compatibility, so test for null with `value === null`.'
  - '`NaN` is the only value not equal to itself; test for it with `Number.isNaN`, not the global `isNaN`, which converts first.'
  - '`Number("")` and `Number("   ")` are 0, so an empty form field passes as zero unless you check for empty text first.'
  - Convert input once at the boundary with `Number()` and validate with `Number.isFinite`, so the rest of the code never guesses.
sections:
  - title: Primitives, objects and what typeof reports
    body: |-
      JavaScript has seven **primitive** types: string, number, bigint, boolean, undefined,
      symbol and null. Everything else, arrays and functions included, is an object.
      Primitives are immutable values; objects are mutable and compared by reference.

      `typeof` returns a string naming the type, with two famous quirks:

      ```js
      console.log(typeof "2"); // string
      console.log(typeof 2); // number
      console.log(typeof 10n); // bigint
      console.log(typeof undefined); // undefined
      console.log(typeof NaN); // number
      console.log(typeof null); // object
      console.log(typeof []); // object
      console.log(typeof function () {}); // function
      console.log(typeof notDeclaredAnywhere); // undefined, no error
      ```

      `typeof null` being `"object"` dates from the first implementation, where values carried
      a type tag and null's tag matched objects. Fixing it would break old sites, so it stays.
      The practical rules follow from the quirks:

      - Check for null with `value === null`.
      - Check for an array with `Array.isArray(value)`.
      - Check for "a real object" with `value !== null && typeof value === "object"`.
      - `NaN` has type number, so `typeof x === "number"` doesn't prove the value is usable.
        `Number.isFinite(x)` does: it's false for `NaN`, `Infinity` and anything that isn't a
        number.

      `typeof` on a name that was never declared returns `"undefined"` instead of throwing,
      which is why old code used it to detect browser features.
  - title: The conversion rules underneath
    body: |-
      Every coercion goes through one of three abstract operations from the specification:
      **ToNumber**, **ToString** and **ToBoolean**. Objects first go through
      **ToPrimitive**, which calls `valueOf()` and then `toString()` until it gets a
      primitive. An array's `toString` joins its items with commas, and a plain object's
      gives `"[object Object]"`.

      ```js
      // ToNumber
      console.log(Number(null)); // 0
      console.log(Number(undefined)); // NaN
      console.log(Number(true)); // 1
      console.log(Number(" 42 ")); // 42, whitespace is trimmed
      console.log(Number("4 2")); // NaN
      console.log(Number("0x10")); // 16
      console.log(Number([])); // 0, because [] becomes ""
      console.log(Number([5])); // 5, because [5] becomes "5"
      console.log(Number([1, 2])); // NaN, because it becomes "1,2"

      // The + rule: primitives first, then join if either is a string
      console.log(1 + null); // 1
      console.log(1 + undefined); // NaN
      console.log(true + 1); // 2
      console.log([] + []); // an empty line: the result is ""
      console.log([] + {}); // [object Object]
      console.log("5" - 2); // 3
      console.log("5" * "2"); // 10
      ```

      Read `[] + {}` step by step: both sides are objects, so both become primitives, `""`
      and `"[object Object]"`. One is a string, so `+` joins them. No magic, only the rules
      applied in order.

      Comparisons with `<` and `>` add one more trap. If both sides are strings, they're
      compared character by character, like words in a dictionary. So `"10" < "9"` is `true`,
      while `10 < "9"` is `false`, because a number on either side makes both numbers. Sorting
      prices read from a form as text puts 100 before 20.
  - title: How == decides
    body: |-
      `==` is the **abstract equality** algorithm. `===` is **strict equality**: different
      types are never equal, and no conversion happens. The loose version runs through a
      short list:

      1. Same type: compare like `===`.
      2. `null` and `undefined` equal each other and nothing else.
      3. Number and string: the string becomes a number.
      4. A boolean on either side becomes a number first, `true` to 1 and `false` to 0.
      5. An object next to a primitive becomes a primitive.

      ```js
      console.log(null == undefined); // true
      console.log(null == 0); // false, rule 2
      console.log("" == 0); // true, "" becomes 0
      console.log("0" == false); // true, both become 0
      console.log([] == false); // true, [] becomes "" and then 0
      console.log([] == ![]); // true, ![] is false, and see the line above
      console.log([] == []); // false, two different objects
      console.log(NaN == NaN); // false
      console.log(null >= 0); // true, relational operators use ToNumber
      console.log(null > 0); // false
      ```

      The last two lines show that `==` and `>=` don't even agree with each other: `null` is
      neither greater than nor equal to 0, yet it is greater than or equal to 0. Rule 4
      catches people most often. `"1" == true` is true, but `"yes" == true` is false, because
      `true` becomes 1, not "any truthy value".

      There's a third equality, `Object.is`, called **SameValue**. It behaves like `===`
      except that `Object.is(NaN, NaN)` is `true` and `Object.is(0, -0)` is `false`. Array
      `includes` uses a close cousin, so `[NaN].includes(NaN)` is `true` while
      `[NaN].indexOf(NaN)` is `-1`.
  - title: Turning input into numbers safely
    body: |-
      Every form field, URL parameter and header arrives as a string. A JSON body may send a
      number, or a string that looks like one. The safe pattern converts once and rejects
      anything that isn't a finite number, including empty text, which `Number` would happily
      turn into 0.

      ```js
      function toQuantity(text) {
        if (text.trim() === "") return null; // Number("") would say 0
        const value = Number(text);
        if (!Number.isInteger(value) || value < 0) return null;
        return value;
      }

      console.log(toQuantity("3")); // 3
      console.log(toQuantity(" 3 ")); // 3
      console.log(toQuantity("")); // null
      console.log(toQuantity("abc")); // null
      console.log(toQuantity("2.5")); // null
      console.log(toQuantity("-1")); // null
      console.log(toQuantity("0")); // 0
      ```

      Returning `null` rather than 0 lets the caller tell "nothing valid" from "zero". The
      checks lean on the `Number.` versions of the helpers, which never convert:

      ```js
      console.log(isNaN("abc")); // true, "abc" is converted to NaN first
      console.log(Number.isNaN("abc")); // false, a string isn't the NaN value
      console.log(isFinite("5")); // true
      console.log(Number.isFinite("5")); // false
      ```

      The global `isNaN` and `isFinite` convert their argument, which answers a different
      question from the one you meant. Prefer `Number.isNaN`, `Number.isFinite` and
      `Number.isInteger`. In TypeScript the input types force the conversion to be explicit,
      which is a large part of why teams adopt it.
pitfalls:
  - '**Using `==` because it seems to work.** It works until a `0`, `""` or `[]` arrives, as in the lesson''s weather widget. Use `===`, and allow `== null` only if your team''s lint rule does.'
  - '**Testing a number with `if (value)`.** A real 0 is falsy, so a count, a price or a temperature of zero takes the "missing" branch. Test what you mean: `value === undefined`, `value == null` or `Number.isFinite(value)`.'
  - '**Treating an empty field as 0.** `Number("")` is 0, so a blank quantity looks like a valid zero. Check `text.trim() === ""` before converting.'
  - '**Comparing with `NaN`.** `x === NaN` is always false, even when `x` is `NaN`. Use `Number.isNaN(x)`.'
  - '**Comparing numbers that are still strings.** `"10" < "9"` is true, and sorting text puts `"100"` before `"20"`. Convert before comparing or sorting.'
  - '**Trusting `typeof x === "object"`.** It is true for `null` and for arrays. Add `x !== null`, and use `Array.isArray` for arrays.'
verify:
  - lens: breaks
    check: 'Every value read from a form field is converted with `Number` before any `+`, or totals join as text.'
  - lens: breaks
    check: 'Comparisons use `===`, so a reading of `0` never matches an empty string by accident.'
  - lens: breaks
    check: 'A count, price or temperature of zero is tested with `=== undefined` or `== null`, never with a bare `if (value)`.'
  - lens: tests
    check: 'Test each conversion with `0`, an empty field and junk like `"abc"`, and check `Number.isNaN` catches the junk.'
interview:
  - question: What's the difference between == and ===?
    answer: >-
      `===` compares without converting, so values of different types are never equal;
      `==` converts first, using the abstract equality rules. Under `==`, a string next to a
      number becomes a number, booleans become 0 or 1, objects become primitives, and `null`
      and `undefined` equal each other only. That's how `"" == 0`, `"0" == false` and
      `[] == false` are all true. I use `===` everywhere, because the result depends only on
      the values and a reader doesn't need the table. The one idiom I accept is
      `value == null`, which is a compact way to match `null` or `undefined`, though many
      codebases write both checks out to satisfy a lint rule.
  - question: Why is typeof null "object"?
    answer: >-
      It's a bug from the first JavaScript engine that can never be fixed. Values were stored
      with a small type tag, the tag for objects was 0, and null was the null pointer, which
      also read as 0. Correcting it would break sites that rely on it, so the language keeps
      it. The practical consequence is that `typeof value === "object"` is true for null, and
      code that then reads a property throws. So I check null explicitly with
      `value === null`, test "is an object" as `value !== null && typeof value === "object"`,
      and use `Array.isArray` for arrays, since `typeof []` is also `"object"`.
  - question: Walk me through why `[] == ![]` is true.
    answer: >-
      It's the equality rules applied one at a time. First, `![]` is evaluated: an array is
      an object, objects are truthy, so `![]` is `false`. Now we have `[] == false`. A
      boolean in a loose comparison becomes a number, so it's `[] == 0`. An object next to a
      primitive goes through ToPrimitive: the array's `toString` joins no items and gives
      `""`, so it's `"" == 0`. A string next to a number becomes a number, and `Number("")` is
      0, so `0 == 0`, which is true. The lesson isn't to memorise it, but that `==` stacks
      several conversions, which is why I use `===`.
  - question: How do you check whether a value is NaN, and why is it awkward?
    answer: >-
      Use `Number.isNaN(value)`. `NaN` is the only value that isn't equal to itself, so
      `value === NaN` is always false, even for `NaN`. The global `isNaN` converts its
      argument to a number first, so `isNaN("abc")` is true for a string, which answers
      "would this fail to convert?" rather than "is this NaN?". `Number.isNaN` doesn't
      convert, so it's only true for the actual `NaN` value. `Object.is(value, NaN)` also
      works. In validation I usually want the broader question, "is this a usable number?",
      and `Number.isFinite` answers that in one call, rejecting `NaN`, both infinities and
      non-numbers.
  - question: Which values are falsy in JavaScript?
    answer: >-
      Eight: `false`, `0`, `-0`, `0n`, the empty string, `null`, `undefined` and `NaN`.
      Everything else is truthy, including every object and array, even empty ones, and
      strings such as `"0"`, `"false"` and a single space. It matters because conditions,
      `!`, `&&` and `||` all apply this conversion. The common bug is using truthiness to
      mean "present": a count of 0 or an empty but valid string is treated as missing. So I
      use truthiness for things that are truly optional objects, and explicit comparisons, or
      `??`, when 0 or an empty string is a real value.
  - question: What's the difference between `null` and `undefined`?
    answer: >-
      Both mean "no value", but they usually say different things. `undefined` is what
      JavaScript gives you when nothing was set: a missing object key, a parameter nobody
      passed, a function with no `return`. `null` is what a person writes on purpose to say
      "deliberately empty", such as a user with no manager. They behave differently in a
      few places: `typeof null` is `"object"`, a historical quirk, and `JSON.stringify`
      drops keys whose value is `undefined` but keeps `null`. For code that treats both as
      missing, `??` and optional chaining handle them together, and `value == null` matches
      exactly those two. Many teams pick one for "empty" in their own data, often `null`
      from APIs and databases, and let `undefined` mean "not set".
terms:
  - term: Coercion
    say: JavaScript being weird.
    means: "An automatic conversion to number, string or boolean when an operator gets a type it can't
      use. It follows fixed rules: `+` prefers strings, other arithmetic wants numbers, a condition
      wants a boolean."
  - term: "`==` and `===`"
    say: "`==` compares values, `===` also compares types."
    means: "`===` never converts. `==` converts by its own table first, so `'' == 0` is true; the one
      accepted use is `value == null`, which matches only `null` and `undefined`."
  - term: Falsy
    say: Empty things are falsy.
    means: "Exactly eight values are falsy: `false`, `0`, `-0`, `0n`, `''`, `null`, `undefined` and
      `NaN`. `[]`, `{}` and `'0'` are all truthy."
  - term: NaN
    say: Not a number, so it isn't a number.
    means: A value of type number that isn't equal to itself. Test for it with `Number.isNaN`, because
      the global `isNaN` converts its argument first.
  - term: "`typeof null`"
    say: "`null` is an object."
    means: It returns `'object'` because of an early bug kept for compatibility. `null` is a primitive,
      so test for it with `value === null`.
  - term: "`null` and `undefined`"
    say: They mean the same thing.
    means: "`undefined` is what JavaScript gives for something never set; `null` is what code sets on
      purpose to mean no value. They're `==` to each other but not `===`."
