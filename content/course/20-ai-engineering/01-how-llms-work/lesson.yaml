id: ai.how-llms-work
title: How LLMs work
objective: "Explain how a language model writes text one token at a time, why the same prompt can give different answers, and why a chat model answers instead of rambling on."
level: essential
minutes: 10
concepts: [ai.tokens, ai.sampling, ai.training-stages]
prerequisites: [pyai.first-model-call]
opening:
  text: >-
    You'll build the loop at the heart of every language model, and see why the same
    question gets different answers. Most surprises in AI engineering trace back to it.

steps:
  - type: prose
    id: next-token
    body: >-
      A **language model** is a program that, given some text, predicts what comes next.
      Think of your phone's keyboard suggestions, trained on a large share of the internet.


      It predicts one small piece at a time. To write a reply, the model runs in a loop:
      predict the next piece, add it to the text, and predict again. It stops at a special
      end piece, or when it hits `max_tokens`.

  - type: fill-blank
    id: fill-generation-loop
    concept: ai.tokens
    difficulty: 1
    language: python
    prompt: >-
      `model(tokens)` gives each possible next piece a probability, and `most_likely` picks
      the top one. Complete the loop.
    template: |
      tokens = ["The", " cat"]
      while len(tokens) < 50:
          token = most_likely(model({{1}}))
          if token == "<end>":
              {{2}}
          tokens.{{3}}(token)
    blanks:
      - key: '1'
        answer: tokens
      - key: '2'
        answer: break
      - key: '3'
        answer: append
    bank: [tokens, token, break, continue, append, pop]

  - type: prose
    id: tokens
    body: >-
      Those pieces are **tokens**. A **tokeniser** splits text into pieces from a fixed
      list of tens of thousands. It builds that list with **byte pair encoding** (BPE):
      keep merging the most common pair of neighbouring pieces. So common words are one
      token, and a rare name becomes several.


      Prices, `max_tokens` and how much a model reads are counted in tokens. Tokens aren't
      words: JSON needs far more than prose.

  - type: ai-review
    id: review-words-as-tokens
    concept: ai.tokens
    difficulty: 2
    language: python
    request: Refuse prompts that are too long for our budget of 8,000 tokens.
    flawClass: logic
    code: |
      MAX_TOKENS_IN = 8_000

      def check_prompt(prompt: str) -> None:
          token_count = len(prompt.split())
          if token_count > MAX_TOKENS_IN:
              raise ValueError("Prompt too long")
    prompt: >-
      An assistant wrote this. English prompts pass as expected. Then a user pasted a page
      of JSON logs, and the bill was three times the budget. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Words and tokens aren't the same thing
        correct: true
        feedback: >-
          Yes. JSON full of brackets and ids splits into far more tokens than words.
      - text: '`split` should split on commas for JSON'
        feedback: >-
          Any split still counts words. The model counts tokens, with its own tokeniser.
      - text: The limit should be checked with `>=`
        feedback: >-
          That changes one prompt of exactly 8,000. The count itself is badly off.
    verify:
      question: "Which test would have caught this?"
      choices:
        - text: "A page of JSON logs, checked with the token counter"
          correct: true
          feedback: "Yes. JSON is where words and tokens part ways."
        - text: "A short English paragraph"
          feedback: "Words and tokens are close for plain prose, so it passes either way."
        - text: "A prompt of exactly 8,000 words"
          feedback: "That tests the boundary. A word count still misjudges what the model reads."
    fix: |
      MAX_TOKENS_IN = 8_000

      def check_prompt(client, prompt: str) -> None:
          count = client.messages.count_tokens(model="claude-opus-5-5",
              messages=[{"role": "user", "content": prompt}])
          if count.input_tokens > MAX_TOKENS_IN:
              raise ValueError("Prompt too long")

  - type: prose
    id: sampling
    body: |-
      The model doesn't hand back one next token. It gives every token a probability, and
      one is then drawn:

      ```python
      probs = {" mat": 0.62, " sofa": 0.21, " roof": 0.09, " moon": 0.01}

      greedy = max(probs, key=probs.get)   # " mat", every time
      drawn = random.choices(list(probs), weights=list(probs.values()))[0]
      ```

      Drawing is called **sampling**. It's usually `" mat"`, sometimes `" sofa"`. **Temperature**
      tunes it: low makes the top token win nearly always, high gives the others more
      chances.


      Two settings trim the list first. **Top-k** keeps the k likeliest tokens. **Top-p**
      keeps the fewest top tokens whose chances add up to p.

  - type: code-challenge
    id: write-sample
    concept: ai.sampling
    difficulty: 4
    language: ts
    starter: sample.starter.ts
    solution: sample.solution.ts
    tests: sample.tests.ts
    twin:
      language: python
      starter: sample.starter.py
      solution: sample.solution.py
      tests: sample.tests.py
    prompt: >-
      Build the draw itself. A model really outputs **logits**: one raw score
      per token. `softmax` turns them into probabilities.


      Write `softmax(logits)`: subtract the largest logit from each, take `Math.exp`, then
      divide by the sum. Write `sample(logits, options, random)`. Temperature `0` returns
      the index of the highest logit. Otherwise divide each logit by the temperature, take
      softmax, and rank tokens most likely first.


      Keep the first `topK`. Then keep tokens while the running total is under `topP`. Draw
      with `random() * total` and walk the list, subtracting each probability. Return the
      token's id, its index in `logits`.


      A random draw can't be tested, so the tests pass their own `random`. That's the fix for
      a test that fails one run in five.
    hints:
      - "`Math.exp(1000)` is `Infinity`. Subtracting the largest logit first keeps every value at 1 or less."
      - "`probs.map((p, id) => ({ id, p }))` keeps each token's id before you sort by `p`."
      - In the last loop, return the first token where the dart drops to 0 or below.
  - type: prose
    id: training-stages
    body: >-
      Where do the probabilities come from? First, **pre-training**: the model reads a huge
      amount of text and learns to predict the next token. The result, a **base model**,
      continues any text.


      Then **post-training** turns it into an assistant. It learns from example
      conversations, and from people's rankings of better and worse answers. Now the likely
      next text after a question is an answer.

  - type: multiple-choice
    id: pick-base-model-reply
    concept: ai.training-stages
    difficulty: 2
    question: 'A base model is given one line: `What is the capital of France`. What might it write next?'
    choices:
      - text: 'More quiz questions, like "What is the capital of Spain?"'
        correct: true
        feedback: >-
          Yes. Web pages often list questions. A base model continues, it doesn't answer.
      - text: '"Paris."'
        feedback: >-
          That's what an assistant says. Answering is learnt in post-training.
      - text: A refusal to answer
        feedback: >-
          Refusing is taught in post-training too. A base model only continues text.

  - type: code-challenge
    id: write-generate
    concept: ai.tokens
    difficulty: 3
    language: python
    starter: generate.starter.py
    solution: generate.solution.py
    tests: generate.tests.py
    prompt: >-
      Write `generate(model, tokens, max_tokens)`, the loop inside every language model.
      `model(tokens)` returns a dict of next tokens and their probabilities. Pick the most
      likely each time.


      Stop at `END` without adding it, and return what you wrote and `"end_turn"`. Or stop
      after `max_tokens` new tokens, and return them with `"max_tokens"`. Don't change the
      `tokens` list you're given.
    hints:
      - Keep the new tokens in their own list, and pass the prompt plus that list to `model`.
      - '`max(probs, key=probs.get)` gives the most likely token.'
      - 'Start with `written = []` and loop `while len(written) < max_tokens:`.'

  - type: explain-back
    id: explain-different-answers
    concept: ai.sampling
    difficulty: 3
    audience: non-technical
    kind: explain
    prompt: "A support manager asks why the bot gave one customer two different answers to the same question. Explain it without jargon."
    rubric:
      - "The bot writes its reply one small piece at a time."
      - "Each piece is picked partly by chance from the likely options."
      - "One different early pick sends the rest of the reply a different way."
    modelAnswer: "The bot writes a reply a word or so at a time. At each step it has several likely next words, and it picks one partly by chance. Usually it picks the likeliest, but not always. Once one early word differs, everything after it builds on that word, so the two replies drift apart. That's how these tools work. It isn't a fault with this customer."

recap:
  - Describe a language model as a loop that predicts one token at a time.
  - Count text in tokens with the provider's counter, never in words.
  - Write sampling with temperature, top-k and top-p, and explain base and chat models.

recall:
  - id: card-next-token
    concept: ai.tokens
    front: How does a language model write a reply?
    back: >-
      In a loop: predict the next token, add it, predict again, until an end token or
      `max_tokens`.
  - id: card-tokens
    concept: ai.tokens
    front: Why not estimate a prompt's size by counting words?
    back: >-
      The model counts tokens from its own tokeniser. Code, JSON, names and other languages
      use far more tokens than words. Ask the API to count.
  - id: card-temperature
    concept: ai.sampling
    front: What does temperature change?
    back: >-
      How the next token is drawn. Low makes the likeliest token win nearly always. High
      gives less likely tokens more chances.
  - id: card-top-p
    concept: ai.sampling
    front: What do top-k and top-p remove before the draw?
    back: >-
      Top-k keeps only the k likeliest tokens. Top-p keeps the fewest top tokens whose
      probabilities add up to p, so the list shrinks when the model is sure.
  - id: card-base-vs-chat
    concept: ai.training-stages
    front: What does post-training add to a base model?
    back: >-
      Answering instead of continuing: it learns from example conversations and from
      people's rankings of better and worse answers.

references:
  - kind: paper
    title: Language Models are Few-Shot Learners
    authors: Tom B. Brown et al.
    year: 2020
    venue: NeurIPS 2020
    url: https://arxiv.org/abs/2005.14165
    note: Pre-training on next-token prediction, and what a base model can do.
    primary: true
    verified: true
  - kind: paper
    title: Training language models to follow instructions with human feedback
    authors: Long Ouyang et al.
    year: 2022
    venue: NeurIPS 2022
    url: https://arxiv.org/abs/2203.02155
    note: How post-training turns a base model into an assistant.
    primary: true
    verified: true
  - kind: docs
    title: Token counting
    authors: Anthropic
    venue: Claude Platform documentation
    url: https://platform.claude.com/docs/en/build-with-claude/token-counting
    note: Counting a request's tokens before you send it.
    verified: true

deepDive: >-
  **Attention.** Inside, a model called a transformer reads every earlier token at each
  step and weighs how much each one matters for the next. That's attention. It's why a
  model can use a name from ten pages back. The paper "Attention Is All You Need" (2017)
  introduced it.


  **Temperature in practice.** Some APIs take a `temperature` setting from 0 to 1 or 2.
  Current Claude models, Opus 5.5 and Sonnet 5.5, reject `temperature`, `top_p` and
  `top_k` with a `400` error, and the Python SDK 1.x no longer takes them. Check the model's
  docs before you set it. Even at
  temperature 0, answers can still vary slightly between runs. Design your tests for
  that.


  **Thinking.** Current models can write hidden reasoning tokens before the answer, which
  you pay for as output. It's the same loop, with some of the text kept for the model's
  own use.
