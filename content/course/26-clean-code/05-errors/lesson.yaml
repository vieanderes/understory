    note: The refactoring behind this lesson's challenge, from `-1` to a thrown error.
    verified: true

deepDive: >-
  Throw or return a result? A good split: failures the caller expects and must handle,
  like "card declined" or "not valid", fit a result type such as `{ ok: false, error }`,
  which TypeScript forces them to check. Bugs and outages, like a network failure, fit an
  exception, which rises to a place that can log it and answer with a generic error.


  Error messages are for two audiences. Logs get the full detail, including `cause`. Users
  and API clients get a stable, safe message and a code they can act on, never a stack or a
  database string.


  Python works the same way with different words: `raise` instead of `throw`, `except
  NotFoundError:` instead of an `instanceof` check, and `raise ... from error` instead of
  `cause`. A bare `except:` is the Python form of the swallowed error.
