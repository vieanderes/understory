summary: >-
  An amateur tell is a small sign that code wasn't reread before someone else saw it: a
  leftover `console.log`, a block of commented-out code, a variable called `data`, a bare
  `0.8`, a copied block with one value left unchanged. None of them has to break anything.
  They matter because a reviewer spots them in seconds and then reads everything else with
  less trust, and because the same habits are where real bugs hide.


  Professionals don't avoid tells by willpower. They hand everything mechanical to tools: a
  formatter decides layout, a linter flags risky patterns, a pre-commit hook and continuous
  integration run both on every change. What's left for people is judgement: names, structure,
  error handling, and whether the change does one thing.


  The last habit is the cheapest and the one most often skipped: read your own diff, top to
  bottom, as the reviewer will, before you ask for review. It matters even more when an AI
  assistant wrote part of the code, because generated code has its own tells, and you're the
  one who signs it off.
remember:
  - Reread your own diff before asking for review, because most tells vanish in that one pass.
  - A tell rarely breaks the code, but it costs the reviewer's trust in every other line of the change.
  - Leftover debug code is worst when it changes behaviour, such as a test value assigned in the middle of a function.
  - Hand layout to a formatter and risky patterns to a linter, so reviews discuss design, not spacing.
  - A finished change holds one logical change, with no stray files, unused imports or unrelated reformatting.
  - An empty `catch` block hides failures; handle the error, or rethrow it with context using `cause`.
  - Copy-paste invites bugs because the copy gets edited in some places and not others, so extract the shared part once it repeats.
  - Name a number or a string that carries meaning, so the name says why it has that value.
sections:
  - title: The tells beyond the obvious ones
    body: |-
      The lesson covers the tells anyone notices: debug output, commented-out code, vague
      names, unnamed numbers and half-edited copies. A senior reviewer looks for a second
      layer too. Each has a plain replacement.

      - **Swallowed errors.** `catch (e) {}` turns a failure into silence. Handle it, or rethrow
        with context: `throw new Error("Could not save", { cause: error })`.
      - **Boolean flag parameters.** `process(items, true)` says nothing at the call site. Use
        an options object, `{ isMember: true }`, or two functions with clear names.
      - **Deep nesting.** Three `if` levels hide the main path. Return early with guard clauses
        so the normal case reads at the left margin.
      - **Loose comparisons.** `==` converts types first, so `0 == ""` is `true`. Use `===`
        everywhere.
      - **Redundant logic.** `if (x === true) return true; else return false;` is `return x;`
        when `x` is a boolean.
      - **Mutating arguments.** A function that edits the array it was given surprises the
        caller. Return a new value instead.
      - **Comments that narrate.** `// loop over users` repeats the code. A comment should say
        why: a business rule, a workaround, a link to an issue.
      - **Rebuilt standard library.** A hand-written loop to find the largest number, or a
        custom deep copy, where `Math.max(...values)` or `structuredClone` already exists.
      - **A `TODO` with no owner.** It never gets done. Link it to a ticket or do it now.
      - **Inconsistency with the file around it.** New code that uses a different style from
        its neighbours reads as a stranger's, even when both styles are fine.

      AI-written code adds its own tells: invented methods such as `array.last()`, defensive
      checks for things that can't happen, comments that restate each line, and helpers that
      nothing calls. Treat generated code as a pull request from a fast, confident colleague
      who never ran it.
  - title: 'One function, rewritten: before and after'
    body: |-
      Here is a booking report with six tells in fifteen lines. It runs, and it returns the
      right answer.

      ```js
      function process(data, flag) {
        let result = [];
        for (let i = 0; i < data.length; i++) {
          if (data[i].status == "confirmed") {
            if (flag == true) {
              result.push({ ...data[i], price: data[i].price * 0.8 });
            } else {
              result.push({ ...data[i], price: data[i].price });
            }
          }
        }
        try {
          saveReport(result);
        } catch (e) {}
        return result;
      }
      ```

      A vague function name and parameter names, a boolean flag, an unnamed `0.8`, loose
      `==`, a copied `push` that differs in one expression, and an empty `catch`. If the save
      fails, nobody will ever know. The rewrite splits the pure calculation from the side
      effect, names everything, and lets the failure travel with its cause.

      ```js
      const MEMBER_DISCOUNT = 0.2;

      function confirmedBookings(bookings, { isMember }) {
        const multiplier = isMember ? 1 - MEMBER_DISCOUNT : 1;
        return bookings
          .filter((booking) => booking.status === "confirmed")
          .map((booking) => ({ ...booking, price: booking.price * multiplier }));
      }

      async function publishReport(bookings, { isMember }) {
        const report = confirmedBookings(bookings, { isMember });
        try {
          await saveReport(report);
        } catch (error) {
          throw new Error("Could not save the bookings report", { cause: error });
        }
        return report;
      }

      const bookings = [
        { id: 1, status: "confirmed", price: 100 },
        { id: 2, status: "cancelled", price: 50 },
      ];
      console.log(confirmedBookings(bookings, { isMember: true }));
      // [ { id: 1, status: 'confirmed', price: 80 } ]
      ```

      With a `saveReport` that throws `disk full`, the caller now receives an error whose
      `message` is "Could not save the bookings report" and whose `cause.message` is
      "disk full". The pure function can also be tested without a disk, which is a sign
      the split was right.
  - title: Letting tools catch the tells
    body: |-
      Every tell a rule can describe should be caught by a machine, not a colleague. With
      ESLint 9 and its flat config, a handful of core rules covers most of the list.

      ```js
      // eslint.config.js
      import js from "@eslint/js";

      export default [
        js.configs.recommended,
        {
          rules: {
            "no-console": ["error", { allow: ["warn", "error"] }],
            eqeqeq: "error",
            "no-var": "error",
            "prefer-const": "error",
            "no-unused-vars": "error",
            "no-empty": "error",
          },
        },
      ];
      ```

      Run on the "before" function above, this config reports seven problems: `prefer-const`
      for `result`, `eqeqeq` twice, `no-unused-vars` for the unused `e`, `no-empty` for the
      empty `catch`, and so on. Only the judgement calls, such as the name `process` and the
      boolean flag, are left for a person.

      Layer the tools so nothing depends on memory:

      - **In the editor**: format on save and show lint errors as you type.
      - **Before each commit**: a hook, often Husky with lint-staged, runs the formatter and
        the linter on the staged files only, so it's fast.
      - **In continuous integration**: the same checks run again on every pull request, and a
        failure blocks the merge. Hooks can be skipped with `--no-verify`; CI can't.

      A formatter such as Prettier has almost no options on purpose. The team stops debating
      style, and every diff shows only real changes. Adopt it in one commit that formats the
      whole codebase, kept apart from any logic change, so `git blame` stays useful.
  - title: Reviewing your own diff
    body: |-
      Read the change the way the reviewer will see it, not the way you wrote it. In git,
      `git diff --staged` shows exactly what you're about to commit, and `git add -p` lets you
      stage a file hunk by hunk, so a stray debug line or an unrelated edit can stay behind.

      A short checklist for the pass:

      1. Search the diff for `console.log`, `debugger`, `TODO` and commented-out blocks.
      2. Check every new name: would a newcomer know what `result` or `info` holds?
      3. Look for any line you can't explain. If you can't say why it's there, the reviewer
         can't either.
      4. Check the change does one thing. A refactor, a reformat and a fix are three changes.
      5. Look at the list of files. Lock files, local config, `.env` files and generated output
         that you didn't mean to change don't belong.
      6. Run the tests and the linter once more on the final version.

      Small, focused changes get better reviews. Reviewers read a short diff carefully and
      skim a long one, so the bugs in a large change are the ones most likely to slip
      through. If a fix needed a refactor first, send the refactor as its own change, then the
      fix on top.
pitfalls:
  - "**Commenting code out instead of deleting it.** People keep it \"in case\". Version control already keeps it. Delete it, and mention the commit if someone might want it back."
  - "**Fixing style by hand before review.** It drifts again by the next change and wastes review time. Configure a formatter and a linter once, and run them in a hook and in CI."
  - "**Sneaking a reformat into a bug fix.** The real change drowns in noise, and reverting the fix also reverts the reformat. Put mechanical changes in a separate commit or pull request."
  - "**Leaving a value set for testing.** A line such as `order.total = 60` changes what runs, not how it looks. Test with a real test or a debugger breakpoint, never by editing the code under test."
  - "**Silencing an error to make a test pass.** An empty `catch` hides the failure until production. Handle the case you expect, and rethrow everything else with context."
  - "**Extracting too early.** Two similar lines aren't always duplication. Wait until the repetition is real and means the same thing, then extract it."
  - "**Trusting AI output because it looks tidy.** Generated code is well formatted by default, so its tells are in the content: invented APIs, dead helpers, narrating comments. Run it and read every line."
interview:
  - question: When you open a pull request to review, what do you look at first?
    answer: >-
      The description and the size, then design before details. I read what the change is
      meant to do and check the diff does only that; a fix plus a refactor plus a reformat is
      three reviews in one, and I'd ask to split it. Then I look at the shape: where the new
      code lives, whether names say what things hold, how errors are handled, and whether the
      tests cover the behaviour that changed. Style is last, and ideally absent, because a
      formatter and a linter in CI should already have settled it. Small tells such as a
      leftover log matter mostly as a signal: they tell me the author didn't reread the diff,
      so I read the rest more carefully. The trade-off is time, so I spend it on logic and
      design, not on anything a tool could flag.
  - question: How do you keep code style consistent across a team without arguing about it in reviews?
    answer: >-
      I make style a tool's job, not a person's. A formatter such as Prettier owns layout, so
      spacing and quotes are never discussed. ESLint owns risky patterns such as `==`, unused
      variables, `var` and leftover `console` calls. Both run in the editor, in a pre-commit
      hook on staged files, and again in CI, where a failure blocks the merge, because hooks
      can be skipped. For conventions no tool checks, such as naming or folder structure, we
      write a short guide and follow the style already in the file. The one cost is the first
      big reformat, which I land as a single mechanical commit so it's quick to review and to
      skip in `git blame`.
  - question: A junior's pull request works, but it has vague names, a leftover log and a copied block. How do you review it?
    answer: >-
      I review it kindly and specifically, and I separate what blocks the merge from what's a
      suggestion. The copied block is the one I'd block on, because half-edited copies are
      where bugs hide: I'd point at the duplicated lines and suggest the shared function. For
      the names I'd ask a question rather than give an order, such as "what does `data` hold
      here?", so they learn to ask it themselves. The log I'd mention once and add a lint
      rule, so the tool catches it next time instead of me. I'd also say what's good. The
      trade-off is speed against teaching: fixing it myself is faster today, but the review is
      how they stop making the same change next week.
  - question: How do you review code an AI assistant wrote?
    answer: >-
      Exactly like a pull request from a confident colleague who never ran it, and I'm
      accountable for it once it's merged. It looks tidy, so I read for content, not form. I
      check every API it calls really exists in our versions, because invented methods such
      as `array.last()` are common. I look for code that nothing uses, defensive checks for
      impossible cases, comments that restate the line, and quiet changes outside the task. I
      run it and its tests, and add a test for the edge case it's most likely to miss. The
      trade-off is that careful review eats some of the time saved, but merging unread
      generated code moves the cost to production, where it's higher.
terms:
  - term: Amateur tell
    say: A style nitpick.
    means: A small sign the code wasn't reread before review, such as a leftover log or a bare `0.8`. It
      rarely breaks anything, but it costs the reviewer's trust in every other line.
  - term: Magic number
    say: Any number written in the code.
    means: A literal whose meaning isn't obvious, such as `0.8`. A name like `DISCOUNT_RATE` says why it
      has that value; a `0` or `1` in plain arithmetic usually needs none.
  - term: Linter
    say: The tool that formats the code.
    means: That's the formatter, which decides layout. A linter flags risky patterns such as unused
      variables or floating promises, and both run in a pre-commit hook and in CI.
  - term: Empty `catch`
    say: It stops the app crashing.
    means: It hides the failure, so nobody learns it happened. Handle the error, or rethrow it with
      context using `cause`.
  - term: One logical change
    say: A small pull request.
    means: A change that does one thing, with no stray files, unused imports or unrelated reformatting,
      so a reviewer can judge it as a whole.
