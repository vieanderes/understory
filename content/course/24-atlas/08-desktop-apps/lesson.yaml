id: atlas.desktop-apps
title: "Desktop apps: Electron and Tauri"
objective: Say how Electron and Tauri turn a web app into a desktop app, and keep the page from reaching the user's files.
level: advanced
minutes: 10
concepts: [atlas.electron, atlas.webview-shells]
prerequisites: [atlas.cross-platform, security.xss-and-csp, tooling.node]
opening:
  text: >-
    You'll turn a web app into a desktop app, the way many code editors and AI assistants are
    built. And you'll stop one bug in the page from taking over the user's computer.

steps:
  - type: prose
    id: what-electron-is
    body: >-
      Many desktop apps you use are web apps inside: code editors, chat apps, AI assistants.
      Most use **Electron**, which ships Chromium, Chrome's engine, and Node inside every app.


      An Electron app has two sides. The **main process** runs Node, with full access to files
      and the system. Each window is a **renderer**: a web page, like any other.

  - type: multiple-choice
    id: pick-main-process
    concept: atlas.electron
    difficulty: 1
    question: A notes app must save to a file in the user's Documents folder. Which side can do that?
    choices:
      - text: The main process
        correct: true
        feedback: >-
          Right. It runs Node, so it can write files, like any Node program.
      - text: The renderer, it's a normal page
        feedback: >-
          A normal page can't write to your folders. That's exactly what keeps the web safe.
      - text: Neither, desktop apps can't write files
        feedback: >-
          They can, through the main process. That power is why the next steps matter.

  - type: prose
    id: name-context-isolation
    body: >-
      Now the danger. Suppose the page could use Node. Then one XSS bug, from the security
      chapter, would let an attacker run any command on the computer.


      So Electron keeps Node out of the page. A **preload script** runs first and hands the
      page a few named functions, with `contextBridge.exposeInMainWorld`. Each one asks the
      main process with `ipcRenderer.invoke`, and waits for its answer.

  - type: ai-review
    id: review-node-in-page
    concept: atlas.electron
    difficulty: 3
    language: js
    request: The notes page can't call `require('fs')` to save. Make it work.
    flawClass: security
    code: |
      const win = new BrowserWindow({
        webPreferences: {
          nodeIntegration: true,
          contextIsolation: false,
        },
      });
      win.loadURL('https://notes.example/app');
    prompt: >-
      An assistant wrote this. Saving works now. The page also shows notes shared by other
      users. Tap the line at fault.
    lines: [3]
    reasons:
      - text: It gives a web page full access to Node
        correct: true
        feedback: >-
          Yes. A shared note's script could delete files. Expose one `save` instead.
      - text: '`loadURL` should load a local file'
        feedback: >-
          A local page still shows other users' notes. The danger is Node inside the page.
      - text: The window needs a width and height
        feedback: >-
          Electron picks a default size. Nothing here is about how the window looks.
    fix: |
      const win = new BrowserWindow({
        webPreferences: { preload: path.join(__dirname, 'preload.js') },
      });
      win.loadURL('https://notes.example/app');

  - type: fill-blank
    id: fill-preload
    concept: atlas.electron
    difficulty: 2
    language: js
    prompt: >-
      Write the preload. Give the page one function, `notes.save(text)`, that asks the main
      process to save and waits for its reply.
    template: |
      // preload.js
      const { contextBridge, ipcRenderer } = require('electron');

      contextBridge.{{1}}('notes', {
        save: (text) => ipcRenderer.{{2}}('save-note', text),
      });
    blanks:
      - key: '1'
        answer: exposeInMainWorld
      - key: '2'
        answer: invoke
    bank: [exposeInMainWorld, require, invoke, on]

  - type: code-challenge
    id: write-safe-to-open
    concept: atlas.electron
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '4'
    prompt: >-
      The page can also ask the main process to open a link in the user's browser. Opening
      a `file:` link or another app's link is dangerous. Write `safeToOpen(link)`: `true` only
      when the link starts with `https://`, in any case.
    hints:
      - Only the start of the link matters. A link that merely contains `https` elsewhere must fail.
      - Capitals are allowed in a scheme, so compare a lower-case copy of the link.
      - '`link.toLowerCase().startsWith(...)` checks the start.'

  - type: prose
    id: name-tauri
    body: >-
      **Tauri** takes the other road. It ships no browser: your page runs in the web view the
      operating system already has, and the native side is written in Rust. Apps download far
      smaller.


      The trade: each system's web view is a different engine, so test on each. That's a
      **web-view shell**, the same idea as Capacitor on phones.

  - type: explain-back
    id: explain-electron-or-tauri
    concept: atlas.webview-shells
    difficulty: 3
    prompt: >-
      Your team is building a desktop AI assistant from its web app. Electron or Tauri? Say
      what each would cost you.
    rubric:
      - Electron ships its own Chromium and Node, so pages render the same everywhere and the team stays in JavaScript, at the cost of a large download.
      - Tauri uses the system web view with a Rust core, so the app is small, but pages meet a different engine on each system.
      - Either way, the page gets only a few named functions, never full access to files.
    modelAnswer: >-
      Electron gives us one engine everywhere, Chromium, and a Node main process in the
      language we already write. The price is size: every copy carries a browser. Tauri
      uses the web view each system already has, so it downloads small. But we'd test on
      three engines, and the native side is Rust, which the team would learn. For a small
      JavaScript team I'd pick Electron. Either way the page only gets a preload's few
      functions.

recap:
  - Tell Electron's main process, which runs Node, from its renderer, which is a web page.
  - Keep Node out of the page, and hand it a few functions through a preload.
  - Choose Tauri for a small download on the system's web view, and test on each engine.

recall:
  - id: card-electron-sides
    concept: atlas.electron
    front: What are the two sides of an Electron app, and which can touch files?
    back: >-
      The main process, which runs Node and can touch files, and a renderer per window, which
      is a web page.
  - id: card-preload
    concept: atlas.electron
    front: Why does an Electron page get a preload, not `require`?
    back: >-
      With Node in the page, one XSS bug could run commands on the computer. A preload hands
      over only a few named functions.
  - id: card-tauri
    concept: atlas.webview-shells
    front: How does Tauri keep apps small, and what does that cost?
    back: >-
      It uses the system's own web view instead of shipping a browser. Pages then meet a
      different engine on each system.

references:
  - kind: docs
    title: Security
    authors: Electron contributors
    venue: Electron documentation
    url: https://www.electronjs.org/docs/latest/tutorial/security
    note: Node integration off and context isolation on by default, preloads, and links opened with shell.openExternal.
    primary: true
    verified: true
  - kind: docs
    title: Context Isolation
    authors: Electron contributors
    venue: Electron documentation
    url: https://www.electronjs.org/docs/latest/tutorial/context-isolation
    note: How `contextBridge.exposeInMainWorld` hands the page a safe set of functions.
    verified: true
  - kind: docs
    title: Tauri Architecture
    authors: Tauri contributors
    venue: Tauri documentation
    url: https://v2.tauri.app/concept/architecture/
    note: The system web view, the Rust core, and why apps stay small.
    primary: true
    verified: true

deepDive: >-
  The safe-link check ran in Node, with the six links from the tests. The rest rests on
  Electron's and Tauri's documentation.


  Electron made the safe settings the defaults: Node integration has been off since version
  5, context isolation on since 12, and the renderer sandbox on since 20. So the review's
  code switches safety off on purpose. That's common in old answers online, and assistants
  learned from them.


  Its security checklist also warns against passing untrusted links to `shell.openExternal`,
  since some schemes can start programs. The same thinking applies to AI tools on the
  desktop: an assistant that can read files should get "read this note", never "read any
  path".


  On Windows, Tauri uses WebView2, which is Chromium-based. On macOS it's WebKit, Safari's
  engine, and on Linux WebKitGTK. Tauri 2 also builds for iPhone and Android.
