deepDive: >-
  **What JSX becomes.** The build tool turns `<h1>Hello</h1>` into a function call, roughly
  `jsx("h1", { children: "Hello" })`. Attributes become keys of a JavaScript object, and
  React names them after the DOM's own properties. The DOM calls it `className`, because
  `class` is a reserved word in JavaScript.


  **Two roots without a wrapper.** Returning `<h2>` and `<p>` side by side doesn't build.
  TypeScript says "JSX expressions must have one parent element." A function returns one
  value, and one JSX tag is one value.


  **Why React exists.** Facebook built it around 2013, for pages where many parts change at
  once. Today it runs a large share of the web's interfaces, and Next.js, which comes later
  in this course, is built on it.
