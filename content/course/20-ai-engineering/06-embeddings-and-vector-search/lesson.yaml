id: ai.embeddings
title: Embeddings and vector search
objective: "Turn text into vectors, compare them by cosine similarity in code, and find the passages closest to a question."
level: advanced
minutes: 10
concepts: [ai.embeddings, ai.cosine-similarity, ai.vector-search]
prerequisites: [ai.tools, pyai.numpy]
opening:
  text: >-
    You'll build search that finds "Refunds take five working days" when someone types "I
    want my money back". No shared words, same meaning.

steps:
  - type: prose
    id: what-an-embedding-is
    body: >-
      An **embedding model** turns a piece of text into a **vector**: a list of numbers,
      often a thousand or so. The numbers mean nothing one by one. Together they place the
      text on a map of meaning.


      "I want my money back" lands near "Refunds take five working days", and far from
      "We open at 9". Texts about the same thing get similar vectors, even with no words in
      common.
    figure:
      id: embedding-space
      caption: Close means similar in meaning. Vector search finds the points nearest the question.

  - type: prose
    id: cosine
    body: |-
      To compare two vectors, code measures the angle between them, as **cosine
      similarity**. Close to 1 means the same direction, so similar meaning. Near 0 means
      unrelated.

      ```python
      import numpy as np

      def cosine(a, b):
          return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))
      ```

      You never work these out by hand. You compare the scores the code gives you.

  - type: fill-blank
    id: fill-best-match
    concept: ai.cosine-similarity
    difficulty: 1
    language: python
    prompt: Pick the stored passage whose vector is closest to the question's.
    template: |
      best = {{1}}(passages, key=lambda p: {{2}}(question_vector, p["vector"]))
      print(best["text"])
    blanks:
      - key: '1'
        answer: max
      - key: '2'
        answer: cosine
    bank: [max, min, sorted, cosine, len]

  - type: prose
    id: vector-search
    body: >-
      That's **vector search**, or semantic search. Ahead of time, you embed every passage
      once and store its vector. When a question comes in, you embed it with the same model. Then you score it
      against every stored vector, and keep the top few.


      The top few are usually called the **top k**, where k is how many you keep.

  - type: code-challenge
    id: write-top-k
    concept: ai.vector-search
    difficulty: 2
    language: python
    starter: search.starter.py
    solution: search.solution.py
    tests: search.tests.py
    prompt: >-
      Write `top_k(query_vector, passages, k)`. Each passage is a dict with `"text"` and
      `"vector"`. Return the texts of the `k` passages most similar to the query, most
      similar first, using the `cosine` function given.


      Keep equal scores in their stored order, and don't change `passages`. Example: with
      `k=1`, a money-back question returns the refund passage.
    hints:
      - '`sorted` takes a `key`, like `max` did, and `reverse=True` puts the largest first.'
      - The key is the passage's cosine score against `query_vector`.
      - Slice the sorted list to `k` items, then take each passage's `"text"`.

  - type: ai-review
    id: review-two-models
    concept: ai.embeddings
    difficulty: 3
    language: python
    request: Switch the help search to our new, better embedding model.
    flawClass: logic
    code: |
      # Passages were embedded last year with "embed-small-v1" and stored.
      stored = load_passages()

      def search(question):
          query_vector = embed([question], model="embed-large-v2")[0]
          return top_k(query_vector, stored, 5)
    prompt: >-
      An assistant made this change. No errors, and every search now returns near-random
      passages. Tap the line at fault.
    lines: [5]
    reasons:
      - text: The query and passages use different embedding models
        correct: true
        feedback: >-
          Yes. Each model has its own map. Re-embed every passage with the new model.
      - text: A larger model gives worse results
        feedback: >-
          The new model may be better, once everything is embedded with it.
      - text: '`top_k` should ask for more than 5'
        feedback: >-
          More results from the wrong map are still wrong. The vectors can't be compared.
    verify:
      question: "Which test would have caught this?"
      choices:
        - text: "Questions whose right passages you know, checked in the results"
          correct: true
          feedback: "Yes. Near-random passages fail that at once."
        - text: "Assert `search` returns 5 results"
          feedback: "It does return 5. They're the wrong 5, so a count can't see it."
        - text: "Assert the query vector matches the stored vectors' length"
          feedback: "They match here, which is why nothing errored. Same length doesn't mean the same model."
    fix: |
      # Re-embed and store every passage with "embed-large-v2" first.
      stored = load_passages(model="embed-large-v2")

      def search(question):
          query_vector = embed([question], model="embed-large-v2")[0]
          return top_k(query_vector, stored, 5)

  - type: prose
    id: vector-index
    body: >-
      Scoring every stored vector is fine for thousands of passages. For millions, it's too
      slow for each question.


      A **vector index** finds the nearest vectors without checking them all. Most are
      **approximate**: very fast, with a small chance of missing the true best match.
      Postgres has one in the pgvector extension, and dedicated vector databases exist too.

  - type: multiple-choice
    id: pick-index
    concept: ai.vector-search
    difficulty: 2
    question: Search scores each question against 40 million stored vectors, and takes 9 seconds. What fixes it?
    choices:
      - text: An approximate vector index
        correct: true
        feedback: >-
          Yes. It finds near neighbours in a few hops, not 40 million comparisons.
      - text: A larger embedding model
        feedback: >-
          Bigger vectors make each comparison slower. The problem is how many there are.
      - text: A shorter question
        feedback: >-
          The question becomes one vector either way. The time goes on the comparisons.
      - text: Caching every question's answer
        feedback: >-
          Helps repeats only. Every new question still takes 9 seconds.

  - type: explain-back
    id: explain-meaning-match
    concept: ai.embeddings
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Vector search finds "Refunds take five working days" for "I want my money back".
      Keyword search finds nothing. Why?
    rubric:
      - Keyword search needs the same words, and the two share none.
      - The embedding model places texts with similar meaning close together.
      - Cosine similarity between the two vectors is high, so it ranks near the top.
    modelAnswer: >-
      Keyword search looks for shared words, and "money back" and "refunds" have none. The embedding model learnt that they mean nearly the same thing. So it gives
      them vectors pointing in nearly the same direction. Their cosine similarity is high, and the refund
      passage comes out on top.

recap:
  - Describe an embedding as a vector that places text by meaning.
  - Rank stored passages by cosine similarity to a question's vector, and keep the top k.
  - Embed passages and questions with the same model, and use an index for millions.

recall:
  - id: card-embedding
    concept: ai.embeddings
    front: What does an embedding model do?
    back: >-
      It turns text into a vector of numbers, so that texts with similar meaning get similar
      vectors.
  - id: card-cosine
    concept: ai.cosine-similarity
    front: What does a cosine similarity near 1 mean, and one near 0?
    back: >-
      Near 1, the vectors point the same way: similar meaning. Near 0, the texts are
      unrelated.
  - id: card-same-model
    concept: ai.embeddings
    front: Why must questions and passages use the same embedding model?
    back: >-
      Each model has its own map of meaning. Vectors from two models can't be compared.
  - id: card-hnsw
    concept: ai.vector-search
    front: What does an approximate vector index trade away?
    back: >-
      A small chance of missing the true nearest vector, in exchange for searching millions
      in milliseconds.

