id: few-label-stretches
title: FewLabelStretches
topic: caterpillar
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: K, type: int }
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A pantry shelf holds N jars in a row, numbered from 0 to N − 1, and jar I carries the
  label A[I]. A stretch is a pair of integers (P, Q) with 0 ≤ P ≤ Q < N: the jars from P to
  Q, both included. A stretch is tidy when its jars carry at most K different labels.

  Write a function:

  {{signature}}

  that, given an integer K and an array A of N integers, returns the number of tidy
  stretches.

  For example, given K = 2 and A = [1, 2, 1, 3, 3], the function should return 11. The only
  stretches that are not tidy are (0, 3), (0, 4), (1, 3) and (1, 4), which hold the labels
  1, 2 and 3.

  Given K = 1 and A = [1, 2, 1, 3, 3], the function should return 6.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - K is an integer within the range [1..N];
  - each element of array A is an integer within the range [0..100,000].
examples:
  - { args: [2, [1, 2, 1, 3, 3]], expected: 11 }
  - { args: [1, [1, 2, 1, 3, 3]], expected: 6 }
tests:
  - name: extreme_single
    description: one jar
    group: correctness
    cases:
      - { args: [1, [0]], expected: 1 }
      - { args: [1, [100000]], expected: 1 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [2, [4, 4, 5, 6, 5, 5, 4]] }
      - { args: [3, [1, 2, 3, 4, 5]], expected: 12 }
  - name: all_equal
    description: every jar carries the same label
    group: correctness
    cases:
      - generate: { seed: 501, args: [{ kind: value, value: 1 }, { kind: constant, n: 50, value: 7 }] }
  - name: all_different
    description: every label differs, K = N
    group: correctness
    cases:
      - generate: { seed: 502, args: [{ kind: value, value: 60 }, { kind: permutation, n: 60 }] }
  - name: small_random
    description: random, N = 100, few labels
    group: correctness
    cases:
      - generate: { seed: 503, args: [{ kind: value, value: 3 }, { kind: ints, n: 100, min: 0, max: 6 }] }
      - generate: { seed: 504, args: [{ kind: int, min: 1, max: 10 }, { kind: ints, n: 100, min: 0, max: 20 }] }
  - name: medium_random
    description: random, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 505, args: [{ kind: value, value: 25 }, { kind: ints, n: 2000, min: 0, max: 100 }] }
  - name: large_random
    description: random, N = 100,000
    group: performance
    cases:
      - generate: { seed: 506, args: [{ kind: value, value: 500 }, { kind: ints, n: 100000, min: 0, max: 1000 }] }
      - generate: { seed: 507, args: [{ kind: value, value: 5 }, { kind: ints, n: 100000, min: 0, max: 100000 }] }
  - name: extreme_large
    description: K = N, all labels different, N = 100,000
    group: performance
    cases:
      - generate: { seed: 508, args: [{ kind: value, value: 100000 }, { kind: permutation, n: 100000 }] }
