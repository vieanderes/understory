term: client-side rendering
aka: [CSR, client rendering, single-page app, SPA]
short: Sending an almost empty HTML page and letting JavaScript in the browser build everything on screen.
explain: |
  The server sends a bare page and a script. The browser downloads the script, runs it, and
  only then draws the content. Until then the visitor stares at a blank screen or a spinner.

  It suits screens behind a login that change constantly, such as an editor. It costs the
  first load on slow phones, and search engines see little in the first HTML. Next.js still
  renders Client Components on the server first, so they are not purely this.
analogy: Flat-pack furniture. The box arrives fast, but you build it before you can sit down.
example:
  language: html
  code: |
    <!-- all the server sends -->
    <body>
      <div id="root"></div>
      <script src="/app.js"></script>
    </body>
usage: The old app used client-side rendering, so phones showed a spinner for four seconds.
twin:
  term: server-side-rendering
  difference: Client-side rendering builds the page in the browser after the script loads. Server-side rendering sends finished HTML, so content shows before any script runs.
related: [server-side-rendering, hydration, client-component, client-side-navigation]
level: 2
lessons: [next.what-nextjs-adds, next.rendering-spectrum]
