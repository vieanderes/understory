summary: >-
  JavaScript is forgiving on small inputs and unforgiving on large ones. A call that looks
  like one step can walk the whole array. A default can convert numbers to strings. A
  language limit that never shows in a ten-item example can throw on a million items. Timed
  tests are scored on exactly those large and unusual inputs, so these habits cost points
  that a correct idea should have earned.


  The traps fall into two families. **Hidden quadratic costs**: `includes`, `indexOf`,
  `shift`, `unshift`, `splice`, and copying an array inside a loop, each of which turns a
  linear pass into O(n^2). **Runtime limits**: the default string sort, spreading a huge
  array into a call, recursion too deep for the call stack, and whole numbers past 2^53.


  Each has a short fix: a `Set` or `Map` for membership, a head index for a queue, a
  comparator for numbers, a loop instead of spread or recursion, and `BigInt` for exact large
  sums. The skill is spotting them while you type, before the performance tests do.
remember:
  - >-
    With no comparator, `sort` compares items as strings, so numbers need `(a, b) => a - b`.
  - >-
    `includes`, `indexOf`, `shift`, `unshift` and `splice` are O(n), so one inside a loop makes
    the loop O(n^2).
  - >-
    Use a `Set` or `Map` for "have I seen this?" and a head index for a queue; `push` and `pop`
    at the end are amortised O(1).
  - >-
    Copying inside a loop, such as `[...acc, x]` in `reduce`, is also quadratic.
  - >-
    `Math.max(...hugeArray)` and recursion around 100,000 deep throw a `RangeError`, so loop
    instead.
  - >-
    Whole numbers are exact only up to 2^53 - 1 (`Number.MAX_SAFE_INTEGER`); use `BigInt` for
    exact results beyond it, and never mix `BigInt` and `Number` in one expression.
  - >-
    Array keys from `for...in` are strings, so iterate arrays with `for...of` or an index.
sections:
  - title: Why these costs hide
    body: |-
      Big-O counts how work grows with input size. A method call hides its own loop, so the
      cost of a line is the cost of the calls inside it, not the number of characters.

      - `arr.includes(x)` and `arr.indexOf(x)` compare against items one by one until they
        find a match: O(n).
      - `arr.shift()` removes the first item. In V8, on a large array, it moves every
        remaining item down one place: O(n). `unshift` does the same the other way.
      - `arr.splice(i, 1)` shifts everything after `i`.
      - `arr.slice()`, `[...arr]` and `arr.concat(x)` copy the whole array.
      - `push` and `pop` work at the end. The engine grows capacity in large steps, so the
        occasional copy averages out to O(1) per call. That is what **amortised** means.

      One of the O(n) calls inside a loop over n items gives n times n steps. At n = 100,000
      that is ten billion, which no time limit allows.

      A quick way to catch this while coding: for every line inside a loop, ask "does this call
      look at every item?". If yes, precompute it outside the loop or replace the data
      structure. A `Set` answers membership in O(1) on average, a `Map` answers "what is stored
      under this key", and a head index turns an array into a queue.
  - title: The quadratic that looks functional
    body: |-
      Building an array with spread inside `reduce` reads well and copies the whole
      accumulator on every step.

      ```js
      const items = Array.from({ length: 50_000 }, (_, i) => i);
      let t = performance.now();
      const slow = items.reduce((acc, x) => [...acc, x * 2], []);
      console.log('spread in reduce', Math.round(performance.now() - t), 'ms');
      t = performance.now();
      const fast = [];
      for (const x of items) fast.push(x * 2);
      console.log('push', Math.round(performance.now() - t), 'ms', slow.length === fast.length);
      ```

      On Node 24 the first took about 5 seconds and the second about a millisecond. The same
      shape hides in `reduce((acc, x) => ({ ...acc, [x.id]: x }), {})`, which copies an object
      per item. Use `map` for a new array, and mutate the accumulator you created yourself
      inside `reduce`, or use a `Map`.
  - title: More traps worth a glance, with their output
    body: |-
      Each line below was run on Node 24. They are the ones that turn up in timed tests and in
      bug-fix tasks.

      ```js
      for (const i in ['a', 'b']) console.log(typeof i, i + 1); // string 01, then string 11
      console.log([NaN].indexOf(NaN), [NaN].includes(NaN));    // -1 true
      console.log(['1', '2', '3'].map(parseInt));             // [ 1, NaN, NaN ]
      console.log(Number.MAX_SAFE_INTEGER + 2);               // 9007199254740992
      try { console.log(10n + 1); } catch (e) { console.log(e.name); } // TypeError
      console.log(Object.keys({ b: 1, 10: 1, a: 1, 2: 1 }));  // [ '2', '10', 'b', 'a' ]
      console.log(0.1 + 0.2 === 0.3);                         // false
      console.log(Math.min(), Math.max());                    // Infinity -Infinity
      try { [].reduce((a, b) => a + b); } catch (e) { console.log(e.name); } // TypeError
      ```

      The fixes: iterate arrays with `for...of` or an index. Use `includes` or `Number.isNaN`
      for `NaN`. Pass a wrapper, `map((s) => parseInt(s, 10))`, because `map` passes the index
      as `parseInt`'s radix. Convert explicitly between `BigInt` and `Number`. Use a `Map` when
      key order matters, since plain objects list integer-like keys first in numeric order.
      Compare floats with a tolerance, or work in whole units such as pence. Give `reduce` a
      start value so an empty array returns it instead of throwing.
  - title: Templates that avoid shift and recursion
    body: |-
      Graph and grid tasks are where `shift` and deep recursion appear most. Two templates
      cover almost all of them: breadth-first search with an index-based queue, and
      depth-first search with an explicit stack.

      ```js
      // Breadth-first search on a grid with an index-based queue: every cell is read once.
      function shortestSteps(grid, start, goal) {
        const rows = grid.length;
        const cols = grid[0].length;
        const dist = Array.from({ length: rows }, () => new Array(cols).fill(-1));
        const queue = [start];
        let head = 0;
        dist[start[0]][start[1]] = 0;
        while (head < queue.length) {
          const [r, c] = queue[head++];
          if (r === goal[0] && c === goal[1]) return dist[r][c];
          for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
            if (grid[nr][nc] === '#' || dist[nr][nc] !== -1) continue;
            dist[nr][nc] = dist[r][c] + 1;
            queue.push([nr, nc]);
          }
        }
        return -1;
      }

      // Depth-first search with an explicit stack: no recursion, so no stack overflow.
      function countReachable(adjacency, start) {
        const seen = new Set([start]);
        const stack = [start];
        while (stack.length > 0) {
          const node = stack.pop();
          for (const next of adjacency.get(node) ?? []) {
            if (!seen.has(next)) {
              seen.add(next);
              stack.push(next);
            }
          }
        }
        return seen.size;
      }

      console.log(shortestSteps(['..#', '...', '#..'], [0, 0], [2, 2])); // 4

      // A chain of 200,000 nodes, far deeper than recursion allows.
      const chain = new Map();
      for (let i = 0; i < 199_999; i++) chain.set(i, [i + 1]);
      console.log(countReachable(chain, 0)); // 200000
      ```

      Two details matter. Mark a cell as seen when you push it, not when you pop it, or the
      same cell enters the queue many times. And build the grid with `Array.from` and a
      function, because `Array(rows).fill([])` puts one shared row in every slot.
  - title: Exact sums past 2^53
    body: |-
      A JavaScript number is a 64-bit float with 53 bits for the digits. Past 2^53, not every
      whole number can be stored, so adding 1 can change nothing.

      ```js
      function sumExact(values) {
        let total = 0n;
        for (const v of values) total += BigInt(v);
        return total;
      }
      const values = [2 ** 53, 1, 1];
      console.log(values.reduce((a, b) => a + b, 0)); // 9007199254740992: both 1s vanished
      console.log(sumExact(values));                   // 9007199254740994n
      console.log(Number.isSafeInteger(2 ** 53), Number.isSafeInteger(2 ** 53 - 1)); // false true
      ```

      When does this bite in a test? Sums of 100,000 values up to 10^9 reach 10^14, which is
      still safe. Products of two values up to 10^9 reach 10^18, which is not. Counting pairs
      or subarrays among 100,000 items reaches about 5 x 10^9, which is safe. So check the
      largest intermediate value, not the input. `BigInt` is slower than `Number`, so use it
      only for the calculation that needs it, and convert the result back if the statement
      expects a number.
pitfalls:
  - >-
    **Sorting numbers with a plain `sort()`.** It sorts `[10, 9, 1]` as `[1, 10, 9]`. Always pass
    `(a, b) => a - b` for numbers, even when the example uses single digits.
  - >-
    **Using an array as a queue with `shift`.** It is O(n) per call on large arrays. Keep a head
    index and read `queue[head++]`.
  - >-
    **Checking membership with `includes` inside a loop.** Build a `Set` once, then call `has`.
  - >-
    **Taking the maximum with `Math.max(...arr)`.** Spread passes every item as an argument and
    overflows the stack somewhere above 100,000 items. Loop, or use `reduce` with a start value.
  - >-
    **Recursing once per element.** A linked list or a path of 100,000 nodes overflows the call
    stack. Convert to a loop, or use an explicit stack.
  - >-
    **Marking visited on pop in breadth-first search.** The same node is queued many times and
    the search slows down. Mark it when you push it.
  - >-
    **Trusting a product of large values.** `999999999 * 999999999` is wrong in the last digit.
    Use `BigInt` for exact products past 2^53, or the modulus the statement gives.
verify:
  - lens: scales
    check: Run each solution once at the largest N before submitting, and look for `shift`, `includes` or `indexOf` inside a loop.
  - lens: breaks
    check: Replace recursion over a list or deep tree with a loop whenever its depth can reach the input size.
  - lens: breaks
    check: Pass a comparator to every numeric `sort`, and test it with numbers of different lengths, like 10 and 9.
  - lens: tests
    check: Time a large run before and after each speed fix, and rerun the small cases to confirm the output did not change.
interview:
  - question: >-
      Why is calling `shift` in a loop slow, and what do you use instead?
    answer: >-
      Because on a large array `shift` moves every remaining element one place down, so it
      costs O(n), and doing it once per element makes the loop O(n^2). With 100,000 items that
      is billions of moves. For a queue I keep the array and a head index: I push at the back
      and read `queue[head++]` from the front, which is O(1) per operation. If memory matters
      because the queue runs for a long time, I compact the array occasionally, or use a ring
      buffer or a linked list. The trade-off of the head index is that consumed items stay in
      memory until the array is discarded, which is fine for a single algorithm run.
  - question: >-
      What does `[10, 9, 1].sort()` return, and why?
    answer: >-
      `[1, 10, 9]`. With no comparator, the specification converts each item to a string and
      compares the strings by code units, so "10" comes before "9" because "1" is less than
      "9". For numbers I always pass `(a, b) => a - b`, or `b - a` for descending. For strings
      a plain `sort()` is correct when code-unit order is what is wanted. The other thing I
      mention is that `sort` works in place and returns the same array, so if the caller's
      array must stay unchanged I use `toSorted` or sort a copy.
  - question: >-
      What does amortised O(1) mean for `push`?
    answer: >-
      It means a single call can be slow, but the average over many calls is constant. When
      the backing store is full, the engine allocates a larger one, a multiple of the old
      size, and copies everything across. That copy is O(n), but because capacity grows
      geometrically, copies become rarer as the array grows, and the total cost of n pushes
      is O(n). So each push costs O(1) on average. The practical consequence is that `push`
      in a loop is fine, while `unshift` or `splice` at the front is not. If latency per
      operation matters, as in a real-time system, a preallocated buffer avoids the occasional
      slow push.
  - question: >-
      When would you reach for `BigInt`, and what does it cost?
    answer: >-
      When an exact whole-number result can pass 2^53 - 1, the largest integer a JavaScript
      number stores exactly. Typical cases are products of two large values, factorials, or
      money in the smallest unit summed over huge volumes. I check the largest intermediate
      value, not the inputs. The costs are speed, since `BigInt` arithmetic is slower than
      floating-point, and friction: you cannot mix it with numbers without converting, `JSON`
      cannot serialise it, and `Math` functions do not accept it. So I keep `BigInt` inside
      the one calculation that needs it and convert at the edge, or use a modulus if the task
      provides one.
terms:
  - term: Default sort
    say: "`sort()` sorts numbers."
    means: With no comparator, `sort` compares items as strings, so `[10, 9, 1].sort()` gives `[1, 10,
      9]`. Pass `(a, b) => a - b`.
  - term: Hidden quadratic
    say: One line of code is one step.
    means: "`includes`, `indexOf`, `shift`, `unshift` and `splice` each walk the array, so one of them
      inside a loop makes the loop O(n²)."
  - term: Amortised O(1)
    say: "`push` is always instant."
    means: Most pushes are O(1), and the occasional resize that copies the array averages out to O(1)
      per push over many calls.
  - term: "`Math.max(...arr)`"
    say: Spread works on any array.
    means: Spread passes every item as a separate argument, and a huge array throws a `RangeError`. Use
      a loop instead.
  - term: BigInt
    say: The number type for big numbers.
    means: A separate type for exact integers of any size. It can't mix with `Number` in one expression
      and is slower, so use it only when results pass 2^53 - 1.
  - term: "`for...in`"
    say: It loops over an array's items.
    means: It loops over enumerable property keys, as strings, including inherited ones. Use `for...of`
      or an index for arrays.
