term: expand and contract
aka: [expand, then contract, parallel change, expand/contract]
short: Changing a shape in three steps, add the new beside the old, move everyone, then remove the old.
explain: |
  You want to rename a field or a column, but other code depends on the old name. Rename it
  in one go and everything reading the old name breaks at once.

  So you split the change. Expand: add the new shape and keep the old one working. Migrate:
  move every reader and writer across, and backfill old data. Contract: remove the old shape
  once nothing uses it. Each step is safe to deploy alone. It works for APIs, database
  columns and function signatures alike.
analogy: Building the new bridge beside the old one, moving the traffic over, and only then knocking the old one down.
usage: We can't rename the column in one deploy, so do it as expand and contract over three releases.
related: [breaking-change, migration, zero-downtime-deployment, tolerant-reader]
level: 3
lessons: [backend.api-evolution]
