id: basics.loops
title: Repeating things
objective: Repeat work with `for` and `while` loops.
level: essential
minutes: 10
concepts: [basics.for-loops, basics.while-loops]
prerequisites: [basics.conditions]
opening:
  text: >-
    You'll make the computer repeat work for you, ten times or a million, without copying a
    single line. This is where code starts saving you real time.

steps:
  - type: prose
    id: why-loops
    body: |-
      Say you want to show the numbers 1 to 3. Three `console.log` lines would do. Now imagine
      1 to 1,000.

      A **loop** runs the same code again and again. The simplest is `while`:

      ```js
      let count = 1;
      while (count <= 3) {
        console.log(count);
        count = count + 1;
      }
      ```

      While the condition is true, the code in the curly brackets runs. Then it checks again.

  - type: code-challenge
    id: write-count-to-ten
    concept: basics.while-loops
    difficulty: 1
    language: js
    starter: count.starter.js
    solution: count.solution.js
    tests: count.tests.js
    prompt: >-
      This is the loop from above. Press Run tests and watch it count from 1 to 3 under
      Console.


      Now change one thing, so it counts from 1 to 10.
    hints:
      - The loop keeps going while the condition in the brackets is true.
      - Right now it stops once `count <= 3` is false.
      - Change the 3.

  - type: prose
    id: for-loops
    body: |-
      Counting loops are so common that they have a shorter form, `for`:

      ```js
      for (let i = 1; i <= 3; i++) {
        console.log(i);
      }
      ```

      The brackets hold three parts, split by `;`. Where to start, when to keep going, and what
      to do after each round. `i++` is short for `i = i + 1`.

  - type: predict-output
    id: predict-for
    concept: basics.for-loops
    difficulty: 2
    language: js
    code: |
      for (let i = 0; i < 3; i++) {
        console.log("Round " + i);
      }
    question: What does this show?
    choices:
      - text: '`Round 0`, `Round 1`, `Round 2`'
        correct: true
        feedback: >-
          Right. It starts at 0 and stops before 3.
      - text: '`Round 1`, `Round 2`, `Round 3`'
        feedback: >-
          `i` starts at 0, because of `let i = 0`.
      - text: '`Round 0` up to `Round 3`'
        feedback: >-
          When `i` is 3, `3 < 3` is false, so that round never happens.

  - type: fill-blank
    id: fill-for-header
    concept: basics.for-loops
    difficulty: 2
    language: js
    prompt: Make this show the numbers 1 to 5. Fill in where it starts and when it keeps going.
    template: |
      for (let i = {{1}}; i {{2}} 5; i++) {
        console.log(i);
      }
    blanks:
      - key: '1'
        answer: '1'
      - key: '2'
        answer: '<='
    bank: ['0', '1', '<', '<=']

  - type: bug-hunt
    id: hunt-infinite-loop
    concept: basics.while-loops
    difficulty: 3
    language: js
    code: |
      let countdown = 3;
      while (countdown > 0) {
        console.log(countdown);
      }
      console.log("Lift off");
    prompt: This never finishes. It shows `3` forever. Tap the line where the fix belongs.
    lines: [3]
    reasons:
      - text: Nothing inside the loop changes `countdown`
        correct: true
        feedback: >-
          Exactly. `countdown` stays 3, so the condition never becomes false.
      - text: '`>` should be `<`'
        feedback: >-
          Then the loop would never start. The real problem is that `countdown` never changes.
      - text: '`Lift off` belongs inside the loop'
        feedback: >-
          That would show it every round. The loop still wouldn't end.
    fix: |
      let countdown = 3;
      while (countdown > 0) {
        console.log(countdown);
        countdown = countdown - 1;
      }
      console.log("Lift off");

  - type: code-challenge
    id: write-loading-bar
    concept: basics.for-loops
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Build a loading bar. With a `for` loop, show five lines, each one `#` longer than the
      last: `#`, then `##`, and so on up to `#####`.


      The starter gives you an empty `bar` to grow.
    hints:
      - One `for` loop that runs five times, with two lines inside it.
      - '`bar = bar + "#"` makes the bar one longer, because `+` joins text.'
      - 'Start with `for (let i = 1; i <= 5; i++) {`'

  - type: explain-back
    id: explain-infinite-loop
    concept: basics.while-loops
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: |-
      ```js
      let countdown = 3;
      while (countdown > 0) {
        console.log(countdown);
      }
      ```

      This shows `3` forever. Why does the loop never stop?
    rubric:
      - A `while` loop stops only when its condition becomes false.
      - Nothing in the loop changed `countdown`, so `countdown > 0` stayed true.
      - The fix is to change `countdown` inside the loop, so it reaches 0.
    modelAnswer: >-
      A `while` loop keeps going while its condition is true. `countdown` started at 3 and
      nothing inside the loop changed it. So `countdown > 0` was true every time. Subtracting 1
      each round lets it reach 0 and stop.

recap:
  - "Repeat work a set number of times with `for`."
  - "Keep going until a condition changes with `while`."
  - "Spot a loop that would never stop."
recall:
  - id: card-while
    concept: basics.while-loops
    front: When does a `while` loop stop?
    back: >-
      When its condition is false at the start of a round.
  - id: card-for-parts
    concept: basics.for-loops
    front: What are the three parts inside `for ( ... )`?
    back: >-
      Where to start, when to keep going, and what to do after each round.
  - id: card-infinite
    concept: basics.while-loops
    front: What makes a loop run forever?
    back: >-
      A condition that never becomes false, often because nothing in the loop changes it.

references:
  - kind: docs
    title: 'Loops: while and for'
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/while-for
    note: Both loops, with exercises.
    primary: true
    verified: true
  - kind: docs
    title: Loops and iteration
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Loops_and_iteration
    note: Every kind of loop JavaScript has.
    primary: true
    verified: true

deepDive: >-
  Already know this? Two loop tools are worth knowing. `break` leaves a loop at once, and
  `continue` skips to the next round. Use them sparingly, because they make the flow harder
  to follow.


  An endless loop freezes the page in a browser. This app stops any run that takes too long,
  so you can experiment safely.
