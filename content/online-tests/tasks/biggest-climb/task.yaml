id: biggest-climb
title: BiggestClimb
topic: maximum-slice
difficulty: easy
type: algorithmic
recommendedMinutes: 20
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A hiker's watch records the altitude every minute. The N readings, in metres, are stored in
  an array A, in the order they were taken. A climb goes from reading P to a later reading Q
  (P < Q), and its height is A[Q] − A[P].

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the height of the biggest climb, or 0 if no
  reading is higher than an earlier one.

  For example, given A = [320, 280, 410, 300, 250, 390], the function should return 140: the
  climb from 250 to 390 is the biggest.

  Given A = [500, 400, 300], the function should return 0.

  Given A = [], the function should return 0.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..400,000];
  - each element of array A is an integer within the range [0..200,000].
examples:
  - { args: [[320, 280, 410, 300, 250, 390]], expected: 140 }
  - { args: [[500, 400, 300]], expected: 0 }
  - { args: [[]], expected: 0 }
timeLimitMs: 400
tests:
  - name: extreme_empty_single
    description: no readings, or one reading
    group: correctness
    cases:
      - { args: [[]], expected: 0 }
      - { args: [[0]], expected: 0 }
      - { args: [[200000]], expected: 0 }
  - name: two_readings
    description: two readings, up, down and level
    group: correctness
    cases:
      - { args: [[3, 8]], expected: 5 }
      - { args: [[8, 3]], expected: 0 }
      - { args: [[5, 5]], expected: 0 }
  - name: low_point_after_peak
    description: the highest reading comes before the lowest
    group: correctness
    cases:
      - { args: [[100, 900, 50, 300]], expected: 800 }
      - { args: [[900, 1, 2, 1000, 0, 999]], expected: 999 }
  - name: extreme_min_max_value
    description: from 0 to 200,000
    group: correctness
    cases:
      - { args: [[200000, 0, 200000]], expected: 200000 }
      - { args: [[0, 200000, 0]], expected: 200000 }
  - name: all_equal
    description: level ground and a steady descent
    group: correctness
    cases:
      - generate: { seed: 801, args: [{ kind: constant, n: 500, value: 1234 }] }
      - generate: { seed: 802, args: [{ kind: range, n: 500, start: 200000, step: -400 }] }
  - name: small_random
    description: random, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 803, args: [{ kind: ints, n: 1000, min: 0, max: 200000 }] }
      - generate: { seed: 804, args: [{ kind: ints, n: 1000, min: 0, max: 10 }] }
  - name: large_random
    description: random, N = 400,000
    group: performance
    cases:
      - generate: { seed: 805, args: [{ kind: ints, n: 400000, min: 0, max: 200000 }] }
  - name: extreme_large
    description: level ground and a steady rise, N = 400,000
    group: performance
    cases:
      - generate: { seed: 806, args: [{ kind: range, n: 400000, start: 200000, step: 0 }] }
      - generate: { seed: 807, args: [{ kind: sorted, n: 400000, min: 0, max: 200000 }] }
