term: workflow
aka: [ LLM workflow, AI workflow, fixed workflow, code owns the flow ]
short: A fixed sequence of steps in code that calls a model only for the judgement steps.
explain: |
  An agent lets the model choose what to do next. A workflow doesn't. Your code runs the
  steps in a set order: redact, classify, extract, check, reply. The model answers one
  narrow question at each step.

  Most production AI features are workflows, because each step can be tested and each
  failure has a known place. Reach for an agent only when the path really can't be known
  in advance.
analogy: A recipe with numbered steps, where you only ask a chef to taste the sauce.
usage: This doesn't need an agent; the steps never change, so build it as a workflow and test each box.
twin:
  term: agent
  difference: In a workflow your code decides the next step. In an agent the model decides, and your code only limits what it may do.
related: [ agent, agent-loop, harness, structured-output ]
level: 2
lessons: [ aisys.demo-to-system, sysdesign.case-ai-agent, interview.agent-build ]
