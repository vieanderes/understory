summary: >-
  Lists and tuples are Python's ordered sequences. A **list** is a growable array you change
  in place, the equivalent of a JavaScript array. A **tuple** is a fixed group that can't
  change after it's made, which JavaScript doesn't have at run time. Both index, slice,
  unpack and loop the same way, so the choice between them says something about the data:
  a list is "some number of similar things", a tuple is "these particular things together".


  The idea that matters most here is that names point at objects. Assignment never copies,
  so two names can share one list, and a change through one is visible through the other.
  Copies are explicit, and the common ones are **shallow**: a new outer list holding the
  same inner objects. Most "my data changed by itself" bugs come from here.


  Reach for a list when items are added, removed or reordered. Reach for a tuple for a
  record with a fixed shape, a function returning several values, or a key in a dict or
  set. Reach for slicing when you need part of a sequence, and remember it always returns a
  new object. When you need fast removal from the front, a list is the wrong tool:
  `collections.deque` does that in constant time.
remember:
  - Assignment binds another name to the same object, so `b = a` never copies a list and changes through `b` show up in `a`.
  - '`a[:]`, `list(a)` and `a.copy()` make shallow copies: a new list holding the same inner objects, so nested lists are still shared.'
  - '`==` compares values and `is` compares identity, so use `is` only for singletons such as `None`.'
  - '`sorted(x)` returns a new list and `x.sort()` sorts in place and returns `None`, and both are stable.'
  - A slice `seq[start:stop:step]` excludes the stop, clips out-of-range bounds without an error, and returns a new object.
  - A tuple is immutable and hashable when its items are, so it can be a dict key or a set member, and a list can't.
  - Appending and popping at the end of a list are O(1), while inserting or popping at the front is O(n), so use a `deque` for a queue.
  - Unpacking needs the counts to match unless one name is starred, and the starred name always gets a list.
sections:
  - title: Names, identity and aliasing
    body: |-
      Every object has an identity, which `id()` shows and `is` compares. `==` asks the
      object whether it equals another, which for a list means the same items in the same
      order. So two lists can be `==` without being the same object, and changing one
      leaves the other alone.

      The confusing case is when two names share one object. That happens with plain
      assignment, and also when you pass a list to a function: the parameter is another
      name for the caller's list.

      ```python
      def add_gift_wrap(cart):
          cart.append("gift wrap")      # mutates the caller's list

      order = ["tea", "mug"]
      add_gift_wrap(order)
      print(order)                      # ['tea', 'mug', 'gift wrap']

      a = [1]
      b = a
      b += [2]          # += on a list mutates in place, like extend
      print(a)          # [1, 2]

      a = [1]
      b = a
      b = b + [2]       # + builds a new list and rebinds b
      print(a)          # [1]
      ```

      `+=` and `+` look alike but differ for lists: `+=` extends the existing list, while
      `+` builds a new one. For immutable types such as strings, ints and tuples, `+=`
      always builds a new object, because there's nothing to mutate.

      Python may reuse some immutable objects, so `is` can give surprising answers. CPython
      caches the small integers from -5 to 256, so two 256s are the same object while two
      257s built at run time are not. That's an implementation detail, never something to
      rely on. The only everyday uses of `is` are `None`, `True` and `False`, and sentinel
      objects you create yourself.

      The same model holds in JavaScript: arrays are passed by sharing, and `===` on arrays
      compares identity. The difference is that Python's `==` compares contents, where
      JavaScript has no built-in deep equality.
  - title: Shallow copies, deep copies and the grid trap
    body: |-
      A shallow copy makes a new outer list, but its slots point at the same objects as
      before. For a list of strings or numbers that's all you need, since those can't
      change. For a list of lists, the inner lists are still shared.

      ```python
      import copy

      cart = [["tea", 2], ["mug", 1]]
      shallow = cart.copy()
      deep = copy.deepcopy(cart)

      shallow[0][1] = 5
      print(cart)                   # [['tea', 5], ['mug', 1]]: inner list shared
      print(deep)                   # [['tea', 2], ['mug', 1]]: fully separate
      print(shallow is cart, shallow[0] is cart[0])   # False True
      ```

      `copy.deepcopy` walks the whole structure and copies every mutable object, handling
      cycles. It's slower and copies things you may not need, so the idiomatic alternative
      is often to build new inner objects on purpose. JavaScript has the same split: spread
      and `slice()` are shallow, and `structuredClone` is deep.

      The classic trap is building a grid by multiplying a list:

      ```python
      grid = [[0] * 3] * 3
      grid[0][0] = 1
      print(grid)    # [[1, 0, 0], [1, 0, 0], [1, 0, 0]]

      grid = [[0] * 3 for _ in range(3)]
      grid[0][0] = 1
      print(grid)    # [[1, 0, 0], [0, 0, 0], [0, 0, 0]]
      ```

      `* 3` repeats references, so the first grid is one inner list three times. The second
      version is a list comprehension, from lesson 8, which builds a fresh inner list on
      each pass. `[0] * 3` on its own is fine, because the repeated item is an immutable
      int.

      A related edge case is famous in interviews. With `t = ([1],)`, the statement
      `t[0] += [2]` raises `TypeError`, and yet `t` becomes `([1, 2],)`. The list's
      in-place extend succeeds first, and only then does the assignment back into the
      tuple fail.
  - title: Tuples, packing and unpacking
    body: |-
      The comma makes a tuple, not the brackets. `point = 3, 4` is a tuple, `(5)` is the
      int 5, and a one-item tuple needs a trailing comma: `(5,)`. The brackets are there
      for grouping, and they're required where a comma would mean something else, such as
      inside a function call.

      A tuple can't change, and if all its items are hashable, the tuple is hashable. That
      makes it the natural key for anything identified by several values:

      ```python
      seats = {("B", 12): "booked", ("B", 13): "free"}
      print(seats[("B", 12)])       # booked

      def min_max(prices):
          return min(prices), max(prices)   # returns one tuple

      low, high = min_max([7, 3, 9])
      print(low, high)              # 3 9

      first, *middle, last = [1, 2, 3, 4]
      print(first, middle, last)    # 1 [2, 3] 4

      role, (width, height) = ("image", (640, 480))
      print(role, width, height)    # image 640 480

      for role, text in [("user", "Hi"), ("assistant", "Hello")]:
          print(f"{role}: {text}")
      ```

      "Returning several values" is really returning one tuple and unpacking it. Unpacking
      works on any iterable, can nest, and allows one starred name anywhere in the pattern.
      A count mismatch without a star raises `ValueError: too many values to unpack` or
      `not enough values to unpack`. `a, b = b, a` swaps, because the right side is packed
      into a tuple before either name is rebound.

      JavaScript has no run-time tuple. TypeScript's `[string, number]` is a tuple type,
      but the value is still a mutable array. Python's tuple is enforced at run time. When a
      record grows past two or three fields, positions stop being readable: `booking[3]`
      says nothing. Then `typing.NamedTuple` or a dataclass, from lesson 11, gives the
      fields names.
  - title: Sorting, stability and keys
    body: |-
      `sorted()` takes any iterable and returns a new list. `list.sort()` works in place
      and returns `None`, a deliberate signal that it changed the list. Both take `key`, a
      function applied to each item to get the value to compare, and `reverse`.

      Python's sort is **stable**: items that compare equal keep their original order. That
      lets you sort by several fields, and it holds with `reverse=True` too.

      ```python
      bookings = [("Cy", 2), ("Ana", 1), ("Ben", 2), ("Di", 1)]

      def nights(booking):
          return booking[1]

      print(sorted(bookings, key=nights))
      # [('Ana', 1), ('Di', 1), ('Cy', 2), ('Ben', 2)]: ties keep their order

      def longest_first_then_name(booking):
          return (-booking[1], booking[0])

      print(sorted(bookings, key=longest_first_then_name))
      # [('Ben', 2), ('Cy', 2), ('Ana', 1), ('Di', 1)]

      print(sorted([10, 9, 1]))                       # [1, 9, 10]
      print(sorted(["b", "B", "a"]))                  # ['B', 'a', 'b']
      print(sorted(["b", "B", "a"], key=str.lower))   # ['a', 'b', 'B']
      print(max(bookings, key=nights))                # ('Cy', 2): the first maximum
      ```

      A tuple as the key sorts by the first field, then the second, because tuples compare
      item by item. Negating a number reverses one field while the others stay ascending.
      Lesson 7 shows the shorter `key=lambda b: b[1]` form.

      Compared with JavaScript: `[10, 9, 1].sort()` gives `[1, 10, 9]` there, because the
      default compares items as strings. Python compares the values themselves, and refuses
      to compare unrelated types: `sorted([1, "2"])` raises `TypeError`. JavaScript's sort
      also mutates in place; `toSorted()` is its version of `sorted()`. Strings sort by
      code point, so capitals come before lower case unless you pass a key.
  - title: What list operations cost, and slice tricks
    body: |-
      A CPython list is a dynamic array of references to objects. Reading or writing by
      index is O(1). `append` and `pop()` at the end are amortised O(1), because the array
      over-allocates and only occasionally grows. Anything at the front or middle shifts
      every later item: `insert(0, x)`, `pop(0)` and `del items[0]` are O(n). `x in items`
      and `items.index(x)` scan, so they're O(n) too; a set gives O(1) membership, as lesson
      5 shows.

      So a list is a good stack and a poor queue. For a queue, use `collections.deque`,
      whose `popleft` and `appendleft` are O(1). A `deque(maxlen=20)` also drops old items
      automatically, a tidy way to keep the last n chat messages.

      ```python
      from collections import deque

      recent = deque(maxlen=3)
      for message in ["hi", "hello", "help?", "sure", "thanks"]:
          recent.append(message)
      print(list(recent))            # ['help?', 'sure', 'thanks']

      nums = list(range(10))
      nums[2:5] = ["x"]              # slice assignment can change the length
      print(nums)                    # [0, 1, 'x', 5, 6, 7, 8, 9]
      del nums[:2]
      print(nums)                    # ['x', 5, 6, 7, 8, 9]
      print("python"[::-1])          # nohtyp

      history = ["a", "b", "c"]
      keep = 0
      print(history[-keep:])         # ['a', 'b', 'c']: -0 is 0, so this is everything
      ```

      The last example is the edge case in this lesson's `trim_history`. Its contract says
      `keep` is at least 1, and that matters: `-0` is `0`, so `history[-0:]` means "from the
      start" and returns the whole list. If zero were allowed, the safe spelling is
      `history[len(history) - keep:]`, which gives `[]` for zero.

      A slice of a list is a new list, so slicing inside a loop copies each time. For large
      lists, `itertools.islice` walks part of a sequence without copying it.
pitfalls:
  - '**Assuming assignment copies.** `backup = items` makes a second name, not a backup. Copy with `items.copy()` or `list(items)`, and use `copy.deepcopy` for nested data.'
  - '**Keeping the result of `sort()`.** `items = items.sort()` sets `items` to `None`. Call `items.sort()` alone, or write `items = sorted(items)`.'
  - '**Calling `sorted` and discarding it.** `sorted(scores)` on its own line changes nothing. Use its return value.'
  - '**Building a grid with `[[0] * n] * n`.** Every row is the same list. Build each row separately with a comprehension.'
  - '**Using `is` to compare values.** `results is []` is always `False`, and `x is 257` depends on caching. Use `==`, or `not items` for emptiness, and keep `is` for `None`.'
  - '**Mutating a list argument by accident.** A function that calls `append` or `sort` on its parameter changes the caller''s list. Copy first, or document that it mutates.'
  - '**Slicing with `-n` when n can be 0.** `items[-0:]` returns the whole list. Guard the zero case or slice from `len(items) - n`.'
  - '**Using `pop(0)` for a queue.** Each call shifts every remaining item, O(n). Use `collections.deque` and `popleft()`.'
interview:
  - question: What's the difference between a list and a tuple, and when do you use each?
    answer: >-
      A list is mutable and a tuple is immutable, and that difference drives the use. I use
      a list for a variable number of similar items that I add to, remove from or sort. I
      use a tuple for a fixed record whose positions mean something, such as `(role, text)`
      or `(row, seat)`, for returning several values from a function, and for dict keys or
      set members, since a tuple of hashable items is hashable and a list is not. Tuples
      are also slightly smaller and faster to create, but that rarely decides it. The
      trade-off is readability: past two or three fields, positional access like `t[3]` is
      obscure, so I switch to a `NamedTuple` or a dataclass. And immutability is shallow: a
      tuple holding a list still lets that list change.
  - question: Explain shallow and deep copies in Python.
    answer: >-
      A shallow copy creates a new container but fills it with references to the same
      objects; a deep copy recursively copies those objects too. `a[:]`, `list(a)`,
      `a.copy()` and `copy.copy(a)` are shallow. So after `b = a.copy()`, appending to `b`
      leaves `a` alone, but `b[0].append(x)` changes a nested list that `a` also holds.
      `copy.deepcopy` copies the whole graph, tracking objects it has already seen so
      cycles and shared references survive. The trade-off is cost and surprise: deepcopy is
      slow on large structures and copies objects you may not want duplicated, such as
      connections or caches. In practice I prefer immutable data where possible, or
      construct the new nested structure explicitly, and reach for deepcopy for test
      fixtures or config snapshots.
  - question: What's the difference between `is` and `==`?
    answer: >-
      `==` tests equality by calling `__eq__`, and `is` tests identity, whether both names
      refer to the same object. Two separate lists with the same items are `==` but not
      `is`. I use `is` for singletons: `x is None`, and sentinel objects. PEP 8 recommends
      `is None` because a class can override `__eq__` to return something odd, while
      identity can't be overridden. Using `is` for values is a bug that sometimes seems to
      work, because CPython caches small integers from -5 to 256 and interns some strings,
      so `a is b` may be `True` for 256 and `False` for 257. Linters flag `is` with a
      literal for that reason. The JavaScript comparison is that `===` on objects is
      identity, while Python's `==` gives you structural equality for free.
  - question: Is Python's sort stable, and why does that matter?
    answer: >-
      Yes. Both `list.sort()` and `sorted()` are guaranteed stable: items with equal keys
      keep their original relative order, including with `reverse=True`. Stability lets
      you sort by several criteria in passes, secondary key first and primary key last, and
      it keeps results predictable, so a list of support tickets sorted by priority stays in
      arrival order within each priority. More often I use one pass with a tuple key, such
      as `(-priority, created_at)`, which compares field by field. CPython uses Timsort,
      which is O(n log n) in the worst case and close to O(n) on data that's already
      partly sorted. The contrast with JavaScript is the default: without a comparator JS
      compares items as strings, so `[10, 9, 1]` sorts to `[1, 10, 9]`.
  - question: How would you implement a queue in Python, and why not with a list?
    answer: >-
      I'd use `collections.deque`, because `append` and `popleft` are both O(1). A list is
      a dynamic array, so `pop()` and `append` at the end are amortised O(1), but `pop(0)`
      and `insert(0, x)` shift every remaining element, O(n) each, which makes a queue of n
      items O(n²) to drain. A deque is a doubly linked list of fixed-size blocks, so both
      ends are cheap. `deque(maxlen=n)` also discards from the other end automatically,
      which suits a rolling window such as the last n log lines. The trade-off is that
      indexing into the middle of a deque is O(n), so if I need random access, a list is
      better. Between threads I'd use `queue.Queue`, and in asyncio code `asyncio.Queue`,
      which add blocking and waiting on top.
terms:
  - term: "`b = a`"
    say: It copies the list.
    means: It binds a second name to the same list, so a change through `b` shows up in `a`. Copy with
      `a.copy()`, `list(a)` or `a[:]`.
  - term: Shallow copy
    say: A copy of the list.
    means: A new outer list holding the same inner objects, so nested lists are still shared.
      `copy.deepcopy` copies every level.
  - term: Tuple
    say: An immutable list.
    means: A fixed-shape group whose slots can't be reassigned, hashable when its items are, so it can
      be a dict key. A list inside a tuple can still change.
  - term: "`is` and `==`"
    say: "`is` is a stricter `==`."
    means: "`==` compares values and `is` compares identity, whether both names point at one object. Use
      `is` only for singletons such as `None`."
  - term: "`sort` and `sorted`"
    say: Two names for the same thing.
    means: "`sorted(x)` returns a new list; `x.sort()` sorts in place and returns `None`. Both are
      stable."
  - term: Slice
    say: A view into the list.
    means: A new list holding the selected items. `seq[start:stop:step]` excludes the stop and clips
      out-of-range bounds without an error.
