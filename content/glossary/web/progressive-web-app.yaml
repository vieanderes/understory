term: progressive web app
aka:
  - PWA
  - installable web app
short: A website with a manifest and an offline script, which browsers let people install like an app.
explain: |
  Sometimes a website is all you need. But people want an icon on their home screen and a page
  that opens without signal.

  Add three things. Serve it over HTTPS, and add a manifest with a name, icons and a display mode.
  Then add a service worker that serves the app from a cache. Browsers then offer to install it.
  It opens in its own window, works offline and updates the moment you deploy.

  The limits are real. On iOS, installing is a manual "Add to Home Screen" step, and saved data can be cleared. Push
  works only once it's installed. Check those before promising an
  app-like experience.
analogy: A shop that also delivers. Same shop, but now it comes to your door, even when the high street is shut.
usage: A progressive web app covers the field team's offline forms without going through either store.
