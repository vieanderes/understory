summary: >-
  A question gets a useful answer when the helper can start work from the first message.
  That needs three things: what you **expected**, what **actually** happened, with the exact
  output or error, and code that shows it. Add what you already tried and where you're
  stuck, and the reply can be an answer instead of a round of questions.


  The code part is a **minimal reproduction**: the smallest program that still shows the
  problem, with no app, database or login around it. You build one by deleting. Remove a
  piece, run it, and check the bug is still there. Every deletion that keeps the bug rules
  that piece out. Very often the cause becomes clear before you post, which makes this the
  most useful debugging habit there is, not only a courtesy to helpers.


  The same shape works for a person and for an AI assistant, with one difference. A person
  who lacks a fact asks for it. An assistant usually fills the gap with a guess and answers
  the guess fluently. A complete question matters even more there. And whatever you send,
  to a forum or a chat, strip secrets and real customer data first.
remember:
  - A question people can answer says what you expected, what actually happened, and shows code that reproduces it.
  - Paste the exact error text and the real output; "it doesn't work" gives a helper nothing to act on.
  - A minimal reproduction is the smallest code that still shows the problem, and it runs on its own.
  - Build a reproduction by deleting and rerunning; when a deletion makes the bug vanish, you've found what triggers it.
  - Say what you already tried, so nobody suggests it again, and say exactly where you're stuck.
  - An AI assistant guesses at missing facts instead of asking, so give it versions, errors and inputs up front.
  - Never post keys, passwords or real customer data; a key that has been posted must be revoked and replaced.
  - Run your reproduction alone in a fresh file before you send it, to prove it still fails.
sections:
  - title: A question template that works for people and AI
    body: |-
      Most good questions share one shape. Keep it as a template and fill it in before you
      ask anyone:

      ```text
      Problem: scaleRecipe returns NaN for one ingredient
      Expected: scaleRecipe(soup, 2) doubles every amount
      Actual: [ 400, NaN, 6 ], no error thrown
      Reproduction: 8 lines below, run with Node 24
      Tried: wrapping amounts in Number(), same result
      Stuck on: how to handle amounts that aren't numbers
      ```

      The **problem line** is a symptom, not a theory. "scaleRecipe returns NaN" is a fact;
      "JavaScript multiplication is broken" is a guess that sends helpers the wrong way.

      **Expected** and **actual** belong together. Either one alone is half a bug report:
      "it returns NaN" means nothing if NaN might be right, and "it should double" doesn't
      say what it does now.

      **Versions** matter more than people think. Node, the browser, the library and its
      version change behaviour, and the helper's first test is often on a different version
      from yours.

      **Tried** saves a round. It also shows you've done the obvious things, which makes
      busy people more willing to help.

      **Stuck on** is the question itself. Without it, helpers answer whatever they guess you
      meant. Write it last: by then you often know exactly what to ask, and sometimes you
      no longer need to.
  - title: Shrinking by hand and by machine
    body: |-
      By hand, a reproduction is built in a loop: copy the failing code into an empty file,
      delete something, run it, and keep the deletion if the bug survives. Start with big
      pieces, such as whole modules, the database or the framework, and replace real data
      with three made-up items. Then go line by line.

      Two things happen along the way. Often the bug vanishes after one deletion, which
      tells you the deleted piece takes part. Put it back and delete something else. And
      often you see the cause before you finish, because there's nowhere left for it to
      hide.

      The `shrink` you wrote does this by machine:

      ```js
      const hasText = (list) => list.some((amount) => typeof amount === "string");
      console.log(shrink([200, "a pinch", 3, "to taste"], hasText));
      // [ 'to taste' ]
      ```

      It keeps every removal that still fails, so it ends on whichever culprit survives
      longest. Here `"a pinch"` alone would fail too, and you'd fix both together. The
      result can't shrink further, though it isn't always the smallest possible case.
      That's fine for a bug report: any small failing case is a good one.

      Automatic shrinking is everywhere once you look. Property-based testing libraries
      shrink random failing inputs before they show them. `git bisect` halves a range of
      commits to find the one that broke something. Delta debugging does it to any input,
      such as a 5,000-line file that crashes a compiler.
  - title: Asking an AI assistant well
    body: |-
      An assistant has no access to your screen, your files or what you tried, unless you
      give them to it. When a fact is missing, it rarely asks. It picks the likeliest
      version of your problem and answers that one, fluently. A vague question gets a
      confident answer to a different question.

      So give it the same template, and three extras:

      1. The **environment**: language and library versions, browser, operating system.
      2. The **exact text** of the error and the stack trace, pasted, not paraphrased.
      3. An instruction about gaps: "If anything is missing, ask me before you answer."

      Paste the reproduction, not the whole project. A long context dilutes the part that
      matters, and the answer drifts towards whatever is most common in the pasted code.

      Then treat the answer as a hypothesis. Run it against your reproduction. If it
      doesn't fix the reproduction, it doesn't fix the bug, however plausible it sounds.

      Everything about secrets applies here too. A key pasted into a chat may be stored or
      logged on someone else's servers. Use made-up data in reproductions by default, and
      replace any real key you have pasted anywhere public.
pitfalls:
  - '**"It doesn''t work."** It names no behaviour, so the helper''s first reply is a question. Paste the actual output or the exact error.'
  - '**Posting the whole project.** Nobody reads 40 files well, person or AI. Cut it to the few lines that still fail.'
  - '**Asking about your theory instead of the symptom.** "Is multiplication broken?" sends helpers after your guess. Describe what you saw, and mention the theory last.'
  - '**Never running the reproduction alone.** It may depend on a name defined elsewhere in the app. Run it in an empty file before you send it.'
  - '**Leaking secrets in a reproduction.** Config files, logs and pasted environment variables carry keys and customer data. Use made-up values, and revoke any key that was posted.'
  - '**Paraphrasing the error.** "Some undefined error" loses the property name and the line. Copy the exact text.'
verify:
  - lens: tests
    check: Run the reproduction alone in a new, empty file and confirm it still shows the exact output or error you describe.
  - lens: leaks
    check: Search the reproduction, logs and screenshots for keys, passwords, tokens and real customer names or emails before you post them anywhere.
  - lens: confuses
    check: Check the question says expected and actual side by side, so a helper can tell the bug from the intended behaviour.
  - lens: breaks
    check: Include versions of the language, the runtime and the library, because a helper on another version may not see the bug at all.
interview:
  - question: Tell me about a time you were stuck. How did you get help?
    answer: >-
      Lead with what you did before asking, then how you asked. For example: an export
      returned an empty file for one customer only. Before asking, I cut it down to a
      fifteen-line script with that customer's data shape, made-up values, and it still
      failed. I posted expected and actual, the script, and what I'd ruled out: the query
      returned rows, so the bug was after it. A colleague spotted in two minutes that a date
      filter used local time. The point I'd make is that the reproduction did most of the
      work. Without it, that would have been an afternoon of messages. The trade-off is that
      shrinking takes time, so for a quick question to someone next to me I'd ask first.
  - question: What makes a good bug report?
    answer: >-
      One that someone else can act on without asking anything back. It has a symptom-style
      title, the steps or the smallest code that reproduces it, what you expected and what
      actually happened with the exact error, and the environment: versions, browser,
      operating system. It says how often it happens, because "every time" and "one in fifty"
      call for different investigations. It avoids diagnosis in the title, since a wrong
      theory sends people the wrong way. For anything security-related, the report goes
      through a private channel, not a public tracker. The best reports I've seen also say
      what was ruled out, which halves the search.
  - question: How do you use AI assistants when debugging?
    answer: >-
      As a fast second pair of eyes on a minimal reproduction, not as an oracle on the whole
      project. I give it the reproduction, the exact error, the versions, and what I've ruled
      out, and I ask it to ask me if anything is missing, because otherwise it guesses. I
      treat its answer as a hypothesis and run it against the reproduction before I touch the
      real code. If the reproduction still fails, the suggestion was wrong, however
      convincing it read. I never paste secrets or customer data. The trade-off is that
      building the reproduction is the slow part, but it's also where I find most bugs
      myself.
