term: loose equality
aka:
  - double equals
  - abstract equality
short: A comparison that first converts both sides to a shared type, then checks whether they match.
explain: |
  `==` tries to be helpful. Before comparing, it converts the values, so `'5' == 5` is true.

  The conversion rules are long and surprising. `0 == ''` is true, yet `null == 0` is false.
  Most teams ban it, with one common exception: `value == null` matches both `null` and
  `undefined`.
analogy: A bouncer who accepts any ID that looks roughly right. Handy now and then, but you never know who gets in.
example:
  language: js
  code: |
    '5' == 5; // true
    0 == ''; // true
    null == undefined; // true
    null == 0; // false
usage: Loose equality treats the empty string as 0 here, so the filter matches every row.
twin:
  term: strict-equality
  difference: Loose equality, `==`, converts the two sides before comparing. Strict equality, `===`, compares them as they are, so a number never equals a string.
related:
  - strict-equality
  - type-coercion
  - falsy
level: 2
lessons:
  - js.coercion
