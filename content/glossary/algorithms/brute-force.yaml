term: brute force
aka: [brute-force solution, naive solution, trusted slow version]
short: Solving a problem by trying every possibility, correct but often far too slow.
explain: |
  Check every pair, every subset, every order. It's the solution you can write without a
  clever idea, and it's usually right.

  In an interview, say it first. It proves you understand the problem, gives a baseline,
  and its slowest part points at the fix. Nested loop over pairs? A hash map removes the
  inner loop.

  Keep it after you've written the fast version. Run both on thousands of small random
  inputs and compare. Where they disagree, the fast one has a bug.
analogy: Finding the right key on a big ring by trying every one. It works; it's slow.
example:
  language: js
  code: |
    // O(n²): try every pair. Correct, and the baseline to beat.
    function hasPairWithSum(nums, target) {
      for (let i = 0; i < nums.length; i++)
        for (let j = i + 1; j < nums.length; j++)
          if (nums[i] + nums[j] === target) return true;
      return false;
    }
usage: Start with the brute force, say it's O(n²), then show how a set gets it to O(n).
related: [big-o, edge-case, stress-testing, hash-map, backtracking]
level: 1
lessons: [algo.approach, interview.communication, interview.timed-strategy]
