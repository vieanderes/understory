deepDive: >-
  Every output here was checked by running it. Destructuring can rename as it unpacks: `const { title:
  name } = film` makes a variable called `name`. It can reach inside nested objects,
  `const { address: { city } } = user`, though that throws when `address` is missing.


  Unpacking `undefined` or `null` throws a `TypeError` such as "Cannot destructure property
  'title' of 'undefined'". A parameter can guard against that with a default of its own:
  `function describe({ title } = {})`.


  Rest works in destructuring too: `const [first, ...others] = list` puts the first item in
  `first` and the rest in a new array. An object rest, `const { id, ...details } = row`,
  collects every property except `id`.


  Spread copies one level only. A nested array or object is shared between the copy and the
  original, which the references lesson looks at closely.
