term: combobox
aka:
  - autocomplete input
  - typeahead
short: A text input with a popup list of suggestions that you can pick from with the keyboard.
explain: |
  You type "lon" and a list appears: London, Long Beach. Arrow keys move through it, Enter
  picks one and Escape closes it. Focus stays in the text box the whole time.

  The accessible pattern has rules. The input gets `role="combobox"` and
  `aria-expanded`. The list is a `listbox` of `option`s. `aria-activedescendant` tells a
  screen reader which option is highlighted.

  The hard part is often the data. Each keystroke can start a request, and responses
  arrive out of order. Only the latest query may fill the list.
analogy: A helpful shop assistant who finishes your sentence, but lets you choose.
usage: Build the search box as a combobox, so arrow keys and screen readers both work.
related:
  - aria-role
  - keyboard-navigation
  - debounce
  - stale-response
level: 3
