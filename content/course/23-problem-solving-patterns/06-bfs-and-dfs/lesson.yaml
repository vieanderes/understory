deepDive: >-
  Two costs hide in a JavaScript BFS. `seen.includes` is O(n) per check, which turned a
  90,000-cell grid from 48 ms into 33 seconds in our run. And `queue.shift()` is O(n) in
  general, because every item moves down one place. V8 often avoids the copy, but a head
  index (`let head = 0; const next = queue[head++];`) makes the cost certain.


  String keys like `'3,7'` read well. On big grids, a number key `row * width + col`
  or a flat `Uint8Array` of seen flags is faster and uses less memory.


  BFS gives shortest paths only when every step costs the same. With different costs, such
  as road lengths, use Dijkstra's algorithm: a heap in place of the queue, which is the
  next lesson's structure. When you know the goal's position, A* adds a distance estimate
  to steer the search.


  Recursive DFS reads well but stops with `RangeError: Maximum call stack size exceeded`
  once an island is tens of thousands of cells deep. An explicit stack has no such limit.
