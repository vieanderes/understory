summary: >-
  Code review is a second engineer reading a change before it merges. It catches bugs, but
  that isn't its only job. It spreads knowledge of the codebase, keeps the design coherent,
  and teaches in both directions. A good review is judged by what it prevents and how fast
  it unblocks, not by how many comments it leaves.


  The lesson gives the core habits: review in order of what it costs to miss, label every
  comment with its severity, and keep changes small. These notes add the rest of the job: a
  full checklist that includes data safety and operability, how to review tests so they
  actually protect the change, how to phrase comments using Conventional Comments, what
  "fast enough" means for turnaround, and how to be a good author on the other side.


  The standard many teams borrow comes from Google's engineering practices: approve a change
  once it definitely improves the overall health of the code, even if it isn't perfect.
  Review is there to keep the codebase getting better, not to make every change match what
  the reviewer would have written.
remember:
  - Review in order of the cost of a miss, correctness, then security and data safety, then design and tests, then naming, and leave formatting to tools.
  - Approve when the change definitely improves the code's overall health, even if it isn't how you'd have written it.
  - Start each comment with a label such as question, suggestion, nit or must-fix, and say what you saw and why it matters.
  - Check that the tests would fail without the change, because a test that can't fail protects nothing.
  - Small, single-purpose pull requests get read closely, while large ones get skimmed, so split refactors from features.
  - Respond to review requests quickly, within one working day at most, because waiting blocks the author and invites bigger batches.
  - Comment on the code, not the person, and ask a question when you might be missing context.
  - As an author, review your own diff first and write a description that says what changed, why and how you tested it.
sections:
  - title: The full checklist, in order
    body: |-
      Before reading the diff, read the description and the linked issue. You can't judge
      whether code is correct until you know what it's meant to do. If the description
      doesn't say, that's your first comment.

      Then work down the list, stopping to comment as you go:

      1. **Correctness.** Does it do what it claims? Walk the edge cases: empty and single
         items, `null` and missing fields, exact boundaries, time zones and daylight saving,
         concurrent calls, retries, and every error path. For anything subtle, pull the
         branch and run it.
      2. **Security.** Is every read and write checked against who is asking, as in the
         lesson's invoice? Is input validated at the boundary? Any string built into SQL,
         HTML or a shell command? Any secrets, tokens or personal data in code or logs?
      3. **Data safety.** Can the migration run on a live table without locking it for
         minutes? Is it backward compatible with the code still running during the deploy?
         Is anything deleted that can't be restored?
      4. **Design.** Does it belong in this module? Does it duplicate knowledge that exists
         elsewhere? Is it more general than today's need?
      5. **Tests.** Covered in the next section.
      6. **Operability.** If this breaks at night, will the logs and metrics say why? Is it
         behind a feature flag if it's risky? How would you roll it back?
      7. **Readability.** Names, comments that explain why, and code a newcomer can follow.

      Formatting and import order belong to the formatter and linter. If they come up in
      review, the fix is a tool, not a comment.

      For AI-written code, add two checks to the correctness pass. Confirm that every
      function, option and package it uses exists in the version you run. And confirm the
      tests assert on real behaviour, since generated tests often mirror the implementation
      and pass whatever it does.
  - title: Reviewing the tests
    body: |-
      A test earns its place by failing when the behaviour breaks. The quickest review
      question is: **would this test fail if the change were wrong?** A weak assertion
      passes on buggy code.

      ```js
      import { test } from 'node:test';
      import assert from 'node:assert/strict';

      // The bug from the lesson: the comparison is flipped.
      function applyCoupon(order, coupon, now) {
        if (coupon.expiresAt > now) return order;
        const discount = Math.round((order.totalPence * coupon.percent) / 100);
        return { ...order, totalPence: order.totalPence - discount };
      }

      const now = new Date('2026-03-10T12:00:00Z');
      const order = { id: 'o1', totalPence: 2000 };
      const valid = { percent: 10, expiresAt: new Date('2026-04-01T00:00:00Z') };

      test('weak: applies a coupon', () => {
        const result = applyCoupon(order, valid, now);
        assert.ok(result); // passes on the buggy code
        assert.equal(result.id, 'o1'); // still passes
      });

      test('strong: takes 10% off with a valid coupon', () => {
        assert.equal(applyCoupon(order, valid, now).totalPence, 1800); // fails on the buggy code
      });
      ```

      Run under `node --test`, the weak test passes and the strong one fails, which is what
      you want from a test when the code is wrong.

      What else to look for:

      - **The unhappy paths.** An expired coupon, a stranger's invoice, an empty cart. The
        lesson's ownership bug slipped through because every test logged in as the owner.
      - **Boundaries.** A value at the threshold and either side of it.
      - **Behaviour, not implementation.** Tests that assert which private helper was called
        break on every refactor and prove little.
      - **Mocks that replace the thing under test.** If the database layer is mocked in a test
        of the query, nothing real is checked.
      - **Snapshots updated without reading.** A changed snapshot in the diff is a claim that
        the new output is right. Read it.
      - **A bug fix without a regression test.** Ask for one that fails before the fix.
  - title: Writing comments people can act on
    body: |-
      A comment has three jobs: say how much it matters, say what you saw, and say why it
      matters or what would fix it. **Conventional Comments** gives the first job a format:
      a label, optional decorations in brackets, then the subject. Its labels include
      `praise`, `nitpick`, `suggestion`, `issue`, `todo`, `question`, `thought`, `chore` and
      `note`, and its decorations include `(blocking)` and `(non-blocking)`. Many teams use
      the shorter set from the lesson. The label matters less than using one consistently.

      ```text
      issue (blocking): getInvoice never compares invoice.ownerId with user.id,
      so any logged-in user can read any invoice by guessing its id. Could we
      return NotFound for a stranger's invoice, and add a test logged in as
      someone else?

      suggestion (non-blocking): this loop and the one in exportOrders both
      build the same header row. Worth sharing if a third export appears.

      nitpick: `data` could be `openInvoices`, so the filter reads on its own.

      question: why is the retry limit 7 here and 3 in the payment client?
      I may be missing context.

      praise: the table of boundary cases in this test is clear. Thank you.
      ```

      Compare "This is wrong." It doesn't say what's wrong, whether it blocks, or what to do.
      The author has to guess, reply and wait for another round.

      Tone rules that keep reviews fast:

      - Write about the code, not the author: "this skips the check", not "you forgot".
      - Ask when you're unsure. The author may know something you don't.
      - Give the reason, not only the instruction. It teaches, and it lets the author push
        back if the reason doesn't apply.
      - If a thread passes two or three rounds, talk it through live, then write the
        outcome in the thread.
      - Say what's good. Praise for a specific choice tells the author what to keep doing.
  - title: Size, speed and splitting
    body: |-
      Review quality falls as size grows. Google's guide on small changes suggests that 100
      lines is usually a reasonable size and 1,000 lines is usually too large, while noting
      that the spread of the change across files matters too. A reviewer reads a small change
      closely and approves a huge one out of fatigue.

      Ways to split a large change:

      - **Refactor first, feature second.** A pure refactor, reviewed as "no behaviour
        change", then the feature on top of cleaner code.
      - **Stack it.** A chain of small pull requests, each building on the last, such as the
        schema, then the data layer, then the endpoint, then the screen.
      - **Split by layer or by file group** when parts can merge on their own.
      - **Hide unfinished work behind a feature flag** so partial features can merge safely.

      **Speed** matters as much as size. Google's guidance says one business day is the
      maximum time to respond to a review request, and that responding soon after you finish
      your current task is better. Slow reviews have a hidden cost: authors batch more into
      each change to avoid the wait, which makes changes bigger, which makes reviews slower.
      Fast responses reverse that loop.

      A fast response doesn't have to be a full review. "I'll look this afternoon" or "the
      approach looks right, details tomorrow" unblocks the author's planning. Approving with
      small comments, trusting the author to address nits before merging, also saves a round
      trip when the remaining points are minor.
  - title: Being reviewed
    body: |-
      The author sets up the review. A few habits make it faster and kinder for everyone.

      **Review your own diff first.** Read it in the review tool, as the reviewer will. You'll
      catch the leftover `console.log`, the commented-out block and the file you didn't mean
      to include.

      **Write the description a reviewer needs.** What changed, why, how you tested it, and
      where the risk is. A screenshot for a UI change. "The interesting part is the retry
      logic in `queue.ts`, the rest is renaming" saves the reviewer ten minutes.

      **Keep it small and single-purpose.** One idea per pull request, as above. If you
      notice a refactor halfway through a feature, make it a separate change first.

      **Answer every comment.** Fix it, or explain why not. "Done" is fine for a nit. For a
      disagreement, give the reasoning, and remember the reviewer may be seeing the code as
      the next reader will. If you can't agree, involve a third person or the team's
      conventions rather than going round again.

      **Don't take it personally.** The comments are about the code. A reviewer who finds a
      bug before production has done you a favour.

      **Learn from repeats.** If the same comment appears on several of your changes, turn it
      into a habit, a checklist item or a lint rule, so nobody has to write it again.
pitfalls:
  - "**Starting with naming and style.** Twenty comments about names can bury the one missing authorisation check. Do the correctness and security pass first, and leave formatting to the tools."
  - "**Unlabelled comments.** The author can't tell a blocker from a preference, so they either treat every nit as blocking or miss the real issue. Label each comment and mark what blocks the merge."
  - "**Blocking on personal taste.** Holding a change because you'd have structured it differently costs the author days for no gain in health. Approve when it improves the code, and offer taste as a non-blocking suggestion."
  - "**Approving a large diff you skimmed.** Size makes reviewers tired, and tired reviewers wave changes through. Ask for the change to be split, or review it in parts and say which parts you read."
  - "**Trusting green tests.** Tests can pass on broken code when they assert too little or only cover the happy path. Check that each test would fail if the behaviour were wrong."
  - "**Letting reviews wait for days.** Slow turnaround pushes authors to batch bigger changes and loses their context. Respond within a working day, even if the full review comes later."
  - "**Arguing in threads.** Long back-and-forth comments waste both people's time and read harsher than intended. After a couple of rounds, talk it through live and record the outcome."
  - "**Hiding a behaviour change in a rename or refactor.** Reviewers skim changes titled refactor, so the flipped comparison sails through. Keep behaviour changes in their own pull request with their own tests."
verify:
  - lens: leaks
    check: Every function that loads a record by id checks it belongs to the caller before returning it, and a test logs in as someone else.
  - lens: breaks
    check: A pull request titled refactor or rename changes no comparison, condition or return value, because behaviour changes get their own pull request.
  - lens: tests
    check: Each test in the diff would fail if the behaviour it names were wrong, not only pass on the happy path.
  - lens: confuses
    check: Every review comment starts with a label, and only must-fix comments block the merge.
interview:
  - question: How do you approach reviewing a pull request?
    answer: >-
      I start with the description and linked issue, so I know what the change is meant to
      do, then review in order of the cost of a miss. First correctness, walking edge cases
      like empty input, boundaries, concurrency and error paths, and running it if it's
      subtle. Then security and data safety: authorisation on every read, input validation,
      secrets and personal data, whether a migration is safe on a live table. Then design and
      tests, checking each test would fail if the code were wrong. Naming comes last, and
      formatting belongs to tools. I label comments by severity and approve when the change
      clearly improves the code, even if it isn't how I'd have written it. For risky changes
      I also ask how we'd notice and roll back a failure.
  - question: How do you write review comments that don't create friction?
    answer: >-
      I make each comment say how serious it is, what I saw and why it matters. A label up
      front, such as nit, suggestion, question or a blocking issue, tells the author what they
      must do. Then a concrete observation, like "this never compares the invoice owner with
      the user", and the consequence or a suggested fix. I write about the code rather than
      the person, ask questions when I might lack context, and point out good choices too. If
      a thread goes past two or three rounds, I suggest a quick call and write the outcome
      back into the thread. The trade-off is a little more typing per comment, which saves
      whole review cycles of guessing.
  - question: Why do small pull requests matter, and how do you split a big one?
    answer: >-
      Small changes get real review, while big ones get skimmed. With fifty lines a reviewer
      can trace every path. With two thousand, they approve out of fatigue and bugs slip
      through. Small changes also merge faster, conflict less and are easier to revert. To
      split a big change, I put refactors in their own pull request first, marked as no
      behaviour change, then the feature on top. For a large feature I stack changes by
      layer, schema then data access then endpoint then UI, and use a feature flag so
      incomplete work can merge safely. The cost is some coordination overhead and more
      pull requests to track, which is far cheaper than a missed bug in a giant diff.
  - question: What do you look for when reviewing tests?
    answer: >-
      Mainly whether each test would fail if the behaviour were wrong. Assertions like "the
      result is truthy" pass on broken code, so I look for exact expected values. Then
      coverage of the unhappy paths: a stranger requesting someone else's invoice, an expired
      coupon, empty input, and values at each boundary. I check tests assert behaviour rather
      than which private function was called, so refactors don't break them. I watch for
      mocks that replace the very thing under test, and snapshot changes committed without
      being read. For a bug fix, I ask for a regression test that fails before the fix. With
      AI-generated tests I'm stricter, since they often restate the implementation instead of
      the requirement.
  - question: How quickly should code reviews happen, and why does it matter?
    answer: >-
      Fast, within a working day at the latest, and ideally soon after finishing whatever
      I'm in the middle of. Google's engineering guidance uses one business day as the
      maximum. Slow reviews block the author and cost them context, and they create a bad
      loop: authors batch more work into each change to avoid waiting, so changes grow and
      reviews get slower still. I don't break deep focus for every request, but I review at
      natural breaks. A quick first reply, such as confirming the approach looks right with
      details to follow, often unblocks the author even before the full review. The trade-off
      is interruption, which small pull requests keep short.
