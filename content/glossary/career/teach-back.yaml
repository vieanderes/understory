term: teach-back
aka:
  - teach back
  - say it back
short: Checking an explanation landed by asking the listener to explain it, or apply it, in their own words.
explain: |
  "Does that make sense?" almost always gets a yes. People don't want to look slow, and they
  often don't know what they missed.

  Ask them to use it instead. "How would you explain this to the support team?" or "What
  would you change for the new format?" Their answer shows exactly where the gaps are.

  Frame it as a test of your explanation, not of them. "Let me check I explained that well"
  keeps it friendly.
analogy: A nurse asking you to repeat how to take the medicine, not whether you understood.
usage: Do a quick teach-back before the handover; ask them how they'd roll it back.
twin:
  term: curse-of-knowledge
  difference: Teach-back is the check, asking the listener to explain it back. The curse of knowledge is the blind spot it catches in the explainer.
related:
  - curse-of-knowledge
level: 2
lessons:
  - explain.say-it-plainly
