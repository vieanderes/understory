deepDive: >-
  Each STRIDE letter pairs with a property you defend: authentication against spoofing,
  integrity against tampering, non-repudiation, confidentiality, availability, and
  authorisation against elevation of privilege.


  The Threat Modeling Manifesto sums the method up in four questions. What are we working on:
  the diagram. What can go wrong: STRIDE per entry point. What will we do about it: a
  defence per threat, or a written decision to accept the risk. Did we do a good enough job:
  come back when the system changes.


  A model is a living document. A new webhook, a new upload, a new role: each adds an entry
  point and a row.


  The Top 10 is ranked from data that testing firms and companies share about the apps they
  test. A survey adds newer risks the data can't see yet. Each entry is a family of root
  causes, not one bug. OWASP also keeps separate lists for mobile apps, APIs and apps built
  on language models; the AI chapters come back to that last one.
