term: XSS
aka:
  - cross-site scripting
short: An attack where someone's input runs as script in another user's browser, on your site.
explain: |
  A comment box saves whatever people type. Now say the page inserts that comment as HTML. A
  comment holding a `<script>` tag runs for every reader, with their login, on your site.

  The fix is to insert untrusted data as text. Or escape it for the exact place it lands:
  HTML, an attribute, a URL. Frameworks do this by default; the bugs live where code opts
  out, such as `innerHTML`. A Content Security Policy is the second lock.
analogy: A note pinned to a shared noticeboard that says "whoever reads this, hand over your keys", and every reader does.
example:
  language: js
  code: |
    // Runs any script hidden in the comment
    el.innerHTML = comment.body;

    // Shows it as text
    el.textContent = comment.body;
usage: The search page echoes the query into innerHTML, so that's reflected XSS.
twin:
  term: csrf
  difference: XSS runs the attacker's script inside your site, where it can do anything the user can. CSRF runs nothing on your site; another site makes the victim's browser send one request, cookies attached.
related:
  - csrf
  - content-security-policy
  - sql-injection
  - cookie
level: 1
lessons: [security.xss-and-csp, js.changing-the-page]
