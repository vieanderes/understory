term: 90-day plan
aka:
  - ninety-day plan
  - 30-60-90 plan
  - onboarding plan
short: A written plan for a new job's first three months, moving from learning, to contributing, to leading.
explain: |
  New jobs fail quietly in the first months: too long reading code, or a big rewrite proposed
  in week three. A plan keeps you moving in the right order.

  Month one, learn: trace one real request end to end, learn how quality is measured, ship a
  small first change. Month two, contribute: own a feature. Month three, lead: pick one
  improvement and see it through.

  Share it with your manager in the first week. It turns "settling in" into goals you can both
  check, and it surfaces wrong assumptions early.
analogy: The first three chapters of a travel guide. Learn the streets, then the routes, then show others around.
usage: My 90-day plan has one shipped change in the first fortnight, so I learn the deploy path early.
related:
  - levelling
  - pull-request
level: 2
lessons:
  - career.first-90-days
