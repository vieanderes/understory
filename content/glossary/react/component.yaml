term: component
aka:
  - React component
  - function component
short: A function with a capitalised name that returns JSX describing one piece of the page.
explain: |
  A page is a tree of parts: a header, a list, each item in the list. In React each part is a
  function. It takes inputs and returns what that part should look like.

  The name must start with a capital, so `<TodoItem />` is yours and `<li>` is the browser's.
  React calls the function, not you, and may call it many times. Keep it pure: same inputs,
  same output, nothing changed along the way.
analogy: A rubber stamp. Carve it once, then press it wherever you need that shape, with different ink each time.
example:
  language: tsx
  code: |
    function TodoItem({ title, done }: { title: string; done: boolean }) {
      return <li className={done ? 'done' : ''}>{title}</li>;
    }

    <TodoItem title="Buy milk" done={false} />;
usage: Pull the price row into its own component; it's copied in three places.
related:
  - props
  - jsx
  - state
level: 1
