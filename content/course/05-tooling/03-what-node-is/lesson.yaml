id: tooling.node
title: What Node is
objective: Run JavaScript files with Node, read its errors, and pass settings in through `process.env`.
level: essential
minutes: 10
concepts: [tooling.node-runtime, tooling.node-errors, tooling.process-env]
prerequisites: [tooling.pipes-and-exit-codes]
opening:
  text: >-
    You'll run your own JavaScript files in the terminal and read the errors Node prints. Every
    server, build tool and test runner you'll meet from here on runs this way.

steps:
  - type: prose
    id: what-node-is
    body: |-
      So far your JavaScript has run in a browser, or in this app. **Node** is a program
      that runs JavaScript outside the browser, straight from the terminal. A program that
      runs code is called a **runtime**.

      ```bash
      $ node --version
      v24.21.0
      $ cat hello.js
      const name = "Sam";
      console.log("Hello, " + name);
      $ node hello.js
      Hello, Sam
      ```

      It's the same `console.log` from chapter 0. The output now lands in the terminal.

  - type: fill-blank
    id: fill-run-a-file
    concept: tooling.node-runtime
    difficulty: 1
    language: bash
    prompt: You wrote `greet.js`. Run it with Node. Fill the gaps.
    template: |
      $ {{1}} {{2}}
      Hello, Sam
    blanks:
      - key: '1'
        answer: node
      - key: '2'
        answer: greet.js
    bank: [node, npm, greet.js, greet, run]

  - type: prose
    id: reading-an-error
    body: |-
      When a line fails, Node stops and prints this. We cut Node's own lines at `...`.

      ```text
      /home/dev/shop/basket.js:2
        return item.price * item.quantity;
                    ^

      TypeError: Cannot read properties of undefined (reading 'price')
          at priceOf (/home/dev/shop/basket.js:2:15)
          at basketTotal (/home/dev/shop/basket.js:7:21)
          at Object.<anonymous> (/home/dev/shop/basket.js:12:13)
          at Module._compile (node:internal/modules/cjs/loader:1929:14)
          ...
      ```

      The top shows the file, the line number and a `^` under the spot. Then comes the
      message: the kind of error and what went wrong, as in chapter 0.

  - type: prose
    id: stack-and-frames
    body: >-
      The `at` lines are the **stack trace**. Remember the call stack: the pile of functions
      still running, newest on top.


      Each `at` line is one **frame**, one function on that pile. It names the function, then
      the file, line and column. `Object.<anonymous>` means the top of the file, outside any
      function.


      Lines with `node:internal` are Node's own code. Skip them. The crash also ends the
      program with exit code 1.

  - type: multiple-choice
    id: pick-crash-line
    concept: tooling.node-errors
    difficulty: 2
    language: text
    code: |
      TypeError: Cannot read properties of undefined (reading 'price')
          at priceOf (/home/dev/shop/basket.js:2:15)
          at basketTotal (/home/dev/shop/basket.js:7:21)
          at Object.<anonymous> (/home/dev/shop/basket.js:12:13)
          at Module._compile (node:internal/modules/cjs/loader:1929:14)
    question: Which line of your code was running when it crashed?
    choices:
      - text: Line 2 of `basket.js`, in `priceOf`
        correct: true
        feedback: >-
          Yes. The top frame is where it broke. Open that line first.
      - text: Line 12 of `basket.js`, the first call
        feedback: >-
          That's the bottom of your frames: where it all started. The crash is at the top.
      - text: The `node:internal` loader frame
        feedback: >-
          That frame is Node's own code, not yours. Skip those.
      - text: Line 7 of `basket.js`, in `basketTotal`
        feedback: >-
          `basketTotal` was waiting for `priceOf` to finish. The newest frame is on top.

  - type: bug-hunt
    id: hunt-real-cause
    concept: tooling.node-errors
    difficulty: 3
    language: js
    code: |
      function priceOf(item) {
        return item.price * item.quantity;
      }
      function basketTotal(items) {
        let total = 0;
        for (const item of items) {
          total = total + priceOf(item);
        }
        return total;
      }
      const basket = [{ price: 3, quantity: 2 }, undefined];
      console.log(basketTotal(basket));
    prompt: The top frame points at line 2. That's where it broke. Tap the line where the mistake really is.
    lines: [11]
    reasons:
      - text: The basket holds `undefined` where an item belongs
        correct: true
        feedback: >-
          Yes. Line 2 only tripped over the bad value from line 11.
      - text: '`priceOf` should check for `undefined` first'
        feedback: >-
          A check would hide the crash, but the basket would still be wrong. The bad item is the
          cause.
      - text: '`total` should start at `undefined`'
        feedback: >-
          Starting at 0 is right for adding up. The crash is about an item, not the total.
    fix: |
      function priceOf(item) {
        return item.price * item.quantity;
      }
      function basketTotal(items) {
        let total = 0;
        for (const item of items) {
          total = total + priceOf(item);
        }
        return total;
      }
      const basket = [{ price: 3, quantity: 2 }, { price: 5, quantity: 1 }];
      console.log(basketTotal(basket));

  - type: prose
    id: environment-variables
    body: |-
      A **server** is a program that keeps running and answers requests from browsers. It
      listens on a numbered door on the computer, called a **port**.

      Programs get settings when they start, as **environment variables**: named bits of
      text. Node puts them in `process.env`.

      ```bash
      $ cat server.js
      console.log("Port:", process.env.PORT);
      $ PORT=8080 node server.js
      Port: 8080
      $ node server.js
      Port: undefined
      ```

      `PORT=8080` before a command sets it for that one command only. AI apps get their API
      key the same way, from `process.env`.

  - type: predict-output
    id: predict-port-is-text
    concept: tooling.process-env
    difficulty: 2
    language: bash
    code: |
      $ cat port.js
      console.log(process.env.PORT + 1);
      $ PORT=8080 node port.js
    question: What does it print?
    choices:
      - text: '`80801`'
        correct: true
        feedback: >-
          Yes. Every environment variable is text, so `+` joins two strings.
      - text: '`8081`'
        feedback: >-
          It looks like a number, doesn't it? The environment only holds text, so `+` joins.
      - text: '`NaN`'
        feedback: >-
          `NaN` comes from maths on something that isn't a number. Here `+` sees text and joins
          instead.
      - text: '`undefined1`'
        feedback: >-
          `PORT` was set for this command, so it's `"8080"`. Without `PORT=8080` you'd get that.

  - type: code-challenge
    id: write-port-from-env
    concept: tooling.process-env
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `portFrom(env)`. It gets an object like `process.env` and returns the port as a
      number.


      Use `3000` when `PORT` is missing, empty, or not a number. Remember `Number("")` is `0`,
      not `NaN`, so check for empty text yourself.


      So `portFrom({ PORT: "8080" })` returns `8080`, and `portFrom({})` returns `3000`.
    hints:
      - Look at what the starter returns. It's still text, and there's no fallback.
      - '`Number(text)` turns text into a number. `Number.isNaN` tells you if that failed.'
      - "Start with `if (env.PORT === undefined || env.PORT === '') return 3000;`."

  - type: explain-back
    id: explain-port-text
    concept: tooling.process-env
    difficulty: 3
    prompt: Why does `process.env.PORT + 1` print `80801`, and how would you get `8081`?
    rubric:
      - Every value in `process.env` is text, even when it looks like a number.
      - '`+` with text joins, so `"8080" + 1` becomes `"80801"`.'
      - Convert first with `Number(process.env.PORT)`, then add.
    modelAnswer: >-
      Environment variables are always text. `process.env.PORT` is `"8080"`, a string, and
      `+` with a string joins instead of adding. So you get `"80801"`. Turn it into a number
      first with `Number(process.env.PORT)`, and `+ 1` then gives `8081`.

recap:
  - "Run a JavaScript file in the terminal with `node file.js`."
  - "Read a Node error from the top frame down to the real cause."
  - "Pass a setting with `PORT=8080 node server.js` and convert it from text."

recall:
  - id: card-what-node-is
    concept: tooling.node-runtime
    front: What is Node?
    back: >-
      A program that runs JavaScript outside the browser. `node file.js` runs a file in the
      terminal.
  - id: card-read-frame
    concept: tooling.node-errors
    front: What does one `at` line of a stack trace tell you?
    back: >-
      One frame: a function that was running, with its file, line and column. The top frame is
      where it broke.
  - id: card-node-internal
    concept: tooling.node-errors
    front: Which lines of a Node stack trace can you usually skip?
    back: >-
      The `node:internal` ones. They're Node's own code, not yours.
  - id: card-env-is-text
    concept: tooling.process-env
    front: What type is `process.env.PORT` after `PORT=8080 node server.js`?
    back: >-
      Text: the string `"8080"`. Convert it with `Number()` before doing maths.
  - id: card-one-command
    concept: tooling.process-env
    front: How long does `PORT=8080` last in `PORT=8080 node server.js`?
    back: >-
      Only for that one command. The next command doesn't see it.

