id: ready-teams
title: ReadyTeams
topic: greedy
difficulty: easy
type: algorithmic
recommendedMinutes: 20
signature:
  params:
    - { name: K, type: int }
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  N volunteers stand in a queue, and volunteer I has an energy level A[I]. The organiser
  forms teams from volunteers who stand next to each other in the queue. A team is ready
  when the total energy of its members is at least K. Each volunteer joins at most one team,
  and some may join none.

  Write a function:

  {{signature}}

  that, given an integer K and an array A of N integers, returns the largest number of
  ready teams that can be formed.

  For example, given K = 6 and A = [2, 5, 1, 1, 6, 3, 4], the function should return 3. The
  teams can be [2, 5], [1, 1, 6] and [3, 4].

  Given K = 10 and A = [3, 3, 3], the function should return 0.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - K is an integer within the range [1..1,000,000,000];
  - each element of array A is an integer within the range [1..1,000,000,000].
examples:
  - { args: [6, [2, 5, 1, 1, 6, 3, 4]], expected: 3 }
  - { args: [10, [3, 3, 3]], expected: 0 }
tests:
  - name: extreme_single
    description: one volunteer
    group: correctness
    cases:
      - { args: [5, [5]], expected: 1 }
      - { args: [5, [4]], expected: 0 }
      - { args: [1, [1000000000]], expected: 1 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [4, [1, 3, 2, 2, 5, 1]], expected: 3 }
      - { args: [7, [6, 1, 6, 1, 6]] }
  - name: every_volunteer_ready
    description: K = 1, everyone forms a team alone
    group: correctness
    cases:
      - generate: { seed: 601, args: [{ kind: value, value: 1 }, { kind: ints, n: 50, min: 1, max: 1000 }] }
  - name: small_random
    description: random, N = 100
    group: correctness
    cases:
      - generate: { seed: 602, args: [{ kind: int, min: 1, max: 30 }, { kind: ints, n: 100, min: 1, max: 10 }] }
      - generate: { seed: 603, args: [{ kind: value, value: 1000 }, { kind: ints, n: 100, min: 1, max: 1000 }] }
  - name: medium_random
    description: random, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 604, args: [{ kind: value, value: 500 }, { kind: ints, n: 2000, min: 1, max: 100 }] }
  - name: large_random
    description: random, N = 100,000
    group: performance
    cases:
      - generate: { seed: 605, args: [{ kind: value, value: 1000000000 }, { kind: ints, n: 100000, min: 1, max: 1000000000 }] }
  - name: extreme_large
    description: large values, N = 100,000
    group: performance
    cases:
      - generate: { seed: 606, args: [{ kind: value, value: 1000000000 }, { kind: constant, n: 100000, value: 1000000000 }] }
      - generate: { seed: 607, args: [{ kind: value, value: 999999999 }, { kind: ints, n: 100000, min: 1, max: 1000 }] }
