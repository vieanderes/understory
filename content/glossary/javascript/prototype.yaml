term: prototype
aka:
  - prototype chain
short: The object another object falls back on when it's asked for a property it doesn't have itself.
explain: |
  Every array can call `map`, yet no array stores `map` itself. When you read `list.map`,
  JavaScript looks on the array, doesn't find it, and follows a hidden link to
  `Array.prototype`, where it lives.

  That link, and the links after it, form the prototype chain. `class` is syntax on top of
  it: methods go on the prototype and every instance shares them. `Object.hasOwn` tells an
  object's own properties from the inherited ones.
analogy: Asking a colleague who doesn't know, so they ask their manager, who asks theirs, until someone answers or there's nobody left.
example:
  language: js
  code: |
    const list = [1, 2];
    Object.hasOwn(list, 'map'); // false
    Object.getPrototypeOf(list) === Array.prototype; // true
    list.map((n) => n * 2); // found on the prototype
usage: The method lives on the prototype, not the instance, so patching it changes every instance at once.
related:
  - this-keyword
level: 3
