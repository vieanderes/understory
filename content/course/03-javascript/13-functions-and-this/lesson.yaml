deepDive: >-
  There are two more ways to call a function with a chosen `this`. `fn.call(obj, a, b)` calls it
  at once with `this` set to `obj`, and `fn.apply(obj, [a, b])` does the same with the arguments
  in an array. Modern code rarely needs either.


  The call forms have an order. `new` beats `bind`: calling a bound function with `new` builds a
  fresh object and ignores the bound `this`. `bind` beats `call` and `apply`, so a later
  `call` can't change a bound function's `this`.


  A class field written as `add = () => { ... }` makes one arrow per instance, so it keeps its
  `this` without `bind`. The cost is a new function for each object, instead of one shared on
  the prototype.


  Outside classes and modules, old scripts run in sloppy mode. There a plain call sets `this` to
  the global object instead of `undefined`, which hides the bug until something reads a missing
  property.
