deepDive: >-
  The error texts here come from mypy 2.3.1, run with `uvx mypy`. pyright, used by many
  editors, and ty, Astral's newer checker, read the same hints with slightly different
  messages and defaults. Pick one for the project and run it in CI next to ruff.


  A misspelt key in a `TypedDict` gets two errors from mypy: `Missing key "total"` and
  `Extra key "totl"`. That's why typed dicts suit JSON from outside. Hints cost nothing at
  run time, but they're kept: `double.__annotations__` returns them. Pydantic reads those
  stored hints to validate data for real, which is the next chapter.
