term: edge case
aka: [edge cases, corner case, boundary case]
short: An unusual input at the limits, like empty, one item or the largest allowed, where code often breaks.
explain: |
  Code written for a typical list often fails on the strange ones. An empty list. One item.
  All items the same. Negative numbers. The maximum size the task allows.

  Hidden tests are full of them, because that's where solutions break. Write them down
  before you code, and run each through your solution by hand before you call it done.

  Ask about them out loud in an interview: "Can the list be empty? Can values repeat?" It
  shows care, and the answers often change the approach.
analogy: Testing a new door by slamming it and leaning on it, not only by opening it gently.
example:
  language: js
  code: |
    const cases = [
      [],             // empty
      [7],            // one item
      [2, 2, 2],      // all the same
      [-5, 0, 5],     // negatives and zero
      Array(1e5).fill(1), // the largest size allowed
    ];
usage: Your solution passes the example but throws on an empty array; that's the edge case the hidden tests check.
related: [off-by-one-error, brute-force, stress-testing, base-case]
level: 1
lessons: [algo.approach, interview.reading-the-task, interview.communication]
