term: dirty read
aka: [read uncommitted]
short: Seeing another transaction's changes before it has committed them, so they might still be undone.
explain: |
  One transaction lowers a price, then fails and rolls back. In the moment between, a
  second transaction reads the lower price and shows it to a customer. That price never
  really existed.

  It's the weakest anomaly in the SQL standard, allowed only at read uncommitted. Postgres
  never allows it: ask for read uncommitted and you get read committed. So when a Postgres
  app shows wrong numbers under load, look for a lost update or write skew instead.
analogy: Reading a friend's text while they're still typing it, before they delete half and send something else.
usage: It can't be a dirty read; Postgres doesn't allow them, so look for a lost update in the checkout code.
twin:
  term: lost-update
  difference: A dirty read sees changes that weren't committed yet. A lost update happens with committed changes, when one write quietly overwrites another.
related: [isolation-level, transaction]
level: 3
lessons: [db.isolation-levels]
