term: RLHF
aka: [reinforcement learning from human feedback]
short: Training a model towards answers people preferred, through a scorer that learnt those preferences.
explain: |
  People compare pairs of answers and say which is better. A second model, the reward
  model, learns to predict those choices. Then the main model is trained by trial and
  error to write answers the reward model scores highly.

  It's how a raw text predictor becomes a helpful assistant. The classic recipe used an
  algorithm called PPO. Newer reasoning models lean on rewards a program can check, such as
  a maths result or tests that pass, because people are slow and inconsistent judges.
analogy: A comedian trying jokes in small clubs and keeping the ones that got laughs.
usage: Some of that over-polite tone is RLHF; raters liked apologies, so the model learnt to apologise.
related: [reward-model, reward-hacking, fine-tuning]
level: 3
lessons: [ai.reasoning-and-training]
