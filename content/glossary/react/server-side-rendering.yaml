term: server-side rendering
aka: [ SSR, dynamic rendering, server rendering, rendering on the server ]
short: Building a page's HTML on the server for each request, using that visitor's data.
explain: |
  A page that waits for JavaScript to build itself shows a blank screen first. If the server
  builds the HTML, the visitor sees content as soon as it arrives.

  Here the server runs your components for every visit. So the page can read cookies, search
  parameters and fresh data. The price is work on every request and a wait for the slowest
  data. Next.js switches a page to it on its own as soon as it reads something from the
  request.
analogy: A café that makes each sandwich when you order, with your fillings. Fresh and personal, but you wait.
example:
  language: tsx
  code: |
    // reads the request, so it renders per visit
    import { cookies } from 'next/headers';

    export default async function Cart() {
      const id = (await cookies()).get('cart')?.value;
      return <CartList items={await getCart(id)} />;
    }
usage: The search page has to use server-side rendering, because the results depend on the query.
twin:
  term: static-generation
  difference: Server-side rendering builds the page on every request. Static generation builds it once, ahead of time, and serves the same copy to everyone.
related: [ static-generation, client-side-rendering, hydration, streaming, server-component ]
level: 2
lessons: [ next.what-nextjs-adds, next.rendering-spectrum ]
