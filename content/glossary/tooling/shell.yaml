term: shell
aka: [bash, zsh, command line]
short: The program in a text window that reads each line you type and starts the programs it names.
explain: |
  The terminal is only the window. The program inside it reads your line, splits it into
  words, and starts the program the first word names, with the rest as its arguments.

  Before the program sees anything, the shell rewrites the line. A space splits an
  argument, `*` becomes a list of file names, `~` becomes your home folder, and `$NAME` is
  replaced by a variable. Quotes decide which of those happen. Most surprises at the prompt
  are this rewriting, not the program.
analogy: A receptionist who takes your request, tidies it up, and passes it to the right department.
example:
  language: bash
  code: |
    echo *.txt          # the shell expands this to file names
    echo '*.txt'        # single quotes: printed as typed
    echo "Home is $HOME" # double quotes: variables still expand
usage: The shell split `my notes.txt` into two arguments, so quote the path.
related: [working-directory, environment-variable, exit-code, process, pipe]
level: 1
lessons: [tooling.terminal]
