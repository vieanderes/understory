deepDive: >-
  Every output here was checked by running it. `(1.005).toFixed(2)` is `'1.00'`, not `'1.01'`, because
  1.005 can't be stored exactly and sits a hair below. `Math.round(-4.5)` is `-4`: it rounds
  halves towards positive infinity. `Math.max()` with no arguments is `-Infinity`.


  `parseInt('1e3')` is `1`, since it stops at the first non-digit, while `Number('1e3')` is
  `1000`. `Number.isInteger(4)` is `true` and `Number.isInteger('4')` is `false`, because the
  second value is a string.


  `Object.entries(menu)` gives `[key, value]` pairs, handy with a `for...of` loop.
  `Array.from(set)` turns a Set back into an array, so `Array.from(new Set(list))` drops
  repeats. A Map keeps its keys in the order you added them, and its keys can be any value,
  not only strings.


  `JSON.stringify` skips functions and `undefined`, and turns a `Date` into text that
  `JSON.parse` won't turn back. Patterns such as "digits only" are written as regular
  expressions: `/^\d+$/.test('42')` is `true`. The MDN guide to regular expressions is the
  map when you need one.
