term: closure
aka:
  - lexical closure
short: A function that still reaches the variables from the place it was made, after that place has finished.
explain: |
  When you make a function inside another function, the inner one keeps a live link to the
  outer one's variables. That link survives after the outer function returns.

  That's why a counter made by `makeCounter()` remembers its count between calls. It's also
  why a handler in a loop can see the wrong value: every handler shares the same variable,
  not a copy of it.
analogy: A backpack. The function packs the variables it can see when it's made, and carries them wherever it goes.
example:
  language: js
  code: |
    function makeCounter() {
      let count = 0;
      return () => ++count;
    }
    const next = makeCounter();
    next(); // 1
    next(); // 2
usage: That handler holds a closure over the old state, so it never sees the update.
twin:
  term: scope
  difference: Scope is the set of names you can see from a line of code, decided by where you write it. A closure is a function that keeps its scope alive after it would have ended.
related:
  - scope
  - callback
  - decorator
