term: CAP theorem
aka: [CAP, Brewer's theorem]
short: The rule that during a network split, copied data must choose between correct answers and answering at all.
explain: |
  Picture two data centres holding copies of the same data, and the link between them
  breaks. A request arrives at one side. It can answer with what it has, which may be out
  of date, or refuse until the link is back. It can't do both.

  That's all it says: when a **partition** happens, pick consistency or availability. It
  says nothing about normal days. **PACELC** adds that part: without a partition, you
  still trade latency against consistency. And "consistent" here means every read sees
  the latest write, not the C in ACID.
analogy: Two shop branches whose shared stock system goes offline. Each can keep selling and risk selling the last item twice, or stop selling until the line is back.
usage: Under the CAP theorem we pick availability for the feed and consistency for payments.
related: [eventual-consistency, replication]
level: 3
lessons: [sysdesign.replication]
