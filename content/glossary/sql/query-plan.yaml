term: query plan
aka: [execution plan, EXPLAIN plan]
short: The step-by-step route the database chooses to run a SQL statement, which you can print and read.
explain: |
  SQL says what you want, not how to get it. The database decides how: which index to use,
  which table to read first, how to join them. That decision is a plan.

  `EXPLAIN` shows the plan with estimated costs. `EXPLAIN ANALYZE` runs the query and adds
  real times and row counts. Read it from the innermost step outwards. The two classic
  warnings are a **Seq Scan** on a big table and an estimate that is far from the real row
  count, which usually means stale statistics.
analogy: A satnav route preview. You said "get me to the station"; the preview shows which roads it picked and how long each leg takes.
example:
  language: sql
  code: |
    EXPLAIN ANALYZE
    SELECT * FROM orders WHERE customer_id = 42;
    -- Index Scan using orders_customer_id_idx on orders
    --   (actual time=0.03..0.05 rows=7 loops=1)
usage: Paste the query plan into the ticket; I want to see whether it's using the new index.
related: [index, covering-index, n-plus-one-query]
level: 2
lessons: [db.reading-explain]
