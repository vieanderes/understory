term: ramp-up plan
aka: [ramp-up]
short: How you'll close one named gap in a new role, using what carries over, by a set date.
explain: |
  Every new job has things you don't know yet. Interviewers ask about it to test
  self-awareness, not to catch you out.

  A good answer names one real gap, says what from your past work carries over, and gives
  a concrete step with a time: ship a small change in the first two weeks. "I learn fast"
  is a claim; a plan is evidence.
analogy: Moving to a new city with a map of the first week, not only a promise to find your way.
usage: My ramp-up plan for your stack is to fix a small bug in the first fortnight.
related: [ninety-day-plan, behavioural-interview]
level: 2
lessons: [career.how-you-work]
