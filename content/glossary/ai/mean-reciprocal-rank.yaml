term: mean reciprocal rank
aka:
  - MRR
  - reciprocal rank
short: The average of one over the position of the first relevant result, across a set of queries.
explain: |
  It matters where the right result lands. First place is read; tenth place is often
  skipped, by people and by models alike.

  For each query, find the first relevant result. Score 1 if it's first, 1/2 if second,
  1/3 if third, and 0 if it never shows up. Average those scores over all your queries.

  It only looks at the first hit. When an answer needs several chunks, pair it with
  recall at k.
analogy: A race where only the first runner from your team counts. Winning scores full marks, third place a third.
usage: Mean reciprocal rank rose from 0.4 to 0.7 once we added the reranker.
related:
  - recall-at-k
  - reranking
  - golden-set
