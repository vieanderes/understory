    title: npm-ci
    authors: npm
    venue: npm Docs, CLI v11
    url: https://docs.npmjs.com/cli/v11/commands/npm-ci
    note: Installing exactly from the lockfile, and the `ignore-scripts` option.
    primary: true
    verified: true
  - kind: docs
    title: NPM Security Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/NPM_Security_Cheat_Sheet.html
    note: Install scripts as an attack path, `--ignore-scripts`, and lockfile discipline.
    primary: true
