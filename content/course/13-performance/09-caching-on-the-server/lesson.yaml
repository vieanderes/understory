deepDive: >-
  A `Map` lives inside one server process. Run three servers and each has its own copy, so a
  delete on one leaves the others stale. A shared store such as Redis, covered in the
  databases chapter, gives every server the same cache and the same delete.


  A cache that only grows is a memory leak. Cap its size: a `Map` keeps insertion order,
  so deleting its first key drops the oldest entry.


  When a popular entry expires, many requests can miss at once and all run the slow work
  together. That's a **cache stampede**. Storing the promise of the first load, and handing
  it to everyone who asks meanwhile, runs the work once.


  A cached model answer is only worth it when questions really repeat. Exact-match keys
  miss "where is my order" against "where's my order". Some teams match on meaning with
  embeddings, which the AI engineering chapter covers.
