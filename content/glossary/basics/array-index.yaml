term: array index
aka: [zero-based indexing, list position]
short: The number giving an item's position in a list, counting from 0.
explain: |
  You ask a list for an item by its position: `tasks[0]` is the first, `tasks[1]` the
  second. Counting starts at 0, because the number means "how many steps from the start".

  So the last item sits at `length - 1`, not at `length`. Ask for a position that doesn't
  exist and you get `undefined`, with no error. That quiet `undefined` is where many bugs
  start.
analogy: Floors in a British lift. The ground floor is 0, so the first floor is one step up from the start.
example:
  language: js
  code: |
    const colours = ["red", "green", "blue"];
    colours[0];                  // "red"
    colours[colours.length - 1]; // "blue"
    colours[3];                  // undefined
usage: That array index is one too high, because the last item sits at length minus one.
related: [array, off-by-one-error, loop]
level: 1
lessons: [basics.arrays]
