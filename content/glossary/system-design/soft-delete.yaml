term: soft delete
aka: [ tombstone, deleted_at, logical delete ]
short: Marking a record as removed, with a flag or a timestamp, instead of erasing its row.
explain: |
  Erased data is gone: no undo, no audit, and other systems syncing from you never learn it
  was deleted. Keep the row and mark it instead.

  A `deleted_at` column, or a tombstone record, says "this existed and was removed". A sync
  can pass the deletion on, and a mistake can be undone. The cost: every query must remember
  to filter marked rows out. And personal data may still need erasing for real.
analogy: Crossing a name out in an address book instead of tearing the page out.
example:
  language: sql
  code: |
    UPDATE contacts SET deleted_at = now() WHERE id = $1;

    SELECT * FROM contacts WHERE deleted_at IS NULL;
usage: Use a soft delete here, so the next sync can tell the vendor the contact is gone.
related: [ full-sync, delta-sync, data-reconciliation ]
level: 2
lessons: [ integrations.deletions ]
