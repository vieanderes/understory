term: signed URL
aka: [presigned URL, pre-signed URL, signed link]
short: A link with a time limit and a signature, letting whoever holds it read or upload one file.
explain: |
  A large video shouldn't pass through your server on its way to storage. But the browser
  can't hold your storage credentials either. So your server signs a link instead.

  The link names one key, one action, such as upload or download, and an expiry. The
  storage service checks the signature, so changing any part of the link breaks it. Keep
  the expiry short, minutes rather than days. Anyone who has the link can use it until then,
  so treat it like a password.
analogy: A guest pass to one room, valid until six o'clock, signed by the manager.
example:
  language: http
  code: |
    PUT /uploads/7f3a.mp4?expires=1767225600&signature=9c1e44d0 HTTP/1.1
    Host: storage.example.com
    Content-Type: video/mp4
usage: Hand the browser a signed URL so the video goes straight to storage and never through our server.
related: [object-storage, hashing, secret, access-token]
level: 2
lessons: [backend.files]
