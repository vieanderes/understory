id: python.projects-and-uv
title: Projects, packages and uv
objective: Split code into modules, start a project with uv, add dependencies, run code in its virtual environment, and lint with ruff.
level: essential
minutes: 10
concepts: [python.modules-and-imports, python.virtual-environments, python.uv, python.ruff]
prerequisites: [python.classes]
opening:
  text: >-
    You'll split code across files and set up a project the way teams do today, with uv and
    ruff. Clone any AI repository and these are the first two tools you'll meet.

steps:
  - type: prose
    id: modules
    body: |-
      Every `.py` file is a **module**. `import` loads one, and runs the whole file, top to
      bottom, once:

      ```python
      import json               # from the standard library
      from greet import hello   # your own greet.py, next to this file
      ```

      A folder of modules with an `__init__.py` file is a **package**. The word also means
      a library someone published for you to install. Context tells you which.

  - type: predict-output
    id: predict-import-runs-file
    concept: python.modules-and-imports
    difficulty: 3
    language: python
    code: |
      # greet.py
      def hello(name):
          return f"Hi {name}"

      print(hello("test"))

      # main.py
      from greet import hello

      print(hello("Ana"))
    question: '`greet.py` ends with a test line. What does `python3 main.py` show?'
    choices:
      - text: '`Hi test`, then `Hi Ana`'
        correct: true
        feedback: >-
          Right. The import ran all of `greet.py`, test line included.
      - text: '`Hi Ana` only'
        feedback: >-
          The import runs every line of `greet.py`, so its `print` fires too.
      - text: '`Hi Ana`, then `Hi test`'
        feedback: >-
          The import comes first in `main.py`, so `greet.py` prints before `main.py` does.

  - type: prose
    id: main-guard
    body: |-
      So code meant only for running the file directly goes under a guard:

      ```python
      if __name__ == "__main__":
          main()
      ```

      `__name__` holds `"__main__"` only in the file you ran. In a file that was imported,
      it holds the module's own name, so the block is skipped.

  - type: code-challenge
    id: write-main-guard
    concept: python.modules-and-imports
    difficulty: 3
    language: python
    starter: starter.py
    solution: solution.py
    tests: tests.py
    prompt: >-
      This file is `report.py`. The tests import it, and its last line prints on every
      import. Make `main()` run only when the file is run directly. Keep `total` and `main`
      as they are.


      Example: `python3 report.py` shows `Total: 12`, and an import shows nothing.
    hints:
      - 'The guard step checks `__name__` before calling anything.'
      - 'An import runs every line at the top level of the file, calls included.'
      - 'Put `main()` in a block under `if __name__ == "__main__":`.'

  - type: prose
    id: uv-projects
    body: |-
      Each project keeps its libraries in a **virtual environment**: a `.venv` folder with
      its own Python and packages, so two projects never clash. **uv** manages it:

      ```bash
      $ uv init weather
      $ cd weather
      $ uv add httpx
      Creating virtual environment at: .venv
      Installed 7 packages in 6ms
      $ uv run main.py
      Hello from weather!
      ```

      `httpx` makes web requests. `uv add` records it in `pyproject.toml`, the project's
      settings file, and pins exact versions in `uv.lock`.

  - type: multiple-choice
    id: pick-venv
    concept: python.virtual-environments
    difficulty: 2
    question: Two projects on one laptop need different versions of the same package. What keeps them apart?
    choices:
      - text: Each project's own virtual environment
        correct: true
        feedback: >-
          Yes. Each `.venv` holds its own Python and its own packages.
      - text: Installing both versions globally
        feedback: >-
          A global install holds one version per package. The second replaces the first.
      - text: Renaming one copy of the package
        feedback: >-
          Code imports a package by its name, so a renamed copy breaks every import.

  - type: ai-review
    id: review-uv-install
    concept: python.uv
    difficulty: 3
    language: bash
    request: Write CI steps that install this uv project's dependencies and run it.
    flawClass: hallucinated-api
    code: |
      uv install httpx pydantic
      uv run main.py
    prompt: >-
      An assistant wrote these steps. They looked right in review. The first CI run failed at
      once. Tap the line at fault.
    lines: [1]
    reasons:
      - text: '`uv install` is not a uv command'
        correct: true
        feedback: >-
          Right. uv says `unrecognized subcommand 'install'`. `uv sync` installs from the lock.
      - text: '`uv run` needs `python` before the file'
        feedback: >-
          `uv run main.py` works as written. The failure comes one line earlier.
      - text: The packages need version numbers
        feedback: >-
          The lock file already pins versions. The command itself doesn't exist.
    fix: |
      uv sync --locked
      uv run main.py

  - type: prose
    id: ruff
    body: |-
      A **linter** reads code and flags likely bugs. **ruff** lints and formats Python in
      one fast tool. `uvx` runs a tool without adding it to the project:

      ```bash
      $ uvx ruff check cart.py
      F401 [*] `json` imported but unused
       --> cart.py:1:8
      Found 1 error.
      [*] 1 fixable with the `--fix` option.
      ```

      Each finding has a code, like `F401`, and a place. `ruff format` rewrites spacing and
      quotes to one standard style.

  - type: bug-hunt
    id: hunt-ruff-literal
    concept: python.ruff
    difficulty: 2
    language: python
    code: |
      def label(status):
          if status is "done":
              return "Finished"
          return "In progress"
    prompt: '`uvx ruff check` flags one line with `F632 Use == to compare constant literals`. Tap it.'
    lines: [2]
    reasons:
      - text: '`is` compares objects, not the text'
        correct: true
        feedback: >-
          Right. `status == "done"` compares the text. It's the `is` trap from lesson 4.
      - text: '`return` needs brackets around its value'
        feedback: >-
          `return` takes a plain value. The flagged line is the comparison.
      - text: Text must use single quotes
        feedback: >-
          Python accepts both. The flagged part is `is`, which compares objects.
    fix: |
      def label(status):
          if status == "done":
              return "Finished"
          return "In progress"

  - type: explain-back
    id: explain-lock-file
    concept: python.uv
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      A reviewer asks you to drop `uv.lock` from your pull request: "`pyproject.toml` already
      says `httpx>=0.28.1`." Defend keeping it, and name what it costs.
    rubric:
      - The `>=` range allows any newer version, and says nothing about dependencies of dependencies.
      - '`uv.lock` pins every exact version, so laptops and CI install the same set.'
      - The cost is a long generated file that changes on upgrades, and its diffs need a glance.
    modelAnswer: >-
      The range allows any newer httpx, and says nothing about the packages httpx needs. Two
      machines could install different versions from the same file. `uv.lock` pins every
      one, so my laptop and CI run the same code. A new release can't break the build
      overnight. The cost is a long generated file that changes when we upgrade. I'd keep it
      and skim its diff in review.

recap:
  - Split code into modules, import them, and guard script code with `__name__`.
  - Start a project with `uv init`, add packages with `uv add`, run with `uv run`.
  - Lint with `ruff check` and format with `ruff format`.
recall:
  - id: card-main-guard
    concept: python.modules-and-imports
    front: Why put script code under `if __name__ == "__main__":`?
    back: >-
      Importing a file runs all of it. The guard makes that code run only when the file is run
      directly.
  - id: card-venv
    concept: python.virtual-environments
    front: What is a virtual environment?
    back: >-
      A folder with its own Python and installed packages, so each project's dependencies stay
      apart.
  - id: card-uv-add
    concept: python.uv
    front: What does `uv add httpx` change in a project?
    back: >-
      It adds httpx to `pyproject.toml`, pins exact versions in `uv.lock`, and installs it into
      `.venv`.
  - id: card-ruff
    concept: python.ruff
    front: Which two jobs does ruff do?
    back: >-
      It lints with `ruff check` and formats with `ruff format`.

