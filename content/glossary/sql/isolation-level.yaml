term: isolation level
aka: [transaction isolation, read committed, repeatable read, serializable]
short: A setting for how much one running transaction can see of others running at the same time.
explain: |
  Full separation would make every transaction behave as if it ran alone, one after
  another. That's safe but slow. So databases offer levels that allow some odd results in
  exchange for speed.

  From weakest to strongest: read uncommitted, read committed, repeatable read and
  serializable. Postgres defaults to read committed, where each statement sees a fresh
  snapshot, so a read-then-write in app code can lose an update. Serializable stops every
  anomaly, but it can cancel any transaction with error `40001`, so the whole transaction
  must sit in a retry loop.
analogy: How thick the walls are between hotel rooms. Thin walls are cheap and you hear the neighbours; soundproofing costs more.
example:
  language: sql
  code: |
    BEGIN ISOLATION LEVEL SERIALIZABLE;
    SELECT count(*) FROM bookings WHERE room_id = 7 AND day = '2026-05-01';
    INSERT INTO bookings (room_id, day) VALUES (7, '2026-05-01');
    COMMIT; -- may fail with 40001: retry the whole thing
usage: Raising the isolation level to serializable fixes the double booking, but only if we retry on 40001.
