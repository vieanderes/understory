term: utility type
aka: [utility types, Partial, Pick, Omit, Record]
short: A built-in generic that builds a new type from an existing one, such as every field made optional.
explain: |
  You have a `User` type and need "a user with every field optional" for an update form.
  Writing it again by hand means two types to keep in step. `Partial<User>` derives it.

  `Pick` keeps chosen fields, `Omit` drops them, `Record` builds an object type from keys,
  `ReturnType` reads a function's result. Derive types like this, so one change flows
  everywhere.
analogy: A photocopier with settings. Same original, a copy reduced or with a page left out.
example:
  language: ts
  code: |
    type User = { id: string; name: string; email: string };
    type UserUpdate = Partial<Omit<User, 'id'>>;
usage: Use a utility type for the preview props; `Pick<Product, 'name' | 'price'>` stays in step.
related: [generics, type-alias, interface]
level: 2
lessons: [pro.typescript]
