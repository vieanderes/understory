summary: >-
  Programs spend much of their time working things out: a basket total, a score, a message
  with someone's name in it. This lesson gives you the tools. An **operator** is a symbol
  that does something with values, like `+` or `*`. An **expression** is any piece of code
  that works out to a value, such as `price * quantity + delivery`. You write the
  expression, and the computer does the sums.


  Two ideas carry most of the weight. First, operators run in a fixed order: `*`, `/` and
  `%` before `+` and `-`, left to right within each group, and brackets first of all. A
  wrong order gives a wrong answer with no error, so it's a real source of bugs. Second, `+`
  has two jobs. Between numbers it adds. As soon as a string is involved, it joins text
  instead.


  Because joining with `+` catches people out, JavaScript has a second way to build text:
  the **template literal**. You wrap the text in backticks and put any expression inside
  `${ }`. The computer works each one out and drops the result into the text. For any
  message that mixes words and values, it's the tool to reach for.
remember:
  - An expression is code that works out to a value, and you write it so the computer can do the sums.
  - '`*`, `/` and `%` run before `+` and `-`, operators of the same group run left to right, and brackets go first.'
  - '`%` gives the remainder after dividing, so `10 % 3` is `1` and any even number `% 2` is `0`.'
  - Between two numbers `+` adds, but if either side is a string, `+` joins them as text.
  - '`+` works left to right, so `"Total: " + 2 + 3` joins to `Total: 23` before any adding happens.'
  - A template literal uses backticks and `${ }`, and whatever is inside `${ }` is worked out before it goes into the text.
  - Decimals aren't always exact, so `0.1 + 0.2` shows `0.30000000000000004`, which is why money is often counted in pence.
sections:
  - title: The order operators run in
    body: |-
      JavaScript follows the order you learned at school, with one addition for `%`. The rule
      has three parts:

      - Brackets first, innermost first.
      - Then `*`, `/` and `%`, from left to right.
      - Then `+` and `-`, from left to right.

      The left-to-right part matters more than people expect. It decides the answer whenever
      two operators from the same group sit side by side.

      ```js
      console.log(10 - 4 - 3);
      console.log(12 / 2 * 3);
      console.log(2 + 3 * 4);
      console.log((2 + 3) * 4);
      // 3
      // 18
      // 14
      // 20
      ```

      `10 - 4 - 3` is `(10 - 4) - 3`, which is 3, not `10 - (4 - 3)`. `12 / 2 * 3` divides
      first because `/` comes first, then multiplies.

      In real code, the order you mean should be visible to the reader, not only correct. A
      reader shouldn't need to recall the rules to know what `a + b / c` does. Add brackets
      whenever they make your intent plain, even if the rules would give the same answer.
      They cost nothing when the program runs.

      Breaking a long expression into named steps helps even more:

      ```js
      const price = 4;
      const quantity = 3;
      const delivery = 2;
      const itemsCost = price * quantity;
      const total = itemsCost + delivery;
      console.log(total);
      // 14
      ```

      Each line does one thing, and each name tells you what that thing is. When the total
      comes out wrong, you can show `itemsCost` on its own and see which step broke.
  - title: 'The remainder operator, `%`, and what it''s for'
    body: |-
      `%` divides and keeps only what's left over. `17 % 5` is 2, because 5 goes into 17
      three times with 2 left. It looks like a maths curiosity, but real code uses it all the
      time for three jobs.

      **Even or odd.** A number is even when dividing by 2 leaves nothing, so `n % 2` is 0
      for even numbers and 1 for odd ones. That's how a table colours every other row, or a
      game decides whose turn it is.

      **Wrapping around.** A clock goes from 23 back to 0. The remainder does that for you.

      ```js
      const hour = 22;
      const hoursLater = 5;
      console.log((hour + hoursLater) % 24);
      // 3
      ```

      22 plus 5 is 27, and the remainder after dividing by 24 is 3: three in the morning. The
      same trick cycles through slides in a slideshow, returning to the first after the last.

      **Splitting a quantity into units.** How many whole hours and leftover minutes are in
      135 minutes?

      ```js
      const minutes = 135;
      const leftover = minutes % 60;
      const hours = (minutes - leftover) / 60;
      console.log(`${hours} h ${leftover} min`);
      // 2 h 15 min
      ```

      `%` finds the leftover minutes. Taking them away leaves a number that divides evenly by
      60, so the division gives whole hours. Later you'll meet a shorter way to drop the
      decimal part, but this version uses only what you know.

      One edge case: with a negative number on the left, the remainder is negative too.
      `-7 % 3` is `-1`, not `2`. It rarely matters for beginners, but it catches people who
      wrap backwards around a clock.
  - title: How `+` decides between adding and joining
    body: |-
      `+` looks at both sides. If both are numbers, it adds. If either side is a string, it
      turns the other side into text and joins them. Combined with left-to-right order, that
      gives results that surprise almost everyone the first time.

      ```js
      console.log(1 + 2 + "3");
      console.log("1" + 2 + 3);
      console.log("Total: " + (2 + 3));
      // 33
      // 123
      // Total: 5
      ```

      In the first line, `1 + 2` runs first, both numbers, so it gives 3. Then `3 + "3"` has a
      string on one side, so it joins: `33`. In the second line, `"1" + 2` joins to `"12"`,
      and then `"12" + 3` joins again. In the third, the brackets force the adding to happen
      while both sides are still numbers.

      The other operators never join text. `-`, `*`, `/` and `%` try to turn strings into
      numbers instead. So `"5" - 1` is `4`, but `"5" + 1` is `51`. This inconsistency is a
      well-known JavaScript quirk.

      Why does this matter in practice? Values that come from outside a program, such as
      whatever someone types into a form, arrive as strings, even when they contain digits.
      Add two of them with `+` and you get joined text. A basket that shows a total of `155`
      for items costing 15 and 5 is this bug. The fix is to turn the text into numbers first,
      which a later lesson shows.
  - title: Template literals in more depth
    body: |-
      A template literal is a string written between backticks, the key usually found next to
      the 1 on a keyboard. Inside it, `${ }` marks a slot. Whatever expression you put in the
      slot is worked out, and the result goes into the text.

      ```js
      const item = "notebook";
      const price = 3;
      const quantity = 4;
      console.log(`${quantity} x ${item}: ${price * quantity} pounds`);
      // 4 x notebook: 12 pounds
      ```

      Each slot is worked out on its own, before joining. That's why the `"Total: " + 2 + 3`
      problem disappears: `${2 + 3}` adds inside its slot, where no text is involved.

      Template literals also keep line breaks. Press Enter inside the backticks and the text
      breaks there too.

      ```js
      const name = "Sam";
      console.log(`Order for ${name}
      Status: packed`);
      // Order for Sam
      // Status: packed
      ```

      Ordinary quotes can't do that. A string in double quotes must end on the line it starts
      on.

      Outside a slot, every character is kept as written, including spaces. `${first}${last}`
      gives `AdaLovelace` for the same reason `first + last` does: nothing adds a space you
      didn't write.

      Reach for a template literal whenever a message mixes text and values. The shape of the
      message stays readable, with the words where they'll appear. Use plain quotes for fixed
      text with no values in it. Many teams follow exactly that rule.
  - title: Numbers that aren't quite what you expect
    body: |-
      JavaScript uses one number type for whole numbers and decimals alike. Three behaviours
      are worth knowing before they surprise you.

      ```js
      console.log(7 / 2);
      console.log(0.1 + 0.2);
      console.log(1 / 0);
      console.log("abc" * 2);
      // 3.5
      // 0.30000000000000004
      // Infinity
      // NaN
      ```

      Division never rounds: `7 / 2` is `3.5`, not 3.

      Decimals are stored in **binary**, the ones and zeros a computer works in. Most
      decimals, like 0.1, can't be written exactly in binary, in the same way one third
      can't be written exactly as a decimal. The tiny errors show up as trailing digits. For
      money this matters, so shops and payment systems usually store whole pence, or cents,
      and only turn them into pounds when they show a price.

      Dividing by zero doesn't stop the program. It gives `Infinity`, a special number bigger
      than any other. And maths on text that isn't a number gives `NaN`, short for "not a
      number", a special value that says a calculation failed. Neither produces an error, so
      a wrong result can travel quietly through a program. When a total shows `NaN`, look for
      the first calculation that had text or a missing value in it.
pitfalls:
  - '**Forgetting that `*` and `/` go first.** `price + delivery * quantity` multiplies the delivery, not the price. It reads left to right in English, but not in maths. Add brackets or split the expression into named steps.'
  - '**Joining numbers after text with `+`.** `"Total: " + a + b` joins each number in turn and shows `Total: 155`. Put the sum in brackets, or use a template literal: `${a + b}`.'
  - '**Leaving out the spaces.** `first + last` gives `AdaLovelace`, because the computer adds nothing you didn''t write. Put the space in: `first + " " + last`, or `${first} ${last}`.'
  - '**Using ordinary quotes for a template literal.** `"Total: ${total}"` shows `${total}` as written, because only backticks make slots. Check for backticks when a `${ }` appears in the output.'
  - '**Expecting decimals to be exact.** `0.1 + 0.2` is not `0.3`, so checks for exact totals fail. For money, count in whole pence and convert when you show the price.'
interview:
  - question: What do `"5" + 1` and `"5" - 1` give in JavaScript, and why are they different?
    answer: >-
      `"5" + 1` gives the string `"51"`, and `"5" - 1` gives the number `4`. The difference
      comes from `+` having two jobs. If either side is a string, `+` turns the other side
      into text and joins them. The other arithmetic operators, `-`, `*`, `/` and `%`, only
      work on numbers, so they turn the string into a number first. Turning a value from one
      type into another automatically is called type coercion. It matters in practice
      because input from forms arrives as strings: adding two form fields with `+` joins
      them. I avoid relying on coercion. I convert values to numbers explicitly before doing
      maths, and I use template literals for building text, so the intent is always clear.
  - question: Why does `0.1 + 0.2` not equal `0.3`, and how would you handle money?
    answer: >-
      Because JavaScript stores numbers in binary, and 0.1 and 0.2 can't be written exactly
      in binary, so the sum comes out as `0.30000000000000004`. It's like writing one third
      as 0.333: you have to stop somewhere, and the small error shows up later. This isn't a
      JavaScript bug. Most programming languages store decimals the same way. For money, the
      usual approach is to count in the smallest unit, whole pence or cents, so every
      calculation uses whole numbers, which are exact at everyday sizes. You convert to
      pounds only when showing the amount. The trade-off is discipline: every part of the
      program has to agree that prices are in pence, and a price mixed up with pounds is off
      by a factor of 100.
  - question: What's a template literal, and why would you use one instead of `+`?
    answer: >-
      A template literal is a string in backticks that can hold expressions inside `${ }`,
      which are worked out and placed into the text. So `${quantity} items cost ${price *
      quantity} pounds` builds the whole message in one piece. I prefer it over `+` for three
      reasons. It reads like the finished message, so spaces and punctuation are quick to
      check. Each `${ }` is worked out on its own, which avoids the left-to-right trap where
      `"Total: " + 2 + 3` becomes `Total: 23`. And it can span several lines. For fixed text
      with no values in it, plain quotes are fine and slightly clearer about intent, since a
      reader sees at once that nothing is inserted.
