term: GIL
aka:
  - global interpreter lock
short: A lock inside standard Python that lets only one thread run Python code at a time.
explain: |
  You split a heavy calculation over eight threads and it gets no faster. Sometimes
  slower. Nothing is wrong with your code.

  The standard interpreter keeps one lock that a thread must hold to run Python
  bytecode. Threads still help when they spend time waiting on the network or disk,
  because waiting releases the lock. For number crunching in pure Python, use processes,
  or a library like NumPy that does the work outside the lock. Newer builds can run
  without it, but most code still assumes it's there.
analogy: A one-person kitchen with eight cooks. They can all prep while the oven bakes, but only one can stand at the hob.
example:
  language: python
  code: |
    from concurrent.futures import ProcessPoolExecutor

    # threads would queue on the lock; processes each get their own
    with ProcessPoolExecutor() as pool:
        totals = list(pool.map(score, chunks))
usage: Threads won't speed up that parser because of the GIL; use a process pool.
