deepDive: >-
  The runs used PostgreSQL 17.11 in Docker: a primary, and a streaming replica made with
  `pg_basebackup -R`, with `recovery_min_apply_delay = '5s'` added to make lag visible.
  After `pg_promote()` on the replica, both servers accepted a different order 3.


  `now() - pg_last_xact_replay_timestamp()` is a rough measure. When the primary is idle it
  keeps growing, since no new change arrives to replay. Ours read 7.2 seconds with nothing
  to catch up on. On the primary, `pg_stat_replication` shows each standby's `replay_lag`,
  which is better for alerts.


  Leaderless stores take another route, **quorums**. Keep N copies, write to W of them and
  read from R. If W plus R is more than N, every read overlaps the latest write. Quorums have
  their own edge cases: sloppy quorums, clock-based
  last-write-wins that silently drops writes, and concurrent writes that need version
  vectors. The Dynamo paper covers them.
