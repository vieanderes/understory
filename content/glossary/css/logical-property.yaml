term: logical property
aka: [logical properties, CSS logical properties, margin-inline, padding-block]
short: A CSS property named by the flow of text, start and end, instead of left and right.
explain: |
  `margin-left` is always the left. In a right-to-left language like Arabic, the space
  should be on the right. `margin-inline-start` means "where a line of text begins", so it
  flips by itself.

  Inline is the direction text runs; block is the direction lines stack. Use these
  throughout, and the layout works in every writing direction without extra rules.
analogy: Telling a visitor to keep to the kerb side, which works in any country, instead of saying keep left.
example:
  language: css
  code: |
    .card {
      padding-inline: 1rem;
      margin-block-end: 2rem;
      border-inline-start: 4px solid var(--accent);
    }
usage: Swap `padding-left` for a logical property so the menu mirrors correctly in Hebrew.
related: [internationalisation, box-model, custom-property]
level: 2
lessons: [pro.css-and-html]
