id: css.build-a-page
title: Build a page
objective: Build a responsive event page from a plain one, with a header, a card grid and a theme.
level: essential
minutes: 10
concepts: [css.page-layout, css.flexbox, css.grid]
prerequisites: [css.transitions]
opening:
  text: >-
    You'll take a plain page for a garden open day and build it into something you'd be happy
    to share. Every step uses a tool from this chapter, and you'll see each one land.

steps:
  - type: prose
    id: the-plan
    body: >-
      A real page mixes the tools you've met. Plan from big to small, and pick a tool for each
      part. Grid holds the list of cards. Flex lines up the header. Custom properties keep the
      colours, and media queries serve wider screens. That plan is the **page layout**.


      Build it mobile first. The plain rules make a good phone page, and the queries add to
      it.

  - type: playground
    id: lay-out-the-header
    concept: css.flexbox
    difficulty: 2
    prompt: >-
      The colours already live in custom properties. Make `.site-header` a flex row, push the
      logo and the button to opposite ends, and centre them top to bottom.
    html: |
      <header class="site-header">
        <a class="logo" href="#">Open Day</a>
        <a class="button" href="#">Get directions</a>
      </header>
      <section class="hero">
        <h1>Community garden open day</h1>
        <p>Saturday 14 June, 10am to 4pm. Free entry.</p>
      </section>
    css: |
      :root { --leaf: darkgreen; --cream: ivory; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
      .site-header { padding: 12px 16px; background: var(--leaf); }
      .site-header a { color: white; text-decoration: none; }
      .logo { font-size: 20px; font-weight: bold; }
      .button { padding: 8px 12px; border: 2px solid white; border-radius: 8px; }
      .hero { padding: 32px 16px; }
    editable: [css]
    checks:
      - label: The header is a flex row
        selector: .site-header
        style: { property: display, value: flex }
      - label: Logo and button sit at opposite ends
        selector: .site-header
        style: { property: justify-content, value: space-between }
      - label: They're centred top to bottom
        selector: .site-header
        style: { property: align-items, value: center }
    solution:
      css: |
        :root { --leaf: darkgreen; --cream: ivory; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
        .site-header {
          display: flex; justify-content: space-between; align-items: center;
          padding: 12px 16px; background: var(--leaf);
        }
        .site-header a { color: white; text-decoration: none; }
        .logo { font-size: 20px; font-weight: bold; }
        .button { padding: 8px 12px; border: 2px solid white; border-radius: 8px; }
        .hero { padding: 32px 16px; }
    hints:
      - All three declarations go in `.site-header`.
      - Opposite ends is `space-between`. Across the row is `align-items`.
      - 'Add `display: flex; justify-content: space-between; align-items: center;`.'

  - type: playground
    id: grid-the-events
    concept: css.grid
    difficulty: 2
    prompt: >-
      Now the events. Make `.events` a grid with `repeat(auto-fit, minmax(200px, 1fr))`
      columns and a `16px` gap. One column on a phone, more when there's room.
    html: |
      <section class="events">
        <article class="event"><h2>Seed swap</h2><p>10am, by the greenhouse</p></article>
        <article class="event"><h2>Pond dipping</h2><p>11am, at the wildlife pond</p></article>
        <article class="event"><h2>Compost clinic</h2><p>1pm, in the tool shed</p></article>
        <article class="event"><h2>Apple pressing</h2><p>3pm, in the orchard</p></article>
      </section>
    css: |
      :root { --leaf: darkgreen; --cream: ivory; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
      .events { padding: 16px; }
      .event { padding: 16px; background: white; }
      .event h2 { margin: 0 0 4px; font-size: 20px; color: var(--leaf); }
      .event p { margin: 0; }
    editable: [css]
    checks:
      - label: The events form a grid
        selector: .events
        style: { property: display, value: grid }
      - label: The cards have a 16px gap
        selector: .events
        style: { property: gap, value: 16px }
    solution:
      css: |
        :root { --leaf: darkgreen; --cream: ivory; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
        .events {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 16px;
          padding: 16px;
        }
        .event { padding: 16px; background: white; }
        .event h2 { margin: 0 0 4px; font-size: 20px; color: var(--leaf); }
        .event p { margin: 0; }
    hints:
      - The three declarations go on the container, `.events`.
      - '`display: grid` first, then the columns and the gap.'
      - 'The columns are `grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));`.'

  - type: playground
    id: finish-the-cards
    concept: css.page-layout
    difficulty: 2
    prompt: >-
      Give each `.event` a stripe down its left edge: `border-left: 6px solid var(--leaf);`.
      Then round the corners with `border-radius: 8px;` and step back to admire it.
    html: |
      <section class="events">
        <article class="event"><h2>Seed swap</h2><p>10am, by the greenhouse</p></article>
        <article class="event"><h2>Pond dipping</h2><p>11am, at the wildlife pond</p></article>
        <article class="event"><h2>Compost clinic</h2><p>1pm, in the tool shed</p></article>
      </section>
    css: |
      :root { --leaf: darkgreen; --cream: ivory; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
      .events {
        display: grid; gap: 16px; padding: 16px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .event { padding: 16px; background: white; }
      .event h2 { margin: 0 0 4px; font-size: 20px; color: var(--leaf); }
      .event p { margin: 0; }
    editable: [css]
    checks:
      - label: The cards have a 6px stripe on the left
        selector: .event
        style: { property: border-left-width, value: 6px }
      - label: The stripe is solid
        selector: .event
        style: { property: border-left-style, value: solid }
    solution:
      css: |
        :root { --leaf: darkgreen; --cream: ivory; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
        .events {
          display: grid; gap: 16px; padding: 16px;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
        .event {
          padding: 16px; background: white; border-radius: 8px;
          border-left-width: 6px; border-left-style: solid;
          border-left-color: var(--leaf);
        }
        .event h2 { margin: 0 0 4px; font-size: 20px; color: var(--leaf); }
        .event p { margin: 0; }
    hints:
      - Both declarations go in the `.event` rule.
      - The stripe reads its colour from `--leaf`, like the headings.
      - 'Start with `border-left: 6px solid var(--leaf);`.'

  - type: multiple-choice
    id: pick-the-tool
    concept: css.page-layout
    difficulty: 2
    question: The event cards must line up in neat columns on a laptop. Which tool fits best?
    choices:
      - text: Grid
        correct: true
        feedback: >-
          Yes. Grid places cards in rows and columns at once, so they line up.
      - text: A flex row that wraps
        feedback: >-
          Each wrapped flex line shares its own space, so the columns don't line up.
      - text: '`position: absolute` on each card'
        feedback: >-
          That lifts the cards out of the flow. You'd place every one by hand, for every screen.

  - type: prose
    id: wider-screens
    body: |-
      The phone page is done. Now let wider screens have a bigger hero, with a media query
      that only adds:

      ```css
      @media (min-width: 700px) {
        .hero h1 { font-size: 3rem; }
      }
      ```

      Below 700px nothing changes. That's the payoff of mobile first: a phone never applies a
      layout it then has to undo.

  - type: playground
    id: grow-the-hero
    prompt: >-
      Add the media query from the last step. Is the preview narrower than 700px? Then change
      the number to `300px` to watch the heading grow, and set it back.
    html: |
      <section class="hero">
        <h1>Community garden open day</h1>
        <p>Saturday 14 June, 10am to 4pm. Free entry.</p>
      </section>
    css: |
      :root { --leaf: darkgreen; --cream: ivory; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--cream); }
      .hero { padding: 32px 16px; color: var(--leaf); }
      .hero h1 { margin: 0 0 8px; font-size: 2rem; }
    editable: [css]

  - type: bug-hunt
    id: hunt-sideways-scroll
    concept: css.page-layout
    difficulty: 3
    language: css
    code: |
      .hero {
        padding: 32px 16px;
      }
      .hero .photo {
        width: 100%;
        padding: 8px;
        border: 2px solid darkgreen;
      }
    prompt: >-
      On a phone, the whole page now scrolls sideways a little. It started when the photo went
      in. Tap the line at fault.
    lines: [5]
    reasons:
      - text: Padding and border are added to the 100% width
        correct: true
        feedback: >-
          Right. It's 20px too wide. `box-sizing: border-box` makes it fit.
      - text: The hero's padding pushes the photo out
        feedback: >-
          The hero's padding narrows the space, and 100% follows it. The photo's own extras don't.
      - text: A photo can't be given a `width`
        feedback: >-
          Images take a width happily. The trouble is what gets added on top of it.
    fix: |
      .hero {
        padding: 32px 16px;
      }
      .hero .photo {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        border: 2px solid darkgreen;
      }

  - type: explain-back
    id: explain-mobile-first
    concept: css.page-layout
    difficulty: 3
    prompt: >-
      Why build a page mobile first, with media queries only for wider screens, rather than
      the other way round?
    rubric:
      - The plain rules give a working phone layout, the most constrained screen.
      - Media queries then only add, such as more columns or bigger text.
      - A phone never applies rules it would have to undo, so there's less to go wrong.
    modelAnswer: >-
      The plain rules make the phone page, the narrowest and hardest case. Wider screens then
      only gain things through `min-width` queries: more columns, a bigger heading. Built the
      other way, every phone would get the desktop layout and then undo it with overrides.
      That's more code, and more places for a bug.

recap:
  - Plan a page from big to small, and pick grid or flex for each part.
  - Build a themed header and a card grid that fits any screen.
  - Grow the layout for wider screens with mobile-first media queries.

recall:
  - id: card-grid-or-flex
    concept: css.page-layout
    front: When do you reach for grid, and when for flex?
    back: >-
      Grid when items must line up in rows and columns. Flex for a single row or column, such
      as the items in a header.
  - id: card-header-row
    concept: css.flexbox
    front: Which three declarations put a logo and a button at opposite ends of a header?
    back: >-
      `display: flex`, `justify-content: space-between` and `align-items: center`.
  - id: card-card-grid-recipe
    concept: css.grid
    front: Which line makes a card grid pick its own number of columns?
    back: >-
      `grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));`
  - id: card-sideways-scroll
    concept: css.page-layout
    front: A page scrolls sideways on a phone. What's a likely cause?
    back: >-
      A box with `width: 100%` plus padding or a border, without `box-sizing: border-box`.

references:
  - kind: docs
    title: CSS layout
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout
    note: Every layout method in one place, with when to use each.
    primary: true
    verified: true
  - kind: docs
    title: Layout
    venue: web.dev, Learn CSS
    url: https://web.dev/learn/css/layout
    note: How flow, flex, grid and positioning fit together on one page.
    verified: true
  - kind: docs
    title: Responsive web design basics
    venue: web.dev
    url: https://web.dev/articles/responsive-web-design-basics
    note: The viewport tag, flexible content and choosing breakpoints.
    verified: true

deepDive: >-
  Many teams start every style sheet with a short reset: `box-sizing: border-box` on every
  element, `margin: 0` on the body, and `max-width: 100%` on images. It removes the three
  surprises this chapter kept meeting.


  Choose breakpoints where the content breaks, not at the widths of popular phones. Widen the
  window slowly and add a query where the layout starts to look wrong.


  Browser developer tools can show the grid and flex lines of any element, and let you
  switch the viewport to a phone size. They're the quickest way to see why a layout does
  what it does.
