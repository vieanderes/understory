term: magic number
aka:
  - magic value
  - magic string
short: A bare value in code, like 86400 or 0.2, with no name to say what it means.
explain: |
  `if (attempts > 3)` and `setTimeout(sync, 86400000)` make the reader guess. Three what?
  Why three? Is 86400000 a day?

  Give it a name: `MAX_LOGIN_ATTEMPTS`, `ONE_DAY_MS`. Now it explains itself. When the rule
  changes, you change one line instead of hunting for every 3 that might be the same 3.
analogy: A recipe that says "add 7". Seven what? Grams, spoons, minutes?
example:
  language: js
  code: |
    // Before
    if (password.length < 12) return false;

    // After
    const MIN_PASSWORD_LENGTH = 12;
    if (password.length < MIN_PASSWORD_LENGTH) return false;
usage: What's 0.2 here? Name the magic number, VAT_RATE or whatever it really is.
related:
  - code-smell
  - dry
level: 1
lessons:
