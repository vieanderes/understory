summary: >-
  A computer has three working parts. The **CPU** carries out instructions, one tiny step at a
  time. **Memory** (RAM) holds the instructions and data the CPU is working on right now, and
  it's wiped when the power goes or the process ends. **Storage** (an SSD or a disk) keeps
  files for good, but it's far slower to reach.


  Running a program joins them up. The operating system reads the program from storage, gives
  it a fresh region of memory and starts a **process**. The CPU then fetches instructions from
  memory, decodes them and executes them, billions of times a second. Your JavaScript isn't
  those instructions: Node's engine, V8, compiles it into them as it runs.


  The gaps in speed between the layers explain a lot of everyday engineering. They're why CPUs
  have caches. They're why a loop over an array can beat a loop over scattered objects. And
  they're why anything that must survive a deploy, or be shared by two servers, goes to
  storage, usually a database.
remember:
  - The CPU can only work on instructions and data that are in memory, so a program is loaded from storage before it runs.
  - A CPU core repeats one cycle for ever, fetch the instruction at the program counter, decode it, execute it, and move on.
  - Registers, caches, main memory and storage form a hierarchy in which each level down is bigger, slower and cheaper per byte.
  - Caches work because of locality, programs reuse data they touched recently and read addresses next to ones they just read.
  - A process is one running copy of a program with its own private memory, and another process can't read that memory directly.
  - Memory is wiped when a process ends, so state that must survive a restart or be shared between processes belongs in storage.
  - V8 turns JavaScript into bytecode and interprets it, then compiles the functions that run often into machine code.
sections:
  - title: The fetch-decode-execute cycle
    body: |-
      A CPU understands a small set of **instructions**: load a value from memory, add two
      numbers, compare them, store a result, jump to another instruction. Each one is a few
      bytes of machine code. The CPU keeps a handful of tiny, very fast slots called **registers**.
      A special one, the **program counter**, holds the address of the next instruction.

      The whole machine runs one loop. **Fetch** the instruction at the program counter.
      **Decode** it to see what it asks for. **Execute** it. Then move the counter on. Here's
      that loop as a toy CPU in JavaScript, running a four-instruction program that adds two
      numbers:

      ```js
      // A toy CPU: a program counter, two registers and a memory of numbered cells.
      const memory = [
        ['LOAD', 'A', 10],   // 0: A = memory[10]
        ['LOAD', 'B', 11],   // 1: B = memory[11]
        ['ADD', 'A', 'B'],   // 2: A = A + B
        ['STORE', 'A', 12],  // 3: memory[12] = A
        ['HALT'],            // 4: stop
        0, 0, 0, 0, 0,       // 5 to 9: unused
        40, 2, 0,            // 10 to 12: data
      ];

      const registers = { A: 0, B: 0 };
      let pc = 0; // program counter: the address of the next instruction
      let cycles = 0;

      while (true) {
        const instruction = memory[pc];   // fetch
        const [op, x, y] = instruction;   // decode
        pc = pc + 1;
        cycles = cycles + 1;
        if (op === 'HALT') break;         // execute
        if (op === 'LOAD') registers[x] = memory[y];
        if (op === 'ADD') registers[x] = registers[x] + registers[y];
        if (op === 'STORE') memory[y] = registers[x];
      }

      console.log(memory[12], cycles); // 42 5
      ```

      Notice that code and data sit in the same memory. That's the stored-program idea every
      general-purpose computer uses. An `if` or a loop in your code becomes a **jump**: an
      instruction that sets the program counter to somewhere other than the next address.

      Real CPUs are cleverer. They overlap the stages of several instructions (pipelining),
      run independent instructions out of order, and guess which way a branch will go. The
      result always looks as if the instructions ran one by one, in order, so the simple
      model stays the right one to reason with.
  - title: From JavaScript to machine code
    body: |-
      The CPU never sees your JavaScript. Node embeds **V8**, the engine also used in Chrome,
      and V8 does the translation while your program runs.

      First V8 parses the source and compiles each function to **bytecode**, a compact
      instruction set for V8's own interpreter, called Ignition. You can print it:

      ```js
      function add(a, b) {
        return a + b;
      }
      console.log(add(40, 2)); // 42
      ```

      ```bash
      node --print-bytecode --print-bytecode-filter=add add.js
      ```

      Among the output, with addresses that change on every run, are three instructions:

      ```text
      Ldar a1
      Add a0, [0]
      Return
      ```

      Load the second argument into a register called the accumulator, add the first
      argument to it, return. It's the same fetch-decode-execute idea, one level up.

      Interpreting bytecode is slower than running machine code. So V8 watches which
      functions run often, and compiles those "hot" functions to machine code with faster
      compilers, the top one being TurboFan. The optimising compilers make assumptions, for
      example that `a` and `b` are always small integers. If a later call breaks the
      assumption, V8 throws the machine code away and falls back to bytecode. This is called
      **deoptimisation**, and it's one reason code that keeps its types consistent tends to
      run faster.

      A compiled language such as C, Go or Rust does this translation once, ahead of time,
      and ships machine code. JavaScript and Python ship source, and the runtime translates
      on the user's machine.
  - title: The memory hierarchy and caches
    body: |-
      A CPU can execute an instruction far faster than main memory can deliver a value. If
      every load waited for RAM, the CPU would spend most of its time idle. The fix is a
      **hierarchy** of memories, each level smaller and faster than the one below:

      - **Registers**, inside the core, a few dozen values.
      - **Caches**, on the CPU chip, usually in levels called L1, L2 and L3. L1 is the
        smallest and quickest, and L3 is often shared between cores.
      - **Main memory**, gigabytes, much slower than the caches.
      - **Storage**, an SSD or a disk, slower again by orders of magnitude, but it keeps data
        without power.

      Exact sizes and latencies vary a lot between chips, so treat any table of numbers as a
      rough guide. What holds everywhere is the shape: each step down costs many times more
      to reach.

      A cache doesn't fetch single bytes. When the CPU misses, it loads a whole **cache
      line**, a small fixed block of neighbouring bytes, often 64 bytes and larger on some
      chips. Two habits of real programs make that pay off, and together they're called
      **locality**:

      - **Temporal locality**: data used now is likely to be used again soon, like a loop
        counter or a total.
      - **Spatial locality**: data next to what you used is likely to be used next, like the
        next element of an array.

      A **cache hit** is served from the fast level. A **miss** has to go further down and
      costs much more. CPUs also have a prefetcher that spots a steady walk through memory
      and loads the next lines before you ask. The practical lesson: reading memory in order,
      from one contiguous block, is the fastest thing you can do with it.
  - title: Locality you can measure from JavaScript
    body: |-
      A `Float64Array` stores its numbers in one contiguous block, like a C array. Here's a
      4,000 by 4,000 grid stored row after row. Both functions add the same 16 million
      numbers. Only the order of the reads differs.

      ```js
      const n = 4000;
      const grid = new Float64Array(n * n).fill(1); // one block, row after row

      function sumByRows() {
        let sum = 0;
        for (let row = 0; row < n; row++) {
          for (let col = 0; col < n; col++) sum += grid[row * n + col]; // next door each time
        }
        return sum;
      }

      function sumByColumns() {
        let sum = 0;
        for (let col = 0; col < n; col++) {
          for (let row = 0; row < n; row++) sum += grid[row * n + col]; // jumps n cells each time
        }
        return sum;
      }

      for (const fn of [sumByRows, sumByColumns]) {
        const start = performance.now();
        const sum = fn();
        const ms = performance.now() - start;
        console.log(fn.name, sum, ms.toFixed(0) + ' ms');
      }
      ```

      Both print a sum of `16000000`. On one laptop running Node 24, rows took about 30 ms
      and columns about 110 ms. Your figures will differ with the machine and what else is
      running, so run it a few times.

      The row walk reads each cache line once and uses all of it. The column walk jumps
      32,000 bytes between reads, so almost every read lands on a different line. By the time
      it comes back to a line, the line has often been evicted.

      Big-O calls both O(n²). Locality is a constant factor that Big-O ignores on purpose, and
      it's often the biggest constant factor in real code. It's also why arrays usually beat
      linked lists in practice, as the lesson on arrays, lists and hash maps shows.
  - title: Processes, virtual memory and the operating system
    body: |-
      Every process gets its own **virtual address space**. Addresses your program uses are
      translated by the CPU and the operating system into physical memory pages. Two
      processes can both use address 1,000 and mean different physical memory. That's how the
      system keeps one process from reading or corrupting another, and why a crash in one
      doesn't take the others down.

      You can watch the isolation from Node. This runs the same tiny program twice, as two
      child processes:

      ```js
      import { execFileSync } from 'node:child_process';

      // One tiny program that counts a visit in memory and prints its process ID and count.
      const program = 'globalThis.visits = (globalThis.visits ?? 0) + 1; console.log(process.pid, visits);';
      const run = () => execFileSync(process.execPath, ['-e', program], { encoding: 'utf8' }).trim().split(' ');

      const [pidA, visitsA] = run();
      const [pidB, visitsB] = run();
      console.log(pidA === pidB, visitsA, visitsB); // false 1 1
      ```

      Two process IDs, and each count starts from nothing. Save it as an `.mjs` file to run
      it, since it uses `import`.

      A **thread** is a separate line of execution inside one process. Threads share that
      process's memory, which makes them cheap to talk between and quick to get wrong. Node
      runs your JavaScript on one main thread. For CPU-heavy work it offers `worker_threads`,
      and for more capacity you run several processes, which share nothing.

      The operating system also decides which process runs on which core, switching between
      them many times a second. A machine with 8 cores can have hundreds of processes that
      all look as if they're running at once.
pitfalls:
  - '**Keeping state that must last in a variable.** A module-level array of sessions or carts works in development, where the server rarely restarts. Every deploy or crash wipes it. Put it in a database, or a shared store built for it.'
  - '**Assuming every server sees the same memory.** A rate limiter or cache held in a `Map` counts per process. With four copies behind a load balancer, a user gets four times the limit. Keep shared counters in a shared store.'
  - '**Treating `writeFileSync` as a guarantee against power loss.** The operating system usually holds written data in memory and writes it to the device a little later. A crash of the process is fine, but a power cut can lose it. Databases call `fsync` for this; in Node it''s `fs.fsyncSync(fd)`.'
  - '**Quoting latency numbers as facts.** Figures like "100 ns for RAM" are rough orders of magnitude that vary by chip and generation. Reason about the ratios, and measure on the hardware you run.'
  - '**Ignoring access patterns because Big-O says it''s fine.** Two O(n) loops can differ several times over because one reads memory in order and the other jumps around. When a hot loop is slow, check how it walks memory before rewriting the algorithm.'
verify:
  - lens: breaks
    check: 'Nothing that must survive a deploy or a crash lives only in a variable, so sessions, carts and counts go to a database or shared store.'
  - lens: scales
    check: 'Counters, caches and rate limits held in process memory are checked against running several copies behind a load balancer.'
  - lens: confuses
    check: 'A file read once at start-up is named and commented as a snapshot, so nobody expects it to see later writes.'
  - lens: tests
    check: 'State is tested across a restart and across two running copies, not only within one process.'
interview:
  - question: What happens, roughly, when you type `node app.js` and press Enter?
    answer: >-
      The shell asks the operating system to start a new process running the Node binary. The
      OS creates a private virtual address space, maps Node's executable into it from
      storage, and starts a thread at its entry point. Node sets up V8, reads `app.js` from
      disk, and V8 parses it and compiles it to bytecode. The interpreter runs that bytecode,
      and hot functions later get compiled to machine code. All along, the CPU is doing
      fetch, decode, execute on instructions sitting in memory, with caches in between. When
      the event loop has nothing left to do, the process exits and the OS reclaims its
      memory. The trade-off worth naming is that JavaScript is translated on the fly, which
      costs start-up time and warm-up that an ahead-of-time compiled program doesn't pay.
  - question: What is a CPU cache, and why should an application developer care?
    answer: >-
      A cache is a small, fast memory on the CPU chip that keeps recently used data, because
      main memory is far slower than the CPU. It loads data in cache lines, blocks of
      neighbouring bytes, so it pays off when code has locality: it reuses recent data and
      reads memory in order. That matters to application code because two algorithms with
      the same Big-O can differ several times in speed depending on access pattern. Walking
      a contiguous array is cache friendly, while chasing pointers through scattered objects,
      like a linked list, misses often. In JavaScript you control this less than in C, but
      typed arrays and plain arrays of numbers are laid out contiguously. The caveat is that
      it's a constant factor: fix a quadratic algorithm first, and think about cache effects
      when profiling points at a hot loop.
  - question: What's the difference between a process and a thread?
    answer: >-
      A process is a running program with its own private memory; a thread is a line of
      execution inside a process, sharing that memory with the process's other threads.
      Because processes are isolated, one crashing doesn't corrupt another, and they talk
      through pipes, sockets or a shared database. Threads can share data directly, which is
      fast but needs locks or other care to avoid race conditions. Node runs your JavaScript
      on a single main thread with an event loop. It uses a thread pool internally for some
      I/O, and offers `worker_threads` for CPU-heavy work. To use every core for a web
      server, you usually run several processes instead. The trade-off: threads are cheaper
      to create and share state, processes are safer and scale across machines the same way
      they scale across cores.
  - question: Our app stores logged-in users in memory. It works on one server. What breaks when we run three?
    answer: >-
      Each server is a separate process with its own memory, so each has its own list and
      they disagree. A user logs in on server A, the load balancer sends the next request to
      B, and B has never heard of them. Deploys make it worse, because restarting a process
      wipes its memory and logs everyone out. The fix is to move the state out of process
      memory into something all servers share: a database table, a store such as Redis, or a
      signed token the client sends with each request so the server doesn't need to remember
      anything. Sticky sessions, where the balancer pins a user to one server, hide the bug.
      They don't survive a restart or a server failing, so I'd treat them as a stopgap.
