term: screen reader
aka: [screenreader]
short: Software that speaks a page aloud or sends it to a braille display, steered by keyboard or gestures.
explain: |
  Blind and partially sighted people use software that reads out what's on the screen.
  VoiceOver comes with Apple devices, TalkBack with Android, and NVDA is free on Windows.
  They read from the accessibility tree, not from the pixels.

  People rarely listen to a page top to bottom. They jump by heading, by landmark, by link
  or by form field. So headings, names and roles are the whole interface for them. Try one
  for ten minutes, and you'll write markup differently.
analogy: Having a page read to you over the phone by someone who only reads out what's labelled.
usage: Turn on the screen reader and tab through the form, because the error is never announced.
related: [assistive-technology, accessibility-tree, accessible-name, landmark, aria]
level: 1
lessons: [design.accessibility-foundations]
