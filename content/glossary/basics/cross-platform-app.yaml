term: cross-platform app
aka:
  - cross-platform
  - multiplatform app
short: An app built from one shared codebase that runs on several systems, such as iOS and Android.
explain: |
  Building the same app twice is expensive. Frameworks let one team write most of it once
  and ship it to both phones, and sometimes the desktop too.

  They differ underneath. Some drive the system's own views from JavaScript. Some draw every pixel with their own engine.
  Some share only the business rules, and some wrap a website in a web view.

  The catch is the edges. A device feature the framework doesn't cover means writing native code anyway. And a new native
  module still needs a full store release.
analogy: One recipe adapted for two kitchens. Most of it carries over, but someone still learns each oven.
usage: A cross-platform app lets the web team ship both phones, as long as nothing needs deep native APIs.
twin:
  term: native-app
  difference: A cross-platform app shares one codebase across systems. A native app is written separately for each one in its own language, with full access to the device.
