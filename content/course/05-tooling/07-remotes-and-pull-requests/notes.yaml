summary: >-
  A remote is another copy of your repository that your team can reach, usually on GitHub.
  Git never talks to it in the background. Your laptop keeps a record of where each remote
  branch was the last time you spoke to it, and three commands update that record: `git
  fetch`, `git pull` and `git push`. Most confusion about remotes comes from forgetting that
  this record can be out of date.


  Moving commits is lopsided on purpose. Fetching is always safe: it only downloads.
  Pushing is guarded: the remote accepts your branch only if it adds to what's there, so
  nobody's work disappears by accident. Force pushing removes that guard, which is why teams
  keep it for their own branches and use `--force-with-lease` when they do.


  A pull request sits on top of all this. It's a request, made on the hosting site, to merge
  one branch into another after people and machines have looked at it. It's where a team
  reviews code, runs its checks and records why a change was made. Use one for nearly every
  change to a shared branch. Push straight to `main` only in a repository you work on alone.
remember:
  - '`origin/main` is a remote-tracking branch: your laptop''s record of where the remote''s `main` was when you last fetched, pulled or pushed.'
  - '`git fetch` downloads commits and moves remote-tracking branches, and never changes your own branches or files.'
  - '`git pull` is `git fetch` followed by a merge or a rebase of the upstream branch into the branch you''re on.'
  - A push is accepted only when it fast-forwards the remote branch, so the remote's tip must already be in your history.
  - '`git push --force-with-lease` overwrites only if the remote branch is still where your remote-tracking branch says it is.'
  - Never force-push a branch other people build on, such as `main`; rewrite only your own branches.
  - A secret that was ever pushed is public, so revoke and replace it first, and clean the history second.
  - A good pull request is small, does one thing, says why, and is green in CI before anyone reviews it.
sections:
  - title: Remote-tracking branches, and what `git status` really compares
    body: |-
      After a clone you have two kinds of branch. `main` is yours: it moves when you commit.
      `origin/main` is a **remote-tracking branch**: a read-only bookmark for where the
      remote's `main` was. You can't commit on it. Only talking to the remote moves it.

      ```bash
      $ git branch -a
      * main
        remotes/origin/HEAD -> origin/main
        remotes/origin/main
      ```

      The link between the two lives in `.git/config`, set by the clone. `git config
      --get-regexp branch.main` shows `branch.main.remote origin` and `branch.main.merge
      refs/heads/main`. That pair is the branch's **upstream**, and it's what a plain `git
      pull` or `git push` uses.

      Now the part that surprises people. A teammate pushes a commit. You run `git status`
      and it says nothing about it:

      ```bash
      $ git status -sb
      ## main...origin/main
      $ git fetch
      From github.com:example/recipes
         6039094..534a5c5  main       -> origin/main
      $ git status -sb
      ## main...origin/main [behind 1]
      ```

      `git status` compares two things on your laptop: `main` and `origin/main`. It never
      contacts the remote. "Up to date" means up to date with your last fetch. If you want the
      truth, fetch first.

      Once fetched, you can inspect before you integrate. Two dots read as "in the right, not
      in the left":

      ```bash
      $ git log --oneline main..origin/main   # commits you'd receive
      534a5c5 Add pancakes
      $ git log --oneline origin/main..main   # commits you'd send
      ```

      After you commit locally as well, `git status -sb` shows `[ahead 1, behind 1]`. That's a
      diverged branch, and it's exactly the situation in which a plain push gets rejected.
  - title: Fetch, pull, and the three ways to integrate
    body: |-
      `git pull` does two jobs. First it fetches. Then it combines the upstream branch with
      yours. When only one side has new commits, there's nothing to decide: Git fast-forwards
      your branch. When both sides moved, Git 2.53 refuses to guess:

      ```text
      hint: You have divergent branches and need to specify how to reconcile them.
      hint: You can do so by running one of the following commands sometime before
      hint: your next pull:
      hint:
      hint:   git config pull.rebase false  # merge
      hint:   git config pull.rebase true   # rebase
      hint:   git config pull.ff only       # fast-forward only
      fatal: Need to specify how to reconcile divergent branches.
      ```

      The three choices produce different histories.

      - **Merge** (`pull.rebase false`) makes a merge commit with two parents. Nothing is
        rewritten, so it's always safe, but a busy branch fills with "Merge branch 'main'"
        commits.
      - **Rebase** (`pull.rebase true`) replays your local commits on top of the fetched ones.
        History stays in one line. Your unpushed commits get new hashes, which is fine,
        because nobody else has them yet.
      - **Fast-forward only** (`pull.ff only`) refuses whenever you've diverged. It suits
        branches you never commit on directly, such as a local `main` you only update.

      Each has a one-off flag too: `git pull --rebase`, `git pull --no-rebase` and `git pull
      --ff-only`.

      Many developers prefer to run the two halves by hand. `git fetch`, then read `git log
      main..origin/main`, then `git merge` or `git rebase origin/main`. It's more typing, but
      you see what arrives before it touches your branch. And `git fetch` is the one Git
      command that can never cost you work, so run it as often as you like.
  - title: Force pushing without losing a teammate's work
    body: |-
      Sometimes you do mean to replace a remote branch: you rebased your feature branch, or
      amended its last commit. A normal push is rejected, because your new commits don't
      contain the old tip:

      ```text
       ! [rejected]        feature -> feature (non-fast-forward)
      hint: Updates were rejected because the tip of your current branch is behind
      hint: its remote counterpart.
      ```

      `git push --force` overwrites whatever is there, including a commit a colleague pushed
      a minute ago. `--force-with-lease` adds a condition: overwrite only if the remote branch
      still points at the commit your `origin/feature` records. If someone pushed since your
      last fetch, the lease is stale and the push fails:

      ```text
       ! [rejected]        feature -> feature (stale info)
      ```

      There's a trap. The lease is your remote-tracking branch, and **a fetch renews it**. If
      you fetch, and your editor may fetch in the background for you, `origin/feature` now
      includes the colleague's commit. `--force-with-lease` then succeeds and deletes their
      work, even though you never looked at it. That's exactly what happened in this real run:
      after a `git fetch`, the lease push printed `+ cfe4477...8903a6c feature -> feature
      (forced update)` and the other commit was gone.

      Two defences. Add `--force-if-includes`, which also checks that the remote tip is in
      your branch's reflog, meaning you had it locally at some point:

      ```text
      $ git push --force-with-lease --force-if-includes
       ! [rejected]        feature -> feature (remote ref updated since checkout)
      ```

      Or name the commit you expect to replace, which no fetch can change:

      ```bash
      git push --force-with-lease=feature:8903a6c
      ```

      And the rule that makes all of this rare: rewrite only branches that are yours alone.
      Protected branches on GitHub refuse force pushes by default.
  - title: Upstreams, pruning, and the life of a branch
    body: |-
      A new branch has no upstream, so a plain `git push` stops and tells you what to do:

      ```text
      $ git push
      fatal: The current branch topic has no upstream branch.
      To push the current branch and set the remote as upstream, use

          git push --set-upstream origin topic
      ```

      `-u` is the short form of `--set-upstream`. If you'd rather never type it, `git config
      --global push.autoSetupRemote true` makes the first plain push create the branch and set
      its upstream.

      `git branch -vv` is the dashboard for all of this. It shows each branch, its upstream,
      and how far apart they are:

      ```text
        feature 06edd07 [origin/feature: ahead 1, behind 2] Feature 1 v3
      * main    05f9b92 [origin/main: ahead 1] Add times
      ```

      Branches end when their pull request is merged. The hosting site usually deletes the
      remote branch, but your laptop still has its `origin/feature` bookmark until you
      prune:

      ```text
      $ git fetch --prune
       - [deleted]         (none)     -> origin/feature
      $ git branch -vv
        feature 06edd07 [origin/feature: gone] Feature 1 v3
      ```

      `gone` means the upstream no longer exists, so the local branch is safe to delete once
      you're sure its work was merged. `git config --global fetch.prune true` makes every
      fetch prune.

      The whole cycle for one change: `git switch main`, `git pull`, `git switch -c
      fix-soup-typo`, commit, `git push -u origin fix-soup-typo`, open the pull request,
      respond to review, merge on the site, then `git switch main`, `git pull` and `git
      branch -d fix-soup-typo`.
  - title: Pull requests that get reviewed well
    body: |-
      A pull request is a conversation about a diff. Its quality depends mostly on the
      author.

      As the author:

      - **Keep it small.** Reviewers read a short diff line by line and skim a long one. Split
        a refactor from the feature that needs it, and send them as two pull requests.
      - **Explain why.** The diff shows what changed. The description says why, what you
        considered and how you tested it. Link the issue.
      - **Review it yourself first.** Read your own diff on the site before asking anyone.
        You'll catch the stray debug line.
      - **Get CI green first.** Nobody should spend attention on code the machines already
        reject. Open a draft pull request if you want early feedback.

      As the reviewer:

      - Read the description, then the tests, then the code. Tests tell you what the author
        thinks the code does.
      - Look for behaviour, not taste: missing edge cases, error handling, security, names that
        mislead. Leave layout to the formatter.
      - Say how much each comment matters. "Blocking:" for must-fix, "Nit:" for optional.
      - Run it when the change is risky. `gh pr checkout 42` fetches pull request 42 into a
        local branch. Without `gh`, `git fetch origin pull/42/head:pr-42` does the same on
        GitHub.

      Merging has three common forms on GitHub. A merge commit keeps every commit and adds
      one on top. Squash merging turns the pull request into a single commit on `main`,
      which keeps history tidy but loses the individual steps. Rebase merging replays each
      commit without a merge commit. Teams pick one and switch the others off.
pitfalls:
  - '**Trusting `git status` without fetching.** "Your branch is up to date" compares against your last fetch, not the remote. Run `git fetch` first when it matters, for example before you start a branch or force-push.'
  - '**Answering a rejected push with `--force`.** It feels like the push is being stubborn, so people override it, and a teammate''s commit vanishes. Pull, resolve any conflict, and push again.'
  - '**Assuming `--force-with-lease` is always safe.** A fetch between your rebase and your push renews the lease, and the push overwrites work you never saw. Add `--force-if-includes`, or name the expected commit with `--force-with-lease=branch:hash`.'
  - '**Rebasing commits that are already shared.** Rebasing gives commits new hashes, so anyone who built on the old ones gets duplicates and conflicts. Rebase only commits that exist on your laptop or on a branch nobody else uses.'
  - '**Deleting a pushed secret in a new commit.** The old commit keeps the value, and every clone already has it. Revoke the key at its provider first, then follow your host''s guide for removing it from history.'
  - '**Opening one pull request for a week of work.** Big diffs get skimmed, so bugs pass review. Split by concern and open pull requests early, as drafts if needed.'
verify:
  - lens: breaks
    check: 'A rejected push is answered with `git pull` and a new push, never `--force` on a shared branch.'
  - lens: leaks
    check: 'A pushed secret is revoked at its provider straight away, because every clone already holds the commit that contains it.'
  - lens: confuses
    check: 'Each pull request covers one concern and says why the change is needed, so a reviewer can read all of it.'
  - lens: tests
    check: 'Checks run on every pull request, and nothing merges into `main` until they pass.'
interview:
  - question: What's the difference between `git fetch` and `git pull`?
    answer: >-
      `git fetch` only downloads, while `git pull` downloads and then changes your current
      branch. Fetch contacts the remote, brings down any commits you lack and moves your
      remote-tracking branches, such as `origin/main`. Your own branches and working files
      stay exactly as they were, so it's always safe. `git pull` runs a fetch and then
      integrates the upstream branch into the one you're on, by fast-forward, merge or
      rebase depending on `pull.rebase` and `pull.ff`. When I care about what's arriving, I
      fetch, read `git log main..origin/main`, and then merge or rebase deliberately. The
      trade-off is convenience: `git pull` is one command and fine for a branch I only
      update, while the two-step version gives me a look before anything changes.
  - question: Your push was rejected with "fetch first". What's going on, and how do you fix it?
    answer: >-
      The remote branch has commits I don't have, so my push isn't a fast-forward and would
      drop them. A push only moves the remote branch forward: the remote's current tip must
      be an ancestor of what I send. Someone pushed since my last fetch, so their commit
      isn't in my history. The fix is to integrate first: `git pull`, with a merge or a
      rebase, resolve any conflicts, run the tests, and push again. Now my history contains
      their commit plus mine, and the push only adds. What I don't do is `--force`, which
      makes the remote match my laptop and silently deletes their work. If the branch is
      protected, this can't happen on `main` anyway, which is one reason teams protect it.
  - question: When is it acceptable to force-push, and how do you do it safely?
    answer: >-
      Force-push only a branch nobody else builds on, typically my own feature branch after
      a rebase or an amend, and never a shared branch like `main`. Rewriting gives commits
      new hashes, so anyone holding the old ones ends up with duplicates. When I do force, I
      use `git push --force-with-lease`, which refuses if the remote moved since my last
      fetch. That lease has a gap: a fetch, including a background one from an editor,
      renews it without me looking at the new commits. So I add `--force-if-includes`, which
      also requires that the remote tip was once in my local branch. Or I pass the exact
      expected commit with `--force-with-lease=branch:hash`. On the
      platform side, branch protection blocks force pushes to `main` entirely.
  - question: What makes a good pull request, and what do you look for when you review one?
    answer: >-
      A good pull request is small, about one concern, and explains why, so a reviewer can
      read every line instead of skimming. As an author I split refactors from features and
      describe the reason and how I tested it. I review my own diff first, and get CI green
      before asking for anyone's time. As a reviewer I read the description and the tests
      before the code, because the tests show what the author believes the code does. Then
      I look for behaviour: edge cases, error handling, security, misleading names and
      missing tests. I leave formatting to the formatter and label comments as blocking or
      optional. The trade-off with small pull requests is overhead, more branches and more
      reviews, but review quality drops sharply with size, so it pays off.
  - question: A colleague pushed a commit containing a live API key. What do you do?
    answer: >-
      Revoke the key at the provider and issue a new one straight away, because once pushed
      it must be treated as public. Deleting the file in a new commit doesn't help: the old
      commit is still in history, and every clone and fork already has it. Bots scan public
      repositories for keys all the time, so speed matters more than the Git clean-up. After rotating, I check the provider's logs for misuse. The new
      key goes in the environment or a secrets store, and `.env` goes in `.gitignore`. Rewriting history to remove the value is a second step: it needs
      coordination, because everyone must re-clone or reset, and it doesn't undo copies
      made already.
