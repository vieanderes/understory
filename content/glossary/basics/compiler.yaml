term: compiler
aka: [compiled language, compilation, compile, ahead-of-time compilation]
short: A program that translates your whole source code into another form before any of it runs.
explain: |
  The processor only understands its own machine code. Something has to translate what you
  wrote. One way is to translate the whole program first, then run the result.

  That translator checks the entire program on the way. Many mistakes surface before
  anything runs, and the output can be optimised as a whole. C, Rust and Go work this way.

  TypeScript's `tsc` is one too, though it outputs JavaScript, not machine code. "Compile
  error" means the translation itself failed, so nothing ran at all.
analogy: Translating a whole book before anyone reads it. Slow up front, then every reader gets the finished version.
example:
  language: bash
  code: |
    $ gcc hello.c -o hello   # translate the whole program first
    $ ./hello                # then run the machine code
    Hello
usage: The compiler caught the missing field before the build even finished.
twin:
  term: interpreter
  difference: A compiler translates the whole program before it runs. An interpreter runs it as it reads, so a mistake on line 90 shows only when line 90 runs.
related: [interpreter, runtime, syntax-error, static-typing]
level: 2
lessons: [cs.what-a-computer-does]
