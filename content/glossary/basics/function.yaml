term: function
short: A named piece of work you write once and run whenever you need it, with different inputs.
explain: |
  Say you work out a price with tax in five places. Write the sum once, give it a name, and
  run it by that name. `function addTax(price) { ... }` does exactly that.

  Writing it only defines it. Nothing happens until you call it, with brackets:
  `addTax(10)`. Forgetting the call, or forgetting the brackets, is a classic first bug.
analogy: A recipe card. Writing the card cooks nothing, and you follow it each time you want the dish, with whatever ingredients you have.
example:
  language: js
  code: |
    function addTax(price) {
      return price * 1.2;
    }
    console.log(addTax(10)); // 12
    console.log(addTax(25)); // 30
usage: Pull those three copies of the sum into one function, so a fix happens in one place.
related: [parameter, argument, return-value, call-stack, decomposition, pure-function]
level: 1
lessons: [basics.functions]
