id: longest-nested-fragment
title: LongestNestedFragment
topic: strings
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: S, type: string }
  returns: int
statement: |-
  A code editor highlights brackets. A string of brackets is properly nested when:

  - it is empty;
  - it has the form "(U)", where U is properly nested;
  - it has the form "VW", where V and W are properly nested.

  For example, "(()())" and "()()" are properly nested, but "())(" and "(()" are not.

  A fragment of a string is a run of consecutive characters in it.

  Write a function:

  {{signature}}

  that, given a string S of N characters, returns the length of its longest fragment that is
  properly nested. The empty fragment counts, so the answer is never below 0.

  For example, given S = "())(()())(", the function should return 6, for the fragment
  "(()())".

  Given S = ")(", the function should return 0.

  Given S = "()(())", the function should return 6.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..200,000];
  - string S is made only of the characters "(" and ")".
examples:
  - { args: ["())(()())("], expected: 6 }
  - { args: [")("], expected: 0 }
  - { args: ["()(())"], expected: 6 }
tests:
  - name: extreme_empty
    description: empty string and single characters
    group: correctness
    cases:
      - { args: [""], expected: 0 }
      - { args: ["("], expected: 0 }
      - { args: [")"], expected: 0 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: ["(()"], expected: 2 }
      - { args: ["()(()"], expected: 2 }
      - { args: [")()())()()()("], expected: 6 }
  - name: only_opening
    description: brackets that never close
    group: correctness
    cases:
      - generate: { seed: 801, args: [{ kind: repeat, times: 50, unit: "((" }] }
  - name: small_random
    description: random, N = 60
    group: correctness
    cases:
      - generate: { seed: 802, args: [{ kind: string, n: 60, alphabet: "()" }] }
      - generate: { seed: 803, args: [{ kind: string, n: 61, alphabet: "(()" }] }
  - name: medium_random
    description: random, N = 5,000
    group: correctness
    cases:
      - generate: { seed: 804, args: [{ kind: string, n: 5000, alphabet: "()" }] }
  - name: large_random
    description: random, N = 200,000
    group: performance
    cases:
      - generate: { seed: 805, args: [{ kind: string, n: 200000, alphabet: "()" }] }
  - name: extreme_large
    description: long nested and never-closing runs, N = 200,000
    group: performance
    cases:
      - generate: { seed: 806, args: [{ kind: repeat, times: 100000, unit: "()" }] }
      - generate: { seed: 807, args: [{ kind: repeat, times: 66666, unit: "(()" }] }
