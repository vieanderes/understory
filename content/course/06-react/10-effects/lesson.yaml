id: react.effects
title: Effects
objective: Keep a component in step with something outside React, with the right dependencies and cleanup, and skip effects you don't need.
level: essential
minutes: 10
concepts: [react.effects, react.effect-dependencies, react.effect-cleanup, react.derived-values]
prerequisites: [react.forms-and-actions]
opening:
  text: >-
    You'll hook a component up to things outside React, like timers and key presses, and
    tidy up after it. You'll also spot the effects that loop forever, freeze a timer or
    shouldn't exist at all.

steps:
  - type: prose
    id: what-an-effect-is
    body: |-
      React draws the page from props and state. Some things live outside it: a timer, a chat
      connection, the tab's title. An **effect** keeps your component in step with one of
      them.

      ```tsx
      useEffect(() => {
        document.title = `${unread} unread`;
      });
      ```

      `document.title` is the text on the browser tab. `useEffect` is a hook. It stores your
      function, and React calls it after the page has been updated.

  - type: predict-output
    id: predict-render-then-effect
    concept: react.effects
    difficulty: 1
    language: tsx
    code: |
      function Clock() {
        console.log('render');
        useEffect(() => {
          console.log('effect');
        });
        return <p>Time</p>;
      }
    question: React shows `<Clock />` for the first time. In what order do the lines log?
    choices:
      - text: '`render`, then `effect`'
        correct: true
        feedback: >-
          Right. React renders, puts `<p>` on the page, and only then runs the effect.
      - text: '`effect`, then `render`'
        feedback: >-
          It's written first, but `useEffect` only stores the function. React calls it later.
      - text: Only `render`
        feedback: >-
          The effect does run, once the page is updated. It's delayed, not skipped.

  - type: prose
    id: dependency-array
    body: |-
      Most effects don't need to run after every render. The second argument, the
      **dependency array**, lists the values the effect reads:

      - no array: after every render
      - `[]`: once, after the first render
      - `[room]`: after the first render, then whenever `room` has changed

      React compares each value with the one from the last render. Nothing changed, no run.

  - type: predict-output
    id: predict-effect-loop
    concept: react.effect-dependencies
    difficulty: 2
    language: tsx
    code: |
      function Article() {
        const [views, setViews] = useState(0);
        useEffect(() => {
          setViews(views + 1);
        });
        return <p>{views} views</p>;
      }
    question: The article opens once. What happens to the number of views?
    choices:
      - text: It climbs and never stops
        correct: true
        feedback: >-
          Right. Each render runs the effect, which sets state, which renders again.
      - text: It shows 1 and stays there
        feedback: >-
          That's what `[]` would give. With no array, the effect also runs after the render it
          caused.
      - text: It stays at 0
        feedback: >-
          The effect runs after the first render. Its `setViews` asks for another render, and
          that one runs it again.
      - text: React throws and the page goes blank
        feedback: >-
          React logs "Maximum update depth exceeded" in the console, but it doesn't stop. The
          count keeps racing up.

  - type: prose
    id: what-cleanup-is
    body: >-
      Some effects set something up: a connection, a timer, a listener. The function an effect
      returns is its **cleanup**, and it undoes that. React calls it before the effect runs
      again, and when the component leaves the page.


      Timers are a classic case. `setInterval(fn, 1000)` calls `fn` every second and returns
      an id. `clearInterval(id)` stops it.


      In development, Strict Mode runs each new effect twice, to check your cleanup works.

  - type: fill-blank
    id: fill-connection-cleanup
    concept: react.effect-cleanup
    difficulty: 2
    language: tsx
    prompt: >-
      `createConnection(room)` returns an object that talks to a chat server. Connect, close
      the connection when done, and reconnect when the room changes.
    template: |
      useEffect(() => {
        const connection = createConnection(room);
        connection.connect();
        {{1}} () => connection.{{2}}();
      }, [{{3}}]);
    blanks:
      - key: '1'
        answer: return
      - key: '2'
        answer: disconnect
      - key: '3'
        answer: room
    bank: [return, await, disconnect, connect, room, connection]

  - type: ai-review
    id: review-stale-stopwatch
    concept: react.effect-dependencies
    difficulty: 3
    language: tsx
    request: Add a stopwatch that starts counting when the page opens.
    flawClass: logic
    code: |
      function Stopwatch() {
        const [seconds, setSeconds] = useState(0);
        useEffect(() => {
          const id = setInterval(() => {
            setSeconds(seconds + 1);
          }, 1000);
          return () => clearInterval(id);
        }, []);
        return <p>{seconds} s</p>;
      }
    prompt: >-
      An assistant wrote this. Its test waits one second and sees `1 s`. On the real page, it
      sits at `1 s` for ever. Tap the line at fault.
    lines: [5]
    reasons:
      - text: The timer only ever sees the first render's `seconds`
        correct: true
        feedback: >-
          Yes. The timer was made once, when `seconds` was 0. An updater fixes it.
      - text: The cleanup stops the timer after one tick
        feedback: >-
          The cleanup only runs when the stopwatch leaves the page. The timer keeps firing, and
          sets 1 each time.
      - text: '`setInterval` needs an `await` in front'
        feedback: >-
          `setInterval` hands back its id at once, not a promise. The trouble is which `seconds`
          the timer reads.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Wait three seconds, expect `3 s`
          correct: true
          feedback: >-
            Yes. The second tick is the first one that goes wrong.
        - text: Wait one second, expect `1 s`
          feedback: >-
            That's the test it already passed. One tick from 0 always gives 1.
        - text: Remove the stopwatch, check the timer stops
          feedback: >-
            A good test of the cleanup, which works. The count is the broken part.
    fix: |
      function Stopwatch() {
        const [seconds, setSeconds] = useState(0);
        useEffect(() => {
          const id = setInterval(() => {
            setSeconds((s) => s + 1);
          }, 1000);
          return () => clearInterval(id);
        }, []);
        return <p>{seconds} s</p>;
      }

  - type: code-challenge
    id: build-photo-keys
    concept: react.effect-cleanup
    difficulty: 4
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A photo viewer shows `Photo 1 of 4`. The arrow keys should move through the photos, and
      a `Keyboard shortcuts` checkbox turns them off. The tests press keys the way a person
      would.


      There are two bugs. After one press, the right arrow stops moving. And switching the
      shortcuts off doesn't stop the keys.


      Make ArrowRight go forward and ArrowLeft go back, staying between 1 and 4. With the box
      unticked, the keys do nothing.
    hints:
      - Look at which render's `index` the key listener reads, and at what the effect returns.
      - An updater, `setIndex((i) => ...)`, gets the latest value. A cleanup can remove the listener.
      - "End the effect with `return () => document.removeEventListener('keydown', handleKey);`."

  - type: bug-hunt
    id: hunt-effect-total
    concept: react.derived-values
    difficulty: 3
    language: tsx
    code: |
      function CartTotal({ items }) {
        const [total, setTotal] = useState(0);
        useEffect(() => {
          setTotal(items.reduce((sum, item) => sum + item.price, 0));
        }, [items]);
        return <p>Total: £{total}</p>;
      }
    prompt: >-
      A reviewer flags this cart. It renders twice for every change, and the first render
      shows an old total. Tap the line where the trouble starts.
    lines: [2]
    reasons:
      - text: The total is kept in state it doesn't need
        correct: true
        feedback: >-
          Right. Write `const total = items.reduce(...)` in the body. No state, no effect.
      - text: '`reduce` starts at 0, so it shows 0 first'
        feedback: >-
          The sum is right, only late. The old value on screen comes from state the effect sets
          after rendering.
      - text: The effect should list `total` as well
        feedback: >-
          That adds work instead of removing it. The total needs no effect at all.
    fix: |
      function CartTotal({ items }) {
        const total = items.reduce((sum, item) => sum + item.price, 0);
        return <p>Total: £{total}</p>;
      }

  - type: explain-back
    id: explain-no-effect-for-total
    concept: react.derived-values
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      In review, you asked for the cart's total to be worked out in the component body. It
      used to be saved to state in an effect. The author asks why. Defend the change.
    rubric:
      - The total comes straight from the items, so working it out while rendering is right the first time.
      - The effect runs after the page updates, so it shows an old total first and costs a second render.
      - The sum now runs on every render, which costs nothing you'd notice for a cart.
    modelAnswer: >-
      The total is a sum of the items, and the component already has them while rendering.
      Saved by an effect, it's only set after the page is shown. So every change shows a
      stale total first, then renders a second time. In the body it's right first time, and
      it can never drift from the items. The cost is adding up a short list on each render,
      which is tiny.

recap:
  - Use an effect to stay in step with something outside React, like a timer or a listener.
  - Pick the dependency array on purpose, and return a cleanup that undoes the setup.
  - Calculate values from props and state while rendering, with no effect at all.

recall:
  - id: card-effect-timing
    concept: react.effects
    front: When does an effect run, compared with rendering?
    back: >-
      After React has rendered and updated the page. Never during the render itself.
  - id: card-dependency-check
    concept: react.effect-dependencies
    front: When does `useEffect(fn, [room])` run, and how does that differ from no array and `[]`?
    back: >-
      After the first render, then again only when `room` has changed. With no array it runs
      after every render. With `[]` it runs once.
  - id: card-cleanup-timing
    concept: react.effect-cleanup
    front: When does React call an effect's cleanup?
    back: >-
      Before the effect runs again, and when the component leaves the page. Strict Mode adds an
      extra round in development.
  - id: card-stale-interval
    concept: react.effect-dependencies
    front: A `setInterval` in an effect with `[]` calls `setSeconds(seconds + 1)`. Why is it stuck at 1, and what's the fix?
    back: >-
      The timer was made in the first render and only ever sees `seconds` as 0. Use an updater,
      `setSeconds((s) => s + 1)`.
  - id: card-no-effect
    concept: react.derived-values
    front: Which values need no effect and no state?
    back: >-
      Anything you can calculate from props and state. Work it out in the component body.

