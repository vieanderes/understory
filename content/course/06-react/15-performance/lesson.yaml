deepDive: >-
  **Every `useMemo` has a cost.** It stores the result and compares the dependencies on every
  render. Wrapping cheap calculations makes code harder to read and no faster. The Profiler
  tells you which ones earn it.


  **With the compiler on,** keep `useMemo` and `useCallback` for control, not speed. The docs'
  example is an effect dependency that must stay the same object, so the effect doesn't run
  again.


  **What Suspense does to the old content.** Without a transition, React doesn't remove it
  while it waits. It hides it with `display: none` and shows the fallback beside it, so the
  state inside is kept for when it comes back.
