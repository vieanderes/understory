id: js.modules
title: Modules
objective: "Split code into files with `export` and `import`, and load them in the browser."
level: essential
minutes: 10
concepts: [js.modules, js.named-and-default-exports, js.module-scripts]
prerequisites: [js.functions-and-this]
opening:
  text: >-
    You'll split one long script into small files that share only what they mean to. And you'll
    recognise the browser errors that appear when a file is wired up wrong.

steps:
  - type: prose
    id: why-modules
    body: |-
      One 900-line script is hard to find your way around. Two helpers both called `format`
      clash. So code is split into **modules**: files with their own scope, sharing only what
      they export.

      ```js
      // menu.js
      export function dishLabel(dish) {
        return dish.name + " £" + dish.price;
      }

      // main.js
      import { dishLabel } from "./menu.js";
      ```

      `export` shares a name. `import` brings it into another file.

  - type: fill-blank
    id: fill-named-import
    concept: js.modules
    difficulty: 1
    language: js
    prompt: >-
      `main.js` needs the label helper from `menu.js`. Fill the gaps so the import works.
    template: |
      // menu.js
      {{1}} function dishLabel(dish) {
        return dish.name + " £" + dish.price;
      }

      // main.js
      {{2}} { dishLabel } {{3}} "./menu.js";
      console.log(dishLabel({ name: "Soup", price: 5 })); // Soup £5
    blanks:
      - key: '1'
        answer: export
      - key: '2'
        answer: import
      - key: '3'
        answer: from
    bank: [export, import, from, require, return, default]

  - type: predict-output
    id: predict-module-scope
    concept: js.modules
    difficulty: 2
    language: js
    code: |
      // menu.js
      const currency = "£";
      export function priceLabel(price) {
        return currency + price;
      }

      // main.js
      import { priceLabel } from "./menu.js";
      console.log(priceLabel(5));
      console.log(currency);
    question: '`main.js` runs in the browser. What do its two logs give?'
    choices:
      - text: '`£5`, then a `ReferenceError`'
        correct: true
        feedback: >-
          Right. `priceLabel` can use `currency`, but `currency` was never exported.
      - text: '`£5`, then `£`'
        feedback: >-
          In one big script that would work. A module keeps its own variables unless it exports
          them.
      - text: A `ReferenceError` on the first log
        feedback: >-
          `priceLabel` still sees `currency`. It was written inside `menu.js`, where `currency`
          lives.

  - type: parsons
    id: arrange-reading-time
    concept: js.modules
    difficulty: 2
    language: js
    prompt: >-
      Arrange `reading.js`. It shares `readingTime`, which turns an article with 450 words into
      `3 min read`. One block doesn't belong.
    checkIndent: true
    blocks:
      - id: signature
        code: export function readingTime(article) {
        subgoal: Share the function
      - id: words
        code: const words = article.wordCount;
        indent: 1
        subgoal: Read the word count
      - id: minutes
        code: const minutes = Math.ceil(words / 200);
        indent: 1
        subgoal: Round up to whole minutes
      - id: result
        code: return minutes + " min read";
        indent: 1
      - id: close
        code: '}'
    distractors:
      - id: self-import
        code: import { readingTime } from "./reading.js";
        feedback: >-
          A file doesn't import its own function. The file that uses it does.

  - type: prose
    id: default-exports-and-paths
    body: |-
      A file can also have one **default export**, its main thing. It's imported without
      braces, under any name you like:

      ```js
      // dates.js
      export default function formatDate(day) { /* ... */ }

      // main.js
      import formatDate from "./dates.js";
      ```

      Braces ask for a **named export** instead. In the browser, the path starts with `./` and
      ends with `.js`.

  - type: predict-output
    id: predict-default-import
    concept: js.named-and-default-exports
    difficulty: 3
    language: js
    code: |
      // dates.js
      export default function formatDate(day) {
        return "Due back on " + day;
      }

      // main.js
      import { formatDate } from "./dates.js";
      console.log(formatDate("Friday"));
    question: What happens when the page loads `main.js`?
    choices:
      - text: A `SyntaxError`, and nothing in `main.js` runs
        correct: true
        feedback: >-
          Right. Braces ask for a named export, and `dates.js` has only a default one.
      - text: It logs the date
        feedback: >-
          The name inside `dates.js` doesn't matter to importers. A default export has no name
          they can ask for.
      - text: A `TypeError` when `formatDate` is called
        feedback: >-
          It fails earlier. The browser checks every import before any line of `main.js` runs.

  - type: prose
    id: module-scripts
    body: |-
      A page loads its first module with a `script` element:

      ```html
      <script type="module" src="main.js"></script>
      ```

      The browser fetches `main.js`, then every file it imports. `type="module"` matters. Without
      it the file runs as an old-style script, where `import` isn't allowed. A module also waits
      until the page is read, so it can find every element.

  - type: ai-review
    id: review-missing-type-module
    concept: js.module-scripts
    difficulty: 3
    language: html
    request: Load the menu code, now split into main.js and menu.js, into the page.
    flawClass: logic
    code: |
      <!doctype html>
      <html lang="en">
        <head>
          <title>Menu</title>
          <script src="main.js"></script>
        </head>
        <body>
          <ul id="menu"></ul>
        </body>
      </html>
    prompt: >-
      A coding assistant wrote this page. The menu stays empty, and the Console says
      `Uncaught SyntaxError: Cannot use import statement outside a module`. Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: The `script` element needs `type="module"`
        correct: true
        feedback: >-
          Right. Without it, `main.js` runs as a classic script, where `import` is a syntax error.
      - text: The `src` must start with `./`
        feedback: >-
          `src` is an ordinary URL, so `main.js` is found. The `./` rule is for `import` paths.
      - text: The script runs before the list exists
        feedback: >-
          That would give `null` from `querySelector`, not a syntax error. A module waits for the
          page anyway.
    fix: |
      <script type="module" src="main.js"></script>

  - type: code-challenge
    id: write-prices-module
    concept: js.named-and-default-exports
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      This is `prices.js`. Other files need `formatPrice` and `total`, so export both as named
      exports. Keep `pounds` private: don't export it.


      `total(items)` adds up each item's `pence` and returns the result as a price.


      Example: `total([{ pence: 450 }, { pence: 120 }])` returns `"£5.70"`, and an empty list
      gives `"£0.00"`.
    hints:
      - The tests import `formatPrice` and `total` by name. What has to come before `function`?
      - Put `export` in front of the two shared functions only.
      - In `total`, add up the pence with a `for...of` loop, then return `formatPrice(pence)`.

  - type: explain-back
    id: explain-default-braces
    concept: js.named-and-default-exports
    difficulty: 3
    prompt: |-
      ```js
      // dates.js
      export default function formatDate(day) { /* ... */ }

      // main.js
      import { formatDate } from "./dates.js";
      // SyntaxError: The requested module './dates.js' does not provide an export named 'formatDate'
      ```

      `dates.js` plainly has a `formatDate`. Why does the import fail, and what are two ways to fix it?
    rubric:
      - '`export default` shares one unnamed main value, not a named export.'
      - Braces in an `import` ask for a named export, so there's nothing to match.
      - Import it without braces, or change `dates.js` to a named `export function`.
    modelAnswer: >-
      The function is the file's default export, and a default export has no name importers can
      ask for. Braces mean "the named export called `formatDate`", and `dates.js` has none. The
      browser checks imports before running anything, so it stops with a `SyntaxError`. Either
      write `import formatDate from "./dates.js"`, or make it `export function formatDate` so
      the braces match.

recap:
  - Share code between files with `export` and `import`.
  - Tell named exports, in braces, from a default export, imported under any name.
  - Load modules with `<script type="module">` and paths that start with `./`.

recall:
  - id: card-module-scope
    concept: js.modules
    front: A module declares `const currency = "£"` without exporting it. Can another file read `currency`?
    back: >-
      No. Each module has its own scope. Only exported names can be imported.
  - id: card-named-or-default
    concept: js.named-and-default-exports
    front: How do you import a named export, and how do you import a default export?
    back: >-
      Named: `import { dishLabel } from "./menu.js"`. Default: `import formatDate from
      "./dates.js"`, under any name, without braces.
  - id: card-type-module
    concept: js.module-scripts
    front: Your file uses `import`, and the Console says "Cannot use import statement outside a module". What's missing?
    back: >-
      `type="module"` on the `script` element that loads it.
  - id: card-relative-path
    concept: js.module-scripts
    front: Why does `import { dishLabel } from "menu.js"` fail in the browser?
    back: >-
      A path without `./`, `../` or `/` isn't a file path to the browser. Write `"./menu.js"`.

