term: iterable
short: Any object a for loop can walk through, because it can hand out a fresh cursor on request.
explain: |
  Lists, strings, dicts, files, ranges: you can loop over all of them. What do they have
  in common? Each one can produce a fresh way of walking through itself.

  Formally, it has an `__iter__` method that returns an iterator. A list is iterable but
  not an iterator: every `for` loop over it gets a fresh cursor and starts at the
  beginning. That's why you can loop over a list twice, but not over a file twice
  without reopening it.
analogy: A book. Anyone can open it and start reading from page one, as many times as they like.
example:
  language: python
  code: |
    rows = [1, 2, 3]       # iterable
    it = iter(rows)        # iterator over it
    next(it), next(it)     # (1, 2)
    list(rows)             # [1, 2, 3], still all there
usage: The function takes any iterable, so pass the generator straight in; no need for a list.
twin:
  term: iterator
  difference: An iterable can be looped over and gives you a new iterator each time. An iterator is that cursor itself, with a position, and it's used up once it reaches the end.
related:
  - iterator
  - generator
level: 2
lessons:
