term: harness
aka:
  - agent harness
short: The code around a model that runs its loop, enforces limits and decides which actions happen.
explain: |
  The model proposes; something has to decide. That's the harness. It calls the model and
  runs the tools it asks for. It caps the steps and the spend, checks permissions and logs
  every move. It asks a person when it needs to.

  Rules in a prompt are requests. Rules in the harness hold even when the model is misled.
  Changing the harness can make an agent worse, because a new tool or an edited instruction
  file shifts its behaviour. Version it and test it like code.
analogy: Bumpers on a bowling lane. The bowler throws however they like; the bumpers decide where the ball can't go.
usage: Put the step cap in the harness, not the system prompt; the model ignored it twice.
