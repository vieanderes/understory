term: working directory
aka: [current directory, current working directory, cwd, pwd]
short: The folder a shell or program is standing in, which every relative path is read from.
explain: |
  When you type `cat notes.txt`, which `notes.txt` do you mean? The one in the folder you
  are standing in. Every shell and every running program has such a folder. `pwd` prints it
  and `cd` changes it.

  A path that doesn't start with `/` or `~` is read from there. So the same command works in
  one folder and fails in another with "No such file or directory". The file isn't missing;
  you're standing in the wrong place. A program inherits the folder of whoever started it.
analogy: The room you're in when someone says "the table". They mean the one here, not one across town.
example:
  language: bash
  code: |
    pwd               # /home/sam/projects
    cat data/rows.csv # reads /home/sam/projects/data/rows.csv
    cd data
    cat data/rows.csv # No such file or directory
usage: The script reads a relative path, so it breaks when cron runs it from a different working directory.
related: [shell, environment-variable, process, relative-url]
level: 1
lessons: [tooling.terminal]
