term: non-goal
aka:
  - out of scope
short: Something a plan states it will deliberately not do, so nobody assumes it will.
explain: |
  A plan that lists only goals leaves its edges blurry. "Supports teams" might mean sharing,
  permissions and billing, or only sharing. Non-goals settle it: "no per-user permissions in
  this version".

  Good non-goals are things someone could reasonably expect. They stop arguments before they
  start, and they're the first defence against scope creep.
analogy: A sign on a shop door saying "cash only". Better to read it at the door than at the till.
usage: Add mobile as a non-goal, or someone will assume it's in.
related:
  - scope-creep
  - design-doc
level: 2
