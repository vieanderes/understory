    note: The official tutorial's first queries, with `SELECT`, `FROM` and `*`.
    primary: true
    verified: true
  - kind: docs
    title: 2.2. Concepts
    authors: The PostgreSQL Global Development Group
    venue: PostgreSQL 18 documentation
