term: temperature
short: A setting that makes a model's word choices more predictable when low and more varied when high.
explain: |
  For each next token, a model gives every option a probability, then one is drawn.
  Temperature reshapes those odds. Near zero, the likeliest option almost always wins.
  Higher, the long shots get a real chance.

  Low suits extraction, classification and code. Higher suits brainstorming. The trap:
  temperature 0 doesn't guarantee the same answer every time. It doesn't make the model more
  correct either, only more consistent.
analogy: How far a cook strays from the recipe. Low, and you get the same dish every night; high, and dinner gets interesting, for better or worse.
example:
  language: json
  code: |
    {
      "model": "your-model",
      "temperature": 0,
      "messages": [{ "role": "user", "content": "Label this ticket" }]
    }
usage: Drop the temperature to zero for the classifier; we want the same label on every run.
