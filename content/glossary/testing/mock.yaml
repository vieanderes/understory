term: mock
aka: [ mock object, mocking, spy ]
short: A fake stand-in that records how your code called it, so the test can check those calls.
explain: |
  Some effects are hard to see from outside: an email sent, an event published. A fake
  that writes down every call lets the test ask, "was `sendEmail` called once, with this
  address?"

  Use one when the call itself is the behaviour you care about. Overuse is the trap. A test
  that checks every internal call breaks on every refactor and proves little. Fake only the
  edges you don't own, such as email, payments and the clock, and prefer checking results
  over checking calls.
analogy: A practice dummy that logs every punch. You don't care that it can't fight back; you care where you hit it.
example:
  language: ts
  code: |
    const sendEmail = vi.fn();
    await registerUser({ email: 'sam@example.com' }, { sendEmail });

    expect(sendEmail).toHaveBeenCalledOnce();
    expect(sendEmail).toHaveBeenCalledWith('sam@example.com', 'welcome');
usage: Drop the mock on the repository and use the in-memory one; we're testing calls, not behaviour.
twin:
  term: stub
  difference: A stub feeds your code a ready-made answer, and the test checks your code's result. A mock records calls, and the test checks the calls themselves.
related: [ stub, fixture, unit-test, dependency-injection, pure-function ]
level: 1
