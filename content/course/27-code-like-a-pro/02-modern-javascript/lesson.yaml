id: pro.modern-javascript
title: Idiomatic modern JavaScript
objective: "Write JavaScript the way experienced developers do: destructuring, spread, array methods where they read better, async and await, and named exports."
level: essential
minutes: 10
concepts: [pro.js-idioms, pro.declarative-arrays, pro.async-style]
prerequisites: [pro.amateur-tells]
opening:
  text: >-
    You'll use the syntax you know the way experienced developers do. Your code will read as
    current, and its intent will be plain at a glance.

steps:
  - type: multiple-choice
    id: pick-modern-version
    concept: pro.js-idioms
    difficulty: 1
    language: js
    code: |
      // Version A
      var city = "Unknown";
      if (user && user.address && user.address.city) {
        city = user.address.city;
      }

      // Version B
      const city = user?.address?.city ?? "Unknown";
    question: Which version would a reviewer expect in modern code?
    choices:
      - text: B, one line that says the same
        correct: true
        feedback: >-
          Yes. Optional chaining and `??` state the intent without the scaffolding.
      - text: A, because it's more explicit
        feedback: >-
          It spells out every check, but a reader has to decode four lines to find one idea.
      - text: They read equally well
        feedback: >-
          They behave nearly alike, but B is shorter and uses `const`, so nothing can reassign it.

  - type: predict-output
    id: predict-or-default
    concept: pro.js-idioms
    difficulty: 2
    language: js
    code: |
      const settings = { volume: 0 };
      const volume = settings.volume || 50;
      console.log(volume);
    question: What does this show?
    choices:
      - text: '`50`'
        correct: true
        feedback: >-
          Right. `||` treats `0` as missing. The user's choice of silence is lost.
      - text: '`0`'
        feedback: >-
          That's what `??` would give. `||` replaces any falsy value, and `0` is falsy.
      - text: '`undefined`'
        feedback: >-
          `volume` exists and holds `0`. The `||` then swaps it for the default.

  - type: prose
    id: idioms
    body: |-
      That's why pros reach for `??` for defaults. The other everyday **idioms**:

      ```js
      const { name, email } = user;
      const copy = { ...settings, volume: 20 };
      const newest = orders.at(-1);
      export function formatName(user) { /* ... */ }
      ```

      `const` unless a value must change. Destructuring pulls out fields, spread copies, and
      `at(-1)` reads the last item. Named exports keep one name in every file.

  - type: multiple-choice
    id: pick-loop-or-method
    concept: pro.declarative-arrays
    difficulty: 2
    question: When is a plain `for` loop still the better choice over `map` or `filter`?
    choices:
      - text: When you need to stop early
        correct: true
        feedback: >-
          Yes. `map` and `filter` always visit every item. A loop can `break` or `return`.
      - text: Whenever the list is long
        feedback: >-
          Both are linear. Length alone doesn't decide it, what you do with each item does.
      - text: Never, array methods always win
        feedback: >-
          They win when they say what you produce. A loop reads better when it exits early.

  - type: fill-blank
    id: fill-filter-map
    concept: pro.declarative-arrays
    difficulty: 2
    prompt: Get the titles of the books that are in stock, in one declarative chain.
    language: js
    template: |
      const titles = books
        .{{1}}((book) => book.inStock)
        .{{2}}((book) => book.title);
    blanks:
      - key: '1'
        answer: filter
      - key: '2'
        answer: map
    bank: [filter, map, forEach, find, reduce]

  - type: prose
    id: async-style
    body: |-
      For async code, pros write `async` and `await` with `try` and `catch`, so it reads top
      to bottom. Long `.then()` chains are the older style.

      One more habit: if two calls don't depend on each other, don't wait for them in turn.

      ```js
      const [user, news] = await Promise.all([fetchUser(), fetchNews()]);
      ```

  - type: bug-hunt
    id: pick-sequential-time
    concept: pro.async-style
    difficulty: 3
    language: js
    code: |
      async function loadPage() {
        const user = await fetchUser();
        const news = await fetchNews();
        return { user, news };
      }
    prompt: >-
      Each fetch takes about a second, and neither needs the other. The page takes two
      seconds to load. Tap the lines that make it slow.
    lines: [2, 3]
    reasons:
      - text: Each call waits for the one before it
        correct: true
        feedback: >-
          Right. `fetchNews` only starts once `fetchUser` is done. Start both together.
      - text: '`async` functions are slow'
        feedback: >-
          `async` adds almost nothing. The time goes on waiting for one call, then the other.
      - text: Returning an object waits for both again
        feedback: >-
          By the return, both results are already here. The waiting happens above it.
    fix: |
      async function loadPage() {
        const [user, news] = await Promise.all([fetchUser(), fetchNews()]);
        return { user, news };
      }

  - type: ai-review
    id: review-last
    concept: pro.js-idioms
    difficulty: 3
    language: js
    request: Write latestOrder(orders) that returns the most recent order.
    flawClass: hallucinated-api
    code: |
      function latestOrder(orders) {
        const sorted = [...orders].sort((a, b) => a.placedAt - b.placedAt);
        return sorted.last();
      }
    prompt: >-
      An assistant wrote this, and it looks idiomatic. It was only read, never run. On the
      first call it stops with `TypeError: sorted.last is not a function`. Tap the line.
    lines: [3]
    reasons:
      - text: Arrays have no `last` method
        correct: true
        feedback: >-
          Right. It's invented. `at(-1)` is the real way to read the last item.
      - text: The spread copy loses the orders
        feedback: >-
          `[...orders]` copies every order, so `sort` doesn't change the caller's list.
      - text: '`sort` needs no compare function'
        feedback: >-
          Without one, `sort` compares as text. The compare function is right here.
    verify:
      question: What would have caught this before review?
      choices:
        - text: Calling it once with two orders
          correct: true
          feedback: >-
            Yes. The first run throws. Reading alone missed it.
        - text: Reading the code once more
          feedback: >-
            It already read as idiomatic. An invented method looks real until something runs it.
        - text: Checking the compare function's order
          feedback: >-
            The order is right. The crash comes from the method on the next line.
    fix: |
      function latestOrder(orders) {
        const sorted = [...orders].sort((a, b) => a.placedAt - b.placedAt);
        return sorted.at(-1);
      }

  - type: code-challenge
    id: write-subscriber-emails
    concept: pro.declarative-arrays
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      `getEmails` works, but it's written in an old style: `var`, an index loop, `== true`
      and nested checks. Rewrite it as `subscriberEmails(users)` in modern style.


      Keep subscribed users with a non-empty `email`, in lower case. Return each address
      only once, where it first appears.
    hints:
      - The loop only keeps some users and turns each into an address.
      - That's a `filter` then a `map`. A `Set` drops the repeats.
      - 'Start with `const emails = users.filter((user) => user.subscribed && user.email)`'

  - type: explain-back
    id: explain-promise-all
    concept: pro.async-style
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Why do experienced developers run independent calls with `Promise.all` instead of one
      `await` after another?
    rubric:
      - Each `await` waits for its call to finish before the next line runs.
      - Calls that don't depend on each other can run at the same time.
      - So the total time is the slowest call, not the sum of all of them.
    modelAnswer: >-
      One `await` after another starts the second call only when the first has finished,
      so the times add up. If the calls don't need each other, `Promise.all` starts them
      together. Then you wait only as long as the slowest one.

recap:
  - Use `const`, destructuring, spread, template literals and `??` as your defaults.
  - Choose `filter` and `map` to say what you produce, and a loop to stop early.
  - Write `async` and `await`, and start independent calls together with `Promise.all`.
recall:
  - id: card-nullish-default
    concept: pro.js-idioms
    front: Why do pros write `value ?? fallback` rather than `value || fallback` for defaults?
    back: >-
      `||` also replaces `0`, `''` and `false`, which can be real values. `??` only replaces
      `null` and `undefined`.
  - id: card-loop-or-method
    concept: pro.declarative-arrays
    front: When does a plain loop read better than `map` or `filter`?
    back: >-
      When it stops early or does several things per item. Array methods always visit every
      item.
  - id: card-last-item
    concept: pro.js-idioms
    front: How do you read the last item of an array in modern JavaScript?
    back: >-
      With `array.at(-1)`. There is no `last` method.
  - id: card-promise-all
    concept: pro.async-style
    front: Two independent calls each take a second. How long do they take with `Promise.all`?
    back: >-
      About one second, because both start at once. Awaited one after the other, about two.

references:
  - kind: docs
    title: Nullish coalescing operator (??)
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Nullish_coalescing
    note: Why `??` keeps `0` and `''` where `||` does not.
    verified: true
  - kind: docs
    title: Promise.all()
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all
    note: Starting several promises together and waiting for all of them.
    primary: true
    verified: true
  - kind: docs
    title: Array.prototype.at()
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/at
    note: Reading from the end of an array with a negative index.
    verified: true

deepDive: >-
  The timings here are real: two one-second waits took 2,002 ms one after the other and
  1,002 ms with `Promise.all`, on Node 24. `Promise.all` rejects as soon as any call fails;
  when you want every result whatever happens, `Promise.allSettled` waits for all of them.


  Style guides differ on details, but they agree on the core: `const` by default, `===`,
  and no `var`. Many also prefer named exports over default exports. A named export keeps
  the same name at every import, so editors can find and rename it everywhere.
