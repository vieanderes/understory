deepDive: >-
  A `return` inside `finally` replaces whatever `try` or `catch` was doing, and that includes
  an error on its way out. The caller then sees a normal result, and the failure is gone.
  Linters flag it for that reason.


  `catch` with no binding is valid: `try { ... } catch { ... }` when you don't need the
  value. It's rarely what you want, since you can't log or rethrow what you never named.


  Wrapping an error changes its stack. The new error's stack starts where you created it,
  and the original stack lives on in `cause`. Node, which runs JavaScript outside the
  browser, prints the whole chain when an error reaches the top.


  Larger programs often define their own kinds of error, such as `NotFoundError`, so a
  handler can tell them apart with `instanceof`. That takes a class, which comes in the
  classes lesson.
