term: monotonic stack
aka: [monotone stack, next greater element, monotonic deque]
short: A pile kept always sorted, where each new item first removes every item it beats.
explain: |
  "For each day, how many days until a warmer one?" Checking forwards from every day is
  O(n²). Instead, keep the days still waiting for an answer, coolest on top.

  When a warmer day arrives, it's the answer for every waiting day that's cooler. Pop them
  all, record the answer, then push the new day. The pile stays in order.

  Each day is pushed once and popped at most once, so the whole pass is O(n) amortised.
  The signal is "next greater", "next smaller" or "largest rectangle".
analogy: A queue for a concert where taller people arriving block everyone shorter behind them, who give up and leave.
example:
  language: python
  code: |
    def days_until_warmer(temps):
        answer = [0] * len(temps)
        waiting = []                       # indices, temps falling from bottom to top
        for day, t in enumerate(temps):
            while waiting and temps[waiting[-1]] < t:
                cooler = waiting.pop()
                answer[cooler] = day - cooler
            waiting.append(day)
        return answer
usage: Next greater element is the classic monotonic stack; each index goes on and off once.
related: [stack, amortised-cost, sliding-window]
