id: react
number: 6
title: React
summary: Build interfaces by describing what the page should show for the current data, and let React change the page to match. Components, props, state, lists, forms, effects and data loading, one at a time.
why: "Keeping a page in step with its data by hand is where interface bugs come from. React does that part for you."
youCanBuild: "A small React app with a form, a filtered list and data loaded from a server, each piece of state in the right place."
concepts:
  - id: react.declarative-ui
    title: Describing the UI
    summary: You describe what the page should show for the current data, and React works out what to change on the real page.
  - id: react.components
    title: Components
    summary: A component is a function with a capitalised name that returns JSX describing one piece of the page.
  - id: react.jsx
    title: JSX
    summary: "JSX is HTML-like syntax inside JavaScript. Braces hold JavaScript values, `className` replaces `class`, and each tag becomes a plain object that describes an element."
  - id: react.props
    title: Props
    summary: Props are the inputs a parent passes to a component, like arguments to a function. The component reads them and never changes them.
    confusableWith: [react.state]
  - id: react.children
    title: Children
    summary: "Whatever you write between a component's tags arrives as its `children` prop, and the component decides where to put it."
  - id: react.conditional-rendering
    title: Conditional rendering
    summary: "`&&` and the `? :` operator show part of the page only when a condition holds. A `0` on the left of `&&` shows up as 0."
  - id: react.events
    title: Event handlers
    summary: "You pass a function to a prop such as `onClick`, and React calls it when the event happens. Calling it yourself runs it during render instead."
  - id: react.state
    title: State
    summary: "State is a value React remembers for a component between renders. `useState` gives the value and a setter, and calling the setter draws the component again."
    confusableWith: [react.props, react.refs]
  - id: react.rules-of-hooks
    title: Rules of hooks
    summary: "Hooks are the `use` functions, such as `useState`. Call them at the top level of a component or hook, in the same order on every render."
  - id: react.render-and-commit
    title: Render and commit
    summary: A state change triggers a render, where React calls your components for the new description, then a commit, where it changes only what differs on the page.
  - id: react.purity
    title: Pure components
    summary: A component returns the same JSX for the same props and state, and changes nothing outside itself while it renders.
  - id: react.state-snapshot
    title: State as a snapshot
    summary: Each render sees its own fixed state values. A setter asks for the next render and doesn't change the variable you're holding.
  - id: react.batching
    title: Batching
    summary: React waits until an event handler finishes, then renders once with every state update it queued.
  - id: react.updater-functions
    title: Updater functions
    summary: "A function passed to a setter, like `(n) => n + 1`, gets the latest pending value, so several updates in a row build on each other."
  - id: react.rendering-lists
    title: Rendering lists
    summary: "`map` turns an array of data into an array of elements, and `filter` picks which ones to show."
  - id: react.keys
    title: Keys
    summary: A key is a stable name for a list item, usually an id from your data, so React keeps each item's state with the right item.
  - id: react.state-preservation
    title: Keeping and resetting state
    summary: React keeps a component's state while the same type renders in the same place with the same key, and resets it when any of them changes.
  - id: react.updating-objects
    title: Updating objects in state
    summary: "To change an object in state, make a new one with spread, `{ ...user, name }`, and set that. Changing the old object doesn't render."
  - id: react.updating-arrays
    title: Updating arrays in state
    summary: "To change an array in state, make a new one with spread, `map`, `filter` or `toSorted`. `push`, `sort` and `splice` change the old array, and React doesn't notice."
  - id: react.lifting-state
    title: Lifting state up
    summary: When two components must agree, their state moves up to their closest common parent, which passes it down as props with a function to change it.
  - id: react.context
    title: Context
    summary: Context hands a value to every component below a provider, without passing it through the props of each component in between.
  - id: react.controlled-inputs
    title: Controlled inputs
    summary: "A controlled input shows a value from state and reports each change through `onChange`, so the component always knows what it says."
    confusableWith: [react.uncontrolled-inputs]
  - id: react.uncontrolled-inputs
    title: Uncontrolled inputs
    summary: An uncontrolled input keeps its own value on the page, and the code reads it when the form is sent.
    confusableWith: [react.controlled-inputs]
  - id: react.form-actions
    title: Form actions
    summary: "`<form action={fn}>` calls your function with the form's fields when it's sent, and `useFormStatus` and `useActionState` show when it's still saving and what it returned."
  - id: react.effects
    title: Effects
    summary: An effect runs after React has updated the page, to keep a component in step with something outside React, such as a timer or a connection.
    confusableWith: [react.derived-values]
  - id: react.effect-dependencies
    title: Effect dependencies
    summary: The dependency array lists the values an effect reads. The effect runs again only when one of them has changed since the last render.
  - id: react.effect-cleanup
    title: Effect cleanup
    summary: The function an effect returns undoes what it set up. React calls it before the effect runs again and when the component leaves the page.
  - id: react.derived-values
    title: Values you can calculate
    summary: A value you can work out from props and state is calculated while rendering, with no extra state and no effect.
    confusableWith: [react.effects]
  - id: react.fetching-data
    title: Fetching data
    summary: A component loads data in an effect that depends on what it asks for, and shows a loading state, an error or the data.
  - id: react.stale-responses
    title: Stale responses
    summary: An answer that arrives after the component has asked for something else is ignored, with a flag the effect's cleanup sets.
  - id: react.reducers
    title: Reducers
    summary: A reducer is one function that takes the current state and an action describing what happened, and returns the next state.
  - id: react.url-state
    title: URL state
    summary: State kept in the address, such as `?tab=reviews`, survives a reload and travels with a shared link.
  - id: react.thinking-in-react
    title: Thinking in React
    summary: Build from a sketch by splitting it into components, finding the least state that works, and giving each piece of state one owner.
  - id: react.refs
    title: Refs
    summary: "A ref is a box, `ref.current`, that keeps a value between renders without drawing anything, or holds a DOM element."
    confusableWith: [react.state]
  - id: react.custom-hooks
    title: Custom hooks
    summary: "A custom hook is your own `use` function that calls other hooks. It shares logic between components, and each component gets its own state."
  - id: react.use-memo
    title: useMemo
    summary: "`useMemo` keeps the result of a slow calculation between renders until one of its dependencies changes."
    confusableWith: [react.use-callback]
  - id: react.use-callback
    title: useCallback and memo
    summary: "`memo` skips a component's render when its props haven't changed, and `useCallback` keeps the same function between renders so the props stay equal."
    confusableWith: [react.use-memo]
  - id: react.transitions
    title: Transitions and Suspense
    summary: A transition marks an update as able to wait, so the current screen stays usable, and Suspense shows a fallback while something inside is still loading.
  - id: react.compiler
    title: React Compiler
    summary: A build tool that adds memoisation to your components for you, as long as they follow the rules of React.
