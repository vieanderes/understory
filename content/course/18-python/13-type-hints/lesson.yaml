id: python.type-hints
title: Type hints
objective: Annotate functions and data, check them with a type checker, and remember that Python itself ignores them at run time.
level: essential
minutes: 10
concepts: [python.type-hints, python.type-checkers, python.typeddict-and-literal, python.protocols]
prerequisites: [python.projects-and-uv]
opening:
  text: >-
    You'll add types to Python and have a checker catch mistakes before the code runs. Every
    modern AI library is typed, and its hints tell you what each call expects.

steps:
  - type: prose
    id: hint-syntax
    body: |-
      Python has types too, written as **type hints**. They look like TypeScript: a hint
      goes after a colon, and the return type after `->`:

      ```python
      def average(scores: list[float]) -> float: ...
      def find_user(user_id: int) -> User | None: ...
      counts: dict[str, int] = {}
      ```

      `list[float]` is a list of floats. `User | None` means a `User` or nothing. The `...`
      stands for a body left out. What happens when the code runs is the surprise.

  - type: predict-output
    id: predict-hints-ignored
    concept: python.type-hints
    difficulty: 1
    language: python
    code: |
      def double(n: int) -> int:
          return n * 2

      print(double("ab"))
    question: What does this show when run?
    choices:
      - text: '`abab`'
        correct: true
        feedback: >-
          Yes. Python ignores the hints when it runs, and `"ab" * 2` repeats the text.
      - text: 'A `TypeError`, because `"ab"` isn''t an `int`'
        feedback: >-
          A fair guess. The hints are notes for tools. The interpreter never checks them.
      - text: '`4`'
        feedback: >-
          Nothing converts `"ab"` into a number. It stays text, and text times 2 repeats.

  - type: multiple-choice
    id: pick-checker-output
    concept: python.type-checkers
    difficulty: 2
    question: You run `uvx mypy double.py` on the code from the last step. What happens?
    code: |
      def double(n: int) -> int:
          return n * 2

      print(double("ab"))
    language: python
    choices:
      - text: It reports an error on the last line
        correct: true
        feedback: >-
          Right. mypy says `Argument 1 to "double" has incompatible type "str"; expected "int"`.
      - text: It prints `abab`
        feedback: >-
          mypy never runs your code. It reads the hints and reports mismatches.
      - text: It finds nothing, since the code runs
        feedback: >-
          Running and matching the hints are separate. mypy checks the hints.

  - type: prose
    id: typeddict-and-literal
    body: |-
      Two helpers from `typing` pin data down further. **`Literal`** limits a value to exact
      constants, and `Status = ...` gives that type a name. **`TypedDict`** types a dict
      with fixed keys, such as parsed JSON:

      ```python
      from typing import Literal, TypedDict

      Status = Literal["open", "closed"]

      class Order(TypedDict):
          id: int
          total: float
      ```

  - type: bug-hunt
    id: hunt-literal
    concept: python.typeddict-and-literal
    difficulty: 3
    language: python
    code: |
      from typing import Literal

      Status = Literal["open", "closed"]

      def set_status(ticket_id: int, status: Status) -> None:
          print(ticket_id, status)

      set_status(7, "closed")
      set_status(8, "archived")
    prompt: mypy reports one error here. Tap the line it points at.
    lines: [9]
    reasons:
      - text: '`"archived"` is not one of the allowed values'
        correct: true
        feedback: >-
          Yes. mypy expected `Literal['open', 'closed']` and got `Literal['archived']`.
      - text: '`ticket_id` must be text'
        feedback: >-
          The hint says `int`, and 8 is an int. The status is the problem.
      - text: A `None` function can't be called twice
        feedback: >-
          `-> None` only says it returns nothing. You can call it as often as you like.
    fix: |
      set_status(8, "closed")

  - type: prose
    id: protocols
    body: |-
      Sometimes you care what an object can do, not what class it is. A **`Protocol`**
      lists the methods it needs:

      ```python
      from typing import Protocol

      class Closer(Protocol):
          def close(self) -> None: ...
      ```

      Any class with a matching `close` method fits `Closer`, without inheriting from it.

  - type: bug-hunt
    id: hunt-protocol-fit
    concept: python.protocols
    difficulty: 3
    language: python
    code: |
      class LogFile:
          def close(self) -> None:
              print("file closed")

      class Printer:
          def print_page(self) -> None:
              print("printing")

      def shutdown(thing: Closer) -> None:
          thing.close()

      shutdown(LogFile())
      shutdown(Printer())
    prompt: mypy rejects one call to `shutdown`, which needs a `Closer`. Tap it.
    lines: [13]
    reasons:
      - text: '`Printer` has no `close` method'
        correct: true
        feedback: >-
          Right. It doesn't match `Closer`, and it would crash at run time too.
      - text: '`LogFile` never inherits from `Closer`'
        feedback: >-
          It doesn't need to. Having a matching `close` is enough for a protocol.
      - text: '`shutdown` must return something'
        feedback: >-
          `-> None` says it returns nothing, which is fine. The problem is the argument.
    fix: |
      shutdown(LogFile())

  - type: ai-review
    id: review-empty-average
    concept: python.type-checkers
    difficulty: 4
    language: python
    request: Write average(scores), the mean of a list of scores.
    flawClass: edge-case
    code: |
      def average(scores: list[float]) -> float:
          return sum(scores) / len(scores)
    prompt: >-
      An assistant wrote this, and mypy reports no issues. A new user with no scores gets
      `ZeroDivisionError`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: An empty list divides by zero
        correct: true
        feedback: >-
          Yes. An empty list is a valid `list[float]`, so no checker warns about it.
      - text: The hint should be `list[int]`
        feedback: >-
          Floats are right for scores. The crash is about the length being zero.
      - text: '`sum` can''t add floats'
        feedback: >-
          `sum` adds floats fine. With no items it gives 0, then the division fails.
    fix: |
      def average(scores: list[float]) -> float:
          if not scores:
              return 0.0
          return sum(scores) / len(scores)

  - type: code-challenge
    id: write-open-total
    concept: python.type-hints
    difficulty: 3
    language: python
    starter: starter.py
    solution: solution.py
    tests: tests.py
    prompt: >-
      `Order` and `Status` are defined for you. Write `open_total(orders)`, the sum of `total`
      over the orders whose status is `"open"`. Hint it: a list of `Order` in, a `float` out.


      Example: open orders of 20.0 and 7.5 and a closed one of 5.0 give `27.5`.
    hints:
      - 'The hint syntax step shows `list[float]` and `-> float`.'
      - 'An `Order` is a plain dict when the code runs, so read it with `order["status"]`.'
      - 'Start with `def open_total(orders: list[Order]) -> float:` and `total = 0.0`.'

  - type: explain-back
    id: explain-checker-limits
    concept: python.type-checkers
    difficulty: 4
    prompt: >-
      mypy passed, yet `average([])` crashed. Why can't a type checker catch every bug?
    rubric:
      - A checker only compares the types written in the hints.
      - An empty list has the right type, so nothing looks wrong.
      - Wrong values of the right type still need tests.
    modelAnswer: >-
      A checker compares types, not values. An empty list is still a `list[float]`, so the
      call matches the hint. Dividing by its length of zero is a value problem, and only a
      test for the empty case catches it.

recap:
  - Annotate parameters, returns and variables with hints Python itself ignores.
  - Run mypy or another checker to catch mismatches before the code runs.
  - Pin data with `Literal` and `TypedDict`, and describe behaviour with `Protocol`.
recall:
  - id: card-hints-runtime
    concept: python.type-hints
    front: Does Python check type hints when it runs your code?
    back: >-
      No. The interpreter ignores them. A separate checker such as mypy reads them.
  - id: card-optional
    concept: python.type-hints
    front: How do you hint a function that returns a `User` or nothing?
    back: >-
      `-> User | None`.
  - id: card-typeddict
    concept: python.typeddict-and-literal
    front: What does `TypedDict` describe?
    back: >-
      A dict with a fixed set of keys, each with its own type, such as parsed JSON.
  - id: card-protocol
    concept: python.protocols
    front: What must a class do to fit a `Protocol`?
    back: >-
      Have the methods the protocol lists, with matching signatures. It needn't inherit from
      it.

