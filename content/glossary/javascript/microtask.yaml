term: microtask
aka:
  - microtask queue
short: A small queued job, such as a promise callback, that runs before the next timer, click or paint.
explain: |
  After each task, the event loop empties a second, faster queue. Promise callbacks and the
  code after an `await` wait there.

  Every one of them runs before anything else gets a turn. That's why a `.then` beats a
  `setTimeout(fn, 0)`. It's also the trap: microtasks that keep queuing more microtasks
  starve the page, and nothing paints.
analogy: The "one quick question" at the end of a meeting. Nobody leaves until every quick question is answered.
example:
  language: js
  code: |
    setTimeout(() => console.log('timer'), 0);
    queueMicrotask(() => console.log('microtask'));
    // microtask, timer
usage: The then callback is a microtask, so it runs before the timeout fires.
twin:
  term: event-loop
  difference: A microtask is one job in a queue that jumps ahead of timers and clicks. The event loop is the cycle that decides when every queue gets its turn.
related:
  - event-loop
  - promise
level: 3
lessons:
  - js.event-loop
