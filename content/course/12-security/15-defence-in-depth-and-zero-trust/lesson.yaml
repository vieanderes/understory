id: security.defence-in-depth
title: Defence in depth and zero trust
objective: "Layer independent checks, verify every request instead of trusting the network, and switch off what you don't use."
level: essential
minutes: 10
concepts: [security.defence-in-depth, security.zero-trust, security.hardening]
prerequisites: [security.threat-modelling, security.incident-response, db.row-level-security]
opening:
  text: >-
    You'll build systems where one failed check doesn't hand over everything. Every request
    proves who it is, and nothing runs that nobody uses.

steps:
  - type: prose
    id: network-words
    body: >-
      A few network words first. A **port** is a numbered door on a computer: web servers
      listen on 443. A **firewall** is a gatekeeper that allows or blocks connections by
      address and port.


      A **private network** links a company's machines without the internet reaching them
      directly. Addresses starting `10.` are reserved for such networks. A **VPN** is an
      encrypted tunnel that puts your laptop on that network from anywhere.

  - type: prose
    id: defence-in-depth
    body: >-
      Reading a customer's order passes three checks in turn: the firewall, sign-in, and an
      ownership check that the order is yours.


      That's **defence in depth**: independent layers, so one failing doesn't expose the
      data. Independent is the key word. If one stolen password opens every layer, they
      aren't layers. The data falls only when every check fails at once.

  - type: predict-output
    id: predict-one-layer
    concept: security.defence-in-depth
    difficulty: 1
    language: text
    code: |
      Reading an order needs, in turn:
        1. the firewall          (allows port 443)
        2. sign-in               (a valid session)
        3. an ownership check    (the order is yours)
      An attacker plugs a stolen laptop into the office network.
    question: The firewall no longer stands in their way. Do they get a customer's order?
    choices:
      - text: No. Sign-in and the ownership check still stand
        correct: true
        feedback: >-
          Right. Past one layer isn't past all three.
      - text: Yes. Inside the firewall means inside the system
        feedback: >-
          That's the idea this lesson undoes. Each layer checks on its own.
      - text: Only if they guess the order number
        feedback: >-
          Guessing the number still meets sign-in, then the ownership check. Two layers remain.

  - type: predict-output
    id: predict-internal-trust
    concept: security.zero-trust
    difficulty: 2
    language: js
    code: |
      // The reporting service calls the orders API.
      if (req.ip.startsWith('10.')) {
        return orders.all();       // private network, so trusted
      }
    question: An attacker takes over any one machine on the `10.` network. What can they read?
    choices:
      - text: Every order, with no password or token
        correct: true
        feedback: >-
          Right. Trusting the network means one machine inside reads everything.
      - text: Nothing, since they're not signed in
        feedback: >-
          Sign-in is never checked. The address is the only test, and they pass it.
      - text: Only the reporting service's own orders
        feedback: >-
          The code returns them all. It trusts where the call comes from, not who makes it.

  - type: prose
    id: zero-trust
    body: >-
      **Zero trust** drops the idea of a trusted inside. Every request proves who it is,
      wherever it comes from. A service calling another sends a **service token**, a secret
      like an API key. It goes in the `Authorization` header and is checked on every call.


      Splitting the network into parts, called segmentation, still helps as a layer. But it
      never replaces the check.

  - type: code-challenge
    id: write-require-service-token
    concept: security.zero-trust
    difficulty: 3
    language: ts
    prompt: >-
      Fix `canReadAllOrders(req, serviceTokens)`. It trusts any address starting `10.`.


      Ignore the address. Allow the call only when `req.headers['authorization']` is
      `'Bearer '` followed by a token that appears in `serviceTokens`. Refuse a missing header,
      a header without the `Bearer ` prefix, and an empty token.


      So `{ ip: '10.0.4.12', headers: {} }` is refused.
    hints:
      - The address proves nothing. Everything you need is in `req.headers['authorization']`.
      - Treat a missing header as `''`, then check it starts with `'Bearer '`.
      - "`header.slice('Bearer '.length)` gives the token. Check it's not empty and that `serviceTokens.includes(token)`."

  - type: prose
    id: hardening
    body: >-
      Every feature that runs is something an attacker can try. **Hardening** means switching
      off what you don't use before you go live.


      Turn off debug mode, which shows code and settings in error pages. Delete default
      accounts like `admin` with password `admin`. Remove routes left over from testing. Each
      one is a door nobody is watching.

  - type: bug-hunt
    id: find-unhardened-settings
    concept: security.hardening
    difficulty: 2
    language: js
    code: |
      const settings = {
        port: 443,
        debug: true,
        seedUsers: [{ name: 'admin', password: 'admin', role: 'admin' }],
        routes: ['/api/bookings', '/api/rooms', '/test/wipe-database'],
        sessionMinutes: 60,
      };
    prompt: >-
      This room-booking app goes live tomorrow. Tap every line that should be switched off or
      removed first.
    lines: [3, 4, 5]
    reasons:
      - text: Debug output, a default admin and a test route
        correct: true
        feedback: >-
          Yes. Each opens a door no real user needs.
      - text: Port 443 and the session length
        feedback: >-
          443 is the normal HTTPS port, and an hour's session is a sensible default.
      - text: Only the admin account is a problem
        feedback: >-
          It's the worst, but debug pages leak code, and a wipe route is one request from disaster.
    fix: |
      const settings = {
        port: 443,
        debug: false,
        seedUsers: [],
        routes: ['/api/bookings', '/api/rooms'],
        sessionMinutes: 60,
      };

  - type: ai-review
    id: review-flat-trusted-network
    concept: security.zero-trust
    difficulty: 4
    language: text
    request: We're moving the internal admin tool behind the VPN. Write the access rule.
    flawClass: security
    code: |
      # access rule for the admin tool
      allow:
        - anyone connected to the company VPN
      deny:
        - everyone else
      # no login on the tool itself; the VPN keeps strangers out
    prompt: >-
      An assistant wrote this. It ships, and the tool is only reachable over the VPN. Then one
      employee's VPN password is stolen by a fake login page. Tap the line at fault.
    lines: [6]
    reasons:
      - text: The VPN is the only check on who gets in
        correct: true
        feedback: >-
          Yes. Being on a network isn't an identity. The tool needs its own login.
      - text: The deny rule should list known attackers
        feedback: >-
          A list of bad people is never complete. The gap is trusting the VPN alone.
      - text: The VPN should use stronger encryption
        feedback: >-
          Encryption doesn't help once a real password is stolen. The missing login does.
    fix: |
      # access rule for the admin tool
      allow:
        - a signed-in user whose role includes 'admin'
      require:
        - the tool checks identity and role on every request
        - a second factor for admin sign-in
      # the VPN is one layer, not the only one

  - type: explain-back
    id: explain-why-not-trust-network
    concept: security.zero-trust
    difficulty: 4
    prompt: >-
      A team guards its services with a firewall and a VPN, and trusts any request from inside.
      Why does one stolen VPN password then expose everything, and what does zero trust change?
    rubric:
      - Trusting the network means the only barrier is getting inside, and a stolen password does that.
      - Once inside, every service is open, because none checks who is calling.
      - Zero trust checks identity and permission on every request, so being inside proves nothing.
    modelAnswer: >-
      The firewall and VPN make one wall, and everything inside trusts everything else. So the
      whole system rests on nobody ever getting in, and one stolen password gets in. From
      inside, the attacker calls any service, because each trusts the network instead of the
      caller. Zero trust removes the trusted inside. Every request carries a token or session
      that's checked, and permission is checked per call. The attacker is on the network, but
      still can't prove they may read the orders.

recap:
  - Layer independent checks, so one failure doesn't expose the data.
  - Check who is calling on every request, with a token or session, never by network address.
  - Switch off debug mode, default accounts and test routes before you go live.

recall:
  - id: card-defence-in-depth
    concept: security.defence-in-depth
    front: What does defence in depth protect against?
    back: >-
      One control failing. Independent layers mean the data falls only when every layer fails at once.
  - id: card-zero-trust
    concept: security.zero-trust
    front: What does zero trust replace, and with what?
    back: >-
      A trusted internal network, replaced by checking identity and permission on every request.
  - id: card-service-token
    concept: security.zero-trust
    front: How does one of your services prove who it is to another?
    back: >-
      It sends a service token, a secret like an API key, in its `Authorization` header, checked on every call.
  - id: card-hardening
    concept: security.hardening
    front: Name three things to switch off before an app goes live.
    back: >-
      Debug mode, default accounts such as admin/admin, and routes left over from testing.

