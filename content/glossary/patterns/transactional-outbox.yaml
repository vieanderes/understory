term: transactional outbox
aka: [outbox, outbox pattern]
short: Saving an outgoing event in the same transaction as the change, for a relay to publish later.
explain: |
  Saving a booking and publishing `RoomBooked` to a broker are two writes to two systems.
  No transaction covers both. A crash between them either loses the event or announces a
  booking that never committed. That is the dual-write problem.

  So write the event into an `outbox` table inside the same transaction as the booking. It
  exists exactly when the change does. A relay reads unsent rows, publishes them, and marks
  each one sent only after the broker accepts it. A crash there means a resend, so every
  consumer must be idempotent.
analogy: Writing the letter into the office post tray in the same moment you file the paperwork. The postman collects it later, but it can't go missing.
example:
  language: sql
  code: |
    BEGIN;
    INSERT INTO bookings (id, room_id) VALUES ($1, $2);
    INSERT INTO outbox (id, type, payload)
      VALUES ($3, 'RoomBooked', $4);
    COMMIT;
usage: We lost events when the broker was down; route them through a transactional outbox and let the relay retry.
related: [at-least-once-delivery, idempotent, message-broker, transaction]
level: 3
lessons: [arch.event-driven]
