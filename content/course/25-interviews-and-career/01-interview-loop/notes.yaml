summary: |-
  A senior interview loop is four to six separate conversations, each scored against its own rubric by a different person. Coding, system design, a project deep dive and behavioural rounds are the core. AI engineering loops usually add an applied AI round on evals, failure modes and cost, and some let you code with an assistant while they watch how you check it.

  The loop isn't testing whether you know more facts than a mid-level engineer. It tests whether you think in the order a senior engineer thinks: requirements before solutions, trade-offs named for every choice, failure modes raised before anyone asks, and a way to measure the result. The same knowledge, told in that order, scores a level higher.

  These notes add what the lesson leaves out: how panels actually decide, a round-by-round guide to what "strong" sounds like, how to prepare in the last week, and how to answer the questions that open or close most loops.
remember:
  - Each round is scored separately against a written rubric, and the panel then decides together, so a round you can't explain your own past decisions in hurts more than one slow coding problem.
  - A senior answer runs in a fixed order, requirements, design, trade-off, failure, measurement, and the order is what the interviewer hears as seniority.
  - In an AI loop, "how would you know it got better?" has one strong answer, a fixed eval set of real cases scored before and after, and you should offer it before you're asked.
  - A project deep dive tests ownership, so every answer names a decision you made, the option you turned down, and a result someone could check.
  - Ask the recruiter for the format of every round and whether AI tools are allowed in each, because formats vary widely and the question is expected.
  - Tell results as outcomes for users or the business, such as minutes instead of a day, never as the tool or framework you moved to.
  - Checkpoints beat narration, so state the plan, then pause to confirm at each milestone, rather than describing every keystroke.
sections:
  - title: How a panel turns rounds into a decision
    body: |-
      After the loop, each interviewer writes feedback against their rubric before seeing anyone else's. That's deliberate: it stops one confident voice from colouring the rest. The write-up usually has a hire or no-hire lean, a level estimate, and evidence quoted from what you said.

      **Evidence is the currency.** An interviewer can only argue for you with things you said. "Candidate proposed caching answers keyed by access group, unprompted, because answers depend on permissions" is evidence. "Seemed smart" isn't, and a hiring committee discounts it. So say the reasoning out loud, in sentences an interviewer could write down.

      Levelling happens in the same meeting. Two candidates can both pass and be offered different levels. The signals that push towards senior are scope (did your decisions reach beyond your own tickets?), ambiguity (did you make a vague brief concrete?), and judgement (did you choose, and say why?).

      A few patterns matter in practice:

      - One average round in a strong loop is normal and rarely fatal.
      - A clear red flag, such as blaming others in every story or being unable to explain your own design, often outweighs several good rounds.
      - Interviewers mark down candidates who need the requirements dragged out of them. Asking two or three sharp questions first is a positive signal, not a delay.
      - The deep dive is where level is often decided, because it's the hardest round to prepare for without real experience.
  - title: What strong sounds like in each round
    body: |-
      **Coding.** Restate the problem, confirm inputs and edge cases, give the brute force and its cost, improve it, agree the plan, then code with clear names. Test a normal case, a boundary and a nasty case before saying you're done. Finish by stating time and space cost and the next extension. If an assistant is allowed, plan aloud before you prompt, and fix small bugs by hand.

      **System design.** Spend the first five minutes on requirements and numbers. Sketch the standard shape, then go deep on the one component that carries the risk. For an AI system that's usually retrieval quality, the tool boundary, or cost per request. End with failures and how you'd measure success.

      **Project deep dive.** Pick a system you know down to the awkward parts. Expect "why not X?" for every choice, and "what would you change now?". Prepare one diagram you can draw in two minutes, three decisions with the option you rejected, one thing that went wrong, and the numbers: traffic, latency, cost, quality before and after.

      **Behavioural.** Two-minute STAR stories, "I" for your actions, a checkable result. Senior stories show scope and influence across people you didn't manage.

      **Applied AI.** Expect: how would you build an eval set; why would retrieval return the wrong passage; how do you stop invented answers; what would you cut if each request cost too much; how do you handle a model provider changing a model under you. Answer with the mechanism, then the measurement.
  - title: A worked upgrade from mid-level to senior
    body: |-
      Question: "How would you add a feature that summarises long support threads?"

      A mid-level answer: "I'd send the thread to a large model with a prompt asking for a summary, stream it back to the UI, and cache it."

      Nothing there is wrong. It's missing the reasons. Here is the same knowledge, told the senior way:

      ```text
      Requirements: who reads the summary, and what happens if it's wrong?
        If agents act on it, a missed refund request is costly.
      Numbers: threads run to 40 messages, about 6,000 tokens; 20,000 a day.
      Design: summarise on the server when a thread closes, not on every view.
        Store the summary with the thread version it came from.
      Trade-off: precomputing costs calls for threads nobody opens,
        but views are instant and cost is predictable.
      Failure: a thread longer than the context window gets split and
        summarised in parts; a failed call shows the raw thread, not an error.
      Measure: 100 real threads with human-written key points;
        score whether each key point appears, every prompt or model change.
      ```

      The upgrade came from questions, not extra technology. Notice the failure line picks a graceful fallback, and the measure line defines "good" before any prompt is written. That's the pattern to repeat in every round.
  - title: The last week before a loop
    body: |-
      Preparation in the final week should be rehearsal, not new material.

      - **Days 1 and 2.** Write your one-minute introduction and five STAR stories. Say each aloud and time it. Cut until each story fits two minutes.
      - **Day 3.** Prepare the deep dive: the diagram, three decisions with rejected options, the numbers, one failure, and what you'd change. Have a friend ask "why?" five times in a row.
      - **Day 4.** Two timed coding problems in the language you'll use, talking aloud. One design problem end to end in 45 minutes, on paper.
      - **Day 5.** Applied AI: explain retrieval, evals, tool loops and prompt injection out loud, each in two minutes, without notes.
      - **Day 6.** Research the company: product, recent launches, the team's public writing. Write two or three questions per interviewer.
      - **Day 7.** Rest. Check the logistics: links, the editor you'll use, a quiet room, water.

      On the day, keep a notepad. Write the interviewer's name and the key requirements as they say them. Between rounds, don't replay the last one; reset for the next rubric.
pitfalls:
  - >-
    **Jumping to a solution in the first minute.** It feels decisive, but it signals mid-level
    thinking and risks solving the wrong problem. Ask two or three questions about users,
    scale and how wrong an answer may be, then design.
  - >-
    **Naming tools instead of outcomes.** "We moved to a vector database" says nothing about
    what changed. Say the result: answers found the right passage 20% more often, or
    latency halved.
  - >-
    **Treating the deep dive as a tour.** Walking through every component uses the time and
    shows no judgement. Lead with the two or three decisions that mattered and the options
    you rejected.
  - >-
    **Waiting to be asked about failure and measurement.** The interviewer notes whether you
    raised them unprompted. Close every design answer with "here's how it fails, and here's
    how I'd know it works".
  - >-
    **Assuming AI tools are allowed, or banned.** Rules differ by company and by round. Ask
    the recruiter, and if unsure in the room, ask the interviewer before you open an
    assistant.
  - >-
    **Silence while thinking.** A long silence gives the interviewer nothing to write down.
    Say what you're weighing, briefly, then think.
interview:
  - question: Walk me through a system you built that you're proud of.
    answer: |-
      **What they're really asking:** did you make real decisions, can you explain them, and do you know their costs?

      **How to answer:** lead with the problem and your decision, not the architecture. The problem and who it hurt, in a sentence. What you owned. The key choice, the option you rejected and the evidence, such as latency or cost measured on real data. How you handled the cases the system gets wrong. The result, with a number. Then offer the diagram and let them pick where to dig, and name the trade-off you accepted and when you'd revisit it.

      **Avoid** a tour of every component, and a team system where you can't say which decisions were yours.
  - question: How would you know if a prompt change made our assistant worse?
    answer: >-
      I'd run it against a fixed eval set before it ships and compare scores with the
      current prompt. The set is a few hundred real questions with known good answers,
      including ones the documents can't answer, since that's where invented answers show
      up. I'd score retrieval and answers separately: did it find the right passage, and did
      the answer stick to it. The eval runs in CI, and a drop past an agreed threshold blocks
      the release. After launch I'd watch signals like thumbs-down rate and hand-offs to
      humans. The limit: a fixed set goes stale, so I'd add a sample of new real questions
      every month, or the score drifts away from what users actually ask.
  - question: What's the difference between a senior engineer and a mid-level one?
    answer: >-
      A senior engineer is trusted with ambiguity and with other people's outcomes, not only
      harder tickets. They take a vague problem and make it concrete: requirements, numbers,
      a plan with trade-offs. They see failure modes before they happen and build the
      measurement in. And their impact reaches past their own code, through reviews, design
      docs, mentoring, and saying no to work that shouldn't be done. For example, stopping a
      feature because the eval showed it made answers worse is senior work, even though no
      code shipped. The caveat is that titles differ between companies, so I'd ask what
      senior means on your team specifically.
  - question: Do you have any questions about how this interview process works?
    answer: >-
      Yes, and I'd ask them early, ideally on the recruiter call. What rounds are in the
      loop, and what does each one focus on? Is any round done with an AI assistant, and
      which tools are allowed where? Is there a take-home, and roughly how long should it
      take? Who will I meet, and in what roles? Knowing the format lets me prepare the right
      thing: a deep dive needs a rehearsed system, a pair-programming round needs a working
      local setup. It's a normal question, and recruiters generally welcome it because a
      prepared candidate makes the loop more useful for both sides.
