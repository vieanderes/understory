term: interface
short: A named description of an object's shape, written with its own keyword, that other declarations can extend.
explain: |
  `interface User { name: string; email: string }` names a shape. Anything with those
  properties fits it. Another interface can build on it with `extends`.

  Interfaces with the same name in one scope merge into one, which libraries use to let you
  add fields. For day-to-day object shapes, an interface and a type alias are close to
  interchangeable. Pick one style for the codebase and stick with it.
analogy: A recipe card listing ingredients. Any dish with those ingredients matches the card.
example:
  language: ts
  code: |
    interface User {
      name: string;
      email: string;
    }
    interface Admin extends User {
      permissions: string[];
    }
usage: Export the props interface, so the parent can build the object with types.
twin:
  term: type-alias
  difference: An interface describes only object shapes and can be reopened to add fields. A type alias names any type at all, including unions, but can't be reopened.
related:
  - type-alias
  - structural-typing
level: 1
lessons:
  - ts.everyday-types
