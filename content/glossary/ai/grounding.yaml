term: grounding
aka:
  - grounded
short: Making a model answer only from the sources it was given, and checking each claim against them.
explain: |
  A model happily mixes what it read in your documents with what it half-remembers from
  training. An answer is grounded when every claim traces back to a source you handed it.

  You ask for citations, then check them: does the quoted passage support the sentence? A
  grounding check is useful only if a weak score changes what happens next. The app might
  say "I couldn't find that" instead of answering.
analogy: A journalist's footnotes. Each claim points at the interview or document it came from, so an editor can check it.
usage: The answer sounds right, but it isn't grounded; the cited passage says the opposite.
