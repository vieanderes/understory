# Path: agents in production. Schema: fastTrackSchema in src/core/content/notes.ts.
title: "Agent engineering: agents that act and stay safe"
name: Agent engineering
order: 6
promise: Build agents that run many steps on their own, use tools well, keep people in charge and prove they work.
outcomes:
  - Wrap a model in a harness that owns permissions, budgets, state and resume
  - Keep context sharp, design tools a model uses well and give an agent memory that helps
  - Choose between one agent, a workflow and several agents, and put the person in the right place
  - Measure an agent with trajectory checks and pass^k, and watch it in production
decision: Will you build agents that act on their own over many steps?
readyWhen:
  - You can write an agent loop that stops cleanly on budget, loops and stalls, and resumes without repeating a side effect.
  - You can redesign a set of tools so a model picks the right one and recovers from errors.
  - You can say where approval belongs in a workflow and how to stop rubber-stamping.
  - You can explain pass@k and pass^k, and grade a trajectory as well as an outcome.
  - You can find the costly looping run in a set of traces.
  - You can give an agent a standing goal on a pull request with gates it can't cross.
proof:
  title: An agent, measured
  evidence:
    - An agent with a permission gate, budgets and resume
    - An eval set with trajectory checks and a pass^k figure
    - A trace view that shows cost per run and the failure classes
    - A note on where people approve, and why there
coverage:
  covered: [Harness and loops, Context, tools and memory, Orchestration, Human in the loop, Agent evals and tracing]
  partial: [Fine-tuning agents, Computer use]
  outside: [Training models, Robotics]
summary: >-
  Starts where AI engineering stops: agents that act over many steps, with tools, memory and
  people in the loop.
method:
  - Start with the agent lessons in AI engineering if the agent loop is new to you.
  - Do the lesson in the app, then read its notes and its Before you ship list.
  - Rebuild one challenge a week later without the lesson open.
shapes:
  - label: Agent design
    text: >-
      The task and its success check first, then whether it needs an agent at all, the tools by
      risk, where a person approves, the budgets, and how you'll measure and watch it.
days:
  - title: The harness and the loop
    why: >-
      The code around the model decides what it may do, when it stops and how it survives a
      crash.
    artifact: "A harness with a permission gate, budgets and resume"
    must: [agents.the-harness, aisys.agent-harness, agents.long-running-loops]
    should: [ai.agents, interview.agent-build, aisys.coding-agents, aisys.agent-workbench]
  - title: Context, tools and memory
    why: >-
      What the model sees, what it can call and what it remembers decide most of its quality.
    artifact: "A compacted context, a redesigned tool and a memory with write rules"
    must: [agents.context-at-scale, agents.tool-design, agents.memory, aisys.mcp-servers]
  - title: Many agents and the human
    why: >-
      When to split work across agents, what an agent may touch, and where a person decides.
    artifact: "An approval policy and a ranked review queue"
    must: [agents.orchestration, agents.what-an-agent-may-touch, agents.human-in-the-loop, aisys.guardrails]
  - title: Prove it and watch it
    why: >-
      An agent users rely on has to succeed every time, not once in five. Measure that, watch
      it run, and launch what it builds as an experiment you can take back.
    artifact: "pass^k on an eval set and a trace review"
    must: [agents.evals-for-agents, agents.watching-agents, agents.babysitting-a-pr, judgment.ready-to-launch]
    should: [aisys.evals-in-depth, aisys.llmops]
    tests:
      - { test: agent-screen }
      - { task: scripted-agent }
      - { task: tool-call-check }
      - { task: redact-records }
      - { task: eval-scorer }
