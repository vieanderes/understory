term: traceback
aka:
  - Python traceback
short: The report Python prints when an error escapes, listing each call that led to it.
explain: |
  A program crashes and prints a wall of red text. It's tempting to read the first line
  and panic. Read it from the bottom instead.

  The last line names the exception and its message. Above it, each frame shows a file, a line number and the code. They run from the outermost call down to where it broke.
  The bug is often a few frames up, in your code, where a bad value went in. With
  `raise ... from err` you get two tracebacks chained, showing the original cause too.
analogy: A trail of footprints in snow. The last print is where you fell; the ones before show how you got there.
example:
  language: text
  code: |
    Traceback (most recent call last):
      File "report.py", line 12, in <module>
        main()
      File "report.py", line 8, in main
        avg = total / len(rows)
    ZeroDivisionError: division by zero
usage: Paste the full traceback into the ticket, not only the last line.
related:
  - context-manager
level: 1
lessons:
  - python.errors-and-files
