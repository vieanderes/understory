id: react.state-and-events
title: State and events
objective: "Respond to clicks with event handlers, remember values with `useState`, and follow the rules every hook shares."
level: essential
minutes: 10
concepts: [react.events, react.state, react.rules-of-hooks]
prerequisites: [react.props-and-composition]
opening:
  text: >-
    You'll make a component respond to clicks and remember what happened. It's the moment a
    React page stops being a picture and starts being an app.

steps:
  - type: prose
    id: event-handlers
    body: |-
      In chapter 3 you wrote `addEventListener("click", ...)`. In React you hand the function
      to a prop instead:

      ```jsx
      function SaveButton() {
        function save() {
          console.log("Saved");
        }
        return <button onClick={save}>Save</button>;
      }
      ```

      That function is an **event handler**. React calls it on each click. The names are
      camelCase: `onClick`, `onChange`, `onSubmit`.

  - type: bug-hunt
    id: hunt-called-handler
    concept: react.events
    difficulty: 2
    language: jsx
    code: |
      function SaveDraft({ draft }) {
        function save() {
          console.log("Saved", draft);
        }
        return <button onClick={save()}>Save draft</button>;
      }
    prompt: >-
      The console says `Saved` the moment the page loads. After that, clicking Save draft does
      nothing. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`save()` runs while drawing, instead of on click'
        correct: true
        feedback: >-
          Right. The brackets call it now. `onClick={save}` hands React the function itself.
      - text: '`save` must be written outside the component'
        feedback: >-
          Handlers usually live inside, so they can read props like `draft`. The brackets are
          the trouble.
      - text: It should be `onclick`, all lowercase, as in HTML
        feedback: >-
          React's names are camelCase: `onClick`. The handler did run, but at the wrong time.
    fix: |
      function SaveDraft({ draft }) {
        function save() {
          console.log("Saved", draft);
        }
        return <button onClick={save}>Save draft</button>;
      }

  - type: prose
    id: plain-variable-picture
    body: >-
      To pass an argument, wrap the call in an arrow: `onClick={() => remove(id)}`.


      Now a counter. Remember that a component is a function. To redraw it, React calls it
      again, which **re-renders** it. A plain `let` inside starts over on every call. And
      changing it doesn't tell React to redraw anything.

  - type: predict-output
    id: predict-let-counter
    concept: react.state
    difficulty: 2
    language: jsx
    code: |
      function RepCounter() {
        let reps = 0;
        return (
          <button onClick={() => { reps = reps + 1; }}>
            {reps} reps
          </button>
        );
      }
    question: You click the button three times. What does it show?
    choices:
      - text: '`0 reps`'
        correct: true
        feedback: >-
          Right. `reps` reaches 3, but nothing asked React to redraw.
      - text: '`3 reps`'
        feedback: >-
          The variable does reach 3. The button still shows the 0 it was drawn with.
      - text: '`1 reps`'
        feedback: >-
          Each click adds to the same variable, so it gets to 3. But the button never redraws.

  - type: prose
    id: use-state
    body: |-
      **State** is a value React remembers for a component between renders:

      ```jsx
      const [reps, setReps] = useState(0);
      ```

      `useState(0)` starts it at 0 and returns two things: the value, and a **setter**.
      Calling `setReps(reps + 1)` stores the new value and re-renders.

      `useState` is a **hook**: a React function, named with `use`, that gives a component
      a React feature.

  - type: playground
    id: fix-rep-counter
    concept: react.state
    difficulty: 2
    prompt: >-
      Here's the counter from before. Click it: it stays at 0. Give it state with `useState`,
      so each click adds a rep.
    jsx: |
      import { useState } from "react";

      export default function RepCounter() {
        let reps = 0;
        return (
          <button onClick={() => { reps = reps + 1; }}>
            {reps} reps
          </button>
        );
      }
    checks:
      - label: The button starts at 0 reps
        selector: button
        text: 0 reps
      - label: Three clicks show 3 reps
        actions: [{ click: button }, { click: button }, { click: button }]
        selector: button
        text: 3 reps
    solution:
      jsx: |
        import { useState } from "react";

        export default function RepCounter() {
          const [reps, setReps] = useState(0);
          return (
            <button onClick={() => setReps(reps + 1)}>
              {reps} reps
            </button>
          );
        }
    hints:
      - Swap the `let reps = 0;` line for a `useState` line.
      - '`const [reps, setReps] = useState(0);` gives you the value and its setter.'
      - In the click handler, call `setReps(reps + 1)` instead of changing `reps`.

  - type: prose
    id: rules-of-hooks
    body: >-
      React doesn't know your state by name. It counts: the first `useState` call, the
      second, and so on. So the calls must happen in the same order on every render.


      That gives the **rules of hooks**. Call hooks at the top level of a component. Never
      inside an `if`, a loop, or after an early `return`. And only call them from
      components, or from your own hooks.

  - type: ai-review
    id: review-hook-after-return
    concept: react.rules-of-hooks
    difficulty: 3
    language: jsx
    request: Show a recipe with a servings picker. Say Loading until the recipe arrives.
    flawClass: edge-case
    code: |
      function RecipeCard({ recipe }) {
        const [saved, setSaved] = useState(false);
        if (!recipe) return <p>Loading</p>;
        const [servings, setServings] = useState(2);
        return (
          <div>
            <h2>{recipe.name}, serves {servings}</h2>
            <button onClick={() => setServings(servings + 1)}>More</button>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. Its test passes a recipe straight away, and all is well. In the
      app the recipe arrives a moment later, and the page crashes. Tap the line at fault.
    lines: [4]
    reasons:
      - text: This hook only runs once the recipe is there
        correct: true
        feedback: >-
          Yes. One hook, then two: React throws. Move it above the `if`.
      - text: '`!recipe` should be `recipe === undefined`'
        feedback: >-
          Both catch the missing recipe. The crash comes after, when a new hook appears.
      - text: '`servings + 1` needs a limit'
        feedback: >-
          A cap would be nice, but the crash happens on the first render with a recipe.
    verify:
      question: Which test would have caught this before the app did?
      choices:
        - text: Render with no recipe, then pass one in
          correct: true
          feedback: >-
            Yes. That's the app's order, and the hook count changes between them.
        - text: Render with a recipe straight away
          feedback: >-
            That's the test it already passed. Every render calls both hooks there.
        - text: Click More three times
          feedback: >-
            Clicks only happen once a recipe is showing. The crash comes before any click.
    fix: |
      function RecipeCard({ recipe }) {
        const [saved, setSaved] = useState(false);
        const [servings, setServings] = useState(2);
        if (!recipe) return <p>Loading</p>;
        return (
          <div>
            <h2>{recipe.name}, serves {servings}</h2>
            <button onClick={() => setServings(servings + 1)}>More</button>
          </div>
        );
      }

  - type: code-challenge
    id: build-password-toggle
    concept: react.state
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      A password field has a Show button that should reveal what you typed. It uses a plain
      variable, so clicking does nothing.


      Make Show switch the input's `type` from `password` to `text`, and the button to say
      Hide. Hide switches both back. Typed text must stay.
    hints:
      - Look at `visible`. It changes on click, but does anything tell React to redraw?
      - '`useState(false)` keeps `visible` between renders, and its setter redraws.'
      - "Start with `const [visible, setVisible] = useState(false);`, then call `setVisible(!visible)` on click."

  - type: explain-back
    id: explain-setter-not-variable
    concept: react.state
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why does `reps = reps + 1` leave the page unchanged, while `setReps(reps + 1)` updates
      it?
    rubric:
      - React redraws a component by calling its function again, a re-render.
      - A plain variable starts over on every call, and changing it doesn't ask for a re-render.
      - The setter stores the value with React and asks for a re-render, which reads the new value.
    modelAnswer: >-
      React only changes the page when it re-renders, which means calling my component
      again. Changing a plain variable doesn't ask for that, and on the next call it starts
      from 0 anyway. `setReps` hands the new value to React, which keeps it between renders
      and re-renders. This time `useState` returns the new number, and the button shows it.

recap:
  - Pass a function to `onClick` and friends, without calling it.
  - Remember a value between renders with `useState`, and change it with its setter.
  - Call hooks at the top level, in the same order on every render.

recall:
  - id: card-handler-brackets
    concept: react.events
    front: What's the difference between `onClick={save}` and `onClick={save()}`?
    back: >-
      The first hands React the function to call on click. The second calls it while
      rendering and passes its result.
  - id: card-use-state
    concept: react.state
    front: What does `useState(0)` return, and what does the second item do?
    back: >-
      The current value and a setter. Calling the setter stores a new value and re-renders
      the component.
  - id: card-what-a-hook-is
    concept: react.rules-of-hooks
    front: What is a hook?
    back: >-
      A React function whose name starts with `use`, like `useState`, that gives a component
      a React feature.
  - id: card-hook-order
    concept: react.rules-of-hooks
    front: Why can't a hook sit inside an `if` or after an early `return`?
    back: >-
      React matches hooks by the order they're called. A render that skips or adds one breaks
      the match, and React throws.

