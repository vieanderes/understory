term: bug
aka: [software bug, defect]
short: A mistake in a program that makes it do something other than what you meant.
explain: |
  Sometimes the computer stops with an error. Often it doesn't. It runs to the end and gives
  a wrong answer, and nothing warns you. Either way, the cause is a mistake in the code.

  To find one, stop guessing. Decide what each value should be, then watch what it really
  is. The first place they differ points at the line with the mistake.
analogy: A wrong step in a recipe. The oven doesn't complain, and the cake comes out flat.
usage: It's not a bug in the library, because we're passing the date as a string.
twin:
  term: runtime-error
  difference: A runtime error is the computer stopping because it couldn't carry out a line. A bug is the mistake behind it, and many bugs cause no error at all.
related: [debugger, stack-trace, runtime-error, regression]
level: 1
lessons: [basics.watching-code, basics.debugging]
