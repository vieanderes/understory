# Path: the AI-assisted online coding test. Schema: fastTrackSchema in src/core/content/notes.ts.
title: AI-assisted coding tests
name: AI coding tests
order: 7
promise: Solve timed tasks against hidden tests, with the AI as an assistant you steer, not a crutch.
outcomes:
  - Read a task, list its edge cases and write a test table before any code
  - Prompt the assistant to clarify, look up syntax, suggest tests and review, never to solve
  - Proofread AI code for the slips that fail hidden tests
  - Solve the counting, prefix-sum and maximum-slice tasks online assessments favour in O(n)
  - Leave a transcript and a header comment that show how you think
decision: Is your next step an online coding test with an AI assistant in the editor?
readyWhen:
  - You can solve a counting, prefix-sum or maximum-slice task in O(n) in under 25 minutes.
  - You can write a test table with the edge cases before you write any code.
  - You can run a full chat with the assistant in about five prompts, none of them asking for the solution.
  - You can spot an off-by-one, a hidden O(n) call in a loop and a mutated input in AI-written code.
  - You can finish a timed mock with every task submitted and a header comment on each.
proof:
  title: A timed mock, submitted like the real test
  evidence:
    - Three tasks submitted inside 90 minutes
    - A test table and a header comment on each task
    - An AI chat of about five prompts, none asking for the answer
    - The complexity of each solution, stated and checked on a large input
coverage:
  covered: [The AI-assisted test format and scoring, Counting and prefix-sum tasks, Prompting the assistant and proofreading its code]
  partial: [Dynamic programming, Graph tasks]
  outside: [SQL and regex tasks in depth, Proctoring rules of other platforms]
summary: >-
  For an online coding test with an AI assistant in the editor. The method first, then the task
  families the test draws on, then two timed mocks.
method:
  - Do the lesson in the app, then read its notes.
  - Type each solution again in an empty file and run it. Reading code is not writing it.
  - For every task, write the Clarify, Tests and Review prompts before you look at the answer.
  - Before the real test, sit a screen in the AI-assisted coding simulator under Practise. It looks and scores like the real test.
shapes:
  - label: One task, start to finish
    text: >-
      Restate it, list edge cases, write the test table, name the pattern and its Big-O, code,
      break it with the edges and a large input, then add the header comment and submit.
  - label: The AI chat
    text: >-
      Clarify the task, look up syntax, ask for test ideas, ask for a review that lists
      problems. Never paste the task and ask for the answer.
  - label: Out of time
    text: >-
      Submit the correct slow version with a comment naming the faster approach. A passing
      O(n²) beats a failing O(n).
days:
  - title: The method
    why: >-
      Reviewers score how you work as much as the result: the chat, the tests and the code.
      Learn the routine once and use it on every task.
    artifact: "A routine for one task, and the prompts to run it"
    must: [interview.online-assessments, interview.reading-the-task, interview.ai-assisted, algo.approach, interview.timed-strategy]
    should: [interview.landscape, cs.complexity]
    tests: [{ test: demo }, { test: screen-a, guided: true }]
  - title: The tasks
    why: >-
      Most online assessment tasks are counting, prefix sums, a running maximum or a hash map in
      disguise. These lessons drill the tasks candidates report.
    artifact: "Solutions to the task families, with tests"
    must: [algo.counting-and-leaders, algo.prefix-sums, algo.maximum-slice, algo.hash-map-patterns, interview.reported-tasks]
    should: [algo.two-pointers, interview.bug-fix-round]
    tests:
      - { test: screen-c }
      - { task: scoreboard }
      - { task: balanced-periods }
      - { task: biggest-climb }
      - { task: shelf-variety }
      - { task: rival-halves }
      - { task: distinct-magnitudes }
      - { task: cleaning-rooms }
      - { task: widest-triangle }
      - { task: two-prime-products }
      - { task: hilltop-masts }
      - { task: served-seats }
      - { task: fibonacci-hops }
      - { task: longest-nested-fragment }
      - { task: playlist-rotation }
      - { task: digit-countdown }
      - { task: room-bookings }
  - title: Timed practice
    why: >-
      The traps that fail hidden tests, then full tests under the clock with the whole routine.
    artifact: "Your scores on full timed tests"
    must: [interview.js-traps]
    tests:
      - { test: mock-a }
      - { test: mock-b }
      - { test: mock-c }
      - { test: ai-screen }
      - { lesson: interview.mock-levelled }
