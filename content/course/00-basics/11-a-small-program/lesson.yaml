id: basics.small-program
title: A small program
objective: Build a to-do list program from everything in this chapter.
level: essential
minutes: 10
concepts: [basics.program-design, basics.functions]
prerequisites: [basics.watching-code]
opening:
  text: >-
    You'll build a small to-do list program from scratch, using everything in this chapter.
    It's the moment separate ideas become a real program.

steps:
  - type: prose
    id: plan-first
    body: |-
      A program is a lot of small steps. Before writing, list what it must do:

      1. Keep a list of tasks.
      2. Add a task.
      3. Mark a task as done.
      4. Show the list.

      The list is an array of objects. Each other step becomes one small function. That's the
      whole trick of **breaking a problem down**.

  - type: parsons
    id: arrange-add-task
    concept: basics.program-design
    difficulty: 1
    language: js
    prompt: Build `addTask`. It adds a new, unfinished task to the list. One block doesn't belong.
    blocks:
      - id: open
        code: function addTask(title) {
        subgoal: Name the step
      - id: push
        code: 'tasks.push({ title: title, done: false });'
        indent: 1
        subgoal: Add to the list
      - id: close
        code: '}'
        subgoal: Name the step
    distractors:
      - id: replace-list
        code: 'tasks = { title: title, done: false };'
        feedback: >-
          That tries to replace the whole list with one task. `push` adds to it.

  - type: fill-blank
    id: fill-complete-task
    concept: basics.functions
    difficulty: 2
    language: js
    prompt: '`completeTask` marks the task at a position as done. Fill the gaps.'
    template: |
      function completeTask(index) {
        tasks[{{1}}].done = {{2}};
      }
    blanks:
      - key: '1'
        answer: index
      - key: '2'
        answer: 'true'
    bank: [index, title, 'true', 'false']

  - type: predict-output
    id: predict-show-list
    concept: basics.program-design
    difficulty: 2
    language: js
    code: |
      const tasks = [
        { title: "Buy milk", done: true },
        { title: "Call the dentist", done: false },
      ];
      for (const task of tasks) {
        if (task.done) {
          console.log(`[x] ${task.title}`);
        } else {
          console.log(`[ ] ${task.title}`);
        }
      }
    question: What does this show?
    choices:
      - text: '`[x] Buy milk`, then `[ ] Call the dentist`'
        correct: true
        feedback: >-
          Yes. A tick for the finished task, an empty box for the other.
      - text: '`[ ] Buy milk`, then `[x] Call the dentist`'
        feedback: >-
          `Buy milk` has `done: true`, so it gets the `[x]`.
      - text: Both lines start with `[x]`
        feedback: >-
          The `if` picks per task. Only the first task is done.

  - type: bug-hunt
    id: hunt-show-list
    concept: basics.program-design
    difficulty: 3
    language: js
    code: |
      function showList() {
        for (const task of tasks) {
          if (tasks.done) {
            console.log(`[x] ${task.title}`);
          } else {
            console.log(`[ ] ${task.title}`);
          }
        }
      }
    prompt: Every task shows `[ ]`, even the finished ones. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`tasks.done` reads the list, not the current task'
        correct: true
        feedback: >-
          Right. The list has no `done`, so the check always fails. Use `task.done`.
      - text: '`for...of` skips tasks that are done'
        feedback: >-
          `for...of` visits every item. The check inside reads the wrong thing.
      - text: The template literal hides the `x`
        feedback: >-
          The `[x]` line never runs, because line 3 checks the wrong name.
    fix: |
      function showList() {
        for (const task of tasks) {
          if (task.done) {
            console.log(`[x] ${task.title}`);
          } else {
            console.log(`[ ] ${task.title}`);
          }
        }
      }

  - type: code-challenge
    id: write-todo
    concept: basics.program-design
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Now build the whole program. The starter has the list and three empty functions.


      `addTask(title)` adds an unfinished task. `completeTask(index)` marks the task at that
      position as done. `showList()` shows each task on its own line, as `[x] title` when done
      or `[ ] title` when not.


      To watch it work, add calls at the bottom, like `addTask("Buy milk");` and
      `showList();`. Then run it and open Console.
    hints:
      - Write one function at a time. The steps above hold most of the code.
      - '`showList` needs a `for...of` loop with an `if` and an `else` inside.'
      - 'Start `addTask` with `tasks.push({ title: title, done: false });`'

  - type: explain-back
    id: explain-small-functions
    concept: basics.program-design
    difficulty: 3
    prompt: |-
      You built the to-do program as three small functions: `addTask`, `completeTask` and
      `showList`. Why split it up like that, not write one long block?
    rubric:
      - Each function does one job, so you can read and check it on its own.
      - A function can be called again whenever that job is needed.
      - You can fix or change one function without touching the others.
    modelAnswer: >-
      Each function does one clear job, so you can read it and test it on its own. You can call
      it again whenever you need that job done. And when something breaks, you know which small
      piece to open.

recap:
  - "Plan a small program before you write it."
  - "Keep tasks as a list of objects and add to it."
  - "Show each task differently when it is done."
recall:
  - id: card-plan
    concept: basics.program-design
    front: What's a good first step before writing a program?
    back: >-
      List what it must do, in small steps. Each step can become a function.
  - id: card-add-object
    concept: basics.functions
    front: How do you add a new task object to a `tasks` list?
    back: >-
      `tasks.push({ title: title, done: false });`
  - id: card-show-each
    concept: basics.program-design
    front: How do you show each task differently depending on whether it's done?
    back: >-
      Loop with `for...of`, and use `if (task.done)` with an `else` inside the loop.

references:
  - kind: docs
    title: Solve common JavaScript problems
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Solve_JavaScript_problems
    note: Common beginner mistakes and how to spot them.
    verified: true
  - kind: docs
    title: Functions
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/function-basics
    note: Includes advice on naming functions and keeping each one to one job.
    primary: true
    verified: true

deepDive: >-
  Already know this? This program keeps its data in a list that every function reads and
  changes. That's fine for a small program, but it gets risky as programs grow, because any
  function can change the list. Later chapters show other ways: passing data in, returning
  new data, and keeping state in one place.


  To make it last between visits, the list would need to be saved somewhere, such as a file
  or a database. That's where the Tooling and Backend chapters pick up.
