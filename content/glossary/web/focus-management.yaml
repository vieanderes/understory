term: focus management
aka: [focus trap, focus trapping]
short: Code that moves keyboard focus on purpose, such as into a dialog that opens and back out after.
explain: |
  Open a dialog and leave focus behind it, and a keyboard user tabs through a page they
  can't see. When content appears, move focus to it. When it goes, put focus back where it
  was.

  A modal also keeps focus inside until it closes, which is the focus trap. The native
  `dialog` with `showModal()` does all of this and makes the page behind inert. A
  hand-built modal must rebuild every part, and usually misses one.
analogy: An usher at a theatre. They walk you to your seat, keep you there during the show, and lead you back to your door.
example:
  language: js
  code: |
    const dialog = document.querySelector("dialog");
    openButton.addEventListener("click", () => {
      dialog.showModal(); // focus moves in, the page behind goes inert
    });
    // when it closes, focus returns to openButton
usage: Closing the dialog drops focus at the top of the page, so the focus management needs fixing.
twin:
  term: focus-order
  difference: Focus management is your code moving focus on purpose when the page changes. Focus order is the route Tab follows on its own, set by the order of the HTML.
related: [focus-order, keyboard-navigation, aria-role]
level: 3
lessons: [design.accessible-widgets, design.keyboard-and-focus]
