deepDive: >-
  The attackers need a target that behaves like production without being it: a staging copy
  with realistic data shapes, fake payment keys and its own accounts. Give each attacker
  permission to create test bookings, and nothing that reaches real guests or real money.


  Independence is about inputs. Give each attacker the target, the intent in a sentence,
  its angle and the shape of a finding. Leave out the authoring chat, the design notes and
  the other attackers' reports. A different model or a different person helps too, because
  shared training means shared blind spots.


  Findings come back noisy. Some are duplicates, some are wrong, and some are real but
  small. A person triages: reproduce each blocker from its proof, then fix, accept or
  reject it. A finding without proof is a lead, not a verdict.


  The closing line ties the chapter together. Read core code line by line, and gate leaf
  code by its behaviour. Then, before launch, attack the whole product, because a sound
  diff can still meet a broken product.
