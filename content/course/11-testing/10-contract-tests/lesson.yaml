id: testing.contract-tests
title: Contract tests
objective: Check that a consumer and a provider agree on an API with consumer-driven contracts, and place them in the test pyramid.
level: advanced
minutes: 10
concepts: [testing.contract-tests, testing.consumer-driven-contracts, testing.test-pyramid]
prerequisites: [testing.doubles-and-integration, backend.api-evolution]
opening:
  text: >-
    You'll catch the change that breaks another team's service before it ships. No shared
    test environment, no slow end-to-end run across five services.

steps:
  - type: prose
    id: what-a-contract-test-is
    body: >-
      In lesson 5 a stub kept answering with `total` after the real API renamed it, and
      every test stayed green. A **contract test** closes that gap.


      The consumer, the code that calls an API, records each request it sends and the
      fields it reads. The provider, the service that answers, replays that record in its
      own build. If its real answer no longer fits, the provider's build fails.

  - type: bug-hunt
    id: hunt-breaking-change
    concept: testing.contract-tests
    difficulty: 1
    language: json
    code: |
      {
        "id": 42,
        "amount": 1299,
        "currency": "GBP",
        "status": "paid"
      }
    prompt: >-
      The checkout team's contract says an order has an integer `id`, an integer `total`
      and a string `currency`. This is the provider's new reply. Tap the line that fails
      the contract.
    lines: [3]
    reasons:
      - text: '`total` is gone, renamed to `amount`'
        correct: true
        feedback: >-
          Yes. Checkout reads `total`, so the provider's build fails before it deploys.
      - text: '`status` isn''t in the contract'
        feedback: >-
          Extra fields are fine. A consumer that doesn't read `status` can't break on it.
      - text: '`currency` should be a number'
        feedback: >-
          The contract asks for a string, and `"GBP"` is one. Look for a missing field.
    fix: |
      {
        "id": 42,
        "total": 1299,
        "currency": "GBP",
        "status": "paid"
      }

  - type: prose
    id: consumer-driven
    body: >-
      **Consumer-driven contracts** go one step further. Each consumer records only what it
      really uses, and every contract runs in the provider's build.


      So the provider may add fields freely, and may drop ones no consumer reads. Tools such
      as Pact do the recording and the replaying.

  - type: ai-review
    id: review-exact-values
    concept: testing.consumer-driven-contracts
    difficulty: 4
    language: js
    request: Write a Pact consumer test for fetching order 42.
    flawClass: logic
    code: |
      pact
        .given("order 42 exists")
        .uponReceiving("a request for order 42")
        .withRequest({ method: "GET", path: "/orders/42" })
        .willRespondWith({ status: 200, body: { id: 42, total: 1299, currency: "GBP" } });

      await pact.executeTest(async (server) => {
        const order = await getOrder(server.url, 42);
        expect(order.total).toBe(1299);
      });
    prompt: >-
      An assistant wrote this. The consumer test passes. The provider's build fails on every
      run: `Expected 1500 (Integer) to be equal to 1299 (Integer)`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: Plain values demand exact data, not its type
        correct: true
        feedback: >-
          Yes. Wrap them in matchers such as `integer(1299)`, so any whole number fits.
      - text: The provider state needs a different name
        feedback: >-
          The state was found and set up. The body then failed on the exact number.
      - text: The assertion should check `order.amount`
        feedback: >-
          The consumer reads `total`, so the assertion is right. The contract is too strict.
    fix: |
      pact
        .given("order 42 exists")
        .uponReceiving("a request for order 42")
        .withRequest({ method: "GET", path: "/orders/42" })
        .willRespondWith({ status: 200, body: { id: integer(42), total: integer(1299), currency: like("GBP") } });

      await pact.executeTest(async (server) => {
        const order = await getOrder(server.url, 42);
        expect(order.total).toBe(1299);
      });

  - type: prose
    id: where-contracts-sit
    body: >-
      Where do contract tests go in the test pyramid from lesson 2? In the middle, next to
      integration tests. Many fast unit tests sit below them, and a few end-to-end journeys
      above.


      Their job is to replace the slow, flaky tests that start every service to check they
      fit. Each pair of services is checked on its own, in seconds.

  - type: multiple-choice
    id: pick-where-checks-live
    concept: testing.test-pyramid
    difficulty: 3
    question: Five services must keep fitting together. Where should most of those checks live?
    choices:
      - text: Contract tests for each consumer and provider pair
        correct: true
        feedback: >-
          Right. Fast, run in each service's own build, and they name the pair that broke.
      - text: End-to-end tests with all five services running
        feedback: >-
          Keep a few for key journeys. As the main check they're slow and hard to debug.
      - text: Unit tests with a fake for each neighbour
        feedback: >-
          Fakes freeze each neighbour's API, as in the first step. Nothing checks them.

  - type: code-challenge
    id: write-mismatches
    concept: testing.contract-tests
    difficulty: 4
    language: ts
    prompt: >-
      Write `mismatches(shape, actual)`, a small contract matcher. A shape maps each field to
      `'number'`, `'string'`, `'boolean'` or a nested shape. Return a list of problems, in the
      shape's order.


      A missing field gives `'missing total'`. A wrong type gives `'total: expected number, got
      string'`. Nested fields use a dotted path, like `'missing customer.vip'`. Treat `null`
      and arrays as their own kinds. Extra fields in `actual` are fine.
    hints:
      - Recurse. A string shape checks one value, and an object shape walks its fields.
      - '`typeof null` is `''object''`, so check `null` and `Array.isArray` first.'
      - 'Start with a helper `kind(value)` that returns `''null''`, `''array''` or `typeof value`.'

  - type: explain-back
    id: explain-consumer-driven
    concept: testing.consumer-driven-contracts
    difficulty: 4
    prompt: >-
      Each contract records only what its consumer uses. Why does that let the provider
      change faster than one complete, shared schema?
    rubric:
      - Each contract lists only the fields its consumer reads.
      - The provider can add or drop anything no contract mentions.
      - A change fails the build only when some real consumer depends on it.
    modelAnswer: >-
      A complete schema treats every field as a promise, so any removal looks breaking. With
      consumer-driven contracts, the provider knows exactly which fields someone reads. It can
      add or remove the rest freely. Its build fails only when a real consumer would break.

recap:
  - Explain why a fake can hide a breaking API change.
  - Record a consumer contract and verify it in the provider's build.
  - Place contract tests in the pyramid, in place of cross-service end-to-end runs.
recall:
  - id: card-contract-test
    concept: testing.contract-tests
    front: What does a contract test check that a unit test with a fake cannot?
    back: >-
      That the real provider still answers the way the consumer expects, using a recorded
      contract replayed in the provider's build.
  - id: card-consumer-driven
    concept: testing.consumer-driven-contracts
    front: In consumer-driven contracts, what goes into each contract?
    back: >-
      Only the requests a consumer sends and the response fields it relies on.
  - id: card-matchers
    concept: testing.consumer-driven-contracts
    front: Why use type matchers like `integer(1299)` in a contract instead of plain values?
    back: >-
      Plain values demand the exact data, so the provider fails on its own test data. Matchers
      check the type and shape.
  - id: card-pyramid-place
    concept: testing.test-pyramid
    front: Where do contract tests sit in the test pyramid, and what do they replace?
    back: >-
      In the middle, beside integration tests. They replace most cross-service end-to-end tests.

