id: fibonacci-hops
title: FibonacciHops
topic: fibonacci
difficulty: medium
type: algorithmic
recommendedMinutes: 35
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A hopping robot crosses a track of N cells, numbered from 0 to N − 1. It starts just
  before the track, at position −1, and must finish just after it, at position N. Some
  cells hold landing pads: A[I] = 1 if cell I has a pad, and 0 if it has none.

  The robot only moves forward, and every hop has a Fibonacci length: 1, 2, 3, 5, 8, 13 and
  so on, where each length is the sum of the two before it. A hop must end on a pad or at
  position N.

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the fewest hops that take the robot from
  position −1 to position N. If it cannot get there, the function should return −1.

  For example, given A = [1, 0, 1, 1, 0, 0, 1, 0, 0, 1], the function should return 2: a hop
  of 3 lands on cell 2, and a hop of 8 reaches position 10.

  Given A = [0, 0, 0, 0, 0], the function should return −1, because 6 is not a Fibonacci
  number.

  Given A = [], the function should return 1.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..100,000];
  - each element of array A is 0 or 1.
examples:
  - { args: [[1, 0, 1, 1, 0, 0, 1, 0, 0, 1]], expected: 2 }
  - { args: [[0, 0, 0, 0, 0]], expected: -1 }
  - { args: [[]], expected: 1 }
tests:
  - name: extreme_small
    description: empty track and one cell
    group: correctness
    cases:
      - { args: [[0]], expected: 1 }
      - { args: [[1]], expected: 1 }
      - { args: [[0, 0, 0]], expected: -1 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [[0, 1, 0, 0, 0, 1, 0, 0]], expected: -1 }
      - { args: [[0, 0, 1, 0, 0, 0, 1, 0, 0, 0, 0, 0, 1]], expected: 2 }
  - name: all_pads
    description: every cell has a pad
    group: correctness
    cases:
      - generate: { seed: 301, args: [{ kind: constant, n: 30, value: 1 }] }
      - generate: { seed: 302, args: [{ kind: constant, n: 1000, value: 1 }] }
  - name: small_random
    description: random pads, N = 50
    group: correctness
    cases:
      - generate: { seed: 303, args: [{ kind: ints, n: 50, min: 0, max: 1 }] }
      - generate: { seed: 304, args: [{ kind: ints, n: 60, min: 0, max: 1 }] }
  - name: medium_random
    description: random pads, N = 3,000
    group: correctness
    cases:
      - generate: { seed: 305, args: [{ kind: ints, n: 3000, min: 0, max: 1 }] }
  - name: large_random
    description: random pads, N = 100,000
    group: performance
    cases:
      - generate: { seed: 306, args: [{ kind: ints, n: 100000, min: 0, max: 1 }] }
  - name: extreme_large
    description: dense pads, N = 100,000
    group: performance
    cases:
      - generate: { seed: 307, args: [{ kind: constant, n: 100000, value: 1 }] }
      - generate: { seed: 308, args: [{ kind: repeat, times: 33333, unit: [0, 0, 1] }] }
