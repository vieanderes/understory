    authors: The PostgreSQL Global Development Group
    venue: PostgreSQL 17 documentation
    url: https://www.postgresql.org/docs/17/transaction-iso.html
    note: The same lost update seen from the database, and the isolation levels that stop it.
    primary: true
    verified: true

deepDive: >-
  The coupon output is from Node 24. Both calls passed the check, then both wrote, and
  `usesLeft` ended at -1. The shared-promise version of `getToken` made 1 fetch for 100
  callers. The original made 100.


  "Act before you await" works inside one process because one thread runs a stretch of
  synchronous code without interruption. That's called run-to-completion. With worker
  threads and shared memory, even `count + 1` can be split. With several server copies, the
  shared state is the database, and the fix belongs there: an atomic `UPDATE`, a `UNIQUE`
  constraint, or the version check in the next lesson.


  A real token expires. A fuller `getToken` keeps the token with its expiry time, and
  starts one shared refresh a little before it runs out. The same single-flight idea stops
  a cache stampede, where a popular cache entry expires and every request rebuilds it at
  once.


  Acting first has a cost: if the charge fails, you must undo the write. The lesson "Holds
  that expire" turns that into a design.


  A token that many jobs refresh at once has the same gap, with a nastier failure: the
  provider may revoke the whole connection. The lesson "Tokens that expire" closes it with a
  single-flight refresh.
