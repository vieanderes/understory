summary: >-
  Git history is documentation that can't go out of date, because it's attached to the code
  it describes. A professional history is a series of **atomic commits**: each makes one
  change, leaves the code working, and has a short imperative subject with a body that says
  why. A professional pull request is small, tested, and described so a reviewer knows what
  changed, why, how it was checked and where to look.


  The lesson covers atomic commits, `git add -p`, the five-part PR description and the
  README. These notes add what happens around them: the full shape of a commit message,
  Conventional Commits, tidying a branch with fixup commits and interactive rebase, the
  trade-offs between merge commits, rebasing and squash merging, finding a regression with
  `git bisect run`, and how teams keep pull requests small and reviews fast.


  The payoff is practical. A clean history makes `git blame`, `git revert` and `git bisect`
  useful, makes release notes cheap, and makes your pull requests the ones reviewers pick up
  first.
remember:
  - An atomic commit makes one logical change and leaves the build and tests passing, so it can be reviewed, reverted or bisected on its own.
  - A commit subject is imperative and short, about 50 characters and never over 72, and completes "If applied, this commit will...".
  - The body, after a blank line, explains why the change was needed and what it affects, because the diff already shows what changed.
  - Rewrite only commits that nobody else has built on, and push rewritten branches with `--force-with-lease`, never plain `--force`.
  - '`git commit --fixup=<commit>` plus `git rebase -i --autosquash` folds review fixes into the commit they belong to.'
  - A squash merge turns a whole pull request into one commit on main, which keeps main tidy but discards the branch's individual commits.
  - '`git bisect run <command>` binary-searches the history for the first bad commit, using the command''s exit code: 0 is good, 125 is skip, other codes up to 127 are bad.'
  - Small pull requests get faster and better reviews, so split large work into a stack of reviewable steps and open a draft early.
sections:
  - title: The whole commit message
    body: |-
      A message has three parts: a subject, a blank line, and a body wrapped at about 72
      characters. Trailers go at the end.

      ```text
      Round basket totals to the nearest penny

      Discounts are stored as fractions, so a 15% discount on £3.33 gave a
      total of £2.8305. The payment provider rejects amounts with more than
      two decimal places, and about 1 in 200 checkouts failed.

      Round once, when the total is computed, rather than at each display
      site, so the charged amount and the shown amount always agree.

      Fixes #482
      Co-authored-by: Sam Lee <sam@example.com>
      ```

      The subject says what the commit does, in the imperative, with no full stop. Aim for 50
      characters, because lists of commits show only the first line and many tools shorten it;
      GitHub cuts it at 72. The body answers the questions the diff can't: what was wrong,
      why this approach, what else it affects. Not every commit needs one. "Fix typo in
      README" is complete on its own.

      `Fixes #482` is a GitHub keyword. When the pull request containing it merges into the
      default branch, the issue closes. `Closes` and `Resolves` work the same way.
      `Co-authored-by:` credits a pair on GitHub.

      **Conventional Commits** is a convention some teams adopt on top:

      ```text
      feat(cart): add gift card payments
      fix(checkout): round totals to the nearest penny
      feat(api)!: remove the v1 orders endpoint
      ```

      The type comes first, then an optional scope in brackets. The common types are `feat`,
      `fix`, `docs`, `refactor`, `test` and `chore`. A `!` or a `BREAKING CHANGE:` footer
      marks a breaking change. Tools read these to pick the next version number, where a
      `fix` is a patch release, a `feat` a minor one and a breaking change a major one, and to
      write the changelog. Use it where a repository already does, or where automated
      releases need it. A plain imperative subject is fine everywhere else. Follow the
      repository's existing style first.
  - title: Tidying a branch before review
    body: |-
      Real work is messy: you commit, a test fails, you fix the earlier commit. Before
      asking for review, shape the branch into the story you'd want to read. The tool is
      **interactive rebase**, which replays your commits and lets you edit the list.

      A fixup commit records which commit a fix belongs to, and `--autosquash` moves it
      there:

      ```bash
      $ git log --oneline
      6fd23cc fixup! Add discount to cart total
      b50b6b0 Add formatPrice helper
      b870f05 Add discount to cart total
      201bc8d Add cart total
      ```

      That fixup came from `git commit -a --fixup=b870f05`. Then:

      ```bash
      $ git rebase -i --autosquash main
      $ git log --oneline
      e67f479 Add formatPrice helper
      9e95a34 Add discount to cart total
      201bc8d Add cart total
      ```

      The editor opens with a to-do list, one line per commit, already reordered so the
      fixup sits under its target. Each line starts with a command you can change: `pick`
      keeps a commit, `reword` edits its message, `edit` stops so you can amend or split it,
      `squash` merges it into the one above and combines messages, `fixup` merges it and
      drops its message, and `drop` deletes it. Reordering lines reorders commits.

      Every rewritten commit gets a new hash, so the rule is to rewrite only what nobody
      else has built on: your own branch, before or during review. To update the remote
      branch, use `git push --force-with-lease`. Unlike `--force`, it refuses if the remote
      branch has moved since you last fetched it, so you can't wipe out a teammate's push.

      For the most recent commit, `git commit --amend` is the shortcut. If a rebase goes
      wrong, `git rebase --abort` returns to where you started, and `git reflog` lists where
      the branch pointed before, so almost nothing is truly lost.
  - title: Merge commits, rebase and squash merges
    body: |-
      A pull request can land on main in three ways, and each leaves a different history.
      Here is one branch, "discount", with two commits, while main gained a README.

      ```text
      Merge commit (git merge --no-ff):
      *   8f9b96c Merge branch 'discount'
      |\
      | * e67f479 Add formatPrice helper
      | * 9e95a34 Add discount to cart total
      * | dc53bd8 Add README
      |/
      * 201bc8d Add cart total

      Rebase, then fast-forward:
      * 0016128 Add formatPrice helper
      * d4d2e1a Add discount to cart total
      * dc53bd8 Add README
      * 201bc8d Add cart total

      Squash merge:
      * cf47027 Add discount to cart total (#12)
      * dc53bd8 Add README
      * 201bc8d Add cart total
      ```

      A **merge commit** keeps every commit and records when the branch joined. It's the
      truest record, but a busy repository's graph becomes hard to read. **Rebasing** replays
      the branch's commits on top of main, with new hashes, for a straight line that keeps
      each atomic commit. It's worth it when the commits were tidied with care. A **squash
      merge** combines the whole pull request into one commit, titled after the pull request.
      Main stays one commit per change, each revertable in one step, and messy work-in-progress commits
      vanish. The cost is that the individual steps are gone from main, so bisect can only
      narrow a bug down to the whole pull request.

      Many teams squash by default because it forgives messy branches. Teams that value
      atomic commits rebase instead. GitHub lets a repository allow any of the three, and
      many allow only one so the history stays consistent.

      Keeping your branch current is a separate choice. `git rebase main` on your own
      branch gives a clean diff. `git merge main` into it is safe when others share the
      branch, because it rewrites nothing.
  - title: Finding the commit that broke it with bisect
    body: |-
      A test that passed last month fails now, and there are hundreds of commits in between.
      `git bisect` does a binary search: you mark one good and one bad commit, it checks out
      the middle, you say good or bad, and it halves the range each time. A thousand commits
      take about ten steps.

      With a command that exits 0 on success, git runs the whole search for you:

      ```bash
      $ git bisect start HEAD HEAD~20     # bad first, then good
      $ git bisect run node total.test.js
      running 'node' 'total.test.js'
      ...
      b95e87d33d7ba0f6bccc5972c07275dfaccc7e8d is the first bad commit
          Simplify total calculation
      bisect found first bad commit
      $ git bisect reset
      ```

      On 20 commits that took five test runs. The exit code decides: 0 means good, 125
      means this commit can't be tested so skip it, and any other code from 1 to 127 means
      bad. A small script that builds the project and returns 125 when the build fails keeps
      unrelated breakage from misleading the search. Always finish with `git bisect reset`,
      which returns you to where you started.

      This is where atomic commits pay off. If every commit builds and passes, bisect lands
      on a small change with a subject that says what it meant to do, and often the bug is
      plain from the diff. If the history is full of half-finished commits, many can't be
      tested, and the answer is a 2,000-line commit called "WIP". Once found,
      `git revert` on that commit adds a new commit that undoes it, which is safe on a shared branch because it
      rewrites nothing.
  - title: Small pull requests and a fast review loop
    body: |-
      Review quality falls as size grows. A reviewer reads a 50-line change closely and
      skims a 1,500-line one, approving it on trust. Small pull requests also merge sooner,
      conflict less and are easier to revert. A useful rule of thumb is a few hundred lines
      of real change at most, excluding generated files and lockfiles.

      Ways to keep them small:

      - Split by layer or step: add the database column, then the API that uses it, then
        the screen. Each lands and works on its own.
      - Separate refactoring from behaviour. A pull request that moves code and changes it
        hides the change inside the move.
      - Stack pull requests: the second targets the first's branch, and retargets to main
        when the first merges.
      - Hide unfinished features behind a flag, so partial work can merge safely.

      Open a **draft pull request** early, for example with `gh pr create --draft`. It
      runs CI and invites early comments on direction, without asking for approval. Mark it
      ready when the description is complete and checks pass.

      A repository can hold a template at `.github/pull_request_template.md`, which GitHub
      pre-fills into every new description, so the five questions from the lesson appear
      every time. A `CODEOWNERS` file requests reviews from the owners of the paths a change
      touches.

      On the author's side, review your own diff first, since it catches the stray debug line
      before anyone else sees it. Reply to every comment, push fixes as new commits during
      review so the reviewer can see what changed, and tidy with autosquash right before
      merging if the team rebases. On the reviewer's side, answer within a working day, lead
      with the questions that could change the design, and label optional comments as nits.
pitfalls:
  - "**Mixing a refactor and a behaviour change in one commit.** The reviewer can't see the behaviour change inside the moved code, and a revert takes both. Commit the refactor first with no behaviour change, then the change."
  - "**Describing the diff instead of the reason.** \"Change < to <=\" repeats what the diff shows. Say why: \"Include today in past bookings, because today's guests showed as upcoming.\""
  - "**Force-pushing a shared branch with `--force`.** It overwrites commits a teammate pushed. Use `--force-with-lease`, and never rewrite main or a branch others have built on."
  - "**Rebasing a branch someone else is working on.** Their copy still has the old commits, and the next pull creates duplicates. Merge main into shared branches instead, or agree before rewriting."
  - "**Committing work-in-progress to main's history.** \"WIP\" and \"fix again\" commits make bisect land on meaningless steps. Tidy with fixups and autosquash before merging, or squash merge."
  - "**Opening one huge pull request at the end.** It waits days for review and gets skimmed. Open a draft early and split the work into a stack of small, working steps."
  - "**Letting a PR description claim checks nobody ran.** Reviewers trust \"tested on Safari\". Write only what you did, and say what you didn't test."
verify:
  - lens: tests
    check: "Run every check a PR description claims before posting it, and say plainly what you didn't test."
  - lens: breaks
    check: "Use `--force-with-lease`, never `--force`, and never rewrite a branch someone else has pulled."
  - lens: confuses
    check: "Keep a refactor and a behaviour change in separate commits, so the behaviour change is visible in review."
  - lens: tests
    check: "Name the test that fails without the change, so the reviewer can see what it proves."
interview:
  - question: What makes a good commit?
    answer: >-
      One logical change that leaves the build passing, with a message that says what and
      why. Atomic commits matter because every history tool works on commits: `git revert`
      undoes exactly one change, `git bisect` can test every commit and land on a small diff,
      and `git blame` leads to a message explaining the intent. The subject is imperative
      and short, "Round basket totals to the nearest penny", so it reads well in `git log
      --oneline`. The body, when needed, explains the problem and why this approach, because
      the diff already shows the code. I keep refactors separate from behaviour changes.
      During the work I commit freely, then tidy with fixup commits and interactive rebase
      before review. The trade-off is time spent shaping history, which I skip when the team
      squash merges anyway.
  - question: Merge, rebase or squash? Which would you choose for a team?
    answer: >-
      It depends on what the team wants main to be, and consistency matters more than the
      choice. Squash merging gives one commit per pull request: a clean, linear main where
      each change reverts in one step, and it forgives messy branches. The cost is losing the
      individual commits, so bisect only narrows to a whole pull request. Rebase and
      fast-forward keeps each atomic commit in a straight line, which is best when authors
      curate commits, but it needs that discipline. Merge commits preserve the true history
      and when each branch landed, at the cost of a busier graph. For most product teams with
      small pull requests I'd pick squash merge. For a library where each commit is reviewed,
      I'd rebase. Whatever the choice, never rewrite shared branches.
  - question: How would you find which commit introduced a regression?
    answer: >-
      With `git bisect`, ideally automated with `git bisect run`. I find a known good commit,
      such as the last release tag, and mark HEAD as bad. Bisect checks out the midpoint and
      halves the range with each answer, so a thousand commits take about ten steps. If I can
      write a check that exits 0 when the behaviour is right and non-zero when it's wrong,
      `git bisect run ./check.sh` does the whole search unattended. The script returns 125 for
      commits that can't be built, so they're skipped rather than blamed. Then I read the
      commit, write a failing test, and fix forward or `git revert` it. Bisect works well only
      if most commits build and pass, which is a strong argument for atomic commits.
  - question: How do you keep pull requests reviewable?
    answer: >-
      By keeping them small and self-explanatory. I aim for a few hundred lines of real change
      at most, since review quality drops sharply beyond that. Large work becomes a stack:
      schema change, then API, then UI, each working on its own, with unfinished parts behind
      a feature flag. Refactors go in their own pull request, so the behaviour change isn't
      hidden in moved code. The description says what, why, how I tested it, the risk and
      where to start reading, with a screenshot for UI changes and a link to the issue. I
      review my own diff first and open a draft early to get feedback on direction. The
      trade-off is more coordination and waiting between stacked pull requests, which is
      usually far cheaper than one large review.
  - question: You pushed a branch, then rebased it. How do you update the remote safely?
    answer: >-
      With `git push --force-with-lease`, and only if the branch is mine alone. A rebase gives
      every commit a new hash, so a normal push is rejected as non-fast-forward. Plain
      `--force` overwrites the remote no matter what, including commits a teammate pushed
      since I last fetched. `--force-with-lease` checks that the remote branch still points
      where my local copy thinks it does, and refuses otherwise, so I fetch, look and decide.
      If others are working on the branch, I don't rebase it at all. I merge main into it
      instead, because merging rewrites nothing. And main or any release branch should be
      protected on the server so that force pushes are refused outright.
