term: intent-revealing name
aka: [descriptive name, meaningful name, good naming]
short: A name that says what a value means or a function does, so nobody has to look inside.
explain: |
  `t` tells you nothing. `priceWithTax` tells you everything you need to move on. Code is
  read far more often than it's written, so a vague name costs time on every read.

  Put the unit in when a number has one: `timeoutMs`, `priceInPence`. Make booleans a yes
  or no question: `isActive`, `hasPaid`. Let length grow with scope. And a name that lies,
  like `isValid` on a check that does something else, is worse than a meaningless one.
analogy: Labelled jars in a kitchen. Nobody has to open the white powder to find out if it's salt.
example:
  language: ts
  code: |
    // before
    const d = 86400000;
    // after
    const oneDayMs = 24 * 60 * 60 * 1000;
usage: Rename `data` to an intent-revealing name; I had to read the whole function to learn it's unpaid invoices.
related: [magic-number, ubiquitous-language, refactoring, principle-of-least-surprise]
level: 1
lessons: [clean.naming]
