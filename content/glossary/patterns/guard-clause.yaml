term: guard clause
aka:
  - early return
short: A check at the top of a function that exits early, so the main path stays unindented.
explain: |
  Deep nesting makes the reader hold every condition in mind at once. Flip it: handle the
  empty list, the missing user and the bad input first, each with an immediate return.

  What's left is the normal case, at the left margin, read from top to bottom.
analogy: A doorman turning away the obvious no's, so the host inside deals only with real guests.
example:
  language: js
  code: |
    function shippingCost(order) {
      if (!order) return 0;
      if (order.items.length === 0) return 0;
      if (order.total >= 50) return 0;
      return 4.99;
    }
usage: Use a guard clause for the empty cart, and the rest of the function loses two levels of nesting.
related:
  - code-smell
  - refactoring
level: 2
lessons:
  - clean.control-flow
