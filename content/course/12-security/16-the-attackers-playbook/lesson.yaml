deepDive: >-
  Professional testers call permitted testing a **penetration test**. It starts with a signed
  scope and rules of engagement, and ends with a report that proves each finding without
  causing harm: a screenshot of another test account's data, not a download of real customers.


  Defenders often describe an attack as a chain of stages, from reconnaissance to the
  attacker's goal. Models such as the intrusion kill chain and MITRE ATT&CK name those stages,
  so a team can ask at which stage they would notice.


  Privilege escalation comes in two directions. **Vertical** means gaining a higher role, as
  with mass assignment. **Horizontal** means reaching another user's data at the same level, as
  with the missing ownership check in the access-control lesson.
