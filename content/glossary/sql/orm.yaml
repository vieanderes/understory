term: ORM
aka: [ object-relational mapper, object-relational mapping ]
short: A library that lets you read and write database rows as objects in your programming language.
explain: |
  Writing SQL strings by hand for every save and load gets repetitive. A mapper turns a
  row into an object and a method call into SQL, so `user.save()` writes an `UPDATE` for
  you.

  It's comfortable until it hides what runs. Touching `post.author` inside a loop can fire
  a query per post, the N+1 problem. And the raw SQL escape hatch often doesn't
  parameterise, which brings SQL injection back. Log the SQL it generates while you
  develop.
analogy: A translator at a meeting. Handy, but now and then you need to check what was actually said.
example:
  language: ts
  code: |
    // what you write
    const user = await db.user.findUnique({ where: { id: 42 } });

    // roughly what runs
    // SELECT * FROM "User" WHERE id = 42 LIMIT 1;
usage: The ORM is lazy-loading every author, so the page fires two hundred queries.
related: [ n-plus-one-query, migration, sql-injection ]
level: 1
lessons: [ db.from-code ]
