term: row-level security
aka: [RLS, row level security policy, database policy]
short: Database rules that filter which rows each user may see or change, applied to every query.
explain: |
  An app that filters by owner in every endpoint is one forgotten `WHERE` away from a leak.
  With this feature on, Postgres adds the filter itself, whoever wrote the query.

  You enable it on a table and write policies. `USING` decides which existing rows a command
  can see, and `WITH CHECK` tests new or changed rows. With no policy, ordinary roles see
  nothing. Watch the edges. Superusers and the table owner skip policies, and views can skip them
  too. A pooled connection can carry one user's id into the next request.
analogy: A hotel key card. The lift only stops at the floors your card allows, whichever button you press.
example:
  language: sql
  code: |
    ALTER TABLE notes ENABLE ROW LEVEL SECURITY;

    CREATE POLICY own_notes ON notes
      USING (owner_id = current_setting('app.user_id')::uuid)
      WITH CHECK (owner_id = current_setting('app.user_id')::uuid);
usage: The browser queries that table directly, so row-level security is the only thing between users.
related: [authorisation, multi-tenancy, least-privilege, connection-pool]
level: 3
lessons: [db.row-level-security, arch.tenants]
