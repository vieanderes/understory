term: destructuring
aka:
  - destructuring assignment
short: Syntax that unpacks values from an object or array into separate named variables in one line.
explain: |
  Writing `const name = user.name` for every field gets repetitive. `const { name, email } = user`
  does them all at once. Arrays unpack by position: `const [first, second] = list`.

  You can rename, `{ name: userName }`, and give defaults, `{ size = 10 }`. A default applies
  only when the value is `undefined`, not `null`. Unpacking from `undefined` throws, so guard
  values that may be missing.
analogy: Unpacking a shopping bag straight onto the right shelves, instead of carrying the whole bag around.
example:
  language: js
  code: |
    const user = { name: 'Sam', email: 'sam@example.com' };
    const { name, email } = user;
    const [first, second] = [3, 5, 8];
usage: Destructuring the props in the signature shows at a glance which ones the component uses.
twin:
  term: spread-syntax
  difference: Destructuring takes values out of an object or array and into variables. Spread pours the contents of one into a new object, array or call.
related:
