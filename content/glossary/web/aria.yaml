term: ARIA
aka:
  - ARIA attributes
  - Accessible Rich Internet Applications
short: Attributes that tell assistive technology the role, name or state of an element.
explain: |
  Some widgets have no HTML element: tabs, a combobox, a live status message. A screen
  reader has no idea what your custom box is unless you say so.

  Attributes like `role="tab"`, `aria-expanded` and `aria-live` fill that gap. They change
  only what is announced. They don't make anything focusable or clickable, so you still
  write that behaviour yourself. The first rule: if a native element does the job, use
  it. Wrong attributes are worse than none.
analogy: A label on a mystery switch. It tells you what it does, but sticking it on doesn't wire the switch up.
example:
  language: html
  code: |
    <button aria-expanded="false" aria-controls="menu">
      Options
    </button>
    <ul id="menu" hidden>...</ul>
    <p role="status" aria-live="polite">Saved</p>
usage: The toggle never updates aria-expanded, so a screen reader still says the menu is closed.
twin:
  term: semantic-html
  difference: ARIA describes an element to assistive technology and changes nothing else. Semantic HTML picks an element that already has the meaning and the keyboard behaviour built in.
related:
  - semantic-html
level: 3
lessons:
  - design.accessible-widgets
  - html.semantic-structure
