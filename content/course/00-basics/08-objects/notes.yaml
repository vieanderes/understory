summary: >-
  An **object** groups different facts about one thing under names. A book has a title and a
  page count. A task has a title and a done flag. Each name with its value is a **property**,
  and you reach it with a dot: `book.title`.


  Arrays and objects answer different questions. An array asks "which one?" and answers with a
  position. An object asks "which fact?" and answers with a name. Most real data uses both at
  once: a list of objects that all share the same shape, like every task on a to-do list.


  You'll meet this shape everywhere. A shopping cart is a list of items with a price and a
  quantity. A chat is a list of messages with a sender and some text. Once you can loop over a
  list and read a property from each item, you can work with most data an app sends and
  receives.
remember:
  - An object groups related values under names, and each name with its value is a property.
  - Read or change a property with a dot, like `book.title` or `book.pages = 500`.
  - Reading a property that doesn't exist gives `undefined`, and names are case-sensitive, so `Email` is not `email`.
  - Use an array for many similar things in order, and an object for the named facts about one thing.
  - A list of objects is read from the outside in, item first, then property, as in `tasks[0].title`.
  - Giving an object a new name, or passing it to a function, doesn't copy it, so a change through either name shows up in both.
  - Two objects with the same properties are still not `===`, because `===` asks whether they are the same object.
sections:
  - title: Adding, changing and missing properties
    body: |-
      An object isn't fixed once you've made it. Setting a property that doesn't exist yet
      adds it:

      ```js
      const book = { title: "Dune", pages: 412 };
      console.log(book); // { title: 'Dune', pages: 412 }
      book.author = "Frank Herbert";
      console.log(book); // { title: 'Dune', pages: 412, author: 'Frank Herbert' }
      console.log(book.year); // undefined
      ```

      Node, a program that runs JavaScript outside a browser, prints an object in curly
      brackets with text in single quotes. Printing the whole object is a quick way to see
      every property it really has.

      That flexibility cuts both ways. There's no list of allowed names, so a typo never stops
      the program. `book.Title = "Emma"` adds a second, capitalised property instead of
      changing the title. And reading `book.Title` later gives `undefined` without complaint.

      Here's the rule to keep: **a misspelt property name is read as `undefined` and written
      as a new property**. Neither causes an error at that line. When a value comes out as
      `undefined`, compare the name letter by letter with the object, capitals included.

      There's one case that does stop the program. Reading a property of `undefined` itself,
      such as `tasks[5].title` on a list of two tasks, fails with a type error. The next lesson
      shows how to read that message.
  - title: Objects inside objects, and lists inside objects
    body: |-
      A property's value can be anything, including a list or another object. You read it
      from the outside in, one step at a time:

      ```js
      const order = {
        customer: { name: "Ada", email: "ada@example.com" },
        items: ["tea", "cake"],
      };
      console.log(order.customer.name); // Ada
      console.log(order.items[1]); // cake
      console.log(order.items.length); // 2
      ```

      Read `order.customer.name` left to right. `order` is the object. `.customer` is the
      object inside it. `.name` is the text inside that. Each dot opens the next box.

      This nesting is the shape of **JSON**, the text format most apps use to send data across
      the internet. When an app asks a server for your orders, the answer usually arrives as
      a list of objects like this one.

      Choosing a shape is a real design decision. Ask what varies. If there can be many items,
      use a list. If there's one customer with several facts, use an object. A common beginner
      shape is two separate lists, one of titles and one of done flags, kept in step by index.
      It works until one list gets an extra item and every pair after it is wrong. A single
      list of objects keeps each title and its flag together, so they can't drift apart.
  - title: Two names, one object
    body: |-
      This is the most important idea in the lesson that the steps don't show. A variable
      doesn't hold an object the way a box holds a number. It points at it. Give the object a
      second name and both names point at the same object:

      ```js
      const book = { title: "Dune", pages: 412 };
      const sameBook = book;
      sameBook.pages = 500;
      console.log(book.pages); // 500
      ```

      Nothing was copied. `sameBook = book` stuck a second label on the same object, so the
      change shows through both labels.

      Functions work the same way. A parameter gets the object itself, not a copy, so a
      function can change the caller's object:

      ```js
      function markDone(task) {
        task.done = true;
      }
      const task = { title: "Buy milk", done: false };
      markDone(task);
      console.log(task.done); // true
      ```

      That's useful, and it's how the to-do program in lesson 11 works. It's also a classic
      source of surprise, when a function changes data that the caller expected to stay as it
      was.

      The same idea explains how `===` treats objects. It asks "are these the same object?",
      not "do they look alike?":

      ```js
      const book = { title: "Dune" };
      const sameBook = book;
      console.log(book === sameBook); // true
      console.log({ title: "Dune" } === { title: "Dune" }); // false
      ```

      The last line makes two separate objects that happen to match, so `===` says `false`. To
      compare objects by their contents, compare the properties you care about, like
      `a.title === b.title`.
  - title: 'Working through a list of objects: find, count, total'
    body: |-
      Three loops cover most of what you'll do with a list of objects. Each one reads a
      property from the current item inside a `for...of` loop.

      ```js
      const contacts = [
        { name: "Leo", email: "leo@example.com", favourite: true },
        { name: "Mia", email: "mia@example.com", favourite: false },
        { name: "Sam", email: "sam@example.com", favourite: true },
      ];

      function findEmail(list, name) {
        for (const contact of list) {
          if (contact.name === name) {
            return contact.email;
          }
        }
        return undefined;
      }

      function countFavourites(list) {
        let count = 0;
        for (const contact of list) {
          if (contact.favourite) {
            count = count + 1;
          }
        }
        return count;
      }

      console.log(findEmail(contacts, "Mia")); // mia@example.com
      console.log(findEmail(contacts, "Zoe")); // undefined
      console.log(countFavourites(contacts)); // 2
      ```

      Look at where each `return` sits. In `findEmail`, the first `return` is inside the loop,
      so the function stops at the first match. The `return undefined` after the loop runs
      only when nothing matched. Put it inside the loop, as an `else`, and the function would
      give up after checking the first contact.

      The total from this lesson's challenge is the third pattern: a running total outside the
      loop, and `item.price * item.quantity` added inside it.

      A function can also build and return an object, which keeps every new item the same
      shape:

      ```js
      function makeTask(title) {
        return { title: title, done: false };
      }
      console.log(makeTask("Water the plants")); // { title: 'Water the plants', done: false }
      ```
pitfalls:
  - '**Reading the property from the list instead of the item.** `tasks.title` asks the list for a title, and a list has none, so you get `undefined`. Pick the item first: `tasks[0].title`, or `task.title` inside a loop.'
  - '**Getting the capitals wrong.** Property names are case-sensitive, so `contact.Email` reads a property that isn''t there and gives `undefined`. Copy the name exactly as the object spells it.'
  - '**Expecting a copy.** `const draft = task;` doesn''t copy the task, so changing `draft.title` changes `task.title` too. If you need a separate object, build a new one with its own curly brackets.'
  - '**Comparing objects with `===`.** Two objects with identical properties are still two objects, so `===` gives `false`. Compare the properties that matter, such as the titles.'
  - '**Putting an object straight into text.** `"Task: " + task` shows `Task: [object Object]`, because JavaScript doesn''t know which property you mean. Name it: `"Task: " + task.title`.'
interview:
  - question: When would you use an object and when an array?
    answer: >-
      I use an object for the named facts about one thing, and an array for many similar things
      in order. A task has a title, a due date and a done flag, and each fact is looked up by
      name, so it's an object. All my tasks are a list I loop over, count or add to, so they're
      an array. Most real data combines them: an array of objects, all with the same shape. That
      shape keeps each task's facts together. The alternative, parallel arrays of titles and
      flags matched by index, breaks as soon as one list changes length. The trade-off is that
      finding one item in an array means looping until you find it. That is fine for a short
      list and slower for a very long one.
  - question: Why can a function change an object you pass into it, and why can it be a problem?
    answer: >-
      Because the function receives the same object, not a copy. In JavaScript, a variable
      points at an object rather than containing it. Passing `task` into `markDone(task)` gives
      the parameter a second pointer to that same object, so `task.done = true` inside the
      function is visible outside it. That's handy when changing the object is the whole point,
      like marking a task done. It becomes a problem when the caller expects its data to stay
      as it was. A function meant only to show a task, which changes a property on the way,
      creates a bug far from where you'd look. So I name functions that change their input
      clearly, like `markDone`, and keep display functions to reading only.
  - question: 'Why does `{ title: "Dune" } === { title: "Dune" }` give `false`?'
    answer: >-
      Because each pair of curly brackets makes a new object, and `===` on objects asks whether
      both sides are the same object, not whether they look alike. For numbers and text, `===`
      compares the values, so `"Dune" === "Dune"` is `true`. For objects it compares identity.
      If I write `const a = { title: "Dune" }` and `const b = a`, then `a === b` is `true`,
      because both names point at one object. To check whether two objects have the same
      contents, I compare the properties that matter, for example `a.title === b.title`. For
      data with many properties, that comparison belongs in a small function, so the rule for
      "the same book" lives in one place.
