term: redirect
aka: [HTTP redirect, '301', '302', 301 redirect, 302 redirect]
short: A response telling the browser to fetch a different URL, given in the Location header.
explain: |
  The server answers with a `3xx` status and a `Location` header. The browser follows it
  at once. That's how short links, moved pages and logins that send you back all work.

  The status code matters. `301` says "moved for good", so browsers cache it and may never
  ask you again. `302` says "for now", so every visit comes back to your server. Pick `302`
  if you need to count clicks or change the target later.
analogy: A "we've moved" sign on a shop door, with the new address.
example:
  language: http
  code: |
    HTTP/1.1 302 Found
    Location: https://example.com/a-very-long/path
usage: Send a 302 redirect, not a 301, or we lose click counts once browsers cache it.
related: [status-code, url, http-header, cache-control]
level: 2
lessons: [sysdesign.case-url-shortener]
