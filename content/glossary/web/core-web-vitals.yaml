term: Core Web Vitals
aka: [ CWV, web vitals ]
short: Three measures of how a page feels to real visitors, covering loading, responsiveness and visual stability.
explain: |
  "The site feels slow" is hard to fix. Three numbers turn the feeling into something you can
  measure, compare and set a target for.

  LCP times how long the main content takes to appear. INP times how long the page takes to
  answer a tap or a key. CLS scores how much content jumps around. Each is judged at the 75th
  percentile of real visits. So three visitors in four must have a good experience.
analogy: "A restaurant inspection with three marks: how fast the food came, how fast staff answered, and whether the table wobbled."
example:
  language: text
  code: |
    metric  good       poor
    LCP     <= 2.5 s   > 4 s
    INP     <= 200 ms  > 500 ms
    CLS     <= 0.1     > 0.25
usage: Core Web Vitals look fine on our laptops, but the field data from phones fails LCP.
related: [ largest-contentful-paint, interaction-to-next-paint, cumulative-layout-shift, field-data, percentile ]
level: 2
lessons: [ perf.web-vitals ]
