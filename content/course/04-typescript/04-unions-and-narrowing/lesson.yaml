id: ts.narrowing
title: Unions and narrowing
objective: Handle a value that can be one of several things, including `null`, and make the build fail when a case is forgotten.
level: essential
minutes: 10
concepts: [ts.union-types, ts.narrowing, ts.discriminated-unions, ts.exhaustiveness]
prerequisites: [ts.structural-typing]
opening:
  text: >-
    You'll model data that's always in exactly one valid state, and let the checker check
    each one. When someone adds a new state later, the checker tells you what to fix.

steps:
  - type: prose
    id: unions-common-members
    body: |-
      Some values can be one of several things. A `|` between types means "or":

      ```ts
      type Size = "small" | "medium" | "large";
      let reading: number | null = null;
      ```

      That's a **union type**. `"small"` on its own is a type with exactly one value, so
      `Size` allows three strings and no others. The checker doesn't know which member you
      hold, so it only lets you use what they all share.

  - type: predict-output
    id: predict-union-member
    concept: ts.union-types
    difficulty: 1
    language: ts
    code: |
      type Subscription =
        | { status: "trial"; endsAt: number }
        | { status: "active"; pricePence: number };

      function show(sub: Subscription) {
        console.log(sub.status);
        console.log(sub.pricePence);
      }
    question: What does the checker report?
    choices:
      - text: 'Line 7 fails: `pricePence` isn''t on every member'
        correct: true
        feedback: >-
          Right. A trial has no `pricePence`, so the read isn't safe.
      - text: Nothing, because one member has `pricePence`
        feedback: >-
          Tempting. But `sub` might be a trial, and the checker has to allow for that.
      - text: Lines 6 and 7 both fail
        feedback: >-
          Line 6 is fine. Both members have `status`, so it's safe to read either way.

  - type: prose
    id: narrowing-and-null
    body: |-
      To use the rest, check first. The checker follows your `if` and `return`, and drops
      the members a check rules out. That's **narrowing**. You'll use it daily on the page:

      ```ts
      const button = document.querySelector("button");
      button.addEventListener("click", save);
      // 'button' is possibly 'null'.
      ```

      `querySelector` gives `null` when nothing matches. After `if (button === null) return;`
      the checker knows it's a button.

  - type: code-challenge
    id: fix-possibly-null-price
    concept: ts.narrowing
    difficulty: 2
    language: ts
    starter: pence.starter.ts
    solution: pence.solution.ts
    tests: pence.tests.ts
    expectStarterTypeError: true
    prompt: >-
      A price arrives as text, a number or `null`. The checker underlines the last `return`.
      Read its message, then add a check so a missing price returns 0.
    hints:
      - The message says `input` can still be `number | null` on that line.
      - Rule out `null` before the other checks, the way you did with the button.
      - 'Start the function with `if (input === null) { return 0; }`.'

  - type: prose
    id: tag-selects-member
    body: >-
      Look back at `Subscription`. Every member has `status`, each with a different fixed
      value: `"trial"` or `"active"`.


      A shared property like that makes a **discriminated union**. Check
      `sub.status === "active"`, and the checker knows you hold the active member, with all
      its properties.

  - type: fill-blank
    id: fill-switch-on-tag
    concept: ts.discriminated-unions
    difficulty: 2
    language: ts
    prompt: >-
      `Subscription` now has a third member, `{ status: "cancelled"; cancelledAt: number }`.
      Complete `badge`, so each branch reads its own member's properties.
    template: |
      function badge(sub: Subscription): string {
        if (sub.{{1}} === "trial") {
          return `Trial ends ${sub.{{2}}}`;
        }
        if (sub.status === {{3}}) {
          return `${sub.pricePence}p a month`;
        }
        return `Cancelled ${sub.{{4}}}`;
      }
    blanks:
      - key: '1'
        answer: status
      - key: '2'
        answer: endsAt
      - key: '3'
        answer: '"active"'
      - key: '4'
        answer: cancelledAt
    bank: [status, kind, endsAt, cancelledAt, pricePence, '"active"', '"paused"', typeof]

  - type: prose
    id: never-catches-new-states
    body: |-
      Once every member has been checked and returned, nothing is left. The type of nothing
      is **never**: a type with no values at all. A helper can demand it:

      ```ts
      function assertNever(value: never): never {
        throw new Error(`Unhandled: ${JSON.stringify(value)}`);
      }
      ```

      End your checks with `return assertNever(sub);`. Add a `"paused"` member and forget it,
      and that line fails: `Argument of type '{ status: "paused"; ... }' is not assignable to
      parameter of type 'never'.`

  - type: ai-review
    id: review-gate-default
    concept: ts.exhaustiveness
    difficulty: 3
    language: ts
    request: Write a check so only paying members can download songs.
    flawClass: security
    code: |
      type Subscription =
        | { status: "trial"; endsAt: number }
        | { status: "active"; pricePence: number }
        | { status: "cancelled"; cancelledAt: number };

      function canDownload(sub: Subscription): boolean {
        if (sub.status === "trial") {
          return false;
        }
        if (sub.status === "cancelled") {
          return false;
        }
        return true;
      }
    prompt: >-
      An assistant wrote this, and its tests pass for all three statuses. Next month someone
      adds `"past-due"` for failed payments. Tap the line that lets them download.
    lines: [13]
    reasons:
      - text: It allows every status nobody listed, silently
        correct: true
        feedback: >-
          Yes. It lists who to refuse, so every new status gets in.
      - text: The `if` checks can't narrow a union
        feedback: >-
          They do narrow. The trouble is the last line, which accepts whatever member is left.
      - text: The return type should be `true | false`
        feedback: >-
          `boolean` already is `true | false`. The gap is the catch-all `return true` at the
          end.
    fix: |
      function canDownload(sub: Subscription): boolean {
        if (sub.status === "active") {
          return true;
        }
        if (sub.status === "trial" || sub.status === "cancelled") {
          return false;
        }
        return assertNever(sub);
      }

  - type: code-challenge
    id: write-revenue-minor
    concept: ts.discriminated-unions
    difficulty: 3
    language: ts
    starter: starter.ts
    solution: solution.ts
    tests: tests.ts
    prompt: >-
      Write `monthlyRevenuePence(subscriptions)`. A `trial` or `cancelled` subscription pays
      0. An `active` one pays its `pricePence`. A `discounted` one pays `pricePence` minus
      `discountPence`.


      An unknown status should throw an `Error` naming it. End your checks with `assertNever`
      for that.


      Example: one active at `999` plus one discounted at `999` with `600` off gives `1398`.
    hints:
      - Only one member has `discountPence`, so check `status` before you read it.
      - Once every status has returned, `sub` has the type `never`.
      - >-
        Write a helper, `paysPence(sub: Subscription): number`, with one `if` per status.
        End it with `return assertNever(sub);`.

  - type: explain-back
    id: explain-never-breaks-build
    concept: ts.exhaustiveness
    difficulty: 3
    prompt: |-
      ```ts
      function badge(sub: Subscription): string {
        if (sub.status === "trial") return "Trial";
        if (sub.status === "active") return "Active";
        if (sub.status === "cancelled") return "Cancelled";
        return assertNever(sub);
      }
      ```

      Someone adds a `"past-due"` status. Why is that a type error here, but not in
      `canDownload`, which ends with `return true`?
    rubric:
      - Each check that returns removes one member, so after all of them `sub` has the type `never`.
      - A leftover `past-due` member isn't assignable to `never`, so the `assertNever` call fails.
      - A catch-all `return true` accepts any leftover member, so the checker has nothing to report.
    modelAnswer: >-
      Every check that returns removes one member from `sub`. In `badge`, once all statuses
      are handled, nothing's left and `sub` is `never`. Add `past-due` and it's left over. It
      can't be passed to `assertNever`, so the checker flags that line. `canDownload` ends
      with `return true`, which takes any leftover member, so the new status gets in without
      a word.

recap:
  - Read only the properties every member of a union shares.
  - Narrow with `=== null`, `typeof` and a check on a shared `status`.
  - End your checks with `assertNever`, so a new state is a type error.

recall:
  - id: card-union-common-members
    concept: ts.union-types
    front: Which properties of a value of type `A | B` can you read before narrowing?
    back: >-
      Only the ones both `A` and `B` have. The value could be either, so only shared properties
      are safe.
  - id: card-query-selector-null
    concept: ts.narrowing
    front: Why is `document.querySelector("button")` typed `HTMLButtonElement | null`?
    back: >-
      Nothing may match, and then it returns `null`. Check for `null` before you use it.
  - id: card-discriminant
    concept: ts.discriminated-unions
    front: What makes a union a discriminated union?
    back: >-
      Every member has the same property with a different fixed value, like `status: "active"`.
      Checking that property picks one member.
  - id: card-assert-never
    concept: ts.exhaustiveness
    front: 'How does `assertNever(value: never)` turn a forgotten case into a type error?'
    back: >-
      After every check, what's left is `never` only if no member remains. A forgotten member
      isn't assignable to `never`, so the call fails.
  - id: card-narrowing-return
    concept: ts.narrowing
    front: '`x` is `string | number`. After `if (typeof x === "string") return;`, what type is `x`?'
    back: >-
      `number`. Strings leave through the `return`, so only numbers reach the next line.

