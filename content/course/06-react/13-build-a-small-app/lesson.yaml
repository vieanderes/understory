deepDive: >-
  **Keep the filter in the address.** People like to share "my unread books". Move `filter`
  into `?show=unread`, as in the reducers and URL state lesson, and a reload or a shared link
  opens the same view.


  **Saving changes.** Here ticks and new books live only in memory. A real app sends each
  change to the server from the event handler, not from an effect, because it answers
  something the person did.


  **When the list grows.** Filtering a few hundred books on each render is cheap. With tens of
  thousands, measure first. The advanced Performance lesson shows how.
