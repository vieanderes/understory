term: proof point
aka: [proof points, evidence of impact]
short: One piece of work with a checkable result, such as a number or a before and after.
explain: |
  "I'm a strong engineer" is a claim. "I cut the checkout's error rate from 2% to 0.3%" is
  evidence. The interviewer can write it down and ask about it.

  Pick one per answer, matched to the role. Know the number, why you chose your tool, how
  you knew it worked and what you'd change. Those are the follow-ups.
analogy: A photo of the finished kitchen in a builder's portfolio, instead of a promise that they're good.
usage: Your introduction needs a proof point; name the latency drop and what you changed to get it.
related: [elevator-pitch, star-method, project-deep-dive]
level: 2
lessons: [career.your-narrative]
