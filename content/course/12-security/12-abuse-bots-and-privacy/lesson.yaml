deepDive: >-
  A token bucket allows a controlled burst. A fixed window ("100 a minute") allows a double
  burst across its boundary. A sliding window smooths that, at more cost. Pick by how bursty
  the real traffic is.


  Real login limits use two keys: a tight one per account, and a looser one per address to
  slow a script spraying one common password across many accounts. Only trust
  `X-Forwarded-For` as far as your own load balancer wrote it, usually its last entry.


  Storage limitation is the twin of minimisation. Even data you were right to collect must go
  when its purpose ends. A schedule that deletes old orders and rotates logs shrinks the
  target over time.


  Scalper defence is an arms race with no final win. The aim isn't to stop every bot. It's to
  make automation cost more than it earns.
