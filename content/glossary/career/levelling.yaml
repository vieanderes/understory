term: levelling
aka:
  - leveling
  - job level
  - career level
  - seniority level
short: The rung on a company's career ladder you are hired at, which sets your pay band and expectations.
explain: |
  Companies sort engineers into numbered levels, such as junior, mid, senior and staff. Each
  level has a pay band and a written description of the scope people at that level own.

  The interviews decide your level as much as whether you're hired. Senior answers start from
  requirements, name trade-offs unprompted and tell decisions with their results.

  It matters more than a small difference in salary. Pay rises within a band are slow, and a
  promotion later is harder than starting one level higher. When base is fixed, ask about the
  level instead.
analogy: Joining a football club in the first team or the reserves. Same club, very different season.
usage: They offered the mid-level band; I'll ask how levelling was decided and what senior would need.
