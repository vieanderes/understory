id: eval-scorer
title: EvalScorer
topic: evals
difficulty: medium
type: coding
recommendedMinutes: 30
signature:
  params:
    - { name: B, type: "string[]" }
    - { name: C, type: "string[]" }
    - { name: D, type: int }
  returns: "string[]"
statement: |-
  A team compares a new version of its AI feature (the candidate) with the current one (the
  baseline) on a set of eval cases. Every case was run several times, because the model's
  answers vary. Each entry of B (the baseline) and C (the candidate) describes one case as
  three words separated by single spaces: the case id, the slice it belongs to (such as
  `billing`), and its trial results as a string of `P` (passed) and `F` (failed), such as
  `"c7 billing PPF"`.

  Only the cases that appear in both B and C are compared; the others are left out. For one
  run, over a set of cases:

  - **pass@k** is the percentage of cases with at least one passed trial;
  - **pass^k** is the percentage of cases where every trial passed.

  A percentage is 100 × count ÷ cases, rounded down. A slice has **regressed** when the
  candidate's pass^k on that slice is more than D percentage points below the baseline's,
  using exact values, not rounded ones.

  Write a function:

  {{signature}}

  that, given arrays B and C of strings and an integer D, returns the summary as an array of
  strings:

  - `"pass@k X Y"`, where X is the baseline's pass@k and Y the candidate's, over all the
    compared cases;
  - `"pass^k X Y"`, the same for pass^k;
  - `"regressed S X Y"` for every slice S that regressed, with the baseline's and the
    candidate's pass^k on that slice, in alphabetical order of slice;
  - or, if no slice regressed, a single `"no regressions"`.

  For example, given B = ["c1 billing PPP", "c2 billing PFP", "c3 search PP",
  "c4 search FF"], C = ["c1 billing PPF", "c2 billing PFF", "c3 search PP", "c4 search PF",
  "c5 search PP"] and D = 10, the function should return ["pass@k 75 100", "pass^k 50 25",
  "regressed billing 50 0"]. Case c5 is new, so it is left out. On billing, pass^k fell from
  50 to 0.

  Given B = ["a x PF", "b x PP", "c x PP"], C = ["c x PP", "b x PP", "a x PP"] and D = 0, the
  function should return ["pass@k 100 100", "pass^k 66 100", "no regressions"].

  Assume that:

  - the lengths of arrays B and C are integers within the range [1..200];
  - case ids and slice names are non-empty strings of lower-case letters, digits and
    hyphens;
  - a case id appears at most once in each array, and a case has the same slice in both;
  - each result string has a length within the range [1..20];
  - at least one case appears in both arrays;
  - D is an integer within the range [0..100].

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [["c1 billing PPP", "c2 billing PFP", "c3 search PP", "c4 search FF"], ["c1 billing PPF", "c2 billing PFF", "c3 search PP", "c4 search PF", "c5 search PP"], 10], expected: ["pass@k 75 100", "pass^k 50 25", "regressed billing 50 0"] }
  - { args: [["a x PF", "b x PP", "c x PP"], ["c x PP", "b x PP", "a x PP"], 0], expected: ["pass@k 100 100", "pass^k 66 100", "no regressions"] }
tests:
  - name: extreme_single
    description: one shared case
    group: correctness
    cases:
      - { args: [["a s P"], ["a s F"], 0], expected: ["pass@k 100 0", "pass^k 100 0", "regressed s 100 0"] }
      - { args: [["a s F"], ["a s F"], 0], expected: ["pass@k 0 0", "pass^k 0 0", "no regressions"] }
      - { args: [["a s F"], ["a s P"], 100], expected: ["pass@k 0 100", "pass^k 0 100", "no regressions"] }
  - name: unshared_cases
    description: cases in only one run are left out
    group: correctness
    cases:
      - { args: [["a s P", "b s F", "c t F"], ["a s P", "d s F", "e t F"], 0], expected: ["pass@k 100 100", "pass^k 100 100", "no regressions"] }
  - name: exact_threshold
    description: a drop equal to D is not a regression, one just above is
    group: correctness
    cases:
      - { args: [["a s P", "b s P", "c s P", "d s P", "e s P", "f s P", "g s P", "h s P", "i s P", "j s P"], ["a s F", "b s P", "c s P", "d s P", "e s P", "f s P", "g s P", "h s P", "i s P", "j s P"], 10], expected: ["pass@k 100 90", "pass^k 100 90", "no regressions"] }
      - { args: [["a s P", "b s P", "c s P"], ["a s F", "b s P", "c s P"], 33], expected: ["pass@k 100 66", "pass^k 100 66", "regressed s 100 66"] }
      - { args: [["a s P", "b s P", "c s P"], ["a s F", "b s P", "c s P"], 34], expected: ["pass@k 100 66", "pass^k 100 66", "no regressions"] }
  - name: pass_at_k_vs_all
    description: a flaky case counts for pass@k but not for pass^k, a drop just above D
    group: correctness
    cases:
      - { args: [["a s PPPP", "b s FFFP"], ["a s PPPF", "b s FFFF"], 49], expected: ["pass@k 100 50", "pass^k 50 0", "regressed s 50 0"] }
      - { args: [["a s PF", "b s FP"], ["a s FP", "b s PF"], 0], expected: ["pass@k 100 100", "pass^k 0 0", "no regressions"] }
  - name: different_trial_counts
    description: the two runs used different numbers of trials
    group: correctness
    cases:
      - { args: [["a s P", "b s P"], ["a s PPPPPPPPPPPPPPPPPPPF", "b s PPPPPPPPPPPPPPPPPPPP"], 49], expected: ["pass@k 100 100", "pass^k 100 50", "regressed s 100 50"] }
  - name: several_slices
    description: slices sorted alphabetically, some regress, some improve
    group: correctness
    cases:
      - { args: [["1 zeta P", "2 alpha P", "3 mid P", "4 alpha P", "5 beta F"], ["2 alpha F", "4 alpha P", "1 zeta F", "3 mid P", "5 beta P"], 20], expected: ["pass@k 80 60", "pass^k 80 60", "regressed alpha 100 50", "regressed zeta 100 0"] }
      - { args: [["x-1 a-b PP", "x-2 a PP", "x-3 ab PP"], ["x-3 ab FF", "x-2 a FF", "x-1 a-b FF"], 99], expected: ["pass@k 100 0", "pass^k 100 0", "regressed a 100 0", "regressed a-b 100 0", "regressed ab 100 0"] }
