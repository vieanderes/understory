deepDive: >-
  Real search boxes add two more things. A **debounce** waits until typing pauses, say 300
  milliseconds, before sending anything. It saves the server from a request per key, and pairs
  well with aborting. A small cache keeps recent answers, so going back to "al" costs nothing.


  Showing "Searching" while you wait helps too. Set it before the `await`, and replace it when
  the answer comes. With aborting in place, an old request can't clear a newer message.


  The stand-in server's `type` helper works because `dispatchEvent(new Event("input"))` fires
  the same listeners a real key press would. Tests for real pages use the same trick.


  The multi-line version of this page, with the list, the messages and the controller together,
  is about 25 lines. The stages kept the pieces apart so each fitted on a phone screen.
