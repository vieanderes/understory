deepDive: >-
  Broken JSON raises `json.JSONDecodeError`, a subclass of `ValueError`, with the position
  of the problem, such as `line 1 column 2 (char 1)` for single-quoted keys. That's the
  error you'll meet most when a model's reply is almost JSON. `json.load(f)` and
  `json.dump(data, f)` work on an open file instead of a string.


  `with` works with any **context manager**, not only files: an object with `__enter__` and
  `__exit__` methods. Locks, database transactions and network clients use it the same way,
  and `contextlib.contextmanager` turns a generator function into one. Pass
  `encoding="utf-8"` when you open text files, since some systems still default to another
  encoding.
