term: Little's law
aka: [Littles law, L = λW]
short: The rule that items in a system equal their arrival rate times how long each stays.
explain: |
  If 100 requests arrive each second and each takes half a second, about 50 are in
  flight at any moment. That's the whole law: in flight equals rate times time.

  It sizes things fast. How many workers, database connections or open sockets do you
  need? Multiply throughput by latency. It also shows why a slow dependency eats your
  connection pool: double the time, double the requests waiting.
analogy: A café where ten people arrive an hour and each stays half an hour. You need about five seats.
example:
  language: text
  code: |
    in flight = arrival rate × time in system
    200 req/s × 0.25 s = 50 concurrent requests
usage: By Little's law, 400 requests a second at 300 ms needs about 120 connections, and our pool has 20.
