term: mutation
aka:
  - mutate
  - mutating
short: Changing an existing object or array in place, rather than making a new one.
explain: |
  `cart.push(item)` changes the cart itself. Anyone else holding that array sees the change,
  because they hold the same array, not a copy.

  That's where bugs come from. A function that edits its argument surprises its caller. And
  React compares old and new values by identity, so an array changed in place looks the
  same, and the screen doesn't update.
analogy: Writing on a shared whiteboard. Everyone in the room sees it, whether they wanted to or not.
example:
  language: js
  code: |
    const original = [3, 1, 2];
    const sorted = original;
    sorted.sort(); // sorts original too
    console.log(original); // [1, 2, 3]
usage: This helper sorts in place, and that mutation reorders the caller's list too.
twin:
  term: immutability
  difference: Mutation edits the original, so everyone holding it sees the change. Immutability leaves the original alone and hands back a changed copy.
related:
  - immutability
  - shallow-copy
  - pure-function
level: 1
lessons:
