term: decorator
aka:
  - function decorator
short: A function that wraps another function to add behaviour, applied with an at sign above its definition.
explain: |
  You want to time ten functions, or retry them, or check the caller is signed in. Copying
  the same lines into each one is tedious and goes wrong quietly.

  A decorator takes a function and returns a new one that does extra work around the
  call. Writing `@timed` above `def load():` means `load = timed(load)`. Use
  `functools.wraps` inside, or the wrapped function loses its name and docstring and
  every log line says `wrapper`.
analogy: Gift wrap. The present inside is unchanged; the wrapping adds a bow and a card on the outside.
example:
  language: python
  code: |
    from functools import wraps
    import time

    def timed(fn):
        @wraps(fn)
        def wrapper(*args, **kwargs):
            start = time.perf_counter()
            try:
                return fn(*args, **kwargs)
            finally:
                print(fn.__name__, time.perf_counter() - start)
        return wrapper
usage: Put the retry logic in a decorator, so each API call stays one line.
