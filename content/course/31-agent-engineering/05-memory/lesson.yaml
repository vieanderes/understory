deepDive: >-
  The store in the challenge and the path check ran in Python 3.12. No model was called.


  **A file-based memory tool.** One provider's memory tool, type `memory_20250818`, lets
  the model view, create, edit, rename and delete files under `/memories`. Your code stores
  them. The provider's guidance is the lesson's: give each user their own directory, check
  every path, and keep secrets out.


  **Files or vectors.** Files suit a few hundred facts per user: a person can read them, a
  diff shows what changed, and the agent can edit one line. A vector store suits thousands
  of episodes searched by meaning. It's harder to audit, and near-duplicates slip past
  exact-match dedupe. Many systems use both: a short profile file, and a searchable log of
  episodes.


  **Forgetting on purpose.** Data protection law gives people the right to have their data
  erased. A memory system needs a "forget me" that removes every entry for a user,
  including copies inside summaries. Keep memories as separate, scoped entries, and that
  delete is one query.
