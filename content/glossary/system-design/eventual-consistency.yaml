term: eventual consistency
aka: [eventually consistent]
short: Copies of data may disagree for a moment, but all settle on the same value once updates stop.
explain: |
  When data lives in several places, keeping every copy identical at every instant is slow,
  because each write must wait for all of them. Letting the copies catch up a moment later
  is much faster and survives network trouble.

  The cost shows up in the interface. A user posts a comment, refreshes, and it's missing,
  because the page read a copy that hadn't caught up. Design for it: show the user their
  own write straight away, read their own data from the main copy, and say "updating"
  where a delay is visible.
analogy: News spreading round a village. For a while some people know and some don't, but by evening everyone has heard.
usage: The search index is eventually consistent, so a new product can take a few seconds to show up in results.
related: [replication, cap-theorem, message-broker, saga]
level: 2
lessons: [arch.cqrs-and-event-sourcing, arch.monolith-and-services]
