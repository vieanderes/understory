term: watermark
aka: [high-water mark, sync checkpoint, last synced at]
short: The saved point a sync reached, so the next run knows where to continue from.
explain: |
  A delta sync has to remember where it got to. That remembered point, usually a
  timestamp, is the starting line for the next run.

  The trap is which time you save. Save the moment this run started, not when it finished,
  or anything changed during the run falls in the gap. Save it only after the run succeeds,
  so a crash means redoing work, never skipping it.
analogy: The pencil mark on the door frame, so next time you know how much the child has grown.
usage: Save the watermark only after the batch commits, or a crash halfway skips a thousand records.
related: [delta-sync, clock-skew, cursor-pagination]
level: 3
lessons: [integrations.full-and-delta-sync]
