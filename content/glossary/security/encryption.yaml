term: encryption
aka:
  - encrypt
short: Scrambling data with a key so that only someone holding the right key can turn it back.
explain: |
  Encrypted data looks like noise. With the key, it turns back into the original exactly.
  That's the point: you want the data back. Think of a message, a file, or a card number for
  a refund.

  Everything rests on the key. Store the key beside the data and you've locked the door and
  taped the key to it. Keep keys in a key manager, rotate them, and use well-known
  algorithms through a well-known library, never your own.
analogy: A diary with a lock. Anyone can steal it, but only the person with the key can read it.
usage: The backups have encryption at rest, but the key sits in the same bucket, so it's theatre.
twin:
  term: hashing
  difference: Encryption is two-way, so the right key brings the original back. Hashing is one-way, so you can only check whether something matches.
related:
  - hashing
  - secret
  - tls
level: 1
