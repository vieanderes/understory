term: runtime
aka:
  - runtime environment
short: The program that must be installed for your code to run, such as Node for JavaScript.
explain: |
  A script on its own is text. Something has to read it and carry it out. It also supplies the standard library, memory
  management, and access to files and the network. That something
  is installed separately on every machine the code runs on.

  A Python script needs Python, a JavaScript server needs Node. A compiled binary from Go or
  Rust carries what it needs inside, so it runs on a bare machine.

  This decides where code can go. A phone or a customer's laptop may not let you install one. That is often the real reason one
  language wins over another.
analogy: A record player. The record holds the music, but you need the player to hear it.
usage: We can't install a runtime on the customer's servers, so ship a Go binary instead of the script.
