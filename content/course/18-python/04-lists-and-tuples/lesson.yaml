deepDive: >-
  A slice copy is shallow: a new list holding the same objects, so nested lists are still
  shared. `copy.deepcopy` copies all the way down. `a, b = b, a` swaps two values in one
  line, because the right side builds a tuple before either name changes.


  Many list methods return `None` on purpose, to remind you they changed the list in place,
  so `nums = nums.sort()` leaves you with `None`. `is` compares identity, which is why
  `x is None` is safe: there is only one `None`. For small numbers and short strings, `is`
  may happen to say `True`, because Python reuses those objects. Never rely on it, and ruff
  flags `is` with a literal.
