id: ai.evals
title: Evals
objective: "Build an eval set, grade with code or a model judge, and block a release when any slice regresses."
level: advanced
minutes: 10
concepts: [ai.golden-sets, ai.llm-as-judge, ai.regression-gates]
prerequisites: [ai.rag, pyai.pytest]
opening:
  text: >-
    You'll know whether a prompt change made your AI feature better or worse, before users
    tell you. Evals are how AI teams ship without fear.

steps:
  - type: prose
    id: what-an-eval-is
    body: >-
      Unit tests use a fake model, so they check your code, not the answers. To check the
      answers, run the real model on a fixed list of cases and grade the results. That's an
      **eval**.


      The list is the **eval set**, sometimes called a golden set: real inputs, each with
      the expected answer or a rule for grading it. Run it on every change to the prompt, model or retrieval.

  - type: prose
    id: graders
    body: |-
      Grade with code whenever you can. It's fast, free and never changes its mind:

      ```python
      def grade(case, output):
          return output["category"] == case["expected_category"]

      results = [grade(case, classify(case["email"])) for case in cases]
      print(sum(results) / len(results))   # the pass rate
      ```

      Code can check a label, valid JSON or a citation. Judging "is this reply
      helpful?" isn't.

  - type: fill-blank
    id: fill-code-grader
    concept: ai.golden-sets
    difficulty: 1
    language: python
    prompt: Grade each answer by whether it cites at least one source, like `[1]`.
    template: |
      def grade(case, answer):
          return {{1}}(f"[{n}]" in answer for n in range(1, 6))

      passed = [grade(case, run_bot(case["question"])) for case in {{2}}]
    blanks:
      - key: '1'
        answer: any
      - key: '2'
        answer: cases
    bank: [any, all, len, cases, answer]

  - type: ai-review
    id: review-eval-from-examples
    concept: ai.golden-sets
    difficulty: 2
    language: python
    request: Build an eval set so we can check changes to the help bot's prompt.
    flawClass: logic
    code: |
      from prompt import SYSTEM, EXAMPLES   # the prompt shows 20 worked examples

      cases = [{"question": ex["question"], "expected": ex["answer"]} for ex in EXAMPLES]

      def run_eval():
          return [ask(client, c["question"], system=SYSTEM) == c["expected"] for c in cases]
    prompt: >-
      An assistant wrote this. It scored 20 of 20. A week later a prompt change broke bank holiday answers for real users. The eval
      still scored 20 of 20. Tap the line
      at fault.
    lines: [3]
    reasons:
      - text: The cases are the prompt's own examples
        correct: true
        feedback: >-
          Yes. The model copies what it's shown. Use real questions it has never seen.
      - text: '`==` is too strict for free text'
        feedback: >-
          True, but a looser check on the same cases would still pass them all.
      - text: 20 cases is too few
        feedback: >-
          Twenty real questions would have caught it. The source of the cases is the flaw.
    fix: |
      # Real questions from the logs, including ones that went wrong, kept apart from the prompt.
      cases = load_cases("evals/help_bot.jsonl")

  - type: prose
    id: llm-as-judge
    body: >-
      For qualities code can't check, a model can grade against a rubric. That's
      **LLM-as-judge**. It scales to thousands of outputs, and it has leanings: it tends to
      prefer the first answer shown, the longer one, and its own style.


      So check the judge. Grade a sample by hand and measure how often it agrees. Ask yes or
      no questions, not scores out of ten. Show pairs in both orders.

  - type: multiple-choice
    id: pick-position-bias
    concept: ai.llm-as-judge
    difficulty: 2
    code: |
      judge(question, first=answer_x, second=answer_y)   # says "first"
      judge(question, first=answer_y, second=answer_x)   # says "first"
    language: python
    question: The same pair, swapped. The judge picked the first both times. What does that show?
    choices:
      - text: The judge prefers whichever comes first
        correct: true
        feedback: >-
          Right. That's position bias. Count a win only when both orders agree.
      - text: Both answers are equally good
        feedback: >-
          A real tie would look random, not land on the same slot every time.
      - text: '`answer_x` is better'
        feedback: >-
          In the second call, first was `answer_y`. The judge picked a position, not a text.

  - type: prose
    id: slices
    body: >-
      One pass rate hides a lot. A new prompt can win overall while one kind of question
      falls apart.


      So group the cases into **slices**, such as refunds, delivery and billing, and score
      each slice. A **regression gate** runs the eval on every change. It blocks the change when
      any slice drops, not only when the average does.

  - type: ai-review
    id: review-average-gate
    concept: ai.regression-gates
    difficulty: 3
    language: python
    request: Only ship a new prompt if the eval says it's no worse.
    flawClass: logic
    code: |
      def should_ship(before, after):
          old = sum(r["passed"] for r in before) / len(before)
          new = sum(r["passed"] for r in after) / len(after)
          return new >= old
    prompt: >-
      An assistant wrote this. The new prompt passed more cases overall and shipped. Refund
      answers went from 9 in 10 right to 4 in 10. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It compares only the overall average
        correct: true
        feedback: >-
          Yes. Gains elsewhere hid the refund slice collapsing. Compare every slice.
      - text: '`>=` should be `>`'
        feedback: >-
          That blocks ties, not collapses. The average itself hides the problem.
      - text: Booleans can't be summed
        feedback: >-
          `True` counts as 1, so the sums work. What they sum over is the issue.
    verify:
      question: "Which test would have caught this?"
      choices:
        - text: "One slice drops while the average rises, expecting no ship"
          correct: true
          feedback: "Yes. That's the release that got through."
        - text: "Every slice improves, expecting a ship"
          feedback: "That passes with the bug in place. The average and every slice agree."
        - text: "Old and new averages are equal"
          feedback: "That tests `>=` against `>`. A collapsing slice can hide behind any average."
    fix: |
      def should_ship(before, after):
          return regressions(before, after) == []

  - type: code-challenge
    id: write-regressions
    concept: ai.regression-gates
    difficulty: 3
    language: python
    starter: gate.starter.py
    solution: gate.solution.py
    tests: gate.tests.py
    prompt: >-
      Write `regressions(before, after, tolerance=0.05)`. Each run is a list of results like
      `{"slice": "refunds", "passed": True}`. Work out each slice's pass rate in both runs.


      Return the names of slices whose rate dropped by more than `tolerance`, sorted. A slice
      missing from `after` counts as regressed. A new slice doesn't.
    hints:
      - Write a helper that turns a run into a dict of slice name to pass rate.
      - Two `defaultdict(int)` counters, one for passes and one for totals, make the helper short.
      - Then compare the two dicts, slice by slice, for every slice in `before`.

  - type: explain-back
    id: explain-judge-agreement
    concept: ai.llm-as-judge
    difficulty: 3
    audience: teammate
    kind: risk
    prompt: "Your team wants a model to grade 5,000 support replies a night. Warn them what could go wrong with its grades, and how you'd check first."
    rubric:
      - "The judge can disagree with people, so grade a sample by hand and measure agreement."
      - "It has leanings, such as position and length, which swapping the order exposes."
      - "Grades drift when the judge or rubric changes, so use yes or no criteria and recheck."
    modelAnswer: "A judge can be wrong thousands of times a night without anyone noticing. Before trusting it, I'd grade a hundred replies myself and measure how often it agrees. It may favour the first answer or the longer one, so I'd swap the order and compare. Vague scores drift, so I'd ask yes or no questions, and recheck whenever the judge model or the rubric changes."

recap:
  - Keep an eval set of real cases, apart from the prompt's examples, and run it on every change.
  - Grade with code where you can, and check a model judge against people.
  - Gate releases on every slice, not only the average.

recall:
  - id: card-eval-set
    concept: ai.golden-sets
    front: Where should an eval set's cases come from?
    back: >-
      Real inputs, including past failures, kept apart from the prompt's examples. Cases
      the model was shown test the prompt, not the bot.
  - id: card-code-first
    concept: ai.golden-sets
    front: When should you grade with code rather than a model?
    back: >-
      Whenever the rule can be checked exactly: a label, valid JSON, a citation. It's fast,
      free and consistent.
  - id: card-judge-biases
    concept: ai.llm-as-judge
    front: Name two leanings of a model judge.
    back: >-
      It prefers the first answer shown, and longer answers. It also favours its own style.
  - id: card-gate-slices
    concept: ai.regression-gates
    front: Why gate on each slice, not the average?
    back: >-
      Gains in some slices can hide one slice collapsing, and the average still rises.

references:
  - kind: paper
    title: Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena
    authors: Lianmin Zheng et al.
    year: 2023
    venue: NeurIPS 2023 Datasets and Benchmarks
    url: https://arxiv.org/abs/2306.05685
    note: How often model judges agree with people, and their position and length biases.
    primary: true
    verified: true
  - kind: docs
    title: Define success criteria and build evaluations
    authors: Anthropic
    venue: Claude Platform documentation
    url: https://platform.claude.com/docs/en/test-and-evaluate/develop-tests
    note: Eval sets, code-graded and model-graded checks.
    primary: true
    verified: true

deepDive: >-
  **Where cases come from.** Start with twenty real inputs and grow the set from
  production: every bug report becomes a case. Keep the file in Git, one case per line as
  JSON, a format called JSON Lines.


  **Noise.** Sampling means the same prompt scores a little differently each run. Run
  small sets more than once, and don't celebrate a one-case gain.


  **Judges in depth.** Chapter 21 calibrates a judge against human labels, compares
  versions pairwise, and runs evals on live traffic.
