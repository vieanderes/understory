term: curse of knowledge
aka:
  - expert blind spot
short: Once you understand something, finding it hard to imagine not understanding it, so explanations skip steps.
explain: |
  You've worked on the cache for a month. "Stale-while-revalidate" feels like a normal word.
  To a new colleague it's noise, and you can't feel the gap any more.

  So you skip steps, use your team's shorthand, and leave out the example that made it click
  for you. The listener nods and doesn't follow.

  You can't feel your way out of it; you have to check. Start with an example before the term, and define words the first time. Then ask the listener
  to say it back in their own words.
analogy: Giving directions in your home town. "Turn left where the bakery used to be."
usage: That's the curse of knowledge; we've said "the sync" for a year, and nobody new knows which one.
twin:
  term: teach-back
  difference: The curse of knowledge is the blind spot that makes explanations skip steps. Teach-back is the check that finds it, by having the listener explain it back.
related:
  - teach-back
  - bottom-line-up-front
level: 2
lessons:
  - explain.say-it-plainly
