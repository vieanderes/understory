term: linter
aka:
  - lint
  - linting
short: A tool that reads your code without running it and flags likely bugs and risky patterns.
explain: |
  Some mistakes are visible without running anything: a variable you never use, a
  promise nobody awaits, a comparison that's always true. A machine can spot them in
  milliseconds.

  It parses the code and checks it against rules, then reports each break with a file and
  line. Many rules come with an autofix. Run it in the editor and in CI. When it complains,
  read the rule before silencing it; a disable comment is a decision, and it should say
  why.
analogy: A proofreader who marks "their" where you meant "there". They don't care about your fonts, only whether it's wrong.
example:
  language: bash
  code: |
    $ pnpm eslint src
    src/cart.ts
      14:9  error  'total' is assigned but never used  no-unused-vars
      22:3  error  Promise returned is not awaited     no-floating-promises
usage: The linter caught a missing await that would have swallowed the error.
twin:
  term: formatter
  difference: A linter looks for problems in what the code does. A formatter only changes how it looks, its spacing and line breaks, and never finds a bug.
related:
  - formatter
  - continuous-integration
  - nit
level: 1
