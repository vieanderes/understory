term: JSON
aka:
  - JavaScript Object Notation
short: A plain-text format for data made of objects, arrays, strings, numbers, booleans and null.
explain: |
  Two programs in different languages need to swap data. They need a format both can
  read and write. This one looks like a JavaScript object literal and nearly every
  language can parse it.

  It's stricter than it looks: keys need double quotes, no trailing commas, no comments,
  no dates, no `undefined`. Numbers are floating point, so a large id can lose digits on
  the way through. Send big ids as strings and dates as ISO text.
analogy: A standard shipping crate. Whatever's inside, every port in the world knows how to lift it.
example:
  language: json
  code: |
    {
      "id": "9007199254740993",
      "title": "Weekly shop",
      "items": ["milk", "bread"],
      "done": false,
      "due": "2026-10-12"
    }
usage: The date comes back as a string, because JSON has no date type.
