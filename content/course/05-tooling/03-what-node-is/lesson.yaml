deepDive: |-
  Node is built on V8, the same JavaScript engine as Chrome. What it adds is access to the
  computer: files, the network, other programs. What it lacks is a page, so there's no
  `document` or `window`.

  Type `node` with no file name and you get a prompt, `>`, that runs each line as you type it.
  Ctrl-D leaves. `node --watch server.js` reruns the file every time you save it.

  A stack trace keeps 10 frames by default. `Object.<anonymous>` appears because Node wraps
  each classic script file in a function before running it, and that function has no name.

  An uncaught error ends Node with exit code 1, so `node test.js && echo passed` only prints
  when the file ran to the end.

  `process.env.PORT ?? "3000"` doesn't help with `PORT=`. An empty string isn't `undefined`,
  so `??` keeps it.
