    authors: Docker
    venue: Docker Docs
    url: https://docs.docker.com/reference/cli/docker/container/run/
    note: '`-d`, `-p`, `-e` and `--rm`.'
    verified: true

deepDive: >-
  Everything here ran with Docker 28.3 on a Mac, using `node:24-slim` and a 12-line
  to-do API with no packages. Without `-p`, `curl localhost:3000/todos` failed with
  `curl: (7) Failed to connect to localhost port 3000`, although the container was up.
  With `-p 8080:3000`, `docker ps` showed `0.0.0.0:8080->3000/tcp`. The app has to listen
  on `0.0.0.0` inside the container, as lesson 1 said. One bound to `127.0.0.1` only
  answers from inside its own container.


  The build log ended with `naming to docker.io/library/todo-api:latest`. With no tag,
  Docker adds `latest`. The next lesson explains why you shouldn't deploy that.


  The `RUN node server.js` build printed `Listening on 3000` and hung until we killed it.


  On macOS and Windows, Docker Desktop runs a small Linux virtual machine, and containers
  share that machine's kernel. That's the `linuxkit` in the version. The Mac's own kernel
  reported `25.6.0`. On a Linux server there's no such machine, and `uname -r` in a
  container matches the host.


  How does the isolation work? Kernel **namespaces** give the process its own view: in a
  `node:24-slim` container, `ls /proc` showed only its own couple of processes, while the
  machine ran hundreds. **cgroups** cap its memory and CPU. By default the process runs as
  `root` inside the container, so production images end with `USER node`, which the next
  lesson covers.
