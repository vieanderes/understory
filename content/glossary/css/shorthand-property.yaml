term: shorthand property
aka: [shorthand, longhand property, longhand]
short: A CSS property such as border or margin that sets several related properties in one line.
explain: |
  Writing `border-width`, `border-style` and `border-color` every time gets long. So CSS
  offers one property that sets all three at once: `border: 1px solid grey`. The separate
  properties it covers are called longhands.

  The trap: a shorthand sets every longhand it covers, including the ones you leave out.
  Those go back to their starting values. So `background: blue` after a
  `background-image` rule wipes the image. Use the longhand when you mean to change one
  thing.
analogy: Ordering the set menu. It's quicker, but you get the default dessert unless you say otherwise.
example:
  language: css
  code: |
    .card {
      background-image: url(leaf.svg);
      background: white; /* resets background-image to none */
    }
usage: That shorthand property resets the image you set above, so use `background-color` instead.
related: [cascade, css-selector, box-model]
level: 2
