term: duck typing
short: Caring only whether an object has the methods you need, not which class it belongs to.
explain: |
  A function writes text somewhere. Does it need a real file? Or will anything with a
  `write` method do: a file, a network stream, a string buffer in a test?

  Python takes the second view. It calls the method and only complains if it's missing.
  That makes code flexible and quick to fake in tests. The cost is that mistakes show up at
  run time. A `Protocol` type hint gets you both: the checker confirms the method exists
  without demanding a class.
analogy: Hiring a driver. You don't ask where they trained; you check they can drive.
example:
  language: python
  code: |
    from typing import Protocol

    class Writer(Protocol):
        def write(self, text: str) -> int: ...

    def save(report: str, out: Writer) -> None:
        out.write(report)   # a file, a socket, io.StringIO
usage: Thanks to duck typing, the test passes a StringIO and the function never knows.
