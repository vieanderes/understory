      - id: cloud.hosting-models
        dir: 13-hosting-models
        title: Choosing where to host
        objective: Choose between a VPS, a managed platform, functions and Kubernetes for a real project, and defend the choice on work, cost and control.
        level: essential
        concepts: [cloud.vps, cloud.managed-platforms, cloud.kubernetes, cloud.golden-paths]
      - id: cloud.serverless
        dir: 14-serverless-functions
        title: Serverless functions
        objective: Plan for cold starts, time limits, connection exhaustion and pricing.
        level: advanced
        concepts: [cloud.serverless-functions, cloud.cold-starts, cloud.connection-exhaustion]
      - id: cloud.edge
        dir: 15-edge-functions-and-cdns
        title: Edge functions and CDNs
