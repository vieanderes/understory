term: deep copy
aka:
  - deep clone
  - structuredClone
short: A full duplicate of an object, with every nested object duplicated too, so nothing is shared.
explain: |
  Sometimes you need a copy you can change at any depth: a draft of a form, a snapshot for
  undo. `structuredClone(value)` walks the whole object and copies every level.

  It costs time and memory on big objects, and it can't copy functions. In React state,
  copying only the levels you change is usually better. The old
  `JSON.parse(JSON.stringify(x))` trick quietly loses dates and `undefined`.
analogy: Building a second model from the same kit. Snap a piece off the new one, and the first is still whole.
example:
  language: js
  code: |
    const draft = structuredClone(order);
    draft.items[0].quantity = 5;
    order.items[0].quantity; // unchanged
usage: Take a deep copy before editing, or the cancel button won't restore anything.
twin:
  term: shallow-copy
  difference: A deep copy duplicates every level, so the two never share anything. A shallow copy duplicates only the top level and shares everything nested.
related:
  - shallow-copy
  - immutability
level: 2
lessons:
  - js.references-and-copying
