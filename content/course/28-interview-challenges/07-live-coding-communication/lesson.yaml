id: interview.communication
title: Live-coding communication
objective: 'Run a live round out loud: a steady script, checkpoints instead of commentary, framed silence and hints taken well.'
level: essential
minutes: 10
concepts: [interview.round-script, interview.taking-hints]
prerequisites: [interview.timed-strategy, algo.mock-round]
opening:
  text: >-
    You'll have a steady script for any live coding round, so nerves don't decide what you
    say. Half the score in these rounds is how you think out loud.

steps:
  - type: prose
    id: the-rubric
    body: |-
      What you need: some coding experience. A live round is 45 to 60 minutes of coding
      while an interviewer watches. It's usually scored on four areas: **communication**,
      problem solving, the code itself and testing.

      So the code is a quarter of the marks. The rest is what they hear you do.

  - type: prose
    id: the-script
    body: |-
      A fixed script stops nerves skipping steps:

      1. Restate the problem: inputs, outputs, limits.
      2. Work one small example by hand.
      3. Say the brute force and its cost.
      4. Improve it, and say why it's faster.
      5. Agree the plan with the interviewer.
      6. Code it with clear names.
      7. Test a normal case, a boundary and a nasty one.
      8. State the cost and the next extension.

  - type: prose
    id: checkpoints-and-silence
    body: |-
      Talk at **checkpoints**, not every keystroke. Say the plan. Say what each helper is
      for. Say when you start testing.

      Silence is fine if you frame it, for example by asking for a minute to think.
      When you're stuck, say what you know, then try a smaller case aloud.

  - type: bug-hunt
    id: hunt-ignored-hint
    concept: interview.taking-hints
    difficulty: 2
    language: yaml
    code: |
      00:02 you: So I get daily prices and return the best profit?
      00:03 them: Yes. One buy, then one later sell.
      00:05 you: Brute force tries every pair, so O(n²). Let me look for better.
      00:06 you: Give me a minute to think quietly.
      00:09 them: What if you kept track of something as you walk the list?
      00:09 you: I'll finish the pairs version first, then see.
      00:24 you: Done. Let me trace a rising list, then an empty one.
    prompt: >-
      A transcript from a mock round. The candidate did most things right. Tap the moment
      that cost the most marks.
    lines: [6]
    reasons:
      - text: It brushes off a hint
        correct: true
        feedback: >-
          Yes. An interviewer's question is a hint. Say what it changes, then use it.
      - text: Asking for a minute of quiet
        feedback: >-
          Framed silence is fine. It's the unexplained kind that scores badly.
      - text: Naming the brute force before coding
        feedback: >-
          That's the script working. It sets the baseline the better idea must beat.

  - type: parsons
    id: order-round-script
    concept: interview.round-script
    difficulty: 2
    prompt: Put the round script in order.
    language: text
    blocks:
      - id: restate
        code: Restate the problem and confirm inputs, outputs and limits
        subgoal: Understand
      - id: example
        code: Work one small example by hand
      - id: brute
        code: Say the brute force and its cost
        subgoal: Plan
      - id: improve
        code: Improve it and say why it's faster
      - id: agree
        code: Agree the plan with the interviewer
      - id: code
        code: Code it with clear names and small helpers
        subgoal: Build
      - id: test
        code: Test a normal case, a boundary and a nasty one
      - id: summarise
        code: State the time and space cost, and the next extension
        subgoal: Close
    distractors:
      - id: jump
        code: Type the fastest solution you know straight away
        feedback: >-
          Skipping the plan hides your thinking, and a wrong start costs the most time.
      - id: narrate
        code: Describe every keystroke as you type it
        feedback: >-
          That drowns the useful parts. Speak at checkpoints: the plan, a helper, a test.

  - type: multiple-choice
    id: pick-after-coding
    concept: interview.round-script
    difficulty: 2
    question: You've finished writing the code. The interviewer is quiet. What do you say?
    choices:
      - text: '"Let me trace a normal case, then an empty list."'
        correct: true
        feedback: >-
          Right. Testing before anyone asks is one of the clearest senior signals.
      - text: "\"I think that's it. It should work.\""
        feedback: >-
          "Should" invites them to find the bug for you. Show it works instead.
      - text: '"Could you run it for me?"'
        feedback: >-
          Running is fine, but tracing by hand shows you understand it. Lead the testing yourself.
      - text: '"Shall I make it faster now?"'
        feedback: >-
          Faster comes after correct. An untested optimisation stacks risk on risk.

  - type: multiple-choice
    id: pick-when-stuck
    concept: interview.round-script
    difficulty: 3
    question: Two minutes in, you can't see the fast approach. What's the best move?
    choices:
      - text: Say the brute force, then try a tiny case aloud
        correct: true
        feedback: >-
          Right. It banks a working answer and lets the interviewer follow and steer.
      - text: Stay quiet until the idea arrives
        feedback: >-
          Long unexplained silence scores as no communication. They can't help what they can't see.
      - text: Ask the interviewer for the answer
        feedback: >-
          Asking about constraints is good. Asking for the solution gives away the problem-solving marks.
      - text: Start coding and hope it comes
        feedback: >-
          Code without a plan tends to be rewritten. The brute force is a plan you already have.

  - type: ai-review
    id: review-pair-bound
    concept: interview.round-script
    difficulty: 3
    language: js
    request: Return true if two different items in the sorted list add up to target.
    flawClass: edge-case
    code: |
      function hasPairSum(sorted, target) {
        let lo = 0, hi = sorted.length - 1;
        while (lo <= hi) {
          const sum = sorted[lo] + sorted[hi];
          if (sum === target) return true;
          if (sum < target) lo++; else hi--;
        }
        return false;
      }
    prompt: >-
      The round allows an assistant, and it offered this. You trace `[1, 4]` with target 8
      aloud before running it. Which line do you flag?
    lines: [3]
    reasons:
      - text: '`<=` lets one item pair with itself'
        correct: true
        feedback: >-
          Yes. When `lo` meets `hi`, 4 + 4 makes 8. Use `lo < hi`.
      - text: '`hi` should start at `sorted.length`'
        feedback: >-
          That index is past the end, so `sorted[hi]` would be `undefined`.
      - text: The pointers move the wrong way
        feedback: >-
          A small sum needs a bigger left item, so `lo++` is right.
    fix: |
      while (lo < hi) {

  - type: explain-back
    id: explain-brute-force-first
    concept: interview.round-script
    difficulty: 4
    prompt: >-
      You already know the fast solution. Why say the brute force and its cost out loud
      first?
    rubric:
      - It proves you can reach a correct answer and gives a fallback if time runs out.
      - Its cost is the baseline that shows why the faster idea is worth it.
      - It lets the interviewer agree or steer before you spend time coding.
    modelAnswer: >-
      The brute force shows I understand the problem and gives me something correct to fall
      back on. Saying its cost sets the baseline, so the improvement has a clear reason. And
      it's a cheap checkpoint: the interviewer can agree or redirect before I've written a
      line.

recap:
  - Run a round with the eight-step script, aloud.
  - Speak at checkpoints, frame silence and get unstuck with a small case.
  - Take a hint by saying what it changed, then use it.
recall:
  - id: card-script
    concept: interview.round-script
    front: What are the eight steps of the round script?
    back: >-
      Restate, work an example, brute force, improve, agree the plan, code, test, then state
      the cost and the next extension.
  - id: card-stuck
    concept: interview.round-script
    front: What do you do when you're stuck in a live round?
    back: >-
      Say what you know, state the brute force, and try a smaller case out loud.
  - id: card-hint
    concept: interview.taking-hints
    front: How do you take a hint well?
    back: >-
      Acknowledge it, say what it changes in your approach, and use it straight away.

references:
  - kind: essay
    title: How candidates are evaluated in coding interviews at top tech companies
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/coding-interview-rubrics/
    note: The four rubric areas and what strong and weak signals look like in each.
    primary: true
    verified: true
  - kind: essay
    title: "Meta's AI-Enabled Coding Interview: How to Prepare"
    authors: Hello Interview
    url: https://www.hellointerview.com/blog/meta-ai-enabled-coding
    note: How communication and verification are scored when an assistant is in the room.
    verified: true

deepDive: >-
  The four rubric areas come from published interviewer guides at large tech companies,
  collected in the Tech Interview Handbook. Strong candidates communicate clearly while
  coding, offer more than one solution with trade-offs, and test without being asked.


  What moves a round to senior: handling edge cases before they're raised, turning a vague
  requirement into a stated assumption, and giving trade-offs as a default plus what would
  change it. Code that extends cleanly to the next requirement counts too, which is why
  the closing line names an extension.


  Hints are part of the scoring. Needing no major hint is the top band, but taking a hint
  well still scores far better than ignoring one. Interviewers phrase hints as questions,
  like "what if the input were sorted?". Treat every such question as a hint.


  With an assistant in the room, the same script holds. Plan aloud before prompting, ask
  for pieces you can review, run the tests, fix small things by hand and be ready to
  explain every line.
