term: status update
aka:
  - progress update
  - weekly update
  - stand-up update
short: A short report on how planned work is going, leading with whether it's on track and what's needed.
explain: |
  Your manager and the people waiting on your work need to know one thing first: is it on
  track? Then: what changed, what's blocked, and what you need from them.

  Say that in the first line. "On track for Thursday; I need a decision on the export format by
  Tuesday." Details follow for anyone who wants them.

  The trap is the diary: a list of everything you did this week, with the risk buried in
  paragraph four. Activity isn't progress. Lead with the outcome and the ask.
analogy: A pilot's cabin announcement. Arrival time and anything you need to do, not the engine readings.
usage: Lead your status update with "at risk" and the decision you need, not the list of tickets closed.
twin:
  term: incident-update
  difference: A status update covers routine progress on planned work. An incident update goes out during an outage, on a promised schedule, with the impact first.
related:
  - incident-update
  - bottom-line-up-front
  - stakeholder
level: 1
lessons:
  - explain.audiences
