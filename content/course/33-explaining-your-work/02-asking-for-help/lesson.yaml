id: explain.asking-for-help
title: Asking a question people can answer
objective: Ask a question people can answer, with expected and actual behaviour, a minimal reproduction and what you already tried.
level: essential
minutes: 10
concepts: [explain.expected-and-actual, explain.minimal-reproduction]
prerequisites: [js.errors, explain.say-it-plainly]
opening:
  text: >-
    You'll ask for help so that the first reply is an answer, not three questions back. It
    works on a forum, with a teammate and with an AI assistant.

steps:
  - type: prose
    id: what-helpers-need
    body: >-
      *My code doesn't work, any ideas?* gets a question back, not an answer. A helper needs
      what you **expected**, what happened instead, and code that shows it.


      What happened instead is the **actual** result: the real output or the exact error. A
      person asks for these one round at a time. An AI assistant often doesn't ask. It
      guesses, then answers its guess.

  - type: multiple-choice
    id: pick-answerable-question
    concept: explain.expected-and-actual
    difficulty: 1
    question: Which message gets a useful answer the first time?
    choices:
      - text: My recipe scaler is broken, any ideas?
        feedback: >-
          The first reply will be three questions. You've spent a round and learned nothing.
      - text: '`scaleRecipe(soup, 2)` gives `NaN`; I expected `400`.'
        correct: true
        feedback: >-
          Yes. Expected, actual and the exact call: a helper can start right away.
      - text: Why is JavaScript so weird with numbers?
        feedback: >-
          Too wide to answer. Your bug is one call with one wrong result, so ask about that.
      - text: 'Urgent: scaling bug, need help fast'
        feedback: >-
          Urgency doesn't help anyone act. Without expected and actual, fast help can't start.

  - type: bug-hunt
    id: hunt-vague-actual
    concept: explain.expected-and-actual
    difficulty: 2
    language: text
    code: |
      title: scaleRecipe returns NaN for one ingredient
      expected: scaleRecipe(soup, 2) doubles every amount
      actual: it doesn't work
      code: 8 lines below, they run on their own
      tried: wrapped each amount in Number(), same result
    prompt: >-
      You post this question. The first reply asks what you're seeing. Tap the line a helper
      can't act on.
    lines: [3]
    reasons:
      - text: It doesn't say what happened
        correct: true
        feedback: >-
          Right. Paste the real output: `[ 400, NaN, 6 ]`.
      - text: The title is too specific
        feedback: >-
          Specific titles get answers, and the next person with this bug can find it.
      - text: Expected should include the whole app
        feedback: >-
          Expected is one sentence about behaviour. The whole app would bury it.
      - text: Tried gives away too much
        feedback: >-
          What you tried saves the helper from suggesting it again. It belongs in every
          question.
    fix: |
      actual: [ 400, NaN, 6 ], and no error is thrown

  - type: parsons
    id: arrange-question
    concept: explain.expected-and-actual
    difficulty: 2
    language: text
    prompt: >-
      You're asking an AI assistant about the bug. Put the message in an order it can act
      on. One line doesn't belong.
    blocks:
      - id: problem
        code: scaleRecipe returns NaN for one ingredient.
        subgoal: The problem in one line
      - id: expected
        code: I expected scaleRecipe(soup, 2) to double every amount.
        subgoal: Expected and actual
      - id: actual
        code: Instead I get [ 400, NaN, 6 ], with no error.
        subgoal: Expected and actual
      - id: repro
        code: 'Here are 8 lines that still do it on their own:'
        subgoal: The smallest code
      - id: tried
        code: Wrapping each amount in Number() gave the same NaN.
        subgoal: What you tried
      - id: stuck
        code: I'm stuck on how to handle amounts that aren't numbers.
        subgoal: Where you're stuck
    distractors:
      - id: whole-project
        code: Here's my whole project, all 40 files. Fix it.
        feedback: >-
          No one, person or AI, reads 40 files well. The smallest code that fails gets a
          sharper answer.

  - type: prose
    id: minimal-reproduction
    body: >-
      A **minimal reproduction** is the smallest code that still shows the problem. No app,
      no database, no login: the call, the data it needs and the wrong output.


      You make one by deleting. Remove a piece, run it, and check the bug is still there. If
      it is, that piece wasn't the cause. Repeat until nothing more can go.

  - type: multiple-choice
    id: predict-shrinking
    concept: explain.minimal-reproduction
    difficulty: 2
    question: You cut a bug in 300 lines down to 8 for a forum post. What often happens first?
    choices:
      - text: The bug turns out to be random
        feedback: >-
          When a deletion makes it vanish, you've found what triggers it. That's evidence, not
          chance.
      - text: The 8 lines are too short to help
        feedback: >-
          Short is what helpers want. Eight lines that fail beat 300 that might.
      - text: You find the cause yourself
        correct: true
        feedback: >-
          Yes. Each deletion rules something out, so what's left points at the cause.
      - text: Nothing, it only saves the helper time
        feedback: >-
          It saves their time, and often more of yours. Shrinking is debugging in disguise.

  - type: ai-review
    id: review-repro-key
    concept: explain.minimal-reproduction
    difficulty: 3
    language: js
    request: Turn my recipe bug into a minimal reproduction I can post on a public forum.
    flawClass: data-exposure
    code: |
      const API_KEY = "nk_live_8f2c41d9e7b3";
      const soup = {
        name: "Tomato soup",
        items: [{ amount: 200 }, { amount: "a pinch" }, { amount: 3 }],
      };
      function scaleRecipe(recipe, factor) {
        return recipe.items.map((item) => item.amount * factor);
      }
      console.log(scaleRecipe(soup, 2)); // [ 400, NaN, 6 ]
    prompt: >-
      It runs on its own and shows the `NaN`, so it looks done. The assistant copied the
      first line from your app's config. Tap the line at fault before you post.
    lines: [1]
    reasons:
      - text: It publishes a live secret key
        correct: true
        feedback: >-
          Right. The bug doesn't need it, and a posted key is a leaked key.
      - text: The data needs more ingredients
        feedback: >-
          Three items are enough to show it. More data only buries the one that matters.
      - text: '`map` hides the error'
        feedback: >-
          `map` is fine. Multiplying text gives `NaN` without throwing, which is the real
          puzzle.
      - text: It needs the rest of the app
        feedback: >-
          The opposite. It runs alone, and that's exactly what makes it a good reproduction.
    fix: |
      const soup = {
        name: "Tomato soup",
        items: [{ amount: 200 }, { amount: "a pinch" }, { amount: 3 }],
      };
      // ...the same function and call, and no key anywhere
    verify:
      question: You've removed the key. How do you prove the reproduction still shows the bug?
      choices:
        - text: Run the whole app again
          feedback: >-
            The app has everything else around it. It can't tell you the small version still
            fails.
        - text: Run it alone in a new, empty file
          correct: true
          feedback: >-
            Yes. If it shows `NaN` with nothing around it, anyone can reproduce it.
        - text: Reread it carefully, line by line
          feedback: >-
            Reading misses what running catches, such as a name that only exists in the app.
        - text: Ask the assistant if it still works
          feedback: >-
            It will probably say yes either way. Running it is the proof.

  - type: code-challenge
    id: write-shrink
    concept: explain.minimal-reproduction
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '2-3'
    prompt: >-
      Make a minimal reproduction automatically. Write `shrink(items, stillFails)`.
      `stillFails(list)` returns `true` when a list still shows the bug.


      Try removing one item at a time. When the bug survives a removal, keep the smaller list
      and start again from the first item. Return the list once no single removal still
      fails. Keep the order, and don't change `items`.


      Example: if only text amounts break the scaler, `shrink([200, "a pinch", 3], hasText)`
      returns `["a pinch"]`.
    hints:
      - '`filter` can build a copy of the list without the item at one position.'
      - >-
        After a removal works, the smaller list is your new start, and items you kept earlier
        deserve another try.
      - >-
        Keep `current` and an index `i`. Build `current.filter((_, j) => j !== i)` and ask
        `stillFails` about it.

  - type: explain-back
    id: ask-a-teammate
    concept: explain.expected-and-actual
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Your `bookClass` function throws `TypeError: Cannot read properties of undefined
      (reading 'seats')`. It happens only for the Friday yoga class. Ask a teammate for help
      in four sentences or fewer, and invent what you tried. Try saying it out loud before
      you type.
    rubric:
      - It says what you expected, a booking, and what happened, the exact error.
      - It narrows the problem to the smallest case, the Friday class, with a short reproduction.
      - It says what you already tried and exactly where you're stuck.
    modelAnswer: >-
      Booking the Friday yoga class should return a booking. Instead it throws `TypeError:
      Cannot read properties of undefined (reading 'seats')`. Every other class works, and
      these six lines reproduce it with Friday's data. I logged the class, and its `room` is
      `undefined`, but I can't see where it gets lost.

  - type: explain-back
    id: warn-before-posting
    concept: explain.minimal-reproduction
    difficulty: 4
    audience: newcomer
    kind: risk
    prompt: >-
      A newcomer wants to post the whole app on a public forum, with its config and the
      server logs. Warn them what could go wrong, and what to send instead.
    rubric:
      - Passwords, keys or customer data in the config and logs become public, and a leaked key must be replaced.
      - Few helpers read a whole app, so answers come slower or not at all.
      - A minimal reproduction with made-up data, run alone first, with expected and actual, gets a better answer.
    modelAnswer: >-
      Hold on before you post that. The config holds passwords and the logs hold customer
      emails, and both would be public for good. Any key in them would need replacing.
      Nobody reads a whole app either, so you'd wait longer for worse answers. Cut it down to
      the few lines that still show the bug, with made-up data, and run that alone. Then add
      what you expected and what happened.

recap:
  - Ask with what you expected, what happened and the exact error.
  - Shrink the bug to a minimal reproduction, and run it alone.
  - Strip secrets and real data before you post anywhere.

recall:
  - id: card-three-things
    concept: explain.expected-and-actual
    front: What does a helper need before they can start on your bug?
    back: >-
      What you expected, what actually happened with the exact output or error, and code
      that shows it.
  - id: card-minimal-reproduction
    concept: explain.minimal-reproduction
    front: What is a minimal reproduction?
    back: >-
      The smallest code that still shows the problem. It runs on its own, with only the data
      it needs.
  - id: card-shrinking-finds-bugs
    concept: explain.minimal-reproduction
    front: Why does building a minimal reproduction often find the bug?
    back: >-
      Each deletion rules a piece out. What's left when nothing more can go usually points
      straight at the cause.
  - id: card-ai-guesses
    concept: explain.expected-and-actual
    front: Why does a vague question go worse with an AI assistant than with a person?
    back: >-
      A person asks back for what's missing. An assistant often fills the gap with a guess
      and answers that instead.

references:
  - kind: essay
    title: How to Report Bugs Effectively
    authors: Simon Tatham
    url: https://www.chiark.greenend.org.uk/~sgtatham/bugs.html
    note: Why "it doesn't work" helps nobody, and what to say instead.
    primary: true
    verified: false
  - kind: docs
    title: How to create a Minimal, Reproducible Example
    authors: Stack Overflow
    venue: Stack Overflow Help Center
    url: https://stackoverflow.com/help/minimal-reproducible-example
    note: Minimal, complete and reproducible, with advice on cutting code down.
    primary: true
    verified: false
  - kind: essay
    title: How To Ask Questions The Smart Way
    authors: Eric S. Raymond and Rick Moen
    url: http://www.catb.org/~esr/faqs/smart-questions.html
    note: A long, opinionated guide to asking in public forums.
    verified: false
  - kind: paper
    title: Simplifying and Isolating Failure-Inducing Input
    authors: Andreas Zeller and Ralf Hildebrandt
    year: 2002
    venue: IEEE Transactions on Software Engineering, 28(2)
    note: Delta debugging, the automatic version of the shrinking you wrote.
    verified: false

deepDive: >-
  Your `shrink` is a simple form of **delta debugging**. It removes one item at a time, so a
  list of n items can take on the order of n² calls to `stillFails`. The full algorithm,
  ddmin, first tries removing large chunks, such as halves, and only falls back to single
  items when chunks fail. On a long input that saves most of the runs.


  Property-based testing libraries such as fast-check for JavaScript and Hypothesis for
  Python do this for you. They generate random inputs until one fails, then shrink it before
  they report it. That's why their failures arrive as a tiny case, like an empty string or
  `[0, -1]`, and not as the 400-item list that first broke.


  `git bisect` runs the same idea over history instead of input. It halves the range of
  commits until it finds the first one where the bug appears.


  When you ask an AI assistant, add what a person would ask for anyway: the language and
  library versions, the exact error text, and the input. You can also tell it to ask you
  questions before it answers, which stops it guessing.
