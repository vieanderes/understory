term: behavioural interview
aka:
  - behavioral interview
  - behavioural round
  - competency interview
short: An interview round that asks for real past situations to predict how you'll work in future.
explain: |
  "Tell me about a time you disagreed with a teammate." The interviewer isn't after your
  opinions on disagreement. They want one true story, because how you acted before is the
  best guess at how you'll act again.

  Good answers are specific: one situation, what you chose to do, what changed, and what
  you'd do differently. Most of the time goes on your own actions, not the team's.

  The trap is the hypothetical. "I would always listen first" sounds fine and proves nothing.
  Interviewers keep asking "and then what?" until they reach a real decision, so bring one.
analogy: A reference check you give yourself, with evidence instead of adjectives.
usage: The behavioural interview kept pressing on what I did, so the stories with a clear decision went best.
twin:
  term: system-design-interview
  difference: A behavioural interview asks what you did in a real past situation. A system design interview asks how you would build something new, live, on a whiteboard.
