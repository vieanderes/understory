term: secret
aka:
  - credential
short: A password, key or token that grants access and must never appear in code or logs.
explain: |
  Your app needs keys: to the database, the payment provider, the model provider. Anyone
  holding one can act as your app. Committed to a repository, it's readable by everyone who
  can see the history, even after you delete the line.

  Keep them in environment variables or a secrets manager, and out of logs and error
  messages. When one leaks, deleting it isn't the fix. Rotate it: issue a new one and revoke
  the old.
analogy: A house key. You don't tape it to the front door. And if you lose it, you change the lock rather than hope nobody finds it.
usage: There's a secret in that commit, so rotate it now; rewriting history comes second.
related:
