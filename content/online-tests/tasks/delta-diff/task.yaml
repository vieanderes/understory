id: delta-diff
title: DeltaDiff
topic: data-sync
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: P, type: "int[][]" }
    - { name: F, type: "int[][]" }
    - { name: Q, type: int }
    - { name: T, type: int }
  returns: "string[]"
statement: |-
  A sync job copies records from a remote service into a local store. Each run compares the
  previous snapshot P with a fresh fetch F. A row is a pair [D, H]: a record id D and a hash
  H of its content. Both lists come from paged reads, so an id can appear more than once;
  the later row in the same list is the current one.

  Comparing the two gives three kinds of change:

  - **create**: the id is in F but not in P;
  - **update**: the id is in both, with a different hash;
  - **delete**: the id is in P but not in F.

  A fetch that broke halfway looks like a mass deletion. So the job has a safety valve: if P
  holds more than T distinct ids and F holds fewer than Q percent as many distinct ids as P,
  the deletions are held back.

  Write a function:

  {{signature}}

  that, given arrays P and F of pairs and integers Q and T, returns the changes as an array
  of strings: `"create D"` for every created id, then `"update D"` for every updated id, then
  `"delete D"` for every deleted id, each group in ascending order of id. When the safety
  valve holds the deletions back, the deletions are replaced by a single entry `"abort X"`,
  where X is how many deletions were held back.

  For example, given P = [[1, 10], [2, 20], [3, 30]], F = [[3, 31], [1, 10], [4, 40]],
  Q = 50 and T = 10, the function should return ["create 4", "update 3", "delete 2"].

  Given P = [[1, 10], [2, 20], [3, 30], [4, 40]], F = [[2, 20]], Q = 50 and T = 3, the
  function should return ["abort 3"]: P has 4 distinct ids, more than 3, and 1 is fewer
  than 50 percent of 4.

  Given P = [[5, 1], [5, 2]] and F = [[5, 2]], the function should return [] for any Q and
  T, because the later row for id 5 in P has hash 2.

  Write an **efficient** algorithm for the following assumptions:

  - N and M, the lengths of P and F, are integers within the range [0..100,000];
  - each row is a pair [D, H] of integers within the range [1..1,000,000,000];
  - Q is an integer within the range [0..100];
  - T is an integer within the range [0..100,000].
examples:
  - { args: [[[1, 10], [2, 20], [3, 30]], [[3, 31], [1, 10], [4, 40]], 50, 10], expected: ["create 4", "update 3", "delete 2"] }
  - { args: [[[1, 10], [2, 20], [3, 30], [4, 40]], [[2, 20]], 50, 3], expected: ["abort 3"] }
  - { args: [[[5, 1], [5, 2]], [[5, 2]], 50, 0], expected: [] }
tests:
  - name: extreme_empty
    description: empty snapshot, empty fetch
    group: correctness
    cases:
      - { args: [[], [], 50, 0], expected: [] }
      - { args: [[], [[7, 1], [3, 1]], 50, 0], expected: ["create 3", "create 7"] }
      - { args: [[[7, 1], [3, 1]], [], 50, 5], expected: ["delete 3", "delete 7"] }
  - name: safety_valve
    description: the valve at its boundaries
    group: correctness
    cases:
      - { args: [[[7, 1], [3, 1]], [], 50, 1], expected: ["abort 2"] }
      - { args: [[[1, 1], [2, 1], [3, 1], [4, 1]], [[1, 1], [2, 1]], 50, 3], expected: ["delete 3", "delete 4"] }
      - { args: [[[1, 1], [2, 1], [3, 1], [4, 1]], [[1, 1], [9, 9]], 75, 3], expected: ["create 9", "abort 3"] }
      - { args: [[[1, 1], [2, 1], [3, 1], [4, 1]], [[1, 5]], 50, 4], expected: ["update 1", "delete 2", "delete 3", "delete 4"] }
  - name: repeated_ids
    description: an id repeated in a list, the later row wins
    group: correctness
    cases:
      - { args: [[[5, 1], [6, 1], [5, 2]], [[5, 3], [5, 2], [6, 1]], 50, 0], expected: [] }
      - { args: [[[5, 1]], [[5, 1], [5, 9], [8, 2], [8, 2]], 50, 0], expected: ["create 8", "update 5"] }
      - { args: [[[1, 1], [1, 1], [1, 1], [2, 1]], [[1, 1], [1, 1], [1, 1]], 40, 1], expected: ["delete 2"] }
  - name: numeric_order
    description: ids sorted as numbers, not as text
    group: correctness
    cases:
      - { args: [[[100, 1], [9, 1], [20, 1]], [[1000, 1], [3, 1]], 0, 100000], expected: ["create 3", "create 1000", "delete 9", "delete 20", "delete 100"] }
  - name: small_random
    description: random rows, N = M = 60
    group: correctness
    cases:
      - generate: { seed: 4101, args: [{ kind: pairs, n: 60, min: 1, max: 40 }, { kind: pairs, n: 60, min: 1, max: 40 }, { kind: value, value: 50 }, { kind: value, value: 10 }] }
      - generate: { seed: 4102, args: [{ kind: pairs, n: 60, min: 1, max: 80 }, { kind: pairs, n: 20, min: 1, max: 80 }, { kind: value, value: 60 }, { kind: value, value: 30 }] }
  - name: medium_random
    description: random rows, N = M = 2,000
    group: correctness
    cases:
      - generate: { seed: 4103, args: [{ kind: pairs, n: 2000, min: 1, max: 3000 }, { kind: pairs, n: 2000, min: 1, max: 3000 }, { kind: value, value: 50 }, { kind: value, value: 100 }] }
  - name: large_random
    description: random rows, N = M = 100,000
    group: performance
    cases:
      - generate: { seed: 4104, args: [{ kind: pairs, n: 100000, min: 1, max: 150000 }, { kind: pairs, n: 100000, min: 1, max: 150000 }, { kind: value, value: 50 }, { kind: value, value: 1000 }] }
  - name: large_wide_ids
    description: ids up to 1,000,000,000, N = M = 100,000
    group: performance
    cases:
      - generate: { seed: 4105, args: [{ kind: pairs, n: 100000, min: 1, max: 1000000000 }, { kind: pairs, n: 100000, min: 1, max: 1000000000 }, { kind: value, value: 90 }, { kind: value, value: 100000 }] }
  - name: large_truncated_fetch
    description: a fetch cut short, N = 100,000, M = 1,000
    group: performance
    cases:
      - generate: { seed: 4106, args: [{ kind: pairs, n: 100000, min: 1, max: 150000 }, { kind: pairs, n: 1000, min: 1, max: 150000 }, { kind: value, value: 50 }, { kind: value, value: 1000 }] }
