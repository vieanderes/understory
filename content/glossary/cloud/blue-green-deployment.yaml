term: blue-green deployment
aka: [ blue-green deploy, blue/green ]
short: Running two identical production environments and switching all traffic from the old one to the new at once.
explain: |
  Updating servers in place means a moment where some are half done. Instead, build a complete
  second copy beside the first, test it, then move the traffic over.

  Blue serves users while green gets the new version and passes its health checks. The router
  flips every request to green. If something is wrong, flip back: blue is still running. It
  costs double the capacity during a release. Both versions share one database, so the schema
  must suit both.
analogy: A theatre with two stages. The next scene is set behind the curtain, then the audience turns its chairs.
usage: With blue-green deployment the rollback is a switch, because the old version is still warm.
twin:
  term: canary-release
  difference: Blue-green deployment moves all traffic to the new version at once, with instant switch-back. A canary release sends a small share first and grows it only while the numbers look healthy.
related: [ canary-release, rollback, health-check, load-balancer, zero-downtime-deployment ]
level: 2
lessons: [ cloud.releases ]
