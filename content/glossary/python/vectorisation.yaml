term: vectorisation
aka:
  - vectorization
  - vectorised operation
  - vectorized
short: Writing one operation over a whole array so compiled code does the loop instead of Python.
explain: |
  A Python loop over a million numbers is slow. Each step looks up types, creates objects and
  runs the interpreter again.

  An array library stores numbers of one type side by side in memory. Write `prices * 1.2` on
  the whole array and the loop runs in compiled code, often a hundred times faster. Boolean
  masks, sums and comparisons work the same way.

  The trap is a loop out of habit, such as `for` over rows or a per-row `apply` in a dataframe. If a step has no whole-array version, that is the step to measure.
analogy: Stamping a whole sheet of labels at once instead of writing each one by hand.
example:
  language: python
  code: |
    import numpy as np

    prices = np.array([12.0, 8.5, 30.0, 4.25])
    with_tax = prices * 1.2          # one operation, no Python loop
    cheap = prices[prices < 10]      # boolean mask
usage: That loop over embeddings takes forty seconds; vectorisation brings it under one.
