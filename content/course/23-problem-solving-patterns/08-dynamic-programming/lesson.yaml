id: algo.dynamic-programming
title: Dynamic programming
objective: Spot overlapping subproblems, memoise a recursion, and turn it into a table filled bottom up.
level: advanced
minutes: 10
concepts: [algo.overlapping-subproblems, algo.memoisation, algo.tabulation]
prerequisites: [algo.heaps-and-top-k, cs.recursion]
opening:
  text: >-
    You'll turn a recursion that crawls into one that finishes at once. The idea
    behind it, dynamic programming, is the one coding-round topic people fear most.

steps:
  - type: prose
    id: picture-dp
    body: |-
      Count the ways to climb `n` stairs, one or two at a time. The last move was one
      stair or two, so:

      ```js
      function ways(n) {
        if (n <= 1) return 1;
        return ways(n - 1) + ways(n - 2);
      }
      ```

      **Dynamic programming** means solving each smaller version once and reusing it.
      Signals: "how many ways", or "the most" with a choice at each step. Another: a greedy
      rule that fails on a small example.

  - type: multiple-choice
    id: spot-dp-signal
    concept: algo.overlapping-subproblems
    difficulty: 1
    question: Which task is dynamic programming?
    choices:
      - text: The most a courier earns, never two jobs running
        correct: true
        feedback: >-
          Yes. Each job is take or skip, and the best answer builds on smaller ones.
      - text: The 10 slowest requests in a log
        feedback: >-
          "Best k" wants a heap, not a table of subproblems.
      - text: The first release that broke a test
        feedback: >-
          A check that flips once wants binary search.
      - text: Every seating order for six guests
        feedback: >-
          "Every order" wants backtracking: you list them all.

  - type: prose
    id: overlapping
    body: |-
      Draw the calls for `ways(5)`. It asks for `ways(4)` and `ways(3)`. But `ways(4)` asks
      for `ways(3)` again, and each of those asks for `ways(2)`.

      The same questions get answered over and over. These are **overlapping
      subproblems**. `ways(30)` makes 2,692,537 calls, for only 31 different questions.
      The call count grows exponentially.

  - type: prose
    id: name-memoisation
    body: |-
      The fix: remember each answer the first time you work it out. Before calculating,
      check the cache; after calculating, store the result.

      That's **memoisation**: recursion plus a cache keyed by the arguments. Each `n` is
      solved once, so `ways(n)` becomes O(n). The key must name every argument that
      changes the answer.

  - type: fill-blank
    id: fill-memo
    concept: algo.memoisation
    difficulty: 2
    prompt: Make `ways` remember each answer, so every `n` is worked out once.
    language: js
    template: |
      const memo = new Map();
      function ways(n) {
        if (n <= 1) return 1;
        if ({{1}}) return memo.get(n);
        const result = ways(n - 1) + ways(n - 2);
        memo.{{2}}(n, result);
        return result;
      }
    blanks:
      - key: '1'
        answer: memo.has(n)
      - key: '2'
        answer: set
    bank: [memo.has(n), memo.get(n), set, push, n in memo]

  - type: code-challenge
    id: write-count-routes
    concept: algo.memoisation
    difficulty: 3
    language: python
    starter: routes.starter.py
    solution: routes.solution.py
    tests: routes.tests.py
    prompt: >-
      A delivery robot moves only right or down across a warehouse floor. Write
      `count_routes(grid)` in Python: how many routes lead from the top-left cell to the
      bottom-right one. `#` is a shelf; `.` is floor.


      `count_routes(["...", ".#.", "..."])` is `2`.


      **Target:** O(rows × columns) for up to 60 by 60. The tests include a blocked start,
      one cell, and an open 60 by 60 floor. Plain recursion runs out of time there. Python's
      integers stay exact even for 35-digit answers.
    hints:
      - The routes into a cell are the routes into the cell above plus the cell to its left.
      - 'Memoise a recursive `routes(r, c)` with a dict keyed by `(r, c)`, or fill a table row by row.'
      - 'For a table, keep one list per row: a shelf cell is `0`, the start is `1`, every other cell adds its left neighbour to what''s above.'

  - type: prose
    id: tabulation
    body: |-
      You can also flip it round. Start from the smallest answers and work upwards, so
      every answer you need is already there. That's **tabulation**:

      ```js
      let twoBack = 1, oneBack = 1; // ways(0), ways(1)
      for (let i = 2; i <= n; i++) [twoBack, oneBack] = [oneBack, oneBack + twoBack];
      ```

      No recursion, so no stack limit, and here only two numbers to keep.

  - type: ai-review
    id: review-memo-key
    concept: algo.memoisation
    difficulty: 4
    language: js
    request: Count the routes from the top-left of a grid to cell (r, c), moving right or down.
    flawClass: logic
    code: |
      const memo = new Map();
      function paths(r, c) {
        if (r === 0 || c === 0) return 1;
        const key = `${r}${c}`;
        if (memo.has(key)) return memo.get(key);
        const result = paths(r - 1, c) + paths(r, c - 1);
        memo.set(key, result);
        return result;
      }
    prompt: >-
      An assistant wrote this. Tests up to 9 by 9 passed. `paths(11, 12)` returns 1,352,013,
      but the right answer is 1,352,078. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Two different cells can share one key
        correct: true
        feedback: >-
          Yes. `(1, 12)` and `(11, 2)` both give `'112'`. Add a separator, like `${r},${c}`.
      - text: The base case should return 0
        feedback: >-
          Along the top row or left column there's exactly one route. 1 is right.
      - text: A `Map` can't hold string keys
        feedback: >-
          It holds any key. The trouble is that two different questions produce the same string.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Cells (1, 12) and (11, 2) in one run
          correct: true
          feedback: >-
            Yes. Both make the key `112`, so the second gets the first answer.
        - text: The same cell asked for twice
          feedback: >-
            A repeat should hit the memo, and it does. That's the memo working.
        - text: A grid that is one row high
          feedback: >-
            The base case answers it before any key is built.
    fix: |
      const key = `${r},${c}`;

  - type: code-challenge
    id: write-best-pay
    concept: algo.tabulation
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: pay.starter.py
      solution: pay.solution.py
      tests: pay.tests.py
    prompt: >-
      A courier app plans shifts. Write `bestPay(pay)`: each number is what one shift in a
      row pays, and you can't work two shifts next to each other. Return the most you can
      earn.


      `bestPay([10, 20, 30, 10])` is `40`. No shifts earn `0`.


      **Target:** O(n) time, O(1) space, for up to 100,000 shifts. Trying every take-or-skip
      choice runs out of time, and recursing 100,000 deep overflows the stack.
    hints:
      - Think about the last shift. You either skip it or take it.
      - Taking it means skipping the one before, so you add its pay to the best from two shifts back.
      - 'Keep only two numbers, `twoBack` and `oneBack`, and update them as you walk the list.'

  - type: explain-back
    id: explain-memo-speedup
    concept: algo.memoisation
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      A reviewer asks why `ways(n)` keeps a memo, since it costs memory. Defend the memo.
    rubric:
      - Without it, the recursion asks the same subproblems again and again, so the calls multiply.
      - With it, each `n` is worked out once and every repeat is a lookup, so O(n) time.
      - The price is O(n) memory for the cache, small next to millions of repeated calls.
    modelAnswer: >-
      Without the memo, `ways(30)` asks for `ways(28)` twice and `ways(27)` three times. The calls run into the millions. The memo stores each answer the first time
      it's worked out. Every repeat is then a quick lookup, so each `n` is solved once: O(n)
      time. It costs O(n) memory, one entry per `n`. Thirty-one numbers in a map is a good
      trade for millions of calls.

recap:
  - Spot subproblems that repeat inside a recursion.
  - Memoise with a cache keyed by every argument.
  - Fill a table bottom up when depth or speed matters.
recall:
  - id: card-when-dp
    concept: algo.overlapping-subproblems
    front: What sign tells you a problem suits dynamic programming?
    back: >-
      Its answer is built from answers to smaller versions of itself, and those smaller
      questions repeat.
  - id: card-memo
    concept: algo.memoisation
    front: What is memoisation?
    back: >-
      Caching each call's result by its arguments, so a repeated call is a lookup instead
      of a new calculation.
  - id: card-memo-key
    concept: algo.memoisation
    front: What goes wrong if two different arguments produce the same memo key?
    back: >-
      One answer is returned for the other question. Build keys with a separator, like
      `${r},${c}`.
  - id: card-tabulation
    concept: algo.tabulation
    front: What does tabulation give you over memoised recursion?
    back: >-
      No recursion, so no stack limit, and often you can keep only the last row or two.

references:
