term: graph
aka: [graphs, directed graph, undirected graph, node and edge]
short: A set of things, called nodes, and the links between them, called edges.
explain: |
  Cities and roads. People and friendships. Packages and their dependencies. Whenever you
  have things and connections, you have one of these.

  Edges can have a direction, like "A depends on B", and a weight, like a distance. Unlike
  a tree, there can be cycles and many paths between two nodes. So any search must mark
  what it has visited, or it goes round forever.

  Store it as an adjacency list: a map from each node to its neighbours. Most searches are
  then O(V + E), the number of nodes plus the number of edges.
analogy: A map of the Underground. Stations are nodes, the lines between them are edges, and there's often more than one way round.
example:
  language: js
  code: |
    const doors = new Map([
      ['hall', ['kitchen', 'lounge']],
      ['kitchen', ['hall', 'garden']],
      ['lounge', ['hall']],
      ['garden', ['kitchen']],
    ]);
    doors.get('kitchen'); // ['hall', 'garden']
usage: Treat the grid as a graph where each cell links to its four neighbours, then run BFS.
twin:
  term: tree
  difference: A graph allows any links, including cycles and several paths, so searches need a visited set. A tree has one root and exactly one path to each node.
related: [adjacency-list, breadth-first-search, depth-first-search, topological-sort, union-find, tree]
level: 1
lessons: [cs.graphs, algo.bfs-and-dfs]
