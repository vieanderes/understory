term: Content Security Policy
aka:
  - CSP
short: A response header listing which sources a page may load scripts, styles and other content from.
explain: |
  Escaping output stops most XSS. This header is the second lock: it tells the browser which
  scripts may run on the page. An injected script from an unknown source, or an inline one
  without the right nonce, is blocked.

  A strict policy sends a fresh random nonce with each response and allows only scripts
  carrying it. Allow lists of whole domains leak, because those domains often host something
  an attacker can use.
analogy: An approved-contractors list at a building's front desk. Even with a forged work order, an unlisted contractor doesn't get in.
example:
  language: http
  code: |
    Content-Security-Policy: script-src 'nonce-r4nd0m' 'strict-dynamic'; object-src 'none'; base-uri 'none'
usage: Add a Content Security Policy with nonces, so the next XSS bug can't run anything.
twin:
  term: cors
  difference: A Content Security Policy limits what your own page may load. CORS decides which other sites may read your server's responses.
related:
  - xss
  - cors
level: 3
lessons:
  - security.xss-and-csp
