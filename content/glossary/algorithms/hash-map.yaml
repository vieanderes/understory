term: hash map
aka: [hash table, hashmap, dictionary, dict]
short: A table that turns each key into a slot number, so a lookup takes one step on average.
explain: |
  Searching a list for a name means checking item after item. A hash map skips the search.
  It runs the key through a hash function, which gives a slot number, and looks there.

  Insert, lookup and delete are O(1) on average. In JavaScript that's a `Map` or a plain
  object; in Python it's a `dict`. Most interview speed-ups start here: store what you've
  seen, then ask in one step whether you've seen it.

  The cost is memory, and no order you can rely on for sorting. When two keys share a
  slot, the map has to tell them apart, and many clashes slow it down.
analogy: A cloakroom ticket. The number on it sends you straight to the right hook, with no searching along the rail.
example:
  language: js
  code: |
    function twoSum(nums, target) {
      const seen = new Map(); // value -> index
      for (let i = 0; i < nums.length; i++) {
        const need = target - nums[i];
        if (seen.has(need)) return [seen.get(need), i];
        seen.set(nums[i], i);
      }
      return null;
    }
usage: Put the values in a hash map first and the inner loop disappears; it's O(n) instead of O(n²).
twin:
  term: hash-set
  difference: A hash map stores a value against each key, like a count or an index. A hash set stores keys only, and answers one question, is it in there.
related: [hash-set, hash-collision, hashing, time-complexity, space-complexity, lru-cache]
