term: render-blocking
aka: [render-blocking resource, parser-blocking, blocking script]
short: Describes a file that stops the browser drawing, or reading the rest of the HTML, until it loads.
explain: |
  The browser won't paint a page without its CSS, or it would flash unstyled content. And a
  plain `<script>` stops it reading further, because the script might change the HTML.

  So stylesheets block rendering and plain scripts block parsing. `defer` downloads a
  script in parallel and runs it after parsing, in order. `async` runs it as soon as it
  arrives, in any order. Neither blocks the parser.
analogy: A car stuck behind a level-crossing barrier. Nothing moves until the train has passed.
example:
  language: html
  code: |
    <script src="/analytics.js"></script>        <!-- blocks parsing -->
    <script src="/analytics.js" defer></script>  <!-- does not -->
usage: That analytics tag is render-blocking in the head; add defer or move it down.
related: [critical-rendering-path, preload, largest-contentful-paint]
level: 2
lessons: [perf.critical-rendering-path]
