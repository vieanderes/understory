summary: >-
  Building a real page is mostly choosing. For each part, you ask what it needs to do and
  pick the tool that fits. Flex lines up a row of items. Grid lines things up in rows and
  columns. Custom properties hold values that repeat, and media queries make the few changes
  a wider screen needs. The chapter's tools don't compete. Each one has a job.


  The order matters as much as the tools. Start with a short reset that removes the browser's
  surprises. Name your colours and spacing once. Build the phone layout with plain rules,
  then let wider screens add to it. Check the page at several widths as you go, not only at
  the end.


  A page is finished when it works for everyone, not when it looks right on your screen. That
  means no sideways scrolling on a 320px phone and a visible outline on whatever the
  keyboard has selected. It also means tap targets big enough for a finger, and text that
  survives zoom. These notes add
  the checks the lesson had no room for.
remember:
  - Plan from big to small, and choose one layout tool per part of the page rather than one tool for the whole page.
  - "A short reset of `box-sizing: border-box`, `margin: 0` on the body and `max-width: 100%` on images removes the most common layout surprises."
  - Mobile first means the plain rules make a complete phone page, and media queries only add for wider screens.
  - A page must work at 320px wide without sideways scrolling, which WCAG 2.2 calls Reflow.
  - '`minmax(min(15rem, 100%), 1fr)` keeps an `auto-fit` grid from overflowing a container narrower than its minimum.'
  - A sticky header can hide the element the keyboard has selected, and `scroll-padding-top` on `html` keeps it in view.
  - Put breakpoints where the content starts to look wrong, not at the widths of popular phones.
sections:
  - title: The reset, line by line
    body: |-
      Browsers give every page some starting styles, and a few of them fight responsive
      layouts. Most teams begin with a short **reset**, a handful of rules that undo those
      surprises:

      ```css
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; }
      img { display: block; max-width: 100%; height: auto; }
      ```

      The first line makes `width` include padding and border on every element. `*` matches
      every element, and `::before` and `::after` cover the extra boxes CSS can add inside an
      element. Without it, a `width: 100%` box with padding is wider than its parent, the bug
      from the lesson's last hunt.

      The second line removes the 8px margin browsers put around the page, so a coloured
      header can reach the edges.

      The third line stops images from breaking the layout. `max-width: 100%` lets an image
      shrink to fit its box. In our test at 320px, a 1200px wide image made the page 1200px
      wide, and with the rule it fitted in 320px. `height: auto` matters when the HTML gives
      the image `width` and `height` attributes, as it should so the browser can save space
      for it. Without `height: auto`, the image shrank to 320px wide but kept its 600px
      height, squashed. With it, the height followed at 160px. `display: block` removes the
      small gap under an image, which otherwise sits on the text line like a letter. In our
      test, a box holding a 50px image was 54px tall until the image became a block.

      A reset should stay short. Every rule in it affects the whole site, so each one needs a
      reason you can say out loud.
  - title: Hunting down sideways scrolling
    body: |-
      A page that scrolls sideways on a phone has one element wider than the screen. Finding
      it is the hard part. A quick trick is to draw an outline round everything for a moment:

      ```css
      * { outline: 1px solid red; }
      ```

      An **outline** is a line drawn outside the border that takes no room, so it doesn't
      change the layout it's showing you. Scroll sideways and look for the box that pokes
      out. Browser developer tools help too: set the viewport to 320px and inspect the widest
      element.

      The usual suspects, all from this chapter:

      - A `width: 100%` box with padding or a border, without `border-box`.
      - An image or video without `max-width: 100%`.
      - A long word or web address with no spaces. `overflow-wrap: anywhere` lets it break.
      - `width: 100vw` on a page with a classic scrollbar.
      - A fixed width, such as `width: 400px`, on anything inside the page.
      - A grid minimum wider than the container.

      That last one hides in the lesson's card recipe. `minmax(200px, 1fr)` promises every
      column at least 200px, even when the container is narrower. In our test, a 150px
      container still got a 200px column that stuck out. The fix uses `min()`, a sibling of
      `clamp()` that picks the smaller of its values:

      ```css
      .events {
        grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr));
      }
      ```

      Now the minimum is 15rem, or the whole container if that's smaller. The same 150px
      container got one 150px column.
  - title: The accessibility checks for a finished page
    body: |-
      WCAG, the Web Content Accessibility Guidelines, is the standard many laws and companies
      refer to. Level AA is the usual target. Four of its success criteria catch pages built like
      this one.

      **1.4.10 Reflow** asks that content works at a width of 320 CSS pixels without scrolling
      in two directions. That's the sideways-scroll hunt again, and it also covers zoom: a
      1280px window zoomed to 400% is 320px wide.

      **2.4.7 Focus Visible** asks that the element the keyboard has selected, the one with
      **focus**, is visible. The `:focus-visible` pseudo-class matches it when the browser
      thinks an outline helps, such as after a Tab key press:

      ```css
      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      ```

      Never remove outlines without putting something as clear in their place.

      **2.4.11 Focus Not Obscured (Minimum)**, new in WCAG 2.2, asks that a focused element
      isn't entirely hidden by content you put on top, such as a sticky header. We tabbed
      backwards through links under a 64px sticky header in Chromium. Without help, the
      browser scrolled focused links to positions 50px and 0px from the top, under the
      header. With `scroll-padding-top` on `html`, they never came closer than 80px:

      ```css
      html { scroll-padding-top: 5rem; }
      ```

      The same rule stops links to a section, such as `#events`, from landing under the
      header.

      **2.5.8 Target Size (Minimum)** asks that things you tap are at least 24 by 24 CSS
      pixels, or spaced so a 24px circle around each doesn't overlap another. The header
      button in the example below is 44px tall.

      Colour contrast still applies too. Dark green on white scores 7.44 to 1, well above the
      4.5 to 1 needed for normal text.
  - title: The finished style sheet
    body: |-
      Here's the whole page from the lesson, cleaned up and with the checks above built in.
      We loaded it in Chromium at 320, 390, 768, 1024 and 1440px wide. None of them scrolled
      sideways, and the grid went from one column to two, three and then four.

      ```css
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; }
      img { display: block; max-width: 100%; height: auto; }

      :root { --leaf: darkgreen; --cream: ivory; --ink: #1a1a1a; --space: 1rem; }

      html { scroll-padding-top: 5rem; }
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: var(--ink);
        background: var(--cream);
      }
      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

      .site-header {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space);
        padding: 0.75rem var(--space);
        background: var(--leaf);
      }
      .site-header a { color: white; text-decoration: none; }
      .site-header a:focus-visible { outline-color: white; }
      .button {
        padding: 0.5rem 0.75rem;
        border: 2px solid white;
        border-radius: 8px;
        transition: background-color 0.2s, color 0.2s;
      }
      .button:hover { background-color: white; color: var(--leaf); }

      .hero, .events { max-width: 70rem; margin: 0 auto; padding: var(--space); }
      .hero h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 1.5rem + 2.5vw, 3rem); line-height: 1.1; }
      .hero p { max-width: 45ch; }

      .events {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr));
        gap: var(--space);
      }
      .event {
        padding: var(--space);
        background: white;
        border-radius: 8px;
        border-left: 6px solid var(--leaf);
      }
      .event h2 { margin: 0 0 0.25rem; font-size: 1.25rem; color: var(--leaf); }
      .event p { margin: 0; }

      @media (min-width: 45rem) {
        .hero { padding-top: 4rem; padding-bottom: 4rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
      ```

      Notice what's missing. There's no media query for the card columns, because the grid
      decides. There's no media query for the heading size, because `clamp()` decides. The
      only breakpoint adds breathing room to the hero. `margin: 0 auto` on the content column
      centres it once the page is wider than 70rem.
pitfalls:
  - '**Picking breakpoints from device lists.** New phones arrive every year with new widths, and the content doesn''t care. Widen the window slowly and add a breakpoint where the layout starts to look wrong.'
  - '**Testing only at the end.** A layout checked once at 1440px hides a dozen phone bugs. Check 320px, a tablet width and a desktop width after every section you build.'
  - '**Removing focus outlines.** `outline: none` makes the page look tidy and leaves keyboard users lost. Style `:focus-visible` with a clear outline instead.'
  - '**A sticky header that covers focus.** Links tabbed to near the top scroll under the header. Add `scroll-padding-top` to `html`, a little more than the header''s height.'
  - '**Images without `height: auto`.** With `width` and `height` attributes and `max-width: 100%`, the image shrinks in width but keeps its height, and looks squashed. Add `height: auto` to the image rule.'
  - '**A card grid minimum wider than the phone.** `minmax(300px, 1fr)` overflows any container under 300px. Wrap the minimum in `min(300px, 100%)`.'
verify:
  - lens: breaks
    check: 'The reset sets `box-sizing: border-box` for every element, so padding and borders never push a box past its parent.'
  - lens: breaks
    check: 'Images have `max-width: 100%`, so a large photo shrinks to fit a phone instead of making the page scroll sideways.'
  - lens: confuses
    check: 'Media queries use `min-width` and only add to the phone layout, so no rule has to be undone at another size.'
  - lens: tests
    check: 'The finished page is checked at 390, 768, 1024 and 1440 pixels, with the keyboard alone and with reduced motion on.'
interview:
  - question: Walk me through how you'd build a responsive page from a design.
    answer: >-
      I work from big to small, and from the phone up. First I look at the design and name
      the regions: header, hero, content, footer. I choose a tool for each: grid for the card
      area, flex for the header row. Then I pull the repeated values out into custom
      properties, such as colours by role and a spacing step. I start the style sheet with a
      short reset, write the phone layout with plain rules, and check it at 320px. Then I
      widen the window slowly and add a `min-width` query only where the layout breaks. I
      prefer layouts that adapt without queries, like `auto-fit` grids and `clamp()` type.
      Finally I test keyboard focus, zoom and contrast. The trade-off is time early on, but it
      avoids a desktop layout that has to be undone for phones.
  - question: A page scrolls sideways on a phone. How do you find and fix the cause?
    answer: >-
      Some element is wider than the viewport, so I find it and then remove the fixed width
      behind it. In the developer tools I set the viewport to 320px and look for the box
      that pokes out. Or I briefly add `* { outline: 1px solid red; }`, which shows every
      box without changing the layout. The usual causes are a `width: 100%` box with padding
      and no `border-box`, or an image without `max-width: 100%`. Others are a long unbroken
      word, a `100vw` width next to a scrollbar, or a grid minimum wider than the container. The fixes
      are `box-sizing: border-box`, `max-width: 100%`, `overflow-wrap: anywhere` and
      `min(15rem, 100%)`. I'd avoid `overflow-x: hidden` on the body as the fix, because it
      hides the symptom and can cut off content.
  - question: When do you choose grid and when flexbox?
    answer: >-
      I choose grid when items must line up in two directions, and flex when I'm arranging
      items along one line. A card list is a grid job: with `auto-fit` and `minmax()` the
      cards share columns, so they align across rows. A header with a logo on one side and
      links on the other is a flex job: one row, where the items' own sizes matter and
      `justify-content` spreads them. Flex can wrap, but each wrapped line shares its space on
      its own, so cards in different lines don't line up. Grid is also better for a whole page
      with named areas. In practice they nest: a grid of cards, each card using flex inside.
      The choice depends on the content, not on which tool is newer.
