term: health check
aka: [health probe, readiness probe, liveness probe, healthcheck]
short: A small endpoint or test that reports whether an instance can do its work right now.
explain: |
  A load balancer needs to know which instances to send traffic to. A process that is
  running isn't necessarily working: it may have lost its database connection.

  The platform calls something like `/healthz` every few seconds. Readiness says "send me
  traffic"; a new instance fails it until warmed up. Liveness says "I'm not stuck"; failing
  it gets the instance restarted. Keep liveness shallow: if it checks the database, one
  database blip restarts every instance at once.
analogy: A pilot's pre-flight checklist. The plane doesn't take passengers until every line is ticked.
example:
  language: ts
  code: |
    app.get('/healthz/ready', async (_req, res) => {
      const ok = await db.ping().catch(() => false);
      res.status(ok ? 200 : 503).end();
    });
usage: The health check returns 200 before the cache is warm, so new instances get traffic too soon.
related: [load-balancer, zero-downtime-deployment, container-orchestration, autoscaling]
level: 2
lessons: [cloud.compose, cloud.releases]
