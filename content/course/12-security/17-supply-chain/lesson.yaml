    verified: true

deepDive: >-
  Checked with npm 11.19: a package's `postinstall` ran on `npm install` and could read an
  environment variable. npm only printed a warning that the script wasn't yet covered by
  `allowScripts`. `npm ci --ignore-scripts` stopped it.


  A **software bill of materials**, or SBOM, lists every component in a build with its
  version. `npm sbom` writes one in the CycloneDX or SPDX format. When a package is hijacked,
  an SBOM per release answers "which of our builds contain it?" in seconds.


  **Provenance** is a signed record of where a package was built and from which source. npm
  can publish packages with provenance from CI, and `npm audit signatures` checks it. The SLSA
  framework grades how hard such a record is to forge.
