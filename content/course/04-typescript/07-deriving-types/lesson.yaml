deepDive: >-
  The helpers are built from two type-level tools you can write yourself. A **mapped type**
  loops over keys: `Partial<T>` is `{ [K in keyof T]?: T[K] }`. A **conditional type** picks
  a type by a test, `T extends U ? X : Y`, and `infer` names a part to pull out. That's how
  `ReturnType<typeof loadUser>` finds what a function returns.


  Authoring those is library work, and it has sharp edges. A conditional type runs once per
  union member, and `Omit` on a union keeps only the properties every member shares.


  `exactOptionalPropertyTypes` stops `Partial<Profile>` accepting an explicit `undefined`,
  which closes the spread trap from this lesson at the type level.
