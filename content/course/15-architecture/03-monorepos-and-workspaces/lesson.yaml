deepDive: >-
  All of this ran on Node 24 and pnpm 10. `pnpm install` linked
  `apps/web/node_modules/@shop/ui` to `packages/ui`. The import through the package name
  printed `£12.50`. The import of `@shop/ui/src/internal/format.js` failed with
  `ERR_PACKAGE_PATH_NOT_EXPORTED`. The same file, reached by a relative path, loaded
  without a word.


  Scripts run per package. `pnpm --filter web test` runs one package's tests, and
  `pnpm -r test` runs them in every package. Tools such as Turborepo and Nx add a cache on
  top: they work out which packages a change touched and skip the rest. That only works
  when the dependencies are real ones, declared in `package.json`. A relative import across
  packages is invisible to them, so a change can skip the tests that would catch it.


  npm and Yarn have workspaces too. npm lists them under `workspaces` in the root
  `package.json` and links a package when the version range matches. The idea is the same.


  A monorepo isn't free. Installs and CI grow with the repository, and one broken package
  can block everyone's merge. Many small teams do fine with one app and feature folders.
  Reach for packages when two apps really share code.
