id: design.keyboard-and-focus
title: Keyboard and focus
objective: Make every control reachable with Tab, keep the focus order in step with the layout, and show where focus is.
level: essential
minutes: 10
concepts: [design.keyboard-access, design.focus-order, design.focus-visible]
prerequisites: [design.accessibility-foundations]
opening:
  text: >-
    You'll put the mouse away and drive a page with the keyboard alone. Then you'll fix the
    three bugs that trap keyboard users most often.

steps:
  - type: prose
    id: what-focus-is
    body: >-
      Your keys go to one element at a time. That element has **focus**. Tab moves focus to
      the next control, Shift+Tab to the one before, and Enter or Space presses it.


      Screen reader users, people who can't hold a mouse and fast typists all work this way.
      Links, buttons and form fields take focus. A `div` doesn't, whatever it looks like.

  - type: predict-output
    id: predict-div-click
    concept: design.keyboard-access
    difficulty: 1
    language: tsx
    code: |
      <div className="btn" onClick={addToBasket}>Add to basket</div>
      <button onClick={checkout}>Checkout</button>
    question: Focus is before both. You press Tab once. Where does focus land?
    choices:
      - text: On Checkout
        correct: true
        feedback: >-
          Right. The `div` can't take focus, so Tab skips straight past it.
      - text: On Add to basket
        feedback: >-
          It looks like a button, but it's a `div`. A click handler works for a mouse only.
      - text: Nowhere, it stops before the div
        feedback: >-
          Tab never gets stuck on a `div`. It doesn't see it at all.

  - type: playground
    id: reach-every-control
    concept: design.keyboard-access
    difficulty: 2
    prompt: >-
      Click the page, then press Tab. Save recipe is never reached. Make it a real `button`,
      keeping its class, and Tab again. Enter now saves it.
    html: |
      <h1>Lemon drizzle cake</h1>
      <div class="save">Save recipe</div>
      <button class="print">Print</button>
      <p class="status"></p>
    css: |
      body { font-family: sans-serif; }
      .save, .print { display: inline-block; padding: 8px 16px; border: 2px solid #0f766e; background: white; color: #0f766e; font: inherit; }
    js: |
      const save = document.querySelector(".save");
      save.addEventListener("click", () => {
        document.querySelector(".status").textContent = "Saved to your recipes";
      });
    editable: [html]
    checks:
      - label: Save recipe is a `button`
        selector: button.save
        text: Save recipe
      - label: No `div` is left
        selector: div
        count: 0
    solution:
      html: |
        <h1>Lemon drizzle cake</h1>
        <button class="save">Save recipe</button>
        <button class="print">Print</button>
        <p class="status"></p>
    hints:
      - One element is the odd one out.
      - Change both its start tag and its end tag.
      - '`<button class="save">Save recipe</button>`.'

  - type: prose
    id: what-focus-order-is
    body: >-
      **Focus order** is the path Tab takes: every focusable element, in source order. CSS
      can move boxes around the screen, with `flex-direction: row-reverse`, but Tab still follows
      the source. So keep the source in the order people read.


      `tabindex="0"` adds an element to the path, and `tabindex="-1"` takes it out. Avoid
      positive numbers: they jump the queue and confuse everyone.

  - type: predict-output
    id: predict-reversed-nav
    concept: design.focus-order
    difficulty: 2
    language: html
    code: |
      <style>nav { display: flex; flex-direction: row-reverse; }</style>
      <nav>
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/cart">Cart</a>
      </nav>
    question: Cart shows on the left. You press Tab three times. Which order does focus take?
    choices:
      - text: Home, Shop, Cart
        correct: true
        feedback: >-
          Right. Tab follows the source order. CSS moved the boxes, not the path.
      - text: Cart, Shop, Home
        feedback: >-
          That's the order you see. Focus follows the source, so it runs against the layout.
      - text: Home only
        feedback: >-
          Every link with `href` is on the Tab path. The surprise is the order.

  - type: playground
    id: fix-the-order
    concept: design.focus-order
    difficulty: 2
    prompt: >-
      The checkout steps read Basket, Delivery, Payment, but Tab goes backwards. Remove
      `row-reverse` from `.steps`, then reorder the links so the source matches. Tab through
      to check.
    html: |
      <nav class="steps">
        <a href="#payment">3. Payment</a>
        <a href="#delivery">2. Delivery</a>
        <a href="#basket">1. Basket</a>
      </nav>
    css: |
      body { font-family: sans-serif; }
      .steps { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 16px; }
      a { color: #1d4ed8; }
    checks:
      - label: The row is no longer reversed
        selector: .steps
        style: { property: flex-direction, value: row }
      - label: Basket comes first in the source
        selector: '.steps a:first-child'
        text: Basket
      - label: Payment comes last in the source
        selector: '.steps a:last-child'
        text: Payment
    solution:
      html: |
        <nav class="steps">
          <a href="#basket">1. Basket</a>
          <a href="#delivery">2. Delivery</a>
          <a href="#payment">3. Payment</a>
        </nav>
      css: |
        body { font-family: sans-serif; }
        .steps { display: flex; justify-content: flex-end; gap: 16px; }
        a { color: #1d4ed8; }
    hints:
      - Two fixes, one in each tab.
      - In the CSS, delete the whole `flex-direction` declaration.
      - In the HTML, swap the first and last links.

  - type: prose
    id: focus-must-be-seen
    body: >-
      Focus is useless if you can't see it. Browsers draw a ring, an **outline**, round the
      focused element.


      Designers often ask to remove it, and `outline: none` does. Now a keyboard user is
      lost. Restyle it instead with `:focus-visible`. It matches when someone uses the
      keyboard. The ring shows after Tab and stays hidden after a mouse click.

  - type: playground
    id: restore-the-ring
    concept: design.focus-visible
    difficulty: 3
    prompt: >-
      Tab through the buttons: you can't see where you are. Replace the `button:focus` rule
      with `button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }`. Tab
      again.
    html: |
      <style>
        body { font-family: sans-serif; }
        button { padding: 8px 16px; border: 0; background: #e5e7eb; }
        button:focus { outline: none; }
      </style>
      <p>Book a table for</p>
      <button>2 people</button>
      <button>4 people</button>
      <button>6 people</button>
    editable: [html]
    checks:
      - label: The rule uses `:focus-visible`
        selector: style
        text: 'button:focus-visible'
      - label: The ring is 3 px solid
        selector: style
        text: 'outline: 3px solid'
      - label: The ring sits 2 px away
        selector: style
        text: 'outline-offset: 2px'
    solution:
      html: |
        <style>
          body { font-family: sans-serif; }
          button { padding: 8px 16px; border: 0; background: #e5e7eb; }
          button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
        </style>
        <p>Book a table for</p>
        <button>2 people</button>
        <button>4 people</button>
        <button>6 people</button>
    hints:
      - The rule to change is the last one in the `style` element.
      - Its selector becomes `button:focus-visible`.
      - 'Swap `outline: none;` for the two declarations in the task.'

  - type: ai-review
    id: review-div-role-button
    concept: design.keyboard-access
    difficulty: 3
    language: tsx
    request: Make the Save control reachable by keyboard.
    flawClass: edge-case
    code: |
      function SaveControl({ onSave }: { onSave: () => void }) {
        return (
          <div role="button" tabIndex={0} onClick={onSave}>
            Save
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. Tab now reaches it, and a screen reader says "Save, button". A
      keyboard user presses Enter, and nothing saves. Tap the line at fault.
    lines: [3]
    reasons:
      - text: A role and a tab stop don't add Enter
        correct: true
        feedback: >-
          Yes. Focus and a role arrived, but not the keys. A `button` has all three.
      - text: '`tabIndex` should be `-1`'
        feedback: >-
          Then Tab would skip it again. The gap is what happens after focus arrives.
      - text: '`onClick` never fires for a `div`'
        feedback: >-
          It fires for a mouse click. It's the keyboard that gets nothing.
    fix: |
      function SaveControl({ onSave }: { onSave: () => void }) {
        return (
          <button type="button" onClick={onSave}>
            Save
          </button>
        );
      }

  - type: explain-back
    id: explain-keep-the-ring
    concept: design.focus-visible
    difficulty: 3
    prompt: >-
      A designer wants the focus ring gone, because it looks messy after a click. What do
      you tell them, and what do you offer instead?
    rubric:
      - The ring is how keyboard users see where they are, so removing it strands them.
      - '`:focus-visible` shows the ring for keyboard use and hides it after a mouse click.'
      - The ring can be restyled to match the design, as long as it stays clearly visible.
    modelAnswer: >-
      For a keyboard user the ring is the cursor. Without it they press Tab and have no idea
      where they are. The messy look comes from clicks, and `:focus-visible` fixes exactly
      that: the ring appears after Tab and not after a mouse click. So keep it, and style it
      in the brand colour with a little offset.

recap:
  - Use real buttons and links, so Tab reaches every control.
  - Keep the source order in step with the layout people see.
  - Restyle the focus ring with `:focus-visible` instead of removing it.

recall:
  - id: card-div-onclick
    concept: design.keyboard-access
    front: Why can't a keyboard user press a `div` that has a click handler?
    back: >-
      A `div` never takes focus, so Tab skips it. Even with `tabIndex`, Enter and Space do
      nothing. Use a `button`.
  - id: card-source-order
    concept: design.focus-order
    front: CSS shows a row in reverse. Which order does Tab follow?
    back: >-
      The source order. CSS moves the boxes, not the Tab path.
  - id: card-tabindex-values
    concept: design.focus-order
    front: What do `tabindex="0"` and `tabindex="-1"` do?
    back: >-
      0 adds an element to the Tab path. -1 takes it out, though a script can still focus it.
  - id: card-focus-visible
    concept: design.focus-visible
    front: When does `:focus-visible` match a focused button?
    back: >-
      When the browser judges the keyboard is in use, such as after Tab, and not after a
      mouse click.

