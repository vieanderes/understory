id: cloud.linux-server
title: A Linux server
objective: Log in to a Linux server with an SSH key, run an app as its own user under systemd, and close every port you don't serve.
level: essential
minutes: 10
concepts: [cloud.ssh, cloud.users-and-permissions, cloud.systemd, cloud.firewall]
prerequisites: [cloud.where-code-runs, tooling.terminal]
opening:
  text: >-
    You'll log in to a rented Linux server, keep your app running on it, and keep strangers
    out. Every cloud service you'll use later is this, with a nicer front.

steps:
  - type: prose
    id: what-linux-is
    body: >-
      Most servers run **Linux**, a free operating system. Its core is the **kernel**: the
      part that runs programs and guards the files and hardware.


      A server has no screen or desktop. You type commands, the same `ls`, `cd` and `cat` you
      used in your own terminal. The only question is how to reach that terminal from far
      away.

  - type: prose
    id: reach-it-with-ssh
    body: |-
      **SSH** gives you an encrypted terminal on a remote machine:

      ```bash
      $ ssh ana@203.0.113.10
      ana@web-1:~$
      ```

      It can check a password, but bots guess passwords all day. A **key pair** is safer. `ssh-keygen -t ed25519` makes two files. The private key never leaves your laptop. The public key goes in the server's `~/.ssh/authorized_keys`. Then you turn passwords off.

  - type: predict-output
    id: predict-password-refused
    concept: cloud.ssh
    difficulty: 1
    language: bash
    code: |
      # on the server: /etc/ssh/sshd_config.d/10-keys-only.conf
      PasswordAuthentication no
      PermitRootLogin no

      # from a laptop that knows guest's password, but has no key
      $ ssh guest@shop.example
    question: The password is correct. What does the server answer?
    choices:
      - text: It logs in, the password is right
        feedback: >-
          It did, before that setting. Now the server won't even ask for a password.
      - text: '`Permission denied (publickey)`'
        correct: true
        feedback: >-
          Right. That's the exact reply. Only a listed key gets in.
      - text: It asks for the password three times
        feedback: >-
          That's the default. With passwords off, there's no prompt left to guess at.

  - type: prose
    id: name-users-and-modes
    body: |-
      Every program runs as a **user**, and every file has an owner and a **mode**: who may read (`r`), write (`w`) and run (`x`) it.

      ```bash
      $ ls -l /srv/shop/.env
      -rw------- 1 shop shop 44 Sep 25 13:02 /srv/shop/.env
      ```

      Three sets of `rwx`: the owner, the owner's group, everyone else. As numbers, read is 4, write 2, run 1. So `600` is `rw-------`. The user `root` may do anything.

  - type: code-challenge
    id: write-can-read
    concept: cloud.users-and-permissions
    difficulty: 3
    language: ts
    prompt: >-
      Write `canRead(file, user)`. A file has an `owner`, a `group` and a `mode` like `'640'`.
      A user has a `name` and a list of `groups`.


      Only one digit applies. The owner uses the first. Otherwise a member of the file's group
      uses the second. Everyone else uses the third. Read is allowed when that digit is 4 or
      more. `root` reads anything.


      So `guest` can't read a `'600'` file owned by `shop`.
    hints:
      - Decide which of the three digits applies before you look at its value.
      - The checks go in order, owner first, and stop at the first match.
      - "`Number(file.mode[0])` is the owner's digit. Start with the `root` case, then the owner."

  - type: ai-review
    id: review-chmod-777
    concept: cloud.users-and-permissions
    difficulty: 3
    language: bash
    request: The service fails at start with "EACCES, permission denied, open .env". Fix the deploy script.
    flawClass: security
    code: |
      #!/bin/bash
      cp shop.service /etc/systemd/system/
      cp .env /srv/shop/.env
      chmod 777 /srv/shop/.env
      systemctl daemon-reload
      systemctl restart shop
    prompt: >-
      An assistant wrote this. The service starts now, so the fix looks done. But `777` is
      `rwxrwxrwx`. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Every user on the server can now read the secrets
        correct: true
        feedback: >-
          Yes. Make `shop` the owner, at `600`, and nobody else can read it.
      - text: '`daemon-reload` should come before the copy'
        feedback: >-
          It has to come after, so systemd reads the new unit file. The order is right.
      - text: '`restart` should be `start`'
        feedback: >-
          `restart` works whether or not the service is running. It's the safer word here.
    verify:
      question: 'How would you prove the fix keeps the secrets private?'
      choices:
        - text: 'Read the file as another user and expect "Permission denied"'
          correct: true
          feedback: >-
            Yes. Another user is exactly who `777` let in.
        - text: 'Restart the service and check it starts'
          feedback: >-
            It started at `777` too. That proves the service can read it, not that others can't.
        - text: 'Check the file exists in `/srv/shop`'
          feedback: >-
            It existed before and after. Being there says nothing about who can read it.
    fix: |
      cp .env /srv/shop/.env
      chown shop:shop /srv/shop/.env     # make shop the owner
      chmod 600 /srv/shop/.env           # and the only reader

  - type: prose
    id: keep-it-running
    body: |-
      Close your SSH session and a program you started by hand stops. On most Linux servers, **systemd** keeps it alive: it starts your app at boot, restarts it when it crashes and keeps what it prints. We crashed ours on purpose:

      ```bash
      $ journalctl -u shop
      shop.service: Main process exited, code=exited, status=1/FAILURE
      shop.service: Scheduled restart job, restart counter is at 1.
      shop listening on 3000
      ```

  - type: parsons
    id: build-unit-file
    concept: cloud.systemd
    difficulty: 2
    language: text
    prompt: >-
      Build the unit file that tells systemd how to run the app: as the `shop` user, from
      `/srv/shop`, restarted after a crash, started at boot. One line doesn't belong.
    blocks:
      - id: service-header
        code: '[Service]'
        subgoal: How to run it
      - id: user
        code: User=shop
      - id: workdir
        code: WorkingDirectory=/srv/shop
      - id: exec
        code: ExecStart=/usr/bin/node server.js
      - id: restart
        code: Restart=on-failure
      - id: install-header
        code: '[Install]'
        subgoal: Start at boot
      - id: wanted-by
        code: WantedBy=multi-user.target
    distractors:
      - id: user-root
        code: User=root
        feedback: >-
          Then a bug in the app hands an attacker the whole machine. Run as `shop`.

  - type: fill-blank
    id: fill-ufw-rules
    concept: cloud.firewall
    difficulty: 3
    language: bash
    prompt: >-
      A **firewall** decides which ports the outside world can reach. `ufw` is a simple one.
      Refuse everything, then open SSH and the two web ports. Fill the gaps.
    template: |
      $ ufw default {{1}} incoming
      $ ufw allow {{2}}/tcp       # SSH, or you lock yourself out
      $ ufw allow 80/tcp          # HTTP
      $ ufw allow {{3}}/tcp      # HTTPS
      $ ufw enable
    blanks:
      - key: '1'
        answer: deny
      - key: '2'
        answer: '22'
      - key: '3'
        answer: '443'
    bank: [deny, allow, '22', '3000', '443', '5432']

  - type: explain-back
    id: explain-close-the-ports
    concept: cloud.firewall
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      Your change closes ports 3000 and 5432 at the firewall. A reviewer asks: the app and
      the database both have passwords, so why bother? Defend the change.
    rubric:
      - 'A reachable port can be attacked, by guessing passwords or by a bug in the software behind it.'
      - 'A port the firewall drops can''t be reached at all, so neither kind of attack can start.'
      - 'Visitors only need 443, so the change costs nothing and leaves one guarded way in.'
    modelAnswer: >-
      A password only helps once someone is already talking to the service. With 5432 open,
      anyone can guess passwords all day, or try any bug in the database's network code. A
      closed port stops both before they start. And the change costs nothing: visitors only
      need 443, where the web server passes requests to the app. It's defence in depth: the
      firewall, then the password, then the `shop` user's narrow permissions.

recap:
  - Log in with an SSH key, and turn password logins off.
  - Run an app as its own user under systemd, with secrets at mode `600`.
  - Deny incoming traffic by default, and open only 22, 80 and 443.

recall:
  - id: card-systemd
    concept: cloud.systemd
    front: What three jobs does systemd do for your app?
    back: >-
      It starts the service at boot, restarts it when it exits, and collects its output in the
      journal, read with `journalctl -u`.
  - id: card-mode-600
    concept: cloud.users-and-permissions
    front: What does mode `600` mean, and why use it for a secrets file?
    back: >-
      The owner may read and write, and nobody else may do anything. Only the service's own
      user can see the secrets.
  - id: card-ssh-keys
    concept: cloud.ssh
    front: Where does each half of an SSH key pair live?
    back: >-
      The private key stays on your own machine. The public key goes in the server's
      `authorized_keys`. Then turn password logins off.
  - id: card-firewall-default
    concept: cloud.firewall
    front: What's the safe default for a server's firewall?
    back: >-
      Deny all incoming traffic, then allow only the ports you mean to serve, such as 22, 80
      and 443.

