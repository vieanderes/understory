id: arch.adrs-and-twelve-factor
title: Recording decisions
objective: Write an architecture decision record with its context, decision and costs, and supersede it when the decision changes.
level: essential
minutes: 10
concepts: [arch.adrs, arch.trade-offs]
prerequisites: [arch.monolith-and-services, arch.cqrs-and-event-sourcing, tooling.remotes]
opening:
  text: >-
    You'll leave a short note for every big choice, so next year's team knows why, not only
    what. It's ten minutes of writing that saves a month of arguing.

steps:
  - type: prose
    id: why-decisions-get-lost
    body: >-
      Code shows what the team chose. It never says why. A year on, someone asks why the app
      is a modular monolith and not services. The people who decided have moved on, and the
      reasons sit in a chat nobody can search.


      So the team argues it all again. Or it undoes a choice for a reason that was already
      weighed and rejected.

  - type: prose
    id: what-an-adr-is
    body: >-
      An **architecture decision record**, or ADR, is a short note about one decision. It
      lives in the repository, numbered, such as `docs/adr/0007-modular-monolith.md`.


      It has a title, a date and a status: proposed, accepted or superseded. Then three
      parts. The **context**: what was true when you chose. The **decision**. And the
      **consequences**: what it costs as well as what it buys.

  - type: fill-blank
    id: fill-adr-fields
    concept: arch.adrs
    difficulty: 1
    language: yaml
    prompt: >-
      A team picks a database and writes it down. Fill in the ADR's field names.
    template: |
      title: 7. Store appointments in PostgreSQL
      date: 2026-03-02
      status: accepted
      {{1}}: Reports must join appointments to invoices. The team knows SQL.
      {{2}}: Use PostgreSQL, one database, with a tenant column.
      {{3}}: Reports are one query. Every query must be scoped by tenant.
    blanks:
      - key: '1'
        answer: context
      - key: '2'
        answer: decision
      - key: '3'
        answer: consequences
    bank: [context, decision, consequences, solution, benefits]

  - type: prose
    id: name-trade-offs
    body: >-
      Every choice buys something and costs something. That's a **trade-off**. An ADR that
      lists only benefits is an advert, not a record.


      Write the costs down. Then add the change that would make you look again, such as
      *one module must scale alone*. Next year's team can then tell when the reasons have
      run out.

  - type: bug-hunt
    id: hunt-context-without-reason
    concept: arch.adrs
    difficulty: 2
    language: yaml
    code: |
      title: 12. Run notifications as their own service
      date: 2026-11-04
      status: accepted
      context: We decided to split notifications out of the monolith.
      decision: Notifications become a service with its own database.
      consequences: Two deploys instead of one. Calls to it can fail on their own.
    prompt: >-
      Six months on, a new lead reads this and still can't say why the split happened. Tap
      the line that lets her down.
    lines: [4]
    reasons:
      - text: The context repeats the decision, with no reason
        correct: true
        feedback: >-
          Yes. It should say what forced the choice, like a queue of emails slowing checkout.
      - text: The consequences list only costs
        feedback: >-
          Costs belong there, and these are honest. The missing part comes earlier: what made
          the split worth them.
      - text: The status should still be proposed
        feedback: >-
          Accepted is right once the team has agreed. The status isn't what hides the reason.

  - type: multiple-choice
    id: pick-superseded
    concept: arch.adrs
    difficulty: 2
    question: A year on, the team moves appointments to a different database. What happens to ADR 7?
    choices:
      - text: Edit it to describe the new database
        feedback: >-
          Then the record of why PostgreSQL was chosen is gone. The old reasoning is what a
          newcomer will want.
      - text: Delete it, it's out of date
        feedback: >-
          Out of date is the point. It shows what was known then, and that the move was a
          decision, not an accident.
      - text: Mark it superseded, and write a new ADR
        correct: true
        feedback: >-
          Right. ADRs are a log. The new one links back, and the history stays readable.

  - type: ai-review
    id: review-adr-without-costs
    concept: arch.trade-offs
    difficulty: 3
    language: yaml
    request: Draft an ADR for moving product search to a search index.
    flawClass: logic
    code: |
      title: 14. Move product search to a search index
      date: 2026-12-01
      status: proposed
      context: Search takes 900 ms on 40,000 products, and shoppers give up.
      decision: Keep products in Postgres, and copy them to a search index for queries.
      consequences: Search answers in under 100 ms. Postgres stays the source of truth.
    prompt: >-
      An assistant drafted this. The team accepted it. A month later, shoppers edit a product
      and search still shows the old name. Tap the line at fault.
    lines: [6]
    reasons:
      - text: It lists what the choice buys, not what it costs
        correct: true
        feedback: >-
          Yes. A read model lags, and it's one more system to run. Both belong here.
      - text: The context should name the search product
        feedback: >-
          Which product to use can be its own ADR. The surprise came from a cost nobody wrote
          down.
      - text: 900 ms is fast enough to keep
        feedback: >-
          The context says shoppers give up at 900 ms. That's the reason for the change, and a
          good one.
    verify:
      question: Which review question would have caught this before acceptance?
      choices:
        - text: What do shoppers see before the index catches up?
          correct: true
          feedback: >-
            Yes. It asks for the cost, and the lag is the answer.
        - text: Will search really answer in under 100 ms?
          feedback: >-
            A fair check on the benefit. It still never asks what the copy costs.
        - text: Should the title name the search product?
          feedback: >-
            Naming the product is a detail. The lag would still be missing from the record.
    fix: |
      consequences: Search answers in under 100 ms. Results lag edits by a few seconds. One more system to run and back up. Revisit if edits must show at once.

  - type: explain-back
    id: explain-write-an-adr
    concept: arch.trade-offs
    difficulty: 4
    audience: teammate
    kind: decide
    prompt: >-
      Your team chose a modular monolith over services for a new booking app. Write the ADR's
      context, decision and consequences, a sentence or two each.
    rubric:
      - The context names the forces behind the choice, such as a small team, one database and boundaries not yet known.
      - The decision is stated plainly, including how the boundaries will be kept, such as entry files and a lint rule.
      - The consequences list costs as well as gains, such as one deploy for everything and no scaling a part alone, with a condition for revisiting.
    modelAnswer: >-
      Context: we're four developers building a booking app, with one database and no clear
      idea yet where the modules will settle. Decision: one deployable app, a modular
      monolith, with feature folders whose entry files a lint rule enforces. Consequences:
      calls between modules stay cheap, and bookings and payments can share a transaction.
      Everything deploys together, so one broken module blocks a release, and we can't scale
      one part alone. Revisit if a module needs its own scaling or its own team.

recap:
  - Record each big choice as a short, numbered ADR in the repository, with context, decision and consequences.
  - Write the costs next to the gains, and the change that would make you revisit.
  - Supersede an ADR with a new one when the decision changes, and never edit history.

recall:
  - id: card-adr-fields
    concept: arch.adrs
    front: What are the main parts of an architecture decision record?
    back: >-
      A numbered title, a date and a status, then the context, the decision, and the
      consequences, costs included.
  - id: card-adr-superseded
    concept: arch.adrs
    front: A decision is reversed. What do you do with its ADR?
    back: >-
      Mark it superseded and write a new ADR that links back. The old reasoning stays on
      record.
  - id: card-trade-off
    concept: arch.trade-offs
    front: What makes an ADR's consequences honest?
    back: >-
      They list what the choice costs as well as what it buys, and say what would make the
      team revisit it.
  - id: card-context
    concept: arch.adrs
    front: What belongs in an ADR's context?
    back: >-
      The forces at the time: the problem, the constraints and what the team knew. Not the
      decision again.

references:
  - kind: essay
    title: Documenting Architecture Decisions
    authors: Michael Nygard
    year: 2011
    venue: Cognitect blog
    url: https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions
    note: The post that defined the ADR format of title, status, context, decision and consequences.
    primary: true
    verified: true
  - kind: docs
    title: Architectural Decision Records (ADRs)
    authors: ADR GitHub organisation
    venue: adr.github.io
    url: https://adr.github.io/
    note: Templates and tools for keeping ADRs in a repository.
    verified: true

deepDive: >-
  The original ADR post asks for whole sentences, one or two pages at most, and a status of
  proposed, accepted, deprecated or superseded. We showed ADRs as short YAML-like lines to
  fit the screen. Real ones are usually Markdown files with those names as headings, and a
  pull request is a good place to agree one.


  What deserves an ADR? A choice that's expensive to reverse, or one people will ask about:
  a database, services or a monolith, how tenants are kept apart, which model provider sits
  behind the port. Not which date library to use. If it takes a meeting to decide, it's
  worth ten minutes to record.


  ADRs work well with AI assistants too. A coding agent that reads `docs/adr/` before a
  change knows the boundaries it must keep, and a reviewer can point at ADR 7 instead of
  explaining it again. That only works if the records stay true, which is why you
  supersede instead of editing.


  Config in the environment, from the tooling chapter, is one practice from a longer list
  called the twelve-factor app. Its other factors, such as logs to standard output and
  processes that keep no state, come back in the cloud chapter.
