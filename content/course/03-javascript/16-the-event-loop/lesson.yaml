deepDive: >-
  We checked the spinner catch in Chromium: after showing an element, a `setTimeout` of 0 ran
  before the next frame in every one of our runs. With a delay of 20 ms or more, a frame came first.
  `requestAnimationFrame` plus a timer doesn't depend on the delay at all.


  A microtask queued by a microtask joins the same round. So a chain of promise callbacks
  that keeps queueing more never lets a task or a paint in. The page freezes as surely as
  with a `while` loop.


  Calling an async function runs its body straight away, up to the first `await`. Only the
  rest becomes a microtask. So in `async function f() { log("A"); await null; log("B"); }`,
  `A` logs during the call, and `B` after the current task.


  Nested timers are clamped. After five levels of `setTimeout(fn, 0)`, browsers hold the
  delay at about 4 ms. `queueMicrotask(fn)` queues a microtask directly. Node, which runs JavaScript on a server,
  has no
  rendering step, but the same two-queue rule holds, and `process.nextTick` runs before other
  microtasks there. The concurrency chapter goes deeper into Node's loop.
