term: REST
aka:
  - RESTful
  - REST API
  - resource style
short: A style of web interface built around nouns at addresses, acted on with standard request verbs.
explain: |
  You could design a web interface as a pile of actions: `/getOrder`, `/cancelOrder`,
  `/updateOrderAddress`. That grows without end. The alternative treats everything as a **resource** with an address. The HTTP methods you already have become the verbs.

  So `GET /orders/42` reads it and `PATCH /orders/42` changes it. Status codes carry the
  result, and caches understand it for free. The trap is verbs in the path: if you see
  `/orders/42/delete`, someone forgot the methods exist.
analogy: A filing cabinet with labelled drawers. Every drawer takes the same few actions. Open, add, replace, remove.
example:
  language: http
  code: |
    GET    /orders          list
    POST   /orders          create
    GET    /orders/42       read one
    PATCH  /orders/42       change part
    DELETE /orders/42       remove
usage: Keep it REST, so cancel is a PATCH on the order's status, not a new verb in the URL.
twin:
  term: http
  difference: HTTP is the protocol every web request uses. REST is one way to design an API on top of it, using its methods and status codes for meaning.
related:
  - api
  - http-method
  - endpoint
level: 2
lessons: [backend.api-design, backend.api-evolution]
