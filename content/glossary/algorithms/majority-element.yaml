term: majority element
aka: [leader, dominator, majority value]
short: A value found in strictly more than half the positions of a list.
explain: |
  In `[3, 1, 3, 3, 2]`, the 3 fills three of five places, so it's the majority. A list has
  at most one, and often none at all.

  The trap is "most common". In `[1, 1, 2, 3]`, 1 is the most common value but fills only
  half, so there's no majority. Check "more than half" with a strict greater-than.
analogy: A vote where a candidate needs more than half the ballots to win outright, not only the most.
usage: The task wants the majority element, so a value in exactly half the places doesn't count.
related: [boyer-moore-voting, frequency-count, hash-map]
level: 2
lessons: [algo.counting-and-leaders]
