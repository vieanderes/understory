term: thread
aka: [threads, multithreading, worker thread]
short: One line of execution inside a running program, sharing that program's memory with its siblings.
explain: |
  A running program can do several things at once by having more than one line of
  execution. Each has its own call stack, but they all see the same memory.

  Shared memory makes them cheap to start and quick to pass data around. It's also the
  danger. Two of them updating one counter at once can lose an update: a race condition.
  Locks prevent it, and too many locks cause deadlocks.

  JavaScript gives your code one main one and an event loop. Worker threads exist, but they
  share memory only on request.
analogy: Two cooks in one kitchen. They share the fridge and the worktop, so they're fast, and they sometimes grab the same knife.
example:
  language: python
  code: |
    import threading

    count = 0
    def add():
        global count
        for _ in range(100_000):
            count += 1          # read, add, write: not atomic

    workers = [threading.Thread(target=add) for _ in range(4)]
    for w in workers: w.start()
    for w in workers: w.join()  # count may end below 400,000
usage: The handler runs on a second thread, so guard the shared cache with a lock.
twin:
  term: process
  difference: A thread shares memory with the other threads in its process. A process has memory of its own that no other process can touch.
related: [process, concurrency, parallelism, race-condition, deadlock, gil]
