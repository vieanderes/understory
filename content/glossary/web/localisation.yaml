term: localisation
aka: [l10n, localization]
short: Adapting a product for one language and region, with its translations, date formats and currency.
explain: |
  Code ready for many languages still needs someone to make each version. That means
  translating the words, choosing the right formats, and checking the pictures and the tone
  fit.

  Translation is only part of it. A German label can be a third longer than the English
  one, so the layout must stretch. Dates, decimal commas and currency symbols change too,
  and the code should hand those to `Intl`.
analogy: Dubbing a film for another country. The story stays the same, while the voices, the jokes and sometimes the signs change.
usage: Localisation for the French release found three buttons where the text overflows.
twin:
  term: internationalisation
  difference: Localisation is the work for one specific place, its translations and formats. Internationalisation is the engineering beforehand that lets any of those versions plug in.
related: [internationalisation]
level: 2
lessons: [design.i18n-and-forms]
