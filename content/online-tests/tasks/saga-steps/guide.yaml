approach: >-
  Run the steps in order and log each one. At the first failure, walk back from the step
  before it to the first step: skip a step without an undo, log a successful undo, and on a
  failed undo log it, add "needs attention" and stop. If the walk finishes, add "rolled
  back". If no step fails, add "committed".
complexity: O(N) time, O(N) space for the log
steps:
  - kind: read
    title: Read the rules and mark the three endings
    minutes: 2
    body: |-
      The log ends in one of three ways: committed, rolled back or needs attention. Mark
      what leads to each.

      Two details are easy to miss: the **failed step is not undone**, and a failed undo
      **stops** the rollback.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      The comment names the forward pass and the backward pass.
    code:
      ts: |-
        // Run steps until one fails, then undo the earlier ones newest first; stop at a failed undo.
      python: |-
        # Run steps until one fails, then undo the earlier ones newest first; stop at a failed undo.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - the first step fails, so there is nothing to undo;
      - the failed step's own undo would fail, which must not matter;
      - read-only steps in the middle of the rollback;
      - a failed undo with earlier steps left over.
    input:
      - "([\"reserve\", \"charge\", \"ship\"], [0, 1, 1], [1, 0, 0])"
      - "([\"reserve\", \"charge\"], [1, 0], [1, 0])"
      - "([\"load\", \"reserve\", \"price\", \"charge\", \"ship\"], [1, 1, 1, 1, 0], [-1, 1, -1, 1, 1])"
      - "([\"a\", \"b\", \"c\", \"d\"], [1, 1, 1, 0], [0, -1, 1, 1])"
  - kind: ask-ai
    title: Ask why the order is reversed
    minutes: 1
    body: |-
      Knowing why compensations run newest first helps you explain your code to a
      reviewer. It is a concept question, not a request for code.
    prompt: >-
      In one or two sentences: in the saga pattern, why are the compensating actions run in
      reverse order of the steps?
    expect: >-
      Later steps can depend on earlier ones, so they are reversed first, as you would
      cancel a shipment before refunding the charge it relied on.
  - kind: write
    title: Write the solution yourself
    minutes: 5
    body: |-
      A forward loop, and an inner backward loop that starts at the step **before** the
      failure. Return from inside the inner loop on a failed undo.
    code:
      ts: |-
        // Run steps until one fails, then undo the earlier ones newest first; stop at a failed undo.
        function solution(S: string[], R: number[], U: number[]): string[] {
          const log: string[] = [];
          for (let k = 0; k < S.length; k++) {
            if (R[k] === 1) {
              log.push(`done ${S[k]}`);
              continue;
            }
            log.push(`failed ${S[k]}`);
            // Compensate newest first: later steps may depend on earlier ones, as a shipment
            // depends on the charge. The failed step changed nothing, so it is not undone.
            for (let j = k - 1; j >= 0; j--) {
              if (U[j] === -1) continue;
              if (U[j] === 0) {
                log.push(`stuck ${S[j]}`, 'needs attention');
                return log;
              }
              log.push(`undo ${S[j]}`);
            }
            log.push('rolled back');
            return log;
          }
          log.push('committed');
          return log;
        }
      python: |-
        # Run steps until one fails, then undo the earlier ones newest first; stop at a failed undo.
        def solution(S, R, U):
            log = []
            for k in range(len(S)):
                if R[k] == 1:
                    log.append('done ' + S[k])
                    continue
                log.append('failed ' + S[k])
                # Compensate newest first; the failed step changed nothing, so it is not undone.
                for j in range(k - 1, -1, -1):
                    if U[j] == -1:
                        continue
                    if U[j] == 0:
                        log.append('stuck ' + S[j])
                        log.append('needs attention')
                        return log
                    log.append('undo ' + S[j])
                log.append('rolled back')
                return log
            log.append('committed')
            return log
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Read each log of your own cases
      from top to bottom against the rules.
    expect: >-
      Three OKs. Your logs end in "rolled back", "rolled back", "rolled back" and "needs
      attention", and the last one never mentions b.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution for these rules: the failed step is not undone, steps
      without an undo are skipped, and a failed undo stops the rollback. List any problems
      in one line each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
