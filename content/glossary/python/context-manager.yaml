term: context manager
aka:
  - with statement
  - with block
short: An object that sets something up when a block starts and always cleans up when it ends.
explain: |
  Open a file, an error happens halfway, and the file never gets closed. Do that in a
  busy server and you run out of file handles.

  A `with` block guarantees the clean-up. On entry it calls `__enter__`; on the way out,
  error or not, it calls `__exit__`. Files, locks, database transactions and network
  connections all work this way. You can write your own with `contextlib.contextmanager`
  and a single `yield`.
analogy: A hotel room key card. You get it at check-in, and the room locks behind you when you leave, whatever happened inside.
example:
  language: python
  code: |
    with open("orders.csv") as f:
        rows = f.readlines()
    # f is closed here, even if readlines raised

    with lock:
        balance -= amount
usage: Wrap the connection in a context manager so it's closed even when the query fails.
