summary: >-
  A coding round is scored on four things at once: how you understand the problem, how you
  choose and justify an approach, the code itself, and how you check it. The mock round in
  this lesson walks one problem through all four. These notes widen it: a second full round
  on a different problem, the follow-up questions interviewers ask once you finish, how a
  timed online test differs from a live one, and how to work with an AI assistant when the
  round allows it.


  The shape never changes. Restate the problem and ask about the input. Work one example by
  hand. Say a brute force and its cost. Name the work it repeats, match that to a pattern,
  and say the new cost before you type. Write the code while narrating, trace the example
  and the edge cases through it, and state time and space at the end. Interviewers can only
  score what they hear, so every one of those moves is said aloud.


  The pattern signals from this chapter do most of the choosing: "is this value present"
  suggests a set, a contiguous range suggests a window or prefix sums, sorted input suggests
  two pointers or binary search, "fewest steps" suggests BFS, "best k" suggests a heap,
  "count the ways" suggests dynamic programming, and "depends on" suggests a topological
  sort. When no signal fires, the bottleneck of your brute force names the pattern instead.
remember:
  - Restate the problem, then ask about size, empty input, duplicates, negatives and the output format before choosing an approach.
  - Say the brute force and its cost, name its bottleneck, and say the new cost before you write the faster version.
  - A nested loop is still linear when the inner loop's total work across all outer steps is bounded by n, and you should say why.
  - Trace the example and at least three edge cases through your code aloud before you call it done.
  - Finish with time and space complexity and one trade-off, such as memory for speed or mutating the input.
  - When a hint comes, repeat it in your own words and apply it; arguing with a hint costs more than the hint.
  - In a timed test, a correct brute force submitted beats an optimal idea that does not compile.
  - With an AI assistant, state your plan first, ask narrow questions, and test every suggestion before you keep it.
sections:
  - title: A second full round, the product of everything else
    body: |-
      The problem: given an array of integers, return an array where each position holds the
      product of every other value. Here is the round at interview pace.

      **Clarify (3 minutes).** "How long can it be? Can values be zero or negative? May I
      use division? Can the product overflow?" The answers: up to 100,000 items, zeros and
      negatives allowed, no division, and every answer fits in a safe integer. Each answer
      changes the code, which is why you ask.

      **Example.** `[1, 2, 3, 4]` gives `[24, 12, 8, 6]`.

      **Brute force (2 minutes).** "For each position, multiply all the others: O(n²). At
      100,000 that's 10 billion steps. The waste is that neighbouring positions multiply
      almost the same values."

      **The tempting shortcut.** "Multiply everything once and divide by each value" is
      O(n), but it breaks on a zero and the interviewer banned division anyway. Mention it,
      and why it fails, in one sentence.

      **Optimise (5 minutes).** "The answer at i is the product of everything to its left
      times everything to its right. One pass left to right stores the left products in the
      output. A second pass right to left multiplies in a running right product."

      ```js
      function productOfOthersBrute(nums) {
        return nums.map((_, i) => {
          let product = 1;
          for (let j = 0; j < nums.length; j++) if (j !== i) product *= nums[j];
          return product;
        });
      }

      function productOfOthers(nums) {
        const result = new Array(nums.length);
        let left = 1;
        for (let i = 0; i < nums.length; i++) {
          result[i] = left; // product of everything before i
          left *= nums[i];
        }
        let right = 1;
        for (let i = nums.length - 1; i >= 0; i--) {
          result[i] *= right; // times the product of everything after i
          right *= nums[i];
        }
        return result;
      }

      console.log(productOfOthers([1, 2, 3, 4])); // [24, 12, 8, 6]
      console.log(productOfOthers([2, 0, 3])); // [0, 6, 0]
      console.log(productOfOthers([0, 0, 5])); // [0, 0, 0]
      console.log(productOfOthers([-1, 2, -3])); // [-6, 3, -2]
      console.log(productOfOthers([7])); // [1]
      ```

      **Test (5 minutes).** Trace `[2, 0, 3]` aloud: only the zero's own position is
      non-zero, 2 × 3 = 6. Then two zeros (all zero), negatives, and a single item, whose
      answer is the empty product 1. Ask whether that last one is what the caller wants.

      **Close.** "O(n) time, and O(1) extra space beyond the output, because the left
      products live in the result array. It's prefix and suffix products, the same idea as
      prefix sums with multiplication."
  - title: The follow-ups that come after you finish
    body: |-
      Finishing early rarely ends the round. The interviewer changes one condition to see
      whether you understand why your solution works. The common ones, and the move each
      calls for:

      - **"What if the numbers arrive one at a time?"** Keep state that updates in O(1) per
        item instead of recomputing. For longest run, that means a map of run boundaries
        (below).
      - **"What if memory is tight?"** Offer the sort-in-place version, O(1) extra space and
        O(n log n) time, and say it mutates the input.
      - **"What if the input doesn't fit in memory?"** Sort it externally in chunks, or
        partition by value range into files, solve each, and merge the runs that touch at a
        boundary.
      - **"Return the run itself, not its length."** Record the start value alongside the
        best length. It costs nothing extra.
      - **"Is your solution correct on duplicates, negatives, the empty list?"** Trace them.
        Never answer "yes" without tracing.

      The streaming version of longest run is a classic. Each new value joins the run on its
      left and the run on its right. Only the two ends of a run need their length stored,
      because a new value can only ever touch a run at its ends.

      ```js
      class RunTracker {
        constructor() {
          this.lengthAt = new Map(); // accurate at the two ends of every run
          this.best = 0;
        }
        add(x) {
          if (this.lengthAt.has(x)) return this.best;
          const left = this.lengthAt.get(x - 1) ?? 0;
          const right = this.lengthAt.get(x + 1) ?? 0;
          const total = left + right + 1;
          this.lengthAt.set(x, total);
          this.lengthAt.set(x - left, total);
          this.lengthAt.set(x + right, total);
          this.best = Math.max(this.best, total);
          return this.best;
        }
      }

      const runs = new RunTracker();
      console.log([100, 4, 200, 1, 3, 2].map((x) => runs.add(x))); // [1, 1, 1, 1, 2, 4]
      console.log(runs.add(3)); // 4
      console.log(runs.add(5)); // 5
      ```

      Each `add` is O(1) on average and the map holds O(n) entries. Values in the middle of
      a run keep stale lengths, which is safe: a new value is adjacent only to a run's end.
  - title: A timed online test, done the online-assessment way
    body: |-
      A timed test replaces the interviewer with hidden tests. Nobody hears your reasoning,
      so the score is only what passes, split into correctness tests on small inputs and
      performance tests on large ones. The moves change accordingly.

      Take a typical warm-up: return the smallest positive integer missing from an array of
      up to 100,000 integers, each between -1,000,000 and 1,000,000. The answer is at most
      n + 1, since n values can fill at most 1 to n. So a boolean array of size n + 2
      replaces a set or a sort.

      ```js
      function smallestMissingPositive(A) {
        const present = new Uint8Array(A.length + 2);
        for (const x of A) {
          if (x >= 1 && x <= A.length + 1) present[x] = 1;
        }
        let answer = 1;
        while (present[answer]) answer++;
        return answer;
      }

      console.log(smallestMissingPositive([1, 3, 6, 4, 1, 2])); // 5
      console.log(smallestMissingPositive([1, 2, 3])); // 4
      console.log(smallestMissingPositive([-1, -3])); // 1
      console.log(smallestMissingPositive([1000000])); // 1
      ```

      O(n) time and O(n) space, with no sort and no hashing. The workflow around it matters
      as much as the code:

      1. Read the constraint lines first. "Each element within [-1,000,000..1,000,000]"
         tells you negatives are in the hidden tests.
      2. Before submitting, type your own cases into the test box: all negative, one item,
         a full run 1 to n, duplicates, and a large value alone.
      3. Build one large input in code, such as `Array.from({ length: 100000 }, (_, i) => i + 1)`,
         run it, and check it finishes quickly.
      4. Keep the file runnable after every edit. The editor contents are submitted when the
         timer ends, working or not.
  - title: Working with an AI assistant in the round
    body: |-
      More rounds now allow an assistant, and they score judgement: whether you plan, verify
      and own the code. The recorded transcript is part of the evidence, so the way you ask
      matters as much as what you accept.

      - **Say your plan before you ask.** "I'll use a set and only walk from run starts" puts
        you in charge. "Solve this" hands the round to the tool.
      - **Ask narrow questions.** "What's the O(1) way to check membership in a JavaScript
        `Set`?" is useful. A whole solution invites the most common answer, which task
        designers sometimes make wrong on purpose.
      - **Read before you run.** Look for the bugs this chapter kept showing: a run reset by
        a duplicate, a missing check after the loop, `shift()` in a loop, a shared array
        pushed into the result, a mutated input.
      - **Test it yourself.** Run the example, the edge cases, and a brute-force comparison.
        An assistant's own test often checks only the happy path, as the AI reviews in this
        chapter showed.
      - **Explain it back.** If you cannot say why a line is there, delete it or ask. You
        will be asked.

      The same discipline applies at work. Generated code is a pull request from a fast,
      confident colleague who never ran it: you review it, you test it, and the result is
      yours.
pitfalls:
  - "**Typing before clarifying.** Starting at once feels productive, but a wrong assumption about duplicates or negatives costs the whole round. Spend the first three minutes on questions and one example."
  - "**Optimising in silence.** Five quiet minutes looks identical to being stuck. Say what you are trying, even when it is not working yet."
  - "**Skipping the brute force.** Without it you have nothing correct to fall back on and no bottleneck to point at. Say it in two sentences, even if you do not code it."
  - "**Saying \"done\" without tracing.** Most bugs in this chapter survived the happy-path example. Trace the example plus an empty, a single and a duplicate case, aloud, before claiming completion."
  - "**Resisting a hint.** A hint is the interviewer helping you score. Repeat it in your own words, then apply it; if you do not understand it, ask one clarifying question."
  - "**Leaving complexity for the end.** State the cost of every approach as you propose it, so the interviewer can steer you before you invest time in the wrong one."
  - "**Pasting assistant code unread.** Generated solutions fail on exactly the edge cases interviewers test. Read every line, run your own cases, and be ready to explain each choice."
interview:
  - question: Your solution has a while loop inside a for loop. Why isn't it O(n²)?
    answer: >-
      Because the inner loop's total work across the whole run is bounded by n, not n per
      outer step. In the longest-run solution, the `while` only starts at a number whose
      left neighbour is missing, the start of a run, and it walks that run once. Every
      number belongs to exactly one run, so the `while` steps over each number at most once
      in total, and the `for` visits each once: about 2n steps. This is amortised analysis,
      the same argument that makes a sliding window or a monotonic stack linear. The
      trade-off is that it depends on the guard: remove the `seen.has(n - 1)` check and a
      single run of length n is walked from every one of its members, which is O(n²).
  - question: Why did you use a set instead of sorting?
    answer: >-
      The set gives O(n) time where sorting gives O(n log n), and the question asked for
      linear. Sorting is the natural first solution: order the values, skip repeats and count
      runs of consecutive numbers. The set removes the sort because the only question I ask
      of each value is whether its neighbour exists, which a set answers in constant time on
      average. The trade-off is memory and constants: the set uses O(n) extra space and
      hashing is slower per step than comparing sorted neighbours. If memory were tight and
      I were allowed to change the input, sorting in place would need little extra space,
      and at 100,000 items both finish well inside a second.
  - question: The numbers now arrive as a stream. How do you keep the longest run up to date?
    answer: >-
      Keep a map from value to run length, accurate only at the two ends of each run, and
      update it in O(1) per arrival. When x arrives and is new, look up the run ending at
      x - 1 and the run starting at x + 1. The merged length is left plus right plus one.
      Write it at x and at the two new ends, `x - left` and `x + right`, and update the best.
      Values inside a run keep stale lengths, which is fine because a new value can only
      touch a run at an end. That gives O(1) average per item and O(n) memory. An
      alternative is union-find, joining x with its neighbours and tracking group sizes; it
      also works but costs more code for the same result.
  - question: How do you know when to stop optimising?
    answer: >-
      When the complexity matches the constraints and the output size, I stop improving the
      algorithm and spend the time on tests. If n is 100,000 and I have O(n), a faster
      algorithm is impossible, since I must read every item. If the answer itself is
      exponential, as when listing every subset, no algorithm beats the output size. At that
      point the valuable work is edge cases, a brute-force comparison and clean naming. I
      also say it: "this is optimal in time because we must read the input; the remaining
      trade-off is O(n) memory, which I could avoid by sorting in place if mutating the input
      is acceptable". That shows I know where the limit is rather than guessing.
