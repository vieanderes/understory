term: online assessment
aka:
  - OA
  - timed online test
  - coding assessment
short: A timed coding test on a website, scored automatically by tests you cannot see.
explain: |
  Many companies screen with a test before any person talks to you. You get a few tasks,
  a timer and an editor in the browser. Press submit, and the platform scores you.

  The score comes from hidden tests. Some check corner cases, such as one element or all
  duplicates. Others feed huge inputs to catch a slow algorithm. Read the size limits
  first: they tell you which complexity will pass.

  Triage beats heroics. Bank the quick task, then return to the hard one. A clean partial
  answer often scores more than a clever one that times out.
analogy: A driving test with an examiner behind tinted glass. You only see the result.
usage: The online assessment had N up to 100,000, so the quadratic version was never going to pass.
