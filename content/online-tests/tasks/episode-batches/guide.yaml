approach: >-
  Turn the question around: for a given cap, how many batches do you need? Fill each batch
  greedily until the next episode would pass the cap. A bigger cap never needs more
  batches, so the smallest cap that fits in K batches can be found by binary search between
  the longest episode and the total running time.
complexity: O(N log S) time, where S is the total running time; O(1) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Read the bottom first. **N up to 100,000**, values up to 10,000, so the total can
      reach a billion minutes. Trying every possible split is hopeless, and so is trying
      every cap one by one.

      "The smallest possible longest batch" is a clue: you are minimising a maximum.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words. Naming the answer as a "cap" helps: it is the
      running-time limit every batch must fit under.
    code:
      ts: |-
        // Split A into at most K runs in order; return the smallest cap on the longest run.
      python: |-
        # Split A into at most K runs in order; return the smallest cap on the longest run.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs at the edges:

      - one episode, where the answer is that episode;
      - episodes of 0 minutes, where the answer can be 0;
      - K = 1, where the answer is the total;
      - more batches than episodes, where the longest episode decides.

      Put them in test-input.txt now.
    input:
      - "(1, [7])"
      - "(5, [0])"
      - "(1, [5, 5])"
      - "(4, [2, 9, 1])"
      - "(2, [1, 2, 3, 4, 5])"
  - kind: plan
    title: Check a cap, then search for the smallest
    minutes: 3
    body: |-
      Checking a cap is easy: walk the episodes, start a new batch when the next one would
      pass the cap, and count batches. That is O(N).

      The answer lies between the longest episode and the total. A cap that works keeps
      working when raised, so you can search that range for the first cap that works.
  - kind: write
    title: Write the greedy check and bank a slow search
    minutes: 5
    body: |-
      Type the check yourself: it is the core logic. Then try caps upward from the longest
      episode. That is correct and passes the small tests, but the gap can be a billion
      minutes wide, so it times out on the big ones.
    code:
      ts: |-
        // Split A into at most K runs in order; return the smallest cap on the longest run.
        // First pass: try every cap from the longest episode upward, too slow for large totals.
        function solution(K: number, A: number[]): number {
            const batchesNeeded = (cap: number): number => {
                let batches = 1;
                let current = 0;
                for (const minutes of A) {
                    if (current + minutes > cap) {
                        batches++;
                        current = minutes;
                    } else {
                        current += minutes;
                    }
                }
                return batches;
            };
            let cap = 0;
            for (const minutes of A) cap = Math.max(cap, minutes);
            while (batchesNeeded(cap) > K) cap++;
            return cap;
        }
      python: |-
        # Split A into at most K runs in order; return the smallest cap on the longest run.
        # First pass: try every cap from the longest episode upward, too slow for large totals.
        def solution(K, A):
            def batches_needed(cap):
                batches = 1
                current = 0
                for minutes in A:
                    if current + minutes > cap:
                        batches += 1
                        current = minutes
                    else:
                        current += minutes
                return batches

            cap = max(A)
            while batches_needed(cap) > K:
                cap += 1
            return cap
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. The three examples must say OK. Check each of your cases against
      the rule.
    expect: >-
      Three OKs, then 7 for one episode, 0 for the zero episode, 10 for K = 1, 9 when there
      are spare batches and 9 for the five episodes in two batches.
  - kind: ask-ai
    title: Confirm the property the search relies on
    minutes: 1
    body: |-
      Binary search is only safe if the check is monotonic. Confirming that is a good use of
      the assistant: it tests your reasoning, not its code.
    prompt: >-
      Without writing code: if the greedy fill needs at most K batches for a cap C, does it
      also need at most K batches for every cap above C? One sentence.
    expect: Yes. A bigger cap only lets batches hold more, so the count never rises.
  - kind: optimise
    title: Swap the linear search for a binary search
    minutes: 4
    body: |-
      Keep the check and replace only the search. Search between the longest episode and
      the total. When the middle cap fits, keep it as the new top; otherwise move the bottom
      past it.
    code:
      ts: |-
        // Split A into at most K runs in order; return the smallest cap on the longest run.
        // A bigger cap never needs more batches, so binary search the smallest cap that fits,
        // checking each with a greedy fill: O(N log S) time, O(1) space.
        function solution(K: number, A: number[]): number {
          const batchesNeeded = (cap: number): number => {
            let batches = 1;
            let current = 0;
            for (const minutes of A) {
              if (current + minutes > cap) {
                batches++;
                current = minutes;
              } else {
                current += minutes;
              }
            }
            return batches;
          };
          let lo = 0;
          let hi = 0;
          for (const minutes of A) {
            lo = Math.max(lo, minutes);
            hi += minutes;
          }
          while (lo < hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (batchesNeeded(mid) <= K) hi = mid;
            else lo = mid + 1;
          }
          return lo;
        }
      python: |-
        # Split A into at most K runs in order; return the smallest cap on the longest run.
        # A bigger cap never needs more batches, so binary search the smallest cap that fits,
        # checking each with a greedy fill: O(N log S) time, O(1) space.
        def solution(K, A):
            def batches_needed(cap):
                batches = 1
                current = 0
                for minutes in A:
                    if current + minutes > cap:
                        batches += 1
                        current = minutes
                    else:
                        current += minutes
                return batches

            lo = max(A)
            hi = sum(A)
            while lo < hi:
                mid = (lo + hi) // 2
                if batches_needed(mid) <= K:
                    hi = mid
                else:
                    lo = mid + 1
            return lo
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Ask for inputs only. Run them on the fast version and on the slow one in a scratch
      tab: the results must match.
    prompt: >-
      Give me 5 test inputs for solution(K, A), one per line, in the format
      (3, [4, 7, 2, 5]). Cover zeros between long episodes, K larger than N, all equal
      episodes, one very long episode and episodes of 10000 minutes. Keep totals small.
      Inputs only, no answers and no code.
    expect: Five lines to paste into test-input.txt, with the same results from both versions.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. Off-by-one errors in the search bounds are the usual
      bug here.
    prompt: >-
      Review my current solution for off-by-one errors in the binary search, the search
      bounds and time complexity. List any problems in one line each. Do not rewrite the
      code.
    expect: No problems, and the assistant confirms O(N log S) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the slow search and any debug output. Check the header comment states the
      complexity. Then submit.
