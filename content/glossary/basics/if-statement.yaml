term: if statement
aka: [if/else, conditional, else]
short: Code that runs a block only when a condition is true, and optionally another block when false.
explain: |
  Programs make choices. Show "Free delivery" when the basket is over £50, or show the fee.
  `if` checks a condition, a question with a true or false answer. Its block runs only when
  the answer is true, and `else` runs when it's false.

  Add `else if` to check more cases in order. The first true one wins and the rest are
  skipped. A classic slip is `if (x = 5)`, which sets `x` instead of comparing. Use `===`.
analogy: A fork in a path with a signpost. You read the sign once and walk down one side only.
example:
  language: js
  code: |
    if (total >= 50) {
      console.log("Free delivery");
    } else {
      console.log("Delivery is £4");
    }
usage: That if statement always runs, because its condition uses one equals sign and sets the value.
twin:
  term: loop
  difference: An if statement checks its condition once and runs its block once at most. A while loop checks again after every run, and repeats until the condition turns false.
related: [boolean, loop, strict-equality, truthy]
level: 1
lessons: [basics.conditions]
