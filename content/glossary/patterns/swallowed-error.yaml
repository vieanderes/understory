term: swallowed error
aka: [empty catch, swallowing errors, silent failure]
short: A failure caught and then ignored, so nobody ever learns it happened.
explain: |
  An empty `catch`, or one that only logs and carries on, hides the failure. The program
  continues in a broken state, and the real cause shows up months later somewhere else.

  A `catch` should handle the error for real, rethrow it with context using `cause`, or not
  be there. Catching at a boundary to show the user a message is fine, as long as the
  error is still reported.
analogy: Unplugging the beeping smoke alarm. The kitchen is quiet, the fire isn't out.
example:
  language: ts
  code: |
    try {
      await save(order);
    } catch (err) {
      throw new Error(`Saving order ${order.id} failed`, { cause: err });
    }
usage: That catch block is a swallowed error; the import reports success with half the rows missing.
related: [exception, fail-fast, code-smell, unhandled-rejection]
level: 1
lessons: [clean.errors, pro.amateur-tells, js.errors]
