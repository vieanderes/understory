summary: >-
  An agent is a model in a loop that picks its next tool each turn. The **harness** is all
  the code around that loop: it sends the history, runs the tools, counts what the run has
  spent, saves the state and decides when the loop ends. The model proposes; the harness
  disposes. Whatever the model believes, it can't make the loop run longer than the
  harness allows.


  The problem it solves is that a model has no sense of cost or time, and no memory between
  calls. Left alone, an agent can repeat the same two calls for an hour, resend a growing
  history until each turn costs more than the whole task was worth, or lose all progress
  when a server restarts. Caps on steps, tokens, time and money, loop detection and saved
  state turn that into a run with a clear end and a clear status.


  Reach for an agent only when the path can't be known ahead: open-ended research,
  debugging, a support case that needs several lookups in an order nobody can predict. When
  the steps are known, write a workflow: fixed steps in code, a model call only where
  language is needed. It's cheaper, faster, easier to test, and it never skips a step.
remember:
  - Use a workflow when the steps are known and an agent only for the part whose path can't be known ahead.
  - The harness, not the model, owns the loop, the budgets, the state and the decision to stop.
  - Cap steps, tokens, wall-clock time and money per run, count every turn including failed ones, and stop with a named status.
  - Each turn resends the whole history, so total input tokens grow roughly with the square of the number of turns.
  - Detect loops by a call or a pair of calls repeating, and by tool results that stop changing.
  - Save the task, step count, history and budgets after every step so a run can be resumed, inspected or replayed.
  - Make side-effecting tools idempotent, because a resumed run may repeat the step that crashed.
  - '`max_tokens` caps one reply, not a run, so the harness keeps its own running totals.'
sections:
  - title: A complete harness with every cap
    body: |-
      Here is a small harness that runs without a model. A scripted function stands in for
      the model, which is also how you test a real harness: feed it replies you control and
      assert on the status it ends with.

      ```python
      import hashlib
      import json
      import time
      from dataclasses import dataclass, field


      @dataclass
      class Budget:
          max_steps: int = 12
          max_tokens: int = 50_000
          max_seconds: float = 60.0
          max_cost: float = 0.50


      @dataclass
      class Run:
          task: str
          messages: list = field(default_factory=list)
          calls: list = field(default_factory=list)
          result_hashes: list = field(default_factory=list)
          steps: int = 0
          tokens: int = 0
          cost: float = 0.0
          status: str = "running"


      def fingerprint(text):
          return hashlib.sha256(text.encode()).hexdigest()[:12]


      def repeating(seq, repeats=3):
          for cycle in (1, 2):
              needed = cycle * repeats
              tail = seq[-needed:]
              if len(tail) == needed and all(tail[i] == tail[i - cycle] for i in range(cycle, needed)):
                  return True
          return False


      def run_agent(run, model, tools, budget, save, clock=time.monotonic):
          started = clock()
          while run.status == "running":
              # Every check happens before the next paid call.
              if run.steps >= budget.max_steps:
                  run.status = "step_cap"
              elif run.tokens >= budget.max_tokens or run.cost >= budget.max_cost:
                  run.status = "budget"
              elif clock() - started >= budget.max_seconds:
                  run.status = "timeout"
              if run.status != "running":
                  break
              reply = model(run.messages)
              run.steps += 1  # counted whatever happens next
              run.tokens += reply["tokens"]
              run.cost += reply["cost"]
              run.messages.append({"role": "assistant", "content": reply["content"]})
              if reply["tool"] is None:
                  run.status = "done"
              else:
                  name, args = reply["tool"]
                  call = f"{name}({json.dumps(args, sort_keys=True)})"
                  try:
                      result = tools[name](**args) if name in tools else f"error: unknown tool {name}"
                  except Exception as exc:  # the model sees the error and may recover
                      result = f"error: {exc}"
                  run.calls.append(call)
                  run.result_hashes.append(fingerprint(result))
                  run.messages.append({"role": "user", "content": result})
                  if repeating(run.calls) or repeating(run.result_hashes, repeats=4):
                      run.status = "loop"
              save(run)
          return run


      def stuck_model(messages):
          turn = len(messages) // 2
          tool = ("search", {"q": "flights LIS"}) if turn % 2 == 0 else ("open", {"id": 1})
          return {"content": "calling", "tool": tool, "tokens": 800 + 200 * turn, "cost": 0.01}


      def paging_model(messages):
          q = f"flights LIS page {len(messages)}"
          return {"content": "retry", "tool": ("search", {"q": q}), "tokens": 900, "cost": 0.01}


      def broken_search(q):
          raise TimeoutError("flights API timed out")


      tools = {"search": lambda q: "3 results", "open": lambda id: "Flight 1: sold out"}
      print(run_agent(Run("book"), stuck_model, tools, Budget(), lambda r: None).status)
      print(run_agent(Run("book"), paging_model, {"search": broken_search}, Budget(), lambda r: None).status)
      fresh = {"search": lambda q: f"no seats for {q}"}
      print(run_agent(Run("book"), paging_model, fresh, Budget(), lambda r: None).status)
      # loop, loop, step_cap
      ```

      The three runs show the three signals. The first alternates two calls and trips the
      pair check after six steps. The second varies its query each time, so no call repeats,
      but every result is the same timeout: the result hash catches it after four steps. The
      third makes real, different progress that never finishes, and the step cap ends it at
      twelve. Notice that `clock` is a parameter: a test passes a fake clock and checks the
      timeout without waiting a minute.
  - title: Why cost grows faster than the number of turns
    body: |-
      A model keeps nothing between calls, so every turn sends the system prompt, the task and
      every earlier message and tool result again. If the fixed part is 1,000 tokens and each
      turn adds 600, turn 12 alone sends 7,600 input tokens, and the twelve turns together
      send 51,600. That's more than six times the size of the final history. Input tokens
      summed over a run grow roughly with the **square of the turn count**.

      ```python
      base, added = 1000, 600
      per_turn = [base + added * t for t in range(12)]
      print(per_turn[-1], sum(per_turn))  # 7600 51600
      ```

      Three consequences follow for the harness. First, a token or money cap is not the same
      as a step cap: a run with bulky tool results can blow its money budget in five steps.
      Enforce both. Second, keep tool results small. Return the ten fields the model needs,
      not the raw 40 KB API response, and truncate long results with a note saying so.
      Third, keep the start of the prompt stable. Providers that cache a repeated prompt
      prefix charge less for the cached part and answer sooner, and an agent loop repeats its
      prefix every turn. Putting a timestamp or a request id at the top of the system prompt
      defeats that cache on every call.

      For long tasks, the harness can also compact: summarise older turns into a short note
      and start a fresh context with the task, the note and recent turns. The harness
      decides when, based on its token count.
  - title: Resuming safely after a crash
    body: |-
      Saved state lets a run carry on after a restart, but it opens a subtle hole. Suppose
      step 9 calls `charge_card`, the charge goes through, and the server dies before the
      state after step 9 is saved. On resume, the harness sees step 8 as the last complete
      one and runs step 9 again. Without care, the customer pays twice.

      The fix is the same one payment systems use: an **idempotency key**. Derive a key from
      the run and the step, and make the tool refuse to repeat work it has already done for
      that key.

      ```python
      executed = {}  # in production: a table with a unique key


      def charge_card(order_id, amount, *, key):
          if key in executed:
              return executed[key]
          receipt = f"charged {amount} for {order_id}"
          executed[key] = receipt
          return receipt


      def run_tool(run_id, step, name, args):
          return charge_card(**args, key=f"{run_id}:{step}:{name}")


      print(run_tool("run-42", 9, "charge_card", {"order_id": "o-7", "amount": 30}))
      print(run_tool("run-42", 9, "charge_card", {"order_id": "o-7", "amount": 30}))
      print(len(executed))  # 1: the second call returned the first receipt
      ```

      One more detail: a model's reply is not deterministic, so asking it again on resume
      may produce a different step 9. Save the proposed tool call before running it, a
      write-ahead record, and on resume replay that saved call instead of asking the model
      again. Read-only tools such as search can be repeated freely, which is one more reason
      to keep reads and writes in separate tools.
  - title: How a run ends, and what the user sees
    body: |-
      A harness should end every run in one of a few named states, stored with the run:
      `done`, `step_cap`, `budget`, `timeout`, `loop`, `error`, or `awaiting_approval` when a
      guardrail from the next lesson pauses it. A status is what makes a run debuggable. A
      dashboard of statuses per day tells you at a glance whether a prompt change made
      agents loop more.

      Hitting a cap is not a crash. The user should get the best partial result with an
      honest note ("I found three flights but couldn't confirm seats"), or a handover to a
      person with the saved history attached, so nobody asks the customer to start again.
      Some teams add a final, tool-free call when a cap is hit: "summarise what you found
      and what's left". Keep that call inside the budget by reserving room for it.

      Picking the numbers is an evals question, not a guess. Run the eval set, look at how
      many steps successful runs take, and set the cap a little above the high end: if 95%
      of good runs finish in 7 steps, a cap of 12 stops runaways without cutting off real
      work. Then watch how often each cap fires in production. A step cap that fires on 10%
      of runs is telling you the task, the tools or the prompt need work.
pitfalls:
  - '**Counting only successful turns.** It looks fair not to charge a step for a failed tool, but an outage then makes every turn fail and the loop never ends. Count every model call.'
  - '**Trusting `max_tokens` as a budget.** It limits one reply. A run of 30 turns can still spend thirty times that. Keep running totals of tokens and cost in the harness.'
  - '**Checking only for one repeated call.** Agents usually cycle through two calls, such as search then open. Check cycles of one and two, and hash results to spot runs where nothing new arrives.'
  - '**Keeping state in memory only.** A deploy or crash loses every run in flight, and there is nothing to inspect afterwards. Save state after each step in a store that outlives the process.'
  - '**Repeating side effects on resume.** The step that crashed may already have sent the email. Give side-effecting tools idempotency keys and replay the saved call rather than asking the model again.'
  - '**Using an agent for a fixed process.** It re-decides a known path with a paid call each turn and sometimes skips a step. Write a workflow and call the model only where language is needed.'
  - '**Failing silently at a cap.** Returning an empty answer hides the problem. End with a named status, a partial result or a handover, and chart how often each cap fires.'
interview:
  - question: When would you build an agent rather than a workflow?
    answer: >-
      Only when the sequence of steps can't be known in advance. If I can draw the flow
      chart, I write it as a workflow: fixed steps in code, a model call where language
      understanding is needed, such as extracting fields from an invoice. That's cheaper,
      faster, deterministic in its control flow, and each step has its own test. An agent
      fits open-ended work, like investigating a support case that needs an unknown number
      of lookups. Even then I keep the agent to the one step that needs exploration, inside a
      workflow that does the fixed parts. The trade-off is flexibility against cost,
      latency and predictability: every agent turn is a paid call that resends the history,
      and a model choosing the path can choose a wrong one.
  - question: How do you stop an agent from running up a huge bill?
    answer: >-
      The harness enforces hard caps per run on steps, tokens, wall-clock time and money,
      checked before every model call, and every turn counts, failed or not. The model
      can't override them because they live in code. I keep running totals myself, since
      `max_tokens` only limits a single reply. Because each turn resends the history, cost
      grows faster than turns, so I also keep tool results small and the prompt prefix
      stable so provider caching works. On top of per-run caps I'd add per-user and
      per-feature daily budgets and an alert on spend. When a cap fires, the run ends with a
      named status and a partial answer or handover. The trade-off is that a tight cap cuts
      off some legitimate long tasks, so I set caps from the step distribution of successful
      runs in the eval set.
  - question: How would you detect that an agent is stuck?
    answer: >-
      I watch the history for repetition, in calls and in results. The simplest signal is
      the same tool call with the same arguments several times in a row. Agents more often
      alternate, search then open then search, so I also check for a repeating pair. A
      third signal catches loops where the arguments change but nothing is learnt: hash each
      tool result and stop when the last few hashes are identical, which catches an outage
      the model keeps retrying with different queries. For subtler cases a small classifier
      can score "is this run making progress?" after each turn. Detection needs a response:
      stop with a `loop` status, or inject a note telling the model it's repeating itself
      and give it one more turn. The step cap stays as the backstop, because no detector
      catches every loop.
  - question: Your agent runs for minutes and the server can restart mid-run. How do you design for that?
    answer: >-
      The harness owns the state and saves it after every step: task, history, step count,
      spend and status, in durable storage keyed by run id. On restart it loads the state
      and continues from the last completed step. The danger is the step in flight: if it
      had a side effect, like charging a card, replaying it could repeat the effect. So
      side-effecting tools take an idempotency key built from the run id and step, and I
      write the proposed call to storage before running it, so a resume replays that exact
      call instead of asking the model again and getting a different answer. Saved state
      also pays off in debugging, because I can replay any run step by step. The cost is a
      write per step, which is small next to a model call.
  - question: Would you use a framework like LangGraph or Google ADK, or write the agent loop yourself?
    answer: >-
      It depends on what the use case needs, not on which framework is best. A plain loop
      of about fifteen lines is enough for one agent with a few tools: it's quick to read,
      test and debug, and nothing hides the prompts. A framework earns its place when I need
      explicit state across steps, branching, retries, human approval pauses, persistence so
      a run survives a restart, or hand-offs between several agents. LangGraph models the
      flow as a graph of steps over shared state, with checkpoints. Google's ADK composes
      agents in a hierarchy, with workflow agents for fixed order and a natural path to
      Google Cloud. The cost of a framework is another abstraction to learn and debug, so I
      start plain and move when I find myself rebuilding those features by hand.
  - question: What is Google's Agent Development Kit, ADK?
    answer: >-
      ADK is Google's open-source framework for building, evaluating and deploying agents.
      Its core is an LLM agent with instructions and tools, plus **workflow agents** that
      run sub-agents in a fixed pattern without asking the model: `SequentialAgent`,
      `ParallelAgent` and `LoopAgent`. That split matches the advice to keep control flow in
      code where the path is known. Agents can be tools for other agents, so a multi-agent
      system is a hierarchy of specialists. Callbacks run before and after model and tool
      calls, for guardrails and logging. A session holds one conversation's history and
      state, and a memory service stores knowledge across sessions. It works with Gemini and
      other models, and deploys to Google Cloud, for example Cloud Run or Vertex AI.
