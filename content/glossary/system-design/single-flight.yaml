term: single-flight
aka: [ request coalescing, single flight, deduplicated request ]
short: Letting one of many identical concurrent requests run, while the others wait and share its result.
explain: |
  Ten callers notice at once that the token expired, and all ten try to refresh it. With a
  rotating refresh token, nine of them fail and the provider may revoke the connection.

  Keep a record of work in progress, keyed by what is being fetched. The first caller
  starts it; the rest wait for the same promise. In one process a `Map` of promises does
  it. Across several workers the lock must live somewhere shared, such as the database row.
analogy: One person going to the shop for the whole office's lunch order, instead of ten people making ten trips.
example:
  language: ts
  code: |
    const inFlight = new Map<string, Promise<Token>>();

    function refresh(connectionId: string): Promise<Token> {
      const running = inFlight.get(connectionId);
      if (running) return running;
      const p = doRefresh(connectionId).finally(() => inFlight.delete(connectionId));
      inFlight.set(connectionId, p);
      return p;
    }
usage: Wrap the token refresh in a single-flight, so parallel jobs share one refresh per connection.
related: [ refresh-token, race-condition, cache-stampede, promise ]
level: 3
lessons: [ integrations.tokens-that-expire, interview.llm-client-build ]
