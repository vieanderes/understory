id: ts.typing-the-boundary
title: Typing the boundary
objective: Check data from outside your code with `unknown` and a parser, instead of trusting `as`.
level: essential
minutes: 10
concepts: [ts.unknown, ts.type-assertions, ts.runtime-schemas]
prerequisites: [ts.narrowing]
opening:
  text: >-
    You'll see how a wrong value can pass every type you wrote and still compile. Then you'll
    close that gap where data enters your program.

steps:
  - type: prose
    id: what-the-boundary-is
    body: >-
      Your types describe your own code. Data from outside is another matter: a server's
      reply, a form, something saved in the browser. That edge is **the boundary**.


      Types are erased, so nothing checks that data while the code runs. Worse, `JSON.parse`
      returns **any**, a type that switches checking off. Whatever type you give its result,
      the checker believes you.

  - type: predict-output
    id: predict-parsed-price
    concept: ts.unknown
    difficulty: 1
    language: ts
    code: |
      type Price = { amount: number; currency: string };

      const body = '{"amount":"45.00","currency":"GBP"}';
      const price: Price = JSON.parse(body);
      console.log(price.amount + 5);
    question: The server sent `amount` as text, and this compiles. What does it log?
    choices:
      - text: '`45.005`'
        correct: true
        feedback: >-
          Right. It's still text, so `+` joins rather than adds.
      - text: '`50`'
        feedback: >-
          An annotation doesn't convert anything. It only tells the checker what to believe.
      - text: A `TypeError` on line 4
        feedback: >-
          Nothing checks the value there. The line compiles to a plain `JSON.parse` call.

  - type: prose
    id: as-checks-nothing
    body: |-
      You'll often see the same claim written with `as`:

      ```ts
      const price = JSON.parse(body) as Price;
      ```

      That's a **type assertion**. It tells the checker to treat the value as a `Price`. It
      converts nothing and checks nothing, and it's erased like every other type. If the
      claim is wrong, the crash comes later, somewhere else.

  - type: ai-review
    id: review-model-reply-cast
    concept: ts.type-assertions
    difficulty: 2
    language: ts
    request: Read the AI model's JSON reply and return its label in capitals.
    flawClass: edge-case
    code: |
      type Verdict = { label: "positive" | "negative"; score: number };

      function readVerdict(reply: string): string {
        const verdict = JSON.parse(reply) as Verdict;
        return verdict.label.toUpperCase();
      }
    prompt: >-
      Sometimes the model replies `{"sentiment":"positive"}` instead. Tap the line that lets
      that through.
    lines: [4]
    reasons:
      - text: '`as` claims the shape and checks nothing'
        correct: true
        feedback: >-
          Right. The wrong shape gets in, and line 5 throws on `undefined`.
      - text: '`JSON.parse` throws on the wrong shape'
        feedback: >-
          It only throws on text that isn't JSON. This reply is valid JSON, in the wrong shape.
      - text: '`label` needs a `string` annotation'
        feedback: >-
          The type already says it's text. Nobody checked that claim against the real reply.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'A valid reply in the wrong shape'
          correct: true
          feedback: >-
            Yes. That's the reply the model really sends sometimes.
        - text: 'A reply that isn''t JSON at all'
          feedback: >-
            `JSON.parse` throws on that in both versions, so it tells them apart no better.
        - text: 'A correct positive verdict'
          feedback: >-
            That passes. The cast only goes wrong when the shape is wrong.
    fix: |
      function readVerdict(reply: string): string | undefined {
        const data: unknown = JSON.parse(reply);
        if (typeof data !== "object" || data === null) return undefined;
        if (!("label" in data) || typeof data.label !== "string") return undefined;
        return data.label.toUpperCase();
      }

  - type: prose
    id: unknown-forces-narrowing
    body: |-
      Give boundary data the type **unknown** instead. Like `any`, it accepts every value.
      Unlike `any`, it allows nothing until you've checked:

      ```ts
      const data: unknown = JSON.parse(body);
      data.amount;
      // 'data' is of type 'unknown'.
      ```

      The checks are the narrowing you know, plus `in`, which asks whether an object has a
      property: `"amount" in data`.

  - type: fill-blank
    id: fill-narrow-unknown
    concept: ts.unknown
    difficulty: 3
    language: ts
    prompt: >-
      Complete `readAmount`, so it compiles. It gives the amount when that's a number, and
      `undefined` for anything else.
    template: |
      function readAmount(input: unknown): number | undefined {
        if (typeof input !== {{1}} || input === {{2}}) return undefined;
        if (!({{3}} in input)) return undefined;
        if (typeof input.amount !== {{4}}) return undefined;
        return input.amount;
      }
    blanks:
      - key: '1'
        answer: '"object"'
      - key: '2'
        answer: 'null'
      - key: '3'
        answer: '"amount"'
      - key: '4'
        answer: '"number"'
    bank: ['"object"', 'null', 'undefined', '"amount"', 'amount', '"number"', '"string"']

  - type: prose
    id: parse-do-not-validate
    body: |-
      Put those checks in one function, a **parser**. It takes `unknown` and returns a typed
      value or a failure:

      ```ts
      type PriceResult =
        | { ok: true; value: Price }
        | { ok: false; error: string };

      async function loadPrice(url: string): Promise<PriceResult> {
        const response = await fetch(url);
        return parsePrice(await response.json());
      }
      ```

      `Promise<PriceResult>` reads "a promise of a `PriceResult`". Past the parser, every
      function gets a real `Price`.

  - type: code-challenge
    id: write-parse-price
    concept: ts.runtime-schemas
    difficulty: 4
    language: ts
    prompt: >-
      Write `parsePrice(input: unknown): PriceResult`.


      If `input` isn't a non-null object, the error is `"input"`. `amountPence` must be a whole
      number of 0 or more, or the error is `"amountPence"`. `currency` must be `"GBP"` or
      `"EUR"`, or the error is `"currency"`.


      On success, return a new object with those two fields only. Never throw, and never use
      `as`.
    hints:
      - The starter's `input as Price` satisfies the checker and checks nothing.
      - >-
        `typeof null` is `"object"`, so rule that out first. Then `"amountPence" in input` is
        allowed.
      - >-
        Check the object, then the number with `Number.isInteger`, then the two currencies.

  - type: explain-back
    id: explain-string-price
    concept: ts.unknown
    difficulty: 3
    audience: teammate
    kind: risk
    prompt: |-
      ```ts
      type Price = { amount: number; currency: string };

      const body = '{"amount":"45.00","currency":"GBP"}';
      const price: Price = JSON.parse(body);
      ```

      A teammate wants to ship this, because it compiles. What could go wrong, and how would
      you check before it ships?
    rubric:
      - '`JSON.parse` returns `any`, so the `Price` annotation was accepted without evidence.'
      - Types are erased, so text like `"45.00"` reaches code that expects a number.
      - Parse at the boundary from `unknown`, and test it with a body whose fields have the wrong types.
    modelAnswer: >-
      It compiles because `JSON.parse` returns `any`, and `any` accepts any annotation. Types
      vanish when the code runs, so nothing checks the real value. Here `amount` is text, so a
      sum can join strings instead of adding. Before shipping I'd parse at the boundary: take
      `unknown`, check each field, and return a `Price` or a failure. Then I'd test it with a
      body where `amount` is text.

recap:
  - Explain why a wrong value can pass every type you wrote.
  - Take outside data as `unknown` and narrow it before use.
  - Parse once where data enters, and keep typed values behind it.

recall:
  - id: card-erasure
    concept: ts.type-assertions
    front: 'What''s left of `const price: Price = JSON.parse(body) as Price;` when it runs?'
    back: >-
      `const price = JSON.parse(body);`. The annotation, the assertion and the type are all
      gone.
  - id: card-unknown-or-any
    concept: ts.unknown
    front: Both `any` and `unknown` accept any value. What differs?
    back: >-
      `any` allows every operation and turns checking off. `unknown` allows none until you've
      narrowed it.
  - id: card-assertion-runtime
    concept: ts.type-assertions
    front: When does `value as Order` throw for something that isn't an order?
    back: >-
      Never. It produces no code. The failure turns up later, wherever the value is used.
  - id: card-parse-dont-validate
    concept: ts.runtime-schemas
    front: What does a parser at the boundary take, and what does it return?
    back: >-
      It takes `unknown`, and returns either a typed value or a failure, so the check and the
      type stay together.

references:
  - kind: docs
    title: Everyday Types, type assertions
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html#type-assertions
    note: What `as` does, and that it's removed before the code runs.
    primary: true
    verified: true
  - kind: essay
    title: Parse, don't validate
    authors: Alexis King
    year: 2019
    venue: lexi-lambda.github.io
    url: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
    note: The argument for returning a typed value instead of a yes or no.
    primary: true
    verified: true
  - kind: docs
    title: Zod
    authors: Colin McDonnell
    venue: zod.dev
    url: https://zod.dev/
    note: A library that writes the parser for you from a schema, and derives the type from it.
    verified: true

deepDive: >-
  Writing parsers by hand gets long. Schema libraries such as Zod write them for you. You
  describe the shape once, `z.object({ amount: z.number() })`, and get both a parser and the
  type. `z.infer<typeof PriceSchema>` is the type, and `PriceSchema.safeParse(data)` checks the
  real value. You'll install libraries with npm in the Tooling chapter.


  A validator that only answers yes or no leaves the value untyped, so the next function must
  trust it again. A parser returns the typed value, so the check and the type travel together.


  A **type predicate**, `function isPrice(v: unknown): v is Price`, tells the checker what a
  boolean means. It's only as good as the code inside, since the checker takes your word for
  it.


  `unknown` also appears in `catch (error)`. Under `strict`, the caught value is `unknown`,
  because anything can be thrown, not only an `Error`.
