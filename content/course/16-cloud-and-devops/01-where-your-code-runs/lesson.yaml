id: cloud.where-code-runs
title: Where your code runs
objective: Say what a server, the cloud and a region are, and make an app answer at a public address instead of only on localhost.
level: essential
minutes: 9
concepts: [cloud.servers-and-the-cloud, cloud.regions, cloud.listening-address, cloud.deploying]
prerequisites: [backend.first-endpoint, tooling.configuration-and-environment]
opening:
  text: >-
    You'll know what "the cloud" really is, and why an app that works on your laptop can
    answer nobody else. Then you'll fix the two lines that stop most first deploys.

steps:
  - type: prose
    id: laptop-and-server
    body: >-
      So far your API has run at `localhost:3000`. Only you can reach it, and it stops when
      you close the lid.


      A **server** is a computer that runs your code for other people. It stays on, stays
      online, and has an address anyone on the internet can reach. Putting your app there is
      what this chapter is about.

  - type: prose
    id: cloud-and-regions
    body: |-
      Few people buy one. The **cloud** is renting servers by the hour from a provider, such as AWS or Google Cloud.

      Their machines fill buildings called data centres. A **region** is a group of them in one area, such as London or Sydney. Distance costs time. From a laptop in Europe, connecting took:

      ```bash
      $ curl -o /dev/null -s -w '%{time_connect}\n' https://ec2.eu-west-2.amazonaws.com
      0.072135
      $ curl -o /dev/null -s -w '%{time_connect}\n' https://ec2.ap-southeast-2.amazonaws.com
      0.418268
      ```

      That's seconds, London against Sydney. Run your app near its users, and near its database.

  - type: multiple-choice
    id: pick-region
    concept: cloud.regions
    difficulty: 1
    question: Most users are in Germany, and the database runs in Frankfurt. Where should the API run?
    choices:
      - text: Frankfurt, next to the database
        correct: true
        feedback: >-
          Right. Short trips to users and to the data.
      - text: Sydney, where our test server already is
        feedback: >-
          Every query would cross the world and back. Users would feel each one.
      - text: The provider's biggest region, in the US
        feedback: >-
          Size doesn't help your users. Distance to them and to the data does.
      - text: In every region at once
        feedback: >-
          Copies far from Frankfurt would still pay the long trip to the database on every query.

  - type: prose
    id: localhost-is-only-you
    body: |-
      `localhost` is the address 127.0.0.1, and it means "this machine". A server that listens there only answers programs on the same machine.

      We ran this in a container, which acts like a separate small computer, and called it from the laptop:

      ```bash
      $ curl localhost:3000
      curl: (56) Recv failure: Connection reset by peer
      ```

      Listening on **0.0.0.0** means "every address this machine has". Then outside callers get through too.

  - type: bug-hunt
    id: hunt-localhost-only
    concept: cloud.listening-address
    difficulty: 2
    language: js
    code: |
      import { serve } from "@hono/node-server";

      function handle(request) {
        return Response.json({ message: "Hello" });
      }

      serve({ fetch: handle, port: 3000, hostname: "127.0.0.1" });
      console.log("Listening on http://127.0.0.1:3000");
    prompt: >-
      On the server this logs "Listening", but every request from outside is reset. Tap the
      line at fault.
    lines: [7]
    reasons:
      - text: It listens on 127.0.0.1, so only the server gets in
        correct: true
        feedback: >-
          Yes. Drop `hostname`, or set it to `0.0.0.0`, and outside calls get through.
      - text: '`Response.json` only works in a browser'
        feedback: >-
          It works in Node too. The handler never ran, because no request reached it.
      - text: The log line should come before `serve`
        feedback: >-
          The order of the log doesn't change who can connect. The address does.
    verify:
      question: 'Which check would have caught this before users did?'
      choices:
        - text: 'Calling the app from another machine'
          correct: true
          feedback: >-
            Yes. Only an outside caller sees what users see.
        - text: 'Calling it with `curl` on the server itself'
          feedback: >-
            That's how it passed. On the server, 127.0.0.1 answers fine.
        - text: 'Reading the "Listening" line in the log'
          feedback: >-
            The log printed while every outside request was reset.
    fix: |
      serve({ fetch: handle, port: 3000 }); // every address, the default

  - type: prose
    id: the-host-picks-the-port
    body: |-
      A hosting platform runs many apps side by side. It picks a port for yours and tells your app in an environment variable, usually `PORT`:

      ```bash
      $ PORT=8080 node server.js
      ```

      An app that ignores it and listens on 3000 waits on the wrong door. Ours was reset on 8080, exactly like the `localhost` bug. Read `PORT`, and keep 3000 as the default for your laptop.

  - type: code-challenge
    id: write-listen-options
    concept: cloud.listening-address
    difficulty: 3
    language: ts
    prompt: >-
      Write `listenOptions(env)`. `env` is the environment, like `process.env`. Return
      `{ hostname, port }` for `serve`.


      `hostname` is always `'0.0.0.0'`. `port` comes from `env.PORT` as a number, or `3000`
      when `PORT` is missing. If `PORT` is set but isn't a whole number from 1 to 65535, throw
      an `Error` whose message contains `PORT`.


      So `listenOptions({ PORT: '8080' })` gives `{ hostname: '0.0.0.0', port: 8080 }`.
    hints:
      - Handle the missing case first. `undefined` means use the default.
      - '`Number("abc")` is `NaN`, and `Number("")` is `0`. Neither is a port.'
      - '`Number.isInteger(port)` rules out `NaN` and `8.5`. Then check the range.'

  - type: prose
    id: what-deploying-is
    body: >-
      **Deploying** is four moves: build your code, copy it to a server, start it there, and
      point a public address at it.


      This chapter takes each move apart. A Linux server, then a domain name. A container that
      packs your app the same way everywhere. A pipeline that deploys on every push. Then
      monitoring, so you hear about trouble before your users do.

  - type: ai-review
    id: review-key-in-code
    concept: cloud.deploying
    difficulty: 3
    language: js
    request: Get my summarise endpoint ready to deploy. It calls a language model.
    flawClass: security
    code: |
      import { serve } from "@hono/node-server";

      const MODEL_KEY = "sk-live-5f2c9a81e0d4";

      async function handle(request) {
        const { text } = await request.json();
        const reply = await fetch("https://api.example.com/v1/summarise", {
          method: "POST",
          headers: { authorization: `Bearer ${MODEL_KEY}` },
          body: JSON.stringify({ text }),
        });
        return Response.json(await reply.json());
      }

      serve({ fetch: handle, port: Number(process.env.PORT ?? 3000) });
    prompt: >-
      The assistant says it's deploy-ready, and it does read `PORT`. This code goes into
      Git and onto every server. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The key is in the code, so it ships everywhere
        correct: true
        feedback: >-
          Yes. Read it from `process.env.MODEL_KEY`, set on the server only.
      - text: '`port` should be a fixed 3000 for a server'
        feedback: >-
          The reverse. The platform chooses the port, so reading `PORT` is right.
      - text: '`fetch` can''t run on a server'
        feedback: >-
          Node has had `fetch` built in for years. Servers call other APIs with it all day.
    fix: |
      const MODEL_KEY = process.env.MODEL_KEY; // set on the server, never committed

  - type: explain-back
    id: explain-why-rent
    concept: cloud.servers-and-the-cloud
    difficulty: 2
    audience: non-technical
    kind: explain
    prompt: >-
      A friend who doesn't code says: "Why rent a server? I'll leave my laptop on and send
      people `localhost:3000`." Explain, in plain words, why that won't work.
    rubric:
      - '`localhost` means "this computer", so the link opens on nobody else''s machine.'
      - 'A server stays on and online, with an address anyone can reach, and a laptop doesn''t.'
      - 'Renting one from the cloud costs a little per hour, near the users, with no hardware to own.'
    modelAnswer: >-
      `localhost` only ever means "this computer", so the link would open on nobody else's
      machine. Even with a public address, a laptop sleeps, moves between networks and runs
      out of battery. A server stays on, stays online and has an address anyone can reach.
      Renting one from a cloud company costs a little per hour. You can put it close to your
      users and switch it off when you're done.

recap:
  - Say what a server, the cloud and a region are, and pick a region near users and data.
  - Make an app listen on `0.0.0.0` and the port in `PORT`, so outside callers reach it.
  - Name the four moves of a deploy, and keep keys out of the code you copy.

recall:
  - id: card-server
    concept: cloud.servers-and-the-cloud
    front: What is a server, and what does renting one from the cloud mean?
    back: >-
      A computer that runs your code for other people, always on and reachable. The cloud
      rents you one by the hour from a provider's data centres.
  - id: card-region
    concept: cloud.regions
    front: How do you choose a region for an API and its database?
    back: >-
      Put both in the same region, close to where most users are, so every query and every
      request travels a short way.
  - id: card-listen-address
    concept: cloud.listening-address
    front: Why does a server listening on 127.0.0.1 ignore outside requests?
    back: >-
      127.0.0.1 is `localhost`, the machine itself. Only programs on that machine reach it.
      Listen on `0.0.0.0` to accept every address.
  - id: card-port-variable
    concept: cloud.listening-address
    front: Where should a deployed app get its port from?
    back: >-
      From the `PORT` environment variable the platform sets, with a default such as 3000 for
      your own machine.
  - id: card-deploy
    concept: cloud.deploying
    front: What are the four moves of a deploy?
    back: >-
      Build the code, copy it to a server, start it there, and point a public address at it.

