term: principle of least surprise
aka:
  - principle of least astonishment
  - least surprise
  - POLA
short: Code should behave the way its name and shape lead a reader to expect.
explain: |
  A function called `getUser` that also writes to the database. A `sort` helper that changes
  the list you handed it. A setting called `timeout` measured in minutes when every other one
  uses seconds. Each works, and each sets a trap.

  The next person reads the name, assumes the obvious, and builds on it. Every surprise is a
  future bug written by someone careful.

  Fix it with names that tell the truth, no hidden side effects, and consistency with the rest
  of the codebase. If it must surprise, say so where people will look.
analogy: A tap marked hot that runs cold. It works, and someone will get scalded.
usage: A getter that sends an email breaks the principle of least surprise; rename it or move the email out.
related:
  - side-effect
  - hidden-invariant
  - pure-function
  - code-smell
level: 2
lessons:
  - judgment.next-reader
