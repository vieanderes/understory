term: hot key
aka: [hot keys, hot partition, hot spot, celebrity problem]
short: One key that gets so much traffic that the single machine holding it becomes the bottleneck.
explain: |
  Spreading data over many machines works when traffic spreads too. But one key, such as a
  famous account or a viral post, can draw more requests than any one machine can serve.

  Adding machines doesn't help, because the key still lives on one. Fixes include caching
  it close to readers, copying it to several places, or splitting it into sub-keys.
analogy: One till at the supermarket with a celebrity behind it. Opening more tills doesn't shorten that queue.
usage: The trending post is a hot key; replicate it in the cache instead of hammering one shard.
related: [sharding, cache, fan-out-on-write, load-balancer]
level: 3
lessons: [sysdesign.case-news-feed]
