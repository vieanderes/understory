term: threat model
aka:
  - threat modelling
  - threat modeling
short: A written list of what's worth protecting, who might attack it, how, and what stops them.
explain: |
  Security without a target turns into a pile of tools. Start instead with four questions.
  What are we building? What can go wrong? What are we doing about it? Did we do a good job?

  List the assets (money, personal data, admin access), the attackers who'd want them, and
  every entry point they could reach. A checklist such as STRIDE helps you not miss a kind
  of threat. The output is a short, ranked list of risks, each with an owner.
analogy: Walking round your own house like a burglar would. Which window is loose, what's worth taking, and which lock do you fix first?
usage: Before we add file uploads, update the threat model, because it's a new way in.
related:
