id: backend.how-a-page-reaches-you
title: How a page reaches you
objective: Name the parts of a URL and the hops a request makes, and tell from an error which hop failed.
level: essential
minutes: 10
concepts: [backend.url, backend.request-journey]
prerequisites: [backend.what-a-backend-is]
opening:
  text: >-
    You'll follow a web address from the moment you press Enter to the moment a response
    comes back. When a site or your own server won't answer, you'll know which step broke.

steps:
  - type: prose
    id: url-parts
    body: |-
      You met the origin, the path and the query string in the JavaScript chapter. The origin
      has parts of its own:

      ```text
      https://weather.example:8443/forecast?city=leeds#hourly
      ```

      The **scheme**, `https`, says how to talk. The **host**, `weather.example`, names the
      machine. The **port**, `8443`, picks the program; leave it out and `https` means 443.
      The **fragment**, after `#`, marks a spot on the page and never leaves your browser.

  - type: playground
    id: build-forecast-url
    concept: backend.url
    difficulty: 1
    prompt: >-
      The page splits an address into its parts. Edit the address so it asks for Leeds, for 3
      days, and jumps to the hourly section. Watch each part change.
    html: |
      <p>Host: <b id="host"></b></p>
      <p>Path: <b id="path"></b></p>
      <p>Query: <b id="query"></b></p>
      <p>Fragment: <b id="fragment"></b></p>
    js: |
      const url = new URL("https://weather.example/forecast");

      document.querySelector("#host").textContent = url.host;
      document.querySelector("#path").textContent = url.pathname;
      document.querySelector("#query").textContent = url.search;
      document.querySelector("#fragment").textContent = url.hash;
    editable: [js]
    checks:
      - label: The query asks for Leeds
        selector: '#query'
        text: city=leeds
      - label: The query asks for 3 days
        selector: '#query'
        text: days=3
      - label: The fragment is the hourly section
        selector: '#fragment'
        text: '#hourly'
    solution:
      js: |
        const url = new URL("https://weather.example/forecast?city=leeds&days=3#hourly");

        document.querySelector("#host").textContent = url.host;
        document.querySelector("#path").textContent = url.pathname;
        document.querySelector("#query").textContent = url.search;
        document.querySelector("#fragment").textContent = url.hash;
    hints:
      - The query string starts with `?` and joins its pairs with `&`.
      - The fragment goes last, after `#`.

  - type: prose
    id: the-hops
    body: >-
      Before any response arrives, four hops happen in order.


      **DNS**, the internet's phone book, turns the host into an **IP address**, a number
      like `104.20.23.154`. **TCP** opens a **connection**, a two-way line to that address.
      **TLS** checks the server's **certificate**, its proof of identity, and encrypts the
      line. Then **HTTP** sends the request and brings back the response.
    figure:
      id: request-hops-cold
      caption: A first visit on a phone. DNS, TCP and TLS take 300 of the 691 ms.

  - type: prose
    id: curl-v
    body: |-
      `curl -v`, for verbose, prints each hop as it happens. Lines with `*` are notes, `>`
      is what was sent, `<` is what came back:

      ```bash
      $ curl -v localhost:3100/books
      * Host localhost:3100 was resolved.
      * Connected to localhost (::1) port 3100
      > GET /books HTTP/1.1
      > Host: localhost:3100
      < HTTP/1.1 200 OK
      < content-type: application/json
      ```

      Trimmed a little. `::1` is how your computer writes its own address.

  - type: lab
    id: lab-request-journey
    concept: backend.request-journey
    lab: request-journey
    intro: >-
      Step a URL from the address bar to pixels, one hop at a time. Then break one hop and
      watch which later hops never start.
    checkpoint:
      question: With an `https` URL, which hops finish before the request is sent?
      difficulty: 2
      choices:
        - text: DNS, TCP and TLS
          correct: true
          feedback: >-
            Yes. An address, a connection, then encryption. Only then can the request go.
        - text: DNS and TCP
          feedback: >-
            Encryption comes first, because the request itself has to be encrypted.
        - text: Only DNS
          feedback: >-
            HTTP travels over a TCP connection, so the connection has to exist first.
    fallback:
      type: multiple-choice
      id: pick-missing-hop
      concept: backend.request-journey
      difficulty: 2
      language: bash
      code: |
        $ curl -v http://localhost:3100/books
        * Host localhost:3100 was resolved.
        * Connected to localhost (::1) port 3100
        > GET /books HTTP/1.1
        > Host: localhost:3100
        < HTTP/1.1 200 OK
      question: This request used plain `http`. Which hop is missing from the output?
      choices:
        - text: TLS, because the scheme is `http`
          correct: true
          feedback: >-
            Right. Plain `http` skips encryption. With `https`, handshake lines would appear here.
        - text: DNS, because `localhost` needs no lookup
          feedback: >-
            The first line shows it: `localhost` was resolved to an address.
        - text: TCP, because both run on one machine
          feedback: >-
            The second line is the TCP connection, the same as with a remote server.

  - type: parsons
    id: arrange-the-journey
    concept: backend.request-journey
    difficulty: 2
    language: text
    prompt: You open `https://weather.example/forecast`. Put the browser's work in order. One step doesn't belong.
    blocks:
      - id: dns
        code: Ask DNS for the host's IP address
        subgoal: Find the server
      - id: tcp
        code: Open a TCP connection on port 443
        subgoal: Connect
      - id: tls
        code: Check the certificate and agree on keys
        subgoal: Secure it
      - id: http-request
        code: Send GET /forecast
        subgoal: Ask
      - id: http-response
        code: Receive 200 OK and the HTML
        subgoal: Ask
      - id: paint
        code: Build the page and paint it
        subgoal: Show it
    distractors:
      - id: dns-full-url
        code: Send the full URL to DNS
        feedback: >-
          DNS only gets the host name. The path travels later, inside the encrypted request.

  - type: prose
    id: reading-failures
    body: |-
      Each hop fails in its own words, so the error tells you where to look. A host that DNS
      can't find:

      ```bash
      $ curl https://weather.invalid/forecast
      curl: (6) Could not resolve host: weather.invalid
      ```

      That's a typo in the host, or a missing DNS record. A status such as `404` is different:
      it's an HTTP answer, so every hop before it worked.

  - type: multiple-choice
    id: predict-failed-hop
    concept: backend.request-journey
    difficulty: 3
    language: bash
    code: |
      $ curl localhost:3150/forecast
      curl: (7) Failed to connect to localhost port 3150 after 0 ms: Couldn't connect to server
    question: Which hop failed here?
    choices:
      - text: TCP, nothing accepted the connection
        correct: true
        feedback: >-
          Yes. DNS gave an address, but no program listens on port 3150.
      - text: DNS, the host wasn't found
        feedback: >-
          A DNS failure says `Could not resolve host`. Here `curl` had an address to try.
      - text: HTTP, the path doesn't exist
        feedback: >-
          A missing path gets a `404` response. That needs a working connection first.
      - text: TLS, the certificate was refused
        feedback: >-
          This is plain `http`, so there's no TLS at all. The connection never opened.

  - type: bug-hunt
    id: hunt-raw-query
    concept: backend.url
    difficulty: 3
    language: js
    code: |
      const base = "https://weather.example";
      const city = "Newcastle & Gateshead";
      const link = base + "/forecast?city=" + city;
      const sent = new URL(link);
      console.log(sent.searchParams.get("city")); // "Newcastle "
    prompt: The server receives the city as `"Newcastle "`. Tap the line at fault.
    lines: [3]
    reasons:
      - text: A raw `&` starts a new query parameter
        correct: true
        feedback: >-
          Exactly. `encodeURIComponent(city)` turns `&` into `%26`, so the value survives.
      - text: Spaces aren't allowed, so the value stops
        feedback: >-
          `new URL` encodes a space and keeps reading. The value ends at the `&`.
      - text: '`base` needs a trailing slash'
        feedback: >-
          The path brings its own slash, so the host ends in the right place.
    fix: |
      const base = "https://weather.example";
      const city = "Newcastle & Gateshead";
      const link = base + "/forecast?city=" + encodeURIComponent(city);
      const sent = new URL(link);
      console.log(sent.searchParams.get("city")); // "Newcastle & Gateshead"

  - type: explain-back
    id: explain-no-requests
    concept: backend.request-journey
    difficulty: 3
    audience: newcomer
    kind: explain
    prompt: >-
      A new support colleague is puzzled. The site's DNS record expired, visitors see an
      error, yet the server's log is empty. Explain why.
    rubric:
      - DNS is the first hop. Without it there's no IP address.
      - With no address there's no connection, so TLS and HTTP never start.
      - The server only answers requests, and none arrives to be logged.
    modelAnswer: >-
      The browser needs an IP address before it can connect, and DNS supplies it. With the
      record gone, the journey stops at the first hop. No connection opens, so no request is
      ever sent. The server is fine and waiting, but nothing reaches it, so it has nothing to log.

recap:
  - "Name the scheme, host, port, path, query and fragment of a URL."
  - "List the hops, DNS, TCP, TLS and HTTP, and watch them with `curl -v`."
  - "Read a failure and say which hop broke: an unknown host, a refused connection or a status."

recall:
  - id: card-url-parts
    concept: backend.url
    front: Name the parts of `https://weather.example:8443/forecast?city=leeds#hourly`, in order.
    back: >-
      Scheme `https`, host `weather.example`, port `8443`, path `/forecast`, query `city=leeds`,
      fragment `hourly`.
  - id: card-fragment
    concept: backend.url
    front: Which part of a URL is never sent to the server?
    back: >-
      The fragment, after `#`. The browser uses it to find a spot on the page.
  - id: card-hops
    concept: backend.request-journey
    front: List the hops from an `https` URL to the response, in order.
    back: >-
      DNS finds the address, TCP connects, TLS encrypts, and HTTP carries the request and
      response.
  - id: card-error-hop
    concept: backend.request-journey
    front: '`Could not resolve host` or `Failed to connect`: which hop failed in each?'
    back: >-
      DNS for `Could not resolve host`. TCP for `Failed to connect`: an address, but nothing
      listening.

references:
