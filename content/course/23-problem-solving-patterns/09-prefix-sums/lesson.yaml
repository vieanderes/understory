id: algo.prefix-sums
title: Prefix sums
objective: Answer any range-sum question in constant time after one pass, and apply many range updates at once with a difference array.
level: essential
minutes: 10
concepts: [algo.prefix-sums, algo.difference-arrays]
prerequisites: [algo.sliding-window]
opening:
  text: >-
    You'll answer "how much between here and there" in constant time, however many times
    you're asked. Range questions come up in dashboards, billing and coding rounds alike.

steps:
  - type: prose
    id: picture-prefix-sums
    body: |-
      A **prefix sum** is a running total kept at every position. For daily steps
      `[3, 1, 4]` it's `[0, 3, 4, 8]`: slot `i` holds the total of the first `i` days.

      Why keep it? The total of any range becomes one subtraction. A hundred thousand
      questions cost a hundred thousand lookups, not a hundred thousand loops.

      Reach for it when a task says: many questions, each about a range, on data that
      doesn't change.

  - type: multiple-choice
    id: spot-prefix-signal
    concept: algo.prefix-sums
    difficulty: 1
    question: Which task wants a prefix sum?
    choices:
      - text: Answer 50,000 "revenue from day a to day b" queries
        correct: true
        feedback: >-
          Yes. Many range questions on fixed data is the signal.
      - text: Find the longest playlist run with no repeated song
        feedback: >-
          That one's a sliding window: the range grows and shrinks as you scan.
      - text: Find two prices that add up to a gift budget
        feedback: >-
          That's a hash map lookup of the complement, not a range total.
      - text: Find the fewest moves between two rooms
        feedback: >-
          Fewest moves on a map is breadth-first search, not a running total.

  - type: prose
    id: name-prefix-sums
    body: |-
      Build it once, with a `0` in front:

      ```js
      const prefix = [0];
      for (const x of steps) prefix.push(prefix[prefix.length - 1] + x);
      const total = prefix[to + 1] - prefix[from]; // from..to, both included
      ```

      The leading `0` means a range that starts at index 0 needs no special case. Building
      costs O(n). Each question then costs O(1).

  - type: ai-review
    id: review-range-from-zero
    concept: algo.prefix-sums
    difficulty: 2
    language: js
    request: Write makeRangeSum(readings), returning a function that sums readings from..to, inclusive.
    flawClass: edge-case
    code: |
      function makeRangeSum(readings) {
        const prefix = [];
        let total = 0;
        for (const reading of readings) {
          total += reading;
          prefix.push(total);
        }
        return (from, to) => prefix[to] - prefix[from - 1];
      }
    prompt: >-
      An assistant wrote this. `sum(1, 3)` gave 6, as expected. Then `sum(0, 2)` returned
      `NaN`. Tap the line at fault.
    lines: [8]
    reasons:
      - text: '`prefix[-1]` is `undefined` when `from` is 0'
        correct: true
        feedback: >-
          Yes. Start the list with `0` and use `prefix[to + 1] - prefix[from]`.
      - text: '`total` should be reset inside the loop'
        feedback: >-
          Resetting would lose the running total. The totals are right; the lookup isn't.
      - text: Arrow functions can't read `prefix` later
        feedback: >-
          They can. The arrow is a closure and keeps `prefix` alive. The index is the problem.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A range that starts at index 0
          correct: true
          feedback: >-
            Yes. Only `from` of 0 reads `prefix[-1]`.
        - text: A range of one reading in the middle
          feedback: >-
            That reads two real slots, so it works. The bug sits at the left edge.
        - text: Readings that include negative numbers
          feedback: >-
            Running totals handle negatives fine. The answer is wrong only when the range
            starts at 0.
    fix: |
      const prefix = [0];
      for (const reading of readings) prefix.push(prefix[prefix.length - 1] + reading);
      return (from, to) => prefix[to + 1] - prefix[from];

  - type: code-challenge
    id: write-range-totals
    concept: algo.prefix-sums
    difficulty: 3
    language: ts
    twin:
      language: python
      starter: ranges.starter.py
      solution: ranges.solution.py
      tests: ranges.tests.py
    prompt: >-
      A fitness dashboard lets people pick any date range and see their total steps.
      Write `rangeTotals(steps, queries)`. Each query is `[from, to]`, both included.
      Return the total for each query, in order.


      `rangeTotals([3, 1, 4, 1, 5], [[1, 3], [0, 4]])` is `[6, 14]`.


      **Target:** O(n + q) time, for up to 100,000 days and 100,000 queries. The tests
      check ranges from day 0, single days, negative values and no queries. The last test
      is the full size: a loop per query runs out of time.
    hints:
      - A loop per query re-adds the same days again and again. What could you add up once?
      - Keep a running total with a `0` in front, so a query from day 0 needs no special case.
      - 'Build `prefix`, then map each `[from, to]` to `prefix[to + 1] - prefix[from]`.'

  - type: code-challenge
    id: write-passing-cars
    concept: algo.prefix-sums
    difficulty: 3
    language: ts
    starter: cars.starter.ts
    solution: cars.solution.ts
    tests: cars.tests.ts
    twin:
      language: python
      starter: cars.starter.py
      solution: cars.solution.py
      tests: cars.tests.py
    prompt: >-
      A classic timed-test task. On a road, `0` is a car going east and `1` a car going
      west. A pair is an east car with a west car somewhere after it. Write
      `passingCars(cars)`: the number of pairs, or `-1` if there are more than
      1,000,000,000.


      `passingCars([0, 1, 0, 1, 1])` is `5`.


      **Target:** O(n) for up to 100,000 cars. The tests include exactly 1,000,000,000
      pairs, one pair more, and a full-size run. A loop per west car runs out of time.
    hints:
      - When you meet a west car, how many pairs does it make?
      - It pairs with every east car before it. That's a prefix count, kept in one variable.
      - 'Keep `east` and `pairs`. On `1`, add `east` to `pairs`, and return `-1` once `pairs > 1_000_000_000`.'

  - type: prose
    id: name-difference-array
    body: |-
      Now flip it round. Each hotel booking adds one room to every night from `first` to
      `last`.

      Don't loop over the nights. Write `+1` at `first` and `-1` at `last + 1`. A running
      total of those marks gives the rooms in use each night. That's a **difference
      array**: each booking costs O(1), and one pass at the end applies them all.

  - type: fill-blank
    id: fill-difference-update
    concept: algo.difference-arrays
    difficulty: 2
    prompt: Add `amount` to every price from `start` to `end`, both included, in one pass.
    language: js
    template: |
      function applyChanges(prices, changes) {
        const diff = new Array(prices.length + 1).fill(0);
        for (const [start, end, amount] of changes) {
          diff[start] += amount;
          diff[{{1}}] -= amount;
        }
        let running = 0;
        return prices.map((price, i) => {
          running {{2}} diff[i];
          return price + running;
        });
      }
    blanks:
      - key: '1'
        answer: end + 1
      - key: '2'
        answer: +=
    bank: [end + 1, end, start - 1, +=, =, -=]

  - type: code-challenge
    id: write-rooms-per-night
    concept: algo.difference-arrays
    difficulty: 4
    language: python
    starter: rooms.starter.py
    solution: rooms.solution.py
    tests: rooms.tests.py
    prompt: >-
      Now in Python. A hotel stores bookings as `(first, last)` night numbers, both
      included, counted from 0. Write `rooms_per_night(nights, bookings)`: a list with the
      rooms in use on each of the `nights` nights.


      `rooms_per_night(4, [(0, 1), (1, 3)])` is `[1, 2, 1, 1]`.


      **Target:** O(n + b) for up to 100,000 nights and 100,000 bookings. The tests include
      a booking on the last night and a full-size run.
    hints:
      - Filling every night of every booking is the slow part. Where does a booking change the count?
      - A booking changes the count twice, at `first` and at `last + 1`. Make the list one longer than `nights`.
      - 'Start with `diff = [0] * (nights + 1)`, mark each booking, then keep a running total over `range(nights)`.'

  - type: explain-back
    id: explain-difference-array
    concept: algo.difference-arrays
    difficulty: 3
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer says: "Talk me through `rooms_per_night` and its cost." What do you
      say?
    rubric:
      - The simple way fills every night of every booking, up to n times b steps.
      - Marking `first` and `last + 1` costs O(1) per booking, whatever its length.
      - One running total turns the marks into counts, so O(n + b) time and O(n) space.
    modelAnswer: >-
      Filling each night of each booking costs up to n times b steps, far too slow at full
      size. Instead I mark each booking twice: plus one where it starts, minus one the night
      after it ends. The list is one longer so the last night has room. One running total
      over the nights then gives every count. That's O(n + b) time and O(n) extra space.

recap:
  - Spot a prefix sum from "many range questions on fixed data".
  - Build one with a leading 0 and answer each range in O(1).
  - Apply many range updates with a difference array and one pass.
recall:
  - id: card-range-formula
    concept: algo.prefix-sums
    front: With `prefix[0] = 0`, what gives the sum from `from` to `to`, inclusive?
    back: >-
      `prefix[to + 1] - prefix[from]`.
  - id: card-leading-zero
    concept: algo.prefix-sums
    front: Why start a prefix sum with a 0?
    back: >-
      So a range that starts at index 0 subtracts 0 instead of reading `prefix[-1]`.
  - id: card-difference-marks
    concept: algo.difference-arrays
    front: How does a difference array record "add 5 to days 2 to 6"?
    back: >-
      `diff[2] += 5` and `diff[7] -= 5`. A running total later spreads it over the days.
  - id: card-when-prefix
    concept: algo.prefix-sums
    front: What sign in a task points at prefix sums?
    back: >-
      Many questions about totals or counts over ranges of one list that doesn't change.

references:
  - kind: docs
    title: Prefix sum
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Prefix_sum
    note: The definition, parallel versions, and uses beyond range sums.
    verified: true

deepDive: >-
  **The follow-up interviewers love.** "Count the subarrays that sum to `k`." A range sums
  to `k` when two prefix sums differ by `k`. So walk once, keep a `Map` from each prefix
  sum to how often you've seen it, and add `seen.get(prefix - k)` at every step. That's
  O(n), and it works with negative numbers, where a sliding window doesn't.


  Watch the totals. A running sum of 100,000 values up to a billion reaches 10^14. That's
  still under 2^53, where JavaScript numbers stop being exact, but a product of two such
  totals isn't. Python integers never overflow, so the question doesn't arise there.


  Prefix sums work for counts too. To answer "how many A, C, G or T in this range", keep
  one prefix array per letter. For a grid, `prefix[r][c]` holds the rectangle above and
  left, and any rectangle's sum is four lookups.


  The difference array is the inverse of the prefix sum. Take differences, and a prefix
  sum gives the values back. That's why marking and then summing works.
