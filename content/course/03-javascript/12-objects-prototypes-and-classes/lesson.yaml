deepDive: >-
  A class can keep data truly private. Name a field with `#`, as in `#songs = []`, and only
  code inside the class body can read it. It isn't a property at all, so `Object.keys` and
  `JSON.stringify` never see it, and `playlist.#songs` outside the class won't even parse.


  Under the syntax, a class is a function: `typeof Song` is `"function"`. Before `class`
  existed, people wrote that function by hand and put methods on its `prototype` themselves.
  `Object.create(proto)` makes an object linked to any object you choose, which is how that
  older code set up chains.


  Writing is not the mirror of reading. `song.title = "Nocturne"` always creates or changes an
  own property on the song, even if the prototype has a `title`. That's why the playlist bug
  needed `push`: it read the shared array and changed it in place.


  `instanceof` walks the chain looking for one particular prototype object. Each window and
  iframe has its own built-ins, so an array from an iframe fails `instanceof Array`. Use
  `Array.isArray` for arrays.
