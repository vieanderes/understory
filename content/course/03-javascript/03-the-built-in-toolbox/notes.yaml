summary: >-
  Most everyday JavaScript isn't clever algorithms. It's tidying text, reading numbers out
  of it, counting, looking things up and turning data into text and back. The language ships
  a toolbox for each job: string methods, `Number` and `Math`, `Object.keys` and friends,
  `Set` and `Map`, and `JSON`. Knowing them well means shorter code and fewer hand-written
  loops with bugs in them.


  Each tool also has a sharp edge worth knowing before it cuts you. Strings never change in
  place, so a method call on its own line does nothing. Numbers are 64-bit floating point, so
  `0.1 + 0.2` isn't exactly `0.3`, and money is safest in whole pence. `parseInt` forgives
  junk that `Number` rejects. A plain object is a poor dictionary compared with a `Map`. And
  `JSON` quietly drops or changes values it can't represent.


  These edges are exactly what interviews probe: floating-point precision, `Map` versus
  object, deep copies, removing duplicates. The sections below go under each tool, with
  examples you can run.
remember:
  - Strings are immutable; every string method returns a new string and leaves the original alone.
  - Numbers are IEEE 754 doubles, so `0.1 + 0.2` is `0.30000000000000004`; keep money in integer minor units and format only for display.
  - Integers are exact only up to `Number.MAX_SAFE_INTEGER`, which is `2 ** 53 - 1`; beyond it use `BigInt` or keep large IDs as strings.
  - '`Number` converts the whole string or gives `NaN`, while `parseInt` and `parseFloat` read a leading number and ignore the rest.'
  - '`toFixed` returns a string and rounds the stored binary value, so `(1.005).toFixed(2)` is `"1.00"`.'
  - Use a `Map` for a dictionary with arbitrary or user-supplied keys, and a `Set` to deduplicate with `[...new Set(list)]`.
  - '`JSON.stringify` drops `undefined` and functions, turns `NaN` into `null` and dates into strings, and throws on `BigInt` and circular references.'
  - '`structuredClone` makes a real deep copy of dates, maps and sets; a JSON round trip does not.'
sections:
  - title: Why 0.1 + 0.2 isn't 0.3
    body: |-
      Every JavaScript number is a 64-bit binary floating-point value, the IEEE 754
      **double**. Binary fractions can represent halves, quarters and eighths exactly, but not
      tenths, in the same way decimal can't write one third exactly. So `0.1` is stored as the
      nearest double, a hair above 0.1, and small errors show up when you add.

      ```js
      console.log(0.1 + 0.2); // 0.30000000000000004
      console.log(0.1 + 0.2 === 0.3); // false
      console.log(Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON); // true
      console.log(1.005 * 100); // 100.49999999999999
      console.log((1.005).toFixed(2)); // 1.00

      console.log(Number.MAX_SAFE_INTEGER); // 9007199254740991
      console.log(2 ** 53 + 1 === 2 ** 53); // true
      console.log(2n ** 53n + 1n); // 9007199254740993n
      ```

      Three consequences for real code:

      - **Money.** Store and add prices in whole pence or cents, as the receipt challenge does.
        Integer arithmetic below 2⁵³ is exact. Divide by 100 only when you display.
      - **Comparing.** Never compare computed decimals with `===`. Compare with a tolerance, or
        round to the precision you care about first. `Number.EPSILON` suits values near 1;
        larger values need a larger tolerance.
      - **Large IDs.** A 64-bit database ID above 2⁵³ loses digits when it becomes a number,
        which happens silently in `JSON.parse`. APIs send such IDs as strings for this reason.
        `BigInt` handles exact large integers, but it can't mix with numbers in arithmetic and
        `JSON` can't serialise it.

      For display, `Intl.NumberFormat` handles currency symbols, separators and rounding for a
      locale: `new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" }).format(4.5)`
      gives `"£4.50"`.
  - title: Strings are immutable, and what that means
    body: |-
      A string value can never change. Methods like `trim`, `toUpperCase` and `replace` build a
      new string and return it. Assigning to an index does nothing, and in strict mode, which
      modules and classes use, it throws.

      ```js
      "use strict";
      const code = "tea";
      code.toUpperCase(); // result thrown away
      console.log(code); // tea

      const shout = code.toUpperCase();
      console.log(shout); // TEA

      try {
        code[0] = "p";
      } catch (error) {
        console.log(error.name); // TypeError
      }

      console.log("a-b-c".replace("-", "+")); // a+b-c, first match only
      console.log("a-b-c".replaceAll("-", "+")); // a+b+c
      console.log("booking".at(-1)); // g
      ```

      Immutability makes strings safe to share: no function you pass a string to can change
      yours. The cost is that building a long string piece by piece creates many
      intermediate strings. Engines optimise `+=` well, so for most code it doesn't matter;
      collecting parts in an array and calling `join` once is the readable choice when you
      build output in a loop.

      One more edge: `length` counts UTF-16 code units, not characters as a person sees them.
      Characters outside the basic range take two units, and an accented letter can be one
      character or a letter plus a combining mark.

      ```js
      console.log("\u{1F600}".length); // 2
      console.log([..."\u{1F600}"].length); // 1, spread splits by code point
      console.log("e\u0301".length); // 2, e plus a combining accent
      console.log("e\u0301".normalize("NFC").length); // 1
      ```

      Limit user names by code points or with `Intl.Segmenter`, and normalise before comparing
      text that users typed.
  - title: Map, Set and when a plain object is the wrong tool
    body: |-
      A plain object works as a small dictionary, but it has quirks a `Map` doesn't:

      ```js
      const byId = {};
      byId[1] = "tea";
      byId["1"] = "cake";
      console.log(Object.keys(byId)); // [ '1' ], keys become strings

      const a = {};
      const b = {};
      byId[a] = "first";
      byId[b] = "second";
      console.log(byId["[object Object]"]); // second, both objects became the same key

      console.log("toString" in {}); // true, inherited from Object.prototype

      const stock = new Map();
      stock.set(1, "tea").set("1", "cake").set(a, "first").set(b, "second");
      console.log(stock.size); // 4
      console.log(stock.get(1), stock.get("1"), stock.get(a)); // tea cake first
      ```

      Choose a `Map` when keys are not fixed field names: IDs, user input, objects, or when
      you add and remove entries often. It keeps insertion order, reports `size` directly, has
      no inherited keys, and iterates with `for (const [key, value] of map)`. Choose a plain
      object for records with known fields, such as `{ name, price }`, and for anything you
      send as JSON, because `JSON.stringify(new Map())` gives `"{}"`. Convert when you need to:
      `Object.fromEntries(map)` and `new Map(Object.entries(obj))`.

      A `Set` holds unique values, compared like `===` except that `NaN` matches `NaN`. Objects
      are compared by reference, so two equal-looking objects are two members. `has` is fast
      on average, unlike `array.includes`, which scans. Node 24 and current browsers also have
      set algebra built in:

      ```js
      const booked = new Set(["Mon", "Tue", "Fri"]);
      const open = new Set(["Tue", "Wed", "Fri"]);
      console.log(booked.intersection(open)); // Set(2) { 'Tue', 'Fri' }
      console.log(open.difference(booked)); // Set(1) { 'Wed' }
      console.log([...new Set(["a", "b", "a"])]); // [ 'a', 'b' ]
      ```
  - title: What JSON keeps, changes and refuses
    body: |-
      JSON has strings, numbers, booleans, `null`, arrays and objects, nothing else.
      `JSON.stringify` maps every other JavaScript value onto that set, and not always the way
      you'd hope:

      ```js
      const order = {
        id: 7,
        note: undefined,
        total: NaN,
        onSave() {},
        tags: [undefined, "gift"],
        placedAt: new Date(0),
      };
      console.log(JSON.stringify(order));
      // {"id":7,"total":null,"tags":[null,"gift"],"placedAt":"1970-01-01T00:00:00.000Z"}

      const back = JSON.parse(JSON.stringify(order));
      console.log(typeof back.placedAt); // string, not a Date

      try {
        JSON.stringify({ big: 1n });
      } catch (error) {
        console.log(error.message); // Do not know how to serialize a BigInt
      }

      try {
        JSON.parse("{'id': 7}");
      } catch (error) {
        console.log(error.name); // SyntaxError
      }

      console.log(JSON.stringify({ id: 7, tags: ["gift"] }, null, 2));
      // {
      //   "id": 7,
      //   "tags": [
      //     "gift"
      //   ]
      // }
      ```

      The rules: `undefined` and functions vanish from objects and become `null` in arrays.
      `NaN` and `Infinity` become `null`. A `Date` becomes its ISO string through its `toJSON`
      method. A `Map` or `Set` becomes `{}`. `BigInt` and circular references throw a
      `TypeError`. Parsing is strict: double quotes only, no trailing commas, no comments.

      Two habits follow. Wrap `JSON.parse` of anything from outside, a server, `localStorage`,
      an AI model's reply, in `try...catch`, then validate the shape before trusting it. And
      don't use `JSON.parse(JSON.stringify(x))` as a deep copy. `structuredClone(x)` copies
      dates, maps, sets and nested objects correctly, though it throws on functions.
pitfalls:
  - '**Calling a string method and ignoring the result.** `name.trim();` on its own line changes nothing. Assign it: `name = name.trim()`, or use the returned value directly.'
  - '**Adding money as decimals.** `0.1 + 0.2` drifts, and rounding at the end with `toFixed` can round the wrong way. Keep integer pence and format once with `toFixed(2)` or `Intl.NumberFormat`.'
  - '**Doing arithmetic on `toFixed` output.** It returns a string, so `price.toFixed(2) + 1` joins text. Round for display only, at the last step.'
  - '**`parseInt` on user input.** It accepts `"12abc"` as 12 and `"1e3"` as 1. Use `Number` plus a `Number.isFinite` check when junk should be refused.'
  - '**Using an object as a map with outside keys.** Keys turn into strings, object keys collide as `"[object Object]"`, and names such as `"constructor"` are already there. Use a `Map`.'
  - '**Trusting `JSON.parse`.** It throws on bad text and returns any shape at all on good text. Catch the error and validate the fields before use.'
interview:
  - question: Why does 0.1 + 0.2 not equal 0.3 in JavaScript, and how do you deal with it?
    answer: >-
      Because JavaScript numbers are IEEE 754 binary doubles, and 0.1 and 0.2 have no exact
      binary representation, so each is stored as the nearest double and the tiny errors show
      in the sum: `0.30000000000000004`. It isn't a JavaScript bug; every language using
      doubles does the same. For money I avoid the problem by storing integer minor units,
      pence or cents, and formatting at the edge with `Intl.NumberFormat`. For measurements I
      compare with a tolerance rather than `===`. When exact decimals are a business
      requirement, such as tax rules, I use a decimal library or do the arithmetic in the
      database with a decimal column type.
  - question: When would you use a Map instead of a plain object?
    answer: >-
      When the keys are data rather than field names. A `Map` accepts keys of any type,
      including objects, without converting them to strings. It has no inherited keys, so
      user-supplied names like `"constructor"` can't clash. It keeps insertion order, gives
      `size` directly, and is designed for frequent additions and deletions. A plain object
      is better for a record with known fields, for destructuring, and for anything that goes
      over the wire, because `JSON.stringify` turns a `Map` into `{}`. My rule: object for
      "a thing with properties", `Map` for "a lookup from keys to values", converting with
      `Object.fromEntries` at the JSON boundary.
  - question: How do you remove duplicates from an array?
    answer: >-
      For primitives, `[...new Set(list)]`. A `Set` keeps each value once, compared like
      `===` except that `NaN` equals `NaN`, it preserves first-seen order, and spreading turns
      it back into an array. It's O(n), whereas `filter` with `indexOf` is O(n²). The catch is
      objects: two objects with the same fields are different references, so a `Set` keeps
      both. For those I dedupe by a key, for example building a `Map` from `id` to item and
      taking its values, which keeps the last item per id, or checking a `Set` of seen ids in
      a `filter` to keep the first.
  - question: What's the difference between a JSON round trip and structuredClone for copying?
    answer: >-
      Both make a deep copy, but `JSON.parse(JSON.stringify(x))` is lossy and
      `structuredClone(x)` isn't for ordinary data. The JSON route turns dates into strings,
      drops `undefined` and functions, turns `NaN` into `null`, empties maps and sets, and
      throws on circular references and `BigInt`. `structuredClone`, available in browsers and
      Node, keeps dates, maps, sets, typed arrays and circular references. Neither copies
      functions or class prototypes: `structuredClone` throws on a function, and a class
      instance comes back as a plain object. For data from the network the JSON round trip
      is fine; for in-memory state I use `structuredClone`, or better, update immutably so a
      deep copy isn't needed.
  - question: Strings are immutable in JavaScript. What does that mean in practice?
    answer: >-
      It means no operation changes an existing string value; methods return new strings. So
      `name.toUpperCase()` on its own line has no effect, and assigning `name[0] = "X"` is
      silently ignored in sloppy mode and throws a TypeError in strict mode. The benefit is
      safety: passing a string to a function can't change your copy, and strings can be used
      freely as `Map` keys. The cost is that repeated concatenation creates intermediate
      strings. Modern engines optimise `+=`, so I only reach for an array and `join` when
      building large output in a loop, mainly for readability.
terms:
  - term: "`0.1 + 0.2`"
    say: A JavaScript bug.
    means: Numbers are IEEE 754 doubles and 0.1 has no exact binary form, so the sum is
      `0.30000000000000004` in every language that uses doubles. Keep money in whole pence.
  - term: Immutable string
    say: You can't edit text in JavaScript.
    means: No method changes a string in place; each returns a new one. `name.trim()` on its own line
      does nothing unless you keep the result.
  - term: "`Number` and `parseInt`"
    say: Two ways to turn a string into a number.
    means: "`Number` converts the whole string or gives `NaN`; `parseInt` reads a leading number and
      ignores the rest, so `parseInt('12px')` is `12`."
  - term: "`toFixed`"
    say: It rounds a number.
    means: It returns a *string* and rounds the stored binary value, so `(1.005).toFixed(2)` is
      `'1.00'`. Use it for display only.
  - term: "`Map` and object"
    say: An object is a dictionary.
    means: A plain object has only string or symbol keys and inherits names like `constructor`. A `Map`
      takes keys of any type, keeps insertion order and has a `size`.
  - term: "`JSON.stringify`"
    say: It turns any object into JSON.
    means: It drops `undefined` and functions, turns `NaN` into `null` and dates into strings, and
      throws on `BigInt` and circular references.
