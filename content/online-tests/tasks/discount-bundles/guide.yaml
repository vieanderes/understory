approach: >-
  Order does not matter for a pair, so sort the prices. Put one pointer on the cheapest item
  and one on the dearest. If the two fit under K, the cheapest item fits with every item up
  to the dearest one, so add all those pairs at once and move the left pointer in.
  Otherwise the dearest item is too dear for anything left, so move the right pointer in.
complexity: O(N log N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Read the bottom first. **N up to 100,000** means about five billion pairs, so checking
      every pair times out. **Efficient** here means sorting, O(N log N).

      Two more hints hide there: prices can be negative, and the count can pass
      2,147,483,647.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in your own words. "Pairs of different items" matters: an item never bundles
      with itself.
    code:
      ts: |-
        // Count the pairs of different items whose prices add up to at most K.
      python: |-
        # Count the pairs of different items whose prices add up to at most K.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - one item, which makes no bundle;
      - two equal items that fit exactly at K;
      - negative prices and a negative K;
      - duplicates on both sides of the limit.

      Put them in test-input.txt now.
    input:
      - "([1], 100)"
      - "([2, 2], 4)"
      - "([-5, -1, 2, -3], -4)"
      - "([1, 1, 4, 4, 4], 5)"
  - kind: write
    title: Bank a correct version first
    minutes: 3
    body: |-
      Type the direct version: every pair, count the ones that fit. It is O(N²) and will
      fail the performance tests. It passes correctness now and gives you a reference to
      compare the fast version with.
    code:
      ts: |-
        // Count the pairs of different items whose prices add up to at most K.
        // First pass: every pair, O(N²).
        function solution(A: number[], K: number): number {
            let count = 0;
            for (let p = 0; p < A.length; p++) {
                for (let q = p + 1; q < A.length; q++) {
                    if (A[p] + A[q] <= K) count++;
                }
            }
            return count;
        }
      python: |-
        # Count the pairs of different items whose prices add up to at most K.
        # First pass: every pair, O(N²).
        def solution(A, K):
            count = 0
            for p in range(len(A)):
                for q in range(p + 1, len(A)):
                    if A[p] + A[q] <= K:
                        count += 1
            return count
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check each of your cases against the
      rule.
    expect: >-
      Two OKs, then 0 for one item, 1 for the equal pair, 3 for the negative case and 7 for
      the duplicates.
  - kind: plan
    title: Sort, then close in from both ends
    minutes: 3
    body: |-
      After sorting, look at the cheapest and the dearest. If they fit, the cheapest also
      fits with everything between them: that is `right - left` pairs in one go. If they do
      not fit, the dearest fits with nothing left, so drop it.

      Each step moves one pointer, so the walk is O(N). The sort dominates.
  - kind: ask-ai
    title: Check two language facts, not the algorithm
    minutes: 1
    body: |-
      The count can pass the 32-bit limit and the sort must be numeric. Both are language
      questions, so they are fair to ask. Neither gives away the approach.
    prompt: >-
      One line each: in JavaScript, is a count above 2147483647 still exact in a normal
      number, and does Array.prototype.sort() with no compare function sort numbers
      numerically?
    expect: >-
      Numbers are exact up to 2^53, so the count is safe. The default sort compares strings,
      so pass (a, b) => a - b or sort a Float64Array.
  - kind: optimise
    title: Write the two-pointer walk yourself
    minutes: 5
    body: |-
      This is the heart of the task, so type it. The loop runs while `left < right`, which
      keeps an item from pairing with itself.
    code:
      ts: |-
        // Count the pairs of different items whose prices add up to at most K.
        // Sort, then walk two pointers in from both ends. When the cheapest and dearest fit,
        // the cheapest fits with everything between them too: O(N log N) time, O(N) space.
        function solution(A: number[], K: number): number {
          const prices = Float64Array.from(A).sort();
          let left = 0;
          let right = prices.length - 1;
          let count = 0;
          while (left < right) {
            if (prices[left]! + prices[right]! <= K) {
              count += right - left;
              left += 1;
            } else {
              right -= 1;
            }
          }
          return count;
        }
      python: |-
        # Count the pairs of different items whose prices add up to at most K.
        # Sort, then walk two pointers in from both ends. When the cheapest and dearest fit,
        # the cheapest fits with everything between them too: O(N log N) time, O(N) space.
        def solution(A, K):
            prices = sorted(A)
            left, right = 0, len(prices) - 1
            count = 0
            while left < right:
                if prices[left] + prices[right] <= K:
                    count += right - left
                    left += 1
                else:
                    right -= 1
            return count
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Ask for inputs only. Run them with the fast version, then paste the slow version back
      in a scratch tab and compare: the two must agree.
    prompt: >-
      Give me 5 test inputs for solution(A, K), one per line, in the format ([4, 1, 7], 6).
      Cover descending prices, all equal prices, values near 1000000000 and -1000000000, a K
      no pair reaches and a K every pair reaches. Inputs only, no answers and no code.
    expect: Five lines to paste into test-input.txt, with the same results from both versions.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The sort and the size of the count are the usual
      suspects.
    prompt: >-
      Review my current solution for correctness with negative prices, numeric sorting,
      overflow of the count and time complexity. List any problems in one line each. Do not
      rewrite the code.
    expect: No problems, and the assistant confirms O(N log N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the slow version and any debug output. Check the header comment states
      O(N log N). Then submit.
