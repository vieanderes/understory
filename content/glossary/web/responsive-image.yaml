term: responsive image
aka: [srcset]
short: One picture offered in several file sizes, so the browser downloads the one that fits the screen.
explain: |
  A photo sized for a large monitor is wasteful on a phone over mobile data. With `srcset`
  you list the same image at several widths, and with `sizes` you say how wide it will
  show. The browser picks the smallest file that still looks sharp.

  Always give `width` and `height` too. The browser then saves the right space before the
  file arrives, so the text below doesn't jump.
analogy: A shoe shop that brings out your size. Same shoe, but nobody hands you the biggest box to be safe.
example:
  language: html
  code: |
    <img
      src="cake-800.jpg"
      srcset="cake-400.jpg 400w, cake-800.jpg 800w, cake-1600.jpg 1600w"
      sizes="(min-width: 60rem) 50vw, 100vw"
      width="800" height="600"
      alt="A slice of lemon cake">
usage: The top photo is a 4 MB file on phones, so make it a responsive image with three widths.
related: [responsive-design, alt-text, media-query, lazy-loading]
level: 2
lessons: [html.media-and-head]
