term: result type
aka: [result value, Either type, errors as values]
short: A return value that holds either a success or an expected failure, so the caller must check.
explain: |
  Throwing suits the unexpected: a bug, a lost connection. For failures that are part of
  normal life, like "card declined", a returned value is clearer. It says `{ ok: true,
  value }` or `{ ok: false, error }`.

  The type system then makes callers handle both cases. Nothing can be forgotten the way
  an uncaught exception can. Use it for expected outcomes, and keep throwing for the rest.
analogy: A parcel tracker that says either "delivered" or "returned to sender", never silence.
example:
  language: ts
  code: |
    type Result<T, E> = { ok: true; value: T } | { ok: false; error: E };
    const r = parseDate(input);
    if (!r.ok) return showError(r.error);
usage: Return a result type from the payment call; a declined card isn't exceptional.
twin:
  term: exception
  difference: An exception jumps out of the normal flow and anyone may forget to catch it. A result type is an ordinary return value the caller has to inspect.
related: [exception, discriminated-union, fail-fast]
level: 2
lessons: [clean.errors]
