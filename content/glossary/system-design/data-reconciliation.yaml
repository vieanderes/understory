term: data reconciliation
aka: [reconciliation job, drift repair, reconcile]
short: Comparing your copy of some data with the source on a schedule and repairing any differences.
explain: |
  Webhooks get lost, a sync crashes halfway, someone edits a row by hand. Over time your
  copy drifts from the truth, and nothing tells you.

  A regular job compares the two, often by fetching recent records or hashes, and fixes
  what differs. It is the safety net under fast but unreliable paths. Count what it
  repairs: a sudden jump means something upstream is broken.
analogy: Checking your bank statement against your own records at the end of the month.
usage: Webhooks cover ninety-nine percent; the hourly data reconciliation catches the rest.
related: [webhook, polling, full-sync, eventual-consistency]
level: 2
lessons: [integrations.webhooks-and-polling]
