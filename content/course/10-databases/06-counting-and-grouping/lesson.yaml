id: db.grouping
title: Counting and grouping
objective: "Summarise rows with `count`, `GROUP BY` and `HAVING`, and know the order a query runs in."
level: essential
minutes: 10
concepts: [db.aggregation, db.select-pipeline]
prerequisites: [db.sql-queries]
opening:
  text: >-
    You'll turn a pile of rows into the numbers a dashboard shows, and let the database do the
    counting. You'll also catch two dashboards that confidently show the wrong number.

steps:
  - type: prose
    id: what-aggregates-do
    body: >-
      A support team wants a number on the wall: how many tickets are open? An **aggregate**
      collapses many rows into one value:


      ```sql

      SELECT count(*) AS open_tickets FROM tickets WHERE closed_at IS NULL;

      ```


      `count(*)` counts rows. Its friends are `sum`, `min`, `max` and `avg`. `WHERE` runs
      first, so only open tickets are counted. You never add anything up yourself.

  - type: sql
    id: count-high-priority
    concept: db.aggregation
    difficulty: 1
    prompt: >-
      How many open tickets are high priority? Count them, and call the column `urgent_open`.
    setup: &tickets |
      CREATE TABLE tickets (
        id integer PRIMARY KEY,
        subject text NOT NULL,
        agent text,
        priority text NOT NULL,
        closed_at timestamptz
      );
      INSERT INTO tickets VALUES
        (1, 'Refund not received', 'mia', 'high', '2026-09-20 10:00+00'),
        (2, 'Change delivery address', 'mia', 'low', NULL),
        (3, 'Card declined', 'mia', 'high', NULL),
        (4, 'Wrong size sent', 'tom', 'low', '2026-09-21 15:30+00'),
        (5, 'Invoice copy', 'tom', 'normal', NULL),
        (6, 'Account locked', 'raj', 'high', NULL),
        (7, 'Parcel missing', 'raj', 'high', NULL),
        (8, 'Too many newsletters', 'raj', 'low', NULL),
        (9, 'Question about returns', NULL, 'normal', NULL);
    starter: |
      SELECT * FROM tickets WHERE closed_at IS NULL;
    solution: |
      SELECT count(*) AS urgent_open FROM tickets
      WHERE closed_at IS NULL AND priority = 'high';
    checks:
      ordered: false
    showSchema: true
    hints:
      - Swap `*` for `count(*) AS urgent_open`.
      - Add the priority test to the `WHERE` with `AND`.

  - type: prose
    id: count-star-or-column
    body: >-
      `count` has two forms, and they differ in one way:


      ```sql

      SELECT count(*), count(agent) FROM tickets;

      ```


      `count(*)` counts rows. `count(agent)` counts rows where `agent` isn't NULL, so the
      unassigned ticket is skipped. Put a column inside only when "has a value" is what you mean.

  - type: ai-review
    id: review-count-closed-at
    concept: db.aggregation
    difficulty: 2
    language: sql
    request: Add an "open tickets" tile to the support dashboard.
    flawClass: logic
    code: |
      SELECT count(closed_at) AS open_tickets
      FROM tickets;
    prompt: >-
      An assistant wrote this. The tile shows 2 while the queue is full of open tickets. Tap
      the line at fault.
    lines: [1]
    reasons:
      - text: It counts the tickets that have a closing time
        correct: true
        feedback: >-
          Right. `count(closed_at)` skips NULLs, so it counts closed tickets.
      - text: '`count` can''t take a column name'
        feedback: >-
          It can. `count(column)` is valid; it counts the non-NULL values, which is the bug.
      - text: The alias `open_tickets` changes the result
        feedback: >-
          An alias only names the column. The counting is what's wrong.
    fix: |
      SELECT count(*) AS open_tickets
      FROM tickets
      WHERE closed_at IS NULL;

  - type: prose
    id: group-by
    body: >-
      One number for the whole team is a start. One per agent is more useful. `GROUP BY` makes a
      group for each distinct value and runs the aggregate once per group:


      ```sql

      SELECT agent, count(*) FROM tickets GROUP BY agent;

      ```


      Every column you select must be grouped or inside an aggregate. Forget, and Postgres
      says `column "tickets.agent" must appear in the GROUP BY clause`.

  - type: sql
    id: open-per-agent
    concept: db.aggregation
    difficulty: 2
    prompt: >-
      Show each agent with their number of open tickets, as columns `agent` and `open_tickets`.
      Notice the row for tickets nobody has taken.
    setup: *tickets
    starter: |
      SELECT agent FROM tickets WHERE closed_at IS NULL;
    solution: |
      SELECT agent, count(*) AS open_tickets
      FROM tickets
      WHERE closed_at IS NULL
      GROUP BY agent;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Add `count(*) AS open_tickets` to the columns.
      - '`GROUP BY agent` goes after the `WHERE`.'

  - type: prose
    id: the-run-order
    body: >-
      You write `SELECT` first, but Postgres runs a query in this order:


      ```text

      FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY

      ```


      So `WHERE` runs before any group exists, and can't test a count. **HAVING** filters
      groups after they're counted. It also explains why `WHERE` can't use a name you made with
      `AS`: `SELECT` hasn't run yet.

  - type: sql
    id: busy-agents
    concept: db.select-pipeline
    difficulty: 3
    prompt: >-
      Which agents have more than two open tickets? Run the starter and read the error. Then
      move the count test to where groups are filtered.
    setup: *tickets
    starter: |
      SELECT agent, count(*) AS open_tickets
      FROM tickets
      WHERE closed_at IS NULL AND count(*) > 2
      GROUP BY agent;
    solution: |
      SELECT agent, count(*) AS open_tickets
      FROM tickets
      WHERE closed_at IS NULL
      GROUP BY agent
      HAVING count(*) > 2;
    checks:
      ordered: false
    showSchema: true
    hints:
      - The error says aggregates aren't allowed in `WHERE`, because groups don't exist yet.
      - Keep `closed_at IS NULL` in the `WHERE`. The count test goes in a `HAVING` after `GROUP BY`.

  - type: ai-review
    id: review-revenue-doubled
    concept: db.aggregation
    difficulty: 4
    language: sql
    request: Total revenue from paid orders, for the finance report.
    flawClass: logic
    code: |
      SELECT sum(orders.total_pence) AS revenue_pence
      FROM orders
      JOIN order_lines ON order_lines.order_id = orders.id
      WHERE orders.paid = true;
    prompt: >-
      An assistant wrote this. Finance says the number is far too high, and bigger baskets
      make it worse. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The join repeats each order once per line
        correct: true
        feedback: >-
          Right. An order with three lines is summed three times. Drop the join.
      - text: '`sum` should be `count`'
        feedback: >-
          Revenue is a total of money, so `sum` fits. It's adding the same order several times.
      - text: '`paid = true` should be `paid IS true`'
        feedback: >-
          Both work for a `NOT NULL` boolean. The repeats come from somewhere else.
    fix: |
      SELECT sum(total_pence) AS revenue_pence
      FROM orders
      WHERE paid = true;

  - type: explain-back
    id: explain-where-or-having
    concept: db.select-pipeline
    difficulty: 3
    prompt: >-
      A teammate asks why `WHERE count(*) > 5` fails but `HAVING count(*) > 5` works. Explain it
      using the order a query runs in.
    rubric:
      - Postgres runs `WHERE` before `GROUP BY`, so no groups or counts exist yet.
      - '`HAVING` runs after the groups are made and counted.'
      - So row tests go in `WHERE`, and tests on a group's aggregate go in `HAVING`.
    modelAnswer: >-
      The order you write isn't the order it runs. Postgres does `FROM`, then `WHERE`, then
      `GROUP BY`, then `HAVING`, and only then `SELECT`. When `WHERE` runs, rows haven't been
      grouped, so there's no count to test. `HAVING` runs after grouping, so it can. Tests on
      single rows go in `WHERE`; tests on counts or sums go in `HAVING`.

recap:
  - Let the database count and total with `count(*)`, `sum`, `min` and `max`.
  - Group with `GROUP BY`, and filter groups with `HAVING`, not `WHERE`.
  - Use `count(*)` for rows, and never sum across a join that repeats rows.

recall:
  - id: card-count-forms
    concept: db.aggregation
    front: How do `count(*)` and `count(agent)` differ?
    back: "`count(*)` counts rows. `count(agent)` counts only the rows where `agent` isn't NULL."
  - id: card-group-rule
    concept: db.aggregation
    front: In a `GROUP BY` query, which columns may appear in `SELECT`?
    back: The grouped columns, and anything inside an aggregate such as `count` or `max`.
  - id: card-run-order
    concept: db.select-pipeline
    front: In what order does Postgres run the parts of a query?
    back: "`FROM`, `WHERE`, `GROUP BY`, `HAVING`, `SELECT`, `ORDER BY`."
  - id: card-sum-over-join
    concept: db.aggregation
    front: Why is `sum(orders.total)` wrong after joining `order_lines`?
    back: The join repeats each order once per line, so each total is added several times.

