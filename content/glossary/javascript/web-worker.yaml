term: Web Worker
aka: [worker_threads, dedicated worker]
short: A second JavaScript thread on another core, which talks to the main one only by sending messages.
explain: |
  JavaScript runs your code on one main thread. A heavy calculation there freezes the page,
  or stalls every other request on a Node server, until it ends.

  So move it to a separate thread with its own event loop and memory. Nothing is shared by
  default. Messages are copied, so functions can't cross, and a large buffer can be
  transferred instead of copied. Keep a small pool, about one per core, rather than starting
  one per job. Workers help CPU-heavy work; database calls and fetches already overlap
  without them.
analogy: Handing the ironing to someone in the next room. You keep answering the door, and they pass the shirts back when done.
example:
  language: js
  code: |
    const worker = new Worker(new URL('./resize.js', import.meta.url), { type: 'module' });
    worker.postMessage({ pixels }, [pixels.buffer]);
    worker.onmessage = (event) => showImage(event.data);
    worker.onerror = (event) => showError(event.message);
usage: The image resize freezes the page for two seconds; move it to a Web Worker.
related: [main-thread, thread, cpu-bound, event-loop, service-worker]
level: 2
lessons: [scale.web-workers]
