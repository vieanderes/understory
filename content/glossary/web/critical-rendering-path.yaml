term: critical rendering path
aka: [ CRP ]
short: The steps a browser must finish before it can paint the first pixels of a page.
explain: |
  The browser can't paint the moment the first byte arrives. It needs the HTML so far and
  every stylesheet, then works out styles and layout, then paints.

  Anything on this path delays the first frame. That means each stylesheet, and any plain
  script in the head. Make it short. Inline the little CSS the first screen needs, `defer`
  scripts, and fetch the main image early.
analogy: Getting ready to leave the house. Shoes and keys are on the path; reading the post isn't.
example:
  language: html
  code: |
    <head>
      <link rel="stylesheet" href="/app.css">   <!-- on the path -->
      <script src="/app.js" defer></script>     <!-- off the path -->
    </head>
usage: The font stylesheet from another domain sits on the critical rendering path and costs us 400 ms.
related: [ render-blocking, first-contentful-paint, largest-contentful-paint, preload ]
level: 3
lessons: [ perf.critical-rendering-path ]
