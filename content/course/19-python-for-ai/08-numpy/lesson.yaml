id: pyai.numpy
title: NumPy
objective: "Work with arrays of numbers, replace loops with whole-array operations, and combine arrays of different shapes."
level: advanced
minutes: 10
concepts: [pyai.ndarrays, pyai.vectorisation, pyai.broadcasting]
prerequisites: [pyai.fastapi]
opening:
  text: >-
    You'll summarise a million eval scores in a millisecond, and catch shape bugs that give
    wrong numbers. Chapter 20 stores meaning in arrays like these.

steps:
  - type: prose
    id: arrays
    body: |-
      A Python list of numbers is slow for millions of them. **NumPy** stores numbers of
      one type side by side in an **array**, and runs whole-array work in fast compiled
      code:

      ```python
      import numpy as np

      scores = np.array([0.8, 0.4, 0.9, 0.7])
      print(scores.mean())    # 0.7
      print(scores >= 0.7)    # [ True False  True  True]
      ```

      Maths and comparisons apply to every item at once. No loop.

  - type: code-challenge
    id: write-pass-rate
    concept: pyai.ndarrays
    difficulty: 1
    language: python
    starter: rate.starter.py
    solution: rate.solution.py
    tests: rate.tests.py
    packages: [numpy]
    prompt: >-
      Write `pass_rate(scores, threshold)`. Return the share of scores at or above
      `threshold`, as a `float`. Use no loop.


      `True` counts as 1 in a mean, as in Python. Example: `[0.8, 0.4, 0.9, 0.7]` at `0.7`
      gives `0.75`.
    hints:
      - A comparison with the whole array gives one `True` or `False` per score.
      - The mean of those is the share that passed.
      - '`float((scores >= threshold).mean())`, with the brackets around the comparison.'

  - type: prose
    id: vectorisation
    body: >-
      Replacing a Python loop with one array operation is called **vectorisation**. On
      five million scores, a `for` loop that adds them up took about a second.
      `scores.mean()` took about two milliseconds.


      The loop runs Python code five million times. The array method runs one compiled loop.

  - type: ai-review
    id: review-python-loop
    concept: pyai.vectorisation
    difficulty: 2
    language: python
    request: Write a function that returns the mean of an array of eval scores.
    flawClass: performance
    code: |
      import numpy as np

      def mean_score(scores: np.ndarray) -> float:
          total = 0.0
          for s in scores:
              total += s
          return total / len(scores)
    prompt: >-
      An assistant wrote this. It's correct, and the test with ten scores passed. The
      nightly eval with five million scores crawls. Tap the first line to change.
    lines: [5]
    reasons:
      - text: A Python loop runs once per score
        correct: true
        feedback: >-
          Yes. `scores.mean()` does the same in one compiled loop.
      - text: '`total = 0.0` should be `0`'
        feedback: >-
          Either start works. The cost is the five million turns of the loop.
      - text: '`len(scores)` is slow on arrays'
        feedback: >-
          An array knows its length at once. The loop is the slow part.
    fix: |
      import numpy as np

      def mean_score(scores: np.ndarray) -> float:
          return float(scores.mean())

  - type: prose
    id: shape-and-axis
    body: |-
      An array can have rows and columns. Say four answers were each graded by three
      judges:

      ```python
      grades = np.array([[4, 5, 3], [2, 2, 3], [5, 4, 4], [1, 2, 1]])
      print(grades.shape)          # (4, 3): 4 rows, 3 columns
      print(grades.mean(axis=1))   # one mean per row, per answer
      print(grades.mean(axis=0))   # one mean per column, per judge
      ```

      `axis` names the direction that gets squashed. `axis=1` squashes the columns,
      leaving one number per row.

  - type: bug-hunt
    id: hunt-wrong-axis
    concept: pyai.ndarrays
    difficulty: 3
    language: python
    code: |
      answer_ids = ["a1", "a2", "a3", "a4"]
      grades = np.array([[4, 5, 3], [2, 2, 3], [5, 4, 4], [1, 2, 1]])

      per_answer = grades.mean(axis=0)
      for answer_id, mean in zip(answer_ids, per_answer):
          print(answer_id, mean)
    prompt: >-
      The report lists `a1`, `a2` and `a3` with odd means, and `a4` is missing. No error.
      Tap the line to fix.
    lines: [4]
    reasons:
      - text: '`axis=0` gives one mean per judge, not per answer'
        correct: true
        feedback: >-
          Right. Three judge means, and `zip` stops at the shorter list.
      - text: '`zip` skips the last item'
        feedback: >-
          `zip` stops at the shorter input. Here that's three means for four answers.
      - text: The grades need to be floats first
        feedback: >-
          `mean` works on whole numbers and returns floats. The direction is wrong.
    verify:
      question: Which check would have caught this?
      choices:
        - text: Assert there is one mean per answer id
          correct: true
          feedback: >-
            Yes. Three means for four answers fails at once.
        - text: Assert every mean lies between 1 and 5
          feedback: >-
            Judge means lie in that range too. The check passes with the bug.
        - text: Print the means and look
          feedback: >-
            Someone did, and the odd means slipped past. An assertion doesn't get tired.
    fix: |
      per_answer = grades.mean(axis=1)

  - type: prose
    id: broadcasting
    body: >-
      Arrays of different shapes can still combine. `grades - np.array([1, 0, 1])` takes
      one number off each column, in every row. The short array is stretched to fit. That's
      **broadcasting**.


      The rule: line the shapes up from the right. Each pair of sizes must match, or one
      must be 1. `(4, 3)` and `(3,)` fit. `(4, 3)` and `(4,)` don't.


      So `grades.mean(axis=1)`, shape `(4,)`, won't fit `grades`. With `keepdims=True` it
      stays a column, `(4, 1)`, and fits.

  - type: prose
    id: similarity
    body: |-
      Chapter 20 stores each passage of text as a row of numbers, an **embedding**. Rows
      that point the same way mean similar things. The **cosine** measures that angle.

      ```python
      rows = passages / np.linalg.norm(passages, axis=1, keepdims=True)
      q = query / np.linalg.norm(query)
      scores = rows @ q               # one score per row
      best = np.argsort(-scores)[:3]  # positions of the top three
      ```

      `norm` gives each row's length, and dividing makes every row length 1. Then `@`, the
      dot product, is the cosine. `argsort` returns positions from low to high, so sort
      the negated scores.

  - type: code-challenge
    id: write-top-k
    concept: pyai.broadcasting
    difficulty: 3
    language: python
    starter: search.starter.py
    solution: search.solution.py
    tests: search.tests.py
    packages: [numpy]
    prompt: >-
      Write `top_k(query, passages, k)`. `passages` is a 2-D array, one embedding per row,
      and `query` is one embedding. Return the positions of the `k` rows closest to the
      query by cosine, best first. Return them as a list of `int`.


      Compare directions, not lengths: a long row that points elsewhere must lose. Use no
      loop over the rows.
    hints:
      - Make every row and the query length 1 first. Which `keepdims` do the rows need?
      - '`rows @ q` gives one cosine per row. Negate it before `np.argsort`.'
      - Slice the first `k` positions, and turn each into an `int` with a list comprehension.

  - type: explain-back
    id: explain-vectorise
    concept: pyai.vectorisation
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why is `scores.mean()` hundreds of times faster than a Python `for` loop over the
      same array?
    rubric:
      - The array holds plain numbers of one type side by side in memory.
      - '`mean` runs one loop in compiled code over that block.'
      - The Python loop runs interpreted code and makes an object for every number.
    modelAnswer: >-
      The array stores its numbers as one block of the same type. `mean` hands that block
      to compiled code, which loops at machine speed. A Python loop runs interpreted code
      five million times, and turns each number into a Python object first.

recap:
  - Store numbers in NumPy arrays, and compute on the whole array without a loop.
  - Read `shape`, and choose the `axis` that leaves one number per row or per column.
  - Combine shapes with broadcasting, and fix a mismatch with `keepdims=True`.

recall:
  - id: card-vectorise
    concept: pyai.vectorisation
    front: What is vectorisation?
    back: >-
      Replacing a Python loop with one array operation, such as `scores.mean()`, which
      runs in compiled code.
  - id: card-axis
    concept: pyai.ndarrays
    front: For a `(4, 3)` array, what shape does `mean(axis=1)` give?
    back: >-
      `(4,)`: one mean per row. `axis=1` squashes the columns.
  - id: card-broadcast-rule
    concept: pyai.broadcasting
    front: When do two shapes broadcast together?
    back: >-
      Lined up from the right, each pair of sizes matches or one of them is 1.
  - id: card-bool-mean
    concept: pyai.ndarrays
    front: How do you get the share of scores at 0.7 or above?
    back: >-
      `(scores >= 0.7).mean()`. The comparison gives `True` and `False`, which count as 1
      and 0.
  - id: card-cosine-rows
    concept: pyai.broadcasting
    front: How do you score every row of an embedding table against a query, without a loop?
    back: >-
      Divide the rows by `np.linalg.norm(rows, axis=1, keepdims=True)` and the query by its
      norm, then `rows @ query` gives one cosine per row.

