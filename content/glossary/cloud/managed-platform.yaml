term: managed platform
aka: [ platform as a service, PaaS, managed hosting ]
short: A hosting service that builds, runs and scales your code, so you never touch a server.
explain: |
  You push code and get a URL. The provider builds it, runs it, renews certificates, scales it
  and restarts it when it crashes.

  You trade control for convenience. You live with its limits on run time, memory and regions.
  And the bill grows with traffic in ways that can surprise you. Leaving later can be costly
  if you lean on features only that platform has.
analogy: A serviced flat. Cleaning and repairs are included; you can't knock down a wall, and the rent is higher.
usage: A managed platform gets us live this week, but check its pricing at ten times today's traffic.
twin:
  term: self-hosting
  difference: A managed platform runs the servers for you, on its terms. Self-hosting means you run them, with more control and more chores.
related: [ self-hosting, serverless, autoscaling ]
level: 2
lessons: [ cloud.hosting-models, nextserver.deploying ]
