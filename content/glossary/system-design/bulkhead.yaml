term: bulkhead
aka: [bulkhead pattern, bulkheads]
short: A cap on how much of a shared pool one customer or dependency may hold.
explain: |
  One slow payment provider can tie up all forty workers. Then the whole service stops,
  even for requests that never touch payments. One failure has spread into everything.

  So split the pool into compartments. Payments may hold ten workers, one tenant may hold
  five. When a compartment is full, its own work waits or fails while the rest carries on.
  Release the slot on failure too, or a crashing job leaks capacity until nothing is left.
analogy: The watertight walls inside a ship. One flooded section doesn't sink the boat.
usage: Put a bulkhead round the image provider so its timeouts can't eat every worker in the pool.
related: [noisy-neighbour, circuit-breaker, blast-radius, load-shedding]
level: 3
lessons: [scale.fair-queues, backend.calling-other-apis]
