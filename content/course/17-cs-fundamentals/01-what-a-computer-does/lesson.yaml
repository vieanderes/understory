deepDive: |-
  How much slower is storage? Fetching a value from main memory takes around 100
  nanoseconds. A small read from a modern NVMe drive takes tens of microseconds, a few
  hundred times longer. A spinning disk that has to seek takes milliseconds. Caches on the
  CPU chip answer in about a nanosecond. Treat these as rough orders of magnitude.

  "Loads the instructions into memory" hides a trick. A modern operating system maps the
  program file into the process and copies nothing at first. When the CPU first touches a
  page of it, the system reads that one page from storage. Code that never runs is never read.

  Each process gets a number, its process ID. `ps` lists running processes with their IDs,
  and two runs of one program show two IDs.

  Real servers keep logins in a database, not a text file. A database is storage that many
  processes can share safely, which also fixes the two-server problem.
