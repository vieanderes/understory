    authors: OWASP Foundation
    venue: OWASP GenAI Security Project
    url: https://genai.owasp.org/llm-top-10/
    note: Prompt injection and excessive agency, with the mitigations teams use.
    verified: false

deepDive: >-
  The policy and its tests ran in Python 3.13 on made-up runs. No model was called.


  **Taint tracking.** The `run` in the challenge is a simple taint record. The harness sets
  `untrusted` when a tool returns outside content. It raises `sensitivity` when a tool
  reads private data. Neither ever goes back down within a run. To get a clean slate,
  start a fresh run. Or hand the untrusted reading to a separate worker with no private
  data and no way out, and pass back only a short, checked summary.


  **Egress is wider than the network.** An allow-list on hosts still leaks if an allowed host
  accepts arbitrary content, such as a public form or a paste service. A search query to an
  allowed search engine can carry data in its words. A markdown image in the reply makes the
  user's browser fetch a URL. Allow specific paths where you can, and render model output
  links only from domains you trust.


  **One policy, several places.** Some managed agent platforms offer an automatic permission
  mode. It judges each call with the session's content so far, then runs it, denies it or
  pauses for a person. That's the same idea as the challenge. Keep your own policy for
  the tools you run, because only you know which data is private.


  **Logs are evidence.** Write audit records to an append-only store the agent's
  credentials can't reach, keep arguments redacted, and keep the policy version with each
  decision. When something goes wrong, the question is always who allowed what, and why.
