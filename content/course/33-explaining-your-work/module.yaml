id: explain
number: 33
title: "Explaining your work"
summary: "Saying things so people understand them: plain explanations, questions people can answer, walking through code, explaining decisions, different audiences, incident updates, one-page design docs and talking through diagrams. Its lessons are woven into the journey, each after the lesson it builds on."
why: "Work nobody understands does not get used, reviewed or trusted, and explaining it well is a skill you can practise."
youCanBuild: "A one-page design doc, an incident update and a recorded walkthrough of a diagram, each explained to two different audiences."
concepts:
  - id: explain.point-first
    title: "Point first"
    summary: "Saying the main point in the first sentence lets the listener place every detail that follows."
  - id: explain.example-before-term
    title: "Example before term"
    summary: "A concrete example first gives a new term something to attach to, so the term is understood when it arrives."
  - id: explain.checking-understanding
    title: "Checking they followed"
    summary: "Asking the listener to say it back or apply it shows whether the explanation landed, better than asking if it made sense."
  - id: explain.expected-and-actual
    title: "Expected and actual"
    summary: "A good question says what you expected, what happened instead and what you already tried."
  - id: explain.minimal-reproduction
    title: "A minimal reproduction"
    summary: "The smallest code that still shows the problem lets someone help in minutes, and building it often reveals the cause."
  - id: explain.intent-before-mechanics
    title: "Intent before mechanics"
    summary: "Saying what code is for before how it works gives the listener a map for the details."
  - id: explain.one-path-at-a-time
    title: "One path at a time"
    summary: "Following one realistic input through the code, then the branches, is easier to follow than reading it top to bottom."
  - id: explain.options-and-criteria
    title: "Options and criteria"
    summary: "A decision is explained by the options considered, the criteria that matter and how each option scores, before the recommendation."
  - id: explain.what-would-change-my-mind
    title: "What would change my mind"
    summary: "Naming the evidence that would reverse a decision shows it was reasoned, and tells others when to reopen it."
  - id: explain.audience-fit
    title: "Fitting the audience"
    summary: "The same idea changes vocabulary, detail and examples for a junior developer, a product manager, a customer or an executive."
  - id: explain.stakes-first
    title: "Stakes first"
    summary: "People outside engineering need the impact on them first, and the mechanism only if they ask."
  - id: explain.incident-update-shape
    title: "The shape of an incident update"
    summary: "An update states the impact, the current status, what happens next and when the next update will come."
  - id: explain.blameless-wording
    title: "Blameless wording"
    summary: "An update describes what happened to systems and decisions, not who got it wrong, so people keep reporting problems."
  - id: explain.one-page-design-doc
    title: "The one-page design doc"
    summary: "A short doc covers the problem, goals and non-goals, options and the decision, so reviewers can disagree before code exists."
  - id: explain.rollout-and-risks
    title: "Rollout and risks"
    summary: "A design doc says how the change ships, how it is rolled back and what could go wrong, not only what will be built."
  - id: explain.diagram-order
    title: "The order of the boxes"
    summary: "Talking through a diagram starts with the user and the main path, then adds the parts in the order data meets them."
  - id: explain.narrating-data-flow
    title: "Narrating data flow and failure"
    summary: "Saying what data moves between boxes and where each step can fail turns a picture into an explanation."
