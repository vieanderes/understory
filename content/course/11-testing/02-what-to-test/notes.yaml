summary: >-
  A test suite is an investment with running costs. Every test takes time to write, time on
  every run and time to fix when it breaks. It pays back only when it catches a bug or lets
  you change code with confidence. Choosing what to test is choosing where that investment
  earns the most.


  Three ideas do most of the work. Test **behaviour**, what a caller can observe, so a
  refactor never breaks a test that should have stayed green. Put each test at the
  **cheapest level** that can catch the bug it guards against: a unit test for a pricing
  rule, an integration test for a unique constraint, a browser test for the checkout
  journey. And spend depth where **risk** is highest, where a break is likely or costly.


  These notes add how to find the observable behaviour, the pyramid and its rivals, how to
  pick inputs with equivalence classes, and what coverage numbers can and can't tell you.
  Interviewers probe this area to tell people who write tests from people who design test
  strategies.
remember:
  - Test what a caller can observe, return values, visible state and effects at the boundary, never private fields or which helper was called.
  - A good test fails when behaviour a caller relies on changes and stays green through any refactor that keeps that behaviour.
  - Put each test at the cheapest level that can catch its bug, and use the higher levels for what only they can catch.
  - The pyramid says most tests should be fast unit tests, and the trophy says most confidence per test comes from integration tests; both reject a suite that is mostly end-to-end.
  - Split each input into equivalence classes the code treats alike, test one value from each class, and add the boundaries between classes.
  - Coverage shows which code no test ran, and says nothing about whether any result was checked.
  - Branch coverage is stricter than line coverage, since one line can hold two paths and count as covered after running one.
  - Treat a coverage target as a floor that stops the number falling, not a goal to maximise.
sections:
  - title: Finding the behaviour worth testing
    body: |-
      Behaviour is anything a caller can observe without reading your source. For a
      function that's its return value and any error it throws. For an object it's what its
      public methods report. For a service it's the effects at its edges: the row written,
      the email sent, the HTTP response returned.

      Everything else is implementation: private fields, helper functions, the order of
      internal calls, which data structure holds the state. A test that pins any of those
      breaks when someone improves the code, and catches nothing a behaviour test would
      miss.

      ```ts
      // catalogue.ts
      export function createCatalogue(titles: string[]) {
        const normalise = (text: string) => text.trim().toLowerCase();
        const index = new Map(titles.map((title) => [normalise(title), title]));
        return {
          find(query: string) {
            return index.get(normalise(query)) ?? null;
          },
        };
      }
      ```

      ```ts
      // catalogue.test.ts
      import { describe, test, expect } from 'vitest';
      import { createCatalogue } from './catalogue';

      describe('find', () => {
        const catalogue = createCatalogue(['The Hobbit', 'Dune']);

        test('ignores case and stray spaces', () => {
          expect(catalogue.find('  the HOBBIT ')).toBe('The Hobbit');
        });

        test('returns null for a book it does not hold', () => {
          expect(catalogue.find('Emma')).toBeNull();
        });
      });
      ```

      Neither test knows that a `Map` exists or that `normalise` is a separate function.
      Swap the map for a sorted array with binary search, or add a search index, and both
      stay green. The rule they pin, "case and spaces don't matter", is the one users rely
      on.

      A quick check for any test: if you rewrote the unit from scratch with the same public
      interface, would this test still make sense? If not, it's testing the implementation.
      The exception is an effect that *is* the behaviour and can't be seen from a return
      value, such as an email going out. That's where a spy on the boundary earns its place,
      a topic for the lesson on test doubles.
  - title: The pyramid, the trophy and the ice-cream cone
    body: |-
      The **test pyramid** puts many unit tests at the bottom, fewer integration tests in the
      middle and a handful of end-to-end tests on top. The argument is speed and precision:
      unit tests run in milliseconds and name the broken function, while a browser test
      takes seconds and says only that the page was wrong.

      The **testing trophy**, popular in the JavaScript world, reshapes it: static checks
      (types and lint) as the base, a modest layer of unit tests, the largest layer of
      integration tests, and a few end-to-end tests on top. The argument is confidence per
      test: in a web app many bugs live in how pieces connect, such as a component and its
      data, a handler and its query, where a unit test with everything mocked sees nothing.

      Both agree on the shape to avoid, the **ice-cream cone**: mostly manual or end-to-end
      tests with few fast ones beneath. That suite is slow, flaky and expensive, and teams
      stop running it.

      The honest answer to "which shape?" is that it follows where your bugs are. A pricing
      engine full of rules wants a wide base of unit tests. A thin API over a database wants
      more integration tests, because the SQL is the logic. What the shapes share is the
      rule behind them: write the cheapest test that can catch the bug, and don't pay for a
      browser to test arithmetic.

      One more layer sits below all of them. A type checker and a linter catch whole classes
      of bug, a misspelt property or an unhandled promise, for free on every save. Many
      tests people write in untyped code are type checks in disguise.
  - title: Choosing inputs with equivalence classes
    body: |-
      You can't test every input, so you pick a few that stand for the rest. **Equivalence
      partitioning** splits the input space into classes the code should treat the same
      way. If one value from a class works, the others almost certainly do too. Take a rule
      for a concert booking: you may buy 1 to 6 seats, in whole numbers.

      ```text
      class                   example   expected
      below the range         0         refused
      negative                -2        refused
      inside the range        3         accepted
      above the range         9         refused
      not a whole number      2.5       refused
      not a number            NaN       refused

      boundaries between classes: 0 | 1 and 6 | 7
      ```

      That's six values from classes plus four at the boundaries, ten tests in place of
      infinity. The boundaries matter most, because off-by-one errors hide exactly where one
      class meets the next, as the next lesson shows.

      Classes come from the rules, not the code. Read the requirement and ask what inputs
      would make the answer change. Then look for the classes the requirement forgot: empty
      strings, empty lists, duplicates, very long text, Unicode, a date on 29 February, a
      time in a daylight-saving gap. Those are where production incidents come from.

      Risk decides how far you go. A seat limit on a booking form gets the table above. A
      function that formats a tooltip gets one happy case, or none.
  - title: What coverage measures, and why 100% isn't the goal
    body: |-
      A coverage tool instruments your code and records what ran during the tests. Vitest
      supports two providers: `v8`, which reads the engine's built-in counters, and
      `istanbul`, which rewrites the source with counters. It reports four numbers.

      - **Statements** and **lines**: how many ran at least once.
      - **Functions**: how many were called at least once.
      - **Branches**: how many paths through each `if`, ternary, `&&` and `??` were taken.

      Line coverage can reach 100% while half the logic goes untested:

      ```ts
      // shipping.ts
      export function shippingPence(totalPence: number, express: boolean) {
        let cost = totalPence >= 5000 ? 0 : 399;
        if (express) cost += 500;
        return cost;
      }
      ```

      One test, `shippingPence(1200, true)` expecting `899`, runs every line. The report
      from `npx vitest run --coverage` says so:

      ```text
      File         | % Stmts | % Branch | % Funcs | % Lines | Uncovered Line #s
      shipping.ts  |     100 |       50 |     100 |     100 | 2-3
      ```

      Free delivery and standard shipping were never tried. Branch coverage caught it.

      Even full branch coverage proves only that code ran. Chasing 100% has three costs.
      The last few per cent are usually defensive code and error paths that are awkward to
      reach, so the effort per bug rises steeply. A hard target invites tests with no
      assertions, written to move the number. And it pulls attention from risk: an hour
      spent covering a logging helper isn't spent on the checkout.

      Use coverage in two ways. Read the uncovered lines as a list of questions: should
      something here be tested? And set a **threshold** as a ratchet in CI, so a change that
      drops coverage fails and someone has to decide. A team might hold its domain core at
      90 to 95% and not measure generated code at all. For whether the tests actually check
      anything, mutation testing is the better measure.
pitfalls:
  - "**Asserting on private state.** Reading `cart.cachedTotal` or checking that a helper was called ties the test to today's code. Assert on what `cart.total()` returns."
  - "**Mocking everything around a unit.** The unit test passes and the real pieces still don't fit. Keep some integration tests where the connections carry the risk."
  - "**Writing an end-to-end test for every rule.** It's slow, flaky and vague when it fails. Test the rule in a unit test and keep browser tests for a few key journeys."
  - "**Treating 100% coverage as done.** A line counts as covered the moment it runs. Check that every test asserts on a result, and look at branch coverage."
  - "**Only testing the happy path.** The bugs live in empty lists, zero, duplicates and limits. Partition the inputs and test each class and boundary."
  - "**Testing the framework or the language.** A test that `useState` stores a value or that `Array.push` adds an item checks someone else's code. Test your own rules."
interview:
  - question: How do you decide what to test in a new feature?
    answer: >-
      By risk, then by level. First I list what could go wrong and ask two questions of
      each: how likely is it, and what would it cost? A payment calculation or a permission
      check scores high on cost, so it gets thorough tests. A cosmetic toggle may get none.
      Then for each risk I pick the cheapest level that can catch it. Pure rules get unit
      tests with equivalence classes and boundaries. Anything the database enforces, a
      unique constraint or a query, gets an integration test on a real database. The one or
      two journeys that make money get an end-to-end test. Throughout, I test observable
      behaviour so the suite supports refactoring instead of fighting it. The trade-off is
      explicit: I'm choosing not to test some things, and I'd rather make that choice than
      spread effort evenly.
  - question: Test pyramid or testing trophy? Which do you prefer?
    answer: >-
      Neither as a rule; the shape should follow where the bugs are. The pyramid says most
      tests should be fast unit tests, because they're cheap and pinpoint failures. The
      trophy says integration tests give the most confidence per test in web apps, because
      many bugs live in the seams, such as a component and its data or a handler and its SQL.
      Both reject the ice-cream cone, a suite that is mostly slow end-to-end tests. In
      practice, for a service with rich domain rules I'd have a wide unit base. For a CRUD
      API where the logic is in the queries, I'd lean on integration tests against a real
      database, since mocking the database there tests almost nothing. And I'd always count
      the type checker and linter as the cheapest layer.
  - question: Your manager wants 100% code coverage. What do you say?
    answer: >-
      That coverage is a useful floor but a poor target, and I'd propose a threshold plus a
      better signal. Coverage records which code ran, not whether anything was checked, so a
      test with no `expect` counts fully. A hard 100% target makes people write exactly
      those tests, and the last few per cent are usually error paths and glue with little
      risk, so the cost per bug caught climbs. I'd suggest branch coverage rather than line
      coverage, a threshold around where the team already is that CI enforces so it can't
      drop, and a higher bar for the domain core. To measure whether the tests actually
      assert, I'd run mutation testing on the critical modules on a schedule. The goal is
      confidence to ship, and coverage is one input to it.
  - question: What makes a test brittle, and how do you fix it?
    answer: >-
      A brittle test fails when the code changes but the behaviour doesn't. The usual cause
      is coupling to implementation: asserting on private fields, on which internal
      function was called, on exact call order, on CSS class names, or on a snapshot of a
      whole page. Other causes are shared state between tests and hidden dependencies on
      time, randomness or network. The fix is to move the assertion to what a caller
      observes: the return value, the public state, the effect at the boundary, the text a
      user reads. Then control the nondeterminism by passing in the clock and random source.
      The trade-off is that behaviour-level assertions sometimes give a less precise failure
      message, which a good test name makes up for.
