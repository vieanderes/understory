approach: >-
  Handle the webhooks in order with two lookups. A set of event ids seen so far catches
  duplicates, whatever happened to the first copy. A map from record id to its current
  version and value catches stale events: ignore the event unless its version is strictly
  higher. At the end, sort the record ids and put the two counters first. Every lookup is
  O(1), so the run is O(N) plus the sort.
complexity: O(N log N) time for the final sort, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N reaches 100,000** and the word **efficient** is
      there. Checking "has this event arrived?" by scanning a list is O(N) per webhook, so
      O(N²) in all: too slow.

      Then read the rules in their order: duplicate first, stale second.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Name both rules and the output shape in the comment.
    code:
      ts: |-
        // Skip repeated event ids, then versions not above the record's; return [[dups, stale], [id, version, value]...].
      python: |-
        # Skip repeated event ids, then versions not above the record's; return [[dups, stale], [id, version, value]...].
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - the same version twice under different event ids, which is stale;
      - a duplicate of an event that was itself stale, which counts as a duplicate;
      - versions arriving newest first;
      - a reused event id that names a different record.
    input:
      - "([1, 2], [4, 4], [2, 2], [10, 99])"
      - "([1, 2, 2, 2], [8, 8, 8, 8], [5, 1, 1, 1], [1, 2, 2, 2])"
      - "([1, 2, 3, 4], [2, 2, 2, 2], [4, 3, 2, 1], [40, 30, 20, 10])"
      - "([5, 5], [1, 2], [1, 1], [8, 9])"
  - kind: ask-ai
    title: Check one rule with a narrow question
    minutes: 1
    body: |-
      The order of the two checks changes the counts. Confirm your reading on one case,
      without asking for code.
    prompt: >-
      Without writing code: under rules where a repeated event id is a duplicate whatever
      happened to the first copy, and duplicates are checked before versions, is a second
      copy of a stale event counted as a duplicate rather than as stale? One sentence.
    expect: Yes, it counts as a duplicate.
  - kind: write
    title: Write the solution with a set and a map
    minutes: 6
    body: |-
      The set and the map are the whole design. Write it yourself; the two `continue`
      lines carry the rules.
    code:
      ts: |-
        // Skip repeated event ids, then versions not above the record's; return [[dups, stale], [id, version, value]...].
        function solution(E: number[], D: number[], V: number[], X: number[]): number[][] {
          // A Set of event ids answers "seen before?" in O(1); scanning a list instead makes the
          // whole run O(N^2). A Map holds each record's current [version, value].
          const seen = new Set<number>();
          const records = new Map<number, [number, number]>();
          let duplicates = 0;
          let stale = 0;
          for (let k = 0; k < E.length; k++) {
            if (seen.has(E[k]!)) {
              duplicates++;
              continue;
            }
            seen.add(E[k]!);
            const current = records.get(D[k]!);
            if (current !== undefined && current[0] >= V[k]!) {
              stale++;
              continue;
            }
            records.set(D[k]!, [V[k]!, X[k]!]);
          }
          const ids = [...records.keys()].sort((a, b) => a - b);
          return [[duplicates, stale], ...ids.map((id) => [id, ...records.get(id)!])];
        }
      python: |-
        # Skip repeated event ids, then versions not above the record's; return [[dups, stale], [id, version, value]...].
        def solution(E, D, V, X):
            # A set of event ids and a dict of record states keep every webhook O(1).
            seen = set()
            records = {}
            duplicates = 0
            stale = 0
            for k in range(len(E)):
                if E[k] in seen:
                    duplicates += 1
                    continue
                seen.add(E[k])
                current = records.get(D[k])
                if current is not None and current[0] >= V[k]:
                    stale += 1
                    continue
                records[D[k]] = (V[k], X[k])
            rows = [[duplicates, stale]]
            for record_id in sorted(records):
                version, value = records[record_id]
                rows.append([record_id, version, value])
            return rows
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check your own cases against the
      rules, one webhook at a time.
    expect: >-
      Two OKs, then [[0, 1], [4, 2, 10]], [[2, 1], [8, 5, 1]], [[0, 3], [2, 4, 40]] and
      [[1, 0], [1, 1, 8]].
  - kind: ai-writes
    title: Let the assistant write a messy input
    minutes: 2
    body: |-
      Shuffled, repeated deliveries are tedious to invent. Ask for an input line only and
      check the counts yourself.
    prompt: >-
      Give me one test input line in the format ([1, 2], [7, 7], [1, 2], [10, 20]) with 12
      webhooks: event ids between 1 and 8 so some repeat, record ids 1 to 3, versions
      between 1 and 4. The line only, no answer and no code.
    expect: >-
      One line. The two counts plus the number of applied events add up to 12.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution for the order of the duplicate and stale checks, equal
      versions, numeric sorting of record ids and time complexity. List any problems in one
      line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N log N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
