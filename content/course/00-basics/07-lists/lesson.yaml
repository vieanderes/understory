id: basics.arrays
title: Lists
objective: Store values in an array, read them by index and loop over them.
level: essential
minutes: 10
concepts: [basics.arrays, basics.array-methods]
prerequisites: [basics.functions]
opening:
  text: >-
    You'll keep many values in one list, like a playlist, and work through them one by one. Almost every app you use is a list of something.

steps:
  - type: prose
    id: what-an-array-is
    body: |-
      An **array** is a list of values inside square brackets:

      ```js
      const fruits = ["apple", "banana", "cherry"];
      ```

      Each item has a position, called its **index**. Counting starts at 0, not 1. So
      `fruits[0]` is `"apple"`, and `fruits[2]` is `"cherry"`. Ask for `fruits[3]`, where
      nothing is stored, and you get `undefined`.

  - type: predict-output
    id: predict-index
    concept: basics.arrays
    difficulty: 1
    language: js
    code: |
      const colours = ["red", "green", "blue"];
      console.log(colours[1]);
    question: What does this show?
    choices:
      - text: '`green`'
        correct: true
        feedback: >-
          Yes. Index 0 is red, so index 1 is green.
      - text: '`red`'
        feedback: >-
          Counting starts at 0. `red` is `colours[0]`.
      - text: '`blue`'
        feedback: >-
          Close. `blue` is the third item, which is index 2.

  - type: prose
    id: length-and-push
    body: |-
      `length` tells you how many items a list has: `fruits.length` is `3`. `push` adds an item
      to the end:

      ```js
      fruits.push("date");
      ```

      Now `fruits.length` is `4`. Notice `fruits` is a `const`, and it still changed. `const`
      only stops you swapping in a whole new list.

  - type: fill-blank
    id: fill-push
    concept: basics.array-methods
    difficulty: 2
    language: js
    prompt: 'Add `"Outro"` to the end of the playlist, then show how many songs there are.'
    template: |
      const songs = ["Intro", "Chorus"];
      songs.{{1}}("Outro");
      console.log(songs.{{2}});
    blanks:
      - key: '1'
        answer: push
      - key: '2'
        answer: length
    bank: [push, add, append, length, size]

  - type: multiple-choice
    id: pick-last-item
    concept: basics.array-methods
    difficulty: 2
    question: Which always reads the last item of `list`, however long it is?
    choices:
      - text: '`list[list.length - 1]`'
        correct: true
        feedback: >-
          Yes. Counting from 0, the last index is one less than the length.
      - text: '`list[list.length]`'
        feedback: >-
          That's one past the end. There's nothing there, so you get `undefined`.
      - text: '`list[1]`'
        feedback: >-
          That's always the second item, whatever the length.

  - type: prose
    id: looping-over
    body: |-
      To do something with every item, loop over the list. `for...of` hands you each item in
      turn:

      ```js
      const prices = [4, 10, 6];
      let total = 0;
      for (const price of prices) {
        total = total + price;
      }
      console.log(total);
      ```

      That shows `20`. `price` holds 4, then 10, then 6.

  - type: bug-hunt
    id: hunt-loop-total
    concept: basics.arrays
    difficulty: 2
    language: js
    code: |
      const prices = [4, 10, 6];
      let total = 0;
      for (const price of prices) {
        total = price;
      }
      console.log(total);
    prompt: The basket total shows only the last price. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It replaces the total instead of adding to it
        correct: true
        feedback: >-
          Right. Each round overwrites `total`. Write `total = total + price`.
      - text: '`total` should start at the first price'
        feedback: >-
          Starting at 0 is right for a sum. The trouble is what each round does to it.
      - text: '`for...of` only visits the last item'
        feedback: >-
          It visits every item. Each visit throws the old total away.
    fix: |
      const prices = [4, 10, 6];
      let total = 0;
      for (const price of prices) {
        total = total + price;
      }
      console.log(total);

  - type: code-challenge
    id: write-average
    concept: basics.arrays
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write the function `average(numbers)`. It returns the average of a list: the total
      divided by how many numbers there are.


      For example, `average([2, 4, 6])` returns `4`. You can assume the list is never empty.
    hints:
      - Add everything up with a loop, then divide once, after the loop.
      - '`numbers.length` tells you how many numbers there are.'
      - 'Start with `let total = 0;` and `for (const number of numbers) {`'

  - type: explain-back
    id: explain-index-zero
    concept: basics.arrays
    difficulty: 3
    prompt: Why does `list[list.length]` never hold an item?
    rubric:
      - Indexes start at 0.
      - So the last item is at `list.length - 1`.
      - '`list.length` is one past the end, where nothing is stored, so you get `undefined`.'
    modelAnswer: >-
      Counting starts at 0. A list of three items uses indexes 0, 1 and 2. Its length is 3, and
      index 3 is one past the end. Nothing is stored there, so reading it gives `undefined`.

recap:
  - "Keep several values in one array."
  - "Read an item by its index, starting at 0."
  - "Loop over every item in a list."
recall:
  - id: card-index
    concept: basics.arrays
    front: What index does the first item of an array have?
    back: >-
      `0`. The second is at `1`, and so on.
  - id: card-push
    concept: basics.array-methods
    front: How do you add an item to the end of an array?
    back: >-
      With `push`, like `fruits.push("date");`.
  - id: card-for-of
    concept: basics.arrays
    front: How do you run some code once for every item in a list?
    back: >-
      With `for...of`: `for (const item of list) { ... }`.

references:
  - kind: docs
    title: Arrays
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/array
    note: Indexes, `length`, `push` and looping.
    primary: true
    verified: true
  - kind: docs
    title: Arrays
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Arrays
    note: A beginner's guide to working with lists.
    primary: true
    verified: true

deepDive: >-
  Already know this? Arrays have many helpful methods. `pop` removes the last item,
  `includes` checks whether a value is in the list, and `map` and `filter` build new lists
  from old ones. The JavaScript chapter covers them, and which ones change the original list.


  Reading past the end of an array never causes an error. It quietly gives `undefined`, and
  the error shows up later, where that value is used. You'll follow one back in the lesson on
  errors.
