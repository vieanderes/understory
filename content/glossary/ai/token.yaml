term: token
short: A piece of text, often part of a word, that a language model reads and writes.
explain: |
  A model doesn't see letters or whole words. A tokeniser chops text into pieces: common
  words are one piece, rare words split into several. The model then writes its answer one
  piece at a time, in a loop.

  Prices, context limits and reply speed are all counted in tokens. A rough rule for English
  is four characters per token, but code, numbers and other languages often cost more.
  Output tokens usually cost several times more than input ones.
analogy: Words in an old telegram. You pay by the piece, and a long, rare word costs more pieces than a short one.
usage: That prompt is 6,000 tokens before the user types anything, so every call starts expensive.
twin:
  term: embedding
  difference: A token is a piece of text the model reads and writes. An embedding is a list of numbers standing for what a whole passage means.
