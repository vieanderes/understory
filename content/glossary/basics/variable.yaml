term: variable
short: A name that points at a value, so you can use it again and change it later.
explain: |
  A program needs to remember things: a score, a name, a running total. You give each one a
  name with `let` or `const`. From then on, the name stands for its value.

  `let` makes one you can point at a new value later. `const` makes one you can't reassign.
  The trap: `const` fixes the name, not the contents. A `const` list can still grow.
analogy: A sticky label on a jar. The jar can be topped up, and with let you can move the label to another jar.
example:
  language: js
  code: |
    let score = 0;
    score = score + 10;
    const name = "Sam";
    console.log(name, score); // Sam 10
usage: Give that variable a clearer name than x, because in a week nobody will know what it holds.
twin:
  term: string
  difference: Without quotes, `count` is a variable, and the computer looks up its value. In quotes, `"count"` is a string, five letters shown exactly as written.
related: [string, array, object, scope]
level: 1
lessons: [basics.variables]
