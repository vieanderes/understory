id: security.uploads-and-paths
title: File uploads and path traversal
objective: "Accept uploads by checking size and type and naming files yourself, and stop `../` from reaching files outside a folder."
level: essential
minutes: 10
concepts: [security.upload-validation, security.path-traversal]
prerequisites: [security.xss-and-csp, backend.files]
opening:
  text: >-
    You'll accept a profile photo without accepting a web page, a script or a stranger's file
    name. Then you'll stop a download link from handing out your server's secrets.

steps:
  - type: prose
    id: what-an-upload-carries
    body: >-
      An **upload** is a file sent to your server in a request. Three things arrive: the bytes,
      a file name, and a type such as `image/png`.


      The browser fills in the name and the type, but a form is only one way to send a
      request. Anyone can write their own, with any bytes, name and type. All three are input
      from a stranger.

  - type: multiple-choice
    id: pick-what-uploader-controls
    concept: security.upload-validation
    difficulty: 1
    question: Someone uploads a profile photo. Which parts can they choose freely?
    choices:
      - text: The bytes, the name and the type
        correct: true
        feedback: >-
          Right. The request is theirs to write, so every part is theirs to choose.
      - text: Only the bytes
        feedback: >-
          The browser fills in the name and type, but anyone can send a request by hand.
      - text: Only the file name
        feedback: >-
          Changing the name takes seconds, but so does changing the type and bytes.

  - type: prose
    id: check-what-arrived
    body: >-
      So check what really arrived. Refuse a file over your size limit. Then look at its first
      bytes. Most formats start with a fixed **file signature**, sometimes called magic bytes:
      a PNG always begins `137 80 78 71`, a JPEG `255 216 255`.


      Accept only the types on your allow-list. And never keep the uploader's name. Store the
      file under a random id you make with `crypto.randomUUID()`.

  - type: bug-hunt
    id: find-trusted-name
    concept: security.upload-validation
    difficulty: 2
    language: js
    code: |
      async function saveAvatar(file) {
        if (file.size > 2000000) throw new Error("too big");
        const target = "avatars/" + file.name;
        await storage.write(target, file.bytes);
        return "/" + target;
      }
    prompt: >-
      A pull request adds avatar uploads. Someone uploads a file named `../index.html`. Tap
      the line at fault.
    lines: [3]
    reasons:
      - text: The uploader chooses where the file is stored
        correct: true
        feedback: >-
          Yes. `../` climbs out of `avatars`. Name the file yourself, with a random id.
      - text: The size limit is too generous
        feedback: >-
          Two megabytes is a fair limit for a photo. The name is what lets them choose the place.
      - text: The returned path shows the folder name
        feedback: >-
          Folder names aren't secret. Writing to a path the stranger picked is the hole.
    fix: |
      async function saveAvatar(file) {
        if (file.size > 2000000) throw new Error("too big");
        const target = "avatars/" + crypto.randomUUID() + ".png";
        await storage.write(target, file.bytes);
        return "/" + target;
      }

  - type: code-challenge
    id: write-image-type
    concept: security.upload-validation
    difficulty: 3
    language: ts
    starter: type.starter.ts
    solution: type.solution.ts
    tests: type.tests.ts
    editable: '7-10'
    prompt: >-
      Write `imageType(bytes)`. The bytes arrive as an array of numbers. Return `"png"` or
      `"jpeg"` when the file starts with that type's signature in `SIGNATURES`. Otherwise
      return `null`, whatever the file claims to be.
    hints:
      - Look at the first few bytes only, and compare them with each signature in turn.
      - A file shorter than a signature can't match it. `bytes[i]` is `undefined` past the end.
      - 'Start with `for (const [type, signature] of Object.entries(SIGNATURES))`.'

  - type: prose
    id: serving-uploads
    body: >-
      Serving the file back needs care too. Send it with the type you checked, not the one it
      claimed.


      Better still, serve uploads from a separate domain, such as `files.example`. Then a web
      page that slipped through can't run scripts on your site. That's the XSS from lesson 2. Chapter 9 showed storing uploads in object storage with signed URLs, which
      does exactly that.

  - type: prose
    id: what-path-traversal-is
    body: >-
      A download link reads a file by name: `/files?name=invoice.pdf`. The server builds the
      path with `path.join("/app/uploads", name)`, which joins folder and name.


      In a path, `..` means the folder above. So the name `../.env` becomes `/app/.env`, your
      secrets file. That's **path traversal**. One fix: `path.resolve` gives the final path,
      and you check it still starts with your folder followed by `/`.

  - type: ai-review
    id: review-startswith-no-separator
    concept: security.path-traversal
    difficulty: 4
    language: js
    request: Stop people downloading files outside the uploads folder.
    flawClass: security
    code: |
      const UPLOADS = "/app/uploads";

      function safePath(name) {
        const full = path.resolve(UPLOADS, name);
        if (!full.startsWith(UPLOADS)) throw new Error("outside uploads");
        return full;
      }
    prompt: >-
      An assistant wrote this, and `../.env` is now refused. Then someone asks for
      `../uploads-private/keys.txt`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`/app/uploads-private` also starts with `/app/uploads`'
        correct: true
        feedback: >-
          Yes. Check for `UPLOADS + "/"`, so only paths inside the folder pass.
      - text: '`path.resolve` should be `path.join`'
        feedback: >-
          Both give `/app/uploads-private/keys.txt` here. The prefix check is what lets it through.
      - text: '`UPLOADS` should be a relative path'
        feedback: >-
          An absolute folder is right. It's the missing `/` after it that fails.
    verify:
      question: Which test would have caught this?
      choices:
        - text: '`../uploads-private/keys.txt` is refused'
          correct: true
          feedback: >-
            Yes. Only a sibling folder sharing the prefix slips past `startsWith`.
        - text: '`../.env` is refused'
          feedback: >-
            That was refused already. It leaves the prefix entirely, so the check sees it.
        - text: '`photo.png` is allowed'
          feedback: >-
            That's the happy path. It passes before and after the fix.
    fix: |
      const UPLOADS = "/app/uploads";

      function safePath(name) {
        const full = path.resolve(UPLOADS, name);
        if (!full.startsWith(UPLOADS + "/")) throw new Error("outside uploads");
        return full;
      }

  - type: code-challenge
    id: write-safe-file-name
    concept: security.path-traversal
    difficulty: 3
    language: ts
    starter: name.starter.ts
    solution: name.solution.ts
    tests: name.tests.ts
    editable: '4-7'
    prompt: >-
      Safer than checking paths: accept only plain names. Write `isSafeFileName(name)`. Return
      `true` only for one dot, a non-empty name of `ALLOWED_CHARACTERS` before it, and an
      extension from `ALLOWED_EXTENSIONS` after it.
    hints:
      - '`name.split(".")` must give exactly two parts, or the name is refused.'
      - Check the extension against the list, then every character of the first part.
      - '`ALLOWED_CHARACTERS.includes(ch)` tells you whether one character is allowed.'

  - type: explain-back
    id: explain-allow-list-names
    concept: security.path-traversal
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A teammate wants to block path traversal by removing every `../` from the name. Why is an
      allow-list of plain names the stronger fix?
    rubric:
      - Removing `../` is a block-list, and attackers find forms it misses, such as `....//` or an absolute path.
      - An allow-list accepts only names made of known-safe characters, so no path trick fits.
      - Resolving the path and checking the folder with a trailing `/` is a second, independent check.
    modelAnswer: >-
      Removing `../` tries to list what's bad, and there's always a form it misses. `....//`
      turns back into `../` once the middle is stripped, and `/etc/passwd` has no dots at all.
      An allow-list of letters, digits, hyphens and one known extension says what's good
      instead. None of those tricks can even be written. I'd still resolve the path and
      check it sits inside the folder, as a second wall.

recap:
  - Treat an upload's bytes, name and type as a stranger's input.
  - Check size and file signature, store under your own name, and serve from another domain.
  - Stop path traversal with an allow-list of names and a folder check ending in `/`.

recall:
  - id: card-upload-parts
    concept: security.upload-validation
    front: Which parts of an upload can the uploader choose?
    back: >-
      All of them: the bytes, the file name and the type. Anyone can write the request by hand.
  - id: card-file-signature
    concept: security.upload-validation
    front: How do you check an upload is really a PNG?
    back: >-
      Read its first bytes and compare them with the PNG signature, `137 80 78 71`. The
      claimed type proves nothing.
  - id: card-dot-dot
    concept: security.path-traversal
    front: What does `path.join("/app/uploads", "../.env")` give, and why is that a problem?
    back: >-
      `/app/.env`. `..` climbs out of the folder, so a download link hands out the secrets file.
  - id: card-prefix-check
    concept: security.path-traversal
    front: Why check `full.startsWith(UPLOADS + "/")` and not `full.startsWith(UPLOADS)`?
    back: >-
      Without the `/`, a sibling folder such as `/app/uploads-private` passes the check.

references:
  - kind: docs
    title: File Upload Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
    note: Allow-listed extensions, file signatures, random file names, size limits and rewriting images.
    primary: true
    verified: true
  - kind: docs
    title: Path Traversal
    authors: OWASP
    venue: OWASP Community
    url: https://owasp.org/www-community/attacks/Path_Traversal
    note: How `../` sequences and their encodings reach files outside the intended folder.
    primary: true
    verified: true
  - kind: docs
    title: path.resolve([...paths])
    authors: Node.js contributors
    venue: Node.js documentation
    url: https://nodejs.org/api/path.html#pathresolvepaths
    note: How `path.resolve` turns a folder and a name into one absolute path, resolving `..`.
    verified: true

deepDive: >-
  Every path here was run on Node 24: `path.join("/app/uploads", "../.env")` gives
  `/app/.env`, and `path.resolve("/app/uploads", "../uploads-private/keys.txt")` gives
  `/app/uploads-private/keys.txt`, which passes a `startsWith` check without the trailing
  `/`. On Windows the separator is `\`, so real code uses `path.sep` instead of `"/"`.


  A file signature proves the start of a file, not the rest. An image can carry extra data
  after it, and image libraries have had bugs. Services that take many uploads re-encode
  images, reading the picture and writing a fresh file, which drops anything hidden inside.
  They also scan for malware.


  URL encoding hides dots: `%2e%2e%2f` is `../` once decoded. Frameworks decode query
  strings before your code sees them, so check the decoded name, which is what an allow-list
  does anyway. SVG is an image format that can hold scripts, so leave it off the list unless
  you sanitise it.
