term: serverless
aka: [serverless function, function as a service, FaaS, lambda function]
short: Small handlers a platform starts on demand and bills per call, with no server for you to manage.
explain: |
  An app that gets ten requests an hour still pays for a server all day. Here you pay only
  while your code runs, and the platform adds copies when traffic grows.

  There are still servers; you don't see them. Each handler is short-lived and can scale to
  zero, which brings cold starts. Copies don't share memory, and each opens its own
  database connections, so a spike can exhaust the database. Long jobs and open
  connections fit badly.
analogy: A taxi instead of owning a car. You pay per trip, never park it, and sometimes wait for one to arrive.
example:
  language: ts
  code: |
    // one request in, one response out; nothing kept between calls
    export async function handler(request: Request): Promise<Response> {
      const { city } = await request.json();
      return Response.json(await getForecast(city));
    }
usage: Serverless suits the nightly report, but the chat needs open connections, so it needs a server.
twin:
  term: edge-function
  difference: A serverless function runs in a chosen region with a full runtime. An edge function runs at many locations near users, in a restricted runtime, for small fast jobs.
related: [cold-start, edge-function, autoscaling, connection-pool, managed-platform]
level: 2
lessons: [cloud.serverless]
