summary: >-
  A **custom property** is a value with a name that you define in CSS and read anywhere with
  `var()`. It looks like a variable from JavaScript, and it saves the same kind of work.
  Change the value in one place, and every rule that reads it follows.


  But it isn't a plain find-and-replace. A custom property is a real CSS property. It takes
  part in the cascade, and every element inside the one that sets it inherits it. The
  browser also keeps it alive while the page runs. That's what makes themes possible. A dark theme
  doesn't change a single component rule. It changes what the names hold, lower in the page,
  and every component that reads them follows.


  Use custom properties for values that repeat and carry meaning: colours by role, a spacing
  scale, a radius, a font stack. Don't wrap every number in one. A name that appears once
  adds a step for the reader and saves nothing.
remember:
  - A custom property is inherited, so a value set on an element applies to that element and everything inside it.
  - The browser swaps `var()` for the value on each element, using the value that element has inherited or set.
  - A `var()` that finds no value and no fallback makes the whole declaration fall back to inherit or the initial value, not to an earlier rule.
  - '`var(--name, fallback)` uses the fallback only when the property has no value, not when its value is wrong for the property.'
  - A custom property that uses another `var()` is worked out where it's set, and descendants inherit the finished value.
  - Name colours by role, such as `--bg` and `--text`, so a theme can redefine the roles without touching components.
  - '`var()` works in property values only, never in a media query condition or a selector.'
  - Every theme must pass contrast checks on its own, because WCAG asks for 4.5 to 1 for normal text in dark mode too.
sections:
  - title: When the browser reads a custom property
    body: |-
      The browser works out each element's styles in stages. First, the cascade picks one
      winning value for every property, custom properties included. Then it turns the winners
      into **computed values**: final, usable values such as `16px` or a colour. `var()` is
      swapped for its value at that second stage, element by element.

      That timing explains most of the behaviour you'll see. Since a custom property inherits,
      each element looks up the value it has at that moment:

      ```css
      :root { --space: 8px; }
      .card { padding: var(--space); }
      .roomy { --space: 24px; }
      ```

      A `.card` inside `.roomy` gets 24px of padding, and every other card gets 8px. The card
      rule never changed. The value arrived from its surroundings. This "context sets, the
      component reads" pattern is how design systems let one component come in sizes.

      A custom property can hold any piece of CSS, not only a colour or a length. In our
      Chromium test, `--cols: 3` read by `repeat(var(--cols), 1fr)` gave three 100px columns
      in a 300px grid. The browser doesn't check the value when you set it. It only finds out
      whether it makes sense when a real property reads it.

      A custom property that reads another one is worked out where it's set. With `--gap:
      calc(var(--space) * 3)` on `:root` and `--space: 8px` there, an element that sets
      `--space: 20px` still gets a 24px `--gap`. It inherits `--gap` already finished. If you
      want `--gap` to follow a local `--space`, set `--gap` again on that element.
  - title: Invalid at computed-value time
    body: |-
      When a normal declaration has a typo, the browser throws that one line away as it reads
      the file. The rule before it still applies:

      ```css
      .note { color: blue; color: 16px; } /* 16px isn't a colour: blue stays */
      ```

      With `var()`, the browser can't know in advance whether the value will make sense, so
      it keeps the declaration. When the swap later produces nonsense, it's too late to go
      back to `blue`. The spec calls this **invalid at computed-value time**, and the
      property acts as if it were `unset`. Inherited properties such as `color` take the
      parent's value. Others, such as `padding`, take their initial value.

      ```css
      :root { --size: 16px; }
      .parent { color: green; }
      .note { color: blue; color: var(--size); } /* green, from the parent */
      .box { padding: 10px; padding: var(--nope); } /* 0px */
      ```

      Both results come from our Chromium test. The `.box` padding is 0px, not 10px, because
      `--nope` doesn't exist and there's no fallback.

      Two traps grow from this. First, a fallback doesn't rescue a wrong value: `var(--size,
      teal)` in `color` still gives the parent's colour, because `--size` exists. Second, you
      can't glue a unit on afterwards. `width: var(--num)px` with `--num: 20` doesn't make
      `20px`: the browser sees two separate pieces, the declaration is invalid, and the width
      became `auto`. Write `calc(var(--num) * 1px)` instead, which gave 20px.

      Fallbacks can nest, and everything after the first comma is the fallback, commas
      included. `var(--font, Georgia, serif)` falls back to the whole stack `Georgia, serif`.
  - title: A dark theme that follows the system
    body: |-
      The lesson switched themes with a class. Most sites also follow the reader's system
      setting, with a media query called `prefers-color-scheme`:

      ```css
      :root {
        color-scheme: light dark;
        --bg: white;
        --text: #1a1a1a;
        --link: #0b5cad;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #121212; --text: #eeeeee; --link: #8ab4f8; }
      }
      body { background: var(--bg); color: var(--text); }
      a { color: var(--link); }
      ```

      The media query changes only the roles. No component rule appears twice.

      `color-scheme` is a separate property that tells the browser which schemes the page
      supports. With `light dark` and a dark system setting, the browser draws its own parts
      dark too. In our Chromium test, a plain text input turned from white to dark grey, and
      the default text colour became white. Without it, you'd get a dark page with glaring
      white form fields and scrollbars.

      For a manual switch, keep both: the media query as the default and a class that a small
      script adds to `html` when the reader picks a theme. The script also saves the choice,
      so the page opens in that theme next time.

      Check contrast in both themes. WCAG 2.2 success criterion 1.4.3, Contrast (Minimum),
      asks for at least 4.5 to 1 between normal text and its background, and 3 to 1 for large
      text. A link colour that passes on white often fails on near-black. The blue `#0b5cad`
      scores 6.67 to 1 on white but 2.81 to 1 on `#121212`. That's why the example gives
      `--link` a lighter value in dark mode, `#8ab4f8`, which scores 8.89 to 1.
pitfalls:
  - '**A misspelt name.** `var(--brnad)` finds nothing, and with no fallback the property silently falls back to its initial or inherited value. There''s no error in the console. Check the name in the browser''s developer tools, which list custom properties with the element''s styles.'
  - '**Expecting the earlier rule to take over.** `padding: 10px; padding: var(--missing);` gives 0px, not 10px, because the declaration is kept and fails later. Give the `var()` a fallback when the value may be missing.'
  - '**Gluing a unit onto a `var()`.** `var(--num)px` isn''t a length, so the declaration fails. Store the unit in the property, `--num: 20px`, or multiply with `calc(var(--num) * 1px)`.'
  - '**Using `var()` in a media query.** `@media (min-width: var(--tablet))` never matches. A media query belongs to no element, so there''s nothing to inherit the value from. Write the number in the query.'
  - '**Naming by colour instead of role.** `--dark-blue` stops making sense once the dark theme sets it to light blue. Name the job, such as `--link` or `--surface`, and let each theme choose the colour.'
verify:
  - lens: breaks
    check: 'Every theme passes contrast checks on its own, because a colour that reads well in light can fail in dark.'
  - lens: confuses
    check: 'Custom properties are named by role, such as `--surface`, not by value, such as `--white`, which stops being true in dark mode.'
  - lens: breaks
    check: 'A `var()` that might be undefined has a fallback, because a missing property quietly resets the declaration to its inherited or initial value.'
  - lens: tests
    check: 'The page is checked in both themes after each colour change, since a fixed colour left in one rule shows only in the other.'
interview:
  - question: How are CSS custom properties different from variables in a preprocessor such as Sass?
    answer: >-
      Sass variables vanish before the browser sees the CSS, while custom properties live in
      the browser and follow the cascade. Sass is a tool that turns an extended CSS language
      into plain CSS at build time, so `$brand` is replaced with its value once, everywhere.
      A custom property stays a real property. It inherits, and it can hold a different
      value in different parts of the page. Changing it later, from a class or a script,
      restyles everything that reads it. That's what makes one-class theming possible. The trade-off
      is that the browser can't check a custom property's value until it's used, so a wrong
      value fails silently. Teams often use both: Sass for build-time helpers, custom
      properties for values that change at run time.
  - question: How would you implement dark mode with CSS?
    answer: >-
      I'd give every colour a role as a custom property, then redefine the roles for dark
      mode. Components only ever read roles, such as `var(--surface)` and `var(--text)`. On
      `:root` I set the light values and `color-scheme: light dark`, then a
      `prefers-color-scheme: dark` media query redefines the roles, so the page follows the
      system by default. `color-scheme` also makes form controls and scrollbars dark. For a
      manual switch, a class on `html` overrides the query, and a script saves the choice. I
      check contrast separately in each theme, because WCAG's 4.5 to 1 for normal text
      applies to both. The risk is a colour written directly in a component: it won't
      switch, so a design-token lint rule is worth having.
  - question: A declaration uses `var()` and the value is invalid. What happens?
    answer: >-
      The property becomes invalid at computed-value time and behaves as if it were `unset`,
      so it inherits or takes its initial value. It doesn't fall back to an earlier
      declaration. With `color: blue; color: var(--size)` and `--size: 16px`, the colour
      comes from the parent, not blue. The reason is timing. The browser can only tell
      whether a `var()` value is valid when it substitutes it, long after the cascade has
      thrown away the losing declarations. A `var()` fallback doesn't help either, because it
      only applies when the property has no value at all. So when a value might be missing,
      I add a fallback. And I name properties by type and role, such as `--space-m`, so
      nobody reads a length into a colour.
