deepDive: >-
  **The dangerous mix.** Picture an agent that reads private data, reads untrusted text,
  and can send data out, by email or a link. It can be steered into leaking. Remove
  any one of the three and that attack fails. Check every new tool against it.


  **Links are an exit.** A reply that shows an image from a URL can smuggle data out in
  that URL. Render links and images from model output only from domains you trust.


  **Depth.** Chapter 21 covers guardrails on inputs and outputs, human approval flows,
  and redacting personal data before it reaches a prompt.
