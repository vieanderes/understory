term: coupling
aka:
  - tight coupling
  - loose coupling
short: How much a change in one part of the code forces changes in another part.
explain: |
  Change the shape of a user record, and twelve files break. Those files were tightly coupled
  to it: they knew its details and relied on them.

  Some coupling can't be avoided, because parts have to talk. The goal is loose coupling,
  where parts depend on a small, stable surface rather than on each other's insides. A good
  test: how many files does a typical change touch?
analogy: Furniture glued together versus bolted together. Both stand up, but only one lets you swap a leg.
usage: The report reads the orders table directly, and that's coupling we'll pay for at the next migration.
twin:
  term: cohesion
  difference: Coupling is between modules, how much they lean on each other. Cohesion is inside one module, how well its parts belong together. You want low coupling and high cohesion.
related:
  - cohesion
  - information-hiding
  - dependency-injection
level: 2
lessons: [arch.coupling-and-cohesion, arch.project-structure]
