deepDive: >-
  Since Postgres 11, `ADD COLUMN ... DEFAULT 'GB'` is instant, even on a huge table. Postgres
  stores the default once and hands it out for old rows. A default that changes per row, such
  as `DEFAULT random()`, still rewrites the table.


  Backfill a big table in batches, such as 10,000 rows per statement, each its own
  transaction. One giant `UPDATE` holds locks for its whole run and leaves a lot of cleanup
  work behind.


  `SET NOT NULL` checks every row while holding a strong lock. On a large table, add
  `CHECK (full_name IS NOT NULL) NOT VALID`, then `VALIDATE CONSTRAINT` separately, which lets
  writes continue while it checks. After that, `SET NOT NULL` trusts the check and skips its
  scan.


  Many teams keep migrations forward-only. Rather than a "down" script, a mistake is fixed by
  a new migration, since production data rarely goes back cleanly.
