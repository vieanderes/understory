deepDive: >-
  The challenge's loop ran in Python 3.12 against a scripted model that invents fresh call
  ids on every request, as a real model does. No model was called.


  **Advisory budgets.** Your harness enforces hard limits. Some APIs also let the model see
  a budget. One provider's task budget, in beta, gives the model a token figure for the
  whole agentic loop, with a minimum of 20,000. The model paces itself and wraps up instead
  of being cut off mid-step. It's advisory: keep your own hard cap behind it.


  **A partly finished turn.** A reply can ask for three tools, and the crash can come after
  the first. Replaying all three is safe only because each tool honours its key. Read-only
  tools can repeat freely. Tools that can't take a key, like an old email API, need a
  record of "sent" written before the send, and a person to check the gap.


  **Evaluators that can be gamed.** A generator that learns what the evaluator checks can
  satisfy the letter of the criteria and miss the point. Mix deterministic checks, such as
  length, links that resolve and quotes found in the transcript, with a model judge. Sample
  some passes for a person to read.
