id: security.abuse-and-privacy
title: Abuse, bots and privacy
objective: "Rate-limit a login, raise the cost of bots without blocking people, and collect only the personal data you need."
level: advanced
minutes: 10
concepts: [security.rate-limiting, security.bot-defence, security.data-minimisation]
prerequisites: [security.uploads-and-paths, security.broken-auth, backend.rate-limits]
opening:
  text: >-
    You'll slow a script hammering your login and a bot buying up new trainers, without
    blocking real people. You'll also store less, so a breach spills less.

steps:
  - type: prose
    id: what-rate-limiting-is
    body: >-
      The backend chapter capped each caller's requests and answered `429 Too Many Requests`.
      That's **rate limiting**. Here it becomes a defence: a script can try a thousand
      passwords a minute.


      The question is the **key**, whatever you count by: an account, an IP address, an API
      key. Pick the right one and real people rarely notice, while the script slows to a crawl.

  - type: multiple-choice
    id: pick-the-key
    concept: security.rate-limiting
    difficulty: 1
    question: A script is guessing one person's password. What should the login limit count by?
    choices:
      - text: The account being logged into
        correct: true
        feedback: >-
          Right. The attack aims at one account, so counting per account catches it.
      - text: The whole site
        feedback: >-
          One shared limit throttles every real user the moment traffic rises. Too blunt.
      - text: The browser tab
        feedback: >-
          A script has no tabs, and it can start fresh whenever it likes.

  - type: prose
    id: token-bucket
    body: >-
      The common shape is a **token bucket**. Each key has a bucket of tokens, say five. Each
      request spends one. Tokens drip back in over time, say one a second, up to the five.


      A short burst is fine: it spends the bucket. A steady flood finds it empty and gets
      `429`. Your code does the counting, so let's write it.

  - type: code-challenge
    id: write-token-bucket
    concept: security.rate-limiting
    difficulty: 3
    language: ts
    twin:
      language: python
      starter: bucket.starter.py
      solution: bucket.solution.py
      tests: bucket.tests.py
    prompt: >-
      Write `take(bucket, now, capacity, refillPerSec)`. `bucket` is `{ tokens, last }`, times
      in milliseconds. Refill for the seconds since `last`, never above `capacity`. With a
      whole token, spend one and return `ok: true`. Otherwise `ok: false`. Either way set
      `last` to `now`.
    hints:
      - Work out the seconds since `last` first, then the refilled count, capped with `Math.min`.
      - A request goes through only when the refilled count is at least 1.
      - 'Start with `const elapsed = (now - bucket.last) / 1000;`'

  - type: prose
    id: counting-by-ip
    body: >-
      Counting by IP address is tempting, but weak on its own. An attacker can send each guess
      from a different address, from rented servers or hacked machines.


      And behind a load balancer, your server sees the balancer's address. The balancer adds
      an **`X-Forwarded-For`** header with the visitor's address. Anyone can send that header
      themselves, with any address in it.

  - type: ai-review
    id: review-limit-by-ip
    concept: security.rate-limiting
    difficulty: 3
    language: js
    request: Rate-limit login attempts so nobody can guess a password.
    flawClass: logic
    code: |
      const attempts = new Map();

      function allowLogin(request, account) {
        const ip = request.headers["x-forwarded-for"];
        const count = (attempts.get(ip) ?? 0) + 1;
        attempts.set(ip, count);
        return count <= 5;
      }
    prompt: >-
      An assistant wrote this. A test from one machine is blocked after five tries. Then one
      account is guessed from a thousand addresses. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It counts per IP, not per account under attack
        correct: true
        feedback: >-
          Yes. Addresses are cheap to change. Count the account being guessed.
      - text: '`x-forwarded-for` should be `x-real-ip`'
        feedback: >-
          Both headers can be sent by anyone. The deeper problem is counting the wrong key.
      - text: '`5` is too many attempts'
        feedback: >-
          Lowering it won't help while every address gets a fresh count. The key is wrong.
    fix: |
      const attempts = new Map();

      function allowLogin(request, account) {
        const count = (attempts.get(account) ?? 0) + 1;
        attempts.set(account, count);
        return count <= 5;
      }

  - type: prose
    id: bot-and-scalper-defence
    body: >-
      A **bot** is a program that uses your site like a person would, only faster. A scalper
      bot stays inside the rate limit and buys the moment stock appears.


      **Bot defence** raises the cost of automation without blocking people: a purchase limit
      per account, a queue on launch day, a challenge when traffic looks automated. Each rule
      must live on the server, because a bot never runs your page's JavaScript.

  - type: ai-review
    id: review-limit-in-browser
    concept: security.bot-defence
    difficulty: 3
    language: js
    request: Limit the new trainers to two per customer.
    flawClass: security
    code: |
      // cart.js, runs in the browser
      function addToCart(item) {
        if (countInCart(item.id) >= 2) {
          alert("Limit of two per customer");
          return;
        }
        return fetch("/api/cart", { method: "POST", body: JSON.stringify(item) });
      }
    prompt: >-
      An assistant wrote this, and clicking a third time shows the alert. On launch day, one
      account buys forty pairs. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The limit is only checked in the browser
        correct: true
        feedback: >-
          Yes. A bot posts to `/api/cart` directly. The server must count and refuse.
      - text: '`alert` can be dismissed'
        feedback: >-
          Dismissing it still stops this click. The bot never runs this code at all.
      - text: The limit should be one, not two
        feedback: >-
          Two is a business choice. Where the check lives is the security question.
    fix: |
      // cart.js, runs in the browser: a hint for people, not the rule
      function addToCart(item) {
        return fetch("/api/cart", { method: "POST", body: JSON.stringify(item) });
      }
      // The server counts this account's pairs and answers 409 past two.

  - type: prose
    id: data-minimisation
    body: >-
      **Personal data** is anything that identifies a person: a name, an email, a birthday.
      **GDPR**, the EU's data protection law, says: collect only what a stated purpose needs.
      Keep it only while that purpose lasts. That's **data minimisation**.


      It's the cheapest security control there is. A field you never store can't be breached.
      Let the payment provider hold the card, and skip the birthday you'll never use.

  - type: explain-back
    id: explain-why-minimise
    concept: security.data-minimisation
    difficulty: 3
    prompt: >-
      A teammate wants to store every customer's date of birth "in case marketing needs it".
      Why is that a security decision, not only a product one?
    rubric:
      - Every field stored is a field that can be breached or leaked later.
      - GDPR says collect only what a stated purpose needs, so "in case" isn't a purpose.
      - Data you never hold can't leak, so not collecting it removes the risk.
    modelAnswer: >-
      Anything you store is something you now have to protect, and something a breach can
      spill. A birthday nobody uses only sits there waiting to leak. GDPR asks for a purpose
      before collection, and "marketing might want it" isn't one. The cheapest way to secure a
      field is to not have it.

recap:
  - Cap requests with a token bucket, and count per the thing being attacked.
  - Enforce purchase limits and queues on the server, where a bot can't skip them.
  - Store only what a purpose needs, so a breach spills less.
recall:
  - id: card-token-bucket
    concept: security.rate-limiting
    front: In a token bucket, what happens when a burst arrives faster than the refill?
    back: >-
      It spends the tokens it has, then refuses the rest with `429` until tokens refill.
  - id: card-limit-key
    concept: security.rate-limiting
    front: Why limit login attempts per account rather than per IP?
    back: >-
      The attack targets one account, and an attacker can rotate IPs. Counting the account
      catches the guessing.
  - id: card-scalper
    concept: security.bot-defence
    front: Name two defences that slow a scalper bot without blocking people.
    back: >-
      A purchase limit per account and a queue on launch day, both enforced on the server.
  - id: card-minimisation
    concept: security.data-minimisation
    front: What does data minimisation require, and why is it a security win?
    back: >-
      Collect only what a purpose needs, and keep it only that long. Data you never hold
      can't be breached.
