id: html.links-and-urls
title: Links and URLs
objective: Write link and image paths that lead where you mean, and link to a place on the page.
level: essential
minutes: 10
concepts: [html.url-resolution, html.fragments]
prerequisites: [html.semantic-structure]
opening:
  text: >-
    You'll work out where any link or image path leads, and link straight to a section of a
    page. When a page moves and its images break, you'll know why.

steps:
  - type: prose
    id: three-kinds-of-address
    body: |-
      A web address is a **URL**. An `href` or `src` can hold one of three kinds:

      - `https://example.com/menu` is a full URL. It works from anywhere.
      - `/menu` starts at the top of the current site.
      - `menu.html` is **relative**: it starts from the folder the current page is in.

      Most mistakes come from the third kind.

  - type: predict-output
    id: predict-map-request
    concept: html.url-resolution
    difficulty: 1
    language: html
    code: |
      <img src="img/screen.png" alt="The settings screen">
    question: This sits on `https://docs.example/guides/setup.html`. Where does the image load from?
    choices:
      - text: '`https://docs.example/guides/img/screen.png`'
        correct: true
        feedback: >-
          Yes. The path starts from the page's folder, `/guides/`.
      - text: '`https://docs.example/img/screen.png`'
        feedback: >-
          Most people pick this. Starting at the top of the site needs a leading `/`, and
          this path has none.
      - text: '`https://docs.example/guides/setup.html/img/screen.png`'
        feedback: >-
          Close. The browser first drops the file name, `setup.html`, and keeps its folder.

  - type: prose
    id: base-url-and-resolution
    body: >-
      Here's the rule for a relative path. Take the page's own address. Drop everything after
      its last `/`. Then add your path.


      Each `../` at the start climbs up one folder. So from `/guides/setup.html`, the path
      `../index.html` leads to `/index.html`.

  - type: bug-hunt
    id: hunt-broken-logo
    concept: html.url-resolution
    difficulty: 2
    language: html
    code: |
      <header>
        <img src="img/logo.png" alt="Help centre">
      </header>
      <h1>Set up your account</h1>
      <img src="img/screen.png" alt="The settings screen">
    prompt: >-
      This page is `/guides/setup.html`. The screenshot shows, but the logo is broken. The logo
      file is `/img/logo.png`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: With no leading `/`, it looks in `/guides/img/`
        correct: true
        feedback: >-
          Right. Relative paths start from the page's folder. Write `/img/logo.png`.
      - text: An `img` inside `header` can't load
        feedback: >-
          Images load anywhere on the page. The path leads to the wrong folder.
      - text: The `alt` text is too short
        feedback: >-
          Alt text never stops a file loading. Work out where the path leads from `/guides/`.
    fix: |
      <header>
        <img src="/img/logo.png" alt="Help centre">
      </header>
      <h1>Set up your account</h1>
      <img src="img/screen.png" alt="The settings screen">

  - type: prose
    id: fragments-and-ids
    body: |-
      A link can also jump to a spot on the same page. First, give the target an `id`, a
      name no other element on the page uses:

      ```html
      <h2 id="find-us">Find us</h2>
      ```

      Then point a link at it with `#`: `<a href="#find-us">`. The part after `#` is called
      the **fragment**.

  - type: playground
    id: build-contents-links
    concept: html.fragments
    difficulty: 2
    prompt: >-
      Make the two links jump to their sections. Give the headings `id="menu"` and
      `id="find-us"`. Then point each link at its heading.
    html: |
      <nav>
        <a href="">Menu</a>
        <a href="">Find us</a>
      </nav>
      <h2>Menu</h2>
      <p>Soup, bread and cake.</p>
      <h2>Find us</h2>
      <p>12 Market Street.</p>
    editable: [html]
    checks:
      - label: The Menu heading has `id="menu"`
        selector: 'h2#menu'
        count: 1
      - label: The Find us heading has `id="find-us"`
        selector: 'h2#find-us'
        count: 1
      - label: A link points at `#menu`
        selector: 'a[href="#menu"]'
        count: 1
      - label: A link points at `#find-us`
        selector: 'a[href="#find-us"]'
        count: 1
    solution:
      html: |
        <nav>
          <a href="#menu">Menu</a>
          <a href="#find-us">Find us</a>
        </nav>
        <h2 id="menu">Menu</h2>
        <p>Soup, bread and cake.</p>
        <h2 id="find-us">Find us</h2>
        <p>12 Market Street.</p>
    hints:
      - Each heading needs an `id` attribute in its start tag.
      - Each link's `href` is a `#` followed by that `id`.
      - '`<h2 id="menu">` goes with `<a href="#menu">`.'

  - type: multiple-choice
    id: pick-fragment-click
    concept: html.fragments
    difficulty: 2
    language: html
    code: |
      <a href="#find-us">Find us</a>
    question: Someone clicks this link. What happens?
    choices:
      - text: The page scrolls to the element with that `id`
        correct: true
        feedback: >-
          Yes. A link with only a fragment stays on the same page.
      - text: The browser loads a page called `find-us`
        feedback: >-
          That would be `href="find-us"`. The `#` means a spot on this page.
      - text: Nothing, unless JavaScript handles it
        feedback: >-
          No script needed. Browsers jump to a fragment on their own.

  - type: playground
    id: fix-site-menu
    concept: html.url-resolution
    difficulty: 3
    prompt: >-
      This menu sits on every page of the site. On `/menu/drinks.html`, the Contact link leads
      to `/menu/contact`, which doesn't exist. Make both links start at the top of the site.
    html: |
      <nav>
        <a href="index.html">Home</a>
        <a href="contact">Contact</a>
      </nav>
    editable: [html]
    checks:
      - label: Home leads to the top of the site, `/`
        selector: 'nav a[href="/"]'
        count: 1
      - label: Contact leads to `/contact`
        selector: 'nav a[href="/contact"]'
        count: 1
    solution:
      html: |
        <nav>
          <a href="/">Home</a>
          <a href="/contact">Contact</a>
        </nav>
    hints:
      - A path that starts with `/` always starts at the top of the site.
      - The home page of a site is `/` on its own.
      - Change `contact` to `/contact`.

  - type: fill-blank
    id: fill-hrefs
    concept: html.url-resolution
    difficulty: 3
    language: html
    prompt: >-
      The page is `https://docs.example/guides/setup.html`. A `<!-- -->` line is a comment,
      a note the browser ignores. Fill in each path so it leads to the address in the comment
      above it.
    template: |
      <!-- https://docs.example/img/logo.png -->
      <img src="{{1}}" alt="Help centre logo">
      <!-- https://docs.example/guides/billing.html -->
      <a href="{{2}}">Billing</a>
      <!-- the element with id="install" on this page -->
      <a href="{{3}}">Install steps</a>
      <!-- https://docs.example/ -->
      <a href="{{4}}">Home</a>
    blanks:
      - key: '1'
        answer: /img/logo.png
      - key: '2'
        answer: billing.html
      - key: '3'
        answer: '#install'
      - key: '4'
        answer: ../
    bank: [/img/logo.png, img/logo.png, billing.html, /billing.html, '#install', 'install', ../, ../../]

  - type: explain-back
    id: explain-map-404
    concept: html.url-resolution
    difficulty: 4
    prompt: >-
      A guide moves from `/guides/` into `/guides/2026/`, and its `img/screen.png` breaks. Why,
      when the tag didn't change?
    rubric:
      - '`img/screen.png` has no leading `/`, so it starts from the page''s folder.'
      - Moving the page changed that folder, so the path now leads to `/guides/2026/img/screen.png`.
      - '`/img/screen.png` starts at the top of the site, so it survives any move.'
    modelAnswer: >-
      The tag stayed the same, but the page's address changed. A relative path starts from
      the page's folder. That folder is now `/guides/2026/`, so the browser asks for
      `/guides/2026/img/screen.png`, which doesn't exist. Writing `/img/screen.png` starts at
      the top of the site, so it works from any page.

recap:
  - Tell full, site and relative paths apart, and pick the right one.
  - Work out where a relative path leads from the page it sits on.
  - Link to a section with an `id` and a `#` fragment.

recall:
  - id: card-resolution-rule
    concept: html.url-resolution
    front: On the page `/guides/setup.html`, where does `img/screen.png` lead?
    back: >-
      To `/guides/img/screen.png`. The browser drops `setup.html` and adds the path to the
      folder.
  - id: card-leading-slash
    concept: html.url-resolution
    front: Why do site menus usually use paths like `/contact`?
    back: >-
      A leading `/` starts at the top of the site, so the link works from every page, however
      deep.
  - id: card-fragment-link
    concept: html.fragments
    front: How do you link to the "Find us" heading on the same page?
    back: >-
      Give the heading `id="find-us"`, then link to it with `href="#find-us"`.

