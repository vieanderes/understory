summary: >-
  In a real project, TypeScript's work is split between two kinds of tool. The **checker**,
  `tsc`, reads the whole program with the settings in `tsconfig.json` and reports type
  errors. **Transpilers**, such as esbuild, SWC, Babel, tsx and Node's own type stripping,
  delete the types one file at a time and never check them. Transpilers are fast, so they run
  your dev server and your build. That speed is why a page can run with type errors in it,
  and why a green build means nothing unless CI runs `tsc`.


  Most of `tsconfig.json` describes the world your code will run in. `module` and
  `moduleResolution` say who loads the files, so imports are resolved the way that host will
  resolve them. `target` says which syntax the output may use, and `lib` says which built-in
  APIs exist. `isolatedModules`, `verbatimModuleSyntax` and `erasableSyntaxOnly` restrict
  your code to what a one-file-at-a-time tool can handle.


  Declaration files, `.d.ts`, are the other half: types for code that lives somewhere else,
  from a package's own build, from DefinitelyTyped's `@types/...` packages or from your own
  hand. Nothing checks them against the JavaScript they describe, so they're promises, and a
  wrong one fails only at run time.
remember:
  - Only `tsc` checks types; bundlers, dev servers, tsx and Node's type stripping remove types file by file, so CI must run `tsc --noEmit` as a required step.
  - "`module` and `moduleResolution` describe whatever will load your code: `nodenext` for code Node runs, `bundler` or `module: preserve` when a bundler does."
  - "`tsc` never rewrites an import path, unless you set `rewriteRelativeImportExtensions`, which turns `./total.ts` into `./total.js` in the output."
  - "`target` sets which syntax `tsc` rewrites into older forms, `lib` sets which built-in APIs the checker believes exist, and neither adds polyfills."
  - "`isolatedModules` flags code a one-file tool can't compile, and `verbatimModuleSyntax` requires `import type` for types and keeps every other import exactly as written."
  - "Node 24 runs `.ts` files by stripping types: it ignores `tsconfig.json`, needs `.ts` in import paths, rejects `enum`, `namespace` and parameter properties, and won't strip files in `node_modules`."
  - A `.d.ts` file declares types for code that lives elsewhere, and nothing verifies it against that code.
  - "Since TypeScript 6.0, `types` defaults to `[]`, so global type packages such as `@types/node` must be listed, while imported packages still find their `@types` automatically."
sections:
  - title: Three tsconfig files for three kinds of project
    body: |-
      A web app built by a bundler such as Vite. The bundler writes the output, so `tsc`
      only checks:

      ```json
      {
        "compilerOptions": {
          "target": "es2022",
          "lib": ["es2022", "dom", "dom.iterable"],
          "module": "preserve",
          "moduleResolution": "bundler",
          "jsx": "react-jsx",
          "noEmit": true,
          "strict": true,
          "noUncheckedIndexedAccess": true,
          "verbatimModuleSyntax": true,
          "isolatedModules": true,
          "skipLibCheck": true
        },
        "include": ["src"]
      }
      ```

      `module: preserve` (TypeScript 5.4) means "leave imports alone, a bundler handles
      them", and `bundler` resolution accepts `./total` without an extension, as bundlers do.

      A Node service that Node 24 runs directly from `.ts` files:

      ```json
      {
        "compilerOptions": {
          "target": "esnext",
          "module": "nodenext",
          "noEmit": true,
          "allowImportingTsExtensions": true,
          "erasableSyntaxOnly": true,
          "verbatimModuleSyntax": true,
          "strict": true,
          "noUncheckedIndexedAccess": true,
          "types": ["node"]
        },
        "include": ["src"]
      }
      ```

      A library published to npm, where `tsc` itself writes JavaScript and declarations:

      ```json
      {
        "compilerOptions": {
          "target": "es2022",
          "lib": ["es2022"],
          "module": "nodenext",
          "rootDir": "src",
          "outDir": "dist",
          "declaration": true,
          "declarationMap": true,
          "sourceMap": true,
          "strict": true,
          "verbatimModuleSyntax": true,
          "types": ["node"]
        },
        "include": ["src"]
      }
      ```

      `target` and `lib` are separate decisions. With `target: "es2019"`, `tsc` rewrites
      `a ?? "none"` into `a !== null && a !== void 0 ? a : "none"`. `lib` only changes what
      the checker believes: leave out `"dom"` and `document` is an error, a useful guard in
      server code. Put `"es2023"` in `lib` and `toSorted` compiles, but no polyfill appears,
      so an old browser still throws.

      TypeScript 6.0 also deprecated old choices such as `moduleResolution: "node10"`,
      `baseUrl` and `target: "es5"`; they now fail with a message pointing at the migration
      notes.
  - title: Running TypeScript on Node 24 directly
    body: |-
      Node 24 runs a `.ts` file with no flag. It replaces each piece of type syntax with
      spaces and runs what's left, so line and column numbers stay right without source
      maps. It never reads `tsconfig.json` and never checks a type:

      ```bash
      node total.ts
      # O-1: 12.50 GBP
      ```

      The rules follow from "delete the types, change nothing else":

      ```text
      import { Order, CURRENCY } from "./types.ts";   // Order is only a type
      SyntaxError: The requested module './types.ts' does not provide an export named 'Order'

      import { CURRENCY } from "./types";
      Error [ERR_MODULE_NOT_FOUND]: Cannot find module '.../types'

      enum Status { Open, Closed }
      SyntaxError [ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX]: TypeScript enum is not supported in strip-only mode
      ```

      A type imported without `type` stays in the JavaScript and points at nothing. A path
      needs its real extension, `.ts`, because Node doesn't guess. And syntax that generates
      code, `enum`, `namespace` with values, and constructor parameter properties such as
      `constructor(private owner: string)`, can't be stripped. Node refuses to strip anything
      under `node_modules`, so published packages must ship JavaScript. The flag
      `--experimental-transform-types` handles enums, with an experimental warning.

      The config in the previous section turns each rule into a `tsc` error before Node sees
      it. `verbatimModuleSyntax` reports "'Order' is a type and must be imported using a
      type-only import". `erasableSyntaxOnly` reports "This syntax is not allowed when
      'erasableSyntaxOnly' is enabled" on the enum. `allowImportingTsExtensions` lets you
      write `./types.ts`. One trap remains: `nodenext` also accepts `./types.js`, mapping it
      to the `.ts` file, which is right when `tsc` emits JavaScript and wrong when Node runs
      the source. Node then fails with `ERR_MODULE_NOT_FOUND`.
  - title: Checking versus transpiling, and where the check runs
    body: |-
      The split exists because checking is slow and needs the whole program, while stripping
      is fast and needs one file. Dev servers want the second. The cost is that nothing in
      your inner loop enforces types unless the editor shows them to you.

      So the check belongs in three places. The editor runs the language service as you
      type. A pre-push hook or `pnpm check` script runs `tsc --noEmit` locally. And CI runs it
      as a required step, so a pull request can't merge with type errors:

      ```yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      ```

      Frameworks differ. `next build` runs the type check and fails on errors, unless
      someone sets `typescript.ignoreBuildErrors`, while `next dev` keeps serving. Vite only
      transpiles, which is why its templates put `tsc -b` in front of `vite build`. Knowing which of your commands check is part of owning a
      pipeline.

      One-file tools have one more limit: they can't tell whether an imported name is a type
      without reading the other file. That's what `isolatedModules` guards. With it on,
      `export { Order }` for a type is reported as "Re-exporting a type when 'isolatedModules'
      is enabled requires using 'export type'". `verbatimModuleSyntax` is the stricter,
      simpler rule: anything imported without `type` is kept, anything with `type` is
      deleted, so every tool produces the same output.

      For speed in a large repository, `incremental` stores build information between runs,
      and project references with `tsc -b` rebuild only the projects that changed.
  - title: How TypeScript finds the types for a package
    body: |-
      When you import a package, a `declare module "<name>"` in your own files wins if there
      is one. Otherwise the checker resolves the package: first the `types` condition in its
      `exports`, or its `types` field, pointing at `.d.ts` files the authors built; then a
      matching `@types/<name>` package from DefinitelyTyped. If none exists, a strict
      project reports that it could not find a declaration file.

      A library written in TypeScript ships its own declarations. With `declaration: true`,
      `tsc` writes one beside each output file, containing only the public types:

      ```ts
      // dist/index.d.ts, written by tsc from src/index.ts
      export declare function formatPence(pence: number): string;
      ```

      `@types` packages are written by other people. Their version should match the
      library's major and minor version, and they can lag behind or disagree with the real
      code. Global types are different from imported ones. `@types/node` adds `process` and
      `Buffer` to every file without an import, so since TypeScript 6.0 you list it:
      `"types": ["node"]`. Before 6.0, every `@types` package in `node_modules` was included
      automatically, which let test-runner globals leak into application code.

      Your own declarations can extend existing types. Inside a module,
      `declare global` adds to a global interface:

      ```ts
      export {};

      declare global {
        interface Window {
          appVersion: string;
        }
      }

      window.appVersion = "2.4.0";
      console.log(window.appVersion.toUpperCase()); // 2.4.0
      ```

      Interfaces with the same name merge, which is why this works, and it's the same
      mechanism libraries use for plugins. The shortcut `declare module "tiny-qr";`, with no
      body, makes every import from that package `any`. It compiles instantly and checks
      nothing, so treat it as a temporary stub.
pitfalls:
  - "**Trusting the dev server or the bundler to catch type errors.** They strip types without checking. Run `tsc --noEmit` in CI as a required step, and in a local check script."
  - "**Writing `.js` in imports when Node runs the `.ts` source.** `nodenext` accepts `./types.js`, but Node looks for that exact file and fails. With native stripping, write `./types.ts` and enable `allowImportingTsExtensions`."
  - "**Expecting `target` or `lib` to polyfill.** They change the output syntax and what the checker believes exists. An API missing in an old browser still throws; add a polyfill or raise the supported browsers."
  - "**Including `dom` in a server project's `lib`.** Then `window` and `localStorage` compile in code that runs on Node and crash there. Keep `lib` to the host you actually run on."
  - "**Silencing a missing type with `declare module \"pkg\";`.** Every import becomes `any`, and typos compile. Install the `@types` package, or write a small real declaration for the functions you use."
  - "**Upgrading to TypeScript 6.0 and losing `process`.** `types` now defaults to `[]`, so global declarations aren't included. Add `\"types\": [\"node\"]`, plus any test-runner globals, to the right `tsconfig.json`."
interview:
  - question: Your app is built with a bundler that strips types. How do you make sure type errors never reach production?
    answer: >-
      I make `tsc --noEmit` a required CI step, because nothing else in that pipeline checks
      types. esbuild, SWC and Babel transpile one file at a time and deliberately skip
      checking, which is why they're fast, so a build can succeed with type errors in it.
      The editor catches most errors early and a local `check` script catches more, but only
      a required status check on the pull request guarantees it. I'd also turn on
      `isolatedModules` or `verbatimModuleSyntax`, so `tsc` flags code the transpiler would
      compile differently, such as a type re-exported without `export type`. In a big
      repository I'd use `incremental` or project references to keep the check fast. The
      trade-off is a slower pipeline, usually tens of seconds, which is cheap next to a
      production crash.
  - question: What do `module` and `moduleResolution` control? When do you use `bundler` versus `nodenext`?
    answer: >-
      They tell the checker which host will load your files, so it resolves imports the same
      way that host will. They don't change how the code runs, and `tsc` never rewrites
      import paths. `nodenext` models Node: it respects `package.json` `type` and `exports`,
      and ES module imports need an explicit extension. `bundler`, usually with
      `module: preserve` or `esnext`, models Vite or webpack, which accept extensionless
      paths and `exports` conditions. Pick by what runs the output. If Node runs it, use
      `nodenext`, or an import like `./total` passes the checker and fails in production. If
      a bundler owns the output, `bundler` avoids pointless `.js` extensions. For a
      published library, `nodenext` is safest, because code that works in Node also works in
      bundlers.
  - question: What are declaration files, and how does TypeScript find types for an npm package?
    answer: >-
      A `.d.ts` file contains only type declarations for code that lives elsewhere, and
      produces no JavaScript. For a package, a `declare module "<name>"` in my project takes
      precedence. Otherwise the checker follows the `types` condition in the package's
      `exports` map or its `types` field, for packages that ship their own types, and then
      looks for `@types/<name>` from DefinitelyTyped. The risk is that nothing checks a declaration against the real code: an
      outdated `@types` version or a hand-written declaration can promise a function that
      doesn't exist, and it fails at run time. So I match `@types` versions to the library,
      keep hand-written declarations minimal, and avoid the bodiless `declare module "pkg";`
      shortcut, which makes everything `any`.
  - question: What do `isolatedModules` and `verbatimModuleSyntax` do, and why would you turn them on?
    answer: >-
      Both make `tsc` reject code that a one-file-at-a-time transpiler can't compile
      correctly. Such a tool can't look into other files, so if `index.ts` re-exports
      `Order`, it can't know whether `Order` is a type to delete or a value to keep.
      `isolatedModules` reports those cases, such as re-exporting a type without
      `export type`. `verbatimModuleSyntax` replaces the guessing with a simple rule: an
      import or export marked `type` is deleted, and everything else is kept exactly as
      written. That makes the output predictable across tsc, esbuild, SWC and Node's type
      stripping. The cost is writing `import type` a little more often, which also documents
      intent. In a project where any tool other than `tsc` emits JavaScript, I'd always have
      one of them on.
  - question: Can you run TypeScript directly in Node now? What are the limits?
    answer: >-
      Yes. Node 24 runs `.ts` files with no flag by stripping the type syntax, but it doesn't
      check types, so you still need `tsc --noEmit`. The limits come from "delete the types,
      change nothing else". Node ignores `tsconfig.json`, so path aliases and other settings
      don't apply. Imports need their real `.ts` extension. Type-only imports must use
      `import type`, or the name stays in the JavaScript and the import fails. Syntax that
      generates code, `enum`, `namespace` with values and parameter properties, is rejected
      unless you use the experimental transform flag. Files inside `node_modules` aren't
      stripped, so packages still publish JavaScript. `erasableSyntaxOnly`,
      `verbatimModuleSyntax` and `allowImportingTsExtensions` make `tsc` enforce all of this.
      It's great for scripts and services; libraries still compile.
