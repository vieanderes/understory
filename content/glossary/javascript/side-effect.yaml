term: side effect
short: Anything a function does beyond handing back a value, such as saving data or changing the page.
explain: |
  Saving a file, sending a request, writing a log, changing a variable outside the function.
  Each of these leaves a mark on the world.

  Programs need them; that's the point of most programs. The skill is keeping them in a few
  known places at the edges, so the core logic stays pure and testable. In React they belong
  in event handlers and effects, never in the render itself.
analogy: Baking a cake that also sets off the smoke alarm. You got your cake, and something else happened too.
usage: 'That getter has a side effect: it writes to local storage every time you read it.'
twin:
  term: pure-function
  difference: A side effect is any change a function makes outside itself. A pure function makes none, so it only turns inputs into an output.
related:
  - pure-function
  - mutation
  - functional-core
