term: privilege escalation
aka: [vertical escalation, horizontal escalation]
short: Gaining access beyond what you were granted, such as an admin role or another user's data.
explain: |
  An attacker who has an ordinary account wants more. Vertical escalation reaches a higher
  role, such as admin. Horizontal escalation reaches a peer's data, such as someone else's
  invoices by changing an id in the URL.

  Both come from a missing check on the server. The browser hid the admin button, but the
  endpoint behind it never asked who was calling. Test every sensitive endpoint as another
  user and as nobody, not only as the right user.
analogy: A hotel guest who finds their key card also opens the room next door, or the staff office.
usage: Changing the id in the URL shows another tenant's invoice; that's horizontal privilege escalation, so check ownership on the server.
related: [authorisation, least-privilege, mass-assignment, threat-model]
level: 2
lessons: [security.attacker-playbook]
