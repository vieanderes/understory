summary: >-
  A graph is the most general shape data can take: things, and links between them. Trees
  and linked lists are graphs with rules. Remove the rules and you can describe road maps,
  social networks, package dependencies, web pages and their links, the states of a form,
  and the objects on a heap. Once a problem is a graph, a small set of algorithms answers
  most questions about it.


  Traversal is the core. **Breadth-first search** explores in rings and finds the fewest
  hops. **Depth-first search** follows one path to its end, which suits finding cycles,
  connected groups and orderings. **Topological sort** turns "needs" edges into a run order,
  and fails exactly when there's a cycle. **Dijkstra's algorithm** finds cheapest routes
  when edges have costs. All of them rest on one habit: remember what you've already seen,
  or a cycle traps you.


  In day-to-day work you rarely write these from scratch. You meet them in a bundler's
  module graph, a build tool's task order, a database's foreign-key order for migrations, a
  garbage collector's mark phase and route planning. Recognising the graph underneath tells
  you which algorithm the tool is running and why it complains about cycles.
remember:
  - A graph is nodes and edges, which can be directed or undirected, and weighted or unweighted.
  - An adjacency list costs O(V + E) memory and suits sparse graphs, while a matrix costs O(V²) and answers "is there an edge?" in O(1).
  - Breadth-first search uses a queue and finds the fewest edges from a start node, in O(V + E).
  - Depth-first search uses a stack or recursion and suits cycle detection, connected components and topological order, also in O(V + E).
  - Every traversal of a general graph needs a seen set, because graphs can have cycles.
  - A topological order exists only for a directed acyclic graph, and Kahn's algorithm finds one by repeatedly taking nodes with no unmet dependencies.
  - Dijkstra's algorithm finds cheapest paths with non-negative weights by always settling the closest unsettled node, O((V + E) log V) with a heap.
  - A directed graph has a cycle exactly when depth-first search meets a node that is still on the current path.
sections:
  - title: Choosing a representation
    body: |-
      Before any algorithm, decide what the edges mean and how you'll store them. Three
      questions settle most of it. Are edges **directed** (a follows b) or **undirected** (a
      and b are friends)? Do they carry a **weight**, such as minutes or cost? And is the
      graph **sparse**, with far fewer edges than V², or **dense**?

      - An **edge list** is an array of pairs. It's how graphs often arrive, from a CSV or a
        join table, and it's compact, but finding a node's neighbours means scanning it all.
      - An **adjacency list** maps each node to its neighbours. Memory is O(V + E), and
        visiting a node's neighbours costs its degree. It's the default.
      - An **adjacency matrix** is a V by V grid. Checking one edge is O(1), but memory is
        O(V²) and listing neighbours costs O(V). It fits small dense graphs.

      Converting an edge list is the first thing most graph code does. For an undirected
      graph, add each edge both ways.

      ```ts
      type Graph = Map<string, string[]>;

      function fromEdges(edges: [string, string][], directed: boolean): Graph {
        const graph: Graph = new Map();
        const link = (from: string, to: string) => {
          if (!graph.has(from)) graph.set(from, []);
          if (!graph.has(to)) graph.set(to, []);
          graph.get(from)?.push(to);
        };
        for (const [a, b] of edges) {
          link(a, b);
          if (!directed) link(b, a);
        }
        return graph;
      }

      const friends = fromEdges([['ana', 'ben'], ['ben', 'cy'], ['ana', 'dee']], false);
      console.log(friends.get('ana'), friends.get('cy')); // [ 'ben', 'dee' ] [ 'ben' ]
      ```

      A `Map` is better than a plain object for node keys you don't control, because names
      like `constructor` or `__proto__` collide with object properties. Register every node,
      even ones with no outgoing edges, or an isolated node vanishes from the graph.
  - title: Paths, depth-first order and components
    body: |-
      The lesson's breadth-first search returns a hop count. To return the route itself,
      record which node you came from when you first reach each one, then walk those links
      back from the target. The same map doubles as the seen set.

      ```ts
      type Graph = Map<string, string[]>;

      function shortestPath(graph: Graph, from: string, to: string): string[] | null {
        const cameFrom = new Map<string, string | null>([[from, null]]);
        const queue = [from];
        for (let head = 0; head < queue.length; head++) {
          const current = queue[head] as string;
          if (current === to) {
            const path: string[] = [];
            for (let at: string | null = to; at !== null; at = cameFrom.get(at) ?? null) path.push(at);
            return path.reverse();
          }
          for (const next of graph.get(current) ?? []) {
            if (!cameFrom.has(next)) {
              cameFrom.set(next, current);
              queue.push(next);
            }
          }
        }
        return null;
      }

      function dfs(graph: Graph, start: string): string[] {
        const seen = new Set<string>();
        const order: string[] = [];
        function visit(node: string): void {
          seen.add(node);
          order.push(node);
          for (const next of graph.get(node) ?? []) {
            if (!seen.has(next)) visit(next);
          }
        }
        visit(start);
        return order;
      }

      const tube: Graph = new Map([
        ['Ash', ['Birch', 'Cedar']],
        ['Birch', ['Ash', 'Dale']],
        ['Cedar', ['Ash', 'Dale']],
        ['Dale', ['Birch', 'Cedar', 'Elm']],
        ['Elm', ['Dale']],
        ['Fern', []],
      ]);
      console.log(shortestPath(tube, 'Ash', 'Elm')); // [ 'Ash', 'Birch', 'Dale', 'Elm' ]
      console.log(shortestPath(tube, 'Ash', 'Fern')); // null
      console.log(dfs(tube, 'Ash')); // [ 'Ash', 'Birch', 'Dale', 'Cedar', 'Elm' ]
      ```

      Notice the recursive order differs from the lesson's stack version, which gave Ash,
      Cedar, Dale, Elm, Birch. Both are valid depth-first orders: a stack pops the last
      neighbour pushed, so it explores neighbours in reverse. Push them in reverse if the
      order matters. Recursion is clearer, but each level is a stack frame, so a path
      thousands of nodes long can throw `RangeError: Maximum call stack size exceeded`. An
      explicit stack avoids that.

      Counting **connected components** in an undirected graph is a loop around either
      search: start a traversal from every node not yet seen, and count the starts. Here Fern
      makes a second component. Grid problems, such as counting islands on a map, are the
      same algorithm with the four neighbouring cells as edges.
  - title: Topological sort with Kahn's algorithm
    body: |-
      **Kahn's algorithm** counts, for each task, how many needs it's still waiting on. Tasks
      at zero are ready. Run one, lower the count of everything that needed it, and add any
      task that reaches zero. If tasks remain but none is ready, they form or wait on a cycle.

      ```ts
      type Needs = Record<string, string[]>;

      function buildOrder(needs: Needs): string[] {
        const waitingOn = new Map<string, number>();
        const neededBy = new Map<string, string[]>();
        for (const [task, deps] of Object.entries(needs)) {
          waitingOn.set(task, deps.length);
          for (const dep of deps) neededBy.set(dep, [...(neededBy.get(dep) ?? []), task]);
        }
        const ready = [...waitingOn].filter(([, n]) => n === 0).map(([task]) => task);
        const order: string[] = [];
        for (let head = 0; head < ready.length; head++) {
          const task = ready[head] as string;
          order.push(task);
          for (const next of neededBy.get(task) ?? []) {
            const left = (waitingOn.get(next) as number) - 1;
            waitingOn.set(next, left);
            if (left === 0) ready.push(next);
          }
        }
        if (order.length < waitingOn.size) {
          const stuck = [...waitingOn].filter(([, n]) => n > 0).map(([task]) => task);
          throw new Error(`cycle among: ${stuck.join(', ')}`);
        }
        return order;
      }

      console.log(buildOrder({ deploy: ['bundle', 'test'], bundle: ['compile', 'test'], test: ['compile'], compile: ['install'], install: [] }));
      // [ 'install', 'compile', 'test', 'bundle', 'deploy' ]
      try {
        buildOrder({ a: ['b'], b: ['c'], c: ['a'], lint: [] });
      } catch (error) {
        console.log((error as Error).message); // cycle among: a, b, c
      }
      ```

      Everything in `ready` at the same time could run in parallel, which is how build tools
      schedule work across cores.
  - title: Naming the cycle with depth-first search
    body: |-
      Kahn's algorithm says a cycle exists, but a good error names it. Depth-first search
      does that with three states per node: unvisited, **in progress** (on the current path)
      and done. An edge into a node that's in progress closes a loop.

      ```ts
      type Needs = Record<string, string[]>;

      function findCycle(needs: Needs): string[] | null {
        const state = new Map<string, 'visiting' | 'done'>();
        const path: string[] = [];
        function visit(task: string): string[] | null {
          state.set(task, 'visiting');
          path.push(task);
          for (const dep of needs[task] ?? []) {
            if (state.get(dep) === 'visiting') return [...path.slice(path.indexOf(dep)), dep];
            if (state.get(dep) === undefined) {
              const cycle = visit(dep);
              if (cycle) return cycle;
            }
          }
          path.pop();
          state.set(task, 'done');
          return null;
        }
        for (const task of Object.keys(needs)) {
          if (state.get(task) === undefined) {
            const cycle = visit(task);
            if (cycle) return cycle;
          }
        }
        return null;
      }

      console.log(findCycle({ app: ['auth', 'db'], auth: ['db'], db: [] })); // null
      console.log(findCycle({ app: ['auth'], auth: ['session'], session: ['auth'] }));
      // [ 'auth', 'session', 'auth' ]
      ```

      Two states aren't enough in a directed graph. In the first example `db` is reached
      twice, through `app` and through `auth`, and that's a shared dependency, not a cycle.
      Only a node still on the path counts. In an undirected graph the rule differs: a seen
      neighbour that isn't the node you came from means a cycle.
  - title: Weighted paths with Dijkstra
    body: |-
      Breadth-first search counts edges. When edges have costs, the fewest hops can be the
      slowest route. **Dijkstra's algorithm** keeps a best-known distance for each node. It
      repeatedly **settles** the closest node not yet settled, then **relaxes** its edges:
      if going through it gives a neighbour a shorter distance, it records that.

      ```ts
      type Weighted = Record<string, [string, number][]>;

      // This version scans for the closest node, O(V²). A heap makes it O((V + E) log V).
      function dijkstra(graph: Weighted, source: string): Record<string, number> {
        const dist: Record<string, number> = { [source]: 0 };
        const settled = new Set<string>();
        while (true) {
          let current: string | null = null;
          for (const [node, d] of Object.entries(dist)) {
            if (!settled.has(node) && (current === null || d < (dist[current] as number))) current = node;
          }
          if (current === null) return dist;
          settled.add(current);
          for (const [next, weight] of graph[current] ?? []) {
            const candidate = (dist[current] as number) + weight;
            if (candidate < (dist[next] ?? Infinity)) dist[next] = candidate;
          }
        }
      }

      // Minutes between stations. The direct Ash to Elm line is slow.
      const minutes: Weighted = {
        Ash: [['Birch', 4], ['Cedar', 1], ['Elm', 12]],
        Birch: [['Dale', 1]],
        Cedar: [['Birch', 2], ['Dale', 6]],
        Dale: [['Elm', 3]],
        Elm: [],
      };
      console.log(dijkstra(minutes, 'Ash'));
      // { Ash: 0, Birch: 3, Cedar: 1, Elm: 7, Dale: 4 }
      ```

      The direct line to Elm costs 12, but Ash, Cedar, Birch, Dale, Elm costs 7. Birch
      itself shows relaxation at work: its first estimate is 4, then settling Cedar lowers it
      to 3.

      Why it's correct: take the closest unsettled node. Any other route to it passes
      through a node that's at least as far away. With non-negative weights, the rest of
      that route can only add cost. A **negative weight** breaks that argument,
      so use Bellman-Ford there, which is O(V × E) and also detects negative cycles.

      With a heap, push `[distance, node]` whenever a distance improves, and when you pop an
      entry whose distance is larger than the recorded one, skip it as stale. That's the
      standard version. **A\*** adds an estimate of the remaining distance to each priority,
      such as the straight-line distance on a map, so it explores towards the target first.
pitfalls:
  - '**Forgetting the seen set.** It works on trees and chains, then loops for ever on the first cycle. Mark a node when you first queue it, not when you take it out, or it can be queued many times.'
  - '**Using BFS for weighted shortest paths.** Breadth-first search minimises edges, not cost, so a slow direct link beats a fast detour. Use Dijkstra when weights differ, and BFS only when every edge costs the same.'
  - '**Running Dijkstra with negative weights.** Settled distances can later turn out wrong, and the algorithm never revisits them. Use Bellman-Ford, or rethink the model so costs are non-negative.'
  - '**Detecting directed cycles with a single visited flag.** A node reached twice through a shared dependency looks like a cycle. Track the nodes on the current path separately from the ones that are finished.'
  - '**Recursing deep on big graphs.** Each recursive call is a stack frame, so a long chain throws `RangeError: Maximum call stack size exceeded`. Switch to an explicit stack for graphs you don''t control.'
  - '**Leaving out nodes with no edges.** Built only from edges, an adjacency list forgets isolated nodes, and a topological sort silently drops tasks with no dependencies. Register every node explicitly.'
verify:
  - lens: breaks
    check: 'Every traversal keeps a seen set and marks a node when it is queued, so cycles can''t loop for ever.'
  - lens: breaks
    check: 'Dependency graphs report a cycle clearly instead of hanging or silently dropping tasks.'
  - lens: confuses
    check: 'Shortest paths use BFS only when every edge costs the same, and Dijkstra when weights differ.'
  - lens: tests
    check: 'Graph code is tested on a cycle, an isolated node and a long chain, as well as the happy tree.'
interview:
  - question: When would you use breadth-first search versus depth-first search?
    answer: >-
      I use breadth-first search when I need the fewest edges, and depth-first search when I
      need to explore structure. BFS uses a queue and visits nodes in order of distance, so
      the first time it reaches a node is by a shortest unweighted path. That fits "degrees
      of separation", the fewest moves in a puzzle, or the nearest matching item. DFS uses a
      stack or recursion and goes deep first, which fits cycle detection, topological sort,
      connected components and backtracking searches. Both are O(V + E) time. Memory differs
      with shape: BFS holds a whole frontier, which can be huge on a wide graph, while DFS
      holds one path, which can be deep. Neither handles weighted edges, where I'd switch to
      Dijkstra.
  - question: How does a package manager or build tool decide the order to run things, and what happens with a cycle?
    answer: >-
      It builds a directed graph of dependencies and computes a topological order. With
      Kahn's algorithm, it counts each task's unmet dependencies and starts with the tasks
      at zero. Each time a task finishes, it lowers the count of the tasks that need it, and
      any that reach zero become ready. Tasks that are ready at the same time can run in
      parallel. If tasks remain but none is ready, there's a cycle, and no valid order
      exists. A good tool then names the cycle, which a depth-first search with an
      "in progress" state can find. The fix is to break the ring, often by extracting the
      shared part into its own module. Module systems tolerate import cycles, but then code
      can run before a module it imports has finished. In ES modules that throws a
      `ReferenceError` such as "Cannot access 'a' before initialization", and in CommonJS it hands over an incomplete exports
      object.
  - question: Explain Dijkstra's algorithm and its complexity.
    answer: >-
      Dijkstra finds the cheapest path from one source to every node when edge weights are
      non-negative. It keeps a tentative distance for each node, starting at zero for the
      source. It repeatedly takes the unsettled node with the smallest distance, marks it
      settled, and relaxes each outgoing edge, lowering a neighbour's distance if the route
      through this node is cheaper. With a binary heap and lazy deletion, where stale heap
      entries are skipped when popped, it runs in O((V + E) log V). Picking the minimum by a
      linear scan gives O(V²), which is fine for small dense graphs. It's correct because a
      settled node can't be reached more cheaply later when no edge is negative. With
      negative weights I'd use Bellman-Ford, and with a good distance estimate A\* explores
      fewer nodes.
  - question: How do you detect a cycle in a directed graph?
    answer: >-
      Run a depth-first search that tracks three states: unvisited, in progress and done. A
      node is in progress while it's on the current recursion path. If I follow an edge to a
      node that's in progress, I've found a back edge, which means a cycle, and the path
      from that node to here is the cycle itself. When a node's neighbours are all finished
      I mark it done, so reaching it again later is only a shared dependency. It's
      O(V + E). Alternatively, Kahn's topological sort reports a cycle when it can't place
      every node, which is simpler but doesn't say which nodes form the loop. For an
      undirected graph a simpler test works: a visited neighbour other than the parent means
      a cycle, or a union-find structure detects it while adding edges.
