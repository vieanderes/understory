id: cs.os-and-networks
title: Operating systems and networks
objective: Explain processes and threads, close file descriptors, and frame messages on a TCP byte stream.
level: advanced
minutes: 10
concepts: [cs.processes, cs.threads, cs.file-descriptors, cs.transport-protocols]
prerequisites: [cs.what-a-computer-does, backend.how-a-page-reaches-you]
opening:
  text: >-
    You'll know what the operating system gives your program, and what a network connection
    really delivers. Two classic production errors will stop being mysterious.

steps:
  - type: prose
    id: name-process-and-thread
    body: >-
      The first CS lesson called a **process** a running program with memory of its own. A
      busy site runs several copies of its server, each one a process. The operating system
      keeps them apart, so one can't touch another's memory.


      Inside a process run one or more **threads**. A thread is a path through the code with
      its own call stack. Threads of one process can share its memory.

  - type: multiple-choice
    id: pick-one-copy-dies
    concept: cs.processes
    difficulty: 1
    question: One of four server copies runs out of memory and crashes. What happens to the other three?
    choices:
      - text: They keep serving requests
        correct: true
        feedback: >-
          Right. Each process has its own memory, so one crash stays in one process.
      - text: They crash too, memory is shared
        feedback: >-
          Processes don't share memory. That separation is what keeps the other three alive.
      - text: They pause until it restarts
        feedback: >-
          Nothing ties them together. The load balancer sends traffic to the three still up.

  - type: multiple-choice
    id: pick-shared-memory
    concept: cs.threads
    difficulty: 2
    question: A service loads a 2 GB model into memory for four workers. Which setup keeps one copy?
    choices:
      - text: Four processes
        feedback: >-
          Each process has private memory. So each would load its own 2 GB copy.
      - text: Four threads in one process
        correct: true
        feedback: >-
          Right. Threads can share their process's memory, so one copy serves all four.
      - text: Either, memory is shared across the machine
        feedback: >-
          The operating system keeps processes apart on purpose. One can't read another's
          memory.

  - type: prose
    id: name-file-descriptor
    body: |-
      A process opens a file or a network connection. The operating system hands back a small
      number, a **file descriptor**. Node's `fs` module shows it:

      ```js
      import { openSync, closeSync } from 'node:fs';

      const fd = openSync('photo.png', 'r');   // 'r' to read. fd is a number, like 11
      closeSync(fd);                          // give the number back
      ```

      Each process may hold only so many. Forget to close them, and every open fails.

  - type: ai-review
    id: review-never-closes
    concept: cs.file-descriptors
    difficulty: 3
    language: js
    request: Check every uploaded image starts with the PNG signature.
    flawClass: edge-case
    code: |
      import { openSync, readSync } from 'node:fs';

      function isPng(path) {
        const fd = openSync(path, 'r');
        const start = Buffer.alloc(4);          // room for 4 bytes
        readSync(fd, start, 0, 4, 0);           // read the first 4 into it
        return start.toString('latin1') === '\x89PNG';
      }

      function checkAll(paths) {
        return paths.filter((path) => !isPng(path));
      }
    prompt: >-
      An assistant wrote this. The test folder held five images, and every answer was right.
      On a folder of 10,000, it crashed with `EMFILE: too many open files`. Tap the line at
      fault.
    lines: [4]
    reasons:
      - text: It opens a descriptor and never closes it
        correct: true
        feedback: >-
          Yes. Each call keeps one number, and the process runs out.
      - text: Four bytes is too small a buffer
        feedback: >-
          The signature check only needs the first four. The buffer is fine. Count what's left
          open after each call.
      - text: '`filter` opens all the files at once'
        feedback: >-
          `filter` calls `isPng` one path at a time. Even so, each call leaves one descriptor
          behind.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Run it over more files than the process may open
          correct: true
          feedback: >-
            Yes. Leaked descriptors only run out at volume.
        - text: Check five images give the right answers
          feedback: >-
            That's the test it passed. Five open files is far below the limit.
        - text: Check a file that isn't a PNG
          feedback: >-
            The answer would be right. The leak happens whether the file is a PNG or not.

  - type: fill-blank
    id: fill-close-descriptor
    concept: cs.file-descriptors
    difficulty: 2
    language: js
    prompt: >-
      Fix `isPng`. Close the descriptor on every path, even when the read throws. Fill the
      gaps.
    template: |
      function isPng(path) {
        const fd = openSync(path, 'r');
        {{1}} {
          const start = Buffer.alloc(4);
          readSync(fd, start, 0, 4, 0);
          return start.toString('latin1') === '\x89PNG';
        } {{2}} {
          {{3}}(fd);
        }
      }
    blanks:
      - key: '1'
        answer: try
      - key: '2'
        answer: finally
      - key: '3'
        answer: closeSync
    bank: [try, finally, catch, closeSync, openSync, return]

  - type: prose
    id: name-transport
    body: |-
      Network connections have a surprise of their own. **TCP**, the connection under HTTP,
      delivers an ordered stream of bytes. It doesn't know where one of your messages ends.
      A client wrote two chess moves, and the server's first read got both:

      ```text
      got: {"move":"e4"}{"move":"e5"}
      ```

      So programs **frame** their messages, for example by ending each with `\n`.

  - type: code-challenge
    id: write-split-messages
    concept: cs.transport-protocols
    difficulty: 3
    language: ts
    prompt: >-
      The sender ends each message with `'\n'`. Write `splitMessages(pending, chunk)`.
      `pending` is the unfinished text left from earlier chunks.


      Return `messages`, the complete ones in order, without their `'\n'`. Return `rest`,
      whatever follows the last `'\n'`. Skip empty messages.


      So `splitMessages('', 'e4\n{"mo')` is `{ messages: ['e4'], rest: '{"mo' }`.
    hints:
      - Join `pending` and `chunk` first. The leftover belongs to the front of the new bytes.
      - "Splitting on `'\\n'` gives the pieces. The last piece is always the unfinished one, even if it's empty."
      - "Start with `const parts = (pending + chunk).split('\\n');` and take the last part off as `rest`."

  - type: explain-back
    id: explain-framing
    concept: cs.transport-protocols
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A chat server over raw TCP sometimes shows two messages glued together, and sometimes
      half a message. Why, and what's the fix?
    rubric:
      - TCP delivers a stream of bytes, and keeps no record of where each write began or ended.
      - One read can hold two messages, or part of one, depending on timing and the network.
      - The sender must frame each message, with a delimiter or a length, and the receiver keeps the leftover.
    modelAnswer: >-
      TCP only promises the bytes arrive in order. It doesn't keep the edges of each `write`,
      so one read can hold two messages, or half of one. The fix is framing. The sender ends
      each message with a newline, or sends its length first. The receiver splits on that
      marker and holds on to any unfinished tail until the next bytes arrive.

recap:
  - Tell a process, with private memory, from the threads inside it that can share it.
  - Close every file and connection you open, in a `finally`, because descriptors are limited.
  - Treat TCP as a byte stream, and frame each message so the receiver can split it.

recall:
  - id: card-process-owns
    concept: cs.processes
    front: What does the operating system give each process?
    back: >-
      Its own memory, its own list of file descriptors, and at least one thread. Another
      process can't see any of it.
  - id: card-thread
    concept: cs.threads
    front: How does a thread differ from a process?
    back: >-
      A thread is a path of execution inside a process. It has its own call stack, and shares
      the process's memory with the other threads.
  - id: card-file-descriptor
    concept: cs.file-descriptors
    front: What is a file descriptor, and what happens when a process leaks them?
    back: >-
      A small integer naming an open file, socket or pipe. They're limited per process, so a
      leak ends in `EMFILE: too many open files`.
  - id: card-tcp-stream
    concept: cs.transport-protocols
    front: Why can't you treat one TCP `data` event as one message?
    back: >-
      TCP delivers an ordered stream of bytes. It may join two writes or split one, so the
      application must mark where messages end.

references:
  - kind: rfc
    title: 'RFC 9293: Transmission Control Protocol (TCP)'
    authors: W. Eddy (ed)
    year: 2022
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc9293
    note: The byte-stream service TCP offers, and the three-way handshake in section 3.5.
    primary: true
    verified: true
  - kind: rfc
    title: 'RFC 8446: The Transport Layer Security (TLS) Protocol Version 1.3'
    authors: E. Rescorla
    year: 2018
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc8446
    note: The one-round-trip handshake in section 2, and resumption with early data.
    primary: true
    verified: true
  - kind: rfc
    title: 'RFC 9000: QUIC: A UDP-Based Multiplexed and Secure Transport'
    authors: J. Iyengar and M. Thomson (eds)
    year: 2021
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc9000
    note: How QUIC combines the transport and cryptographic handshakes, and keeps streams independent.
    verified: true
  - kind: book
    title: 'Operating Systems: Three Easy Pieces'
    authors: R. H. Arpaci-Dusseau and A. C. Arpaci-Dusseau
    venue: Arpaci-Dusseau Books
    url: https://pages.cs.wisc.edu/~remzi/OSTEP/
    note: Chapters 4 and 26 on processes and threads, and chapter 39 on files and descriptors. Free online.
    verified: true

deepDive: >-
  The process and descriptor outputs are from Node 24 on macOS. Descriptors 0, 1 and 2 are
  always standard input, output and error. Node had opened a few more for itself, so our
  first `openSync` returned 11. Node raises its own soft limit at start, so the `EMFILE` run
  used a container capped at 256 descriptors. It failed after 239 opens. Sockets count too,
  which is why a descriptor leak shows up as a server that can't accept connections.


  The two writes arrived as one chunk on both of our runs. That's a loopback connection with
  tiny writes, and it isn't promised either way. Across a real network, one large write can
  arrive as several chunks. Framing, by a delimiter or a length prefix, is the only safe
  assumption. HTTP does it for you, with `Content-Length` and chunked encoding.


  TCP's handshake is SYN, SYN-ACK, ACK. The client can send data with that last ACK, so it
  costs one round trip. TLS 1.3 needs one more, and TLS 1.2 needed two. `curl -v` against
  example.com reported "SSL connection using TLSv1.3" and HTTP/2 here. Our curl was built
  without HTTP/3, so what this lesson says about QUIC rests on RFC 9000, not a run.


  QUIC's other gain is head-of-line blocking. On TCP, one lost packet stalls every HTTP/2
  stream behind it, since TCP must deliver bytes in order. QUIC orders each stream
  separately. Returning visitors can also resume with zero round trips, at some replay
  risk, which RFC 8446 section 8 discusses.


  Shared memory between threads isn't free. Two threads writing one value bring back every
  race, as the next chapter shows. That's why Node copies messages between worker threads by
  default, and offers `SharedArrayBuffer` and `Atomics` only when you ask.
