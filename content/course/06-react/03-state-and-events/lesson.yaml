deepDive: >-
  **When the called handler sets state.** `onClick={setOpen(true)}` sets state while
  rendering. That renders again, which sets state again. React stops the loop with a
  "Too many re-renders" error.


  **The console helps.** In development React also warns that it "detected a change in the
  order of Hooks". A table shows each render's hooks side by side. The row where they
  differ is your bug.


  **Linting.** The `eslint-plugin-react-hooks` package checks the rules of hooks as you
  type. It finds hooks by their `use` prefix, which is why the name matters.
