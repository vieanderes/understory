deepDive: >-
  **Tests that test the tests.** The challenge ran your tests against broken versions of
  `triage`. That's **mutation testing**: if a test still passes when the code is wrong, it
  isn't checking much. Tools such as `mutmut` do it for a whole project.


  **Built-in fixtures.** `tmp_path` gives a fresh folder, `monkeypatch` swaps an attribute
  or an environment variable for one test, and `capsys` captures printed output. A fixture
  with `scope="session"` is built once for the whole run. For async code, `pytest-asyncio`
  or `anyio` lets a test be `async def`.


  **A spelling trap.** A misspelt `@pytest.mark.parameterize` fails loudly at collection.
  The quiet failure is a table with no row on the boundary.
