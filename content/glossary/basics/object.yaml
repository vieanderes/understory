term: object
aka: [JavaScript object, object literal]
short: A group of related values stored under names, like a task's title, due date and status.
explain: |
  One task has several details: a title, a due date, whether it's done. An object keeps them
  together in curly brackets, each under a name called a property:
  `{ title: "Wash up", done: false }`.

  You read a property with a dot, `task.title`, and change it the same way. Misspell the
  name and you get `undefined`, not an error. When a value looks wrong, print the whole
  object to see the real names.
analogy: A contact card on your phone. One card, with a labelled field for each detail.
example:
  language: js
  code: |
    const task = { title: "Wash up", done: false };
    console.log(task.title); // Wash up
    task.done = true;
    console.log(task);       // { title: 'Wash up', done: true }
usage: Pass the whole task object into the function instead of five separate arguments.
twin:
  term: array
  difference: An object holds one thing's details under names, read with a dot. An array holds many things in order, read by position.
related: [array, variable, json, destructuring]
level: 1
lessons: [basics.objects]
