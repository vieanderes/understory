deepDive: >-
  Tailwind finds classes by scanning text, not by running code. A name built at run time,
  like `` `bg-${tone}` ``, never appears whole in a file, so no rule is made. Write the full
  names out and choose between them.


  A theme can clear a whole namespace: `--color-*: initial` removes every default colour, so
  `bg-blue-500` makes nothing and only your own colours exist. An off-system colour then
  shows up as a missing style instead of a quiet success.


  When a component accepts extra classes from its caller, two paddings can clash, as in
  `p-4 p-2`. Which wins depends on the order of the rules in the generated CSS, not in the
  class list. The `tailwind-merge` library resolves such clashes so the caller's class wins.


  `@apply` bundles utilities into one CSS class. It's handy for styling content you don't
  write, like HTML from a CMS. For your own markup, a component is usually the better tool.
