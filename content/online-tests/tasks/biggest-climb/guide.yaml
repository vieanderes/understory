approach: >-
  The best climb that ends at a reading always starts at the lowest reading before it. So
  walk the readings once and remember two things: the lowest reading so far, and the best
  climb so far. Each new reading either becomes the new low point or is a candidate climb
  from the current low point.
complexity: O(N) time, O(1) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll down first. **N up to 400,000** and **efficient** rule out comparing every pair
      of readings: that is tens of billions of checks. You need one pass.

      Note that N can be 0. An empty array must return 0, not crash.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in your own words at the top of the file. The key detail is that the low point
      must come before the high point. If your line says that, you have understood it.
    code:
      ts: |-
        // Return the largest A[Q] - A[P] with P < Q, or 0 if the readings never rise.
      python: |-
        # Return the largest A[Q] - A[P] with P < Q, or 0 if the readings never rise.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      These are the inputs that break a quick solution:

      - no readings, and a single reading;
      - readings that only fall, or stay level;
      - the highest reading comes before the lowest, so max minus min is wrong.

      Put them in test-input.txt now.
    input:
      - "[]"
      - "[0]"
      - "[8, 3]"
      - "[5, 5]"
      - "[100, 900, 50, 300]"
  - kind: plan
    title: Remember the lowest point so far
    minutes: 2
    body: |-
      For a climb ending at reading Q, the best start is the lowest reading before Q. You do
      not need to look back: carry that low point with you as you walk forward.

      Plan: one loop, a running minimum and a running best. The last edge case shows why
      the global maximum minus the global minimum fails.
  - kind: ask-ai
    title: Ask a syntax question for the starting value
    minutes: 1
    body: |-
      The running minimum needs a start value that every reading beats. Asking for the right
      constant is a narrow syntax question. It is not asking for the solution.
    prompt: >-
      One line each: in TypeScript, can I start a running minimum at Infinity and compare
      integers against it, and what is the Python equivalent?
    expect: "Yes, Infinity works in TypeScript. In Python use float('inf'), or None with a check."
  - kind: write
    title: Write the solution yourself
    minutes: 4
    body: |-
      It is a handful of lines, so type it yourself. Update the low point first, then check
      the climb. The empty array needs no special case: the loop never runs and best stays
      0.
    code:
      ts: |-
        // Return the largest A[Q] - A[P] with P < Q, or 0 if the readings never rise.
        // The best climb ending at a reading starts at the lowest reading before it, so one
        // pass that remembers the lowest point so far is enough: O(N) time, O(1) space.
        function solution(A: number[]): number {
          let lowest = Infinity;
          let best = 0;
          for (const altitude of A) {
            if (altitude < lowest) lowest = altitude;
            else if (altitude - lowest > best) best = altitude - lowest;
          }
          return best;
        }
      python: |-
        # Return the largest A[Q] - A[P] with P < Q, or 0 if the readings never rise.
        # The best climb ending at a reading starts at the lowest reading before it, so one
        # pass that remembers the lowest point so far is enough: O(N) time, O(1) space.
        def solution(A):
            lowest = None
            best = 0
            for altitude in A:
                if lowest is None or altitude < lowest:
                    lowest = altitude
                elif altitude - lowest > best:
                    best = altitude - lowest
            return best
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. The three examples must say OK. Then read the returned value for
      each of your cases against the rule.
    expect: >-
      Three OKs, then 0 for the empty, single, falling and level cases, and 800 for the case
      where the peak comes first.
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Generating varied inputs is a good job for the assistant. Keep the answers for
      yourself: you check each result against the rule.
    prompt: >-
      Give me 5 test inputs for solution(A), one per line, in the format [320, 280, 410].
      Cover values at 0 and 200000, a steady rise, a new low point late in the array and a
      zigzag. Inputs only, no answers and no code.
    expect: Five lines to paste into test-input.txt. Run again and check each result.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for a list of problems, not a rewrite. The code stays yours, and you learn what
      you missed.
    prompt: >-
      Review my current solution for correctness on empty and one-element arrays, and for
      time complexity. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time and O(1) space.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output: printing inside a loop over 400,000 readings is slow. Check
      the header comment states the complexity. Then submit.
