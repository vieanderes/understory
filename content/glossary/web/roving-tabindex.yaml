term: roving tabindex
aka:
  - roving focus
  - one tab stop
short: A pattern where a group of controls takes one Tab press, and arrow keys move between them.
explain: |
  A row of twelve tabs shouldn't take twelve Tab presses to get past. Keyboard users
  expect a group to be one stop, with arrow keys inside it.

  So only the active item has `tabindex="0"`. The rest have `tabindex="-1"`. Arrow keys
  move focus and swap the values, so the zero roves with the focus.

  Tabs, toolbars, radio groups and menus all work this way. Native radio buttons already
  do, which is a good reason to use them.
analogy: A single door into a gallery. Once inside, you stroll between rooms without going out again.
example:
  language: html
  code: |
    <div role="tablist">
      <button role="tab" tabindex="0" aria-selected="true">Details</button>
      <button role="tab" tabindex="-1" aria-selected="false">Reviews</button>
      <button role="tab" tabindex="-1" aria-selected="false">Sizes</button>
    </div>
usage: Use a roving tabindex on the tab list, so Tab moves on to the panel.
related:
