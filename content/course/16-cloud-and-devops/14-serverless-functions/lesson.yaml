deepDive: >-
  The timings are real, from the AWS Lambda Node 22 image (`public.ecr.aws/lambda/nodejs:22`,
  Node 22.23) and its runtime interface emulator on a laptop. Timed with `curl -w
  '%{time_total}'`, the first call took 1.59 s and the next two 0.026 s and 0.034 s. The
  emulator's log agreed: an init of 1275 ms, then 4 ms of handler time. A real platform also
  fetches your code and starts a sandbox, so cold starts vary.


  For the timeout we set `AWS_LAMBDA_FUNCTION_TIMEOUT=3` and a handler that waited 5 s,
  standing in for a model call. The reply was `Task timed out after 3.00 seconds`, billed
  3000 ms. With the limit at 30 s it returned the summary. Streaming the model's answer
  helps the user too, since the first words arrive long before the last.


  The spike was real: PostgreSQL 17.11 with `max_connections = 50`, and 200 clients started at
  once from Node 24 with `pg` 8, each keeping its connection. 50 connected and 150 got "sorry,
  too many clients already". It fails fast rather than slowly. Connecting per call cost
  301.5 ms on average over 200 calls, most of it password hashing in the handshake, against
  0.86 ms per query on one kept connection.


  A pooler such as PgBouncer in `transaction` mode lends a real connection for one
  transaction only, so a thousand instances can share ten. Its price, as the databases
  chapter said, is that session state doesn't survive between transactions. Managed hosts
  sell the same thing as a pooled connection string.


  Pricing is per request plus duration times memory, often quoted in GB-seconds. Other
  platforms differ on limits, so read yours.
