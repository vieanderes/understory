deepDive: >-
  **Step caps are the minimum.** Production agents also cap spend in tokens. They stop when the
  same tool is called with the same input twice. And they ask a person before anything
  that can't be undone. Chapter 21's agent harness lesson covers these.


  **The SDK's tool runner** runs this loop for you and can stream each turn. Writing it by
  hand once is how you learn to debug it.


  **for and else.** The review's fix uses `for ... else`: the `else` runs only when the
  loop finished without `break`, here meaning every step was used up.
