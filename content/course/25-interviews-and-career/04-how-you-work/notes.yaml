summary: |-
  Every AI engineering loop asks, in some form, how you work. Three questions come up again and again: how you use AI coding tools, what you'd need to ramp up on, and what's changed lately in the field. They sound like conversation. They're scored like any other answer: specific evidence from your own work beats opinion every time.

  The interviewer's real worry behind the AI tools question is quality. They want to know that code you ship is correct and that you understand it, however it was written. A strong answer names what you hand over, how you check it with tests you trust, and that you own the result, including design.

  The ramp-up and "what's changed" questions test self-awareness and judgement. Name one real gap with a concrete plan, and one change you've used with its catch. These notes give no scripts. They add the workflow worth describing, how to build each answer from your own work, examples of changes with their catch, and how to behave in a round where you code with an assistant.
remember:
  - An answer about AI tools covers what you hand over, how you check it, and that you own correctness and design.
  - Tests written by the same agent that wrote the code share its misunderstanding, so write or check the key test cases yourself.
  - The strongest AI example is one where your checks caught the tool's mistake, because it proves the checking loop exists.
  - A ramp-up answer names one real gap, what carries over, and a concrete step with a timeframe, never "nothing" and never "I'd read up on it".
  - Answer "what's changed?" with one change you've used, what it changed in your work, and the catch it brought, since tool names date within months.
  - In an AI-assisted round, say your plan before you prompt, ask in pieces you can review, run the tests, and fix small things by hand.
  - Ask for each round whether AI tools are allowed, because some companies forbid them and others expect them.
sections:
  - title: The AI-assisted workflow worth describing
    body: |-
      Interviewers want to hear a loop, not a slogan. Describe your own, and check it covers these steps, each with its reason:

      - **Plan first, in your own words.** Before prompting, write what the change must do and the edge cases. The plan is the spec you judge the output against.
      - **Write the key tests yourself.** The boundary cases (empty input, the last page, a permission denied) come from you. The tool can add more, but the ones that define correctness are yours.
      - **Hand over bounded pieces.** A handler, a migration draft, test scaffolding, a script to explore an unfamiliar API. Small enough that you can read every line of the diff.
      - **Read every diff.** Look for invented APIs, silently widened permissions, swallowed errors and changed behaviour outside the task.
      - **Run the real checks.** Types, linting, the full test suite, and a manual try of the unhappy path. A tool's claim that something passes counts only once you've seen it pass.
      - **Fix small things by hand.** A one-character bug is faster to fix than to describe, and fixing it keeps you close to the code.
      - **Own the result.** In review, you explain the design as yours. If you can't explain a line, it doesn't ship.

      The trade-off to mention: this is slower than accepting whatever the agent produces, but faster than debugging production. For throwaway exploration you relax it, and you say so.
  - title: Two AI examples to prepare from your own work
    body: |-
      Prepare two examples: one where a tool saved real time, and one where your checks caught its mistake. The second is the stronger, because it proves the checking loop exists.

      **The time-saver** needs four beats: a concrete, repetitive task (a migration across many files, say), what you did by hand first to set the pattern, how you checked the tool's batches, and the time it took against your estimate. The best versions include a mistake your checks caught along the way.

      **The catch** needs four beats: what you asked for, why the output looked right (clean code, passing tests), which of *your* checks found the problem, and the lasting change to how you work. Permission checks, pagination and date handling are common places a tool's own tests agree with its bug.

      **What interviewers listen for:** a task specific enough to picture, a number, what you did yourself, and a habit that changed. **Avoid** examples where the tool did everything and you only watched, and examples you can't explain line by line.
  - title: Building a ramp-up answer
    body: |-
      A ramp-up answer shows you've studied their stack, you know yourself, and you learn on purpose. It has three parts:

      - **The gap**, named precisely and taken from their posting or engineering blog: an orchestration platform, a language, a regulated domain.
      - **What carries over**: the concepts you already use daily that apply there. Containers and gradual roll-outs carry over to most platforms; HTTP services and testing carry over between languages; permission-aware data handling carries over between domains.
      - **A concrete plan with a time**, such as pairing on the first few deploys in week one, or taking small bug fixes first to learn the team's idioms from review.

      Then turn it round with a question: what do new starters usually find hardest in the first month?

      **Avoid** "nothing", which sounds like you haven't looked, "I'd read up on it", which is no plan, and naming a gap in the core skill of the role.
  - title: What's changed, with the catch
    body: |-
      Pick one change you've used, say what it changed in your work, and give the catch. These examples reflect 2026; the list will differ next year, and the shape won't.

      - **Models call tools reliably.** An assistant can look up live data through a tool instead of having it pasted into the prompt. The catch: every tool is a new way in for prompt injection, so read tools are scoped to the caller and write tools need confirmation.
      - **Shared tool protocols.** Exposing an internal service through the Model Context Protocol lets several assistants use it without custom glue. The catch: access control becomes the hard part, because every connected client inherits what the server can reach.
      - **Evals in CI.** Prompt and model changes are gated on an eval set, like unit tests. The catch: the set goes stale unless real questions are added, and LLM-judge scores need spot-checking against people.
      - **Cheaper small models.** Routing simple questions to a small model cuts cost. The catch: a router is one more thing to monitor, and its mistakes are silent unless you sample them.
      - **Longer context windows.** Whole documents can go in the prompt for some tasks. The catch: cost and latency grow with every token, and models can miss facts buried in a long context.

      Use only one you've really worked with, and put your own result in the middle.
  - title: In a round where you code with an assistant
    body: |-
      Some companies now run a coding round with an AI assistant switched on. **What they're really watching** is whether you stay in charge of the code.

      - Ask first whether tools are allowed, and which.
      - Say your plan out loud before you prompt, so they hear your thinking, not the tool's.
      - Ask for small pieces you can read in full, and read them aloud as you check.
      - Run the tests after every change, and add an edge case of your own.
      - Fix small bugs by hand rather than re-prompting.

      **Avoid** pasting the whole task into the assistant and waiting, and keeping any line you can't explain.
pitfalls:
  - >-
    **"I let the agent write most of it."** It suggests nothing checks the output. Describe
    the loop: what you hand over, what you check, and that you own the result.
  - >-
    **"I don't use them, they make mistakes."** Most teams use them now, and the answer
    sounds like a refusal to adapt. Say how you'd catch the mistakes instead.
  - >-
    **Trusting tests from the same agent.** They share its misunderstanding and pass while
    the code is wrong. Write the defining test cases yourself.
  - >-
    **"Nothing" as a ramp-up answer.** It sounds like you haven't looked at their stack.
    Name one real gap and a plan with a timeframe.
  - >-
    **A list of tool names for "what's changed".** It dates fast and shows no judgement.
    One change you've used, with its catch, says more.
  - >-
    **Prompting your way out in an AI-assisted round.** Interviewers watch whether you
    understand the code. Read it, fix small bugs by hand, and explain every line you keep.
interview:
  - question: How do you use AI coding tools in your work?
    answer: |-
      **What they're really asking:** is the code you ship correct, and do you understand it, however it was written?

      **How to answer:** lead with a one-sentence principle, such as using tools for bounded pieces you can review in full while owning everything that ships. Then three specifics from your own work: what you hand over, how you check it (your own key tests, reading every diff, the full suite), and a real example of a catch. Close with the trade-off: where you relax the checks, such as throwaway exploration, and where you use the tool less, such as security-sensitive code.

      **Avoid** "the agent writes most of it" with no checking loop, and blanket refusal to use tools.
  - question: How do you make sure AI-generated code is correct?
    answer: >-
      The same way I make sure any code is correct: evidence I trust, not the author's
      confidence. I define correctness before generating anything, by writing the key tests
      myself, including the unhappy paths. I read the diff looking for the typical failures:
      APIs that don't exist, error handling that swallows exceptions, permissions quietly
      widened, behaviour changed outside the task. Then types, linting, the full test suite,
      and a manual run of the edge case. If I can't explain a line in review, it doesn't
      ship. The limit is that tests only cover what I thought of, so for risky areas I also
      ask a colleague to review with fresh eyes.
  - question: What would you need to ramp up on if you joined us?
    answer: |-
      **What they're really asking:** have you studied our stack, do you know your own gaps, and do you learn on purpose?

      **How to answer:** name one real gap from their stack, then what carries over from your experience, then a concrete plan with a time, such as pairing on deploys in the first week. Finish by asking what new starters usually find hardest in the first month; the answer tells you what to study before day one.

      **Avoid** claiming no gaps, which sounds unprepared, and naming a gap in the core skill of the role.
  - question: What's changed recently in AI engineering that has affected your work?
    answer: |-
      **What they're really asking:** do you keep up by doing, and do you think about risk, not only novelty?

      **How to answer:** one change, in four beats. The change, in a sentence. What you built or changed with it. What it did to your work, with a number if you have one. The catch it brought and how you handle it. Tool calling, evals in CI and model routing all fit this shape, each with its own catch.

      **Avoid** a list of framework names, which dates in months, and a change you've only read about, since the first follow-up exposes it.
  - question: Tell me about a time an AI tool led you in the wrong direction.
    answer: |-
      **What they're really asking:** does your process catch a confident mistake, or do you trust the tool's word?

      **The structure:** STAR, short.

      - Situation and task: what you asked the tool for.
      - What went wrong: why the output looked right, such as passing tests the tool wrote itself.
      - Action, in "I": which of your checks caught it, and how you fixed it.
      - Result and lesson: the habit you changed, such as writing edge-case tests before generating code.

      **Avoid** a story where a user or a colleague found the bug, unless the lesson is the check you added, and blaming the tool. The point to land is that the tool's confidence isn't evidence.
  - question: How do you keep up with such a fast-moving field?
    answer: |-
      **What they're really asking:** do you have a way of learning that filters noise, or do you chase every release?

      **How to answer:** describe a narrow habit you really have, then show how you test things before believing them. Good elements: reading the release notes of the providers and libraries you depend on, trying a change on a small real problem such as your eval set, keeping a note of what you tried and what happened, and following a few practitioners who publish measurements. Name the trade-off: you ignore most new tools until they've lasted a few months.

      **Avoid** a reading list with nothing you've tried, and claiming you keep up with everything.
terms:
  - term: AI-assisted coding
    say: Letting the AI write the code.
    means: You plan, hand over pieces small enough to review, check them with tests you trust,
      and own the correctness and design of whatever ships, however it was written.
  - term: Verification loop
    say: Reading the AI's code carefully.
    means: "Checks that run whatever the source: tests you wrote or reviewed, types, linting and
      a run of the real thing. The strongest evidence is a time the loop caught the tool's
      mistake."
  - term: Ramp-up plan
    say: "\"I'd read up on it.\""
    means: One real gap you name, what carries over from your experience, and a concrete step
      with a timeframe, such as shipping a small change in the first two weeks.
  - term: Ownership
    say: Being responsible for your own tickets.
    means: Answering for the correctness and consequences of the code you ship, including code a
      tool wrote. "The AI wrote it" is never an answer in review.
