term: service worker
aka:
  - sw.js
short: A browser script, apart from any page, that intercepts a site's requests and can answer from a cache.
explain: |
  Open a normal website on a train with no signal and you get the browser's offline page.
  The site had no say.

  A service worker gives it one. Once registered, it sits between the pages and the network.
  Every request in its scope passes through it. It decides whether to answer from the cache, the
  network, or both. That is how a site keeps working offline and loads instantly on
  a second visit.

  Two traps. Its scope is the folder it's served from, so `sw.js` in a subfolder controls only
  that subfolder. And a buggy worker keeps serving old files until it's replaced, so plan how
  updates take over.
analogy: A receptionist who answers routine questions from a folder instead of phoning head office every time.
example:
  language: js
  code: |
    self.addEventListener('fetch', (event) => {
      event.respondWith(
        caches.match(event.request).then((hit) => hit ?? fetch(event.request)),
      );
    });
usage: The service worker is still serving last week's bundle; bump its version so the new one takes over.
