deepDive: >-
  `pg.Pool` keeps a few open connections and lends one to each query, because opening a
  connection is slow. The scaling lesson returns to pools.


  When the ids come from somewhere else, you can still avoid N+1 without a join:
  `SELECT id, name FROM authors WHERE id = ANY($1)` with one array of ids. GraphQL servers
  batch lookups this way, with a helper called a data loader.


  Parameters cover values, not names. A column or table name chosen by the user can't be a
  `$1`. Pick it from a fixed list in code: `const column = allowed.includes(sort) ? sort :
  "created_at"`.


  An AI assistant writing SQL for you is a great time to check this. Models often reach for a
  template string because it's shorter, and a test with normal input will pass.
