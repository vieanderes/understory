deepDive: >-
  A label can also sit apart from its box. Give the box an `id`, and point the label at it
  with `for`: `<label for="email">Email</label>`. It works the same as wrapping.


  Some boxes add nothing to the data even with a `name`: a `disabled` box, a checkbox that
  isn't ticked, and every button except the one that was clicked. A ticked checkbox sends
  `on` unless you give it a `value`.


  An empty box that isn't `required` skips its other checks. An optional email box left
  empty passes.


  A GET form throws away any `?` part already in its `action` and puts its own pairs there.
  A POST form keeps it. To send a fixed value with a GET form, use
  `<input type="hidden" name="floor" value="2">`.


  Browser checks help the person filling in the form. They're never a defence. Anyone can
  send a request without your page, so the server checks everything again.


  Pressing Enter in a box also clicks the form's first submit button. That's another way a
  stray button can send a form.
