term: temporal dead zone
aka:
  - TDZ
short: The lines before a `let` or `const` declaration, where the name is reserved but reading it throws.
explain: |
  A `let` or `const` name is reserved from the top of its block. Until the line that
  declares it runs, touching it throws a `ReferenceError`.

  That's on purpose. With `var` you'd quietly get `undefined` and carry on with a wrong
  value. The error points at the real problem: you used something before you made it.
analogy: A reserved table in a restaurant. It's there with your name on it, but you can't sit down until you arrive.
example:
  language: js
  code: |
    {
      console.log(total); // ReferenceError
      const total = 10;
    }
usage: The ReferenceError comes from the temporal dead zone, because the handler reads the config before its const line runs.
twin:
  term: hoisting
  difference: The temporal dead zone is the gap where a hoisted `let` or `const` can't be read yet. Hoisting is the setup that creates the name in the first place.
related:
  - hoisting
  - scope
level: 3
lessons:
  - js.closures
