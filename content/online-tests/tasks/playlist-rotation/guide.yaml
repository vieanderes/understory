approach: >-
  N presses bring the playlist back to where it started, so only K mod N presses matter. A
  negative K is the same as that many presses the other way, which lands on a shift between
  0 and N − 1 once you take a non-negative remainder. Then each track moves straight to its
  final place in one pass.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Look at the ranges. **K can be a billion**, positive or negative, so you cannot press
      the button K times. **N can be 0**, which matters the moment you divide by N.

      The story itself is a rotation to the right by K places.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Naming it a rotation connects the story to a pattern you know. The reviewer sees that
      too.
    code:
      ts: |-
        // Rotate A right by K places (left for negative K) and return the new array.
      python: |-
        # Rotate A right by K places (left for negative K) and return the new array.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      - an empty playlist;
      - a single track with a negative K;
      - K of 0;
      - a negative K larger than N;
      - a huge K.
    input:
      - "([], 3)"
      - "([7], -5)"
      - "([4, 8, 1, 6], 0)"
      - "([4, 8, 1, 6], -5)"
      - "([1, 2, 3], 1000000000)"
  - kind: ask-ai
    title: Ask a language question that decides a line
    minutes: 1
    body: |-
      The remainder of a negative number differs between languages, and guessing wrong gives a
      negative index. This is exactly the kind of fact to ask about.
    prompt: >-
      In TypeScript, what is -5 % 4, and what is it in Python? Just the two values and one
      sentence on why they differ.
    expect: >-
      TypeScript gives −1 and Python gives 3. In TypeScript you need ((K % n) + n) % n for a
      shift between 0 and n − 1.
  - kind: plan
    title: Reduce K, then place each track once
    minutes: 2
    body: |-
      Moving one track per press is O(N × K), hopeless for a billion. Reduce K to
      `shift = K mod N`, kept non-negative. Then track i goes to position `(i + shift) mod N`.

      Return early for an empty array, or the remainder divides by zero.
  - kind: write
    title: Write the solution yourself
    minutes: 4
    body: |-
      The shift and the placement loop are the whole task. Type them yourself. In Python,
      slicing does the placement in one line.
    code:
      ts: |-
        // Rotate A right by K places (left for negative K) and return the new array.
        // Only K mod N moves matter, so one pass places each track: O(N) time, O(N) space.
        function solution(A: number[], K: number): number[] {
          const n = A.length;
          if (n === 0) return [];
          const shift = ((K % n) + n) % n;
          const out = new Array<number>(n);
          for (let i = 0; i < n; i++) out[(i + shift) % n] = A[i]!;
          return out;
        }
      python: |-
        # Rotate A right by K places (left for negative K) and return the new array.
        # Only K mod N moves matter; Python's % is never negative here: O(N) time, O(N) space.
        def solution(A, K):
            n = len(A)
            if n == 0:
                return []
            shift = K % n
            return A[n - shift:] + A[:n - shift]
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Check the negative cases carefully: they are where the remainder
      rule shows.
    expect: >-
      Three OKs, then [], [7], [4, 8, 1, 6], [8, 1, 6, 4] and [3, 1, 2] for your five cases.
  - kind: ai-writes
    title: Let the assistant write more inputs
    minutes: 2
    body: |-
      Inputs are a safe job to hand over. Ask for no answers: working out where each track
      lands is your check.
    prompt: >-
      Give me 4 more test inputs for this function, one per line, in the format
      ([4, 8, 1, 6], 2). Include K equal to N, K equal to -N, and a K of -1000000000. Inputs
      only, no answers and no code.
    expect: Four lines for test-input.txt, and K = N and K = −N both return A unchanged.
  - kind: test
    title: Check the result is a new array
    minutes: 1
    body: |-
      Both versions build a fresh list and leave A alone. That is safer than rotating in
      place, because the caller may still use A. Glance at the code to confirm nothing writes
      into A.
    expect: No line assigns into A.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The empty array and negative K are the points to check.
    prompt: >-
      Review my current solution for correctness and time complexity, including an empty
      array and negative K. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output, since printing slows the performance tests. Check the header
      states the complexity, then submit.
