term: scope
aka:
  - lexical scope
short: The part of your code where a name can be seen and used.
explain: |
  Every variable lives somewhere. A `let` inside a block is visible only in that block. A
  parameter is visible only inside its function. Names in outer blocks are visible to inner
  ones, never the other way round.

  JavaScript decides this from where you *write* the code, not from where it runs. That's
  what "lexical" means.
analogy: Rooms in a house. From the kitchen you can see what's in the kitchen and the hallway, but not inside the bedroom drawers.
example:
  language: js
  code: |
    const outer = 'hall';
    function room() {
      const inner = 'drawer';
      console.log(outer); // fine
    }
    console.log(inner); // ReferenceError
usage: That variable is out of scope by the time the timer fires.
twin:
  term: closure
  difference: Scope is the rule for which names a line of code can see. A closure is a function carrying its scope with it after the outer code has finished.
related:
  - closure
level: 1
lessons:
