term: metrics
aka: [metric, time series]
short: Numbers measured at regular intervals, such as requests per second or error rate, kept over time.
explain: |
  To know whether the service is healthy right now, you don't want to read a million log
  lines. You want a few numbers and a graph.

  Each is a count, a gauge or a distribution, sampled over time, often with labels such as
  route or status. They are cheap to store and fast to query, which makes them right for
  dashboards and alerts. Rate, errors and duration cover most services. Keep labels few:
  a user ID as a label creates a million series.
analogy: A car's dashboard. It doesn't tell the story of the journey, but it shows at a glance when the engine's too hot.
example:
  language: text
  code: |
    http_requests_total{route="/checkout",status="500"}  1287
    http_request_duration_seconds{quantile="0.95"}        0.84
usage: The metrics show errors rising since 14:02, so let's check what deployed then.
twin:
  term: structured-logging
  difference: Metrics are numbers over time that show that something is wrong. Structured logs are individual events with details that show what happened.
related: [structured-logging, distributed-tracing, alerting, slo, percentile]
level: 1
lessons: [cloud.observability]
