id: js.coercion
title: Values, types and coercion
objective: "Predict what `+`, `==` and a condition do with mixed types, and turn form input into numbers."
level: essential
minutes: 10
concepts: [js.types, js.coercion, js.equality, js.truthiness]
prerequisites: [js.meets-the-page]
opening:
  text: >-
    You'll know why two plus one sometimes comes out as "21". After this, numbers from a form
    will behave the way you expect.

steps:
  - type: predict-output
    id: predict-total
    concept: js.coercion
    difficulty: 1
    language: js
    code: |
      const quantity = "2";
      const bookingFee = 1;
      console.log(quantity + bookingFee);
    question: The quantity came from a form field. What does this log?
    choices:
      - text: '`21`'
        correct: true
        feedback: >-
          Right. With a string on one side, `+` joins instead of adding.
      - text: '`3`'
        feedback: >-
          That's the hope. But `quantity` is the text `"2"`, so `+` sticks the two together.
      - text: A `TypeError`
        feedback: >-
          JavaScript doesn't refuse mixed types. It converts one side and carries on, bug and
          all.

  - type: prose
    id: strings-from-forms
    body: >-
      A form field always hands your code a string, even when someone typed digits. An input's
      `value` is that text.


      `typeof` names a value's type: `typeof "2"` is `"string"`, and `typeof 2` is `"number"`.
      When an operator meets a type it can't use, it converts the value quietly. That's
      **coercion**. To convert on purpose, write `Number("2")`, which gives the number 2.

  - type: playground
    id: fix-form-total
    concept: js.coercion
    difficulty: 1
    prompt: >-
      The page adds a booking fee of 1 to the tickets in the box, and two tickets come to 21.
      Convert the value with `Number()` so they cost 3.
    html: |
      <label>Tickets <input id="tickets" type="number" value="2"></label>
      <p>Total: <span id="total"></span></p>
    js: |
      const tickets = document.querySelector("#tickets");
      const total = document.querySelector("#total");
      const bookingFee = 1;

      total.textContent = tickets.value + bookingFee;
    editable: [js]
    checks:
      - label: Two tickets cost 3
        selector: '#total'
        text: '3'
    solution:
      js: |
        const tickets = document.querySelector("#tickets");
        const total = document.querySelector("#total");
        const bookingFee = 1;

        total.textContent = Number(tickets.value) + bookingFee;
    hints:
      - '`tickets.value` is the string `"2"`, even in a number box.'
      - Convert it before the `+`, not after.
      - 'Write `Number(tickets.value) + bookingFee`.'

  - type: trace-table
    id: trace-operators
    concept: js.types
    difficulty: 2
    language: js
    code: |
      const quantity = "2";
      let total = quantity * 30;
      total = total + "1";
      total = total - 1;
    prompt: >-
      Write the value and the type of `total` after each line. Show strings with their quotes.
    columns: [total, typeof total]
    rows:
      - line: 2
        values: ['60', '"number"']
        given: true
      - line: 3
        values: ['"601"', '"string"']
      - line: 4
        values: ['600', '"number"']

  - type: prose
    id: loose-equality
    body: >-
      You've compared values with `===`, which checks the type and the value. JavaScript has
      an older `==` too. It converts first, then compares.


      So `2 == "2"` is true, while `2 === "2"` is false. The conversions behind `==` surprise
      even experienced developers. Stick to `===`, and convert with `Number()` yourself when
      you mean to.

  - type: bug-hunt
    id: hunt-zero-reading
    concept: js.equality
    difficulty: 2
    language: js
    code: |
      function describe(temperature) {
        if (temperature == "") {
          return "No reading yet";
        }
        return "Temperature: " + temperature;
      }
      console.log(describe(0)); // No reading yet
    prompt: >-
      Bug report: at exactly 0 degrees, the weather widget says "No reading yet". Tap the line
      at fault.
    lines: [2]
    reasons:
      - text: '`==` turns `""` into 0, so `0 == ""` is true'
        correct: true
        feedback: >-
          Right. `==` converted the empty string, and 0 matched it. `===` wouldn't.
      - text: '`0` is falsy, so the `if` skips it'
        feedback: >-
          Close, but there's no bare `0` in the condition. The comparison runs first, and it
          says true.
      - text: '`+` joins the text and the number'
        feedback: >-
          It does, and that's fine here: line 5 never runs. Line 2 already said true.
    fix: |
      function describe(temperature) {
        if (temperature === "") {
          return "No reading yet";
        }
        return "Temperature: " + temperature;
      }
      console.log(describe(0)); // Temperature: 0

  - type: prose
    id: truthy-and-falsy
    body: >-
      An `if` accepts any value, not only `true` or `false`. It converts the value to a
      boolean first.


      The **falsy** values you'll meet are `false`, `0`, `""`, `null`, `undefined` and `NaN`.
      `null` means "no value, on purpose". `NaN` means "not a number", which is what
      `Number("abc")` gives. Every other value counts as true, even `"0"` and `" "`.

  - type: playground
    id: fix-seats-held
    concept: js.truthiness
    difficulty: 2
    prompt: >-
      The box says 0 seats are held, yet the page says some are. Fix the condition so 0 shows
      "No seats held".
    html: |
      <label>Seats held <input id="held" type="number" value="0"></label>
      <p id="status"></p>
    js: |
      const held = document.querySelector("#held");
      const status = document.querySelector("#status");

      if (held.value) {
        status.textContent = "Some seats held";
      } else {
        status.textContent = "No seats held";
      }
    editable: [js]
    checks:
      - label: 0 seats shows "No seats held"
        selector: '#status'
        text: No seats held
    solution:
      js: |
        const held = document.querySelector("#held");
        const status = document.querySelector("#status");

        if (Number(held.value) > 0) {
          status.textContent = "Some seats held";
        } else {
          status.textContent = "No seats held";
        }
    hints:
      - '`held.value` is text. Which text counts as true?'
      - '`"0"` has a character in it, so it counts as true.'
      - 'Convert it with `Number()` first, then compare with `> 0`.'

  - type: code-challenge
    id: write-cart-total
    concept: js.coercion
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `cartTotal(lines, bookingFee)`. Each line is an object whose `price` and `quantity`
      are strings from a form.


      Return the price times the quantity for every line, added up, plus the fee, as a number.
      Skip any line whose quantity is below 1 or isn't a number at all.


      Example: `cartTotal([{ price: "30", quantity: "2" }], 1)` returns `61`.
    hints:
      - The starter never reads `price` or `quantity`. Neither of them is a number yet.
      - >-
        Convert each field with `Number` before any maths. Any comparison with `NaN`, such as
        `NaN >= 1`, is false.
      - >-
        Start with `let total = bookingFee;`, loop with `for...of`, and add a line only
        `if (quantity >= 1)`.

  - type: explain-back
    id: explain-twenty-one
    concept: js.coercion
    difficulty: 3
    prompt: |-
      ```js
      const quantity = "2"; // from a form field
      const bookingFee = 1;
      console.log(quantity + bookingFee); // 21
      ```

      Why does two plus a fee of one come out as `21`? And why wouldn't `quantity * 1` go the same way?
    rubric:
      - A form field gives a string, so the quantity is `"2"` and not `2`.
      - '`+` joins when either side is a string, so the fee becomes `"1"`.'
      - '`*` has no meaning for text, so it always converts both sides to numbers.'
    modelAnswer: >-
      The quantity came from a form, so it's the text `"2"`. When either side of `+` is a
      string, `+` joins rather than adds. The fee turns into `"1"`, and you get `"21"`.
      Multiplication has no text meaning at all, so `*` converts both sides to numbers first.

recap:
  - Say what type a value has, and where strings sneak in.
  - Spot a `==` or truthiness bug and fix it with `===` or `Number()`.
  - Convert form input with `Number` before doing arithmetic.

recall:
  - id: card-plus-string
    concept: js.coercion
    front: When does `+` join text instead of adding?
    back: >-
      Whenever either side is a string. The other side is converted to text first.
  - id: card-loose-equality
    concept: js.equality
    front: How do `==` and `===` differ?
    back: >-
      `==` converts the values first, so `0 == ""` is true. `===` is false as soon as the types
      differ.
  - id: card-falsy-values
    concept: js.truthiness
    front: Which values count as false in a condition?
    back: >-
      `false`, `0`, `""`, `null`, `undefined` and `NaN`. Everything else is true, including
      `"0"` and `" "`.
  - id: card-input-value-type
    concept: js.types
    front: What does `typeof` give for the `value` of a number input, and why?
    back: >-
      `"string"`. Every form field hands over text, even `type="number"`. Convert it with
      `Number()` before doing maths.

references:
  - kind: spec
    title: 'ECMAScript Language Specification: Type Conversion'
    authors: Ecma TC39
    venue: Ecma International, ECMA-262
    url: https://tc39.es/ecma262/#sec-type-conversion
    note: The conversion rules that operators and conditions use.
    primary: true
    verified: true
  - kind: docs
    title: Equality comparisons and sameness
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness
    note: '`==`, `===` and `Object.is` side by side, with the `NaN` cases.'
    primary: true
    verified: true
  - kind: docs
    title: Falsy
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Glossary/Falsy
    note: The complete list of values that count as false.
    verified: true

deepDive: >-
  `+` is the only arithmetic operator that joins text. Behind it sits a rule: convert both
  sides to a primitive, and if either is a string, join. Every other operator converts to a
  number.


  `==` has its own table. A string next to a number becomes a number. `null == undefined` is
  true, but neither equals `0` or `false`. An object next to a primitive is converted first,
  which is why `[] == false` is true.


  `Number("")` is 0, while `Number(" ")` is also 0 and `Number("abc")` is `NaN`. Whitespace is
  trimmed before the conversion, which catches people out when a field holds only spaces.


  `NaN` is the odd one out among numbers: it isn't equal to anything, itself included, so
  `NaN === NaN` is false. Test for it with `Number.isNaN(value)`. Two rarer falsy values
  complete the list: `-0` and the BigInt `0n`.
