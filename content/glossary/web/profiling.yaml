term: profiling
aka: [ profiler, flame graph, performance profile ]
short: Recording where a program spends its time while it runs, to find the slow part before changing anything.
explain: |
  Guessing why code is slow is usually wrong. Measuring tells you, and often points somewhere
  you didn't expect.

  A profiler samples what is running many times a second and draws a flame graph. Wide bars
  are where the time goes. Profile a production build on a realistic device, because
  development builds and fast laptops hide the problem. Fix the widest bar, then measure
  again.
analogy: A step counter for code. You think you walk a lot; the numbers say where you sit all day.
usage: Before rewriting the parser, let's do some profiling; the flame graph may say it's the logging.
related: [ lab-data, long-task, memory-leak, latency ]
level: 2
lessons: [ perf.measure-first, perf.backend-performance ]
