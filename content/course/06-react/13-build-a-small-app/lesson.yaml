id: react.build-a-small-app
title: Build a small app
objective: Build a small app from a sketch, with the least state that works, a form, a filtered list and loaded data.
level: essential
minutes: 10
concepts: [react.thinking-in-react, react.derived-values, react.fetching-data]
prerequisites: [react.state-placement]
opening:
  text: >-
    You'll build a reading list that loads your books, adds new ones and filters them. It
    uses everything from this chapter, in the order a working developer would.

steps:
  - type: prose
    id: the-sketch
    body: |-
      Here's the sketch someone hands you:

      - "2 left to read" at the top
      - three filter buttons: All, To read, Read
      - the books, each with a tick box
      - a form: a Title field and an Add button

      The books come from a server. React's own guide calls the next part **thinking in
      React**: split the sketch into components, find the state, then wire them together.

  - type: multiple-choice
    id: pick-components
    concept: react.thinking-in-react
    difficulty: 1
    question: A good component does one job. Which split fits the sketch best?
    choices:
      - text: '`ReadingList` holding `FilterButtons`, `BookRow`s and `AddBook`'
        correct: true
        feedback: >-
          Yes. Each part of the sketch gets a component, inside one owner.
      - text: One `ReadingList` component doing everything
        feedback: >-
          It works for a day. Then every change touches one long function. Split by job.
      - text: A component for every word on the screen
        feedback: >-
          Too fine. "2 left to read" is one line of JSX, not a component.

  - type: prose
    id: least-state
    body: >-
      Next, find the **least state** that works. For each value, ask: can I work it out from
      something I already have? If so, it isn't state.


      The books are state: people tick them and add to them. The chosen filter is state. The
      books on show, and the count left to read, can both be calculated from those two while
      rendering.

  - type: multiple-choice
    id: pick-not-state
    concept: react.derived-values
    difficulty: 2
    question: Which value should NOT be stored with `useState`?
    choices:
      - text: How many books are left to read
        correct: true
        feedback: >-
          Right. It's `books.filter(...).length`, calculated on every render.
      - text: The list of books
        feedback: >-
          The books change when people tick or add them. Nothing else holds them, so they're
          state.
      - text: Which filter is chosen
        feedback: >-
          A click changes it, and nothing else can tell you what it is. That makes it state.

  - type: code-challenge
    id: build-reading-list
    concept: react.derived-values
    difficulty: 3
    language: tsx
    starter: list.starter.tsx
    solution: list.solution.tsx
    tests: list.tests.tsx
    prompt: >-
      This `ReadingList` keeps the books on show and the count left to read in state of their
      own. So they drift: tick a book under To read and it stays there, and the count never
      moves.


      Keep only `books` and `filter` as state, and calculate the rest while rendering. The
      tests tick books and switch filters, as a person would.
    hints:
      - Look at which values the starter sets in more than one place, or never sets again.
      - '`visible` and `left` can both be worked out from `books` and `filter`.'
      - 'Replace the `visible` state with `const visible = books.filter((book) => matches(book, filter));`.'

  - type: prose
    id: changes-go-up
    body: >-
      The books live in `ReadingList`, the component that owns them. The form shouldn't hold
      its own copy.


      So data goes down and changes go up. `ReadingList` hands the form a function,
      `<AddBook onAdd={addBook} />`. The form reads the title from its fields, as in the
      Forms lesson, and calls `onAdd` with it. The owner adds the book.

  - type: code-challenge
    id: build-add-book
    concept: react.thinking-in-react
    difficulty: 3
    language: tsx
    starter: add.starter.tsx
    solution: add.solution.tsx
    tests: add.tests.tsx
    prompt: >-
      Write the action for `AddBook`, a form with a Title field and an Add button. It gets
      `onAdd(title)` from its parent.


      On Add, read the `title` field, trim the spaces, and call `onAdd` with it. A blank title
      adds nothing. After a real title, the field should be empty again.
    hints:
      - The form already calls `add` with the form's data. Start there.
      - '`formData.get("title")` gives what was typed. An action clears the field for you.'
      - "Start with `const title = String(formData.get('title') ?? '').trim();`."

  - type: prose
    id: loading-the-books
    body: >-
      Last, the books come from a server. `ReadingList` gets `load()`, which returns a promise
      of books, so tests can pass a pretend server.


      As in the Fetching data lesson: call it in an effect, and keep a status in state,
      `'loading'`, `'error'` or `'ready'`. Show a message for the first two, and the list for
      the last. Give the error `role="alert"`, so a screen reader reads it out at once.

  - type: code-challenge
    id: build-load-books
    concept: react.fetching-data
    difficulty: 4
    language: tsx
    starter: load.starter.tsx
    solution: load.solution.tsx
    tests: load.tests.tsx
    prompt: >-
      Load the books when `ReadingList` first appears, by calling `load()` once. The form and
      filters are left out to keep the file short.


      While it waits, show `Loading your books`. If it fails, show `Couldn't load your books`
      with `role="alert"`. Once it answers, show the list, still tickable.
    hints:
      - Look for where `load()` is called. Nothing calls it, so the list stays empty.
      - One effect with `[load]` as its dependency calls it once, and a status value picks what to show.
      - 'Start with `const [status, setStatus] = useState<Status>("loading");` and a `useEffect`.'

  - type: explain-back
    id: explain-least-state
    concept: react.thinking-in-react
    difficulty: 3
    prompt: >-
      A teammate stores the books on show in `useState` too, "so it's quicker". What goes
      wrong, and what would you do instead?
    rubric:
      - The books on show can be calculated from the books and the filter.
      - A second copy must be updated everywhere the books change, and one place always gets missed.
      - Calculating it while rendering keeps it right on every render, and filtering a short list is cheap.
    modelAnswer: >-
      The books on show come straight from two things we already keep: the books and the
      filter. Storing them again means every tick, add and filter change must update both
      copies. Miss one, and a ticked book stays under To read. Working it out while rendering
      can't drift, and filtering a few dozen books costs nothing you'd notice.

recap:
  - Split a sketch into components, each with one job, under one owner.
  - Keep the least state that works, and calculate everything else while rendering.
  - Send data down as props and changes up through functions, and load data with a status.

recall:
  - id: card-least-state
    concept: react.derived-values
    front: How do you tell whether a value should be state?
    back: >-
      Ask if you can work it out from props or other state. If you can, calculate it while
      rendering instead.
  - id: card-data-down
    concept: react.thinking-in-react
    front: How does a form add a book to a list that its parent owns?
    back: >-
      The parent passes a function such as `onAdd`. The form calls it with the title, and the
      parent updates its state.
  - id: card-load-status
    concept: react.fetching-data
    front: What three states does a component that loads data need to show?
    back: >-
      Loading, an error, and the data itself. One status value in state picks which.
  - id: card-thinking-steps
    concept: react.thinking-in-react
    front: What are the steps from a sketch to a working React app?
    back: >-
      Split it into components, build them with fixed data, find the least state, decide which
      component owns it, then pass changes up with functions.

