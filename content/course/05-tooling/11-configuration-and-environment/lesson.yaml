deepDive: >-
  `node --env-file=.env server.js` loads variables from a file, with no package needed. A
  variable already set wins over the file. So `PORT=1` on the command line beats `PORT=9090`
  in `.env`.


  Frameworks pick a prefix for what may reach the browser: `NEXT_PUBLIC_` in Next.js,
  `VITE_` in Vite. The prefix is a promise you make, not a check. Name a secret with it, and
  it ships.


  zod's error for a bad variable names the field, not its value. So a failed start-up
  doesn't print the password it rejected.
