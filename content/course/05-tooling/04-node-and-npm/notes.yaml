summary: >-
  npm is how a JavaScript project uses code other people wrote. `package.json` is the
  project's manifest: its name, how to run it, and which packages it needs, stated as version
  ranges. `node_modules` holds the installed code. `package-lock.json` records exactly which
  version of every package, direct or indirect, was installed.


  The split between ranges and exact versions is the heart of it. A range such as `^2.1.3`
  says which versions your code should work with, so you get bug fixes without editing
  anything. The lockfile says which versions you actually tested, so every laptop, CI run and
  server installs the same tree. Commit both, use `npm install` when you change dependencies,
  and use `npm ci` everywhere you want an exact copy.


  Every package you add is code that runs with your permissions, written by someone you've
  probably never met. Knowing what the fields mean, what a range allows and what the lockfile
  guarantees is how you keep a project reproducible, and it's also the first line of defence
  against a bad release or a malicious lookalike package.
remember:
  - '`package.json` states which versions you accept as ranges, and `package-lock.json` records the exact versions installed.'
  - '`^1.2.3` accepts any 1.x.x from 1.2.3 up, `~1.2.3` accepts only 1.2.x from 1.2.3 up, and below 1.0.0 the caret only allows patch releases.'
  - '`npm ci` deletes `node_modules` and installs exactly what the lockfile says, and fails instead of changing it if `package.json` disagrees.'
  - Commit the lockfile for every application, because it's the only thing that pins the whole dependency tree.
  - '`dependencies` are needed to run the code, `devDependencies` only to build and test it, and `peerDependencies` must be supplied by the project that uses the package.'
  - '`npm run` puts `node_modules/.bin` on the `PATH`, so scripts can call locally installed tools by name.'
  - A script's exit code becomes npm's exit code, which is how `npm test` fails a CI build.
  - A lockfile inside an installed dependency is ignored, so only the top-level project's lockfile counts.
sections:
  - title: The package.json fields that matter
    body: |-
      A realistic application manifest:

      ```json
      {
        "name": "booking-api",
        "version": "1.4.0",
        "private": true,
        "type": "module",
        "engines": { "node": ">=24" },
        "scripts": {
          "start": "node src/server.js",
          "dev": "node --watch src/server.js",
          "test": "vitest run"
        },
        "dependencies": { "ms": "^2.1.3" },
        "devDependencies": { "vitest": "^5.0.2" }
      }
      ```

      What each part does:

      - `name` and `version` identify the package. They only have to be valid and unique if
        you publish it.
      - `"private": true` makes `npm publish` refuse, so an application can't be published to
        the registry by accident.
      - `type` decides how Node reads `.js` files: `"module"` for ES modules, `"commonjs"`
        otherwise. `npm init -y` in npm 11 writes `"commonjs"`, so change it for new code.
      - `engines` states which Node versions the project supports. npm prints an
        `EBADENGINE` warning on a mismatch, and only refuses with `--engine-strict`.
      - `dependencies` are installed everywhere, including production. `devDependencies`
        (added with `npm install -D`) are skipped by `npm ci --omit=dev`.

      Libraries add a few more. `exports` (or the older `main`) names the entry point that
      `import "pkg"` loads, and `exports` also blocks deep imports of files you didn't list.
      `bin` maps a command name to a script, which is how installing a package gives you a new
      command. `peerDependencies` says "the project using me must provide this", which is how
      a React component library avoids shipping a second copy of React. npm 7 and later
      installs peers automatically, and stops with `ERESOLVE` when two packages demand
      incompatible versions of the same peer.
  - title: What npm run really does
    body: |-
      A script is a line of shell that npm runs for you, with two additions. First, npm puts
      the project's `node_modules/.bin` folder at the front of `PATH`. That folder holds a
      command for every installed package with a `bin` entry, so `"test": "vitest run"` works
      without a global install. Second, npm sets variables such as `npm_lifecycle_event`, the
      name of the script being run.

      ```json
      {
        "scripts": {
          "greet": "node greet.js",
          "pretest": "echo before",
          "test": "node -e \"process.exit(4)\""
        }
      }
      ```

      ```text
      $ npm run greet --silent -- --loud
      args: [ '--loud' ]
      $ npm test --silent; echo $?
      before
      4
      ```

      Here `greet.js` prints `process.argv.slice(2)`. Everything after `--` is passed to the
      script instead of being read by npm. A script named `pre<name>` runs before `<name>`, and
      `post<name>` after it. The script's exit code comes back as npm's exit code, so a
      failing test fails the CI job and `npm test && npm run build` stops at the failure.

      `npx some-tool` runs a command from `node_modules/.bin` when the package is installed.
      When it isn't, npx offers to download it first, which is convenient and also the moment
      to check you typed the name right.
  - title: Semver ranges in detail
    body: |-
      A range is a set of versions. Here is what each common form accepts from a list of
      real-looking releases, checked with the same `semver` library npm uses:

      ```text
      versions: 0.0.3 0.0.4 0.2.4 0.3.0 1.2.3 1.2.9 1.3.0 1.9.9 2.0.0-beta.1 2.0.0

      ^1.2.3          1.2.3 1.2.9 1.3.0 1.9.9
      ~1.2.3          1.2.3 1.2.9
      1.x             1.2.3 1.2.9 1.3.0 1.9.9
      >=1.2.3 <1.5.0  1.2.3 1.2.9 1.3.0
      ^0.2.3          0.2.4
      ^0.0.3          0.0.3
      *               every version except 2.0.0-beta.1
      ^2.0.0-beta.0   2.0.0-beta.1 2.0.0
      ```

      The rules behind it:

      - The caret allows changes that don't touch the leftmost non-zero number. For `1.2.3`
        that's the major. For `0.2.3` it's the minor, because before 1.0.0 semver promises
        nothing, and many projects treat a minor as breaking.
      - The tilde allows patch changes only.
      - A prerelease like `2.0.0-beta.1` only matches a range that itself names a prerelease
        of the same `major.minor.patch`. Even `*` skips it, so nobody gets a beta by accident.
      - npm picks the highest version in the range that the registry has.

      A range is only as good as the author's discipline. Semver is a promise, not a check,
      and a patch release can still break you. That's why ranges live in `package.json` and
      the tested, exact versions live in the lockfile. `npm install --save-exact ms` writes
      `"ms": "2.1.3"` with no caret, but that only pins one package: its own dependencies keep
      their ranges.
  - title: The lockfile and npm ci
    body: |-
      `package-lock.json` describes the whole installed tree. For every package it records
      the exact version, where it was downloaded from and an integrity hash of the file:

      ```json
      "node_modules/ms": {
        "version": "2.1.3",
        "resolved": "https://registry.npmjs.org/ms/-/ms-2.1.3.tgz",
        "integrity": "sha512-6FlzubTLZG3J2a/...",
        "license": "MIT"
      }
      ```

      The integrity hash means a tampered download fails the install. The lockfile wins over
      the range while the two agree. With `"ms": "^2.0.0"` in `package.json` and 2.0.0 in the
      lockfile, `npm install` keeps 2.0.0. Delete the lockfile and `node_modules`, install
      again, and the same range gives 2.1.3:

      ```text
      $ npm ls ms
      lock@1.0.0 /Users/sam/lock
      └── ms@2.0.0
      $ rm -rf node_modules package-lock.json && npm install --silent
      $ npm ls ms
      lock@1.0.0 /Users/sam/lock
      └── ms@2.1.3
      ```

      The two install commands have different jobs:

      - `npm install` makes `node_modules` match `package.json`, reusing locked versions
        where they still fit and updating the lockfile when something changed. Use it when
        you add, remove or upgrade a dependency.
      - `npm ci` removes `node_modules` if it exists, installs exactly the lockfile and never
        writes to either file. If the lockfile is missing or doesn't satisfy `package.json`,
        it stops with `EUSAGE`. Change the range to `^1.0.0` without reinstalling, and it says
        `lock file's ms@2.1.3 does not satisfy ms@1.0.0`. Use it in CI, Docker builds and
        deploys.

      Only the top-level lockfile counts. npm ignores a `package-lock.json` found inside an
      installed dependency, so a library's lockfile pins nothing for the people who install
      it. Libraries commit theirs anyway, so their own CI and contributors get repeatable
      installs.
  - title: Choosing and trusting a package
    body: |-
      `npm install` runs someone else's code with your permissions, at install time through
      scripts such as `postinstall`, and at run time when you import it. A few habits keep that
      risk small:

      - Check the name letter by letter. Attackers publish lookalikes of popular names, and AI
        assistants sometimes suggest packages that don't exist, which an attacker can then
        register. `npm view <name>` shows the maintainers, the latest version and its
        homepage before you install.
      - Prefer the standard library when it covers the job. Node 24 has `fetch`,
        `node:test`, `crypto.randomUUID()`, `util.parseArgs` and `--env-file`, which replace
        several once-common packages.
      - Read the signals: recent releases, the number of dependencies it pulls in, open
        security issues and whether its repository matches the package.
      - Run `npm audit` in CI. It compares your locked versions against a database of known
        vulnerabilities and exits with 1 when it finds any, so it can fail a build.
      - `npm ci --ignore-scripts` installs without running any package's lifecycle scripts.
        Recent npm versions also list, after an install, which dependencies have install
        scripts, so you can review them.

      The lockfile helps here too. Because it pins exact versions and integrity hashes, a
      compromised new release can't reach you until someone updates the lockfile, and that
      change shows up in a pull request for review.
pitfalls:
  - '**Deleting the lockfile to fix an install error.** Every package in the tree can jump to its newest allowed version, so you trade one error for unknown changes. Run `npm install` to update the lockfile in place, and read its diff.'
  - '**Not committing `package-lock.json`.** Without it every fresh install resolves the ranges again on that day, and CI tests different code from your laptop. Commit it, and install with `npm ci` in CI.'
  - '**Putting a runtime package in `devDependencies`.** It works locally, then the server installs with `--omit=dev` and crashes with `Cannot find package`. Anything your running code imports belongs in `dependencies`.'
  - '**Reading `^0.2.3` like `^1.2.3`.** Below 1.0.0 the caret allows patch releases only, so `^0.2.3` never reaches 0.3.0. Upgrade 0.x packages on purpose and read their changelog.'
  - '**Installing tools globally for a project.** A global `vitest` differs between machines and isn''t listed anywhere. Install it with `npm install -D` and call it from a script, which uses `node_modules/.bin`.'
  - '**Installing whatever name an assistant suggests.** An `E404` means the package doesn''t exist yet, and a lookalike that does exist may be malware. Search the registry and check the owner before running `npm install`.'
interview:
  - question: What's the difference between `npm install` and `npm ci`?
    answer: >-
      `npm install` resolves and may update the lockfile, while `npm ci` reproduces the
      lockfile exactly or fails. `npm install` makes `node_modules` match `package.json`,
      keeps locked versions where they still satisfy the ranges, and writes changes back to
      `package-lock.json`. `npm ci` deletes `node_modules`, installs precisely what the
      lockfile lists and never modifies either file. If `package.json` and the lockfile
      disagree, it stops with an error instead of guessing. So I use `npm install` when I
      change dependencies on my machine, and `npm ci` in CI, Docker images and deploys,
      where I want the tested tree and a loud failure if someone forgot to commit the
      updated lockfile. The cost of `npm ci` is a full reinstall each time, which caching
      the npm download cache offsets.
  - question: What do the caret and tilde mean in a version range?
    answer: >-
      Caret allows anything that shouldn't break you under semver, tilde allows only patch
      releases. `^1.2.3` means 1.2.3 up to but not including 2.0.0, so new features and fixes
      arrive, but not a new major. `~1.2.3` means 1.2.3 up to 1.3.0, fixes only. Before 1.0.0
      the caret narrows, because the leftmost non-zero number is treated as the breaking one:
      `^0.2.3` stays below 0.3.0, and `^0.0.3` matches only 0.0.3. Prereleases are excluded
      unless the range names one. Ranges state what should be compatible. They don't
      guarantee it, because semver is a promise authors make by hand, which is why the exact
      tested versions live in the lockfile.
  - question: Should you commit `package-lock.json`, and does it matter for libraries?
    answer: >-
      Yes, always for applications, and usually for libraries too, for different reasons.
      For an application, the lockfile is the only record of the exact tree you tested,
      including transitive dependencies that a pinned version in `package.json` can't reach.
      Without it, installs a week apart can run different code. For a library, npm ignores a
      lockfile found inside an installed package, so it pins nothing for your users: they get
      whatever your ranges allow. Committing it still gives your own CI and contributors
      repeatable installs. The trade-off is that a library's CI then never tests the newest
      versions its users will get, so it's worth a scheduled job that installs fresh, or a
      bot that opens update pull requests.
  - question: Explain `dependencies`, `devDependencies` and `peerDependencies`.
    answer: >-
      They say who needs a package and who provides it. `dependencies` are needed when the
      code runs, so they're installed everywhere, including production. `devDependencies` are
      only needed to build, test or lint, such as a test runner or TypeScript, and are
      skipped by `npm ci --omit=dev`. `peerDependencies` belong to libraries that plug into a
      host: a React component library lists React as a peer, meaning "use the project's copy",
      so the app doesn't end up with two Reacts. npm 7 and later installs missing peers and
      reports `ERESOLVE` when versions conflict. The classic mistake is a runtime import
      listed under `devDependencies`, which works on a laptop and crashes on a production
      install.
  - question: How does `npm run` find tools like `vitest` that aren't installed globally?
    answer: >-
      npm adds the project's `node_modules/.bin` folder to the front of `PATH` while the script
      runs. When you install a package with a `bin` field, npm creates a command for it in
      that folder. So `"test": "vitest run"` resolves to the project's own copy, at the
      version in the lockfile, on every machine. Outside a script, the same command gives
      "command not found" unless you use `npx vitest` or type the path. This is why tools
      belong in `devDependencies` rather than installed globally: the version is recorded and
      shared, and a new teammate needs nothing beyond `npm ci`. The small cost is that each
      project keeps its own copy on disk.
