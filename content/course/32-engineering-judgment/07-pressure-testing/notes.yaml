summary: >-
  A design on a whiteboard always works. Pressure-testing is the habit of attacking it before
  code does, while a hole costs a sentence to fix rather than an outage. Four tools cover
  most of it, and each one fights a different blind spot.


  A **pre-mortem** fights optimism: the team imagines the launch has already failed and
  writes down why. A **light failure-mode table** fights vagueness: each way a part can fail
  gets a row with its likelihood, its impact and how you'd notice, rated low, medium or high.
  A **steelman** fights attachment: you argue the best case for the option you rejected. An
  **adversarial review** fights the author's view: someone whose job is to break the design
  attacks it, and every attack gets a fix, a test or a written acceptance.


  Use them on any design that is expensive to change once built: anything with stored data,
  money, outside partners or hardware. For a small feature behind a flag, a ten-minute
  pre-mortem in the pull request description is enough.
remember:
  - A pre-mortem starts from "it failed, why?", which surfaces risks that "what could go wrong?" leaves unsaid.
  - Everyone writes their reasons alone first, so the loudest voice doesn't set the list.
  - Rate likelihood and impact as low, medium or high, because finer numbers claim a precision nobody has.
  - Look up each row's priority in a matrix rather than multiplying ranks, which ties very different risks.
  - A failure nobody would notice moves up the list, so every serious row needs a way to detect it.
  - Steelman the rejected option at full strength; if you can't answer it, you haven't decided.
  - Answer every adversarial attack with a fix, a test or a risk accepted in writing.
  - The strongest pressure test makes the failure happen, with the slow or broken dependency simulated at its worst.
sections:
  - title: Running a pre-mortem in half an hour
    body: |-
      Book thirty minutes once the design is agreed and before building starts. Invite the
      builders and one or two people who see failures first: support, operations, whoever
      gets paged.

      1. **Set the scene.** "It's six months after launch. It went badly. Not a little badly:
         people are writing about it." The more vivid, the better it works.
      2. **Write alone.** Five minutes, everyone lists every reason they can think of. Writing
         alone matters. Discussing first lets the first idea anchor the rest.
      3. **Go round.** Each person reads one reason at a time until every list is empty. No
         debate yet. The facilitator writes each one down.
      4. **Group and rate.** Merge duplicates, then put each reason in the failure-mode
         table with a likelihood, an impact and how you'd notice.
      5. **Decide.** For the top rows, name an owner and the change: a design fix, a test,
         an alert, or an explicit "we accept this".

      Why does it work? The research is on **prospective hindsight**: people find
      explanations more easily for an outcome they treat as certain than for one they're
      asked to predict. The social effect matters as much. "Here's why we failed" is a safe
      thing to say in a meeting where everyone is saying it. "I think this plan is weak"
      isn't.

      Keep the output short. A pre-mortem that produces forty unranked worries changes
      nothing. One that produces three owned actions and two accepted risks has done its
      job.
  - title: Matrices, not multiplication
    body: |-
      Classic failure-mode analysis scores severity and occurrence from 1 to 10, often
      detection too, and multiplies them. The trouble is that the scores are ranks. A 6 isn't
      twice a 3, so the product means little:

      ```ts
      // Classic scoring multiplies ranks from 1 to 10.
      const risks = [
        { failure: 'card charged twice', severity: 9, occurrence: 2 },
        { failure: 'map loads slowly', severity: 3, occurrence: 6 },
      ];
      for (const r of risks) console.log(r.failure, r.severity * r.occurrence);
      // card charged twice 18
      // map loads slowly 18
      ```

      A double charge and a slow map tie. No team would treat them the same. A lookup
      matrix, like the one in the challenge, lets you say outright that a rare severe
      failure gets a plan while a common trivial one is accepted. That's why the automotive
      industry's FMEA handbook replaced the product with a lookup table in 2019.

      The detection column earns its place too. A failure you'd see within a minute, such
      as checkout returning errors, does limited damage. The same failure, silent, might run
      for weeks: a job that stops sending reminders, a dock that stops reporting returns. So
      either move silent rows up, as the challenge does, or give each one a detection before
      launch. Usually the cheapest fix for a high row is an alert, not a redesign.
  - title: Making the failure happen
    body: |-
      Arguments only go so far. The last step of pressure-testing is to make the failure
      real and watch. The lesson's unlock flow held a database connection while waiting for
      the dock. A load test with a fake dock that answers at once can't see that:

      ```ts
      const sleep = (ms: number) => new Promise((done) => setTimeout(done, ms));

      // 10 database connections. Each unlock holds one while the dock answers.
      async function refusedUnlocks(dockMs: number, riders: number): Promise<number> {
        let free = 10;
        let refused = 0;
        const unlock = async (arrivesAtMs: number) => {
          await sleep(arrivesAtMs);
          if (free === 0) {
            refused++;
            return;
          }
          free--;
          await sleep(dockMs); // the dock's reply, inside the transaction
          free++;
        };
        await Promise.all(Array.from({ length: riders }, (_, i) => unlock(i * 10)));
        return refused;
      }

      console.log('instant fake dock:', await refusedUnlocks(1, 50), 'refused');
      console.log('dock taking 2 s:', await refusedUnlocks(2000, 50), 'refused');
      // instant fake dock: 0 refused
      // dock taking 2 s: 40 refused
      ```

      Same code, same number of riders, opposite verdicts. The fake hid the one property
      that mattered: how long the dependency takes. So a pressure test simulates each
      dependency at its worst believable behaviour: slow, failing, timing out, answering
      twice.

      This is **fault injection**. In tests it's a fake that misbehaves on purpose. In a
      staging environment it's a proxy that adds latency or drops connections. Done
      deliberately in production, with small blast radius and a stop button, it's usually
      called chaos engineering. Start with the tests. They're cheap, and they catch most of
      what the fancier tools find.
pitfalls:
  - '**Running the pre-mortem as an open discussion.** The first confident voice sets the agenda and quieter doubts never surface. Have everyone write alone before anyone speaks.'
  - '**Scoring with false precision.** Rating a risk 7 rather than 6, then multiplying, produces a ranking that looks scientific and isn''t. Use low, medium and high, and a matrix.'
  - '**Leaving out how you''d notice.** A table without a detection column ranks a silent failure the same as a loud one. Ask of every row: how would we find out, and how soon?'
  - '**Steelmanning a straw man.** "Polling is fine if you like waste" is the weak version. Argue the case its best supporter would make, or the comparison proves nothing.'
  - '**Testing the fix with the fake that hid the bug.** An instant fake dependency passes whether or not the design holds. Simulate the slow or failing behaviour the pre-mortem named.'
verify:
  - lens: scales
    check: A transaction or lock held across a network call pins one connection per waiting user, so at 10x the pool runs out first.
  - lens: tests
    check: Load-test with the slow dependency simulated at its worst real latency, because an instant fake passes whether or not the design holds.
  - lens: breaks
    check: Give every high-impact row in the failure-mode table a way to notice it, or it can fail silently for weeks.
  - lens: confuses
    check: Write down each accepted risk and who accepted it, or the next team will assume it was missed.
interview:
  - question: How would you pressure-test a design before building it?
    answer: >-
      I'd attack it in four passes, cheapest first. A pre-mortem with the builders and
      someone from operations: assume the launch failed, everyone writes the reasons alone,
      then we pool them. Those go into a failure-mode table, one row per way a part fails,
      with likelihood, impact and how we'd notice, rated low, medium or high. Then I
      steelman the main alternative we rejected, and ask a colleague to review the design
      adversarially. Each attack gets a fix, a test or a written acceptance. Finally, for
      the top risks, I make the failure happen in a test: slow dependency, dropped
      connection, duplicate message. The trade-off is a few hours before building, which is
      cheap next to discovering the same holes in production.
  - question: What's a pre-mortem, and why does it find things a normal risk review misses?
    answer: >-
      It's a meeting where the team imagines the project has already failed and explains
      why. Two things make it work. Psychologically, people generate explanations more
      easily for an outcome they treat as certain, which researchers call prospective
      hindsight. Socially, it makes doubt safe: saying "we failed because the docks lost
      signal" is the task, not a criticism of the plan. A normal "any risks?" question
      invites reassurance, especially from junior people or in a team that's excited about
      the design. I run it with silent writing first, so the first voice doesn't anchor
      everyone, and I end with owners for the top three risks.
  - question: How do you rank risks without pretending to precision you don't have?
    answer: >-
      I use ordinal scales, low, medium and high, for likelihood and impact, and a lookup
      matrix to turn the pair into an action: act now, plan, or accept. I avoid multiplying
      scores from 1 to 10, because they're ranks, not measurements: a 9 times 2 and a 3
      times 6 tie for a double charge and a slow map. I add a detection question, because a
      failure nobody notices does harm for longer, so it moves up a band. Where I do have
      data, such as how often a dependency timed out last month, I write it next to the
      rating so anyone can challenge it. The ranking is a conversation tool, not a
      calculation.
