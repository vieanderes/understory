term: regression
aka: [regression test, regressed]
short: A bug in something that used to work, brought back or newly caused by a later change.
explain: |
  The discount code worked last month. Someone tidied the pricing code, and now it's
  ignored. Nothing new was added; something old broke.

  The habit that stops repeats: when you fix a bug, first write a test that fails because of
  it, then fix it. That test stays in the suite for good, so the same bug can't sneak back
  unnoticed. Performance can regress too, which is why teams track timings over releases.
analogy: A repaired leak that starts dripping again after the plumber fixed the boiler.
usage: That's a regression from Tuesday's refactor; add a test for it before you fix it.
twin:
  term: flaky-test
  difference: A regression fails every time since one change broke it. A flaky test fails only some of the time, with no change at all.
related: [tdd, flaky-test, unit-test]
level: 1
lessons: [testing.tdd, agents.debugging-from-a-trace]
