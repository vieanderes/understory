term: exit code
aka: [exit status, return code]
short: The number a finished program hands back to whatever started it, where zero means it worked.
explain: |
  Shells, CI pipelines and schedulers can't read your printed messages. When your program
  ends, the only thing they look at is one small number.

  Zero means success and anything else means failure. CI fails a step on any non-zero code. In a shell, `&&` runs the next command only after a
  zero. In Python, `sys.exit(2)` sets
  it, and an uncaught exception exits with 1. A tool that prints "error" but exits with 0
  tells every script that it worked.
analogy: A thumbs up or thumbs down at the end of a job. The foreman doesn't read your notes; he looks at your thumb.
example:
  language: bash
  code: |
    python report.py data.csv
    echo $?   # 0 on success, 1 or 2 on failure

    python check.py && deploy
usage: The eval script printed failures but returned exit code 0, so CI went green anyway.
related: [standard-streams, continuous-integration, process]
level: 1
lessons: [python.report-tool]
