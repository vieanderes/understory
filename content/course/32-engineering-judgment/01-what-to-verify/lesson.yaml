id: judgment.what-to-verify
title: What to check before you trust code
objective: "Review code with five questions: what breaks, what scales, what confuses, what leaks, and how you would prove it works."
level: essential
minutes: 10
concepts: [judgment.five-questions, judgment.verifying-ai-code]
prerequisites: [tooling.working-with-ai]
opening:
  text: >-
    You'll review code with five questions that find what a passing test misses. They're
    how experienced engineers decide what to check before they trust code, an assistant's
    or their own.

steps:
  - type: prose
    id: five-questions
    body: |-
      Writing code was never the hard part. Knowing what to check before you trust it is.
      Five questions do most of that work:

      1. What could break?
      2. Will it hold at 10x?
      3. What will confuse the next person?
      4. What could this expose?
      5. How would you prove it works, and what could it regress?

      "10x" means ten times the users, requests or data.

  - type: bug-hunt
    id: hunt-logged-password
    concept: judgment.five-questions
    difficulty: 1
    language: js
    code: |
      function logIn(email, password) {
        console.log("Login attempt", email, password);
        const member = findMember(email);
        if (!member || !checkPassword(member, password)) return null;
        return member;
      }
    prompt: >-
      This login works, and its test passes. On a server, whatever `console.log` prints is
      kept in log files the team can search. Ask what this could expose. Tap the line.
    lines: [2]
    reasons:
      - text: It writes every password into the logs
        correct: true
        feedback: >-
          Yes. Anyone who can read the logs can now read passwords.
      - text: It should log only when the login fails
        feedback: >-
          Failed logins carry passwords too, often real ones with a typo. Log the email and
          the outcome, never the password.
      - text: Printing on every login slows the server
        feedback: >-
          One log line costs almost nothing. What it prints is the problem, not how often.
    fix: |
      function logIn(email, password) {
        console.log("Login attempt", email);
        const member = findMember(email);
        if (!member || !checkPassword(member, password)) return null;
        return member;
      }

  - type: ai-review
    id: review-full-class
    concept: judgment.verifying-ai-code
    difficulty: 2
    language: js
    request: Write bookClass, which books a member into a gym class if there's room.
    flawClass: edge-case
    code: |
      function bookClass(gymClass, memberId) {
        if (gymClass.booked.includes(memberId)) return "already booked";
        if (gymClass.booked.length <= gymClass.capacity) {
          gymClass.booked.push(memberId);
          return "booked";
        }
        return "full";
      }
    prompt: >-
      The assistant says "Tested, it works". Its test booked one member into an empty class
      of 12. Ask what could break, then tap the line at fault.
    lines: [3]
    reasons:
      - text: A full class still lets one more in
        correct: true
        feedback: >-
          Right. With 12 booked, `12 <= 12` is true. It needs `<`.
      - text: Duplicates should be checked after capacity
        feedback: >-
          Either order works, since both checks run before the push. The comparison on line 3
          is off by one.
      - text: "`includes` can't find numbers in a list"
        feedback: >-
          It can: `[3, 7].includes(7)` is `true`. Line 3 is what lets a thirteenth member in.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Booking into a class that's exactly full
          correct: true
          feedback: >-
            Yes. The edge is the only place `<=` and `<` disagree.
        - text: Booking into an empty class
          feedback: >-
            That's the test it already passed. Room was never in doubt there.
        - text: Booking the same member twice
          feedback: >-
            A good test, for line 2. It returns before the capacity check, so it can't see
            this.
    fix: |
      function bookClass(gymClass, memberId) {
        if (gymClass.booked.includes(memberId)) return "already booked";
        if (gymClass.booked.length < gymClass.capacity) {
          gymClass.booked.push(memberId);
          return "booked";
        }
        return "full";
      }

  - type: prose
    id: looks-finished
    body: >-
      Assistant code looks finished. It has good names, tidy comments and a passing test.
      None of that is evidence.


      So **verifying AI-written code** means asking the same five questions, out loud. Each
      one turns into a check you can run: an input at the edge, a bigger list, a fresh
      reader, a field to follow, a test that would fail.

  - type: predict-output
    id: predict-ten-times
    concept: judgment.five-questions
    difficulty: 2
    language: js
    code: |
      // An assistant's fix: find members who signed up twice.
      function duplicateEmails(members) {
        const found = [];
        for (const a of members) {
          for (const b of members) {
            if (a.id < b.id && a.email === b.email) found.push(a.email);
          }
        }
        return found;
      }
    question: It checks 2,000 members in 16 ms. The gym grows to 20,000 members. How long now?
    choices:
      - text: About 160 ms, ten times longer
        feedback: >-
          That's what most people guess. But every member is compared with every member, so
          both loops grow.
      - text: Seconds, about a hundred times longer
        correct: true
        feedback: >-
          Right. Each loop grows ten times. On a laptop, 16 ms became 3 seconds.
      - text: About 16 ms, since loops are fast
        feedback: >-
          Each step is fast, yes. But there are now 400 million pairs to compare.

  - type: bug-hunt
    id: hunt-reordered-list
    concept: judgment.five-questions
    difficulty: 3
    language: js
    code: |
      // Added by an assistant for the welcome banner.
      function newestMember(members) {
        members.sort((a, b) => b.joined - a.joined);
        return members[0];
      }

      // Elsewhere, written months ago by a teammate:
      const members = loadMembers(); // sorted A to Z
      showBanner(newestMember(members));
      showMembersPage(members);
    prompt: >-
      The banner works. But the members page, A to Z for years, now lists the newest
      first. Ask what will confuse the next person. Tap the line.
    lines: [3]
    reasons:
      - text: "`sort` reorders the caller's list in place"
        correct: true
        feedback: >-
          Yes. A function that reads like a lookup changed its input. Use `toSorted`.
      - text: The compare function puts the oldest first
        feedback: >-
          `b.joined - a.joined` puts the newest first, as the banner wants. The trouble is
          whose list gets sorted.
      - text: "`members[0]` takes the member out of the list"
        feedback: >-
          Reading `members[0]` changes nothing. Line 3 reorders the list that every other
          caller shares.
    fix: |
      function newestMember(members) {
        return members.toSorted((a, b) => b.joined - a.joined)[0];
      }

  - type: code-challenge
    id: write-search-books
    concept: judgment.verifying-ai-code
    difficulty: 4
    language: ts
    editable: '16-18'
    prompt: >-
      An assistant wrote `searchBooks(books, query)` for a library's public search box. Its
      one test passes. Make it pass the five questions:


      - **Breaks:** some new books have no `title` yet. Skip them instead of crashing.

      - **10x:** the catalogue holds 80,000 books. Return at most 20 results.

      - **Exposes:** results go to a public page. Return only `id`, `title` and `author`.

      - A blank query, empty or only spaces, returns `[]`.


      Match titles ignoring case, in catalogue order. Example: `searchBooks(books, 'salt')`
      gives `[{ id: 1, title: 'Rivers of Salt', author: 'M. Okafor' }]`.
    hints:
      - Take the rules one at a time. Which part of the starter crashes when `title` is missing?
      - >-
        The `PublicBook` type doesn't remove fields at run time. `...book` copies
        `borrowerEmail` along with everything else.
      - >-
        Start with `const wanted = query.trim().toLowerCase();` and return `[]` when it's
        empty. Build each result by naming its three fields.

  - type: explain-back
    id: explain-passing-test
    concept: judgment.five-questions
    difficulty: 3
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer asks: the assistant's `bookClass` passed its test, so why review it at all?
      Explain what the test missed, and why.
    rubric:
      - A test proves only the cases someone tried, and nobody tried a full class.
      - The five questions point at what tests tend to miss, such as edges, size, readers and data.
      - Each question becomes a check you can run, like a test with exactly 12 booked.
    modelAnswer: >-
      A passing test proves only the cases somebody tried. The assistant tried an empty
      class, so `<=` looked fine. Nobody asked what could break at the edge, where a full
      class let a thirteenth member in. The five questions are a habit for finding the
      untried cases: edges, bigger data, the next reader, exposed fields and regressions.
      Each one becomes a check, like booking into a class that's exactly full.

recap:
  - Ask the five questions before you trust any code, AI-written or your own.
  - Turn each question into a check you can run, such as an edge case or a bigger list.
  - Treat a passing test as proof of the cases it tried, and nothing more.

recall:
  - id: card-five-questions
    concept: judgment.five-questions
    front: Name the five questions you ask before trusting code.
    back: >-
      What could break, will it hold at 10x, what will confuse the next person, what could it
      expose, and how would you prove it works?
  - id: card-passing-test
    concept: judgment.verifying-ai-code
    front: What does a passing test prove about an assistant's code?
    back: >-
      Only that the cases it tried work. The edges nobody tried are still unknown.
  - id: card-types-dont-strip
    concept: judgment.verifying-ai-code
    front: Why can a function typed to return `PublicBook` still send `borrowerEmail`?
    back: >-
      Types disappear at run time. A spread like `...book` copies every field, whatever the
      declared type says.
  - id: card-loop-in-loop
    concept: judgment.five-questions
    front: Why does a loop inside a loop over the same list fail first at 10x?
    back: >-
      Both loops grow with the list, so ten times the data means about a hundred times the
      work.

references:
  - kind: paper
    title: How AI Impacts Skill Formation
    authors: Shen, J. H. and Tamkin, A.
    year: 2026
    venue: arXiv 2601.20245
    url: https://arxiv.org/abs/2601.20245
    note: Engineers who delegated to an assistant learnt least, and debugging suffered most.
    primary: true
    verified: false
  - kind: paper
    title: Do Users Write More Insecure Code with AI Assistants?
    authors: Perry, N., Srivastava, M., Kumar, D. and Boneh, D.
    year: 2023
    venue: "CCS '23: ACM SIGSAC Conference on Computer and Communications Security"
    url: https://dl.acm.org/doi/10.1145/3576915.3623157
    note: People with an assistant wrote less secure code and rated it as more secure.
    primary: true
    verified: false
  - kind: docs
    title: What to look for in a code review
    authors: Google
    venue: Google Engineering Practices
    url: https://google.github.io/eng-practices/review/reviewer/looking-for.html
    note: A reviewer's checklist from design to tests, close to the five questions in spirit.
    verified: false

deepDive: >-
  The five questions are ordered for teaching, not for reviewing. Under time pressure, start
  with the question whose failure costs most. Code that touches money or personal data gets
  "what could this expose?" and "what could break?" first. A script that runs once gets
  little more than a careful read.


  The challenge hides a trap worth remembering. TypeScript checked that every result fit
  `PublicBook`, and the starter compiled. But types are erased when the code runs, and an
  object with extra fields still fits a smaller type. Only code removes a field: naming the
  fields you send, or a validation library that strips unknown keys at the boundary.


  The loop inside a loop is quadratic: the work grows with the square of the list. One loop
  with a `Set` of emails seen so far does the same job in a single pass. A later
  lesson in this module returns to this with database queries, where the same shape costs network trips
  instead of comparisons.


  Most of the ai-review steps in this course seed one flaw from a fixed list: logic, race,
  security, an invented API, an unhandled edge, performance, data exposure and a regression.
  Each maps onto one of the five questions, which is why the questions find them.
