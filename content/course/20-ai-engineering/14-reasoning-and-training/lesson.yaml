deepDive: >-
  **The written steps aren't a window into the model.** Research has found cases where a
  model's chain of thought leaves out what really drove its answer. Read it as a useful
  trace, not as proof of how the answer was reached.


  **Checkable rewards.** GRPO shines where a program can score answers: a maths result
  that matches, code that passes tests. That's why reasoning models improved fastest at
  maths and code.


  **Reward hacking.** Any scorer can be gamed. A model trained against a weak reward model
  learns what that scorer likes, not what's right. Clipping, a penalty for drifting from
  the original model, and checkable rewards all push back.
