term: stacking context
short: A group of elements layered together as one unit, whose inside order can't mix with outside elements.
explain: |
  You give a tooltip a huge `z-index`, yet it still hides behind the next card. The
  number isn't too small. The tooltip is locked inside a group that sits lower.

  Some properties wrap an element and its children into a group: `position` with a
  `z-index`, `opacity` below 1, `transform`, `filter`, `isolation: isolate` and more. The
  group is painted as a single layer. Inside it, children are ordered among themselves;
  outside, the whole group competes as one.
analogy: Folders in a stack of papers. You can shuffle pages inside a folder all day, but they never move above the next folder.
example:
  language: css
  code: |
    .card { transform: translateY(0); }  /* new context */
    .card .tooltip {
      position: absolute;
      z-index: 999;  /* only beats things inside .card */
    }
usage: The transform on the card creates a stacking context, so the tooltip can't climb above the next card.
twin:
  term: z-index
  difference: A stacking context is the group. A z-index is a position inside one group, and comparing numbers across groups is meaningless.
related:
  - z-index
level: 3
lessons:
