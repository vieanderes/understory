id: security.same-origin-and-cors
title: Same-origin policy and CORS
objective: "Say what the same-origin policy blocks, allow only the origins you trust with CORS, and never pair `*` with credentials."
level: essential
minutes: 10
concepts: [security.same-origin-policy, security.cors, security.cors-credentials]
prerequisites: [security.csrf-and-cors, js.requests-and-responses]
opening:
  text: >-
    You'll know what the browser stops a script reading from another server, and what it
    doesn't. Then you'll write the CORS check that lets your own front end in and nobody else.

steps:
  - type: prose
    id: origin-recap
    body: >-
      Quick recap from the CSRF lesson. An **origin** is a scheme, a host and a port:


      ```text

      https://app.example.com        origin A

      https://app.example.com/notes  origin A, a different path

      https://api.example.com        a different origin: another host

      http://app.example.com         a different origin: another scheme

      ```


      Two URLs share an origin only when all three parts match. The path doesn't count.

  - type: multiple-choice
    id: pick-same-origin
    concept: security.same-origin-policy
    difficulty: 1
    question: Which URL has the same origin as `https://shop.example:443/cart`?
    choices:
      - text: '`https://shop.example/checkout`'
        correct: true
        feedback: >-
          Right. 443 is the default for https, and the path doesn't count.
      - text: '`http://shop.example/cart`'
        feedback: >-
          Same host, but `http` is a different scheme, so it's another origin.
      - text: '`https://pay.shop.example/cart`'
        feedback: >-
          `pay.shop.example` is another host. Same site, maybe, but not the same origin.

  - type: prose
    id: same-origin-policy
    body: >-
      Your page's JavaScript runs with the visitor's cookies. So the browser has a rule, the
      **same-origin policy**: a script may **send** a request to any origin, but it may only
      **read** the response from its own origin.


      A news site's script can ask your bank for your balance. Your browser even sends the
      bank cookie along. But the script never sees the answer. That's the policy doing its job.

  - type: prose
    id: what-cors-is
    body: >-
      Sometimes you want another origin to read. Your front end at `https://app.example.com`
      calls your API at `https://api.example.com`. **CORS**, cross-origin resource sharing, is
      how the API says yes, with a response header:


      ```http

      Access-Control-Allow-Origin: https://app.example.com

      ```


      The browser compares that header with the page's origin. A match, and the script reads
      the response. No header, and the browser hides it and prints a CORS error in the console.

  - type: multiple-choice
    id: pick-request-arrived
    concept: security.cors
    difficulty: 2
    language: js
    code: |
      // page on http://localhost:8071, API on http://127.0.0.1:8072
      await fetch("http://127.0.0.1:8072/notes", { method: "POST", body: "hi" });
      // console: blocked by CORS policy: No 'Access-Control-Allow-Origin'
      // header is present on the requested resource.
    question: The API sends no CORS headers. Did the POST reach the server?
    choices:
      - text: Yes, only the reply was hidden
        correct: true
        feedback: >-
          Right. We logged it arriving. CORS hides the response; it doesn't stop the request.
      - text: No, the browser blocked it first
        feedback: >-
          That's the common belief. The error is about reading the reply, after it came back.
      - text: Only if the API allows `POST`
        feedback: >-
          The method isn't checked here. A simple POST like this one is sent straight away.

  - type: code-challenge
    id: write-cors-headers
    concept: security.cors
    difficulty: 3
    language: ts
    starter: cors.starter.ts
    solution: cors.solution.ts
    tests: cors.tests.ts
    prompt: >-
      Write `corsHeaders(origin, allowed)`. `origin` is the request's `Origin` header, and
      `allowed` lists the origins you trust. If `origin` is in the list exactly, return
      `{ "Access-Control-Allow-Origin": origin, "Vary": "Origin" }`. Otherwise return `{}`.
      So `https://app.example.com.evil.net` gets nothing.
    hints:
      - Compare whole strings. Partial matches are the bug here.
      - '`allowed.includes(origin)` on an array checks for an exact item.'
      - Build the object only inside the `if`, and return `{}` after it.

  - type: prose
    id: credentials
    body: >-
      So CORS isn't a lock on your API. `curl` ignores it, and your API still checks who is
      calling.


      By default, `fetch` to another origin sends no cookies. With `credentials: "include"` it
      does, and the browser gets stricter. It shows the reply only if the server names the exact
      origin and adds `Access-Control-Allow-Credentials: true`. A wildcard, `*`, is refused: the
      browser won't let "anyone" read an answer made with the visitor's cookies.

  - type: fill-blank
    id: fill-credentialed-headers
    concept: security.cors-credentials
    difficulty: 2
    language: http
    prompt: >-
      The front end at `https://app.example.com` sends cookies to your API. Fill the headers
      that let it read the reply.
    template: |
      Access-Control-Allow-Origin: {{1}}
      Access-Control-Allow-Credentials: {{2}}
      Vary: Origin
    blanks:
      - key: '1'
        answer: https://app.example.com
      - key: '2'
        answer: 'true'
    bank: ['https://app.example.com', '*', 'true', 'false', 'app.example.com']

  - type: ai-review
    id: review-reflect-any-origin
    concept: security.cors-credentials
    difficulty: 4
    language: js
    request: The browser rejects our * with credentials. Make the CORS error go away.
    flawClass: security
    code: |
      async function handle(request) {
        const response = await route(request); // the app's own routes
        const origin = request.headers.get("Origin");
        response.headers.set("Access-Control-Allow-Origin", origin);
        response.headers.set("Access-Control-Allow-Credentials", "true");
        response.headers.set("Vary", "Origin");
        return response;
      }
    prompt: >-
      An assistant wrote this, and the error is gone. Now any site a signed-in user visits can
      read their data from your API. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It copies back whatever origin asked, trusted or not
        correct: true
        feedback: >-
          Yes. Echoing every origin with credentials is `*` in disguise. Check an allow-list first.
      - text: '`Vary: Origin` tells caches to share replies'
        feedback: >-
          The opposite: it stops a cache serving one origin's reply to another. It's correct here.
      - text: Credentials should be `"false"` as text
        feedback: >-
          The app needs cookies, so `true` is right. The danger is who it's true for.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A request from an unlisted origin
          correct: true
          feedback: >-
            Yes. It should get no `Access-Control-Allow-Origin` header back.
        - text: A request from the app's own origin
          feedback: >-
            That passes before and after the fix. Only a stranger's origin shows the echo.
        - text: A request sent without cookies
          feedback: >-
            The origin is echoed with or without cookies. What matters is which origin asks.
    fix: |
      const allowed = ["https://app.example.com"];
      async function handle(request) {
        const response = await route(request);
        const origin = request.headers.get("Origin");
        if (allowed.includes(origin)) {
          response.headers.set("Access-Control-Allow-Origin", origin);
          response.headers.set("Access-Control-Allow-Credentials", "true");
        }
        response.headers.set("Vary", "Origin");
        return response;
      }

  - type: explain-back
    id: explain-cors-not-a-guard
    concept: security.same-origin-policy
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A teammate says: "We never set CORS headers, so other sites can't touch our API." What
      does that protect? What doesn't it?
    rubric:
      - Without CORS headers, scripts on other origins can't read the API's responses in a browser.
      - The requests still reach the server and can change things, and non-browser clients ignore CORS entirely.
      - The API needs its own authentication and authorisation checks, plus CSRF defences for cookie-based writes.
    modelAnswer: >-
      It stops one thing: a script on another site can't read our responses in a browser. It
      doesn't stop the request. Another site's page can still send a POST, with the visitor's
      cookies, and our server will act on it. That's CSRF, and it needs SameSite cookies or a
      token. And `curl` or a script on a server ignores CORS completely. So every endpoint
      still checks who is calling and what they may do.

recap:
  - Tell whether two URLs share an origin by scheme, host and port.
  - Allow only exact, listed origins in `Access-Control-Allow-Origin`.
  - Remember CORS hides replies, never requests, and refuses `*` with cookies.

recall:
  - id: card-sop
    concept: security.same-origin-policy
    front: Under the same-origin policy, what may a script do with another origin, and what may it not?
    back: >-
      It may send requests there. It may not read the responses unless that server allows it
      with CORS.
  - id: card-cors-not-guard
    concept: security.cors
    front: Your API sends no CORS headers. Can another site's page still make it change data?
    back: >-
      Yes. The request is sent and the server acts on it. CORS only hides the response from
      the script.
  - id: card-wildcard-credentials
    concept: security.cors-credentials
    front: What must a server send so a cross-origin `fetch` with cookies can read the reply?
    back: >-
      The exact origin in `Access-Control-Allow-Origin`, not `*`, and
      `Access-Control-Allow-Credentials: true`.

