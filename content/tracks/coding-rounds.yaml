# Path: the coding patterns behind live coding rounds. Schema: fastTrackSchema in src/core/content/notes.ts.
title: Algorithms and coding patterns
name: Algorithms
order: 4
promise: Recognise the pattern behind a coding question and code it cleanly in TypeScript or Python, out loud.
outcomes:
  - Pick the pattern from the task's shape in the first two minutes
  - Code hash maps, stacks, sliding windows, heaps, binary search and graph walks from memory
  - Write retry, a promise pool and a rate limiter in TypeScript and Python without looking anything up
  - Code the AI building blocks, from cosine top-k to an SSE parser and token sampling
decision: Will someone watch you solve a coding problem live?
readyWhen:
  - You can name the pattern behind a new problem within two minutes and say why.
  - You can code the nine classic patterns from an empty file, in TypeScript and in Python.
  - You can write retry with jitter, a promise pool and a token bucket without looking anything up.
  - You can code cosine top-k, a chunker, an SSE parser and token sampling, and test them.
  - You can state the time and space complexity of everything you write.
proof:
  title: Sixteen challenges, solved again from empty files
  evidence:
    - Each challenge passing its tests in TypeScript and in Python
    - The pattern and Big-O written above each solution
    - One solution recorded while thinking out loud, under 30 minutes
coverage:
  covered: [Hash maps, stacks, sliding windows, heaps, binary search and graph walks, Async utilities, The AI building blocks]
  partial: [Dynamic programming, Two pointers]
  outside: [Hard competitive programming, Low-level systems questions]
summary: >-
  The sixteen challenges interviewers reach for most: nine classic patterns, three async
  utilities and four AI building blocks, each coded and tested.
method:
  - Do the lesson in the app, then read its notes.
  - Solve each challenge again from an empty file a day later.
  - Say the pattern, the brute force and the Big-O out loud before you type.
shapes:
  - label: Live coding
    text: >-
      Restate, ask about input size and edge cases, work a small example, give the brute force
      and its cost, name the pattern, code it, test the edges aloud, state the complexity.
  - label: Stuck
    text: >-
      Say what you know, solve a smaller case by hand, and ask one precise question. Silence is
      the only wrong answer.
days:
  - title: Classic patterns
    why: >-
      Nine patterns solve most of what a live round asks. Two Sum, anagrams, brackets, the
      longest substring, intervals, top K, binary search, islands and an LRU cache.
    artifact: "Nine patterns you can code from memory"
    must: [algo.hash-map-patterns, algo.stacks-and-queues, algo.sliding-window, algo.intervals-and-greedy, algo.heaps-and-top-k, algo.binary-search-patterns, algo.bfs-and-dfs, interview.utilities]
    should: [algo.two-pointers, algo.dynamic-programming]
    tests:
      - { test: screen-b }
      - { task: nesting-break }
      - { task: episode-batches }
      - { task: ready-teams }
      - { task: rolling-snowballs }
      - { task: widest-banner }
      - { task: first-day-at-level }
      - { task: even-seasons }
      - { task: discount-bundles }
      - { task: few-label-stretches }
      - { task: stepping-stones }
      - { task: trail-score }
      - { test: screen-d }
  - title: Async utilities
    why: >-
      Senior TypeScript rounds ask for real utilities: retry with backoff and jitter, a promise
      pool that keeps order, and a token bucket.
    artifact: "Three async utilities, tested"
    must: [js.promises, scale.failure-handling, security.abuse-and-privacy]
    should: [js.fetch-cancellation, js.event-loop]
    tests: [{ lab: event-loop-stepper }]
  - title: AI building blocks
    why: >-
      AI engineering rounds ask you to code the parts: similarity search, a chunker, a stream
      parser and the sampling step of a model.
    artifact: "Four AI building blocks, tested"
    must: [ai.embeddings, ai.chunking-and-hybrid, interview.streaming-build, ai.how-llms-work]
    should: [algo.mock-round]
