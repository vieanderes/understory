term: Server Component
aka:
  - React Server Component
  - RSC
short: A React component that runs only on the server, can read data and secrets, and ships no JavaScript.
explain: |
  In the Next.js App Router every component runs on the server unless you mark it. It can be
  `async`, query a database directly and use secret keys. Only its HTML output reaches the
  browser, not its code.

  The catch: it can't hold state, run effects or handle clicks, because it never runs in the
  browser. Keep the page made of these, and mark only the interactive leaves as Client
  Components.
analogy: A restaurant kitchen. The cooking happens out of sight, and you only get the plate.
example:
  language: tsx
  code: |
    export default async function OrdersPage() {
      const orders = await db.order.findMany();
      return (
        <ul>
          {orders.map((o) => <li key={o.id}>{o.total}</li>)}
        </ul>
      );
    }
usage: Keep the page a Server Component and move only the like button to the client.
twin:
  term: client-component
  difference: A Server Component runs only on the server and sends HTML, no code. A Client Component also runs in the browser, so it can use state, effects and clicks.
related:
  - client-component
  - hydration
level: 2
lessons:
  - next.server-and-client-components
