    url: https://letsencrypt.org/how-it-works/
    note: Domain validation and issuance, told step by step.
    verified: true

deepDive: >-
  The `dig` output is real, from macOS's `dig` 9.10.6 in September 2026. Through the resolver
  1.1.1.1 the TTL on `example.com` fell from 217 to 212 across a short sleep. The domain's own
  name server answered 300 every time, because it holds the original and caches nothing.
  `example.com` and `iana.org` are run for documentation, so they are safe to query.


  `example.com`'s real certificate lists `example.com` and `*.example.com`, and runs from 29
  July to 27 October 2026, about 90 days. For the missing-name catch we made a self-signed
  certificate for `notes.test` with `openssl req`, served it from Node, and told curl 8.7 to
  trust it with `--cacert`. `notes.test` printed `ok`. `www.notes.test` failed with exit code
  60 and the message above. Without `--cacert`, curl refused both with "self signed
  certificate": the signer check fails first.


  We couldn't run ACME here, because it needs a public domain. That part rests on RFC 8555
  and Let's Encrypt's documentation. The authority checks control by fetching a token from
  your server over HTTP, or by reading a `TXT` record you publish. The DNS way is the only
  one that can prove a wildcard. Lesson 7 has a proxy that runs ACME and ends TLS for your
  app.


  A `CNAME` can't live beside other records for the same name. The bare domain always has
  `NS` and `SOA` records, so it can't be a `CNAME`. Many DNS hosts offer a flattened record
  to work round that. It looks like a `CNAME` to you, and is served as an `A`.
