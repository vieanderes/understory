term: window function
aka: [OVER clause, PARTITION BY, row_number]
short: A SQL calculation over a group of related rows that keeps every row instead of collapsing them.
explain: |
  Sometimes you want a per-group figure next to each row, not instead of it. Think of each
  order with its customer's running total, or the top three posts per author. Grouping can't do that,
  because it squashes each group into one line.

  A window function adds `OVER (PARTITION BY ... ORDER BY ...)` to say which rows it looks
  at. `row_number()`, `rank()`, `lag()` and running `sum()` are the everyday ones. They run
  after `WHERE` and grouping, so filter on their result in an outer query.
analogy: A class photo with each pupil's height rank written under them. Everyone stays in the picture; each gets a number from the group.
example:
  language: sql
  code: |
    SELECT * FROM (
      SELECT title, author_id,
        row_number() OVER (PARTITION BY author_id ORDER BY likes DESC) AS rn
      FROM posts
    ) ranked
    WHERE rn <= 3;
usage: For top three per category, use a window function with row_number rather than a loop of queries.
related: [aggregate-function, join]
level: 3
lessons: [db.grouping, pro.sql]
