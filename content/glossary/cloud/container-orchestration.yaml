term: container orchestration
aka: [ orchestrator, Kubernetes, K8s ]
short: Software that keeps a declared number of app copies running across many machines and replaces any that fail.
explain: |
  One container on one machine is manageable. Running fifty across ten machines, restarting
  crashed ones and moving them when a machine dies, needs a manager.

  You declare what you want, such as three copies of the API with a health check. The system
  keeps making reality match. It schedules containers onto machines, restarts them, rolls out
  new versions and routes traffic to healthy ones. Kubernetes is the common open source one,
  and its power comes with a lot to learn.
analogy: A head waiter who keeps every table staffed. When a waiter goes home sick, someone else covers their tables.
example:
  language: yaml
  code: |
    kind: Deployment
    spec:
      replicas: 3
      template:
        spec:
          containers:
            - name: api
              image: shop-api:1.4.2
usage: We don't need container orchestration for two services; Compose on one server will do.
related: [ container, health-check, autoscaling, infrastructure-as-code ]
level: 3
lessons: [ cloud.kubernetes ]
