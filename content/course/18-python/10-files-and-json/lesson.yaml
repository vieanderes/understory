id: python.files-and-json
title: Files, with and JSON
objective: Read and write files with pathlib and with, and turn JSON into Python values and back.
level: essential
minutes: 10
concepts: [python.pathlib, python.context-managers, python.json-module]
prerequisites: [python.errors-and-files]
opening:
  text: >-
    Datasets, configs and eval results live in files, and most of them are JSON. You'll
    read and write both safely, and turn JSON into Python values and back.

steps:
  - type: prose
    id: files-with-pathlib
    body: |-
      Files are read and written with `Path`, from the standard library's `pathlib`:

      ```python
      from pathlib import Path

      path = Path("notes.txt")
      path.write_text("Buy milk\n")
      print(path.read_text())
      print(path.exists())   # True
      ```

      `write_text` replaces the whole file, and `read_text` returns all of it as one
      string. `/` joins the parts of a path on any system: `Path("data") / "users.json"`.

  - type: fill-blank
    id: fill-pathlib
    concept: python.pathlib
    difficulty: 2
    prompt: Build the path `reports/june.csv`, then read the whole file as text.
    language: python
    template: |
      from pathlib import Path

      path = Path("reports") {{1}} "june.csv"
      text = path.{{2}}()
    blanks:
      - key: '1'
        answer: /
      - key: '2'
        answer: read_text
    bank: [/, +, read_text, read, open]

  - type: prose
    id: with-blocks
    body: |-
      To add to a file, or read a big one line by line, open it. The mode `"a"` adds to the
      end, `"w"` writes from empty, and no mode reads:

      ```python
      with path.open("a") as f:
          f.write("Call the bank\n")

      with path.open() as f:
          for line in f:
              print(line.strip())
      ```

      The **`with`** block closes the file when it ends, even when an exception leaves it
      early. An object that sets up and tidies up like this is a **context manager**.

  - type: bug-hunt
    id: hunt-write-mode
    concept: python.context-managers
    difficulty: 2
    language: python
    code: |
      from pathlib import Path


      def log_result(line):
          with Path("results.log").open("w") as f:
              f.write(line + "\n")


      log_result("case 1: pass")
      log_result("case 2: fail")
    prompt: Each call should add a line to the log. The file only ever holds the last one. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`"w"` empties the file each time it opens'
        correct: true
        feedback: >-
          Right. `"a"` adds to the end instead.
      - text: '`with` deletes the file when it ends'
        feedback: >-
          `with` only closes it. The emptying happens when `"w"` opens it.
      - text: '`write` replaces what is already there'
        feedback: >-
          `write` adds where the file is up to. Opening with `"w"` already emptied it.
    fix: |
      def log_result(line):
          with Path("results.log").open("a") as f:
              f.write(line + "\n")

  - type: prose
    id: json-module
    body: |-
      **JSON** text becomes Python values with the `json` module. `json.loads` reads a
      string, and `json.dumps` writes one:

      ```python
      import json

      order = json.loads('{"id": 7, "paid": true, "note": null}')
      print(order["paid"])   # True
      text = json.dumps(order, indent=2)
      ```

      Objects become dicts and arrays become lists. `true` becomes `True`, and `null`
      becomes `None`. `dumps` turns them back into valid JSON, and `indent` makes it
      readable.

  - type: predict-output
    id: predict-json-loads
    concept: python.json-module
    difficulty: 3
    language: python
    code: |
      import json

      data = json.loads('{"done": true, "tags": null}')
      print(data)
    question: What does this show?
    choices:
      - text: "`{'done': True, 'tags': None}`"
        correct: true
        feedback: >-
          Right. It's now a Python dict, printed with Python's spelling.
      - text: '`{"done": true, "tags": null}`'
        feedback: >-
          That's the JSON text. `loads` turned it into a dict with Python values.
      - text: "`{'done': 'true', 'tags': 'null'}`"
        feedback: >-
          `loads` converts values, not only keys. `true` becomes the boolean `True`.

  - type: ai-review
    id: review-str-not-json
    concept: python.json-module
    difficulty: 3
    language: python
    request: Write save_results(path, results), saving a dict of eval results as JSON.
    flawClass: logic
    code: |
      from pathlib import Path


      def save_results(path, results):
          Path(path).write_text(str(results))
    prompt: >-
      An assistant wrote this. The dashboard that reads the file fails with `Expecting
      property name enclosed in double quotes`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`str` writes Python''s spelling, not JSON'
        correct: true
        feedback: >-
          Right. `json.dumps(results)` writes double quotes, `true` and `null`.
      - text: '`write_text` can only write lists'
        feedback: >-
          It writes any string. The string itself isn't JSON.
      - text: The path needs a `.json` ending
        feedback: >-
          A name doesn't change what's inside. The text is Python's, not JSON.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Load the file with `json.loads` and compare
          correct: true
          feedback: >-
            Yes. A round trip fails at once on Python's spelling.
        - text: Check that the file exists after saving
          feedback: >-
            The file exists, full of text. The trouble is that the text isn't JSON.
        - text: Check that the file isn't empty
          feedback: >-
            It isn't empty. Only reading it back as JSON shows it's the wrong format.
    fix: |
      import json
      from pathlib import Path


      def save_results(path, results):
          Path(path).write_text(json.dumps(results, indent=2))

  - type: code-challenge
    id: write-save-and-load
    concept: python.json-module
    difficulty: 3
    language: python
    starter: scores.starter.py
    solution: scores.solution.py
    tests: scores.tests.py
    prompt: >-
      Write `save_scores(path, scores)`, which saves a dict as JSON, and
      `load_scores(path)`, which reads it back. When the file doesn't exist yet,
      `load_scores` returns an empty dict.


      Example: after `save_scores("s.json", {"ana": 7})`, `load_scores("s.json")` returns
      `{"ana": 7}`.
    hints:
      - 'The pathlib step writes and reads whole files. The JSON step converts both ways.'
      - '`json.dumps` gives the text to write. `json.loads` turns it back into a dict.'
      - 'In `load_scores`, check `Path(path).exists()` first and return `{}` when it is false.'

  - type: explain-back
    id: explain-with
    concept: python.context-managers
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why is `with path.open("w") as f:` safer than calling `f = path.open("w")` and then
      `f.close()` at the end?
    rubric:
      - If an exception happens first, the manual `close()` line never runs.
      - '`with` closes the file when the block ends, however it ends.'
      - So the file is never left open or half written.
    modelAnswer: >-
      With the manual version, an exception before the last line skips `f.close()`. The file
      stays open, and what you wrote may never reach the disk. A `with` block closes it
      however the block ends.

recap:
  - Read and write whole files with `Path`, and build paths with `/`.
  - Open files in a `with` block, with `"a"` to add and `"w"` to start again.
  - Turn JSON into dicts with `json.loads`, and back with `json.dumps`.
recall:
  - id: card-path-join
    concept: python.pathlib
    front: How do you build the path `data/users.json` with `pathlib`?
    back: >-
      `Path("data") / "users.json"`.
  - id: card-with
    concept: python.context-managers
    front: What does a `with` block guarantee for a file?
    back: >-
      The file is closed when the block ends, even if an exception left it early.
  - id: card-write-mode
    concept: python.context-managers
    front: Which mode adds lines to the end of a file without emptying it?
    back: >-
      `"a"`, for append. `"w"` empties the file first.
  - id: card-json-values
    concept: python.json-module
    front: What do JSON `true` and `null` become after `json.loads`?
    back: >-
      `True` and `None`.
  - id: card-dumps-not-str
    concept: python.json-module
    front: Why write a dict to a file with `json.dumps` rather than `str`?
    back: >-
      `str` gives Python's spelling, with single quotes and `True`, which isn't valid JSON.

