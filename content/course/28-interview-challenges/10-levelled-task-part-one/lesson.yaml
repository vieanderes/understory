id: interview.levelled-one
title: Levelled task, part one
objective: Build the first two levels of an in-memory database so the later levels do not force a rewrite.
level: advanced
minutes: 10
concepts: [interview.levelled-design, interview.record-store]
prerequisites: [interview.utilities]
opening:
  text: >-
    You'll build the first two levels of a classic levelled task: a small in-memory
    database. Get the shape right now and levels 3 and 4 slot in without a rewrite.

steps:
  - type: prose
    id: the-format
    body: |-
      What you need: JavaScript classes and `Map`. A **levelled task** is one project in four
      levels, often in 90 minutes. Level 1 is basic operations. Level 2 adds processing.
      Level 3 adds a harder feature, and level 4 forces a change to your design.

      Most people don't finish, and that's expected. What hurts is a level 1 so rigid that
      level 3 needs a rewrite.

  - type: multiple-choice
    id: pick-unlock
    concept: interview.levelled-design
    difficulty: 1
    question: In a levelled task, when can you see level 2?
    choices:
      - text: When your level 1 code passes its tests
        correct: true
        feedback: >-
          Yes. Each level unlocks once the one before it passes.
      - text: After a fixed number of minutes
        feedback: >-
          The clock runs for the whole task, but levels open on passing tests, not on time.
      - text: From the start, all four at once
        feedback: >-
          You'd plan differently if you could. You only see the next level once you've earned it.

  - type: bug-hunt
    id: hunt-flat-key
    concept: interview.record-store
    difficulty: 2
    language: js
    code: |
      class Database {
        data = new Map(); // "key.field" -> value
        set(key, field, value) {
          this.data.set(`${key}.${field}`, value);
        }
        scan(key) {
          const out = [];
          for (const [path, value] of this.data) {
            const [k, field] = path.split('.');
            if (k === key) out.push(`${field}(${value})`);
          }
          return out.sort();
        }
      }
    prompt: >-
      The store for this task keeps one flat `Map`. A hidden test sets the field `v1.2` on
      `app`, and `scan('app')` returns `v1(beta)`. Tap the line at fault.
    lines: [9]
    reasons:
      - text: Splitting on `.` breaks a field that has a dot
        correct: true
        feedback: >-
          Yes. `app.v1.2` splits into three parts. A map of maps never splits anything.
      - text: '`sort` puts the fields in the wrong order'
        feedback: >-
          String order is what scans usually ask for. The field name itself is cut short.
      - text: The template string drops the value
        feedback: >-
          The value `beta` is there. It's the field name that comes out as `v1`.
    fix: |
      const cut = path.indexOf('.'); // better still: a Map of Maps, so nothing is split
      const k = path.slice(0, cut);
      const field = path.slice(cut + 1);

  - type: multiple-choice
    id: pick-model
    concept: interview.levelled-design
    difficulty: 2
    question: Level 3 will add an expiry time to each field. Which level 1 model takes it best?
    choices:
      - text: A map of maps holding `{ value }` objects
        correct: true
        feedback: >-
          Yes. Level 3 adds `expiresAt` to the object and no caller changes.
      - text: A map of maps holding plain strings
        feedback: >-
          Close, and fine for level 1. Adding expiry means changing every place that reads a string.
      - text: One flat map keyed by `key.field`
        feedback: >-
          Scans then walk every field in the database, and a `.` inside a key breaks the split.
      - text: An array of `[key, field, value]` rows
        feedback: >-
          Every get becomes a linear search. Hidden large tests will time out.

  - type: prose
    id: design-for-level-four
    body: |-
      Design level 1 for level 4, but don't build level 4. You can't see it yet.

      Keep the model small and clear: a map of records, each a map of fields. Store each
      value in an object, so extra facts about it have a home. Route every read through
      one place, so a new rule changes one method.

  - type: fill-blank
    id: fill-scan-prefix
    concept: interview.record-store
    difficulty: 3
    prompt: >-
      Level 2 wants `scanByPrefix` to return `field(value)` strings, sorted by field name.
      Complete it.
    language: ts
    template: |
      scanByPrefix(key: string, prefix: string): string[] {
        const record = this.records.get(key) ?? new Map();
        return [...record.entries()]
          .filter(([field]) => field.{{1}}(prefix))
          .sort(([a], [b]) => (a < b ? {{2}} : 1))
          .map(([field, entry]) => `${field}(${entry.value})`);
      }
    blanks:
      - key: '1'
        answer: startsWith
      - key: '2'
        answer: '-1'
    bank: [startsWith, includes, endsWith, '-1', '0', '1']

  - type: ai-review
    id: review-set-wipes-record
    concept: interview.record-store
    difficulty: 3
    language: js
    request: Write level 1 of the store, with set and get on a record's fields.
    flawClass: logic
    code: |
      class Database {
        records = new Map();
        set(key, field, value) {
          this.records.set(key, new Map([[field, { value }]]));
        }
        get(key, field) {
          return this.records.get(key)?.get(field)?.value ?? null;
        }
      }
    prompt: >-
      An assistant wrote this. Its test set one field and read it back, and it passed. Now
      the level 2 scan test fails. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Each set replaces the whole record
        correct: true
        feedback: >-
          Yes. A new `Map` goes in every time, so earlier fields vanish.
      - text: The `?.` chain hides a missing key
        feedback: >-
          That's on purpose. A missing key or field should give `null`, and it does.
      - text: Values should be stored as plain strings
        feedback: >-
          The object is the good part. It gives level 3 somewhere to put an expiry.
    verify:
      question: 'Which test would have caught this?'
      choices:
        - text: 'Set two fields on one key, then read both'
          correct: true
          feedback: >-
            Yes. The second set wipes the first field.
        - text: 'Set one field, then read it back'
          feedback: >-
            That's the test that passed. With one field there's nothing to lose.
        - text: 'Get a key that was never set'
          feedback: >-
            It returns `null` in both versions, so it can't catch the wiped record.
    fix: |
      if (!this.records.has(key)) this.records.set(key, new Map());
      this.records.get(key).set(field, { value });

  - type: code-challenge
    id: write-levels-one-and-two
    concept: interview.record-store
    difficulty: 4
    language: ts
    prompt: >-
      Write a `Database` class. Each key holds a record, and each record holds fields with
      string values.


      Level 1: `set(key, field, value)` stores a value and returns nothing. `get(key,
      field)` returns the value, or `null` if there isn't one. `delete(key, field)` returns
      `true` if it removed a field, otherwise `false`.


      Level 2: `scan(key)` returns every field as `field(value)`, sorted by field name.
      `scanByPrefix(key, prefix)` keeps only fields that start with the prefix. A missing
      key gives `[]`.


      So after `set('book1', 'title', 'Dune')`, `scan('book1')` is `['title(Dune)']`. A test
      stores 100,000 fields, so every operation needs to be quick.
    hints:
      - Think about the lookups first. A get should never walk through other records.
      - 'A `Map` from key to a `Map` from field to `{ value }` gives both lookups in constant time.'
      - '`scan(key)` is `scanByPrefix(key, '''')`, because every string starts with the empty string.'

  - type: explain-back
    id: explain-entry-object
    concept: interview.levelled-design
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      You stored each field as `{ value }` instead of a plain string. Why does that choice
      pay off when level 3 adds expiry?
    rubric:
      - Level 3 needs to keep an expiry time next to each value.
      - An object gives that time a place without changing the shape of the store.
      - Only the code that reads an entry changes, so the level 1 and 2 behaviour stays intact.
    modelAnswer: >-
      Expiry is a new fact about each value. With an object per field, I add `expiresAt` to
      it and check it in the one helper that reads entries. The maps, the callers and the
      level 1 and 2 tests stay as they were. With plain strings I'd have to change the
      stored shape and every read.

recap:
  - Spot a levelled task and plan level 1 for later levels.
  - Model records as a map of maps holding entry objects.
  - Scan fields by prefix, sorted, in a stated format.
recall:
  - id: card-level-unlock
    concept: interview.levelled-design
    front: In a levelled task, what unlocks the next level?
    back: >-
      Passing the current level's tests. You usually aren't expected to finish all four.
  - id: card-design-rule
    concept: interview.levelled-design
    front: What's the design rule for level 1 of a levelled task?
    back: >-
      Keep the model small and clear, with room for more facts per value, so later levels
      extend it instead of rewriting it.
  - id: card-record-model
    concept: interview.record-store
    front: What data model fits a store of records with fields?
    back: >-
      A `Map` from key to a `Map` from field to an entry object. Both lookups are constant
      time.
  - id: card-scan-format
    concept: interview.record-store
    front: How does a prefix scan produce predictable output?
    back: >-
      Filter the fields with `startsWith`, sort by field name, then format each one the
      same way.

references:
  - kind: docs
    title: Map
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
    note: Fast lookup by key and insertion order, the two properties this store leans on.
    verified: true

deepDive: >-
  The format comes from levelled-task assessments: one project, four levels,
  90 minutes. Level 1 covers basic operations and corner cases. Level 2 adds processing such as
  calculations or exports, and level 3 an advanced feature. Level 4 is an extension that forces
  a refactor while earlier levels keep passing. Reported variants include this in-memory
  database, a bank system, file storage with quotas and a credits system with expiry.


  The score is the share of tests passed across the levels you reach. Finishing level 3
  cleanly usually beats a rushed, broken level 4, so bank each level before moving on.


  Watch the output format. Hidden tests compare strings exactly, so `title(Dune)` with a
  space in it fails. Read the stated return values twice: many levelled tasks return
  strings such as `"true"` rather than booleans. Match whatever the statement says.
