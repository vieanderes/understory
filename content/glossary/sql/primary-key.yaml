term: primary key
aka: [PK]
short: The column whose value picks out exactly one row in a table, and never repeats.
explain: |
  Two customers can share a name, a birthday, even an address. The database still needs a
  way to point at one of them and only one. So every table gets a column that is unique and
  never empty, usually called `id`.

  The database enforces both rules: a second row with the same value is refused, and so is
  a `NULL`. Pick a value with no meaning outside the database, such as a generated number
  or a UUID. Emails and phone numbers change; a primary key shouldn't.
analogy: A cloakroom ticket. Two coats can look identical, but ticket 47 belongs to one coat only.
example:
  language: sql
  code: |
    CREATE TABLE customers (
      id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      email text NOT NULL,
      name  text NOT NULL
    );
usage: Don't use the email as the primary key; people change their email, and every order would break.
twin:
  term: foreign-key
  difference: A primary key names a row in its own table. A foreign key is a copy of another table's primary key, pointing across to that row.
related: [foreign-key, index, join]
level: 1
lessons: [db.relational-model]
