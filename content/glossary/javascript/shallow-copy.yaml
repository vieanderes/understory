term: shallow copy
short: A new outer object or array whose nested objects are still shared with the original.
explain: |
  `{ ...user }` and `[...list]` make a new container. The top level is yours to change. But
  if `user.address` is an object, both copies point at the same address.

  So changing `copy.name` is safe, and changing `copy.address.city` edits the original too.
  For nested state, copy each level you change, or take a deep copy when you need a fully
  separate one.
analogy: A new folder holding the same papers. Write on a paper, and it's changed in both folders.
example:
  language: js
  code: |
    const user = { name: 'Sam', address: { city: 'Leeds' } };
    const copy = { ...user };
    copy.name = 'Alex'; // original unchanged
    copy.address.city = 'York'; // original changed too
usage: The spread is only a shallow copy, so the nested items array is still shared.
twin:
  term: deep-copy
  difference: A shallow copy duplicates only the outer layer, so nested objects stay shared. A deep copy duplicates every layer, so nothing is shared.
related:
