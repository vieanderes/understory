term: build artefact
aka: [ artefact, artifact, build artifact, build once deploy many ]
short: The single packaged output of one build, tagged with its commit and promoted unchanged through every environment.
explain: |
  If staging and production each build the code, they can end up running different things. A
  dependency may change between builds.

  So build once. The pipeline makes one artefact, such as an image tagged with the commit.
  That same artefact moves from staging to production. Only configuration differs per
  environment. A rollback is then redeploying the previous artefact, which already exists.
analogy: A sealed parcel with a tracking number. It's checked at each depot, never repacked.
usage: Production should run the same build artefact staging tested, not a fresh build from main.
related: [ container-image, continuous-delivery, rollback ]
level: 2
lessons: [ cloud.ci-cd, cloud.releases ]
