term: load balancer
aka: [load balancing, reverse proxy]
short: A server in front of several app copies that hands each incoming request to one of them.
explain: |
  One copy of your app can only serve so many people. Run four copies and something has to
  decide which copy gets each request. That's the job here, along with skipping a copy
  that has stopped answering.

  It checks each copy with a **health check** and spreads the work, often round robin or
  to the least busy. It works best when the copies are **stateless**: no session or upload
  kept in one copy's memory, because the next request may land on another copy.
analogy: The host at a busy restaurant, sending each new group to whichever waiter has a free table.
usage: Sessions vanish at random because they live in memory, and the load balancer sends people to a different server each time.
related: [horizontal-scaling, single-point-of-failure, throughput]
level: 1
lessons: [backend.what-a-backend-is, cloud.scaling-and-cost, cloud.reverse-proxies]
