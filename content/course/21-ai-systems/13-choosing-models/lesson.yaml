id: aisys.choosing-models
title: Choosing and hosting a model
objective: Choose between frontier and open-weight models, weigh self-hosting and fine-tuning against prompting, route by risk, and read a provider's data terms.
level: advanced
minutes: 10
concepts: [aisys.frontier-vs-open-weights, aisys.fine-tuning-vs-prompting, aisys.risk-routing, aisys.provider-data-terms]
prerequisites: [aisys.cost-and-latency, aisys.pii-and-privacy, aisys.classifiers-at-the-fork]
opening:
  text: >-
    You'll pick the model for each request on evidence: what it costs, how well it was
    measured, and where the data may go. It's the decision behind every AI feature's bill
    and its privacy notice.

steps:
  - type: prose
    id: frontier-and-open-weights
    body: |-
      A **frontier model** is a provider's strongest model, reached through an API. An
      **open-weight model** publishes its weights, so you can run it on your own GPUs.

      Self-hosting buys control: the data stays in your network, and the version never
      changes under you. It costs GPUs that bill whether busy or idle, people to run them,
      and your own evals for every upgrade.

  - type: multiple-choice
    id: pick-low-volume
    concept: aisys.frontier-vs-open-weights
    difficulty: 1
    question: A gym classifies 300 sign-up forms a day. Which costs least to run?
    choices:
      - text: A small API model, paid per call
        correct: true
        feedback: >-
          Right. At this volume, per-call pricing comes to pennies a day.
      - text: An open-weight model on a rented GPU
        feedback: >-
          The GPU bills around the clock for a few minutes of work each day.
      - text: A fine-tuned model on your own server
        feedback: >-
          That needs training data, a server and upkeep. Nothing here needs any of it.

  - type: prose
    id: three-levers
    body: |-
      When a model falls short, you have three levers.

      **Prompting**: clearer instructions and a few examples. Try it first, it's cheap and
      instant. **Retrieval**, as in chapter 20: when the model lacks facts, fetch them at
      question time. **Fine-tuning**: train a model further on many corrected examples. It
      teaches a narrow, stable task and its format, not fresh facts.

  - type: multiple-choice
    id: pick-term-dates
    concept: aisys.fine-tuning-vs-prompting
    difficulty: 2
    question: A school's assistant quotes last year's term dates. What fixes it for good?
    choices:
      - text: Retrieve the current calendar at question time
        correct: true
        feedback: >-
          Yes. The facts change every term, so fetch them fresh.
      - text: Fine-tune on this year's dates
        feedback: >-
          Facts baked into weights go stale next term. You'd retrain every time, and it may blend years.
      - text: Switch to a larger frontier model
        feedback: >-
          A bigger model doesn't know your calendar either. It needs the facts handed to it.

  - type: bug-hunt
    id: hunt-test-in-train
    concept: aisys.fine-tuning-vs-prompting
    difficulty: 3
    language: python
    code: |
      corrections = load_corrections()       # 50,000 enrolment forms a person fixed
      random.shuffle(corrections)
      test = corrections[:2000]
      train = corrections
      tuned = fine_tune("small-model", train)

      if accuracy(tuned, test) > accuracy(prompted, test):
          deploy(tuned)
    prompt: >-
      The tuned small model scored 99% against the prompted model's 93%. In production it did
      no better. Tap the line to fix.
    lines: [4]
    reasons:
      - text: The test forms are also in the training data
        correct: true
        feedback: >-
          Yes. It was graded on answers it had already seen.
      - text: Shuffling should happen after the split
        feedback: >-
          Shuffling first is right: it stops the test set being only the oldest forms.
      - text: Accuracy is the wrong measure for forms
        feedback: >-
          Accuracy is fine here. Any measure looks great on examples the model trained on.
    fix: |
      test, train = corrections[:2000], corrections[2000:]   # no form in both

  - type: fill-blank
    id: fill-risk-bar
    concept: aisys.risk-routing
    difficulty: 2
    language: python
    prompt: >-
      Route by risk. A request that moves money or reaches a customer clears a higher bar.
      Scores are measured per task on your eval set.
    template: |
      MIN_QUALITY = {"low": 0.85, "high": 0.95}

      def risk_of(request):
          if request.moves_money or request.sends_to_customer:
              return "{{1}}"
          return "low"

      def good_enough(model, request):
          score = model.quality.{{2}}(request.task)    # None if never measured
          return score is not None and score {{3}} MIN_QUALITY[risk_of(request)]
    blanks:
      - key: '1'
        answer: high
      - key: '2'
        answer: get
      - key: '3'
        answer: '>='
    bank: [high, low, get, values, '>=', '<']

  - type: prose
    id: data-terms
    body: |-
      Lesson 9 showed that sending personal data to a provider is processing. First, read
      its **data terms**, for the exact model and platform:

      - Is there a data processing agreement, a DPA?
      - Are your inputs used for training?
      - How long are inputs kept? Is zero retention offered for this model?
      - Where is the data processed?

      The same model through a cloud platform comes under that platform's terms.

  - type: ai-review
    id: review-fallback-ignores-dpa
    concept: aisys.provider-data-terms
    difficulty: 3
    language: python
    request: Add a backup model for when the main one fails.
    flawClass: data-exposure
    code: |
      def answer(form, models):
          allowed = [m for m in models if m.dpa or not form.personal_data]
          try:
              return call(allowed[0], form.text)
          except ProviderError:
              return call(models[-1], form.text)    # the backup endpoint
    prompt: >-
      An assistant wrote this. In tests the main model never failed. During an outage, gym
      membership forms with health notes went to a free trial endpoint with no DPA. Tap the
      line at fault.
    lines: [6]
    reasons:
      - text: The backup comes from all models, not the allowed ones
        correct: true
        feedback: >-
          Yes. The filter only guarded the first choice. The fallback skipped it.
      - text: The filter should also check the region
        feedback: >-
          Region may matter too, but these forms went to a model with no DPA at all.
      - text: It should retry the main model first
        feedback: >-
          A retry helps with blips, but once it gives up, the same leak happens.
    fix: |
      def answer(form, models):
          allowed = [m for m in models if m.dpa or not form.personal_data]
          for model in allowed:                     # every attempt obeys the filter
              try:
                  return call(model, form.text)
              except ProviderError:
                  continue
          return queue_for_later(form)
    verify:
      question: Which test would have caught this leak?
      choices:
        - text: Make the main model fail on a personal-data form
          correct: true
          feedback: >-
            That runs the fallback path with the data it must protect.
        - text: Make the main model fail on an anonymous form
          feedback: >-
            Any model may take that form, so the backup call looks fine.
        - text: Check the main model's DPA flag is true
          feedback: >-
            The main model was fine. The leak only happens on the path tests never ran.

  - type: code-challenge
    id: write-route-request
    concept: aisys.risk-routing
    difficulty: 4
    language: python
    starter: router.starter.py
    solution: router.solution.py
    tests: router.tests.py
    prompt: >-
      Write `route_request(request, models, budget_left)`. A request has `task`, `risk`
      (`"low"` or `"high"`) and `personal_data`. Each model has `name`, `cost`, `dpa` and
      `quality`, a dict of measured scores per task.


      A model is eligible if its score for the task reaches `MIN_QUALITY[risk]`. Its `cost`
      must be within `budget_left`. It needs a DPA whenever the request holds personal data. Return the cheapest eligible model's name. On equal cost, take the
      higher score. If none is eligible, return `"human"` for high risk and `"defer"` for low
      risk. Raise `ValueError` for any other risk.
    hints:
      - Filter first, choose second. Write the four conditions for one model, then keep the models that pass.
      - A task missing from `quality` means the model was never measured on it. Treat that as failing.
      - '`min(eligible, key=lambda m: (m["cost"], -m["quality"][task]))` picks cheapest first, then best.'

  - type: explain-back
    id: explain-api-over-self-hosting
    concept: aisys.frontier-vs-open-weights
    difficulty: 3
    audience: non-technical
    kind: decide
    prompt: >-
      The gym owner asks why you pay per call for an API model. A free open model could
      run on the office server. Defend your choice.
    rubric:
      - At a few hundred forms a day, per-call costs are tiny next to running a server.
      - Self-hosting needs someone to run, secure, update and re-test the model.
      - The provider's terms cover the members' data, and the choice is revisited if volume or rules change.
    modelAnswer: >-
      The model is free, but running it isn't. We handle a few hundred forms a day. That
      costs pennies per call. A big enough server costs far more each month. Someone must
      also run it, patch it and test each update. The provider has a contract
      covering our members' data and doesn't train on it. If volume grows a lot, or the data
      must stay in house, I'll look again.

recap:
  - Weigh an API's frontier model against self-hosting open weights, including GPUs, ops and evals.
  - Reach for prompting first, retrieval for facts, and fine-tuning for a narrow task with many corrections.
  - Route each request by risk and measured quality, and only to models whose data terms allow its data.

recall:
  - id: card-self-hosting-cost
    concept: aisys.frontier-vs-open-weights
    front: What does self-hosting an open-weight model cost beyond the download?
    back: >-
      GPUs that bill whether busy or idle, people to run and secure them, and your own evals
      for every model upgrade.
  - id: card-fine-tune-when
    concept: aisys.fine-tuning-vs-prompting
    front: When does fine-tuning beat prompting and retrieval?
    back: >-
      For a narrow, stable task with thousands of corrected examples, often to make a small
      model good enough. Not for facts that change.
  - id: card-risk-routing
    concept: aisys.risk-routing
    front: What should decide which model a request goes to?
    back: >-
      Code, before the call: the cost of a wrong answer, the model's measured score on this
      task, the budget, and whether its data terms allow this data.
  - id: card-data-terms
    concept: aisys.provider-data-terms
    front: Which four questions do you ask of a provider's data terms?
    back: >-
      Is there a DPA, are inputs used for training, how long are they kept, and where are
      they processed. Ask per model and per platform.

references:
  - kind: paper
    title: 'LoRA: Low-Rank Adaptation of Large Language Models'
    authors: Edward J. Hu and others
    year: 2021
    venue: arXiv
