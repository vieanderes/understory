deepDive: >-
  Durability comes from the **write-ahead log**. Before `COMMIT` returns, Postgres writes the
  change to a log on disk. After a crash, it replays the log, so committed work comes back and
  half-done work doesn't.


  Every single statement is a transaction of its own. An `UPDATE` that changes a thousand rows
  changes all thousand or none. `BEGIN` is for grouping several statements.


  After an error inside a transaction, Postgres answers every further statement with `current
  transaction is aborted, commands ignored until end of transaction block`. Only `ROLLBACK`
  gets you out.


  `SAVEPOINT` marks a spot you can roll back to without losing the whole transaction. Some
  ORMs use it for nested transactions.


  A transaction ends at the edge of one database. When a process also charges a card or
  calls another service, "Steps that span systems" shows how sagas and compensations take
  over.
