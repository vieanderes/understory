term: sink
aka:
  - data sink
  - leak sink
short: Any place data lands after leaving your code, such as a log, a URL or analytics.
explain: |
  A password field enters the app. Where does it go next? Into a log line, an error report,
  a cache, a third-party tracker, a prompt to a model. Each of those keeps a copy.

  Each destination has more readers or a longer life than the form it came from. So a
  security review traces a sensitive field from where it enters to every place it lands.

  Test it with fake values. Plant a marker, run the flow, then search every destination
  for it.
analogy: Every drain in a house. Pour dye in the sink and see which pipes it comes out of.
usage: The error tracker is a sink too; the full request body is in there.
related:
  - secret
  - canary-token
  - structured-logging
  - threat-model
level: 3
lessons:
