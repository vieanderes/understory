term: test-time compute
aka: [inference-time compute, inference-time scaling, test-time scaling]
short: Extra computation spent per question while answering, by thinking longer, sampling more or searching.
explain: |
  You can make a model better by training it more. You can also make it better at answer
  time, by letting it do more work on each question. It can think for longer, try several
  answers, or search through partial answers.

  Each method trades money and waiting time for accuracy. Each is only as good as the thing
  that picks the winner. Tests or a maths check make a strong picker; the model grading its
  own work makes a weak one.
analogy: Taking three drafts of an essay and handing in the best one. Better result, more evenings gone.
usage: Before we pay for more test-time compute, show me the accuracy gain on the eval set.
related: [chain-of-thought, best-of-n, eval]
level: 3
lessons: [ai.reasoning-and-training]
