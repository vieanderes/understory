id: pyai.pandas
title: pandas and notebooks
objective: "Load, filter, group and join tables of results with pandas, and explore them in a notebook."
level: advanced
minutes: 10
concepts: [pyai.dataframes, pyai.groupby, pyai.notebooks]
prerequisites: [pyai.numpy, db.sql-queries]
opening:
  text: >-
    You'll answer "is the new prompt better?" from a table of results in three lines of
    Python. You'll also spot the numbers that lie.

steps:
  - type: prose
    id: results-table
    body: |-
      Teams test an AI feature on a fixed list of questions, and record each result in a
      table. **pandas** is the Python library for tables. `read_csv` loads one into a
      **DataFrame**: named columns, each a NumPy-style array.

      ```text
         case_id version category  passed  latency_ms  judge_score
      0        1      v1   refund    True         850          0.9
      1        2      v1  billing   False        2300          NaN
      2        3      v2   refund    True         700          0.5
      ```

      `version` says which prompt, the model's instructions, was used. `NaN` marks a
      missing value.

  - type: prose
    id: masks
    body: |-
      `df["latency_ms"]` picks a column. Compare it, and you get a column of `True` and
      `False`, a **boolean mask**, like the NumPy comparisons. Put a mask in brackets to
      keep the matching rows:

      ```python
      slow = df[df["latency_ms"] > 2000]
      slow_refunds = df[(df["category"] == "refund") & (df["latency_ms"] > 2000)]
      ```

      Combine masks with `&` for and, `|` for or, each side in brackets.

  - type: fill-blank
    id: fill-mask
    concept: pyai.dataframes
    difficulty: 1
    language: python
    prompt: Keep only the rows that failed.
    template: |
      df = pd.read_csv("results.csv")
      failed = df[df[{{1}}] {{2}} False]
    blanks:
      - key: '1'
        answer: '"passed"'
      - key: '2'
        answer: '=='
    bank: ['"passed"', passed, '==', '=', and]

  - type: bug-hunt
    id: hunt-and
    concept: pyai.dataframes
    difficulty: 2
    language: python
    code: |
      df = pd.read_csv("results.csv")
      refunds = df[(df["category"] == "refund") and df["passed"]]
      print(len(refunds))
    prompt: >-
      This stops with `ValueError: The truth value of a Series is ambiguous`. Tap the line
      to fix.
    lines: [2]
    reasons:
      - text: '`and` needs one `True` or `False`, not a column'
        correct: true
        feedback: >-
          Exactly. Python's `and` can't decide for a whole column. `&` works row by row.
      - text: '`read_csv` returns a list, not a table'
        feedback: >-
          It returns a DataFrame, and line 1 runs fine. The error comes from line 2.
      - text: '`len` doesn''t work on a DataFrame'
        feedback: >-
          `len(df)` gives the row count. The program never gets that far.
    fix: |
      df = pd.read_csv("results.csv")
      refunds = df[(df["category"] == "refund") & (df["passed"])]
      print(len(refunds))

  - type: prose
    id: groupby-and-merge
    body: |-
      **groupby** works like SQL's `GROUP BY` from chapter 10. It splits rows by a key,
      then averages or counts each group:

      ```python
      df.groupby("version")["passed"].mean()
      df.groupby(["version", "category"])["passed"].mean()
      ```

      The second line gives a pass rate per version and category. **merge** joins two tables
      on a shared column, like a SQL join: `df.merge(labels, on="case_id")`.

  - type: code-challenge
    id: write-version-rates
    concept: pyai.groupby
    difficulty: 2
    language: python
    starter: slices.starter.py
    solution: slices.solution.py
    tests: slices.tests.py
    packages: [pandas]
    prompt: >-
      Write `pass_rates(df, version)`. Keep only that prompt version's rows, then return
      its pass rate per category.


      `df` has the columns of the results table above. Example: a version that passed both
      refunds and half the billing cases gives `billing` 0.5 and `refund` 1.0.
    hints:
      - The starter groups every row, whatever its version. Filter first.
      - 'A mask keeps the rows: `df[df["version"] == version]`.'
      - 'Group what is left: `.groupby("category")["passed"].mean()`.'

  - type: ai-review
    id: review-missing-scores
    concept: pyai.groupby
    difficulty: 3
    language: python
    request: Return the average judge score from a CSV of results.
    flawClass: edge-case
    code: |
      import pandas as pd

      def average_score(path: str) -> float:
          df = pd.read_csv(path)
          return df["judge_score"].mean()
    prompt: >-
      Two of five rows have an empty `judge_score`, because the grading call timed out. The
      report says 0.67, and nobody noticed the gaps. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`mean` quietly skips the missing scores'
        correct: true
        feedback: >-
          Exactly. It averages three rows, not five. Count the gaps and fail loudly.
      - text: '`read_csv` drops rows with empty cells'
        feedback: >-
          It keeps all five and marks the gaps as `NaN`. `mean` is what skips them.
      - text: The function should round the result
        feedback: >-
          Rounding changes nothing here. The number is wrong before any rounding.
    fix: |
      import pandas as pd

      def average_score(path: str) -> float:
          df = pd.read_csv(path)
          missing = df["judge_score"].isna().sum()
          if missing:
              raise ValueError(f"{missing} rows have no judge score")
          return df["judge_score"].mean()

  - type: prose
    id: notebooks
    body: >-
      A **notebook** mixes code cells, their output and notes in one file. Jupyter is the
      usual one. Behind it runs a **kernel**: the Python that keeps your variables between
      cells.


      You can run cells in any order, and edit them after. So a notebook can show results
      its code, run from the top, never produces. Before you trust one, choose **Restart
      Kernel and Run All Cells**.

  - type: explain-back
    id: explain-restart
    concept: pyai.notebooks
    difficulty: 3
    prompt: >-
      A colleague's notebook shows a pass rate of 0.92. Why might running it from the top
      give a different number?
    rubric:
      - Cells can be run in any order, and edited after running.
      - Variables from old runs stay in the kernel's memory.
      - The saved output may come from a state the code no longer creates.
    modelAnswer: >-
      The kernel keeps every variable between cells. My colleague may have run cells out of
      order, or edited a cell after running it. The 0.92 came from that hidden state.
      Restarting and running all cells rebuilds it from the code alone.

recap:
  - Load a table with `read_csv`, and filter it with masks combined by `&`.
  - Group results by version and category, and join tables with `merge`.
  - Count missing values before you average, and restart notebooks before you trust them.

recall:
  - id: card-mask
    concept: pyai.dataframes
    front: How do you keep the rows of `df` whose category is refund and that passed?
    back: >-
      `df[(df["category"] == "refund") & (df["passed"])]`. Use `&`, and brackets around
      each side.
  - id: card-groupby
    concept: pyai.groupby
    front: How do you get a pass rate per prompt version and category?
    back: >-
      `df.groupby(["version", "category"])["passed"].mean()`.
  - id: card-nan-mean
    concept: pyai.groupby
    front: What does `mean` do with missing values?
    back: >-
      It skips them, silently. Count them first with `.isna().sum()`.
  - id: card-restart
    concept: pyai.notebooks
    front: What do you do before trusting a notebook's numbers?
    back: >-
      Restart the kernel and run all cells, so the output comes from the code alone.

