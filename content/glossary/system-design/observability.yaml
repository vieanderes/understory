term: observability
aka: [ o11y, telemetry ]
short: How well you can tell what a running system is doing, and why, from the data it emits.
explain: |
  Something is slow in production and you can't attach a debugger. All you have is what
  the system tells you. If it tells you enough, you can find the cause without shipping new
  code first.

  The usual signals are **logs** (events with detail), **metrics** (numbers over time)
  and **traces** (one request's path across services). Monitoring answers questions you
  thought of in advance. Good observability lets you ask new ones: "is it only users on
  the old app version, in one region?" Structured logs with a request id are the cheapest
  start.
analogy: The dashboard and black-box recorder of a car. Warning lights tell you something's wrong; the recorded data tells you what happened.
usage: We have no observability on the export worker; it fails and all we get is "job failed".
related: [ slo, percentile, latency, on-call ]
level: 2
lessons: [ cloud.observability, agents.watching-agents ]
