    note: The rule that can stop the domain importing adapters or database packages.
    verified: true

deepDive: >-
  We ran all of it on Node 24. The domain function, given an in-memory adapter, lent three
  books and refused the fourth in 0.07 ms. Given the PostgreSQL adapter over a fake
  connection, it sent a `SELECT count(*)` and made the same decision. ESLint 9.39.5, with
  `no-restricted-imports` set on `src/domain`, rejected a domain file that imported an
  adapter and passed an adapter that imported the domain.


  Why "hexagonal"? The original article drew the app as a hexagon only to leave room for
  several ports. Some are driven by the outside, like an HTTP handler or a scheduled job
  calling in. Others are driven by the domain, like storage or email. Both kinds get
  adapters. Tests are one more adapter on the driving side. You'll also meet the same idea
  as "clean architecture" or "onion architecture".


  In JavaScript a port is only a convention: an object with the right functions.
  TypeScript makes it checkable. Declare an `interface` in the domain, and the compiler
  refuses an adapter that misses a function or returns the wrong type. The challenge in
  this lesson does that.


  The pattern has a price. Every port is an extra file and an extra hop when reading code.
  A small script with one database doesn't need it. Reach for a port when a rule is worth
  testing alone, or when a technology is likely to change. The next lesson applies it to
  the thing most likely to change of all: the model.
