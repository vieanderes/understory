term: infrastructure as code
aka: [IaC, declarative infrastructure]
short: Describing servers, networks and databases in files that a tool reads to create and change them.
explain: |
  Servers set up by clicking through a console are a mystery a year later. Nobody knows
  what was changed, or how to build a second copy.

  Write it down instead: the database, its size, the firewall rules. A tool compares the
  files with what exists and shows a plan of changes before applying it. The files live in
  Git, so changes get reviewed like code, and a new environment is one command. The trap
  is drift: someone clicks a change by hand and the files no longer tell the truth.
analogy: A recipe instead of a meal someone once cooked from memory. Anyone can cook it again, the same way.
example:
  language: text
  code: |
    resource "database" "orders" {
      engine  = "postgres"
      version = "17"
      size    = "small"
      backups = { retention_days = 14 }
    }
usage: Don't change the firewall by hand; put it in the infrastructure as code so the plan shows it.
related: [container-orchestration, continuous-delivery, secret-manager, pull-request]
level: 2
lessons: [cloud.infrastructure-as-code]
