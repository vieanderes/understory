term: tokeniser
aka:
  - tokenizer
  - tokenisation
  - tokenization
short: The fixed step that splits text into the numbered pieces a language model reads and writes.
explain: |
  A model can't read letters. Before it sees your prompt, the text is cut into pieces from a fixed vocabulary. Common words stay
  whole, rarer words split into chunks, and odd strings go almost letter by letter. Each piece becomes a number.

  This is why you pay per token, not per word, and why limits are counted in tokens. English
  prose runs at roughly four characters a token. Code, other languages and long numbers
  cost more.

  The trap is guessing. Different models use different vocabularies, so the same text costs
  different amounts. Count with the provider's own counter before you trust a budget.
analogy: Cutting a sentence into fridge-magnet pieces from a fixed box. The box decides where the cuts go.
usage: The prompt fits by word count but not after the tokeniser, because the JSON splits into tiny pieces.
twin:
  term: token
  difference: A token is one piece of text the model sees. The tokeniser is the fixed step that does the cutting, and it differs from model to model.
related:
  - token
  - context-window
  - embedding
level: 2
lessons:
