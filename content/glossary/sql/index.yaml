term: index
aka: [database index, B-tree index]
short: A sorted lookup structure beside a table that lets the database find rows without reading them all.
explain: |
  Without help, finding one user by email means reading every row. With a million users,
  that's slow. An index keeps the emails sorted with a pointer to each row, so the database
  jumps straight there.

  It isn't free. Every insert and update must change the index too, and it takes disk
  space. Index the columns you filter, join and sort on, and check with `EXPLAIN` that the
  query uses it. A function on the column (`WHERE lower(email) = ...`) skips a plain index
  on `email`.
analogy: The index at the back of a textbook. You look up "photosynthesis" and turn to page 88, instead of reading from page one.
example:
  language: sql
  code: |
    CREATE INDEX orders_customer_id_idx ON orders (customer_id);

    -- now this finds the rows without reading the whole table
    SELECT * FROM orders WHERE customer_id = 42;
usage: The search page is slow because there's no index on bookings.room_id, so every query scans the table.
related: [covering-index, query-plan, primary-key]
level: 1
lessons: [db.indexes]
