summary: >-
  A coding agent is a model in a loop with tools for your repository: it reads files, edits
  them, runs commands and reads the output, until it believes the task is done. It writes
  code far faster than a person, and it is wrong in ways that look right: an invented API, a
  test loosened until it passes, a change to thirty files for a one-line bug. The engineering
  question isn't whether to use one. It's how to set up the work so its speed turns into
  shipped, correct code.


  Three habits carry most of the weight. A **context file** such as `AGENTS.md` gives every
  session the commands, conventions and rules a new colleague would need. **Fast feedback
  loops**, meaning tests, type checks and linters the agent runs itself, catch most mistakes
  in seconds. And **small diffs** keep review honest, because the person who merges owns every
  line.


  Delegate what is cheap to check: boilerplate, a first draft of tests, a mechanical
  refactor, exploring an unfamiliar codebase, a fix that a failing test pins down. Keep what is
  expensive to check: design decisions, security-sensitive code, anything where "the tests
  pass" doesn't mean "it's right". The better your tests, the more you can delegate.
remember:
  - Whoever merges a change owns its correctness, tests and design, whoever or whatever typed it.
  - A context file such as `AGENTS.md` holds the commands, conventions and rules every session needs, kept short and true.
  - When an agent makes the same mistake twice, fix it once in the context file rather than in every chat.
  - Tests, type checks and linters that the agent runs after each change are the feedback loop that makes its speed safe.
  - Keep each change small enough to read in full, and ask for a plan first on anything bigger.
  - Read the diff of the tests as closely as the code, because an agent told to get checks green may weaken the checks.
  - A failing test written or read by you first gives the agent a target it can check alone.
sections:
  - title: What a good context file looks like
    body: |-
      A context file is read at the start of every session, so every line costs tokens every
      time and every wrong line misleads every time. Aim for what a new colleague needs on day
      one, in a page or two, with links to deeper docs instead of copies of them.

      ```text
      # Agent guide

      ## Commands
      - Install: pnpm install
      - Test one file: pnpm test src/cart/total.test.ts
      - Everything before a commit: pnpm check   (lint, types, unit tests)

      ## Layout
      - src/domain: pure logic, no framework imports (lint enforces it)
      - src/api: HTTP handlers; validate input with the schemas in src/api/schemas
      - Tests sit beside the code as *.test.ts

      ## Rules
      - Never edit files under generated/; run pnpm codegen instead.
      - Money is integer pence, never floats.
      - Don't add dependencies without asking.
      - Don't skip, delete or loosen a failing test. Report it instead.
      ```

      Each line earns its place by preventing a mistake. The commands stop `npm test` in a
      pnpm repository. The layout saves the agent reading every folder. The rules capture
      decisions the code alone doesn't reveal, such as money in pence.

      Several tools look for different file names and places. `AGENTS.md` is an open format
      read by many; some tools read their own file, and some read nested files in
      subdirectories for local rules. Keep one source of truth and point the others at it.

      Where a rule can be enforced by a tool, enforce it there too. "No framework imports in
      domain code" belongs in a lint rule. The context file tells the agent why; the linter
      makes sure.
  - title: Feedback loops, fastest first
    body: |-
      An agent corrects itself well when it gets a clear, fast signal. The loop is: change,
      check, read the output, change again. Its quality depends on which checks exist and how
      quickly they answer.

      Order them by speed. A type check and linter on the changed files answer in seconds and
      catch invented functions, wrong argument types and unused code. A focused test run on
      the affected module answers in seconds too and catches wrong behaviour. The full suite
      and end-to-end tests take minutes and belong before the commit, not after every edit.
      Tell the agent the fast commands in the context file, or it will run the slow ones or
      none.

      The strongest pattern is **test first**. Write the failing test yourself, or have the
      agent write it and read it before any code changes. The test pins down what "done"
      means, so the agent can't quietly redefine the task. A bug report becomes a red test,
      the fix makes it green, and the test stays as a guard.

      Where checks are missing, an agent is flying blind. A repository with no types and few
      tests gets plausible changes that nobody can verify cheaply. The first useful task for
      an agent there is often adding characterisation tests around the code you're about to
      change.

      Hooks in the agent tool or git can make checks automatic, for example running the
      formatter and linter after every edit. Whatever runs them, the rule is the same: the
      agent sees the failure and fixes it before a person spends any time reading.
  - title: Reviewing an agent's diff
    body: |-
      Review an agent's change the way you'd review a confident new colleague's, with extra
      attention to a few failure modes that are more common in generated code. Start with the
      size and the tests before reading the logic.

      ```bash
      # Size first: a one-line bug should not touch thirty files.
      git diff --stat main...HEAD

      # The tests changed with the code: read these lines before anything else.
      git diff main...HEAD -- '*.test.ts' '*.spec.ts'

      # Added lines that switch a check off.
      git diff main...HEAD | grep -nE '^\+.*(\.skip\(|\.only\(|eslint-disable|@ts-ignore|@ts-expect-error)' \
        || echo "no checks switched off"
      ```

      Then read for the patterns that slip past tests:

      - **Weakened checks**: a skipped test, a looser matcher, a deleted assertion, a lint
        rule turned off, a type widened to `any`.
      - **Invented APIs**: a method or option that doesn't exist, hidden by a test that mocks
        the whole client.
      - **Swallowed errors**: a new `try` with an empty `catch`, or a fallback that hides a
        failure.
      - **Scope creep**: renames, reformatting and "improvements" nobody asked for, which
        bury the real change.
      - **New dependencies** and lockfile changes: check the package exists, is the one you
        meant, and is maintained. A plausible name can be a typo-squatted package.
      - **Security basics**: string-built SQL, secrets in code, input used without validation.

      If the diff is too large to read in full, don't merge it. Discard it, narrow the task,
      and ask again. That's faster than reviewing a change you can't hold in your head.
  - title: Safety, permissions and working as a team
    body: |-
      An agent runs commands with whatever access you give it, and it reads text you didn't
      write: issues, web pages, dependency code, error messages. That text can carry
      instructions, the same prompt injection risk as any agent. Set it up accordingly.

      - Keep production credentials and customer data out of the agent's environment. A
        development database with fake data is enough for nearly every task.
      - Use the tool's permission settings. Allow read-only and check commands freely, and
        require approval for pushing, deleting, installing packages or network calls.
      - Run long unattended tasks in a sandbox or container with a fresh branch, so the worst
        case is a branch you delete.
      - Never let an agent merge its own change, and keep branch protection and required
        reviews on as for anyone else.

      In a team, agree the norms once: pull requests say how much an agent was involved and
      what was checked by hand, the author answers review questions about every line, and
      recurring agent mistakes become context-file lines or lint rules. Measure the result by
      what matters to the team, such as review time, defects found after merge and time to
      ship, not by lines generated.
pitfalls:
  - "**Merging because the tests pass.** Tests only cover what they check, and the agent may have changed them. Read the full diff, tests first, and discard anything too large to read."
  - "**Correcting the same mistake in chat every session.** The next session starts without the correction. Put it in the context file once, or better, in a lint rule or test that fails."
  - "**A long, stale context file.** Every line costs tokens each session, and an out-of-date command misleads every time. Keep it short, true and reviewed like code, with links to deeper docs."
  - "**Asking for a big change in one go.** A vague, broad request produces a sprawling diff nobody can review. Ask for a plan, review it, then have the agent do it in small, separately checked steps."
  - "**Accepting a timing tweak for a flaky test.** Raising a sleep makes the race rarer, not gone. Ask for the real fix, such as fake timers or waiting on the event itself."
  - "**Letting the agent see production secrets.** An agent that reads a poisoned issue or web page can be steered to misuse whatever access it has. Give it a development environment, and require approval for risky commands."
  - "**Saying \"the agent wrote it\" in a review or incident.** It's never an answer. The person who merged owns the change, so review as if you wrote every line."
interview:
  - question: How do you use AI coding agents in your work, and how do you make sure the output is correct?
    answer: >-
      I delegate work that's cheap to verify and keep what isn't. Boilerplate, first drafts of
      tests, mechanical refactors, exploring unfamiliar code and bugs pinned down by a failing
      test go to the agent. Design decisions and security-sensitive code stay with me. The
      repository has a context file with commands and conventions, and the agent runs type
      checks, the linter and focused tests after each change, so most mistakes never reach
      me. I keep diffs small and read every line, tests first, because agents sometimes
      loosen a test to get green. I own what I merge. The trade-off is that review time
      becomes the bottleneck, so I'd rather ask for three small changes than one large one.
  - question: An agent's pull request passes CI. What do you still check?
    answer: >-
      I check that the checks still mean what they meant, and that the change is the one we
      asked for. First the size: a one-line bug that touched thirty files gets sent back.
      Then the test diff, for skipped tests, looser matchers, deleted assertions or disabled
      lint rules. Then the logic, for invented APIs hidden behind mocks, swallowed errors,
      unrequested refactors, new dependencies and security basics such as string-built SQL.
      Finally I ask whether the design fits the codebase, which no test checks. CI green is
      necessary, not sufficient. When the diff is too large to read in full, I discard it and
      narrow the task, because I can't own what I haven't read.
  - question: What would you put in an AGENTS.md file, and what would you leave out?
    answer: >-
      I'd put in what a new colleague needs on day one and leave out what the code or docs
      already say. That means the install, test, lint and type-check commands, including how
      to run one test file, a short map of where things live, and the rules the code doesn't
      reveal, such as money in integer pence or never editing generated files. I'd add a line
      whenever an agent makes the same mistake twice. I'd leave out long architecture essays,
      copied API docs and anything that goes stale, linking to them instead, because every
      line costs tokens per session and a wrong line misleads every session. Where a rule can
      be enforced by a linter or test, I'd do that too, so it holds even when the file is
      ignored.
  - question: Why do small diffs and fast checks matter more with an agent than with a human colleague?
    answer: >-
      Because an agent writes faster than anyone can review, and it sounds as sure when it's
      wrong as when it's right. A colleague's confidence tells you something; an agent's
      doesn't. So verification has to be automatic and quick: type checks, linters and
      focused tests the agent runs itself after each change, catching most mistakes before a
      person looks. What's left needs human judgement, and that only works if the diff is
      small enough to read in full. Large agent diffs get rubber-stamped, which is how
      subtle bugs ship. The trade-off is more round trips, which is cheap when the agent does
      the typing.
  - question: What are Agent Skills, and how do they differ from tools and MCP?
    answer: >-
      A skill is packaged know-how an agent loads when a task needs it: a folder with a
      `SKILL.md` file, whose short front matter gives a name and a description, and whose
      body holds instructions, optionally with scripts and reference files beside it. The
      format started at Anthropic and is now an open standard that many coding agents read.
      The key idea is progressive disclosure. At the start the agent sees only each skill's
      one-line description; it reads the full instructions only when a task matches, so a
      hundred skills cost little context. Tools are actions the model can call, MCP is how
      those tools and data are connected, and skills are playbooks for how to do a kind of
      job. Like any context file, a skill is only as good as its instructions, so I keep
      them short and test them on real tasks.
