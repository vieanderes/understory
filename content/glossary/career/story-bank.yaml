term: story bank
aka:
  - interview story bank
short: A prepared set of five or so true work stories that together answer most behavioural questions.
explain: |
  Behavioural questions come in many wordings but few topics. A hard trade-off, an incident, a
  disagreement, helping someone grow, a project you cut or stopped.

  So prepare one real story for each, written in a few lines with a clear decision and a
  result. In the interview you pick the closest story and adapt it, instead of inventing one
  under pressure.

  Vary them. Five stories from the same project read like you've done one thing. And keep a
  failure in there: the question is coming.
analogy: A packed toolbox. You don't know the job yet, but you know you'll need a screwdriver.
usage: Build your story bank before the loop, so "a time you were wrong" has an answer ready.
twin:
  term: star-method
  difference: STAR is the shape of one story, from situation to result. The story bank is the collection of stories you prepare, each told in that shape.
related:
