term: debugger
aka: [step debugger]
short: A tool that pauses a running program on a chosen line so you can inspect every value.
explain: |
  Guessing at a mistake is slow. This tool lets you stop the program on a line you choose,
  called a breakpoint. While it waits, you can read every variable and the call stack.

  Then you move on a line at a time. Step over runs the current line. Step into goes inside
  the function it calls. Step out finishes that function and returns to the caller.
analogy: The pause button on a match replay. Freeze the moment, see where every player stands, then move on frame by frame.
usage: Stop adding logs and open the debugger, with a breakpoint inside the loop, so you can watch the total.
twin:
  term: console-log
  difference: A `console.log` probe prints one value and the program carries on. A debugger freezes the program and shows every value at once, and you choose when it moves.
related: [console-log, call-stack, bug, stack-trace]
level: 2
lessons: [basics.watching-code]
