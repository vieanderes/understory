id: testing.property-based
title: Property-based and concurrency tests
objective: State rules that hold for every input, check model output the same way, and test calls that overlap.
level: advanced
minutes: 10
concepts: [testing.property-based-testing, testing.invariants, testing.interleavings]
prerequisites: [testing.unit-tests, db.isolation-levels]
opening:
  text: >-
    You'll write tests that try hundreds of inputs you never picked, and check AI replies
    that are never worded alike. Then you'll catch the bug only two users at once can cause.

steps:
  - type: prose
    id: what-a-property-is
    body: >-
      A unit test checks inputs you chose. A **property-based test** states a rule for every
      input, and a tool makes up hundreds to try. For a sort: the result is as long as the
      input, and each item is at least the next.


      When an input breaks the rule, the tool shrinks it to the smallest one that still
      fails. In JavaScript that tool is fast-check.

  - type: multiple-choice
    id: pick-a-property
    concept: testing.property-based-testing
    difficulty: 1
    question: '`sortScores` puts a leaderboard in order, highest first. Which is a property?'
    choices:
      - text: Every score is at least the one after it
        correct: true
        feedback: >-
          Right. It holds for any list, so a tool can try thousands.
      - text: '`sortScores([3, 9])` returns `[9, 3]`'
        feedback: >-
          That's one example, a fine unit test. A property holds for every list.
      - text: It calls the built-in `sort`
        feedback: >-
          That's how it works inside. A property is about what comes out.

  - type: code-challenge
    id: write-sort-properties
    concept: testing.property-based-testing
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '19-24'
    prompt: >-
      `randomLists` makes up 200 lists of scores, the way fast-check would. Inside the loop,
      check three properties of `sortScores`: the same length, each score at least the
      next, and every original score still there.


      We'll run them against three broken sorts. Each must break a property.
    hints:
      - '`toHaveLength` checks the length. A loop from `i = 1` compares neighbours.'
      - 'A sort that repeats one score and loses another keeps its length and its order.'
      - 'Start with `expect(sorted).toHaveLength(scores.length);`'

  - type: prose
    id: checking-model-output
    body: >-
      Some output has no single right answer. Ask an AI model to reply to a support ticket
      twice and you get two wordings, both fine. So `toBe` fails on good replies.


      Check properties instead: the reply names the order number and stays under 200
      characters. Run those checks over many saved tickets and count the passes. AI teams
      call that an **eval**. Chapter 20 builds one.

  - type: ai-review
    id: review-exact-match-eval
    concept: testing.property-based-testing
    difficulty: 3
    language: js
    request: Write an eval for the support-reply feature.
    flawClass: logic
    code: |
      const cases = [
        { ticket: 'Where is order 1042?', expected: 'Your order 1042 is on its way.' },
        { ticket: 'Cancel order 2210', expected: 'Order 2210 is cancelled.' },
      ];

      test('writes the right replies', async () => {
        for (const c of cases) {
          const reply = await writeReply(c.ticket);
          expect(reply).toBe(c.expected);
        }
      });
    prompt: >-
      An assistant wrote this. It fails on most runs, even when the replies read well. Tap
      the line at fault.
    lines: [9]
    reasons:
      - text: A good reply can be worded many ways
        correct: true
        feedback: >-
          Yes. Check what every good reply has, such as the order number.
      - text: Two cases are too few
        feedback: >-
          More cases would help later. With exact matching, more would only fail more.
      - text: The `await` makes it flaky
        feedback: >-
          The `await` is needed to get the reply. Exact matching is what fails.
    fix: |
      const cases = [
        { ticket: 'Where is order 1042?', order: '1042' },
        { ticket: 'Cancel order 2210', order: '2210' },
      ];

      test('replies name the order and stay short', async () => {
        for (const c of cases) {
          const reply = await writeReply(c.ticket);
          expect(reply).toContain(c.order);
          expect(reply.length).toBeLessThan(200);
        }
      });

  - type: prose
    id: what-an-invariant-is
    body: >-
      An **invariant** is a rule that holds before and after every operation: a balance
      never goes negative, and tickets sold never pass the seats there are.


      Check it after each step, not only at the end. Then the first step that breaks it
      names itself.

  - type: prose
    id: interleavings
    body: >-
      Two buyers press Buy at once. Each reads the stock, waits for the database, then
      writes. If both read before either writes, both get the last ticket. That's the lost
      update from chapter 10.


      A test that runs the buys one after another never sees it. A **concurrency test** starts
      them together, with `Promise.all`, then checks the invariant.

  - type: ai-review
    id: review-sequential-awaits
    concept: testing.interleavings
    difficulty: 4
    language: js
    request: Add a test that proves two buyers can't both take the last ticket.
    flawClass: race
    code: |
      test("two buyers, one ticket", async () => {
        const stock = createStock(1);
        await stock.buy("ana");
        await stock.buy("ben");
        expect(stock.left()).toBe(0);
      });
    prompt: >-
      An assistant wrote this. The test passes. In production, two buyers at once still both
      get the ticket. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The second buy starts after the first ends
        correct: true
        feedback: >-
          Yes. `await` in sequence is one buyer at a time. Start both together.
      - text: '`createStock(1)` should be `createStock(2)`'
        feedback: >-
          Two tickets would hide the bug entirely. One ticket is the point of the test.
      - text: The assertion should be `toBe(-1)`
        feedback: >-
          `-1` is the bug, not the goal. The test can't see it because the buys never overlap.
    fix: |
      test("two buyers, one ticket", async () => {
        const stock = createStock(1);
        await Promise.all([stock.buy("ana"), stock.buy("ben")]);
        expect(stock.left()).toBe(0);
      });
    verify:
      question: How would you prove the fixed test can catch the race?
      choices:
        - text: Run it against the old `buy` and watch it fail
          correct: true
          feedback: Yes. A race test must go red on the racy code.
        - text: Run it a hundred times and see it pass
          feedback: Passing proves nothing until you've seen it fail on the broken version.
        - text: Add a third buyer to the same test
          feedback: More buyers can make overlap likelier, but you still need to see it fail without the fix.

  - type: explain-back
    id: explain-invariant-each-step
    concept: testing.invariants
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A test makes 50 random bookings and cancellations, then checks once, at the end, that
      the flight isn't overbooked. Why check after every operation instead?
    rubric:
      - A check after each step names the operation that first broke the rule.
      - A check only at the end can miss a break that a later cancellation undid.
      - Invariants must hold at every moment, since a user could see the broken state in between.
    modelAnswer: >-
      At the end you only learn that something went wrong, not which of 50 steps did it. Worse,
      a cancellation can hide the overbooking before the check runs, so the test passes on a
      real bug. Checked after every step, the first operation that breaks the rule fails at
      once, with its name. An invariant has to hold at every moment, because someone could
      book, pay or board while it's broken.

recap:
  - State a rule that holds for every input, and let a tool try the inputs.
  - Check fuzzy output, such as a model's reply, with properties over many cases.
  - Start overlapping calls together, and check the invariant after every step.

recall:
  - id: card-shrinking
    concept: testing.property-based-testing
    front: What does shrinking do with a failing input?
    back: >-
      Tries smaller inputs while the test still fails, and reports the smallest one.
  - id: card-eval-properties
    concept: testing.property-based-testing
    front: Why can't you test a model's reply with `toBe`?
    back: >-
      Good replies are worded differently each time. Check properties every good reply has,
      over many cases.
  - id: card-invariant-when
    concept: testing.invariants
    front: When should an invariant be checked during a test?
    back: >-
      After every operation. A check only at the end can't say which step broke it.
  - id: card-sequential-await
    concept: testing.interleavings
    front: Why does `await a(); await b();` never find a race between `a` and `b`?
    back: >-
      `b` starts after `a` has finished. Nothing overlaps, so no interleaving is tested.

references:
  - kind: paper
    title: 'QuickCheck: a lightweight tool for random testing of Haskell programs'
    authors: Koen Claessen and John Hughes
    year: 2000
    venue: ICFP '00, ACM
    url: https://doi.org/10.1145/351240.351266
    note: The paper that introduced properties, generators and shrinking.
    primary: true
    verified: true
  - kind: docs
    title: Properties
    authors: Nicolas Dubien
    venue: fast-check documentation
    url: https://fast-check.dev/docs/core-blocks/properties/
    note: '`fc.property(...arbitraries, predicate)`, the shape shown in the deep dive.'
    verified: true
  - kind: docs
    title: Getting Started
    authors: Nicolas Dubien
    venue: fast-check documentation
    url: https://fast-check.dev/docs/introduction/getting-started/
    note: '`fc.assert` running a property many times and reducing a failure to a readable case.'
    verified: true

deepDive: |-
  With fast-check, the challenge's loop becomes:

  ```js
  import fc from 'fast-check';

  test('sortScores keeps every score', () => {
    fc.assert(
      fc.property(fc.array(fc.integer({ min: 0, max: 120 })), (scores) => {
        expect(sortScores(scores)).toHaveLength(scores.length);
      }),
    );
  });
  ```

  `fc.array(fc.integer(...))` makes the lists, and `fc.assert` runs the property a hundred
  times by default. On a failure it shrinks the list and prints the seed, so you can replay
  the same run. Against the sort that drops repeats, one run shrank its failure to
  `[3, 3]`: two equal scores, the whole bug in one line.

  Good properties are ones you'd never write as single examples. A round trip:
  `decode(encode(x))` is `x`. Sorting twice equals sorting once. An invariant over a random
  run of operations.

  `Promise.all` finds a race only when the timing lines up. A scheduler that runs the steps
  in every possible order finds it every time. Two read-then-write pairs have six orders,
  and four of them lose an update. Tools for this exist, but the count grows fast, so keep
  the steps coarse.
