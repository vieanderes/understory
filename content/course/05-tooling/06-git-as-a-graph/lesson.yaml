deepDive: |-
  **Rebase.** `git rebase main` copies your branch's commits on top of `main`, giving one
  straight line instead of a merge commit. Each copy gets a new hash, because a hash covers the
  parent. Only rebase commits nobody else has yet.

  **`switch` and `checkout`.** `git switch 8a7d5fe` refuses with `a branch is expected`, and
  suggests `--detach`. Older tutorials use `git checkout 8a7d5fe`, which detaches without
  asking. Switching away also prints the hash you're leaving behind.

  **Merge messages.** Without `-m`, `git merge` opens a text editor for the merge commit's
  message. Save and close it to finish. `git merge --abort` backs out of a conflict entirely.

  **`HEAD~1` and `HEAD@{1}`.** `HEAD~1` follows a parent in the graph. `HEAD@{1}` reads the
  reflog: where `HEAD` was before its last move. After a reset they can name different commits.

  **How long.** The reflog is local to your machine and isn't shared by pushing. Git
  eventually clears old entries, by default after 30 days for commits no branch reaches.
