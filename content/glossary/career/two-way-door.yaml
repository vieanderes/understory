term: two-way door
aka:
  - reversible decision
  - two-way-door decision
short: A decision that is cheap to undo, so it should be made quickly and corrected if wrong.
explain: |
  Which library formats dates, what a button says, whether a feature flag starts at five per
  cent. If it turns out wrong, you change it back in an afternoon.

  These don't deserve a week of meetings. Decide, ship, watch what happens, and adjust. Speed
  here buys time for the decisions that really are hard to undo.

  Make sure it really is reversible. A "small" schema change that other teams start reading
  tomorrow has quietly become a one-way door.
analogy: Trying a new café. If the coffee's bad, you go somewhere else tomorrow.
usage: The cache timeout is a two-way door, so pick five minutes and tune it from the metrics.
twin:
  term: one-way-door
  difference: A two-way door is cheap to reverse, so speed matters more than certainty. A one-way door is hard to undo, so it earns evidence and review first.
related:
