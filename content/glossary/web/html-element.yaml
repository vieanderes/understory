term: element
aka: [HTML element]
short: One piece of a web page, made of a start tag, its content and an end tag.
explain: |
  A web page is built from pieces: a heading, a paragraph, an image, a link. Each piece is
  an element. `<p>Serves four</p>` is one paragraph element.

  Elements nest inside each other, like `li` inside `ul`, and the inner one must close
  first. A few, like `img`, have no content and no end tag.
analogy: A labelled box. The label on the lid says what kind of thing it is, and the contents sit inside.
example:
  language: html
  code: |
    <p>Serves <strong>four</strong></p>
    <img src="pancakes.jpg" alt="A stack of pancakes">
usage: Wrap the price in its own element, so you can style it without touching the rest of the line.
twin:
  term: html-tag
  difference: A tag is the written marker, `<p>` or `</p>`. An element is the whole thing the pair makes, start tag, content and end tag. It becomes one node in the DOM.
related: [html-tag, html-attribute, dom, semantic-html]
level: 1
lessons: [html.first-page, html.everyday-elements]
