term: refresh token
aka: [ refresh token rotation, token refresh ]
short: A long-lived credential used only to obtain new short-lived API passes, never sent on ordinary calls.
explain: |
  Access tokens expire within hours. Signing in every hour would be unbearable. So a second,
  longer-lived credential quietly gets a fresh one.

  It is sent only to the provider's token endpoint. Many providers rotate it: each refresh
  returns a new one and kills the old one. So two workers refreshing at once is a real bug,
  because one spends it and the other gets `invalid_grant`. Refresh once per connection and
  save the new token from every reply.
analogy: A library card. You never show it at the shelves, only at the desk to borrow another book.
example:
  language: http
  code: |
    POST /oauth/token HTTP/1.1
    Content-Type: application/x-www-form-urlencoded

    grant_type=refresh_token&refresh_token=rt_9f2c...&client_id=app_123
usage: Two workers used the same refresh token at once, and the provider revoked the whole connection.
twin:
  term: access-token
  difference: A refresh token is used only to get new access tokens and lasts long. An access token is what you send on every API call, and it expires quickly.
related: [ access-token, oauth, single-flight, race-condition ]
level: 2
lessons: [ integrations.tokens-that-expire ]
