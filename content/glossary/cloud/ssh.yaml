term: SSH
aka: [secure shell, SSH key, key pair]
short: An encrypted way to log in to a remote machine and run commands, usually with keys.
explain: |
  A server in a data centre has no screen you can sit at. You reach it over the network,
  and everything you type must stay private and reach the right machine.

  This protocol encrypts the session and proves identity both ways round. You prove who you are with a private key that never leaves your laptop. The server holds
  the matching public key. The server proves itself with its host key, which your client remembers. Turn off
  password and root logins, and keep a second session open while you change the settings.
analogy: A front door only your key opens, with a spyhole so you know it's really your own house.
example:
  language: bash
  code: |
    ssh-keygen -t ed25519
    ssh-copy-id deploy@203.0.113.10
    ssh deploy@203.0.113.10
usage: Password login is still on for that box; switch it to SSH keys only before it goes live.
related: [least-privilege, firewall, encryption, secret]
level: 1
lessons: [cloud.linux-server]
