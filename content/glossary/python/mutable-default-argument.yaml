term: mutable default argument
aka:
  - mutable default
short: A list or dict used as a parameter's default value, which is shared by every call.
explain: |
  You write `def add(item, basket=[])` and call it twice. The second basket already holds
  the first call's item. It looks like a ghost.

  Python creates a default value once, when the `def` runs, not on every call. A list or
  dict default is one object reused by every call that skips the argument, so changes
  pile up. Use `None` as the default and make a fresh list inside.
analogy: A shared pencil pot at a reception desk. Everyone who doesn't bring a pen uses the same one, and leaves their chewing marks on it.
example:
  language: python
  code: |
    def add(item, basket=[]):      # one list, forever
        basket.append(item)
        return basket

    def add(item, basket=None):    # fresh each call
        basket = [] if basket is None else basket
        basket.append(item)
        return basket
usage: Tags from one request leak into the next; it's a mutable default argument on the helper.
