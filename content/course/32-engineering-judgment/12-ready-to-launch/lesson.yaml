id: judgment.ready-to-launch
title: Merge ready is not launch ready
objective: Tell a mergeable change from a launchable product, have independent agents attack the whole product before launch, and ship it as an experiment you can take back.
level: advanced
minutes: 10
concepts: [judgment.merge-vs-launch-ready, judgment.whole-product-attack, judgment.reversible-launch]
prerequisites: [judgment.reviewing-a-change, judgment.pressure-testing, cloud.progressive-delivery, agents.babysitting-a-pr]
opening:
  text: >-
    You'll know when a feature is ready for real users, not only ready to merge. And you'll
    launch it so that a bad surprise costs one switch, not one weekend.

steps:
  - type: prose
    id: green-is-not-launched
    body: >-
      A coding agent rebuilt the booking flow for a hotel site. CI is green, a reviewer
      approved it, and it's merged. Is it ready for guests?


      Not yet. **Merge ready** means the diff is sound: it does what it says, and its tests
      prove it. **Launch ready** asks about the whole product. Does it work for real guests,
      at real load, under attack, with a way back?

  - type: multiple-choice
    id: pick-unanswered-question
    concept: judgment.merge-vs-launch-ready
    difficulty: 1
    question: Which question can a green, approved pull request not answer?
    choices:
      - text: Do the new tests pass?
        feedback: >-
          That's exactly what CI checked. Green answers it.
      - text: Does the change do what its description says?
        feedback: >-
          The reviewer read the diff against its intent. That's part of merge ready.
      - text: Will booking hold on the busiest night?
        correct: true
        feedback: >-
          Right. Load is a property of the running product, not the diff.
      - text: Did anyone read the code?
        feedback: >-
          The approval says someone did. What nobody has seen yet is real traffic.

  - type: bug-hunt
    id: hunt-merge-check-in-launch-list
    concept: judgment.merge-vs-launch-ready
    difficulty: 2
    language: yaml
    code: |
      launch: booking-v2
      checks:
        - review: approved by two people
        - journeys: book, change and cancel on staging
        - load: 10x the busiest hour, p95 under 800 ms
        - security: other guests' bookings and signed-out access tried
        - rollback: flag off, tried on staging
    prompt: >-
      This is the launch checklist, every item ticked. One item only proves the diff. Tap it.
    lines: [3]
    reasons:
      - text: Staging journeys are only a merge check
        feedback: >-
          Walking whole journeys on a running copy tests the product end to end. That's
          launch work.
      - text: A review judges the diff, not the running product
        correct: true
        feedback: >-
          Yes. It belongs to merge ready. The other four test the product.
      - text: A load test belongs in CI
        feedback: >-
          Some teams run small ones there. Ten times the busiest hour needs the whole product
          running.
      - text: Rollback is only needed after launch
        feedback: >-
          A rollback nobody tried before launch is a hope. Testing it is launch readiness.

  - type: prose
    id: attack-from-four-angles
    body: |-
      So, before launch, attack the running product. Start several **independent attackers**:
      agents or people, one angle each. Each starts fresh, without the authoring chat or
      the other attackers' notes.

      ```yaml
      - features: walk every journey end to end
      - bugs: empty states, odd inputs, double clicks
      - performance: load, a slow network, big data
      - security: auth, injection, other people's data
      ```

      Each returns findings with proof: the steps, a screenshot, the numbers. A person
      triages them.

  - type: ai-review
    id: review-attacker-briefs
    concept: judgment.whole-product-attack
    difficulty: 3
    language: ts
    request: Start four agents to attack the staging site before the booking launch.
    flawClass: logic
    code: |
      const briefs = {
        features: 'Walk every journey: book, change, cancel.',
        bugs: 'Try empty, huge and odd inputs on every form.',
        performance: 'Load 10x the busiest hour, then a slow network.',
        security: "Try other guests' bookings and signed-out access.",
      };

      for (const [angle, brief] of Object.entries(briefs)) {
        await startAgent({
          target: STAGING_URL,
          task: `Attack the ${angle} angle. ${brief}`,
          history: thisChat.messages, // so it knows how the feature works
          report: 'Each finding with the steps and proof.',
        });
      }
    prompt: >-
      The coding agent that built the feature wrote this. All four reports came back nearly
      clean. Guests found two bugs on day one. Tap the line at fault.
    lines: [12]
    reasons:
      - text: Four angles are too few for a launch
        feedback: >-
          Four covers what users feel. The problem is that all four see through the author's
          eyes.
      - text: One agent should take all four angles
        feedback: >-
          One agent tends to skim every angle. Separate attackers each go deep on one, and
          they'd still share the chat.
      - text: The authoring chat hands each attacker its blind spots
        correct: true
        feedback: >-
          Yes. It inherits the author's assumptions and grades the story, not the product.
      - text: Agents should attack production, not staging
        feedback: >-
          Attacking production hurts real guests and real data. A staging copy is the right
          target.
    fix: |
      await startAgent({
        target: STAGING_URL,
        task: `Attack the ${angle} angle. ${brief}`,
        intent: 'Guests book, change and cancel stays.', // the intent, not the chat
        report: 'Each finding with the steps and proof.',
      });
    verify:
      question: How do you check the fixed attackers are really independent?
      choices:
        - text: Ask each agent whether it saw the chat
          feedback: >-
            An agent's answer about its own context is a claim, not proof. The brief itself
            shows what it got.
        - text: Expect more findings than last time
          feedback: >-
            More findings can come from luck or noise. They don't show what each attacker
            could see.
        - text: Log each agent's full input and read it
          correct: true
          feedback: >-
            Yes. Independence is what they're given, so check the input itself.
        - text: Compare the four reports for overlap
          feedback: >-
            Little overlap looks independent, but four angles differ anyway. Only the input
            shows whether the chat went in.

  - type: prose
    id: launch-as-experiment
    body: >-
      Clean attacks still aren't real guests. So launch as a canary, as in progressive
      delivery: a flag, 1% first, guardrails written down before it starts. At each step they
      decide: promote or roll back.


      What's new here is the way back. A flag turns code off, but it can't undo data. A launch
      is **reversible** when flag off really restores the old product, and you've tried it.

  - type: bug-hunt
    id: hunt-no-way-back
    concept: judgment.reversible-launch
    difficulty: 3
    language: yaml
    code: |
      launch: booking-v2
      flag: booking-v2, off by default
      rollout: 1%, 5%, 25%, 100%, a day at each
      hypothesis: more stays booked on phones
      guardrails: crash rate, errors, p95 under 800 ms, bookings completed
      migration: merge check_in and check_out into stay, drop the old columns
      kill switch: flag off, tried on staging
    prompt: >-
      Read the launch plan. One line means the kill switch can't take the launch back. Tap
      it.
    lines: [6]
    reasons:
      - text: A day per step is too slow
        feedback: >-
          Slow steps cost time, not safety. The trap is that flag off can't bring the old
          dates back.
      - text: Old columns gone, flag off has nothing to read
        correct: true
        feedback: >-
          Yes. Add the new column first, and drop the old ones after full rollout.
      - text: The hypothesis needs a target number
        feedback: >-
          A number sharpens it, and it's worth adding. It doesn't stop you going back,
          though.
      - text: Guardrails should include revenue
        feedback: >-
          Bookings completed already tracks it closely. The missing way back is the bigger
          gap.
    fix: |
      migration: add stay and write both; drop check_in and check_out a week after 100%

  - type: code-challenge
    id: write-launch-verdict
    concept: judgment.reversible-launch
    difficulty: 4
    language: ts
    editable: '23-24'
    prompt: >-
      Write `launchVerdict(findings, gates)`. Return `{ decision, reasons }`, where `decision`
      is `'hold'` if there's any reason, otherwise `'launch'`.


      Reasons, in this order: `'not attacked: security'` for each angle in `ANGLES` missing
      from `gates.anglesRun`. Then, for each blocker finding, `'blocker: bugs'`, or
      `'needs proof: bugs'` if its proof is empty or only spaces. Then `'no guardrails'` and
      `'rollback not tested'` when those gates are false. Minor findings never hold a launch.
    hints:
      - Build the reasons list first. The decision only asks whether it's empty.
      - Walk `ANGLES`, not `gates.anglesRun`, so missing angles keep their order. Minor findings add nothing.
      - 'Start with `const reasons: string[] = []`, and push the missing angles before anything else.'

  - type: explain-back
    id: explain-why-not-live
    concept: judgment.merge-vs-launch-ready
    difficulty: 4
    audience: teammate
    kind: risk
    prompt: >-
      A teammate wants to turn the booking flag on for everyone today, since it's merged. Say
      what could go wrong, and how you'd check first.
    rubric:
      - It says a merged change proves the diff is sound, not that the product works for real guests, at load, under attack.
      - It names concrete risks from separate angles, such as a broken journey, a slow busy night or other guests' bookings exposed.
      - It proposes independent attacks on staging, then a small flagged rollout with guardrails and a tried way back that covers the data.
    modelAnswer: >-
      Merged tells us the diff is sound. It doesn't show that change and cancel still work end
      to end. Or that booking holds on a busy night, and nobody can open another guest's
      stay. And if the migration drops the old columns, flag off won't save us. So first, four
      fresh agents attack staging: journeys, odd inputs, load and security. Then 1% of guests,
      with guardrails we write down now. We try the kill switch before we start.

recap:
  - A green, reviewed pull request proves the diff, and launch ready asks about the whole product.
  - Independent attackers, one angle each and no authoring chat, return findings with proof for a person to triage.
  - Launch behind a flag, with guardrails and a tested way back. Gate the leaves, deep-read the trunk, attack the whole product before launch.

recall:
  - id: card-merge-vs-launch
    concept: judgment.merge-vs-launch-ready
    front: What does a green, approved pull request prove, and what doesn't it?
    back: >-
      That the diff is sound and tested. Not that the product works for real users, at load,
      under attack, with a way back.
  - id: card-four-angles
    concept: judgment.whole-product-attack
    front: Which four angles do attackers take on a product before launch?
    back: >-
      Features, bugs, performance and security. One attacker per angle, each with its own
      brief.
  - id: card-no-authoring-chat
    concept: judgment.whole-product-attack
    front: Why doesn't an attacker get the chat that built the feature?
    back: >-
      It would inherit the author's assumptions and miss the same things. It gets the target,
      the intent and one angle.
  - id: card-reversible-launch
    concept: judgment.reversible-launch
    front: What makes a launch something you can take back?
    back: >-
      A flag and a small first share, guardrails written before it starts, and a kill switch
      and rollback tested in advance.

