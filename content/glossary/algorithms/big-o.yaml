term: Big O
aka: [Big-O, Big O notation, O notation]
short: A shorthand like O(n) that says how fast a cost grows as the input gets bigger.
explain: |
  Timing code on your laptop tells you little. Run it on a bigger list and the time might
  double, or it might go up a hundredfold. The useful question is how the cost grows.

  Big O answers it with the shape of the growth, not a number of seconds. O(n) grows in
  step with the input. O(n²) grows with its square. Constant factors and smaller terms are
  dropped, so 3n + 7 is O(n).

  It's an upper bound, and people usually quote the worst case. Two O(n) loops can still
  differ tenfold in practice. Use it to compare shapes, then measure.
analogy: Describing a road trip as "about an hour per hundred miles" rather than "52 minutes for this one".
example:
  language: js
  code: |
    // O(1): one step, whatever the size
    const first = items[0];

    // O(n): one step per item
    for (const item of items) total += item.price;

    // O(n²): every item against every other
    for (const a of items) for (const b of items) compare(a, b);
usage: In Big O terms that nested loop is O(n²); with 100,000 rows it won't finish in time.
twin:
  term: time-complexity
  difference: Time complexity is the thing being measured, how steps grow with input. Big O is the notation you write it in, and it describes memory too.
related: [time-complexity, space-complexity, amortised-cost, hidden-quadratic, brute-force]
level: 1
lessons: [cs.complexity, algo.approach, interview.communication]
