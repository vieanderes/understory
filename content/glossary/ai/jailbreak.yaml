term: jailbreak
short: Input written to talk a model out of its safety training, so it does what it would refuse.
explain: |
  Models are trained to refuse some requests. A determined user tries to get round that:
  role-play, "pretend you have no rules", a request split into harmless-looking pieces. When
  it works, the model's training gave way.

  For your app, that safety training is someone else's layer, and it's not one to rely on.
  Put your own checks around the model: what it may output, and what it may do.
analogy: Talking a doorman into letting you in with a good story. The rules didn't change; the person enforcing them did.
usage: That's a jailbreak, not an injection, because the user typed it themselves.
twin:
  term: prompt-injection
  difference: A jailbreak comes from the user, aimed at the model's own safety rules. Prompt injection hides in content the app reads, aimed at your app's rules and tools.
related:
  - prompt-injection
  - guardrail
level: 2
lessons:
