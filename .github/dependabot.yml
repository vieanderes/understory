# Dependabot: security updates immediately; regular updates once a week, grouped into one
# pull request (minor + patch only). Major versions open separately so they can be
# reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    # Releases wait three days before Dependabot offers them, so a hijacked package has
    # time to be caught. Dependabot hands this to pnpm as minimumReleaseAge, and pnpm then
    # refuses the whole lockfile if package.json already asks for a younger version. When
    # updating by hand, stay on releases at least three days old.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native compiler and has no JavaScript API yet. The linter and
      # the in-browser comprehension-coverage parser need that API, so stay on 6 on purpose.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Next and React ESLint plugins cap their peer range at ESLint 9.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pyodide 314 ships its runtime only as an ES module. The sandbox worker evaluates the
      # classic runtime script it is handed, because its CSP lets it fetch and import
      # nothing, so a new major needs that boot redesigned and the wheels re-pinned first.
      - dependency-name: pyodide
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
