id: rolling-snowballs
title: RollingSnowballs
topic: stacks-and-queues
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: A, type: "int[]" }
    - { name: B, type: "int[]" }
  returns: int
statement: |-
  N snowballs lie in a row along a narrow track, numbered from 0 to N − 1 from left to right.
  Snowball K has size A[K]. They all start rolling at the same moment and at the same speed.
  B[K] gives the direction of snowball K: 0 means it rolls left and 1 means it rolls right.

  Two snowballs meet when one rolling right catches up with, or runs into, one rolling left
  with no other snowball between them. When they meet, the larger one absorbs the smaller
  one: the smaller one is gone, and the larger one grows by the size of the smaller one and
  keeps its direction. If they are the same size, the one rolling right absorbs the other.
  Snowballs rolling in the same direction never meet.

  Write a function:

  {{signature}}

  that, given two arrays A and B of N integers each, returns the number of snowballs still
  rolling when no more can meet.

  For example, given A = [4, 3, 2, 1, 5] and B = [0, 1, 0, 0, 0], snowball 0 rolls left
  and meets nothing. Snowball 1 absorbs snowball 2 and grows to 5, then absorbs snowball 3
  and grows to 6, then absorbs snowball 4. The function should return 2.

  Given A = [1, 2, 1, 3] and B = [1, 1, 0, 0], snowball 1 absorbs snowball 2 and grows to 3.
  It then meets snowball 3, which has the same size, and absorbs it too. Snowballs 0 and 1
  both roll right and never meet, so the function should return 2.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [1..1,000,000,000];
  - each element of array B is 0 or 1.
examples:
  - { args: [[4, 3, 2, 1, 5], [0, 1, 0, 0, 0]], expected: 2 }
  - { args: [[1, 2, 1, 3], [1, 1, 0, 0]], expected: 2 }
timeLimitMs: 400
tests:
  - name: extreme_single
    description: one snowball, either direction
    group: correctness
    cases:
      - { args: [[7], [0]], expected: 1 }
      - { args: [[7], [1]], expected: 1 }
  - name: one_direction
    description: all roll the same way, or they roll apart
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4], [1, 1, 1, 1]], expected: 4 }
      - { args: [[4, 3, 2, 1], [0, 0, 0, 0]], expected: 4 }
      - { args: [[5, 1, 9, 2], [0, 0, 1, 1]], expected: 4 }
  - name: growing
    description: a small snowball wins only because it grew
    group: correctness
    cases:
      - { args: [[3, 1, 3], [1, 0, 0]], expected: 1 }
      - { args: [[5, 1, 1, 1, 3, 7], [1, 1, 1, 0, 0, 0]], expected: 2 }
      - { args: [[4, 2, 1, 2, 1], [1, 0, 1, 0, 0]], expected: 1 }
  - name: equal_sizes
    description: same-size meetings, the right-rolling one wins
    group: correctness
    cases:
      - { args: [[2, 2], [1, 0]], expected: 1 }
      - { args: [[2, 2, 4, 1], [1, 0, 0, 0]], expected: 1 }
      - { args: [[3, 3, 3, 3], [0, 1, 0, 1]], expected: 3 }
  - name: small_random
    description: random, N = 100
    group: correctness
    cases:
      - generate: { seed: 601, args: [{ kind: ints, n: 100, min: 1, max: 10 }, { kind: ints, n: 100, min: 0, max: 1 }] }
      - generate: { seed: 602, args: [{ kind: ints, n: 100, min: 1, max: 1000000000 }, { kind: ints, n: 100, min: 0, max: 1 }] }
  - name: medium_random
    description: random, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 603, args: [{ kind: ints, n: 2000, min: 1, max: 1000 }, { kind: ints, n: 2000, min: 0, max: 1 }] }
  - name: large_random
    description: random, N = 100,000
    group: performance
    cases:
      - generate: { seed: 604, args: [{ kind: ints, n: 100000, min: 1, max: 1000000000 }, { kind: ints, n: 100000, min: 0, max: 1 }] }
  - name: extreme_large
    description: alternating directions, largest sizes, N = 100,000
    group: performance
    cases:
      - generate: { seed: 605, args: [{ kind: constant, n: 100000, value: 1000000000 }, { kind: repeat, times: 50000, unit: [1, 0] }] }
      - generate: { seed: 606, args: [{ kind: ints, n: 100000, min: 1, max: 1000000000 }, { kind: repeat, times: 25000, unit: [1, 1, 1, 0] }] }
