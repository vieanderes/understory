term: hashable
aka: [hashability, unhashable]
short: Able to be used as a dictionary key or set member, because its value can't change.
explain: |
  A dict finds a key by turning it into a number, its hash, and jumping to that slot. Suppose a key changed after it was stored. Its hash would change too, and the dict would
  look in the wrong slot for ever.

  So Python allows only values whose hash stays fixed. Strings, numbers and tuples of such
  values work; lists, dicts and sets don't, and raise `TypeError: unhashable type`. Equal
  values must hash the same, which is why `1`, `1.0` and `True` count as one key.
analogy: A coat-check ticket. It works because the number on it never changes while your coat is hanging up.
example:
  language: python
  code: |
    seen = {(2, 3), (4, 5)}     # tuples are fine
    seen.add([6, 7])            # TypeError: unhashable type: 'list'

    totals = {1: "a", True: "b"}
    print(totals)               # {1: 'b'}
usage: Lists aren't hashable, so turn the coordinates into a tuple before you use them as a key.
related: [hash-map, hash-set, hashing, immutability]
level: 2
