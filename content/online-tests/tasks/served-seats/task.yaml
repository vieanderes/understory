id: served-seats
title: ServedSeats
topic: euclidean
difficulty: hard
type: algorithmic
recommendedMinutes: 45
signature:
  params:
    - { name: N, type: int }
    - { name: K, type: "int[]" }
  returns: int
statement: |-
  A round table has N seats, numbered from 0 to N − 1 clockwise. M waiters serve it, and
  waiter J has a fixed step K[J]. Every waiter starts by serving seat 0. Then the waiter
  moves K[J] seats clockwise, serves that seat, moves K[J] seats again, and so on. A waiter
  stops on reaching a seat they have already served.

  Write a function:

  {{signature}}

  that, given an integer N and an array K of M integers, returns the number of seats served
  by at least one waiter.

  For example, given N = 12 and K = [8, 9], the first waiter serves seats 0, 8 and 4, and
  the second serves seats 0, 9, 6 and 3. Seats 0, 3, 4, 6, 8 and 9 are served, so the
  function should return 6.

  Given N = 10 and K = [3], the function should return 10.

  Given N = 7 and K = [14], the function should return 1.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..1,000,000,000];
  - M is an integer within the range [1..50,000];
  - each element of array K is an integer within the range [1..1,000,000,000].
examples:
  - { args: [12, [8, 9]], expected: 6 }
  - { args: [10, [3]], expected: 10 }
  - { args: [7, [14]], expected: 1 }
tests:
  - name: extreme_single
    description: one seat, or one waiter
    group: correctness
    cases:
      - { args: [1, [5]], expected: 1 }
      - { args: [1000, [3000]], expected: 1 }
      - { args: [9, [6]], expected: 3 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [30, [6, 10, 15]] }
      - { args: [36, [4, 6, 9]] }
  - name: all_equal
    description: every waiter has the same step
    group: correctness
    cases:
      - generate: { seed: 201, args: [{ kind: value, value: 360 }, { kind: constant, n: 20, value: 24 }] }
  - name: small_random
    description: random steps, N = 360
    group: correctness
    cases:
      - generate: { seed: 202, args: [{ kind: value, value: 360 }, { kind: ints, n: 5, min: 1, max: 1000 }] }
      - generate: { seed: 203, args: [{ kind: value, value: 97 }, { kind: ints, n: 4, min: 1, max: 500 }] }
  - name: medium_random
    description: random steps, N = 5,040, M = 50
    group: correctness
    cases:
      - generate: { seed: 204, args: [{ kind: value, value: 5040 }, { kind: ints, n: 50, min: 1, max: 1000000000 }] }
  - name: large_range
    description: highly composite N = 735,134,400, M = 50,000
    group: performance
    cases:
      - generate: { seed: 205, args: [{ kind: value, value: 735134400 }, { kind: ints, n: 50000, min: 1, max: 1000000000 }] }
  - name: extreme_large
    description: N = 1,000,000,000, few waiters with large steps
    group: performance
    cases:
      - { args: [1000000000, [640000000, 250000000, 999999999]] }
      - generate: { seed: 206, args: [{ kind: value, value: 536870912 }, { kind: ints, n: 50000, min: 1, max: 1000000000 }] }
