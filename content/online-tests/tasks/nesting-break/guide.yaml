approach: >-
  Every closing bracket must match the most recent bracket that is still open, which is
  exactly what a stack gives you. Push each opener. On a closer, pop and compare: an empty
  stack or the wrong type means this is the first bad closer, so return its index. If the
  loop finishes with openers left over, return N; with none left, return −1.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      **N up to 200,000** and **efficient** mean one pass. Repeatedly deleting matched pairs
      from the string would be O(N²) and time out.

      Then note the three possible answers: −1, the index of the first bad closer, or N.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Three outcomes in one line shows you have them all. It also tells the reviewer the order
      you check them in.
    code:
      ts: |-
        // Return the index of the first unmatched closer, else N if any opener is left, else -1.
      python: |-
        # Return the index of the first unmatched closer, else N if any opener is left, else -1.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      - the empty string, which is properly nested;
      - a closer with nothing open;
      - an opener never closed;
      - a closer of the wrong type;
      - a correct nest of mixed types;
      - a bad closer followed by more text.
    input:
      - '""'
      - '")"'
      - '"("'
      - '"(]"'
      - '"{[]}"'
      - '"())("'
  - kind: plan
    title: Pick the data structure
    minutes: 2
    body: |-
      "Most recent still open" is last in, first out: a stack. A small map from each closer to
      its opener keeps the comparison to one line.

      Each character is pushed or popped once, so the pass is O(N).
  - kind: ask-ai
    title: Ask a syntax question you would otherwise look up
    minutes: 1
    body: |-
      Asking about language details is a good use of the assistant. It is quick, and it says
      nothing about your algorithm.
    prompt: >-
      In TypeScript, what does Array.prototype.pop() return when the array is empty? One
      sentence, no code.
    expect: >-
      It returns undefined. So comparing the popped value with the expected opener also
      handles the empty stack.
  - kind: write
    title: Write the solution yourself
    minutes: 5
    body: |-
      It is under ten lines. Type it yourself: the stack logic is what the task tests. Return
      as soon as a closer does not match, because the task wants the **first** one.
    code:
      ts: |-
        // Return the index of the first unmatched closer, else N if any opener is left, else -1.
        // Each closer must match the most recent opener still open: a stack, O(N) time, O(N) space.
        function solution(S: string): number {
          const opener: Record<string, string> = { ')': '(', ']': '[', '}': '{' };
          const open: string[] = [];
          for (let i = 0; i < S.length; i++) {
            const char = S[i]!;
            const wanted = opener[char];
            if (wanted === undefined) open.push(char);
            else if (open.pop() !== wanted) return i;
          }
          return open.length === 0 ? -1 : S.length;
        }
      python: |-
        # Return the index of the first unmatched closer, else N if any opener is left, else -1.
        # Each closer must match the most recent opener still open: a stack, O(N) time, O(N) space.
        def solution(S):
            opener = {")": "(", "]": "[", "}": "{"}
            stack = []
            for i, char in enumerate(S):
                wanted = opener.get(char)
                if wanted is None:
                    stack.append(char)
                elif not stack or stack.pop() != wanted:
                    return i
            return -1 if not stack else len(S)
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Check each result against the three outcomes in your header comment.
    expect: Three OKs, then −1, 0, 1, 1, −1 and 2 for your six cases.
  - kind: ai-writes
    title: Let the assistant write a large input
    minutes: 2
    body: |-
      A long string is tedious to type, so delegate it. You only need to check the shape of
      the line and that the run is fast.
    prompt: >-
      Write one line for test-input.txt: the string "{[()]}" repeated 2,000 times, then one
      extra "(", as a single quoted string. Output the line only, no code.
    expect: The run returns 12001 at once, since one opener is left over.
  - kind: test
    title: Check the Python version handles the empty stack
    minutes: 1
    body: |-
      If you work in Python, `pop()` on an empty list raises an error instead of returning a
      value. That is why the Python line checks `not stack` first. Your `")"` case proves it.
    expect: The `")"` case returns 0 with no runtime error.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite, so the code stays yours.
    prompt: >-
      Review my current solution for correctness and time complexity. List any problems in
      one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output, since printing slows the performance tests. Check the header
      states the complexity, then submit.
