term: array
aka: [dynamic array, JavaScript array]
short: Items stored side by side in one block of memory, each reached instantly by its position.
explain: |
  An ordered list of values under one name: every task on a to-do list, every score in a
  game. Because the items sit next to each other, the computer finds item 500 with one
  sum, start plus 500 steps. Reading by index is O(1), whatever the length.

  The cost comes when you insert or remove near the front. Every item after it has to
  shuffle along one place, which is O(n). Adding at the end is cheap, amortised O(1).

  So `shift()` and `unshift()` in a loop are a hidden O(n²). Read from the end, or keep
  an index that moves forwards instead.
analogy: A row of numbered lockers. Going to locker 40 is instant, but squeezing a new one in at the start means moving every locker along.
example:
  language: js
  code: |
    const scores = [72, 85, 91, 64];
    scores[2];          // O(1): straight to position 2
    scores.push(88);    // O(1) amortised: add at the end
    scores.unshift(50); // O(n): every item moves along one
usage: Keep it as an array and read by index; a linked list only pays off for inserts in the middle.
twin:
  term: linked-list
  difference: An array gives instant access by position and slow inserts in the middle. A linked list gives cheap inserts once you're at the spot, and slow access by position.
related: [linked-list, array-index, loop, off-by-one-error, amortised-cost, hidden-quadratic, in-place, object]
level: 1
lessons: [basics.arrays, cs.arrays-lists-hash-maps]
