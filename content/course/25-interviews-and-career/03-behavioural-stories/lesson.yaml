id: career.behavioural-stories
title: Behavioural stories
objective: Turn your past work into STAR stories centred on your decision and its result, and keep a bank of five.
level: essential
minutes: 10
concepts: [career.star, career.story-bank]
prerequisites: [career.your-narrative]
opening:
  text: >-
    You'll turn your past work into five short stories that answer most behavioural
    questions. Prepared stories sound calm and specific, and improvised ones rarely do.

steps:
  - type: prose
    id: why-stories
    body: |-
      Behavioural questions start with "Tell me about a time...". The idea behind them: how
      you acted before is the best clue to how you'll act next.

      At senior level they listen for scope. Did your decision change things beyond your own
      tickets: for the team, the users, the business?

  - type: multiple-choice
    id: pick-what-they-want
    concept: career.star
    difficulty: 1
    question: '"Tell me about a time you disagreed with a colleague." What are they after?'
    choices:
      - text: How you handled it, and what came of it
        correct: true
        feedback: >-
          Yes. How you acted then predicts how you'll act on their team.
      - text: Proof that you were right
        feedback: >-
          Being right matters less than how you worked it out together.
      - text: Whether you ever disagree
        feedback: >-
          Everyone disagrees sometimes. They want to see how you handle it.

  - type: prose
    id: star
    body: |-
      A tidy shape for these answers is **STAR**: situation, task, action, result.

      Keep the situation and task to a sentence each. Spend most of the time on the action:
      what *you* decided, and why. End with the result, with a number if you have one. Two
      minutes is plenty.

  - type: parsons
    id: arrange-star
    concept: career.star
    difficulty: 2
    prompt: Put the beats of a STAR answer in order.
    language: yaml
    blocks:
      - id: situation
        code: 'situation: the context, in one sentence'
        subgoal: Situation
      - id: task
        code: 'task: what you owned, in one sentence'
        subgoal: Task
      - id: action
        code: 'action: what you chose and why, the longest part'
        subgoal: Action
      - id: result
        code: 'result: what changed, with a number'
        subgoal: Result
      - id: lesson
        code: 'lesson: what you would do differently now'
        subgoal: Lesson
    distractors:
      - id: vague-ending
        code: 'result: everyone worked really hard and it went well'
        feedback: >-
          It says nothing you did or what changed. A result is something someone could check.

  - type: ai-review
    id: review-we-story
    concept: career.star
    difficulty: 2
    language: yaml
    request: Tidy this sample story about a flaky nightly import.
    flawClass: logic
    code: |
      situation: the nightly import failed about once a week
      task: I was on call, and each failure cost a morning of manual fixes
      action: we looked into it, and things got better over time
      result: one failure in the next three months, down from twelve
    prompt: >-
      A sample to review, not a script to learn. Tap the line that tells the interviewer
      least.
    lines: [3]
    reasons:
      - text: It hides what you decided and did
        correct: true
        feedback: >-
          Yes. "We" and "over time" hide your part. Say what you chose, and why.
      - text: The result has too many numbers
        feedback: >-
          Numbers make a result believable. This one is the strongest line.
      - text: The task should come after the action
        feedback: >-
          The task sets up why you acted. STAR puts it before the action.
    fix: |
      situation: the nightly import failed about once a week
      task: I was on call, and each failure cost a morning of manual fixes
      action: I traced it to a timeout, and made the import resume where it stopped
      result: one failure in the next three months, down from twelve

  - type: prose
    id: story-bank
    body: |-
      You don't need a story per question. You need a **story bank**: about five stories
      you know well, each adaptable to many questions.

      - A hard trade-off, such as quality against cost.
      - An incident you handled.
      - A disagreement you settled.
      - Someone you helped grow, or a group you led.
      - A project you scoped down or stopped.

  - type: multiple-choice
    id: pick-failure-story
    concept: career.story-bank
    difficulty: 3
    question: '"Tell me about a time something didn''t go to plan." Which story fits best?'
    choices:
      - text: The project you scoped down or stopped
        correct: true
        feedback: >-
          Right. It shows judgement, and what you learnt when plans changed.
      - text: The mentoring story
        feedback: >-
          Mentoring can go off plan, but it rarely shows a hard call under pressure.
      - text: Make up a small failure
        feedback: >-
          Interviewers ask follow-ups. Invented details fall apart quickly.

  - type: ai-review
    id: review-disagreement-story
    concept: career.story-bank
    difficulty: 3
    language: yaml
    request: Tighten this sample disagreement story for a behavioural round.
    flawClass: logic
    code: |
      situation: product wanted the assistant to answer every question
      my-view: unanswerable questions should get "I don't know" and a link
      action: I pulled 30 real chats where it had invented an answer
      ending: my manager backed me, so we did it my way
    prompt: >-
      A sample to review, not a script to learn. Tap the line that weakens it.
    lines: [4]
    reasons:
      - text: It's settled by rank, not evidence
        correct: true
        feedback: >-
          Right. End on what the evidence decided, and how you both agreed.
      - text: Pulling real chats looks confrontational
        feedback: >-
          Bringing evidence is the strongest move in the story. Keep it.
      - text: The situation takes product's side
        feedback: >-
          Stating their view fairly shows respect. That's a good sign, not a flaw.
    fix: |
      situation: product wanted the assistant to answer every question
      my-view: unanswerable questions should get "I don't know" and a link
      action: I pulled 30 real chats where it had invented an answer
      ending: we tested both for a week, and saying "I don't know" lowered complaints

  - type: explain-back
    id: explain-your-story
    concept: career.star
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks about a hard trade-off you made. Write one STAR story from your
      own work that defends the choice. Aim for six sentences.
    rubric:
      - The situation and task take a sentence each.
      - The action says "I", what you chose, the option you turned down and why.
      - The result is something someone could check, ideally with a number.
    modelAnswer: >-
      Your story is yours, so check its shape, not its words. The situation and task take a
      sentence each. The action is most of it: "I" measured, compared, chose. It names the
      option you turned down and the evidence against it. The result is a number or a
      before and after. It closes with one line on what you'd do differently.

recap:
  - Shape an answer as situation, task, action, result.
  - Put your decision and its reason at the centre, and end with a checkable result.
  - Keep a bank of five stories that answer most questions.
recall:
  - id: card-star
    concept: career.star
    front: What does STAR stand for, and which part gets the most time?
    back: >-
      Situation, task, action, result. The action gets the most time.
  - id: card-i-not-we
    concept: career.star
    front: Why say "I" rather than "we" in the action part?
    back: >-
      The interviewer is assessing you. "We" hides what you decided and did.
  - id: card-five-stories
    concept: career.story-bank
    front: Which five stories make a useful story bank?
    back: >-
      A hard trade-off, an incident, a disagreement, helping someone grow or leading, and a
      project you scoped down or stopped.
  - id: card-incident-story
    concept: career.story-bank
    front: What should an incident story end with?
    back: >-
      How service was restored, and the change you made so it can't happen again.
  - id: card-disagreement-ending
    concept: career.story-bank
    front: How should a disagreement story end?
    back: >-
      With what the evidence decided and how you both agreed, not with who had more rank.

