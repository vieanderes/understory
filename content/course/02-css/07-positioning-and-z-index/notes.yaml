summary: >-
  Normal flow, flexbox and grid place every box for you. The `position` property lets you
  take one box and place it yourself: nudge it (`relative`), lift it out and pin it inside
  another box (`absolute`), pin it to the window (`fixed`), or let it scroll and then stick
  (`sticky`). A box with any `position` other than `static` is called a **positioned** box.


  Every positioned box measures `top`, `right`, `bottom` and `left` from a reference
  rectangle called its **containing block**. Most bugs with badges, tooltips and dropdowns
  come from the browser using a different containing block from the one you had in mind.


  Once boxes overlap, something decides which one is drawn on top. `z-index` does, but only
  among boxes in the same **stacking context**: a group that is painted as one layer. That
  single rule explains why `z-index: 9999` can lose to `z-index: 10`, and it points to the fix,
  which is always on an ancestor. Positioning is for the few boxes that must float over
  others; layout itself belongs to flow, flexbox and grid.
remember:
  - An absolute box is placed from its containing block, the padding box of the nearest positioned ancestor, or a screen-sized box at the top of the page if there is none.
  - '`position: relative` with no offsets moves nothing, and makes the element the anchor for its absolute children.'
  - Absolute and fixed boxes leave the flow, so the space they took closes up and they shrink to fit their content.
  - Relative and sticky boxes keep their space in the flow, so nothing around them moves.
  - A sticky box needs an edge such as `top` and only sticks while its parent is still on screen.
  - '`z-index` only compares boxes inside the same stacking context, and from outside a whole context sits at one level.'
  - '`z-index` works on positioned boxes and on flex and grid items, and `z-index: 0` forms a stacking context while `auto` does not.'
  - When a `z-index` loses, find the ancestor that forms the stacking context and fix it there, instead of raising the number.
sections:
  - title: Which containing block each position uses
    body: |-
      Each `position` value measures from a different rectangle.

      - `static` and `relative`: the parent's content area, the same as normal flow. A
        relative box is laid out normally, then shifted by its offsets.
      - `absolute`: the **padding box** of the nearest ancestor that is positioned. That's the
        area inside the ancestor's border, padding included. So `top: 0; left: 0` puts the
        box in the corner just inside the border, not inside the padding.
      - `fixed`: the browser window, the **viewport**. The deep dive covers the exception, a
        `transform` on an ancestor.
      - `sticky`: its nearest scrolling ancestor, usually the page, and it can't leave its
        parent.

      "Nearest positioned ancestor" means exactly that. It skips every ancestor that is still
      `static`, however close:

      ```html
      <style>
        .card { position: relative; }
        .badge { position: absolute; top: 0; right: 0; }
      </style>
      <div class="card">
        <div class="photo-frame">       <!-- static: skipped -->
          <span class="badge">New</span> <!-- measured from .card -->
        </div>
      </div>
      ```

      If no ancestor is positioned, the containing block is the **initial containing
      block**: a rectangle the size of the viewport, at the very top of the page. That has a
      surprising effect. A box with `bottom: 0` and no positioned ancestor sits at the bottom
      of the **first screen**, not the bottom of the page, and scrolls away with the content.

      Percentages follow the containing block too. In a relative card whose padding box is
      240px by 140px, an absolute child with `width: 50%; height: 50%` is 120px by 70px.
  - title: What absolute positioning does to a box
    body: |-
      `absolute` changes more than the position. Several side effects follow from taking the
      box out of the flow.

      - **The space closes up.** Siblings move as if the box weren't there, and a parent with
        only absolute children collapses to zero height.
      - **The box shrinks to fit.** A block usually fills its parent's width. An absolute box
        is only as wide as its content, like the "New" badge.
      - **It becomes a block.** An absolute `span` computes to `display: block` and takes a
        width and height.
      - **Without offsets it stays put.** With no `top`, `right`, `bottom` or `left`, it sits
        where it would have been in the flow, but the space still closes up underneath.

      Setting two opposite offsets stretches the box between them:

      ```css
      .card { position: relative; width: 200px; height: 100px; }
      .overlay {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 10px;
        right: 10px;
      }
      /* the overlay is 180px by 100px: it fills the card, 10px in from each side */
      ```

      That's the usual way to lay a shade or a clickable layer over a whole card.

      For `relative`, opposite offsets don't stretch anything, because the box keeps its
      normal size. When both `top` and `bottom` are set, `top` wins, and when both `left` and
      `right` are set, `left` wins for left-to-right text.

      Because absolute boxes ignore their neighbours, they don't make room when text grows.
      Use them for things that should float over content, such as badges, tooltips and
      menus. Build the layout itself with flow, flexbox or grid.
  - title: Why sticky stops working
    body: |-
      A sticky box is laid out in the flow and keeps its space. While you scroll, it moves
      with the page until it reaches its threshold, then stays there. Three rules decide
      whether that works.

      **It needs a threshold.** `position: sticky` alone does nothing, because the browser
      doesn't know which edge to stick to. Add `top: 0`, or another offset.

      **It can't leave its parent.** A sticky box sticks only while its parent is on screen.
      When the parent's bottom edge scrolls past, the sticky box is carried away with it:

      ```html
      <style>
        section { height: 300px; }
        section h2 { position: sticky; top: 0; height: 50px; }
      </style>
      <section><h2>Starters</h2> ...</section>
      <section><h2>Mains</h2> ...</section>
      <!-- each heading sticks while its own section is on screen,
           then the next section's heading takes over -->
      ```

      That's a feature for section headings in a long menu or a contacts list. It's a bug
      when the sticky box's parent is only as tall as the box itself: then there's no room to
      stick at all. Put a sticky page header directly in `body`, not inside a short wrapper.

      **It sticks inside the nearest scrolling box.** If an ancestor has `overflow: hidden`,
      `auto` or `scroll`, that ancestor becomes the box the sticky element sticks within,
      even if it never scrolls. The header then scrolls away with the page. `overflow: clip`
      clips without becoming a scroll box, so it doesn't break sticky.

      When sticky fails, check those three in order: an offset, a tall enough parent, and no
      `overflow` on the way up.
  - title: Painting order and what forms a stacking context
    body: |-
      Inside one stacking context, the browser paints in layers, back to front:

      1. The background and border of the element that forms the context.
      2. Positioned children with a negative `z-index`.
      3. Ordinary blocks in the flow, in HTML order.
      4. Inline content, such as text.
      5. Positioned children with `z-index: auto` or `0`, in HTML order.
      6. Positioned children with a positive `z-index`, lowest first.

      So a positioned box beats a later box in the flow even without any `z-index`. Two boxes
      with the same `z-index` are ordered by the HTML, and the later one is on top.

      `z-index` does nothing on a box that is `static`, unless it's a flex or grid item,
      which can take a `z-index` without being positioned.

      These form a new stacking context, among others:

      - a `relative` or `absolute` box with a `z-index` other than `auto`, including `0`
      - every `fixed` and `sticky` box, even without a `z-index`
      - a flex or grid item with a `z-index` other than `auto`
      - `opacity` below 1, any `transform`, and `isolation: isolate`

      A negative `z-index` has a trap. If the parent doesn't form a context, the child is
      painted behind the parent's background and seems to vanish:

      ```css
      .card { position: relative; background: white; }  /* no context */
      .card .shadow { position: absolute; z-index: -1; } /* hidden behind the card */

      .card { position: relative; background: white; isolation: isolate; }
      /* now the card is a context, and the shadow sits above its background */
      ```

      To debug a box that won't come forward, walk up from it and find the nearest ancestor
      that forms a context. Then do the same from the box covering it. Compare the two
      ancestors at the level where their branches meet. That comparison is the only one the
      browser makes.
pitfalls:
  - '**Forgetting the anchor.** An absolute badge with no positioned ancestor measures from the top of the page and flies off. Put `position: relative` on the element it belongs to.'
  - '**Pinning to `bottom: 0` with no positioned ancestor.** The box lands at the bottom of the first screen and scrolls away. Anchor it to a positioned parent, or use `fixed` if it should stay in the window.'
  - '**Giving `z-index` to a static box.** It''s ignored unless the box is positioned or a flex or grid item. Add `position: relative` first.'
  - '**Sticky inside an overflow container.** An ancestor with `overflow: hidden` or `auto` becomes the sticky box''s scroller, and the header scrolls away. Remove the overflow, or use `overflow: clip` if you only need clipping.'
  - '**Answering a lost z-index with a bigger number.** The box is trapped in its ancestor''s stacking context, and no number inside can escape it. Remove what forms the context, raise the ancestor, or move the element out.'
  - '**Laying out a page with absolute positioning.** It looks right at one screen size, then text grows and boxes overlap, because absolute boxes never make room. Use flow, flexbox or grid, and position only the overlays.'
interview:
  - question: Explain the differences between relative, absolute, fixed and sticky.
    answer: >-
      They differ in their reference box and in whether they keep their space. `relative`
      stays in the flow, keeps its space and shifts visually by its offsets; its main job is
      to become the anchor for absolute children. `absolute` leaves the flow, so the space
      closes up, and it's placed against the padding box of the nearest positioned ancestor.
      `fixed` also leaves the flow and is placed against the viewport, so it stays put while
      the page scrolls, unless an ancestor has a `transform`. `sticky` stays in the flow like
      relative, then sticks at its threshold while its parent is on screen. For layout I use
      flow, flexbox and grid; positioning is for overlays such as badges, tooltips, sticky
      headers and dialogs.
  - question: "What is a stacking context, and why can `z-index: 9999` lose to `z-index: 10`?"
    answer: >-
      A stacking context is a group of boxes painted together as one layer, and `z-index`
      only orders boxes within the same group. A tooltip with 9999 inside a gallery that has
      `position: relative; z-index: 1` is ordered only among the gallery's children. From
      outside, the whole gallery sits at level 1. A header with `z-index: 10` in the parent
      context beats the gallery, and so everything inside it. Contexts are formed by a
      positioned box with a `z-index` other than `auto`, by `fixed` and `sticky` boxes, and by
      `opacity` below 1, `transform` and `isolation: isolate`. The fix is on the ancestor:
      remove its `z-index`, raise it above the header, or move the tooltip out, for example to
      the top layer with a popover.
  - question: A sticky header isn't sticking. How do you debug it?
    answer: >-
      I check three things in order. First, that it has a threshold such as `top: 0`,
      because `position: sticky` alone never sticks. Second, the height of its parent: a
      sticky box can't leave its parent, so inside a wrapper only as tall as the header it
      has no room to move. Moving the header up to be a child of `body` usually fixes that.
      Third, every ancestor's `overflow`: `hidden`, `auto` or `scroll` makes that ancestor
      the scrolling box it sticks within, so it scrolls away with the page. The developer
      tools make this quick: select each ancestor in turn and read its `overflow` in the
      computed styles. If
      only clipping is needed there, `overflow: clip` keeps sticky working.
