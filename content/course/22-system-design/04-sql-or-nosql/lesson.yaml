    verified: true

deepDive: >-
  The GIN run used 300,000 rows on PostgreSQL 17.11. The containment query used a bitmap
  index scan in 0.087 ms. The `->>` equality query fell back to a parallel sequential scan
  in 16.0 ms. If you must filter with `->>`, an expression index works:
  `CREATE INDEX ON events ((data->>'type'))`.


  "NoSQL" names what these stores are not, so the label hides big differences. Some
  document stores now offer multi-document transactions, and some relational databases
  scale writes across machines. Compare the actual guarantees: which operations are atomic,
  what a read may miss, and how data is split. The question is always which access patterns
  must be cheap, and which consistency the product can live with.
