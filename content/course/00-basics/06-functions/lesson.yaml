    primary: true
    verified: true

deepDive: >-
  Already know this? You'll also meet functions written as arrows: `const add = (a, b) => a +
  b;`. It's a shorter way to write the same idea, with a few differences the JavaScript
  chapter covers.


  A function can call other functions, and even itself. It can also be passed around like
  any other value. That's how lists get sorted and filtered, which comes later.
