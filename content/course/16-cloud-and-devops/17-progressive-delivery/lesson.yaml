    verified: true

deepDive: >-
  The random rollout ran in Node 24: 10,000 users each loaded a page ten times at 10%, and
  6,458 saw both versions. The expected share is 1 - 0.9^10 - 0.1^10, about 65%. The
  hashed version gives every user one answer, and raising 10% to 20% keeps the first group
  and adds more. Real flag services do the same with a stronger hash, such as MurmurHash,
  and let you target by country or plan too. OpenFeature is a vendor-neutral API for
  reading flags from any of them.


  Flags are debt. Each one is a branch in your code, so delete it once the feature is fully
  out. Many teams give every flag an owner and an expiry date.


  Canary analysis is often automated, for example by Argo Rollouts or Flagger on Kubernetes.
  The minimum request count depends on your error rate. At a 1% baseline, a rise to 2% needs
  about a thousand canary requests before it stands out from luck, not dozens.


  DORA renamed and added metrics over the years. Older writing says lead time for changes,
  change failure rate and time to restore service. Today's guide says change lead time,
  change fail rate and failed deployment recovery time, and adds deployment rework rate: the
  share of deploys that were unplanned fixes for incidents. It groups lead time, frequency and
  recovery time as throughput, and fail rate and rework rate as instability. The research finds that fast delivery and
  stability go together, rather than trading off.


  "What could this change break?", in the engineering judgment chapter, asks the canary's
  question before the merge: which callers and contracts a change touches, and which tests
  guard them.
