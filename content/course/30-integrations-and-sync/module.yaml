id: integrations
number: 30
title: "Integrations and data sync"
summary: "Working with systems you don't control: vendors that break the spec, paging through everything, tokens that expire, full and delta sync, deletions, messy data, adapters to one model, webhooks with reconciliation, and writing into other systems safely."
why: "Most products depend on data that lives in someone else's system, and that system will change, fail and lie to you."
youCanBuild: "A nightly sync from a vendor API with a tie-broken cursor, token refresh, change detection by hash, deletions behind a safety valve, and reconciliation."
concepts:
  - id: integrations.spec-breaking-vendors
    title: "Vendors that break the spec"
    summary: "Real APIs send a 200 with an error body, an HTML error page or a missing field, so a client checks the body, not only the status."
  - id: integrations.runtime-schema-validation
    title: "Validating replies at runtime"
    summary: "A schema parses every vendor reply where it enters, so a changed shape fails loudly at the boundary instead of deep inside the code."
  - id: integrations.tolerant-reader
    title: "The tolerant reader"
    summary: "A client reads only the fields it needs and maps unknown enum values to a fallback, so a vendor adding a value does not break it."
  - id: integrations.cursor-tie-breaker
    title: "A cursor with a tie-breaker"
    summary: "A keyset cursor on a timestamp alone skips rows that share it, so the cursor adds a unique column such as the id."
  - id: integrations.async-pagination
    title: "Pagination as a generator"
    summary: "An async generator hides the page loop and yields one record at a time, so callers read everything without handling cursors."
  - id: integrations.updated-after-filter
    title: "Reading what changed since"
    summary: "An updated-after filter or a Link header lets a client fetch only records changed since a point, instead of the whole data set."
  - id: integrations.proactive-refresh
    title: "Refreshing before expiry"
    summary: "A client refreshes an access token shortly before it expires, with a margin for clock skew, rather than waiting for a 401."
  - id: integrations.single-flight-refresh
    title: "Single-flight refresh"
    summary: "When many callers find the token expired at once, one refresh runs and the rest wait for its result, so a rotated token is not spent twice."
  - id: integrations.refresh-token-rotation
    title: "Refresh token rotation"
    summary: "Each refresh returns a new refresh token and invalidates the old one, and an invalid_grant reply means the user must sign in again."
  - id: integrations.granted-scopes
    title: "Granted scopes"
    summary: "A vendor may grant fewer scopes than requested and then quietly return less data, so the client checks the scopes it was given."
  - id: integrations.full-vs-delta
    title: "Full and delta sync"
    summary: "A full sync copies everything and is simple but slow, while a delta sync copies only changes and needs a reliable way to find them."
  - id: integrations.watermarks
    title: "Watermarks"
    summary: "The watermark for the next delta sync is the time this sync started, not when it finished, so changes made during the run are not lost."
  - id: integrations.overlap-window
    title: "The overlap window"
    summary: "Each delta sync reaches back a little before the watermark to catch late-arriving or clock-skewed records, and deduplicates what it sees twice."
  - id: integrations.change-hashing
    title: "Change detection by hash"
    summary: "A hash of a record's fields in a stable key order shows whether it really changed, so unchanged records are not rewritten."
  - id: integrations.mark-and-sweep
    title: "Mark and sweep"
    summary: "A full pass marks every record it sees, and records left unmarked afterwards are treated as deleted at the source."
  - id: integrations.deletion-safety-valve
    title: "The deletion safety valve"
    summary: "A sweep that would delete more than a set share of records stops and asks a person, because an empty page usually means an error, not mass deletion."
  - id: integrations.remote-ids
    title: "Remote and internal ids"
    summary: "Each copied record keeps the vendor's id beside your own, so updates and deletions find the right row and your ids never leak out."
  - id: integrations.pure-dates
    title: "Pure dates and timestamps"
    summary: "A birthday or a due date is a calendar date with no time zone, and storing it as a timestamp makes it shift by a day."
  - id: integrations.enum-fallback
    title: "Mapping enums with a fallback"
    summary: "Each vendor value maps to one of yours, and an unknown value maps to a safe fallback and is reported rather than crashing the sync."
  - id: integrations.csv-quirks
    title: "CSV encodings and delimiters"
    summary: "A CSV file may use another encoding, a semicolon delimiter or a byte order mark, so an importer detects them instead of assuming."
  - id: integrations.vendor-adapters
    title: "One adapter per vendor"
    summary: "Each vendor sits behind an adapter that implements one interface, so the rest of the code never learns which vendor it talks to."
  - id: integrations.capability-matrix
    title: "The capability matrix"
    summary: "A table of what each vendor supports, such as webhooks, deletions or custom fields, decides which features the product can offer per vendor."
  - id: integrations.common-data-model
    title: "A common data model"
    summary: "One shape for a contact or an invoice across all vendors, with the raw payload kept beside it for fields the model does not cover."
  - id: integrations.custom-field-mapping
    title: "Custom-field mapping"
    summary: "Customers map their own vendor fields onto yours, and a passthrough lets them reach a vendor feature the common model lacks."
  - id: integrations.thin-events
    title: "Webhooks as hints"
    summary: "A thin webhook says only that something changed, and the receiver fetches the current state, so lost or reordered events do no harm."
  - id: integrations.reconciliation
    title: "Reconciliation"
    summary: "A regular poll compares your copy with the source and repairs drift, because webhooks are fast but never guaranteed."
  - id: integrations.outgoing-webhooks
    title: "Sending webhooks"
    summary: "A sender signs each event, retries on a growing schedule, disables an endpoint after repeated failures, and refuses internal addresses."
  - id: integrations.external-reference
    title: "Create once by external reference"
    summary: "When a vendor has no idempotency keys, you store your own reference on the record and look it up before retrying a create."
  - id: integrations.vendor-error-mapping
    title: "Mapping vendor errors"
    summary: "Each vendor error is mapped to retry, fix the data, reconnect or give up, so callers act on a few clear cases."
  - id: integrations.partial-results
    title: "Partial results"
    summary: "A write that half succeeds reports which items landed and which did not, so a retry sends only the rest."
