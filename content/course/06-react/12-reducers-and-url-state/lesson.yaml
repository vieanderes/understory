deepDive: >-
  **Which home, when.** Start with state in the component that uses it. Lift it when a
  sibling needs it. Use context when many distant components read it. Use a reducer when the
  update rules grow. Use the URL when a link or a reload should keep it.


  **Reducer plus context.** A common pairing puts the state in one context and `dispatch` in
  another. `dispatch` never changes between renders, so components that only send actions
  don't render again when the state changes.


  **`replaceState` or `pushState`.** `replaceState` swaps the current history entry, so Back
  leaves the page. `pushState` adds an entry, so Back returns to the previous tab.


  **State outside React.** Some state already lives in another library or a browser API. React
  reads it with `useSyncExternalStore(subscribe, getSnapshot)`. The snapshot must be the same
  object while nothing has changed, or React sees a change on every check and renders forever.
