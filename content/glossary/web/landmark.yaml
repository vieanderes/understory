term: landmark
aka: [landmark region, ARIA landmark]
short: A main region of a page, like the navigation or the main content, that people jump between.
explain: |
  Arriving on a page, a screen reader user wants to skip straight to the content, or back to
  the menu. Landmarks make that possible. Each is a region with a role they can jump
  between.

  Semantic elements give you them for free. `header`, `nav`, `main` and `footer` each
  become one. Have one `main` per page, and label two `nav`s so people can tell them apart.
analogy: The signs in a shopping centre for the food court, the car park and the exits. You head for the area you need without walking every corridor.
example:
  language: html
  code: |
    <header>...</header>
    <nav aria-label="Main">...</nav>
    <main>...</main>
    <footer>...</footer>
usage: Wrap the article in main, so the landmark lets screen reader users skip the menu.
twin:
  term: heading-structure
  difference: Landmarks split a page into a few big regions, like the menu and the content. Headings outline the content inside those regions, section by section.
related: [heading-structure, semantic-html, screen-reader, aria]
level: 2
lessons: [html.semantic-structure]
