id: tooling.git-as-a-graph
title: Branches and merging
objective: Work on a branch, merge it back, resolve a conflict, and get lost work back with the reflog.
level: essential
minutes: 10
concepts: [tooling.git-graph, tooling.merge-rebase, tooling.reflog]
prerequisites: [tooling.git-basics]
opening:
  text: >-
    You'll try an idea on a branch without touching the working version, then merge it back.
    And when a commit seems to vanish, you'll know how to get it back.

steps:
  - type: prose
    id: what-a-branch-is
    body: |-
      A **branch** is a label stuck on one commit. Your first branch is usually called `main`.
      When you commit, the label moves up to the new commit.

      `git switch -c` makes a new label and moves you onto it. `git branch` lists them, with `*`
      on yours:

      ```bash
      $ git switch -c add-gallery
      Switched to a new branch 'add-gallery'
      $ git branch
      * add-gallery
        main
      ```

      Git calls "the branch you're on" **HEAD**. Only that label moves when you commit.

  - type: trace-table
    id: trace-pointers
    concept: tooling.git-graph
    difficulty: 1
    language: bash
    code: |
      # main points at B
      git switch -c add-gallery
      git commit -m "Add photo gallery"   # creates C
      git switch main
      git commit -m "Add ticket link"     # creates D
    prompt: A band's website. After each line, which commit do `main` and `add-gallery` point at?
    columns: [main, add-gallery]
    rows:
      - line: 2
        values: [B, B]
        given: true
      - line: 3
        values: [B, C]
      - line: 4
        values: [B, C]
      - line: 5
        values: [D, C]

  - type: prose
    id: commits-and-pointers
    body: |-
      Each commit remembers the one before it, its **parent**. So history is a graph: a line
      that can split. Here's the real picture of those steps:

      ```bash
      $ git log --graph --oneline --all
      * 041a1c2 Add photo gallery
      | * 4b3fae4 Add ticket link
      |/
      * 8a7d5fe Add tour page
      * 17e20ab Add home page
      ```

      Read it bottom up. Both new commits sit on `Add tour page`, so history forks there.

  - type: prose
    id: merging
    body: |-
      On `main`, `git merge add-gallery` brings the gallery in. Both branches moved, so Git
      writes a **merge commit** with two parents:

      ```text
      Merge made by the 'ort' strategy.
      ```

      Sometimes only one side moved. Then there's nothing to join, and Git slides `main` up to
      the other branch. That's a **fast-forward**, and no new commit is made.

  - type: parsons
    id: arrange-feature-branch
    concept: tooling.merge-rebase
    difficulty: 2
    language: bash
    prompt: >-
      The band wants a photo gallery. Build it on a branch, then merge it into `main`. Two
      blocks don't belong.
    blocks:
      - id: new-branch
        code: git switch -c add-gallery
        subgoal: Work on a branch
      - id: add
        code: git add gallery.html
        subgoal: Work on a branch
      - id: commit
        code: git commit -m "Add photo gallery"
        subgoal: Work on a branch
      - id: back-to-main
        code: git switch main
        subgoal: Bring it back
      - id: merge
        code: git merge add-gallery
        subgoal: Bring it back
    distractors:
      - id: switch-no-c
        code: git switch add-gallery
        feedback: >-
          Without `-c`, Git only moves to a branch that exists. It stops with `invalid
          reference`.
      - id: merge-main
        code: git merge main
        feedback: >-
          Run on the branch, that pulls `main` into the gallery. Switch to `main`, then merge
          the branch in.

  - type: prose
    id: conflicts
    body: |-
      Now both branches changed the same line. Git can't choose, so it stops with a
      **conflict** and writes both versions into the file:

      ```text
      <h1>The Night Owls</h1>
      <<<<<<< HEAD
      <p>Next gig: Sunday</p>
      =======
      <p>Next gig: Saturday</p>
      >>>>>>> change-gig
      ```

      Yours is above `=======`, theirs below. Edit the file to what it should say, and delete
      all three marker lines. Then `git add` it and `git commit`.

  - type: bug-hunt
    id: hunt-leftover-marker
    concept: tooling.merge-rebase
    difficulty: 3
    language: bash
    code: |
      $ cat index.html
      <h1>The Night Owls</h1>
      <p>Next gig: Saturday</p>
      >>>>>>> change-gig
      $ git add index.html
      $ git commit -m "Merge branch 'change-gig'"
      [main c812870] Merge branch 'change-gig'
    prompt: The merge went through. Then the live site shows a strange line. Tap the line at fault.
    lines: [4]
    reasons:
      - text: A conflict marker was left in the file
        correct: true
        feedback: >-
          Yes. Git doesn't check your edit. It commits whatever the file holds.
      - text: The Saturday line should have stayed Sunday
        feedback: >-
          Picking either side is fine, if it's what the band wants. The leftover marker is the bug.
      - text: '`git add` should come after the commit'
        feedback: >-
          The order is right: add marks the conflict as solved, then the commit saves it.
    verify:
      question: Which check, run before `git add`, would have caught this?
      choices:
        - text: '`grep ">>>>>>>" index.html` finding a line'
          correct: true
          feedback: >-
            Yes. Any match means a marker survived the edit.
        - text: '`git status` showing the file as modified'
          feedback: >-
            Status only says the file changed. It never reads what's inside.
        - text: '`git log --oneline` after the commit'
          feedback: >-
            The log lists commit messages. The marker hides inside the file, not the message.
    fix: |
      $ cat index.html
      <h1>The Night Owls</h1>
      <p>Next gig: Saturday</p>
      $ git add index.html
      $ git commit -m "Merge branch 'change-gig'"

  - type: prose
    id: the-reflog
    body: |-
      `git branch -D add-merch` deletes a branch, even one you never merged. No label points
      at its commits now, so they seem gone.

      They aren't. Git keeps a diary of every commit `HEAD` has been on, the **reflog**:

      ```bash
      $ git reflog -2
      f97f1ec HEAD@{0}: checkout: moving from add-merch to main
      ad5020d HEAD@{1}: commit: Add merch page
      ```

      `git branch <name> <hash>` sticks a new label on a commit, and it's safe again.

  - type: fill-blank
    id: fill-rescue-branch
    concept: tooling.reflog
    difficulty: 3
    language: bash
    prompt: >-
      The drummer deleted the merch branch by mistake. Put it back, under its old name.
    template: |
      $ git branch -D add-merch
      Deleted branch add-merch (was ad5020d).
      $ git reflog -3
      f97f1ec HEAD@{0}: checkout: moving from add-merch to main
      ad5020d HEAD@{1}: commit: Add merch page
      f97f1ec HEAD@{2}: checkout: moving from main to add-merch
      $ git {{1}} add-merch {{2}}
    blanks:
      - key: '1'
        answer: branch
      - key: '2'
        answer: ad5020d
    bank: [branch, switch, merge, ad5020d, f97f1ec]

  - type: explain-back
    id: explain-lost-commit
    concept: tooling.reflog
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: After `git branch -D add-gallery`, why can you still get its commits back?
    rubric:
      - A branch is only a label, so deleting it removes no commit.
      - Nothing points at the commits now, so the history no longer shows them.
      - The reflog recorded their hashes, so a new branch can point at them again.
    modelAnswer: >-
      A branch is a label holding one hash. Deleting it removes the label, not the commits.
      `git log` walks back from the labels that are left, so it can't reach them. But the
      reflog remembers every commit `HEAD` has been on. It still has the hash, and `git branch`
      can stick a new label on it.

recap:
  - Work on a branch, and read the history as a graph.
  - Merge a branch back, and resolve a conflict by hand.
  - Get a lost commit back with `git reflog`.

recall:
  - id: card-branch-is-pointer
    concept: tooling.git-graph
    front: What is a Git branch, and what happens to it when you commit?
    back: >-
      A label on one commit. Committing moves the branch you're on to the new commit.
  - id: card-fast-forward
    concept: tooling.merge-rebase
    front: When does `git merge` write no commit at all?
    back: >-
      When your branch hasn't moved since the other one split off. Git slides the label forward.
  - id: card-conflict-steps
    concept: tooling.merge-rebase
    front: A merge stops with a conflict. What are your three steps?
    back: >-
      Edit the file to the right result and delete the markers. Then `git add` it and `git
      commit`.
  - id: card-reflog-recover
    concept: tooling.reflog
    front: You deleted a branch with `git branch -D`. How do you get its commits back?
    back: >-
      Find its last commit in `git reflog`, then point a new branch at it with `git branch`.

references:
  - kind: book
    title: 'Pro Git, second edition: 3.1 Git Branching, Branches in a Nutshell'
    authors: Scott Chacon and Ben Straub
    year: 2014
