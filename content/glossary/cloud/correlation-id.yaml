term: correlation id
aka: [request id]
short: A unique label stamped on one request at the edge and passed along to every service it touches.
explain: |
  One click can touch a gateway, two services and a queue. Each writes its own logs. When something fails, you need every line from that one click. The thousand others from
  the same moment only get in the way.

  So the first service generates an id and sends it in a header on every downstream call.
  Every log line includes it. Search for the id and the whole story appears in order. Accept an incoming id only from your own edge, in a fixed format. Otherwise it becomes
  another place to inject text.
analogy: A parcel's tracking number. Every depot scans it, so you can follow one parcel through the whole network.
example:
  language: json
  code: |
    {"level":"warn","event":"login_failed","request_id":"9f2c1e","user":"u_481"}
    {"level":"error","event":"token_refresh","request_id":"9f2c1e","status":502}
usage: Put the correlation id in the error page too, so support can find the exact request from a screenshot.
related: [structured-logging, distributed-tracing, observability]
level: 2
lessons: [security.detection-and-logging]
