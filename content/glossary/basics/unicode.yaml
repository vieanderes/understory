term: Unicode
aka: [code point, code points]
short: The worldwide catalogue that gives every character, in every script, its own number.
explain: |
  Computers store numbers, not letters. Everyone has to agree which number means which
  character, or text arrives as gibberish. This standard is that agreement: "A" is 65,
  "é" is 233, and there are well over a hundred thousand more.

  Each number is a code point. Some things you see as one character are several code points. A flag, a skin-toned
  emoji and an accent added to a letter are all examples.

  So `"👍🏽".length` is 4 in JavaScript, not 1. When a task counts characters, decide
  whether it means code units, code points or what a reader sees.
analogy: A giant phone book for characters. Every letter and symbol in the world has its own number.
example:
  language: js
  code: |
    'A'.codePointAt(0);  // 65
    'é'.codePointAt(0);  // 233
    'café'.length;       // 4
    [...'👍🏽'].length;   // 2 code points, drawn as one symbol
usage: The name looks five letters long, but it's six Unicode code points because of the combining accent.
twin:
  term: utf-8
  difference: Unicode gives each character a number. UTF-8 is one way of writing those numbers as bytes, using one to four bytes each.
related: [utf-8, string, lexicographic-order]
level: 2
lessons: [cs.data-representation]
