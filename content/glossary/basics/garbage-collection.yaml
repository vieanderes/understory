term: garbage collection
aka:
  - garbage collector
  - GC
  - automatic memory management
short: A runtime's automatic freeing of memory that no part of the program can reach any more.
explain: |
  Every object a program makes takes memory. If nobody gives it back, memory fills up and
  the program dies. Freeing it by hand, as C does, invites crashes when something is freed
  twice or used after.

  JavaScript, Go, Java and Kotlin run a collector that finds objects nothing points at and
  reclaims them. Python and Swift mostly count references instead. Rust checks ownership
  when it compiles, so it needs neither.

  The trap: the collector returns memory, not files, sockets or database connections. It
  runs whenever it likes, so close those yourself on a known line, with `finally` or `with`.
analogy: Cleaners who clear any table nobody is sitting at. They won't hand back the key to your locker.
usage: Don't wait for garbage collection to close the connection; release it in a finally block.
