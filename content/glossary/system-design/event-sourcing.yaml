term: event sourcing
aka: [event-sourced, event log]
short: Storing every change as a fact in an append-only log, and replaying them to get current state.
explain: |
  A normal table keeps only the latest balance. You know what it is, but not how it got
  there. Keeping every change, "deposited £50", "withdrew £20", lets you rebuild the balance
  and answer any question about the past.

  Current state becomes a **projection** folded from the events, often stored as a read
  model so queries stay fast. Events are never edited: a mistake is fixed with a new event.
  The cost is real. Changing an event's shape, rebuilding projections and deleting personal
  data all take careful work.
analogy: A bank statement. The balance at the bottom is worked out from every line above it, and a wrong charge is fixed with a refund line, not by rubbing it out.
example:
  language: ts
  code: |
    const events = [
      { type: 'deposited', amount: 5000 },
      { type: 'withdrew', amount: 2000 },
    ];
    const balance = events.reduce(
      (sum, e) => (e.type === 'deposited' ? sum + e.amount : sum - e.amount),
      0,
    ); // 3000
usage: With event sourcing we can rebuild last month's balances; with an UPDATE they're gone.
related: [saga, message-broker, eventual-consistency]
level: 3
lessons: [arch.cqrs-and-event-sourcing]
