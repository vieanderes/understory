term: f-string
aka:
  - formatted string literal
short: A text literal prefixed with f that fills in the values of expressions written inside braces.
explain: |
  Gluing text and numbers together with `+` and `str()` is noisy and error-prone.
  Python lets you write the sentence with gaps and fill them in place.

  Put `f` before the quotes and any `{expression}` inside is evaluated and inserted.
  After a colon you add formatting: `{price:.2f}` for two decimals, `{n:,}` for thousands
  separators. Add `=` for quick debugging: `{total=}` prints the name and the value.
analogy: A form letter with blanks. "Dear ___, your order of ___ has shipped." The blanks fill themselves.
example:
  language: python
  code: |
    name, price, qty = "tea", 3.5, 1200
    print(f"{name}: £{price:.2f}, {qty:,} sold")
    # tea: £3.50, 1,200 sold
    print(f"{price * qty=}")
    # price * qty=4200.0
usage: Use an f-string for the log line; the concatenation is hard to read.
related:
  - slicing
level: 1
