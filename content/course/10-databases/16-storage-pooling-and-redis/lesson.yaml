deepDive: >-
  Serverless functions make pooling urgent. Each running copy is its own tiny server with its
  own connections, and a busy minute can start hundreds of copies. Hosts put a pooler in
  front for exactly this, as the cloud chapter shows.


  Redis also does atomic counters. `INCR page:42:views` adds one safely however many servers
  call it at once, and `SET lock:job1 me NX EX 30` claims something only if nobody else has.


  Partitioning is useful on its own. Split a huge `events` table by month, and dropping a
  year of old data is `DROP TABLE events_2024_01`, instant, instead of a slow `DELETE`.


  Resharding, moving to more shards later, is where naive schemes hurt. With `hash % 3`, going
  to four shards moves most rows. Real systems use many small virtual shards or consistent
  hashing, covered in the system design chapter.
