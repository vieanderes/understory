term: guardrail
short: A code check on a model's input, output or actions that holds even when it's fooled.
explain: |
  "Never reveal customer emails" in a prompt is a request. A model can be talked out of it.
  A guardrail is the lock behind the request. It's code that scans the input, validates the
  output, or blocks an action before it runs.

  Good guardrails are specific. Check the reply against a schema, filter out personal data,
  and send refunds over a limit to a person. Each one has a plan for when it trips: refuse,
  retry, or hand over to a human.
analogy: The railing on a mountain road. The driver should stay on the road anyway; the railing is for the day they don't.
usage: The prompt says no refunds over £100, but there's no guardrail, so one injected email and it'll pay.
