deepDive: >-
  These results ran in Chromium against a small local server. A 404 fulfilled with `ok` false.
  An unreachable server rejected with `TypeError: Failed to fetch`. `abort()` rejected with an
  `AbortError`, and `AbortSignal.timeout(50)` against a slow answer rejected with a
  `TimeoutError`.


  Leave out the `Content-Type` header and send a string body, and the browser labels it
  `text/plain;charset=UTF-8`. Many servers then refuse it or read it as plain text.


  `response.json()` throws a `SyntaxError` when the body isn't JSON. A server that fails often
  sends an HTML error page, so check `ok` before you parse. A body can also be read only once:
  call `json()` or `text()`, not both.


  Aborting stops the browser waiting. A request that already reached the server may still
  finish there, so cancelling saves bandwidth and prevents stale results, but undoes nothing.
  Whether a request is safe to send again is a backend question, covered in that chapter.


  A page can only fetch from another origin if that server allows it, a rule called CORS. The
  security chapter explains it.
