id: js.closures
title: Variables, scope and closures
objective: Trace which variable a function reads, and use a closure to keep state private.
level: essential
minutes: 10
concepts: [js.declarations, js.scope, js.closures]
prerequisites: [js.arrays]
opening:
  text: >-
    You'll know why a row of buttons made in a loop can all do the same thing. And you'll be
    able to give a function a private memory of its own.

steps:
  - type: prose
    id: blocks-and-var
    body: >-
      Curly braces make a **block**: the body of an `if`, a loop or a function. A variable made
      with `let` or `const` inside a block exists only there. That's its **scope**, the part
      of the code where the name works.


      Older code uses `var`. It ignores blocks and makes one variable for the whole function.
      You'll meet it, but write `let` and `const`.

  - type: predict-output
    id: predict-block-scope
    concept: js.scope
    difficulty: 1
    language: js
    code: |
      const price = 30;
      function quote(isMember) {
        if (isMember) {
          const price = 25;
        }
        return price;
      }
      console.log(quote(true));
    question: A member should pay 25. What does this log?
    choices:
      - text: '`30`'
        correct: true
        feedback: >-
          Right. The inner `price` lives and dies inside the `if` block.
      - text: '`25`'
        feedback: >-
          The inner `const` doesn't replace the outer one. It's a second variable, gone once the
          block ends.
      - text: '`undefined`'
        feedback: >-
          The outer `price` is still in scope on line 6, and it still holds 30.

  - type: prose
    id: binding-not-value
    body: >-
      A function can use the variables around the place it was written. It keeps that access
      even after the surrounding code has finished. That's a **closure**.


      It reads those variables when it runs, not when it was made, so it sees their latest
      value. A `var` loop has one `i` for every turn. A `let` loop makes a fresh `i` each
      turn.

  - type: predict-output
    id: predict-var-loop
    concept: js.closures
    difficulty: 2
    language: js
    code: |
      const removers = [];
      for (var i = 0; i < 3; i++) {
        removers.push(() => console.log("remove row " + i));
      }
      removers[0]();
    question: The loop makes one remover per row. What does the first one log?
    choices:
      - text: '`remove row 3`'
        correct: true
        feedback: >-
          Right. All three share one `i`, and it's 3 by the time they run.
      - text: '`remove row 0`'
        feedback: >-
          That's the natural reading. But a function remembers the variable, not the value it
          had.
      - text: '`remove row 2`'
        feedback: >-
          They do share one `i`. The loop stops once `i` reaches 3, so that's what they read.

  - type: playground
    id: fix-remove-buttons
    concept: js.declarations
    difficulty: 2
    prompt: >-
      Each Remove button should hide its own row. The test press on the first one fails, and
      the error mentions `null`: every handler looks for row 3. Change one word in the loop.
      Then try the buttons yourself.
    html: |
      <h1>Shopping list</h1>
      <ul>
        <li id="row-0">Milk <button id="remove-0">Remove</button></li>
        <li id="row-1">Eggs <button id="remove-1">Remove</button></li>
        <li id="row-2">Bread <button id="remove-2">Remove</button></li>
      </ul>
    js: |
      for (var i = 0; i < 3; i++) {
        const button = document.querySelector("#remove-" + i);
        button.addEventListener("click", () => {
          document.querySelector("#row-" + i).hidden = true;
        });
      }

      // Test it: this presses the first Remove button once
      document.querySelector("#remove-0").click();
    editable: [js]
    showTree: true
    checks:
      - label: The Milk row is hidden
        selector: '#row-0'
        attribute: { name: hidden }
    solution:
      js: |
        for (let i = 0; i < 3; i++) {
          const button = document.querySelector("#remove-" + i);
          button.addEventListener("click", () => {
            document.querySelector("#row-" + i).hidden = true;
          });
        }

        // Test it: this presses the first Remove button once
        document.querySelector("#remove-0").click();
    hints:
      - The handlers run after the loop has finished. Which `i` do they read then?
      - With `var`, there's one `i`, and it ends at 3. There's no `#row-3`.
      - Swap `var` for `let`, so each turn gets its own `i`.

  - type: prose
    id: private-state
    body: |-
      Closures can give a function a private memory:

      ```js
      function makeCounter() {
        let count = 0;
        return () => {
          count = count + 1;
          return count;
        };
      }
      ```

      Each call to `makeCounter` runs `let count = 0` again, so each counter gets its own
      `count`. No code outside can touch it, only the arrow function can.

  - type: playground
    id: fix-shared-likes
    concept: js.closures
    difficulty: 3
    prompt: >-
      Bug report: one like on the dog photo, and it says 3. Both buttons share one count. Give
      each button its own, the way `makeCounter` does.
    html: |
      <p>Cat photo <button id="like-cat">Like</button></p>
      <p>Dog photo <button id="like-dog">Like</button></p>
    js: |
      let likes = 0;
      function makeLikeButton(id) {
        const button = document.querySelector("#like-" + id);
        button.addEventListener("click", () => {
          likes = likes + 1;
          button.textContent = "Likes: " + likes;
        });
      }
      makeLikeButton("cat");
      makeLikeButton("dog");

      // Test presses: the cat twice, the dog once
      document.querySelector("#like-cat").click();
      document.querySelector("#like-cat").click();
      document.querySelector("#like-dog").click();
    editable: [js]
    checks:
      - label: The cat button says Likes 2
        selector: '#like-cat'
        text: 'Likes: 2'
      - label: The dog button says Likes 1
        selector: '#like-dog'
        text: 'Likes: 1'
    solution:
      js: |
        function makeLikeButton(id) {
          let likes = 0;
          const button = document.querySelector("#like-" + id);
          button.addEventListener("click", () => {
            likes = likes + 1;
            button.textContent = "Likes: " + likes;
          });
        }
        makeLikeButton("cat");
        makeLikeButton("dog");

        // Test presses: the cat twice, the dog once
        document.querySelector("#like-cat").click();
        document.querySelector("#like-cat").click();
        document.querySelector("#like-dog").click();
    hints:
      - There's one `likes` for the whole page. Both listeners close over it.
      - Each call to `makeLikeButton` could make a fresh variable of its own.
      - Move `let likes = 0;` inside `makeLikeButton`.

  - type: ai-review
    id: review-once
    concept: js.closures
    difficulty: 4
    language: js
    request: Write once(fn), so the confirm handler runs at most one time.
    flawClass: logic
    code: |
      function once(fn) {
        return (...args) => {
          let called = false;
          if (called) {
            return undefined;
          }
          called = true;
          return fn(...args);
        };
      }
      const confirm = once(() => console.log("confirmed"));
      confirm();
      confirm(); // logs a second time
    prompt: >-
      A code assistant suggested this. A double click still confirms twice. Tap the line at
      fault.
    lines: [3]
    reasons:
      - text: '`called` is remade on every call'
        correct: true
        feedback: >-
          Right. Move it into `once`, where it's made once and remembered.
      - text: '`...args` loses the arguments'
        feedback: >-
          Rest and spread pass everything through. The log shows `fn` ran both times.
      - text: '`called = true` throws, because `let` can''t be reassigned'
        feedback: >-
          That's `const`. A `let` can be reassigned, and nothing throws here.
    fix: |
      function once(fn) {
        let called = false;
        return (...args) => {
          if (called) {
            return undefined;
          }
          called = true;
          return fn(...args);
        };
      }

  - type: code-challenge
    id: write-make-basket
    concept: js.closures
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `makeBasket(limit)`. It returns an object with two functions.


      `add(quantity)` adds items and returns `true`. If the basket would go over `limit`, it
      changes nothing and returns `false`. `count()` returns how many items are in there.


      Two baskets never share a count, and no outside code can set it.


      Example: with `makeBasket(4)`, `add(3)` gives `true`, `add(2)` gives `false`, and `count()`
      gives `3`.
    hints:
      - The count has to survive between calls to `add`. Where can it live?
      - >-
        A `let` inside `makeBasket` is made once per basket. Both functions can close over it.
      - >-
        Move `let held = 0;` into `makeBasket`, then check the limit before you add.

  - type: explain-back
    id: explain-remove-buttons
    concept: js.closures
    difficulty: 3
    prompt: |-
      ```js
      const removers = [];
      for (var i = 0; i < 3; i++) {
        removers.push(() => console.log("remove row " + i));
      }
      removers[0](); // remove row 3
      ```

      Every remover removes the last row. Why, and why does `let` in place of `var` fix it?
    rubric:
      - A handler remembers the variable `i`, not the value it held when the handler was made.
      - '`var` makes one `i` for the whole loop, holding the final value by the time anyone clicks.'
      - '`let` makes a new `i` each time round, so each handler keeps its own.'
    modelAnswer: >-
      Each handler looks up `i` when the button is pressed, not when the handler was made. With
      `var` there's a single `i` for the whole loop. By the time anyone clicks, it holds the
      last value, so every button does the same thing. With `let`, each turn of the loop gets
      its own `i`.

recap:
  - Say where a variable can be used, and why `var` ignores blocks.
  - Predict which value a function reads, and fix a loop of handlers with `let`.
  - Keep state private inside a function with a closure.

recall:
  - id: card-block-scope
    concept: js.scope
    front: Where can a `const` declared inside an `if` block be used?
    back: >-
      Only inside that block. Once the block ends, the name refers to whatever is declared
      further out, if anything.
  - id: card-binding-or-value
    concept: js.closures
    front: Does a closure remember a value or a variable?
    back: >-
      The variable. A change made after the function was created still shows up when it runs.
  - id: card-loop-bindings
    concept: js.declarations
    front: How many `i` variables does a `var` loop make, and a `let` loop?
    back: >-
      `var` makes one for the whole function. `let` makes a new one each time round the loop.
  - id: card-separate-counters
    concept: js.closures
    front: Do two counters from `makeCounter()` share a count?
    back: >-
      No. Each call runs `let count = 0` again, and each returned function keeps its own.

