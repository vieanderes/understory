deepDive: >-
  Normalisation has formal steps called normal forms. Third normal form, the usual target,
  fits in one line: every column depends on the key, the whole key, and nothing but the key.


  A foreign key can say what happens when the parent goes. `ON DELETE CASCADE` removes the
  children with it, `ON DELETE SET NULL` clears the pointer, and the default refuses the delete,
  as you saw. Choose per relation: order lines should go with their order, and an order should
  never vanish with its customer.


  Sometimes a team copies a fact on purpose, such as a count of orders on the customer row, so
  a busy page reads faster. That's **denormalisation**. It's a trade: every write must keep the
  copy in step, usually inside one transaction.


  Postgres names each constraint, such as `orders_customer_id_fkey`. The name appears in the
  error, so your code can tell which rule was broken.
