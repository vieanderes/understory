deepDive: >-
  **Showing the change.** After saving, call `revalidatePath('/tasks')` from `next/cache` in
  the action. Next.js then draws that page again with fresh data. The caching lesson has
  finer tools for this.


  **Actions in their own file.** A Client Component can't define a Server Action. Put
  `'use server'` at the top of a file such as `app/actions.ts`, and every exported function in
  it becomes an action that any component can import.


  **Errors for the form.** Return an object such as `{ error: 'Choose 1 to 8 hours' }` and
  read it with `useActionState`, from the forms lesson. Throw only for things the user can't
  fix.


  **Action or route handler?** Use an action for your own forms and buttons. Use a route
  handler when something outside your app calls you, such as a phone app or a webhook. It
  gets a URL you choose and any method.
