term: blocking call
aka:
  - blocking I/O
  - blocking the event loop
short: A call that holds the thread until it finishes, so nothing else on that thread can run meanwhile.
explain: |
  Async code shares one thread between many tasks. That works only if each task steps aside
  while it waits. A call that waits without stepping aside freezes every task at once.

  The usual culprits look harmless: `time.sleep`, a synchronous HTTP client, a database driver
  without async support, or a big calculation. One of them inside a coroutine and a server
  that handled a hundred requests a second handles one.

  The fix is to use the async version (`await asyncio.sleep`), or hand the work to a thread
  with `asyncio.to_thread`. A test that runs one request at a time won't notice.
analogy: One person in a single-lane drive-through who stops to read the whole menu. Every car behind waits.
example:
  language: python
  code: |
    async def handler():
        time.sleep(2)               # freezes every task
        await asyncio.sleep(2)      # lets others run
        rows = await asyncio.to_thread(load_report)  # sync work off the loop
usage: The route is async but calls the sync client, so that's a blocking call stalling every request.
