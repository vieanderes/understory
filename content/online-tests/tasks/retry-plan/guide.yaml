approach: >-
  Walk the outcomes one attempt at a time. Decide in a fixed order: success stops, a code
  that cannot be retried stops, the last allowed attempt stops, and anything else waits.
  The wait is the Retry-After value when the outcome has one, otherwise the backoff, which
  starts at B and doubles after every retry but never goes above C.
complexity: O(M) time, O(M) space for the log
steps:
  - kind: read
    title: Read the decision rules as a list
    minutes: 2
    body: |-
      Four checks decide each attempt, and their **order** matters: success, then "cannot
      be retried", then "out of attempts", then wait.

      Two details trip people up: the backoff exponent counts **retries**, not attempts, and
      a Retry-After value ignores the cap.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Write the order of the checks into the comment. It becomes the shape of your loop.
    code:
      ts: |-
        // Per attempt: 2xx stops (success), non-retryable stops (fail), attempt M stops (exhausted), else wait.
      python: |-
        # Per attempt: 2xx stops (success), non-retryable stops (fail), attempt M stops (exhausted), else wait.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - M = 1, so even a retryable outcome ends the log at once;
      - 501, which looks like a server error but is not on the list;
      - a Retry-After of 0, and one above the cap;
      - a run long enough to reach the cap.
    input:
      - "([\"503\"], 1, 1, 1)"
      - "([\"501\", \"200\"], 1, 10, 2)"
      - "([\"429:100\", \"429:0\", \"503\", \"200\"], 1, 10, 4)"
      - "([\"500\", \"500\", \"500\", \"500\", \"500\", \"500\", \"200\"], 3, 20, 7)"
  - kind: ask-ai
    title: Ask how to split the outcome, nothing more
    minutes: 1
    body: |-
      Parsing `"429:7"` is a syntax question, and a fair one to delegate. Ask for the one
      call in both languages, not for the solution.
    prompt: >-
      One line each: how do I split a string like "429:7" on the colon in TypeScript and in
      Python, so that "503" alone gives one part?
    expect: >-
      split(':') in both. A string without a colon gives a single part, so the Retry-After
      part is missing.
  - kind: write
    title: Write the loop yourself
    minutes: 6
    body: |-
      One loop over the attempts, the four checks in order. Keep the backoff in a variable
      that doubles and is clamped to C after each retry: it avoids a large power of two.
    code:
      ts: |-
        // Per attempt: 2xx stops (success), non-retryable stops (fail), attempt M stops (exhausted), else wait.
        function solution(A: string[], B: number, C: number, M: number): string[] {
          const RETRYABLE = new Set([408, 429, 500, 502, 503, 504]);
          const log: string[] = [];
          // The backoff doubles from B and is clamped each time, so it never grows past C and
          // never loses precision, however many retries there are.
          let backoff = B;
          for (let attempt = 1; ; attempt++) {
            const outcome = A[attempt - 1]!;
            const [codeText, retryAfter] = outcome.split(':');
            if (codeText !== 'timeout') {
              const code = Number(codeText);
              if (code >= 200 && code <= 299) {
                log.push('success');
                return log;
              }
              if (!RETRYABLE.has(code)) {
                log.push('fail');
                return log;
              }
            }
            if (attempt === M) {
              log.push('exhausted');
              return log;
            }
            log.push(`wait ${retryAfter !== undefined ? Number(retryAfter) : backoff}`);
            backoff = Math.min(C, backoff * 2);
          }
        }
      python: |-
        # Per attempt: 2xx stops (success), non-retryable stops (fail), attempt M stops (exhausted), else wait.
        def solution(A, B, C, M):
            retryable = {408, 429, 500, 502, 503, 504}
            log = []
            # Doubling and clamping each time keeps the backoff at or below C.
            backoff = B
            attempt = 1
            while True:
                parts = A[attempt - 1].split(':')
                code_text = parts[0]
                if code_text != 'timeout':
                    code = int(code_text)
                    if 200 <= code <= 299:
                        log.append('success')
                        return log
                    if code not in retryable:
                        log.append('fail')
                        return log
                if attempt == M:
                    log.append('exhausted')
                    return log
                wait = int(parts[1]) if len(parts) > 1 else backoff
                log.append('wait ' + str(wait))
                backoff = min(C, backoff * 2)
                attempt += 1
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Check your own cases against the
      rules, one attempt at a time.
    expect: >-
      Three OKs, then ["exhausted"], ["fail"], ["wait 100", "wait 0", "wait 4", "success"]
      and ["wait 3", "wait 6", "wait 12", "wait 20", "wait 20", "wait 20", "success"].
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask the assistant to check the rules you are least sure of. Problems only, so the
      code stays yours.
    prompt: >-
      Review my current solution for these rules: the backoff exponent counts retries, a
      Retry-After value is used as it is even above the cap, and 501 is not retryable. List
      any problems in one line each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
