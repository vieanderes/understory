id: db.schema-design
title: Designing tables
objective: "Choose column types, store money and time correctly, and let `NOT NULL`, `UNIQUE` and `CHECK` refuse bad rows."
level: essential
minutes: 10
concepts: [db.column-types, db.money-and-time, db.constraints]
prerequisites: [db.grouping, cs.data-representation]
opening:
  text: >-
    You'll design a table that refuses bad data before it's saved, so later code never meets it. You'll also dodge the two classic traps: money and time zones.

steps:
  - type: prose
    id: types-are-rules
    body: >-
      Every column has a **type**, and the type is the first rule the table enforces. The ones
      you'll use most:


      - `integer` for whole numbers, `text` for words, `boolean` for true or false

      - `date` for a day, `timestamptz` for a moment in time

      - `numeric(10,2)` for exact decimals


      Postgres refuses a value that doesn't fit. That refusal is a feature: bad data stops at
      the door.

  - type: sql
    id: fix-bad-date
    concept: db.column-types
    difficulty: 1
    prompt: >-
      A form sent "next friday" as the start time, and Postgres refused it. Run it and read the
      error. Then write the time as `'2026-10-09 19:00+00'`.
    setup: |
      CREATE TABLE events (
        id integer PRIMARY KEY,
        title text NOT NULL,
        starts_at timestamptz NOT NULL
      );
    starter: |
      INSERT INTO events VALUES (1, 'Pottery evening', 'next friday');
      SELECT * FROM events;
    solution: |
      INSERT INTO events VALUES (1, 'Pottery evening', '2026-10-09 19:00+00');
      SELECT * FROM events;
    checks:
      query: SELECT * FROM events ORDER BY id
    showSchema: true
    hints:
      - The error quotes the value it couldn't read as a time.
      - Replace only the third value, and keep the single quotes.

  - type: prose
    id: constraints
    body: >-
      Types aren't the only rules. A **constraint** is a rule Postgres checks on every write,
      whatever code sends it:


      ```sql

      CREATE TABLE members (

        id integer PRIMARY KEY,

        email text NOT NULL UNIQUE,

        plan text NOT NULL DEFAULT 'free',

        seats integer CHECK (seats >= 1)

      );

      ```


      `NOT NULL` forbids a missing value. `UNIQUE` forbids repeats. `CHECK` holds any condition
      you write. Break one, and the insert fails with the rule's name.

  - type: sql
    id: add-constraints
    concept: db.constraints
    difficulty: 3
    prompt: >-
      Make `sign_ups` refuse a missing email, a repeated email and an age under 13. Run it: the
      check tries each bad row and shows which were refused.
    setup: |
      -- Tries a statement, reports whether Postgres refused it, and undoes it either way.
      CREATE FUNCTION refused(statement text) RETURNS boolean LANGUAGE plpgsql AS $f$
      BEGIN
        BEGIN
          EXECUTE statement;
          RAISE EXCEPTION 'accepted';
        EXCEPTION
          WHEN raise_exception THEN RETURN false;
          WHEN others THEN RETURN true;
        END;
      END $f$;
    starter: |
      CREATE TABLE sign_ups (
        id integer PRIMARY KEY,
        email text,
        age integer
      );
    solution: |
      CREATE TABLE sign_ups (
        id integer PRIMARY KEY,
        email text NOT NULL UNIQUE,
        age integer CHECK (age >= 13)
      );
    checks:
      query: >-
        SELECT
          refused($$INSERT INTO sign_ups VALUES (1, NULL, 30)$$) AS no_email_refused,
          refused($$INSERT INTO sign_ups VALUES (1, 'a@example.com', 30), (2, 'a@example.com', 40)$$) AS repeat_refused,
          refused($$INSERT INTO sign_ups VALUES (1, 'b@example.com', 12)$$) AS under_13_refused,
          NOT refused($$INSERT INTO sign_ups VALUES (1, 'c@example.com', 13)$$) AS good_row_accepted
    hints:
      - Each rule goes right after its column's type.
      - '`email` needs two rules. `age` needs a `CHECK` with a condition in brackets.'
      - 'The age rule is `CHECK (age >= 13)`, so 13 itself is allowed.'

  - type: prose
    id: money-needs-exact-numbers
    body: >-
      You met floating point in data representation: a `double precision` holds a close guess,
      not the exact number. Here `::` turns each value into that type, and the guesses add up badly:


      ```sql

      SELECT 0.1::double precision + 0.2::double precision;

      -- 0.30000000000000004

      ```


      Never store money that way. Use whole pence in an `integer`, or `numeric(10,2)`, which
      keeps exactly two decimal places.

  - type: sql
    id: fix-float-basket
    concept: db.money-and-time
    difficulty: 2
    prompt: >-
      Run this basket total and look at the price. Then change the `price` column's type to
      `numeric(8,2)` and run again.
    starter: |
      CREATE TABLE basket (item text NOT NULL, price double precision NOT NULL);
      INSERT INTO basket VALUES ('Stamp', 0.10), ('Envelope', 0.20);
      SELECT sum(price) AS total FROM basket;
    solution: |
      CREATE TABLE basket (item text NOT NULL, price numeric(8,2) NOT NULL);
      INSERT INTO basket VALUES ('Stamp', 0.10), ('Envelope', 0.20);
      SELECT sum(price) AS total FROM basket;
    checks:
      ordered: false
    hints:
      - Only the type on the first line changes.

  - type: prose
    id: timestamptz
    body: >-
      Time has its own trap. `timestamptz` stores an exact moment, and shows it in the reader's
      time zone. Plain `timestamp` stores a clock reading with no zone, so Postgres can't tell
      whose 18:00 it means.


      For anything that happened or will happen, use `timestamptz`. Run the next step to watch
      the difference.

  - type: sql
    id: watch-time-zones
    prompt: >-
      The same start time is stored both ways. Run it: switching to Tokyo time moves the
      `timestamptz` and leaves the plain `timestamp` saying 18:00.
    setup: |
      CREATE TABLE talks (
        id integer PRIMARY KEY,
        starts_at timestamptz NOT NULL,
        starts_local timestamp NOT NULL
      );
      INSERT INTO talks VALUES (1, '2026-03-01 18:00+00', '2026-03-01 18:00');
    starter: |
      SELECT * FROM talks;
      SET TimeZone = 'Asia/Tokyo';
      SELECT * FROM talks;
    showSchema: true

  - type: ai-review
    id: review-timestamp-without-zone
    concept: db.money-and-time
    difficulty: 3
    language: sql
    request: A table for live online classes that people join from any country.
    flawClass: edge-case
    code: |
      CREATE TABLE classes (
        id integer PRIMARY KEY,
        title text NOT NULL,
        starts_at timestamp NOT NULL,
        price_pence integer NOT NULL CHECK (price_pence >= 0)
      );
    prompt: >-
      An assistant wrote this. A teacher in Lisbon saves 09:00, and students in Warsaw arrive an
      hour early. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`timestamp` stores no time zone, so 09:00 is ambiguous'
        correct: true
        feedback: >-
          Right. `timestamptz` fixes the moment, and each reader sees their own clock.
      - text: The price should be a `double precision`
        feedback: >-
          Whole pence in an `integer` is exact. A float would bring back rounding errors.
      - text: '`title` should allow NULL'
        feedback: >-
          A class without a title is a bad row. `NOT NULL` is right there.
    fix: |
      CREATE TABLE classes (
        id integer PRIMARY KEY,
        title text NOT NULL,
        starts_at timestamptz NOT NULL,
        price_pence integer NOT NULL CHECK (price_pence >= 0)
      );

  - type: explain-back
    id: explain-money-type
    concept: db.money-and-time
    difficulty: 3
    audience: reviewer
    kind: decide
    prompt: >-
      A migration stores prices in a `double precision` column because "it handles
      decimals". You ask for whole pence in an `integer` instead. Defend that choice to the
      author.
    rubric:
      - A floating-point number is a close guess, so sums drift, such as 0.30000000000000004.
      - Those small errors show up in totals, refunds and checks like "paid equals owed".
      - The cost is converting at the edges, pence in storage and pounds on screen, which is cheaper than wrong totals.
    modelAnswer: >-
      A `double precision` can't hold most decimals exactly, so 0.10 plus 0.20 comes out as
      0.30000000000000004. The error is tiny, but it shows up in totals, and a check like
      "paid equals owed" can fail. Whole pence in an `integer` are exact. The trade-off is
      converting to pounds for display, one small function. `numeric(10,2)` is the other
      exact choice.

recap:
  - Pick the type that fits each column, and let Postgres refuse values that don't.
  - Write rules as `NOT NULL`, `UNIQUE` and `CHECK`, so bad rows never land.
  - Store money as integer pence or `numeric`, and moments as `timestamptz`.

recall:
  - id: card-constraint-kinds
    concept: db.constraints
    front: Which constraint stops two members sharing an email?
    back: "`UNIQUE` on the `email` column."
  - id: card-check
    concept: db.constraints
    front: Write the rule that makes `age` refuse values under 13.
    back: "`age integer CHECK (age >= 13)`"
  - id: card-money-type
    concept: db.money-and-time
    front: Which column types are safe for money?
    back: "`integer` holding pence, or `numeric` with fixed decimals such as `numeric(10,2)`."
  - id: card-timestamptz
    concept: db.money-and-time
    front: Why use `timestamptz` rather than `timestamp` for an event start?
    back: >-
      `timestamptz` stores an exact moment and shows it in each reader's zone. `timestamp` is a
      clock reading with no zone.

