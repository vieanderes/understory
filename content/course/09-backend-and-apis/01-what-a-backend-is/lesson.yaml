    note: The standard behind methods, headers and status codes.
    verified: true

deepDive: >-
  The output above is trimmed. A real `curl -i` against a Node server also shows `Date`,
  `Connection: keep-alive` and `Keep-Alive: timeout=5`. They say when the answer was made
  and that the connection stays open for the next request.


  Header names ignore case. One server writes `content-type`, another `Content-Type`, and
  both mean the same header.


  `curl` prints a progress meter when its output goes to a file or a pipe. Add `-s`, for
  silent, to hide it in scripts. `-s` also hides error messages, so pair it with `-S` to keep
  those.


  Ports below 1024 are reserved for well-known services: 80 for `http` and 443 for `https`.
  That's why a public URL rarely shows a port, and why development servers pick numbers like
  3000.
