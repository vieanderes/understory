deepDive: >-
  **Merging k sorted lists.** Put the first item of each list in a min-heap, remembering
  which list it came from. Pop the smallest, write it out, and push the next item from the
  same list. The heap never holds more than k items, so it's O(n log k). Python's
  `heapq.merge` does this.


  Building a heap from n items by pushing one at a time costs O(n log n). Sifting down from
  the last parent to the root instead builds it in O(n), because most nodes sit near the
  bottom and barely move. Python's `heapq.heapify` does exactly that.


  When k is close to n, a heap stops paying off: sort instead. When you need only the k-th
  item and not the order, quickselect finds it in O(n) on average. `heapq.nlargest(k,
  items)` is the one-line Python answer to this lesson; know what it does inside.


  JavaScript has no heap in its standard library, so interviewers expect you to write push
  and pop, or to say which library you'd use in real code. A heap is also the engine of
  Dijkstra's shortest-path algorithm, with distances as the keys.
