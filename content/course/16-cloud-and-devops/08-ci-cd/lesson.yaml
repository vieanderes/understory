id: cloud.ci-cd
title: CI/CD pipelines
objective: Write a GitHub Actions workflow that tests, builds one image and deploys it, with secrets kept per environment.
level: essential
minutes: 10
concepts: [cloud.pipelines, cloud.environments, cloud.ci-secrets, cloud.build-once]
prerequisites: [tooling.quality-gates, cloud.building-images, security.secrets]
opening:
  text: >-
    You'll write the file that tests, builds and ships your app on every push to `main`.
    No more deploying from your laptop, and no more "it passed on my machine".

steps:
  - type: prose
    id: what-ci-cd-is
    body: >-
      The tooling chapter met **CI**, continuous integration: a service runs your checks on a
      fresh machine for every push. **CD**, continuous delivery, carries on from there. Every
      change that passes is built and shipped, without anyone typing a deploy command.


      The ordered stages, test, then build, then deploy, make a **pipeline**. A failing stage
      stops everything after it.

  - type: prose
    id: first-workflow
    body: |-
      In GitHub Actions, a pipeline is a **workflow**: a YAML file in `.github/workflows/`.
      YAML is a text format for settings: `key: value` lines, indentation for nesting, and
      `-` for list items.

      ```yaml
      on: push                          # when it runs
      jobs:
        test:                           # a job
          runs-on: ubuntu-latest        # the machine it gets
          steps:                        # run in order
            - uses: actions/checkout@v7 # fetch your code
            - run: npm ci && npm test
      ```

      Each job runs on a **runner**, a fresh machine that's thrown away afterwards.

  - type: multiple-choice
    id: pick-where-tests-run
    concept: cloud.pipelines
    difficulty: 1
    question: You push this workflow. Where does `npm test` run?
    choices:
      - text: On a fresh runner GitHub starts
        correct: true
        feedback: >-
          Right. A clean machine, so nothing from your laptop can help it pass.
      - text: On your laptop, before the push
        feedback: >-
          That's a pre-commit hook. A workflow runs after the push, on GitHub's side.
      - text: On the production server
        feedback: >-
          Nothing here touches a server. `runs-on` asks GitHub for a throwaway machine.

  - type: prose
    id: jobs-and-needs
    body: >-
      Jobs in one workflow start together, in parallel. `needs: test` makes a job wait for
      `test`, and skip if it fails.


      The build job makes one image and tags it with `${{ github.sha }}`, the commit's id. It
      pushes it to a **registry**, a store for images. Every later job deploys that exact
      image. That's **build once, deploy many**: what you tested is what you ship.

  - type: bug-hunt
    id: hunt-deploy-without-needs
    concept: cloud.pipelines
    difficulty: 2
    language: yaml
    code: |
      on:
        push:
          branches: [main]
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v7
            - run: npm ci && npm test
        deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v7
            - run: ./deploy.sh
    prompt: >-
      A push with a failing test went to production anyway. Tap the line that starts the job
      which should have waited.
    lines: [10]
    reasons:
      - text: '`deploy` has no `needs: test`, so both jobs start together'
        correct: true
        feedback: >-
          Yes. Jobs run in parallel by default. Add `needs: test` under `deploy`.
      - text: '`npm ci` should be `npm install`'
        feedback: >-
          `npm ci` is the right one for a pipeline. It installs exactly what the lockfile
          says.
      - text: The trigger should be `pull_request`, not `push`
        feedback: >-
          Deploying on a push to `main` is the point. The trouble is what the deploy waits
          for.
    verify:
      question: 'Which test of the workflow would have caught this?'
      choices:
        - text: 'Push a failing test and check `deploy` never starts'
          correct: true
          feedback: >-
            Yes. Prove a gate by sending something that must not pass.
        - text: 'Push a passing commit and check it deploys'
          feedback: >-
            That works with or without `needs`. Only a failing test shows the gate holds.
        - text: 'Run actionlint on the file'
          feedback: >-
            It checks shape. Two jobs without `needs` is a valid workflow.
    fix: |
      deploy:
        needs: test
        runs-on: ubuntu-latest

  - type: parsons
    id: order-build-and-deploy
    concept: cloud.build-once
    difficulty: 3
    language: yaml
    prompt: >-
      The `test` job exists. Add a `build` job that pushes one image tagged with the commit.
      Then a `deploy` job tells the server, over SSH, to run that image. Two lines don't
      belong.
    blocks:
      - id: build-name
        code: 'build:'
        subgoal: Build and push one image, after the tests
      - id: build-needs
        code: 'needs: test'
        indent: 1
      - id: build-runs-on
        code: 'runs-on: ubuntu-latest'
        indent: 1
      - id: build-steps
        code: 'steps:'
        indent: 1
      - id: build-checkout
        code: '- uses: actions/checkout@v7'
        indent: 2
      - id: build-image
        code: '- run: docker build -t registry.example.com/notes:${{ github.sha }} .'
        indent: 2
      - id: push-image
        code: '- run: docker push registry.example.com/notes:${{ github.sha }}'
        indent: 2
      - id: deploy-name
        code: 'deploy:'
        subgoal: Deploy that same image
      - id: deploy-needs
        code: 'needs: build'
        indent: 1
      - id: deploy-runs-on
        code: 'runs-on: ubuntu-latest'
        indent: 1
      - id: deploy-steps
        code: 'steps:'
        indent: 1
      - id: deploy-run
        code: '- run: ssh deploy@notes.example.com ./release.sh ${{ github.sha }}'
        indent: 2
    distractors:
      - id: rebuild-in-deploy
        code: '- run: docker build -t registry.example.com/notes:latest .'
        feedback: >-
          A second build may pull newer packages, so production gets an image nobody tested.
          Deploy the one `build` pushed.
      - id: needs-tests
        code: 'needs: tests'
        feedback: >-
          There's no job called `tests`. actionlint says: `job "build" needs job "tests" which
          does not exist`.

  - type: prose
    id: environments-and-secrets
    body: >-
      Most teams deploy twice: to **staging**, a private copy for a last check, then to
      production. Each copy is an **environment**, with its own settings and secrets. GitHub
      can make production wait for a named reviewer.


      Keys live in GitHub's encrypted store, never in the repository. A job reads one as
      `${{ secrets.MODEL_API_KEY }}`, and the log shows `***` in its place.

  - type: fill-blank
    id: fill-staging-then-production
    concept: cloud.environments
    difficulty: 3
    language: yaml
    prompt: >-
      Ship the image to staging first, then to production after staging succeeds. Both
      deploy the same image. Fill the gaps.
    template: |
      deploy-staging:
        needs: build
        runs-on: ubuntu-latest
        environment: {{1}}
        steps:
          - uses: actions/checkout@v7
          - run: ./deploy.sh ${{ github.sha }}
      deploy-production:
        needs: {{2}}
        runs-on: ubuntu-latest
        environment: production
        steps:
          - uses: actions/checkout@v7
          - run: ./deploy.sh {{3}}
    blanks:
      - key: '1'
        answer: staging
      - key: '2'
        answer: deploy-staging
      - key: '3'
        answer: '${{ github.sha }}'
    bank: [staging, production, build, deploy-staging, '${{ github.sha }}', latest]

  - type: ai-review
    id: review-key-in-workflow
    concept: cloud.ci-secrets
    difficulty: 3
    language: yaml
    request: The summary tests call the model API and fail in CI with a 401. Fix it.
    flawClass: security
    code: |
      on: [push, pull_request]
      jobs:
        test:
          runs-on: ubuntu-latest
          env:
            MODEL_API_KEY: sk-4f9a2c71e0b84d6a
          steps:
            - uses: actions/checkout@v7
            - run: npm ci && npm test
    prompt: >-
      The tests pass now, and actionlint finds nothing wrong. Before you merge, tap the line
      at fault.
    lines: [6]
    reasons:
      - text: The key is now readable in the repository
        correct: true
        feedback: >-
          Yes. Store it as a secret and write `${{ secrets.MODEL_API_KEY }}`. Then rotate it.
      - text: '`env` must sit inside a step, not the job'
        feedback: >-
          A job-level `env` is fine: every step sees it. The problem is the value written in
          it.
      - text: Tests should never call a real API
        feedback: >-
          Often a fake is better, but some checks need the real model. The key's hiding place
          is the flaw.
    fix: |
      env:
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

  - type: explain-back
    id: explain-fork-secrets
    concept: cloud.ci-secrets
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Your repository is public. GitHub doesn't pass your secrets to workflows run for a pull
      request from someone's fork. Why not?
    rubric:
      - A pull request from a fork runs code that a stranger wrote, including the tests and the workflow.
      - With secrets present, that code could print them in a way that escapes masking, or send them anywhere.
      - Holding them back means an outside contribution can be tested without handing over your keys.
    modelAnswer: >-
      A pull request runs the code in the pull request. From a fork, that code was written by
      someone you don't know. They can change a test to send `MODEL_API_KEY` to their own
      server. Or they print it split up, so the `***` mask misses it. So GitHub runs fork pull
      requests without your secrets. Their tests still run, and you review the code before
      anything with a key touches it.

recap:
  - Write a workflow whose jobs wait for each other with `needs`, so a failing test stops the deploy.
  - Build one image tagged with the commit, and deploy that same image to staging, then production.
  - Keep keys in the secret store, read them with `secrets.`, and never write them in the workflow.

recall:
  - id: card-pipeline-needs
    concept: cloud.pipelines
    front: In a GitHub Actions workflow, how do you make `deploy` wait for `test`?
    back: >-
      Add `needs: test` to the `deploy` job. Without it, jobs start in parallel, and a failing
      test doesn't stop the deploy.
  - id: card-build-once
    concept: cloud.build-once
    front: Why tag the image with `${{ github.sha }}` and deploy that tag everywhere?
    back: >-
      Each commit gets exactly one image. Staging and production then run the very image the
      tests passed, not a rebuild that might differ.
  - id: card-environments
    concept: cloud.environments
    front: What makes staging and production separate environments?
    back: >-
      Each has its own settings, data and secrets, and production can require a reviewer
      before a job may deploy to it.
  - id: card-ci-secret
    concept: cloud.ci-secrets
    front: Where does a CI job get a model API key from, and what does the log show?
    back: >-
      From the platform's encrypted secret store, as `${{ secrets.NAME }}`. The log prints
      `***` where the value would be.

references:
  - kind: docs
    title: Workflow syntax for GitHub Actions
    authors: GitHub
    venue: GitHub Docs
    url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
    note: '`on`, `jobs`, `runs-on`, `steps`, `needs` and `environment`, as used in this lesson.'
    primary: true
    verified: true
  - kind: docs
    title: Secrets
    authors: GitHub
    venue: GitHub Docs
    url: https://docs.github.com/en/actions/concepts/security/secrets
    note: Repository and environment secrets, redaction in logs, and required reviewers.
    primary: true
    verified: true
  - kind: docs
    title: Secrets reference
    authors: GitHub
    venue: GitHub Docs
    url: https://docs.github.com/en/actions/reference/security/secrets
    note: Why secrets are not passed to workflows triggered from a forked repository.
    verified: true
  - kind: docs
    title: actionlint
    authors: rhysd
    venue: GitHub
    url: https://github.com/rhysd/actionlint
    note: A checker for workflow files, which caught the misspelt `needs` in this lesson.
    verified: true

deepDive: >-
  Every workflow in this lesson passed actionlint 1.7.12, run as `docker run --rm -v
  "$PWD:/repo" --workdir /repo rhysd/actionlint:latest`. The broken ones failed with `job
  "deploy" needs job "tests" which does not exist in this workflow [job-needs]`. A
  misspelt `secret.MODEL_API_KEY` gave `undefined variable "secret"`. The file with the key
  pasted in passed cleanly, which is the point: a linter checks shape, not judgement.


  We did not run the workflows on GitHub. A real build job also logs in to the registry
  before it pushes, usually with a token from the secret store. `actions/checkout` was at
  v7.0.1 when we checked. Pin actions to a full commit hash if you want the same code on
  every run, since a tag like `v7` can move.


  Masking is not a guarantee. GitHub hides the exact value of a secret, but a script that
  prints it reversed or base64-encoded leaks it. Only jobs in an environment get that
  environment's secrets, and a required reviewer holds the job, secrets and all, until
  someone approves. Secrets other than `GITHUB_TOKEN` aren't passed to workflows triggered
  from a fork.


  Continuous delivery and continuous deployment are often told apart. With delivery, every
  change is ready to ship and a person presses the button. With deployment, a passing
  change ships by itself. The production reviewer in this lesson makes it delivery.
