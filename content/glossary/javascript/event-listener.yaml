term: event listener
aka: [listener, event handler, addEventListener]
short: A function you hand the browser to call each time a particular thing happens on an element.
explain: |
  Most of a page's behaviour waits for something: a click, a key press, a form being sent.
  You can't sit in a loop watching for them. Instead you give the browser a function and
  say "call this when that button is clicked".

  `addEventListener` takes the event name and the function. Your script finishes, and the
  listener stays behind, ready. The browser calls it with an event object describing what
  happened. Add the same listener twice and it runs twice. To remove one, you need the very
  same function, so an inline arrow can never be removed.
analogy: A doorbell. You don't stand at the door all day; the bell calls you when someone arrives.
example:
  language: js
  code: |
    const button = document.querySelector('#save');
    function save(event) {
      console.log('Saving', event.type);
    }
    button.addEventListener('click', save);
    button.removeEventListener('click', save);
usage: The event listener is added inside the render function, so after three renders one click saves three times.
twin:
  term: callback
  difference: A callback is any function you pass for someone else to call. An event listener is a callback the browser calls each time a named event fires on an element.
related: [callback, dom, event-loop, event-emitter]
level: 1
