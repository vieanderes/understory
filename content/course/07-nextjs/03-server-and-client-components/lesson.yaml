deepDive: >-
  **Server Components inside Client Components.** A Client Component can't import a Server
  Component, because everything it imports becomes client code. It can receive one as
  `children` or another prop: the parent Server Component renders it on the server, and the
  Client Component only decides where the finished output goes. That's how a `'use client'`
  drawer can hold server-rendered content.


  **Event handlers on Server Components.** Writing `<button onClick={...}>` in a Server
  Component fails with `Event handlers cannot be passed to Client Component props`. Move the
  button into a `'use client'` file.


  **Actions do cross.** A Server Action, a function marked `'use server'`, can be passed to a
  Client Component. What travels is a reference to it, not its code. The Server Actions lesson
  comes after the backend chapter.


  **`suppressHydrationWarning`.** For a single element whose text is expected to differ, such
  as a timestamp, this prop silences the warning one level deep. It's an escape hatch, not a
  fix.
