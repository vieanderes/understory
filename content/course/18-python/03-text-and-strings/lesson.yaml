id: python.strings
title: Text and strings
objective: Index and search text, clean it with string methods, and split it apart and join it back.
level: essential
minutes: 10
concepts: [python.string-basics, python.string-methods, python.split-and-join, python.for-loops]
prerequisites: [python.decisions-and-loops]
opening:
  text: >-
    Most of what an AI engineer handles is text: prompts, replies, lines of a file. You'll
    clean it, cut it up and stitch it back together with a handful of string methods.

steps:
  - type: prose
    id: strings-are-sequences
    body: |-
      A **string** is a piece of text. It's a sequence of characters, so you can index it
      and loop over it:

      ```python
      word = "prompt"
      word[0]          # "p"
      word[-1]         # "t", counting from the end
      len(word)        # 6
      "rom" in word    # True
      ```

      `len` is a function, not a property: Python has no `.length`. `in` asks whether one
      piece of text sits inside another, like `includes`.

  - type: multiple-choice
    id: pick-length
    concept: python.string-basics
    difficulty: 1
    question: Which line gives the number of characters in `reply`?
    choices:
      - text: '`len(reply)`'
        correct: true
        feedback: >-
          Yes. `len` works on text, lists and every other collection.
      - text: '`reply.length`'
        feedback: >-
          That's JavaScript, and old habits pick it. Python strings have no `.length`.
      - text: '`reply.len()`'
        feedback: >-
          Close, but `len` isn't a method. It's a function you hand the string to.
      - text: '`reply.count()`'
        feedback: >-
          `count` counts how often a piece of text appears, so it needs that piece.

  - type: prose
    id: string-methods
    body: |-
      A **method** is a function that belongs to a value, called with a dot. Strings have
      dozens:

      ```python
      raw = "  Where Is My Order?\n"
      clean = raw.strip()        # "Where Is My Order?"
      clean.lower()              # "where is my order?"
      clean.replace("?", "")     # "Where Is My Order"
      clean.startswith("Where")  # True
      ```

      `\n` is a line break. `strip` removes spaces and line breaks from both ends. A string
      never changes: each method returns a new one, so keep the result.

  - type: bug-hunt
    id: hunt-unsaved-strip
    concept: python.string-methods
    difficulty: 2
    language: python
    code: |
      def clean_reply(reply):
          reply.strip()
          reply.lower()
          return reply
    prompt: '`clean_reply("  YES\n")` should return `yes`. It returns the text unchanged. Tap the lines at fault.'
    lines: [2, 3]
    reasons:
      - text: The new strings are thrown away
        correct: true
        feedback: >-
          Right. Keep them: `return reply.strip().lower()` chains both methods.
      - text: '`strip` and `lower` need arguments'
        feedback: >-
          Both work with no arguments. Each returns a result, and nothing keeps it.
      - text: '`return reply` returns a copy'
        feedback: >-
          It returns the very text that came in. That text never changed.
    fix: |
      def clean_reply(reply):
          return reply.strip().lower()

  - type: prose
    id: split-and-join
    body: |-
      `split` cuts text into a **list**, Python's array. `join` glues a list of strings
      back together:

      ```python
      "tea,milk,,bread".split(",")  # ['tea', 'milk', '', 'bread']
      "a  few   words".split()      # ['a', 'few', 'words']
      ", ".join(["tea", "milk"])    # 'tea, milk'
      ```

      With no argument, `split` breaks on any run of spaces. In `join`, the separator comes
      first: the reverse of JavaScript's `items.join(", ")`. `append` adds to a list, like
      `push`.

  - type: ai-review
    id: review-join-order
    concept: python.split-and-join
    difficulty: 2
    language: python
    request: Write tags_line(tags), joining a list of tags with commas.
    flawClass: hallucinated-api
    code: |
      def tags_line(tags):
          return tags.join(", ")
    prompt: >-
      An assistant wrote this. It fails with `AttributeError: 'list' object has no attribute
      'join'`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`join` belongs to the separator, not the list'
        correct: true
        feedback: >-
          Right: `", ".join(tags)`. The assistant used JavaScript's order.
      - text: The tags must be turned into text first
        feedback: >-
          `join` takes the list as it is. It's called on the wrong value.
      - text: '`join` needs a string, not a list'
        feedback: >-
          `join` does take a list. It's the separator that has the `join` method.
    fix: |
      def tags_line(tags):
          return ", ".join(tags)

  - type: code-challenge
    id: write-normalise
    concept: python.string-methods
    difficulty: 2
    language: python
    starter: normalise.starter.py
    solution: normalise.solution.py
    tests: normalise.tests.py
    editable: '2-3'
    prompt: >-
      Two users ask the same question with different spacing and capitals. Write
      `normalise(question)` so both come out the same: lower-case, trimmed, one space
      between words.


      Example: `normalise("  What IS   a token?\n")` returns `what is a token?`.
    hints:
      - 'The methods step lowers text, and the split step deals with runs of spaces.'
      - '`split()` with no argument drops every extra space. `join` puts one back between words.'
      - 'Start from `question.lower().split()`, then join the words with `" "`.'

  - type: code-challenge
    id: write-clean-tags
    concept: python.for-loops
    difficulty: 3
    language: python
    starter: tags.starter.py
    solution: tags.solution.py
    tests: tags.tests.py
    editable: '3'
    prompt: >-
      Users type tags into a box, separated by commas. Write `clean_tags(text)`, returning
      a list of the tags: trimmed, lower-case, and with empty ones dropped.


      Example: `clean_tags(" Python, AI ,, ")` returns `["python", "ai"]`.
    hints:
      - 'The split step cuts text at each comma.'
      - 'Each piece may still have spaces and capitals. An empty piece counts as false.'
      - 'Loop with `for part in text.split(","):`, clean each part, and append it if it is not empty.'

  - type: explain-back
    id: explain-immutable-strings
    concept: python.string-methods
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why does `reply.strip()`, on a line of its own, leave `reply` exactly as it was?
    rubric:
      - A string never changes once it's made.
      - '`strip` returns a new, trimmed string.'
      - Unless you assign that result to a name, it's thrown away.
    modelAnswer: >-
      Strings can't be changed in place, so `strip` can't trim `reply` itself. It builds a
      new, trimmed string and returns it. On a line of its own, nothing keeps that result.
      `reply = reply.strip()` keeps it.

recap:
  - Index text, measure it with `len`, and search it with `in`.
  - Clean text with `strip`, `lower` and `replace`, keeping each result.
  - Cut text up with `split` and glue it back with `", ".join(...)`.
recall:
  - id: card-len
    concept: python.string-basics
    front: How do you get the number of characters in a string `s`?
    back: >-
      `len(s)`. Python has no `.length`.
  - id: card-strings-immutable
    concept: python.string-methods
    front: Why write `name = name.strip()` rather than `name.strip()`?
    back: >-
      A string never changes. `strip` returns a new one, and only the assignment keeps it.
  - id: card-split-no-arg
    concept: python.split-and-join
    front: What does `split()` with no argument do?
    back: >-
      It breaks the text on any run of spaces, tabs or line breaks, and drops the empty
      pieces.
  - id: card-join-order
    concept: python.split-and-join
    front: How do you join a list `words` into one string with a space between each?
    back: >-
      `" ".join(words)`. The separator comes first.

