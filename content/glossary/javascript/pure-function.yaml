term: pure function
short: A function whose result depends only on its inputs, and which changes nothing outside itself.
explain: |
  Give `add(2, 3)` the same numbers and you always get 5. It doesn't read the clock, call the
  network or edit its arguments.

  That makes it trivial to test and safe to run twice. React expects components and reducers
  to work this way: same props and state, same output. That's why it renders twice in
  development, to catch the ones that don't.
analogy: A calculator. Type the same sum, get the same answer, and nothing else in the room changes.
example:
  language: js
  code: |
    // pure
    const total = (items) => items.reduce((sum, i) => sum + i.price, 0);

    // not pure: it changes what it was given
    const addTax = (items) => items.forEach((i) => (i.price *= 1.2));
usage: Make the reducer a pure function and the test needs no mocks at all.
twin:
  term: side-effect
  difference: A pure function only turns inputs into an output. A side effect is anything else a function does, and one side effect is enough to make it impure.
related:
  - side-effect
  - mutation
  - immutability
  - functional-core
level: 2
