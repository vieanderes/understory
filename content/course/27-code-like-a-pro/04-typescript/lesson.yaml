    verified: true

deepDive: >-
  The `never` error in the predict step is real `tsc` output: `Type '{ status: "failed";
  error: string; }' is not assignable to type 'never'.` The fix in the review step also
  compiles under `strict`: an `in` check narrows `unknown` to an object with an `email`
  property, and `typeof` then narrows that property to a string.


  Two more pro habits. `satisfies` checks a value against a type while keeping its precise
  inferred type, which suits configuration objects. And a branded type, such as
  `string & { readonly brand: 'UserId' }`, stops a plain string, or an order id, being
  passed where a user id belongs.
