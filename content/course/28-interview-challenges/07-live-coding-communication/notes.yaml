summary: >-
  A live coding round is scored by a person watching you work, usually on four areas:
  communication, problem solving, technical competence and testing. The code is roughly a
  quarter of the marks. The rest is what the interviewer can see and hear of your thinking,
  and an interviewer cannot score what you keep in your head.


  Nerves are the main threat, because they make people skip steps: coding before the problem
  is clear, going quiet when stuck, declaring victory without testing. A fixed script removes
  those decisions. Restate the problem, work an example, state the brute force and its cost,
  improve it, agree the plan, code with clear names, test aloud, and close with the cost and
  the next extension.


  Talking is not narrating. Speak at checkpoints: the plan, what each helper is for, the start
  of testing, and any trade-off you choose. Frame silence when you need it. Treat every
  question the interviewer asks as a hint, say what it changes, and use it.
remember:
  - >-
    A live round is usually scored on communication, problem solving, technical competence and
    testing, so working code alone earns about a quarter of the marks.
  - >-
    The script: restate, example, brute force with its cost, improve, agree the plan, code,
    test aloud, then state the cost and the next extension.
  - >-
    Speak at checkpoints, not every keystroke: the plan, each helper's purpose, the start of
    testing and each trade-off.
  - >-
    Silence is fine when framed ("give me a minute to think about the invariant"); unexplained
    silence scores as no communication.
  - >-
    When stuck, say what you know, state the brute force, and try a smaller example aloud.
  - >-
    An interviewer's question is almost always a hint: acknowledge it, say what it changes, and
    use it straight away.
  - >-
    Test before anyone asks, with a normal case, a boundary and a nasty one, tracing the code
    rather than hoping.
sections:
  - title: The script with timings for a 45-minute round
    body: |-
      A 45-minute slot usually has five minutes of introductions and five for your questions
      at the end, leaving about 35 for the problem. A workable split:

      ```text
      0-4    restate, confirm inputs, outputs and limits, ask 1-3 questions
      4-7    work one small example by hand, out loud
      7-10   brute force and its cost, then the better idea and why it is faster
      10-11  "Shall I code this approach?"  wait for a yes
      11-25  code, speaking at checkpoints
      25-32  test: normal case, boundary, nasty case; fix what they find
      32-35  final time and space cost, one extension, one trade-off
      ```

      Phrases that make each checkpoint clear without narrating:

      - "Let me restate it to check I've got it: ..."
      - "I'll assume the list fits in memory and can be empty. Is that right?"
      - "The brute force tries every pair, so O(n^2). I think we can do one pass."
      - "Here's the plan: ... Does that sound reasonable before I code it?"
      - "This helper returns the first invalid field, or null."
      - "Now let me test it. First a normal case, then an empty list."
      - "It's O(n) time and O(1) space. If the data were a stream, the same idea works because
        it only keeps two numbers."

      If the round is 60 minutes, the extra time usually goes on a second part or an extension,
      not on a slower first part. Keep the same pace and expect more.
  - title: 'A worked round: best profit from one buy and one sell'
    body: |-
      This is the problem from the transcript in the lesson, played the way the script runs.

      **Restate.** "I get daily prices. I buy on one day and sell on a later day, once. I return
      the best profit, or 0 if no trade makes money. Can the list be empty?" The interviewer
      says yes.

      **Example.** "For 7, 1, 5, 3, 6, 4, buying at 1 and selling at 6 gives 5."

      **Brute force.** "Try every buy day with every later sell day: O(n^2) time, O(1) space."

      **Improve.** "For each sell day, the best buy is the cheapest price before it. If I keep
      the cheapest price seen so far as I walk the list, each day is one comparison. That's
      O(n)."

      **Agree, then code.**

      ```js
      // Best profit from one buy followed by one later sell. 0 if prices only fall.
      function maxProfit(prices) {
        let cheapest = Infinity; // lowest price seen so far: the best day to have bought
        let best = 0;
        for (const price of prices) {
          cheapest = Math.min(cheapest, price);
          best = Math.max(best, price - cheapest);
        }
        return best;
      }

      console.log(maxProfit([7, 1, 5, 3, 6, 4])); // 5: buy at 1, sell at 6
      console.log(maxProfit([9, 7, 4, 1]));       // 0: prices only fall
      console.log(maxProfit([]));                 // 0: no days
      console.log(maxProfit([3]));                // 0: one day, no later sell
      ```

      **Test aloud.** Trace the example: cheapest goes 7, 1, 1, 1, 1, 1 and best goes 0, 0, 4,
      4, 5, 5. Then the falling list, where best never leaves 0. Then the empty list, where the
      loop never runs.

      **Close.** "O(n) time, O(1) space. Updating cheapest before best means a same-day buy and
      sell gives 0, which is harmless. If you allowed many trades, I'd add every rising step
      instead."
  - title: Taking hints and recovering from mistakes
    body: |-
      Hints are part of the scoring. Needing none is the top band, but taking one well scores
      far better than missing it. Interviewers phrase hints as questions: "What if the input
      were sorted?", "What do you know after the first pass?", "Is there anything you could
      keep track of as you go?". A good response has three beats:

      1. **Acknowledge it**: "That's a good point."
      2. **Say what it changes**: "If I keep the cheapest price so far, I don't need the inner
         loop."
      3. **Use it now**, and update the plan aloud.

      Mistakes are also scored, and how you handle one can raise the mark. When you or the
      interviewer find a bug, stay calm and name it precisely: "The loop stops one early, so
      the last item is skipped. I'll change the bound." Then rerun the case that exposed it.
      Blaming the tool, rushing a patch without explanation, or arguing about whether it is
      really a bug all cost more than the bug did.

      If you realise the whole approach is wrong, say so early: "This greedy choice fails on
      3, 1, 2. I want to switch to a sort-first approach, which I think is O(n log n)." A
      clear change of direction with a reason is a problem-solving signal, not a failure.
  - title: What moves a round from good to senior
    body: |-
      The published rubrics describe the same four areas at every level. What changes at the
      senior bar is how much the candidate drives.

      - **Clarity from vagueness.** You turn an unclear requirement into a stated assumption
        before anyone points it out.
      - **Edge cases unprompted.** Empty input, duplicates, overflow and concurrency come up in
        your restatement, not in the interviewer's follow-up.
      - **Trade-offs as a default plus a condition.** "I'll use a `Map` here. If memory were
        tight and keys were small integers, an array would do."
      - **Code that extends.** Names and structure that make the next requirement a small
        change. The closing line names that extension.
      - **Testing as a habit.** You test before being asked and pick cases for a reason.

      With an assistant in the room, the same script holds with two additions: say your plan
      before you prompt, so the interviewer can see the judgement is yours, and read and test
      every suggestion before you rely on it.
pitfalls:
  - >-
    **Coding before the problem is clear.** A wrong start costs the most time. Restate, confirm
    the limits and work one example before typing.
  - >-
    **Narrating every keystroke.** It drowns the useful signals. Speak at checkpoints: the plan,
    a helper's purpose, the start of testing.
  - >-
    **Going silent when stuck.** The interviewer cannot help what they cannot see. Say what you
    know, state the brute force and try a smaller case aloud.
  - >-
    **Brushing off a hint.** Finishing your own plan first ignores information the interviewer
    gave you on purpose. Acknowledge it, say what it changes and use it.
  - >-
    **Saying "it should work".** It invites the interviewer to find the bug. Trace a normal case,
    a boundary and a nasty case yourself.
  - >-
    **Optimising before it is correct.** An untested optimisation stacks risk on risk. Get a
    correct version, test it, then improve it if time allows.
interview:
  - question: >-
      Can you do better than O(n^2)?
    answer: >-
      I first ask what work the inner loop repeats. In a pairs problem, the inner loop usually
      recomputes something the outer loop could carry forward: the cheapest price so far, a
      running sum, or a set of values seen. Carrying it forward turns each step into O(1), so
      the whole thing is O(n). If ordering helps, sorting first gives O(n log n) and opens up
      two pointers or binary search. I say which one I am choosing and why, for example
      "one pass with a running minimum, O(n) time and O(1) space". The trade-off is that the
      faster version is easier to get subtly wrong, so I keep the brute force in mind as a
      reference for testing.
  - question: >-
      How would you test this?
    answer: >-
      With three kinds of case, chosen on purpose. A normal case from the example, traced
      line by line so I check the logic and not only the output. A boundary: empty input, one
      element, or the largest allowed size. And a nasty case aimed at the idea: all equal
      values, strictly decreasing values, or duplicates of the answer. For each I say the
      expected result before I trace. If the environment runs code, I also turn these into
      asserts. If this were production code, I would add a property test comparing against
      the brute force on random inputs. The trade-off in a round is time, so I pick the cases
      most likely to break this particular idea.
  - question: >-
      What would you change if the input were a stream too large to hold in memory?
    answer: >-
      It depends on how much state the algorithm needs, so I check that first. The running
      minimum solution keeps two numbers, so it works on a stream unchanged: read each price,
      update the state, discard the price. A solution that sorts or stores every value does
      not, and would need a different approach, such as an approximate structure, external
      sorting, or processing in chunks and merging. I would also ask whether the answer is
      needed once at the end or continuously, since continuous answers change the design. The
      general point is that algorithms with O(1) or small state stream naturally.
  - question: >-
      You have gone quiet. What are you thinking about?
    answer: >-
      I would answer directly with what I know and where I am stuck, because that lets the
      interviewer help. For example: "I have the brute force, which is O(n^2). I think the
      cheapest earlier price is the key, but I'm checking whether I need the index too. Let me
      try it on a three-day example." Then I work the small case out loud. Framing the silence
      turns it into a checkpoint. What I avoid is saying "nothing" or continuing silently,
      which scores as no communication even if I am making progress.
terms:
  - term: Think aloud
    say: Narrate every keystroke.
    means: 'Speak at checkpoints: the plan, what each helper is for, the start of testing and
      each trade-off. Silence you announce ("give me a minute on the invariant") is fine.'
  - term: Brute force
    say: The naive answer you should skip.
    means: The simplest correct solution, stated with its cost before you improve it. It proves
      you understand the problem and is a fallback you can code if time runs short.
  - term: Time complexity
    say: How fast the code runs.
    means: How the number of steps grows as the input grows, written in big O with constant
      factors dropped. It says nothing about seconds on a given machine.
  - term: Edge case
    say: A weird input nobody sends.
    means: An input at the boundary of what is valid, such as empty, one item, duplicates or the
      largest size. Off-by-one and null bugs hide there, so you test one before anyone asks.
  - term: Hint
    say: A sign you are failing the round.
    means: A question from the interviewer that points somewhere useful. Acknowledging it,
      saying what it changes and using it straight away scores well.
  - term: Dry run
    say: Running the code to see if it works.
    means: Tracing the code by hand on a concrete input, saying each variable's value line by
      line. It is how you test when there is no runner, and it shows the interviewer your
      reasoning.
