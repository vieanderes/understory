    note: Why a condition in `ON` and the same condition in `WHERE` differ for an outer join.
    verified: true

deepDive: >-
  There's a mirror image, `RIGHT JOIN`, which keeps every row of the right table. Most people
  swap the tables and use `LEFT JOIN` so every query reads the same way. `FULL JOIN` keeps
  unmatched rows from both sides.


  `DISTINCT` hides repeats after the fact. When you only need to know whether a match exists,
  `WHERE EXISTS (SELECT 1 FROM pets WHERE pets.owner_id = owners.id AND pets.species = 'cat')`
  asks exactly that, and never makes the repeats in the first place.


  Postgres chooses how to run a join: loop over one side and look up the other, build a hash
  table, or walk two sorted lists. The reading `EXPLAIN` lesson shows you where to see which.
