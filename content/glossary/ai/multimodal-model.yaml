term: multimodal model
aka: [multimodal, vision model, vision-language model]
short: A model that takes more than text as input, such as images, audio or PDF pages.
explain: |
  Early language models only read text. A model that can also look at a picture can read a
  scanned form, a chart or a photo of a receipt directly.

  For documents it keeps what OCR often loses: which label sits next to which value, and
  where the table columns are. It costs more per page than reading a text layer, so use it
  where the page is only pixels.
analogy: A colleague you can show the paper to, instead of reading it out to them over the phone.
usage: Send the photographed delivery notes to the multimodal model; the OCR keeps mixing up the columns.
related: [ocr, token, structured-output]
level: 2
lessons: [aisys.reading-documents]
