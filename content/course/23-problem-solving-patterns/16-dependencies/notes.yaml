summary: >-
  A topological sort puts the nodes of a directed graph in a line so that every edge points
  forwards. When the nodes are jobs and an edge means "must finish before", that line is a
  valid run order. It exists exactly when the graph has no cycle, which makes the same
  algorithm a cycle detector too.


  Reach for it when a statement says "depends on", "prerequisite", "requires", "must run
  before", "build order", "install order" or "can all courses be finished". Items that name
  other items are the tell: migrations that list earlier migrations, packages that list
  packages, spreadsheet cells that refer to cells. The follow-ups are predictable: return
  null on a cycle, name the cycle, group jobs into parallel stages, compute the earliest
  finish time, or break ties in alphabetical order.


  Kahn's algorithm is the version to write under time pressure. It counts each node's unmet
  dependencies, queues the ones at zero, and releases the rest as their counts fall, in
  O(V + E) with no recursion. For undirected questions such as "are these two in the same
  group" or "which link closes a loop", use union-find instead: it answers connectivity as
  links arrive, in close to constant time per operation.
remember:
  - A topological order lists every node so each edge goes from earlier to later, and one exists only if there is no cycle.
  - Kahn's algorithm queues nodes with in-degree zero, and each node it removes lowers the in-degree of the nodes it unlocks.
  - If fewer nodes come out than went in, the leftover nodes are on a cycle or wait behind one.
  - Kahn's algorithm is O(V + E) time and space, with a head index instead of `shift()` so the queue stays O(1) per step.
  - Normalise every dependency to `[before, after]` before building the graph, because statements disagree on direction.
  - The earliest finish time of a job is its duration plus the latest finish among its dependencies, computed in topological order.
  - Depth-first search finds a cycle by meeting a node that is still on the current path.
  - Union-find answers undirected connectivity and detects a link that closes a loop, but it cannot handle directed dependencies.
sections:
  - title: The Kahn template with numbered nodes
    body: |-
      Most timed-test versions number the nodes 0 to n - 1 and give edges as pairs. Arrays
      beat maps there, and the queue can double as the answer: nodes enter it in a valid
      order, so reading it with a head index builds the result for free.

      ```js
      // edges are [before, after]. Returns an order, or null when a cycle blocks it.
      function topoOrder(n, edges) {
        const indegree = new Array(n).fill(0);
        const unlocks = Array.from({ length: n }, () => []);
        for (const [before, after] of edges) {
          unlocks[before].push(after);
          indegree[after]++;
        }
        const queue = [];
        for (let v = 0; v < n; v++) if (indegree[v] === 0) queue.push(v);
        for (let head = 0; head < queue.length; head++) {
          for (const next of unlocks[queue[head]]) {
            indegree[next]--;
            if (indegree[next] === 0) queue.push(next);
          }
        }
        return queue.length === n ? queue : null;
      }

      console.log(topoOrder(4, [[0, 1], [0, 2], [1, 3], [2, 3]])); // [0, 1, 2, 3]
      console.log(topoOrder(3, [[0, 1], [1, 2], [2, 1]])); // null
      console.log(topoOrder(2, [[1, 1]])); // null
      console.log(topoOrder(0, [])); // []
      console.log(topoOrder(3, [])); // [0, 1, 2]
      ```

      Time is O(V + E): each node enters the queue at most once and each edge is followed
      once. Space is O(V + E) for the adjacency lists. The "can every course be finished"
      question is the same function returning `topoOrder(n, edges) !== null`. Watch the
      direction there: in the common phrasing, the pair `[a, b]` means "to take a you must
      first take b", which is the edge `[b, a]` in this template. Flip the pairs once when
      building the graph, and say so aloud.
  - title: Earliest finish times, the critical path
    body: |-
      A CI follow-up gives every job a duration and asks how long the whole pipeline takes
      with unlimited parallel runners. A job can start when its last dependency finishes,
      so its start time is the largest finish time among the jobs that unlock it. Processing
      jobs in Kahn's order guarantees every dependency is final before it is used.

      ```js
      function earliestFinish(durations, edges) {
        const n = durations.length;
        const indegree = new Array(n).fill(0);
        const unlocks = Array.from({ length: n }, () => []);
        for (const [before, after] of edges) {
          unlocks[before].push(after);
          indegree[after]++;
        }
        const start = new Array(n).fill(0);
        const queue = [];
        for (let v = 0; v < n; v++) if (indegree[v] === 0) queue.push(v);
        let total = 0;
        for (let head = 0; head < queue.length; head++) {
          const job = queue[head];
          const finish = start[job] + durations[job];
          total = Math.max(total, finish);
          for (const next of unlocks[job]) {
            start[next] = Math.max(start[next], finish);
            indegree[next]--;
            if (indegree[next] === 0) queue.push(next);
          }
        }
        return queue.length === n ? total : null;
      }

      // install 3, build 2 and lint 4 both after install, test 1 after both.
      console.log(earliestFinish([3, 2, 4, 1], [[0, 1], [0, 2], [1, 3], [2, 3]])); // 8
      console.log(earliestFinish([5, 5], [])); // 5
      console.log(earliestFinish([1, 1], [[0, 1], [1, 0]])); // null
      console.log(earliestFinish([], [])); // 0
      ```

      Time and space are O(V + E). The longest chain of durations, here install, lint, test,
      is the **critical path**: speeding up any job off it changes nothing. This is dynamic
      programming on a DAG, and the topological order is what makes it valid, since each
      state only reads states that are already complete. With a limited number of runners
      the problem becomes much harder, so ask before promising an exact answer.
  - title: Naming the cycle
    body: |-
      Returning null tells a user the plan is broken. Printing `migrate -> seed -> migrate`
      tells them how to fix it. Kahn's leftovers include nodes that only wait behind a cycle,
      so to name the cycle itself, use depth-first search with three states: unvisited, on
      the current path, and finished. An edge to a node on the current path closes a cycle,
      and parent links rebuild it. An explicit stack keeps deep chains from overflowing.

      ```js
      function findCycle(n, edges) {
        const unlocks = Array.from({ length: n }, () => []);
        for (const [before, after] of edges) unlocks[before].push(after);
        const state = new Uint8Array(n); // 0 unvisited, 1 on the path, 2 finished
        const parent = new Int32Array(n).fill(-1);
        for (let root = 0; root < n; root++) {
          if (state[root] !== 0) continue;
          state[root] = 1;
          const stack = [[root, 0]];
          while (stack.length > 0) {
            const frame = stack[stack.length - 1];
            const [node, i] = frame;
            if (i === unlocks[node].length) {
              state[node] = 2;
              stack.pop();
              continue;
            }
            frame[1]++;
            const next = unlocks[node][i];
            if (state[next] === 0) {
              state[next] = 1;
              parent[next] = node;
              stack.push([next, 0]);
            } else if (state[next] === 1) {
              const path = [];
              for (let x = node; x !== next; x = parent[x]) path.push(x);
              return [next, ...path.reverse(), next];
            }
          }
        }
        return null;
      }

      console.log(findCycle(4, [[0, 1], [1, 2], [2, 3], [3, 1]])); // [1, 2, 3, 1]
      console.log(findCycle(1, [[0, 0]])); // [0, 0]
      console.log(findCycle(3, [[0, 1], [0, 2], [1, 2]])); // null
      ```

      Time and space are O(V + E). A finished node (state 2) is safe to reach again: its
      whole subtree was explored without finding a way back, so a second path into it is a
      diamond, not a loop. Treating "visited" as "cycle" is the classic bug here; the test
      with edges `0 -> 1`, `0 -> 2`, `1 -> 2` catches it.
  - title: Union-find for undirected groups
    body: |-
      Some dependency questions have no direction: which accounts share an email, which
      servers can reach each other, which new cable would create a loop. Union-find keeps
      each group as a tree whose root names it. Joining hangs the smaller tree under the
      larger, and finding a root halves the path as it climbs, a form of path compression.
      Together they make each operation close to constant time.

      ```js
      class UnionFind {
        constructor(n) {
          this.parent = Array.from({ length: n }, (_, i) => i);
          this.size = new Array(n).fill(1);
          this.groups = n;
        }
        find(x) {
          while (this.parent[x] !== x) {
            this.parent[x] = this.parent[this.parent[x]]; // path halving
            x = this.parent[x];
          }
          return x;
        }
        union(a, b) {
          let ra = this.find(a);
          let rb = this.find(b);
          if (ra === rb) return false; // already connected: this link closes a loop
          if (this.size[ra] < this.size[rb]) [ra, rb] = [rb, ra];
          this.parent[rb] = ra;
          this.size[ra] += this.size[rb];
          this.groups--;
          return true;
        }
      }

      // The first cable that joins two already-connected servers.
      function redundantLink(n, links) {
        const uf = new UnionFind(n);
        for (const [a, b] of links) if (!uf.union(a, b)) return [a, b];
        return null;
      }

      console.log(redundantLink(4, [[0, 1], [1, 2], [2, 3], [3, 1]])); // [3, 1]
      console.log(redundantLink(3, [[0, 1], [1, 2]])); // null
      const uf = new UnionFind(5);
      uf.union(0, 1);
      uf.union(3, 4);
      console.log(uf.groups); // 3
      ```

      With both tricks, m operations on n items cost O(m α(n)), where α is the inverse
      Ackermann function, below 5 for any input that fits in memory. Space is O(n). The
      limits: it cannot remove a link, and it ignores direction, so `a` needing `b` and `b`
      needing `a` look like one harmless group. For directed dependencies, stay with Kahn.
  - title: Explaining it aloud, from brute force up
    body: |-
      A natural brute force is to scan all jobs repeatedly, running any whose dependencies
      are done, until a full scan changes nothing. With a chain of n jobs listed in reverse,
      each scan releases one job, so it is O(n × (V + E)): too slow at 200,000. Saying that,
      then the fix, is a clean narration.

      1. "I'll normalise the input to `[before, after]` edges and build an adjacency list
         plus an in-degree count for every job."
      2. "Rescanning for ready jobs is the waste. Instead, a job becomes ready at the moment
         its count hits zero, so I queue it right then."
      3. "Each job is dequeued once and each edge decremented once: O(V + E)."
      4. "If the output is shorter than the job list, the rest can never reach zero, so
         there's a cycle and I return null."
      5. "Tests: no jobs, no edges, a self-loop, a diamond, a cycle that only some jobs sit
         behind, and a long chain for the running time."

      Then ask the questions that change the code: can a dependency name a job that is not
      in the list, should ties follow the input order or alphabetical order, and does the
      caller want one order, the parallel stages, or the cycle itself?
pitfalls:
  - "**Returning a partial order.** A cycle leaves jobs out of the queue, and returning the queue as it stands looks like success. Compare its length with the number of jobs and return null when they differ."
  - "**Getting the edge direction backwards.** \"a requires b\" is the edge b to a. Reversing it produces an order that runs everything backwards and still looks valid on a symmetric example. Normalise once, and test with a two-job chain."
  - "**Using `shift()` as the queue.** Each call moves every remaining item, so the loop becomes O(V²). Read by a head index, or push into a fresh array per stage."
  - "**Treating any visited node as a cycle in DFS.** A node reached twice through a diamond is fine. Only a node still on the current path closes a cycle, which is why DFS needs three states, not two."
  - "**Recursive DFS on a long chain.** A chain of 100,000 jobs means 100,000 nested calls, past the default Node stack. Use Kahn's queue or an explicit stack."
  - "**Dependencies on unknown jobs.** An edge that names a job missing from the list crashes on `undefined` or silently ignores the requirement. Decide with the interviewer whether that is an error or an implicit job, and handle it before building the graph."
  - "**Union-find for directed dependencies.** It sees `a` needs `b` and `b` needs `a` as one connected group and reports nothing wrong. Use it only for undirected questions."
verify:
  - lens: breaks
    check: An order shorter than the job list is reported as a cycle, never returned as a plan.
  - lens: breaks
    check: Dependencies that name unknown jobs are rejected or reported, not silently skipped.
  - lens: scales
    check: The queue is read with a head index and any DFS uses an explicit stack, so long chains stay linear and never overflow.
  - lens: confuses
    check: The edge direction is fixed in one place, so "a needs b" always means b runs first.
  - lens: tests
    check: Tests include a two-job cycle, a diamond that reaches one job twice, and a job with no dependencies.
interview:
  - question: How would you order a set of tasks with dependencies, and detect when it's impossible?
    answer: >-
      With Kahn's algorithm, which gives an order in O(V + E) and detects a cycle for free.
      I build an adjacency list from each task to the tasks it unlocks, plus a count of
      unmet dependencies per task. Tasks at zero go into a queue. I repeatedly take one,
      append it to the output and lower the count of everything it unlocks, queueing any
      that reach zero. If the output ends up shorter than the task list, the remaining tasks
      each wait on another remaining task, so following those waits must loop: a cycle, and
      I return null or raise an error. The trade-off against depth-first search is that Kahn
      needs no recursion, but it does not name the cycle; if the user needs that, I run a DFS
      with three states over the leftover tasks.
  - question: Kahn's algorithm or DFS for a topological sort?
    answer: >-
      Kahn by default, DFS when I need the cycle itself or a post-order anyway. Both are
      O(V + E). Kahn uses a queue, so it cannot overflow the stack on a long chain, it
      detects a cycle by comparing counts, and it produces stages naturally, which maps onto
      running independent jobs in parallel. DFS appends each node after all its descendants
      finish and reverses the list; it detects a cycle when it meets a node still on the
      current path, and parent links can print that exact loop. The risk with DFS in
      JavaScript is recursion depth: a 100,000-job chain overflows the default stack unless I
      write it with an explicit stack, which makes it longer than Kahn.
  - question: The interviewer wants the alphabetically smallest valid order. What changes?
    answer: >-
      Replace the queue with a min-heap, so among all ready tasks the smallest always goes
      next. That is correct because Kahn allows any ready task at each step; choosing the
      smallest at every step yields the lexicographically smallest order. The cost rises from
      O(V + E) to O((V + E) log V), since every task passes through the heap once. Sorting
      the initial queue is not enough, because tasks released later may be smaller than
      tasks already waiting. If the question is stages rather than a single order, I keep
      the level-by-level loop and sort each stage instead, which is cheaper and matches how
      parallel runners behave.
  - question: How would you find which new link creates a loop in a network of servers?
    answer: >-
      Union-find: process links in order, and the first link whose two ends already share a
      root is the one that closes a loop. Each server starts as its own group. For every
      link I find both roots; if they differ I merge the smaller group into the larger, and
      if they match the servers were already connected, so this link is redundant. With union
      by size and path compression each operation is effectively constant time, so m links
      cost about O(m). This works because the network is undirected. For directed
      dependencies union-find is the wrong tool, since a two-way dependency looks like a
      normal group; there I would use Kahn or a three-state DFS.
