term: information hiding
short: Keeping a design decision that might change inside one module, behind a surface that won't.
explain: |
  Will orders live in one table or three? Will prices come from a file or a service? Pick one,
  then hide it. Callers ask `getPrice(item)` and never learn how it's answered.

  When the decision changes, only that module changes. The skill is spotting which decisions
  are likely to change, and putting a wall around each one.
analogy: A restaurant kitchen behind a hatch. Diners order from the menu, and whether the chef swaps the oven never reaches them.
usage: The callers read the cache keys directly, so there's no information hiding and a new key format breaks them all.
related:
