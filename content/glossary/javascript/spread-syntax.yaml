term: spread syntax
aka:
  - spread operator
  - spread
short: Three dots that pour the items of an array or object into a new array, object or call.
explain: |
  `[...cart, item]` makes a new array with everything in `cart` plus one more.
  `{ ...user, plan: 'pro' }` copies the object and overrides one field. `Math.max(...prices)`
  passes each price as its own argument.

  The copy is shallow. Nested objects are shared, not copied, so editing
  `copy.address.city` changes the original's address too.
analogy: Tipping a box of toys into a bigger box. The toys move across, but a bag inside a toy is still the same bag.
example:
  language: js
  code: |
    const cart = ['tea'];
    const next = [...cart, 'milk'];

    const user = { name: 'Sam', plan: 'free' };
    const upgraded = { ...user, plan: 'pro' };
usage: Spread the old settings first and the new field after, or the old value wins.
twin:
  term: rest-parameters
  difference: Same three dots, opposite jobs. Spread unpacks a collection into separate items; rest gathers separate items into one array.
related:
  - destructuring
  - shallow-copy
  - immutability
level: 1
lessons:
  - js.destructuring-and-spread
