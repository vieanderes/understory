summary: |-
  A take-home is a small project you build alone, usually meant to take three to eight hours, then hand in for a reviewer to run and often discuss with you on a call. For AI roles the brief is most often a chatbot over documents that cites sources and says when it doesn't know, with extraction pipelines and small agents close behind.

  The reviewer's time is short, and they go in a fixed order: README, run from a fresh clone, run the tests, try to break it, and only then read the core code. So the marks sit in places candidates neglect: setup that works first time, a README that states assumptions and trade-offs, graceful unhappy paths, and evidence of quality you can rerun.

  Keep to the stated time, disclose how you used AI, and list what you'd do next. These notes give a complete playbook from the first read of the brief to the follow-up call, what an ideal submission contains file by file, a runnable eval gate, and model answers to the follow-up questions reviewers ask.
remember:
  - The reviewer reads the README, runs it from a fresh clone, runs the tests and tries to break it before reading any code, so spend effort in that order.
  - A submission that doesn't start from one documented command often gets little further review, however good the code is.
  - For a documents chatbot, the classic unhappy path is a question the documents can't answer, and the right behaviour is a clear "I don't have that information".
  - Evidence of quality is a small set of test questions with known answers, a score, and one command to rerun them, never "it looked right".
  - Keep near the stated time budget, because reviewers judge against it and extra features read as weak scoping.
  - Ask before starting how long it should take and whether AI tools are allowed, then disclose how you used them in the README.
  - The follow-up call usually changes the brief, such as ten times the documents or two tenants, and wants reasoning about what breaks first more than code.
sections:
  - title: The playbook, from brief to hand-in
    body: |-
      **Before you start.** Reply to the recruiter with three questions: roughly how long should it take, are AI tools allowed, and is there anything they particularly want to see. Note the answers in your README later.

      **The first twenty minutes.** Read the brief twice. Write down the must-haves (usually three), your assumptions, and what you'll deliberately leave out. If the brief is ambiguous, pick a sensible reading and write it down; don't stall.

      **A thin slice first.** Get one path working end to end before any polish: load a document, ask a question, get an answer with a citation. Commit. A working thin slice is your insurance if time runs out.

      **The core, then the edges.** Build the happy path properly, committing in small, well-named steps. Then the unhappy paths: empty upload, huge file, unsupported type, a question the documents don't cover, the model API failing or timing out.

      **Evidence.** Tests on the core logic (chunking, the relevance threshold, citation formatting), and a small eval set with a command to run it.

      **The README.** Write it in the last hour, but budget for it from the start: it's the first thing read.

      **The final check.** Clone your repository into a new folder, follow your own README exactly, and run everything. Check that no secret is committed, including in history.

      Stop adding features with about twenty minutes left. Rehearse the two-minute walkthrough you'd give on a call.
  - title: What an ideal submission contains
    body: |-
      A reviewer should find everything in the obvious place.

      ```text
      README.md          what, how to run, assumptions, design, trade-offs, next steps
      .env.example       every variable, with placeholder values
      Makefile           make run, make test, make eval
      src/               loading, chunking, retrieval, answering, the API
      tests/             unit tests for the core logic
      evals/golden.json  20 to 50 questions with expected content, some unanswerable
      evals/run.py       scores the set and fails below a threshold
      ```

      The README, in this order:

      - **What it does**, in two sentences, and a screenshot or sample output.
      - **How to run**: copy `.env.example`, add a key, one command. State the language version.
      - **Assumptions**: English only, up to 500 pages, PDFs with a text layer.
      - **Design**: a small diagram, and two or three decisions each with the option you rejected. "Search runs in memory with cosine similarity: fine for 500 pages; at 50,000 I'd use a vector index."
      - **Quality**: "18 of 20 golden questions pass; the two failures are tables in scanned pages." Honest failures build trust.
      - **Limits and next steps**, in priority order.
      - **How I used AI**: which parts a tool drafted, what you wrote or rewrote, how you checked it.
      - **Time spent**, honestly.

      Commits tell a story too: a reviewer skimming the log should see the thin slice, then the core, then the edges. One giant commit hides your process.
  - title: A minimal eval gate you can ship
    body: |-
      The strongest single signal in an AI take-home is an eval set that runs with one command. It needn't be clever. Check that each answer contains the content it must, and include questions the documents can't answer.

      ```python
      """make eval: run the golden questions and fail the build below a threshold."""

      GOLDEN = [
          {"q": "How long is the return window?", "must_include": "30 days"},
          {"q": "Do you ship to Norway?", "must_include": "Norway"},
          {"q": "What is the CEO's favourite colour?", "must_include": "don't have that information"},
      ]


      def run(answer, threshold=0.9):
          failures = [g["q"] for g in GOLDEN if g["must_include"].lower() not in answer(g["q"]).lower()]
          score = 1 - len(failures) / len(GOLDEN)
          print(f"{len(GOLDEN) - len(failures)}/{len(GOLDEN)} passed")
          for q in failures:
              print("FAIL:", q)
          return score >= threshold


      def fake_answer(question):
          canned = {
              "How long is the return window?": "You can return items within 30 days.",
              "Do you ship to Norway?": "Yes, we ship to Norway in 3 to 5 days.",
          }
          return canned.get(question, "Blue, probably.")


      print("gate passed:", run(fake_answer))
      ```

      Run as is, it prints `2/3 passed`, flags the unanswerable question, and reports `gate passed: False`: the fake assistant invented a colour. In your submission, `answer` calls your real pipeline.

      Say its limits in the README: substring checks miss paraphrases and can pass a wrong answer that happens to contain the phrase. The next step is scoring retrieval separately (did the right passage come back?) and spot-checking answers by hand.
  - title: The follow-up call
    body: |-
      The call usually runs: a short walkthrough by you, questions on your decisions, then a change to the brief. Prepare all three.

      **The walkthrough, in about five minutes.** The problem and what success meant. Your scoping call. The diagram and two or three decisions with the rejected option. A live demo of one realistic question and one unanswerable one. The eval score and known gaps. What you'd do next.

      **Decision questions.** Why this chunk size? Why this similarity threshold? Why no framework? Have the reason and the evidence: "I tried 300 and 800 tokens; 500 gave the best retrieval hits on the golden set."

      **The changed brief.** Common ones, with what to say first:

      - *Ten thousand documents.* In-memory search and re-embedding on start-up break first; move to a persistent vector index, embed once at ingestion, and batch it.
      - *Two teams must not see each other's files.* Filter by tenant inside the retrieval query, never after, and key any cache by tenant; test it with a question only the other tenant's files answer.
      - *Answers must stream.* Server-sent events from the API, with the citation sent at the end or as a final event; handle the client disconnecting.
      - *Cost must halve.* Measure where tokens go; trim context, route simple questions to a smaller model, cache repeated questions per tenant.

      Name what breaks first, then what you'd change, then how you'd verify it. Code is rarely expected on the call.
pitfalls:
  - >-
    **Setup that fails on a clean machine.** A missing variable or an undeclared dependency
    stops the review cold. Clone into a new folder and follow your own README before you
    hand in.
  - >-
    **Twenty hours for a four-hour brief.** Reviewers judge against the stated budget. Extra
    features read as weak scoping, and they're where time went that the core needed.
  - >-
    **No answer for the unanswerable question.** A model given unrelated passages answers
    anyway. Add a relevance threshold and a clear "I don't have that information".
  - >-
    **"Answers looked right."** That's an impression, not evidence. Ship a small golden set
    with a score and a command to rerun it.
  - >-
    **A committed API key.** It's an immediate red flag, even in an old commit. Use
    `.env.example`, and check the history before you push.
  - >-
    **Unable to explain generated code.** If a tool wrote it and you can't walk through it
    on the call, it counts against you. Read everything you keep.
  - >-
    **Hiding the gaps.** Reviewers find them anyway. Listing known failures and next steps
    shows judgement and honesty.
interview:
  - question: Walk me through your submission.
    answer: |-
      **What they're really asking:** did you scope on purpose, can you defend each decision, and do you know where it falls short?

      **How to answer:** in this order. The problem in a sentence, as the brief framed it. Your scoping call: the two or three must-haves you chose for the time budget, and why. The key decisions, each with the option you rejected and when you'd switch, such as in-memory search until the corpus grows past a stated size. The evidence: how many eval questions pass and why the failures fail. Then demo one normal case and one the system should refuse, and invite their hardest question.

      **Avoid** a file-by-file tour of the code, and hiding the failures; honest failures with a cause build trust.
  - question: What would break first if we had a hundred times more documents?
    answer: >-
      "Ingestion and search, in that order." At a hundred times the size, embedding every
      document at start-up takes too long, and a linear scan over every chunk per question
      gets slow and memory-hungry. I'd move embedding into an ingestion step that runs once
      per document and stores vectors in a persistent index with approximate nearest-neighbour
      search. I'd also re-check retrieval quality, since more documents means more
      near-duplicates competing for the top results, so I'd grow the golden set and maybe add
      a reranking step. The trade-off: an approximate index can miss the true nearest
      neighbour occasionally, which the eval set would show.
  - question: How did you use AI tools on this, and how did you check the output?
    answer: |-
      **What they're really asking:** were you honest, and can you explain every line you handed in?

      **How to answer:** match what your README says. Name what you handed to the tool (scaffolding, a loader, a first test file) and what you wrote yourself, which should be the decisions the brief is really about. Say how you checked the generated parts, and give one thing your checks caught and how you fixed it. If tools weren't allowed, say you didn't use them.

      **Avoid** vagueness ("I used it a bit"), and any answer that differs from the README.
  - question: How would you make sure one customer can never see another customer's documents?
    answer: >-
      "Enforce the tenant inside retrieval, and test it as a security property." Every chunk
      stores its tenant ID, and the search query filters on the caller's tenant, taken from
      their authenticated session, never from the request body. Filtering after retrieval is
      wrong: the top results could all belong to another tenant, and a bug could leak them.
      Any cache of answers is keyed by tenant too. Then I'd add a test that asks a question
      only the other tenant's documents can answer and asserts a refusal. For stricter
      isolation, separate indexes per tenant cost more to run but make a cross-tenant leak
      much harder.
  - question: What did you leave out, and why?
    answer: |-
      **What they're really asking:** did you prioritise, or did you run out of time?

      **How to answer:** name the cuts in priority order, each with its reason. Say which cut you'd reverse first and why, such as streaming, because users notice slow answers, but correct answers mattered more for this brief. Say which cuts were never asked for. Then connect any known failure to a cut, and what you'd do with another day, including rerunning the eval.

      **Avoid** "I ran out of time" with no priorities behind it, and pretending nothing was cut.
