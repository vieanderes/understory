term: form
aka: [HTML form, web form]
short: A page section that collects what people enter and sends it to a server.
explain: |
  Search boxes, sign-ups and checkouts are all forms. The `form` element wraps the fields,
  and a button inside sends them. Each field with a `name` becomes one pair in what's sent,
  such as `q=pancakes`.

  It works with no JavaScript at all. `method="get"` puts the data in the address, which
  suits a search. `method="post"` sends it inside the request, for anything that changes
  data. A button inside submits it unless it has `type="button"`.
analogy: A paper form at the post office. Each box has a label, and the whole sheet goes over the counter together.
example:
  language: html
  code: |
    <form action="/search" method="get">
      <label for="q">Search recipes</label>
      <input id="q" name="q" type="search">
      <button>Search</button>
    </form>
usage: The form sends nothing for that field, because the input has no name attribute.
related: [form-label, native-form-validation, button, http-method, query-string]
level: 1
lessons: [html.forms]
