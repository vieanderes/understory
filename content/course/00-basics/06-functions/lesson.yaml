id: basics.functions
title: Functions
objective: Write a function that takes inputs and returns a result.
level: essential
minutes: 10
concepts: [basics.functions, basics.return-values]
prerequisites: [basics.loops]
opening:
  text: >-
    You'll package a piece of work into a function, give it a name, and run it whenever you
    like. It's how big programs stay small enough to understand.

steps:
  - type: prose
    id: what-a-function-is
    body: |-
      A **function** is a named recipe. You write it once:

      ```js
      function cheer() {
        console.log("Go team");
      }
      ```

      Nothing happens yet. The recipe only runs when you call it by its name, with brackets:
      `cheer();`. Call it three times, and it runs three times.

  - type: predict-output
    id: predict-call
    concept: basics.functions
    difficulty: 1
    language: js
    code: |
      function cheer() {
        console.log("Go team");
      }
      cheer();
      cheer();
    question: What does this show?
    choices:
      - text: '`Go team` twice'
        correct: true
        feedback: >-
          Yes. Two calls, so the recipe runs twice.
      - text: '`Go team` three times'
        feedback: >-
          Writing the function doesn't run it. Only the two calls do.
      - text: Nothing
        feedback: >-
          Lines 4 and 5 call it, and each call runs the code inside.

  - type: prose
    id: parameters
    body: |-
      Functions get more useful with inputs, called **parameters**. They go inside the
      brackets:

      ```js
      function greet(name) {
        console.log(`Hello, ${name}`);
      }
      greet("Sam");
      greet("Ada");
      ```

      Each call fills `name` with the value you pass. So this shows `Hello, Sam`, then
      `Hello, Ada`.

  - type: fill-blank
    id: fill-greet
    concept: basics.functions
    difficulty: 2
    language: js
    prompt: 'Finish the code, so it shows `Hello, Ada`.'
    template: |
      function greet({{1}}) {
        console.log(`Hello, ${name}`);
      }
      greet({{2}});
    blanks:
      - key: '1'
        answer: name
      - key: '2'
        answer: '"Ada"'
    bank: [name, '"name"', '"Ada"', Ada]

  - type: prose
    id: return
    body: |-
      Showing a result is handy, but often you want to use it. `return` hands a value back to
      the code that called the function:

      ```js
      function add(a, b) {
        return a + b;
      }
      const total = add(2, 3);
      ```

      Now `total` holds `5`. `return` also ends the function straight away.

      A function with no `return` gives back `undefined`, JavaScript's word for "no value".

  - type: parsons
    id: arrange-full-name
    concept: basics.return-values
    difficulty: 2
    language: js
    prompt: >-
      Build `fullName`, which hands back a first and last name joined by a space. Then store
      its result and show it. One line doesn't belong.
    blocks:
      - id: open
        code: function fullName(first, last) {
        subgoal: Make the function
      - id: return
        code: return first + " " + last;
        indent: 1
        subgoal: Make the function
      - id: close
        code: '}'
        subgoal: Make the function
      - id: store
        code: const name = fullName("Ada", "Lovelace");
        subgoal: Use its result
      - id: show
        code: console.log(name);
        subgoal: Use its result
    distractors:
      - id: log-inside
        code: console.log(first + " " + last);
        feedback: >-
          That shows the name but hands nothing back. `name` would hold `undefined`.

  - type: bug-hunt
    id: hunt-missing-return
    concept: basics.return-values
    difficulty: 3
    language: js
    code: |
      function area(width, height) {
        width * height;
      }
      const size = area(3, 4);
      console.log(size);
    prompt: This shows `undefined`, not `12`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The answer is worked out but never returned
        correct: true
        feedback: >-
          Right. Without `return`, the answer is thrown away.
      - text: The parameters need quotes
        feedback: >-
          Quotes would turn them into text. They're names for the numbers passed in.
      - text: '`console.log` can''t show a function''s result'
        feedback: >-
          It can show any value. The function gave back no value to show.
    fix: |
      function area(width, height) {
        return width * height;
      }
      const size = area(3, 4);
      console.log(size);

  - type: code-challenge
    id: write-shipping
    concept: basics.return-values
    difficulty: 3
    language: js
    starter: starter.js
    editable: '2'
    solution: solution.js
    tests: tests.js
    prompt: >-
      An online shop gives free delivery on orders of 50 pounds or more. Smaller orders pay 5
      pounds.


      Write the function `shippingCost(total)`. It returns `0` when `total` is 50 or more, and
      `5` otherwise. For example, `shippingCost(60)` returns `0`.
    hints:
      - You need an `if` and an `else` inside the function, each with a `return`.
      - '"50 or more" is `total >= 50`.'
      - 'Start with `if (total >= 50) {` and `return 0;` inside.'

  - type: explain-back
    id: explain-return-vs-log
    concept: basics.return-values
    difficulty: 3
    prompt: A function that uses `console.log` shows a result, and one that uses `return` doesn't. So why use `return`?
    rubric:
      - '`console.log` only shows a value, and the rest of the program can''t use it.'
      - '`return` hands the value back, so it can be stored or used in more maths.'
      - A returned value can be combined with others, like `shippingCost(40) + 40`.
    modelAnswer: >-
      `console.log` puts a value on the screen, and that's the end of it. `return` gives the
      value back to the code that called the function. You can store it, compare it or add it
      to something else. That's what lets small functions work together.

recap:
  - "Write a function that takes inputs."
  - "Hand a result back with `return`."
  - "Call the same function with different values."
recall:
  - id: card-call
    concept: basics.functions
    front: What makes a function's code actually run?
    back: >-
      Calling it by name with brackets, like `cheer();`. Writing it alone does nothing.
  - id: card-parameter
    concept: basics.functions
    front: What is a parameter?
    back: >-
      A name for an input. Each call fills it with the value you pass.
  - id: card-return
    concept: basics.return-values
    front: What does a function give back if it has no `return`?
    back: >-
      `undefined`, which means no value.

references:
  - kind: docs
    title: Functions
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/function-basics
    note: Declaring functions, parameters and return values.
    primary: true
    verified: true
  - kind: docs
    title: Functions — reusable blocks of code
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Functions
