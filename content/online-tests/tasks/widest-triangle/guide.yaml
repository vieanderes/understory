approach: >-
  Sort the planks longest first. For a longest side A[i], the best partners are the two
  next-longest planks, because they give both the largest sum and the best chance of
  beating A[i]. If they fail, no smaller pair can work with A[i]. So the first consecutive
  triple that forms a frame is the widest one.
complexity: O(N log N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N up to 100,000**, so trying every triple of planks is
      out of the question. **N can be 0**, and lengths reach 1,000,000,000.

      Three of those add up to 3,000,000,000. That is safe in JavaScript numbers and Python
      integers, but would overflow a 32-bit integer.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the rule in your own words. The word **shorter** matters: equal is not enough,
      so the check is strict.
    code:
      ts: |-
        // Largest a + b + c over three planks where each is strictly shorter than the other two together; else 0.
      python: |-
        # Largest a + b + c over three planks where each is strictly shorter than the other two together; else 0.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - no planks, and only two planks;
      - a flat triple where the longest equals the other two together;
      - the widest frame is not made of the three longest planks;
      - lengths near the maximum.
    input:
      - "[]"
      - "[4, 9]"
      - "[5, 3, 2]"
      - "[100, 7, 6, 5, 1]"
      - "[1000000000, 1000000000, 1000000000]"
  - kind: ask-ai
    title: Confirm the shortcut in the triangle rule
    minutes: 1
    body: |-
      Three checks per triple is noisy. Ask the assistant to confirm that one check is
      enough once the sides are ordered. It is a narrow fact, and the rest stays yours.
    prompt: >-
      If a <= b <= c, is checking c < a + b alone enough to know that a, b and c form a
      triangle? Yes or no, with one sentence of why. No code.
    expect: Yes. The other two checks always hold when c is the longest.
  - kind: plan
    title: Sort, then check neighbours only
    minutes: 3
    body: |-
      Sort longest first. For the longest side at position i, the two planks right after
      it are the best partners: the largest sum, and the best chance to beat it.

      If they fail, nothing further down works with that plank either. So walk down and
      return the first triple that works. Every triple would be O(N³); this is O(N log N).
  - kind: write
    title: Write it yourself
    minutes: 3
    body: |-
      It is a sort and a loop, faster to type than to prompt. There is no sensible slow
      version to bank here, because the sort is the whole idea. Watch the loop bound:
      i + 2 must stay inside the array.
    code:
      ts: |-
        // Largest a + b + c over three planks where each is strictly shorter than the other two together; else 0.
        // Sorted longest first, the first consecutive triple that works is the widest: O(N log N).
        function solution(A: number[]): number {
          // Sorted longest first, the best triangle whose longest side is A[i] uses the next two
          // planks, the longest left. The first such triple that works is the widest: O(N log N).
          const planks = A.slice().sort((x, y) => y - x);
          for (let i = 0; i + 2 < planks.length; i++) {
            if (planks[i]! < planks[i + 1]! + planks[i + 2]!) {
              return planks[i]! + planks[i + 1]! + planks[i + 2]!;
            }
          }
          return 0;
        }
      python: |-
        # Largest a + b + c over three planks where each is strictly shorter than the other two together; else 0.
        # Sorted longest first, the first consecutive triple that works is the widest: O(N log N).
        def solution(A):
            # Sorted longest first, the best triangle whose longest side is A[i] uses the next two
            # planks, the longest left. The first such triple that works is the widest: O(N log N).
            planks = sorted(A, reverse=True)
            for i in range(len(planks) - 2):
                if planks[i] < planks[i + 1] + planks[i + 2]:
                    return planks[i] + planks[i + 1] + planks[i + 2]
            return 0
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Then check each of your cases
      against the rule, especially the flat triple.
    expect: >-
      Three OKs, then 0, 0, 0, 18 and 3000000000.
  - kind: ai-writes
    title: Let the assistant write a brute-force checker
    minutes: 3
    body: |-
      A throwaway checker is a good job to delegate: it is not your answer, only a way to
      test it. Read it before you trust it: three nested loops and the strict check. Delete
      it before you submit.
    prompt: >-
      Write a TypeScript function brute(A: number[]): number that tries every triple of
      distinct indices and returns the largest perimeter where each side is strictly
      shorter than the other two together, or 0. Then 4 lines that compare brute and
      solution on 200 random arrays of length 0 to 8 with values 1 to 20, and print any
      mismatch. Nothing else.
    expect: No mismatches printed. Then remove the checker from the file.
  - kind: test
    title: Watch out for the default sort
    minutes: 1
    body: |-
      In JavaScript, sort() without a comparator sorts numbers as text, so 100 comes before
      9. This line catches it: no frame exists, but a text sort finds one.
    input:
      - "[100, 20, 9, 8]"
    expect: 0. A text sort returns 37 instead.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours. The strict check, the loop bound and
      the sort comparator are what to look at.
    prompt: >-
      Review my current solution for the strict triangle check, the loop bound, the sort
      comparator, and time complexity. List any problems in one line each. Do not rewrite
      the code.
    expect: No problems, and the assistant confirms O(N log N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the brute-force checker and any debug output. Check the header comment states
      the complexity. Then submit.
