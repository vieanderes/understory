deepDive: >-
  Every run on this page starts from a fresh copy, so nothing you delete is lost. A real
  database has no such safety net. Teams add their own: backups, a copy of production to
  rehearse on, and tools that refuse an `UPDATE` without a `WHERE` (MySQL's
  `--safe-updates` mode is one).


  A transaction is the other net. Between `BEGIN` and `ROLLBACK`, you can run a change, look
  at the result and undo it. The transactions lesson covers it properly.


  Many apps never delete rows at all. They set `deleted_at` to the current time and filter
  those rows out, which keeps history and makes an undo button simple to build. The cost is a `WHERE
  deleted_at IS NULL` on every query.
