id: basics.variables
title: Variables
objective: Give a value a name with `let` or `const`, and change it.
level: essential
minutes: 9
concepts: [basics.variables, basics.let-and-const]
prerequisites: [basics.first-program]
opening:
  text: >-
    You'll teach your code to remember things by giving values names. Every app does this all
    the time: your score, your name, the items in your basket.

steps:
  - type: prose
    id: what-a-variable-is
    body: |-
      A **variable** is a name for a value. Think of a label stuck on a box.

      ```js
      let score = 10;
      console.log(score);
      ```

      The first line makes a variable called `score` that holds `10`. The second shows it:
      `10`. There are no quotes around `score`, because it's a name, not text.

  - type: predict-output
    id: predict-variable
    concept: basics.variables
    difficulty: 1
    language: js
    code: |
      let city = "Paris";
      console.log(city);
    question: What does this show?
    choices:
      - text: '`Paris`'
        correct: true
        feedback: >-
          Yes. `city` is the name, and `Paris` is what it holds.
      - text: '`city`'
        feedback: >-
          No quotes around `city`, so it's read as a name. You see what it holds.
      - text: '`"Paris"`'
        feedback: >-
          The quotes only mark the text. They're never shown.

  - type: prose
    id: changing-a-value
    body: |-
      Variables made with `let` can change. Write the name, `=`, and the new value:

      ```js
      let score = 10;
      score = 15;
      ```

      Here `=` means "now holds", not "is equal to". The old value is replaced. You only
      write `let` once, when the variable is made.

      The right side is worked out first. So `score = score + 5` takes the old score, adds 5,
      and stores the result.

  - type: predict-output
    id: predict-change
    concept: basics.variables
    difficulty: 2
    language: js
    code: |
      let score = 10;
      score = 15;
      console.log(score);
    question: What does the last line show?
    choices:
      - text: '`15`'
        correct: true
        feedback: >-
          Right. The newest value replaced the old one.
      - text: '`10`'
        feedback: >-
          `10` was there first, but line 2 replaced it before anything was shown.
      - text: '`25`'
        feedback: >-
          Nothing adds them up. `=` swaps the old value for the new one.

  - type: fill-blank
    id: fill-lose-life
    concept: basics.variables
    difficulty: 2
    language: js
    prompt: The player gets hit. Finish line 2, so `lives` goes down by one.
    template: |
      let lives = 3;
      {{1}} = {{2}} - 1;
      console.log(lives);
    blanks:
      - key: '1'
        answer: lives
      - key: '2'
        answer: lives
    bank: [lives, lives, let lives, '"lives"']

  - type: prose
    id: let-and-const
    body: |-
      Some values should never change, like the number of days in a week. Make those with
      `const`:

      ```js
      const daysInWeek = 7;
      ```

      Try to give a `const` a new value and the program stops with an error. That's useful:
      it catches mistakes. Use `const` unless you know the value will change.

  - type: fill-blank
    id: fill-let-or-const
    concept: basics.let-and-const
    difficulty: 2
    language: js
    prompt: A game keeps the player's name and score. The score goes up. Pick `let` or `const` for each.
    template: |
      {{1}} player = "Kim";
      {{2}} score = 0;
      score = score + 10;
    blanks:
      - key: '1'
        answer: const
      - key: '2'
        answer: let
    bank: [const, let, const, let]

  - type: bug-hunt
    id: hunt-const-change
    concept: basics.let-and-const
    difficulty: 3
    language: js
    code: |
      const total = 0;
      total = total + 5;
      console.log(total);
    prompt: 'This stops on line 2 with the error `Assignment to constant variable`. Tap the line that needs the fix.'
    lines: [1]
    reasons:
      - text: '`total` changes, so it needs `let`'
        correct: true
        feedback: >-
          Exactly. Line 2 shows the error, but line 1 made the wrong choice.
      - text: '`total + 5` can''t use `total` itself'
        feedback: >-
          It can. The right side is worked out first, using the old value.
      - text: '`console.log` can''t show a variable'
        feedback: >-
          It can, and it never runs here. The program stops on line 2.
    fix: |
      let total = 0;
      total = total + 5;
      console.log(total);

  - type: code-challenge
    id: write-weather
    concept: basics.let-and-const
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Make a `const` called `city` that holds the text `Rome`. Make a `let` called `temperature`
      that holds `18`.


      Then change `temperature` to `21`. Finally, show `city`, then `temperature`, each with its
      own `console.log`.
    hints:
      - You need two variables, one line that changes a value, and two `console.log` lines.
      - '`city` is text, so its value needs quotes. `temperature` is a number, so it doesn''t.'
      - 'Start with `const city = "Rome";` and `let temperature = 18;`'

  - type: explain-back
    id: explain-let-const
    concept: basics.let-and-const
    difficulty: 3
    prompt: Why choose `const` for a value that should never change, when `let` would work too?
    rubric:
      - A `const` can't be given a new value.
      - Changing it by mistake stops the program with an error, so the bug is caught.
      - Anyone reading the code knows at once that the value stays the same.
    modelAnswer: >-
      `let` would work, but `const` protects you. If a line changes the value by mistake, the
      program stops with an error. You find the bug at once. It also tells
      whoever reads the code that this value never changes.

recap:
  - "Give a value a name with `let` or `const`."
  - "Change a `let` and read its new value."
  - "Pick `const` for a value that never changes."
recall:
  - id: card-variable
    concept: basics.variables
    front: What is a variable?
    back: >-
      A name for a value. You make it once, then use the name wherever you need the value.
  - id: card-change-value
    concept: basics.variables
    front: How do you give an existing `let` variable a new value?
    back: >-
      Write its name, `=`, and the new value, like `score = 15;`. No `let` the second time.
  - id: card-let-const
    concept: basics.let-and-const
    front: When do you use `let`, and when `const`?
    back: >-
      `const` by default. `let` only for a value that will change.

references:
  - kind: docs
    title: Variables
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/variables
    note: Variables, `let` and `const`, with small exercises.
    primary: true
    verified: true
  - kind: docs
    title: Storing the information you need — Variables
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Variables
