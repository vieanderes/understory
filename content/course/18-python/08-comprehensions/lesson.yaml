id: python.comprehensions
title: Comprehensions and iteration
objective: Build lists and dicts with comprehensions, loop with enumerate, zip, any and all, and never remove items from the list you are looping over.
level: essential
minutes: 10
concepts: [python.comprehensions, python.enumerate-and-zip, python.generator-expressions, python.mutating-while-iterating]
prerequisites: [python.functions-as-values]
opening:
  text: >-
    You'll turn four-line loops into one clear line and walk two lists side by side. Then
    you'll score a model against the right answers, the heart of every eval.

steps:
  - type: prose
    id: comprehension-shape
    body: |-
      This loop builds a list of the cheap prices:

      ```python
      cheap = []
      for p in prices:
          if p < 6:
              cheap.append(p)
      ```

      A **list comprehension** says the same in one expression:
      `cheap = [p for p in prices if p < 6]`. Read it left to right: what to keep, where it
      comes from, and an optional filter. With braces and `key: value`, it builds a dict.

  - type: fill-blank
    id: fill-active-names
    concept: python.comprehensions
    difficulty: 2
    prompt: Build the list of names of the active users.
    language: python
    template: |
      users = [{"name": "Ana", "active": True}, {"name": "Ben", "active": False}]
      names = [{{1}} for user in users if {{2}}]
    blanks:
      - key: '1'
        answer: user["name"]
      - key: '2'
        answer: user["active"]
    bank: ['user["name"]', 'user["active"]', user, name, active]

  - type: prose
    id: mutating-while-iterating
    body: |-
      Never remove items from a list while a `for` loop walks it. The loop keeps a position.
      Each removal shifts the rest left, so the next item slides past unseen:

      ```python
      replies = ["ok", "", "", "done"]
      for r in replies:
          if r == "":
              replies.remove(r)
      print(replies)   # ['ok', '', 'done']
      ```

      Build a new list instead: `[r for r in replies if r != ""]`.

  - type: ai-review
    id: review-remove-while-looping
    concept: python.mutating-while-iterating
    difficulty: 3
    language: python
    request: Write drop_spam(emails, blocked), removing emails from blocked senders.
    flawClass: logic
    code: |
      def drop_spam(emails, blocked):
          for email in emails:
              if email["sender"] in blocked:
                  emails.remove(email)
          return emails
    prompt: >-
      An assistant wrote this, and a test with one spam email passed. With two spam emails
      in a row, one stays in the inbox. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It removes from the list the loop is walking
        correct: true
        feedback: >-
          Right. Each removal shifts the list, so the loop skips the next email.
      - text: '`in blocked` misses some senders'
        feedback: >-
          The check is fine. The second spam email is never checked at all.
      - text: '`remove` deletes every copy of the email'
        feedback: >-
          It removes only the first match. The trouble is removing while looping.
    fix: |
      def drop_spam(emails, blocked):
          return [e for e in emails if e["sender"] not in blocked]

  - type: prose
    id: enumerate-and-zip
    body: |-
      Two helpers save you from counting indexes by hand. **`enumerate`** hands you each
      item with its position. **`zip`** walks several lists side by side:

      ```python
      for i, task in enumerate(tasks, start=1):
          print(f"{i}. {task}")

      for name, time in zip(names, times):
          print(name, time)
      ```

      `zip` stops as soon as the shortest list runs out.

  - type: predict-output
    id: predict-zip-shortest
    concept: python.enumerate-and-zip
    difficulty: 2
    language: python
    code: |
      names = ["Ana", "Ben", "Cy"]
      times = [12.1, 13.4]
      for name, time in zip(names, times):
          print(name, time)
    question: What does this show?
    choices:
      - text: Two lines, for Ana and Ben
        correct: true
        feedback: >-
          Yes. `zip` stops with the shorter list, so Cy is quietly skipped.
      - text: Three lines, with `None` for Cy
        feedback: >-
          Most people expect that. `zip` stops when one side runs out.
      - text: An error, because the lengths differ
        feedback: >-
          Plain `zip` never checks. That silence is why a missing item can go unnoticed.

  - type: prose
    id: generator-expressions
    body: |-
      Drop the square brackets inside a call, and you get a **generator expression**. It
      makes items one at a time, when asked, and never builds a list:

      ```python
      total = sum(len(line) for line in lines)
      has_big = any(o > 100 for o in orders)
      text = ", ".join(t.upper() for t in tags)
      ```

      `sum` adds the items up. `any` stops at the first true item, and `all` at the first
      false one. A generator can be walked only once.

  - type: ai-review
    id: review-any-orders
    concept: python.generator-expressions
    difficulty: 3
    language: python
    request: Write has_large_order(orders), true if any order is over 100.
    flawClass: performance
    code: |
      def has_large_order(orders):
          large = [o for o in orders if o > 100]
          return len(large) > 0
    prompt: >-
      An assistant wrote this. Tests with five orders pass. On ten million orders it's slow
      and uses a lot of memory. Tap the line at fault.
    lines: [2]
    reasons:
      - text: It builds a whole list to answer one question
        correct: true
        feedback: >-
          Yes. `any(o > 100 for o in orders)` stops at the first match and stores nothing.
      - text: '`len` has to count the list one by one'
        feedback: >-
          A list knows its length, so `len` is instant. Building the list is the cost.
      - text: '`> 0` should be `>= 1`'
        feedback: >-
          Those mean the same for a count. The waste is in the line before.
    fix: |
      def has_large_order(orders):
          return any(o > 100 for o in orders)

  - type: code-challenge
    id: write-accuracy
    concept: python.enumerate-and-zip
    difficulty: 3
    language: python
    starter: accuracy.starter.py
    solution: accuracy.solution.py
    tests: accuracy.tests.py
    prompt: >-
      An eval compares a model's labels with the right ones. Write
      `accuracy(predictions, labels)`: the share that match, from 0 to 1. No labels gives
      `0.0`. Lists of different lengths mean a broken eval: raise `ValueError`.


      Example: `["bug", "refund"]` against `["bug", "other"]` gives `0.5`.
    hints:
      - '`zip` pairs each prediction with its label, but it hides a length mismatch.'
      - 'Check the lengths first. Then count the matching pairs with a generator inside `sum`.'
      - 'Start with `if len(predictions) != len(labels):` and `raise ValueError(...)`.'

  - type: explain-back
    id: explain-generator-memory
    concept: python.generator-expressions
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      You sum the lengths of ten million lines. Why does `sum(len(l) for l in lines)` use far
      less memory than `sum([len(l) for l in lines])`?
    rubric:
      - The square brackets build a list of every length before summing.
      - The round brackets make one length at a time, on request.
      - So only one value is held at once, not ten million.
    modelAnswer: >-
      The list comprehension builds all ten million lengths first, then `sum` adds them. The
      generator expression makes each length only when `sum` asks for the next one. It never
      holds more than one at a time.

recap:
  - Build lists and dicts with a comprehension and an optional filter.
  - Loop with `enumerate` and `zip`, and build a new list rather than removing while looping.
  - Use a generator expression inside `sum`, `any`, `all` and `join` to save memory.
recall:
  - id: card-comprehension-shape
    concept: python.comprehensions
    front: Write a list comprehension that keeps the positive numbers in `nums`.
    back: >-
      `[n for n in nums if n > 0]`.
  - id: card-zip-shortest
    concept: python.enumerate-and-zip
    front: What does `zip` do when the lists have different lengths?
    back: >-
      It stops at the end of the shortest one, without any error.
  - id: card-enumerate-start
    concept: python.enumerate-and-zip
    front: How do you loop over `tasks` with numbers starting at 1?
    back: >-
      `for i, task in enumerate(tasks, start=1):`.
  - id: card-remove-while-looping
    concept: python.mutating-while-iterating
    front: How do you drop items from a list without skipping any?
    back: >-
      Build a new list with a comprehension, such as `[x for x in items if keep(x)]`,
      instead of calling `remove` inside the loop.
  - id: card-generator-once
    concept: python.generator-expressions
    front: What happens if you loop over the same generator expression twice?
    back: >-
      The second loop gets nothing. A generator hands out each item once.

