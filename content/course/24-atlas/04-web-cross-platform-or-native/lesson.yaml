deepDive: >-
  The totals ran in the playground's own script: 34, 39 and 30 under the first weights. With
  the costs in pounds they came to 2,029, 9,036 and 30,029. Map every criterion to the same
  scale before any weight touches it.


  The support table is from the browser compatibility data behind MDN. Web Bluetooth ships
  in Chrome and Chrome on Android, and not in Safari or Firefox. Web NFC is Chrome on Android
  only. Push works on iPhones from iOS 16.4, for a web app added to the Home Screen. Outside
  the EU, every iPhone browser uses Safari's engine, so a "no" for Safari is a "no" for the
  platform. The next lesson covers what a website can still do there.


  Fees and review times change, so this lesson gives none. Both stores charge for a
  developer account and review releases. Cross-platform apps go through the same stores.


  Four criteria is a floor. Teams add time to market, accessibility, offline use and
  upkeep. Each new criterion needs its weight agreed first, the same way.
