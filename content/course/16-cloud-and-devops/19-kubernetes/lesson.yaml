    verified: true

deepDive: >-
  Every command here ran on a kind cluster: Kubernetes 1.34.0 in Docker, kind 0.30.0 and
  kubectl 1.32. The three `nginx:1.29` Pods came from `kubectl create deployment web
  --replicas=3`. After the delete, a new Pod was running 8 seconds later. A Pod running
  `tail /dev/zero` with a 32Mi memory limit showed `CrashLoopBackOff` within 25 seconds, and
  its last state was `OOMKilled` with exit code 137.


  With a readiness probe on a path that returns 404, a new release stopped at one Pod,
  shown as `0/1 Running`, while the three old Pods kept serving. A Deployment's default
  strategy allows 25% surge, rounded up, and 25% unavailable, rounded down, so with three
  replicas it adds one new Pod before removing an old one. `kubectl rollout status` timed
  out, and `kubectl rollout undo` brought the old version back. A Pod whose request no node
  can meet stays `Pending` with `0/1 nodes are available: 1 Insufficient cpu`.


  Outside traffic reaches a Service through an Ingress or the newer Gateway API. Both route
  by host name and path, and a controller such as Envoy Gateway or Traefik does the routing.
  The community ingress-nginx controller, once the usual choice, was retired in March 2026
  and gets no more fixes, so pick another for a new cluster.


  Kubernetes is a lot of machinery to own: upgrades, networking, security policies,
  certificates, node pools. A managed cluster such as GKE, EKS or AKS runs the control plane
  for you, and platforms such as Cloud Run or a PaaS hide the cluster entirely. For a small
  team with a few services, those are usually the better choice. Kubernetes pays off with
  many services, several teams and a platform team to run it.
