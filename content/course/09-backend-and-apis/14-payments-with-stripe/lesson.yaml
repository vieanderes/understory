deepDive: >-
  A few currencies have no smaller unit. Yen, won and a handful of others are
  zero-decimal, so ¥1200 is `1200`, not `120000`. Stripe's docs list them, and a helper
  that converts prices should know them.


  Some payment methods, such as bank debits, settle days later. Then
  `checkout.session.completed` arrives with `payment_status` of `unpaid`, and
  `checkout.session.async_payment_succeeded` follows when the money lands.


  A retried create call can charge twice. Pass an idempotency key, and Stripe returns the
  first result for a repeat instead of making a second charge.


  The thanks page can show the order straight away. Put `{CHECKOUT_SESSION_ID}` in
  `success_url`, and fetch that session from Stripe on the server to show its status. It
  still never trusts a query string it didn't check.
