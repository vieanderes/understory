term: heading structure
aka: [heading levels, document outline]
short: The outline a page's h1 to h6 headings form, ranked by position in the page, never by size.
explain: |
  Readers skim. Sighted people scan the big bold lines, and screen reader users jump from
  heading to heading. Either way, the headings are the map of the page.

  Pick the level by where it sits: one `h1` for the page, `h2` for its sections, `h3` inside
  those. Don't skip a level, and never pick one because it looks the right size. Change the
  size with CSS.
analogy: The chapters and sections in a textbook's contents. They're numbered by where they sit, not by how big the print is.
example:
  language: html
  code: |
    <h1>Pancakes</h1>
    <h2>Ingredients</h2>
    <h2>Method</h2>
    <h3>Making the batter</h3>
usage: The heading structure jumps from h1 to h4, so make it an h2 and shrink it in CSS.
twin:
  term: landmark
  difference: Headings outline the content section by section. Landmarks split the whole page into a few big regions, such as the menu and the main content.
related: [landmark, semantic-html, screen-reader]
level: 1
lessons: [html.semantic-structure]
