id: tooling.quality-gates
title: Quality gates
objective: Set up linting, formatting and type-checking, and keep pre-commit and CI checks the same.
level: essential
minutes: 10
concepts: [tooling.linting, tooling.formatting, tooling.type-checking, tooling.ci-parity]
prerequisites: [tooling.what-a-build-does, tooling.remotes]
opening:
  text: >-
    You'll let machines catch the mistakes a tired reviewer misses, before they reach anyone.
    And you'll make sure the checks on your laptop are the ones that guard the main branch.

steps:
  - type: prose
    id: lint-and-format
    body: >-
      Two tools read your code without running it.


      A **linter** reports patterns that are probably bugs. The usual one for JavaScript is
      ESLint. Each report names a rule. A comment, `// eslint-disable-next-line` plus that
      name, silences it for the next line.


      A **formatter** reprints your code in one fixed layout: spaces, quotes, line breaks. It
      never changes what the code does. The usual one is Prettier.

  - type: predict-output
    id: predict-lint-assignment
    concept: tooling.linting
    difficulty: 1
    language: js
    code: |
      let stock = 0;
      if (stock = 5) {
        console.log('In stock:', stock);
      }
    question: You run ESLint with its recommended rules on this file. What happens?
    choices:
      - text: It reports line 2 and exits with 1
        correct: true
        feedback: >-
          Right. It spots an assignment where a condition belongs, and fails the run.
      - text: Nothing, because the code is valid JavaScript
        feedback: >-
          It is valid, and it runs. That's the danger: it prints `In stock: 5` every time.
      - text: It changes `=` to `===` by itself
        feedback: >-
          ESLint can fix some things, but not this one. Only you know what you meant.

  - type: predict-output
    id: predict-prettier-changes
    concept: tooling.formatting
    difficulty: 2
    language: js
    code: |
      const total=price*qty+shipping
      if (total == '0') { console.log("free") }
    question: Prettier reprints this file. What changes?
    choices:
      - text: Spaces, quotes, semicolons and line breaks
        correct: true
        feedback: >-
          Yes. The layout changes, and the `==` stays exactly as it was.
      - text: The layout, and `==` becomes `===`
        feedback: >-
          That would change what the code does. A formatter never does that. It's a linter's
          job to flag it.
      - text: Nothing, because the code already runs
        feedback: >-
          Running isn't the test. Prettier rewrites anything that doesn't match its one layout.

  - type: ai-review
    id: review-silenced-rule
    concept: tooling.linting
    difficulty: 3
    language: js
    request: ESLint fails on cart.js. Make it pass.
    flawClass: logic
    code: |
      export function priceAfterCode(total, code) {
        let discount = 0;
        if (code === 'SAVE10') {
          // eslint-disable-next-line no-unused-vars
          discount = 10;
        }
        return total;
      }
    prompt: >-
      ESLint said `'discount' is assigned a value but never used`. The assistant added line 4,
      and ESLint passed. Tap the line with the real bug.
    lines: [7]
    reasons:
      - text: It returns the total without the discount
        correct: true
        feedback: >-
          Yes. The warning was right. Delete line 4 and return `total - discount`.
      - text: The comment names the wrong rule
        feedback: >-
          It names the right one, which is why ESLint went quiet. Quiet isn't the same as fixed.
      - text: '`discount` should be a `const`'
        feedback: >-
          It changes on line 5, so `let` is right. The trouble is that nothing ever reads it.
    fix: |
      export function priceAfterCode(total, code) {
        let discount = 0;
        if (code === 'SAVE10') {
          discount = 10;
        }
        return total - discount;
      }

  - type: prose
    id: one-check-script
    body: |-
      The type checker is the third tool. `tsc --noEmit` checks your TypeScript and writes
      no files. Like the other two, it ends with exit code 0 only when all is well.

      Teams join all three into one npm script, with the `&&` you met in the terminal:

      ```json
      "check": "tsc --noEmit && eslint . && prettier --check ."
      ```

      `prettier --check` only reports messy files. `--write` would fix them. After a type
      error, `&&` stops, so ESLint never even starts.

  - type: fill-blank
    id: fill-check-script
    concept: tooling.type-checking
    difficulty: 2
    language: json
    prompt: >-
      Build a check that fails on a type error and stops there, and reports messy files
      without changing them. Fill the gaps.
    template: |
      {
        "scripts": {
          "check": "tsc {{1}} {{2}} eslint . && prettier {{3}} ."
        }
      }
    blanks:
      - key: '1'
        answer: --noEmit
      - key: '2'
        answer: '&&'
      - key: '3'
        answer: --check
    bank: [--noEmit, --watch, '&&', ';', --check, --write]

  - type: prose
    id: hooks-and-ci
    body: >-
      A check only helps if it runs. Two places run it.


      A **pre-commit hook** is a script Git runs before each commit. **CI**, continuous
      integration, is a service that runs your checks on a fresh machine for every push and
      pull request. GitHub Actions is a common one.


      Call the same `npm run check` from both. A hook can be skipped with `git commit
      --no-verify`. CI can't, so CI is the gate that counts.

  - type: bug-hunt
    id: hunt-ci-skips-types
    concept: tooling.ci-parity
    difficulty: 3
    language: bash
    code: |
      # .githooks/pre-commit
      npm run lint
      npm run typecheck
      npm test

      # ci.sh, run by CI on every push
      npm ci
      npm test
    prompt: >-
      A teammate commits with `--no-verify`. A type error reaches `main`, and CI stays green.
      Tap the line at fault.
    lines: [8]
    reasons:
      - text: CI runs fewer checks than the hook
        correct: true
        feedback: >-
          Right. CI only tests, so a skipped hook takes the type check with it.
      - text: '`npm ci` should be `npm install`'
        feedback: >-
          `npm ci` is right for CI: it installs exactly what the lockfile says. The checks are
          what's missing.
      - text: The hook should run the tests first
        feedback: >-
          Order inside the hook doesn't matter here. It never ran at all. CI had to catch it.
    verify:
      question: After the fix, how would you prove CI now blocks type errors?
      choices:
        - text: Push a type error on a branch; CI should fail
          correct: true
          feedback: >-
            Yes. A gate you've seen close is one you can trust.
        - text: Run `npm run check` on your laptop
          feedback: >-
            That proves the script works. It says nothing about whether CI calls it.
        - text: Commit again without `--no-verify`
          feedback: >-
            Then the hook catches it, not CI. The point is what happens when the hook is skipped.
    fix: |
      # .githooks/pre-commit
      npm run check

      # ci.sh, run by CI on every push
      npm ci
      npm run check

  - type: ai-review
    id: review-format-hook
    concept: tooling.ci-parity
    difficulty: 4
    language: bash
    request: Add a pre-commit hook that tidies the code before every commit.
    flawClass: logic
    code: |
      #!/bin/sh
      # .githooks/pre-commit
      npm run format
      npm run lint
    prompt: >-
      `format` runs `prettier --write .`. The assistant's test stages a messy file and
      commits. The file on disk looks tidy, but CI's `prettier --check` fails. Tap the line
      at fault.
    lines: [3]
    reasons:
      - text: It tidies the files on disk, not the staged copies
        correct: true
        feedback: >-
          Yes. The commit holds the messy staged copy. Check in hooks; fix by hand.
      - text: Lint has to run before formatting
        feedback: >-
          Swapping them changes nothing about what gets committed. The tidy files never reach
          the commit.
      - text: A hook can't run npm scripts
        feedback: >-
          It can, and this one did: the file on disk was tidied. It tidied the wrong copy.
    fix: |
      #!/bin/sh
      # .githooks/pre-commit
      npm run check

  - type: explain-back
    id: explain-ci-is-the-gate
    concept: tooling.ci-parity
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      A reviewer says the CI job is wasted minutes, since the pre-commit hook runs the same
      `npm run check`. Defend keeping both.
    rubric:
      - Anyone can skip the hook, with `--no-verify` or by never setting it up, so it can't be the gate.
      - CI runs the same script on every push from a clean install, and nobody can skip it.
      - The hook stays for fast feedback, and the cost is a few minutes of CI per push.
    modelAnswer: >-
      The hook is for speed, not safety. `git commit --no-verify` skips it, and a fresh clone
      may never have it set up. CI runs the same script on every push from a clean install,
      so it's the one check nobody can dodge. Sharing one script means a pass on a laptop is a
      pass in CI. A few minutes per push is cheap next to a type error on `main`.

recap:
  - Tell a linter's job from a formatter's, and run both from one script.
  - Stop a check at the first failure with `&&` and `tsc --noEmit`.
  - Run that one script in your hook and in CI.

recall:
  - id: card-lint-or-format
    concept: tooling.linting
    front: Which tool reports `if (stock = 5)`, a linter or a formatter?
    back: >-
      The linter. A formatter only changes layout, and never what the code does.
  - id: card-check-or-write
    concept: tooling.formatting
    front: What's the difference between `prettier --check` and `prettier --write`?
    back: >-
      `--check` reports messy files and fails. `--write` rewrites them in place.
  - id: card-check-chain
    concept: tooling.type-checking
    front: In `tsc --noEmit && eslint .`, why doesn't ESLint run after a type error?
    back: >-
      `tsc` exits with a code other than 0, and `&&` only runs the next command after a success.
  - id: card-skip-hook
    concept: tooling.ci-parity
    front: Why can't a pre-commit hook be your only gate?
    back: >-
      `git commit --no-verify` skips it. CI runs on every push and can't be skipped.

references:
  - kind: docs
    title: Configuration Files
    authors: OpenJS Foundation and ESLint contributors
    venue: ESLint documentation
    url: https://eslint.org/docs/latest/use/configure/configuration-files
    note: The flat `eslint.config.js` format, and how later objects override earlier ones.
    primary: true
    verified: true
  - kind: docs
    title: Integrating with Linters
    venue: Prettier documentation
    url: https://prettier.io/docs/integrating-with-linters
    note: Why `eslint-config-prettier` turns off rules that clash with the formatter.
    verified: true
  - kind: docs
    title: githooks
    authors: Git project
    venue: Git documentation
    url: https://git-scm.com/docs/githooks
    note: When `pre-commit` runs, and that `--no-verify` skips it.
    primary: true
    verified: true
  - kind: docs
    title: eqeqeq
    authors: OpenJS Foundation and ESLint contributors
    venue: ESLint documentation
    url: https://eslint.org/docs/latest/rules/eqeqeq
    note: The rule that flags `==` and `!=`, with its `null` option.
    verified: true

deepDive: |-
  The messages above are real, from ESLint 9.39, Prettier 3.9 and TypeScript 6.0. ESLint's
  recommended rules also flagged `if (stock = 5)` as a constant condition, and needed to be
  told that `console` exists.

  ESLint reads `eslint.config.js`, a list of settings objects where later ones win:

  ```js
  import js from '@eslint/js';
  import prettier from 'eslint-config-prettier';

  export default [js.configs.recommended, { rules: { eqeqeq: 'error' } }, prettier];
  ```

  `eslint-config-prettier` goes last. It switches off ESLint's layout rules, so the two tools
  never argue.

  A linter works on the parsed code, a tree of nodes, not on text. `eqeqeq` looks for each
  comparison node whose operator is `==` or `!=`. That's why it ignores `==` inside a string.

  Test for "not 0", never a particular code. tsc returns 2 here, but 1 when
  `noEmitOnError` stops the output.

  Git looks for hooks in `.git/hooks`, which is never committed. Point it at a folder you do
  commit with `git config core.hooksPath .githooks`. Each clone still has to run that once.
