id: ts.strictness
title: Strictness and escape hatches
objective: Turn on the checks that catch crashes, and fix an error instead of hiding it with `any`, `as` or `!`.
level: essential
minutes: 10
concepts: [ts.strict-flags, ts.escape-hatches]
prerequisites: [ts.advanced-types]
opening:
  text: >-
    You'll switch on the checks that catch real crashes, and learn the three ways people
    silence the checker instead. Spotting those in review saves a lot of late-night bug hunts.

steps:
  - type: prose
    id: what-strict-means
    body: |-
      The checker has settings. A project keeps them in a file called `tsconfig.json`, which
      you'll write yourself after the Tooling chapter. One setting matters most:

      ```json
      { "compilerOptions": { "strict": true } }
      ```

      **strict** switches on the checks this chapter relied on, like warning that a value may
      be `null`. Without it, `querySelector` results pass as if they always exist. Start
      every project with it on.

  - type: predict-output
    id: predict-index-under-strict
    concept: ts.strict-flags
    difficulty: 2
    language: ts
    code: |
      type Track = { title: string; seconds: number };

      function firstTitle(tracks: Track[]): string {
        return tracks[0].title;
      }
      console.log(firstTitle([]));
    question: 'The project has `"strict": true`. What happens?'
    choices:
      - text: It compiles, then line 4 throws a `TypeError`
        correct: true
        feedback: >-
          Right. `strict` trusts that `tracks[0]` finds a track.
      - text: 'Line 4 fails: `tracks[0]` is possibly `undefined`'
        feedback: >-
          That needs a separate setting. `strict` assumes a list read always finds something.
      - text: It compiles, then logs `undefined`
        feedback: >-
          `tracks[0]` is `undefined`, yes. Reading `.title` from it throws, so nothing's logged.

  - type: prose
    id: no-unchecked-indexed-access
    body: |-
      One useful check sits outside `strict`, because it flags a lot of working code.
      **noUncheckedIndexedAccess** adds `undefined` to every read by index or key, like
      `tracks[0]` or `prices[item]`:

      ```text
      return tracks[0].title;
      Object is possibly 'undefined'.
      ```

      Turn it on next to `strict`. Then check the read, the way you'd check a `querySelector`
      result.

  - type: code-challenge
    id: write-fare-total
    concept: ts.strict-flags
    difficulty: 3
    language: ts
    starter: fare.starter.ts
    solution: fare.solution.ts
    tests: fare.tests.ts
    prompt: >-
      This project uses `noUncheckedIndexedAccess`, so `fares[zone]` is `number | undefined`.
      Write `tripFare(fares, zones)` with no `!` and no `as`.


      Return the total in pence, and `0` for no zones. Return `undefined` if any zone has no
      fare. A free zone costs `0`, and that's a real fare.


      Example: `tripFare({ outer: 190, shuttle: 0 }, ["shuttle", "outer"])` returns `190`.
    hints:
      - >-
        Look at `fares[zone]!` in the starter. The `!` hides `undefined` from the checker,
        not from the running code.
      - >-
        Store the read in a `const`. Comparing it with `undefined` narrows it to `number`. A
        truthiness test would also reject `0`.
      - >-
        Start the loop body with `const fare = fares[zone];`, then
        `if (fare === undefined) return undefined;`.

  - type: prose
    id: escape-hatches
    body: >-
      When the checker complains, there are three ways to make it stop without fixing
      anything. `any` switches checking off. `as` claims a type. A `!` after a value claims
      it's never `null` or `undefined`.


      Each is an **escape hatch**. The checker goes quiet, and the crash waits for the code
      to run. In review, every hatch deserves a question.

  - type: predict-output
    id: predict-any-spreads
    concept: ts.escape-hatches
    difficulty: 2
    language: ts
    code: |
      function loadSettings(): any {
        return JSON.parse('{"theme":"dark"}');
      }
      const settings = loadSettings();
      const colour: string = settings.theme.colour;
      console.log(colour.toUpperCase());
    question: The checker reports nothing. What happens when it runs?
    choices:
      - text: Line 6 throws a `TypeError`
        correct: true
        feedback: >-
          Right. `any` let a made-up property through, so `colour` is `undefined`.
      - text: It logs `DARK`
        feedback: >-
          `theme` is the text `"dark"`, and text has no `colour`. That read gives `undefined`.
      - text: The annotation on line 5 catches it
        feedback: >-
          An `any` value fits every annotation. Line 5 believes it and checks nothing.

  - type: ai-review
    id: review-as-hides-null
    concept: ts.escape-hatches
    difficulty: 3
    language: ts
    request: Fill in the saved email on the sign-up form.
    flawClass: edge-case
    code: |
      function prefillEmail(savedEmail: string): void {
        const input = document.querySelector("#email") as HTMLInputElement;
        input.value = savedEmail;
      }
    prompt: >-
      An assistant wrote this. It works on the sign-up page, and the script also runs on
      pages without the form. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`as` hid that the field may be missing'
        correct: true
        feedback: >-
          Yes. `querySelector` gives `null` there, and line 3 then throws.
      - text: '`#email` should be `email` without the hash'
        feedback: >-
          The hash selects by id, which is right. The trouble is the page with no such field.
      - text: '`value` can''t be set from a script'
        feedback: >-
          It can, on any input. It fails only when there's no input to set it on.
    fix: |
      function prefillEmail(savedEmail: string): void {
        const input = document.querySelector<HTMLInputElement>("#email");
        if (input === null) return;
        input.value = savedEmail;
      }

  - type: code-challenge
    id: fix-find-assertion
    concept: ts.escape-hatches
    difficulty: 2
    language: ts
    starter: greet.starter.ts
    solution: greet.solution.ts
    tests: greet.tests.ts
    prompt: >-
      `displayName(members, id)` crashes for an id nobody has. `find` gives
      `Member | undefined`, and the `!` hid that from the checker.


      Remove the `!`, and return `"Guest"` when no member matches.
    hints:
      - Without the `!`, the checker says the result of `find` is possibly `undefined`.
      - Store the result of `find` in a `const`, then check it.
      - 'Start with `const member = members.find((m) => m.id === id);` and `if (member === undefined) return "Guest";`.'

  - type: explain-back
    id: explain-bang-silences
    concept: ts.escape-hatches
    difficulty: 2
    prompt: >-
      A teammate adds `!` to make a red line go away. What did that change, and what didn't
      it?
    rubric:
      - The `!` only tells the checker the value is never `null` or `undefined`.
      - It's erased, so no check runs, and the missing case still crashes.
      - The real fix is narrowing, such as an `if` that handles the missing case.
    modelAnswer: >-
      The `!` changed what the checker believes: it now treats the value as always present,
      so the error disappears. It's erased like every type, so nothing checks anything while
      the code runs. When the value really is missing, it still crashes. An `if` that
      handles the missing case fixes it for real.

recap:
  - Start every project with `strict` and `noUncheckedIndexedAccess` on.
  - Spot `any`, `as` and `!` as places the checker was told to look away.
  - Replace an escape hatch with a check that handles the missing case.

recall:
  - id: card-strict-family
    concept: ts.strict-flags
    front: 'Name a check that `"strict": true` doesn''t switch on, and what it adds.'
    back: >-
      `noUncheckedIndexedAccess`. It adds `undefined` to every read by index or key, so
      `tracks[0]` must be checked before use.
  - id: card-three-hatches
    concept: ts.escape-hatches
    front: What are the three common ways to silence the checker without fixing anything?
    back: >-
      `any`, which switches checking off; `as`, which claims a type; and `!`, which claims a
      value isn't `null` or `undefined`.
  - id: card-any-spreads
    concept: ts.escape-hatches
    front: A function returns `any`. What can you read off its result without an error?
    back: >-
      Anything at all, and each read is `any` too. One `any` spreads to everything it touches.
  - id: card-as-null
    concept: ts.escape-hatches
    front: What goes wrong with `document.querySelector("#email") as HTMLInputElement`?
    back: >-
      The `as` removes `null` from the type. On a page without that field, the next line
      throws.

