id: js
number: 3
title: JavaScript
summary: "The language that makes pages do things. Start with a click handler, learn the language underneath, and finish with a live search that talks to a server."
why: "Every button, form and live update on the web runs on JavaScript."
youCanBuild: "A live search page that fetches results as you type, built in the browser."
lab: event-loop-stepper
concepts:
  - id: js.page-scripts
    title: Scripts in a page
    summary: A `script` element runs its JavaScript once, top to bottom, when the browser reaches it.
  - id: js.event-listeners
    title: Event listeners
    summary: "`addEventListener` hands the browser a function to run each time an event, such as a click, happens."
    confusableWith: [js.event-propagation]
  - id: js.types
    title: Primitive types and typeof
    summary: Every value has a type, such as number or string, and `typeof` reports which.
  - id: js.coercion
    title: Type coercion
    summary: An operator converts its operands to the types it needs, without asking.
    confusableWith: [js.equality, js.truthiness]
  - id: js.equality
    title: Loose and strict equality
    summary: "`==` converts its operands before comparing, and `===` compares type and value as they are."
    confusableWith: [js.coercion, js.truthiness]
  - id: js.truthiness
    title: Truthy and falsy values
    summary: A condition turns its value into true or false, and only six values, such as `0` and `""`, count as false.
    confusableWith: [js.coercion, js.equality, js.logical-operators]
  - id: js.string-methods
    title: String methods
    summary: "Methods such as `trim`, `includes`, `slice`, `split` and `padStart` read and reshape text, and always return a new string."
  - id: js.numbers-and-math
    title: Numbers and Math
    summary: "`Number` and `parseInt` turn text into numbers in different ways, `toFixed` formats one as text, and `Math` rounds and compares."
  - id: js.object-and-set-helpers
    title: Object, Set and Map helpers
    summary: "`Object.keys`, `values` and `entries` turn an object into lists, a `Set` keeps each value once, and a `Map` stores values under any key."
  - id: js.json
    title: JSON
    summary: "`JSON.stringify` turns data into text, and `JSON.parse` turns that text back into data."
  - id: js.logical-operators
    title: "&&, || and !"
    summary: "`&&` needs both sides true, `||` needs either, and `!` flips a value to the opposite boolean."
    confusableWith: [js.optional-chaining, js.truthiness]
  - id: js.optional-chaining
    title: Optional chaining and nullish coalescing
    summary: "`a?.b` reads `b` only when `a` is not null or undefined, and `x ?? y` falls back to `y` only for null or undefined, never for 0 or an empty string."
    confusableWith: [js.logical-operators]
  - id: js.switch
    title: switch
    summary: A `switch` compares one value against several cases with `===`, and runs on into the next case unless a `break` stops it.
  - id: js.loop-control
    title: break and continue
    summary: "`break` leaves a loop at once, and `continue` skips to the next turn."
  - id: js.destructuring
    title: Destructuring
    summary: "`const { name } = user` and `const [first] = list` copy values out of an object or an array into variables."
  - id: js.spread-and-rest
    title: Spread and rest
    summary: "`...` spreads an array or object out into a new one, and in a parameter list it gathers the remaining arguments into an array."
    confusableWith: [js.copying]
  - id: js.default-values
    title: Default values
    summary: "A default such as `(size = 10)` fills in a value when the caller leaves it out, and only for `undefined`."
  - id: js.arrow-functions
    title: Arrow functions
    summary: "`(price) => price * 2` is a short way to write a function, often handed to another function, and it has no `this` of its own."
    confusableWith: [js.this]
  - id: js.array-iteration
    title: map, filter and reduce
    summary: "`map`, `filter` and `reduce` each return a new value and leave the array unchanged."
    confusableWith: [js.array-mutation]
  - id: js.array-helpers
    title: Array search helpers
    summary: "`find`, `some`, `every` and `includes` answer a question about a list and stop as soon as they know."
  - id: js.array-mutation
    title: Mutating array methods
    summary: "Methods such as `sort`, `push` and `splice` change the array they are called on, and `toSorted` makes a sorted copy instead."
    confusableWith: [js.array-iteration]
  - id: js.declarations
    title: let, const and var
    summary: Each keyword decides where a variable lives, when it can be read and whether it can be reassigned.
    confusableWith: [js.scope]
  - id: js.scope
    title: Scope
    summary: A name means the nearest variable declared around it in the code, looking outwards from the inside.
    confusableWith: [js.declarations, js.closures, js.this]
  - id: js.closures
    title: Closures
    summary: A function keeps access to the variables of the place it was created, even after that code has finished.
    confusableWith: [js.scope]
  - id: js.references
    title: References and aliasing
    summary: Assigning an object copies a reference, so two names can change one object.
    confusableWith: [js.copying]
  - id: js.copying
    title: Shallow and deep copies
    summary: A shallow copy shares nested objects with the original, and a deep copy shares nothing.
    confusableWith: [js.references, js.spread-and-rest]
  - id: js.immutable-updates
    title: Immutable updates
    summary: An immutable update builds a new object or array that holds the change and leaves the original as it was.
  - id: js.errors
    title: Errors and exceptions
    summary: "`throw` stops the code and jumps to the nearest `catch`, and `finally` runs either way."
  - id: js.error-types
    title: Error types
    summary: Built-in errors such as `TypeError` and `SyntaxError` are kinds of `Error`, and `instanceof` tells them apart.
  - id: js.swallowed-errors
    title: Swallowed errors
    summary: A `catch` block that neither handles nor rethrows an error hides the failure from every caller.
  - id: js.form-values
    title: Reading form fields
    summary: An input's `value` is the text in the box, always a string, and a checkbox's `checked` is true or false.
  - id: js.class-list
    title: Switching classes
    summary: "`classList.add`, `remove` and `toggle` change an element's classes, so the CSS for that class takes over."
  - id: js.creating-elements
    title: Adding and removing elements
    summary: "`document.createElement` makes a new element, `append` puts it on the page, and `remove` takes an element away."
  - id: js.event-propagation
    title: Bubbling
    summary: An event starts at the element it happened on, then bubbles up through each of its ancestors.
    confusableWith: [js.event-delegation, js.default-actions, js.event-listeners]
  - id: js.event-delegation
    title: Event delegation
    summary: One listener on a parent handles events for all its children, including new ones, by reading `event.target`.
    confusableWith: [js.event-propagation]
  - id: js.default-actions
    title: Default actions
    summary: "`preventDefault` cancels what the browser would do by itself, such as sending a form, and leaves bubbling alone."
    confusableWith: [js.event-propagation]
  - id: js.classes
    title: Classes
    summary: A class is a blueprint for objects, with a constructor that sets them up and methods they all share.
    confusableWith: [js.prototypes]
  - id: js.prototypes
    title: The prototype chain
    summary: Reading a property an object doesn't hold carries on to its prototype, which is where class methods live.
    confusableWith: [js.classes]
  - id: js.own-properties
    title: Own and inherited properties
    summary: An own property is stored on the object itself, and `JSON.stringify` and `Object.keys` see only those.
  - id: js.this
    title: The this keyword
    summary: "`this` is the object a function was called on, set by each call, not by where the function is written."
    confusableWith: [js.scope, js.arrow-functions]
  - id: js.call-apply-bind
    title: bind
    summary: "`bind` returns a new function whose `this` is fixed, so it keeps its object when passed around."
  - id: js.modules
    title: Modules
    summary: A module is a file with its own scope that shares names with `export` and uses other files' names with `import`.
    confusableWith: [js.named-and-default-exports]
  - id: js.named-and-default-exports
    title: Named and default exports
    summary: "A named export is imported by its name in braces, and a file's one default export is imported under any name you choose."
    confusableWith: [js.modules]
  - id: js.module-scripts
    title: Modules in the browser
    summary: "`<script type=\"module\">` loads a file as a module, and its imports need relative paths such as `./format.js`."
  - id: js.promises
    title: Promises
    summary: A promise stands for a result that arrives later, and it settles once, with a value or an error.
    confusableWith: [js.async-await]
  - id: js.async-await
    title: async and await
    summary: "`await` pauses one async function until a promise settles, while the rest of the page keeps running."
    confusableWith: [js.promises]
  - id: js.concurrent-awaits
    title: One at a time or all at once
    summary: Awaiting each call in turn runs them one after another, and starting them all before awaiting lets them overlap.
  - id: js.promise-combinators
    title: Promise.all and allSettled
    summary: "`Promise.all` fails as soon as one promise fails, and `Promise.allSettled` waits for every result, good or bad."
  - id: js.event-loop
    title: The event loop
    summary: The browser runs one piece of JavaScript at a time, to the end, and the page can't redraw or respond meanwhile.
    confusableWith: [js.microtasks]
  - id: js.tasks
    title: Tasks
    summary: A task is one unit of queued work, such as a timer callback, a click handler or a script.
    confusableWith: [js.microtasks]
  - id: js.microtasks
    title: Microtasks
    summary: Promise callbacks run after the current task and before the next task or redraw.
    confusableWith: [js.event-loop, js.tasks]
  - id: js.rendering-steps
    title: Painting
    summary: The browser redraws the page between tasks, so changes made during one long task appear only when it ends.
  - id: js.requests-and-responses
    title: Requests and responses
    summary: A browser sends a request to a server at a URL, and the server sends back a response with a status code and a body.
    confusableWith: [js.fetch]
  - id: js.status-codes
    title: Status codes
    summary: A response's status code says how it went, where 2xx worked, 4xx means the request was wrong and 5xx means the server failed.
  - id: js.fetch
    title: fetch
    summary: "`fetch` sends a request and resolves with the response, even for a 404, so the code checks `response.ok` itself."
    confusableWith: [js.requests-and-responses]
  - id: js.sending-data
    title: Sending data
    summary: "A `POST` request carries data in its body, as JSON text with a `Content-Type` header that says so."
  - id: js.cancellation
    title: Cancelling requests
    summary: An `AbortController` cancels a request you no longer need, so an old answer can't overwrite a newer one.
