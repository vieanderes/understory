    authors: Paul Irish
    venue: GitHub Gist
    url: https://gist.github.com/paulirish/5d52fb081b3570c81e3a
    note: The properties and methods that force a layout when read.
    verified: true

deepDive: >-
  The layout counts come from Chromium's performance metrics, over a one-second slide on a
  page with 300 paragraphs. The frame gaps come from a `requestAnimationFrame` loop that
  burned 10 ms or 30 ms per frame.


  The compositor usually runs on its own thread, often with help from the **GPU**, the
  graphics chip. That's why a `transform` animation keeps moving even while the main thread
  is busy. A `left` animation freezes with it.


  `will-change: transform` asks the browser to give an element its own layer before the
  animation starts. Use it on the few things that really animate: every layer costs
  memory.


  For games and 3D, the same rules hold at a bigger scale. Libraries such as three.js draw
  with WebGL, and their cost per frame is counted in draw calls: the fewer, the better.
