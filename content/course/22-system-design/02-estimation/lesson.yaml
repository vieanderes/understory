deepDive: >-
  Two more conversions come up often. Bandwidth is bytes per second. 4,630 messages a second
  of 200 bytes is under 1 MB a second, which is tiny. 100 photo uploads a second of 3 MB
  is 300 MB a second, or 2.4 Gbit a second, and that's a real line item. Powers of two help too:
  a thousand is about 2^10, so a million is 2^20 and a billion 2^30.


  The latency figures are rough and change slowly. Memory and datacentre round trips have
  barely moved in years, while SSDs got much faster and then levelled off. The ocean round
  trip is bounded by physics: light in fibre covers about 200 km a millisecond, so no
  software makes it shorter. That is why data locality matters more than code speed once a
  request crosses regions.
