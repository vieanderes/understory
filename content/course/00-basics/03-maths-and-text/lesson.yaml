id: basics.operators
title: Maths and text
objective: Calculate with numbers and build text from values.
level: essential
minutes: 10
concepts: [basics.arithmetic, basics.strings]
prerequisites: [basics.variables]
opening:
  text: >-
    You'll make the computer work out totals and build sentences from your variables. That's
    how a shop adds up your basket and an app says "Hi, Sam".

steps:
  - type: prose
    id: operators
    body: |-
      `+`, `-`, `*` and `/` work like a calculator. You never do the sums yourself. Your job is
      to write the right **expression**: a piece of code that works out to a value.

      ```js
      const total = price * quantity + delivery;
      ```

      The usual maths order holds: times and divide go before plus and minus. Brackets change
      the order, as in `(a + b) / 2`.

      One newcomer: `%` gives the **remainder**. `10 % 3` is `1`, what's left after dividing.

  - type: multiple-choice
    id: pick-average
    concept: basics.arithmetic
    difficulty: 1
    question: Which line works out the average of two scores, `a` and `b`?
    choices:
      - text: '`const average = (a + b) / 2;`'
        correct: true
        feedback: >-
          Yes. The brackets make the adding happen first.
      - text: '`const average = a + b / 2;`'
        feedback: >-
          Most people write this first. Divide goes before plus, so only `b` is halved.
      - text: '`const average = (a + b) * 2;`'
        feedback: >-
          That doubles the sum. An average divides it by how many there are.

  - type: bug-hunt
    id: hunt-delivery
    concept: basics.arithmetic
    difficulty: 2
    language: js
    code: |
      const price = 4;
      const quantity = 3;
      const delivery = 2;
      const total = price + delivery * quantity;
      console.log(total);
    prompt: The shop should charge delivery once per order. It charges it for every item. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Times runs first, so delivery is multiplied
        correct: true
        feedback: >-
          Right. It should be `price * quantity + delivery`.
      - text: '`delivery` should be a `let`'
        feedback: >-
          It never changes, so `const` is right. The order of the maths is the problem.
      - text: '`console.log` can''t show a sum'
        feedback: >-
          It can show any value. The value itself is wrong before it gets there.
    fix: |
      const price = 4;
      const quantity = 3;
      const delivery = 2;
      const total = price * quantity + delivery;
      console.log(total);

  - type: prose
    id: joining-text
    body: |-
      `+` has a second job. Between two strings, it joins them:

      ```js
      const name = "Sam";
      console.log("Hi, " + name);
      ```

      That shows `Hi, Sam`. Look at the space after the comma. The computer adds nothing you
      didn't write, not even a space.

      With text on one side and a number on the other, `+` joins too: `"Room " + 5` is
      `Room 5`.

  - type: predict-output
    id: predict-join
    concept: basics.strings
    difficulty: 2
    language: js
    code: |
      const first = "Ada";
      const last = "Lovelace";
      console.log(first + last);
    question: What does this show?
    choices:
      - text: '`AdaLovelace`'
        correct: true
        feedback: >-
          Yes. No space was written, so none appears.
      - text: '`Ada Lovelace`'
        feedback: >-
          It feels natural, but the computer adds no space. You'd write `first + " " + last`.
      - text: '`first last`'
        feedback: >-
          No quotes, so those are names. You see the values they hold.

  - type: prose
    id: template-literals
    body: |-
      Joining can catch you out. `"Total: " + 2 + 3` shows `Total: 23`. `+` works left to
      right, so the text joins the 2 before any adding happens.

      A **template literal** avoids that. Wrap the text in backticks, and put each value in
      `${ }`. Anything that works out to a value fits, even maths:

      ```js
      console.log(`Total: ${2 + 3}`);
      ```

      That shows `Total: 5`.

  - type: bug-hunt
    id: hunt-joined-total
    concept: basics.strings
    difficulty: 2
    language: js
    code: |
      const shirt = 15;
      const socks = 5;
      console.log("Total: " + shirt + socks);
    prompt: 'The receipt shows `Total: 155`. Tap the line at fault.'
    lines: [3]
    reasons:
      - text: The text joins each number, one after the other
        correct: true
        feedback: >-
          Yes. Once text is on the left, every `+` joins. A template literal fixes it.
      - text: '`shirt` and `socks` hold text'
        feedback: >-
          They're numbers, with no quotes. It's the `"Total: "` on the left that starts the joining.
      - text: '`console.log` can show only one value'
        feedback: >-
          It shows whatever the brackets work out to. Here that's the joined text.
    fix: |
      const shirt = 15;
      const socks = 5;
      console.log(`Total: ${shirt + socks}`);

  - type: fill-blank
    id: fill-template
    concept: basics.strings
    difficulty: 2
    language: js
    prompt: 'Finish the greeting, so it shows `Hi Sam, you have 3 messages`.'
    template: |
      const name = "Sam";
      const count = 3;
      console.log(`Hi {{1}}, you have {{2}} messages`);
    blanks:
      - key: '1'
        answer: '${name}'
      - key: '2'
        answer: '${count}'
    bank: ['${name}', name, '"name"', '${count}', '{count}']

  - type: code-challenge
    id: write-receipt
    concept: basics.strings
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      A café sells coffee for 3 pounds a cup. The starter has `price` and `cups`.


      Show one line that reads exactly `4 coffees cost 12 pounds`. Use a template literal, and
      let the computer work out the 12 from the two variables.
    hints:
      - You need one `console.log` with backticks inside the brackets.
      - Inside a `${ }` part you can do maths, like `price * cups`.
      - 'Start with ``console.log(`${cups} coffees cost``'

  - type: explain-back
    id: explain-plus
    concept: basics.strings
    difficulty: 3
    prompt: 'Why does `console.log("5" + "5")` show `55` and not `10`?'
    rubric:
      - The quotes make both fives strings.
      - Between strings, `+` joins instead of adding.
      - To add them, write the numbers without quotes.
    modelAnswer: >-
      Both fives are in quotes, so they're text, not numbers. When `+` sits between two pieces
      of text, it joins them. So you get `55`. Without the quotes, `5 + 5` would be `10`.

recap:
  - "Calculate with `+`, `-`, `*`, `/` and `%`."
  - "Write a sum that runs in the order you mean."
  - "Put a value inside text with a template literal."
recall:
  - id: card-order
    concept: basics.arithmetic
    front: In `price + delivery * quantity`, which part runs first?
    back: >-
      `delivery * quantity`. Times goes before plus. Brackets change the order.
  - id: card-remainder
    concept: basics.arithmetic
    front: What does `%` give you?
    back: >-
      The remainder after dividing. `10 % 3` is `1`.
  - id: card-template
    concept: basics.strings
    front: How do you put a variable's value inside text?
    back: >-
      Use a template literal: backticks, with the name inside `${ }`.

