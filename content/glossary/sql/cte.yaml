term: common table expression
aka: [CTE, WITH clause, WITH query]
short: A named subquery written at the top of a SQL statement with `WITH`, then used like a table.
explain: |
  A query with subqueries nested three deep reads inside out. A CTE lifts each step out and
  names it, so the statement reads top to bottom: first this, then that.

  It changes how the query reads, rarely what it does. Modern databases usually plan it
  like the subquery it replaced. A recursive CTE can also walk trees, like a category
  hierarchy.
analogy: Writing the sub-totals on separate lines of a receipt before the grand total.
example:
  language: sql
  code: |
    WITH recent AS (
      SELECT customer_id, SUM(total) AS spent
      FROM orders
      WHERE created_at > now() - interval '30 days'
      GROUP BY customer_id
    )
    SELECT * FROM recent WHERE spent > 100;
usage: Pull the monthly totals into a common table expression; the nested version is unreadable.
related: [join, window-function, query-plan]
level: 2
lessons: [pro.sql]
