term: success metric
aka: [north star metric, target metric, key result]
short: A measure of the change a feature should cause, with a baseline, a target and a decision date.
explain: |
  A team can ship a polished feature that changes nothing. Nobody said what it should
  change, so nobody notices. A success metric names it: tickets resolved in four hours
  instead of nine, by the end of the quarter.

  Set it before building, before any result can bend it. Measure the outcome, what people
  do differently, not the output, what you shipped. And pair it with a guardrail metric.
analogy: Deciding the finish line before the race starts, not drawing it wherever you stop.
usage: What's the success metric for the summariser? "Agents like it" isn't one.
twin:
  term: guardrail-metric
  difference: The success metric is the number you're trying to move. The guardrail metric is the one that mustn't get worse while you move it.
related: [guardrail-metric, assumption-map, metrics, non-goal]
level: 2
lessons: [aisys.shaping-the-build]
