summary: >-
  A **variable** is a name for a value, like a label stuck on a box. You make it once, then
  use the name wherever you need the value. That's how a program remembers things: a score,
  a player's name, the number of items in a basket.


  JavaScript gives you two ways to make one. `let` makes a variable you can point at a new
  value later. `const` makes one that keeps its first value for good, and the program stops
  with an error if a line tries to change it. The habit to build is `const` by default and
  `let` only when the value really changes, because an error that catches a mistake early
  is a gift.


  The other idea in this lesson is what `=` means in code. It isn't "is equal to" as in
  maths. It means "now holds". The computer works out the right side first, then stores the
  result in the name on the left. That's why `score = score + 5` makes sense in code, even
  though it would be nonsense on a maths worksheet.
remember:
  - A variable is a name that points at a value, so you can use the value again by its name.
  - '`=` means "now holds": the right side is worked out first, then stored in the name on the left.'
  - Use `const` by default, and `let` only for a value you will change later.
  - 'Giving a `const` a new value stops the program with `TypeError: Assignment to constant variable.`'
  - You write `let` or `const` once, when you make the variable, and never again for the same name.
  - A variable name has no quotes, so the computer reads it as a name and uses the value it holds.
  - Names are case-sensitive, so `score` and `Score` are two different variables.
sections:
  - title: What `=` really does
    body: |-
      Making a variable and giving it a value in one line is called a **declaration**. Giving
      an existing variable a new value later is called an **assignment**. Both use `=`, and
      both follow the same rule: work out the right side, then store it on the left.

      ```js
      let lives = 3;
      lives = lives - 1;
      lives = lives - 1;
      console.log(lives);
      // 1
      ```

      Read line 2 as the computer does. First the right side: look up `lives`, which is 3,
      and take away 1, giving 2. Then store 2 in `lives`. The old 3 is gone. Line 3 does the
      same again, from 2 to 1. The variable holds one value at a time, and each assignment
      replaces it.

      That's why the order of lines matters so much. A variable holds whatever was last put
      in it *before* the line that reads it.

      ```js
      let message = "Loading";
      console.log(message);
      message = "Ready";
      console.log(message);
      // Loading
      // Ready
      ```

      The same `console.log(message)` shows two different things, because the value changed
      in between.

      A variable made with `let` but given no value yet holds `undefined`, JavaScript's
      special value for "nothing here yet". `let nothing;` followed by
      `console.log(nothing);` shows `undefined`. That's allowed, but it's rarely what you
      want. Give a variable its first value when you make it, if you can.
  - title: The three errors you'll meet with variables
    body: |-
      Variables come with a few rules, and breaking one stops the program. The error messages
      are worth recognising, because you'll see all three in your first week. Each is shown
      as Node prints it.

      Changing a `const`:

      ```text
      const total = 0;
      total = 5;
      TypeError: Assignment to constant variable.
      ```

      The fix is usually on the line that *made* the variable, not the line in the message.
      If the value needs to change, it should have been a `let`.

      Making the same name twice:

      ```text
      let score = 1;
      let score = 2;
      SyntaxError: Identifier 'score' has already been declared
      ```

      An **identifier** is the programmer's word for a name. The second line should be an
      assignment, `score = 2;`, with no `let`. Because it's a syntax error, nothing in the
      program runs, not even the lines above it.

      Using a name before the line that makes it:

      ```text
      console.log(price);
      let price = 4;
      ReferenceError: Cannot access 'price' before initialization
      ```

      Code runs top to bottom, so the variable doesn't have a value yet when line 1 runs. Move
      the declaration above the first line that uses it.

      A fourth rule catches people who try to save a line: a `const` must get its value when
      it's made. `const total;` on its own is a syntax error, `Missing initializer in const
      declaration`. That makes sense. A `const` can never be given a value later, so it has
      to get one straight away.
  - title: Naming variables well
    body: |-
      JavaScript has a few hard rules for names. A name can contain letters, digits, `_` and
      `$`, but it can't start with a digit, so `2cats` is an error and `cats2` is fine. It
      can't contain spaces or dashes. And it can't be one of the words JavaScript keeps for
      itself, called **keywords**, like `let`, `const` or `if`.

      Beyond the rules, there's a strong convention called **camelCase**: start in lower case
      and begin each later word with a capital letter, as in `daysInWeek` or `totalPrice`.
      Almost all JavaScript code is written this way, so following it makes your code look
      familiar to other developers.

      The rule that matters most isn't enforced by the computer: a name should say what the
      value *means*. Compare these two programs. They do exactly the same thing.

      ```js
      const a = 12;
      const b = 3;
      console.log(a * b);
      // 36
      ```

      ```js
      const pricePerBook = 12;
      const booksBought = 3;
      console.log(pricePerBook * booksBought);
      // 36
      ```

      The second one explains itself. You'll read code far more often than you write it,
      and so will everyone who works with you. A name that saves typing costs reading time
      every time someone opens the file.

      Remember that names are case-sensitive. `total` and `Total` are different variables.
      Mixing them up gives a `ReferenceError` if only one exists, or a quiet bug if both do.
  - title: Choosing between let and const
    body: |-
      Both keywords make a variable. The difference is a promise. `const` promises the name
      will point at the same value for as long as it exists. `let` makes no such promise.

      So ask one question when you make a variable: will a later line give this name a new
      value? If yes, `let`. If no, or if you aren't sure yet, `const`. You can always change
      `const` to `let` later, and the error tells you exactly when you need to.

      ```js
      const pricePerCup = 3;
      let cupsSold = 0;
      cupsSold = cupsSold + 1;
      cupsSold = cupsSold + 1;
      console.log(pricePerCup);
      console.log(cupsSold);
      // 3
      // 2
      ```

      The price is fixed for the day, so it's a `const`. The count goes up with each sale, so
      it's a `let`. Someone reading the code learns that from the first two lines, before
      reading any further.

      In real code, most variables end up as `const`. Values are usually worked out once and
      then used. Variables that change are where bugs like to hide, so having few of them,
      and marking them clearly, makes a program easier to trust.

      You'll also see `var` in older code and tutorials. It was the original way to make a
      variable, before `let` and `const` existed. It has looser rules that cause surprises,
      so modern code avoids it. If you meet it, read it as an older `let`.
pitfalls:
  - '**Writing `let` again to change a value.** `let score = 15;` after `let score = 10;` is a syntax error, because it tries to make the variable twice. Drop the keyword: `score = 15;`.'
  - '**Putting a variable name in quotes.** `console.log("score")` shows the word `score`, not the value. It happens because quotes felt like "the thing to show". A name has no quotes.'
  - '**Choosing `const` for something that changes.** A running total or a counter made with `const` stops at the first update with `Assignment to constant variable.` Fix the line that made it: use `let`.'
  - '**Reading `=` as "equals".** `total = total + 5` looks impossible if you read it as maths. Read it as "total now holds total plus 5", and the right side is always worked out first.'
  - '**Using a variable before the line that makes it.** Code runs top to bottom, so the name has no value yet. Declare it above its first use.'
interview:
  - question: What's the difference between `let` and `const`?
    answer: >-
      `let` makes a variable you can reassign, and `const` makes one you can't. Reassign
      means pointing the name at a new value with `=`. If code tries that on a `const`, the
      program stops with `TypeError: Assignment to constant variable.` I use `const` by
      default and switch to `let` only for values that really change, like a counter or a
      running total. That makes the code easier to read, because a reader knows which values
      stay put, and it turns an accidental change into an error I see at once. One detail
      matters later: `const` protects the name, not the value. With lists and objects, which
      come later in the course, the contents of a `const` can still change. And `var` is the
      older keyword, which modern code avoids.
  - question: What does `x = x + 1` mean in code?
    answer: >-
      It means "work out `x + 1`, then store the result back in `x`", so `x` goes up by one.
      In code, `=` is assignment: it puts a value into a variable. It isn't a statement of
      equality as in maths, where `x = x + 1` would have no solution. The computer always
      evaluates the right side first, using the current value, then replaces the old value
      on the left. So if `x` was 4, the right side becomes 5 and `x` now holds 5. This is the
      basic move behind counters, scores and running totals. It only works on a variable
      made with `let`, since a `const` can't be reassigned, and it needs a starting value,
      or the maths runs on `undefined`.
  - question: Why do variable names matter if the computer doesn't care?
    answer: >-
      Because code is read by people far more often than it's written, and names are the
      main way code explains itself. `pricePerBook * booksBought` tells a reader what's
      happening. `a * b` forces them to trace where each value came from. Good names also
      catch bugs: `total = price` reads as fine, while `total = taxRate` looks wrong at a
      glance. I follow the JavaScript conventions, camelCase and a name that describes what
      the value means, not its type. The trade-off is length. A loop counter used for three
      lines can be `i`, and every developer understands it. A value used across a long
      program deserves a full, specific name.
