id: css.box-model
title: The box model
objective: Space a box with padding, border and margin, and stop it spilling off a phone.
level: essential
minutes: 10
concepts: [css.box-model, css.box-sizing, css.margin-collapse]
prerequisites: [css.cascade]
opening:
  text: >-
    You'll space out a page with padding, borders and margins, and know how wide every box
    will be. That's the end of cards that spill off the side of a phone.

steps:
  - type: prose
    id: four-areas
    body: |-
      To a browser, every element is a box in four layers, from the inside out:

      - content: the text or image
      - padding: space inside the border
      - border: the line around it
      - margin: space outside, keeping neighbours away

      ```css
      .card { padding: 24px; border: 2px solid; margin: 16px; }
      ```

      That's the **box model**. A background fills the content and padding, never the margin.
    figure:
      id: box-model
      caption: The background stops at the border. The margin is space, never paint.

  - type: playground
    id: pad-the-cards
    concept: css.box-model
    difficulty: 1
    prompt: >-
      These plant cards are cramped and stuck together. Give `.card` `padding: 24px` and
      `margin-bottom: 16px`. Watch the text breathe and the cards part.
    html: |
      <div class="card">
        <h2>Monstera</h2>
        <p>Water once a week. Bright, indirect light.</p>
      </div>
      <div class="card">
        <h2>Snake plant</h2>
        <p>Water once a month. Happy in the shade.</p>
      </div>
    css: |
      body { font-family: sans-serif; }
      .card {
        background: honeydew;
        border: 2px solid darkgreen;
      }
    editable: [css]
    checks:
      - label: The cards have 24px of padding
        selector: .card
        style: { property: padding-top, value: 24px }
      - label: The cards have 16px of margin below
        selector: .card
        style: { property: margin-bottom, value: 16px }
    solution:
      css: |
        body { font-family: sans-serif; }
        .card {
          background: honeydew;
          border: 2px solid darkgreen;
          padding: 24px;
          margin-bottom: 16px;
        }
    hints:
      - Both declarations go inside the `.card` rule.
      - Padding is inside the border, so it pushes the text in.
      - 'Add `padding: 24px;` and `margin-bottom: 16px;`.'

  - type: prose
    id: what-width-measures
    body: >-
      Now give a box a `width`. By default, `width` sets the content alone. Padding and border
      are added on top of it.


      So a card with `width: 100%` gets content as wide as its parent. Its padding and border
      then sit outside that, on both sides.

  - type: multiple-choice
    id: pick-why-too-wide
    concept: css.box-model
    difficulty: 2
    language: css
    code: |
      .card {
        width: 100%;
        padding: 16px;
        border: 1px solid grey;
      }
    question: On a phone, this card sticks out past the right edge. Why?
    choices:
      - text: Padding and border are added on top of the width
        correct: true
        feedback: >-
          Right. `width` sizes the content alone, so the extras push past the edge.
      - text: '`100%` means the width of the whole window'
        feedback: >-
          It means the width of the parent. The card's content is exactly that wide.
      - text: The border is drawn outside the page
        feedback: >-
          The border sits around the padding. Together they add width beyond the content.

  - type: prose
    id: border-box
    body: |-
      `box-sizing: border-box` changes what `width` measures. It then covers content, padding
      and border together, and the content shrinks to make room. A 100% card fits exactly.

      Most sites switch it on for every element, first thing in their CSS. The `*` selector
      matches everything:

      ```css
      * { box-sizing: border-box; }
      ```

  - type: playground
    id: fit-the-card
    concept: css.box-sizing
    difficulty: 2
    prompt: >-
      The black frame is a 300px phone, and the card sticks out of it. Add
      `box-sizing: border-box;` to `.card` and watch it snap inside.
    html: |
      <div class="phone">
        <div class="card">
          <h2>Fern</h2>
          <p>Keep the soil damp and the air humid.</p>
        </div>
      </div>
    css: |
      body { font-family: sans-serif; }
      .phone {
        width: 300px;
        border: 2px solid black;
      }
      .card {
        width: 100%;
        padding: 16px;
        border: 4px solid darkgreen;
        background: honeydew;
      }
    editable: [css]
    checks:
      - label: The card uses border-box
        selector: .card
        style: { property: box-sizing, value: border-box }
    solution:
      css: |
        body { font-family: sans-serif; }
        .phone {
          width: 300px;
          border: 2px solid black;
        }
        .card {
          box-sizing: border-box;
          width: 100%;
          padding: 16px;
          border: 4px solid darkgreen;
          background: honeydew;
        }
    hints:
      - The fix goes on the card, not on the phone.
      - The padding and border are added on top of the 300px width.
      - 'Add `box-sizing: border-box;` inside the `.card` rule.'

  - type: prose
    id: collapse-rules
    body: >-
      When two vertical margins touch, they **collapse**: they merge into one, the size of the
      larger. A 24px margin above a 16px one leaves a 24px gap, not 40px.


      It also happens between a box and its first child. The child's top margin escapes and
      pushes the whole box down. Padding or a border on the box stops that, and so does
      `display: flow-root`.

  - type: lab
    id: lab-margin-explorer
    concept: css.margin-collapse
    lab: box-model-explorer
    preset:
      scenario: stacked-paragraphs
      hideSwitcher: true
    intro: >-
      Two paragraphs, one on top of the other. Change their margins and watch the gap between
      them. Then try the parent settings, and see which ones keep the margins apart.
    checkpoint:
      question: >-
        The first paragraph has 24px of margin below it. The second has 16px above it. How big
        is the gap?
      difficulty: 2
      choices:
        - text: 24px
          correct: true
          feedback: >-
            Right. The two margins merge, and the larger one wins.
        - text: 40px
          feedback: >-
            That's what most people expect. Touching vertical margins merge instead of adding
            up.
        - text: 16px
          feedback: >-
            The later margin doesn't win. They merge, and the result is the larger one.
    fallback:
      type: predict-output
      id: predict-sibling-margins
      concept: css.margin-collapse
      difficulty: 2
      language: html
      code: |
        <style>
          h2 { margin: 0 0 24px; }
          p { margin: 16px 0 0; }
        </style>
        <h2>About me</h2>
        <p>I make furniture from old wood.</p>
      question: How many pixels separate the heading from the paragraph?
      choices:
        - text: '24'
          correct: true
          feedback: >-
            Right. The two margins merge into one, and the larger one wins.
        - text: '40'
          feedback: >-
            That's what most people expect. But touching vertical margins merge instead of adding
            up.
        - text: '16'
          feedback: >-
            The later rule doesn't win here. The margins merge, and the result is the larger one.

  - type: playground
    id: stop-the-escaping-margin
    concept: css.margin-collapse
    difficulty: 3
    prompt: >-
      There's a white gap under the green banner, and the heading sits hard against the top of
      its card. The heading's margin escaped. Add `display: flow-root;` to `.card` and watch
      the gap move inside.
    html: |
      <div class="banner">Plant care</div>
      <div class="card">
        <h2>Fern</h2>
        <p>Keep the soil damp.</p>
      </div>
    css: |
      body { margin: 0; font-family: sans-serif; }
      .banner { background: darkgreen; color: white; padding: 16px; }
      .card { background: honeydew; }
      .card h2 { margin-top: 32px; }
    editable: [css]
    checks:
      - label: The card holds its margins in
        selector: .card
        style: { property: display, value: flow-root }
    solution:
      css: |
        body { margin: 0; font-family: sans-serif; }
        .banner { background: darkgreen; color: white; padding: 16px; }
        .card { background: honeydew; display: flow-root; }
        .card h2 { margin-top: 32px; }
    hints:
      - The fix goes on the parent, the card, not on the heading.
      - The margin escapes because nothing sits between it and the card's edge.
      - 'Add `display: flow-root;` inside the `.card` rule.'

  - type: explain-back
    id: explain-card-overflow
    concept: css.box-sizing
    difficulty: 3
    prompt: >-
      A card with `width: 100%` and some padding sticks out past the edge of a phone. Why,
      and why does `border-box` fix it?
    rubric:
      - By default `width` sizes only the content, so 100% makes the content as wide as the parent.
      - Padding and border are then added outside, so the box is wider than its parent.
      - With `border-box`, `width` covers padding and border, and the content shrinks to make room.
    modelAnswer: >-
      By default, `width` only sizes the content. So 100% makes the content as wide as the
      phone, and the padding and border are added on top. `border-box` changes what `width`
      measures. The whole box, padding and border included, becomes as wide as the phone, and
      the content shrinks to make room.

recap:
  - Space a box with padding, a border and margin.
  - Work out a box's width, and make it fit with `border-box`.
  - Spot collapsing margins, and keep a child's margin inside its parent.

recall:
  - id: card-box-layers
    concept: css.box-model
    front: Name the four layers of a box, from the inside out.
    back: >-
      Content, padding, border, margin. A background fills content and padding, never the
      margin.
  - id: card-border-box-width
    concept: css.box-sizing
    front: What does `width` measure with `content-box`, and with `border-box`?
    back: >-
      With `content-box`, the default, only the content. With `border-box`, the content,
      padding and border together.
  - id: card-collapse-arithmetic
    concept: css.margin-collapse
    front: Two touching vertical margins are 24px and 16px. How big is the gap?
    back: >-
      24px. Touching vertical margins collapse into one, the size of the larger.
  - id: card-stop-parent-child-collapse
    concept: css.margin-collapse
    front: A heading's top margin pushes its whole card down. What stops that?
    back: >-
      Padding or a border on the card, or `display: flow-root`. Each puts something between
      the margin and the card's edge.

