term: recall at k
aka: [recall@k, hit rate at k]
short: The share of relevant passages for a question that appear among the top k search results.
explain: |
  A RAG answer can only be as good as the passages it was given. So test the search on its
  own. For each labelled question, check whether the right passages made the top five, or
  ten.

  It measures retrieval apart from the model's writing. A low score means fix chunking,
  embeddings or the reranker first. A better prompt won't save an answer whose sources were
  never found.
analogy: Checking whether the right books made it to the reading table, before judging the essay.
usage: Recall at k is 0.6, so four in ten answers never see the right policy page.
related: [rag, reranking, recall, eval, faithfulness]
level: 3
lessons: [sysdesign.case-ai-assistant]
