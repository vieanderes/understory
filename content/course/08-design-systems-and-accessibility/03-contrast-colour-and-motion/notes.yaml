summary: >-
  This lesson is about perception: can people see the text, tell the states apart and use the
  page without feeling ill? WCAG turns each of those into a measurable rule. Text needs a
  contrast ratio of 4.5 to 1 against its background, large text 3 to 1, and the parts of
  controls and graphics people need to see also 3 to 1. Colour may support a message but
  never carry it alone. Motion that isn't needed must be avoidable.


  The contrast ratio isn't a judgement call. It comes from a formula over **relative
  luminance**, the lightness of a colour as the eye weighs it, so you can compute it in ten
  lines, test it in CI and settle arguments with a number. The number has limits: it ignores
  font weight beyond the large text rule, and it can't say whether a design is pleasant.


  Operating systems also let people state preferences, and CSS can read them:
  `prefers-reduced-motion` for less movement, `prefers-contrast` for more or less contrast,
  and `forced-colors` when a high contrast theme replaces your palette. A page that respects
  them works for people the default design never considered.
remember:
  - Body text needs 4.5 to 1 contrast and large text 3 to 1 (1.4.3 Contrast (Minimum), AA), and AAA raises them to 7 and 4.5.
  - Large text means at least 18 point, about 24 CSS pixels, or 14 point bold, about 18.67 CSS pixels.
  - Borders, icons, focus rings and chart lines that people need to see need 3 to 1 against what's next to them (1.4.11 Non-text Contrast, AA).
  - The ratio is `(L1 + 0.05) / (L2 + 0.05)`, with the lighter colour's relative luminance on top, so it runs from 1 to 21.
  - Compare the raw ratio with the threshold and never round, because 4.48 is a fail even if it looks like 4.5.
  - Colour must never be the only way to tell something apart (1.4.1 Use of Color, A), so add words, icons or underlines.
  - 'Write motion inside `@media (prefers-reduced-motion: no-preference)`, so people who asked for less never get it.'
  - In forced colours mode the browser swaps your colours for system colours and drops box shadows, so draw essential lines with borders and outlines, and SVG icons with `currentColor`.
sections:
  - title: The contrast formula, runnable
    body: |-
      Relative luminance undoes the gamma of sRGB, then weights the three channels by how
      bright each looks to the eye. Green counts most, blue least. The contrast ratio then
      compares two luminances, with 0.05 added to each so black on black gives 1 rather than
      a division by zero.

      ```js
      // WCAG 2.2 relative luminance and contrast ratio for sRGB hex colours.
      function linear(channel8bit) {
        const c = channel8bit / 255;
        return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      }

      function luminance(hex) {
        const n = parseInt(hex.slice(1), 16);
        const r = (n >> 16) & 255;
        const g = (n >> 8) & 255;
        const b = n & 255;
        return 0.2126 * linear(r) + 0.7152 * linear(g) + 0.0722 * linear(b);
      }

      function contrast(a, b) {
        const [lighter, darker] = [luminance(a), luminance(b)].sort((x, y) => y - x);
        return (lighter + 0.05) / (darker + 0.05);
      }

      // Compare the raw ratio. 4.499 prints as 4.50 but still fails.
      function check(text, background, { large = false } = {}) {
        const ratio = contrast(text, background);
        const needed = large ? 3 : 4.5;
        return `${text} on ${background}: ${ratio.toFixed(2)} ${ratio >= needed ? 'pass' : 'fail'}`;
      }

      console.log(check('#9ca3af', '#ffffff')); // #9ca3af on #ffffff: 2.54 fail
      console.log(check('#777777', '#ffffff')); // #777777 on #ffffff: 4.48 fail
      console.log(check('#767676', '#ffffff')); // #767676 on #ffffff: 4.54 pass
      console.log(check('#777777', '#ffffff', { large: true })); // #777777 on #ffffff: 4.48 pass
      console.log(check('#ffffff', '#0f766e')); // #ffffff on #0f766e: 5.47 pass
      console.log(contrast('#000000', '#ffffff').toFixed(2)); // 21.00
      ```

      The weights explain a lot of real bugs. Pure green, `#00ff00`, has a luminance of 0.7152
      and pure blue 0.0722, so blue text on black is nearly unreadable while yellow on white
      almost vanishes. It also shows why a tint that "looks dark enough" can fail: our eyes
      judge hue and saturation as well, but the formula only counts lightness.

      A function like this belongs in your token tests. Loop over every text role against
      every surface role, in every theme, and fail the build below 4.5. That's cheaper than
      finding it in an audit.
  - title: Which pairs to check
    body: |-
      Contrast is checked for pairs that appear next to each other in normal use, and more of
      them count than people expect.

      - **Every text size and state.** Placeholder text, hints, disabled-looking but active
        buttons, hover and visited link colours, and text in both themes.
      - **Text over images and gradients.** Check the worst spot behind the letters, or put the
        text on a solid scrim.
      - **Control boundaries, when nothing else shows the control.** An empty input whose only
        sign is a pale grey border needs that border at 3 to 1 against the page. A button with
        visible text is identified by its text, so its edge is exempt, though a visible edge
        still helps people with cognitive disabilities. Its text needs 4.5 to 1 against the
        button's own background.
      - **State indicators.** The check in a checkbox, the selected tab's underline and the
        focus ring each need 3 to 1 against their neighbours.
      - **Meaningful graphics.** Chart lines and icons that carry information, but not
        decoration.

      Some things are exempt: text in a truly inactive control, pure decoration, text nobody can
      see, text inside a busy photo, and logos. Being exempt isn't a reason to aim low, though.
      A disabled button nobody can read leaves people unsure what it would have done.

      Large text is measured at the size delivered, so `font-size: 1.5rem` at the default 16
      pixel root is 24 pixels, large. Bold means a weight the font renders as bold, typically
      700.

      Some tools also report an APCA score, a newer model of perceived contrast. It isn't part
      of WCAG 2.2, so it can't replace the 4.5 and 3 checks in an audit.
  - title: 'Motion: opt in, not opt out'
    body: |-
      Movement on screen can trigger dizziness, nausea or migraines in people with vestibular
      disorders, and distract people with attention difficulties. WCAG has several rules here:
      **2.2.2 Pause, Stop, Hide** (A) for anything that moves by itself for more than five
      seconds, **2.3.1 Three Flashes or Below Threshold** (A), and **2.3.3 Animation from
      Interactions** (AAA), which asks that motion triggered by interaction can be turned off.

      The safest CSS is to write motion only for people who haven't asked for less, and give a
      calmer version to those who have:

      ```css
      .toast { opacity: 1; }

      @media (prefers-reduced-motion: no-preference) {
        .toast { transition: transform 300ms ease-out, opacity 300ms; }
        html { scroll-behavior: smooth; }
      }

      @media (prefers-reduced-motion: reduce) {
        .toast { transition: opacity 150ms; }
      }
      ```

      With the setting on, Chromium computed the toast's transition as `opacity` only and
      `scroll-behavior` as `auto`. Reduced motion doesn't mean no feedback: a short fade or a
      colour change still tells people something happened, without sliding or zooming.

      JavaScript animation needs the same check, and it should react if the setting changes
      while the page is open:

      ```js
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      let animate = !reduce.matches;
      reduce.addEventListener('change', (event) => {
        animate = !event.matches;
      });
      ```

      Carousels and autoplaying video need a visible pause control whatever the setting,
      because 2.2.2 applies to everyone.
  - title: prefers-contrast and forced colours
    body: |-
      **`prefers-contrast`** reports `more`, `less`, `custom` or `no-preference`. It suits
      small, targeted changes, such as darkening borders and muted text:

      ```css
      @media (prefers-contrast: more) {
        :root { --border: #1b1d2e; --ink-muted: #1b1d2e; }
      }
      ```

      **`forced-colors: active`** is stronger. It means the user's system, often a Windows
      contrast theme, has replaced your palette with a few system colours. Checking a small
      page in Chromium with forced colours emulated:

      ```text
      text colour #b91c1c            → rgb(0, 0, 0)
      button background #3a41b8      → rgb(255, 255, 255)
      border 2px solid transparent   → rgb(0, 0, 0)
      outline 2px solid transparent  → rgb(0, 0, 0)
      box-shadow on a card           → none
      SVG rect with fill="#b91c1c"   → rgb(185, 28, 28), unchanged
      ```

      Three habits follow. Draw essential lines with borders and outlines, never box shadows
      alone; a transparent border on a filled button costs nothing and becomes its edge in
      forced colours. Give SVG icons `fill="currentColor"`, so they follow the forced text
      colour instead of keeping a literal one that may be invisible on the user's background.
      And if you must adjust something, use the system colour keywords such as `Canvas`,
      `CanvasText`, `LinkText`, `ButtonText` and `Highlight`:

      ```css
      @media (forced-colors: active) {
        .badge { border: 1px solid CanvasText; }
      }
      ```

      `forced-color-adjust: none` opts an element out of the palette swap. Keep it for rare
      cases where the colour is the content, such as colour swatches in a shop, and never put
      it on text.
pitfalls:
  - '**Rounding a ratio up.** `4.48` shown as `4.5` passes nobody''s checker. Compare the unrounded value, and pick `#767676` over `#777777` on white.'
  - '**Checking only the light theme.** A palette colour that passes on white can sit at 2 to 1 on a dark surface. Test every text and surface role in every theme.'
  - '**Pale input borders.** A `#e5e7eb` border on white is almost invisible, so people can''t find the field. Non-text contrast asks for 3 to 1 on the boundary that identifies the control.'
  - '**Red and green as the only difference.** A status dot or a chart legend that relies on hue fails colour-blind people. Add text, a pattern or an icon shape.'
  - '**Removing all motion for `reduce`.** People asked for less movement, not less feedback. Swap slides and zooms for short fades.'
  - '**Focus rings drawn with box-shadow.** Forced colours mode removes shadows, and the ring disappears. Use `outline`, which the browser keeps and recolours.'
verify:
  - lens: breaks
    check: 'Every text and surface pair passes 4.5 to 1 in every theme, using the unrounded ratio.'
  - lens: breaks
    check: 'Input borders, icons and focus rings reach 3 to 1 against what sits next to them.'
  - lens: confuses
    check: 'No status, error or chart series is told apart by colour alone, without text, an icon or a pattern beside it.'
  - lens: tests
    check: 'Pages are checked with reduced motion turned on and in forced colours mode, where shadows disappear.'
interview:
  - question: How is the WCAG contrast ratio calculated, and why 4.5 to 1?
    answer: >-
      It's the ratio of the relative luminances of the lighter and darker colour, each plus
      0.05: `(L1 + 0.05) / (L2 + 0.05)`. Relative luminance linearises each sRGB channel and
      weights them about 21% red, 72% green and 7% blue, matching how bright each looks. The
      result runs from 1 to 21. The 4.5 to 1 threshold for body text at AA compensates for the
      loss of contrast sensitivity that comes with moderately low vision, and large text,
      from 24 CSS pixels or about 18.67 bold, gets 3 to 1 because bigger strokes are easier to
      see. The trade-off is that the formula only measures lightness, so two colours can pass
      and still be unpleasant, and very thin fonts can fail people even at 4.5.
  - question: Which parts of an interface need 3 to 1 contrast rather than 4.5 to 1?
    answer: >-
      Large text, and under 1.4.11 Non-text Contrast, anything visual people need to identify a
      control, its state or meaningful graphics. That means an input's border if it's the only
      thing showing where the field is, checkbox ticks, the selected tab indicator, focus rings,
      icons without text, and chart lines. A button with visible text doesn't need a
      contrasting edge, because the text already identifies it. Text inside
      those controls still needs 4.5 to 1 against its own background. Exempt are inactive
      controls, decoration and elements whose look the browser controls and you haven't
      changed. In practice I test pairs in all states and themes, because hover and dark mode
      are where failures hide.
  - question: How do you support people who are sensitive to motion?
    answer: >-
      I make motion opt-in with `@media (prefers-reduced-motion: no-preference)`, so the default
      for someone who asked for less is calm. For people with the setting on, I replace
      movement such as slides, parallax and zooms with short opacity fades, so feedback remains.
      In JavaScript I read `matchMedia('(prefers-reduced-motion: reduce)')` and listen for its
      `change` event, which also covers animation libraries. Independently of the setting,
      anything that moves by itself for more than five seconds, like a carousel, gets a pause
      control, because 2.2.2 Pause, Stop, Hide is level A for everyone. The trade-off is design
      effort: every animation needs a reduced version, which is a good reason to keep motion
      purposeful and few.
  - question: What is forced colours mode, and what breaks in it?
    answer: >-
      It's when the operating system, typically a Windows contrast theme, replaces page colours
      with a small palette of system colours, and CSS can detect it with `forced-colors:
      active`. The browser recolours text, backgrounds and borders, removes box shadows, and makes transparent borders and outlines visible.
      What breaks is anything that relies on those removed things: focus rings drawn with box
      shadows, buttons defined only by a background colour, and SVG icons with literal fills,
      which keep their colour and can vanish. The fixes are outlines for focus, a transparent
      border on filled controls, `currentColor` in icons, and system colour keywords such as
      `CanvasText` when you need to adjust. I avoid `forced-color-adjust: none` except where
      the colour itself is the content.
