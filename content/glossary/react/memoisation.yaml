term: memoisation
aka:
  - memoization
  - useMemo
  - memo
short: Remembering a calculation's result for given inputs, and reusing it until those inputs change.
explain: |
  Sorting ten thousand rows on every keystroke is wasteful if the rows didn't change.
  `useMemo(() => sort(rows), [rows])` keeps the sorted result until `rows` is a new array.
  `memo(Component)` skips drawing a child whose props are the same as last time.

  It costs memory and adds code, and it fails quietly: pass a fresh object or arrow each time
  and nothing is reused. Measure first. The React Compiler can now add most of it for you.
analogy: Writing an answer in the margin of your maths book. Same question, you read the margin instead of working it out again.
example:
  language: tsx
  code: |
    function Table({ rows, query }: { rows: Row[]; query: string }) {
      const visible = useMemo(
        () => rows.filter((r) => r.name.includes(query)),
        [rows, query],
      );
      return <List rows={visible} />;
    }
usage: The memoisation does nothing here, because the options object is new on every render.
