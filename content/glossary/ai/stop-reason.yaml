term: stop reason
aka:
  - stop_reason
  - finish reason
  - finish_reason
short: The reply field saying why a model stopped, such as finished, cut off or asking for a tool.
explain: |
  A reply can look complete and not be. The model may have run out of tokens halfway through a JSON object, or paused to ask for a tool.

  Every reply carries a field saying why it ended. "End of turn" means the model finished.
  "Max tokens" means you cut it off. "Tool use" means it wants your code to run a tool and
  send back the result.

  Check it before you use the text. Parsing a truncated reply gives a confusing error far from the cause. Ignoring a tool request
  leaves an agent loop stuck.
analogy: Why a phone call ended. You said goodbye, the battery died, or they put you on hold.
example:
  language: python
  code: |
    reply = client.messages.create(model=MODEL, max_tokens=500, messages=messages)
    if reply.stop_reason == "max_tokens":
        raise TruncatedReply(reply.usage.output_tokens)
    if reply.stop_reason == "tool_use":
        run_tools(reply.content)
usage: The JSON failed to parse because the stop reason was max_tokens; raise the limit or shorten the output.
