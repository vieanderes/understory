deepDive: >-
  **Dynamic segments.** `/recipes/[slug]` was `ƒ` because Next.js can't know every slug at
  build time. Export `generateStaticParams`, returning the slugs, and those pages are built
  ahead too.


  **Cache Components.** Setting `cacheComponents: true` in `next.config.ts` switches Next.js 16
  to a finer model. Parts of one page can be static while others wait for the request, and you
  mark what to cache with `'use cache'`. The caching lesson, after the databases chapter, uses
  it.


  **Revalidating on demand.** `revalidatePath('/weather')` in server code throws the saved page
  away at once, for example straight after someone edits the data.


  **The spectrum.** Static, revalidated, dynamic and client rendering sit on a line from "made
  once" to "made in each browser". Most real apps mix all four, page by page.
