id: nextserver.caching
title: Caching pages and data
objective: "Cache a slow read with `'use cache'`, give it a lifetime, and refresh it the moment data changes."
level: essential
minutes: 10
concepts:
  [nextserver.use-cache, nextserver.cache-life, nextserver.cache-tags, nextserver.client-cache]
prerequisites: [nextserver.server-actions, next.rendering-spectrum, db.sql-queries]
opening:
  text: >-
    You'll make a slow page fast for every visitor, and still show a change the moment it's
    saved. It's how busy sites stay quick without showing old numbers.

steps:
  - type: prose
    id: slow-on-every-visit
    body: |
      Picture a football league table. The page runs a query that takes 800 ms, and it runs
      again for every visitor. A thousand fans means a thousand identical queries.

      ```tsx
      export default async function TablePage() {
        const rows = await db.query('SELECT team, points FROM standings ORDER BY points DESC');
        return <LeagueTable rows={rows} />;
      }
      ```

      A **cache** keeps a result you've already worked out, so the next person gets it
      without the work.

  - type: prose
    id: use-cache
    body: |
      Next.js 16 caches nothing unless you ask. Turn on `cacheComponents: true` in
      `next.config.ts`, then put `'use cache'` at the top of the slow function:

      ```ts
      export async function getTable() {
        'use cache';
        return db.query('SELECT team, points FROM standings ORDER BY points DESC');
      }
      ```

      `next build` runs it once and keeps the result. We showed the read time on the page and
      opened it three times, minutes apart:

      ```text
      visit 1   Rovers: 33 points (read at 20:52:46)
      visit 2   Rovers: 33 points (read at 20:52:46)
      visit 3   Rovers: 33 points (read at 20:52:46)
      ```

  - type: parsons
    id: arrange-cached-read
    concept: nextserver.use-cache
    difficulty: 1
    language: ts
    prompt: >-
      The top scorers query is slow too. Cache it, so every visitor shares one result. Put the
      lines in order.
    blocks:
      - id: signature
        code: export async function getScorers() {
      - id: directive
        code: "'use cache';"
        indent: 1
      - id: query
        code: "return db.query('SELECT player, goals FROM scorers ORDER BY goals DESC');"
        indent: 1
      - id: close
        code: '}'
    distractors:
      - id: use-client
        code: "'use client';"
        feedback: >-
          That sends code to the browser. The cache lives on the server, so it's `'use cache'`.
      - id: use-server
        code: "'use server';"
        feedback: >-
          That makes a Server Action, which runs on every request. It keeps nothing.

  - type: prose
    id: lifetimes
    body: |
      A cached table can't stay forever. Call `cacheLife('hours')` inside the function to give
      it a lifetime with two limits:

      - **revalidate**, 1 hour: the next visitor still gets the old table, and the query runs
        again in the background.
      - **expire**, 1 day: the old table is thrown away, and the visitor waits for a fresh
        one.

      You can give the limits in seconds instead: `cacheLife({ revalidate: 3600, expire: 86400 })`.

  - type: code-challenge
    id: write-what-to-serve
    concept: nextserver.cache-life
    difficulty: 3
    language: ts
    prompt: >-
      Write the rule the server follows, as a function. `whatToServe(ageSeconds, life)` gets how
      old the kept result is, or `null` when nothing is kept, and a lifetime such as
      `{ revalidate: 3600, expire: 86400 }`.


      Return `'serve'` while the result is younger than `revalidate`. From `revalidate` on,
      return `'serve-and-refresh'`. From `expire` on, or with nothing kept, return
      `'wait-for-fresh'`. Any cache in front of a slow service, an AI model included, can use
      this rule.
    hints:
      - There are three answers. Decide which case to check first.
      - The visitor waits in two cases, nothing kept or too old, so check those together.
      - "Start with `if (ageSeconds === null || ageSeconds >= life.expire) return 'wait-for-fresh';`"

  - type: prose
    id: tags-and-updates
    body: |
      A referee enters a result. Waiting up to an hour to show it is too long.

      So label the cached result with `cacheTag('table')`. In the Server Action that saves the
      result, call `updateTag('table')`. Every result with that label is thrown away, and the
      next visit runs the query again. We pressed Save once:

      ```text
      before: Rovers: 33 points (read at 20:52:46)
      after:  Rovers: 36 points (read at 21:02:19)
      ```

  - type: fill-blank
    id: fill-tag-and-update
    concept: nextserver.cache-tags
    difficulty: 2
    language: ts
    prompt: Cache the fixtures list, and refresh it straight after a new fixture is saved.
    template: |
      // app/fixtures/data.ts
      export async function getFixtures() {
        '{{1}}';
        cacheLife('days');
        {{2}}('fixtures');
        return db.query('SELECT home, away, kick_off FROM fixtures ORDER BY kick_off');
      }

      // app/fixtures/actions.ts
      'use server';
      export async function addFixture(form: FormData) {
        await saveFixture(form);
        {{3}}('fixtures');
      }
    blanks:
      - key: '1'
        answer: use cache
      - key: '2'
        answer: cacheTag
      - key: '3'
        answer: updateTag
    bank: [use cache, use client, cacheTag, cacheLife, updateTag, connection]

  - type: lab
    id: lab-back-after-update
    concept: nextserver.client-cache
    lab: cache-layer-explorer
    intro: >-
      One more copy exists. Your browser keeps pages it has already shown, so Back is instant.
      That's the **client cache**, and it lives in each visitor's tab, not on the server.


      Step through a day on the league site and watch all four stores. Before each step, say
      which one answers.
    preset:
      route: /table
      cacheLife: hours
      cacheTag: table
      stores: [request-memo, use-cache-entry, prerendered-page, client-router-cache]
      timeline:
        - event: build
        - event: visit
          actor: A
          path: /table
        - event: navigate
          actor: A
          path: /fixtures
        - event: action
          call: updateTag('table')
        - event: back
          actor: A
        - event: visit
          actor: B
          path: /table
    checkpoint:
      question: >-
        Staff saved a result. Visitor A, in another tab, presses Back to `/table`. What do they
        see?
      difficulty: 3
      choices:
        - text: The old table, from their own tab
          correct: true
          feedback: >-
            Right. The server's copy was thrown away, but their tab kept its own.
        - text: The new table, because the tag was updated
          feedback: >-
            `updateTag` reaches the cache on the server. It can't reach a page sitting in
            someone else's browser.
        - text: A loading state, then the new table
          feedback: >-
            Back reuses the page the tab already holds. It doesn't ask the server, so nothing
            loads.
    fallback:
      type: predict-output
      id: predict-back-after-update
      concept: nextserver.client-cache
      difficulty: 3
      language: text
      code: |
        visitor A opens /table          # the tab keeps a copy for Back
        visitor A follows a link to /fixtures
        staff save a result             # the action calls updateTag('table')
        visitor A presses Back
      question: What does visitor A see?
      choices:
        - text: The old table, from their own tab
          correct: true
          feedback: >-
            Right. Their tab kept the page for Back, and the server can't change that copy.
        - text: The new table, because the tag was updated
          feedback: >-
            The tag reaches the cache on the server. Nothing pushes that change into another
            visitor's browser.
        - text: A full reload of the new table
          feedback: >-
            Back stays inside the app and reuses the stored page. Pressing reload is what
            asks the server again.

  - type: ai-review
    id: review-mismatched-tag
    concept: nextserver.cache-tags
    difficulty: 3
    language: ts
    request: When a referee saves a score, show the new league table straight away.
    flawClass: logic
    code: |
      // app/table/data.ts
      export async function getTable() {
        'use cache';
        cacheLife('hours');
        cacheTag('table');
        return db.query('SELECT team, points FROM standings ORDER BY points DESC');
      }

      // app/table/actions.ts
      'use server';
      export async function saveScore(form: FormData) {
        await recordScore(form);
        updateTag('standings');
      }
    prompt: >-
      An assistant wrote this. Its test waits two hours, then sees the new table. Referees see
      the old one. Tap the line at fault.
    lines: [13]
    reasons:
      - text: The tag it updates isn't the tag it cached under
        correct: true
        feedback: >-
          Yes. Nothing is labelled `standings`, so nothing is thrown away.
      - text: '`updateTag` must run before saving'
        feedback: >-
          Then the next visit could cache the old score again. Save first, then update. The
          name is the problem.
      - text: '`cacheLife(''hours'')` should be `cacheLife(''days'')`'
        feedback: >-
          A longer lifetime would keep the old table even longer. The update misses its
          target.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Save a score and expect the new table at once
          correct: true
          feedback: >-
            Yes. The old table shows, so the test fails.
        - text: Save a score, wait two hours, then read the table
          feedback: >-
            That's the test that passed. The lifetime ran out, which hides the missed update.
        - text: Check the action calls `updateTag`
          feedback: >-
            It does call it, with the wrong name. Only the result shows the miss.
    fix: |
      // app/table/actions.ts
      'use server';
      export async function saveScore(form: FormData) {
        await recordScore(form);
        updateTag('table');
      }

  - type: explain-back
    id: explain-two-copies
    concept: nextserver.client-cache
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      After `updateTag('table')`, a new visitor sees the new table, but someone pressing Back
      in an open tab doesn't. Why?
    rubric:
      - '`updateTag` throws away the cached result on the server, so the next request runs the query.'
      - The open tab kept its own copy of the page in the browser's client cache.
      - Back reuses that copy without asking the server, until the tab reloads.
    modelAnswer: >-
      There are two copies. `updateTag` throws away the server's cached table, so any new
      request runs the query and gets the new points. But the open tab kept the page it
      already showed, in its client cache. Back reuses that copy without asking the server at
      all, so it shows the old table until that tab reloads.

recap:
  - "Cache a slow read for every visitor with `'use cache'`."
  - Choose how long it lives with `cacheLife`, and know what revalidate and expire do.
  - "Refresh it the moment data changes with `cacheTag` and `updateTag`."

recall:
  - id: card-use-cache
    concept: nextserver.use-cache
    front: "What does `'use cache'` at the top of an async function do?"
    back: >-
      It keeps the function's result and reuses it for every visitor with the same arguments.
      It needs `cacheComponents: true`.
  - id: card-revalidate-expire
    concept: nextserver.cache-life
    front: What's the difference between a result past `revalidate` and one past `expire`?
    back: >-
      Past `revalidate`, the old result is served while a fresh one is made. Past `expire`, the
      visitor waits for a fresh one.
  - id: card-tag-refresh
    concept: nextserver.cache-tags
    front: How do you show a saved change at once on a cached page?
    back: >-
      Label the cached read with `cacheTag('name')`, and call `updateTag('name')` in the
      Server Action that saves.
  - id: card-back-copy
    concept: nextserver.client-cache
    front: Which copy of a page can't `updateTag` change?
    back: >-
      The copy already in a visitor's browser, kept for Back. It stays until that tab reloads.

