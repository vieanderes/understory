term: re-render
aka:
  - rerender
  - render
short: React calling a component function again to work out what it should show now.
explain: |
  Set state and React calls your component again with the new value. Its children are called
  again too. React compares the new description with the last one, then changes only the
  parts of the page that differ.

  Calling the function isn't the same as touching the page, so most of these are cheap. They
  get costly when a component does heavy work every time. Measure with the profiler before
  reaching for memoisation.
analogy: Redrawing a floor plan after moving one chair. You redraw the sheet, but only the chair moves in the real room.
example:
  language: tsx
  code: |
    function Clock() {
      const [now, setNow] = useState(Date.now());
      console.log('render'); // logs on every update
      return <p>{new Date(now).toLocaleTimeString()}</p>;
    }
usage: Typing in the search box re-renders the whole table, which is why it lags.
twin:
  term: reconciliation
  difference: A re-render is React calling your component again. Reconciliation is React comparing that result with the last one to decide what to change on the page.
related:
  - reconciliation
  - state
  - memoisation
level: 1
lessons:
  - react.ui-as-a-function-of-state
