deepDive: >-
  Some requests get a **preflight** first. Before a `PUT`, a `DELETE`, or a request with a JSON
  body or a custom header, the browser sends an `OPTIONS` request asking permission. The server
  answers with `Access-Control-Allow-Methods` and `Access-Control-Allow-Headers`, and only then
  does the real request go. A plain form-style `POST` has no preflight, which is why the one in
  this lesson reached the server straight away.


  `Vary: Origin` matters whenever the allowed origin changes per request. Without it, a shared
  cache could hand one origin's CORS answer to another.


  Tested in Chromium with a page on `localhost:8071` and an API on `127.0.0.1:8072`. With `*`
  and credentials, the request arrived with its cookie, and the console said the header "must
  not be the wildcard '*' when the request's credentials mode is 'include'".
