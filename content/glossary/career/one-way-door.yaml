term: one-way door
aka:
  - irreversible decision
  - one-way-door decision
short: A decision that is hard or impossible to undo once made, so it deserves slow, careful evidence.
explain: |
  Deleting data, publishing an API that others build on, signing a three-year contract. Once
  you walk through, there's no walking back without great cost.

  These earn time: evidence, a review, a written record, and someone arguing the other side.
  Ask too whether you can make it reversible, with a soft delete, a version number or a trial.

  The trap runs both ways. Treat every decision like this and the team crawls. Treat this
  one casually and you live with it for years.
analogy: Getting a tattoo, as opposed to dyeing your hair.
usage: Dropping the column is a one-way door; rename it first and delete it next month once nothing reads it.
twin:
  term: two-way-door
  difference: A one-way door is hard to reverse, so it gets evidence and review. A two-way door is cheap to undo, so you decide fast and learn from the result.
