term: HTTP header
aka:
  - request header
  - response header
short: A named line of extra information sent before the body of a request or response.
explain: |
  The body is the content: a page, some data, an image. But both sides need to know more
  about it. What format is it? How long may I keep it? Who's asking? Those details travel
  as named lines above the body.

  Each is `Name: value`, and names ignore case. `Content-Type` says what the body is,
  `Authorization` carries credentials, `Cache-Control` sets caching rules. Clients can
  send any name, so treat every incoming value as untrusted text.
analogy: The writing on the outside of an envelope. Address, postage, "fragile". None of it is the letter, yet all of it decides how the letter is handled.
example:
  language: http
  code: |
    HTTP/1.1 200 OK
    Content-Type: application/json
    Cache-Control: private, max-age=60
    Set-Cookie: session=a81f; HttpOnly; Secure
usage: The proxy strips unknown headers, so our tracing HTTP header never reaches the app.
related:
  - http
  - cookie
  - cache-control
level: 2
lessons: [backend.http-in-depth, js.requests-and-responses]
