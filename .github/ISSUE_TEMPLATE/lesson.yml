name: Lesson correction or idea
description: A mistake in a lesson, an unclear explanation, or a lesson that is missing.
labels: [content]
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson
      description: The lesson URL, or the chapter a new lesson would belong to.
      placeholder: /learn/python/lists-and-tuples
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong or missing
      description: Quote the text or step, and say what it should be.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to documentation or a primary source that backs the correction.
