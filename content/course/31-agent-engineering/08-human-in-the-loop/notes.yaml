summary: >-
  An approval step is only as good as the person doing it. Put people in front of every
  action and they approve without reading; put them in front of a confident machine and
  they defer to it. This lesson designs the human side of an agent so their attention lands
  where it matters and their answers make the agent better.


  Four pieces carry the design. **Checkpoints placed by risk**, shown in a **risk-ranked
  queue** with a deadline per risk level. A review card that offers **suggest, edit,
  accept**, with a diff and the sources the proposal rests on. **Interrupt and resume**, so
  a run waits days for a decision or an answer to a clarifying question without holding a
  worker. And guards against **automation bias**: nothing pre-ticked, evidence on screen,
  sample audits and a realistic workload.


  Every decision is then kept twice: as a **labelled example**, because an edit is the best
  ground truth an agent will ever get, and as an accountable record of who approved what.
remember:
  - Place checkpoints by risk, on costly, irreversible or unusual actions, because approving everything trains people to stop reading.
  - Rank the review queue by expected harm, risk times uncertainty, with a deadline per risk level that lets overdue items jump ahead.
  - Show each proposal as a diff with its sources and an edit box, so checking and fixing are both quick.
  - A run waiting for a person saves its state and ends, and the decision event resumes it, so no worker sleeps on an approval.
  - When the request is ambiguous, the agent asks a clarifying question through the same pause, instead of guessing.
  - Never pre-tick approval, and measure reading with sample audits, because a high approval rate can't tell a good agent from a sleepy reviewer.
  - Store every edit and rejection as a labelled example, with the reviewer and harness version, so it feeds evals.
  - No answer before the deadline means no action, and the run ends with a clear status.
sections:
  - title: What a good review card shows
    body: |-
      A reviewer has seconds, so the card does the work of making a mistake visible.

      - **The change, as a diff.** "Move Year 9 maths from Tuesday P2 to Friday P5" with
        before and after side by side, not a paragraph describing it.
      - **Why the agent proposed it.** The user's request, in their words, and the sources:
        the rule, the email or the record each claim rests on, linked so the reviewer can
        check one in a click.
      - **Why it reached a person.** "Moves a lesson into the last period on Friday" or
        "order over £200". It tells the reviewer what to look at.
      - **Uncertainty, honestly.** If the agent's confidence is calibrated, show it in
        words or a band. If it isn't, leave it out: a confident number on a wrong
        proposal is the strongest push towards rubber-stamping.
      - **Three actions.** Approve, edit, reject, none selected. Edit opens the proposal
        for changes, and reject asks for a short reason from a list plus free text.

      Leave out what doesn't help the decision. A card with twenty fields gets skimmed. A
      card that shows the one thing that would make this wrong gets read.
  - title: Interrupt and resume, step by step
    body: |-
      The pattern is the same for approvals and clarifying questions.

      ```python
      RUNS, PENDING = {}, {}

      def pause(run, kind, payload):
          run["status"] = f"awaiting_{kind}"
          RUNS[run["id"]] = run                      # durable storage in production
          PENDING[run["id"]] = {"kind": kind, "payload": payload}
          return run["status"]

      def on_answer(run_id, answer):
          if run_id not in PENDING:
              return "ignored: nothing pending"      # a late or duplicate answer
          PENDING.pop(run_id)
          run = RUNS[run_id]
          run["history"].append({"answer": answer})
          run["status"] = "running"
          return "resumed"

      run = {"id": "cake-88", "history": [], "status": "running"}
      print(pause(run, "question", "Two tiers or three?"))
      print(on_answer("cake-88", "Three"))
      print(on_answer("cake-88", "Three"))           # the double click
      # awaiting_question
      # resumed
      # ignored: nothing pending
      ```

      Three details matter in production. The saved call that awaits approval is replayed
      exactly on resume, never re-asked of the model, as Loops that run for hours showed.
      Approvals expire: a job checks deadlines, and an expired one ends the run with
      `approval_expired`, telling the user. And answers are idempotent: a double click or a
      late answer to a finished run is recorded and ignored.

      Ask clarifying questions when two readings of a request lead to different actions,
      and a wrong guess costs more than a short wait. Ask one question with choices, not an
      open essay.
  - title: Automation bias and how to measure it
    body: |-
      **Automation bias** is the habit of accepting what an automated system proposes, and
      of not looking for problems it didn't flag. It grows with the system's reliability:
      an agent that's right 99 times in 100 teaches people to stop checking, so the hundredth
      sails through.

      Design against it:

      - Make approval an action, never a default. Nothing pre-ticked, no "approve all".
      - Show evidence, not only a verdict. A reviewer who sees the rule can spot the clash.
      - Keep the human band narrow, with thresholds chosen from data, so each item deserves
        attention.
      - Vary the work. Long runs of identical approvals dull attention fastest.

      Then measure it. A **sample audit** has a second reviewer re-check a random slice of
      approved items. The rate at which they disagree estimates what the first pass misses.
      **Seeded items**, known-bad proposals placed in the queue, measure detection directly.
      Watch the **edit rate** and **time per item**: an edit rate near zero with a median of
      three seconds is rubber-stamping, however good the agent is.

      Workload sits under all of it. Count items per reviewer per hour. If the queue outgrows
      the team, raise the bar for what reaches people. Asking them to go faster turns review
      into ceremony.
  - title: Corrections as ground truth, and accountability
    body: |-
      Reviewers produce the best labels an agent team will ever get: real requests, real
      proposals and an expert's judgment, at no extra cost. Most teams throw them away.

      Store each decision with the request, the proposal, the final version, the verdict
      and reason, the reviewer and the harness version. Then use them three ways.

      - **Eval cases.** Every edited or rejected proposal is a case the agent got wrong.
        Add a sample to the eval set, redacted, with the final version as the expected
        result, as Evals in depth grew sets from production traces.
      - **Trend lines.** Edit and rejection rates per harness version show whether a
        change helped, sooner than any survey.
      - **Thresholds.** The verdicts are labelled data for choosing which risk and
        confidence bands need a person at all.

      Be careful with one bias in the labels: people only see what the agent sent them.
      Proposals that ran without review never get a verdict, so sample some of those for
      review too.

      The same record answers the accountability question. Any action traces back to the
      run that proposed it, the person who approved it, what they saw and when. That
      protects reviewers as much as users: a decision made on the evidence shown is
      defensible.
pitfalls:
  - '**Approving every action.** It feels safest, and it trains reviewers to click without reading. Put checkpoints on risky actions only.'
  - '**First come, first served.** A harmless item that arrived first delays a risky one. Rank by risk and uncertainty, with deadlines.'
  - '**Waiting in memory.** A sleeping loop holds a worker for hours and dies with the next deploy. Save state, end the run and resume on the decision.'
  - '**Pre-ticked approval.** The default wins most of the time. Make every decision an action.'
  - '**Reading the approval rate as quality.** 99.6% fits a great agent and a sleepy reviewer equally. Audit a sample with a second reviewer.'
  - '**Throwing edits away.** Each edit is a free, expert label. Store it with the reviewer and harness version and feed it to evals.'
  - '**Guessing an ambiguous request.** A wrong guess at a cake size costs more than one short question. Pause and ask, with choices.'
verify:
  - lens: scales
    check: With more pending approvals than workers, new requests still start, because waiting runs hold no worker.
  - lens: breaks
    check: An approval that arrives after its deadline, or twice, leaves the run unchanged and is recorded.
  - lens: confuses
    check: Every review card says why the item reached a person, so reviewers know what to check first.
  - lens: tests
    check: A test ranks a queue with an overdue low-risk item, a fresh risky one and ties, and checks the order.
  - lens: leaks
    check: Labelled corrections are redacted before they join the eval set, since reviewers' edits often contain personal data.
interview:
  - question: How would you design the approval step for an agent that takes real actions?
    answer: >-
      I'd start from the reviewer's attention, because that's the scarce resource. Only
      risky actions reach a person: costly, irreversible or unusual ones, chosen from
      labelled data rather than gut feel. They arrive in a queue ranked by expected harm,
      risk times uncertainty, with a deadline per risk level. Each card shows the change as
      a diff, the sources behind it, why it was flagged, and approve, edit or reject with
      nothing pre-selected. The run saves its state and ends while it waits, and resumes on
      the decision. No answer by the deadline means no action. Every decision is stored as a
      labelled example with the reviewer, for evals and accountability. The trade-off is
      latency on flagged actions, which users accept if the band is narrow.
  - question: What is automation bias, and how do you know if your reviewers have it?
    answer: >-
      It's the tendency to accept what an automated system proposes and to stop looking for
      what it missed. It gets worse as the system gets more reliable, because checking a
      system that's nearly always right feels pointless. You can't see it in the approval
      rate, since a high rate fits a good agent too. I'd measure it directly: a second
      reviewer re-checks a random sample of approvals, and the disagreement rate estimates
      what the first pass misses. Seeded known-bad items measure detection outright. Then
      I'd watch time per item and the edit rate. The fixes are design ones: no defaults,
      evidence on the card, a narrow human band and a realistic workload.
  - question: Your agent has to wait for human approval, sometimes for days. How do you build that?
    answer: >-
      As interrupt and resume, not as a loop that waits. At the checkpoint the harness
      writes the run's state and the exact pending call to durable storage, marks the run
      `awaiting_approval`, creates the review item and ends the process. When the reviewer
      decides, an event loads the state and replays that saved call, or stops on a
      rejection. A scheduled job expires approvals past their deadline and tells the user.
      Answers are idempotent, so a double click or a late answer is ignored. This holds
      no worker while waiting, survives deploys, and the same mechanism serves clarifying
      questions. The cost is more moving parts: storage, an event path and expiry.
  - question: How would you use human reviewers' decisions to improve an agent?
    answer: >-
      Treat every decision as a label. I store the request, the proposal, the final version,
      the verdict and reason, the reviewer and the harness version. Edited and rejected
      proposals become eval cases, redacted, with the final version as the expected answer,
      so the next harness change is tested on exactly the mistakes people caught. Edit and
      rejection rates per version show whether changes helped. The verdicts also tune which
      risk and confidence bands need review. One caution: reviewers only see flagged items,
      so I'd sample some auto-approved actions for review as well, or the labels will miss
      the agent's confident mistakes.
