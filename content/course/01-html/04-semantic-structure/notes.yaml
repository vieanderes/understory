summary: >-
  A sighted visitor understands a page from how it looks. A screen reader user can't. A screen reader is an app that reads the page aloud, so
  the browser, the app that displays the page, gives it a description instead: the
  **accessibility tree**. It's built
  from the DOM, the tree of objects the browser makes from your HTML. It lists each
  meaningful element with a role, like button or heading, and a name, like "Borrow". Styling
  never reaches it. Only your choice of element does.


  That's what "semantic HTML" means in practice: pick the element whose built-in meaning
  matches the job. A `button` is announced as a button, reached with the Tab key and pressed
  with Enter or Space, all without a line of JavaScript. `header`, `nav`, `main` and `footer`
  mark the regions of a page, so people can jump straight to the content. Headings form an
  outline they can skim by ear. A `div` does none of this: it's a box with no meaning, fine
  for grouping things to style, wrong for anything people interact with or navigate by.


  Getting this right is cheap when you write the markup and expensive to fix later. It's
  also the part of accessibility interviewers ask about most, because it shows whether you
  know what the browser gives you for free.
remember:
  - Screen readers work from the accessibility tree, which lists each element's role, name and state, built from the DOM and untouched by styling.
  - The role comes from the element, so a `div` with a class like "button" is still plain text to a screen reader.
  - A `button` brings its role, focus with the Tab key, and presses with Enter and Space, while a clickable `div` brings none of them.
  - Use a link, `a` with `href`, to go somewhere, and a `button` to do something on the page.
  - '`header`, `nav`, `main` and `footer` are landmarks people can jump between, and each page has one `main`.'
  - A control with only an icon needs a name, from the image's `alt` text or from `aria-label`.
  - Heading levels come only from the tag, so an `h1` inside a `section` is still announced as level 1.
  - Prefer the native element to ARIA, because a `role` attribute changes what's announced and nothing about how the element behaves.
sections:
  - title: 'Role, name and state: what a screen reader gets'
    body: |-
      Each entry in the accessibility tree answers three questions. What is it? That's the
      **role**. What's it called? That's the **name**. What condition is it in? That's the
      **state**, such as a checkbox being ticked. A screen reader reads those out, for example
      "Gift wrap, checkbox, checked".

      Here's a small page and the tree Chrome builds for it, as the Playwright test tool
      reports it:

      ```html
      <h1>City Library</h1>
      <button>Borrow</button>
      <button><img src="/icons/bin.svg" alt="Remove"></button>
      <button aria-label="Close">X</button>
      <div class="button">Renew</div>
      ```

      ```text
      heading "City Library" [level=1]
      button "Borrow"
      button "Remove"
      button "Close"
      text: Renew
      ```

      Notice where each name came from. A heading or a button takes its name from its text.
      An image inside a button gives the button its `alt` text. The `aria-label` attribute,
      a name you set by hand, wins over the text inside: the visible "X" is ignored. The
      styled `div` has no role at all, so its word is read as ordinary text.

      You can see this tree yourself. In Chrome's developer tools, the inspection panels built
      into the browser, the Elements panel has an Accessibility pane that shows the role and name of the selected element.

      The Web Content Accessibility Guidelines (WCAG) 2.2 make this a requirement. Success
      criterion 4.1.2, Name, Role, Value, level A, says every control must expose its name
      and role to assistive technology. A native element does that for you. A `div` doesn't.
  - title: What a real button does for free
    body: |-
      Here's a test run in Chrome with a keyboard only. The page holds a real `button`, then
      a `div` given the role by hand and made focusable with `tabindex="0"`. Both have a
      click handler, a function that runs on click.

      ```html
      <button>Borrow</button>
      <div role="button" tabindex="0">Renew</div>
      ```

      ```text
      Tab     focus moves to Borrow
      Enter   Borrow's click handler runs
      Space   Borrow's click handler runs
      Tab     focus moves to Renew
      Enter   nothing happens
      Space   nothing happens
      ```

      The fake button is announced correctly and can take focus, but it can't be pressed
      from the keyboard. To finish it, you'd have to write code for Enter and Space, handle a
      disabled state, and keep the focus outline visible. Teams often miss one of those, and
      keyboard users are stuck. WCAG 2.2 success criterion 2.1.1, Keyboard, level A, requires
      everything to work from a keyboard.

      Links and buttons also differ from each other, and keyboard users rely on it. In
      Chrome, Enter follows a link, while Space scrolls the page and leaves the link alone.
      A button answers both keys. Screen readers announce them differently too, so people
      expect a link to take them somewhere and a button to act where they are.

      So the rule is: if it goes to another page or another place on the page, it's an `a`
      with an `href`. If it does something here, like adding to a cart, opening a menu or
      submitting a form, it's a `button`. An `a` styled as a button is fine when it
      navigates. A `button` that navigates, or an `a href="#"` that runs a script, sends
      the wrong message.
  - title: Landmarks, and when they count
    body: |-
      Each landmark element has a role behind it. Chrome reports these:

      ```text
      header   ->  banner         (the site's top bar)
      nav      ->  navigation
      main     ->  main
      aside    ->  complementary  (related but separate content)
      footer   ->  contentinfo    (the site's footer)
      section  ->  region, but only when it has a name
      ```

      Screen readers list landmarks and jump between them with a key press, so someone can
      go straight to `main` without hearing the menu on every page. That's one way to meet
      WCAG 2.2 success criterion 2.4.1, Bypass Blocks, level A, which asks for a way to skip
      content repeated on every page.

      Two details trip people up. First, `header` and `footer` are only page landmarks at the
      top level. Inside an `article`, `aside`, `main`, `nav` or `section` they belong to that
      part, and Chrome gives them no landmark role. That's intended: a blog post can have its
      own header without the page gaining a second banner.

      Second, when a page has two landmarks of the same kind, name them so people can tell
      them apart:

      ```html
      <nav aria-label="Main">
        <a href="/books">Books</a>
        <a href="/events">Events</a>
      </nav>
      <nav aria-label="Breadcrumb">
        <a href="/">Home</a>
        <a href="/books">Books</a>
      </nav>
      ```

      Chrome names them "Main" and "Breadcrumb", so a screen reader says something like
      "Main, navigation". Don't repeat
      the word "navigation" in the label, because the role already says it.

      A page has one visible `main`, holding what's unique to that page. Everything shared,
      like the logo, menu and footer, stays outside it.
  - title: One outline for the whole page
    body: |-
      Screen reader users often move by headings. In the common Windows screen readers, the H
      key jumps to the next heading and the numbers 1 to 6 jump to the next heading of that
      level. VoiceOver on Mac and iPhone offers a list of headings too. So your heading levels
      are a table of contents that people really use.

      For years, the HTML specification described an "outline algorithm". It would have made
      an `h1` inside a `section` count as a level 2 heading automatically. No browser or
      screen reader ever implemented it, and the HTML Living Standard dropped it in 2022.
      Chrome confirms it:

      ```html
      <h1>City Library</h1>
      <section>
        <h1>Events</h1>
      </section>
      ```

      ```text
      heading "City Library" [level=1]
      heading "Events" [level=1]
      ```

      Both are announced as level 1, so the page now has two top-level titles. Write the
      level you mean, `h2` here, wherever the heading sits.

      Two WCAG 2.2 criteria apply. 1.3.1, Info and Relationships, level A, requires a heading
      that looks like one to be marked up as one. 2.4.6, Headings and Labels, level AA,
      requires headings to describe their topic. "Events this month" helps someone scanning
      by ear; "More" doesn't.

      Search engines read the outline too. That's a bonus, not the reason: the outline is
      for people.
  - title: 'ARIA: a repair kit, not a starting point'
    body: |-
      ARIA, Accessible Rich Internet Applications, is a set of attributes that change the
      accessibility tree directly. You've seen two: `role` sets the role and `aria-label`
      sets the name. They're useful when HTML has no element for the job, and for naming
      things like icon buttons and duplicate landmarks.

      The W3C's guide to using ARIA opens with a rule: if a native HTML element does what
      you need, use it instead. The reason is that ARIA changes only what's announced. A
      `div` with `role="button"` is announced as a button, yet it still needs code for focus
      and keys. It makes a promise the element doesn't keep.

      `aria-label` needs care as well, because it replaces the visible text entirely:

      ```html
      <button aria-label="Reserve this book">Borrow</button>
      ```

      Chrome names this button "Reserve this book". A voice control user who says "click
      Borrow" may get nothing, because "Borrow" isn't in the name. WCAG 2.2 success
      criterion 2.5.3, Label in Name, level A, asks that the name contain the visible text.
      Here the fix is to drop the `aria-label` and let the text speak, or put the extra
      words in the visible label.

      A good habit: reach for ARIA last, and after adding it, check the name and role in the
      Accessibility pane of the developer tools.
pitfalls:
  - '**Making a `div` clickable.** It looks like a button, so it seems done. But it has no role, no focus and no keyboard support. Use `button`, and style it to look however you like.'
  - '**Trusting class names to carry meaning.** `class="heading"` is a label for styling, and the browser never reads meaning into it. The element decides the role.'
  - '**Leaving an icon button without a name.** An image with `alt=""` inside a button leaves the screen reader saying only "button". Give the image real `alt` text, or give the button an `aria-label`.'
  - '**Using `a href="#"` as a button.** It jumps to the top of the page, answers Enter but not Space, and is announced as a link. Use a `button` for actions.'
  - '**Adding `role="button"` and stopping there.** The role changes the announcement only. Without key handling, keyboard users can focus it and do nothing. Prefer the native element.'
  - '**Letting sections reset the heading levels.** An `h1` inside a `section` is still level 1. Write the level that matches the outline.'
verify:
  - lens: breaks
    check: 'Every clickable thing is a `button` or a link, never a `div` with a click handler, so keyboard and screen reader users can use it.'
  - lens: breaks
    check: 'ARIA is added only where no element does the job, because a wrong `role` hides what the element really is.'
  - lens: confuses
    check: 'The page has one `h1` and headings that never skip a level, so the outline makes sense to anyone listing them.'
  - lens: tests
    check: 'A pass with the keyboard alone reaches every control, shows where focus is and works each one without a mouse.'
  - lens: tests
    check: 'The accessibility tree in the developer tools shows each control with the right role and a name.'
interview:
  - question: Why use a button element instead of a div with a click handler?
    answer: >-
      Because `button` gives you the role, keyboard focus and keyboard activation for free,
      and a `div` gives you none of them. A screen reader announces a `button` as a button
      with its text as the name. The Tab key reaches it, and Enter and Space press it. Inside
      a form it can submit, and the `disabled` attribute works. To make a `div` equivalent,
      I'd add `role="button"`, `tabindex="0"`, key handlers for Enter and Space, and
      disabled handling, and small gaps would still creep in. That covers WCAG
      2.1.1, Keyboard, and 4.1.2, Name, Role, Value. The usual objection is styling, but a
      `button` can be restyled completely with CSS, the styling language. The only real reason for a custom
      control is a widget HTML has no element for, and then ARIA patterns apply.
  - question: What is the accessibility tree, and how does it relate to the DOM?
    answer: >-
      It's a second tree the browser derives from the DOM, holding what assistive technology
      needs: each meaningful node's role, name and state. The DOM has every element, including
      purely structural `div` elements. The accessibility tree drops or flattens nodes with
      no meaning, and leaves out hidden content and decorative images with `alt=""`. Roles
      come from the element, names come from content, `alt` text, labels or `aria-label`, and
      states come from attributes such as `checked` or `disabled`. Screen readers, voice
      control and switch devices all read this tree, never the pixels. So CSS can't make
      something a heading, and a class name can't make it a button. I check it in the
      Accessibility pane of Chrome's developer tools, and automated tests such as axe read it
      too.
  - question: How do you decide between a link and a button?
    answer: >-
      A link goes somewhere and a button does something. If activating it changes the
      address, moving to another page or a place on this page, it's an `a` with an `href`. If
      it acts on the current page, like adding to a cart, opening a dialog or submitting a
      form, it's a `button`. The difference is real for users. Screen readers announce them
      differently, people can open links in a new tab, and the keys differ: Enter follows a
      link, while a button answers Enter and Space. The mistakes are `a href="#"` with a
      click script, which is announced as a link and breaks opening in a new tab, and a
      `button` that navigates. Styling is separate: a link can look like a button when it's
      the main call to action, and that's fine.
  - question: What are landmarks, and how do you use them well?
    answer: >-
      Landmarks are the page regions assistive technology can list and jump to, and HTML
      creates them from `header`, `nav`, `main`, `aside`, `footer` and named `section`
      elements. A screen reader user can skip straight to `main` instead of hearing the menu
      on every page, which is one way to meet WCAG 2.4.1, Bypass Blocks. Using them well
      means a few rules. One `main` per page, holding the unique content. Page-level `header`
      and `footer` at the top level, because inside an `article` or `section` they don't count
      as landmarks. When there are two of a kind, like two `nav` elements, an `aria-label` on
      each, such as "Main" and "Breadcrumb". And not too many: a landmark for every small box
      turns a shortcut back into noise.
