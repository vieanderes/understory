id: arch.coupling-and-cohesion
title: Coupling, cohesion and information hiding
objective: Say where the line between two modules belongs, hide what's likely to change, and refactor a caller that reaches into another module.
level: essential
minutes: 10
concepts: [arch.coupling, arch.cohesion, arch.information-hiding]
prerequisites: [js.modules, js.closures]
opening:
  text: >-
    You'll look at two modules and say whether the line between them is in the right
    place. It's the skill that keeps a one-line change a one-line change.

steps:
  - type: prose
    id: what-architecture-is
    body: >-
      In the modules chapter you split code into files with `export` and `import`. Each
      file with one job is a **module**. What one module may see of another is the
      **module boundary** between them.


      **Architecture** is deciding where those boundaries go. Put them in the right place
      and most changes stay inside one module. Put them in the wrong place and every change
      spreads.

  - type: predict-output
    id: predict-array-to-map
    concept: arch.coupling
    difficulty: 1
    language: js
    code: |
      // cart.js, after this week's change: the array became a Map
      export const cart = {
        items: new Map([['tea', 2], ['mug', 1]]),
      };

      // checkout.js, written last year and not touched
      import { cart } from './cart.js';
      console.log(cart.items.length);
    question: Checkout used to log `2`. What does it log now?
    choices:
      - text: '`2`, as before'
        feedback: >-
          An array has a `length`. A `Map` counts with `size`, so `length` isn't there any
          more.
      - text: '`undefined`'
        correct: true
        feedback: >-
          Right. No error, no warning. Checkout broke without anyone opening its file.
      - text: It throws a `TypeError`
        feedback: >-
          If only. Reading a missing property gives `undefined`, quietly. That's what makes
          this kind of break slow to find.

  - type: prose
    id: name-coupling
    body: >-
      Checkout knew something it had no business knowing: that the cart keeps its items in
      an array. When that changed, checkout had to change too.


      That's **coupling**: how much a change in one module forces a change in another. Some
      is unavoidable, since modules exist to be used. The question is what they're coupled
      *to*.

  - type: prose
    id: name-information-hiding
    body: >-
      The cure is **information hiding**. Find the decision most likely to change, here how
      items are stored, and keep it inside the module. Outsiders call functions that won't
      change, such as `itemCount()`.


      ```js
      export function makeCart() {
        const items = new Map();   // private: only these functions see it
        return {
          add(name, qty) { items.set(name, (items.get(name) ?? 0) + qty); },
          itemCount() { return items.size; },
        };
      }
      ```

  - type: ai-review
    id: review-leaky-getter
    concept: arch.information-hiding
    difficulty: 2
    language: js
    request: Other modules read `cart.items` directly. Hide it behind a method.
    flawClass: logic
    code: |
      export function makeCart() {
        const items = [];
        return {
          add(name, pence) { items.push({ name, pence }); },
          getItems() { return items; },
          total() {
            let sum = 0;
            for (const item of items) sum = sum + item.pence;
            return sum;
          },
        };
      }
    prompt: >-
      An assistant wrote this. A promotions module called `getItems()`, then `pop()` on the
      list to preview a deal. The customer's mug vanished from the cart. Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: '`total` should use `reduce`'
        feedback: >-
          The loop adds up correctly. It summed what was in the array, and someone else had
          changed the array.
      - text: '`items` should be a `Map`'
        feedback: >-
          Any structure leaks the same way if you hand it out. The choice of structure isn't
          the flaw.
      - text: It hands out the private array itself
        correct: true
        feedback: >-
          Yes. Hidden in name only. Return a copy, `[...items]`, and the mug stays.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Change the list from `getItems()`, then check `total()`
          correct: true
          feedback: >-
            Yes. A caller's edit must not reach the cart's own state.
        - text: Add two items and check `total()`
          feedback: >-
            That passes with the leak in place. Nobody outside touched the array, so the sum
            is right.
        - text: Call `getItems()` on an empty cart
          feedback: >-
            It returns an empty array either way. The leak only shows when a caller changes
            what it got.
    fix: |
      getItems() { return [...items]; },

  - type: prose
    id: name-cohesion
    body: >-
      **Cohesion** is how closely the parts of one module serve a single purpose. A cohesive
      module has one reason to change.


      The two ideas pull together. Keep what changes together in one module: high cohesion.
      Then fewer changes cross a boundary: low coupling. The usual offender is a file called
      `utils.js`, where anything without a home ends up.

  - type: bug-hunt
    id: hunt-utils-grab-bag
    concept: arch.cohesion
    difficulty: 2
    language: js
    code: |
      // shared/utils.js, imported by 30 files
      export function initials(name) {
        return name.split(' ').map((word) => word[0]).join('');
      }
      export function slugify(text) {
        return text.toLowerCase().split(' ').join('-');
      }
      export function shippingPence(order) {
        return order.totalPence >= 5000 ? 0 : 395;
      }
      export function clamp(n, min, max) {
        return Math.min(Math.max(n, min), max);
      }
    prompt: >-
      Marketing changes the free-shipping threshold, and 30 files get retested. Tap the
      function that doesn't belong here.
    lines: [8]
    reasons:
      - text: It's a business rule hiding among helpers
        correct: true
        feedback: >-
          Yes. Shipping prices change with the business. Move it to a shipping module.
      - text: It's the longest function in the file
        feedback: >-
          Length isn't the test. Ask why each function would change. Only one changes when
          prices do.
      - text: It should take pence, not an order
        feedback: >-
          Its argument is fine. The trouble is where it lives: every importer of `utils`
          depends on a pricing decision.

  - type: code-challenge
    id: write-delivery-postcode
    concept: arch.coupling
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Users can now save several addresses and mark one as default. Shipping still walks
      into `user.profile` and takes the first address.


      Add `deliveryPostcode()` to the user: the default address's postcode, or the first
      one's if none is marked. Make `labelFor` call it, and stop handing out `profile`.


      So a user whose second address is the default gets a label with that postcode.
    hints:
      - The users module owns the address list. Only its functions should read it.
      - '`find` returns the first item that matches, or `undefined` when none does.'
      - 'Start with `const chosen = record.addresses.find((a) => a.isDefault) ?? record.addresses[0];`'

  - type: explain-back
    id: explain-forty-files
    concept: arch.information-hiding
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A team swaps its database library, and 40 files need editing. Why did a change to one
      decision reach 40 files?
    rubric:
      - Those 40 files all used the library directly, so each one knew how data is stored.
      - The storage choice was a decision likely to change, and nothing hid it behind a stable interface.
      - With one module owning the library, the swap would have changed that module alone.
    modelAnswer: >-
      Because 40 files knew about the decision. Each one imported the library and called it
      directly, so each was coupled to that choice. Which database library you use is
      exactly the kind of decision that changes. It should have lived inside one module,
      behind a few plain functions like `saveOrder` and `findOrder`. The other files would
      call those and know nothing else. Then the swap edits one module, and the 40 don't
      notice.

recap:
  - Judge a boundary by what each side knows about the other, and keep that small.
  - Hide the decision most likely to change behind functions that won't, and never hand out the insides.
  - Keep what changes together in one module, and give business rules a home outside `utils`.

recall:
  - id: card-coupling
    concept: arch.coupling
    front: What is coupling, and what's the sign of too much?
    back: >-
      How much a change in one module forces a change in another. The sign is a small change
      that needs edits in files that seem unrelated.
  - id: card-information-hiding
    concept: arch.information-hiding
    front: What should a module hide?
    back: >-
      The design decision most likely to change, such as how data is stored. Callers get
      functions that stay the same when it does.
  - id: card-leaky-getter
    concept: arch.information-hiding
    front: Why is `getItems() { return items; }` not information hiding?
    back: >-
      It hands out the private array itself, so callers can change the module's state.
      Return a copy, or answer the question they were asking.
  - id: card-cohesion
    concept: arch.cohesion
    front: How do you spot a module with low cohesion?
    back: >-
      It has several unrelated reasons to change. A shipping price rule in a file of date
      and text helpers is an example.

references:
  - kind: paper
    title: On the criteria to be used in decomposing systems into modules
    authors: D. L. Parnas
    year: 1972
    venue: Communications of the ACM, 15(12)
    url: https://doi.org/10.1145/361598.361623
    note: The paper that introduced information hiding, by splitting one program two ways and comparing what each change touched.
    primary: true
    verified: true
  - kind: paper
    title: Structured design
    authors: W. P. Stevens, G. J. Myers and L. L. Constantine
    year: 1974
    venue: IBM Systems Journal, 13(2)
    url: https://doi.org/10.1147/sj.132.0115
    note: Where the terms coupling and cohesion were defined for software.
    primary: true
    verified: true

deepDive: >-
  Every output here was run on Node 24. `cart.items.length` on a `Map` is `undefined`. The
  leaky getter let a caller `pop()` the last line out of the cart. The copy kept it. A copy
  protects the list, but not the objects in it: a caller can still edit
  `getItems()[0].pence`. For full protection, return new objects, or answer the real
  question with a method like `total()`.


  The 1972 paper's method is worth copying. It takes one small program and splits it into
  modules two ways: by the steps of processing, and by the decisions that might change.
  Then it lists likely changes and counts the modules each one touches. The second split
  wins every time. You can do the same exercise on a whiteboard before you create a folder.


  Coupling comes in strengths. Depending on a function's name and arguments is weak, and
  fine. Depending on a data structure's shape is stronger. Depending on another module's
  private state, or on the order it does things in, is the strongest and the worst.
  TypeScript catches the first kind when it breaks. It can't catch the last.


  Don't chase zero coupling. Two modules with no coupling are two programs. And don't split
  early: a boundary drawn before you know what changes is usually drawn in the wrong place.
