  - kind: essay
    title: 'Anthropic SWE Onsite: Project Deep Dive Guide'
    venue: Coditioning
    url: https://www.coditioning.com/blog/34/anthropic-swe-project-deep-dive
    note: A presentation round of about 20 minutes, the deep follow-up questions candidates report, and the common failures.
    primary: true
    verified: true
  - kind: essay
