term: pull request
aka:
  - PR
  - merge request
short: A request to bring a branch's changes into the main line, where teammates review and comment first.
explain: |
  You've finished a change on your branch. Before it reaches everyone, someone else
  should read it, and the automated checks should pass.

  You open one on the repository host. It shows the diff, runs CI, and collects review
  comments line by line. Once approved and green, it's merged. Keep them small: a reviewer
  reads 200 lines carefully and skims 2,000. The description should say why the change
  exists, not list the files.
analogy: Handing in a draft essay for marking. The teacher reads it, writes in the margin, and you fix it before it goes in the final book.
usage: That pull request mixes a refactor and a feature; split it so review is quicker.
related:
