term: database constraint
aka: [constraint, CHECK constraint, unique constraint, NOT NULL, exclusion constraint]
short: A rule the database itself enforces on every write, whatever code sends it.
explain: |
  An app that checks "is this email taken?" and then inserts has a gap between the two
  steps. A second request can pass the same check in that gap. A rule that lives only in app
  code breaks the first time two requests arrive together.

  Postgres closes the gap because it checks the rule inside the write. `NOT NULL`, `CHECK`,
  `UNIQUE`, foreign keys and exclusion constraints each guard one kind of rule. A `CHECK`
  passes when its condition is NULL, so pair it with `NOT NULL`. Keep checks in the app too,
  for friendly messages, but treat them as courtesy, not the guarantee.
analogy: A turnstile at the station. Staff can tell you your ticket looks wrong, but the gate is what actually won't open.
example:
  language: sql
  code: |
    CREATE TABLE products (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      sku text NOT NULL UNIQUE,
      stock integer NOT NULL CHECK (stock >= 0)
    );
usage: Keep the app check for the message, but add a unique constraint so two sign-ups can't share an email.
related: [foreign-key, primary-key, upsert, invariant, race-condition]
level: 2
lessons: [db.constraints]
