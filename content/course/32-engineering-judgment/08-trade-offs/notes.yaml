summary: >-
  Most technical decisions are trade-offs with incomplete information, and the skill is
  matching the care to the stakes. A **two-way door** is cheap to reverse, so you decide it
  quickly and review it later. A **one-way door**, such as deleting data, a public API's
  shape or a long contract, is hard to undo, so it earns evidence, review and often a way to
  make it reversible after all.


  Two recurring calls follow the same logic. **Build or buy** turns on whether the part is
  your core: build what makes people choose you, buy the rest, and count upkeep as part of
  building's price. **Boring technology** says new tools bring unknown failure modes, so a
  team spends its few innovation tokens only where the new thing clearly earns its risk.


  Whatever you decide, write it down in an ADR with the door named and the change that would
  make you revisit it. The record is what lets the next team tell a deliberate trade-off
  from an accident.
remember:
  - Decide two-way doors fast with most of the facts, and give one-way doors evidence and review.
  - Many one-way doors can be made two-way by keeping the old path, writing to both, or hiding a vendor behind an interface.
  - Build the part that makes people choose you, and buy what doesn't, because building means upkeep for ever.
  - Count upkeep, security fixes and on-call in the cost of building, not only the first version.
  - New technology brings failure modes nobody on the team has met, so spend innovation tokens sparingly.
  - Don't build a general platform before the third real use, as the rule of three suggests.
  - Record each call in an ADR with its door, its costs and the condition that would make you revisit it.
sections:
  - title: Making one-way doors two-way
    body: |-
      The best move is often not deciding better but making the decision cheaper to undo.
      A few patterns do most of the work.

      **Keep the old path.** Migrating to a new store? Copy the data and switch reads, but
      keep the old tables as the source of truth until the new one has proved itself. Only
      then is dropping them a separate, later decision.

      **Write to both.** For a while, write every change to old and new. Reads can then move
      back and forth with a setting.

      **Hide the vendor.** Put a bought service behind your own interface. The app depends
      on the interface, and each vendor's adapter is the only code that knows its API:

      ```ts
      interface Mailer {
        send(to: string, subject: string, body: string): Promise<void>;
      }

      // Each adapter is the only code that knows its vendor's API.
      const vendorA: Mailer = { async send(to, subject) { console.log(`A -> ${to}: ${subject}`); } };
      const vendorB: Mailer = { async send(to, subject) { console.log(`B -> ${to}: ${subject}`); } };

      // The app depends on the interface, never on a vendor.
      async function confirmBooking(mailer: Mailer, email: string, className: string) {
        await mailer.send(email, `Booked: ${className}`, 'See you there.');
      }

      await confirmBooking(vendorA, 'sam@example.com', 'Spin, 7am');
      await confirmBooking(vendorB, 'sam@example.com', 'Spin, 7am');
      // A -> sam@example.com: Booked: Spin, 7am
      // B -> sam@example.com: Booked: Spin, 7am
      ```

      This is the ports and adapters idea from the architecture chapter, used for a
      business reason. Switching vendors is now a new adapter, not a rewrite.

      **Rehearse the way back.** A rollback plan nobody has run is a hope. Run it once in
      staging, and the door is really two-way.

      Each of these costs extra work up front. That's the price of keeping your options
      open, and for a one-way door it's usually worth paying.
  - title: Build or buy, with numbers and without
    body: |-
      Start with the question that isn't about money: is this part your core? A gym app is
      chosen for its timetable and booking, not for how it sends email or takes cards. Work
      that sets you apart deserves your best people. Everything else should be as cheap and
      boring as possible, which usually means bought.

      Then do the sums, because sometimes the utility is expensive enough to build. A quick
      model is enough, and the useful part is testing how sensitive it is:

      ```ts
      type Build = { upfront: number; perYear: number };
      type Buy = { perUserPerMonth: number; users: number[] };

      function breakEvenYear(build: Build, buy: Buy): number | null {
        let built = build.upfront;
        let bought = 0;
        for (const [index, members] of buy.users.entries()) {
          built += build.perYear;
          bought += buy.perUserPerMonth * 12 * members;
          if (bought > built) return index + 1;
        }
        return null;
      }

      const members = [1000, 2000, 4000, 8000];
      console.log(breakEvenYear({ upfront: 20000, perYear: 6000 }, { perUserPerMonth: 0.5, users: members })); // 3
      // Upkeep was a guess. Double it and see if the answer survives.
      console.log(breakEvenYear({ upfront: 20000, perYear: 12000 }, { perUserPerMonth: 0.5, users: members })); // 4
      ```

      If doubling your least certain number changes the answer completely, you don't know
      the answer yet. Here it moves by a year, so the decision is fairly safe either way.

      The numbers people forget sit on the build side: upkeep, security patches, upgrades,
      on-call, and the features the vendor ships that you'd have to copy. On the buy side
      they forget lock-in and the price rise in year three. Name both in the ADR.

      There's a third option, open source: no licence fee and full control, but you inherit
      its upgrades and sometimes its future. Treat it as building with a head start.
  - title: Boring technology and innovation tokens
    body: |-
      A tool your team has run for years fails in ways you know. Its error messages are
      searchable, its limits are written up, and someone on the team has been paged for it
      before. A new tool fails in ways nobody has seen yet, usually at the worst time.

      That's the argument behind choosing boring technology. One popular essay frames it as
      a budget: a team gets about three **innovation tokens**. A new database, a new
      language and a new deployment platform would spend all three. Spend a token where the
      new thing does something your boring tools can't, at a scale you actually have.

      Some practical tests before spending one:

      - **Can the boring tool do it at our size?** Postgres handles queues, full-text search
        and JSON documents well into sizes most products never reach.
      - **Who gets paged?** If nobody on the team can debug it at 3 a.m., the risk is real.
      - **What does it replace?** A new tool that adds a second database is worse than one
        that replaces a hand-rolled component.

      Boring isn't the same as old or bad. It means understood. Today's exciting tool can
      become boring in a few years, once its failure modes are well documented and your team
      has learned them.

      With AI assistants this matters more, not less. An assistant can write code for any
      tool in seconds, so the cost of trying something new feels close to zero. The cost of
      running it, debugging it and upgrading it hasn't changed at all.
pitfalls:
  - '**Treating every decision as a one-way door.** Reviewing a lint rule like a migration slows the team and doesn''t prevent mistakes. Ask how hard it is to undo, and match the care to that.'
  - '**Calling a one-way door two-way because a rollback is imaginable.** If the old data is gone or customers rely on the new API, going back is a project, not a switch. Check the way back exists.'
  - '**Comparing the first version of a build with a year of a vendor''s bill.** Building costs upkeep for ever. Put upkeep, security work and on-call in the comparison.'
  - '**Spending an innovation token on a problem you don''t have yet.** A graph database for a few thousand rows, or a queue service for ten jobs an hour, adds risk with no payoff.'
  - '**Leaving the decision in a chat.** Without an ADR, the next team can''t tell a trade-off from an accident and reopens it. Write the door and the revisit condition down.'
verify:
  - lens: breaks
    check: Before dropping old tables or fields, confirm nothing still reads them and that a restore has been rehearsed, because that step can't be undone.
  - lens: tests
    check: Rehearse the rollback in staging before calling a migration a two-way door, or the way back is only a hope.
  - lens: scales
    check: Re-run the build-or-buy sums at the member count you expect in two years, because per-user pricing grows with you.
  - lens: confuses
    check: Name the door and the revisit condition in the ADR, so the next team knows the choice was deliberate and when to reopen it.
interview:
  - question: How do you decide how much time to spend on a technical decision?
    answer: >-
      By how hard it is to reverse. A two-way door, such as a library behind our own
      interface or a UI label, gets decided quickly by whoever owns it, with a date to look
      again. A one-way door, such as deleting data, a public API contract or a long vendor
      contract, gets written up, reviewed and backed with evidence. Often the best move is to
      make the one-way door two-way: keep the old tables while the new store proves itself,
      or wrap the vendor so switching is one adapter. The trade-off is a little extra work
      for the option to change our minds. The failure I watch for is the opposite: a team
      that treats every choice as momentous and ships nothing.
  - question: Would you build or buy authentication for a new product?
    answer: >-
      Buy, or use a well-established library, in almost every case. Authentication isn't
      why anyone chooses a product, and it's full of subtle, security-critical work:
      password storage, resets, session handling, multi-factor, account recovery and
      keeping up with attacks. Building it means owning all of that for ever. A provider
      costs money and creates lock-in, so I'd keep our user records in our own database,
      keyed by our own ids, and isolate the provider behind an interface. I'd revisit if the
      per-user price became a large share of revenue at our scale, or if a regulator required
      something no provider offers. I'd write the reasoning and that revisit condition in an
      ADR.
  - question: What does "choose boring technology" mean, and when would you go against it?
    answer: >-
      It means preferring tools whose failure modes your team already knows, because new
      technology brings problems nobody has met yet, usually in production. The framing I
      like is innovation tokens: a team can afford a few new things, so spend them where
      they make a real difference. I'd go against the default when the boring option can't
      do the job at a scale we really have, or when the new tool is central to what makes
      the product different. Even then, I'd adopt it in one place first, make sure someone
      can debug it under pressure, and record the decision with what would make us back out.
