term: request waterfall
aka: [waterfall, network waterfall, fetch waterfall]
short: Requests that run one after another because each only starts when the previous one finishes.
explain: |
  A page loads a user, then that user's projects, then each project's tasks. If each
  component fetches only after it renders, and it renders only after its parent's data
  arrives, the requests queue up. Three 200 ms requests become 600 ms of waiting.

  The name comes from the Network panel, where the bars step down like falling water. The
  fix is to start independent requests together, with `Promise.all`, or to load data
  higher up, in a route loader or a server component, before the tree renders.
analogy: Waiting for the kettle to boil before you even get the cups out.
example:
  language: ts
  code: |
    // Waterfall: the second waits for the first
    const user = await getUser(id);
    const orders = await getOrders(id);

    // Together: both start at once
    const [user2, orders2] = await Promise.all([getUser(id), getOrders(id)]);
usage: The dashboard has a request waterfall four levels deep, so fetch the lot in the route instead.
related: [effect, promise, async-await, server-component, latency]
level: 2
lessons: [react.fetching-data]
