term: incident update
aka:
  - incident status update
  - outage update
short: A short, regular message during an outage giving the impact, current status, next steps and next update time.
explain: |
  While something is broken, everyone wants to know the same things. Am I affected? Is anyone
  on it? When will I hear more? Without answers, they interrupt the people fixing it.

  The update answers in a fixed order. First the impact: who, since when, and what still works.
  Then the status, such as investigating, fixing or resolved. Then what you're doing. Last, when
  the next update comes, as a clock time with a time zone.

  Mark guesses as guesses, and describe what systems did, not who slipped. Then keep the
  promise: post at the time you said, even if the news is "no change".
analogy: Announcements on a delayed train. Not the engineering. How late, why roughly, and when you'll hear next.
example:
  language: text
  code: |
    Impact: Some card payments fail at checkout since 14:05 UTC. Other methods work.
    Status: Identified. A certificate expired on the payment gateway connection.
    Doing: Rolling out a renewed certificate, region by region.
    Next update: 15:00 UTC, or sooner if it's fixed.
usage: Post the next incident update at 15:00 even if nothing's changed; silence is worse than "still fixing".
twin:
  term: status-update
  difference: An incident update goes out during an outage, on a fixed clock, impact first. A status update reports routine progress on planned work.
related:
  - status-update
  - blameless-postmortem
  - on-call
  - incident-commander
level: 2
lessons:
  - explain.incident-updates
