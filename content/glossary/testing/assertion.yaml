term: assertion
aka: [assert, expect, matcher]
short: The line in a test that states what a value must be, and fails the test otherwise.
explain: |
  A test that calls your code but checks nothing passes whatever the code does. The check
  is what makes it a test: "the total must be 2700".

  In Vitest and Jest you write `expect(value)` followed by a **matcher** such as `toBe`,
  `toEqual` or `toThrow`. `toBe` compares identity, so two equal objects fail it; use
  `toEqual` for those. And watch a new test fail once before trusting it, in case the
  check can't fail at all.
analogy: The answer key a teacher marks against. Without one, every paper gets full marks.
example:
  language: ts
  code: |
    expect(add(2, 3)).toBe(5);
    expect(user).toEqual({ id: 1, name: 'Ada' });
    expect(() => parseAge('ten')).toThrow('not a number');
usage: This test has no assertion, so it'd pass even if the function returned nothing.
related: [unit-test, snapshot-test]
level: 1
lessons: [testing.first-test]
