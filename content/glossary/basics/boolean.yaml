term: boolean
aka: [bool]
short: A value that can only be true or false.
explain: |
  Lots of questions in a program have two answers. Is the basket empty? Is the task done?
  JavaScript has a value for each answer: `true` and `false`.

  Comparisons such as `>` and `===` produce one, and `if` decides with one. The trap:
  `"false"` in quotes is a string, not a boolean. Any non-empty string counts as true, so
  `if ("false")` runs.
analogy: A light switch. It's on or off, with nothing in between.
example:
  language: js
  code: |
    const done = false;
    const isAdult = age >= 18; // true or false
    if (!done) {
      console.log("Still to do");
    }
usage: Store done as a boolean, not the text "yes", so the filter can test it directly.
twin:
  term: truthy
  difference: A boolean is exactly `true` or `false`. Truthy describes any value that `if` treats as true, such as `"hello"` or `42`.
related: [if-statement, operator, truthy, strict-equality]
level: 1
lessons: [basics.conditions]
