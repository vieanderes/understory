id: arch.cqrs-and-event-sourcing
title: Read models and event logs
objective: Plan for a read model's lag, decide when reads deserve their own model, and know when an event log is worth keeping.
level: advanced
minutes: 10
concepts: [arch.read-models, arch.cqrs, arch.event-sourcing]
prerequisites: [arch.event-driven, db.storage-and-pooling, js.arrays]
opening:
  text: >-
    You'll know why a page can show old data right after a save, and how to stop it. And
    you'll know when keeping every event is worth its cost, which is less often than blogs
    suggest.

steps:
  - type: prose
    id: what-a-read-model-is
    body: >-
      A search box often doesn't read your main tables. It reads a **search index**: a second
      copy of the data, arranged for fast text search. A dashboard might read a table of
      totals, rebuilt every minute.


      Each is a **read model**: data shaped for one screen or query. The code that builds it
      from the writes is a **projection**. It runs a little behind, so a read model lags.

  - type: bug-hunt
    id: hunt-read-after-write
    concept: arch.read-models
    difficulty: 1
    language: js
    code: |
      async function shipAndShow(sku, qty) {
        await stock.ship(sku, qty);                  // writes to the main tables
        const left = await stockView.leftFor(sku);   // read model, rebuilt every few seconds
        return `Shipped. ${left} left in stock.`;
      }
    prompt: >-
      Staff ship the last 5 toasters, and the page says "5 left in stock". A refresh later it
      says 0. Tap the line that showed old data.
    lines: [3]
    reasons:
      - text: It reads the read model straight after the write
        correct: true
        feedback: >-
          Yes. The projection hasn't caught up. Show the number `ship` returns.
      - text: '`ship` shouldn''t be awaited'
        feedback: >-
          Without `await` the read would come even sooner, and be even more likely to be old.
      - text: The read model adds up wrongly
        feedback: >-
          Its sum is right, a few seconds later. The page asked too soon.
    fix: |
      const { left } = await stock.ship(sku, qty);   // the write's own answer

  - type: prose
    id: name-cqrs
    body: >-
      Giving reads their own model, apart from the one that takes writes, has a name:
      **CQRS**, command query responsibility segregation. Commands change state through one
      model. Queries read from another.


      It costs lag, and a second copy to keep right. Most apps don't need it. It pays when
      reads and writes want very different shapes.

  - type: multiple-choice
    id: pick-when-to-diverge
    concept: arch.cqrs
    difficulty: 2
    question: Which system has earned a separate read model?
    choices:
      - text: A staff rota with three tables and ten users
        feedback: >-
          One model serves it fine. A second would add lag and moving parts, and fix nothing.
      - text: A catalogue with heavy search and rare edits
        correct: true
        feedback: >-
          Yes. Reads and writes want different shapes here, so let them diverge.
      - text: Any app that might grow one day
        feedback: >-
          "Might" is the trap. You can add a projection later, when a real query hurts.

  - type: prose
    id: name-event-sourcing
    body: >-
      **Event sourcing** goes further. The main store isn't a table of how things are. It's
      a log of every event, like a bank statement. Current state is computed by replaying
      the log, the way `reduce` folds an array.


      You never edit the log. You only add to it. It's a specialist tool, worth its cost when
      the history is the product: money, stock, audit trails.

  - type: multiple-choice
    id: pick-the-correction
    concept: arch.event-sourcing
    difficulty: 2
    question: Yesterday's logged shipment of 3 kettles was really 2. How do you put the stock right?
    choices:
      - text: Edit the old event's `qty` to 2
        feedback: >-
          Then the log no longer says what happened. Every view built from it yesterday now
          disagrees with it.
      - text: Append a new event that corrects it
        correct: true
        feedback: >-
          Right. Like a bank: no erasing, only a new entry. The mistake stays on record.
      - text: Delete the event and add a right one
        feedback: >-
          Deleting rewrites history too. Reports that already counted that shipment can't be
          explained any more.

  - type: ai-review
    id: review-replayed-projection
    concept: arch.read-models
    difficulty: 3
    language: js
    request: Keep a live "units shipped" dashboard up to date from the stock events.
    flawClass: edge-case
    code: |
      const shipped = { kettle: 0, toaster: 0 };
      function onEvent(event) {
        if (event.type === 'StockShipped') {
          shipped[event.sku] = shipped[event.sku] + event.qty;
        }
      }
      subscribe('stock-events', onEvent);   // each event may arrive more than once
    prompt: >-
      An assistant wrote this. The test sent each event once, and kettles read 5. After a
      restart the broker sent every event again, and kettles read 10. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It adds every delivery, even one it has seen
        correct: true
        feedback: >-
          Yes. Remember the last event number applied, and skip anything at or below it.
      - text: '`shipped` should start empty, not at 0'
        feedback: >-
          Starting values aren't the trouble. Any start doubles when the same events arrive
          twice.
      - text: It should count `StockReceived` instead
        feedback: >-
          The dashboard is about shipments, so the filter is right. Look at what happens on a
          repeat.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Deliver the same events twice and expect the same totals
          correct: true
          feedback: >-
            Yes. A replay must leave the dashboard where it was.
        - text: Deliver each event once and check kettles read 5
          feedback: >-
            That's the test it passed. The flaw only shows when an event comes back.
        - text: Send a `StockReceived` event and expect no change
          feedback: >-
            A fine test of the filter, and it passes. It never repeats a shipment.
    fix: |
      let lastSeq = 0;
      function onEvent(event) {
        if (event.seq <= lastSeq) return;      // already applied
        lastSeq = event.seq;
        if (event.type === 'StockShipped') {
          shipped[event.sku] = shipped[event.sku] + event.qty;
        }
      }

  - type: code-challenge
    id: write-replay
    concept: arch.event-sourcing
    difficulty: 4
    language: ts
    prompt: >-
      Write `replay(events, upToSeq)`. Each event has a `seq`, a `type` of `'StockReceived'`
      or `'StockShipped'`, a `sku` and a `qty`. Return the stock per `sku`.


      Apply only events whose `seq` is at most `upToSeq`. If a `seq` turns up twice, apply it
      once. Don't change the log.


      So replaying 10 received and 3 shipped, up to seq 2, gives `{ kettle: 7 }`.
    hints:
      - Build the stock in a fresh object, one event at a time, in log order.
      - Keep a list of the `seq` values you've applied, and skip one that's already in it.
      - 'Start with `const stock: Record<string, number> = {};` and a `for...of` over `events`.'

  - type: explain-back
    id: explain-when-not
    concept: arch.cqrs
    difficulty: 4
    audience: teammate
    kind: decide
    prompt: >-
      A teammate wants event sourcing and CQRS for a small internal tool, "to be ready for
      scale". Make the case for one table instead: why would they cost more than they
      return?
    rubric:
      - A separate read model lags behind writes, so users can save and then see old data.
      - Projections, replays and event versions are extra moving parts to build, run and debug.
      - They pay off when reads and writes need different shapes or a full history matters, and neither is true here.
    modelAnswer: >-
      Both patterns trade simplicity for flexibility, and a small tool has little use for
      the flexibility. With a read model, a save doesn't show up until the projection
      catches up. People who read their own writes then need workarounds. Projections must
      survive replays, and old events must stay readable for ever as the code changes.
      That's real work. It pays when search and editing pull the data in different
      directions, or when an audit trail is the product. A rota for ten people needs one
      table and a query.

recap:
  - Expect a read model to lag, and show a user their own change from the write's reply.
  - Build projections that are safe to replay, and split reads from writes only when their shapes differ.
  - Keep an event log as the source of truth only when the history itself is the product.

recall:
  - id: card-projection-lag
    concept: arch.read-models
    front: What two things must you plan for in a projection?
    back: >-
      Lag, since a read straight after a write can be stale. And replays, so applying the
      same event twice must change nothing.
  - id: card-cqrs
    concept: arch.cqrs
    front: What does CQRS separate, and does it need event sourcing?
    back: >-
      Commands change state through one model, and queries read from another shaped for
      reading. It works without event sourcing, such as with a search index.
  - id: card-event-sourcing
    concept: arch.event-sourcing
    front: In event sourcing, where is the current state kept?
    back: >-
      Nowhere as the truth. The event log is the truth, and state is computed by replaying
      it. Any stored state is a copy.
  - id: card-correcting-event
    concept: arch.event-sourcing
    front: How do you fix a wrong event in an event-sourced system?
    back: >-
      Append a new event that corrects it. The log is append-only, so the mistake and the
      correction both stay on record.

references:
  - kind: essay
    title: CQRS
    authors: Martin Fowler
    year: 2011
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/CQRS.html
    note: What the pattern is, and a plain warning that for most systems it adds risky complexity.
    primary: true
    verified: true
  - kind: essay
    title: Event Sourcing
    authors: Martin Fowler
    year: 2005
    venue: martinfowler.com
    url: https://martinfowler.com/eaaDev/EventSourcing.html
    note: State as a replay of events, with rebuilding, time travel and correcting entries.
    primary: true
    verified: true
  - kind: essay
    title: What do you mean by “Event-Driven”?
    authors: Martin Fowler
    year: 2017
    venue: martinfowler.com
    url: https://martinfowler.com/articles/201701-event-driven.html
    note: Sets event sourcing and CQRS beside event notification, so the ideas stop blurring.
    verified: true

deepDive: >-
  All outputs are from Node 24. The four stock events in the challenge fold to `{ kettle:
  5, toaster: 5 }`, and the first two to `{ kettle: 7 }`. The naive dashboard counted 5
  kettles, then 10 after a replay. The version that tracks the last sequence number stayed
  at 5.


  For the stale read, the usual cures are small. Show the user their own change from the
  write's reply, as the fix did. Or have the page wait until the read model reaches the
  write's sequence number. The read replicas from the databases chapter lag the same way,
  and the same cures apply.


  Replaying is cheaper than it sounds, and dearer. Folding a million small events took 33
  ms here. But a real log lives in a database, not an array. So systems save a
  **snapshot** every so often and replay only what came after.


  The hard part of event sourcing arrives in year two. Events are for ever, so an event
  written by old code must still be readable by new code. Teams version their events and
  convert old shapes as they load. Personal data is harder still: a log you can't edit
  meets a law that says you must delete. One answer is to keep personal fields outside the
  log, under a key you can throw away.
