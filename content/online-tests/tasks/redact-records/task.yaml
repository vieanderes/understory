id: redact-records
title: RedactRecords
topic: ai-systems
difficulty: medium
type: coding
recommendedMinutes: 30
signature:
  params:
    - { name: L, type: "string[]" }
  returns: "string[]"
statement: |-
  Before support messages are sent to a language model, personal data must be removed. The
  redactor replaces email addresses, phone numbers and card numbers with fixed placeholders,
  and must leave ordinary numbers, such as order numbers and years, alone. It works in two
  passes over each line.

  **Pass 1, emails.** Take each `@` in the line. Its local part is the longest run of
  letters, digits and the characters `. _ + -` directly before it. Its domain is the longest
  run of letters, digits, `.` and `-` directly after it, without any full stops at the end
  of that run. If the local part is not empty, and the domain contains a full stop and does
  not start with one, the local part, the `@` and the domain are replaced with `[EMAIL]`.
  Otherwise the text is kept.

  **Pass 2, numbers**, on the result of pass 1. A number is a longest run of digits in which
  two digits may be separated by a single space or a single hyphen, such as `2024`,
  `4111 1111 1111 1111` or `020-7946`.

  - If a `+` comes directly before the number and the number has 8 to 15 digits, the `+`
    and the number are replaced with `[PHONE]`.
  - If no `+` comes directly before it and it has exactly 16 digits, it is replaced with
    `[CARD]`.
  - Every other number is kept.

  Write a function:

  {{signature}}

  that, given an array L of N strings, returns the N redacted strings, in order.

  For example, given L = ["Mail jo.lee+news@post.example.org.", "Card 4111-1111-1111-1111
  for order 88412 in 2024", "Call +44 20 7946 0958 or 020 7946 0958"], the function should
  return ["Mail [EMAIL].", "Card [CARD] for order 88412 in 2024", "Call [PHONE] or 020 7946
  0958"]. The full stop after the address stays, and the second phone number has no `+`.

  Assume that:

  - N is an integer within the range [1..100];
  - each string is made of printable ASCII characters and has a length within the range
    [0..200];
  - no word holds more than one `@`.

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [["Mail jo.lee+news@post.example.org.", "Card 4111-1111-1111-1111 for order 88412 in 2024", "Call +44 20 7946 0958 or 020 7946 0958"]], expected: ["Mail [EMAIL].", "Card [CARD] for order 88412 in 2024", "Call [PHONE] or 020 7946 0958"] }
tests:
  - name: extreme_empty
    description: an empty line and a line with nothing to redact
    group: correctness
    cases:
      - { args: [[""]], expected: [""] }
      - { args: [["Thanks, all sorted now."]], expected: ["Thanks, all sorted now."] }
  - name: emails
    description: addresses in brackets, at the end of a sentence, with digits
    group: correctness
    cases:
      - { args: [["(a.b@c.io)", "x_9@mail-1.example.com, then", "End: q@w.uk..."]], expected: ["([EMAIL])", "[EMAIL], then", "End: [EMAIL]..."] }
      - { args: [["write to box12345678901234567@host.net"]], expected: ["write to [EMAIL]"] }
  - name: not_emails
    description: an at sign that does not start an address
    group: correctness
    cases:
      - { args: [["meet @ 5", "user@localhost", "me@.com", "@team.example.com", "x@y."]], expected: ["meet @ 5", "user@localhost", "me@.com", "@team.example.com", "x@y."] }
  - name: cards
    description: 16 digits, plain or grouped
    group: correctness
    cases:
      - { args: [["4111111111111111", "pay 5500 0000 0000 0004 now", "id:1234-5678-9012-3456;"]], expected: ["[CARD]", "pay [CARD] now", "id:[CARD];"] }
      - { args: [["15 digits 411111111111111", "17 digits 41111111111111111", "+4111111111111111"]], expected: ["15 digits 411111111111111", "17 digits 41111111111111111", "+4111111111111111"] }
  - name: phones
    description: 8 to 15 digits after a plus sign
    group: correctness
    cases:
      - { args: [["+1-555-0100", "+12345678", "+1234567", "+123456789012345", "+1234567890123456"]], expected: ["[PHONE]", "[PHONE]", "+1234567", "[PHONE]", "+1234567890123456"] }
      - { args: [["ring+44 20 7946 0958.", "+ 44 20 7946 0958", "+44  20 7946 0958"]], expected: ["ring[PHONE].", "+ 44 20 7946 0958", "+44  20 7946 0958"] }
  - name: ordinary_numbers
    description: dates, order numbers and amounts are kept
    group: correctness
    cases:
      - { args: [["Order 2024-05-01-7731 shipped", "Paid 1,250.00 on 03/04", "Ref 1234 5678 9012 345", "Year 1999 and 2000"]], expected: ["Order 2024-05-01-7731 shipped", "Paid 1,250.00 on 03/04", "Ref 1234 5678 9012 345", "Year 1999 and 2000"] }
  - name: separators
    description: only one space or hyphen joins digits
    group: correctness
    cases:
      - { args: [["4111 1111  1111 1111", "4111--1111-1111-1111", "4111 -1111 1111 1111", "4111-1111 1111-1111"]], expected: ["4111 1111  1111 1111", "4111--1111-1111-1111", "4111 -1111 1111 1111", "[CARD]"] }
  - name: mixed
    description: every kind in one line, and an address holding digits
    group: correctness
    cases:
      - { args: [["From a1@b2.co +33 1 23 45 67 89 card 4000000000000002 ref 77", "4000000000000002@pay.example.com"]], expected: ["From [EMAIL] [PHONE] card [CARD] ref 77", "[EMAIL]"] }
