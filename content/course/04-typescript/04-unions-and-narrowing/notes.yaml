summary: >-
  A union type says a value is one of several things: `string | null`, `"small" | "medium"`,
  or a set of object shapes. Until you check which one you hold, the checker only lets you
  use what every member shares. **Narrowing** is how you check: `typeof`, `===`, `in`,
  `instanceof` and your own guard functions. The checker follows your `if`, `return` and
  `switch` statements and knows, line by line, which members are still possible.


  The most useful form is the **discriminated union**: object types that share one property,
  such as `status`, with a different literal value in each. It lets you model data that is
  always in exactly one valid state, with only that state's fields. Compare it with one big
  type full of optional properties, where nothing stops a cancelled subscription from also
  having a price.


  The last piece is exhaustiveness. Once every member has been handled, what's left has the
  type `never`. Passing it to a function that only accepts `never` turns "someone added a
  state and forgot a branch" into a build error. That's why these three ideas travel
  together in real code and in interviews.
remember:
  - Before narrowing, you can only use the properties and methods that every member of a union shares.
  - The checker narrows through `typeof`, `===` and `!==`, `== null`, truthiness, `in`, `instanceof`, `Array.isArray`, type predicates and assertion functions.
  - A discriminated union gives every member the same property with a different literal value, so one check picks one member.
  - End every branch chain with `assertNever(value)` or `value satisfies never`, so a new member that nobody handles breaks the build.
  - '`never` is the type with no values, and a fully narrowed union has that type.'
  - Object properties widen to `string` unless the object is annotated or marked `as const`, which is why an unannotated object often fails to fit a discriminated union.
  - "A type predicate, `(x): x is Card`, and an assertion function, `asserts x is string`, narrow wherever they're called, and the checker trusts their bodies without verifying them."
  - Narrowing a `let` is lost inside a callback when the variable is assigned again later, so copy it into a `const` first.
sections:
  - title: Literal types, widening and as const
    body: |-
      A discriminated union only works if the tag keeps its literal type, such as `"trial"`
      rather than `string`. Inference often widens it away. A property in an object literal
      can be reassigned, so its type widens:

      ```ts
      type Subscription =
        | { status: "trial"; endsAt: number }
        | { status: "active"; pricePence: number };

      function save(sub: Subscription): void {
        console.log(`saved ${sub.status}`);
      }

      const draft = { status: "trial", endsAt: 1767225600000 };
      save(draft);
      // Argument of type '{ status: string; endsAt: number; }' is not assignable to
      // parameter of type 'Subscription'.

      const typed: Subscription = { status: "trial", endsAt: 1767225600000 };
      save(typed); // saved trial

      const pinned = { status: "trial", endsAt: 1767225600000 } as const;
      save(pinned); // saved trial
      ```

      Three fixes, in order of preference. Annotate the variable, which also gets you excess
      property checks. Write the object directly in the call. Or add `as const`, which makes
      every property `readonly` and keeps every literal.

      `as const` has a second everyday use: deriving a union from a list you also need at run
      time.

      ```ts
      const SIZES = ["small", "medium", "large"] as const;
      type Size = (typeof SIZES)[number]; // "small" | "medium" | "large"
      console.log(SIZES.includes("large")); // true
      ```

      Despite the syntax, `as const` is not an unchecked cast like `as Size`. It asks for
      the narrowest type of the value you wrote, so it can't lie about anything.
  - title: The narrowing toolkit
    body: |-
      Each check below removes members from the union for the code that follows it:

      ```ts
      type Payment =
        | { method: "card"; last4: string }
        | { method: "voucher"; code: string };

      function describe(value: string | number | Date | Payment | string[] | null | undefined): string {
        if (value == null) return "nothing"; // == null matches null and undefined
        if (typeof value === "string") return `text ${value.toUpperCase()}`;
        if (typeof value === "number") return `number ${value.toFixed(2)}`;
        if (value instanceof Date) return `date ${value.getUTCFullYear()}`;
        if (Array.isArray(value)) return `list of ${value.length}`;
        if ("last4" in value) return `card ending ${value.last4}`;
        return `voucher ${value.code}`;
      }

      console.log(describe(null)); // nothing
      console.log(describe("tea")); // text TEA
      console.log(describe(new Date(Date.UTC(2026, 0, 1)))); // date 2026
      console.log(describe(["a", "b"])); // list of 2
      console.log(describe({ method: "card", last4: "4242" })); // card ending 4242
      console.log(describe({ method: "voucher", code: "SPRING" })); // voucher SPRING
      ```

      Know the traps. `typeof null` is `"object"`, so rule out `null` before an object check.
      `typeof` can't tell objects apart, so arrays need `Array.isArray` and class instances
      need `instanceof`. Truthiness, `if (value)`, also removes `0`, `""` and `NaN`, which
      are often valid.

      When a check is too involved to write inline, move it into a guard function. Two kinds
      exist:

      ```ts
      type Card = { method: "card"; last4: string };
      type Voucher = { method: "voucher"; code: string };
      type Payment = Card | Voucher;

      function isCard(p: Payment): p is Card {
        return p.method === "card";
      }

      function assertString(value: unknown, name: string): asserts value is string {
        if (typeof value !== "string") {
          throw new TypeError(`${name} must be a string, got ${typeof value}`);
        }
      }

      const payments: Payment[] = [
        { method: "card", last4: "4242" },
        { method: "voucher", code: "SPRING" },
      ];
      console.log(payments.filter(isCard).map((c) => c.last4)); // [ '4242' ]

      const input: unknown = "B-12";
      assertString(input, "bookingId");
      console.log(input.toLowerCase()); // b-12
      ```

      A **type predicate** (`p is Card`) narrows in the branch where it returned `true`. An
      **assertion function** (`asserts value is string`) returns nothing and throws on
      failure, so everything after the call is narrowed. Since TypeScript 5.5, the checker
      also infers simple predicates, so `["tea", null].filter((x) => x !== null)` is typed
      `string[]`.

      The checker verifies neither body. `return true` in `isCard` would compile and narrow
      vouchers to cards. Keep guards tiny, and test them.
  - title: Exhaustiveness, three ways
    body: |-
      You have seen `assertNever`. Two alternatives produce the same guarantee, and you'll
      meet all three:

      ```ts
      type Shipment =
        | { state: "packed"; parcels: number }
        | { state: "in-transit"; carrier: string }
        | { state: "delivered"; signedBy: string }
        | { state: "lost"; reportedAt: string };

      function label(s: Shipment): string {
        switch (s.state) {
          case "packed":
            return `${s.parcels} parcels packed`;
          case "in-transit":
            return `with ${s.carrier}`;
          case "delivered":
            return `signed for by ${s.signedBy}`;
          default:
            s satisfies never;
            // Type '{ state: "lost"; reportedAt: string; }' does not satisfy the expected type 'never'.
            throw new Error(`Unhandled state: ${JSON.stringify(s)}`);
        }
      }
      ```

      `satisfies never` needs no helper. The `throw` afterwards still matters: types are
      erased, and a record written by a newer version of the app can reach this code at run
      time with a state nobody compiled against.

      The third way uses the return type. With a declared return type and no `default`, a
      missing case makes the end of the function reachable:

      ```text
      Function lacks ending return statement and return type does not include 'undefined'.
      ```

      It's the lightest option, but it only works when every branch returns a value, and
      the error points at the signature rather than naming the missing member. `assertNever`
      names it and throws at run time, which is why it's the usual choice for shared code.

      The deeper design lesson: exhaustiveness only protects code that lists the cases it
      handles. A chain that ends in a catch-all, such as `return true` or a `default` that
      returns a value, silently accepts every new member.
  - title: Where narrowing stops
    body: |-
      Narrowing is a fact about one variable at one point in the code. The checker drops it
      when it can't be sure the fact still holds.

      ```ts
      function schedule(run: () => void): void {
        run();
      }

      function remind(name: string | null): void {
        let who = name;
        if (who === null) return;
        schedule(() => console.log(who.toUpperCase()));
        // 'who' is possibly 'null'.
        who = null;
      }
      ```

      The callback might run after `who = null`, so inside it `who` is back to
      `string | null`. Without the later assignment, TypeScript 5.4 and newer keep the
      narrowing in the callback. With a `const`, it's always kept, because a `const` can't
      change. The everyday fix is to copy the narrowed value into a `const` before the
      callback.

      Other places narrowing doesn't reach:

      - Across function boundaries. Checking `order.coupon !== undefined` in one function
        tells nothing to another function that receives `order`.
      - Through a saved boolean, in most cases. `const hasCoupon = coupon !== undefined`
        narrows `coupon` inside `if (hasCoupon)` when `coupon` is a `const`, a parameter that
        is never reassigned, or a `readonly` property. For an ordinary mutable property such
        as `order.coupon`, or once the flag is stored in an object, the link is lost.

      When the checker loses track, check again close to the use, or pass the narrowed
      value itself rather than the wide one.
pitfalls:
  - "**Checking `typeof value === \"object\"` without ruling out `null`.** `typeof null` is `\"object\"`, so the branch still includes `null` and reading a property crashes. Write `typeof value === \"object\" && value !== null`."
  - '**Narrowing with truthiness when `0` or `""` are valid.** `if (quantity)` treats a quantity of 0 as missing. Compare with `undefined` or `null` explicitly.'
  - '**Ending a chain with a catch-all.** `return true` or a `default` that returns a value accepts every future member without a word. List the members you handle and finish with `assertNever` or `satisfies never`.'
  - '**Modelling states as one type full of optional fields.** `{ status: string; endsAt?: number; pricePence?: number }` allows impossible combinations and forces checks everywhere. Use a discriminated union so each state carries only its own fields.'
  - '**Writing a type predicate that lies.** The checker trusts `x is Card` without checking the body, so a sloppy test narrows to the wrong type. Keep guards small, base them on the discriminant, and unit-test them.'
  - '**Losing the literal type of a tag.** An unannotated `{ status: "trial" }` has `status: string` and no longer fits the union. Annotate the variable or use `as const`.'
verify:
  - lens: breaks
    check: 'Functions over a union end with `assertNever`, so a new member is a build error, not a silent default.'
  - lens: leaks
    check: 'Access checks list who is allowed, not who is refused, so a new status is denied until someone decides.'
  - lens: breaks
    check: 'Narrow with `=== undefined` or `=== null` when 0 or empty text are valid, never with truthiness.'
  - lens: tests
    check: 'When you add a union member, run `tsc` and fix every place it flags before you write the tests.'
interview:
  - question: What's a discriminated union, and how do you make sure every case is handled?
    answer: >-
      It's a union of object types that share one property whose value is a different
      literal in each member, like `status: "trial" | "active" | "cancelled"`. Checking that
      property with `===` or a `switch` narrows to exactly one member, so each branch can
      use that member's own fields safely. For exhaustiveness I end the branches with
      `assertNever(value)`, a function whose parameter type is `never`. If every member was
      handled, the value really is `never` and the call compiles. If someone adds a member
      and forgets it, that member is left over, isn't assignable to `never`, and the build
      fails at that line. The function also throws at run time, which matters because
      erased types can't stop a record with an unexpected status from arriving.
  - question: What is narrowing, and which checks narrow a type?
    answer: >-
      Narrowing is the checker following your control flow to work out a more specific type
      for a variable at each point. After `if (x === null) return;`, it knows `x` isn't
      `null` below. The checks it understands: `typeof` for primitives, equality including
      `== null` for both `null` and `undefined`, truthiness, `in` for property presence,
      `instanceof` for classes, `Array.isArray`, discriminant checks on a literal property,
      and user-defined type predicates and assertion functions. It works through `if`,
      `switch`, early `return`, `throw`, `&&`, `||` and the ternary. Two cautions: `typeof
      null` is `"object"`, and narrowing on a `let` can be lost inside a callback, because
      the variable might change before the callback runs.
  - question: What's the difference between a type guard, an assertion function and an `as` cast?
    answer: >-
      All three change what the checker believes, but only the first two are tied to a
      runtime check. A type guard, `function isCard(p): p is Card`, returns a boolean and
      narrows in the branch where it returned `true`. An assertion function,
      `asserts value is string`, returns nothing and throws if the check fails, so the rest
      of the scope is narrowed. An `as` cast checks nothing at all and emits no code; it
      only overrides the checker. The catch is that the checker doesn't verify guard bodies
      either, so a wrong guard is as dangerous as a wrong cast. The difference is that a
      guard puts the check in one named, testable place. I use guards at boundaries and
      keep `as` for the rare case the checker can't follow.
  - question: What is the never type, and where does it show up?
    answer: >-
      `never` is the empty type: no value has it. It's assignable to every type, and
      nothing except `never` is assignable to it. It shows up in three places. As the
      return type of a function that never returns normally, because it always throws or
      loops forever. As the leftover type after narrowing removes every member of a union,
      which is what exhaustiveness checks exploit. And as the result of impossible type
      operations, such as intersecting `string & number` or a property typed `string` in
      one type and `number` in another. The contrast with `void` matters: a `void`
      function returns, only without a useful value, while a `never` function doesn't
      return at all.
  - question: Why prefer a discriminated union over one type with optional fields?
    answer: >-
      Because it makes illegal states unrepresentable. With `{ status: string;
      pricePence?: number; cancelledAt?: number }`, the type allows a cancelled
      subscription with a price, or an active one with neither field, so every reader has
      to guess which combinations are real and check optional fields everywhere. With a
      union of `{ status: "active"; pricePence: number }` and
      `{ status: "cancelled"; cancelledAt: number }`, each state carries exactly its own
      required fields. One check on `status` gives full, non-optional access, and
      exhaustiveness checks catch new states. The trade-off is more types to declare and
      some ceremony when converting from loosely shaped data, which is why I parse external
      data into the union at the boundary.
terms:
  - term: Union type
    say: A value that can be all of those types.
    means: A value that is exactly one member at a time. Until you check which, you may only use what
      every member shares.
  - term: Narrowing
    say: Casting to the right type.
    means: The checker following your `typeof`, `===`, `in`, `instanceof` and guard checks, so it knows
      line by line which members are still possible. Nothing is cast.
  - term: Discriminated union
    say: A union of object types.
    means: Object types that share one property, such as `status`, with a different literal value in
      each, so a single check picks exactly one member and its fields.
  - term: "`never`"
    say: The return type of a function that throws.
    means: The type with no values. A fully narrowed union has it, which is why `assertNever(value)`
      stops compiling when a new member goes unhandled.
  - term: Type predicate
    say: A function that checks the type.
    means: A function returning `x is Card`, which narrows wherever it's called. The checker trusts its
      body without verifying it, so a wrong predicate lies silently.
  - term: "`as const`"
    say: It makes the object read-only.
    means: "It does, and more usefully it keeps every literal type instead of widening to `string`, so
      `{ status: 'paid' }` can fit a discriminated union."
