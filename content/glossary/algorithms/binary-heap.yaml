term: heap
aka: [ binary heap, min-heap, max-heap, min heap, max heap ]
short: A tree stored in an array that always keeps the smallest, or largest, item at the top.
explain: |
  Sometimes you only ever want the next smallest item: the next job due, the closest
  point. Sorting everything is overkill. You need the top one, fast, and room for more.

  Each parent here is no larger than its children. Reading the top is O(1). Pushing or
  popping is O(log n), because an item swaps its way up or down one level at a time. It
  lives in a plain array: the children of index i sit at 2i + 1 and 2i + 2.

  In Python it's `heapq`. JavaScript has none built in. Interviews often ask you to write one, or let you sort
  when n is small.
analogy: A sports knockout ladder. The winner is always at the top, and a new player only plays a few rounds to find their level.
example:
  language: python
  code: |
    import heapq

    def k_largest(nums, k):
        heap = []                     # min-heap of the best k so far
        for x in nums:
            heapq.heappush(heap, x)
            if len(heap) > k:
                heapq.heappop(heap)   # drop the smallest
        return sorted(heap, reverse=True)
usage: Keep a min-heap of size k; each new score costs log k, not a full sort.
twin:
  term: heap-memory
  difference: This heap is a data structure that keeps the smallest item on top. Heap memory is the part of memory where objects live, and the two share only a name.
related: [ priority-queue, binary-search-tree, heap-memory, comparator ]
