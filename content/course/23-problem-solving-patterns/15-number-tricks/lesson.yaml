id: algo.number-tricks
title: Divisors and exact numbers
objective: Loop only to the square root when a task is about divisors, and keep JavaScript numbers exact past 2^53 and through a negative remainder.
level: advanced
minutes: 10
concepts: [algo.divisors-and-gcd, algo.safe-integers]
prerequisites: [algo.dynamic-programming]
opening:
  text: >-
    You'll handle numbers up to two billion without timing out or going quietly wrong. Number
    tasks turn up in timed tests, and their traps are the same every time.

steps:
  - type: prose
    id: picture-number-tasks
    body: |-
      Number tasks hide two traps.

      **Size.** "n can be up to 2,147,483,647" means a loop from 1 to n takes seconds. You
      need a loop that stops much sooner.

      **Exactness.** JavaScript numbers stop being exact past 2^53, and `%` keeps the sign
      of a negative number. Both give wrong answers with no error.

      Signals: a huge n, "divisors" or "factors", big sums, "wrap around".

  - type: multiple-choice
    id: spot-sqrt-signal
    concept: algo.divisors-and-gcd
    difficulty: 1
    code: |
      // count the divisors of n, where n <= 2,147,483,647
    language: js
    question: Which loop fits a one-second limit?
    choices:
      - text: '`for (let i = 1; i * i <= n; i++)`'
        correct: true
        feedback: >-
          Yes. About 46,000 steps at most, which is instant.
      - text: '`for (let i = 1; i <= n; i++)`'
        feedback: >-
          Two billion steps. Correct, but it times out on the largest n.
      - text: '`for (let i = 1; i <= n / 2; i++)`'
        feedback: >-
          Halving still leaves a billion steps. It needs a far smaller bound.

  - type: prose
    id: divisor-pairs
    body: |-
      A **divisor** of n divides it with no remainder. Divisors come in pairs: `i` and
      `n / i`. For 24 that's 1 and 24, 2 and 12, 3 and 8, 4 and 6.

      One of each pair is at most the square root. So loop while `i * i <= n` and count two
      for each hit. A square's root pairs with itself, so count it once. That's O(√n).

  - type: code-challenge
    id: write-count-divisors
    concept: algo.divisors-and-gcd
    difficulty: 3
    language: python
    starter: divisors.starter.py
    solution: divisors.solution.py
    tests: divisors.tests.py
    prompt: >-
      A photo wall tool offers every grid, rows by columns, that holds exactly `n` photos.
      Write `grid_count(n)` in Python: the number of divisors of `n`, for `n` from 1.


      `grid_count(24)` is `8`: 1 × 24, 2 × 12, 3 × 8, 4 × 6 and the same turned round.


      **Target:** O(√n) for `n` up to 2,147,483,647. The tests include 1, a perfect square
      and the largest n. Looping to n runs out of time.
    hints:
      - Every divisor below the square root has a partner above it.
      - 'Loop `i` while `i * i <= n`. On a hit, count `i` and `n // i`.'
      - 'When `i * i == n`, the partner is `i` itself: count it once.'

  - type: prose
    id: safe-integers
    body: |-
      JavaScript numbers are exact only up to `Number.MAX_SAFE_INTEGER`, which is 2^53 − 1,
      about 9 × 10^15. Past it, sums round to the nearest number it can store.

      **BigInt** is a whole-number type with no size limit. Write `123n`, or convert with
      `BigInt(x)`. You can't mix the two types in one sum. Python's integers never overflow,
      so there it's never an issue.

  - type: predict-output
    id: predict-past-safe
    concept: algo.safe-integers
    difficulty: 2
    language: js
    code: |
      const big = Number.MAX_SAFE_INTEGER;
      console.log(big + 2);
      console.log(BigInt(big) + 2n);
    question: Do the two lines agree?
    choices:
      - text: No, the first is off by one
        correct: true
        feedback: >-
          Yes. `big + 2` is past 2^53, so it rounds. The BigInt line is exact.
      - text: Yes, both are exact
        feedback: >-
          Most people expect this. Past 2^53 a number can't hold every whole value, so it rounds.
      - text: No, the BigInt line throws
        feedback: >-
          `2n` is a BigInt too, so the types match. Mixing `2` with a BigInt would throw.

  - type: ai-review
    id: review-negative-modulo
    concept: algo.safe-integers
    difficulty: 3
    language: js
    request: Step through a photo carousel that wraps round at both ends.
    flawClass: edge-case
    code: |
      // move is 1 for next, -1 for previous
      function nextIndex(current, move, length) {
        return (current + move) % length;
      }
      const photos = ['sea', 'hill', 'lake'];
      console.log(photos[nextIndex(2, 1, photos.length)]);
      console.log(photos[nextIndex(0, -1, photos.length)]);
    prompt: >-
      An assistant wrote this. Its tests only pressed next, and wrapping to `sea` worked. The
      last line logs `undefined`. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`%` keeps the sign, giving `-1`'
        correct: true
        feedback: >-
          Right. In JavaScript `-1 % 3` is `-1`. Use `((x % length) + length) % length`.
      - text: The array is missing an item
        feedback: >-
          Three photos, three indexes. The index asked for is the problem, not the array.
      - text: '`move` should be a string'
        feedback: >-
          Numbers are right here. The arithmetic runs; it lands on an index that doesn't exist.
    fix: |
      return (((current + move) % length) + length) % length;

  - type: code-challenge
    id: write-exact-total
    concept: algo.safe-integers
    difficulty: 3
    language: ts
    prompt: >-
      A ledger export sums years of payments in pence, refunds included as negatives. The
      starter adds them as numbers and converts at the end. Make `exactTotal(amounts)`
      return the exact total as a `bigint`.


      `exactTotal([150, 250, -100])` is `300n`.


      **Target:** O(n) for up to 1,000,000 amounts, each within the safe range. The tests
      include totals past 2^53, where the starter's answer drifts.
    hints:
      - Each amount is exact on its own. Where does the rounding happen?
      - In the running total. Once it passes 2^53, each `+` can round.
      - 'Keep the total as a BigInt from the start: `let total = 0n`, then `total += BigInt(amount)`.'

  - type: explain-back
    id: explain-square-root
    concept: algo.divisors-and-gcd
    difficulty: 4
    prompt: >-
      The interviewer asks: your divisor loop stops at the square root. Why does it still
      find every divisor, and what does it cost?
    rubric:
      - Every divisor `i` has a partner `n / i`, and in each pair one is at most √n.
      - Each hit below the root reveals its partner; a square root is counted once.
      - The loop runs about √n times, so O(√n) time and O(1) space.
    modelAnswer: >-
      Divisors pair up: if `i` divides `n`, so does `n / i`. Both can't be above the square
      root, or their product would be more than `n`. So the loop meets the smaller one of
      every pair, and each hit gives the bigger one too. A perfect square's root pairs with
      itself, so it counts once. That's about √n steps: O(√n) time, O(1) space.

recap:
  - Loop to the square root with `i * i <= n` for divisor tasks.
  - Keep totals past 2^53 exact with BigInt.
  - Wrap negative indexes with `((x % m) + m) % m`.
recall:
  - id: card-divisor-loop
    concept: algo.divisors-and-gcd
    front: How do you count the divisors of n in O(√n)?
    back: >-
      Loop `i` while `i * i <= n`. Each hit counts two, `i` and `n / i`, except when
      `i * i === n`, which counts once.
  - id: card-safe-limit
    concept: algo.safe-integers
    front: Past which value do JavaScript numbers stop holding every whole number exactly?
    back: >-
      `Number.MAX_SAFE_INTEGER`, 2^53 − 1. Check with `Number.isSafeInteger(x)`, and use
      BigInt beyond it.
  - id: card-negative-modulo
    concept: algo.safe-integers
    front: What does `-1 % 3` give in JavaScript, and how do you wrap it?
    back: >-
      `-1`, since `%` keeps the sign of the left side. Use `((x % m) + m) % m` to get `2`.

