approach: >-
  Every best banner is as tall as some building K and stretches left and right until it
  meets a lower building. A stack of indices with rising heights finds both edges at once:
  when a lower building arrives, each taller one popped from the stack has found its right
  edge, and the index now below it is its left edge. Every building is pushed and popped
  once, so the pass is O(N).
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N up to 100,000** rules out trying every pair of edges.
      Heights reach **1,000,000,000**, so an area can reach 10^14.

      That still fits exactly in a JavaScript number and a Python integer, so no special
      types are needed.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it without the street: it is a classic, and naming it helps you plan. Put it at
      the top of the file.
    code:
      ts: |-
        // Largest rectangle under a histogram: max over segments of width times the lowest height.
      python: |-
        # Largest rectangle under a histogram: max over segments of width times the lowest height.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - a single building;
      - all heights zero;
      - heights rising, so nothing pops until the end;
      - a zero in the middle that splits the row.
    input:
      - "[7]"
      - "[0, 0, 0]"
      - "[1, 2, 3, 4, 5]"
      - "[4, 4, 0, 3, 3, 3]"
  - kind: plan
    title: Plan a correct O(N²) version first
    minutes: 2
    body: |-
      Fix the left edge, then move the right edge outwards while tracking the lowest height
      so far. The area is that height times the width. Keep the best.

      It is O(N²): correct on the small tests, too slow on 100,000 buildings.
  - kind: write
    title: Bank the slow version yourself
    minutes: 3
    body: |-
      Type it yourself: two loops and a running minimum. It earns the correctness points
      now and becomes the reference for the stack version.
    code:
      ts: |-
        // Largest rectangle under a histogram: max over segments of width times the lowest height.
        // Every left edge, extended right with a running minimum: O(N^2), slow.
        function solution(H: number[]): number {
            let best = 0;
            for (let left = 0; left < H.length; left++) {
                let low = H[left];
                for (let right = left; right < H.length; right++) {
                    low = Math.min(low, H[right]);
                    best = Math.max(best, low * (right - left + 1));
                }
            }
            return best;
        }
      python: |-
        # Largest rectangle under a histogram: max over segments of width times the lowest height.
        # Every left edge, extended right with a running minimum: O(N^2), slow.
        def solution(H):
            best = 0
            for left in range(len(H)):
                low = H[left]
                for right in range(left, len(H)):
                    low = min(low, H[right])
                    best = max(best, low * (right - left + 1))
            return best
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Keep your results: the stack version
      must return the same.
    expect: >-
      Two OKs, then 7, 0, 9 and 9 for your cases.
  - kind: plan
    title: Let each building find its own edges
    minutes: 4
    body: |-
      Think per building: the widest banner exactly its height stretches until a lower
      building on each side. A **monotonic stack** of indices with rising heights finds
      both.

      When a building is lower than the top of the stack, pop. The popped one ends here on
      the right, and the new top is its left edge. A final height 0 flushes the stack.
  - kind: ask-ai
    title: Check the tie rule, not the method
    minutes: 1
    body: |-
      Equal heights are where stack solutions go wrong. Ask about that one detail. It is a
      narrow question, and it does not hand the solution to the assistant.
    prompt: >-
      In the monotonic stack method for the largest rectangle in a histogram, if I pop on
      greater-or-equal heights instead of strictly greater, is the maximum area still
      correct? One sentence of why, no code.
    expect: >-
      Yes: the last of the equal buildings to pop gets the full width, so the maximum is
      still found.
  - kind: optimise
    title: Write the stack version yourself
    minutes: 6
    body: |-
      This is the core of the task, so do not delegate it. Loop one step past the end with
      height 0, so every building left on the stack is measured. Your rising-heights case
      tests exactly that.
    code:
      ts: |-
        // Largest rectangle under a histogram: max over segments of width times the lowest height.
        // Monotonic stack of indices: each building pushed and popped once, O(N) time.
        function solution(H: number[]): number {
          // The stack holds indices of rising heights. When a lower building arrives, every
          // taller one on the stack has found its right edge, and the index below it on the
          // stack is its left edge. The extra 0 at the end flushes whatever is left: O(N).
          const stack: number[] = [];
          let best = 0;
          for (let i = 0; i <= H.length; i++) {
            const height = i === H.length ? 0 : H[i]!;
            while (stack.length > 0 && H[stack[stack.length - 1]!]! >= height) {
              const top = stack.pop()!;
              const left = stack.length === 0 ? -1 : stack[stack.length - 1]!;
              best = Math.max(best, H[top]! * (i - left - 1));
            }
            stack.push(i);
          }
          return best;
        }
      python: |-
        # Largest rectangle under a histogram: max over segments of width times the lowest height.
        # Monotonic stack of indices: each building pushed and popped once, O(N) time.
        def solution(H):
            # A stack of indices with rising heights finds both edges of every banner: O(N).
            stack = []
            best = 0
            n = len(H)
            for i in range(n + 1):
                height = H[i] if i < n else 0
                while stack and H[stack[-1]] >= height:
                    top = stack.pop()
                    left = stack[-1] if stack else -1
                    area = H[top] * (i - left - 1)
                    if area > best:
                        best = area
                stack.append(i)
            return best
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write random inputs
    minutes: 2
    body: |-
      Random rows with repeated heights are where a stack slip shows. Let the assistant
      write the lines, then compare the slow and fast versions on each. Do not ask for the
      answers.
    prompt: >-
      Give me 4 test input lines in the format [2, 1, 5]: arrays of 10 to 15 random integers
      between 0 and 6, with repeated values next to each other in at least two of them.
      Lines only, no answers and no code.
    expect: Four lines. The stack version returns the same value as the slow one on each.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours. The left edge when the stack is empty
      is the usual slip.
    prompt: >-
      Review my current solution for the left edge when the stack is empty, equal heights,
      overflow, and time complexity. List any problems in one line each. Do not rewrite
      the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and the scratch slow version. Check the header comment states
      the complexity. Then submit.
