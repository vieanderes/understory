term: cosine similarity
aka:
  - cosine distance
short: A score from -1 to 1 for how closely two vectors point the same way, whatever their length.
explain: |
  An embedding turns text into a list of numbers, an arrow in a space with many
  dimensions. Texts with similar meaning point in similar directions.

  This score is the cosine of the angle between two arrows. Same direction gives 1.
  At right angles gives 0. Opposite gives -1. Length is ignored, so a long text and a short
  one on the same topic still match.

  If the vectors are already normalised to length 1, it equals the dot product, which is
  cheaper. Most embedding models return normalised vectors, but check.
analogy: Two people pointing at the same star from different hills. Their arms differ in length but point the same way.
example:
  language: js
  code: |
    function cosine(a, b) {
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        na += a[i] * a[i];
        nb += b[i] * b[i];
      }
      return dot / (Math.sqrt(na) * Math.sqrt(nb));
    }
usage: Rank the chunks by cosine similarity and drop anything under 0.3.
