  - >-
    A failed submit keeps every answer and focuses the first wrong field.
  - >-
    Status messages sit in live regions present before their text changes; a failed order uses `role="alert"`.
  - >-
    Every animation is inside `prefers-reduced-motion: no-preference` or uses `motion-safe:`, and scrolling is instant under reduce.
