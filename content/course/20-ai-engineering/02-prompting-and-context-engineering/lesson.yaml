id: ai.prompting-and-context
title: Prompting and context engineering
objective: "Write a system prompt and examples that pin down the output, and decide what goes into the model's limited context."
level: essential
minutes: 10
concepts: [ai.system-prompts, ai.few-shot, ai.context-window]
prerequisites: [ai.how-llms-work]
opening:
  text: >-
    You'll write instructions a model follows every turn, and keep a long chat from
    blowing its budget. Most "the AI got it wrong" bugs are fixed here, not in the model.

steps:
  - type: prose
    id: stateless
    body: |-
      A model remembers nothing between calls. A chat only looks like it remembers,
      because your app sends the whole conversation every time:

      ```python
      messages = [
          {"role": "user", "content": "Suggest a pasta dish."},
          {"role": "assistant", "content": "Try cacio e pepe."},
          {"role": "user", "content": "Without cheese?"},
      ]
      ```

      `"assistant"` marks the model's earlier replies. Without them, "Without cheese?"
      would make no sense to it.

  - type: fill-blank
    id: fill-second-turn
    concept: ai.system-prompts
    difficulty: 1
    language: python
    prompt: >-
      Send the second turn. `first_reply` is the text of the model's first answer.
    template: |
      messages = [
          {"role": "user", "content": "Plan a 3-day trip to Porto."},
          {"role": {{1}}, "content": {{2}}},
          {"role": "user", "content": "Make day 2 rainy-day friendly."},
      ]
    blanks:
      - key: '1'
        answer: '"assistant"'
      - key: '2'
        answer: first_reply
    bank: ['"assistant"', '"model"', '"system"', first_reply, '"Plan a 3-day trip to Porto."']

  - type: prose
    id: system-prompt
    body: |-
      Instructions that hold for every turn go in the **system prompt**, sent as `system`
      beside the messages:

      ```python
      SYSTEM = """You tag customer emails for a bike shop.
      Reply with exactly one line: Category: billing, delivery or product.
      Emails about parts or accessories are product."""
      ```

      Be specific. Say the task, the rules, and the exact output format your code expects.
      The model can't read your mind, or your parsing code.

  - type: ai-review
    id: review-vague-format
    concept: ai.system-prompts
    difficulty: 2
    language: python
    request: Tag each email and route it to the right team.
    flawClass: logic
    code: |
      SYSTEM = "You sort customer emails for a bike shop. Be helpful and concise."

      def tag(client, email):
          reply = client.messages.create(model="claude-opus-5-5", max_tokens=100,
              system=SYSTEM, messages=[{"role": "user", "content": email}])
          line = reply.content[0].text
          return line.removeprefix("Category: ")
    prompt: >-
      An assistant wrote this. Some tags come back as `This looks like a billing question!`
      and route nowhere. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The prompt never says what to reply with
        correct: true
        feedback: >-
          Yes. The code expects `Category: ...`, and nothing asks for it.
      - text: '`max_tokens` of 100 cuts the reply short'
        feedback: >-
          The replies are short. They're in a shape nobody asked for.
      - text: The email should go in the system prompt
        feedback: >-
          The email changes each call, so it belongs in the messages. The rules are missing.
    fix: |
      SYSTEM = """You tag customer emails for a bike shop.
      Reply with exactly one line: Category: billing, delivery or product."""

  - type: prose
    id: few-shot
    body: >-
      Describing a format is hard. Showing it is quick: two or three worked examples in the
      prompt set the shape of the answer better than a paragraph of rules. These are
      **few-shot examples**. Learning a task from the prompt alone, with no retraining, is
      called **in-context learning**.


      The model copies the pattern, flaws included. A wrong label or a stray full stop in
      an example turns up in the output.

  - type: bug-hunt
    id: hunt-bad-example
    concept: ai.few-shot
    difficulty: 2
    language: text
    code: |
      Tag each email as billing, delivery or product.

      Email: My card was charged twice.
      Category: billing

      Email: The parcel hasn't arrived after a week.
      Category: delivery

      Email: Do you sell a lock for this bike?
      Category: delivery
    prompt: >-
      Since this prompt went live, questions about products keep getting tagged as
      delivery. Tap the line at fault.
    lines: [10]
    reasons:
      - text: The third example is labelled wrong
        correct: true
        feedback: >-
          Yes. A lock is a product. The model copied the mistake, like everything else.
      - text: Two delivery examples are too many
        feedback: >-
          Balance helps, but two right examples would do no harm. One of them is wrong.
      - text: The instruction should come last
        feedback: >-
          Instruction first, then examples, is the usual order. Order isn't the problem.
    fix: |
      Email: Do you sell a lock for this bike?
      Category: product

  - type: prose
    id: context-window
    body: >-
      A model reads at most a fixed number of tokens per call: its **context window**. The
      system prompt, every message and the reply all share it.


      The app resends the whole chat, so each turn costs more than the last. A long chat
      finally doesn't fit. So you choose what to send: the rules, the recent turns, and
      only the documents that matter. Choosing well is called **context engineering**.

  - type: code-challenge
    id: write-fit-context
    concept: ai.context-window
    difficulty: 3
    language: python
    starter: context.starter.py
    solution: context.solution.py
    tests: context.tests.py
    prompt: >-
      Write `build_request(system, history, question, keep)`. Return a dict with `"system"`
      and `"messages"`.


      The messages are the last `keep` messages of `history`, then the new question as a user
      message. The API needs the first message to come from the user, so drop a leading
      assistant message. Don't change `history`.
    hints:
      - A slice with a negative start takes items from the end.
      - After slicing, look at the role of the first message.
      - '`recent = history[-keep:]`, then check `recent[0]["role"]` if `recent` has any.'

  - type: explain-back
    id: explain-forgets
    concept: ai.context-window
    difficulty: 3
    prompt: >-
      A user says the assistant "forgot" the allergy they mentioned 50 messages ago. What
      probably happened, and how could the app keep it?
    rubric:
      - The model only sees what the app sends in this call.
      - The early message was trimmed to fit the context window or the budget.
      - Facts that must last belong in the system prompt or a saved summary, sent every turn.
    modelAnswer: >-
      The model has no memory of its own. It sees only what my app sends. My app keeps only
      the recent turns, so the allergy fell off. Facts that matter should be sent every
      time. The system prompt or a short summary can carry them.

recap:
  - Send the whole conversation each call, with `"user"` and `"assistant"` turns.
  - Put rules and the exact output format in the system prompt, and show it with examples.
  - Trim what you send to fit the context window, keeping what matters.

recall:
  - id: card-stateless
    concept: ai.system-prompts
    front: How does a chat app make the model remember earlier turns?
    back: >-
      It resends the whole conversation in `messages` on every call. The model itself
      remembers nothing.
  - id: card-system-prompt
    concept: ai.system-prompts
    front: What belongs in a system prompt?
    back: >-
      The task, the rules and the exact output format, which hold for every turn.
  - id: card-few-shot
    concept: ai.few-shot
    front: Why check few-shot examples as carefully as code?
    back: >-
      The model copies them, flaws included. A wrong label in an example becomes wrong
      output.
  - id: card-context-window
    concept: ai.context-window
    front: What shares a model's context window?
    back: >-
      The system prompt, every message sent, and the reply. Everything is counted in
      tokens.

