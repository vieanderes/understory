id: html.first-page
title: Your first web page
objective: Write headings and paragraphs, and nest elements into a whole page.
level: essential
minutes: 10
concepts: [html.elements, html.nesting]
prerequisites: [basics.small-program]
opening:
  text: >-
    You'll write a real web page and watch the browser draw it as you type. Every site you've
    ever visited starts with the few tags you'll learn here.

steps:
  - type: prose
    id: what-html-is
    body: |-
      A web page is a text file. **HTML** is how you tell the browser what each bit of text
      is. You wrap the text in tags:

      ```html
      <h1>Pancakes</h1>
      <p>Fluffy, quick and ready in 20 minutes.</p>
      ```

      `h1` means "main heading". `p` means "paragraph". The browser, the app you read
      websites in, draws each one to match.

  - type: playground
    id: try-first-page
    prompt: >-
      This is live HTML, and the preview shows what a browser draws. Change the heading
      to your favourite food. Then change the paragraph to match.
    html: |
      <h1>Pancakes</h1>
      <p>Fluffy, quick and ready in 20 minutes.</p>
    editable: [html]

  - type: prose
    id: anatomy-of-an-element
    body: |-
      Look at one line closely:

      ```html
      <p>Serves four</p>
      ```

      `<p>` is the start tag. `</p>` is the end tag: the same name with a slash. The
      text between them is the content. All three together make an **element**, one piece of
      the page.

  - type: multiple-choice
    id: pick-end-tag
    concept: html.elements
    difficulty: 1
    language: html
    code: |
      <h1>Lemon cake</h1>
    question: Which part is the end tag?
    choices:
      - text: '`</h1>`'
        correct: true
        feedback: >-
          Yes. The slash marks where the heading stops.
      - text: '`<h1>`'
        feedback: >-
          That's the start tag. The end tag repeats the name with a slash in front.
      - text: '`Lemon cake`'
        feedback: >-
          That's the content, the text that sits between the two tags.

  - type: prose
    id: headings-and-paragraphs
    body: >-
      Headings come in six levels, `h1` to `h6`. `h1` is the title of the page. `h2` starts a
      section, `h3` a part of that section, and so on.


      Browsers draw headings big and bold. But the tag says what the text **is**, not how it
      looks. You'll change the looks later with CSS, the styling language.

  - type: playground
    id: build-recipe-card
    concept: html.elements
    difficulty: 1
    prompt: >-
      Add a section to this recipe. Under the paragraph, add an `h2` that says Ingredients.
      Below it, add a paragraph listing a few of them.
    html: |
      <h1>Pancakes</h1>
      <p>Fluffy, quick and ready in 20 minutes.</p>
    editable: [html]
    checks:
      - label: The page has one `h2`
        selector: h2
        count: 1
      - label: The `h2` says Ingredients
        selector: h2
        text: Ingredients
      - label: The page has two paragraphs
        selector: p
        count: 2
    solution:
      html: |
        <h1>Pancakes</h1>
        <p>Fluffy, quick and ready in 20 minutes.</p>
        <h2>Ingredients</h2>
        <p>Flour, eggs, milk and a pinch of salt.</p>
    hints:
      - The new heading goes after the end tag `</p>`.
      - A second-level heading is written `<h2>Ingredients</h2>`.
      - Then add another `<p>` with its own `</p>`.

  - type: playground
    id: fix-line-breaks
    concept: html.elements
    difficulty: 2
    prompt: >-
      The list is typed on three lines, but the browser shows one. It treats a line break
      like a space. Put each item in its own paragraph.
    html: |
      <h1>Shopping</h1>
      <p>Eggs
      Flour
      Milk</p>
    editable: [html]
    checks:
      - label: The page has three paragraphs
        selector: p
        count: 3
      - label: The first paragraph says Eggs
        selector: p
        text: Eggs
      - label: The last paragraph says Milk
        selector: 'p:last-of-type'
        text: Milk
    solution:
      html: |
        <h1>Shopping</h1>
        <p>Eggs</p>
        <p>Flour</p>
        <p>Milk</p>
    hints:
      - Each item needs its own start tag and end tag.
      - The first line becomes `<p>Eggs</p>`.
      - Do the same for Flour and Milk.

  - type: prose
    id: nesting
    body: |-
      Elements can sit inside other elements. `strong` marks important words, and browsers
      make them bold:

      ```html
      <p>Bake for <strong>20 minutes</strong>.</p>
      ```

      This is **nesting**, like boxes in boxes: the inner one closes first.

      A whole page nests too. `<!doctype html>` comes first and says "modern HTML". Then
      everything sits in `html`: `head` holds facts about the page, like the tab's `title`,
      and `body` holds what you see.

  - type: parsons
    id: arrange-page-skeleton
    concept: html.nesting
    difficulty: 2
    prompt: >-
      Put the lines of a whole page file in order. One line doesn't belong.
    language: html
    blocks:
      - id: doctype
        code: <!doctype html>
      - id: html-open
        code: <html>
      - id: head-open
        code: <head>
        indent: 1
      - id: title
        code: <title>Pancakes</title>
        indent: 2
      - id: head-close
        code: </head>
        indent: 1
      - id: body-open
        code: <body>
        indent: 1
      - id: heading
        code: <h1>Pancakes</h1>
        indent: 2
      - id: body-close
        code: </body>
        indent: 1
      - id: html-close
        code: </html>
    distractors:
      - id: mismatched-heading
        code: <h1>Pancakes</p>
        feedback: >-
          An end tag repeats the name of its start tag. This `h1` needs `</h1>`.

  - type: explain-back
    id: explain-file-and-page
    concept: html.elements
    difficulty: 3
    prompt: >-
      A friend asks why a web page needs tags at all. Why not type the words and let the
      browser show them?
    rubric:
      - Tags tell the browser what each piece of text is, like a heading or a paragraph.
      - The browser uses that to draw each piece, and line breaks alone do nothing.
      - The tag names the meaning, and styling can change the looks later.
    modelAnswer: >-
      Without tags, the browser sees one long run of words. Line breaks don't even count. Tags
      say what each piece is: this is the main heading, this is a paragraph. The browser draws
      each one to match. The tag names the meaning, and you can restyle the looks later with
      CSS.

recap:
  - Write elements with a start tag, content and an end tag.
  - Build a page from headings and paragraphs, and nest elements properly.
  - Lay out a whole file with `head` and `body`.

recall:
  - id: card-element-parts
    concept: html.elements
    front: What three parts make up an element like `<p>Serves four</p>`?
    back: >-
      The start tag `<p>`, the content `Serves four` and the end tag `</p>`.
  - id: card-line-breaks
    concept: html.elements
    front: You press Enter between words inside a `p`. What does the browser show?
    back: >-
      The words on one line. A line break in the text counts as a space. A new line needs a
      new element.
  - id: card-nesting-order
    concept: html.nesting
    front: In `<p>Bake for <strong>20 minutes</strong>.</p>`, which end tag comes first, and why?
    back: >-
      `</strong>`. It's inside the `p`, so the inner element closes before the outer one.
  - id: card-head-and-body
    concept: html.nesting
    front: What goes in `head`, and what goes in `body`?
    back: >-
      `head` holds facts about the page, such as its `title`. `body` holds everything you see.

