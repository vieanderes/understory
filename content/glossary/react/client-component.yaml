term: Client Component
aka:
  - "'use client'"
short: A component whose code also goes to the browser, so it can use state, effects and clicks.
explain: |
  Put `'use client'` at the top of a file. That file, and everything it imports, is bundled
  for the browser. It still renders on the server first, then hydrates.

  The line marks a boundary, not one component. Put it high up and you ship far more code than
  you need. Put it on the small interactive parts and pass server-rendered content into them
  as `children`.
analogy: A display car in a showroom that comes with its keys. It looks like the photo, and you can also drive it.
example:
  language: tsx
  code: |
    'use client';
    import { useState } from 'react';

    export function LikeButton() {
      const [liked, setLiked] = useState(false);
      return <button onClick={() => setLiked(!liked)}>{liked ? 'Liked' : 'Like'}</button>;
    }
usage: The whole layout became a Client Component because of one dropdown; move the directive down.
twin:
  term: server-component
  difference: A Client Component's code goes to the browser, so it can be interactive. A Server Component stays on the server and sends only its output.
related:
  - server-component
  - hydration
  - state
level: 2
lessons:
  - next.server-and-client-components
