id: clean.code-smells
title: Code smells and refactoring moves
objective: Recognise common smells, apply the matching refactoring move, and refactor safely under tests.
level: advanced
minutes: 10
concepts: [clean.code-smells, clean.refactoring-moves, clean.refactoring-under-tests]
prerequisites: [testing.tdd]
opening:
  text: >-
    You'll learn to name what feels wrong in a piece of code, and the safe move that fixes
    it. Named smells turn "I don't like this" into a review comment people can act on.

steps:
  - type: prose
    id: what-a-smell-is
    body: |-
      Some code works but feels wrong. A **code smell** names that feeling: a sign the design
      may need work, but not a bug. Two to know:

      - **Shotgun surgery**: one change needs edits in many places.
      - **Primitive obsession**: a plain number or string stands in for a real idea, such as
        pence or an email.

      A name turns "I don't like this" into a review comment people can act on.

  - type: multiple-choice
    id: pick-shotgun-surgery
    concept: clean.code-smells
    difficulty: 1
    question: Adding a new delivery option means editing four files. Which smell is that?
    choices:
      - text: Shotgun surgery
        correct: true
        feedback: >-
          Yes. One idea is spread across four places, so every change hits all of them.
      - text: Primitive obsession
        feedback: >-
          That's about plain values standing in for ideas. This is one change spread wide.
      - text: No smell, that's normal
        feedback: >-
          It's common, which isn't the same. Each of the four edits is a chance to miss one.

  - type: bug-hunt
    id: predict-pence-or-euros
    concept: clean.code-smells
    difficulty: 2
    language: ts
    code: |
      function formatPrice(pence: number, currency: string): string {
        return `${(pence / 100).toFixed(2)} ${currency}`;
      }

      const basketPence = 1999;
      const refundEuros = 19.99;

      console.log(formatPrice(basketPence, 'EUR'));   // 19.99 EUR
      console.log(formatPrice(refundEuros, 'EUR'));   // 0.20 EUR
    prompt: >-
      A customer's refund email says "0.20 EUR" instead of "19.99 EUR". TypeScript raised no
      error. Tap the line with the bug.
    lines: [9]
    reasons:
      - text: It passes euros where pence are expected
        correct: true
        feedback: >-
          Yes. Both are `number`, so nothing stops the mix-up. That's primitive obsession.
      - text: '`toFixed(2)` rounds the wrong way'
        feedback: >-
          It rounds correctly. It got 0.1999 because the input was in euros, not pence.
      - text: The currency should be lower case
        feedback: >-
          The currency prints fine. The amount is a hundred times too small.
    fix: |
      // brand it, as in the TypeScript lesson, so euros can't pass for pence
      type Pence = number & { readonly brand: 'Pence' };

      function formatPrice(pence: Pence, currency: string): string {
        return `${(pence / 100).toFixed(2)} ${currency}`;
      }

  - type: prose
    id: two-switches
    body: |-
      Here's shotgun surgery inside one function. A `switch` compares one value with each
      `case`, and runs that case's lines until `break`:

      ```js
      function quote(method, grams) {
        let cost = 0;
        switch (method) {
          case 'standard': cost = 300 + Math.ceil(grams / 500) * 100; break;
          case 'express': cost = 900 + Math.ceil(grams / 500) * 150; break;
        }
        let days = 0;
        switch (method) {
          case 'standard': days = 3; break;
          case 'express': days = 1; break;
        }
        return { cost, days };
      }
      ```

      A new method means editing both switches.

  - type: prose
    id: pin-behaviour
    body: >-
      Before you touch it, is there a test? Old code often has none. So first write tests that
      pin what the code does today, even where it looks wrong. They're called
      **characterisation tests**.


      Then refactor in small moves, running them after each one. Green means you kept the
      behaviour. Fixing a real bug is a separate change.

  - type: multiple-choice
    id: pick-characterisation-test
    concept: clean.refactoring-under-tests
    difficulty: 2
    question: >-
      You pin `quote('express', 600)` with a test expecting `1150`. It fails: the code returns
      `1200`. What next?
    choices:
      - text: Change the test to expect `1200`, then refactor
        correct: true
        feedback: >-
          Yes. Pin what the code does now. Question the `1200` later, separately.
      - text: Fix the code so it returns `1150`
        feedback: >-
          Maybe `1200` is wrong, but fixing it mid-refactor mixes two changes. Callers may rely on it.
      - text: Delete the test and refactor carefully
        feedback: >-
          Careful isn't checked. Without a test, you can't claim the behaviour stayed the same.

  - type: code-challenge
    id: write-shipping-rules
    concept: clean.refactoring-moves
    difficulty: 3
    language: ts
    prompt: >-
      `quote(method, grams)` has two `switch` statements, one for cost and one for days. The
      tests pin today's behaviour. Export a `rules` object with one entry per method, each
      holding `cost(grams)` and `days`.


      Then make `quote` read its entry. Keep the tests green: every quote gives the same
      `{ cost, days }` as before.
    hints:
      - Put the two cases for each method side by side. They belong in one place.
      - Each entry needs a function for cost, because cost depends on the weight, and a plain number for days.
      - "Start with `export const rules = { standard: { cost: (grams: number) => ..., days: 3 }, ... }`."

  - type: ai-review
    id: review-extracted-boundary
    concept: clean.refactoring-under-tests
    difficulty: 3
    language: ts
    request: Refactor checkout by extracting the free-delivery rule. Don't change behaviour.
    flawClass: edge-case
    code: |
      const FREE_DELIVERY_PENCE = 5000;

      function hasFreeDelivery(totalPence: number): boolean {
        return totalPence > FREE_DELIVERY_PENCE;
      }

      function deliveryFee(totalPence: number): number {
        return hasFreeDelivery(totalPence) ? 0 : 399;
      }
    prompt: >-
      An assistant extracted this from `if (total >= 5000) fee = 0`. The tests used 1000 and
      9000 and stayed green. Tap the line that changed behaviour.
    lines: [4]
    reasons:
      - text: A 5000 pence order now pays for delivery
        correct: true
        feedback: >-
          Exactly. `>=` became `>`. Only a test at exactly 5000 catches that.
      - text: The constant should be `50`
        feedback: >-
          The old rule used pence, 5000. The constant is right, the comparison isn't.
      - text: '399 should be a named constant too'
        feedback: >-
          A fair nit, but it doesn't change behaviour. Line 4 does.
    verify:
      question: Which totals should the tests pin before the next refactor?
      choices:
        - text: 5000, plus one pence either side
          correct: true
          feedback: >-
            Yes. The rule's edge is where `>=` and `>` part ways.
        - text: Totals well inside each side, like 1000 and 9000
          feedback: >-
            Those are the tests that stayed green. Both comparisons agree far from the edge.
        - text: A random total between 1 and 10000
          feedback: >-
            It almost never lands on exactly 5000, so the edge stays untested.
    fix: |
      function hasFreeDelivery(totalPence: number): boolean {
        return totalPence >= FREE_DELIVERY_PENCE;
      }

  - type: explain-back
    id: explain-small-steps
    concept: clean.refactoring-under-tests
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      The assistant's tests stayed green, yet behaviour changed. What would you add before the
      next refactor, and why run the tests after each small move?
    rubric:
      - Characterisation tests pin today's behaviour, including the edges such as exactly 5000.
      - Each move is small, so a failure points at the move that caused it.
      - One run at the end leaves many changes to search when something fails.
    modelAnswer: >-
      First I'd pin the edge: a test at exactly 5000, plus one either side, so the boundary is
      part of what the tests protect. Then I'd refactor in small moves and run the tests after
      each. If they go red, the last move is the cause, and I undo or fix it straight away.
      One run at the end could point at any of twenty changes.

recap:
  - Name smells such as shotgun surgery and primitive obsession in a review.
  - Pin today's behaviour with characterisation tests before you change old code.
  - Refactor in small, green moves, such as one rules entry per case.
recall:
  - id: card-code-smell
    concept: clean.code-smells
    front: What is a code smell?
    back: >-
      A sign that the design may need work, such as a long parameter list. It isn't a bug by
      itself.
  - id: card-shotgun-surgery
    concept: clean.code-smells
    front: What is shotgun surgery?
    back: >-
      One change forces edits in many places, because one idea is spread across the code.
  - id: card-refactoring-move
    concept: clean.refactoring-moves
    front: Two `switch` statements branch on the same value. Which move fixes that?
    back: >-
      Put each case's rules in one entry of a lookup object, so a new case is one new entry.
  - id: card-characterisation
    concept: clean.refactoring-under-tests
    front: Before refactoring untested code, what do you write first?
    back: >-
      Tests that pin what the code does now, even if it looks wrong. Fix behaviour separately.

references:
  - kind: docs
    title: Catalog of Refactorings
    authors: Martin Fowler
    venue: refactoring.com
    url: https://refactoring.com/catalog/
    note: Every named move, with before and after code.
    primary: true
    verified: true
  - kind: essay
    title: Code Smell
    authors: Martin Fowler
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/CodeSmell.html
    note: What a smell is, and why it's a hint rather than a rule.
    primary: true
    verified: true
  - kind: docs
    title: Introduce Parameter Object
    authors: Martin Fowler
    venue: Refactoring catalog
    url: https://refactoring.com/catalog/introduceParameterObject.html
    note: The move for long parameter lists.
    verified: true

deepDive: >-
  The move in the challenge has a formal name: replace conditional with polymorphism. Here
  the "types" are plain objects in a lookup, which is often all you need. With classes,
  each method would be its own class with `cost` and `days` methods.


  Two more named smells. A long parameter list is fixed with a parameter object, from the
  functions lesson. Feature envy is a function busier with another object's data than its
  own, and it's fixed by moving the function next to that data. Characterisation tests describe what the code
  does, not what it should do. Fix real bugs later as separate commits that change a test on
  purpose.


  Editors do many moves for you: rename, extract function, inline and move. Automated
  moves are safer than hand edits, because they update every caller at once.


  Two switches that must stay in step are a rule the code relies on but never states. "What
  confuses the next person" calls that a hidden invariant. It shows how to keep such a rule
  in one place, so the next change can't break half of it.
