id: python.functions
title: Functions
objective: Define functions with defaults and keyword arguments, accept *args and **kwargs, and avoid the mutable default trap.
level: essential
minutes: 10
concepts: [python.functions, python.keyword-arguments, python.args-kwargs, python.mutable-default]
prerequisites: [python.dicts-and-sets]
opening:
  text: >-
    You'll write Python functions that take arguments by name, with sensible defaults, the
    way every model SDK is called. You'll also learn the one default that quietly shares data.

steps:
  - type: prose
    id: def-and-none
    body: |-
      You've met `def`. Two things differ from JavaScript. Leave out `return`, and the
      function still gives something back: **None**, Python's "nothing here". And a missing
      argument is an error, never a quiet `undefined`:

      ```python
      def area(width, height):
          return width * height

      area(3)  # TypeError: area() missing 1 required positional argument: 'height'
      ```

  - type: predict-output
    id: predict-print-not-return
    concept: python.functions
    difficulty: 2
    language: python
    code: |
      def add(a, b):
          print(a + b)

      result = add(2, 3)
      print(result)
    question: What does this show?
    choices:
      - text: '`5` then `None`'
        correct: true
        feedback: >-
          Right. `add` prints 5 but returns nothing, so `result` is `None`.
      - text: '`5` then `5`'
        feedback: >-
          Printing isn't returning. The function shows 5, then hands back `None`.
      - text: '`None` then `5`'
        feedback: >-
          The call runs first, printing 5. Only then is `result` shown.

  - type: prose
    id: keywords-and-defaults
    body: |-
      A parameter can have a **default**, used when the caller leaves it out. Callers can
      also pass arguments by name, in any order:

      ```python
      def book(room, nights=1, breakfast=False):
          return f"{room}: {nights}, {breakfast}"

      print(book("Suite", breakfast=True))
      ```

      This shows `Suite: 1, True`. Naming `breakfast` skips over `nights`, which keeps its
      default.

  - type: bug-hunt
    id: hunt-positional
    concept: python.keyword-arguments
    difficulty: 2
    language: python
    code: |
      def label(text, size=12, bold=False):
          return f"{text} size={size} bold={bold}"

      print(label("Warning", True))
    prompt: 'This should print a bold label at size 12. It prints `Warning size=True bold=False`. Tap the line at fault.'
    lines: [4]
    reasons:
      - text: Unnamed arguments fill the slots in order
        correct: true
        feedback: >-
          Right. `label("Warning", bold=True)` names the slot you mean.
      - text: '`bold` needs a default of `True`'
        feedback: >-
          Then every label would be bold. The call has to say which slot it fills.
      - text: The f-string mixes up the names
        feedback: >-
          The f-string shows what each name holds. `True` landed in `size`.
    fix: |
      print(label("Warning", bold=True))

  - type: prose
    id: defaults-made-once
    body: |-
      One trap. Python builds a default value once, when the `def` line runs, not on each
      call. Every call that leaves the argument out gets that same object. A number can't
      change, so sharing it is harmless. A list can change. The safe form defaults to
      `None` and makes a new list inside:

      ```python
      def add_tag(tag, tags=None):
          if tags is None:
              tags = []
          tags.append(tag)
          return tags
      ```

  - type: ai-review
    id: review-shared-default
    concept: python.mutable-default
    difficulty: 3
    language: python
    request: Write add_tag(tag, tags) that returns the list of tags with the new one added.
    flawClass: logic
    code: |
      def add_tag(tag, tags=[]):
          tags.append(tag)
          return tags

      print(add_tag("urgent"))
      print(add_tag("home"))
    prompt: >-
      An assistant wrote this, and a test with one call passed. The second call shows
      `['urgent', 'home']`. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The default list is made once and shared
        correct: true
        feedback: >-
          Exactly. Every call without `tags` gets the same list, so tags pile up.
      - text: '`append` adds the tag twice'
        feedback: >-
          Each call appends once. The first tag is still there from the earlier call.
      - text: '`return tags` returns an old copy'
        feedback: >-
          There's no copy at all. Both calls return the very same list.
    fix: |
      def add_tag(tag, tags=None):
          if tags is None:
              tags = []
          tags.append(tag)
          return tags

  - type: prose
    id: args-and-kwargs
    body: |-
      A starred parameter collects extra arguments. `*args` gathers the unnamed ones into a
      tuple, and `**kwargs` gathers the named ones into a dict:

      ```python
      def log(*parts, **fields):
          print(parts, fields)

      log("saved", "draft", user="ana")
      # ('saved', 'draft') {'user': 'ana'}
      ```

      The stars work in calls too: `f(*items)` spreads a list, and `f(**options)` a dict.
      `{**defaults, "model": "large"}` copies a dict with one key changed.

  - type: fill-blank
    id: fill-star
    concept: python.args-kwargs
    difficulty: 3
    prompt: Complete it so `longest("fig", "banana", "kiwi")` returns `6`. `len(word)` gives the length of `word`.
    language: python
    template: |
      def longest({{1}}words):
          best = 0
          for word in words:
              if len(word) > best:
                  best = {{2}}
          return best
    blanks:
      - key: '1'
        answer: '*'
      - key: '2'
        answer: len(word)
    bank: ['*', '**', len(word), word, best]

  - type: code-challenge
    id: write-build-request
    concept: python.args-kwargs
    difficulty: 3
    language: python
    starter: request.starter.py
    solution: request.solution.py
    tests: request.tests.py
    prompt: >-
      Write `build_request(prompt, model="small", **options)`, the shape a model SDK
      expects. Return a dict with `model`, a `messages` list holding one
      `{"role": "user", "content": prompt}`, and every extra option.


      Example: `build_request("Hi", temperature=0.2)` returns `{"model": "small",
      "messages": [{"role": "user", "content": "Hi"}], "temperature": 0.2}`.
    hints:
      - 'The defaults step puts `=` in the `def` line. The stars step collects named extras.'
      - '`options` is a dict, and `**options` inside braces spreads it into a new dict.'
      - 'Start with `def build_request(prompt, model="small", **options):`, then build `messages`.'

  - type: explain-back
    id: explain-default-once
    concept: python.mutable-default
    difficulty: 4
    audience: teammate
    kind: risk
    prompt: >-
      A teammate's pull request adds `def book(room, nights=1, tags=[]):`. Warn them: what
      will go wrong with `tags`, and how would they check?
    rubric:
      - The default list is made once, when the `def` line runs, and every call shares it.
      - Appending in one booking leaks tags into later bookings; `nights=1` is safe because a number can't change.
      - Call `book` twice without `tags` and check the second list is empty; default to `None` instead.
    modelAnswer: >-
      Python makes `[]` once, when it runs the `def` line. Every call that leaves `tags` out
      gets that same list. A tag added for one booking shows up on the next. `nights=1` is
      fine, because a number can't be changed in place. To check, call `book` twice without
      tags and look at the second list. Use `tags=None` and make a new list inside.

recap:
  - Write functions with `def` and `return`, and know they give `None` otherwise.
  - Pass arguments by name, and give parameters defaults.
  - Collect extra arguments with `*args` and `**kwargs`, and never default to `[]`.
recall:
  - id: card-no-return
    concept: python.functions
    front: What does a Python function return if it has no `return` statement?
    back: >-
      `None`, Python's value for "nothing here".
  - id: card-keyword-args
    concept: python.keyword-arguments
    front: How do you set only the third parameter of `book(room, nights=1, breakfast=False)`?
    back: >-
      Pass it by name: `book("Suite", breakfast=True)`. `nights` keeps its default.
  - id: card-args-kwargs
    concept: python.args-kwargs
    front: What do `*args` and `**kwargs` collect?
    back: >-
      `*args` collects extra unnamed arguments into a tuple. `**kwargs` collects extra named
      arguments into a dictionary.
  - id: card-mutable-default
    concept: python.mutable-default
    front: How do you give a function an optional list argument safely?
    back: >-
      Default it to `None` and make a new list inside the function. `if tags is None:` checks for exactly `None`.

