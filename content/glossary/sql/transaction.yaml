term: transaction
aka: [ database transaction, BEGIN and COMMIT ]
short: A group of database changes that all happen together or none of them happen.
explain: |
  A bank transfer takes money from one account and adds it to another. If the server
  crashes between the two steps, money vanishes. Wrapping both steps together means the
  database either keeps both or throws both away.

  You start with `BEGIN`, finish with `COMMIT`, and `ROLLBACK` undoes everything since
  `BEGIN`. The trap is in app code: a transaction only protects the statements sent on the
  same connection inside it. An email sent or an API called halfway through can't be rolled
  back.
analogy: A shop till. Nothing is charged until you tap your card at the end; walk away halfway and the basket goes back on the shelves.
example:
  language: sql
  code: |
    BEGIN;
    UPDATE accounts SET balance = balance - 2000 WHERE id = 1;
    UPDATE accounts SET balance = balance + 2000 WHERE id = 2;
    COMMIT;
usage: Put the stock update and the order insert in one transaction, or a crash leaves us selling stock we don't have.
twin:
  term: saga
  difference: A transaction lives inside one database, which undoes everything for you on failure. A saga spans several systems, so you write and run each undo step yourself.
related: [ acid, isolation-level, deadlock, saga ]
level: 1
lessons: [ db.transactions, interview.transactions ]
