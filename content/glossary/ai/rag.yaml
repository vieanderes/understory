term: RAG
aka:
  - retrieval-augmented generation
short: Fetching relevant documents first, then handing them to the model so it answers from them.
explain: |
  A model knows only what it saw in training, and it has never seen your documents. So,
  before it answers, your code searches your own content. It pastes the best passages into
  the prompt along with the question.

  The model then answers from what it was handed, ideally citing it. Most RAG failures are
  search failures: if the right passage never reaches the prompt, no model can use it.
  Measure retrieval on its own before blaming the model.
analogy: An open-book exam. Same student, but now they can look the answer up instead of guessing.
usage: Before we fine-tune anything, try RAG over the help centre and see what the evals say.
twin:
  term: fine-tuning
  difference: RAG hands the model facts at question time, so they're fresh and citable. Fine-tuning changes the model's weights to teach a style or a task, and it's a poor way to add facts.
related:
