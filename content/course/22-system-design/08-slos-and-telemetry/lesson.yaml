id: sysdesign.slos-and-telemetry
title: Reliability targets
objective: Set an SLO users feel, treat its error budget as a design input, and page on a fast burn in two windows.
level: advanced
minutes: 10
concepts: [sysdesign.slis-and-slos, sysdesign.error-budgets, sysdesign.designing-for-a-target, sysdesign.burn-rate-alerts]
prerequisites: [cloud.observability]
opening:
  text: >-
    You'll turn "the site should be reliable" into a number that shapes the design. Then
    you'll page on it only when it matters.

steps:
  - type: prose
    id: name-sli-and-slo
    body: |-
      A **service level indicator**, or SLI, measures what users feel: good events divided by
      valid events. For example, the share of checkouts that succeed within 500 ms.

      A **service level objective**, or SLO, puts a target on it over a window. "99.9% of
      checkouts succeed within 500 ms, over 30 days."

  - type: multiple-choice
    id: pick-good-sli
    concept: sysdesign.slis-and-slos
    difficulty: 1
    question: Which of these best measures what checkout users feel?
    choices:
      - text: Share of checkouts that succeed within 500 ms
        correct: true
        feedback: >-
          Yes. It counts the moments users care about: fast, working checkouts.
      - text: CPU use of the checkout servers
        feedback: >-
          Busy servers can still serve people well. Users never see the CPU.
      - text: Number of deploys per week
        feedback: >-
          That describes the team, not the experience. It says nothing about checkouts.

  - type: prose
    id: name-budget
    body: |-
      The gap between the SLO and 100% is the **error budget**. At 99.9% over 30 days, it's
      about 43 minutes of full outage a month.

      That makes the target a design input. Everything on the request path spends the same
      budget. So slow or flaky work leaves the path, and every hard dependency needs a
      fallback.

  - type: ai-review
    id: review-email-in-path
    concept: sysdesign.designing-for-a-target
    difficulty: 2
    language: yaml
    request: Sketch the checkout design. The SLO is 99.9% of checkouts succeed.
    flawClass: edge-case
    code: |
      request: balancer, then two checkout servers in different zones
      step-1: reserve stock in the orders database
      step-2: charge the card with the payment provider
      step-3: send the receipt email, and fail the checkout if it fails
      later: a worker updates the sales dashboard from a queue
    prompt: >-
      An assistant drafted this. The email provider has a bad hour most months. Tap the line
      that spends checkout's budget for nothing.
    lines: [4]
    reasons:
      - text: A receipt email can fail the whole checkout
        correct: true
        feedback: >-
          Yes. Put the email on the queue. A late receipt beats a lost sale.
      - text: Two servers in two zones is overkill
        feedback: >-
          For 43 minutes a month, one zone going down would spend it all. Keep both.
      - text: The dashboard shouldn't use a queue
        feedback: >-
          It's the right call. The dashboard doesn't need to be in the request.
    fix: |
      request: balancer, then two checkout servers in different zones
      step-1: reserve stock in the orders database
      step-2: charge the card with the payment provider
      later: a worker sends the receipt email from a queue, with retries
      later: a worker updates the sales dashboard from a queue

  - type: multiple-choice
    id: pick-dependency
    concept: sysdesign.error-budgets
    difficulty: 3
    question: >-
      Checkout's SLO is 99.9%. It calls a fraud check that promises only 99.5%. What must
      the design add?
    choices:
      - text: A fallback when the fraud check is down
        correct: true
        feedback: >-
          Yes. For example, accept small orders and review them later.
      - text: Nothing, the targets are close enough
        feedback: >-
          A hard dependency's outages are your outages. 99.5% allows five times the downtime.
      - text: A looser SLO for checkout
        feedback: >-
          Possible, but that's giving up. A fallback keeps the promise to users.

  - type: parsons
    id: order-slo-design
    concept: sysdesign.designing-for-a-target
    difficulty: 3
    prompt: Put the steps of designing for a reliability target in order.
    language: yaml
    blocks:
      - id: target
        code: 'state: the SLO users need, such as 99.9% over 30 days'
        subgoal: The target
      - id: path
        code: 'list: every box a request must pass through'
        subgoal: The path
      - id: offload
        code: 'move: work users needn''t wait for onto a queue'
      - id: fallback
        code: 'add: a fallback for each hard dependency left'
        subgoal: Protect it
      - id: alert
        code: 'alert: page when the budget burns fast'
    distractors:
      - id: nines
        code: 'aim: 100%, so the budget never runs out'
        feedback: >-
          Nothing reaches 100%, and chasing it freezes every release. Pick what users need.

  - type: prose
    id: name-burn-rate
    body: |-
      How fast are you spending? The **burn rate** is the error rate divided by the allowed
      rate. A burn rate of 1 spends the budget exactly over the window.

      A common page rule: burn rate over 14.4 for the last hour and the last five minutes.
      At that pace a 30-day budget lasts about two days. The hour says it matters. The five
      minutes says it's still happening.

  - type: code-challenge
    id: write-burn-alert
    concept: sysdesign.burn-rate-alerts
    difficulty: 3
    language: ts
    prompt: >-
      Write `burnAlert(slo, rates)`. `rates` holds error ratios for the last hour, `h1`, and
      the last five minutes, `m5`. A window's burn rate is its ratio divided by `1 - slo`.


      Return `'page'` when both burn rates are above 14.4, otherwise `'none'`. Throw if `slo`
      isn't strictly between 0 and 1.
    hints:
      - The rule pairs a long window with a short one. Both must be over the line.
      - Work out the allowed rate once, then divide each window's ratio by it.
      - 'Start with `const burn = (rate: number) => rate / (1 - slo);`'

  - type: explain-back
    id: explain-two-windows
    concept: sysdesign.burn-rate-alerts
    difficulty: 4
    prompt: >-
      A page rule checks the burn rate over the last hour only. Why add a second check over
      the last five minutes?
    rubric:
      - The hour average stays high for up to an hour after errors stop.
      - Without the short window, the page keeps firing after the problem is fixed.
      - Requiring both means it fires for real, sustained trouble and resets soon after recovery.
    modelAnswer: >-
      An hour-long average is slow to move. After an outage ends, it stays above the line for
      a long time. On-call gets paged about a problem that's already over. Requiring the
      five-minute window too means the alert only fires while errors are still happening. It
      clears about five minutes after recovery.

recap:
  - Define an SLI as good events over valid events, and set an SLO on it.
  - Spend the error budget on purpose, moving slow work off the path and adding fallbacks.
  - Page on a fast burn over both the last hour and the last five minutes.
recall:
  - id: card-sli
    concept: sysdesign.slis-and-slos
    front: What is an SLI, written as a fraction?
    back: >-
      Good events divided by valid events, such as checkouts that succeed within 500 ms over
      all checkouts.
  - id: card-budget-policy
    concept: sysdesign.error-budgets
    front: What should happen when a service spends its whole error budget early?
    back: >-
      The error budget policy applies: slow or pause risky releases, and spend the time on
      reliability until the budget recovers.
  - id: card-burn-rate
    concept: sysdesign.burn-rate-alerts
    front: What is a burn rate?
    back: >-
      The error rate divided by the rate the SLO allows. At 1 the budget lasts exactly the
      window.
  - id: card-budget-design
    concept: sysdesign.designing-for-a-target
    front: How does a 99.9% target change a design?
    back: >-
      Work users needn't wait for moves to a queue, and each hard dependency gets a fallback.

references:
  - kind: book
    title: Alerting on SLOs
    authors: Steven Thurgood and others
    year: 2018
    venue: The Site Reliability Workbook, Google
    url: https://sre.google/workbook/alerting-on-slos/
    note: Burn rates, the 14.4 and 6 thresholds, and pairing long and short windows.
    primary: true
    verified: true
  - kind: book
    title: Service Level Objectives
    authors: Chris Jones, John Wilkes and Niall Murphy, with Cody Smith
    year: 2016
    venue: Site Reliability Engineering, Google
    url: https://sre.google/sre-book/service-level-objectives/
    note: Choosing indicators users care about, and setting targets on them.
    verified: true

deepDive: >-
  Where do 14.4 and six hours come from? Over a 30-day window, a burn rate of 14.4 for one
  hour spends 2% of the budget. A burn rate of 6 for six hours spends 5%, which the SRE
  workbook also pages on. A rate of 1 over three days spends 10%, which is worth a ticket.
  The short window is a twelfth of the long one.


  Choosing the SLO is a product decision. Too tight and every release is frozen. Too loose
  and users leave before the alert fires. Start from what users already get, and exclude
  events that aren't the service's fault, such as requests rejected as invalid.


  Tracing, the other half of the old lesson, lives in the Cloud chapter's observability
  lesson. In a design interview, one line is enough: every service reports traces through
  OpenTelemetry to a collector, so you can follow one slow request across services.
