term: incident commander
aka:
  - incident lead
  - IC
short: The one person who coordinates the response to an outage, assigning work and deciding, rather than fixing.
explain: |
  When something big breaks, ten people jump in. Two try the same fix, nobody tells customers,
  and decisions stall because nobody owns them.

  So one person takes command. They don't debug. They track what's known, hand out tasks and make the calls. They make sure updates go out on
  time, often through a communications lead.

  It's a role, not a rank. The most senior engineer is often better used fixing. Whoever takes
  it says so out loud, so everyone knows who decides.
analogy: The conductor of an orchestra. Plays no instrument, keeps everyone together.
usage: I'm incident commander; you take the database, and the next update goes out at 15:00.
