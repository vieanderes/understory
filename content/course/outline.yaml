      - id: ai.how-llms-work
        dir: 01-how-llms-work
        title: How LLMs work
        objective: "Explain how a language model writes text one token at a time, why the same prompt can give different answers, and why a chat model answers instead of rambling on."
        level: essential
        concepts: [ai.tokens, ai.sampling, ai.training-stages]
      - id: ai.prompting-and-context
        dir: 02-prompting-and-context-engineering
        title: Prompting and context engineering
        objective: "Write a system prompt and examples that pin down the output, and decide what goes into the model's limited context."
        level: essential
        concepts: [ai.system-prompts, ai.few-shot, ai.context-window]
      - id: ai.structured-output-and-tools
        dir: 03-structured-output-and-tool-use
        title: Structured output
        objective: "Get JSON your code can trust from a model: ask for a schema, validate the reply with Pydantic, and retry once with the error."
        level: essential
        concepts: [ai.structured-output, ai.output-validation]
      - id: ai.tools
        dir: 04-tool-use
        title: Tool use
        objective: "Give a model tools, run the calls it asks for through checked code, and send the results back."
        level: essential
        concepts: [ai.tool-use, ai.tool-definitions]
      - id: ai.reviewing-ai-code
        dir: 05-reviewing-ai-written-code
        title: Reviewing AI-written code
        objective: Apply a checklist of flaw classes.
        level: essential
        concepts: [ai.hallucination, ai.flaw-classes, ai.review-checklist]
      - id: ai.embeddings
        dir: 06-embeddings-and-vector-search
        title: Embeddings and vector search
        objective: "Turn text into vectors, compare them by cosine similarity in code, and find the passages closest to a question."
        level: advanced
        concepts: [ai.embeddings, ai.cosine-similarity, ai.vector-search]
      - id: ai.chunking-and-hybrid
        dir: 07-chunking-and-hybrid-search
        title: Chunking and hybrid search
        objective: "Split documents into overlapping chunks, and combine keyword and vector search so exact codes and paraphrases both match."
        level: advanced
        concepts: [ai.chunking, ai.hybrid-search]
      - id: ai.rag
        dir: 08-rag
        title: RAG
        objective: "Build retrieval-augmented generation end to end: retrieve, build a grounded prompt with sources, cite, and say when the answer isn't there."
        level: advanced
        concepts: [ai.rag, ai.retrieval-quality, ai.grounding]
      - id: ai.agents
        dir: 09-agents
        title: Agents
        objective: "Build an agent loop over tools with a turn cap, keep a plan and memory in context, and know where MCP fits."
        level: advanced
        concepts: [ai.agents, ai.planning-and-memory, ai.mcp]
      - id: ai.evals
        dir: 10-evals
        title: Evals
        objective: "Build an eval set, grade with code or a model judge, and block a release when any slice regresses."
        level: advanced
        concepts: [ai.golden-sets, ai.llm-as-judge, ai.regression-gates]
      - id: ai.failures
        dir: 11-when-calls-fail
        title: When model calls fail
        objective: "Handle rate limits, timeouts, cut-off replies and refusals, and retry only what is worth retrying."
        level: advanced
        concepts: [ai.retries-and-backoff, ai.timeouts, ai.stop-reasons]
      - id: ai.production
        dir: 12-production-concerns
        title: Cost and latency
        objective: "Work out what a call costs from its usage, cut waiting with streaming, and cut cost with prompt caching and a smaller model where it's enough."
        level: advanced
        concepts: [ai.cost-and-latency, ai.streaming, ai.prompt-caching]
      - id: ai.injection-and-leakage
        dir: 13-prompt-injection-and-leakage
        title: Prompt injection and data leakage
        objective: "Keep untrusted text from steering a model's actions, gate risky tools behind people, and keep secrets and personal data out of prompts and logs."
        level: advanced
        concepts: [ai.prompt-injection, ai.data-leakage]
      - id: ai.reasoning-and-training
        dir: 14-reasoning-and-training
        title: Reasoning models and how they are trained
        objective: "Explain chain of thought, test-time compute, best-of-n and voting, tree search, outcome and process reward models, and how RLHF with PPO and GRPO trains a reasoning model."
        level: advanced
        concepts: [ai.test-time-compute, ai.reward-models]
  - id: aisys
    dir: 21-ai-systems
    lessons:
      - id: aisys.demo-to-system
        dir: 01-from-demo-to-system
        title: "From demo to system"
        objective: "Read a production AI pipeline as code, say what each part guards against, and spot where a one-call demo breaks first."
        level: advanced
        concepts: [aisys.production-pipeline, aisys.demo-failure-modes]
      - id: aisys.retrieval-in-depth
        dir: 02-retrieval-in-depth
        title: "Retrieval in depth"
        objective: "Choose a chunking strategy, filter by metadata, rewrite queries, and rerank candidates before they reach the prompt."
        level: advanced
        concepts: [aisys.chunking-strategies, aisys.reranking, aisys.query-rewriting, aisys.metadata-filtering]
      - id: aisys.classifiers-at-the-fork
        dir: 03-classifiers-at-the-fork
        title: "Classifiers at the fork"
        objective: "Say what a classifier is and how to get one, then answer the fuzzy question at each branch with a label and a probability, and keep the large model for writing."
        level: advanced
        concepts: [aisys.classifiers, aisys.decision-points, aisys.classifier-outputs, aisys.classifier-routing]
      - id: aisys.thresholds-and-calibration
        dir: 04-thresholds-and-calibration
        title: "Confidence thresholds and calibration"
        objective: "Split scores into automate, review and refuse bands, choose the cut-offs from labelled data, and check that the scores are calibrated."
        level: advanced
        concepts: [aisys.confidence-bands, aisys.precision-recall-trade-off, aisys.calibration]
      - id: aisys.agent-harness
        dir: 05-agent-harness
        title: "Controlling the agent loop"
        objective: "Keep control flow in code, cap steps and spend, detect loops, and prefer a fixed workflow when the path is known."
        level: advanced
        concepts: [aisys.workflows-vs-agents, aisys.step-budgets, aisys.loop-detection, aisys.harness-state]
      - id: aisys.guardrails
        dir: 06-guardrails
        title: "Guardrails and human approval"
        objective: "Check inputs and outputs, gate irreversible actions behind human approval, verify grounding, and moderate content."
        level: advanced
        concepts: [aisys.guardrails, aisys.human-in-the-loop, aisys.grounding-checks, aisys.content-moderation]
      - id: aisys.pii-and-privacy
        dir: 07-pii-and-privacy
        title: "PII and privacy in AI systems"
        objective: "Recognise personally identifiable information, detect and redact it, keep it out of prompts, logs and eval sets, and meet GDPR duties."
        level: advanced
        concepts: [aisys.pii, aisys.pii-redaction, aisys.ai-data-retention]
      - id: aisys.evals-in-depth
        dir: 08-evals-in-depth
        title: "Evals in depth"
        objective: "Check an LLM judge against human labels, grow an eval set from production traces, compare versions pairwise, and run evals online."
        level: advanced
        concepts: [aisys.eval-set-building, aisys.judge-calibration, aisys.pairwise-comparison, aisys.online-evals]
      - id: aisys.llmops
        dir: 09-llmops
        title: "Prompts and evals as code"
        objective: "Version prompts with the code, gate changes in CI with evals, trace every model call, and monitor quality in production."
        level: advanced
        concepts: [aisys.prompt-versioning, aisys.eval-gates-in-ci, aisys.llm-tracing, aisys.quality-monitoring]
      - id: aisys.cost-and-latency
        dir: 10-cost-and-latency
        title: "Cost, latency and fallbacks"
        objective: "Budget tokens and milliseconds per feature, keep the cached prefix stable, route by measured quality, and fall back safely when a provider fails."
        level: advanced
        concepts: [aisys.token-budgets, aisys.latency-budgets, aisys.model-routing, aisys.fallbacks]
      - id: aisys.mcp-servers
        dir: 11-mcp-servers
        title: "Building MCP servers"
        objective: "Write an MCP server with tools, resources and prompts, return tool errors the model can act on, keep stdout clean, and never trust the caller."
        level: advanced
        concepts: [aisys.mcp-primitives, aisys.mcp-transports, aisys.mcp-security]
      - id: aisys.coding-agents
        dir: 12-coding-agents
        title: "Engineering with coding agents"
        objective: "Work with agentic coding tools in a team: give them context files, keep diffs small, use tests and linters as the feedback loop, and own what ships."
        level: essential
        concepts: [aisys.agent-context-files, aisys.agent-feedback-loops, aisys.owning-generated-code]
      - id: aisys.agent-workbench
        dir: 13-agent-workbench
        title: "Working with a coding agent on a real repo"
        objective: "Set up a coding agent's task so it can be checked: rules it can test, a scope contract, a verification gate, a reviewer pass and a handoff note."
        level: advanced
        concepts: [aisys.executable-instructions, aisys.scope-contracts, aisys.verification-gates, aisys.session-handoff]
      - id: aisys.shaping-the-build
        dir: 14-shaping-the-build
        title: "Shape the build before you code"
        objective: "Shape an AI feature before building it: state the outcome and its success metric, rank the assumptions by risk, pick the smallest testable slice, and write a spec that leaves room for judgement."
        level: advanced
        concepts: [aisys.outcomes-and-metrics, aisys.assumption-mapping, aisys.smallest-testable-slice, aisys.judgement-preserving-specs]
  - id: sysdesign
    dir: 22-system-design
    lessons:
      - id: sysdesign.the-method
        dir: 01-the-method
        title: "A method for system design"
        objective: "Turn a vague brief into functional and scale requirements, sketch the standard shape, go deep on one part, and name failure modes before you are asked."
        level: essential
        concepts: [sysdesign.requirements, sysdesign.standard-shape, sysdesign.failure-modes]
      - id: sysdesign.estimation
        dir: 02-estimation
        title: "Back-of-the-envelope estimation"
        objective: "Estimate requests per second, peak load, storage and bandwidth from users and behaviour, and turn a latency target into a budget."
        level: essential
        concepts: [sysdesign.qps-estimation, sysdesign.storage-estimation, sysdesign.latency-numbers]
      - id: sysdesign.caching-patterns
        dir: 03-caching-patterns
        title: "Caching patterns"
        objective: "Choose cache-aside, read-through, write-through or write-behind, invalidate correctly, and stop a stampede."
        level: advanced
        concepts: [sysdesign.cache-aside, sysdesign.write-through-and-behind, sysdesign.cache-invalidation, sysdesign.cache-stampede]
      - id: sysdesign.sql-or-nosql
        dir: 04-sql-or-nosql
        title: "SQL or NoSQL"
        objective: "Match relational, document, key-value, wide-column and graph stores to access patterns, and know how far Postgres goes before you need another."
        level: advanced
        concepts: [sysdesign.data-models, sysdesign.nosql-trade-offs, sysdesign.postgres-reach]
      - id: sysdesign.replication
        dir: 05-replication
        title: "Replication"
        objective: "Scale reads with replicas, let users read their own writes despite replica lag, and fail over without split brain."
        level: advanced
        concepts: [sysdesign.leader-follower, sysdesign.replica-lag, sysdesign.failover]
      - id: sysdesign.rate-limiting
        dir: 06-rate-limiting
        title: "Rate limiting"
        objective: "Implement token bucket and sliding window limits, share them across servers with Redis, and answer with 429 and Retry-After."
        level: advanced
        concepts: [sysdesign.token-bucket, sysdesign.window-limits, sysdesign.distributed-rate-limits]
      - id: sysdesign.message-brokers
        dir: 07-message-brokers
        title: "Message brokers"
        objective: "Tell a queue from a log, key events so order holds, give each reader its own consumer group, and make consumers idempotent."
        level: advanced
        concepts: [sysdesign.queue-vs-log, sysdesign.partitions-and-ordering, sysdesign.consumer-groups, sysdesign.idempotent-consumers]
      - id: sysdesign.slos-and-telemetry
        dir: 08-slos-and-telemetry
        title: "Reliability targets"
        objective: "Set an SLO users feel, treat its error budget as a design input, and page on a fast burn in two windows."
        level: advanced
        concepts: [sysdesign.slis-and-slos, sysdesign.error-budgets, sysdesign.designing-for-a-target, sysdesign.burn-rate-alerts]
      - id: sysdesign.case-url-shortener
        dir: 09-case-url-shortener
        title: "Case study: a URL shortener"
        objective: "Design a read-heavy service end to end: requirements, estimates, id generation, storage, caching, redirects and abuse."
        level: advanced
        concepts: [sysdesign.id-generation, sysdesign.read-heavy-design]
      - id: sysdesign.case-news-feed
        dir: 10-case-news-feed
        title: "Case study: a news feed"
        objective: "Design a feed with fan-out on write and on read, handle accounts with millions of followers, and spread hot keys."
        level: advanced
        concepts: [sysdesign.fan-out-on-write, sysdesign.fan-out-on-read, sysdesign.hot-keys]
      - id: sysdesign.case-ai-assistant
        dir: 11-case-ai-assistant
        title: "Case study: an AI assistant over company documents"
        objective: "Design an AI assistant over company documents as an interview wants: requirements, given numbers, both pipelines, permissions, freshness and failure modes."
        level: advanced
        concepts: [sysdesign.llm-system-design, sysdesign.graceful-degradation]
      - id: sysdesign.case-ai-agent
        dir: 12-case-ai-agent
        title: "Case study: an AI agent that takes actions"
        objective: "Design an agent that acts on people's behalf: a harness your code owns, tools sorted by risk, approval before irreversible actions, safe retries and evals."
        level: advanced
        concepts: [sysdesign.agent-harness-design, sysdesign.action-safety]
  - id: algo
    dir: 23-problem-solving-patterns
    lessons:
      - id: algo.approach
        dir: 01-approach
        title: "Approaching a problem"
        objective: "Ask about constraints, work small examples, state a brute force, then improve it while saying the complexity aloud."
        level: essential
        concepts: [algo.constraints-first, algo.brute-force-first, algo.edge-cases]
      - id: algo.hash-map-patterns
        dir: 02-hash-map-patterns
        title: "Hash map patterns"
        objective: "Count, group and look up complements in one pass with Map and Set."
        level: essential
        concepts: [algo.frequency-counting, algo.complement-lookup, algo.grouping-by-key]
      - id: algo.two-pointers
        dir: 03-two-pointers
        title: "Two pointers"
        objective: "Walk a sorted array from both ends, or at two speeds, to replace a nested loop."
        level: essential
        concepts: [algo.opposite-pointers, algo.fast-and-slow-pointers]
      - id: algo.sliding-window
        dir: 04-sliding-window
        title: "Sliding window"
        objective: "Keep a running window over a sequence, grow and shrink it, and solve longest and shortest subarray problems in linear time."
        level: essential
        concepts: [algo.fixed-window, algo.variable-window]
      - id: algo.binary-search-patterns
        dir: 05-binary-search-patterns
        title: "Binary search patterns"
        objective: "Search sorted data, find the first position where a condition turns true, and binary-search the answer itself."
        level: advanced
        concepts: [algo.boundary-search, algo.search-on-answer]
      - id: algo.bfs-and-dfs
        dir: 06-bfs-and-dfs
        title: "BFS and DFS"
        objective: "Traverse grids and graphs, find shortest paths in unweighted graphs with BFS, and count connected regions with DFS."
        level: advanced
        concepts: [algo.bfs-shortest-path, algo.dfs-components, algo.grid-graphs]
      - id: algo.heaps-and-top-k
        dir: 07-heaps-and-top-k
        title: "Heaps and top k"
        objective: "Build a binary heap, keep the top k items in O(n log k), and merge sorted lists."
        level: advanced
        concepts: [algo.binary-heap, algo.top-k, algo.k-way-merge]
      - id: algo.dynamic-programming
        dir: 08-dynamic-programming
        title: "Dynamic programming"
        objective: "Spot overlapping subproblems, memoise a recursion, and turn it into a table filled bottom up."
        level: advanced
        concepts: [algo.overlapping-subproblems, algo.memoisation, algo.tabulation]
      - id: algo.prefix-sums
        dir: 09-prefix-sums
        title: "Prefix sums"
        objective: "Answer any range-sum question in constant time after one pass, and apply many range updates at once with a difference array."
        level: essential
        concepts: [algo.prefix-sums, algo.difference-arrays]
      - id: algo.stacks-and-queues
        dir: 10-stacks-and-queues
        title: "Stacks, queues and the monotonic stack"
        objective: "Match brackets with a stack, process arrivals in order with a queue, and find the next larger item for every position in one pass."
        level: essential
        concepts: [algo.stack-matching, algo.monotonic-stack]
      - id: algo.counting-and-leaders
        dir: 11-counting-and-leaders
        title: "Counting and leaders"
        objective: "Count with an array instead of sorting, apply bulk updates lazily, and find a majority value in one pass and constant memory."
        level: essential
        concepts: [algo.counting-array, algo.leader]
      - id: algo.maximum-slice
        dir: 12-maximum-slice
        title: "Maximum slice"
        objective: "Find the best contiguous run in one pass by carrying the best slice ending here, and extend the idea to variants."
        level: advanced
        concepts: [algo.kadane, algo.slice-state]
      - id: algo.intervals-and-greedy
        dir: 13-intervals-and-greedy
        title: "Intervals and greedy choices"
        objective: "Sort intervals to merge them or count overlaps, and argue why a greedy choice is safe before you trust it."
        level: advanced
        concepts: [algo.interval-sorting, algo.greedy-choice]
      - id: algo.backtracking
        dir: 14-backtracking
        title: "Backtracking"
        objective: "Generate subsets, orders and combinations by choosing, exploring and undoing, and prune branches that cannot succeed."
        level: advanced
        concepts: [algo.backtracking, algo.pruning]
      - id: algo.number-tricks
        dir: 15-number-tricks
        title: "Number tricks"
        objective: "Use gcd, divisors up to the square root and a sieve, and keep JavaScript numbers exact past 2^53."
        level: advanced
        concepts: [algo.divisors-and-gcd, algo.sieve, algo.safe-integers]
      - id: algo.dependencies
        dir: 16-dependencies
        title: "Dependencies: topological sort and union-find"
        objective: "Order tasks that depend on each other, detect a cycle, and group connected items with union-find."
        level: advanced
        concepts: [algo.topological-sort, algo.union-find]
      - id: algo.mock-round
        dir: 17-mock-round
        title: "A full coding round"
        objective: "Solve one problem end to end under interview conditions, from constraints to tested, optimised code, explained aloud."
        level: advanced
        concepts: [algo.pattern-recognition, algo.communicating-solutions]
  - id: atlas
    dir: 24-atlas
    lessons:
      - id: atlas.language-landscape
        dir: 01-beyond-the-web
        title: Beyond the web
        objective: Say what a platform is, and read any language by what it catches and how it runs.
        level: essential
        concepts: [atlas.platforms, atlas.type-systems, atlas.runtimes]
      - id: atlas.memory-and-cleanup
        dir: 02-who-cleans-up
        title: Who cleans up
        objective: Say who frees memory in Swift, Rust and JavaScript, and close connections and files on a line you choose.
        level: essential
        concepts: [atlas.memory-models, atlas.resource-cleanup]
      - id: atlas.what-suits-what
        dir: 03-choosing-a-language
        title: Choosing a language
        objective: Choose a language for a job from its hard constraints first, then its libraries and your team.
        level: essential
        concepts: [atlas.problem-fit, atlas.ecosystems, atlas.webassembly]
      - id: atlas.one-product-three-platforms
        dir: 04-web-cross-platform-or-native
        title: Web, cross-platform or native
        objective: Choose between a website, a cross-platform app and a native app, with device needs as hard limits and weights set first.
        level: advanced
        concepts: [atlas.device-apis, atlas.decision-framework, atlas.distribution]
      - id: atlas.pwas
        dir: 05-websites-that-work-offline
        title: "PWAs: websites that work offline"
        objective: Make a website work offline with a service worker, make it installable with a manifest, and know the iPhone's limits.
        level: advanced
        concepts: [atlas.service-workers, atlas.offline-strategies, atlas.installability, atlas.ios-pwa-limits]
      - id: atlas.cross-platform
        dir: 06-cross-platform-apps
        title: Cross-platform apps
        objective: Say how React Native, Flutter, Kotlin Multiplatform and Capacitor draw the screen, and keep a model API key out of any app.
        level: advanced
        concepts: [atlas.react-native, atlas.flutter, atlas.kotlin-multiplatform, atlas.app-secrets]
      - id: atlas.native-ui
        dir: 07-native-apps-and-the-stores
        title: Native apps and the stores
        objective: Read a SwiftUI screen as you'd read React, keep an app's signing key safe, and keep a server working for app versions that update slowly.
        level: advanced
        concepts: [atlas.declarative-native-ui, atlas.code-signing, atlas.store-release]
      - id: atlas.desktop-apps
        dir: 08-desktop-apps
        title: "Desktop apps: Electron and Tauri"
        objective: Say how Electron and Tauri turn a web app into a desktop app, and keep the page from reaching the user's files.
        level: advanced
        concepts: [atlas.electron, atlas.webview-shells]
  - id: career
    dir: 25-interviews-and-career
    lessons:
      - id: career.interview-loop
        dir: 01-interview-loop
        title: "The senior AI engineering loop"
        objective: "Know what each round of a senior AI engineering loop tests, and turn a mid-level answer into a senior one."
        level: essential
        concepts: [career.interview-rounds, career.seniority-signals]
      - id: career.your-narrative
        dir: 02-your-narrative
        title: "Tell me about yourself"
        objective: "Give a one-minute introduction that fits the role, and explain a gap or a career change plainly."
        level: essential
        concepts: [career.introduction, career.framing-a-gap]
      - id: career.behavioural-stories
        dir: 03-behavioural-stories
        title: "Behavioural stories"
        objective: "Turn your past work into STAR stories centred on your decision and its result, and keep a bank of five."
        level: essential
        concepts: [career.star, career.story-bank]
      - id: career.how-you-work
        dir: 04-how-you-work
        title: "How you work with AI"
        objective: "Answer how you use AI tools, what you'd need to ramp up on, and what's changed lately, each backed by your own work."
        level: essential
        concepts: [career.ai-tools-answer, career.ramp-up-plan, career.staying-current]
      - id: career.take-home
        dir: 05-take-home
        title: "The take-home task"
        objective: "Know how a reviewer judges a take-home, and hand in work that runs, fails gracefully and explains its decisions."
        level: essential
        concepts: [career.take-home-review, career.take-home-scope]
      - id: career.questions-to-ask
        dir: 06-questions-to-ask
        title: "Questions to ask them"
        objective: "Ask each interviewer questions that show how the team really builds AI, and read the warning signs in their answers."
        level: essential
        concepts: [career.questions-to-ask, career.reading-answers]
      - id: career.the-offer
        dir: 07-the-offer
        title: "The offer"
        objective: "Compare offers like for like, and ask for a better one politely, with a specific number and a reason."
        level: essential
        concepts: [career.comparing-offers, career.negotiation]
      - id: career.first-90-days
        dir: 08-first-90-days
        title: "The first 90 days"
        objective: "Plan your first three months in a new team, learn a codebase by tracing one request, and ship a small first change."
        level: essential
        concepts: [career.onboarding-plan, career.first-contribution]
  - id: clean
    dir: 26-clean-code
    lessons:
      - id: clean.naming
        dir: 01-naming
        title: "Names that explain"
        objective: "Choose names that reveal intent, keep one word per idea, name booleans as questions, and match a name's length to its scope."
        level: essential
        concepts: [clean.intent-revealing-names, clean.consistent-vocabulary, clean.name-length-and-scope]
        wovenAfter: js.built-in-toolbox
      - id: clean.functions
        dir: 02-functions
        title: "Small functions that do one thing"
        objective: "Split functions to one job and one level of abstraction, keep parameter lists short, replace flag arguments, and separate commands from queries."
        level: essential
        concepts: [clean.single-purpose-functions, clean.parameter-lists, clean.flag-arguments, clean.command-query-separation]
        wovenAfter: js.destructuring-and-spread
      - id: clean.control-flow
        dir: 03-control-flow
        title: "Flat control flow"
        objective: "Flatten nested conditions with guard clauses and early returns, drop else after return, and replace long if chains with lookup tables."
        level: essential
        concepts: [clean.guard-clauses, clean.nesting-depth, clean.lookup-tables]
        wovenAfter: js.closures
      - id: clean.comments-and-constants
        dir: 04-comments-and-constants
        title: "Comments, constants and dead code"
        objective: "Write comments that explain why, name magic values as constants, and delete dead and commented-out code."
        level: essential
        concepts: [clean.why-comments, clean.magic-values, clean.dead-code]
        wovenAfter: tooling.git-as-a-graph
      - id: clean.errors
        dir: 05-errors
        title: "Handling errors cleanly"
        objective: "Fail fast on bad input, never swallow errors, throw specific error types, and decide where each error is handled."
        level: essential
        concepts: [clean.fail-fast, clean.swallowed-errors, clean.error-types]
        wovenAfter: ts.typing-the-boundary
      - id: clean.side-effects
        dir: 06-side-effects
        title: "Pure core, effects at the edges"
        objective: "Keep business logic in pure functions, push I/O and time to the edges, and avoid hidden shared state."
        level: advanced
        concepts: [clean.pure-functions, clean.functional-core, clean.hidden-state]
        wovenAfter: clean.errors
      - id: clean.code-smells
        dir: 07-code-smells
        title: "Code smells and refactoring moves"
        objective: "Recognise common smells, apply the matching refactoring move, and refactor safely under tests."
        level: advanced
        concepts: [clean.code-smells, clean.refactoring-moves, clean.refactoring-under-tests]
        wovenAfter: testing.tdd
      - id: clean.duplication
        dir: 08-duplication
        title: "Duplication and the wrong abstraction"
        objective: "Tell duplicated knowledge from look-alike code, wait for the rule of three, and undo an abstraction that has grown flags."
        level: advanced
        concepts: [clean.knowledge-duplication, clean.rule-of-three, clean.wrong-abstraction]
        wovenAfter: clean.code-smells
      - id: clean.design-principles
        dir: 09-design-principles
        title: "Design principles in proportion"
        objective: "Apply SOLID, KISS, YAGNI and composition over inheritance where they help, and notice when they make code worse."
        level: advanced
        concepts: [clean.solid, clean.yagni-and-kiss, clean.composition-over-inheritance]
        wovenAfter: arch.coupling-and-cohesion
      - id: clean.code-review
        dir: 10-code-review
        title: "Reviewing code like a senior"
        objective: "Review in order of what matters, write comments that are clear about severity, and keep changes small enough to review well."
        level: advanced
        concepts: [clean.review-priorities, clean.review-comments, clean.small-changes]
        wovenAfter: cloud.progressive-delivery
  - id: pro
    dir: 27-code-like-a-pro
    lessons:
      - id: pro.amateur-tells
        dir: 01-amateur-tells
        title: "Amateur tells"
        objective: "Spot the signs that give amateur code away, such as leftover logs, vague names, inconsistency and copy-paste, and clean them up."
        level: essential
        concepts: [pro.amateur-tells, pro.consistency, pro.leaving-no-trace]
        wovenAfter: tooling.quality-gates
      - id: pro.modern-javascript
        dir: 02-modern-javascript
        title: "Idiomatic modern JavaScript"
        objective: "Write JavaScript the way experienced developers do: destructuring, spread, array methods where they read better, async and await, and named exports."
        level: essential
        concepts: [pro.js-idioms, pro.declarative-arrays, pro.async-style]
        wovenAfter: pro.amateur-tells
      - id: pro.css-and-html
        dir: 03-css-and-html
        title: "HTML and CSS like a pro"
        objective: "Write semantic HTML and maintainable CSS: tokens instead of magic values, low specificity, no !important, and logical properties."
        level: essential
        concepts: [pro.semantic-markup, pro.maintainable-css]
        wovenAfter: css.modern-architecture
      - id: pro.typescript
        dir: 04-typescript
        title: "TypeScript like a pro"
        objective: "Let inference work, keep config precise with satisfies, brand ids, and never cast outside data."
        level: essential
        concepts: [pro.illegal-states, pro.unknown-over-any, pro.inference-over-annotation]
        wovenAfter: ts.configuration
      - id: pro.react
        dir: 05-react
        title: "React like a pro"
        objective: "Derive values instead of syncing state, keep effects for the outside world, draw component boundaries well, and name hooks clearly."
        level: advanced
        concepts: [pro.derived-state, pro.effect-discipline, pro.component-boundaries]
        wovenAfter: react.hooks-and-refs
      - id: pro.sql
        dir: 06-sql
        title: "SQL like a pro"
        objective: "Write readable, set-based SQL: explicit columns, CTEs, consistent formatting, NULL-safe logic and parameters."
        level: essential
        concepts: [pro.sql-style, pro.set-based-thinking, pro.readable-queries]
        wovenAfter: db.transactions
      - id: pro.pythonic
        dir: 07-pythonic
        title: "Pythonic Python"
        objective: "Write Python the way Python developers expect: EAFP, comprehensions, unpacking, context managers, logging instead of print, and the standard library first."
        level: essential
        concepts: [pro.pythonic-idioms, pro.eafp, pro.python-logging, pro.stdlib-first]
        wovenAfter: python.report-tool
      - id: pro.production-python
        dir: 08-production-python
        title: "Production-grade Python"
        objective: "Structure a Python project for a team: src layout, strict type checking in CI, and structured JSON logs without secrets."
        level: advanced
        concepts: [pro.src-layout, pro.strict-tooling, pro.structured-logging]
        wovenAfter: pyai.fastapi
      - id: pro.commits-and-prs
        dir: 09-commits-and-prs
        title: "Commits and pull requests like a pro"
        objective: "Make atomic commits with clear messages, write pull request descriptions reviewers can act on, and keep a useful README."
        level: essential
        concepts: [pro.atomic-commits, pro.pr-descriptions, pro.project-readme]
        wovenAfter: tooling.remotes
  - id: interview
    dir: 28-interview-challenges
    lessons:
      - id: interview.landscape
        dir: 01-the-assessment-landscape
        title: "The assessment landscape"
        objective: "Tell the six kinds of coding round apart, know how each is scored, and ask the recruiter the questions that change your preparation."
        level: essential
        concepts: [interview.round-formats, interview.recruiter-questions]
      - id: interview.online-assessments
        dir: 02-online-assessments-inside-out
        title: "Online assessments inside out"
        objective: "Work the way a hidden-test scorer rewards: read the complexity line, test your own cases, and never submit code that does not compile."
        level: essential
        concepts: [interview.hidden-tests, interview.expected-complexity, interview.platform-conduct]
      - id: interview.reading-the-task
        dir: 03-reading-the-task
        title: "Reading the task statement"
        objective: "Read a task statement the way the hidden tests will: the constraints, the complexity hint, the exact output format and the special cases."
        level: essential
        concepts: [interview.task-statement, interview.output-contract]
      - id: interview.js-traps
        dir: 04-js-traps-under-time
        title: "JavaScript traps under time"
        objective: "Avoid the JavaScript habits that pass small examples and fail large hidden tests: string sorting, shift in loops, spread on huge arrays and deep recursion."
        level: essential
        concepts: [interview.hidden-quadratic, interview.runtime-limits]
      - id: interview.timed-strategy
        dir: 05-strategy-for-a-timed-set
        title: "Strategy for a timed set"
        objective: "Split a timed set sensibly, bank partial credit with a brute force, and find your own bugs by stress testing against it."
        level: essential
        concepts: [interview.triage, interview.stress-testing]
      - id: interview.bug-fix-round
        dir: 06-bug-fix-and-refactor-rounds
        title: "Bug-fix and refactor rounds"
        objective: "Read unfamiliar code before changing it, fix a bug in the fewest lines, and refactor in small steps that keep tests green."
        level: essential
        concepts: [interview.reading-first, interview.minimal-fix]
      - id: interview.communication
        dir: 07-live-coding-communication
        title: "Live-coding communication"
        objective: "Run a live round out loud: a steady script, checkpoints instead of commentary, framed silence and hints taken well."
        level: essential
        concepts: [interview.round-script, interview.taking-hints]
      - id: interview.utilities
        dir: 08-lru-cache-and-event-emitter
        title: "LRU cache and event emitter"
        objective: "Write the two classes live utility rounds ask for most, an LRU cache on a Map and an event emitter with on, off and once."
        level: essential
        concepts: [interview.lru-cache, interview.event-emitter]
      - id: interview.debounce-throttle
        dir: 09-debounce-and-throttle
        title: "Debounce and throttle"
        objective: "Write debounce and throttle that are right at the edges, and test them in an instant with an injected clock."
        level: essential
        concepts: [interview.timing-utilities, interview.injected-clock]
      - id: interview.levelled-one
        dir: 10-levelled-task-part-one
        title: "Levelled task, part one"
        objective: "Build the first two levels of an in-memory database so the later levels do not force a rewrite."
        level: advanced
        concepts: [interview.levelled-design, interview.record-store]
      - id: interview.levelled-two
        dir: 11-levelled-task-part-two
        title: "Levelled task, part two"
        objective: "Add expiry by timestamp and backup and restore to the store, keeping the earlier levels green."
        level: advanced
        concepts: [interview.time-aware-state, interview.backward-compatible-change]
      - id: interview.transactions
        dir: 12-kv-store-with-transactions
        title: "A key-value store with transactions"
        objective: "Support begin, commit and rollback, including nested transactions, with a stack of change sets."
        level: advanced
        concepts: [interview.change-sets, interview.nested-transactions]
      - id: interview.backend-round
        dir: 13-the-backend-round
        title: "The backend round"
        objective: "Write a request handler that validates input, paginates with a cursor, returns one error format and honours an idempotency key."
        level: advanced
        concepts: [interview.handler-shape, interview.idempotency-keys]
      - id: interview.frontend-round
        dir: 14-the-frontend-round
        title: "The frontend round"
        objective: "Get the state of an autocomplete right: latest request wins, every loading and error state, keyboard navigation and the combobox pattern."
        level: advanced
        concepts: [interview.stale-responses, interview.ui-state-machine, interview.combobox-pattern]
      - id: interview.component-round
        dir: 15-the-component-round
        title: "The component round"
        objective: "Build tabs, a dialog, a star rating and a dropdown in plain HTML, CSS and JavaScript that work with a mouse, a keyboard and a screen reader."
        level: advanced
        concepts: [interview.native-elements, interview.aria-state, interview.roving-focus]
      - id: interview.react-component-round
        dir: 16-the-component-round-in-react
        title: "The component round in React"
        objective: "Build the same widgets as React components with a clear interface, effects that clean up and focus that goes where people expect."
        level: advanced
        concepts: [interview.component-api, interview.effect-cleanup, interview.focus-management]
      - id: interview.ai-assisted
        dir: 17-ai-assisted-rounds
        title: "AI-assisted rounds"
        objective: "Use an assistant in an interview the way reviewers reward: plan first, let it clarify, look up syntax, suggest tests and review, and own every line."
        level: essential
        concepts: [interview.plan-before-prompting, interview.model-chat, interview.prompt-shape, interview.verifying-ai-output]
      - id: interview.evals-first
        dir: 18-evals-first
        title: "Evals first"
        objective: "Start an AI build with a small golden set, measure retrieval and answers separately, and gate changes on the results."
        level: advanced
        concepts: [interview.golden-set, interview.retrieval-metrics]
      - id: interview.rag-build
        dir: 19-ai-build-rag
        title: "AI build: RAG with citations"
        objective: "Build retrieval-augmented answers end to end: chunk with overlap, retrieve the top matches, cite sources and refuse when the context is not enough."
        level: advanced
        concepts: [interview.chunking, interview.grounded-answers]
      - id: interview.agent-build
        dir: 20-ai-build-agent
        title: "AI build: an agent with guardrails"
        objective: "Write a tool loop with a step cap, an allowlist, approval before write actions and validated, retried structured output."
        level: advanced
        concepts: [interview.guarded-tool-loop, interview.validate-and-retry]
      - id: interview.streaming-build
        dir: 21-ai-build-streaming-chat
        title: "AI build: streaming chat"
        objective: "Turn a stream of text and tool-call deltas into chat state, and handle cancel and a failure halfway through."
        level: advanced
        concepts: [interview.delta-accumulation, interview.stream-failure]
      - id: interview.four-hour-build
        dir: 22-the-four-hour-build
        title: "The four-hour build"
        objective: "Turn a brief into a scoped plan, ship a thin working slice first, and leave time for tests and a README that shows your thinking."
        level: essential
        concepts: [interview.scoping, interview.vertical-slice, interview.readme-for-reviewers]
      - id: interview.presenting
        dir: 23-presenting-your-build
        title: "Presenting your build"
        objective: "Present a build in ten to fifteen minutes around your decisions, demo one path safely, and answer hard follow-up questions well."
        level: essential
        concepts: [interview.decision-led-presentation, interview.handling-questions]
      - id: interview.mock-a
        dir: 24-mock-assessment-a
        title: "Mock assessment A"
        objective: "Sit a timed three-task assessment scored on hidden correctness and performance tests."
        level: advanced
        concepts: [interview.hidden-tests, interview.triage]
      - id: interview.mock-b
        dir: 25-mock-assessment-b
        title: "Mock assessment B"
        objective: "Sit a second timed three-task assessment on different patterns."
        level: advanced
        concepts: [interview.expected-complexity, interview.stress-testing]
      - id: interview.mock-levelled
        dir: 26-mock-levelled-assessment
        title: "Full mock 4: one task in four levels"
        objective: "Sit a timed four-level task that grows a bank system, keeping every earlier level passing."
        level: advanced
        concepts: [interview.levelled-design, interview.backward-compatible-change]
      - id: interview.mock-python
        dir: 27-mock-assessment-python
        title: "Mock assessment C, in Python"
        objective: "Sit a timed three-task assessment in Python, scored on hidden correctness and performance tests."
        level: advanced
        concepts: [interview.hidden-tests, interview.expected-complexity]
      - id: interview.llm-client-build
        dir: 28-ai-build-llm-client
        title: "AI build: a production LLM client"
        objective: "Wrap a model call with a timeout, retries on retryable errors only, a concurrency cap, a promise cache that shares identical calls, and JSON validated with one re-ask."
        level: advanced
        concepts: [interview.timeout-and-retry, interview.in-flight-cache, interview.validate-and-retry]
      - id: interview.reported-tasks
        dir: 29-tasks-candidates-report
        title: "Tasks candidates report"
        objective: "Name the pattern behind ten commonly reported online-test tasks and solve three of them against hidden tests."
        level: advanced
        concepts: [interview.pattern-spotting, interview.one-pass-state]
