term: value object
aka: [value type]
short: A small immutable object, valid from the moment it's made and compared by its contents.
explain: |
  A price stored as a bare number can be negative or in the wrong currency.
  It can even be added to a weight by mistake. Every function that receives it has to check it again.

  Wrap it instead. The constructor refuses anything invalid, and nothing can change it afterwards.
  Two of them are equal when their contents are equal, not when they are the same object. `Money` holding whole pence and a currency is the classic case. Operations
  return a new object, so a value someone else holds never shifts under them.
analogy: A banknote. A tenner is a tenner whichever one you hold, and nobody edits the number printed on it.
example:
  language: ts
  code: |
    class Money {
      private constructor(readonly pence: number, readonly currency: string) {}
      static of(pence: number, currency: string) {
        if (!Number.isInteger(pence)) throw new Error('whole pence only');
        return new Money(pence, currency);
      }
      plus(other: Money) {
        if (other.currency !== this.currency) throw new Error('currency mismatch');
        return new Money(this.pence + other.pence, this.currency);
      }
    }
usage: Make the discount a value object, so nobody can build a 140 percent one and pass it around.
related: [immutability, invariant, state-machine]
level: 2
lessons: [arch.domain-modelling]
