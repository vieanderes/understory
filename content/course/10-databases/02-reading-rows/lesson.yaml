    verified: true

deepDive: >-
  `IS DISTINCT FROM` is `<>` that treats NULL as an ordinary value, so `WHERE assignee IS
  DISTINCT FROM 'sam'` does the Sam task in one test. Its partner `IS NOT DISTINCT FROM` is
  an `=` that matches two NULLs.


  NULL spreads through sums too: `1 + NULL` is NULL. The grouping lesson shows what that does to
  counts.


  `LIMIT` with `OFFSET` gives pages: `LIMIT 20 OFFSET 40` is page three. It gets slower the
  deeper you go, because Postgres still reads the skipped rows. Big lists page by the last
  value seen instead: `WHERE due > '2026-10-05' ORDER BY due LIMIT 20`. The API design lesson
  called that cursor pagination.
