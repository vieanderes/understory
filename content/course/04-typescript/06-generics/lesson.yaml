    url: https://www.typescriptlang.org/docs/handbook/type-compatibility.html
    note: Why a list of a narrower type is accepted where a wider one is wanted.
    verified: true

deepDive: >-
  You've used generics already. `number[]` can also be written `Array<number>`, and
  `Promise<PriceResult>` from the last lesson is a generic type too.


  A type parameter earns its keep by relating two positions. If it appears only once, as in
  `load<T>(key: string): T`, the caller picks a type nothing checks. That's an `as` written in
  friendlier syntax.


  When `T` appears in two parameters, the checker doesn't merge their types.
  `samePrice<T>(a: T, b: T)` called with `4500` and `"4500"` is an error, not a union.


  Lists are checked loosely in one direction. A `BulkItem[]` passes where an `Item[]` is
  wanted, and the function may then push a plain `Item` into it. Take `readonly Item[]` when
  you only read, and the push stops compiling.
