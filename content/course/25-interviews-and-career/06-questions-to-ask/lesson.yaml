id: career.questions-to-ask
title: Questions to ask them
objective: Ask each interviewer questions that show how the team really builds AI, and read the warning signs in their answers.
level: essential
minutes: 9
concepts: [career.questions-to-ask, career.reading-answers]
prerequisites: [career.interview-loop]
opening:
  text: >-
    You'll leave each interview knowing how the team really works, not only how it presents
    itself. Your questions also show them how you think.

steps:
  - type: prose
    id: four-questions
    body: |-
      Most rounds end with "What would you like to ask us?". Four questions cover a lot.

      - How do you decide what to build next?
      - How do you know a model or prompt change made things better?
      - Can you walk me through your last incident?
      - What does a senior engineer own here?

      Ask for a recent example each time. Examples are harder to polish than opinions.

  - type: multiple-choice
    id: pick-best-question
    concept: career.questions-to-ask
    difficulty: 1
    question: Which question tells you most about how the team works?
    choices:
      - text: How do you decide what to build next?
        correct: true
        feedback: >-
          Yes. The answer shows who holds priorities and how stable they are.
      - text: Do you enjoy working here?
        feedback: >-
          Almost everyone says yes. It rarely reveals anything you can weigh.
      - text: What does the company do?
        feedback: >-
          You should know that before the interview. Ask something only they can answer.

  - type: prose
    id: reading-answers
    body: |-
      How specific the answer is matters more than what it says. Recent, concrete examples
      suggest the practice is real.

      Watch for three signals. Vagueness where you asked for an example. **Blame** in an
      incident story. And no time for quality work, such as tests. One signal isn't
      a verdict, but it's worth a follow-up question.

  - type: bug-hunt
    id: hunt-incident-answer
    concept: career.reading-answers
    difficulty: 2
    language: yaml
    code: |
      - The assistant sent a customer another customer's order details.
      - We found who had changed the prompt, and they fixed it.
      - It was live for about two hours before support noticed.
    prompt: >-
      You asked an engineer about their last incident. Tap the line worth a follow-up.
    lines: [2]
    reasons:
      - text: It names a person, not a cause
        correct: true
        feedback: >-
          Yes. Healthy teams ask what let it happen, so the cause gets fixed.
      - text: Two hours is an alarming delay
        feedback: >-
          Worth noting, but it's a fact they shared openly. The blame is the stronger signal.
      - text: They shouldn't share incident details
        feedback: >-
          Sharing a real incident is a good sign. It's how they handled it that matters.
    fix: |
      - The assistant sent a customer another customer's order details.
      - We added a check that every order in a reply belongs to the caller.
      - It was live for about two hours, so we now alert on those checks.

  - type: bug-hunt
    id: hunt-warning-signs
    concept: career.reading-answers
    difficulty: 3
    language: yaml
    code: |
      - Good question. We move fast here, which I love.
      - Last month we rewrote the support assistant's prompt.
      - People on the team said it felt better, so we shipped it.
      - We do have a set of test questions for it.
      - Nobody has run them this quarter, though.
      - Everyone gets Friday afternoons for fixing debt.
    prompt: >-
      You asked a manager how they know a prompt change helps. Tap the two lines that
      point at the same warning sign.
    lines: [3, 5]
    reasons:
      - text: Nobody measures whether changes help
        correct: true
        feedback: >-
          Right. A feeling and an unused test set. Ask what stops them running it.
      - text: Moving fast is a warning sign
        feedback: >-
          Speed is fine with a safety net. The problem is there's no measure.
      - text: Friday afternoons is too little time for debt
        feedback: >-
          Set-aside time is a good sign. The quality gap is elsewhere.

  - type: prose
    id: match-the-interviewer
    body: |-
      You'll get five to ten minutes, so pick two or three questions per round and match
      them to the person.

      Ask an engineer about code review and incidents. Ask a manager about priorities and
      growth. Ask a product manager how they decide what to build. Save pay and holiday for
      the recruiter.

  - type: ai-review
    id: review-my-questions
    concept: career.questions-to-ask
    difficulty: 3
    language: yaml
    request: Draft three questions for my round with the engineering manager.
    flawClass: logic
    code: |
      - How do you decide what the team builds next quarter?
      - What does the company's product do?
      - What did the last person promoted to senior do differently?
    prompt: >-
      One question wastes a slot with a manager. Tap it.
    lines: [2]
    reasons:
      - text: The website already answers it
        correct: true
        feedback: >-
          Yes. It suggests you didn't prepare. Ask only what they can answer.
      - text: Asking about promotion sounds pushy
        feedback: >-
          It's a fair question about what the role expects. Managers answer it often.
      - text: Next quarter is too far ahead
        feedback: >-
          Planning horizons are what a manager knows best. It's a strong question.
    fix: |
      - How do you decide what the team builds next quarter?
      - How are new people onboarded, and when do they ship first?
      - What did the last person promoted to senior do differently?

  - type: explain-back
    id: explain-your-questions
    concept: career.questions-to-ask
    difficulty: 4
    prompt: >-
      Your last round is with a senior engineer on the AI team. Write the three questions
      you'd ask them.
    rubric:
      - Each asks for a recent example, not an opinion.
      - They suit an engineer, such as reviews, incidents or evals.
      - None can be answered from the company's website.
    modelAnswer: >-
      How did you check the last prompt or model change before it shipped? Can you walk me
      through your last incident, and what changed after it? What did the last code review
      you received teach you?

recap:
  - Ask how they decide, measure changes, handle incidents and grow seniors.
  - Ask for a recent example, not an opinion, and match questions to the person.
  - Read vagueness, blame and unmeasured quality as prompts to dig.
recall:
  - id: card-four-questions
    concept: career.questions-to-ask
    front: Which four questions reveal most about an AI team?
    back: >-
      How they decide what to build, how they measure model changes, their last incident,
      and what a senior owns.
  - id: card-ask-example
    concept: career.questions-to-ask
    front: Why ask for a recent example rather than an opinion?
    back: >-
      Opinions can be polished. Examples show what really happens.
  - id: card-warning-signals
    concept: career.reading-answers
    front: Which three signals in answers are worth a follow-up?
    back: >-
      Vagueness where you asked for an example, blame in incident stories, and no time for
      quality work.
  - id: card-blame
    concept: career.reading-answers
    front: What does "we found who broke it" suggest about incidents?
    back: >-
      Blame may come before causes, so the same failure may happen again.

references:
  - kind: docs
    title: 'Software Engineer interviews: Best end of interview questions to ask'
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/final-questions/
    note: A long list of questions to choose from, grouped by topic.
    primary: true
    verified: true
  - kind: book
    title: 'Postmortem Culture: Learning from Failure'
    authors: John Lunney and Sue Lueder
    venue: Site Reliability Engineering, O'Reilly and Google
    url: https://sre.google/sre-book/postmortem-culture/
    note: What a blameless incident culture looks like, useful for reading their answers.
    primary: true
    verified: true
  - kind: book
    title: Being On-Call
    authors: Andrea Spadaccini
    venue: Site Reliability Engineering, O'Reilly and Google
    url: https://sre.google/sre-book/being-on-call/
    note: What a sustainable on-call load looks like.
    verified: true

deepDive: >-
  Keep notes after each round. Answers from different people that disagree are
  informative in themselves. One saying on-call is quiet and another describing weekly
  night pages is worth one more question before you accept an offer.


  Questions that work well for AI teams: who owns the eval set, and how it grows; what
  happens when the model provider changes a model under you; how much of the work is
  prompts and retrieval against training models; and how they handle personal data in
  prompts and logs.


  The same questions are useful again in your first month, when you'll see the real
  answers.
