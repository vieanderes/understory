id: career.your-narrative
title: Tell me about yourself
objective: Give a one-minute introduction that fits the role, and explain a gap or a career change plainly.
level: essential
minutes: 9
concepts: [career.introduction, career.framing-a-gap]
prerequisites: [career.interview-loop]
opening:
  text: >-
    You'll open every interview with a one-minute introduction that makes them want to ask
    more. You'll also answer questions about gaps and career changes without flinching.

steps:
  - type: prose
    id: intro-shape
    body: |-
      Almost every interview starts with "Tell me about yourself". It's a trailer, not your
      life story: about a minute, three parts.

      - **Now**: what you do and what you're good at.
      - **Before**: how you got here, with one proof that you can deliver.
      - **Next**: why this role is the obvious next step.

  - type: multiple-choice
    id: pick-intro
    concept: career.introduction
    difficulty: 1
    question: '"Tell me about yourself." Which opening works best?'
    choices:
      - text: What you do now, how you got here, what's next
        correct: true
        feedback: >-
          Yes. One minute, and they know where to dig.
      - text: Your life story from school onwards
        feedback: >-
          Too long. They want the career thread, in about a minute.
      - text: '"It''s all on my CV."'
        feedback: >-
          They've read it. They want to hear how you tell it and what you stress.

  - type: parsons
    id: order-intro
    concept: career.introduction
    difficulty: 2
    prompt: Put the parts of a one-minute introduction in order.
    language: yaml
    blocks:
      - id: now
        code: 'now: your current role and strongest area'
        subgoal: Now
      - id: before
        code: 'before: your path in one clause, matched to their problem'
        subgoal: Before
      - id: proof
        code: 'proof: one result someone could check'
      - id: next
        code: 'next: their problem, and why you want it'
        subgoal: Next
    distractors:
      - id: passion
        code: 'extra: a line saying you love learning new things'
        feedback: >-
          Everyone says it, so it proves nothing. The proof line shows it instead.

  - type: prose
    id: tailor-intro
    body: |-
      Tailor it to the job. Read the posting, pick the thread of your past that matches it,
      and lead with that.

      Give one proof with a result, not a list of tools. Keep it positive about past
      employers. And end on why this role: it hands them a natural first question.

  - type: ai-review
    id: review-intro-draft
    concept: career.introduction
    difficulty: 2
    language: yaml
    request: Polish this sample introduction for an AI platform role.
    flawClass: logic
    code: |
      now: builds retrieval and eval tooling for a team of 40 engineers
      before: moved over from data engineering three years ago
      proof: an eval gate caught two bad prompt changes before release
      why-leaving: the current manager never understood what AI could do
      next: wants the platform other teams ship AI on
    prompt: >-
      A sample to review, not a script to learn. One line would make the interviewer wince.
      Tap it.
    lines: [4]
    reasons:
      - text: It criticises a past employer
        correct: true
        feedback: >-
          Yes. It makes them wonder what you'll say about them. Talk about what you want.
      - text: The proof line is too specific
        feedback: >-
          Specific is the point. A real outcome is what makes an introduction believable.
      - text: Mentioning a career change looks weak
        feedback: >-
          Said plainly, a switch is a strength. It explains the data background.
    fix: |
      now: builds retrieval and eval tooling for a team of 40 engineers
      before: moved over from data engineering three years ago
      proof: an eval gate caught two bad prompt changes before release
      next: wants the platform other teams ship AI on, and that scope

  - type: prose
    id: gap-plainly
    body: |-
      A gap or a career change is a normal question, not an accusation. Answer it plainly,
      briefly and without apology.

      Say what you did in a sentence: caring for family, a layoff, a switch from another
      field, time to study. Add one thing you built or learnt. Then steer back to why you
      want this role.

  - type: multiple-choice
    id: pick-gap-answer
    concept: career.framing-a-gap
    difficulty: 2
    question: They ask about a year with no employer on your CV. What should you do?
    choices:
      - text: Say what you did, add one thing, move on
        correct: true
        feedback: >-
          Right. Plain, true, and it points at work they can ask about.
      - text: Apologise, then promise it won't happen again
        feedback: >-
          Apologising tells them it's a weakness. It usually isn't one, so don't frame it so.
      - text: Keep it vague to protect your privacy
        feedback: >-
          Vague answers invite more questions. "A family matter" stays private and still
          sounds clear.

  - type: ai-review
    id: review-switch-answer
    concept: career.framing-a-gap
    difficulty: 3
    language: yaml
    request: Draft a sample answer to "Why did you move from teaching into engineering?"
    flawClass: logic
    code: |
      reason: kept automating the school's timetables and liked it most
      step: studied for a year and shipped two small web apps
      proof: fixed the flaky test suite a first team handed over
      hedge: admits being behind people who studied computer science
      next: explains things well, and AI teams need that with users
    prompt: >-
      A sample to review, not a script to learn. The rest is solid, and one line undoes it.
      Tap the line to cut.
    lines: [4]
    reasons:
      - text: It apologises for the path
        correct: true
        feedback: >-
          Yes. It invites doubt nobody has raised. Let the proof speak.
      - text: The teaching reason is irrelevant
        feedback: >-
          It explains why the switch happened, in one line. That's what they asked.
      - text: Explaining things isn't an engineering skill
        feedback: >-
          It is, for AI products used by people. Tying the old field to the role is smart.
    fix: |
      reason: kept automating the school's timetables and liked it most
      step: studied for a year and shipped two small web apps
      proof: fixed the flaky test suite a first team handed over
      next: explains things well, and AI teams need that with users

  - type: explain-back
    id: explain-your-intro
    concept: career.introduction
    difficulty: 4
    prompt: >-
      Write your own one-minute introduction for a senior AI engineering role. Use now,
      before and next.
    rubric:
      - Now says what you do and your strongest area, in a sentence or two.
      - Before gives one proof with a result someone could check.
      - Next says why this role fits, so they have a natural first question.
    modelAnswer: >-
      Your introduction is yours, so compare its shape, not its words. A strong one names
      the current role and strongest area in one sentence. It squeezes the path into a
      clause that matches their posting. It gives one result a stranger could check. It
      ends on their problem, in their words, and why you want it. Said aloud, it lasts about
      a minute.

recap:
  - Introduce yourself as now, before, next, in about a minute.
  - Give one proof with a result, and end on why this role.
  - Explain a gap or a switch plainly, then steer back to the role.
recall:
  - id: card-intro-shape
    concept: career.introduction
    front: What three parts make a one-minute introduction?
    back: >-
      What you do now, how you got here with one proof, and why this role is next.
  - id: card-intro-proof
    concept: career.introduction
    front: What goes in an introduction instead of a list of tools?
    back: >-
      One proof: something you delivered, with a result someone could check.
  - id: card-gap
    concept: career.framing-a-gap
    front: How do you answer a question about a gap on your CV?
    back: >-
      Plainly and without apology: say what you did and one thing you built or learnt, then
      move on.
  - id: card-career-change
    concept: career.framing-a-gap
    front: What makes a career-change answer strong?
    back: >-
      The reason in a line, the steps you took, one proof, and how the old field helps here.

references:
  - kind: docs
    title: 'Software Engineer interviews: Crafting the perfect self introduction'
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/self-introduction/
    note: How to structure the opening minute of an interview.
    primary: true
    verified: true
  - kind: docs
    title: 'Behavioral interviews for Software Engineers: How to prepare'
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/behavioral-interview/
    note: Common personal questions, including why you're looking and why this company.
    verified: true

deepDive: >-
  Keep two lengths ready. The one-minute version opens a technical round. A two-minute
  version, with a second proof, suits a hiring manager who asks you to walk through your
  CV.


  The same pattern works for any awkward question: answer it plainly, give one concrete
  detail, then steer to what you offer. A layoff, a start-up that closed, a career change,
  or time off for health or family all fit. You never owe private details: "a family
  matter", plus the fact that you're fully back, is a complete answer.


  "Why are you leaving?" is the introduction's twin. Answer it with what you're moving
  towards, not what you're escaping: more scale, a product you believe in, a harder class of
  problem.
