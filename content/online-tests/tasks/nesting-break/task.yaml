id: nesting-break
title: NestingBreak
topic: stacks-and-queues
difficulty: easy
type: algorithmic
recommendedMinutes: 20
signature:
  params:
    - { name: S, type: string }
  returns: int
statement: |-
  A template editor checks the brackets in a string S of N characters. S is **properly
  nested** if:

  - S is empty;
  - S has the form "(U)", "[U]" or "{U}", where U is properly nested;
  - S has the form "VW", where V and W are properly nested.

  Write a function:

  {{signature}}

  that, given a string S of N characters, returns −1 if S is properly nested. Otherwise
  it returns the index of the first closing bracket that has no matching opening bracket.
  If there is no such bracket but some brackets are never closed, it returns N.

  For example, given S = "{[()()]}", the function should return −1.

  Given S = "([)()]", the function should return 2.

  Given S = "(()", the function should return 3.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..200,000];
  - string S is made only of the characters "(", ")", "[", "]", "{" and "}".
examples:
  - { args: ["{[()()]}"], expected: -1 }
  - { args: ["([)()]"], expected: 2 }
  - { args: ["(()"], expected: 3 }
timeLimitMs: 500
tests:
  - name: extreme_empty
    description: empty string
    group: correctness
    cases:
      - { args: [""], expected: -1 }
  - name: extreme_single
    description: one bracket
    group: correctness
    cases:
      - { args: ["["], expected: 1 }
      - { args: ["}"], expected: 0 }
  - name: closing_first
    description: a closing bracket before anything could match
    group: correctness
    cases:
      - { args: [")("], expected: 0 }
      - { args: ["()[]{}]"], expected: 6 }
  - name: one_type
    description: one type of bracket, nested and side by side
    group: correctness
    cases:
      - { args: ["(((())))"], expected: -1 }
      - { args: ["()()()()"], expected: -1 }
  - name: wrong_type
    description: the right count but the wrong type
    group: correctness
    cases:
      - { args: ["(]"], expected: 1 }
      - { args: ["{[}]"], expected: 2 }
      - { args: ["(((]"], expected: 3 }
  - name: simple
    description: deep mixed nesting, only opening brackets
    group: correctness
    cases:
      - { args: ["{[(){}]([])}"], expected: -1 }
      - { args: ["{[(){}]([)]}"], expected: 9 }
      - { args: ["({["], expected: 3 }
  - name: small_random
    description: random brackets, N = 100
    group: correctness
    cases:
      - generate: { seed: 3, args: [{ kind: string, n: 100, alphabet: "()[]{}" }] }
      - generate: { seed: 4, args: [{ kind: repeat, times: 20, unit: "([{}])" }] }
  - name: large_nested
    description: repeated nested groups, N = 199,998
    group: performance
    cases:
      - generate: { seed: 5, args: [{ kind: repeat, times: 33333, unit: "{[()]}" }] }
  - name: large_open
    description: every bracket left open, N = 200,000
    group: performance
    cases:
      - generate: { seed: 6, args: [{ kind: string, n: 200000, alphabet: "([{" }] }
  - name: extreme_large
    description: nesting grows by one each group, N = 199,998
    group: performance
    cases:
      - generate: { seed: 7, args: [{ kind: repeat, times: 66666, unit: "(()" }] }
