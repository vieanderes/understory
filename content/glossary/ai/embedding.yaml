term: embedding
aka:
  - vector embedding
short: A list of numbers that captures what a piece of text means, so similar meanings sit close together.
explain: |
  Computers compare numbers well and meanings badly. An embedding model turns a sentence
  into a long list of numbers. Think of it as a point in a space with hundreds of
  dimensions. Texts about the same thing land near each other, even with no words in common.

  "Refund my order" and "I want my money back" end up close. That's what makes search by
  meaning work. The trap: close in meaning isn't the same as relevant. A question and its
  opposite can sit side by side.
analogy: Pins on a map of ideas. Every sentence gets a pin, and sentences about the same thing end up in the same neighbourhood.
example:
  language: js
  code: |
    const a = await embed('Refund my order');
    const b = await embed('I want my money back');
    cosineSimilarity(a, b); // 0.89, close in meaning
usage: Store an embedding per chunk when you save it, so search never recomputes them.
twin:
  term: token
  difference: An embedding is a list of numbers standing for the meaning of a whole passage. A token is one small piece of text that the model reads and writes.
related:
