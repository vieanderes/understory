summary: >-
  A stack answers one question in O(1): what is the most recent thing still open? That makes
  it the tool for nesting (brackets, tags, function calls), for undo, and for any task where
  the latest unfinished item decides what happens next. A queue answers the opposite
  question, the oldest thing still waiting, and it is the engine of breadth-first search and
  of any first-come, first-served process.


  The monotonic stack is the pattern interviewers like most. You keep a stack whose values
  only rise or only fall from bottom to top. A new item pops everything it "answers", then
  waits itself. Because every item is pushed once and popped at most once, a nested `while`
  inside a `for` still totals O(n). It turns "for each item, look ahead until something
  bigger" from O(n²) into one pass.


  The signals in a statement are "next greater", "next smaller", "previous smaller", "how many
  days until", "how far can it see", "span", "the largest rectangle", "nested", "balanced",
  or items that meet and cancel each other, like fish swimming in opposite directions. When
  you see a brute force that scans forwards or backwards from every index and stops at the
  first larger or smaller value, reach for a monotonic stack.
remember:
  - A stack gives the most recent unfinished item in O(1), so nesting and matching problems are one pass with a stack.
  - A bracket checker fails on a closer that meets an empty stack or the wrong opener, and on openers left at the end.
  - A monotonic stack keeps indexes whose values stay sorted, and each new value pops every index it answers.
  - Every index is pushed once and popped at most once, so a monotonic stack pass is O(n) despite the nested loop.
  - For next greater, pop while the top is smaller; for previous smaller, pop while the top is greater or equal, and read the new top.
  - Store indexes on the stack, not values, because the answer is usually a distance or a position.
  - In JavaScript use `push` and `pop` for a stack and a head index for a queue, because `shift` and `unshift` are O(n).
  - Whether you pop on equal values decides who answers ties, so test runs of equal values every time.
sections:
  - title: The monotonic stack template
    body: |-
      There are four variants, and they share one loop. Only the comparison and the moment
      you read the answer change.

      - **Next greater**: pop while the top is smaller than the new value. Each popped index
        gets the new index as its answer.
      - **Next smaller**: the same, with the comparison flipped.
      - **Previous smaller**: pop while the top is greater than or equal to the new value.
        Whatever remains on top is the answer for the new index.
      - **Previous greater**: the same, flipped.

      ```js
      // For each index, the index of the next strictly greater value, or -1.
      function nextGreater(values) {
        const answer = new Array(values.length).fill(-1);
        const stack = []; // indexes, values falling from bottom to top
        for (let i = 0; i < values.length; i++) {
          while (stack.length > 0 && values[stack[stack.length - 1]] < values[i]) {
            answer[stack.pop()] = i;
          }
          stack.push(i);
        }
        return answer;
      }

      // For each index, the index of the previous strictly smaller value, or -1.
      function previousSmaller(values) {
        const answer = new Array(values.length).fill(-1);
        const stack = []; // indexes, values rising from bottom to top
        for (let i = 0; i < values.length; i++) {
          while (stack.length > 0 && values[stack[stack.length - 1]] >= values[i]) stack.pop();
          if (stack.length > 0) answer[i] = stack[stack.length - 1];
          stack.push(i);
        }
        return answer;
      }

      console.log(nextGreater([13, 14, 12, 11, 15])); // [1, 4, 4, 4, -1]
      console.log(nextGreater([7, 7, 7])); // [-1, -1, -1]
      console.log(previousSmaller([3, 1, 4, 1, 5])); // [-1, -1, 1, -1, 3]
      console.log(nextGreater([])); // []
      ```

      Both are O(n) time and O(n) space. To find the next greater value in a **circular**
      array, loop `i` from 0 to `2n - 1`, read `values[i % n]`, and push only while `i` is
      below n. The second lap lets items near the end find answers at the start.
  - title: 'Classic problem: fish that meet and eat'
    body: |-
      A well-known online-assessment task: fish swim in a river, each with a distinct size and a
      direction, 1 for downstream and 0 for upstream. When a downstream fish meets an
      upstream fish ahead of it, the larger one eats the smaller. How many survive?

      Read it as matching. An upstream fish only meets the downstream fish before it, and the
      nearest one first. That is "the most recent one still open", so the downstream fish go
      on a stack. Each upstream fish eats smaller fish off the top until it is eaten or the
      stack is empty.

      ```js
      function survivors(sizes, directions) {
        const downstream = []; // sizes of downstream fish still alive
        let safeUpstream = 0;
        for (let i = 0; i < sizes.length; i++) {
          if (directions[i] === 1) {
            downstream.push(sizes[i]);
            continue;
          }
          while (downstream.length > 0 && downstream[downstream.length - 1] < sizes[i]) {
            downstream.pop();
          }
          if (downstream.length === 0) safeUpstream++;
        }
        return safeUpstream + downstream.length;
      }

      console.log(survivors([4, 3, 2, 1, 5], [0, 1, 0, 0, 0])); // 2
      console.log(survivors([1, 2], [0, 1])); // 2
      console.log(survivors([5, 1, 2], [1, 0, 0])); // 1
      console.log(survivors([], [])); // 0
      ```

      O(n) time, O(n) space. The trap is the order: fish swimming apart (upstream first,
      then downstream) never meet, which is why the second example keeps both.
  - title: 'Classic problem: the largest rectangle in a histogram'
    body: |-
      The deep dive describes the idea. Here is the full code, because the boundary handling
      is where candidates slip. Bars have width 1. For every bar, the widest rectangle of its
      height stretches left to the previous smaller bar and right to the next smaller bar.
      A rising stack finds both at once: when bar `i` pops bar `top`, `i` is the next smaller
      on the right, and the index left underneath is the previous smaller on the left.

      ```js
      function largestRectangle(heights) {
        const stack = []; // indexes with rising heights
        let best = 0;
        for (let i = 0; i <= heights.length; i++) {
          // A sentinel height of 0 after the last bar flushes the stack.
          const h = i === heights.length ? 0 : heights[i];
          while (stack.length > 0 && heights[stack[stack.length - 1]] >= h) {
            const height = heights[stack.pop()];
            const left = stack.length > 0 ? stack[stack.length - 1] + 1 : 0;
            best = Math.max(best, height * (i - left));
          }
          stack.push(i);
        }
        return best;
      }

      console.log(largestRectangle([2, 1, 5, 6, 2, 3])); // 10
      console.log(largestRectangle([2, 2, 2])); // 6
      console.log(largestRectangle([])); // 0
      console.log(largestRectangle([4])); // 4
      ```

      O(n) time, O(n) space. The sentinel removes a second loop after the main one, the most
      common place to forget a bar. Popping on equal heights is safe here: the last equal bar
      to be popped measures the full width.
  - title: 'Classic problem: a queue from two stacks'
    body: |-
      Interviewers ask this to test amortised reasoning, and it is a practical fix for the
      `shift` trap. Push new items onto an inbox stack. To dequeue, take from an outbox stack;
      when the outbox is empty, pour the whole inbox into it, which reverses the order so the
      oldest item ends on top.

      ```js
      class Queue {
        #inbox = [];
        #outbox = [];

        enqueue(item) {
          this.#inbox.push(item);
        }

        dequeue() {
          if (this.#outbox.length === 0) {
            while (this.#inbox.length > 0) this.#outbox.push(this.#inbox.pop());
          }
          return this.#outbox.pop(); // undefined when the queue is empty
        }

        get size() {
          return this.#inbox.length + this.#outbox.length;
        }
      }

      const queue = new Queue();
      queue.enqueue('a');
      queue.enqueue('b');
      console.log(queue.dequeue()); // 'a'
      queue.enqueue('c');
      console.log(queue.dequeue()); // 'b'
      console.log(queue.dequeue()); // 'c'
      console.log(queue.dequeue()); // undefined
      ```

      A single dequeue can cost O(n) when it pours, but each item is moved from inbox to
      outbox once in its life. So n operations cost O(n) in total, O(1) **amortised** each.
      In a coding round a head index into one array is shorter; the two-stack queue is the
      answer when the question forbids anything but stacks.
  - title: From brute force to one pass, and how to say it
    body: |-
      The brute force for "days until warmer" scans forward from every day, O(n²) when
      temperatures keep falling. Name the waste: a cold day that has not found its answer yet
      is re-examined by every later scan. Flip the direction of the question. Instead of each
      day looking forward, let each new day answer every earlier day it beats. The days still
      waiting form a falling sequence, since a warmer day would already have answered a
      cooler one before it. That falling sequence is the stack.

      When you present it, lead with the invariant: "The stack holds the indexes still
      waiting for an answer, and their values fall from bottom to top." Then give the cost
      argument before the interviewer asks: "Each index is pushed once and popped at most
      once, so the inner loop runs at most n times in total. O(n) time, O(n) space."

      Before submitting, test these inputs, because each breaks a different line:

      - empty input, and a single item;
      - strictly rising input, where every item is popped at once;
      - strictly falling input, where the stack only grows (the worst case for space);
      - runs of equal values, which decide whether you pop on `<` or `<=`;
      - an answer that needs the very last item, and one with no answer at all.
  - title: 'Practice task: the stone wall, and nesting'
    body: |-
      A well-known training syllabus has four stack tasks. Brackets is the matching stack from the
      lesson, and Fish is the section above. The other two:

      **Nesting** has only `(` and `)`. With one kind of bracket, a stack of identical
      items is just a count: add 1 for `(`, subtract 1 for `)`, fail if it goes below 0,
      and pass if it ends at 0. O(1) memory.

      **StoneWall** gives the heights of a wall along its length and asks for the fewest
      rectangular blocks that build it. Keep a stack of the heights of blocks still running
      to the right. At each point, blocks taller than the wall here must end, so pop them.
      If the top is now the same height, that block carries on. Otherwise a new block
      starts.

      ```ts
      function stoneWall(heights: number[]): number {
        const open: number[] = []; // heights of blocks still running, lowest at the bottom
        let blocks = 0;
        for (const h of heights) {
          while (open.length > 0 && open[open.length - 1] > h) open.pop();
          if (open.length === 0 || open[open.length - 1] < h) {
            open.push(h); // no open block at exactly this height, so a new one starts
            blocks++;
          }
        }
        return blocks;
      }
      // [8, 8, 5, 7, 9, 8, 7, 4, 8] -> 7
      ```

      It is the monotonic stack again: each height is pushed and popped at most once, so
      O(n) for 100,000 points, although a loop sits inside a loop.

pitfalls:
  - "**Using the front of the array.** `unshift` and `shift` move every item, which makes a linear algorithm quadratic on large inputs. Work at the end with `push` and `pop`, and read the top as `stack[stack.length - 1]`."
  - "**Forgetting the leftovers.** A bracket checker that ends with `return true` accepts `'(()'`. Return `stack.length === 0`, and in monotonic problems give the items left on the stack their default answer."
  - "**Wrong comparison on ties.** Popping on `<=` instead of `<` makes an equal value count as greater. Decide from the statement whether equal counts, then add a test with repeated values."
  - "**Storing values instead of indexes.** Once a value is on the stack you can no longer work out its position, so distances and widths become impossible. Push indexes and read values through them."
  - "**Reading an empty stack.** In JavaScript `stack[stack.length - 1]` on an empty stack is `undefined`, and `undefined < 5` is `false`, which can hide a bug. Check `stack.length > 0` first, explicitly."
  - "**Calling it O(n²).** A `while` inside a `for` looks quadratic. Count pushes and pops per item instead of loop nesting, and state the amortised bound aloud."
verify:
  - lens: breaks
    check: A stack-based check looks at what is left on the stack at the end, not only at mismatches on the way.
  - lens: scales
    check: Stacks push and pop at the end of the array, since `shift` and `unshift` make a linear pass quadratic.
  - lens: confuses
    check: Stacks hold indexes rather than values wherever a position or distance is needed later.
  - lens: tests
    check: Tests include unclosed openers, repeated values for ties, and a large falling input under a time limit.
interview:
  - question: Why is a monotonic stack solution O(n) when it has a loop inside a loop?
    answer: >-
      Because the inner loop's total work is bounded by the number of pushes, not by n per
      outer iteration. Each index is pushed exactly once. Every pass of the `while` pops one
      index, and a popped index never returns. So across the whole run the `while` body
      executes at most n times, and together with the n pushes that is O(n). This is
      amortised analysis: one iteration can pop many items, but only because earlier
      iterations did cheap pushes. Space is O(n) in the worst case, a strictly falling input
      where nothing is ever popped. The same argument covers the sliding-window minimum with
      a deque.
  - question: How would you find, for every element, the next greater element to its right?
    answer: >-
      With a monotonic stack of indexes, in one pass, O(n) time and O(n) space. I walk left
      to right. While the value at the index on top of the stack is smaller than the current
      value, I pop it and record the current index as its answer. Then I push the current
      index. The stack always holds indexes still waiting for an answer, and their values
      fall from bottom to top, since any rise would already have been resolved. Whatever is
      left at the end gets -1. The brute force scans forward from each index, which is O(n²)
      on falling input. If the array is circular, I loop twice over it with `i % n`.
  - question: Implement a queue in JavaScript. What's wrong with push and shift?
    answer: >-
      `shift` is O(n) because it moves every remaining element down one index, so draining a
      large queue is O(n²). Engines may optimise small arrays, but I would not rely on that
      for 100,000 items. The simplest fix is an array plus a head index: `enqueue` pushes,
      `dequeue` reads `items[head++]`, and I compact the array when the head passes half its
      length so memory does not grow forever. If only stacks are allowed, I use two: push to
      an inbox, pop from an outbox, and pour the inbox into the outbox when it is empty. Each
      item moves once, so operations are O(1) amortised. In Python I would use
      `collections.deque`.
  - question: How do you check that a string of brackets is balanced, and what cases do you test?
    answer: >-
      I push every opener onto a stack, and for each closer pop and compare with its
      matching opener; at the end the stack must be empty. That is O(n) time and O(n) space.
      A closer arriving at an empty stack is an immediate failure, and so is a mismatch like
      `(]`. The tests I write are the empty string (balanced), a stray closer first, an
      unclosed opener at the end, crossed pairs like `([)]`, other characters mixed in, and a
      deeply nested input to check there is no recursion. If there is only one bracket type,
      a counter replaces the stack, but it must fail the moment it goes negative.
terms:
  - term: Stack
    say: An array you push to and pop from.
    means: "A last-in, first-out collection: `push` and `pop` work on the same end in O(1), so the top
      is always the most recent unfinished item."
  - term: Queue
    say: An array with `push` and `shift`.
    means: A first-in, first-out collection. In JavaScript `shift` is O(n), so a real queue reads from a
      moving head index to make each dequeue O(1).
  - term: Monotonic stack
    say: A sorted stack.
    means: A stack of indexes whose values only rise or only fall from bottom to top. Each new value
      pops every index it answers, then waits on the stack itself.
  - term: Amortised O(n)
    say: A loop inside a loop is O(n²).
    means: The cost averaged over the whole run instead of counted per step. A `while` that pops inside
      a `for` still totals O(n), because each index is pushed once and popped at most once.
  - term: Next greater element
    say: For each item, look right until something is bigger.
    means: For each index, the first value to its right that is larger. The look-right scan is O(n²); a
      monotonic stack answers every index in one O(n) pass.
