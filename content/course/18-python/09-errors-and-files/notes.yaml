summary: >-
  An exception is Python's way of saying "this can't go on here". It stops the current
  function, travels up the chain of callers, and either meets an `except` that names its
  type or ends the program with a traceback. That's the same idea as `throw` and `catch` in
  JavaScript, with one big difference: Python's `except` filters by type, so catching only
  what you expect is the normal style, not an extra `instanceof` check.


  The problem it solves is separating the happy path from the failure path without
  checking a return code after every call. Bad input, a missing file or a closed network
  connection raise, and the one place that knows what to do about it handles it. Everything
  in between stays clean.


  Reach for `try` when you know a specific failure can happen and you have a sensible
  answer to it: a default, a retry, a clearer error for the caller. Don't reach for it to
  make a crash go away. A traceback you can read is worth more than a program that carries
  on with a wrong value.
remember:
  - An `except` clause matches an exception of that class or any subclass, so the class hierarchy decides what you catch.
  - Catch the narrowest type you can handle, and let every other exception reach the top with its traceback.
  - 'Read a traceback from the bottom: the last line is the error, the frame above it is the line that raised it.'
  - '`else` runs only when the `try` raised nothing, and `finally` runs whatever happened, even after a `return`.'
  - '`raise NewError(...) from error` keeps the original exception as the cause, so the traceback shows both.'
  - Give a library or feature one base exception class, so callers can catch all its failures with one clause.
  - Python prefers EAFP, "try it and handle the failure", over checking every condition first.
  - A bare `except:` also catches `KeyboardInterrupt` and `SystemExit`, which is almost never what you want.
sections:
  - title: The exception hierarchy decides what you catch
    body: |-
      Exceptions are classes, and `except SomeType:` is an `isinstance` check. It matches that
      class and every subclass. So the tree of built-in exceptions is worth knowing in outline:

      ```text
      BaseException
       ├── KeyboardInterrupt, SystemExit, GeneratorExit
       └── Exception
            ├── ArithmeticError → ZeroDivisionError, OverflowError
            ├── LookupError → KeyError, IndexError
            ├── ValueError → UnicodeDecodeError, json.JSONDecodeError
            ├── OSError → FileNotFoundError, PermissionError, TimeoutError
            └── TypeError, AttributeError, NameError, RuntimeError, ...
      ```

      `KeyboardInterrupt` (Ctrl+C) and `SystemExit` (from `sys.exit()`) sit outside
      `Exception` on purpose. `except Exception:` lets them through so a user can still stop
      the program. A bare `except:` catches them too, which is why linters flag it.

      You can name several types in one clause with a tuple. Clauses are tried in order, and
      the first match wins, so put specific types before general ones.

      ```python
      def parse_age(text):
          try:
              age = int(text)
          except (ValueError, TypeError):
              return None
          return age


      print(parse_age("41"))    # 41
      print(parse_age("forty")) # None
      print(parse_age(None))    # None

      print(issubclass(KeyError, LookupError))        # True
      print(issubclass(KeyboardInterrupt, Exception)) # False

      try:
          {}["missing"]
      except LookupError as error:
          print(type(error).__name__, error)  # KeyError 'missing'
      ```

      Compare that with JavaScript. A JS `catch` catches everything, and you filter by hand
      with `if (err instanceof TypeError)` and a rethrow. Forgetting the rethrow is the JS
      version of a bare `except:`. JavaScript can also throw any value, a string included.
      Python only lets you raise instances of `BaseException` subclasses, so every error has a
      type, a message and a traceback.
  - title: The full shape of try, and what each part is for
    body: |-
      A `try` statement has up to four parts. `except` handles a failure. `else` runs only if
      the `try` block raised nothing. `finally` runs on every path: success, a handled error,
      an unhandled error, even a `return` or `break`.

      ```python
      def read_quantity(text):
          try:
              quantity = int(text)
          except ValueError:
              print("not a number")
              return None
          else:
              print("parsed", quantity)
              return quantity
          finally:
              print("done with", repr(text))


      read_quantity("3")
      read_quantity("x")
      ```

      That prints:

      ```text
      parsed 3
      done with '3'
      not a number
      done with 'x'
      ```

      Notice that `finally` ran after each `return` had been decided but before the function
      handed its value back. The reason `else` exists is scope. Code in `else` isn't protected
      by the `except`, so a `ValueError` raised there by a different call isn't mistaken for
      the one you meant to catch. It keeps the `try` block to the one line that can fail in
      the way you expect, which is the same advice as keeping your own `raise` outside it.

      `finally` is for clean-up: releasing a lock, closing a connection, deleting a temporary
      file. For most resources the next lesson's `with` block does the same job more tidily.
      Avoid `return` inside `finally`. It silently discards any exception in flight, and
      newer Python versions warn about it.
  - title: Custom exceptions and chaining
    body: |-
      A feature that can fail in several ways deserves its own exceptions. The pattern is one
      base class per library or feature, with specific subclasses under it. Callers can then
      catch one failure precisely, or every failure of that feature with the base class.

      ```python
      class BookingError(Exception):
          """Base class for every booking failure."""


      class RoomUnavailable(BookingError):
          def __init__(self, room, day):
              super().__init__(f"{room} is taken on {day}")
              self.room = room
              self.day = day


      class InvalidBooking(BookingError):
          pass


      def parse_seats(text):
          try:
              return int(text)
          except ValueError as error:
              raise InvalidBooking(f"seats must be a number, got {text!r}") from error


      try:
          parse_seats("four")
      except BookingError as error:
          print(type(error).__name__, "-", error)
          print("cause:", repr(error.__cause__))

      try:
          raise RoomUnavailable("Blue", "Monday")
      except RoomUnavailable as error:
          print(error.room, error.day)
      ```

      That prints:

      ```text
      InvalidBooking - seats must be a number, got 'four'
      cause: ValueError("invalid literal for int() with base 10: 'four'")
      Blue Monday
      ```

      `raise ... from error` sets `__cause__`, and an uncaught error prints both tracebacks
      joined by "The above exception was the direct cause of the following exception". If you
      raise inside an `except` without `from`, Python still links them through `__context__`,
      but the join reads "During handling of the above exception, another exception
      occurred", which suggests a bug in your handler. Use `from error` when you translate on
      purpose, and `from None` when the original is noise to the caller.

      Extra fields such as `room` and `day` let a handler react without parsing the message.
      JavaScript has the same pieces: `class RoomUnavailable extends Error`, and since ES2022
      `new Error("msg", { cause: err })`.
  - title: EAFP, LBYL, and when to check first
    body: |-
      Python style has a name for "try it and handle the failure": **EAFP**, easier to ask
      forgiveness than permission. The opposite, checking every condition first, is **LBYL**,
      look before you leap.

      ```python
      prices = {"tea": 3, "cake": 5}

      # LBYL: look before you leap
      if "tea" in prices:
          print(prices["tea"])

      # EAFP: easier to ask forgiveness than permission
      try:
          print(prices["scone"])
      except KeyError:
          print("no price for scone")

      # Often a method removes the question entirely
      print(prices.get("scone", 0))
      ```

      EAFP wins in three situations. The check and the action can race, as with
      `if path.exists(): path.read_text()`, where another process can delete the file in
      between. The check duplicates work the action does anyway, as `int(text)` already
      validates the text. And the check is hard to write correctly, such as "is this a valid
      date".

      LBYL wins when failure is common and cheap to spot, when the action has side effects
      you can't undo halfway, or when a method such as `dict.get` answers the question without
      any exception. Raising and catching costs more than an `if`, so an exception inside a
      hot loop that fails half the time is slower than a check. Pick the one that reads most
      clearly. In JavaScript you mostly check first, because many failures produce `undefined`
      instead of throwing, whereas Python raises `KeyError` for a missing key.
  - title: Handling errors at the top, and several at once
    body: |-
      Deep code catches narrowly. The top of a program, such as a command-line entry point,
      a web request handler or a worker loop, is the one place where catching `Exception` is
      right: log the full traceback, return an error, and keep serving or exit with a code.

      ```python
      import logging
      import sys

      logging.basicConfig(level=logging.INFO)
      log = logging.getLogger("importer")


      def import_orders(rows):
          return [int(row) for row in rows]


      def main():
          try:
              import_orders(["1", "two"])
          except Exception:
              log.exception("import failed")
              return 1
          return 0


      if __name__ == "__main__":
          sys.exit(main())
      ```

      `log.exception` logs at error level and appends the traceback, so nothing is lost.
      Web frameworks do this for you and turn the error into a 500 response.

      Python 3.11 added two tools for richer errors. `error.add_note("while reading line 12")`
      attaches context that is printed under the traceback, without changing the type. And an
      `ExceptionGroup` carries several failures at once, which suits validation that reports
      every problem, or concurrent tasks that fail together. `except*` handles each type in the
      group separately:

      ```python
      def validate(order):
          problems = []
          if order.get("quantity", 0) <= 0:
              problems.append(ValueError("quantity must be positive"))
          if "email" not in order:
              problems.append(KeyError("email"))
          if problems:
              raise ExceptionGroup("invalid order", problems)


      try:
          validate({"quantity": 0})
      except* ValueError as group:
          print("values:", [str(e) for e in group.exceptions])
      except* KeyError as group:
          print("keys:", [str(e) for e in group.exceptions])
      ```

      Both clauses run here, printing `values: ['quantity must be positive']` and then
      `keys: ["'email'"]`. You'll meet groups mostly from `asyncio.TaskGroup`.
pitfalls:
  - >-
    **Wrapping a whole function in `try`.** A large `try` block catches the expected error
    from one line and unrelated errors from every other line. Put only the call that can fail
    inside `try`, and move the rest to `else` or after the statement.
  - >-
    **`except Exception: pass`.** It turns every bug into silence and a wrong result later.
    If you really mean to ignore one failure, name it, and prefer
    `contextlib.suppress(FileNotFoundError)`, which states the intent.
  - >-
    **Raising inside the `try` that catches it.** `raise ValueError("negative")` placed in a
    `try` with `except ValueError` is caught by your own handler, so the check does nothing.
    Validate after the `try` statement.
  - >-
    **Losing the original error.** `except KeyError: raise ConfigError("bad config")` hides
    which key was missing behind a confusing "During handling" message. Write
    `except KeyError as error: raise ConfigError(...) from error`.
  - >-
    **Using `raise error` to rethrow.** It works but adds the current line to the traceback.
    A bare `raise` inside the `except` rethrows the active exception exactly as it was.
  - >-
    **Stopping at the crash line.** The frame that raised is where it broke, not always where
    the bug is. A `KeyError` on a dict usually means a caller passed incomplete data, so read
    up the traceback to where the value was made.
verify:
  - lens: breaks
    check: Every `except` names the exception you expect, such as `ValueError`, so an unexpected `None` or typo still crashes loudly.
  - lens: confuses
    check: An error you raise for the caller says what was wrong and with which value, not only "invalid input".
  - lens: leaks
    check: Full tracebacks go to your logs, not to a user's screen, since they show file paths and lines of your code.
  - lens: tests
    check: A test feeds the function bad input and checks it raises the error you expect, not a quiet default.
interview:
  - question: When is it acceptable to catch `Exception`?
    answer: >-
      At a boundary, where the job is to log and contain the failure, not to recover from it.
      Examples are a command-line entry point, a request handler, a queue worker or a
      scheduled job: catch `Exception`, log it with `logger.exception` so the traceback is
      kept, then return an error response, mark the job failed, or exit non-zero. Deeper in
      the code I catch the narrowest type I can actually handle, such as `ValueError` from a
      parse, because a broad catch there turns bugs like a `TypeError` from a `None` into
      quiet wrong answers. I never use a bare `except:`, since it also traps
      `KeyboardInterrupt` and `SystemExit`. The trade-off is that a worker loop catching
      everything must still alert on repeated failures, or it hides an outage.
  - question: What's the difference between `raise X from e`, raising inside `except` without `from`, and `from None`?
    answer: >-
      All three are about what the traceback tells the next person. `raise X from e` sets
      `X.__cause__`, and the traceback says the first error was the direct cause: this is a
      deliberate translation, for example turning a `KeyError` into a `ConfigError`. Raising
      inside an `except` without `from` still records the first error as `__context__`, but
      the message says another exception occurred during handling, which reads like a bug in
      the handler. `raise X from None` suppresses the context when the original is an
      implementation detail the caller shouldn't see. I use `from e` by default, because
      losing the root cause costs far more debugging time than a longer traceback.
  - question: How would you design the exceptions for a library you're writing?
    answer: >-
      One base class for the library, then a small number of specific subclasses for the
      failures callers want to treat differently. For a payments client that might be
      `PaymentError`, with `CardDeclined`, `RateLimited` and `ProviderUnavailable` under it.
      Callers can catch `PaymentError` to handle everything, or `RateLimited` to back off and
      retry. I put useful data on the exception as attributes, such as `retry_after`, so
      handlers don't parse messages, and I chain the underlying `httpx` error with `from`. I
      also subclass a built-in where it fits, like `ValueError` for bad input, so generic code
      still works. The trade-off is granularity: too many classes and nobody knows which to
      catch.
  - question: EAFP or LBYL, which does Python prefer and why?
    answer: >-
      Python leans towards EAFP: attempt the operation and handle the specific exception.
      The main reason is correctness. A check followed by an action can race, as with testing
      that a file exists and then opening it, while opening and catching
      `FileNotFoundError` is atomic from your side. It also avoids duplicating the work, since
      `int(text)` already validates the text. LBYL is still right when failure is common,
      because raising is slower than an `if`, when a method like `dict.get` answers the
      question directly, or when the action has side effects that are hard to undo halfway.
      I pick whichever keeps the code shortest and clearest.
