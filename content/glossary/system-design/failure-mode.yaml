term: failure mode
aka:
  - way to fail
  - failure scenario
short: One specific way a system or piece of code can go wrong, named so you can plan.
explain: |
  "It might break" isn't useful. "The payment provider times out after charging the card"
  is. Naming the exact way it fails tells you what to test and what to build.

  Walk the usual sources. Input from outside: empty, huge, malformed, hostile. Dependencies:
  slow, down, wrong. Concurrency: two users at once. Resources: disk, memory, quotas. Time:
  midnight, time zones, clocks that jump.

  Then pick by cost. The likely ones and the expensive ones get a test. The rest get a note.
analogy: A pilot's checklist of what to do if an engine fails, written on the ground, not in the air.
usage: List the failure modes before the review; the retry path has no test at all.
related:
  - partial-failure
  - edge-case
  - pre-mortem
  - blast-radius
level: 2
