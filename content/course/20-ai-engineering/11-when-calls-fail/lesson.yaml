deepDive: >-
  **What the SDK retries.** The Anthropic Python SDK retries connection errors, `408`,
  `409`, `429` and every `5xx` status, twice by default, with exponential backoff. It
  honours `retry-after` when the server sends it. Everything else raises at once.


  **Refusals.** Some models can stop with `stop_reason` `"refusal"` when a request crosses
  a safety line. Check for it before reading the text. Some APIs can then try a fallback
  model for you.


  **Fail usefully.** When retries run out, the user needs a plain message and your logs
  need the request id. Every reply object carries one, and support teams ask for it first.
