term: agent
aka:
  - AI agent
short: A model in a loop that picks tools, reads their results and decides its own next step.
explain: |
  A plain model call answers once. Put it in a loop. It calls a tool, reads the result and
  picks the next tool. It stops when it decides it's done. That loop is the whole idea.

  Freedom costs reliability. An agent can loop forever, take a wrong turn early, or do
  something it can't undo. Production agents run inside a harness: a step cap, a budget,
  narrow tools, and a person approving risky actions. If the steps are known in advance, a
  fixed workflow is usually the better choice.
analogy: A new hire with a to-do list and a bunch of keys. You don't script their every move, so you choose carefully which keys to hand over.
usage: This doesn't need an agent; the steps never change, so write a workflow.
twin:
  term: tool-use
  difference: An agent decides its own sequence of steps in a loop. Tool use is the single step inside that loop, one request for one call.
