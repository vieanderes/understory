term: over-the-air update
aka:
  - OTA update
  - OTA
  - hot update
short: A change pushed straight to installed apps without a new store release, limited to code that isn't native.
explain: |
  A store release takes days: a build, a review, then people choosing to update. For a typo
  in a button, that's slow.

  Some cross-platform frameworks can download a new JavaScript bundle and assets when the
  app starts. The fix reaches users the next time they open it, with no store involved.

  The boundary is strict. It can change JavaScript, styles and images. A new native module,
  permission or SDK needs a store build. Send one over the air anyway and old installs crash. So each update is tied to the native
  runtime version it was built for.
analogy: Changing the menu board in a restaurant. You can't move the kitchen that way.
usage: The copy fix can go as an over-the-air update, but the camera permission needs a store build.
