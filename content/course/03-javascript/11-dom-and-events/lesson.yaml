id: js.dom-events
title: Events
objective: React to typing and form submits, stop the browser's default action, and serve many rows with one listener.
level: essential
minutes: 10
concepts: [js.event-propagation, js.event-delegation, js.default-actions]
prerequisites: [js.changing-the-page, js.closures]
opening:
  text: >-
    You'll build a to-do list that adds a row when you submit and removes one when you click.
    Along the way you'll meet the three event bugs almost everyone writes once.

steps:
  - type: prose
    id: the-event-object
    body: |-
      Clicks aren't the only events. `input` fires on every change to a text box, and `submit`
      fires when a form is sent. Each listener gets an **event object** describing what
      happened:

      ```js
      box.addEventListener("input", (event) => {
        count.textContent = event.target.value.length;
      });
      ```

      `event.target` is the element it happened on, here the box.

  - type: playground
    id: live-count
    concept: js.event-listeners
    difficulty: 2
    prompt: >-
      The counter should update with every letter typed, but it waits until you leave the box.
      The listener is on the wrong event. Fix it, then type in the box.
    html: |
      <label for="post">Your post</label>
      <textarea id="post"></textarea>
      <p id="count">0 / 140</p>
    js: |
      const post = document.querySelector("#post");
      const count = document.querySelector("#count");

      post.addEventListener("change", (event) => {
        count.textContent = `${event.target.value.length} / 140`;
      });

      // A test: types Hello into the box, as a keyboard would.
      post.value = "Hello";
      post.dispatchEvent(new Event("input"));
    editable: [js]
    checks:
      - label: The count follows the typing
        selector: '#count'
        text: 5 / 140
    solution:
      js: |
        const post = document.querySelector("#post");
        const count = document.querySelector("#count");

        post.addEventListener("input", (event) => {
          count.textContent = `${event.target.value.length} / 140`;
        });

        // A test: types Hello into the box, as a keyboard would.
        post.value = "Hello";
        post.dispatchEvent(new Event("input"));
    hints:
      - Only the event name needs to change.
      - '`change` fires when you leave the box. Which event fires on every keystroke?'
      - Swap `"change"` for `"input"`.

  - type: prose
    id: forms-reload
    body: >-
      A form has a job of its own. On submit, the browser sends it and loads a new page. That's
      its **default action**, and it wipes out anything your script added.


      Call `event.preventDefault()` in the submit listener to cancel it, then handle the data
      yourself. This preview stops reloads for you. A real site won't.

  - type: predict-output
    id: predict-reload
    concept: js.default-actions
    difficulty: 2
    language: js
    code: |
      form.addEventListener("submit", () => {
        const row = document.createElement("li");
        row.textContent = box.value;
        list.append(row);
      });
    question: On a real site, someone types Buy stamps and presses Add. What do they see?
    choices:
      - text: The row flashes, then the page reloads without it
        correct: true
        feedback: >-
          Right. The listener runs, then the browser sends the form and loads a fresh page.
      - text: The new row, staying in the list
        feedback: >-
          The listener did add it. Nothing cancelled the submit, so a new page replaced it.
      - text: Nothing, submit listeners need a click
        feedback: >-
          Pressing Add, or Enter in the box, submits the form. That fires `submit`.

  - type: playground
    id: add-todo
    concept: js.default-actions
    difficulty: 3
    prompt: >-
      Write the submit listener. It stops the reload, adds the typed task as a new `li`, and
      empties the box. The last lines submit the form once as a test.
    html: |
      <form>
        <label for="task">Task</label>
        <input id="task" placeholder="What needs doing?">
        <button>Add</button>
      </form>
      <ul></ul>
    js: |
      const form = document.querySelector("form");
      const box = document.querySelector("#task");
      const list = document.querySelector("ul");

      // Your submit listener goes here.

      // A test: types a task and submits the form.
      box.value = "Water the plants";
      form.requestSubmit();
    editable: [js]
    showTree: true
    checks:
      - label: A row says Water the plants
        selector: 'ul li'
        text: Water the plants
      - label: The box is empty again
        selector: '#task:placeholder-shown'
    solution:
      js: |
        const form = document.querySelector("form");
        const box = document.querySelector("#task");
        const list = document.querySelector("ul");

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const row = document.createElement("li");
          row.textContent = box.value;
          list.append(row);
          box.value = "";
        });

        // A test: types a task and submits the form.
        box.value = "Water the plants";
        form.requestSubmit();
    hints:
      - Listen on the form for `"submit"`, and take the `event` as the parameter.
      - First line of the listener, `event.preventDefault();`. Then build the row as in the last lesson.
      - Finish with `box.value = "";` to empty the box.

  - type: prose
    id: bubbling-and-delegation
    body: >-
      A click doesn't stop at the element you pressed. It **bubbles**: the button's listeners
      run, then its parent's, then the parent's parent, up to the page.


      So one listener on the list hears clicks on every row, even rows added later. That's
      **event delegation**. `event.target.closest("button")` walks up from what was pressed to
      the nearest button, or gives `null`. `event.target.matches("button")` only asks about the
      pressed element itself.

  - type: predict-output
    id: predict-bubble
    concept: js.event-propagation
    difficulty: 2
    language: js
    code: |
      // <ul><li><button>Done</button></li></ul>
      const list = document.querySelector("ul");
      const row = document.querySelector("li");
      const button = document.querySelector("button");
      list.addEventListener("click", () => console.log("list"));
      row.addEventListener("click", () => console.log("row"));
      button.addEventListener("click", () => console.log("button"));
      button.click();
    question: In what order do the lines log?
    choices:
      - text: '`button`, `row`, `list`'
        correct: true
        feedback: >-
          Right. The click starts at the button and bubbles up.
      - text: '`list`, `row`, `button`'
        feedback: >-
          That's the order they were added. The event goes by the tree, from the target up.
      - text: '`button` only'
        feedback: >-
          The button is where it starts, not where it stops. Its ancestors hear it too.

  - type: fill-blank
    id: fill-delegated-remove
    concept: js.event-delegation
    difficulty: 3
    language: js
    prompt: >-
      One listener on the list removes a row when its remove button is pressed, icon included.
      Complete it.
    template: |
      // <li>Post the parcel <button class="remove"><span>x</span> Remove</button></li>
      list.addEventListener("click", (event) => {
        const button = event.{{1}}.{{2}}(".remove");
        if (!button) {
          return;
        }
        const row = button.closest("li");
        row.{{3}}();
      });
    blanks:
      - key: '1'
        answer: target
      - key: '2'
        answer: closest
      - key: '3'
        answer: remove
    bank: [target, list, closest, matches, remove, append]

  - type: playground
    id: remove-with-one-listener
    concept: js.event-delegation
    difficulty: 4
    prompt: >-
      Pressing the word Remove works, but pressing the x icon does nothing. The test presses the
      icon on the Water row. Fix the one listener so it works either way.
    html: |
      <ul>
        <li id="water">Water the plants <button class="remove"><span class="icon">x</span> Remove</button></li>
        <li id="bins">Take the bins out <button class="remove"><span class="icon">x</span> Remove</button></li>
        <li id="call">Call the dentist <button class="remove"><span class="icon">x</span> Remove</button></li>
      </ul>
    js: |
      const list = document.querySelector("ul");

      list.addEventListener("click", (event) => {
        if (event.target.matches(".remove")) {
          event.target.closest("li").remove();
        }
      });

      // A test: presses the icon inside the Water row's button.
      document.querySelector("#water .icon").click();
    editable: [js]
    showTree: true
    checks:
      - label: The Water row is gone
        selector: '#water'
        count: 0
      - label: The list is still there
        selector: ul
    solution:
      js: |
        const list = document.querySelector("ul");

        list.addEventListener("click", (event) => {
          const button = event.target.closest(".remove");
          if (button) {
            button.closest("li").remove();
          }
        });

        // A test: presses the icon inside the Water row's button.
        document.querySelector("#water .icon").click();
    hints:
      - When the icon is pressed, `event.target` is the `span`, not the button.
      - '`matches` only tests the element itself. `closest` also checks its ancestors.'
      - 'Start with `const button = event.target.closest(".remove");`.'

  - type: explain-back
    id: explain-bin-icon
    concept: js.event-delegation
    difficulty: 3
    prompt: |-
      ```js
      // <button class="remove"><span class="icon">x</span> Remove</button>
      list.addEventListener("click", (event) => {
        if (event.target.matches(".remove")) {
          event.target.closest("li").remove();
        }
      });
      ```

      Pressing the word Remove works. Pressing the icon does nothing. Why, and what fixes it?
    rubric:
      - '`event.target` is the deepest element pressed, which is the icon, not the button.'
      - '`matches` tests only that element, so the check fails for the icon.'
      - '`event.target.closest(".remove")` walks up from the icon and finds the button.'
    modelAnswer: >-
      The target is whatever was actually pressed. On the icon, that's the `span` inside the
      button, so `matches(".remove")` is false and nothing happens. Pressing the word hits the
      button itself, which is why that works. `event.target.closest(".remove")` starts at the
      target and walks up, so it finds the button either way.

recap:
  - Pick the right event, such as `input` for typing and `submit` for a form.
  - Stop a form's reload with `event.preventDefault()`.
  - Serve every row with one listener, using bubbling and `closest`.

recall:
  - id: card-input-or-change
    concept: js.event-listeners
    front: Which event fires on every keystroke in a text box, and which only when you leave it?
    back: >-
      `input` fires on every change. `change` fires once the box loses focus with a new value.
  - id: card-prevent-default
    concept: js.default-actions
    front: Your submit listener adds a row, and it vanishes at once. What's missing?
    back: >-
      `event.preventDefault()`. Without it the browser sends the form and loads a new page.
  - id: card-bubbling
    concept: js.event-propagation
    front: A button sits inside an `li` inside a `ul`, each with a click listener. Which run?
    back: >-
      All three, button first, then `li`, then `ul`. The click bubbles up the tree.
  - id: card-target-closest
    concept: js.event-delegation
    front: In a delegated listener, how do you find the button when the icon inside it was pressed?
    back: >-
      `event.target.closest("button")`. It walks up from the pressed element to the nearest
      match, or returns `null`.

