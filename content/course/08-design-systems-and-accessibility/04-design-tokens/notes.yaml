summary: >-
  A design system is the shared kit that keeps many screens and many people consistent: named
  values, components built from them, and rules for using both. **Design tokens** are the
  named values. Each records one decision, such as "the accent colour" or "the second spacing
  step", once, so changing the decision is one edit instead of a search through hundreds of
  files.


  Tokens work best in tiers. **Primitive** tokens hold the raw palette and scales, named for
  what they are. **Semantic** tokens name a purpose, such as surface, ink or accent, and point
  at a primitive. **Component** tokens, when a component needs them, name a slot of one
  component and point at a semantic token. Components read semantic or component tokens, never
  primitives, and that one rule is what makes theming work.


  On the web, tokens usually end up as CSS custom properties. A theme is a block that gives the
  semantic tokens new values, and inheritance carries them to every element below. Dark mode,
  high contrast and brand variants all become the same move. Tokens can also live as data,
  such as JSON, and a build step turns them into CSS, iOS and Android values from one source.
remember:
  - A design token is a named design decision stored once, and a design system is tokens, components and the rules for using them.
  - Primitive tokens say what a value is, semantic tokens say what it's for, and component tokens say where one component uses it.
  - Components read semantic or component tokens only, so a theme that remaps the semantic tier restyles everything without touching components.
  - A theme is a selector, such as `[data-theme="dark"]` or a `prefers-color-scheme` query, that gives the semantic tokens new values.
  - A custom property that uses `var()` resolves on the element where it's declared, so an alias defined on `:root` ignores a theme set lower down.
  - An invalid `var()` value makes the declaration invalid at computed-value time, so the property falls back to inherited or initial, not to your earlier declaration.
  - Every theme is its own set of colour pairs, and each pair of text and surface needs checking against 4.5 to 1.
  - Name tokens by purpose and scale position, such as `--color-ink-muted` or `--space-2`, never by raw value, such as `--blue` or `--16px`.
sections:
  - title: Three tiers, in CSS
    body: |-
      Here is a small but complete setup. Primitives hold every allowed value. Semantic tokens
      map purposes onto them, and the dark theme remaps only that tier. The button declares its
      own component tokens, so a variant changes two slots instead of redeclaring the whole
      style.

      ```css
      :root {
        /* Primitives: the palette and scales, named for what they are. */
        --indigo-200: #c5c8ff;
        --indigo-700: #3a41b8;
        --red-700: #b91c1c;
        --red-200: #fecaca;
        --stone-50: #f5f3ee;
        --stone-900: #1b1d2e;
        --space-1: 8px;
        --space-2: 16px;

        /* Semantic: named for what they're for. Components read only these. */
        --color-surface: var(--stone-50);
        --color-ink: var(--stone-900);
        --color-accent: var(--indigo-700);
        --color-on-accent: var(--stone-50);
        --color-danger: var(--red-700);
        --color-on-danger: var(--stone-50);
      }

      [data-theme="dark"] {
        --color-surface: var(--stone-900);
        --color-ink: var(--stone-50);
        --color-accent: var(--indigo-200);
        --color-on-accent: var(--stone-900);
        --color-danger: var(--red-200);
        --color-on-danger: var(--stone-900);
      }

      /* Component: declared on the component, so it reads whichever theme is in scope. */
      .button {
        --button-bg: var(--color-accent);
        --button-fg: var(--color-on-accent);
        background: var(--button-bg);
        color: var(--button-fg);
        padding: var(--space-1) var(--space-2);
      }
      .button[data-variant="danger"] {
        --button-bg: var(--color-danger);
        --button-fg: var(--color-on-danger);
      }
      ```

      Two buttons of each kind, one pair inside a `section data-theme="dark"`, computed in
      Chromium:

      ```text
      light Book   rgb(58, 65, 184) on rgb(245, 243, 238)
      light Cancel rgb(185, 28, 28) on rgb(245, 243, 238)
      dark  Book   rgb(197, 200, 255) on rgb(27, 29, 46)
      dark  Cancel rgb(254, 202, 202) on rgb(27, 29, 46)
      ```

      The component tier is optional. Add it when a component has slots that people really do
      override, such as a button's background, or when a component needs a value no semantic
      token covers. A component tier for everything doubles the number of names without adding
      a decision.
  - title: Naming tokens
    body: |-
      Names outlive values, so they should describe the decision, not the current colour. A
      token called `--blue` becomes a lie the day the brand turns teal. A token called
      `--color-accent` stays true.

      A common shape reads from general to specific: category, then role, then variant, then
      state.

      ```text
      --color-ink               category-role
      --color-ink-muted         category-role-variant
      --color-accent-hover      category-role-state
      --color-on-accent         text or icons placed on the accent
      --button-bg-hover         component-slot-state
      --space-2                 category-step on a scale
      --radius-small            category-size
      ```

      A few habits keep a set usable:

      - **Pair foregrounds with backgrounds.** `--color-on-accent` names the colour for text on
        the accent, so nobody guesses which ink passes contrast on it.
      - **Use scales for primitives.** Numbered steps, such as 50 to 900 for lightness or 1 to 8
        for spacing, leave room for a new step between old ones.
      - **Keep themes out of names.** `--color-dark-bg` is wrong in the light theme. The theme is
        the selector, not part of the token.
      - **Keep the set small.** Every token is an option someone must choose between. A short
        list of text sizes and one spacing unit, such as 8 pixels, keeps layouts related.

      Tailwind's theme variables use the same idea, and the next lesson builds on it: a name
      such as `--color-accent` generates classes like `bg-accent`.
  - title: How theming moves through the cascade
    body: |-
      Custom properties inherit, which is why one theme block reaches every element below it.
      But a property that contains `var()` is resolved on the element where it's declared, and
      the result is what gets inherited. That creates a real trap for alias tokens.

      ```css
      :root {
        --color-accent: var(--indigo-700);
        --button-background: var(--color-accent); /* resolved here, on :root */
      }
      [data-theme="dark"] { --color-accent: var(--indigo-200); }
      .a { background: var(--button-background); }
      .b { --local: var(--color-accent); background: var(--local); }
      ```

      With `data-theme="dark"` on a `section`, Chromium gave `.a` the light indigo
      `rgb(58, 65, 184)` and `.b` the dark theme's `rgb(197, 200, 255)`. Moving the attribute to
      `html` fixed `.a`, because the alias was then resolved inside the theme. So declare
      component tokens on the component, as in the first section, or only ever theme `html`.

      A second trap is fallback. `color: red; color: var(--typo);` doesn't fall back to red when
      `--typo` holds something that isn't a colour. The second declaration wins the cascade,
      then fails at computed-value time, and the property becomes inherited or initial. Give
      `var()` its own fallback, `var(--color-accent, #3a41b8)`, or register the property:

      ```css
      @property --brand {
        syntax: '<color>';
        inherits: true;
        initial-value: #3a41b8;
      }
      ```

      With this rule, `--brand: 16px` is rejected and `var(--brand)` gives the initial colour.

      For two themes, `light-dark()` picks a value by the element's colour scheme. With
      `color-scheme: light dark` on `:root`, the token `--accent: light-dark(#3a41b8, #c5c8ff)`
      computed to indigo in Chromium's light mode and lilac in its dark mode, with no media
      query.
  - title: Dark mode is a second design
    body: |-
      A dark theme is not the light theme inverted. Pure white text on pure black is harsh for
      many readers, so surfaces are usually a dark grey or navy.
      Saturated accents glare on dark surfaces, so they move to lighter, softer tints. Shadows
      barely show, so raised surfaces are shown by being slightly lighter.

      Each theme is also a separate set of contrast pairs. A small test, using the contrast
      function from the previous lesson, checks every pair the components use:

      ```js
      const linear = (c) => {
        c /= 255;
        return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      };
      const luminance = (hex) => {
        const n = parseInt(hex.slice(1), 16);
        return 0.2126 * linear((n >> 16) & 255) + 0.7152 * linear((n >> 8) & 255) + 0.0722 * linear(n & 255);
      };
      const contrast = (a, b) => {
        const [light, dark] = [luminance(a), luminance(b)].sort((x, y) => y - x);
        return (light + 0.05) / (dark + 0.05);
      };

      const themes = {
        light: { surface: '#f5f3ee', ink: '#1b1d2e', accent: '#3a41b8', 'on-accent': '#f5f3ee' },
        dark: { surface: '#1b1d2e', ink: '#f5f3ee', accent: '#c5c8ff', 'on-accent': '#1b1d2e' },
      };
      const pairs = [['ink', 'surface'], ['accent', 'surface'], ['on-accent', 'accent']];

      for (const [name, t] of Object.entries(themes)) {
        for (const [fg, bg] of pairs) {
          const ratio = contrast(t[fg], t[bg]);
          console.log(`${name} ${fg} on ${bg}: ${ratio.toFixed(2)}${ratio < 4.5 ? ' FAIL' : ''}`);
        }
      }
      // light ink on surface: 15.01
      // light accent on surface: 7.21
      // light on-accent on accent: 7.21
      // dark ink on surface: 15.01
      // dark accent on surface: 10.37
      // dark on-accent on accent: 10.37
      ```

      Had the dark theme kept the light accent, `#3a41b8` on `#1b1d2e`, the test would print
      2.08 and fail. Run it in CI and a token change can't ship a failing pair.

      For choosing the theme, the lesson's pattern stands: `prefers-color-scheme` sets the
      default, a stored choice in `data-theme` overrides it, and a small inline script in the
      `head` applies the stored choice before the first paint. In React, that script changes an
      attribute React also renders, so `suppressHydrationWarning` on the `html` element keeps
      React from warning about the difference.
  - title: Tokens as data
    body: |-
      Large systems keep tokens in data files and generate code from them, so web, iOS and
      Android share one source. The W3C Design Tokens Community Group's format stores each
      token as an object with `$value`, an optional `$type`, and aliases written in braces.
      A tiny build shows the idea:

      ```js
      // A tiny token build: nested JSON with {aliases} in, CSS custom properties out.
      const tokens = {
        color: {
          indigo: { 200: { $value: '#c5c8ff' }, 700: { $value: '#3a41b8' } },
          stone: { 50: { $value: '#f5f3ee' }, 900: { $value: '#1b1d2e' } },
          surface: { $value: '{color.stone.50}' },
          ink: { $value: '{color.stone.900}' },
          accent: { $value: '{color.indigo.700}' },
        },
        button: { background: { $value: '{color.accent}' } },
      };

      function flatten(node, path = [], out = new Map()) {
        for (const [key, child] of Object.entries(node)) {
          if (key.startsWith('$')) continue;
          if ('$value' in child) out.set([...path, key].join('.'), child.$value);
          else flatten(child, [...path, key], out);
        }
        return out;
      }

      const flat = flatten(tokens);
      const cssName = (path) => `--${path.replaceAll('.', '-')}`;

      const lines = [...flat].map(([path, value]) => {
        const alias = /^\{(.+)\}$/.exec(value);
        if (alias && !flat.has(alias[1])) throw new Error(`${path} points at missing ${alias[1]}`);
        // Keep the alias as var(), so a theme that moves the role moves everything above it.
        const css = alias ? `var(${cssName(alias[1])})` : value;
        return `  ${cssName(path)}: ${css};`;
      });

      console.log(`:root {\n${lines.join('\n')}\n}`);
      ```

      It prints:

      ```css
      :root {
        --color-indigo-200: #c5c8ff;
        --color-indigo-700: #3a41b8;
        --color-stone-50: #f5f3ee;
        --color-stone-900: #1b1d2e;
        --color-surface: var(--color-stone-50);
        --color-ink: var(--color-stone-900);
        --color-accent: var(--color-indigo-700);
        --button-background: var(--color-accent);
      }
      ```

      Real tools such as Style Dictionary add types, themes, other platforms and
      documentation. Note the last line: it is exactly the alias-on-`:root` case from the
      cascade section, so a generator should either emit component tokens on component
      selectors or theme only the root element.
pitfalls:
  - '**Components reading palette tokens.** `color: var(--indigo-700)` looks right until the dark theme, where it stays dark on dark. Components read semantic tokens such as `--color-accent`.'
  - '**Naming tokens after their values.** `--blue-button` or `--spacing-16` break the day the value changes. Name the purpose or the scale step.'
  - '**Theming a subtree with aliases resolved on `:root`.** Custom properties with `var()` resolve where they''re declared, so a nested `data-theme` doesn''t reach them. Declare aliases on the component, or theme `html` only.'
  - '**Trusting the earlier declaration as a fallback.** A `var()` that resolves to nonsense makes the property inherited or initial, not the previous value. Use a `var()` fallback or `@property` with a syntax.'
  - '**Checking contrast in one theme.** Each theme has its own pairs. Test every text and surface combination in every theme, ideally in CI.'
  - '**A flash of the wrong theme.** Setting `data-theme` after hydration shows the light theme first. Apply the stored choice with an inline script in the `head`.'
interview:
  - question: What are design tokens, and why use tiers?
    answer: >-
      Design tokens are named design decisions, such as a colour, a spacing step or a radius,
      stored once and referenced everywhere. Tiers separate what a value is from what it's for.
      Primitives such as `--indigo-700` hold the palette. Semantic tokens such as
      `--color-accent` point at primitives and are what components read. Component tokens such
      as `--button-bg` point at semantic tokens where a component has overridable slots. The
      payoff is that theming, rebranding and dark mode become remapping one tier: the dark
      theme changes semantic values and no component changes. The trade-off is indirection.
      Too many tiers or component tokens for everything make a value hard to trace, so I add
      the component tier only where overrides really happen.
  - question: How would you implement dark mode with CSS custom properties?
    answer: >-
      Components read semantic tokens only, and the dark theme is a selector that gives those
      tokens new values. I'd follow the system with `@media (prefers-color-scheme: dark)` scoped
      to `:root:not([data-theme="light"])`, and let a stored choice set `data-theme` on `html`
      so people can override it. An inline script in the `head` applies the stored choice before
      the first paint, avoiding a flash. `color-scheme: light dark` makes form controls and
      scroll bars match, and `light-dark()` can express both values in one token. Then I test
      every foreground and background pair in both themes for 4.5 to 1, because dark palettes
      need their own lighter accents. The trade-off is maintaining two designs, which is real
      work, not an inversion.
  - question: A nested section with `data-theme="dark"` shows light-theme buttons. Why?
    answer: >-
      Most likely a component token is declared on `:root` as an alias, for example
      `--button-bg: var(--color-accent)`. A custom property containing `var()` is resolved on
      the element where it's declared, so `--button-bg` was computed on `:root` with the light
      accent, and that resolved colour is what the section inherits. The section's new
      `--color-accent` never reaches it. The fix is to declare component tokens on the
      component selector, such as `.button { --button-bg: var(--color-accent) }`, so they
      resolve inside whatever theme is in scope. Alternatively, only ever apply themes to
      `html`. It's a good argument for keeping the root-level token file to primitives and
      semantic tokens.
  - question: How do you name tokens so they survive a redesign?
    answer: >-
      By purpose and position, never by value. `--color-accent` survives a move from indigo to
      teal, while `--blue` becomes wrong. I read names from general to specific, such as
      `--color-ink-muted` or `--button-bg-hover`, pair foregrounds with the surfaces they sit
      on, such as `--color-on-accent`, and use numbered scales for primitives, such as 50 to 900,
      so new steps fit between old ones. Theme names stay out of token names, because the theme
      is the selector. I also keep the set small: every token is a choice someone has to make,
      and fewer, clearer tokens produce more consistent screens. The trade-off is that purpose
      names need a short guide saying which role to use where.
