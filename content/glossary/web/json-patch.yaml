term: JSON Patch
aka: [JSON Merge Patch, merge patch, partial update]
short: A standard format for sending only the changes to a JSON document, rather than the whole thing.
explain: |
  Sending the whole document to change one field wastes bytes and risks overwriting
  someone else's edit. A partial update sends only what changes, usually with `PATCH`.

  There are two standards. JSON Merge Patch is an object of fields to set, with `null`
  meaning "remove". It can't set a field to null or edit one item in an array. JSON Patch is
  a list of operations, such as `add`, `remove`, `replace` and `test`, applied all or
  nothing. A failed `test` aborts the whole change, which makes it safe against edits that
  crossed in the post.
analogy: A list of corrections for a printed page, instead of reprinting the page.
example:
  language: json
  code: |
    [
      { "op": "test", "path": "/version", "value": 7 },
      { "op": "replace", "path": "/title", "value": "Spring menu" },
      { "op": "remove", "path": "/tags/2" }
    ]
usage: Merge patch can't remove the third tag, so accept JSON Patch on that endpoint.
related: [http-method, json, rest, diff]
level: 3
lessons: [backend.long-running-and-bulk]
