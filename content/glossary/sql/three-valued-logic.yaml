term: three-valued logic
aka: [SQL NULL, 'NULL', IS NULL]
short: SQL's rule that a condition can be true, false or unknown, where unknown comes from a missing value.
explain: |
  In SQL, a missing value means "unknown". Is an unknown number bigger than five? Unknown.
  `WHERE` keeps a row only when its condition is true, so rows where it's unknown vanish
  without a word.

  That explains the odd results. `= NULL` matches nothing; write `IS NULL`. A filter like
  `assignee <> 'sam'` skips every unassigned row. And `NOT IN` with a missing value in its
  list returns no rows at all, so prefer `NOT EXISTS`.
analogy: Asking whether a sealed envelope holds more money than yours. The honest answer isn't yes or no; it's "don't know".
example:
  language: sql
  code: |
    -- misses every row where assignee is missing
    SELECT * FROM tasks WHERE assignee <> 'sam';

    SELECT * FROM tasks
    WHERE assignee <> 'sam' OR assignee IS NULL;
usage: The report dropped the unassigned tickets; three-valued logic again, so add an IS NULL branch.
related: [falsy, index]
level: 2
lessons: [db.reading-rows, pro.sql]
