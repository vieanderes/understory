summary: >-
  An online assessment screen turns your code into a number without a person reading it. Hidden
  correctness tests try small and nasty inputs, hidden performance tests try large ones, and
  your score is the share that pass. The example in the statement is not one of them.


  Everything useful follows from that. The constraints and the expected complexity tell you
  which algorithm the performance tests are sized for. Your own edge cases stand in for the
  correctness tests you cannot see. And because code that does not compile scores zero, a
  working brute force is always worth more than a clever idea that is half typed.


  The platform also records how you work: pastes, time away from the tab and, when an
  assistant is enabled, the full transcript. None of that changes the automatic score, but
  an employer may read it. Work the way you would be happy to show.
remember:
  - >-
    The score is the share of hidden tests passed; the example in the statement does not count.
  - >-
    Correctness tests use small inputs and corner cases, performance tests use the largest
    inputs sized to the expected complexity, and a timeout scores zero for that test.
  - >-
    Read N and the expected worst-case complexity before anything else, because together they
    name the algorithm.
  - >-
    A brute force usually passes every correctness test and fails most performance tests, so it
    banks roughly half the points.
  - >-
    Code that does not compile scores zero on every test, so submit something that runs before
    chasing the fast version.
  - >-
    Run shows what your function returned for your own cases, never the expected answer, so you
    must know the right answer before you add a case.
  - >-
    When an assistant is enabled, ask it narrow factual questions; the employer can read every
    prompt.
  - >-
    Open the file with a three-line header, Task, Approach with its Big-O, and Tested, and
    update it before you submit; a person may read it after the machine scores it.
sections:
  - title: From the constraints to the algorithm
    body: |-
      A JavaScript test server does something in the order of 10^8 simple steps a second, give
      or take a factor of ten. Performance tests allow a few seconds at most. So the largest N
      tells you which growth rate can finish:

      - **N up to about 20**: trying every subset, O(2^N), is fine.
      - **N up to about 500**: three nested loops, O(N^3), can pass.
      - **N up to a few thousand**: two nested loops, O(N^2), usually pass.
      - **N of 100,000 to 1,000,000**: you need O(N log N) or O(N).
      - **A value range up to 2^31 with tiny N**: think arithmetic or binary search on the
        answer, O(log M).

      The stated expected complexity narrows it further. "O(N)" on an array task usually means
      one or two passes with a running value, a counting array or a prefix sum. "O(N log N)"
      usually means sort first. "O(N + M)" means a counting array sized by the value range.
      "O(log N)" means binary search.

      The assessment platform's public lessons follow the patterns the real tests reskin:
      iterations, arrays, time complexity, counting elements, prefix sums, sorting, stacks and queues,
      leader, maximum slice, primes and sieves, Euclid's algorithm, Fibonacci, binary search,
      the caterpillar method, greedy choices and dynamic programming. When a statement feels
      new, ask which of those it is wearing.
  - title: 'Worked example: the smallest missing positive, done properly'
    body: |-
      The lesson showed an assistant's version that broke when the array had no gap. Here is
      the version to write in a test.

      The key observation: with N numbers, the answer is at most N + 1. If every number from 1
      to N is present, the answer is N + 1; otherwise one of them is missing. So only values in
      the range 1 to N + 1 matter, and a counting array of that size replaces the `Set` and the
      scan up to `max`.

      ```js
      function solution(A) {
        const seen = new Uint8Array(A.length + 2);
        for (const x of A) {
          if (x >= 1 && x <= A.length + 1) seen[x] = 1;
        }
        for (let n = 1; n <= A.length + 1; n++) {
          if (!seen[n]) return n;
        }
      }

      console.log(solution([1, 3, 6, 4, 1, 2])); // 5
      console.log(solution([1, 2, 3]));          // 4
      console.log(solution([-1, -3]));           // 1
      ```

      It is O(N) time and O(N) space, and it ignores huge values and negatives without a
      branch for each. The earlier version was O(max) in the worst case: a single value of
      1,000,000,000 made it loop a billion times. That is the kind of hidden cost the
      performance tests are built to find, and the kind of edge case (no gap, all negative)
      the correctness tests are built to find.
  - title: Testing at the largest size before you submit
    body: |-
      Run only checks what you give it. So give it the worst case the statement allows, and
      time it. You rarely know the expected answer for a random large input, but you can build
      one whose answer you do know, and you always learn whether it finishes.

      ```js
      function minSplitGap(entries) {
        let total = 0;
        for (const x of entries) total += x;
        let left = 0;
        let best = Infinity;
        for (let i = 0; i < entries.length - 1; i++) {
          left += entries[i];
          best = Math.min(best, Math.abs(2 * left - total));
        }
        return best;
      }

      // The largest input the statement allows, at the worst values.
      const big = Array.from({ length: 100_000 }, (_, i) => (i % 2 ? -1000 : 1000));
      const start = performance.now();
      const answer = minSplitGap(big);
      console.log(answer, `${(performance.now() - start).toFixed(1)} ms`);
      ```

      This one prints `0` and a few milliseconds. An O(N^2) brute force took about
      20 seconds at this size. Delete the timing lines before you submit: the task only
      needs the function.

      Build your own cases from the constraints as a checklist: the smallest N, the largest N,
      all values equal, all negative, the extremes of the value range, sorted and reverse
      sorted, and duplicates. Write the expected answer next to each before you press Run.
  - title: A playbook for one timed task
    body: |-
      For each task, inside the single timer:

      1. **Read the constraints and the complexity line first**, then the story. Write the
         target complexity as a comment at the top of the editor.
      2. **Work the example by hand** until you could explain it. Misreading the task is the
         most expensive mistake there is.
      3. **Write the brute force** if it takes under five minutes, and run it on the example
         and three of your own cases. Submit-ready code now exists.
      4. **Find the fast idea** by asking which pattern the complexity names. Compare it with
         the brute force on your cases.
      5. **Test the fast version** at the largest N and on the corner cases.
      6. **Leave the editor compiling** at every pause. If time runs out, whatever is there is
         submitted.

      What an ideal submission looks like: one function at the target complexity, no debug
      output, no validation of things the constraints rule out, clear names, and a short
      comment on the idea. What the report then shows: every correctness test OK, every
      performance test OK, and a detected complexity that matches the statement.
  - title: Tests when the editor allows no imports
    body: |-
      Some online editors block imports, so `node:assert` and test libraries are out. A
      five-line helper and a table of named cases do the same job, and they print in the
      Run output:

      ```ts
      function check(name: string, actual: unknown, expected: unknown): void {
        const ok = JSON.stringify(actual) === JSON.stringify(expected);
        console.log(`${ok ? 'PASS' : 'FAIL'} ${name}: got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
      }

      const cases: [string, number[], number][] = [
        ['task example', [3, 2, -2, 5, -3], 3],
        ['zero only (K must be > 0)', [0, 0], 0],
        ['duplicates', [2, 2, -2, -2], 2],
        ['negative without positive', [-5, -6], 0],
      ];
      for (const [name, input, expected] of cases) check(name, solution(input), expected);
      ```

      `JSON.stringify` turns both values into text, so two lists with the same contents
      compare equal, which `===` on arrays never does. It is fine for numbers, strings and
      plain arrays; it does not tell `undefined` inside an array from `null`, which rarely
      matters in these tasks.

      Name each row after what it checks, not "test 3". When a line says `FAIL duplicates`,
      you know where to look without reading the input. Work each expected answer out by hand
      before you run it, because Run never tells you the right answer. Leave the table in a
      clearly marked block, or delete it before you submit if the task says to print
      nothing.
  - title: 'The whole process on one task'
    body: |-
      A task candidates report: return the largest K > 0 such that both K and -K are in A,
      or 0. `[3, 2, -2, 5, -3]` gives 3. Reviewers see four things: the chat, the code, the
      tests and the score. Here is a run where all four look strong.

      1. **Understand, 2 to 3 minutes.** Type the header's Task line and the limits.
      2. **Clarify, 1 or 2 prompts.** "Can A contain 0? Should [0, 0] return 0?" and "Can a
         number repeat?" Copy the answers into the header.
      3. **Tests first, 5 minutes.** The examples, zero only, duplicates, several pairs,
         a negative without its positive, a single number. Answers worked out by hand.
      4. **Plan in a comment.** Every pair is O(n^2), too slow for 100,000. A Set of all
         numbers makes each check O(1), so O(n).
      5. **Write it yourself.** Ask the assistant only for syntax, such as building a Set.
      6. **Run the table.** A FAIL names the case to look at.
      7. **Break it, 1 or 2 prompts.** A Tests prompt in the five-part shape. Add good
         suggestions to the table; reject wrong ones with a reason.
      8. **Prove it.** Compare with the brute force on random small inputs, then time the
         largest input.
      9. **Finish, last 5 minutes.** Update the header, remove noisy prints, submit.

      ```ts
      // Task: largest K > 0 such that both K and -K are in A. Return 0 if none.
      // Approach: Set of all numbers, then check each positive x for -x. O(n) time and memory.
      // Tested: examples, no pair, zero only, duplicates, several pairs, 100,000 numbers.
      function solution(A: number[]): number {
        const seen = new Set<number>(A);
        let best = 0;
        for (const x of A) {
          if (x > 0 && seen.has(-x)) best = Math.max(best, x);
        }
        return best;
      }
      ```

      Step 8 compared it with a nested-loop version on 2,000 random arrays and found no
      difference, and 100,000 numbers took under 10 ms. Real tests are harder than the
      public practice lessons, with nastier corners and sometimes two patterns in one
      task, so the process matters more than any remembered answer.
  - title: The public practice lessons, and where this course trains each
    body: |-
      The free practice lessons use the same editor and the same hidden-test scoring as a
      real screen, so they are the closest practice you can get. The most practised ones,
      with the pattern each trains and where this course covers it:

      - **Iterations: BinaryGap.** A loop with a running count. The number tricks lesson's
        notes solve it.
      - **Counting elements: FrogRiverOne, PermCheck, MaxCounters, MissingInteger.** A set
        or a counting array. The counting lesson, and its notes for the frog.
      - **Prefix sums: PassingCars, CountDiv, GenomicRangeQuery, MinAvgTwoSlice.** Running
        totals. The prefix sums lesson and its notes.
      - **Stacks and queues: Brackets, Fish, Nesting, StoneWall.** A stack, often a
        monotonic one. The stacks lesson and its notes.
      - **Maximum slice: MaxProfit, MaxSliceSum, MaxDoubleSliceSum.** Kadane's running best.
        The maximum slice lesson.
      - **Later lessons**: primes and the sieve, Euclid's gcd, Fibonacci, binary search, the
        caterpillar method, greedy and dynamic programming. The number tricks, binary
        search, sliding window, intervals and dynamic programming lessons.

      How much is enough? One candidate report quotes a recruiter: about 70% or more
      counted as a pass, and the bar differs by team. Another candidate failed with every
      correctness test passing, because the runtime wasn't optimal. So aim for full marks
      on correctness and the stated complexity, and treat partial credit as a floor, not a
      target.

      Two habits help while you type. A function that declares a return type shows a red
      line until it returns something, so put a placeholder such as `return 0;` at the end
      first and build the answer above it. And keep the file compiling at every pause,
      because the clock submits whatever is there.

pitfalls:
  - >-
    **Trusting the example.** It passing tells you almost nothing about the score. Write at
    least five cases of your own from the constraints before you consider a task done.
  - >-
    **Adding a Run case without knowing its answer.** Run shows your output, not the expected
    one, so a wrong result can look right. Work the answer out first, or build the input so the
    answer is known.
  - >-
    **Submitting while the editor does not compile.** A half-finished edit when the timer ends
    turns a working solution into zero. Keep the code compiling at every pause, and keep a
    working version in a comment if you are mid-refactor.
  - >-
    **Validating what the constraints rule out.** Guarding against an empty array when N is at
    least 1 adds code and bugs for no points. Trust the stated assumptions.
  - >-
    **Practising only the public lessons.** Real tests reskin the same patterns but are
    harder, with nastier corners. Practise the process, header, tests, plan and cross-check,
    not memorised answers.
  - >-
    **Asking the assistant for the whole solution.** The transcript is readable by the
    employer. Ask narrow factual questions, such as whether a method mutates its array.
interview:
  - question: >-
      Your report shows full correctness but only 40% on performance. What happened, and what
      would you change?
    answer: >-
      The logic is right but the complexity is too high for the largest inputs. Correctness
      tests use small inputs, so an O(N^2) solution passes them, while performance tests use
      inputs sized for O(N) or O(N log N) and time out. I would first look for work repeated
      inside the loop: a sum recomputed for every split, an `includes` or `shift` inside a
      loop, or a nested scan. Usually a running value, a prefix sum, a counting array or a
      sort removes it. Then I would test at the largest allowed N before resubmitting. The
      trade-off is that the fast version is easier to get wrong, so I would keep the brute
      force and compare the two on random small inputs.
  - question: >-
      How do you decide what time complexity to aim for?
    answer: >-
      From the constraints, before I think about the solution. If N can be 100,000 or more, a
      quadratic loop is about ten billion steps and cannot finish, so I aim for O(N log N) or
      better. If N is at most a few thousand, O(N^2) is fine and usually simpler. When the
      statement gives an expected complexity, I treat it as a hint about the pattern: O(N)
      suggests one pass with a running value or counting array, O(N log N) suggests sorting,
      O(log N) suggests binary search. The one caution is constant factors: an O(N) solution
      that allocates a new array per step can still be slow, so I test at the maximum size.
  - question: >-
      Walk me through how you test a solution before submitting it in an online test.
    answer: >-
      I test from the constraints, not from the example. I write cases for the smallest N, the
      largest N, all values equal, all negative, the extreme values, sorted and reverse sorted
      input, and duplicates, and I write the expected answer next to each before running it.
      Then I run the largest input to check the time, building it so that the answer is known.
      If I have a brute force, I compare the two on many small random inputs. The trade-off is
      time: in a 90-minute set I cap this at a few minutes per task, and I prioritise the
      cases the statement's ranges make most likely.
  - question: >-
      The timer has five minutes left and your fast solution has a bug you cannot find. What
      do you do?
    answer: >-
      I submit the version I trust. If the brute force is correct, it keeps every correctness
      point and some performance points, while a buggy fast version can lose both. So I
      restore the brute force, check it compiles, and use any remaining time to test it on
      one or two edge cases. If I had no brute force, I would make sure whatever is in the
      editor compiles, because a compile error scores zero on every test. The trade-off is
      accepting a lower ceiling to protect the floor, which is the right call when the clock,
      not the idea, is the constraint.
terms:
  - term: Assessment score
    say: Pass the examples and you pass.
    means: The share of hidden correctness and performance tests passed. The example in the statement is
      not one of them.
  - term: Expected complexity
    say: A hint you can ignore if the code is correct.
    means: The worst-case complexity the performance tests are sized for. Together with the largest N,
      it names the algorithm.
  - term: Correctness test
    say: The examples in the statement.
    means: Hidden tests on small inputs and corner cases. A brute force usually passes them all, which
      banks roughly half the points.
  - term: Performance test
    say: Bonus points for fast code.
    means: Hidden tests on the largest inputs. A timeout scores zero for that test, however correct the
      output would have been.
  - term: Run
    say: Run checks whether my answer is right.
    means: Run shows what your function returned for your own cases, never the expected answer. You need
      to know the right answer before you add a case.
