deepDive: >-
  **The SDK already retries.** The Anthropic Python SDK retries a `429`, a `5xx` and a
  dropped connection twice by default, with backoff, before it raises. Set `max_retries`
  on the client to change that. Your own decorator is for work the SDK can't see, such as
  a whole pipeline step.


  **Jitter.** When a hundred workers all back off 1, 2, 4 seconds, they retry together
  and hit the limit together. Adding a small random amount to each wait spreads them out.
  If the provider sends a `retry-after` header, wait that long instead.


  **functools.wraps** copies the wrapped function's name and docstring onto the wrapper,
  so logs and error messages still say `summarise`, not `wrapper`. `functools.cache` is
  another decorator worth knowing: it remembers results by their arguments.
