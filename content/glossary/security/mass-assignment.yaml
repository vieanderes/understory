term: mass assignment
aka: [over-posting, autobinding]
short: Copying every field from a request body onto a record, so a user can set fields they shouldn't.
explain: |
  A profile form sends a name and a bio. The handler saves the whole body to the user
  record because it's shorter to write. Then someone adds `"role": "admin"` to the request,
  and the server saves that too.

  The fix is an allow-list. Pick the fields each endpoint may change, by name, and ignore
  or reject the rest. A validation schema that strips unknown keys does this at the edge.
analogy: A bank form where you fill in the box marked "for staff use only", and they process it anyway.
example:
  language: ts
  code: |
    // flawed: the client controls every column
    await db.user.update({ where: { id }, data: body });

    // fixed: name the fields this endpoint may change
    const { name, bio } = profileSchema.parse(body);
    await db.user.update({ where: { id }, data: { name, bio } });
usage: The update endpoint spreads the whole body into the record; that's mass assignment, and anyone can set isAdmin.
related: [privilege-escalation, authorisation, allowlist]
level: 2
lessons: [security.attacker-playbook]
