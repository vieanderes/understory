id: explain.audiences
title: Same idea, different listeners
objective: Tell the same idea to a junior developer, a product manager, a customer and an executive, changing vocabulary, detail and stakes.
level: advanced
minutes: 10
concepts: [explain.audience-fit, explain.stakes-first]
prerequisites: [security.incident-response, explain.explaining-a-decision]
opening:
  text: >-
    You'll tell one story four ways, so each listener gets what they need to act. It's the
    difference between being heard and being forwarded unread.

steps:
  - type: prose
    id: one-bug-four-listeners
    body: >-
      On Saturday, a cinema app had a bug. Change the number in a booking's link, and you saw
      a stranger's booking: name, film and seat. You fixed it the same evening.


      Now four people ask what happened: a junior developer, the product manager, an affected
      customer and the chief executive. Same facts. Four different answers.

  - type: multiple-choice
    id: pick-customer-first-line
    concept: explain.stakes-first
    difficulty: 1
    question: Which first sentence fits the email to an affected customer?
    choices:
      - text: A missing ownership check exposed booking records.
        feedback: >-
          Accurate, but it's the mechanism. The customer wants to know what it means for them.
      - text: We take your privacy extremely seriously.
        feedback: >-
          Every company says this, so readers skip it. It tells them nothing about their booking.
      - text: Someone may have seen your name, film and seat.
        correct: true
        feedback: >-
          Yes. What happened to them, in their words, in the first line.
      - text: On Saturday our team released a new booking page.
        feedback: >-
          A story told in order makes them wait for the point. Lead with what it means for them.

  - type: prose
    id: what-changes
    body: >-
      Three things change with the listener: the **vocabulary**, the detail and the stakes.
      Stakes are what it means for them.


      - Junior developer: how it broke, and how to spot it.

      - Product manager: what changes for users and the plan.

      - Customer: was I affected, and what do I do?

      - Chief executive: how bad, and what do you need?


      Outside engineering, give the **stakes first**. The mechanism waits until they ask.

  - type: parsons
    id: arrange-exec-brief
    concept: explain.stakes-first
    difficulty: 2
    language: text
    prompt: >-
      You have two minutes with the chief executive. Put your brief in order. One line
      doesn't belong.
    blocks:
      - id: impact
        code: Three accounts viewed 212 other people's bookings on Saturday.
        subgoal: The impact
      - id: scope
        code: They saw names, films and seats, but no card details.
        subgoal: The impact
      - id: status
        code: It's fixed, and a test now blocks it coming back.
        subgoal: Where it stands
      - id: ask
        code: I need your approval to email those 212 customers today.
        subgoal: What you need from them
      - id: next
        code: The full review reaches you on Friday.
        subgoal: What happens next
    distractors:
      - id: mechanism
        code: The handler never compared the booking's owner with the session.
        feedback: >-
          True, and useless to them right now. Keep the mechanism for the junior, or for
          when they ask.

  - type: bug-hunt
    id: hunt-pm-message
    concept: explain.audience-fit
    difficulty: 3
    language: yaml
    code: |
      to: product manager
      what: on Saturday, 212 bookings could be seen by other accounts
      fixed: 18:40, and a test now covers the booking page
      for users: nothing changes, the page works as before
      for the plan: fix is in BookingRepo.findById, now behind an owner guard
      ask: can the seat-picker launch move from Tuesday to Thursday?
    prompt: >-
      The product manager replies, "Why Thursday?" Tap the line that should have answered
      that.
    lines: [5]
    reasons:
      - text: It gives code where the plan's impact belongs
        correct: true
        feedback: >-
          Right. Say what the delay buys: four more pages get the same check first.
      - text: The ask is too direct for a manager
        feedback: >-
          A clear ask is what a product manager wants. It's the reason for it that's missing.
      - text: The users line should explain the bug
        feedback: >-
          Users see no change, and that line says so plainly. The plan line is where it went
          wrong.
      - text: It should open with an apology
        feedback: >-
          Between teammates, the facts come first. An apology wouldn't explain Thursday either.
    fix: |
      for the plan: two days to add the same check to four more pages, seat picker included

  - type: parsons
    id: arrange-junior-walkthrough
    concept: explain.audience-fit
    difficulty: 3
    language: text
    prompt: >-
      Now the junior developer asks. For them, the mechanism is the point. Put your
      explanation in order. One line doesn't belong.
    blocks:
      - id: what
        code: Saturday's bug let anyone open someone else's booking.
        subgoal: What went wrong
      - id: request
        code: Change /bookings/1043 to /bookings/1044, and you saw a stranger's.
        subgoal: One real request
      - id: cause
        code: The handler found the booking but never asked whose it was.
        subgoal: The cause
      - id: fix
        code: Now it answers 404 unless the booking is yours.
        subgoal: The fix and its guard
      - id: test
        code: A test signs in as one customer and asks for another's.
        subgoal: The fix and its guard
      - id: spot
        code: 'In review, ask of every lookup by id: whose is this?'
        subgoal: How to spot it next time
    distractors:
      - id: legal
        code: We'll email the 212 customers once the chief executive agrees.
        feedback: >-
          That matters to the executive and the customers. The junior needs the pattern, so
          they catch it next time.

  - type: ai-review
    id: review-customer-email
    concept: explain.audience-fit
    difficulty: 3
    language: yaml
    request: Draft the points for the email to customers whose bookings were seen.
    flawClass: data-exposure
    code: |
      subject: Someone may have seen your cinema booking
      what: on Saturday, for 40 minutes, a bug let some people view other bookings
      you: your booking was one of them; your name, film and seat were visible
      example: a booking like "A. Moreno, 19:30, seat F12" could be opened
      not shown: card details or passwords
      action: none needed, and your booking is still valid
      fixed: the same day, and a test now checks for it on every release
    prompt: >-
      Stakes first, plain words, a calm tone. It was about to go to 212 people. The
      assistant took the example from the logs. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It shows one customer's booking to 212 others
        correct: true
        feedback: >-
          Right. The email would repeat the leak it apologises for.
      - text: It should explain the missing check
        feedback: >-
          Customers need what it means for them, and they have it. The mechanism helps nobody
          here.
      - text: The action line sounds too casual
        feedback: >-
          It answers their biggest question: do I need to act? Saying no plainly is a kindness.
      - text: The subject line will alarm people
        feedback: >-
          It's honest about the stakes. A vague subject gets ignored, and then the email fails.
    fix: |
      you: your booking was one of them; your name, film and seat were visible
      not shown: card details or passwords
    verify:
      question: Which check before sending would have caught this?
      choices:
        - text: Run a spelling and grammar check
          feedback: >-
            A leak can be spelled perfectly. Grammar tools don't know whose data a name is.
        - text: Check every personal detail belongs to the reader
          correct: true
          feedback: >-
            Yes. Any name, seat or number that isn't theirs must go.
        - text: Ask the assistant whether it's accurate
          feedback: >-
            It is accurate, which is the problem. Accuracy isn't the question; whose data it is
            is.
        - text: Send it to one customer first
          feedback: >-
            That still leaks the booking, only to fewer people. Check it before anyone gets it.

  - type: explain-back
    id: brief-in-the-lift
    concept: explain.stakes-first
    difficulty: 4
    audience: non-technical
    kind: risk
    prompt: >-
      The chief executive catches you in the lift: "How bad is Saturday's bug, and could it
      happen again?" You have thirty seconds. Say it out loud first, then type what you said.
    rubric:
      - Impact first, in numbers and plain words, such as 212 bookings, names, films and seats, no card details.
      - Whether it could recur, said honestly, such as fixed and tested here, with other pages being checked.
      - One clear ask or next step, with no code terms.
    modelAnswer: >-
      Three accounts saw 212 other people's bookings on Saturday: names, films and seats, no
      card details. That page is fixed, and a test stops the bug coming back. Four other pages
      could have the same gap, and we'll have checked them all by Wednesday. I need one thing
      from you: approval to email the 212 customers today.

  - type: explain-back
    id: defend-to-product
    concept: explain.audience-fit
    difficulty: 4
    audience: teammate
    kind: decide
    prompt: >-
      The product manager wants the seat picker to launch on Tuesday as planned. You
      recommend Thursday, so four more pages get the same check first. Defend it in their
      terms. Try it out loud before you type.
    rubric:
      - It says what the delay buys users, such as no other page leaking bookings the same way.
      - It names the cost in their terms, such as a two-day slip and moving the launch email.
      - It offers a condition or option, such as keeping Tuesday if the checks finish early.
    modelAnswer: >-
      Saturday's gap could exist on four other pages, and the seat picker is one of them.
      Two days lets us add the same check and test everywhere. If we launch Tuesday, we might
      promote a page that leaks bookings. The cost is a two-day slip, and the launch email
      moves too. If the checks are done by Monday evening, we keep Tuesday.

recap:
  - Change the vocabulary, the detail and the stakes for each listener.
  - Give people outside engineering the stakes first, and the mechanism only if they ask.
  - Reread a message as its real reader before you send it.

recall:
  - id: card-three-changes
    concept: explain.audience-fit
    front: When the listener changes, what three things change in your explanation?
    back: >-
      The vocabulary, the amount of detail, and the stakes: what it means for them and what
      they must do.
  - id: card-customer-stakes
    concept: explain.stakes-first
    front: What does an affected customer need to hear first?
    back: >-
      What happened to them and whether they must do anything. The mechanism waits until they
      ask.
  - id: card-executive-brief
    concept: explain.stakes-first
    front: What goes in a two-minute brief for an executive?
    back: >-
      The impact in numbers, where it stands, and the one decision or thing you need from
      them.
  - id: card-junior-mechanism
    concept: explain.audience-fit
    front: Why does a junior developer get the mechanism when others don't?
    back: >-
      For them it's the lesson: how it broke and how to spot it next time. Others act on the
      stakes.

references:
  - kind: book
    title: 'The Pyramid Principle: Logic in Writing and Thinking'
    authors: Barbara Minto
    year: 1987
    venue: Pitman
    note: Start with the answer, then group the support beneath it, so each reader stops when they have enough.
    primary: true
    verified: false
  - kind: spec
    title: Regulation (EU) 2016/679 (General Data Protection Regulation), Articles 33 and 34
    authors: European Parliament and Council of the European Union
    year: 2016
    venue: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    note: When a personal data breach must be reported to a regulator, and when the people affected must be told.
    primary: true
    verified: false
  - kind: essay
    title: 'Inverted Pyramid: Writing for Comprehension'
    authors: Kate Moran
    year: 2020
    venue: Nielsen Norman Group
    url: https://www.nngroup.com/articles/inverted-pyramid/
    note: Why the conclusion goes first when readers skim and stop early.
    verified: false

deepDive: >-
  A trick for writing to several audiences at once: write the executive version first. If
  you can't say the impact and the ask in three sentences, you don't know them yet. The
  longer versions then grow out of it, each adding the detail its reader needs.


  Military and civil service writing call this **bottom line up front**. Journalists call it
  the inverted pyramid. The reason is the same: most readers stop early, so the part they
  must not miss goes where everyone reads.


  Data leaks add a legal audience. Under the UK and EU GDPR, a personal data breach that
  risks harm to people must be reported to the regulator. That means without undue delay,
  and where feasible within 72 hours of becoming aware of it. When the risk is high, the
  people affected must be told too. Which applies is a
  decision for whoever handles data protection, so bring them in early, with the facts in
  stakes-first order.
