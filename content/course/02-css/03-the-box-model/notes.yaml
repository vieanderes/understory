summary: >-
  To lay out a page, the browser turns every element into a rectangle called a **box**. Each
  box has four layers, from the inside out: the content, the padding (space inside the
  border), the border, and the margin (space outside that pushes neighbours away). This is
  the **box model**, and every size and gap on a page comes from it.


  Two rules cause most of the surprises. First, `width` measures only the content unless you
  change `box-sizing`, so padding and border make a box wider than the number you wrote.
  That's why nearly every site sets `box-sizing: border-box` on everything. Second, vertical
  margins between blocks can **collapse**: two touching margins merge into one instead of
  adding up.


  Once you can do the box arithmetic in your head and spot a collapsing margin, spacing stops
  being trial and error. You'll know before you look how wide a card is and how big each gap
  will be.
remember:
  - Every element is a box of content, padding, border and margin, from the inside out.
  - With the default `content-box`, the drawn width is `width` plus the padding and border on both sides.
  - With `border-box`, `width` covers content, padding and border, and the content shrinks to fit, never below zero.
  - A block with no `width` fills its parent exactly, margins included, while `width` of 100% plus a margin overflows.
  - Touching vertical margins collapse into one, the size of the larger, and horizontal margins never collapse.
  - A parent's margin merges with its first or last child's unless padding, a border or `display` of `flow-root` sits between them.
  - Shorthands with four values go clockwise from the top, as in `margin` of top, right, bottom, left.
  - '`margin: 0 auto` centres a block that has a width narrower than its parent.'
sections:
  - title: Working out a box's size
    body: |-
      Take one card and change only `box-sizing`:

      ```css
      .card {
        width: 300px;
        padding: 16px;
        border: 4px solid black;
      }
      ```

      With the default, `content-box`, the content is 300px wide. The padding adds 16px on
      each side and the border 4px on each side, so the card is drawn
      300 + 16 + 16 + 4 + 4 = **340px** wide.

      With `box-sizing: border-box`, the card is drawn **300px** wide. The content gets what's
      left: 300 − 32 − 8 = 260px.

      `border-box` can't make the content narrower than zero. A `border-box` card with
      `width: 20px` and that same padding and border needs 40px for padding and border alone,
      so it's drawn 40px wide. Height follows exactly the same arithmetic.

      You can check any of this from JavaScript. `getBoundingClientRect()` returns the size of
      the border box, the box up to and including the border:

      ```js
      const card = document.querySelector('.card');
      console.log(card.getBoundingClientRect().width);
      // 340 with content-box, 300 with border-box
      ```

      Often the best width is none at all. A block with no `width` set is `width: auto`, and
      auto means "fill the parent, after margins, border and padding". It always fits:

      ```css
      .list { width: 500px; }
      .list .item { margin: 0 20px; padding: 0 10px; }
      /* each item's border box is 500 - 40 = 460px, and nothing sticks out */
      ```

      Compare `width: 100%` with a 10px side margin. The box is as wide as the parent, then
      pushed 10px to the right, so it sticks out 10px on the other side. `border-box` doesn't
      help there, because margins sit outside every box size. Leave `width` unset unless you
      really need a number.
  - title: Every case of margin collapsing
    body: |-
      Margins collapse only between blocks stacked in the normal flow, and only vertically.
      There are three cases.

      **Neighbours.** The bottom margin of one block and the top margin of the next merge.
      24px and 16px make a 24px gap.

      **A parent and its first or last child.** If nothing separates them, the child's
      margin merges with the parent's and appears outside the parent. Padding, a border, or
      `display: flow-root` on the parent keeps them apart. So does any `overflow` other than
      `visible`. Even `padding-top: 1px` is enough.

      **An empty block.** A block with no content, padding, border or height lets its own top
      and bottom margins touch. They merge, and the result then merges with its neighbours.

      Collapses chain together. Here three margins become one:

      ```html
      <style>
        .card { margin-bottom: 10px; }
        .card p { margin: 0 0 30px; }
        .next { margin-top: 20px; }
      </style>
      <div class="card"><p>Last line of the card</p></div>
      <div class="next">Next card</div>
      <!-- 30px between the paragraph and the next card:
           10, 30 and 20 all merge, and the largest wins -->
      ```

      The paragraph's 30px escapes the card, because the card has no padding or border at its
      bottom. So the card's own bottom edge sits flush with the paragraph.

      For negative margins the rule extends: the largest positive plus the most negative.
      With two negatives, -4px and -8px, the result is -8px, and the boxes overlap by 8px.

      Margins never collapse sideways, and never between items of a flex or grid container,
      which the next lessons introduce. A gap you expect to be 24px can become 40px when a
      list turns into a flex column.
  - title: Shorthand values, from one to four
    body: |-
      `margin`, `padding` and the border widths take one to four values. Four values go
      clockwise from the top, like a clock's hand starting at twelve:

      ```css
      .a { margin: 8px; }                /* all four sides 8px */
      .b { margin: 8px 16px; }           /* top and bottom 8px, left and right 16px */
      .c { margin: 8px 16px 24px; }      /* top 8px, left and right 16px, bottom 24px */
      .d { margin: 8px 16px 24px 32px; } /* top, right, bottom, left */
      ```

      A missing value copies the one opposite it. With two values, the second covers left and
      right. With three, left copies right. You met `margin: 0 0 24px` in the lesson: top 0,
      left and right 0, bottom 24px.

      **`auto` side margins centre a block.** When a block has a `width` narrower than its
      parent, `margin: 0 auto` shares the spare room equally between left and right:

      ```css
      .page { width: 200px; margin: 0 auto; }
      /* in a 1000px window: 400px of margin on each side */
      ```

      It only works sideways, and only when the block has a width to leave room. A block with
      `width: auto` already fills its parent, so there's nothing to share. Top and bottom
      `auto` margins count as zero in normal flow, so this trick can't centre vertically.
      Flexbox, two lessons on, does that.

      Padding can't be negative: `padding: -8px` is dropped as invalid. Margins can, and a
      negative margin pulls a box towards its neighbour.
  - title: Why border-box on everything, and what the browser already does
    body: |-
      With `content-box`, every width sum includes padding and border, and changing the
      padding changes the size. With `border-box`, a 300px card stays 300px whatever padding
      you give it, which is how designers think about size. That's why the lesson's reset,
      `* { box-sizing: border-box; }`, opens so many style sheets.

      It's written with `*`, the selector that matches every element, because `box-sizing`
      doesn't inherit. Setting it on `body` alone changes only the body.

      The browser's own style sheet isn't consistent here. In Chromium, `button` and `select`
      are already `border-box`, but `input` is `content-box`. Give a text field and a button
      the same `width` and padding, and without the reset they come out different widths.

      Two more box facts are worth having:

      - **The background reaches under the border.** It fills content, padding and the area
        beneath the border, never the margin. With a dashed or dotted border, you can see the
        background through the gaps. Margins are always see-through.
      - **Padding is inside the click area, margin isn't.** A link with padding is easier to
        tap, because the padding is part of the link. A margin only moves it.

      That second point is why buttons and menu links get their size from padding, not
      margins or a fixed height. The text can grow and the button grows with it.
pitfalls:
  - '**Adding a margin to a `width: 100%` box.** Margins sit outside every box size, so it sticks out even with `border-box`. Remove the `width` and let `auto` fill the space after the margin.'
  - '**Expecting stacked margins to add up.** A heading with 24px below and a paragraph with 16px above leave 24px, not 40px. Put vertical spacing on one side only, such as `margin-bottom` on everything, so the numbers stay predictable.'
  - '**Using a child''s margin for space inside a parent.** The margin escapes and pushes the whole parent down, as in the lesson''s banner gap. Space inside a box belongs in the parent''s padding.'
  - '**Trying to centre vertically with `margin: auto`.** Top and bottom `auto` margins are zero in normal flow. Use flexbox for vertical centring.'
  - '**Setting `box-sizing` on `body` only.** It doesn''t inherit, so only the body changes. Put it on `*`.'
interview:
  - question: Explain the CSS box model.
    answer: >-
      Every element is laid out as a rectangle with four areas: content, padding, border and
      margin, from the inside out. Padding is space inside the border and takes the
      background. The margin is transparent space outside, pushing neighbours away. The
      important detail is what `width` measures. By default, `box-sizing: content-box`, it
      sizes only the content, so a 300px box with 16px padding and a 4px border is drawn
      340px wide. With `border-box`, `width` includes padding and border, so it's drawn 300px
      and the content shrinks to 260px. Most projects set `border-box` on every element
      because it matches how designs specify size. Margins stay outside either way, which is
      why `width: 100%` plus a margin still overflows.
  - question: What is margin collapsing, and how do you stop it?
    answer: >-
      When two vertical margins touch in normal flow, they merge into one margin the size of
      the larger. It happens between neighbours, between a parent and its first or last child
      when nothing separates them, and through an empty block. A 24px bottom margin above a
      16px top margin leaves 24px. It never happens horizontally, or inside flex and grid
      containers. To stop a child's margin escaping, put padding or a border on the parent,
      or give it `display: flow-root`, which contains its children's margins without
      clipping anything, unlike `overflow: hidden`. Often the better fix is a convention: space elements with one direction of
      margin only, or use `gap` in a flex or grid container, so collapsing never comes up.
  - question: "A card has `width: 100%`, `padding: 20px` and a 2px border inside a 400px container. How wide is it, and how do you make it fit?"
    answer: >-
      With the default `content-box`, it's 444px wide, so it overflows by 44px. The content
      is 400px, 100% of the container, and then 20px of padding and 2px of border are added
      on each side. There are two fixes. `box-sizing: border-box` makes the 100% include
      padding and border, so the card is 400px and the content 356px. Or remove the `width`
      altogether: a block with `width: auto` fills its container after padding, border and
      margin, so it always fits. I prefer the second when the card should fill its
      parent, because it also survives adding a margin later, which `width: 100%` never
      does.
