term: specificity
aka:
  - selector specificity
short: The score a selector earns from its IDs, classes and element names, used to break ties.
explain: |
  Two rules style the same button. The browser prefers the one that points more
  precisely, the way a named instruction beats a general one.

  The score is three counts, compared left to right: IDs, then classes, attributes and
  pseudo-classes, then elements. So one ID beats any number of classes. Chasing it upward
  with longer selectors and `!important` starts an arms race; keeping selectors to a single
  class keeps the scores level and the order predictable.
analogy: 'Two signs at a door, "Everyone wear a hat" and "Sam, take your hat off". Sam follows the second.'
example:
  language: css
  code: |
    button { }              /* 0,0,1 */
    .primary { }            /* 0,1,0 */
    .toolbar .primary { }   /* 0,2,0 */
    #save { }               /* 1,0,0 beats them all */
usage: That ID selector has such high specificity that no utility class can override it.
twin:
  term: cascade
  difference: Specificity is a score for one selector. The cascade is the full set of steps for choosing a value, and specificity is only one of them; origin and layers come first, source order last.
related:
  - cascade
  - cascade-layer
  - pseudo-class
level: 2
lessons:
  - css.cascade
