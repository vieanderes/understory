term: endpoint
aka:
  - route
  - API endpoint
short: One method and address pair on a server that answers a particular kind of request.
explain: |
  A server can answer many different questions. Each one gets its own door: a method
  plus a path, like `GET /orders` or `POST /orders`. Behind each door sits a function.

  Every one of them is reachable by anyone with the address, not only your own front
  end. So each needs its own input validation and its own permission check, even the
  ones you think nobody knows about.
analogy: A counter at the post office. One for parcels, one for passports; same building, different service.
example:
  language: python
  code: |
    @app.post("/orders", status_code=201)
    def create_order(order: NewOrder):
        return save(order)
usage: That endpoint returns every user's orders; it needs an ownership check.
twin:
  term: api
  difference: An endpoint is a single method and path. The API is all of them together, plus the rules and formats they share.
