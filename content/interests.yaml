glossary:
  # ai-agents
  - term: Agent loop
    match: [agent, agents, agentic, coding agent, coding agents]
    explanation: A program in which a model picks a tool, reads the result and decides the next step, repeating until the task is done or a limit stops it.
    topics: [ai-agents]
  - term: Tool use
    match: [tool calling, function calling, tools]
    explanation: The model returns a structured request to call a function you defined. Your code runs it and sends the result back as the next message.
    topics: [ai-agents]
  - term: MCP
    match: [model context protocol]
    explanation: Model Context Protocol, an open standard for connecting a model to tools and data sources through one interface instead of a custom integration each.
    topics: [ai-agents]
  - term: RAG
    match: [retrieval-augmented, retrieval augmented]
    explanation: Retrieval-augmented generation. Relevant text is fetched first and placed in the prompt, so the model answers from sources instead of from memory.
    topics: [ai-agents]
  - term: Evals
    match: [eval, evaluation suite, golden set]
    explanation: A repeatable test set for model behaviour. It turns "the new prompt feels better" into a number that can block a regression.
    topics: [ai-agents, llm-research]
  - term: Prompt injection
    match: [prompt injections, jailbreak]
    explanation: Text inside data the model reads that acts as an instruction. It is the reason tool output must be treated as untrusted input.
    topics: [ai-agents, security]
  - term: Context window
    match: [long context, context length, context engineering]
    explanation: The amount of text a model can read in one request. Everything it should know must fit there, so choosing what goes in is a design task.
    topics: [ai-agents, llm-research]
  - term: Embeddings
    match: [embedding, vector search, pgvector]
    explanation: Numeric vectors that place similar texts near each other, so a search can find passages by meaning instead of by exact words.
    topics: [ai-agents, databases]

  # llm-research
  - term: Post-training
    match: [RLHF, reinforcement learning, preference alignment, fine-tuning]
    explanation: Training after the base model exists, using examples or feedback, to make it follow instructions, reason in steps or refuse unsafe requests.
    topics: [llm-research]
  - term: Benchmark
    match: [benchmarks, leaderboard]
    explanation: A fixed task set used to compare models. Scores mean little once the tasks leak into training data, so check how contamination was handled.
    topics: [llm-research]
  - term: Tokeniser
    match: [tokenizer, tokenisation, tokenization, tokens, BPE]
    explanation: The step that splits text into the units a model reads. It sets cost per request and how well rare words and other languages are handled.
    topics: [llm-research]
  - term: Quantisation
    match: [quantization, quantized, quantised, ternary, 1.58-bit, 4-bit]
    explanation: Storing model weights with fewer bits. Memory and cost fall, and the question is always how much quality falls with them.
    topics: [llm-research, ai-sustainability]
  - term: KV cache
    match: [key-value cache]
    explanation: Saved attention state from earlier tokens, so each new token does not recompute the whole prompt. It dominates memory use for long contexts.
    topics: [llm-research]
  - term: Mixture of experts
    match: [MoE]
    explanation: A model built from many sub-networks of which only a few run per token, giving a large model the running cost of a smaller one.
    topics: [llm-research]

  # react-next
  - term: Server Components
    match: [RSC, server component]
    explanation: React components that render on the server and send their output, not their code, to the browser. Only interactive parts ship JavaScript.
    topics: [react-next]
  - term: Hydration
    match: [hydrate]
    explanation: Attaching event handlers to server-rendered HTML in the browser. Until it finishes the page is visible but not interactive.
    topics: [react-next]
  - term: Server Actions
    match: [server action, server functions]
    explanation: Functions that run on the server and are called from a form or a component, replacing a hand-written API route for mutations.
    topics: [react-next]
  - term: React Compiler
    match: [memoisation, memoization]
    explanation: A build step that adds memoisation automatically, so components skip re-rendering without hand-written useMemo and useCallback.
    topics: [react-next]

  # web-platform
  - term: Baseline
    match: [interop, newly available, widely available]
    explanation: A label from the web standards community that tells you a feature works in all major browsers, and since when.
    topics: [web-platform]
  - term: View transitions
    match: [view transition]
    explanation: A browser API that animates between two DOM states or two pages by snapshotting old and new, with no animation library.
    topics: [web-platform, design-engineering]
  - term: Interaction to Next Paint
    match: [INP, Core Web Vitals]
    explanation: The Core Web Vital for responsiveness. It measures the delay from a tap or key press to the next frame the user sees.
    topics: [web-platform]
  - term: WebAssembly
    match: [Wasm]
    explanation: A compact binary format browsers run at near-native speed, used to bring code written in Rust, C++ or Go to the web.
    topics: [web-platform]
  - term: Accessibility tree
    match: [accessibility, a11y, ARIA, screen reader]
    explanation: The structure assistive technology reads in place of the visual page. Semantic HTML builds it correctly without extra work.
    topics: [web-platform, design-engineering]

  # typescript
  - term: Structural typing
    match: [type system, assignability]
    explanation: TypeScript compares shapes, not names. A value fits a type when it has the required members, wherever it was declared.
    topics: [typescript]
  - term: Type stripping
    match: [erasable syntax, strip types]
    explanation: Running TypeScript by deleting the type annotations instead of compiling. It is fast, and it only works for syntax with no runtime meaning.
    topics: [typescript]
  - term: Runtime validation
    match: [Zod, schema validation]
    explanation: Types vanish at runtime, so data from outside is checked by a schema at the boundary and only then trusted as typed.
    topics: [typescript]

  # databases
  - term: Index
    match: [indexes, B-tree, indexing]
    explanation: A sorted structure that lets the database find rows without scanning the whole table. Each one speeds reads and slows writes.
    topics: [databases]
  - term: Query planner
    match: [query plan, query plans, EXPLAIN]
    explanation: The part of a database that chooses how to execute a query, using table statistics to estimate the cost of each option.
    topics: [databases]
  - term: Isolation level
    match: [isolation levels, MVCC, serializable, serialisable]
    explanation: The rule for what one transaction may see of another that is still running. Weaker levels are faster and allow more anomalies.
    topics: [databases, distributed-systems]
  - term: Migration
    match: [migrations, schema change, expand and contract]
    explanation: A versioned change to a database schema. Safe ones are split into steps so old and new application code both keep working.
    topics: [databases]
  - term: Row-level security
    match: [RLS]
    explanation: Policies inside Postgres that filter which rows a role may read or write, so the rule holds even when application code forgets it.
    topics: [databases, security]

  # distributed-systems
  - term: Consensus
    match: [Raft, Paxos]
    explanation: Getting several machines to agree on one value or one order of events even when some of them fail or messages are lost.
    topics: [distributed-systems]
  - term: Linearizability
    match: [linearizable, linearisable, Jepsen]
    explanation: The strongest single-object consistency model. Every operation appears to happen at one instant between its start and its end.
    topics: [distributed-systems]
  - term: Idempotency
    match: [idempotent, idempotency key]
    explanation: An operation that can be repeated without changing the result. It makes retries safe, which every network call eventually needs.
    topics: [distributed-systems]
  - term: CRDT
    match: [CRDTs, local-first]
    explanation: A data type whose concurrent edits always merge to the same result on every device, without a central server deciding the order.
    topics: [distributed-systems]
  - term: Tail latency
    match: [p99, percentile, percentiles]
    explanation: The slowest few percent of requests. Users meet it often, because one page load makes many requests and waits for the slowest.
    topics: [distributed-systems]
  - term: Post-mortem
    match: [postmortem, incident report, outage, root cause]
    explanation: A written account of an incident covering what happened, why the safeguards did not stop it, and what changes as a result.
    topics: [distributed-systems, engineering-practice]

  # security
  - term: CVE
    match: [vulnerability, vulnerabilities]
    explanation: A public identifier for one specific vulnerability, so advisories, scanners and patches can refer to the same flaw.
    topics: [security]
  - term: Threat model
    match: [threat modelling, threat modeling, attack surface]
    explanation: A list of what you protect, who might attack it and where trust changes hands. It tells you which defences are worth building.
    topics: [security]
  - term: Supply chain attack
    match: [supply chain, malicious package, typosquatting]
    explanation: Compromising a dependency or a build tool so that every project installing it runs the attacker's code with full trust.
    topics: [security, dev-tooling]
  - term: XSS
    match: [cross-site scripting]
    explanation: Injecting script into a page so it runs with the rights of the site. Escaping output by context and a strict CSP stop it.
    topics: [security]
  - term: Passkey
    match: [passkeys, WebAuthn]
    explanation: A login credential built on a key pair held by the device. There is no shared secret to phish or to leak from a server.
    topics: [security]

  # design-engineering
  - term: Design tokens
    match: [design token, design system, design systems]
    explanation: Named values for colour, spacing and type that design tools and code share, so one change updates every screen.
    topics: [design-engineering]
  - term: Easing
    match: [spring, springs, animation curve, motion]
    explanation: The curve that maps time to progress in an animation. It decides whether movement reads as mechanical, natural or sluggish.
    topics: [design-engineering]
  - term: OKLCH
    match: [colour space, color space]
    explanation: A colour space in which equal numeric steps look like equal steps to the eye, which makes accessible palettes easier to build.
    topics: [design-engineering]

  # swift-ios
  - term: Swift concurrency
    match: [actors, actor, async/await, Sendable]
    explanation: The async and await model in Swift, with actors that protect mutable state, checked by the compiler for data races.
    topics: [swift-ios]
  - term: SwiftUI
    match: [SwiftData]
    explanation: The declarative UI framework from Apple. Views are a function of state, the same mental model as React components.
    topics: [swift-ios]
  - term: Swift Package Manager
    match: [SwiftPM, Swift package]
    explanation: The build and dependency tool that ships with Swift. It is how a shared core is packaged for an app and for a server.
    topics: [swift-ios]

  # dev-tooling
  - term: Bundler
    match: [bundling, Vite, Rolldown, esbuild, Turbopack, webpack]
    explanation: The tool that follows imports from an entry file and writes the few optimised files a browser downloads.
    topics: [dev-tooling]
  - term: Continuous integration
    match: [CI, CI/CD, GitHub Actions]
    explanation: Running the build, the checks and the tests on every change, so a broken commit is found in minutes and not at release.
    topics: [dev-tooling]
  - term: Lockfile
    match: [lockfiles, pnpm, npm]
    explanation: The file that records the exact version of every installed dependency, so each machine and each CI run builds the same thing.
    topics: [dev-tooling]

  # ai-sustainability
  - term: Energy per query
    match: [energy use, energy consumption, power consumption, electricity]
    explanation: The electricity one model request consumes. It depends on model size, hardware and batching, and published figures often leave out training.
    topics: [ai-sustainability]
  - term: Carbon intensity
    match: [carbon footprint, emissions, carbon]
    explanation: Grams of CO2 emitted per kilowatt hour. It changes by region and by hour, so where and when a job runs matters.
    topics: [ai-sustainability]
  - term: Water use
    match: [water consumption, cooling]
    explanation: Data centres evaporate water for cooling. The amount depends on the climate and the cooling design more than on the workload.
    topics: [ai-sustainability]

  # engineering-practice
  - term: Technical debt
    match: [tech debt, legacy code]
    explanation: The extra cost of future changes caused by a shortcut taken earlier. Like money debt, it is useful when chosen and paid down on purpose.
    topics: [engineering-practice]
  - term: Refactoring
    match: [refactor]
    explanation: Changing the structure of code without changing its behaviour, in small steps, each covered by tests.
    topics: [engineering-practice]
  - term: Modular monolith
    match: [monolith, microservices]
    explanation: One deployable application with strict internal module boundaries. It keeps the design benefits of services without the network between them.
    topics: [engineering-practice]

