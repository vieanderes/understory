term: prefix sum
aka: [ prefix sums, running total, cumulative sum, range sum query ]
short: A list where each position holds the total of every value up to that point.
explain: |
  "What's the total sales from day 30 to day 90?" Adding sixty numbers is fine once. Asked
  ten thousand times, it's slow.

  Build the running totals once, in O(n). Then the sum of any range is one subtraction. Take the total up to the end, minus the
  total before the start. Every question is O(1).

  Add a hash map of totals seen so far, and it counts how many stretches add up to k.
  That works even with negative numbers. Start the list with a zero to dodge off-by-one errors.
analogy: A car's mileage counter. To know how far one trip went, subtract the reading at the start from the reading at the end.
example:
  language: js
  code: |
    const sales = [3, 5, 2, 8, 6];
    const upTo = [0];                     // upTo[i] = sum of first i days
    for (const s of sales) upTo.push(upTo.at(-1) + s);
    // upTo: [0, 3, 8, 10, 18, 24]

    const rangeSum = (from, to) => upTo[to + 1] - upTo[from];
    rangeSum(1, 3); // 5 + 2 + 8 = 15
usage: Build a prefix sum once, then each of the hundred thousand queries is a single subtraction.
related: [ sliding-window, subarray, hash-map, off-by-one-error ]
level: 2
lessons: [ algo.prefix-sums, interview.mock-a ]
