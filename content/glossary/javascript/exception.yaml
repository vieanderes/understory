term: exception
aka: [throw, try/catch, thrown error, try...catch]
short: An error thrown to stop the current work and jump to the nearest code that handles it.
explain: |
  Sometimes a function can't do what it was asked: the file isn't there, the input is
  nonsense. It can `throw`. The function stops at once, and so does each caller in turn,
  until one wrapped the call in `try`. Its `catch` receives the error.

  `finally` runs on the way out, whatever happened. The trap is the catch that hides
  failure: an empty one, or one that logs and carries on. A `catch` should either handle the
  failure fully or throw it on. Wrap it with `cause` so the original reason travels with it.
analogy: Pulling the emergency cord on a train. Everything stops until someone whose job it is deals with it.
example:
  language: js
  code: |
    try {
      await saveDraft(text);
    } catch (error) {
      throw new Error('Could not save the draft', { cause: error });
    } finally {
      spinner.hide();
    }
usage: That catch swallows the exception and shows "Saved", so a full disk looks like success.
twin:
  term: runtime-error
  difference: A runtime error is a mistake the program hits while running, like reading a property of undefined. An exception is the mechanism that carries any error up to a handler, whether the language threw it or your code did.
related: [runtime-error, stack-trace, call-stack, promise, swallowed-error]
level: 1
lessons: [js.errors, clean.errors]
