id: next
number: 7
title: Next.js
summary: React with pages, URLs and a server. Create an app, turn folders into pages, decide which parts run on the server and which in the browser, load data before the page is sent, and ship pages that are built ahead or made per visit.
why: "React draws a page, but a real site also needs URLs, fast first loads and a safe place for data and secrets. Next.js gives you all three."
youCanBuild: "A Next.js site with several pages, a shared layout, a search box that runs in the browser and data loaded on the server."
concepts:
  - id: next.framework
    title: What a framework adds
    summary: A framework is a ready-made structure that calls your code. Next.js adds pages from folders, rendering on the server and data loading to React.
  - id: next.create-and-run
    title: Creating and running an app
    summary: "`npx create-next-app` makes the project folder, and `npm run dev` serves it at `localhost:3000`, redrawing the page on every save."
  - id: next.server-rendering
    title: Rendering on the server
    summary: The server runs your components and sends finished HTML, so the page shows before any JavaScript arrives. React in the browser then takes over.
    confusableWith: [next.client-rendering]
  - id: next.file-routing
    title: Pages from folders
    summary: Each folder under `app` is a part of the URL, and a `page.tsx` file inside it makes that URL a page. A folder in square brackets matches any value.
  - id: next.layouts
    title: Layouts
    summary: A `layout.tsx` wraps every page below it through `children`, and it stays on screen, with its state, when you move between those pages.
  - id: next.links
    title: Links
    summary: "`<Link>` moves to another page without reloading the whole document, so shared layouts and their state stay put."
  - id: next.loading-and-error
    title: Loading and error files
    summary: "`loading.tsx` shows while a page below it is still loading, and `error.tsx` shows instead of a part of the page that crashed."
  - id: next.server-components
    title: Server Components
    summary: Every component is a Server Component unless marked. It runs only on the server, can read data and secrets, and sends no code to the browser.
    confusableWith: [next.client-components]
  - id: next.client-components
    title: Client Components
    summary: "A file that starts with `'use client'`, and everything it imports, is also sent to the browser, so it can use state, effects and clicks."
    confusableWith: [next.server-components]
  - id: next.serialisable-props
    title: What crosses to the browser
    summary: Props from a Server Component to a Client Component are written down as data, so text, numbers, arrays and plain objects cross and ordinary functions don't.
  - id: next.hydration
    title: Hydration
    summary: React in the browser runs the Client Components again and attaches their event handlers to the server's HTML. Both renders must produce the same output.
  - id: next.server-data
    title: Loading data in a Server Component
    summary: A Server Component can be `async` and `await` its data, so the HTML arrives with the data already in it.
  - id: next.environment-variables
    title: Environment variables and secrets
    summary: "Server code can read every variable in `process.env`. Only names that start with `NEXT_PUBLIC_` are copied into the browser's code, where anyone can read them."
  - id: next.streaming
    title: Streaming
    summary: "The server sends the page straight away with a fallback, and sends each part wrapped in `<Suspense>` or covered by `loading.tsx` when its data is ready."
  - id: next.static-rendering
    title: Static pages
    summary: A page that reads nothing from the visit is built once, by `next build`, and every visitor gets that same HTML until the next build or revalidation.
    confusableWith: [next.dynamic-rendering]
  - id: next.dynamic-rendering
    title: Dynamic pages
    summary: A page that reads something from the visit, such as `searchParams` or cookies, is built by the server for each request.
    confusableWith: [next.static-rendering, next.client-rendering]
  - id: next.client-rendering
    title: Client rendering
    summary: Content that a Client Component loads in an effect is built in the browser after the JavaScript runs, so it's missing from the HTML the server sent.
    confusableWith: [next.dynamic-rendering, next.server-rendering]
  - id: next.metadata
    title: Metadata
    summary: "A page's `metadata` export, or its `generateMetadata` function, sets the tab title, the description and the picture shown when the link is shared."
  - id: next.image-and-font
    title: Images and fonts
    summary: "`next/image` serves each image at the size the screen needs and reserves its space, and `next/font` serves fonts from your own site so text doesn't jump."
  - id: next.mdx
    title: MDX
    summary: MDX is Markdown that can also use your React components, turned into a page when the site is built.
  - id: next.static-export
    title: Static export
    summary: "`output: 'export'` writes every page as HTML, CSS and JavaScript files that any file host can serve, with no server features."
