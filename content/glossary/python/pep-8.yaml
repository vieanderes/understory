term: PEP 8
aka:
  - Python style guide
short: The official style guide for how Python code is laid out and named.
explain: |
  Every team argues about tabs, line length and naming until someone writes the rules
  down. Python wrote them down early.

  It says four spaces per indent and `snake_case` for functions and variables. Classes get `PascalCase`, constants `UPPER_CASE`. Top-level definitions get two blank lines between them. Nobody checks this by eye any more: a formatter and a linter, such as
  `ruff format` and `ruff check`, apply it on save.
analogy: The highway code. Driving on the agreed side matters more than which side it is.
example:
  language: python
  code: |
    MAX_RETRIES = 3

    class OrderReport:
        def total_due(self, line_items):
            return sum(item.price for item in line_items)
usage: Run the formatter; the review is full of PEP 8 nits that a tool should catch.
related:
  - formatter
  - linter
level: 2
lessons:
  - pro.pythonic
