summary: >-
  The third mock is the same format in Python: three tasks, ninety minutes, hidden
  correctness and performance tests, and an expected complexity line for each task.
  Python changes two things. Its constant factor is larger, and slower again in a browser
  sandbox, so an algorithm that is merely a little slow in JavaScript times out. And its
  short syntax hides linear costs: `x in some_list`, `some_list.pop(0)` and `sorted()`
  inside a loop all look cheap and are not.


  In return, Python removes a whole class of traps. Its `int` never overflows, so counts in
  the billions and magnitudes past the 32-bit range need no care. Sets, dictionaries,
  `collections.deque` and `heapq` cover almost every data structure a timed test needs.


  The tasks are a set (distinct absolute values), sorting with two pointers (pairs with a
  sum at most K) and a min-heap sweep (the meeting rooms problem with cleaning time). These
  notes give each one's reasoning, complete solution, a trace of the example and the
  traps, then a Python stress test that checked all three against their slow versions,
  plus an equivalent event-sweep solution for the rooms.
remember:
  - "`x in list` is O(N) and `x in set` is O(1) on average, so a membership check inside a loop decides between O(N) and O(N²)."
  - "`list.pop(0)` shifts every remaining item; use `collections.deque.popleft()` for a queue and `heapq` for the smallest item."
  - Python's `int` is exact at any size, so counts past 2^31 or 2^53 and the magnitude of -2^31 need no special handling.
  - Counting pairs with a sum at most K is sort plus two pointers; when the smallest and largest fit, the smallest fits with everything between, so add `right - left`.
  - The minimum number of rooms is the maximum number of overlapping bookings; sort by start and keep a min-heap of the times rooms become free.
  - Treat cleaning time by extending each booking's end by C, which turns the task into the classic problem.
  - Default recursion stops at about 1,000 frames, so write loops for inputs of 100,000.
sections:
  - title: Task 1, distinct magnitudes
    body: |-
      The statement says O(N), which rules out sorting and nested loops. Two readings share
      a magnitude when their absolute values are equal, so the answer is the size of the
      set of absolute values.

      ```python
      def distinct_magnitudes(A: list[int]) -> int:
          # Adding to a set and looking in it are O(1) on average.
          return len({abs(value) for value in A})
      ```

      For `[-5, -3, -1, 0, 3, 6]` the set is `{5, 3, 1, 0, 6}`, so the answer is 5. It is
      O(N) time on average and O(N) space.

      The slow version keeps a list and checks `if magnitude not in seen` before each
      append. It reads naturally and is correct, but `in` on a list compares against each
      item, so 100,000 different readings cost about five billion comparisons. The code
      differs from the fast version by one bracket shape, which is exactly why this trap
      catches people.

      The traps in the hidden tests: zero, a value together with its negative, a list of
      one element, and -2,147,483,648, whose magnitude 2,147,483,648 is one more than the
      largest 32-bit integer. In Python `abs(-2_147_483_648)` is the right number, with nothing to guard.
      A sorted-array alternative with two pointers from both ends also works in O(1) extra
      space, but only if the input is already sorted, which this statement does not
      promise.
  - title: Task 2, two-item bundles, with sorting and two pointers
    body: |-
      The order of items does not affect the count of pairs, so sort, which the O(N log N)
      line invites. In a sorted list, look at the smallest and largest remaining prices.
      If they fit, the smallest fits with every price between them too, since those are no
      larger than the largest: that is `right - left` pairs at once, and the smallest is
      done. If they do not fit, the largest fits with nothing remaining, since the smallest
      was already too much: drop it.

      ```python
      def count_bundles(A: list[int], K: int) -> int:
          prices = sorted(A)
          left, right = 0, len(prices) - 1
          count = 0
          while left < right:
              if prices[left] + prices[right] <= K:
                  # prices[left] fits with every price from left + 1 to right.
                  count += right - left
                  left += 1
              else:
                  right -= 1
          return count
      ```

      The trace for `A = [4, 1, 7, 3, 2]`, `K = 6`:

      ```text
      sorted: [1, 2, 3, 4, 7]
      left 0 (1), right 4 (7): 8 too much, move right
      left 0 (1), right 3 (4): 5 fits, add 3, count 3
      left 1 (2), right 3 (4): 6 fits, add 2, count 5
      left 2 (3), right 3 (4): 7 too much, move right
      ```

      Each step moves one pointer, so the walk is O(N) and the sort dominates at
      O(N log N). Traps: `left < right` (never `<=`) so an item is not paired with itself;
      a sum equal to K counts; negative prices and a negative K; and 100,000 equal prices
      with a large K give 4,999,950,000 bundles, which Python holds exactly.
  - title: Task 3, rooms with cleaning, two ways
    body: |-
      A room is busy from a booking's start until its end plus C. Extend every end by C,
      and it becomes the classic question: what is the largest number of bookings that
      overlap at once? That number of rooms is always enough, and never too many.

      The heap solution processes bookings in order of start. A min-heap holds, for each
      room in use, the minute it is free again. If the earliest free time is at or before
      the new start, that room is reused; otherwise a new room opens.

      ```python
      import heapq


      def rooms_needed(S: list[int], E: list[int], C: int) -> int:
          free_at: list[int] = []
          for start, end in sorted(zip(S, E)):
              if free_at and free_at[0] <= start:
                  heapq.heapreplace(free_at, end + C)
              else:
                  heapq.heappush(free_at, end + C)
          return len(free_at)
      ```

      The trace for the example, `S = [30, 0, 60, 10]`, `E = [75, 40, 90, 20]`, `C = 10`:

      ```text
      booking 0-40: new room, free times [50]
      booking 10-20: new room, free times [30, 50]
      booking 30-75: reuse, free times [50, 85]
      booking 60-90: reuse, free times [85, 100]
      ```

      `heapreplace` pops the smallest and pushes the new value in one O(log N) step. The
      sweep is an equivalent solution: turn each booking into a start event and a free
      event, sort, and track the running count. On a tie, a free event must come first,
      because a room free at minute 30 can take a booking that starts at 30. Encoding free
      as -1 and start as +1 makes the tuple sort do it.

      ```python
      def rooms_needed_sweep(S: list[int], E: list[int], C: int) -> int:
          events = [(s, 1) for s in S] + [(e + C, -1) for e in E]
          events.sort()
          busy = most = 0
          for _, change in events:
              busy += change
              most = max(most, busy)
          return most
      ```

      Both are O(N log N). Traps: a gap exactly C long is enough (`<=`, not `<`),
      identical bookings each need a room, and the input arrives unsorted.
  - title: A stress test in Python
    body: |-
      The same technique as in the TypeScript mocks: generate small random inputs,
      compare the fast answer with a slow one you trust, and print the first difference.

      ```python
      import random


      def stress_test(name, make, fast, slow, runs=3000):
          for _ in range(runs):
              args = make()
              a, b = fast(*args), slow(*args)
              if a != b:
                  print(f"{name}: differs on {args}: fast {a}, slow {b}")
                  return
          print(f"{name}: {runs} cases agree")


      def count_bundles_slow(A: list[int], K: int) -> int:
          return sum(1 for p in range(len(A)) for q in range(p + 1, len(A)) if A[p] + A[q] <= K)


      def rooms_needed_slow(S: list[int], E: list[int], C: int) -> int:
          return max(sum(1 for j in range(len(S)) if S[j] <= s < E[j] + C) for s in S)


      def bookings():
          n = random.randint(1, 7)
          S = [random.randint(0, 20) for _ in range(n)]
          E = [s + random.randint(1, 8) for s in S]
          return [S, E, random.randint(0, 4)]


      stress_test("count_bundles", lambda: [[random.randint(-6, 6) for _ in range(random.randint(1, 8))], random.randint(-6, 6)], count_bundles, count_bundles_slow)
      stress_test("rooms_needed", bookings, rooms_needed, rooms_needed_slow)
      stress_test("rooms_needed_sweep", bookings, rooms_needed_sweep, rooms_needed_slow)
      ```

      All of them, and the magnitudes task, agreed on 3,000 cases each. The narrow ranges
      are deliberate: prices from -6 to 6 make sums equal to K common, and starts from 0
      to 20 with short bookings make exact touches and identical bookings common. The slow
      rooms version rests on one fact worth knowing: the moment of greatest overlap is
      always the start of some booking, so checking each start is enough.
pitfalls:
  - >-
    **`if x not in seen` on a list.** It scans the list each time, O(N²) overall. Use a set,
    or here, one set comprehension.
  - >-
    **`pop(0)` or `sorted()` inside the loop.** Both are linear or worse per call. Keep free
    times in a `heapq` heap and read `heap[0]`.
  - >-
    **Pairing an item with itself.** `while left <= right` counts a single cheap item as a
    bundle. Use `left < right`.
  - >-
    **Using `<` for the cleaning gap.** A room free at minute 30 can host a booking starting
    at 30. Compare `free_at[0] <= start`.
  - >-
    **Starts before frees in a sweep.** Sorting a start ahead of a free event at the same
    minute counts one room too many. Encode frees so they sort first.
  - >-
    **Recursion on large inputs.** A recursive sort or search on 100,000 items hits the
    default limit of about 1,000 frames. Raising the limit can crash the interpreter; write
    the loop.
  - >-
    **Guarding against overflow that cannot happen.** Casting or capping counts wastes time
    and can introduce bugs. Python's `int` is exact at any size.
interview:
  - question: What are the hidden costs in Python that matter in a timed test?
    answer: >-
      Membership, queue operations and repeated sorting. `x in some_list` scans the list,
      so inside a loop it makes the algorithm quadratic, while a set or dict answers in O(1)
      on average. `some_list.pop(0)` and `insert(0, x)` shift every element, so a queue
      needs `collections.deque`, and "the smallest so far" needs `heapq`. Calling `sorted()`
      inside a loop turns O(N log N) into O(N² log N). Slicing copies, so slicing inside a
      loop is also linear per step. And recursion stops at about a thousand frames by
      default. The upside is that big integers are exact, so overflow is never the bug.
  - question: How do you count pairs with a sum at most K in O(N log N)?
    answer: >-
      Sort, then use two pointers from both ends. If the smallest and largest remaining
      values fit, the smallest fits with every value between them too, because those are
      no larger than the largest, so I add `right - left` pairs and move the left pointer.
      If they do not fit, the largest cannot pair with anything remaining, so I move the
      right pointer. Each step moves one pointer, so after the O(N log N) sort the walk is
      O(N). The alternative is to sort and binary search the partner limit for each item,
      also O(N log N), with a larger constant. Order does not matter for counting pairs,
      which is what makes sorting allowed.
  - question: Why is the maximum overlap the right number of rooms?
    answer: >-
      Because it is both a lower bound and achievable. At the moment when the most bookings
      overlap, each of them needs its own room, so fewer rooms cannot work. And the greedy
      algorithm never uses more: processing bookings by start time, it opens a new room
      only when every room in use is still busy at that start, which means that many
      bookings overlap at that moment. So the heap's size at the end equals the maximum
      overlap. Cleaning time fits in by extending each end by C. The same argument backs
      the event sweep, where the running count's peak is the answer.
  - question: Your recursive solution passes every example but fails the largest hidden test. Why, and what do you do?
    answer: >-
      Most likely a `RecursionError`. CPython's default recursion limit is about a thousand
      frames, and a recursive depth-first search or naive recursive sort on 100,000 items
      goes far deeper. `sys.setrecursionlimit` can raise the limit, but the underlying C
      stack may still overflow and crash the process, which is worse than an error. The fix
      is to rewrite the recursion as a loop with an explicit stack or queue: a list used as
      a stack with `append` and `pop`, or a `deque` for breadth-first order. It is the same
      algorithm with the call stack made visible.
