deepDive: >-
  A union can forbid combinations too. `{ href: string; onClick?: never } | { onClick: () =>
  void; href?: never }` lets a Button be a link or an action, and makes both at once a type
  error. `never` is the type no value has, so a property typed `never` can't be given.


  A `disabled` button leaves the Tab order, so keyboard users can't reach a tooltip that
  explains why. When the reason matters, keep it focusable with `aria-disabled="true"` and
  refuse the click in the handler.


  Data attributes suit variants because CSS can select them and the values stay readable in
  the DOM. Class names work too. Many design systems in React map each variant to a class
  string, which is the next lesson's approach.
