id: episode-batches
title: EpisodeBatches
topic: binary-search
difficulty: medium
type: algorithmic
recommendedMinutes: 35
signature:
  params:
    - { name: K, type: int }
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A studio has a series of N episodes, and episode I runs for A[I] minutes. It will
  publish them in at most K batches. Each batch is a run of consecutive episodes, in
  order, and every episode goes into exactly one batch. A batch may also be left empty.

  The running time of a batch is the sum of its episodes' minutes, and 0 for an empty
  batch. The studio wants the longest batch to be as short as possible.

  Write a function:

  {{signature}}

  that, given an integer K and an array A of N integers, returns the smallest possible
  running time of the longest batch.

  For example, given K = 3 and A = [4, 7, 2, 5, 3, 6], the function should return 11. The
  batches [4, 7], [2, 5, 3] and [6] run for 11, 10 and 6 minutes, and no split does better.

  Given K = 1 and A = [5, 5], the function should return 10.

  Given K = 4 and A = [2, 9, 1], the function should return 9.

  Write an **efficient** algorithm for the following assumptions:

  - N and K are integers within the range [1..100,000];
  - each element of array A is an integer within the range [0..10,000].
examples:
  - { args: [3, [4, 7, 2, 5, 3, 6]], expected: 11 }
  - { args: [1, [5, 5]], expected: 10 }
  - { args: [4, [2, 9, 1]], expected: 9 }
timeLimitMs: 1000
tests:
  - name: extreme_single
    description: one episode
    group: correctness
    cases:
      - { args: [1, [7]], expected: 7 }
      - { args: [5, [0]], expected: 0 }
      - { args: [3, [10000]], expected: 10000 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [2, [1, 2, 3, 4, 5]], expected: 9 }
      - { args: [3, [0, 0, 8, 0, 0, 1, 1]] }
  - name: extreme_zeros
    description: zero-minute episodes
    group: correctness
    cases:
      - generate: { seed: 401, args: [{ kind: value, value: 2 }, { kind: constant, n: 40, value: 0 }] }
  - name: small_random
    description: random, N = 30
    group: correctness
    cases:
      - generate: { seed: 402, args: [{ kind: int, min: 1, max: 10 }, { kind: ints, n: 30, min: 0, max: 50 }] }
      - generate: { seed: 403, args: [{ kind: value, value: 1 }, { kind: ints, n: 20, min: 0, max: 20 }] }
  - name: medium_random
    description: random, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 404, args: [{ kind: value, value: 50 }, { kind: ints, n: 1000, min: 0, max: 100 }] }
  - name: large_random
    description: random, N = 100,000
    group: performance
    cases:
      - generate: { seed: 405, args: [{ kind: value, value: 30 }, { kind: ints, n: 100000, min: 0, max: 10000 }] }
      - generate: { seed: 406, args: [{ kind: value, value: 5000 }, { kind: ints, n: 100000, min: 0, max: 10000 }] }
  - name: extreme_large
    description: one batch, or as many batches as episodes, N = 100,000
    group: performance
    cases:
      - generate: { seed: 407, args: [{ kind: value, value: 1 }, { kind: constant, n: 100000, value: 10000 }] }
      - generate: { seed: 408, args: [{ kind: value, value: 100000 }, { kind: ints, n: 100000, min: 0, max: 10000 }] }
