id: nextserver.server-actions
title: Server Actions
objective: Save a form with a Server Action, and check the caller and every field inside it.
level: essential
minutes: 10
concepts: [nextserver.server-actions, nextserver.action-validation, nextserver.progressive-enhancement]
prerequisites: [backend.authorisation, next.server-and-client-components, react.forms-and-actions]
opening:
  text: >-
    You'll save a form on the server with one function, with no route and no `fetch`. And
    you'll make sure nobody can use it to change what isn't theirs.

steps:
  - type: prose
    id: what-an-action-is
    body: >-
      In React, `<form action={addTask}>` called `addTask` in the browser. Put `'use server'`
      at the top of that function, and it runs on the server instead.


      ```tsx
      async function addTask(formData: FormData) {
        'use server';
        console.log('Added', formData.get('title'));
      }
      ```


      That's a **Server Action**. The browser never gets its code. On submit, Next.js posts
      the fields to the server and runs it there. At the top of a file, `'use server'` makes
      every exported function an action.

  - type: predict-output
    id: predict-where-it-logs
    concept: nextserver.server-actions
    difficulty: 1
    language: tsx
    code: |
      export default function TasksPage() {
        async function addTask(formData: FormData) {
          'use server';
          console.log('Added', formData.get('title'));
        }

        return (
          <form action={addTask}>
            <input name="title" />
            <button>Add</button>
          </form>
        );
      }
    question: You type `Buy milk` and press Add. Where does `Added Buy milk` appear?
    choices:
      - text: In the terminal running `npm run dev`
        correct: true
        feedback: >-
          Right. `'use server'` keeps the function on the server, so it logs there.
      - text: In the browser's console
        feedback: >-
          It sits inside a component, so it looks like browser code. `'use server'` moves it.
      - text: Nowhere, until the form has `onSubmit`
        feedback: >-
          A form submits by itself. `action` is the function that runs when it does.

  - type: parsons
    id: arrange-add-task
    concept: nextserver.server-actions
    difficulty: 2
    language: ts
    prompt: >-
      `getSession()` returns the signed-in user, or `null`. Put the action in order: who's
      asking, then the input, then save.
    blocks:
      - id: directive
        code: "'use server';"
      - id: signature
        code: 'export async function addTask(formData: FormData) {'
      - id: session
        code: const session = await getSession();
        indent: 1
        subgoal: Check who is asking
      - id: signed-in
        code: "if (!session) return { error: 'Sign in first' };"
        indent: 1
      - id: parse
        code: "const result = TaskSchema.safeParse({ title: formData.get('title') });"
        indent: 1
        subgoal: Check the input
      - id: reject
        code: "if (!result.success) return { error: 'Add a title' };"
        indent: 1
      - id: save
        code: await saveTask(session.userId, result.data.title);
        indent: 1
        subgoal: Save it for this user
      - id: close
        code: '}'
    distractors:
      - id: owner-from-form
        code: "const ownerId = formData.get('ownerId');"
        feedback: >-
          The form can say anything. Who owns the task comes from the session.

  - type: prose
    id: a-public-door
    body: >-
      Here's the catch. That POST is a door anyone can knock on. A script can send it without
      your page, your button or the rules on your inputs.


      So a Server Action is a **public endpoint**, like a route handler. Hiding the form
      protects nothing. Inside the action, check who's asking, every field, and that the data
      is theirs.

  - type: bug-hunt
    id: hunt-trusted-hours
    concept: nextserver.action-validation
    difficulty: 3
    language: ts
    code: |
      'use server';

      export async function hireBike(formData: FormData) {
        const session = await getSession();
        if (!session) return { error: 'Sign in first' };
        const hours = Number(formData.get('hours'));
        await saveHire(session.userId, String(formData.get('bikeId')), hours);
      }
    prompt: >-
      The form's input has `min="1"` and `max="8"`. A script posts `-5` hours, and it's saved.
      Tap the line at fault.
    lines: [6]
    reasons:
      - text: It trusts the browser to have checked the range
        correct: true
        feedback: >-
          Right. `min` and `max` only guide the browser. A script never sees them.
      - text: '`Number` should be `parseInt`'
        feedback: >-
          `parseInt('-5')` is still `-5`. Either one converts. Neither checks the range.
      - text: The sign-in check should come later
        feedback: >-
          Checking first is right. Being signed in says nothing about whether `-5` makes sense.
    fix: |
      'use server';

      export async function hireBike(formData: FormData) {
        const session = await getSession();
        if (!session) return { error: 'Sign in first' };
        const hours = Number(formData.get('hours'));
        if (!Number.isInteger(hours) || hours < 1 || hours > 8) {
          return { error: 'Choose 1 to 8 hours' };
        }
        await saveHire(session.userId, String(formData.get('bikeId')), hours);
      }

  - type: ai-review
    id: review-complete-any-task
    concept: nextserver.action-validation
    difficulty: 4
    language: ts
    request: Add a Done button that marks one of my tasks as finished.
    flawClass: security
    code: |
      'use server';

      export async function completeTask(taskId: string) {
        const session = await getSession();
        if (!session) throw new Error('Sign in first');
        const task = tasks.find((t) => t.id === taskId);
        if (task) task.done = true;
      }
    prompt: >-
      An assistant wrote this. Its test signs in, presses Done on the tester's own task, and
      passes. Nobody tried someone else's id. Tap the line at fault.
    lines: [6]
    reasons:
      - text: It never checks the task belongs to the caller
        correct: true
        feedback: >-
          Yes. Any signed-in user can post any id and finish someone else's task.
      - text: The sign-in check should throw a `401`
        feedback: >-
          How it refuses is a detail. Being signed in isn't the same as owning this task.
      - text: '`taskId` should come from `FormData`'
        feedback: >-
          A Client Component can call an action with plain arguments. The flaw is who may use
          this id.
    fix: |
      'use server';

      export async function completeTask(taskId: string) {
        const session = await getSession();
        if (!session) throw new Error('Sign in first');
        const task = tasks.find((t) => t.id === taskId && t.ownerId === session.userId);
        if (task) task.done = true;
      }

  - type: prose
    id: forms-before-javascript
    body: >-
      One nice thing comes free. The server sends the form as plain HTML, with `method="POST"`.
      So it works before the page's JavaScript has loaded, or with scripts turned off.


      We tried it with JavaScript switched off. The browser posted the form itself, and the
      terminal printed `Added Buy milk`. That's **progressive enhancement**: plain HTML first,
      scripts make it smoother.

  - type: multiple-choice
    id: pick-slow-phone
    concept: nextserver.progressive-enhancement
    difficulty: 2
    question: >-
      On a slow train, someone presses Add before the JavaScript arrives. What happens?
    choices:
      - text: The browser posts the form, and the action runs
        correct: true
        feedback: >-
          Right. It's a real HTML form, so the browser can send it alone.
      - text: Nothing, until the JavaScript loads
        feedback: >-
          That's true of a button with only a click handler. A real form needs no script.
      - text: The text is lost when the page reloads
        feedback: >-
          The fields travel with the POST first, so the action receives them.

  - type: code-challenge
    id: write-check-hire
    concept: nextserver.action-validation
    difficulty: 4
    language: ts
    prompt: >-
      The bike-hire action hands its form fields to `checkHire(session, fields)` as a plain
      object, such as `{ bikeId: 'b-12', hours: '3' }`. Write `checkHire`, which runs before
      anything is saved.


      `session` is `{ userId }` or `null`. Check, in this order: no session gives
      `{ ok: false, error: 'Sign in first' }`. A missing or blank `bikeId` gives
      `'Choose a bike'`. `hours` must be text holding a whole number from 1 to 8, or it's
      `'Choose 1 to 8 hours'`.


      Otherwise return `{ ok: true, hire: { userId, bikeId, hours } }`, with `bikeId`
      trimmed, `hours` a number, and `userId` from the session.
    hints:
      - Each check can return straight away. Write them top to bottom in the order given.
      - A form value might be missing, so check its type before you use it.
      - '`Number.isInteger` rejects `2.5` and `NaN`. Start with `if (!session) return ...`.'

  - type: explain-back
    id: explain-public-door
    concept: nextserver.action-validation
    difficulty: 3
    prompt: >-
      Only signed-in people ever see the Done button. Why must `completeTask` still check the
      session and the task's owner?
    rubric:
      - A Server Action is reached by a POST that any script can send, without the page.
      - Hiding the button hides nothing from someone who sends the request directly.
      - The action checks who is asking and puts the owner in the lookup, every time.
    modelAnswer: >-
      The button is only one way to call the action. Behind it is a POST request, and anyone
      can send that from a script with any task id. So the action has to check the session
      itself, and find the task by its id and its owner. Then another person's task is
      not found.

recap:
  - Save a form on the server by marking its action with `'use server'`.
  - Check the session, every field and ownership inside the action, because anyone can call it.
  - Rely on the form working before JavaScript loads.

recall:
  - id: card-what-use-server-does
    concept: nextserver.server-actions
    front: What does `'use server'` at the top of a function do?
    back: >-
      It makes a Server Action. The code stays on the server, and the browser calls it through
      a POST request that Next.js sends for you.
  - id: card-owner-source
    concept: nextserver.action-validation
    front: Where must an action get the id of the person making the change?
    back: >-
      From the session. Anything in the form or the arguments is written by the caller.
  - id: card-action-is-public
    concept: nextserver.action-validation
    front: Why is hiding a form not enough to protect its Server Action?
    back: >-
      The action is reached by a POST that any script can send. Only checks inside the action
      protect it.
  - id: card-before-js
    concept: nextserver.progressive-enhancement
    front: Why does a form with a Server Action work before JavaScript loads?
    back: >-
      The server sends it as a plain HTML form with `method="POST"`, which the browser can
      submit by itself.

