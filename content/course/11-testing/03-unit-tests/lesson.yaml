id: testing.unit-tests
title: Unit tests
objective: Write tests with arrange, act, assert, cover boundaries, and kill mutants.
level: essential
minutes: 10
concepts: [testing.arrange-act-assert, testing.boundary-values, testing.mutation-testing]
prerequisites: [testing.what-to-test]
opening:
  text: >-
    You'll write tests that catch the off-by-one nobody saw. Then you'll find out which of
    your tests would never notice a bug at all, and fix them.

steps:
  - type: predict-output
    id: predict-boundary-missed
    concept: testing.boundary-values
    difficulty: 1
    language: js
    code: |
      // delivery.js: free delivery from 5000 pence
      export function deliveryPence(totalPence) {
        if (totalPence > 5000) return 0;
        return 399;
      }
      // delivery.test.js
      test('a small order pays for delivery', () => {
        expect(deliveryPence(1200)).toBe(399);
      });
      test('a large order gets free delivery', () => {
        expect(deliveryPence(9000)).toBe(0);
      });
    question: The rule says "from 5000". What does the test run report?
    choices:
      - text: Both pass, and the bug ships
        correct: true
        feedback: >-
          Right. `>` should be `>=`, but 1200 and 9000 are both far from 5000.
      - text: The second test fails
        feedback: >-
          9000 is well over 5000, so `>` and `>=` agree there. The bug hides at 5000 itself.
      - text: A syntax error, since `>` and `>=` differ
        feedback: >-
          Both are valid. The wrong one is a logic bug, and only a test at 5000 shows it.

  - type: prose
    id: boundaries
    body: >-
      Bugs cluster at the edges. A limit of 5000 has three interesting inputs: 4999, 5000
      and 5001. Test those and `>` against `>=` can't hide.


      That's testing **boundary values**: at each limit, one below and one above. The middle
      of a range almost never breaks.

  - type: prose
    id: arrange-act-assert-and-names
    body: >-
      A test has three parts. **Arrange** the inputs. **Act**: call the one thing under test.
      **Assert** what came back. One action per test, so a failure points at one thing.


      A test at 5000 would fail on `>` with `expected 399 to be 0`: what came back, then
      what you wanted. The name above it says which rule that was.

  - type: fill-blank
    id: fill-three-parts
    concept: testing.arrange-act-assert
    difficulty: 2
    language: js
    prompt: >-
      Lay out one test in its three parts. The cart holds two mugs at 400 pence. Fill the gaps.
    template: |
      test('two mugs total 800 pence', () => {
        // {{1}}
        const cart = [{ pence: 400, qty: 2 }];
        // {{2}}
        const result = total(cart);
        // {{3}}
        expect(result).toBe(800);
      });
    blanks:
      - key: '1'
        answer: arrange
      - key: '2'
        answer: act
      - key: '3'
        answer: assert
    bank: [arrange, act, assert, setup, run, check]

  - type: ai-review
    id: review-happy-path-suite
    concept: testing.boundary-values
    difficulty: 3
    language: js
    request: 'Write passwordOk for the sign-up form: at least 8 characters. Add tests.'
    flawClass: edge-case
    code: |
      export function passwordOk(password) {
        return password.length > 8;
      }

      test('accepts a long password', () => {
        expect(passwordOk('correct-horse-battery')).toBe(true);
      });

      test('rejects a short password', () => {
        expect(passwordOk('abc')).toBe(false);
      });
    prompt: >-
      An assistant wrote this, and both tests pass. Tap the line that breaks the request.
    lines: [2]
    reasons:
      - text: A password of exactly 8 characters is refused
        correct: true
        feedback: >-
          Yes. The tests stay far from 8, so `>` slips through. Test `'12345678'`.
      - text: An empty password crashes
        feedback: >-
          An empty string has length 0, so it's refused. No crash, and that's right.
      - text: A very long password is refused
        feedback: >-
          The first test proves long ones pass. The trouble is at the limit itself.
    fix: |
      export function passwordOk(password) {
        return password.length >= 8;
      }

      test('accepts exactly 8 characters', () => {
        expect(passwordOk('12345678')).toBe(true);
      });

      test('rejects 7 characters', () => {
        expect(passwordOk('1234567')).toBe(false);
      });

  - type: prose
    id: mutation-testing
    body: >-
      So how do you test your tests? Break the code on purpose. A tool flips one small thing,
      `>=` to `>` or `10` to `11`, and reruns the suite. Each broken copy is a **mutant**.


      A mutant that fails a test is killed. One that passes every test survives. It marks
      behaviour your suite never checks. That's **mutation testing**.

  - type: playground
    id: kill-the-mutants
    concept: testing.mutation-testing
    difficulty: 3
    prompt: >-
      Baskets of 10 or more items get a bulk discount. Run the tests against three mutants.
      Then add one test to `tests` that kills every survivor, while the real code still passes.
    html: |
      <ul id="report"></ul>
      <p id="score"></p>
    js: |
      // each test: [items in the basket, discount expected]
      const tests = [[3, false], [25, true]];
      const real = (items) => items >= 10;
      const mutants = [(items) => items > 10, (items) => items >= 11, (items) => true];
      const names = [">= became >", "10 became 11", "always true"];
      const passes = (version) => tests.every((test) => version(test[0]) === test[1]);
      let killed = 0;
      mutants.forEach((mutant, i) => {
        if (!passes(mutant)) killed = killed + 1;
        const line = document.createElement("li");
        line.textContent = names[i] + ": " + (passes(mutant) ? "survived" : "killed");
        document.querySelector("#report").append(line);
      });
      const verdict = passes(real) ? "Real code passes. " : "Real code fails. ";
      document.querySelector("#score").textContent = verdict + killed + " of 3 mutants killed";
    editable: [js]
    checks:
      - label: The real code passes every test
        selector: '#score'
        text: Real code passes
      - label: All three mutants are killed
        selector: '#score'
        text: 3 of 3 mutants killed
    solution:
      js: |
        // each test: [items in the basket, discount expected]
        const tests = [[3, false], [25, true], [10, true]];
        const real = (items) => items >= 10;
        const mutants = [(items) => items > 10, (items) => items >= 11, (items) => true];
        const names = [">= became >", "10 became 11", "always true"];
        const passes = (version) => tests.every((test) => version(test[0]) === test[1]);
        let killed = 0;
        mutants.forEach((mutant, i) => {
          if (!passes(mutant)) killed = killed + 1;
          const line = document.createElement("li");
          line.textContent = names[i] + ": " + (passes(mutant) ? "survived" : "killed");
          document.querySelector("#report").append(line);
        });
        const verdict = passes(real) ? "Real code passes. " : "Real code fails. ";
        document.querySelector("#score").textContent = verdict + killed + " of 3 mutants killed";
    hints:
      - Both survivors only differ from the real code at one basket size.
      - Test the limit itself, a basket of exactly 10.
      - 'Add `[10, true]` to the `tests` list.'

  - type: ai-review
    id: review-always-passes
    concept: testing.arrange-act-assert
    difficulty: 4
    language: js
    request: Add a test for applyVoucher so the module has coverage.
    flawClass: edge-case
    code: |
      test('applyVoucher works', () => {
        const cart = { total: 1000 };
        const result = applyVoucher(cart, 'SAVE10');
        expect(result).toBeTruthy();
      });
    prompt: >-
      An assistant wrote this, and it passes. Then a release doubles every voucher's total.
      Tap the line at fault.
    lines: [4]
    reasons:
      - text: Any returned object is truthy, so it can't fail
        correct: true
        feedback: >-
          Yes. Every object is truthy, as in chapter 3. Assert the total: `toBe(900)`.
      - text: The name should include the voucher code
        feedback: >-
          A better name helps when it fails. This one can't fail, whatever it's called.
      - text: The cart should be arranged inside the call
        feedback: >-
          Arranging first is right. The problem is the assertion that accepts any result.
    fix: |
      test('SAVE10 takes ten percent off the total', () => {
        const cart = { total: 1000 };
        const result = applyVoucher(cart, 'SAVE10');
        expect(result.total).toBe(900);
      });
    verify:
      question: Which check shows the fixed test would catch the doubled total?
      choices:
        - text: Make `applyVoucher` double the total and see it fail
          correct: true
          feedback: Yes. That's the release bug, and `toBe(900)` turns red.
        - text: Check the line coverage of `applyVoucher`
          feedback: The truthy test had full coverage too. Coverage can't tell a real assertion from none.
        - text: Run it with a second voucher code
          feedback: Another code tests another rule. It doesn't show this assertion notices a wrong total.

  - type: code-challenge
    id: write-ticket-tests
    concept: testing.mutation-testing
    difficulty: 4
    language: ts
    editable: '7-13'
    prompt: >-
      Cinema tickets: under 5 is free, 5 to 17 pays 600, and 18 or over pays 1200.
      `ticketPence` is done. Fill in its two tests.


      We'll run them against four mutants, each with one limit moved by a year. Every mutant
      must fail a test, and the real prices must pass.
    hints:
      - Each limit has an age one below it and an age right on it.
      - Test 4 and 5 in the first test. Which two ages go in the second?
      - 'Start with `expect(ticketPence(4)).toBe(0);`'

  - type: explain-back
    id: explain-coverage-vs-mutants
    concept: testing.mutation-testing
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A module has 100% line coverage, yet a mutation run reports a third of the mutants
      surviving. How can both be true?
    rubric:
      - Coverage counts lines that ran, and a test can run a line without asserting on its result.
      - A mutant survives when no assertion depends on the changed behaviour.
      - The survivors show the gaps to fill, with a test at the boundary or on the exact value.
    modelAnswer: >-
      Coverage only asks whether a line ran. A test that calls a function and checks nothing
      runs every line. Mutation testing asks a harder question: if this line changed, would a
      test fail? Where no assertion depends on the answer, the mutant lives. So full coverage
      and a third surviving means the tests visit the code but don't pin down what it does.
      Each survivor names a value worth asserting on.

recap:
  - Structure a test as arrange, act, assert, with one action per test.
  - Test at each limit, one below it and one above it.
  - Check a suite with mutants, and add the test each survivor lacks.

recall:
  - id: card-three-parts
    concept: testing.arrange-act-assert
    front: What are the three parts of a unit test, in order?
    back: >-
      Arrange the inputs, act by calling the thing under test once, assert on what came back.
  - id: card-boundary-inputs
    concept: testing.boundary-values
    front: A rule applies from 5000 pence. Which three inputs test it?
    back: >-
      4999, 5000 and 5001. The exact limit is where `>` and `>=` differ.
  - id: card-surviving-mutant
    concept: testing.mutation-testing
    front: What does a surviving mutant mean?
    back: >-
      The code was changed and no test failed. Some behaviour has no assertion on it.

references:
  - kind: paper
    title: 'Hints on Test Data Selection: Help for the Practicing Programmer'
    authors: R. A. DeMillo, R. J. Lipton and F. G. Sayward
    year: 1978
    venue: Computer, 11(4)
    url: https://doi.org/10.1109/C-M.1978.218136
    note: The paper that introduced mutation testing.
    primary: true
    verified: true
  - kind: docs
    title: expect
    authors: VoidZero Inc. and Vitest contributors
    venue: Vitest documentation
    url: https://vitest.dev/api/expect.html
    note: Every matcher, including why `toBeTruthy` accepts any object.
    verified: true
  - kind: book
    title: 'Test Driven Development: By Example'
    authors: Kent Beck
    year: 2003
    venue: Addison-Wesley
    note: The arrange, act, assert shape and the case for small, named tests.
    verified: true

deepDive: >-
  Three boundary values per limit is the minimum. A range from 18 to 65 has two limits, so
  six values. Add the empty and the absurd: zero, a negative, the largest number your type
  holds.


  Tools such as Stryker automate mutation testing for JavaScript. They generate hundreds of
  mutants and report a mutation score. It's slow, so teams run it on a schedule rather than
  on every commit.


  Your challenge graded your tests the way a mutation tool does: the real function, then
  four copies with one limit moved. A suite that kills every mutant pins each limit down.
  A test that can't fail is worse than none: it reports safety that isn't there.
