term: draft pull request
aka:
  - draft PR
  - work-in-progress PR
  - WIP PR
short: A pull request marked not ready, opened early to share work and run checks before review.
explain: |
  Waiting until a big change is finished before anyone sees it means hearing "wrong approach"
  after a week of work.

  Open the pull request early and mark it as a draft. CI runs, colleagues can look at the
  direction, and nobody is asked to review line by line yet. When it's ready, mark it ready
  and reviewers are notified.

  Say in the description what feedback you want now. "Is this the right place for the cache?"
  gets an answer; a silent draft gets ignored.
analogy: Showing a friend your sketch before you paint the whole wall.
usage: Open a draft pull request today so we can check the approach before you write the tests.
related:
  - pull-request
  - code-review
  - continuous-integration
level: 2
lessons:
