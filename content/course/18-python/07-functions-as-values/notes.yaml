summary: >-
  In Python a function is an object like any other. You can store it in a variable, put it
  in a dict, pass it to another function and return it from one. JavaScript works the same
  way, so the idea will feel familiar. What changes is the style: Python leans on a few
  built-ins that take a function, above all `sorted`, `max` and `min` with `key=`, instead
  of chains of callbacks.


  A key function answers one question: "what should I compare for this item?". Python calls
  it once per item and compares the results, so ranking search results, picking the best
  reply or finding the cheapest option is one line. Tuples compare item by item, so a key
  that returns a tuple sorts by several rules at once. The sort is stable, which makes it
  safe to sort in several passes.


  A `lambda` is a one-expression function for these one-off keys. Anything with a
  statement, a branch that needs explaining or a name worth reading in a traceback deserves
  a `def`. Two scoping rules finish the picture: closures see variables, not the values
  they had, and the names of built-ins such as `list` or `max` can be hidden by your own.
remember:
  - Pass a function by name without brackets, `key=len`, and the receiver calls it; `key=len()` calls it once, too early.
  - '`sorted`, `max` and `min` call the key once per item and return the items themselves, never the key values.'
  - Python's sort is stable and O(n log n), so equal keys keep their input order, even with `reverse=True`.
  - A key that returns a tuple sorts by several rules, and negating a number flips one rule's direction.
  - '`sorted` returns a new list and leaves the input alone, while `list.sort()` sorts in place and returns `None`.'
  - A closure captures variables, not values, so lambdas made in a loop all see the loop variable's last value unless you bind it with a default or `functools.partial`.
  - A lambda holds one expression with no statements; give anything longer, or anything you'd name, a `def`.
  - Assigning to a built-in name such as `list` shadows it for the rest of the scope, so pick names that describe the data.
sections:
  - title: Functions are objects, and closures keep their variables
    body: |-
      `def` creates a function object and binds it to a name. The object carries data such
      as `__name__`, and you can pass it around, store it in a dict or return it. A dict of
      functions is a common Python replacement for a long `if`/`elif` chain:

      ```python
      def refund(ticket):
          return f"refund {ticket}"


      def escalate(ticket):
          return f"escalate {ticket}"


      handlers = {"refund": refund, "bug": escalate}
      action = handlers.get("bug", escalate)
      print(action("T-7"))    # escalate T-7
      print(action.__name__)  # escalate
      ```

      A function defined inside another function can use the outer function's variables,
      even after the outer function has returned. That's a **closure**, the same idea as in
      JavaScript. To assign to such a variable, not only read it, declare it `nonlocal`:

      ```python
      def make_counter():
          total = 0

          def bump(step=1):
              nonlocal total
              total += step
              return total

          return bump


      clicks = make_counter()
      clicks()
      clicks()
      print(clicks())                             # 3
      print(clicks.__closure__[0].cell_contents)  # 3
      ```

      Underneath, `total` lives in a **cell**, a small box shared by `make_counter` and
      `bump`. The closure holds the cell, not a snapshot of the number. That's why the next
      section's surprise happens. Without `nonlocal`, `total += step` would make `total`
      local to `bump` and raise `UnboundLocalError`, the rule from the functions lesson.
  - title: Late binding, the loop-and-lambda trap
    body: |-
      Because a closure looks a variable up when it runs, not when it's created, functions
      made in a loop share the loop's single variable:

      ```python
      from functools import partial

      callbacks = [lambda: i for i in range(3)]
      print([c() for c in callbacks])  # [2, 2, 2]

      bound = [lambda i=i: i for i in range(3)]
      print([c() for c in bound])      # [0, 1, 2]


      def show(i):
          return i


      frozen = [partial(show, i) for i in range(3)]
      print([c() for c in frozen])     # [0, 1, 2]
      ```

      All three lambdas read `i` after the loop has finished, when it's `2`. The first fix
      works because a default value is evaluated when the lambda is created, which is the
      "defaults are built once" rule turned to your advantage. The second uses
      `functools.partial`, which stores the argument values right away.

      JavaScript had the same bug with `var`. ES2015 fixed it for `for (let i = 0; ...)`,
      which creates a fresh binding on every iteration, so JS closures in such a loop see
      0, 1 and 2. Python has no per-iteration binding. It behaves like JS `var`. This shows
      up in real code when you register one callback per button, per route or per tool
      definition in a loop, and every callback ends up handling the last one.
  - title: How sorting with a key works
    body: |-
      Python's sort is **Timsort**, an adaptive merge sort. It's O(n log n) in the worst case,
      close to O(n) on data that's already mostly sorted, and **stable**: items with equal
      keys keep their original order. `reverse=True` keeps that stability too, which is why
      the lesson's tied passages came back as `x` then `z`.

      With `key=`, Python calls the key once per item, stores the results, and compares only
      those. A JavaScript comparator, by contrast, is called on pairs, O(n log n) times.

      ```python
      calls = 0


      def length(word):
          global calls
          calls += 1
          return len(word)


      sorted(["kiwi", "fig", "banana", "apple"], key=length)
      print(calls)  # 4

      tickets = [
          {"id": 1, "priority": 2, "title": "Login fails"},
          {"id": 2, "priority": 1, "title": "Typo on page"},
          {"id": 3, "priority": 2, "title": "Checkout slow"},
      ]
      urgent_first = sorted(tickets, key=lambda t: (-t["priority"], t["title"]))
      print([t["id"] for t in urgent_first])  # [3, 1, 2]

      by_title_desc = sorted(tickets, key=lambda t: t["title"], reverse=True)
      two_pass = sorted(by_title_desc, key=lambda t: t["priority"])
      print([t["id"] for t in two_pass])      # [2, 1, 3]
      ```

      The tuple key compares priority first and the title only on a tie. Negation flips a
      number, but `-"text"` is a `TypeError`. For a descending string rule, sort in two
      stable passes: the minor rule first, the major rule last.

      Three JavaScript differences catch people. JS `array.sort()` sorts in place and
      returns the same array; Python's `list.sort()` returns `None`, and `sorted` is the
      copying version, like JS `toSorted`. JS without a comparator compares as strings, so
      `[10, 9, 1].sort()` gives `[1, 10, 9]`; Python compares numbers as numbers. And
      Python refuses to compare unrelated types: sorting `[1, "a"]` raises `TypeError`
      instead of guessing.
  - title: Beyond lambda, itemgetter, partial and top k
    body: |-
      A lambda is an expression that produces a function. It can hold one expression only:
      no assignments, no `return`, no `try`, no loops. In a traceback it's called
      `<lambda>`, which tells you nothing. PEP 8 says not to assign a lambda to a name; if
      it deserves a name, write a `def`.

      The standard library has ready-made key functions. `operator.itemgetter("score")`
      reads a key or index, `attrgetter("price")` reads an attribute, and both accept
      several names and return a tuple. `functools.partial` fixes some arguments of a
      function now and returns a new callable:

      ```python
      import heapq
      from functools import partial
      from operator import itemgetter

      passages = [
          {"id": "a", "score": 0.4},
          {"id": "b", "score": 0.9},
          {"id": "c", "score": 0.7},
      ]
      by_score = itemgetter("score")
      print([p["id"] for p in sorted(passages, key=by_score, reverse=True)])  # ['b', 'c', 'a']
      print([p["id"] for p in heapq.nlargest(2, passages, key=by_score)])    # ['b', 'c']


      def book(room, nights=1, breakfast=False):
          return f"{room}: {nights}, {breakfast}"


      suite_with_breakfast = partial(book, "Suite", breakfast=True)
      print(suite_with_breakfast(nights=3))  # Suite: 3, True
      ```

      `heapq.nlargest(k, items, key=...)` keeps a heap of size k while it walks the data, so
      it costs O(n log k) time and O(k) memory. The documentation defines it as equivalent to
      `sorted(items, key=key, reverse=True)[:k]`, ties included. For a retrieval step that
      scores a million passages and keeps ten, that's the right tool. When k is close to n,
      a full `sorted` is faster, and for `k == 1` use `max`.
pitfalls:
  - '**Calling the key instead of passing it.** `key=len()` runs `len` once with no argument and fails. Pass the function object, `key=len`, and let the receiver call it.'
  - '**Writing `results = results.sort()`.** `list.sort` sorts in place and returns `None`, so the list is lost. Call `results.sort()` on its own line, or use `results = sorted(results)`.'
  - '**Expecting `max` to return the score.** With a key, `max` returns the winning item, and with `max(d, key=d.get)` that item is a key. Read the value afterwards with `d[winner]`.'
  - '**Calling `max` or `min` on something that may be empty.** It raises `ValueError: max() iterable argument is empty`. Pass `default=None` and handle the empty case.'
  - '**Making callbacks in a loop with a lambda.** Every callback sees the final value of the loop variable. Bind it with `lambda i=i: ...` or `partial(func, i)`.'
  - '**Negating a string to sort it descending.** `-t["title"]` raises `TypeError`. Use `reverse=True`, or two stable passes when the directions are mixed.'
  - '**Naming a variable `list`, `dict`, `max`, `sum`, `id` or `input`.** The built-in is hidden for the rest of the scope and fails later with "object is not callable". Rename it; ruff''s `A` rules catch this.'
interview:
  - question: 'What does `[f() for f in [lambda: i for i in range(3)]]` return, and why?'
    answer: >-
      `[2, 2, 2]`, because closures bind late. Each lambda captures the variable `i`, not
      its value at creation time, and looks it up only when called. By then the
      comprehension has finished and `i` is 2. The fix is to bind the value at creation:
      `lambda i=i: i` works because defaults are evaluated when the function is defined, and
      `functools.partial(func, i)` stores the argument immediately. It's the same bug
      JavaScript had with `var` in a loop, which `let` fixed by creating a new binding per
      iteration. Python has no per-iteration binding, so I watch for it whenever I register
      callbacks, routes or tool handlers in a loop.
  - question: What's the difference between `sorted` and `list.sort`, and is Python's sort stable?
    answer: >-
      `sorted` takes any iterable and returns a new list, while `list.sort` reorders the
      list in place and returns `None`. Both use Timsort: O(n log n) worst case, near O(n)
      on nearly sorted data, and stable, so equal keys keep their input order even with
      `reverse=True`. Stability is what makes multi-pass sorting correct: sort by the minor
      rule first, then the major one. I use `sorted` by default, because mutating a list
      the caller passed in is a surprise. I use `sort` when I own the list and it's large,
      to avoid the copy. In JavaScript terms, `sort` is `Array.prototype.sort` and `sorted`
      is `toSorted`.
  - question: How would you sort support tickets by priority, highest first, then by creation time, oldest first?
    answer: >-
      With a tuple key and a negated number: `sorted(tickets, key=lambda t: (-t.priority,
      t.created_at))`. Tuples compare element by element, so priority decides and the time
      only breaks ties. Negating the priority flips its direction while the time stays
      ascending. That trick only works for numbers. If the descending field were a string,
      I'd use two stable passes: sort by created time, then sort by the text field with
      `reverse=True`, relying on stability to keep the time order within ties. For
      readability in shared code I might use `operator.attrgetter` for single fields, and a
      named function when the rule needs explaining.
  - question: You score a million passages and need the ten best. How do you pick them?
    answer: >-
      `heapq.nlargest(10, passages, key=itemgetter("score"))`, which is O(n log k) time and
      O(k) memory. It walks the data once and keeps a small heap of the best k so far,
      instead of sorting the whole million at O(n log n) and holding the sorted copy.
      Its documented result matches `sorted(..., reverse=True)[:k]`, ties included, so
      behaviour doesn't change. If k were close to n, a plain `sorted` would be faster, and
      for the single best item `max` is O(n). At real scale, with embeddings in numpy, I'd
      use `numpy.argpartition` to select the top k in linear time and then sort only those.
