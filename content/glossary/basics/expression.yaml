term: expression
short: A piece of code that works out to a value, like `price * 2` or `age > 18`.
explain: |
  Anywhere you can write a value, you can write a sum that produces one. `3`,
  `price * quantity` and `name + "!"` each work out to one value. The computer works it out
  and uses the result.

  A quick test: could it sit on the right of `=`? Then it's an expression. Function calls
  count too, because a call produces whatever the function returns.
analogy: A question on a maths worksheet. Every one has an answer you could write in the box.
example:
  language: js
  code: |
    price * quantity + delivery // an expression
    age >= 18                   // an expression: true or false
    const total = price * 2;    // a statement holding one
usage: Inside the curly brackets of a template literal you can put any expression, so do the sum right there.
twin:
  term: statement
  difference: An expression produces a value. A statement does something, like making a variable or running an `if`, and can't sit on the right of `=`.
related: [statement, operator, return-value]
level: 2
lessons: [basics.operators]
