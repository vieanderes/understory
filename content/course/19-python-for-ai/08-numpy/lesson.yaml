deepDive: >-
  **Measured** with NumPy 2.2.5 on CPython 3.13, the version the code challenges here run
  in your browser: a `for` loop summing five million floats took 1.2 s, and
  `scores.mean()` took 2.2 ms. The first run downloads NumPy, about 3 MB. Every sample
  runs as printed with `uv add numpy`.


  **Silent shape bugs.** For a square array, `axis=0` and `axis=1` both give the right
  shape, so a wrong axis gives wrong numbers and no error. Check shapes with
  `assert x.shape == (...)` where arrays enter your code.


  **Why chapter 20 cares.** A language model can turn a sentence into a list of a few
  hundred numbers, called an embedding. Thousands of them make a two-dimensional array,
  and comparing a question with every one of them is one vectorised operation.
