id: interview.debounce-throttle
title: Debounce and throttle
objective: Write debounce and throttle that are right at the edges, and test them in an instant with an injected clock.
level: essential
minutes: 10
concepts: [interview.timing-utilities, interview.injected-clock]
prerequisites: [interview.utilities, js.closures, js.event-loop]
opening:
  text: >-
    You'll write debounce and throttle the way a live round asks for them, cancel and flush
    included. Your tests will run in a millisecond, because you'll control the clock.

steps:
  - type: prose
    id: what-you-need
    body: >-
      Two tools from JavaScript. A **closure** is a function that keeps the variables from
      where it was made. So a returned function can remember a timer between calls.


      `setTimeout(fn, ms)` runs `fn` later and returns an id. `clearTimeout(id)` cancels it.


      The round is short: write it, name the edge cases, test it. Interviewers then extend it
      with cancel, flush, or a trailing call.

  - type: prose
    id: debounce-vs-throttle
    body: >-
      Both limit how often a function runs while events pour in.


      **Debounce** waits for a pause, then runs once with the latest arguments. A search box:
      you type `c`, `ca`, `cat`, stop, and one search for `cat` goes out.


      **Throttle** runs at most once per interval while events keep coming. A scroll
      handler: it runs at once, then again each interval, never on every pixel.

  - type: multiple-choice
    id: pick-debounce-or-throttle
    concept: interview.timing-utilities
    difficulty: 1
    question: A draft should autosave once the writer stops typing for a second. Which one?
    choices:
      - text: Debounce
        correct: true
        feedback: >-
          Yes. It waits for the pause, then saves the latest text once.
      - text: Throttle
        feedback: >-
          Throttle saves every second while they type. The brief asks for a save after they stop.
      - text: Neither, save on every key
        feedback: >-
          That's a request per keystroke. Either limiter would cut it, and the pause says debounce.

  - type: prose
    id: inject-the-clock
    body: |-
      Timing code is slow to test with real timers. So pass the timers in: `timers.set(fn,
      ms)` returns an id and `timers.clear(id)` cancels. In the app you pass wrappers round
      `setTimeout`. In a test you pass a **fake**, a stand-in that only moves time when told:

      ```ts
      const due = new Map<number, { at: number; fn: () => void }>();
      let now = 0;
      let nextId = 1;
      const timers = {
        set: (fn: () => void, ms: number) => { due.set(nextId, { at: now + ms, fn }); return nextId++; },
        clear: (id?: number) => { if (id !== undefined) due.delete(id); },
      };
      // advance(ms) runs every due timer in time order, then moves now on.
      ```

      Passing a dependency in like this is called **injecting** it.

  - type: ai-review
    id: review-debounce
    concept: interview.timing-utilities
    difficulty: 2
    language: js
    request: Debounce the search box. Take the timers as an argument so it can be tested.
    flawClass: logic
    code: |
      function debounce(fn, wait, timers) {
        let id;
        return (...args) => {
          id = timers.set(() => fn(...args), wait);
        };
      }
    prompt: >-
      An assistant wrote this. Its test typed one letter and saw one search, so it passed.
      Type three letters quickly and three searches run. Tap the line at fault.
    lines: [4]
    reasons:
      - text: The pending timer is never cleared first
        correct: true
        feedback: >-
          Yes. Each keystroke must cancel the last timer: `timers.clear(id)` before setting.
      - text: '`args` should be copied before the timer'
        feedback: >-
          Each call gets its own `args` array already. The trouble is the timers left running.
      - text: The wait should come before the function
        feedback: >-
          The argument order is only a convention. Every timer still fires in this version.
    verify:
      question: 'Which test would have caught this?'
      choices:
        - text: 'Three quick calls, then fire the timers, expecting one call'
          correct: true
          feedback: >-
            Yes. A burst inside the wait must collapse to one.
        - text: 'One call, then fire the timers'
          feedback: >-
            That's the test that passed. One call leaves nothing to cancel.
        - text: 'Three calls, each a full wait apart'
          feedback: >-
            Three runs are right here, so the buggy version passes too.
    fix: |
      timers.clear(id);
      id = timers.set(() => fn(...args), wait);

  - type: parsons
    id: order-debounce
    concept: interview.timing-utilities
    difficulty: 2
    language: js
    prompt: Arrange the fixed debounce. The timer id must survive from one call to the next.
    blocks:
      - id: open
        code: function debounce(fn, wait, timers) {
      - id: keep-id
        code: let id;
        indent: 1
        subgoal: Remember the timer
      - id: return-fn
        code: return (...args) => {
        indent: 1
        subgoal: Restart it on every call
      - id: clear
        code: timers.clear(id);
        indent: 2
      - id: set
        code: id = timers.set(() => fn(...args), wait);
        indent: 2
      - id: close-inner
        code: '};'
        indent: 1
      - id: close
        code: '}'
    distractors:
      - id: id-inside
        code: let id = undefined; // inside the returned function
        feedback: >-
          A fresh `id` on every call forgets the last timer, so there's nothing to clear.
      - id: clear-after
        code: timers.clear(timers.set(() => fn(...args), wait));
        feedback: >-
          That cancels the timer it has only now made, so nothing ever runs.

  - type: code-challenge
    id: write-debounce
    concept: interview.timing-utilities
    difficulty: 3
    language: ts
    starter: debounce.starter.ts
    solution: debounce.solution.ts
    tests: debounce.tests.ts
    prompt: >-
      Finish `debounce(fn, wait, timers)`. It returns a function that runs `fn` once no call
      has come for `wait` ms, with the latest arguments.


      Add the two methods interviewers ask for next. `cancel()` drops the pending call.
      `flush()` runs the pending call now, if there is one. The tests pass a fake `timers`.
    hints:
      - Run the tests first. The burst test shows every call's timer still firing.
      - Keep the latest arguments in a variable next to the timer id, not inside the timer.
      - 'Write one `run` that clears the timer, takes the stored arguments, clears them and calls `fn`. `flush` is `run`.'

  - type: prose
    id: trailing-call
    body: >-
      A plain throttle drops every call inside the interval, including the last one. For a
      scroll handler that means the final position is lost.


      So a good throttle has a **trailing call**. It remembers the latest arguments during
      the interval. When the interval ends it runs once with them, and starts a new interval.
      The first call of a burst is the **leading** call, and runs at once.

  - type: code-challenge
    id: write-throttle
    concept: interview.injected-clock
    difficulty: 4
    language: ts
    starter: throttle.starter.ts
    solution: throttle.solution.ts
    tests: throttle.tests.ts
    prompt: >-
      The starter is an assistant's throttle. It runs the first call at once, then drops
      calls for `interval` ms. A scroll handler built on it misses the final position.


      Add the trailing call: the latest call made during an interval runs when it ends, and
      starts a new interval. A lone call has no trailing repeat.
    hints:
      - Look at the early `return`. That's where the latest arguments get thrown away.
      - Store them instead. The timer callback decides whether anything is waiting.
      - 'When the timer fires with stored arguments, call `fn` with them and set the timer again. With none, stop waiting.'

  - type: explain-back
    id: explain-injected-clock
    concept: interview.injected-clock
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      An interviewer asks why your `debounce` takes the timers as an argument. Why does
      that make it testable?
    rubric:
      - With the real timers, a test has to sleep for the wait, which is slow and flaky.
      - A fake timer object lets the test decide when time passes and which timers fire.
      - The code under test doesn't change, only what it's given, so the test checks the real logic.
    modelAnswer: >-
      With real timers, a test must wait 300 ms and hope the machine isn't busy. When the
      timers are an argument, the test passes a fake that stores callbacks. It then fires
      them when it chooses. A test of three keystrokes runs instantly and the same way
      every time. The debounce code itself is unchanged.

recap:
  - Tell debounce from throttle, and pick one from the brief.
  - Write debounce with cancel and flush, and throttle with a trailing call.
  - Inject the timers, so a test moves time instead of waiting.
recall:
  - id: card-debounce-throttle
    concept: interview.timing-utilities
    front: What's the difference between debounce and throttle?
    back: >-
      Debounce waits for a pause and then calls once. Throttle calls at most once per
      interval, even while calls keep coming.
  - id: card-debounce-clear
    concept: interview.timing-utilities
    front: What must debounce do on every call before it sets a timer?
    back: >-
      Clear the pending timer, so only the last call of a burst runs.
  - id: card-trailing
    concept: interview.timing-utilities
    front: Why does a throttle need a trailing call?
    back: >-
      Without it, calls inside the interval are dropped, including the last one. The final
      scroll position or value is lost.
  - id: card-inject-timers
    concept: interview.injected-clock
    front: How do you test debounce without waiting in real time?
    back: >-
      Pass the timers in as an argument. The test hands in a fake and moves time forward
      itself.

references:
  - kind: docs
    title: setTimeout() global function
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout
    note: The timer id it returns, and clearTimeout.
    primary: true
    verified: true
  - kind: docs
    title: debounce
    authors: Lodash
    venue: Lodash documentation
    url: https://lodash.com/docs/4.17.15#debounce
    note: The `cancel` and `flush` methods, and the `leading` and `trailing` options interviewers borrow.
    primary: true
    verified: true
  - kind: docs
    title: Fake Timers
    authors: Jest
    venue: Jest documentation
    url: https://jestjs.io/docs/timer-mocks
    note: The same idea as the fake timers here, built into a test framework.
    verified: true

deepDive: |-
  **Leading and trailing.** Lodash's options: `leading: true` calls on the first event of a
  burst, `trailing: true` calls after the pause. Its throttle is a debounce with a
  `maxWait` equal to the interval, both edges on by default. Ask which edges the
  interviewer wants before you write a line. It's a question they're hoping for.


  **Why not `Date.now()`?** A throttle can compare timestamps instead of setting a timer.
  That handles the leading call, but a trailing call still needs a timer. Either way, take
  the clock as an argument (`now: () => number`) so a test can choose the time.


  **Timers in real code.** In a browser, pass
  `{ set: (fn, ms) => setTimeout(fn, ms), clear: (id) => clearTimeout(id) }`. In a React
  component, the debounced function must survive renders, so keep it in a `useRef` or
  `useMemo`, and cancel it when the component unmounts.


  **What the interviewer scores.** Clearing the old timer, calling with the latest
  arguments, a test that doesn't sleep, and naming the edge cases: a lone call, a call
  exactly at the boundary, cancel after the timer ran. In an AI-assisted round, the
  assistant's first debounce often forgets `cancel` or the latest arguments. Read it before
  you run it.
