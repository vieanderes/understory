deepDive: >-
  `request.formData()` reads the whole upload before you see its size. For big files, check
  the `Content-Length` header first and refuse early, or let a signed URL send the bytes
  straight to storage, which enforces its own size limit.


  RFC 9110 renamed `413` from Payload Too Large to Content Too Large. Many servers, Node
  among them, still print the old words. The number is what clients read.


  An image pipeline goes further than the first bytes. It decodes the image and re-encodes
  it, which strips hidden metadata such as the GPS location from a phone photo. Then it makes
  the sizes pages ask for, once, and caches them.


  Serving uploads from a separate domain, such as a CDN address, means a file that does
  manage to run can't read your site's cookies. A content-addressed key such as
  `sha256/9f1c...` names a file by its bytes, so a CDN can cache it for ever.
