term: best-of-n
aka: [best of n, best-of-n sampling, majority voting, self-consistency]
short: Generating several answers to one question and keeping the one a checker scores highest.
explain: |
  A model gives a different answer each time you ask. So ask several times, then pick. Keep
  the answer a checker likes best, or the answer most samples agree on, which is called
  majority voting.

  It costs n calls and the wait for the slowest one. The checker decides everything. Running
  tests against generated code is a strong checker. A model grading its own answers often
  prefers the confident wrong one.
analogy: Asking five friends the way to the station and going with the route most of them gave.
usage: Best-of-n with the unit tests as the checker fixed more bugs than switching to the bigger model.
related: [test-time-compute, temperature, llm-as-judge]
level: 3
lessons: [ai.reasoning-and-training]
