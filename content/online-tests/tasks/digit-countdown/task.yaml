id: digit-countdown
title: DigitCountdown
topic: iterations
difficulty: easy
type: coding
recommendedMinutes: 15
signature:
  params:
    - { name: N, type: int }
  returns: int
statement: |-
  A kitchen timer counts down in an odd way. It starts at a whole number N. In every step,
  it looks at the digits of the number it shows and subtracts the largest of them. It rings
  when it reaches 0.

  For example, starting from 27, the timer shows 27, 20, 18, 10, 9 and 0: it takes five
  steps (27 − 7 = 20, 20 − 2 = 18, 18 − 8 = 10, 10 − 1 = 9 and 9 − 9 = 0).

  Write a function:

  {{signature}}

  that, given an integer N, returns the number of steps the timer takes to reach 0.

  For example, given N = 27, the function should return 5, as explained above.

  Given N = 10, the function should return 2 (10 − 1 = 9, then 9 − 9 = 0).

  Given N = 0, the function should return 0, because the timer rings at once.

  Assume that:

  - N is an integer within the range [0..1,000,000].

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [27], expected: 5 }
  - { args: [10], expected: 2 }
  - { args: [0], expected: 0 }
tests:
  - name: extreme_zero
    description: N = 0, the timer rings at once
    group: correctness
    cases:
      - { args: [0], expected: 0 }
  - name: single_digit
    description: one digit, one step
    group: correctness
    cases:
      - { args: [1], expected: 1 }
      - { args: [9], expected: 1 }
      - { args: [5], expected: 1 }
  - name: zeros_inside
    description: numbers whose digits include zeros
    group: correctness
    cases:
      - { args: [100] }
      - { args: [1000] }
      - { args: [505] }
  - name: all_equal
    description: every digit the same
    group: correctness
    cases:
      - { args: [11] }
      - { args: [7777] }
      - { args: [999999] }
  - name: small_random
    description: random numbers below 1,000
    group: correctness
    cases:
      - generate: { seed: 101, args: [{ kind: int, min: 10, max: 999 }] }
      - generate: { seed: 102, args: [{ kind: int, min: 10, max: 999 }] }
  - name: extreme_large
    description: N close to 1,000,000
    group: correctness
    cases:
      - { args: [1000000] }
      - { args: [999998] }
      - generate: { seed: 103, args: [{ kind: int, min: 900000, max: 1000000 }] }
