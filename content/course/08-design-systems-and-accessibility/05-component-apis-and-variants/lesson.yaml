id: design.component-apis
title: Components with good APIs
objective: Build a shared Button on the native element, give it variants, and let types refuse a wrong value.
level: essential
minutes: 10
concepts: [design.native-semantics, design.variants, design.constrained-props]
prerequisites: [design.design-tokens, react.props-and-composition, ts.everyday-types]
opening:
  text: >-
    You'll build the Button every screen of an app uses, and make misuse fail before it
    ships. That's how a design system survives forty people touching it.

steps:
  - type: prose
    id: what-a-component-api-is
    body: >-
      The second part of a design system is its components. A shared `Button` might sit on
      every screen, used by people who never read its code.


      So its **API** matters: the part other code touches, here its props. A good API is
      hard to use wrong. It starts with the element underneath.

  - type: prose
    id: build-on-native
    body: >-
      A `Button` component renders a real `<button>`. You saw why in the keyboard lesson:
      focus, the role, Enter and Space all come free.


      There's one choice to make first. Does it do something, or go somewhere? An action,
      like Save or Delete, is a `button`. Going to another page, like View order, is a link:
      `<a href="...">`.

  - type: playground
    id: button-or-link
    concept: design.native-semantics
    difficulty: 1
    prompt: >-
      These two are the wrong way round. Make View order a link to `/orders/42`, and make
      Cancel order a `button`. Keep the text.
    html: |
      <h1>Order 42</h1>
      <button class="view">View order</button>
      <a href="#" class="cancel">Cancel order</a>
    css: |
      body { font-family: sans-serif; }
      a, button { display: inline-block; margin-right: 8px; font: inherit; color: #1d4ed8; }
    editable: [html]
    checks:
      - label: View order is a link to `/orders/42`
        selector: 'a[href="/orders/42"]'
        text: View order
      - label: Cancel order is a `button`
        selector: button
        text: Cancel order
      - label: No link points at `#`
        selector: 'a[href="#"]'
        count: 0
    solution:
      html: |
        <h1>Order 42</h1>
        <a href="/orders/42" class="view">View order</a>
        <button class="cancel">Cancel order</button>
    hints:
      - Ask of each one whether it goes somewhere or does something.
      - A link needs a real address in `href`.
      - '`<a href="/orders/42" class="view">View order</a>` is the first.'

  - type: prose
    id: variants-not-flags
    body: |-
      Buttons come in a few looks: plain, primary, danger. Each look is a **variant**, one
      named option from a short, fixed list. In HTML, an attribute can carry it:

      ```html
      <button class="button" data-variant="danger">Delete</button>
      ```

      The design system's CSS styles each variant once. Nobody copies colours onto a button
      again.

  - type: playground
    id: use-the-variants
    concept: design.variants
    difficulty: 2
    prompt: >-
      Someone styled each button by hand. Replace each `style` attribute with
      `class="button"` and a `data-variant`: `primary` for Save, `plain` for Preview,
      `danger` for Delete.
    html: |
      <button style="background: #3a41b8; color: white; padding: 8px 16px; border: 0">Save</button>
      <button style="background: white; color: #1b1d2e; padding: 8px 16px; border: 2px solid #1b1d2e">Preview</button>
      <button style="background: #b91c1c; color: white; padding: 8px 18px; border: 0">Delete</button>
    css: |
      .button { padding: 8px 16px; border: 2px solid transparent; font: inherit; }
      .button[data-variant="plain"] { background: white; color: #1b1d2e; border-color: #1b1d2e; }
      .button[data-variant="primary"] { background: #3a41b8; color: white; }
      .button[data-variant="danger"] { background: #b91c1c; color: white; }
    editable: [html]
    checks:
      - label: No `style` attribute is left
        selector: '[style]'
        count: 0
      - label: Save is the primary variant
        selector: '.button[data-variant="primary"]'
        text: Save
      - label: Preview is the plain variant
        selector: '.button[data-variant="plain"]'
        text: Preview
      - label: Delete is the danger variant
        selector: '.button[data-variant="danger"]'
        text: Delete
    solution:
      html: |
        <button class="button" data-variant="primary">Save</button>
        <button class="button" data-variant="plain">Preview</button>
        <button class="button" data-variant="danger">Delete</button>
    hints:
      - Each `style="..."` goes, whole.
      - In its place go two attributes, `class` and `data-variant`.
      - '`<button class="button" data-variant="primary">Save</button>`.'

  - type: fill-blank
    id: fill-variant-union
    concept: design.variants
    difficulty: 2
    language: ts
    prompt: >-
      In the React version, close the list of variants. Then map each one to its classes, so
      none is missed. Fill the gaps.
    template: |
      type Variant = 'plain' | 'primary' | {{1}};

      const variantClasses: {{2}}<Variant, string> = {
        plain: 'button-plain',
        primary: 'button-primary',
        {{3}}: 'button-danger',
      };
    blanks:
      - key: '1'
        answer: "'danger'"
      - key: '2'
        answer: Record
      - key: '3'
        answer: danger
    bank: ["'danger'", "'secondary'", Record, Map, danger, variant]

  - type: prose
    id: types-close-the-set
    body: >-
      Now the type does a reviewer's job. `variant` accepts `'plain'`, `'primary'` or
      `'danger'`, and nothing else.


      That's a **constrained prop**: its type lists every allowed value. Someone who writes
      `variant="secondary"` gets a red underline in the editor, before the code is ever run
      or reviewed.

  - type: predict-output
    id: predict-unknown-variant
    concept: design.constrained-props
    difficulty: 2
    language: tsx
    code: |
      type Variant = 'plain' | 'primary' | 'danger';

      function Button(props: { variant?: Variant; children: string }) {
        return <button data-variant={props.variant}>{props.children}</button>;
      }

      <Button variant="secondary">Back</Button>;
    question: What happens to the last line?
    choices:
      - text: A type error in the editor
        correct: true
        feedback: >-
          Right. `'secondary'` isn't in the union, so TypeScript refuses it.
      - text: It renders a button with no variant style
        feedback: >-
          That's what plain JavaScript would do, quietly. The union stops it earlier.
      - text: It falls back to `plain`
        feedback: >-
          Nothing falls back. The value never gets past the type checker.

  - type: code-challenge
    id: write-button-component
    concept: design.native-semantics
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write the design system's `Button`. It renders a real `button` with `type="button"`
      and `className="button"`, and puts `variant` and `size` into `data-variant` and
      `data-size`.


      `variant` defaults to `plain` and `size` to `medium`. Pass `onClick` through, so a
      click or Enter calls it. `<Button variant="danger">Delete</Button>` renders a button
      named Delete with `data-variant="danger"`.
    hints:
      - The starter renders a `div`. What should it render instead?
      - Default values can sit right in the destructuring, like `variant = 'plain'`.
      - "Start with `function Button({ variant = 'plain', size = 'medium', onClick, children }: ButtonProps)`."

  - type: explain-back
    id: explain-compile-error-over-review
    concept: design.constrained-props
    difficulty: 3
    prompt: >-
      A team relies on code review to catch `variant="secondary"`. Why is the type a better
      place for that rule?
    rubric:
      - A closed union rejects an unknown variant in the editor, before any review.
      - Reviewers miss things and forget rules, and the compiler checks every use every time.
      - The union also documents the allowed values where people read the props.
    modelAnswer: >-
      A reviewer catches the mistake sometimes, on the days they're paying attention. A
      closed `Variant` union catches it every time, in the editor, before a commit exists.
      It also tells the next person exactly which values exist. The type is the rule, and it
      never gets tired.

recap:
  - Render a real `button` for actions and a link for going somewhere.
  - Give a component named variants from a short list, styled once.
  - Close the list with a union type, so a wrong value fails in the editor.

recall:
  - id: card-native-button
    concept: design.native-semantics
    front: What does a `<button>` give a component that a styled `<div>` does not?
    back: >-
      Focus, the button role, and Enter and Space, with no extra code.
  - id: card-button-or-link
    concept: design.native-semantics
    front: When should a control be a link rather than a button?
    back: >-
      When it goes somewhere, such as another page. A button does something, like Save.
  - id: card-variant
    concept: design.variants
    front: What is a variant, and how does a design system style one?
    back: >-
      A named option from a short, fixed list, like `danger`. Its styles are written once,
      keyed on the variant.
  - id: card-closed-union
    concept: design.constrained-props
    front: 'What happens to `variant="secondary"` when `variant` is typed `''plain'' | ''primary'' | ''danger''`?'
    back: >-
      A type error in the editor. The union lists every allowed value.

