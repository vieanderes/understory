id: basics.first-program
title: Your first line of code
objective: Run code and print numbers and text with `console.log`.
level: essential
minutes: 8
concepts: [basics.values, basics.console-log]
opening:
  text: >-
    In the next few minutes you'll write and run real code. By the end, you can make the
    computer show any message or number you like.

steps:
  - type: prose
    id: what-code-is
    body: |-
      Code is a list of instructions. **Running** it means the computer follows them, one at a
      time, from top to bottom, exactly as written.

      Here's a complete program:

      ```js
      console.log("Hello");
      ```

      `console.log` means "show this". Whatever sits inside the brackets appears in the
      **output**: the place where a program's results show up. Each `console.log` gets its own
      line. The `;` is like a full stop.

  - type: predict-output
    id: predict-hello
    concept: basics.console-log
    difficulty: 1
    language: js
    code: |
      console.log("Hello");
    question: What appears in the output when this runs?
    choices:
      - text: '`Hello`'
        correct: true
        feedback: >-
          Yes. That's your first program, read correctly.
      - text: '`"Hello"`, with the quotes'
        feedback: >-
          Close. The quotes only mark where the text starts and stops. They aren't shown.
      - text: '`console.log("Hello")`'
        feedback: >-
          The computer doesn't show your instruction. It carries it out and shows the result.

  - type: prose
    id: text-and-numbers
    body: >-
      Text in code always goes inside quotes, like `"Hello"`. Programmers call a piece of text
      a **string**.


      Numbers don't need quotes: `console.log(42);` shows `42`. Without quotes, the computer
      reads a word as a name, not as text. More on names in the next lesson.

  - type: multiple-choice
    id: pick-string
    concept: basics.values
    difficulty: 1
    question: Which line shows the word banana?
    choices:
      - text: '`console.log("banana");`'
        correct: true
        feedback: >-
          Right. Quotes around it make it text.
      - text: '`console.log(banana);`'
        feedback: >-
          Without quotes, `banana` is read as a name. Nothing has that name, so you get an
          error.
      - text: '`console.log("banana);`'
        feedback: >-
          So close. The text never ends, because the closing quote is missing.

  - type: parsons
    id: arrange-countdown
    concept: basics.console-log
    difficulty: 1
    language: js
    prompt: >-
      Put the lines in order, so the output reads `Ready`, then `Set`, then `Go`. One line
      doesn't belong.
    blocks:
      - id: ready
        code: console.log("Ready");
      - id: set
        code: console.log("Set");
      - id: go
        code: console.log("Go");
    distractors:
      - id: no-quotes
        code: console.log(Go);
        feedback: >-
          Without quotes, `Go` is read as a name, not as text. Nothing has that name, so it
          stops with an error.

  - type: prose
    id: maths
    body: |-
      The computer is also a calculator. `*` means times:

      ```js
      console.log(6 * 7);
      ```

      That shows `42`. It works out the answer first, then shows it. Put quotes around
      it, though, and it becomes text. `console.log("6 * 7");` shows `6 * 7`, exactly as
      written.

  - type: bug-hunt
    id: hunt-quoted-maths
    concept: basics.values
    difficulty: 2
    language: js
    code: |
      console.log("Minutes in a day:");
      console.log("24 * 60");
    prompt: This should show the answer, `1440`. It shows `24 * 60` instead. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The quotes turn the maths into text
        correct: true
        feedback: >-
          Yes. Drop the quotes, and the computer works it out.
      - text: '`*` doesn''t mean times in code'
        feedback: >-
          It does. The trouble is the quotes around the sum, which make it text.
      - text: Line 1 needs the answer too
        feedback: >-
          Line 1 is only a label, and it's fine. Line 2 holds the sum.
    fix: |
      console.log("Minutes in a day:");
      console.log(24 * 60);

  - type: code-challenge
    id: write-first-lines
    concept: basics.console-log
    difficulty: 2
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Your turn. Write two lines of code.


      The first shows the text `Hello, world`. The second shows the answer to `7 * 6`. Let the
      computer do the maths.


      Press Run tests. Your output appears under Console, and the tests check it. Lines that
      start with `//` are notes for people. The computer skips them.
    hints:
      - Each line needs its own `console.log(...)`.
      - Text goes inside quotes. Maths doesn't, or it stays as text.
      - 'Start with `console.log("Hello, world");`'

  - type: explain-back
    id: explain-quotes
    concept: basics.values
    difficulty: 2
    prompt: Why does `console.log("2 + 3")` show `2 + 3` and not `5`?
    rubric:
      - The quotes make `2 + 3` a string, which is text.
      - The computer shows text exactly as written.
      - Only numbers without quotes get calculated.
    modelAnswer: >-
      The quotes turn `2 + 3` into text. The computer doesn't calculate text, it shows it as
      written. Without the quotes, `2 + 3` is maths, so it would show `5`.

recap:
  - "Run a line of code and see what it prints."
  - "Show numbers and text with `console.log`."
  - "Tell text from a number by its quotes."
recall:
  - id: card-console-log
    concept: basics.console-log
    front: What does `console.log(...)` do?
    back: >-
      It shows whatever is inside the brackets in the output, on its own line.
  - id: card-strings
    concept: basics.values
    front: How do you write text in code, and what is it called?
    back: >-
      Inside quotes, like `"Hello"`. A piece of text is called a string.
  - id: card-maths-or-text
    concept: basics.values
    front: What do `console.log(4 * 2)` and `console.log("4 * 2")` show?
    back: >-
      `8`, because numbers get calculated. Then `4 * 2`, because text is shown as written.

references:
  - kind: docs
    title: Hello, world!
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/hello-world
    note: A gentle start that runs your first script.
    primary: true
    verified: true
  - kind: docs
    title: 'console: log() static method'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/API/console/log_static
    note: Everything `console.log` can print.
    verified: true
  - kind: docs
    title: Handling text — strings in JavaScript
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Strings
    note: Quotes, and what you can do with text.
    primary: true
    verified: true

deepDive: >-
  Already know this? `console.log` can take several values at once, separated by commas:
  `console.log("Total:", 42)` prints them on one line with a space between. In a browser, the
  output goes to the console in its developer tools. In Node, a program that runs JavaScript
  outside a browser, it goes to the terminal window.


  Strings can use double quotes, single quotes or backticks. Double and single quotes behave
  the same. Backticks do something extra, which you'll meet two lessons from now.
