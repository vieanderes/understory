term: linked list
aka: [doubly linked list, singly linked list]
short: A chain of nodes where each holds a value and a pointer to the next node.
explain: |
  The items aren't side by side in memory. Each node says where the next one lives. To
  reach the tenth item you follow nine pointers, so access by position is O(n).

  The payoff is at a node you already hold. Inserting or removing there means changing two
  pointers, O(1), with nothing to shuffle. A doubly linked list also points backwards.

  That's why an LRU cache pairs a hash map with a doubly linked list. The map finds the
  node at once, and the list moves it to the front at once.
analogy: A treasure hunt. Each clue tells you where the next one is, so you can't jump straight to clue ten.
example:
  language: ts
  code: |
    type Node = { value: number; next: Node | null };

    // insert after a node we already hold: O(1)
    function insertAfter(node: Node, value: number) {
      node.next = { value, next: node.next };
    }
usage: A doubly linked list gives us O(1) moves to the front, and the map gives us O(1) lookup.
twin:
  term: array
  difference: A linked list makes inserts cheap where you stand but reaching position k slow. An array makes reaching position k instant but inserts in the middle slow.
related: [array, lru-cache, hash-map, fifo-queue]
level: 2
lessons: [cs.arrays-lists-hash-maps, interview.utilities]
