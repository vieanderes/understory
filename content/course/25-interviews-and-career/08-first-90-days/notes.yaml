summary: |-
  The first 90 days in a new team set how people see you for a long time. The common shape is learn, contribute, lead: month one to run the system, meet people and ship something small; month two to own a feature end to end; month three to drive one improvement you spotted while learning, backed by evidence.

  The mistake senior hires make most is arriving with answers. Code that looks wrong often exists for reasons you haven't met yet, and a rewrite before you understand the system, or before you can measure its quality, spends trust you haven't earned. Early trust comes from small, careful, well-described changes.

  In an AI team, one rule stands above the rest: learn how quality is measured before you touch a prompt. These notes give a complete 30/60/90 plan for a senior AI engineer, a method for learning a codebase by tracing one request, a model first pull request, and model answers to the "how would you start?" questions interviewers ask.
remember:
  - Plan the first three months as learn, contribute, lead, and agree with your manager in week one what success at 90 days looks like.
  - Learn a codebase by tracing one real request end to end, writing down every "why is it like this?" to ask about.
  - In an AI team, learn how answer quality is measured before changing any prompt or model, or you can't tell whether you helped.
  - Ship one small, reviewed change in the first week or two, because it proves your setup works and teaches you the review process.
  - A first pull request says what changed, why, and how you tested it, with evidence such as a test added or an eval score unchanged.
  - Keep a list of rough edges but fix few at first, since some exist for reasons you haven't met.
  - Propose a larger change only with data on its cost, and after you've shipped enough to be trusted.
sections:
  - title: A complete 30/60/90 plan for a senior AI engineer
    body: |-
      **Days 1 to 30: learn.**

      - Get the system running locally and deploy something trivial to staging.
      - Trace one real request from the API to the model and back (see the next section).
      - Learn how quality is measured: where the eval set lives, how it runs, what the current scores are, who owns it.
      - Read the last three incident reviews and the on-call runbook.
      - Have short conversations with five to eight people: your manager, teammates, the product manager, someone from support, a neighbouring team.
      - Ship one or two small fixes through the normal review process.
      - Agree the 90-day success criteria with your manager in writing.

      **Days 31 to 60: contribute.**

      - Own a small feature from design note to release, including its eval cases and monitoring.
      - Join the on-call rota, shadowing first if that's the norm.
      - Review others' pull requests regularly; reviewing is one of the fastest ways to learn a codebase.
      - Update the onboarding document with what you found missing.

      **Days 61 to 90: lead.**

      - Pick one rough edge from your list with a measurable cost, such as slow evals that discourage running them, or a class of wrong answers.
      - Write a one-page proposal: the problem, evidence of its cost, options with trade-offs, your recommendation.
      - Lead the fix, bringing in others, and measure the result.
      - Review progress against the 90-day criteria with your manager.

      Check in formally at 30 and 60 days. Surprises in either direction are cheaper early.
  - title: Tracing one request
    body: |-
      Reading a codebase front to back doesn't work: there's no thread to hang things on. Tracing one real request gives you that thread. Pick the product's most important path, such as a user asking the assistant a question, and follow it.

      Write down each hop as you go:

      ```text
      1. Browser posts to /api/chat            route handler, auth middleware
      2. Session checked, tenant resolved      where does tenant come from?
      3. Question embedded                     which model, cached?
      4. Vector search, top 8, tenant filter   why 8? filter inside the query?
      5. Reranker keeps 4                      added after an incident?
      6. Prompt built from a template          where do templates live, versioned?
      7. Model called, streamed back           timeout, retry, fallback model?
      8. Answer and citations logged           personal data redacted?
      9. Feedback thumbs stored                who reads them?
      ```

      The right-hand column is the valuable part. Every question is something to ask a teammate, and the answers carry the history no document holds: "the reranker was added after we cited the wrong policy to a customer". Ask in batches rather than interrupting every hour, and write the answers down.

      Then trace the failure path: what happens when the model times out, when search returns nothing, when the user isn't allowed to see a document. Failure paths reveal the system's real design.

      Turn your notes into a diagram and share it. It becomes onboarding material for the next person, and teammates correcting it will teach you more.
  - title: A model first pull request
    body: |-
      Your first pull request introduces you to every reviewer. Keep it small, and make the description do the work.

      ```text
      Title: Remove duplicate passages from search results

      Why: when two files contain the same page (for example a policy and
      its printed copy), search returned the same passage twice, taking two
      of the four context slots.

      Change: deduplicate by document hash and page number after retrieval,
      before reranking. Keeps the higher-scoring copy.

      Tested: new unit test with two files sharing a page. Ran the eval set:
      412 of 450 before and after, so no regression. Checked three affected
      questions by hand; each now shows four distinct passages.

      Not in scope: near-duplicates with small wording changes. Noted in
      the rough-edges list.
      ```

      Every line answers a reviewer question before it's asked: why this matters, what exactly changed, how you know it works, and what you deliberately left out.

      Ask for review early, respond to every comment, and thank people. If a reviewer suggests a different approach, ask about the reasoning before defending yours: you're learning the team's conventions as much as shipping a fix.
  - title: Conversations that teach you the unwritten parts
    body: |-
      Much of what you need isn't written down. Short, deliberate conversations in the first weeks find it.

      Ask your manager for five to eight people to meet. Keep each to about thirty minutes, and ask the same few questions so answers are comparable:

      - What should I know that isn't written down?
      - What's the team's biggest source of friction right now?
      - What would you like the next senior engineer to take on?
      - Who else should I talk to?

      With your manager specifically, agree:

      - What success looks like at 30, 60 and 90 days, in writing.
      - How they prefer updates: written, in one-to-ones, or both.
      - Which decisions you can make alone and which need discussion.

      With support or customer-facing staff, ask which wrong answers users complain about most. They often know the assistant's failure modes better than the engineers, and their examples make excellent eval cases.

      Write up what you learnt. Patterns across conversations, such as three people naming slow evals, point to the improvement you'll lead in month three.
pitfalls:
  - >-
    **Proposing a rewrite in the first month.** You don't yet know why things are the way
    they are, and you can't measure whether your version is better. Learn and measure first.
  - >-
    **Changing a prompt before learning the evals.** Without the team's quality measure you
    can't tell whether you helped or hurt. Run the eval set before your first prompt change.
  - >-
    **Reading the whole codebase.** You'll never finish, and nothing sticks without a task.
    Trace one request and learn around it.
  - >-
    **A large first pull request.** Big diffs get slow, cautious reviews. Ship something
    small first, with a clear description.
  - >-
    **"At my last company we did it this way."** Said often, it grates. Ask why the current
    approach exists, then propose changes on their merits.
  - >-
    **No agreed definition of success.** Without one, you and your manager may judge the
    first 90 days differently. Agree it in writing in week one.
interview:
  - question: What would your first 90 days here look like?
    answer: >-
      "Learn, contribute, lead, with a written success definition agreed in week one." Month
      one: run the system, trace a real request from the API to the model and back, learn
      how answer quality is measured, meet the people around the team, and ship a small fix.
      Month two: own a small feature end to end, including its eval cases and monitoring,
      and join on-call. Month three: pick one rough edge I found with a measurable cost, write
      a short proposal with the evidence, and lead the fix. The caveat: I'd adapt it to what
      the team needs most, so I'd ask you now what would make the first 90 days a success
      from your side.
  - question: How do you get up to speed on an unfamiliar codebase?
    answer: >-
      "By tracing one real request end to end rather than reading files in order." I pick the
      most important path, follow it through routing, auth, business logic, the model call
      and storage, and write down every hop with a question beside it: why eight results,
      where does the tenant come from, what happens on a timeout. I ask those questions in
      batches, then trace the failure paths. I also review others' pull requests from week
      one, since reviews show current conventions. Within a couple of weeks I share a diagram
      and let people correct it. The trade-off is depth over breadth early: I'll know one
      path very well before I know the whole system.
  - question: You join and find code you think is badly designed. What do you do?
    answer: >-
      "Understand it before judging it, then decide with evidence." First I'd ask why it's
      built that way; there's often history, like an incident or a deadline, that makes it
      reasonable. I'd add it to my rough-edges list rather than fixing it straight away. If
      it's still a problem after I understand it, I'd measure its cost: bugs it caused, time
      lost, incidents. Then I'd write a short proposal with options, including leaving it
      alone, and bring in the people who built it. A small incremental change usually beats
      a rewrite, because it can be verified at each step. The exception is a security or data
      risk, which I'd raise straight away.
  - question: How do you build trust with a new team?
    answer: >-
      "Small, reliable deliveries and genuine curiosity, early." I ship a small, well-described
      change in the first week or two, so people see how I work. I ask questions before
      offering opinions, and I credit what I learn from people. I do what I say I'll do,
      especially small things like reviewing a pull request by the time I promised. I review
      others' work carefully and kindly. And when I make a mistake, I say so quickly. Trust
      compounds: after a few weeks of that, a larger proposal gets a fair hearing. The trap
      is trying to prove seniority with a big early change, which usually costs more trust
      than it earns.
