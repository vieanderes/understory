id: backend
number: 9
title: Backend, APIs, auth, payments
summary: "The server side: writing endpoints, reading them with `curl`, checking what arrives, knowing who a caller is and what they may do, calling other services with secret keys, and taking payments without charging anyone twice."
why: "The server is where trust, money and data meet, and every AI feature you build sits behind one."
youCanBuild: "An API with validated endpoints, sessions, ownership checks, rate limits, and an idempotent payment webhook handler."
lab: request-journey
concepts:
  - id: backend.client-server
    title: Client and server
    summary: A client sends a request, and a server is a program that waits for requests and answers each one with a response.
  - id: backend.curl
    title: Reading HTTP with curl
    summary: "`curl` sends a request from the terminal and prints what comes back; `-i` adds the status line and headers."
  - id: backend.url
    title: Parts of a URL
    summary: A URL names a scheme, a host, an optional port, a path, a query and a fragment, and the fragment never leaves the browser.
  - id: backend.request-journey
    title: The journey of a request
    summary: Before a request is sent, DNS finds the server's address, TCP opens a connection and TLS encrypts it.
  - id: backend.handlers
    title: Handlers
    summary: A handler is a function the server calls with each request, and what it returns is sent back as the response.
  - id: backend.routing
    title: Routing
    summary: The server picks the code to run from the request's method and path, and answers 404 when nothing matches.
  - id: backend.http-methods
    title: HTTP methods
    summary: "A method states the intent of a request: GET reads, POST creates, PUT replaces, PATCH changes part and DELETE removes."
  - id: backend.status-codes
    title: Status codes
    summary: "The first digit gives the class: 2xx success, 3xx look elsewhere, 4xx the request was wrong, 5xx the server failed."
  - id: backend.safe-and-idempotent
    title: Safe and idempotent methods
    summary: A safe method changes nothing, and an idempotent method has the same effect whether it is sent once or many times.
    confusableWith: [scale.idempotency-keys]
  - id: backend.resources
    title: Resource modelling
    summary: An API names things as nouns at stable URLs and uses the HTTP methods as the verbs on them.
  - id: backend.pagination
    title: Pagination and filtering
    summary: Offset pagination skips a number of rows, and cursor pagination continues after the last item seen, which stays stable while rows are inserted.
  - id: backend.error-shapes
    title: Error responses
    summary: Every error from an API has a true status and the same body shape, such as problem details, so one piece of client code can handle them all.
    confusableWith: [backend.server-errors]
  - id: backend.server-errors
    title: Unexpected errors
    summary: A handler catches what it didn't plan for, logs the details on the server, and answers 500 with a message that gives nothing away.
    confusableWith: [backend.error-shapes]
  - id: backend.trust-boundary
    title: Trust boundary
    summary: A trust boundary is a line where data arrives from a party you do not control, so everything that crosses it is checked.
  - id: backend.parse-dont-validate
    title: Parse, don't validate
    summary: A parser turns unchecked input into a typed value once, keeping only the fields it names, so later code cannot receive data that skipped the check.
  - id: backend.client-side-checks
    title: Client-side checks
    summary: Validation in the browser helps the user, and the server repeats it because any client can send any request.
  - id: backend.authentication
    title: Authentication
    summary: Authentication establishes who is making a request.
    confusableWith: [backend.authorisation]
  - id: backend.cookies
    title: Cookies and their attributes
    summary: A cookie is sent by the browser with each matching request, and `HttpOnly`, `Secure` and `SameSite` limit who can read it and when it is sent.
    confusableWith: [backend.jwt]
  - id: backend.server-sessions
    title: Server-side sessions
    summary: The cookie holds a random identifier and the server stores the session data, so logout and revocation take effect at once.
    confusableWith: [backend.jwt]
  - id: backend.jwt
    title: JSON Web Tokens
    summary: A JWT carries signed claims that anyone holding it can read and a server verifies without a lookup, which makes it hard to revoke before it expires.
    confusableWith: [backend.cookies, backend.server-sessions]
  - id: backend.authorisation
    title: Authorisation
    summary: Authorisation decides whether an identified caller may perform this action on this resource.
    confusableWith: [backend.authentication]
  - id: backend.ownership-checks
    title: Ownership checks
    summary: A lookup for a resource includes the caller's identity, so a record that belongs to someone else is never returned.
  - id: backend.roles
    title: Role-based access control
    summary: Permissions are attached to roles and roles to users, so a check asks about a permission and not about a person.
  - id: backend.idor
    title: Insecure direct object reference (IDOR)
    summary: An endpoint that returns any record whose ID the caller supplies, without checking that the caller may see it.
  - id: backend.oauth
    title: OAuth 2.0 authorisation code flow
    summary: The user approves access at the authorisation server, which redirects back with a short-lived code that the app exchanges for an access token.
    confusableWith: [backend.oidc]
  - id: backend.pkce
    title: PKCE
    summary: The app sends a hash of a secret verifier when the flow starts and the verifier itself when it redeems the code, so a stolen code is useless.
  - id: backend.oidc
    title: OpenID Connect
    summary: OIDC adds an ID token to OAuth, a signed JWT that tells the app who the user is.
    confusableWith: [backend.oauth]
  - id: backend.passkeys
    title: Passkeys
    summary: A passkey is a key pair bound to one site, where the device signs a challenge and the server stores only the public key.
  - id: backend.api-keys
    title: API keys
    summary: A secret that identifies your server to another service, sent in a header and kept in the server's environment, never in the browser.
  - id: backend.upstream-failures
    title: When another service fails
    summary: A call to another service gets a timeout, and its failures become your own clear 502 or 504 instead of a request that hangs.
  - id: backend.rate-limiting
    title: Rate limiting
    summary: The server counts each caller's requests in a time window and answers 429 with `Retry-After` once they pass the limit.
  - id: backend.backoff
    title: Retrying politely
    summary: A client that gets 429 or 503 waits as long as `Retry-After` says, or longer after each failure, before it tries again.
  - id: backend.webhook-signatures
    title: Webhook signatures
    summary: The sender signs the raw body with a secret you share, and the receiver checks the signature before trusting the event.
  - id: backend.webhook-retries
    title: Retries and ordering
    summary: A sender retries until it gets a 2xx response, so events can arrive more than once, late and out of order.
  - id: backend.idempotent-handlers
    title: Idempotent handlers
    summary: A handler claims each event ID before doing the work, so a repeated delivery changes nothing.
  - id: backend.stripe-checkout
    title: Stripe Checkout
    summary: A payment page hosted by Stripe, which the shop opens with a Checkout Session and which keeps card data off the shop's servers.
  - id: backend.payment-intents
    title: PaymentIntents
    summary: A PaymentIntent tracks one payment through its states, and only a verified event that says it succeeded means the money moved.
  - id: backend.sca
    title: Strong Customer Authentication
    summary: A European rule that requires two independent factors for many online card payments, usually met through 3D Secure.
  - id: backend.refunds
    title: Refunds
    summary: A refund returns all or part of a captured payment, and the shop learns its outcome through a webhook event.
  - id: backend.object-storage
    title: Object storage
    summary: A service that stores whole files under keys in buckets and serves them over HTTP, with no file system semantics.
  - id: backend.signed-urls
    title: Signed URLs
    summary: A URL that carries an expiry and a signature lets a client upload or download one object directly, without holding the storage credentials.
  - id: backend.image-pipelines
    title: Checking uploads
    summary: An upload is checked for size and real type from its bytes, stored under a new key, and served with a type the server sets.
  - id: backend.polling
    title: Polling and long polling
    summary: The client asks repeatedly for news, and in long polling the server holds each request open until it has some.
  - id: backend.sse
    title: Server-sent events
    summary: One long-lived HTTP response over which the server pushes text events, with automatic reconnection in the browser.
    confusableWith: [backend.websockets]
  - id: backend.websockets
    title: WebSockets
    summary: A connection upgraded from HTTP to a two-way message channel, which the application must reconnect and authenticate itself.
    confusableWith: [backend.sse]
  - id: backend.connection-cost
    title: The cost of open connections
    summary: Every connected client holds memory and a socket on the server for as long as it stays connected.
  - id: backend.versioning
    title: API versioning
    summary: A version in the path or a header lets a breaking change ship while existing clients keep the old behaviour.
  - id: backend.compatibility
    title: Backward compatibility
    summary: Adding optional fields and endpoints keeps old clients working, while removing, renaming or retyping anything breaks them.
  - id: backend.rest-rpc-graphql
    title: REST, RPC and GraphQL
    summary: REST exposes resources, RPC (including tRPC) exposes procedures, and GraphQL exposes one typed graph that the client queries by shape.
