deepDive: >-
  A real audit ends in a report: each finding with where it is, how bad it is, how to
  reproduce it on a test account, and the fix. Rank by harm times reach. A flaw every visitor
  can use outranks one that needs an admin's password.


  Reviewing AI-written code needs the same checklist, applied harder. Assistants write code
  that passes the happy-path test: signed in, parameterised, tidy. The missing check is the
  usual gap, because no test asked for it. Write the stranger test before you accept the code.


  OWASP keeps a separate Top 10 for apps built on language models, led by prompt injection,
  sensitive information disclosure and excessive agency. The AI chapters teach each one where
  you build the thing it protects.
