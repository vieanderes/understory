id: react.state-placement
title: Reducers and URL state
objective: Gather update rules into a reducer, and keep state people share or reload in the URL.
level: essential
minutes: 10
concepts: [react.reducers, react.url-state]
prerequisites: [react.fetching-data]
opening:
  text: >-
    You'll pull a component's tangle of setters into one tidy function you can test on its
    own. And a reload or a shared link will open exactly the tab and filters you saw.

steps:
  - type: prose
    id: what-a-reducer-is
    body: |-
      When many handlers change the same state, the rules get scattered. A **reducer** puts
      them in one function. It takes the current state and an **action**, an object saying
      what happened, and returns the next state:

      ```tsx
      function cartReducer(state, action) {
        if (action.type === 'add') return { count: state.count + 1 };
        if (action.type === 'clear') return { count: 0 };
        return state;
      }
      ```

      `useReducer(cartReducer, { count: 0 })` gives you the state and `dispatch`, which sends
      an action.

  - type: predict-output
    id: predict-two-dispatches
    concept: react.reducers
    difficulty: 2
    language: tsx
    code: |
      function Cart() {
        const [cart, dispatch] = useReducer(cartReducer, { count: 0 });
        function addTwo() {
          dispatch({ type: 'add' });
          dispatch({ type: 'add' });
        }
        return <button onClick={addTwo}>{cart.count}</button>;
      }
    question: '`cartReducer` is the one above. You click the button once. What does it show?'
    choices:
      - text: '`2`'
        correct: true
        feedback: >-
          Right. React queues both actions and runs each on the latest state.
      - text: '`1`'
        feedback: >-
          That's what `setCount(count + 1)` twice would give. An action works like an updater:
          it gets the pending state.
      - text: '`0`'
        feedback: >-
          This render still reads 0. After the click, React applies both actions and renders
          again.

  - type: fill-blank
    id: fill-use-reducer
    concept: react.reducers
    difficulty: 2
    language: tsx
    prompt: >-
      A parking meter adds 30 minutes per press. Wire the reducer into the component. Fill the
      gaps.
    template: |
      function meterReducer(state, action) {
        if (action.type === 'add') return { minutes: state.minutes + action.minutes };
        if (action.type === 'clear') return { minutes: 0 };
        return state;
      }

      function Meter() {
        const [meter, {{1}}] = {{2}}(meterReducer, { minutes: 0 });
        return (
          <button onClick={() => dispatch({ type: {{3}}, minutes: 30 })}>
            {meter.minutes} minutes
          </button>
        );
      }
    blanks:
      - key: '1'
        answer: dispatch
      - key: '2'
        answer: useReducer
      - key: '3'
        answer: "'add'"
    bank: [dispatch, setMeter, useReducer, useState, "'add'", "'clear'"]

  - type: code-challenge
    id: write-todo-reducer
    concept: react.reducers
    difficulty: 4
    language: ts
    prompt: >-
      A reducer is a plain function, so you can test it without any component. Write
      `todoReducer(state, action)`. The state is `{ todos, nextId }`, and each todo is `{ id,
      text, done }`.


      `add` appends `{ id: nextId, text, done: false }` and adds 1 to `nextId`. `toggle` flips
      `done` on the todo with that `id`. `remove` drops it.


      Never change the old state: the tests freeze it. Todos you don't touch stay the same
      objects.
    hints:
      - One `if` per `action.type`, each returning a new state object.
      - "`map` builds the toggled list, and `filter` builds the list without the removed todo."
      - "Start with `if (action.type === 'add') {` and build the new todo from `state.nextId`."

  - type: prose
    id: url-state
    body: >-
      Some state belongs in the address. With `?tab=reviews` in the query string, a reload
      keeps the tab, and a shared link opens it too. That's **URL state**. `location.search`
      holds that part of the address, and `URLSearchParams` from chapter 3 reads it.


      `history.replaceState(null, '', '?tab=reviews')` changes the address without a reload. Compare **localStorage**, a small text store the browser keeps per site. It survives a reload, but it never leaves that browser.

  - type: fill-blank
    id: fill-url-tab
    concept: react.url-state
    difficulty: 2
    language: js
    prompt: >-
      Keep the open tab in the address, so a reload or a shared link keeps it. Fill the gaps.
    template: |
      const params = new URLSearchParams(location.search);
      const tab = params.{{1}}('tab') ?? 'details';

      function choose(next) {
        params.{{2}}('tab', next);
        history.replaceState(null, '', '?' + params.{{3}}());
      }
    blanks:
      - key: '1'
        answer: get
      - key: '2'
        answer: set
      - key: '3'
        answer: toString
    bank: [get, getItem, set, setItem, toString, join]

  - type: ai-review
    id: review-tab-in-storage
    concept: react.url-state
    difficulty: 3
    language: tsx
    request: Keep the product tab when people share the page's link.
    flawClass: edge-case
    code: |
      function ProductTabs() {
        const [tab, setTab] = useState(localStorage.getItem('tab') ?? 'details');
        function choose(next: string) {
          localStorage.setItem('tab', next);
          setTab(next);
        }
        return <Tabs value={tab} onChange={choose} />;
      }
    prompt: >-
      An assistant wrote this. Its test picks Reviews, reloads, and sees Reviews. A friend
      opens the shared link and sees Details. Tap the line at fault.
    lines: [4]
    reasons:
      - text: The tab is saved in this browser, not the link
        correct: true
        feedback: >-
          Yes. The friend's browser has no saved tab, so they see Details.
      - text: '`setTab` should run before saving'
        feedback: >-
          The order doesn't matter here. Wherever it's saved, the link never carries it.
      - text: '`localStorage` is cleared on reload'
        feedback: >-
          It survives a reload, which is why the test passed. But it never leaves that browser.
    fix: |
      function ProductTabs() {
        const params = new URLSearchParams(location.search);
        const [tab, setTab] = useState(params.get('tab') ?? 'details');
        function choose(next: string) {
          params.set('tab', next);
          history.replaceState(null, '', '?' + params.toString());
          setTab(next);
        }
        return <Tabs value={tab} onChange={choose} />;
      }

  - type: multiple-choice
    id: pick-state-home
    concept: react.url-state
    difficulty: 3
    question: >-
      On a film site, people send each other links to their search results. Where should the
      search text live?
    choices:
      - text: In the URL's query string
        correct: true
        feedback: >-
          Yes. The link carries the search, so the friend sees the same results.
      - text: In the search box's own state
        feedback: >-
          That's lost on reload, and a shared link knows nothing about it.
      - text: In context at the top of the app
        feedback: >-
          Context shares a value inside one open page. It's gone on reload and never travels.
      - text: In localStorage
        feedback: >-
          It survives a reload, but only in that browser. The friend's link opens an empty
          search.

  - type: explain-back
    id: explain-reducer-or-state
    concept: react.reducers
    difficulty: 4
    prompt: >-
      A booking form has five `useState` values, and four handlers each change several of
      them. Why might a reducer make it easier to work on?
    rubric:
      - Every rule for changing the state lives in one function instead of four handlers.
      - Handlers only dispatch what happened, so they stay short and hard to get wrong.
      - The reducer is a plain function, so each action can be tested without rendering.
    modelAnswer: >-
      Right now the rules are spread over four handlers, and each one must remember to update
      every related value. With a reducer, the handlers only say what happened, like `{ type:
      'change-date' }`. The reducer decides what that means for all five values, in one
      place. And because it's a plain function from state and action to state, you can test
      each action without a component.

recap:
  - Move scattered update rules into a reducer, and send it actions with `dispatch`.
  - Test a reducer as a plain function, never changing the state it's given.
  - Keep state that a reload or a shared link should carry in the URL.

recall:
  - id: card-reducer-rule
    concept: react.reducers
    front: What must a reducer never do with the state it's given?
    back: >-
      Change it. It returns a new state object and leaves the old one as it was.
  - id: card-dispatch-queue
    concept: react.reducers
    front: >-
      A click calls `dispatch({ type: 'add' })` twice, with the count at 0. What's the count after?
    back: >-
      2. React queues both actions and runs each one on the latest state.
  - id: card-url-survives
    concept: react.url-state
    front: Why does `?tab=reviews` survive where `localStorage` doesn't?
    back: >-
      It's part of the address, so a reload and a shared link both carry it. `localStorage` stays
      in one browser.
  - id: card-replace-state
    concept: react.url-state
    front: What does `history.replaceState(null, '', '?tab=reviews')` do?
    back: >-
      It changes the address to `?tab=reviews` without loading a new page, and without adding a
      Back step.

