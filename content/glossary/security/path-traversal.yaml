term: path traversal
aka: [directory traversal, zip slip, dot-dot-slash attack]
short: Using a file name with ../ in it to reach files outside the folder the code meant to use.
explain: |
  A download endpoint builds a path from a name in the URL. Ask for
  `../../etc/passwd` and the path climbs out of the uploads folder into the rest of the
  machine.

  Never build a path from a name someone else typed. Store files under random ids. Where a name is unavoidable, resolve the full path and check it stays inside the base
  folder. Refuse absolute paths too. Archives carry the same trap in their entry names,
  known as zip slip.
analogy: A library request slip that says "shelf 4, then out of the back door, then the manager's office". The clerk should refuse it.
example:
  language: ts
  code: |
    const base = path.resolve('uploads');
    const target = path.resolve(base, name);
    const rel = path.relative(base, target);
    if (rel.startsWith('..') || path.isAbsolute(rel)) {
      throw new Error('outside the uploads folder');
    }
usage: The export endpoint joins the file name from the query string; that's path traversal waiting to happen.
related: [file-signature, allowlist, sql-injection]
level: 2
lessons: [security.uploads-and-paths]
