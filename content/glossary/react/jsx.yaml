term: JSX
aka:
  - JSX element
short: HTML-like syntax inside JavaScript that describes elements, with braces for JavaScript values.
explain: |
  `<h1>Hi {name}</h1>` looks like HTML, but it's JavaScript. A build step turns each tag into
  a plain object that describes an element. React reads those objects and updates the page.

  A few things differ from HTML. `className` replaces `class`, and `htmlFor` replaces `for`.
  Braces take expressions, not statements, so you use `? :` or `&&` instead of `if`. And a
  component returns one root, so wrap siblings in a fragment, `<>...</>`.
analogy: A shopping list written as a sketch of the shelf. It's still only a list; someone else does the shopping.
example:
  language: jsx
  code: |
    const greeting = (
      <section className="card">
        <h1>Hi {user.name}</h1>
        {items.length === 0 ? <p>No items</p> : <List items={items} />}
      </section>
    );
usage: That JSX has an if inside the braces, which won't compile; use a ternary.
related:
  - component
  - props
level: 1
