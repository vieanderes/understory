term: flag argument
aka: [boolean flag parameter, boolean parameter, boolean trap, flag parameter]
short: A true-or-false argument that switches a function between two different behaviours.
explain: |
  `render(true)` tells the reader nothing at the call site. True what? And inside, the
  function is really two functions sharing a name, split by an `if`.

  Split it into two named functions, or pass an options object with a named field. Then
  the call reads as what it does: `renderPreview()`, or `render({ preview: true })`.
analogy: A light switch labelled only "1". You'll find out what it does when you press it.
example:
  language: ts
  code: |
    // before: what does true mean?
    sendEmail(user, true);
    // after
    sendEmail(user, { urgent: true });
usage: Drop the flag argument from `export`; make `exportCsv` and `exportPdf` instead.
related: [code-smell, intent-revealing-name, cohesion]
level: 2
lessons: [pro.amateur-tells]
