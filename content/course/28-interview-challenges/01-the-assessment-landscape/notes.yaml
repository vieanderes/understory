summary: >-
  A hiring process is a chain of rounds, and each round is a different test. A timed online
  test is a machine running hidden tests on your code. A levelled task is one project that
  grows over four levels. A live round is a person scoring how you think. An AI-assisted
  round adds a question about judgement: can you steer a tool and own what it wrote. A
  take-home and a build day are about scope, working software and defending decisions.


  The reason this matters comes down to effort. Practice transfers poorly between
  formats. Speed on array puzzles barely helps a four-hour build, and a polished README earns
  nothing from a hidden-test scorer. So the first job, before any practice, is to find out
  which rounds you face and how each one is scored.


  You find out by reading the invite closely and asking the recruiter. Recruiters expect the
  questions, and the answers change your week: the platform decides the editor and the
  language version, the AI rule decides whether you practise prompting or practise without
  help, and the scoring decides whether you optimise for tests passed or for the
  conversation.
remember:
  - >-
    Each format scores something different, so name the format first and practise for that
    format, not for "interviews" in general.
  - >-
    Machine-scored rounds (timed tests, levelled tasks) count hidden tests passed; people-scored
    rounds (live, AI-assisted, take-home, build day) grade reasoning, communication and
    decisions.
  - >-
    A live round is usually scored on four areas: communication, problem solving, technical
    competence in the code, and testing.
  - >-
    An AI-assisted round adds judgement: plan before prompting, verify every suggestion and be
    able to explain every line.
  - >-
    Take-homes and build days reward a working vertical slice, sensible scope, tests on the
    core logic, a README and the ability to defend each choice.
  - >-
    Ask, for every round: the platform, the language and version, the length and number of
    tasks, whether AI tools are allowed, and how it is scored.
  - >-
    AI rules differ between companies and between rounds of one company, so never carry an
    assumption from one round to the next.
  - >-
    Inside an online test, algorithmic tasks score correctness and speed, while coding tasks
    score correctness only, so read which type you have before choosing where to spend time.
sections:
  - title: What each format is really checking
    body: |-
      Every format exists because it answers one hiring question cheaply. Knowing the question
      tells you what to show.

      - **Timed online test.** "Can this person write correct, efficient code without help?"
        It filters many candidates at low cost. It rewards reading constraints, knowing the
        standard patterns and testing edge cases. It ignores style and explanation.
      - **Levelled task.** "Can this person build something that keeps working as
        requirements change?" It rewards a small, clear data model and changes made without
        breaking earlier tests.
      - **Live pair coding.** "What is it like to solve a problem with this person?" It
        rewards clarifying questions, a plan said aloud, steady progress and testing without
        being asked.
      - **AI-assisted round.** "Does this person stay in charge of the tool?" It rewards
        breaking a vague task down, narrow prompts, catching wrong output and fixing small
        things by hand.
      - **Take-home.** "What does this person ship when nobody is watching?" It rewards a
        working slice, scoping judgement, tests and a README that states trade-offs.
      - **Build and present.** "Can this person make and defend decisions under time?" The
        questions after the demo often weigh more than the code.

      A useful test for any practice session: which of these questions does it help you
      answer better? If the answer is none of the rounds you face, change the session.
  - title: A playbook from invite to first practice session
    body: |-
      Run this the day an invite arrives. It takes under an hour and saves days of the wrong
      practice.

      1. **Read the invite for facts.** Length, number of tasks, who scores (a machine or a
         person), the platform name, and any mention of AI tools.
      2. **Name the format** from the six. If two fit, ask.
      3. **Send the recruiter a short list of questions.** Keep it to five or six lines.
      4. **Check the environment.** Open the platform's demo if there is one. Note the
         language version, whether you can run code, whether you can add your own tests and
         whether autocomplete exists.
      5. **Sit one timed rehearsal in the same format** before any broad practice. It shows
         where the time goes.
      6. **Plan the week around the gaps** the rehearsal exposed, not around what feels
         productive.

      A reply to a recruiter can be this short:

      ```text
      Thanks for the invite. A few questions so I can prepare well:
      - Which platform, and which language versions are available?
      - How long is the round, and how many tasks?
      - Are AI assistants allowed in this round? If so, which ones?
      - Is it scored by automatic tests, an interviewer's rubric, or both?
      - Can I run my code and add my own test cases during the round?
      ```

      Asking the same questions for each later round is normal. Rules change between stages,
      and a recruiter would rather answer than see you disqualified.
  - title: How seniority changes what the same round expects
    body: |-
      The formats look the same for mid-level and senior candidates. The bar moves inside
      them.

      In a **timed test** the bar is mostly the score, but a senior candidate is expected to
      reach the intended complexity, not a brute force. In a **live round** the senior signals
      are edge cases raised before the interviewer raises them, trade-offs stated as "my
      default, what would change it, how it fails", and code that extends cleanly when the
      next requirement arrives. In a **levelled task** it shows as a level 1 design that does
      not need a rewrite at level 4.

      In **AI-assisted rounds** seniority shows as restraint and verification. You plan
      before you prompt, ask for pieces you can review, run the tests, and fix a one-character
      bug yourself instead of prompting again. In **take-homes and build days** it shows in
      what you left out on purpose and whether you can say why, and in naming what breaks
      first under load.

      Across all of them, the senior habit is the same: make the implicit explicit. Say the
      assumption, the constraint and the trade-off out loud or in writing, so the reviewer can
      score your judgement instead of guessing at it.
  - title: Where the effort goes in a mixed process
    body: |-
      Many processes mix three or four formats: an online test to screen, a live round or two,
      then a build or a system design conversation. With a few days left, split practice by
      how much each round can end the process and how far you are from its bar.

      - **Screens end processes fastest.** A failed online test means no later round, so a
        few timed rehearsals in the exact platform come first if one is scheduled.
      - **Live rounds reward a script.** Rehearsing the round script aloud on two or three
        problems is worth more than solving ten silently.
      - **Builds reward a plan.** A written plan for the first 30 minutes, a README template
        and a rehearsed 10-minute talk structure remove the biggest risks before the day.
      - **AI rounds reward a habit.** Practise one session where you say the plan before every
        prompt and run the tests after every accepted suggestion.

      The trap is practising what feels comfortable. Puzzles feel measurable, so people
      overdo them. If the process has no online test, puzzles are the least useful hour you
      can spend.
  - title: Task types inside a timed online test
    body: |-
      A timed online test is not one kind of task. A typical assessment platform's task
      library sorts its tasks into types, and each is scored differently:

      - **Algorithmic.** A puzzle with large inputs, scored on correctness and on speed,
        sometimes memory. Read the limits and aim for O(n) or O(n log n).
      - **Coding.** A normal function to write, scored on correctness only, over several
        hidden test groups. There are no speed tests, so edge cases carry the points.
      - **Multi-stage.** Sub-tasks that get harder, with partial credit per stage. Finish and
        submit each stage before you start the next.
      - **Bug-fixing.** Working code with one bug, where you may change only two or three
        lines. Find it with a failing test and make the smallest fix.
      - **Business context.** A coding task told as a story about an industry: bookings,
        deliveries, a clinic. The story is decoration. Translate it into inputs, outputs and
        limits first, then solve the plain task underneath.
      - **AI-native.** Work with LLM tools directly, or build a small AI feature. The AI
        builds in this chapter train it.
      - **AI literacy quiz.** Multiple choice on machine-learning basics, LLM frameworks and
        responsible AI. It is scored automatically, and revising the AI chapters covers it.
      - **Regex or SQL.** Short pattern or query tasks, usually only when the role lists
        them.

      For a senior AI engineering role, expect an algorithmic or multi-stage task, possibly
      an AI-native one, and often the assistant switched on. Ask the recruiter which types
      the test holds, because a coding task and an algorithmic task need different habits:
      one rewards a careful corner-case table, the other the right complexity.
  - title: A two-week plan before an online test
    body: |-
      About an hour and a half a day. The rhythm is new material, then redoing the older
      tasks from memory, because retrieval the next day is what makes a pattern stick.

      - **Day 1.** Approaching a problem, and the TypeScript you'll type: `Map`, `Set`,
        array methods, narrowing.
      - **Day 2.** Hash maps and stacks: two sum, grouping anagrams, balanced brackets.
      - **Day 3.** Sliding window and sort-first intervals. Redo day 2 from memory.
      - **Day 4.** Counting and binary search.
      - **Day 5.** Grids with BFS and DFS, and the LRU cache. Redo days 3 and 4.
      - **Day 6.** Async: retry with backoff and jitter, a promise pool, a token bucket.
      - **Day 7.** Rest, or redo whatever felt shaky.
      - **Day 8.** Cosine similarity with top k, and a sentence chunker.
      - **Day 9.** The streaming parser and sampling.
      - **Day 10.** The RAG build.
      - **Day 11.** The production LLM client.
      - **Day 12.** The agent loop.
      - **Day 13.** The technical question banks, answered out loud in under a minute each.
      - **Day 14.** A mock: two random tasks, 45 minutes each, talking the whole time.

      For each task: read it, close the solution, and try for 15 minutes, even on paper.
      Being stuck is part of the learning. Then read the solution, and type it again from
      memory the next day. If you can't, try again the day after.

pitfalls:
  - >-
    **Preparing for "the interview" instead of a round.** One practice diet for every format
    wastes most of the effort. Name each round's format from the invite and pick practice
    that matches it.
  - >-
    **Assuming the AI rule from the last round.** Some companies allow assistants in one stage
    and forbid them in another. Ask for every round, and treat silence as "not allowed" until
    someone confirms.
  - >-
    **Not checking the language version.** Platforms pin older runtimes, and a recent API may
    not exist there. Check the version in the demo or ask, then avoid anything newer.
  - >-
    **Coding in silence in a live round.** The interviewer can only score what they hear. Speak
    at checkpoints: the plan, each helper's purpose, the tests you are about to run.
  - >-
    **Treating a take-home as a feature race.** Reviewers reward a finished core path, tests and
    clear trade-offs over many half-built features. Decide the three must-haves first and stop
    adding when they work.
interview:
  - question: >-
      Before we begin, do you have any questions about this round?
    answer: >-
      Yes, three quick ones, because they change how I work. First, how is it scored: should I
      aim for a working solution first and then optimise, or is the optimal complexity
      expected? Second, can I run code and add my own test cases? Third, are AI tools allowed
      here, and if so, is there anything you would like me not to use them for? I also
      confirm the language version, so I avoid APIs the environment may not have. Asking takes
      a minute and prevents me optimising for the wrong thing. If the answer is "it's up to
      you", I say my default out loud: correct first, then faster, with tests throughout.
  - question: >-
      How would you use an AI assistant in this round?
    answer: >-
      As a fast pair for pieces I can check, not as the author of the solution. I say my plan
      first, so there is a standard to judge its output against. Then I ask for narrow things:
      boilerplate, a test scaffold, one API I cannot recall. I read every suggestion before
      running it, run the tests after accepting it, and fix small mistakes by hand rather than
      prompting again. I keep the core logic and the tricky edge cases in my own hands,
      because that is what I would be accountable for in production. The trade-off is speed:
      I will sometimes type something the tool could have produced, but I will be able to
      explain every line.
  - question: >-
      You have a four-hour take-home. How do you spend the time?
    answer: >-
      I protect a working core path first and spend the last hour on evidence. The first 20
      minutes go on the brief: questions, written assumptions and three must-haves. Then a thin
      skeleton that runs end to end, UI to API to data, within about 15 minutes. The middle
      two hours build the core path, committing in small steps. After that come error, empty
      and loading states, then tests on the core logic, then a README with how to run it, the
      assumptions, trade-offs and next steps. The last 20 minutes are a clean-machine run and
      a rehearsal. What I drop first is breadth: extra features lose to a finished, tested
      core every time.
  - question: >-
      Which kind of interview do you think shows your ability best, and why?
    answer: >-
      A practical build with a conversation afterwards, because it is closest to the job. It
      shows scoping, working code, tests and the reasoning behind each decision. That said, I
      prepare for each format on its own terms. For a timed test I practise the standard
      patterns and edge cases under a clock. For a live round I rehearse thinking aloud. The
      honest trade-off is that puzzles measure something real, fluency under pressure, but
      only part of the work. I would rather show both than argue about which is fairer.
