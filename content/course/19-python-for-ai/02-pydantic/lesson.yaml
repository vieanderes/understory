deepDive: >-
  **Checked with Pydantic 2.10 on Python 3.12**, the versions the browser build of Python
  ships. The code challenge runs real Pydantic in your browser. The first run downloads it,
  about 2 MB, and later runs start at once, offline too. Everything shown runs as printed
  on a machine with `uv add pydantic`.


  **Lax and strict.** By default Pydantic converts where no data is lost: `"3"` and `3.0`
  become `3`, `"false"` becomes `False`. `2.5` for an `int` fails, since data would be
  lost. Set `model_config = ConfigDict(strict=True)` to refuse every conversion.


  **Old names.** Pydantic 1 used `parse_raw` and `.dict()`. Version 2 still runs them with
  a deprecation warning, and assistants trained on old code still write them. Use
  `model_validate_json` and `model_dump`.


  **Settings order.** A real environment variable beats a value in a `.env` file, which
  only fills gaps. `model_json_schema()` turns a model into JSON Schema, which is how an
  SDK tells a language model what shape to reply in.
