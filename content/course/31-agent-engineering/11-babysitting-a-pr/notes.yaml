summary: >-
  Most of the time a pull request spends open is waiting: for CI, for a reviewer, for
  someone to notice a red tick. A coding agent can do that waiting for you. You give it a
  **standing goal**: check this PR every hour, fix red CI on its own branch, answer new
  comments, re-run the checks, refresh the proof and post a short status.


  An agent that keeps coming back needs the same safety as any long loop, plus a few of its
  own. It needs a **done state** (approved and green, with proof on the head commit), a
  **budget** of runs, and a **stop when stuck**, such as the same failure twice, that hands
  the PR to a person. It needs **watch gates**: what it may do alone, what it must ask
  about, and what it never does, such as merging or loosening a check.


  The last piece is **revalidation**. Every commit the watcher pushes makes its earlier
  proof stale, so it proves the change again before it says ready. Reach for a watcher when
  a PR is blocked on routine fixes. Don't use one to push through a change nobody has
  agreed on.
remember:
  - A standing goal needs a done state, a run budget and a stop when stuck, or the agent checks the PR for ever.
  - The done state is approved, green and proven on the head commit, not just a green tick.
  - Gate the watcher in three lists, alone, ask first and never, and enforce them in the harness and in the platform's branch rules.
  - A watcher never merges, deploys, force-pushes someone else's branch, loosens a check or resolves its own review.
  - Re-run a flaky job once at most; re-running until green turns an intermittent bug into a passing PR.
  - Proof belongs to one commit, so every fix, rebase or push makes it stale and the checks run again.
  - The same failure twice means the agent's fix isn't working, so it stops and hands off with what it tried.
  - Each run ends with a short status a person can read in ten seconds.
sections:
  - title: Writing the standing goal
    body: |-
      A standing goal is a prompt plus a schedule plus a policy. Keep them in one short
      file the harness reads on every run, so the rules don't drift between runs.

      ```yaml
      goal: Get the booking-form PR approved with CI green
      pr: 412
      every: 1h
      done_when: [approved, ci_green, proof_on_head]
      stop_when: [runs >= 12, same_failure_twice, pr_closed]
      alone: [push_own_branch, reply_to_comments, rerun_flaky_job_once]
      ask_first: [edit_outside_scope, change_dependency, disagree_with_reviewer]
      never: [merge, deploy, force_push_others, loosen_a_check, resolve_own_review]
      status: one comment per run, under five lines
      ```

      Each run starts fresh. It loads the PR, the policy and its own notes from the last run,
      which say what it tried and which failure fingerprints it has seen. That's the same
      checkpoint idea as Loops that run for hours, stretched across hours of wall time
      instead of one process.

      The schedule matters less than the stop. Hourly is fine for most PRs. What makes a
      watcher safe is that it stops on its own: when the PR is done, when the budget runs
      out, or when it's stuck. "Stuck" is concrete: the same test failing with the same
      first error line twice after the agent's fixes.

      A hand-off is a message, not a silence. It says why the watcher stopped, what it tried,
      the last failure and the one thing it would try next. A person can pick it up cold.
  - title: Gates that hold even when the agent is wrong
    body: |-
      A gate the model is merely asked to respect is a wish. Put each list where the agent
      can't talk its way past it.

      - **The never list** lives in two places. The harness refuses those actions, and the
        platform refuses them anyway. On GitHub a token that can push can usually merge, so
        the token has no admin or deploy rights, branch rules keep it off the list of who may
        push to main, and a person must approve its most recent push.
      - **The ask-first list** pauses the run, as in Designing the human's part. The watcher
        posts the question with its reason and ends the run. The next run reads the answer.
      - **The alone list** is short on purpose. Everything else is ask-first by default.

      Loosening a check is the sneakiest item. It looks like a fix: skip one test, raise a
      timeout, add a lint exception, lower a coverage bar. Each one turns red to green by
      changing the question. Teach the harness to spot it in the diff: a new skip marker, a
      changed threshold, an edited CI file. Any of those becomes ask-first, whatever the
      agent's reason.

      Resolving its own review thread is on the never list for a similar reason. The
      reviewer resolves their own comment. Otherwise the agent marks its homework.
  - title: Revalidation and the proof that goes with it
    body: |-
      Proof is a claim about one commit. Label it so. A status the watcher posts looks like
      this:

      ```text
      Run 5 of 12 on c41a9e2
      Fixed: date picker test (timezone at midnight), answered 2 comments
      Checks: pnpm test, 412 passed; pnpm lint, clean
      Screenshots: booking form at 390 and 1440, light and dark
      Waiting on: review from the form's owner
      ```

      The commit hash is the important part. A reviewer compares it with the PR's head. If
      they differ, the proof is stale, whatever it says.

      Match the proof to the claim, as Working with a coding agent on a real repo did with its gate. A
      layout fix needs fresh screenshots; a unit test doesn't show a screen. A fix for a
      race needs the test run several times, not once.

      Flaky tests deserve one honest rule. A job that fails and passes on one re-run is
      marked flaky in the status, so a person can fix or quarantine the test. A job that
      fails twice is a failure, and the watcher investigates it like any other.
pitfalls:
  - '**Stopping on the first green tick.** Green comes before review is finished. The done state is approved, green and proven on the head.'
  - '**Re-running until green.** It feels like handling flakiness, and it ships intermittent bugs. One re-run, then investigate.'
  - '**Posting the old proof after a fix.** The screenshot still looks right because it is from before the change. Label proof with its commit.'
  - '**A never list in the prompt only.** A confused agent can argue past a prompt. Let branch rules, not the prompt, stop it merging.'
  - '**Fixing a red check by changing the check.** A skipped test or raised threshold turns red to green without fixing anything. Make those diffs ask-first.'
  - '**A watcher with no budget.** A forgotten PR keeps a watcher busy for weeks. Cap the runs and hand off.'
verify:
  - lens: breaks
    check: A test that fails one run in three gets one re-run, then reaches a person, rather than looping until it passes.
  - lens: leaks
    check: Branch rules require a person to approve the watcher's latest push, and its token has no admin or deploy rights.
  - lens: tests
    check: A test feeds an approved, green PR with proof from an older commit and expects the watcher to refresh the proof.
  - lens: confuses
    check: Every status names the commit its proof ran on, so a reviewer can see at once whether it's stale.
  - lens: scales
    check: Watching thirty PRs at once still stays inside a total run budget, and each hand-off lands in one queue.
interview:
  - question: How would you let an agent look after a pull request without supervising it?
    answer: >-
      I'd give it a standing goal with a policy, not a vague instruction. Every hour it loads
      the PR, fixes red CI on its own branch, answers new review comments, re-runs the checks
      and posts a short status with proof. It stops when the PR is approved, green and proven
      on the head commit, after a fixed number of runs, or when the same failure comes back
      twice, and then it hands off with what it tried. What it may do is in three lists. It
      may push to its own branch and reply alone, it asks before touching other files or
      dependencies, and it never merges, deploys or loosens a check. The never list is also
      enforced by branch rules and the token's permissions. The trade-off is some lost speed on edge cases,
      which go to a person.
  - question: A teammate's agent re-runs failed CI jobs until they pass. What's wrong with that?
    answer: >-
      It hides real failures. A job that fails intermittently might be a flaky test, or it
      might be a race in the code. Re-running until green can't tell them apart, so a bug that
      fails one run in three ships behind a green tick. I'd allow one re-run. If it passes,
      the status marks the test flaky so someone can fix or quarantine it. If it fails again,
      it's a failure and the agent reads the log, fixes its branch or hands off. Retries also
      need a record, so you can see which tests flake and how often.
  - question: Why should an agent re-run all the checks after a small fix?
    answer: >-
      Because the proof it had describes the previous commit. A one-line change for a review
      comment can still break a test, change a screen or fail lint, and the old green tick
      would hide it. So every new commit, rebase or fix triggers the checks again, and the
      watcher refreshes the test output and screenshots. I'd make each status name the commit
      its proof ran on. Then a reviewer compares it with the PR's head in a second. The cost
      is CI time, which is cheap next to a reviewer approving code nobody has tested.
