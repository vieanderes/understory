term: CSS reset
aka: [reset style sheet, reset, normalise]
short: A few rules at the top of a style sheet that undo the browser's surprising default styles.
explain: |
  Every browser ships its own style sheet. It gives `body` a margin, sizes boxes in a way
  that makes widths hard to predict, and lets images stick out of their containers. Those
  defaults surprise you halfway through a layout.

  So pages start with a short set of rules that fix the worst of it. A modern one is small:
  `box-sizing: border-box`, no body margin, images that never overflow, form controls that
  inherit the font. Keep it short. A reset that wipes every style also wipes useful ones,
  like the focus outline.
analogy: Clearing the desk before you start. You keep the lamp, and move the clutter.
example:
  language: css
  code: |
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
usage: "Add `max-width: 100%` for images to the CSS reset, because the photo is causing sideways scroll."
related: [box-model, cascade, focus-indicator]
level: 2
lessons: [css.build-a-page]
