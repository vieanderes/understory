deepDive: >-
  Margins don't collapse inside a flex or grid container, and left and right margins never
  collapse. So a list that turns into a flex column can suddenly show double gaps. The `gap`
  property, which you'll meet with flexbox, spaces items without margins at all.


  When a negative margin touches a positive one, the merged margin is the largest positive
  plus the most negative. So 24px and -8px give 16px.


  Percentages for padding and margin, even the top and bottom ones, are worked out from the
  parent's width. It was once the usual way to keep a video box in shape. `aspect-ratio: 16 /
  9` now says it directly.


  In JavaScript, `getBoundingClientRect()` gives the border box after transforms, in
  fractions of a pixel. `offsetWidth` gives the border box, rounded. `clientWidth` gives the
  padding box without the scroll bar.
