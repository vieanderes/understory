term: audit log
aka: [audit trail, audit logging]
short: An append-only record of who did what, when, and on whose authority.
explain: |
  When an agent refunds an order, someone will later ask why. An audit log answers. It
  records who asked, what was proposed, who approved it and what ran, with times.

  Entries are only ever added, never changed or deleted, and the log is kept apart from
  the system it describes. Keep personal data in it to the minimum the purpose needs.
analogy: A ship's logbook. Every entry stays, in order, and nobody tears out pages.
usage: Every tool call the agent makes goes to the audit log, with the approver's id.
twin:
  term: structured-logging
  difference: Logs help engineers debug and can be sampled or dropped. An audit log is a complete, permanent record kept to explain actions.
related: [least-privilege, human-in-the-loop, event-sourcing, structured-logging]
level: 2
lessons: [sysdesign.case-ai-agent]
