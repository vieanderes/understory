deepDive: >-
  Everything here ran in September 2026. The region timings came from `curl` 8.7 on a laptop
  in Europe, against the public EC2 endpoints. `%{time_connect}` is the time until the TCP
  connection was open, before any TLS. Your numbers will differ, but the gap between a near
  region and a far one won't. Sydney was about six times slower than London here.


  The `localhost` catch ran in Docker 28 with `node:24-slim` and `@hono/node-server` 2.1.1,
  published with `-p 3000:3000`. With `hostname: "127.0.0.1"`, the log said "Listening"
  and `curl` from the laptop got "Connection reset by peer". Inside the container the same
  request worked. Without `hostname`, Node listens on every address, and `curl` printed
  `{"message":"Hello"}`. The `PORT` case gave the same reset: the app listened on 3000
  while traffic went to 8080.


  Platforms name the variable the same way. Heroku, Render and Google Cloud Run all set
  `PORT`. Some add `HOST` too. A region is further split into zones, separate data centres a
  few kilometres apart, so one fire or power cut doesn't take out the region. Lesson 13
  compares the kinds of hosting you can rent.
