term: hash set
aka: [ set data structure, Set ]
short: A collection of unique values that tells you in one step whether a value is in it.
explain: |
  Often you don't need to store anything about a value. You only need to know whether
  you've met it before. A list can answer, but it checks every item.

  A hash set answers in O(1) on average, and keeps one copy of each value. In JavaScript
  it's `Set`; in Python it's `set`. It's the usual "seen" set in BFS, DFS and duplicate
  checks.

  The trap is objects. Two arrays with the same contents are different keys, because the
  set compares references. Turn them into a string key first.
analogy: A guest list with a tick box. Either the name is ticked or it isn't, and nobody is on it twice.
example:
  language: js
  code: |
    function firstRepeat(words) {
      const seen = new Set();
      for (const word of words) {
        if (seen.has(word)) return word;
        seen.add(word);
      }
      return null;
    }
usage: Swap `includes` for a hash set and the check inside the loop drops from O(n) to O(1).
twin:
  term: hash-map
  difference: A hash set holds keys only and answers yes or no. A hash map holds a value against each key, so it can also say how many or where.
related: [ hash-map, hidden-quadratic, breadth-first-search, space-complexity ]
level: 1
