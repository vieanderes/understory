term: subagent
aka:
  - sub-agent
  - worker agent
short: A helper agent started by another with its own fresh context, which returns only its conclusion.
explain: |
  Reading forty files to answer one question fills an agent's context with forty files. Most
  of it is useless once the answer is known.

  So the main agent hands the job to a helper. The helper starts clean, does the reading in
  its own context, and returns a short answer. The main agent keeps the conclusion, not the
  pile.

  Each one costs tokens and adds a way to fail. The helper knows only what it's told. Write it a clear brief, cap how many run, and share one
  budget.
analogy: Sending a colleague to the archive. They come back with the answer, not with every box they opened.
usage: Spawn a subagent to search the logs, so the main context only gets the three lines that matter.
related:
  - agent
  - context-engineering
  - harness
level: 2
lessons:
