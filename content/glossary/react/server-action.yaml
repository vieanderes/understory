term: Server Action
aka: ["'use server'", Server Function]
short: A function marked to run on the server, which a form or button calls as if local.
explain: |
  Saving a form used to mean writing an endpoint, then a fetch to call it, then the
  plumbing in between. Here you write one function and pass it to the form.

  A function marked `'use server'` stays on the server. Next.js gives it a hidden address
  and sends each call as a POST. That address is public, so anyone can call it with any
  data. Check who is asking, every field, and that the record belongs to them, inside the
  action itself.
analogy: A suggestion box in the hallway. It looks private, but anyone walking past can post anything in it.
example:
  language: tsx
  code: |
    'use server';

    export async function renameList(formData: FormData) {
      const user = await requireUser();
      const name = z.string().min(1).parse(formData.get('name'));
      await db.list.update({ where: { id: formData.get('id'), ownerId: user.id }, data: { name } });
      updateTag('lists');
    }
usage: The Server Action never checks the owner, so anyone can rename anyone's list.
twin:
  term: route-handler
  difference: A Server Action is a function your own UI calls, with the POST hidden from you. A route handler is an endpoint at a URL you choose, for any caller.
related: [route-handler, progressive-enhancement, authorisation, cache-tag]
level: 2
lessons: [nextserver.server-actions]
