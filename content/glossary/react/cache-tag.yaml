term: cache tag
aka: [cacheTag, updateTag, revalidateTag, on-demand revalidation]
short: A label on stored results, so one call can throw away every result carrying that label.
explain: |
  A product's name appears on its page, in search results and in a sidebar. When it
  changes, all three cached copies are wrong. Hunting them down one by one is error-prone.

  Label each cached result with `cacheTag('products')`. After a save, `updateTag('products')`
  in a Server Action discards every result with that label, so the next visit rebuilds
  them. It reaches the server's cache only: a page already open in a tab doesn't change.
analogy: Colour-coded stickers on files. When the policy changes, you pull every file with a red sticker.
example:
  language: ts
  code: |
    'use server';
    import { updateTag } from 'next/cache';

    export async function saveProduct(data: FormData) {
      await db.product.update(parse(data));
      updateTag('products');
    }
usage: The cache tag is never updated after a save, so the old price stays up for an hour.
related: [use-cache, cache-invalidation, server-action, incremental-static-regeneration]
level: 3
lessons: [nextserver.caching]
