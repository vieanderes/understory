deepDive: |-
  The trace in this lesson comes from Node 24, a program that runs JavaScript outside a
  browser, with the file paths shortened. Run the same file as a plain script and two things
  change. Node names the file's top level `Object.<anonymous>`, and it adds lines for its own
  code below yours. Skip those, and start from the first line that names your file.

  Browsers word some messages differently. Safari's reference error reads
  `Can't find variable: task`. The kind and the line still point the same way.

  V8, the engine inside Node and Chrome, records the stack when an `Error` is created, not
  when it's thrown. A trace also stops at 10 lines by default, because
  `Error.stackTraceLimit` is 10. A deep chain of calls can push your own code off the end.

  Stuck after reading the trace? The lesson Asking a question people can answer shows how to
  pass on an error, its trace and what you've tried. Then someone can help on the first reply.
