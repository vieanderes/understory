    verified: true

deepDive: >-
  A 10 to 15 minute plan: the problem and what success means (1 minute); the constraint and
  your scoping call (1 minute); a diagram and two or three decisions, each with the option
  you rejected (3 minutes); a live demo of one realistic path (4 to 5 minutes); evidence from
  tests, evals and known gaps (2 minutes); what you'd do next, then invite the hardest
  question. Leave a third of the slot for questions.


  Rehearse answers to these, out loud:


  - Why X over Y?

  - What breaks first, and how would you know?

  - What happens at a hundred times the load?

  - What did you leave out on purpose?

  - Walk me through this function.

  - How did you test it?

  - Where did AI help, and how did you check it?

  - What would you do with another day?

  - How would you handle security, auth and personal data?


  The diagram needs only boxes and arrows for the one path you demo: the page, the API, the
  index and the model. Draw it before the talk, not live. "The team decided" ends a
  deep-dive round quickly, because it tells the panel you can't defend the call yourself.
  If a decision was wrong, say so and say what you'd do instead. That reads as seniority,
  not weakness.


  Two lessons on explaining your work practise the talk itself. "Talking through a
  diagram" covers walking a panel along one path, box by box. "Saying it plainly" covers
  putting each decision in words a listener follows the first time.
