    verified: true

deepDive: >-
  The runs behind this lesson: a page whose basket updates 200 to 600 ms after a click, at
  random. The fixed 300 ms wait passed 1 of 10 runs, then 2 of 10. The retrying `toBeVisible`
  passed 10 of 10, every time, and finished as soon as the text landed. The `eventually` in
  the challenge is a small version of that retry; Playwright's own is `expect.poll` and
  `expect(...).toPass()`.


  Playwright can retry a failed test and mark it "flaky" if the retry passes. That keeps CI
  green and hides the problem. Turn retries on to keep shipping, and read the flaky list as a
  bug list.


  Locator order of preference: role, then label, then placeholder or text, then a test id as
  the last resort. A test id is invisible to users. A test that leans on it can pass while the
  button has no name at all.
