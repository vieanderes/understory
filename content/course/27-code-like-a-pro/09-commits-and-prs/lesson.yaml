id: pro.commits-and-prs
title: Commits and pull requests like a pro
objective: Make atomic commits with clear messages, write pull request descriptions reviewers can act on, and keep a useful README.
level: essential
minutes: 10
concepts: [pro.atomic-commits, pro.pr-descriptions, pro.project-readme]
prerequisites: [tooling.remotes]
opening:
  text: >-
    You'll leave a history that explains itself and pull requests that get reviewed fast.
    It's often the first thing a new team sees of your work.

steps:
  - type: prose
    id: atomic-commits
    body: |-
      You can commit, push and open a pull request. Now make each commit clear to a reader. An
      **atomic commit** makes one change, and the code still works after it.

      Its first line, the subject, is short and reads like an order:

      ```bash
      $ git log --oneline
      2fb71a3 Add guest count to the bookings page
      6b51978 Fix past bookings missing today's date
      b67ea02 Add booking list
      ```

      Test it by finishing "This commit will...". A body after a blank line says why.

  - type: multiple-choice
    id: pick-commit-message
    concept: pro.atomic-commits
    difficulty: 1
    question: Which commit subject helps someone reading the history in a year?
    choices:
      - text: '`Fix past bookings missing today''s date`'
        correct: true
        feedback: >-
          Yes. It says what changed, as an order: "This commit will fix...".
      - text: '`fixed stuff`'
        feedback: >-
          It's true, but a year from now nobody will know which stuff.
      - text: '`WIP`'
        feedback: >-
          Short for work in progress. In shared history it tells the reader nothing.

  - type: prose
    id: what-a-hunk-is
    body: |-
      Sometimes one file holds two changes: a bug fix and a new feature. Git splits a file's
      changes into **hunks**, blocks of nearby changed lines. `git add -p` shows them one at a
      time and asks about each:

      ```text
      -  return booking.date < today;
      +  return booking.date <= today;
      (1/2) Stage this hunk [y,n,q,a,d,k,K,j,J,g,/,e,p,P,?]?
      ```

      Answer `y` to stage it or `n` to leave it for later. The rest of the letters can wait.

  - type: fill-blank
    id: fill-add-patch
    concept: pro.atomic-commits
    difficulty: 2
    language: bash
    prompt: >-
      `bookings.js` holds the date fix (hunk 1) and a new `guestCount` function (hunk 2).
      Stage only the fix, then commit it.
    template: |
      $ git add {{1}} bookings.js
      (1/2) Stage this hunk [y,n,...]? {{2}}
      (2/2) Stage this hunk [y,n,...]? {{3}}
      $ git commit -m "Fix past bookings missing today's date"
    blanks:
      - key: '1'
        answer: '-p'
      - key: '2'
        answer: 'y'
      - key: '3'
        answer: 'n'
    bank: ['-p', '.', 'y', 'n', 'q']

  - type: parsons
    id: arrange-commit-series
    concept: pro.atomic-commits
    difficulty: 3
    language: text
    prompt: >-
      Prices should show as "£4.50" everywhere. Order the commits so the code works after
      every one. One block doesn't belong.
    blocks:
      - id: add-helper
        code: Add formatPrice helper
        subgoal: Build the new piece
      - id: use-helper
        code: Show basket prices with formatPrice
        subgoal: Use it
      - id: remove-old
        code: Remove the old price code
        subgoal: Clean up
    distractors:
      - id: all-in-one
        code: Add formatPrice, use it and remove old code
        feedback: Three changes in one commit can't be reviewed or undone apart.
      - id: wip
        code: More price changes
        feedback: A vague subject hides what the commit does. Each commit says its change.

  - type: prose
    id: pr-descriptions
    body: |-
      A pull request also needs a **description**, the text above the changes. Four
      headings, one short line each:

      ```text
      Why: Stays booked for today showed as upcoming.
      What changed: isPast() compares with <= instead of <. Test for today added.
      Validation: npm test, 24 passed, including the new test.
      Proof: the npm test output, pasted below.
      ```

      **Validation** says what you ran, with the command. **Proof** is what a reviewer can
      open: test output, screenshots at desktop and phone widths, a recording, logs. Never
      let it outgrow the diff, and never claim a check nobody ran.

  - type: ai-review
    id: review-pr-description
    concept: pro.pr-descriptions
    difficulty: 3
    language: text
    request: Write the pull request description for my bookings fix. Here's the diff and my test run.
    flawClass: hallucinated-api
    code: |
      Fix past bookings missing today's date

      Why: This change addresses an issue where bookings made for the
      current day were not treated as past, which could confuse guests
      and staff who look at the bookings list.
      What changed: isPast() in bookings.js now compares with <= instead
      of <, so a stay booked for today counts as past, with a new test.
      Also checked by hand in Safari and on a phone, and it all works.
      Validation: npm test, 24 passed, including the new test.
      Proof: the npm test output, pasted below.
    prompt: >-
      Your diff is 6 lines. The assistant saw it and your `npm test` run, nothing else.
      Tap the line to cut before you post.
    lines: [8]
    reasons:
      - text: It claims checks that nobody ran
        correct: true
        feedback: >-
          Right. Nobody opened Safari or a phone. Cut it, or go and check.
      - text: It belongs under Validation instead
        feedback: >-
          Moving it doesn't make it true. Nobody opened Safari or a phone, so it goes.
      - text: The Why needs a longer story
        feedback: >-
          The opposite. Eight lines for a 6-line diff is already too many. One line says why.
      - text: Validation should say "All tests pass"
        feedback: >-
          That's vaguer. The command and the count let a reviewer run it again and compare.
    verify:
      question: Which test should the Validation line name?
      choices:
        - text: A stay booked for today shows as past
          correct: true
          feedback: >-
            Yes. Today is the only date where `<` and `<=` differ.
        - text: A stay booked for tomorrow shows as upcoming
          feedback: >-
            Worth keeping, but it passed before the fix. It can't prove the change.
        - text: A stay from last week shows as past
          feedback: >-
            That passed with `<` as well. Only the edge proves it.
    fix: |
      Fix past bookings missing today's date

      Why: Stays booked for today showed as upcoming.
      What changed: isPast() compares with <= instead of <. Test for today added.
      Validation: npm test, 24 passed, including "a stay booked today is past".
      Proof: the npm test output, pasted below. Not checked by hand.

  - type: prose
    id: readme
    body: |-
      The **README** is a file at the top of the repository, usually `README.md`. GitHub shows
      it on the project's front page. Its first screen answers three questions:

      - What is this, in one sentence?
      - How do I run it?
      - How do I run the tests?

      Longer notes link from there. An out-of-date README is worse than a short one.

  - type: multiple-choice
    id: pick-readme-first-screen
    concept: pro.project-readme
    difficulty: 2
    question: A new teammate opens your repository. What must the README show first?
    choices:
      - text: What it is, and how to run and test it
        correct: true
        feedback: >-
          Yes. They can get going in minutes and find the rest later.
      - text: The history of every design decision
        feedback: >-
          Useful, but it belongs in a linked page, not on the first screen.
      - text: A description of every function
        feedback: >-
          That belongs in comments next to the code. The README gets people started.

  - type: explain-back
    id: explain-atomic-value
    concept: pro.atomic-commits
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A bug appears a month later. Why is a history of atomic commits easier to work with than
      a few large mixed ones?
    rubric:
      - Each commit holds one change, so the one that caused the bug is quick to find.
      - That one commit can be undone without losing unrelated work.
      - Its subject says what it meant to do, which helps judge the fix.
    modelAnswer: >-
      With one change per commit, you can step through the history and land on the exact
      commit that broke things. You can undo that one commit and keep everything else. A
      mixed commit would drag unrelated work out with it. Its subject also says what the change
      was meant to do.

recap:
  - Commit one change at a time, with a subject that reads like an order.
  - Split one file's changes into separate commits with `git add -p`.
  - Describe a pull request by why, what changed, validation and proof, never longer than the diff.
recall:
  - id: card-atomic
    concept: pro.atomic-commits
    front: What makes a commit atomic?
    back: >-
      It makes one change, and the code still works right after it.
  - id: card-add-patch
    concept: pro.atomic-commits
    front: How do you commit only part of the changes in one file?
    back: >-
      `git add -p` the file, answer `y` or `n` for each hunk, then commit.
  - id: card-pr-description
    concept: pro.pr-descriptions
    front: What four headings does a good pull request description have?
    back: >-
      Why, what changed, validation and proof, one short line each. Proof is something a
      reviewer can open, such as test output with its command.
  - id: card-readme
    concept: pro.project-readme
    front: Which three questions does a README's first screen answer?
    back: >-
      What the project is, how to run it, and how to run its tests.

references:
  - kind: essay
    title: How to Write a Git Commit Message
    authors: Chris Beams
    year: 2014
    url: https://cbea.ms/git-commit/
    note: The seven rules behind short, imperative subject lines.
    primary: true
    verified: true
  - kind: docs
    title: Writing good CL descriptions
    authors: Google
    venue: Google Engineering Practices
    url: https://google.github.io/eng-practices/review/developer/cl-descriptions.html
    note: What a change description needs, with good and bad examples.
    primary: true
    verified: true
  - kind: docs
    title: git-add Documentation
    authors: The Git project
    venue: Git reference
    url: https://git-scm.com/docs/git-add
    note: Every answer at the `-p` prompt, including splitting and editing hunks.
    verified: true

deepDive: >-
  The `add -p` prompts here are real, from git 2.53. At the prompt, `s` splits a hunk into smaller ones and `e` lets you pick exact
  lines, for when two changes sit too close together. `q` stops and keeps what you've staged.


  Atomic commits pay off with two commands. `git revert` undoes one commit by adding a new
  commit that does the opposite. `git bisect` searches the history, halving it each time, for
  the commit that brought a bug in.


  Many teams squash a pull request into one commit when they merge it, so its title becomes
  the subject line. Conventional Commits adds prefixes such as `fix:` and `feat:` that tools
  read to write release notes. Whatever the convention, follow the repository's own history
  first.


  A pull request description explains one change after it's written. A bigger change
  deserves its reasoning before the code: the lesson A one-page design doc shows how to
  write the problem, the options and the plan on a single page.
