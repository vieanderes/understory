term: lost update
aka: [lost write, read-modify-write race]
short: Two requests read the same value, each writes back its own result, and one change vanishes.
explain: |
  Stock is 5. Two shoppers buy at the same moment. Both read 5, both compute 4, both write
  4. Two items left the shelf but the count only dropped by one.

  It happens whenever the read and the write are separate steps in app code. Fix it by
  doing the maths in the database (`SET stock = stock - 1`), by locking the row with
  `SELECT ... FOR UPDATE`, or with a version column that refuses a write based on an old
  read.
analogy: Two people editing a shared shopping list on paper copies. Whoever hands theirs back last wipes out the other's additions.
example:
  language: sql
  code: |
    -- unsafe: read in app code, write back later
    SELECT stock FROM products WHERE id = 7;   -- both see 5
    UPDATE products SET stock = 4 WHERE id = 7;

    -- safe: the database does the maths under a row lock
    UPDATE products SET stock = stock - 1 WHERE id = 7 AND stock > 0;
usage: That's a lost update; both workers read the balance before either wrote it back.
twin:
  term: dirty-read
  difference: A lost update overwrites a change that was committed. A dirty read sees a change that was never committed at all.
related: [race-condition, isolation-level, transaction]
level: 2
lessons: [db.isolation-levels, scale.locks, db.changing-rows]
