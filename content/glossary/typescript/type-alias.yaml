term: type alias
short: A name given to any type with the `type` keyword, from object shapes to unions.
explain: |
  `type Status = 'idle' | 'loading' | 'done'` gives a union a name you can reuse. `type Point
  = { x: number; y: number }` does the same for an object.

  It can name things an interface can't: unions, tuples, function types, types derived with
  `keyof`. It can't be reopened later to add fields. Combine shapes with `&` instead of
  `extends`.
analogy: A nickname. It's shorter to say, and it always means the same person.
example:
  language: ts
  code: |
    type Status = 'idle' | 'loading' | 'done';
    type Point = { x: number; y: number };
    type Handler = (event: MouseEvent) => void;
usage: Pull that union into a type alias; it's repeated in four signatures.
twin:
  term: interface
  difference: A type alias can name any type, unions included, and is fixed once written. An interface names only object shapes but can be extended and reopened.
related:
  - interface
  - union-type
level: 1
lessons:
  - ts.everyday-types
