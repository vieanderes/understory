term: STAR
aka:
  - STAR method
  - situation, task, action, result
short: Answering an interview question as a story of the situation, your task, your action and the result.
explain: |
  "Tell me about a time you disagreed with a teammate." Rambling loses the listener. Give
  the setting in a sentence or two. Then say what you needed to do, what you did, and how it
  turned out.

  Spend most of the time on the action: the choice you made and why. Say "I", not "we", and
  end with a result you can measure or a lesson you'd apply again.
analogy: A good story at dinner. Quick setup, the twist, the punchline, and nobody hears about the parking.
usage: Your answer is all situation, so tighten it with STAR and spend the time on what you did.
level: 1
lessons:
  - career.behavioural-stories
