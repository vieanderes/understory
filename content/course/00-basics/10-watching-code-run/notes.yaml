summary: >-
  The hardest bugs don't cause errors. The program runs to the end and gives a wrong answer,
  with no message and no line number. To find one, you stop guessing and watch the values
  change while the code runs.


  There are two ways to watch. A **probe** is a `console.log` you add only to look inside,
  then delete. It's quick and works everywhere. A **debugger** is a tool that pauses the
  program on a line you choose, called a **breakpoint**. Then you can read every variable and
  move on one line at a time. It takes a moment to set up and shows far more.


  Both serve one method. Before you look, decide what each value should be. Then run the code
  and compare. The first place where what you see differs from what you expected is where the
  bug lives. Watching without an expectation is only reading numbers.
remember:
  - A bug with no error is found by comparing what each value is with what you expected it to be.
  - The first value that differs from your expectation points at the line with the bug.
  - A probe is a temporary `console.log` placed where values change, such as inside a loop, and deleted after the fix.
  - Label your probes, like `console.log("best", best)`, so you can tell the lines apart.
  - Print the whole object when a property looks wrong, because it shows every real property name and puts text in quotes.
  - A breakpoint pauses the program on a line so a debugger can show every variable and the call stack.
  - Step over runs the current line, step into goes inside the function it calls, and step out finishes the current function.
  - Change one thing at a time and run again, so you know which change fixed it.
sections:
  - title: Probes that tell you something
    body: |-
      A bare `console.log(best)` in a loop prints a column of numbers. After three probes you
      can't tell which line came from where. Two habits fix that.

      First, **label every value**. `console.log` takes several values split by commas, so put
      a label in front of each:

      ```js
      function warmest(temps) {
        let best = 0;
        for (const temp of temps) {
          console.log("temp", temp, "best", best);
          if (temp > best) {
            best = temp;
          }
        }
        return best;
      }
      console.log(warmest([-5, -2, -9]));
      // temp -5 best 0
      // temp -2 best 0
      // temp -9 best 0
      // 0
      ```

      Now the output reads like sentences. `best` is 0 on every round, even the first. So the
      loop never changed it, and the bug is where `best` began.

      Second, **print the whole object** when a property seems wrong. `console.log` shows text
      without its quotes, so the string `"false"` and the boolean `false` look identical:

      ```js
      const task = { title: "Call the dentist", done: "false" };
      console.log(task.done); // false
      console.log(false); // false
      console.log(task); // { title: 'Call the dentist', done: 'false' }
      ```

      Printed as part of an object, text gets single quotes. Now you can see that `done` holds
      text. Printing the whole object also shows every property name exactly as spelt, which
      catches `Done` against `done` at a glance.

      Delete probes once the bug is fixed. Leftover probes clutter the output, and the next
      person has to work out which lines matter.
  - title: 'Expect, run, compare: finding the first difference'
    body: |-
      Watching values only helps if you know what they should be. So write your expectation
      down first, even as a comment. For `warmest([-5, -2, -9])` you'd expect `best` to go
      -5, then -2, then stay -2.

      Then compare line by line. The **first** difference is the one that matters. Later
      differences are usually knock-on effects of the first one. In the probe output above,
      the very first round already shows `best 0` where you expected -5. That points at the
      starting value, not at the `if` or the loop.

      When the code is longer, don't probe every line. Probe the middle. If the value is
      already wrong there, the bug is in the first half. If it's still right, it's in the
      second half. Then probe the middle of that half. Each probe halves the code you have to
      read, so even a long function takes only a few runs.

      A second trick is to **shrink the input**. If a list of 50 tasks gives the wrong count,
      try 2 tasks, then 1. The smallest input that still shows the bug makes the probe output
      short enough to read in one glance. Often, making the input smaller shows you the bug
      directly: a count that's wrong for one open task tells you the check itself is wrong.
  - title: Using a real debugger
    body: |-
      Every modern browser, the program you use to visit websites, has a debugger in its
      **developer tools**. In Chrome, open them with F12, or Cmd+Option+I on a Mac. The
      Sources panel shows your code. Click a line number to set a breakpoint, then do whatever
      runs that code.

      While paused, the debugger shows three things a probe can't show all at once:

      - **Scope**: every variable that exists at this line, with its current value.
      - **Call stack**: the pile of functions still running, from lesson 9. Click a lower frame
        to see the values in the function that made the call.
      - **Watch**: expressions you type once, like `task.done === false`, worked out again at
        every pause.

      In Chrome, F8 resumes, F10 steps over, F11 steps into and Shift+F11 steps out. Most code
      editors have the same buttons in the same order.

      Writing `debugger;` on a line works like a breakpoint you type into the code. Node, the
      program that runs JavaScript outside a browser, has a debugger too. Running
      `node inspect app.js` in a terminal pauses before the first line and waits for commands:

      ```text
      sb(14)      set a breakpoint on line 14
      cont        run until the next breakpoint
      next        step over
      step        step into
      out         step out
      exec best   show the value of best
      bt          show the call stack
      ```

      Choose a probe for a quick look at one or two values, especially in a loop you want to
      see as a whole. Choose a debugger when you don't know which value to look at, or when you
      need to see the call stack.
  - title: Five bugs that give no error
    body: |-
      Wrong answers without errors come from a small family of causes. Knowing them tells you
      what to look for once a probe shows the first wrong value.

      1. **A misspelt property.** `task.Done` reads a property that doesn't exist and gives
         `undefined`. A probe shows `undefined` where you expected `true` or `false`.
      2. **Text instead of a boolean or number.** `task.done === "false"` compares with text,
         which never equals the boolean `false`. Printing the whole object shows the quotes.
      3. **A wrong starting value.** `best = 0` for a list of negative temperatures, or a total
         that starts at 1. The very first round of the probe is already wrong.
      4. **A boundary one step off.** `<` where you meant `<=`, or a loop that stops one item
         early. The probe shows the last round missing, or one extra.
      5. **Replacing instead of updating.** `total = price` in place of `total = total + price`.
         The probe shows the total jumping around instead of growing.

      Each of these runs without complaint because it's valid JavaScript. The computer did
      exactly what the code said. Your job is to find where what the code says differs from
      what you meant, and the values are the evidence.
pitfalls:
  - '**Changing code before looking.** Guessing at a fix and running again can go on for an hour. Add one probe first and let the values tell you where to look.'
  - '**Probing without an expectation.** A column of numbers means nothing unless you know what they should be. Decide the expected values before you run.'
  - '**Trusting `console.log` to show types.** It prints the text `"false"` and the boolean `false` the same way. Print the whole object, where text appears in quotes.'
  - '**Stepping over the function you wanted to watch.** Step over runs a whole call in one go. Use step into on the line that calls the function.'
  - '**Leaving probes in.** Old probes bury the output you need next time. Delete them when the bug is fixed.'
  - '**Fixing the last wrong value instead of the first.** Later wrong values are often knock-on effects. Fix the first place where reality and expectation part ways.'
verify:
  - lens: confuses
    check: Every probe `console.log` is removed before the code is shared, so the output shows only what people should see.
  - lens: leaks
    check: No probe prints a password, a token or a whole user object, because logs are read by more people than you expect.
  - lens: breaks
    check: A search for `debugger;` comes back empty, because a leftover one pauses the page for anyone with developer tools open.
  - lens: tests
    check: Each fix is run and its printed value compared with the one you expected, not judged by the absence of errors.
interview:
  - question: A function returns the wrong result but throws no error. How do you debug it?
    answer: >-
      I compare what the values are with what I expect them to be, and fix the first place they
      differ. First I work out the expected values by hand for a small input. Then I watch the
      real ones, with a labelled `console.log` inside the loop or a breakpoint in a debugger.
      The first round where they differ points at the bug. Everything after it is usually a
      knock-on effect. If the function is long, I probe the middle to find which half holds
      the bug, and repeat. I also shrink the input to the smallest one that still fails, so
      the output is short enough to read. Once it's fixed, I remove the probes and rerun with
      the original input.
  - question: When would you use console.log and when a debugger?
    answer: >-
      I use `console.log` when I already know which values to look at, and a debugger when I
      don't. A labelled probe inside a loop shows every round at once, which is ideal for
      spotting where a running total goes wrong. It works in any environment and needs no
      setup. A debugger pauses on a breakpoint and shows every variable in scope, the call
      stack and any expression I want to watch. I can also step into the functions being
      called. That's better when I don't yet know where to look, or when the bug depends on who
      called the function. The trade-off is that a debugger shows one moment at a time, while
      probes show the whole history in one run.
  - question: What's the difference between step over, step into and step out?
    answer: >-
      They're three ways to move on from a paused line, and they differ in how they treat
      function calls. Step over runs the current line completely, including any function it
      calls, and pauses on the next line. Step into, on a line that calls a function, goes
      inside that function and pauses on its first line. Step out runs the rest of the current
      function and pauses back in the function that called it. So on
      `const left = countLeft(tasks);`, step over gives me the result straight away, while step
      into lets me watch the loop inside `countLeft`. If I step into by mistake, step out
      brings me back. Chrome maps them to F10, F11 and Shift+F11.
