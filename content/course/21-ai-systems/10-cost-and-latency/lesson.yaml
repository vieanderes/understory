deepDive: >-
  No model was called. The breaker and the fallback ran in Python 3.12 against fake
  clients. Prices and cache rules were checked against Anthropic's documentation in
  September 2026.


  **Cache economics.** The default cache entry lives five minutes, refreshed on each hit.
  Writing it costs about 1.25 times normal input, and each read about a tenth. A one-hour
  entry costs twice normal input to write, so it needs more reads to pay off. Prefixes
  below a minimum length, which depends on the model, aren't cached at all.


  **Batches stack with caching.** Every token in a batch is billed at half the normal
  rate. Most batches finish within an hour. The 24-hour limit is an expiry, not a
  promise, so keep anything a user waits for synchronous.


  **Fallback costs.** A fallback model has its own cache, so the first calls after a
  switch pay full price. It may also answer differently, so run your eval set on it before
  you rely on it. Give each dependency its own breaker: the model, the vector store, the
  reranker.
