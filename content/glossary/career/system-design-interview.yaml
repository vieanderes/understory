term: system design interview
aka:
  - system design round
  - architecture interview
short: An interview round where you design a whole system out loud, from requirements to trade-offs.
explain: |
  "Design a service that summarises support tickets." There's no single right answer. The
  interviewer watches how you get to one.

  Strong candidates start with questions: who uses it, how many, how fast, what can fail. Then
  they sketch the main path, estimate the load, and go deep on the part that's hardest. They
  name trade-offs and failure modes before being asked.

  The trap is drawing boxes from memory. A diagram of famous components with no requirements
  behind it reads as recall, not judgment. Say why each box is there.
analogy: An architect sketching a house with the client in the room, explaining each wall as they draw it.
usage: In the system design interview I spent five minutes on requirements before drawing a single box.
twin:
  term: behavioural-interview
  difference: A system design interview asks how you'd build something new. A behavioural interview asks what you actually did before, in a real situation.
