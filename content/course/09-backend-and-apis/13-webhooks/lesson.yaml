deepDive: >-
  Under the seal is an HMAC: a hash of the body mixed with the shared secret. Stripe's
  `Stripe-Signature` header carries `t`, a timestamp, and `v1`, an HMAC-SHA256 of `t.body`.
  The library refuses a timestamp more than five minutes old, so an old delivery can't be
  replayed.


  Written by hand, the check uses `createHmac` and `timingSafeEqual` from `node:crypto`.
  `===` stops at the first wrong character, and an attacker who can time that learns the
  signature one character at a time.


  A `Set` only holds claims for one running process. With several servers, the claim is
  one write to a shared store that fails if the id is already there. The databases chapter
  shows how.


  For order, don't replay what each event says happened. Read the object's current state,
  which the event includes or the provider lets you fetch, and store that.
