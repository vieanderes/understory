deepDive: |-
  **Development-only packages.** `npm install -D vitest` lists a package under
  `devDependencies`: needed to build and test, not to run. A server often installs with
  `npm ci --omit=dev`. Put a package the app imports under `devDependencies` by mistake, and
  the server crashes on start with `Cannot find package`.

  **`"type": "module"`.** Put it in `package.json` so Node treats your files as modules. Node
  24 still runs `import` without it, but prints a `MODULE_TYPELESS_PACKAGE_JSON` warning.

  **Where npm installs.** npm walks up from your folder to the nearest `package.json`. So
  running it in `timer/src` installs into `timer`. With no `package.json` anywhere above, it
  creates one where you stand.

  **Known holes.** `npm audit` checks your installed versions against a public list of
  reported vulnerabilities, and exits with 1 if it finds one:

  ```text
  minimist  1.0.0 - 1.2.5
  Severity: critical
  fix available via `npm audit fix`
  ```

  **Pins aren't enough.** Writing `"axios": "1.7.9"` fixes one package, but axios's own
  dependencies still use ranges. Only the lockfile pins the whole tree.

  **Below 1.0.0** a minor may break things, so `^0.2.3` stops at 0.3.0, and `^0.0.3` allows
  only 0.0.3. Prereleases such as `3.0.0-beta.1` match only a range that names a prerelease.

  **Other fields.** `engines` states which Node versions a project supports. A script named
  `pretest` runs before `test`. `peerDependencies` asks the host project to supply a package,
  such as React, so there's only one copy.
