term: data processor
aka: [data controller, controller and processor, sub-processor, data processing agreement, DPA]
short: A company that handles personal data only on another company's documented instructions, never for its own ends.
explain: |
  When your app sends customer emails through a mailing service, two parties touch the
  data. The law needs to know who answers for it.

  The controller decides why and how data is processed; that's usually you. The processor
  acts only on the controller's instructions, under a written agreement. A processor that
  starts using the data for its own purposes becomes a controller for that use. A processor
  may hire a sub-processor only with the controller's written permission.
analogy: A printing shop that prints your leaflets. It may not keep the mailing list or send its own adverts with it.
usage: The analytics vendor is a data processor for us, so we need a signed agreement before sending them any events.
related: [pii, lawful-basis, data-minimisation]
level: 3
lessons: [security.personal-data]
