id: atlas.language-landscape
title: Beyond the web
objective: Say what a platform is, and read any language by what it catches and how it runs.
level: essential
minutes: 10
concepts: [atlas.platforms, atlas.type-systems, atlas.runtimes]
prerequisites: [ts.what-typescript-is, python.type-hints, cs.memory-and-runtimes]
opening:
  text: >-
    You'll find your way around the languages and apps beyond the browser, from iPhone apps to
    tools written in Go. It's the map you need when a job, or an AI feature, lands there.

steps:
  - type: prose
    id: what-a-platform-is
    body: >-
      So far your code ran in a browser or on a server. That's two **platforms**. A platform
      is a place code runs, with its own rules: the browser, a server, an iPhone, an Android
      phone, a desktop computer.


      A **native** app is written in the platform's own language and toolkit: Swift for iPhone,
      Kotlin for Android. A **cross-platform** app is one codebase that runs on several.

  - type: multiple-choice
    id: pick-kind-of-app
    concept: atlas.platforms
    difficulty: 1
    question: A notes app is written in Swift, with Apple's own buttons and lists. What kind of app is it?
    choices:
      - text: A native app
        correct: true
        feedback: >-
          Right. Apple's language and Apple's toolkit, for Apple's platform.
      - text: A cross-platform app
        feedback: >-
          That would be one codebase for several platforms. Swift with Apple's toolkit is iPhone only.
      - text: A web app
        feedback: >-
          A web app is HTML, CSS and JavaScript in a browser. Swift doesn't run there.

  - type: prose
    id: name-type-systems
    body: >-
      Each language answers a few questions differently. First: when does it catch a wrong
      type? You've met both answers.


      TypeScript checks before the code runs, so a bad call won't build. That's a **static**
      type system. Python checks as each line runs, so the error waits for that line. That's
      **dynamic**. Go, Swift, Kotlin and Rust are static, like TypeScript.

  - type: ai-review
    id: review-late-type-error
    concept: atlas.type-systems
    difficulty: 2
    language: python
    request: Add a 10% welcome discount to the receipt.
    flawClass: edge-case
    code: |
      def receipt(prices, code):
          total = sum(prices)
          if code == "WELCOME":
              return "Total: " + total * 0.9
          return "Total: " + str(total)
    prompt: >-
      An assistant wrote this. Every receipt in testing printed fine. The first customer who
      typed WELCOME got a crash. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It adds a number to a string
        correct: true
        feedback: >-
          Yes. Python only found out when that line ran. Wrap it in `str()`.
      - text: '`sum` fails on a list of prices'
        feedback: >-
          `sum` adds up a list of numbers fine. Line 5 used the same total without trouble.
      - text: '`code` should be compared with `is`'
        feedback: >-
          `==` is right for comparing text. The crash comes after the comparison matched.
    fix: |
      def receipt(prices, code):
          total = sum(prices)
          if code == "WELCOME":
              return "Total: " + str(total * 0.9)
          return "Total: " + str(total)

  - type: code-challenge
    id: fix-form-total
    concept: atlas.type-systems
    difficulty: 2
    language: ts
    expectStarterTypeError: true
    editable: '7'
    prompt: >-
      Here's the static side. The compiler underlines line 7: form fields are text, and
      `total` wants numbers. Plain JavaScript would run it and give `"122"`, not 14.


      Convert each field with `Number()` so `totalFromForm("3", "4", "2")` returns `14`.
    hints:
      - Read the red underline. It names the argument and the type it expected.
      - Each of the three strings needs converting before it reaches `total`.
      - 'Start with `total(Number(priceText), ...`'

  - type: prose
    id: name-runtimes
    body: >-
      Second question: how does the code run? JavaScript and Python need a **runtime**
      installed, a program that runs your code: Node, or Python itself. You met V8's
      interpreter and JIT in the memory and runtimes lesson.


      Go, Rust and Swift compile ahead of time into a **binary**: one file of machine code
      the computer runs directly. Nothing else to install.

  - type: multiple-choice
    id: pick-fastest-start
    concept: atlas.runtimes
    difficulty: 2
    language: text
    code: |
      # three programs that print "hi", timed from launch to exit
      hello        50,680 bytes     9 ms    # Swift, a binary
      hello.py         12 bytes    33 ms    # Python
      hello.js         18 bytes    45 ms    # Node
    question: The Swift binary is far bigger than the scripts. Why does it start fastest?
    choices:
      - text: It needs no runtime to start
        correct: true
        feedback: >-
          Right. It's machine code already. The scripts wait for Python or Node to load.
      - text: Swift is a faster language
        feedback: >-
          How fast a loop runs is another question. This is start-up, and it's about what has to load.
      - text: The scripts are slow to read from disk
        feedback: >-
          Twelve bytes read in no time. The 30 ms goes on loading Python or Node itself.

  - type: bug-hunt
    id: hunt-missing-runtime
    concept: atlas.runtimes
    difficulty: 3
    language: bash
    code: |
      # a small Linux image, with nothing else installed
      FROM debian:bookworm-slim
      COPY dist/cli.js /app/cli.js
      CMD ["node", "/app/cli.js"]
    prompt: >-
      This image builds fine. Starting it fails with `exec: "node": executable file not found`.
      Tap the line at fault.
    lines: [2]
    reasons:
      - text: The base image has no Node runtime
        correct: true
        feedback: >-
          Yes. A script needs its runtime. Start from `node:24-slim`, or ship a binary.
      - text: '`COPY` should come after `CMD`'
        feedback: >-
          `CMD` only says what runs at start. The file was copied fine; nothing can run it.
      - text: The path in `CMD` is wrong
        feedback: >-
          `/app/cli.js` is where line 3 put it. The error names `node`, not the file.
    fix: |
      FROM node:24-slim
      COPY dist/cli.js /app/cli.js
      CMD ["node", "/app/cli.js"]

  - type: explain-back
    id: explain-no-types
    concept: atlas.type-systems
    difficulty: 3
    prompt: >-
      A teammate says "Python has no types, so it's quicker to write". What's true in that,
      and what does it cost?
    rubric:
      - Python's values all have types, but names don't, and nothing is checked until an operation runs.
      - That saves writing annotations and lets code run before it's fully right.
      - A type error that a static checker would catch at build time reaches a user at run time instead.
    modelAnswer: >-
      Every Python value has a type. `"3"` is a string and `3` is a number, and adding them
      fails. What Python lacks is a check before running. A name can hold anything, and a
      mistake shows only when that line runs, with that input. That's the speed my teammate
      feels: no annotations, and code runs before it's finished. The cost is where the error
      lands. A static language stops it at build. Python hands it to whoever reaches the line
      first, which may be a customer.

recap:
  - Tell a native app from a cross-platform one, and name the platform code runs on.
  - Expect a static language to refuse a bad call, and a dynamic one to fail at the line.
  - Ship a script with its runtime, or ship a binary that needs none.

recall:
  - id: card-platform
    concept: atlas.platforms
    front: What makes an app native, and what makes it cross-platform?
    back: >-
      Native is written in the platform's own language and toolkit, like Swift for iPhone.
      Cross-platform is one codebase that runs on several platforms.
  - id: card-static-dynamic
    concept: atlas.type-systems
    front: How do static and dynamic type systems differ in when a wrong type is caught?
    back: >-
      Static checks before the program runs, so it won't build. Dynamic checks each operation
      as it runs, so the error appears at that line.
  - id: card-runtime-or-binary
    concept: atlas.runtimes
    front: What does a Python script need on a machine that a Go binary doesn't?
    back: >-
      A runtime: Python itself, installed. The Go binary is machine code already, so it runs
      with nothing else installed.

references:
  - kind: docs
    title: Frequently Asked Questions (FAQ)
    authors: The Go Authors
    venue: go.dev
    url: https://go.dev/doc/faq
    note: Why Go programs are statically linked into one binary, and Go's static typing.
    primary: true
    verified: true
  - kind: docs
    title: Data model
    authors: Python Software Foundation
    venue: Python 3 documentation
    url: https://docs.python.org/3/reference/datamodel.html
    note: Every object has a type, checked when an operation runs.
    primary: true
    verified: true
  - kind: docs
    title: Dockerfile reference
    authors: Docker
    venue: Docker Docs
    url: https://docs.docker.com/reference/dockerfile/
    note: '`FROM`, `COPY` and `CMD`, and what a base image brings with it.'
    verified: true

deepDive: >-
  What ran. Python 3.14 raised `TypeError: can only concatenate str (not "float") to str` on
  the welcome receipt, and printed the other one. Node printed `"122"` for
  `"3" * "4" + "2"`: the `*` turns both strings into numbers, and the `+` joins text. The
  image built with Docker and failed to start with `exec: "node": executable file not found
  in $PATH`. Swift 6.2, Python and Node ran the start-up timings on a laptop, best of five.


  Start-up isn't speed. Once warm, V8's JIT runs a hot loop close to compiled code. Ahead of
  time wins where a process is short or memory is tight: a command-line tool, a phone, a
  function that starts per request. That's why so much fast developer tooling, including
  Python's own package tools, is now written in Rust or Go.


  TypeScript is the odd one out. Its types are checked and then erased, so the running
  program is plain JavaScript with dynamic checks. Swift, Go, Kotlin and Rust keep their
  types into the compiled code. Python's type hints work like TypeScript's: a checker reads
  them, and the running program ignores them.
