term: floating point
aka: [float, floats, floating-point number, IEEE 754, double]
short: The way computers store numbers with fractions in binary, usually rounded to the nearest value they can hold.
explain: |
  Try `0.1 + 0.2` in JavaScript or Python. You get `0.30000000000000004`. Nothing is
  broken. It's how almost every language stores decimals.

  The number is kept in binary as a sign, an exponent and about 16 significant digits.
  Binary can't write 0.1 exactly, the same way decimal can't write one third. So the
  stored value is a near neighbour, and small errors add up.

  Never compare these with `===`. Check whether they're close enough instead. For money,
  store whole pence as integers, or use a decimal type.
analogy: Writing one third as 0.333 on a calculator. Add three of them and you get 0.999, not 1.
example:
  language: js
  code: |
    0.1 + 0.2;                 // 0.30000000000000004
    0.1 + 0.2 === 0.3;         // false
    Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON; // true: close enough

    // money: count pence as whole numbers
    const totalPence = 1099 + 250; // £13.49, exactly
usage: Don't keep prices as floating point; three items at £0.10 come out as £0.30000000000000004.
related: [safe-integer, type-coercion]
level: 2
lessons: [cs.data-representation]
