deepDive: >-
  What ran. The SwiftUI counter compiled with Swift 6.2; the tap itself needs a running app,
  so "Tapped 2" rests on Apple's State documentation. Node printed `true` for
  `"2.10.0" < "2.9.0"`. The rest rests on the pages in Read next.


  The Compose version of the counter reads
  `var count by remember { mutableStateOf(0) }`. `remember` keeps the value across redraws,
  and `mutableStateOf` makes changes to it trigger one.


  Google Play can hold your app signing key for you, and you sign uploads with a separate
  upload key. Lose the upload key and Google can reset it. Apple signs with certificates
  from your developer account, managed in Xcode. Either way, the secrets stay out of the
  repo.


  Apple's phased release spreads an automatic update over seven days, and can be paused.
  Google's staged roll-out is a percentage you raise yourself. Neither pulls a build back from
  a phone that has it, which is why a minimum-version check is worth building on day one.
