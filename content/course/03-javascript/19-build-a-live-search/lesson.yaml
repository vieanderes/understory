id: js.live-search
title: Build a live search
objective: Build a search page that fetches as you type, shows results and errors, and ignores stale answers.
level: essential
minutes: 10
concepts: [js.fetch, js.cancellation, js.creating-elements]
prerequisites: [js.fetch-cancellation, js.dom-events, js.changing-the-page]
opening:
  text: >-
    You'll build a film search that shows results as you type, the way real sites do. It uses
    nearly everything in this chapter, and you'll watch it work at each stage.

steps:
  - type: prose
    id: the-plan
    body: >-
      Here's the plan. A search box, a stand-in server that knows six films, and four stages:
      show results, say when nothing matches, cope with a failing server, and ignore stale
      answers.


      The HTML tab holds the server and a helper, `type(box, text)`. It types into the box
      and fires an `input` event, like a person would. One new tool: `list.replaceChildren()`
      empties an element.

  - type: playground
    id: show-results
    concept: js.creating-elements
    difficulty: 2
    prompt: >-
      The code already fetches the matching films. Read them as JSON, empty the list with
      `list.replaceChildren()`, then add an `li` for each film. Then type in the box yourself.
    html: |
      <label>Search films <input id="search"></label>
      <ul id="results"></ul>
      <script>
        // A stand-in server, as this page can't reach the internet. One-letter searches answer slowly.
        const films = ["Alien", "Amélie", "Arrival", "Brazil", "Coco", "Up"];
        async function fetch(url, options = {}) {
          const query = decodeURIComponent(url.split("q=")[1]).toLowerCase();
          if (query.length === 1) await new Promise((resolve) => setTimeout(resolve, 0));
          if (options.signal?.aborted) throw new DOMException("Aborted", "AbortError");
          if (query === "oops") return { ok: false, status: 500, json: async () => [] };
          const found = films.filter((film) => film.toLowerCase().includes(query));
          return { ok: true, status: 200, json: async () => found };
        }
        const type = (box, text) => { box.value = text; box.dispatchEvent(new Event("input")); };
      </script>
    js: |
      const box = document.querySelector("#search");
      const list = document.querySelector("#results");
      box.addEventListener("input", async () => {
        const response = await fetch("/films?q=" + encodeURIComponent(box.value));
        // Read the films, empty the list, then add an li for each film.
      });

      type(box, "al"); // Test it: searches for "al"
    editable: [js]
    showTree: true
    checks:
      - label: The search for al lists two films
        selector: '#results li'
        count: 2
      - label: Alien comes first
        selector: '#results li:first-child'
        text: Alien
    solution:
      js: |
        const box = document.querySelector("#search");
        const list = document.querySelector("#results");
        box.addEventListener("input", async () => {
          const response = await fetch("/films?q=" + encodeURIComponent(box.value));
          const films = await response.json();
          list.replaceChildren();
          for (const film of films) {
            const item = document.createElement("li");
            item.textContent = film;
            list.append(item);
          }
        });

        type(box, "al"); // Test it: searches for "al"
    hints:
      - '`await response.json()` gives an array of film titles.'
      - Empty the list first, or each key press adds to the old results.
      - 'For each film: `document.createElement("li")`, set `textContent`, then `list.append`.'

  - type: prose
    id: empty-means-something
    body: >-
      From here on, the results show as one line of text, so each stage's code fits your
      screen. `films.join(", ")` does it.


      A search with no matches gives an empty array, and `join` turns that into an empty
      string. A blank page looks broken. Remember `||` from the everyday syntax lesson? It swaps
      out an empty string, which is exactly what you want here.

  - type: playground
    id: no-results
    concept: js.fetch
    difficulty: 2
    prompt: >-
      A search for "zz" leaves the page blank. Show "No films match" when the list comes back
      empty, and keep showing the titles otherwise.
    html: |
      <label>Search films <input id="search"></label>
      <p id="results"></p>
      <script>
        // A stand-in server, as this page can't reach the internet. One-letter searches answer slowly.
        const films = ["Alien", "Amélie", "Arrival", "Brazil", "Coco", "Up"];
        async function fetch(url, options = {}) {
          const query = decodeURIComponent(url.split("q=")[1]).toLowerCase();
          if (query.length === 1) await new Promise((resolve) => setTimeout(resolve, 0));
          if (options.signal?.aborted) throw new DOMException("Aborted", "AbortError");
          if (query === "oops") return { ok: false, status: 500, json: async () => [] };
          const found = films.filter((film) => film.toLowerCase().includes(query));
          return { ok: true, status: 200, json: async () => found };
        }
        const type = (box, text) => { box.value = text; box.dispatchEvent(new Event("input")); };
      </script>
    js: |
      const box = document.querySelector("#search");
      const results = document.querySelector("#results");
      box.addEventListener("input", async () => {
        const response = await fetch("/films?q=" + encodeURIComponent(box.value));
        const films = await response.json();
        results.textContent = films.join(", ");
      });

      type(box, "zz"); // Test it: a search with no matches
    editable: [js]
    checks:
      - label: The page says No films match
        selector: '#results'
        text: No films match
    solution:
      js: |
        const box = document.querySelector("#search");
        const results = document.querySelector("#results");
        box.addEventListener("input", async () => {
          const response = await fetch("/films?q=" + encodeURIComponent(box.value));
          const films = await response.json();
          results.textContent = films.join(", ") || "No films match";
        });

        type(box, "zz"); // Test it: a search with no matches
    hints:
      - The empty array joins into an empty string.
      - An empty string is falsy, so `||` can replace it.
      - Add `|| "No films match"` after the `join`.

  - type: playground
    id: server-error
    concept: js.fetch
    difficulty: 3
    prompt: >-
      The stand-in server fails with a 500 for "oops" and sends no films. The page claims "No
      films match", which isn't true. Check `response.ok` and show "Something went wrong".
    html: |
      <label>Search films <input id="search"></label>
      <p id="results"></p>
      <script>
        // A stand-in server, as this page can't reach the internet. One-letter searches answer slowly.
        const films = ["Alien", "Amélie", "Arrival", "Brazil", "Coco", "Up"];
        async function fetch(url, options = {}) {
          const query = decodeURIComponent(url.split("q=")[1]).toLowerCase();
          if (query.length === 1) await new Promise((resolve) => setTimeout(resolve, 0));
          if (options.signal?.aborted) throw new DOMException("Aborted", "AbortError");
          if (query === "oops") return { ok: false, status: 500, json: async () => [] };
          const found = films.filter((film) => film.toLowerCase().includes(query));
          return { ok: true, status: 200, json: async () => found };
        }
        const type = (box, text) => { box.value = text; box.dispatchEvent(new Event("input")); };
      </script>
    js: |
      const box = document.querySelector("#search");
      const results = document.querySelector("#results");
      box.addEventListener("input", async () => {
        const response = await fetch("/films?q=" + encodeURIComponent(box.value));
        const films = await response.json();
        results.textContent = films.join(", ") || "No films match";
      });

      type(box, "oops"); // Test it: the server fails
    editable: [js]
    checks:
      - label: The page says Something went wrong
        selector: '#results'
        text: Something went wrong
    solution:
      js: |
        const box = document.querySelector("#search");
        const results = document.querySelector("#results");
        box.addEventListener("input", async () => {
          const response = await fetch("/films?q=" + encodeURIComponent(box.value));
          if (!response.ok) {
            results.textContent = "Something went wrong. Try again.";
            return;
          }
          const films = await response.json();
          results.textContent = films.join(", ") || "No films match";
        });

        type(box, "oops"); // Test it: the server fails
    hints:
      - The 500 answer has an empty body, so it looks like a search with no matches.
      - Check `response.ok` straight after the `fetch`.
      - If it's `false`, set the message and `return` before reading the body.

  - type: prose
    id: why-answers-race
    body: >-
      One stage left, and it's the sneaky one. Every key press sends a request, and a server
      doesn't promise to answer in order.


      Type "b", then quickly "coco". If the answer for "b" arrives last, it overwrites the
      newer results. On slow wifi, people see results for words they've already deleted. The
      stand-in server makes one-letter searches slow, so you can watch it happen.

  - type: predict-output
    id: predict-stale-answer
    concept: js.cancellation
    difficulty: 2
    language: js
    code: |
      box.addEventListener("input", async () => {
        const response = await fetch("/films?q=" + encodeURIComponent(box.value));
        const films = await response.json();
        results.textContent = films.join(", ");
      });
      type(box, "b");    // answers slowly: Brazil
      type(box, "coco"); // answers at once: Coco
    question: Both answers arrive. What does the page show at the end?
    choices:
      - text: Brazil
        correct: true
        feedback: >-
          Right. The slow answer lands last and overwrites the newer one.
      - text: Coco
        feedback: >-
          That's what the person wants. But nothing stops the older answer from writing over
          it when it finally arrives.
      - text: Brazil, Coco
        feedback: >-
          Each answer replaces `textContent` rather than adding to it. The last one to arrive
          wins.
      - text: Nothing, the first search is dropped
        feedback: >-
          Nothing cancels it. Both requests finish, and both write to the page.

  - type: playground
    id: cancel-stale
    concept: js.cancellation
    difficulty: 4
    prompt: >-
      The page shows Brazil, though the last search was "coco". Keep the last `AbortController`,
      abort it before each new request, and ignore the `AbortError` that follows.
    html: |
      <label>Search films <input id="search"></label>
      <p id="results"></p>
      <script>
        // A stand-in server, as this page can't reach the internet. One-letter searches answer slowly.
        const films = ["Alien", "Amélie", "Arrival", "Brazil", "Coco", "Up"];
        async function fetch(url, options = {}) {
          const query = decodeURIComponent(url.split("q=")[1]).toLowerCase();
          if (query.length === 1) await new Promise((resolve) => setTimeout(resolve, 0));
          if (options.signal?.aborted) throw new DOMException("Aborted", "AbortError");
          if (query === "oops") return { ok: false, status: 500, json: async () => [] };
          const found = films.filter((film) => film.toLowerCase().includes(query));
          return { ok: true, status: 200, json: async () => found };
        }
        const type = (box, text) => { box.value = text; box.dispatchEvent(new Event("input")); };
      </script>
    js: |
      const box = document.querySelector("#search");
      const results = document.querySelector("#results");

      box.addEventListener("input", async () => {
        const url = "/films?q=" + encodeURIComponent(box.value);
        const response = await fetch(url);
        const films = await response.json();
        results.textContent = films.join(", ");
      });

      type(box, "b"); type(box, "coco"); // Test it: a slow search, then a fast one
    editable: [js]
    checks:
      - label: The page shows Coco
        selector: '#results'
        text: Coco
    solution:
      js: |
        const box = document.querySelector("#search");
        const results = document.querySelector("#results");
        let controller;
        box.addEventListener("input", async () => {
          controller?.abort();
          controller = new AbortController();
          try {
            const url = "/films?q=" + encodeURIComponent(box.value);
            const response = await fetch(url, { signal: controller.signal });
            results.textContent = (await response.json()).join(", ");
          } catch (error) {
            if (error.name !== "AbortError") throw error;
          }
        });
        type(box, "b"); type(box, "coco"); // Test it: a slow search, then a fast one
    hints:
      - 'Declare `let controller;` outside the listener, so it survives between key presses.'
      - 'Inside: `controller?.abort();`, then `controller = new AbortController();`, and pass `{ signal: controller.signal }` to `fetch`.'
      - Wrap the fetch in `try`, and in `catch` rethrow anything that isn't an `AbortError`.

  - type: explain-back
    id: explain-stale-results
    concept: js.cancellation
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Without the controller, typing "b" then "coco" showed Brazil. Why, and how does aborting
      the previous request fix it?
    rubric:
      - Each key press sends its own request, and answers can arrive in any order.
      - The slower, older answer arrived last and overwrote the newer results.
      - Aborting makes the old fetch reject with an `AbortError`, so it never writes to the page.
    modelAnswer: >-
      Each key press started its own request. The server answered "coco" at once and "b" later.
      So the old answer arrived last and replaced the right results with Brazil. Keeping the last
      controller and aborting it before each new request makes the old fetch reject with an
      `AbortError`. The code ignores that error, so only the newest search reaches the page.

recap:
  - Fetch as someone types and turn the results into elements on the page.
  - Show a clear message for no matches and for a failing server.
  - Abort the previous request so an old answer can't overwrite a new one.

recall:
  - id: card-empty-list-first
    concept: js.creating-elements
    front: Why empty the results list before adding the new items?
    back: >-
      Otherwise each search adds to the old results. `list.replaceChildren()` removes every
      child at once.
  - id: card-empty-join
    concept: js.fetch
    front: 'How do you show "No films match" when `films` is empty, in one line?'
    back: >-
      `films.join(", ") || "No films match"`. An empty array joins to `""`, which is falsy, so
      `||` swaps it.
  - id: card-ok-before-json
    concept: js.fetch
    front: A search fails with a 500. Why check `response.ok` before reading the body?
    back: >-
      The body isn't your data. Read as data, it can break the page or show a false message,
      like "No films match".
  - id: card-stale-answer
    concept: js.cancellation
    front: What three things stop a stale search answer from reaching the page?
    back: >-
      A controller kept outside the listener, `abort()` on it before each new request, and a
      `catch` that ignores the `AbortError`.

