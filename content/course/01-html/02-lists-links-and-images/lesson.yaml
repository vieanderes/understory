deepDive: >-
  A purely decorative picture, like a swirl between sections, should have an empty
  `alt=""`. Screen readers then skip it. Leaving `alt` out altogether is different: it says
  the picture matters but has no description.


  Good alt text says what the picture shows in this context. Leave out "image of" or "photo
  of", since screen readers already announce an image.


  Link text should make sense on its own. Screen reader users often jump from link to link,
  so ten links that all say "click here" tell them nothing.


  Lists can nest: put a whole `ul` inside an `li` for a sub-list. Only `li` may sit directly
  inside `ul` or `ol`.


  Attribute values without spaces work without quotes, like `href=menu.html`. Quotes are
  safer, and most teams always use them.
