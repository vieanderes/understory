id: html.the-dom
title: The DOM
objective: Read the tree a browser builds from HTML, and change the page with one line of JavaScript.
level: essential
minutes: 10
concepts: [html.dom, html.dom-scripting, html.parsing]
prerequisites: [html.everyday-elements, basics.objects]
opening:
  text: >-
    You'll see the tree of objects a browser builds from your HTML, and change the page from
    JavaScript. It's where the HTML you write meets the code you learned in chapter 0.

steps:
  - type: prose
    id: file-to-tree
    body: >-
      The browser doesn't draw your file directly. First it reads the tags and builds one
      object per element, like the objects you made in chapter 0. Each object sits inside
      the one for its outer element, so together they form a tree.


      That tree is the **DOM**, short for Document Object Model. The screen is drawn from it.
    figure:
      id: dom-tree
      caption: Nesting in the file becomes parent and child in the tree.

  - type: playground
    id: see-the-tree
    concept: html.dom
    difficulty: 1
    prompt: >-
      The tree view shows the DOM of this page. Add a third `li` for Sunday, and watch a new
      branch appear.
    html: |
      <h1>Opening times</h1>
      <ul>
        <li>Monday to Friday: 9 to 5</li>
        <li>Saturday: 10 to 4</li>
      </ul>
    editable: [html]
    showTree: true
    checks:
      - label: The list has three items
        selector: ul li
        count: 3
      - label: One item mentions Sunday
        selector: 'ul li:last-child'
        text: Sunday
    solution:
      html: |
        <h1>Opening times</h1>
        <ul>
          <li>Monday to Friday: 9 to 5</li>
          <li>Saturday: 10 to 4</li>
          <li>Sunday: closed</li>
        </ul>
    hints:
      - The new item goes inside the `ul`, after the Saturday line.
      - It needs a start tag and an end tag, like the others.
      - 'Try `<li>Sunday: closed</li>`.'

  - type: prose
    id: parents-and-children
    body: >-
      Trees have their own words. The element an object sits inside is its **parent**. The
      ones inside it are its **children**. In the tree you built, `ul` is the parent and each
      `li` is a child.


      Did you spot `html`, `head` and `body` at the top? You never wrote them. The browser
      adds them to every page that leaves them out.

  - type: predict-output
    id: predict-parent
    concept: html.dom
    difficulty: 2
    language: html
    code: |
      <h1>Corner Café</h1>
      <p>Open <strong>daily</strong> from 9.</p>
    question: This is the whole file. In the DOM, what is the parent of `h1`?
    choices:
      - text: '`body`'
        correct: true
        feedback: >-
          Yes. The browser adds `body`, and everything you see goes inside it.
      - text: Nothing, it's at the top
        feedback: >-
          It's at the top of the file. The tree starts higher, with `html` and `body`, which
          the browser adds.
      - text: '`p`'
        feedback: >-
          The `p` comes after the heading, not around it. They're siblings under the same
          parent.
      - text: '`html`'
        feedback: >-
          Close. `html` is one level higher. Between them sits `body`, which holds what you
          see.

  - type: prose
    id: javascript-reads-the-tree
    body: |-
      Because the DOM is made of objects, JavaScript can reach them. `document` is the object
      for the whole page:

      ```js
      const heading = document.querySelector("h1");
      heading.textContent = "Open now";
      ```

      `querySelector("h1")` finds the first `h1`. `textContent` is its text, a property like
      `book.title` in chapter 0. Change it, and the page changes. In a file, this code goes in
      a `script` element.

  - type: predict-output
    id: predict-text-change
    concept: html.dom-scripting
    difficulty: 2
    language: html
    code: |
      <h1>Opening soon</h1>
      <script>
        const heading = document.querySelector("h1");
        heading.textContent = "Open now";
      </script>
    question: What does the heading say on screen?
    choices:
      - text: Open now
        correct: true
        feedback: >-
          Right. The script changed the object, and the screen follows the DOM.
      - text: Opening soon
        feedback: >-
          That's what the file says. The script changed the DOM afterwards, and the screen is
          drawn from the DOM.
      - text: Opening soon, then Open now below it
        feedback: >-
          Setting `textContent` replaces the text. It doesn't add a second heading.

  - type: playground
    id: change-text-with-js
    concept: html.dom-scripting
    difficulty: 2
    prompt: >-
      The café has opened. The JavaScript already finds the paragraph. Add one line that
      changes its text to Open. Watch the page and the tree.
    html: |
      <h1>Corner Café</h1>
      <p>Closed</p>
    js: |
      const sign = document.querySelector("p");
    editable: [js]
    showTree: true
    checks:
      - label: The paragraph says Open
        selector: p
        text: Open
    solution:
      js: |
        const sign = document.querySelector("p");
        sign.textContent = "Open";
    hints:
      - '`sign` is the paragraph object. Its text is a property.'
      - The property is called `textContent`.
      - Set it the way you'd set any property, with `=` and a string.

  - type: prose
    id: browsers-fix-mistakes
    body: >-
      Browsers never refuse a page. Forget an end tag, and the browser guesses what you meant.
      It builds a tree anyway, and no error appears.


      So when a page looks wrong, compare the file with the tree. Right-click the page. "View
      page source" shows the file. "Inspect" opens the **developer tools**, whose Elements
      panel shows the DOM.

  - type: playground
    id: fix-runaway-bold
    concept: html.parsing
    difficulty: 3
    prompt: >-
      Only "daily" should be bold, but the second paragraph is bold too. Look at the tree: the
      browser guessed, and made two `strong` elements. Fix the file.
    html: |
      <p>Open <strong>daily</p>
      <p>From 9 to 5</p>
    editable: [html]
    showTree: true
    checks:
      - label: There's only one `strong`
        selector: strong
        count: 1
      - label: The `strong` holds "daily"
        selector: strong
        text: daily
      - label: Both paragraphs are still there
        selector: p
        count: 2
    solution:
      html: |
        <p>Open <strong>daily</strong></p>
        <p>From 9 to 5</p>
    hints:
      - One element is opened but never closed.
      - The `strong` needs an end tag.
      - Close `strong` before `</p>`, because it's inside the paragraph.

  - type: explain-back
    id: explain-view-source
    concept: html.dom-scripting
    difficulty: 3
    prompt: >-
      Your script changed a heading, and the page shows the new text. But "View page source"
      still shows the old text. Why?
    rubric:
      - View page source shows the file the browser downloaded.
      - The browser builds the DOM from that file, and the screen is drawn from the DOM.
      - JavaScript changed the DOM, not the file, so only the DOM and the screen show it.
    modelAnswer: >-
      View page source shows the file, exactly as it arrived. The browser built the DOM from that
      file, and the screen is drawn from the DOM. My script changed an object in the DOM, not
      the file. To see what the page really holds now, I'd look in the Elements panel.

recap:
  - Explain the DOM as a tree of objects the browser builds from HTML.
  - Change the page from JavaScript with `querySelector` and `textContent`.
  - Use the Elements panel to see what the browser really built.

recall:
  - id: card-what-dom-is
    concept: html.dom
    front: What is the DOM?
    back: >-
      The tree of objects the browser builds from your HTML, one per element. The screen is
      drawn from it, and JavaScript can read and change it.
  - id: card-added-elements
    concept: html.dom
    front: Your file has only an `h1`. Which elements does the DOM have?
    back: >-
      `html`, `head`, `body` and the `h1` inside `body`. The browser adds the three it's
      missing.
  - id: card-change-text
    concept: html.dom-scripting
    front: How do you change the text of the first `p` on a page from JavaScript?
    back: >-
      `document.querySelector("p").textContent = "New text";`
  - id: card-elements-panel
    concept: html.parsing
    front: A page looks wrong, but your file seems fine. Where do you look?
    back: >-
      The Elements panel in the developer tools. It shows the DOM the browser built, repairs
      included.

