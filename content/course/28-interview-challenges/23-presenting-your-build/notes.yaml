summary: >-
  After a take-home or an on-site build, you usually present it: ten to fifteen minutes of
  talk and demo, then questions. The presentation is where the panel learns how you think.
  The code shows what you made; the talk shows why, what you rejected, and whether you can
  defend it under pressure.


  A strong talk is built on decisions, not features. It opens with the problem and what
  success means, states the constraint and what you left out, shows a simple diagram and
  two or three decisions with the option each one rejected, demos one realistic path, gives
  the evidence (tests, evals, known gaps), and ends by inviting the hardest question. About
  a third of the slot is left for questions, because the discussion often counts more than
  the talk.


  The questions reward ownership. A good answer owns the decision, says what would change
  it, and admits what you do not know with a plan to find out. "The team decided" and "the
  assistant wrote that part" both end a deep-dive badly, for the same reason: they hand the
  judgement to someone else.
remember:
  - Build the talk on two or three decisions, each with the option you rejected and why, not on a tour of features.
  - Open with the problem and what success means, so the panel can judge everything after against that goal.
  - Demo one realistic path plus one edge case such as a refusal, and keep a recording or screenshots ready if the live demo fails.
  - Leave about a third of the slot for questions, and end the talk by inviting the hardest one.
  - A strong answer owns the decision, names what would change it, and admits gaps with a plan to check.
  - State known gaps yourself in the evidence section; a gap you name reads as judgement, one the panel finds reads as a miss.
  - You own every line you submitted, including generated code, so be ready to walk through it and say how you verified it.
sections:
  - title: A twelve-minute script, worked in full
    body: |-
      Here is a talk for a help-article assistant built in four hours, with the words you
      might actually say. The timings leave six to eight minutes of a twenty-minute slot for
      questions.

      ```text
      0:00  Problem
            "Customers ask the same support questions all day. Success here means an answer
            from our own articles, with a citation, or an honest 'I don't have that
            information'. A wrong confident answer is worse than no answer."

      1:00  Scope
            "Four hours, so three must-haves: answer, cite, refuse. No login, English only,
            30 articles. Streaming and feedback buttons are on my next-steps list."

      2:00  Diagram and decisions
            "Page, one API route, a core module, an in-memory index, the model.
            Decision one: in-memory search, not a vector database, because 30 articles is
            a few hundred chunks and brute force takes milliseconds. I'd switch at around
            100,000 chunks or when we need filters.
            Decision two: refusal is an early return below a similarity score, not a prompt
            rule, because a prompt can be argued with and an if statement can't.
            Decision three: a small, fast model, because answers are short and grounded in
            the text we pass."

      5:00  Demo
            "A real question: 'Can I return a sale item?' Here's the answer, and the
            citation opens the article. Now a question the articles don't cover: it
            refuses, and the model was never called."

      9:00  Evidence
            "12 tests on the core and the route. A 20-question eval set: recall at 4 is
            0.93, and all five refusal cases refuse. Known gaps: the threshold is tuned on
            only 20 questions, and there's no streaming yet."

      11:00 Next steps
            "Streaming, feedback on answers to grow the eval set, then hybrid search for
            product codes. What would you like to push on?"
      ```

      Notice what is missing: no stack list, no file-by-file walk, no apology. Tools appear
      only as decisions. The gaps are stated before anyone asks. The last line hands the
      panel the floor on your terms.
  - title: Decisions that survive scrutiny
    body: |-
      A decision line has four parts: the choice, the option rejected, the reason tied to
      this build's constraint, and what would change your mind. It is the context,
      decision and consequences format of an architecture decision record, compressed to
      a sentence.

      ```text
      Weak:   Next.js, because it's the best framework.
      Strong: Next.js over a separate API server, because one deploy covers the page and
              the route in four hours. With a mobile client I'd split the API out.

      Weak:   Postgres for the data.
      Strong: Plain JSON files over a database, because the articles are read-only and
              change weekly. With edits from an admin screen I'd move them to Postgres.

      Weak:   I used embeddings.
      Strong: Embeddings over keyword search, because customers paraphrase the articles.
              Keyword search wins on product codes, so hybrid search is my next step.
      ```

      Pick the two or three decisions where a reasonable engineer could have gone the
      other way. Those are the ones the panel wants to probe, and choosing them yourself
      steers the questions towards ground you have prepared. A decision you later think
      was wrong is still worth presenting: say what you learned and what you would do now.
      That reads as seniority, not weakness.
  - title: Engineering the demo
    body: |-
      A demo is a small production system with an audience of four. Treat it like one.

      - **Prepare the path.** Know the exact questions you will type. Use one realistic
        case and one edge case, such as a refusal or an empty state. Do not improvise
        inputs live.
      - **Seed the state.** Start from a known database or index, so the demo does not
        depend on what you tried an hour ago.
      - **Reduce typing.** Keep inputs short, or paste them from a note. Enlarge the text
        so the panel can read it.
      - **Plan the failure.** Venue wifi and model APIs fail. Keep a recording or
        screenshots of the same path ready, and switch without apology: "The network isn't
        cooperating, so here's the same flow recorded this morning."
      - **Show the evidence live if you can.** Running the test suite or the eval script
        for ten seconds is more convincing than a slide with a number.

      Rehearse the whole talk aloud at least twice with a timer. Most people overrun the
      demo, which eats the question time where the marks often are.
  - title: Answering hard questions
    body: |-
      A structure that works for almost any follow-up: the answer in one sentence, the
      reason, the trade-off or what would change it. When you do not know, say so and say
      how you would find out.

      Some questions test honesty more than knowledge. "What breaks first at a hundred
      times the load?" has no measured answer in a four-hour build, and the panel knows it.
      "I haven't load tested it. My guess is the model calls, since each takes a second or
      two and has a rate limit. I'd check with a load test against a stub model, and the
      fixes would be caching repeated questions and queueing" is a strong answer.

      Some questions push back on a decision. Do not defend by reflex. Restate the
      constraint that drove the choice, agree where the objection is right, and say what
      would make you change it. If they have found a real flaw, say so plainly and fix it
      in words.

      Some questions ask about generated code. "Walk me through this function" gets a
      walk through, as if you wrote it, followed by how you checked it: the tests you
      added, the case you traced, the line you changed. Saying where AI helped is fine and
      often expected; being unable to explain what you submitted is not.
pitfalls:
  - >-
    **A feature tour.** Clicking through every screen shows what exists, which the panel can
    see for itself. Present decisions with their rejected options.
  - >-
    **Opening with the stack or an apology.** Neither tells the panel what problem you
    solved. Open with the problem and what success means.
  - >-
    **A live demo with no fallback.** One network failure turns the best part of the talk
    into dead air. Keep a recording ready.
  - >-
    **Reading code aloud.** The panel can read. Show code only when asked, or for one short
    function that carries a decision.
  - >-
    **Running over time.** An overlong demo eats the questions. Rehearse with a timer and
    cut the demo, not the evidence.
  - >-
    **Deflecting ownership.** "The team decided" or "the assistant wrote that" hands away
    the judgement being assessed. Own it, explain it, and say what you would change.
  - >-
    **Hiding gaps.** A gap the panel finds costs more than one you named. List known gaps
    in the evidence section.
interview:
  - question: Why did you choose X over Y?
    answer: >-
      I answer with the constraint that decided it. For example: "An in-memory index over a
      vector database, because the corpus is 30 articles, a few hundred chunks, and brute
      force search takes milliseconds. That made it faster to build, trivial to test, and
      one less service for you to run. I'd switch when the corpus reaches around a hundred
      thousand chunks, when we need metadata filters like tenant or date, or when several
      servers need to share the index. The retrieval sits behind one function, so the swap
      touches one module." Every part is there: the choice, the rejected option, the reason
      tied to this build, and what would change it.
  - question: What breaks first, and how would you know?
    answer: >-
      I name my best guess, the reason, and the signal I would watch. For the assistant:
      "The model calls. Each takes one to three seconds and the provider rate-limits us, so
      under load latency climbs and then requests fail with rate-limit errors. I'd know
      from p95 latency and the error rate on the ask route, which I'd log with the model
      call time separately from retrieval. The first fixes are caching answers to repeated
      questions, streaming so perceived latency drops, and a queue with backoff for rate
      limits." If I have not measured it, I say so, and describe the load test that would
      confirm it.
  - question: What did you leave out on purpose?
    answer: >-
      I point to my later list and give the reason for each. "Login, because the brief
      has anonymous customers. Streaming, because a working, tested answer path mattered
      more in four hours; it's my first next step. A vector database, because the scale
      doesn't need one. And an admin screen for uploading articles, because they live in
      the repository and change weekly." The point of the answer is that each omission was
      a decision made at the start, against the constraint, not something I ran out of time
      for. If something was genuinely unfinished, I say that too, separately.
  - question: Where did AI help, and how did you check its work?
    answer: >-
      Specifically and with evidence. "It drafted the chunker, the test scaffolding and
      most of the CSS. I wrote the refusal logic and the retrieval myself, since those
      carry the product's main rule. For generated code I wrote or reviewed the tests
      first and made each one fail before trusting it passing. It got one thing wrong: its
      top-k sorted ascending, so the slice kept the weakest chunks. My eval caught it,
      because recall dropped to near zero." That shows I used the tool, stayed in charge
      of the decisions, and verified by evidence rather than trust.
  - question: What would you do with another day?
    answer: >-
      I rank by value and risk, not by what is fun. "First, grow the eval set from real
      questions, because the threshold is tuned on only 20 and every other change depends
      on measuring well. Second, streaming, for perceived speed. Third, hybrid search, since
      keyword queries like product codes are the known retrieval weakness. And I'd add
      basic observability: request logs with retrieval scores and model latency, so we can
      see failures in use." Ordering them with reasons shows I would spend the day where it
      reduces the most risk.
  - question: How do you explain a technical result to a non-technical audience?
    answer: >-
      Start with the outcome and why it matters to them, not the method: "Answers now cite
      a source, so support staff can check them in seconds." Use one analogy at most, and
      show the working software rather than slides. Give one or two numbers they can
      repeat, such as "95% of answers cite a source". Present trade-offs as choices with
      consequences, like "faster or cheaper, pick one for this feature", so they can
      decide. Leave out the vocabulary unless they ask. Then stop and ask what they need to
      know next. The test is whether they could explain it to their own manager afterwards.
