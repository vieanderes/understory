summary: >-
  A **design doc** is a short written plan for a change, shared before the code exists. A
  one-page version has a fixed shape: the **problem** with a number someone can check,
  **goals and non-goals**, the **options** you considered, the **decision** with the
  trade-off you accept, the **rollout**, and the **risks and open questions**. Its job is to
  move the argument to the cheapest moment. Changing a paragraph costs a comment; changing
  merged code costs a week.


  It complements the ADR from the architecture chapter rather than replacing it. The design
  doc invites disagreement while the plan is still soft. The ADR records the outcome once
  it's settled, briefly, in the repository. A doc that's still being argued over is a design
  doc; a decision you're living with is an ADR.


  You don't need one for every change. Two-way doors, such as a new lint rule or a library
  behind your own interface, are faster to settle with a small pull request. Write one when
  the change is hard to undo, touches other teams or their callers, or will draw
  disagreement. Keep it to a page, because a doc nobody can review in one sitting gets
  skimmed, and skimmed docs are approved with their flaws intact.
remember:
  - 'A one-page design doc covers the problem, goals and non-goals, options, the decision and its trade-off, the rollout, and risks.'
  - State the problem with a number a reviewer can check, never as a solution such as "move to a search service".
  - Non-goals stop scope creep in review, and goals should protect what users rely on today.
  - Give the decision a reason and a named cost, or reviewers will argue the options again in the comments.
  - A rollout says who gets the change first, how you'd notice trouble and how you'd go back.
  - Keep every rollout step a two-way door until the last, and check nothing still uses the old path before removing it.
  - Write a design doc for one-way doors, cross-team changes and contested choices; settle two-way doors with a pull request.
sections:
  - title: A one-page doc, written out
    body: |-
      Here's the recipe search doc in full. It fits on a page because each section says one
      thing.

      ```yaml
      problem: 1 in 5 searches find nothing; "chickpea curries" misses "chickpea curry"
      goals:
        - plurals and word order match
        - results in under 300 ms at the evening peak
        - saved searches keep working
      non-goals: typo correction, ranking by cooking history
      options:
        - better LIKE queries: no new parts, still misses plurals
        - Postgres full-text search: stemming built in, runs in our database
        - a search service: best typo handling, one more system to run and pay for
      decision: Postgres full-text search; we accept weaker typo handling
      rollout: index first, 10% behind a flag for a week, then all; old /search kept
      risks: ranking may feel worse for short searches; saves get slightly slower
      open: do we search ingredients as well as titles?
      ```

      Three details make it reviewable. The problem has a number, so "better" can be
      checked after launch. Each option carries its own cost, so the decision line reads as
      a choice rather than a preference. And the open question is stated, so a reviewer who
      cares about ingredients says so now instead of after launch.

      If it won't fit on a page, that's information. Usually the change is two changes,
      such as "new search" and "new ranking", and each deserves its own doc.
  - title: Rollouts that can go back
    body: |-
      A rollout is a sequence of steps, and the question for each step is: if this goes
      wrong, how do we get back? Most steps should have a short answer.

      ```text
      1 build the index without blocking saves    back: drop the index
      2 new search for 10%, behind a flag         back: flag off
      3 compare for a week                        back: flag off
      4 new search for everyone                   back: flag off
      5 remove the old path                       back: none
      ```

      Steps 1 to 4 are two-way doors, the idea from Making the call. Step 5 is the only
      one-way door, and it's the one rollouts most often get wrong, because it feels like
      tidying up. The question to ask before it is "what still uses this?" Old mobile app
      versions, other teams' services, scheduled jobs and bookmarked URLs all call old
      paths long after you've stopped thinking about them.

      The answer comes from data, not memory: request logs grouped by caller or app
      version. A reasonable rule is that the old path goes only when its traffic has been
      zero, or near zero and accepted, for a set period. Until then, it can serve the new
      results behind the old address.

      State in the doc what you'll measure at each step and what makes you turn back, such
      as "empty results above 10% or search time above 300 ms". A rollout without a turn-back
      condition is a plan to notice problems from support tickets.
  - title: Writing for the reviewer
    body: |-
      The reader of a design doc is a busy reviewer who'll give it fifteen minutes. Three
      habits respect that.

      **Lead with the problem and the decision.** A reviewer who reads only the first five
      lines should know what's wrong and what you propose. Put the options and the rollout
      beneath, for those who want to check.

      **Show the options fairly.** Write the strongest version of the option you didn't pick,
      the steelman. If a reviewer could make a better case for the search service than your
      doc does, they will, in the comments. A fair options section ends that thread before it
      starts.

      **Ask specific questions.** "Thoughts?" gets silence or bike-shedding about names. "Is
      a week at 10% long enough to see weekend searches?" and "Does anyone depend on
      /search outside the apps?" get answers you can use. Give the review an end date, and
      name the people whose agreement you need, such as the mobile team for the old
      endpoint.

      After the review, record the outcome in an ADR and link the doc from it. The doc then
      becomes history: it explains how you got there, and it shouldn't be kept up to date
      as the code changes.
pitfalls:
  - '**A solution as the problem.** "We need a search service" leaves nothing to weigh options against. State what''s wrong for users, with a number.'
  - '**A decision with no reason or cost.** Reviewers fill the gap by re-arguing every option. Say why, and what you accept in exchange.'
  - '**No non-goals.** Every reviewer adds a wish, and the scope doubles. List what you won''t do yet.'
  - '**Removing the old path on schedule.** Old app versions and other teams still call it. Remove it when logs show nothing does.'
  - '**Ten pages.** Nobody reviews ten pages properly, so flaws pass. Keep it to one, and split the change if it won''t fit.'
verify:
  - lens: breaks
    check: Before removing an old endpoint or table, count its calls by app version and caller over a set period, and wait for zero.
  - lens: tests
    check: Name the measurement and the turn-back threshold for every rollout step, such as empty results above 10%.
  - lens: confuses
    check: Check the problem states a number a reviewer can verify, and the decision names its reason and the cost accepted.
  - lens: scales
    check: Ask whether the chosen option still meets the goals at ten times the data, and say which risk grows first.
interview:
  - question: Walk me through how you'd write a design doc for a significant change.
    answer: >-
      One page, in a fixed order. The problem first, with a number, such as "1 in 5 searches
      find nothing". Then goals, including what must keep working, and non-goals, so review
      doesn't grow the scope. Then two or three real options, each with its cost, and the
      decision with the trade-off I accept. Then the rollout: who gets it first, what I
      measure, the turn-back condition, and how each step is undone. Last, risks and open
      questions, phrased as specific questions for named reviewers. I'd give the review an
      end date and record the outcome in an ADR. The trade-off is a day of writing, which
      pays back whenever the change is hard to undo.
  - question: What's the difference between a design doc and an ADR?
    answer: >-
      Timing and purpose. A design doc comes before the decision and exists to invite
      disagreement: it lays out the problem, options and a proposed plan, including rollout
      and risks, for review. An ADR comes after and exists to remember: a short record in the
      repository of the context, the decision and its consequences, superseded rather than
      edited when things change. A design doc can be long-ish and messy; an ADR is a few
      paragraphs. In practice, a reviewed design doc produces an ADR, and the ADR links back
      to it for anyone who wants the full argument. Small, reversible decisions often skip
      the doc and get only an ADR, or nothing.
  - question: How do you make sure a rollout is safe?
    answer: >-
      I make every step reversible except the last, and I treat the last one with suspicion.
      Typically that's building the new path alongside the old, sending a small share of
      traffic behind a flag, comparing the measurements I named in advance, then widening.
      Each step has a turn-back condition, such as an error or empty-result rate, and a way
      back, usually turning the flag off. The one-way step is removing the old path, and
      before it I check the logs for anything still calling it: old app versions, other
      services, scheduled jobs. The trade-off is running two paths for a while, which costs
      some complexity but buys a cheap way back.
