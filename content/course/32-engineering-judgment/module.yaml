id: judgment
number: 32
title: "Engineering judgment"
summary: "Knowing what to verify: what breaks, what scales, what confuses the next reader, what leaks and what a change could regress, plus pressure-testing designs, making trade-offs, ranking work and drawing workflows. Its lessons are woven into the journey, each after the lesson it builds on."
why: "Writing code is getting cheaper, and knowing what will break, leak or confuse before it ships is what makes an engineer worth trusting."
youCanBuild: "A review of an AI-written pull request covering security, efficiency, regressions and tests, with a pre-mortem, a ranked plan and a workflow diagram."
concepts:
  - id: judgment.five-questions
    title: "The five questions"
    summary: "Before trusting code, ask what breaks, what scales, what confuses the next reader, what leaks, and how you would prove it works."
  - id: judgment.verifying-ai-code
    title: "Verifying AI-written code"
    summary: "Code from an assistant looks finished, so it gets the same questions as any other code before it is trusted."
  - id: judgment.failure-modes
    title: "Listing failure modes"
    summary: "Inputs from outside, dependencies, concurrency and resources each fail in known ways, and listing them finds the bugs before users do."
  - id: judgment.partial-failure
    title: "Partial failure"
    summary: "A step that half succeeds, such as a charge taken but the order not saved, is the failure most code forgets."
  - id: judgment.time-and-boundaries
    title: "Time and boundaries"
    summary: "Empty lists, limits, midnight, time zones and leap days are where correct-looking code breaks."
  - id: judgment.unbounded-work
    title: "Unbounded work"
    summary: "A query without a limit, a list held in memory or a loop of calls per item grows with the data until it falls over."
  - id: judgment.hot-paths
    title: "Hot paths"
    summary: "The few lines run on every request decide the cost at scale, so they are where to look first."
  - id: judgment.quick-estimates
    title: "Quick estimates"
    summary: "Multiplying users, requests and sizes on the back of an envelope shows whether a design holds at ten times the load."
  - id: judgment.surprise
    title: "The principle of least surprise"
    summary: "Code that behaves as its name and shape suggest is safe to change, and every surprise is a future bug."
  - id: judgment.hidden-invariants
    title: "Hidden invariants"
    summary: "A rule the code relies on but never states, such as a list always being sorted, breaks the first time someone does not know it."
  - id: judgment.implicit-contracts
    title: "Implicit contracts"
    summary: "Callers come to depend on behaviour nobody promised, such as order or timing, so changing it breaks them."
  - id: judgment.data-tracing
    title: "Tracing a field"
    summary: "Following one sensitive field from where it enters to every place it is stored, sent or printed shows where it can leak."
  - id: judgment.leak-sinks
    title: "Where data leaks"
    summary: "Logs, error messages, URLs, caches, analytics events and model prompts are the usual places personal data escapes."
  - id: judgment.blast-radius
    title: "Blast radius"
    summary: "The callers, contracts and data a change touches decide how much it can break and how carefully it must be rolled out."
  - id: judgment.characterisation-tests
    title: "Characterisation tests"
    summary: "Tests that record what code does today, before you change it, show exactly what your change altered."
  - id: judgment.choosing-regression-tests
    title: "Choosing regression tests"
    summary: "The tests worth adding for a change are the ones that would fail if it broke an existing caller or contract."
  - id: judgment.pre-mortem
    title: "The pre-mortem"
    summary: "Imagining the project has already failed and asking why surfaces risks that optimism hides."
  - id: judgment.failure-mode-table
    title: "A light failure-mode table"
    summary: "Each part of a design gets a row with how it fails, how likely and how bad that is, and how you would notice."
  - id: judgment.steelman
    title: "Steelman and adversarial review"
    summary: "Arguing the strongest case for the option you rejected, and inviting someone to attack yours, tests a design before code does."
  - id: judgment.build-or-buy
    title: "Build or buy"
    summary: "Building costs upkeep for ever, and buying costs money and control, so the choice turns on whether the part is your core."
  - id: judgment.boring-technology
    title: "Boring technology"
    summary: "Well-known tools have known failure modes, so new technology is spent only where it earns its risk."
  - id: judgment.reversible-decisions
    title: "One-way and two-way doors"
    summary: "A decision that is cheap to reverse is made quickly, and one that is hard to undo gets more care and evidence."
  - id: judgment.jobs-to-be-done
    title: "Jobs to be done"
    summary: "Framing a feature by the job the user is trying to get done keeps the work on outcomes rather than on features."
  - id: judgment.intent-mapping
    title: "Intent mapping"
    summary: "Listing what users are trying to achieve and how they would say it turns vague requests into concrete, testable cases."
  - id: judgment.prioritisation-scores
    title: "Impact, effort, MoSCoW and RICE"
    summary: "Scoring work by impact against effort, or with MoSCoW or RICE, turns a wish list into an order you can defend."
  - id: judgment.non-goals
    title: "Non-goals"
    summary: "Writing down what the work will not do keeps scope honest and stops reviewers expecting it."
  - id: judgment.swimlanes
    title: "Swimlanes"
    summary: "A swimlane diagram shows which actor, a person, the AI or the system, does each step and where work is handed over."
  - id: judgment.sequence-diagrams
    title: "Sequence diagrams"
    summary: "A sequence diagram shows the messages between parts in time order, which exposes missing calls and wrong assumptions."
  - id: judgment.state-diagrams
    title: "State diagrams"
    summary: "A state diagram lists every state and the moves between them, so impossible and missing transitions become visible."
  - id: judgment.failure-paths
    title: "Failure paths on the diagram"
    summary: "A workflow drawing that shows timeouts, retries and rejections is the one that finds the bugs."
  - id: judgment.end-to-end-review
    title: "Reviewing a whole change"
    summary: "A full review reads the intent, then checks security, efficiency, regressions and tests in turn, before style."
  - id: judgment.review-verdict
    title: "Explaining the verdict"
    summary: "A review ends with a clear verdict and the reasons that matter most, so the author knows what must change."
