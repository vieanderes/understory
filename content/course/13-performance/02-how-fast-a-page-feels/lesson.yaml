deepDive: >-
  Lighthouse can't measure INP, because nobody interacts during its load. It reports Total
  Blocking Time instead: how long the main thread was too busy to answer input. A high TBT
  usually means a high INP in the field.


  CLS isn't a time. Each shift scores the share of the screen that moved times how far it
  moved. The page's CLS is its worst burst of shifts. Shifts within half a second of a tap
  don't count, since the person expected a change.


  Field data for public sites comes from the Chrome User Experience Report, which collects
  timings from Chrome users who opted in. It covers the last 28 days, so a fix takes weeks
  to show there. Your own `web-vitals` reports show it the next day.
