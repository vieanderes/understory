id: atlas.pwas
title: "PWAs: websites that work offline"
objective: Make a website work offline with a service worker, make it installable with a manifest, and know the iPhone's limits.
level: advanced
minutes: 10
concepts: [atlas.service-workers, atlas.offline-strategies, atlas.installability, atlas.ios-pwa-limits]
prerequisites: [atlas.one-product-three-platforms, perf.caching-layers, scale.web-workers]
opening:
  text: >-
    You'll make a website that still opens with no signal and sits on the home screen like an
    app. Then you'll know where iPhones draw the line, before a user finds it for you.

steps:
  - type: prose
    id: what-a-pwa-is
    body: |-
      A **progressive web app**, or PWA, is a website that works offline and can be installed
      like an app. Two files make one. A **service worker** is a script that keeps it working
      offline. A **manifest** names the app and its icon, so it can be installed.

      ```js
      // in the page: ask the browser to run sw.js for this site
      navigator.serviceWorker.register('/sw.js');
      ```

  - type: prose
    id: name-service-worker
    body: >-
      A service worker is a worker, like the ones that took CPU work off the main thread: no
      page of its own. Once registered, it sits between your site and the network, and sees every request.


      Its `fetch` event is the hook. `event.respondWith(...)` answers with any response you
      like, often one from `caches`, the browser's store of saved responses.

  - type: predict-output
    id: predict-offline-reload
    concept: atlas.service-workers
    difficulty: 1
    language: js
    code: |
      // sw.js
      self.addEventListener('fetch', (event) => {
        event.respondWith(
          fetch(event.request).catch(() => caches.match('/offline.html')),
        );
      });
    question: The signal drops and the user reloads the bus-times page. What appears?
    choices:
      - text: The browser's "No internet" page
        feedback: >-
          That's a site with no service worker. Here your script answers the reload.
      - text: The saved offline page
        correct: true
        feedback: >-
          Right. The network failed, so the `catch` answered from the cache.
      - text: The bus times from the last visit
        feedback: >-
          Only if the handler served them from the cache. This one falls back to the offline page.

  - type: prose
    id: name-strategies
    body: >-
      The handler decides, per request, where the answer comes from. **Cache-first**: serve
      the saved copy, never ask. **Network-first**: ask the network, and fall back to the copy
      when it fails. **Stale-while-revalidate**: serve the copy now, refresh it for next time.


      You met that last one as a header in the caching lesson. Here your code decides, and it
      works offline.

  - type: playground
    id: fix-stale-timetable
    concept: atlas.offline-strategies
    difficulty: 2
    prompt: >-
      This pretend worker is cache-first, so it shows Monday's timetable even online. Make
      `respond` network-first: try `network`, save and return what it gives, and use the cache
      when it throws.
    html: |
      <p>Online: <output id="online"></output></p>
      <p>Offline: <output id="offline"></output></p>
    js: |
      const cache = { '/times.json': 'Timetable from Monday' };
      function network(url, online) {
        if (!online) throw new Error('Failed to fetch');
        return 'Timetable from today';
      }
      function respond(url, online) {
        if (cache[url]) return cache[url];
        return network(url, online);
      }
      document.querySelector('#online').textContent = respond('/times.json', true);
      document.querySelector('#offline').textContent = respond('/times.json', false);
    editable: [js]
    checks:
      - label: Online shows today's timetable
        selector: '#online'
        text: today
      - label: Offline still shows a timetable
        selector: '#offline'
        text: Timetable
    solution:
      js: |
        const cache = { '/times.json': 'Timetable from Monday' };
        function network(url, online) {
          if (!online) throw new Error('Failed to fetch');
          return 'Timetable from today';
        }
        function respond(url, online) {
          try {
            cache[url] = network(url, online);
          } catch (error) {
            // offline: fall through to the saved copy
          }
          return cache[url];
        }
        document.querySelector('#online').textContent = respond('/times.json', true);
        document.querySelector('#offline').textContent = respond('/times.json', false);
    hints:
      - Ask the network first, inside a `try`.
      - When the network answers, save it in `cache[url]`, so offline has the newest copy.
      - 'Wrap `cache[url] = network(url, online);` in `try`, then `return cache[url];`'

  - type: fill-blank
    id: fill-manifest
    concept: atlas.installability
    difficulty: 2
    language: json
    prompt: >-
      Now the manifest. Give the app its name.
      Open it in its own window, without the browser bar: the manifest calls that `standalone`.
    template: |
      {
        "{{1}}": "Bus times",
        "start_url": "/",
        "{{2}}": "{{3}}",
        "icons": [{ "src": "/icon.png", "sizes": "192x192", "type": "image/png" }]
      }
    blanks:
      - key: '1'
        answer: name
      - key: '2'
        answer: display
      - key: '3'
        answer: standalone
    bank: [name, title, display, window, standalone, browser]

  - type: prose
    id: name-ios-limits
    body: >-
      iPhones are where PWAs meet their limits. Safari never offers to install: the user taps
      Share, then Add to Home Screen. **Push** reaches only a web app added that way.


      And Safari deletes a site's saved data after seven days of use without a visit. So a
      user who ignores your site for a fortnight comes back to an empty cache.

  - type: multiple-choice
    id: pick-iphone-push
    concept: atlas.ios-pwa-limits
    difficulty: 2
    question: Your PWA sends a push when a bus is late. Which iPhone users get it?
    choices:
      - text: Those who added it to the Home Screen
        correct: true
        feedback: >-
          Right. On iPhones, push is only for web apps installed that way.
      - text: Everyone who visited in Safari
        feedback: >-
          On Android, a visit is enough to ask. On iPhones, a Safari tab never gets push.
      - text: Nobody, iPhones have no web push
        feedback: >-
          They do, from iOS 16.4, but only for web apps on the Home Screen.

  - type: ai-review
    id: review-update-never-lands
    concept: atlas.service-workers
    difficulty: 3
    language: js
    request: Precache the new logo and the offline page, and roll the change out.
    flawClass: edge-case
    code: |
      const PRECACHE = ['/', '/offline.html', '/logo-v2.png'];

      self.addEventListener('install', (event) => {
        event.waitUntil(caches.open('v2').then((cache) => cache.addAll(PRECACHE)));
      });

      self.addEventListener('activate', (event) => {
        event.waitUntil(caches.delete('v1'));
      });
    prompt: >-
      An assistant wrote this. A new visitor sees the new logo. Regulars keep the old logo
      for days, reload after reload. A new worker normally waits until every open tab of the
      site is closed. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Install never tells the new worker to take over now
        correct: true
        feedback: >-
          Yes. Call `self.skipWaiting()` in install, and it replaces the old worker at once.
      - text: '`caches.delete` runs before the new cache is used'
        feedback: >-
          Install always comes before activate. Deleting the old cache on activate is usual.
      - text: '`addAll` should be `add`, one file at a time'
        feedback: >-
          `addAll` fetches and saves the whole list in one go. It's the right call here.
    fix: |
      self.addEventListener('install', (event) => {
        event.waitUntil(caches.open('v2').then((cache) => cache.addAll(PRECACHE)));
        self.skipWaiting();            // take over now, not when the last old tab closes
      });
      self.addEventListener('activate', (event) => {
        event.waitUntil(Promise.all([caches.delete('v1'), self.clients.claim()]));
      });

  - type: explain-back
    id: explain-fortnight-later
    concept: atlas.ios-pwa-limits
    difficulty: 3
    prompt: >-
      Your PWA works offline on Android for months. An iPhone user opens it in Safari, ignores
      it for a fortnight, and finds it empty and silent. Why?
    rubric:
      - Safari deletes a site's saved data, caches included, after seven days of use without a visit.
      - Push on iPhones only reaches web apps added to the Home Screen, so a Safari tab never gets one.
      - Safari never offers to install, so most iPhone users never get the app-like version.
    modelAnswer: >-
      Two limits met at once. In Safari, a site left unvisited for seven days of browsing loses its saved data.
      The service worker's cache goes with it. So the offline copy
      is gone. And no push ever reached them, because on iPhones push only works for a web
      app on the Home Screen. Nothing told them to add it, and Safari doesn't offer. On
      Android the install prompt and the lasting storage did both jobs.

recap:
  - Register a service worker, and answer requests from `caches` in its `fetch` handler.
  - Pick a strategy per request, such as network-first with the cache as a fallback.
  - Serve a manifest to be installable, and expect manual install, lost data and limited push on iPhones.

recall:
  - id: card-service-worker
    concept: atlas.service-workers
    front: What is a service worker, and what can it do with a request?
    back: >-
      A worker script with no page that sits between the site and the network. Its `fetch`
      handler can answer any request, from the cache or the network.
  - id: card-strategies
    concept: atlas.offline-strategies
    front: How do cache-first, network-first and stale-while-revalidate differ?
    back: >-
      Cache-first never asks. Network-first asks and falls back to the copy. Stale-while-
      revalidate serves the copy and refreshes it for next time.
  - id: card-install
    concept: atlas.installability
    front: What does a site need before a browser will install it?
    back: >-
      A manifest with a name, icons and a display mode, linked from the page, served over
      HTTPS.
  - id: card-ios-limits
    concept: atlas.ios-pwa-limits
    front: Name the three iPhone limits on a PWA.
    back: >-
      Install is a manual Add to Home Screen. Saved data can go after seven days without a
      visit. Push works only for web apps on the Home Screen.

