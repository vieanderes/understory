term: promise
short: An object standing for a value that isn't ready yet, which will either arrive or fail later.
explain: |
  Fetching data takes time. Instead of freezing, `fetch` hands back a placeholder at once.
  Later it settles: fulfilled with a value, or rejected with an error.

  You read the result with `.then` or `await`. A rejection that nobody handles becomes an
  "unhandled rejection", and the real failure goes unseen. End every chain with a way to
  catch the error.
analogy: The buzzer a café hands you after you order. It isn't coffee, but it buzzes when the coffee's ready, or when they've run out.
example:
  language: js
  code: |
    fetch('/api/books')
      .then((res) => res.json())
      .then((books) => console.log(books))
      .catch((error) => console.error(error));
usage: This returns a promise, so the caller has to await it or the error goes nowhere.
twin:
  term: async-await
  difference: A promise is the placeholder value itself. `async`/`await` is syntax for waiting on promises that reads top to bottom, and every `async` function returns a promise.
related:
  - async-await
  - callback
  - event-loop
level: 1
