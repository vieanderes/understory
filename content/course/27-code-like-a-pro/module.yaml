id: pro
number: 27
title: "Code like a pro"
summary: "What makes code look professional rather than amateur, language by language: the amateur tells, idiomatic JavaScript, TypeScript, Python, production Python, React, SQL, HTML and CSS, and commits and pull requests."
why: "Reviewers judge your skill in seconds from small signs, and the same signs decide how easy your code is to live with."
youCanBuild: "A before-and-after portfolio: one amateur snippet per language rewritten to a professional standard, with the reasons."
concepts:
  - id: pro.amateur-tells
    title: "Amateur tells"
    summary: "Leftover debug output, commented-out code, vague names like data or temp, magic numbers and copy-paste are noticed first in any review."
  - id: pro.consistency
    title: "Consistency"
    summary: "One formatting, naming and structure style across a codebase, enforced by tools, reads as deliberate even to someone new."
  - id: pro.leaving-no-trace
    title: "Leaving no trace"
    summary: "A finished change contains no debug output, no stray files, no unused imports and no unrelated edits."
  - id: pro.js-idioms
    title: "Modern JavaScript idioms"
    summary: "const by default, destructuring, spread, template literals, optional chaining and nullish coalescing replace older, noisier patterns."
  - id: pro.declarative-arrays
    title: "Declarative array code"
    summary: "map, filter and find say what they produce, while a plain loop still wins when it exits early or does several things at once."
  - id: pro.async-style
    title: "Async style"
    summary: "async and await with try and catch read top to bottom, and independent calls run together with Promise.all."
  - id: pro.semantic-markup
    title: "Semantic markup"
    summary: "Elements chosen for meaning, such as button, nav and label, work with keyboards and screen readers without extra code."
  - id: pro.maintainable-css
    title: "Maintainable CSS"
    summary: "Design tokens, low and flat specificity, no !important and a clear naming scheme keep styles predictable as they grow."
  - id: pro.illegal-states
    title: "Illegal states unrepresentable"
    summary: "A discriminated union allows only valid combinations of fields, so whole classes of bug cannot be written."
  - id: pro.unknown-over-any
    title: "unknown over any"
    summary: "any switches checking off, while unknown forces a check before use, which keeps untrusted data honest."
  - id: pro.inference-over-annotation
    title: "Inference over annotation"
    summary: "Annotating function boundaries and letting TypeScript infer the rest keeps types accurate and code short."
  - id: pro.derived-state
    title: "Derive, don't sync"
    summary: "A value computable from props or state is calculated during render, never copied into state and kept in step with an effect."
  - id: pro.effect-discipline
    title: "Effect discipline"
    summary: "Effects synchronise with systems outside React, and most other uses of useEffect have a simpler, bug-free replacement."
  - id: pro.component-boundaries
    title: "Component boundaries"
    summary: "Components split by responsibility, pass children instead of drilling props, and keep state as close as possible to where it is used."
  - id: pro.sql-style
    title: "SQL style"
    summary: "Explicit column lists, consistent casing and one clause per line make queries easy to read and safe to change."
  - id: pro.set-based-thinking
    title: "Set-based thinking"
    summary: "One statement over a set of rows replaces a loop of single-row queries in application code."
  - id: pro.readable-queries
    title: "Readable queries with CTEs"
    summary: "Common table expressions name each step of a complex query, so it reads top to bottom like a pipeline."
  - id: pro.pythonic-idioms
    title: "Pythonic idioms"
    summary: "Iterating directly, unpacking, enumerate, zip, comprehensions and with blocks replace index loops and manual clean-up."
  - id: pro.eafp
    title: "EAFP"
    summary: "Easier to ask forgiveness than permission: try the operation and catch the specific exception, rather than checking every condition first."
  - id: pro.python-logging
    title: "Logging, not print"
    summary: "The logging module gives levels, timestamps and destinations that print cannot, and libraries never configure it themselves."
  - id: pro.stdlib-first
    title: "The standard library first"
    summary: "pathlib, collections, itertools, dataclasses and functools already solve many problems people write by hand."
  - id: pro.src-layout
    title: "Project layout"
    summary: "A src layout, one package per concern and a pyproject.toml holding tools and dependencies make a project installable and testable."
  - id: pro.strict-tooling
    title: "Strict tooling"
    summary: "A strict type checker, a broad ruff rule set and pre-commit checks catch whole classes of problems before review."
  - id: pro.structured-logging
    title: "Structured logging"
    summary: "Logs written as key-value records with a request id can be searched and joined, unlike free text."
  - id: pro.atomic-commits
    title: "Atomic commits"
    summary: "Each commit makes one logical change that builds and passes tests, with a short imperative subject line."
  - id: pro.pr-descriptions
    title: "Pull request descriptions"
    summary: "A description says what changed, why, how it was tested and what to look at, so a reviewer starts in the right place."
  - id: pro.project-readme
    title: "A useful README"
    summary: "A README says what the project is, how to run it and how to test it, in the first screen."
