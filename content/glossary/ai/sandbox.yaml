term: sandbox
aka:
  - sandboxing
  - agent sandbox
short: A sealed-off place to run code or an agent, with limited files, network and permissions.
explain: |
  An agent that runs shell commands can run the wrong one. Code a model wrote can do anything
  its process is allowed to do. You want mistakes to land somewhere they can't spread.

  A sandbox is that somewhere. It's a container or VM with only the files it needs and no secrets.
  Its network access is limited to an allow-list. Whatever happens inside, the rest of the machine
  and the internet are out of reach.

  The trap is trusting it for everything. A tool that calls your production API from outside
  the sandbox isn't contained by it. Each tool needs its own limits too.
analogy: A sandpit in a playground. Dig, build and knock things over; the sand stays in the pit.
usage: Run the generated migration in the sandbox first; it has a copy of the schema and no network.
