term: performance budget
aka: [ perf budget, size budget, bundle budget ]
short: A limit on a speed measure or file size that fails the build when a change crosses it.
explain: |
  Pages rarely get slow in one go. Each change adds 10 KB, nobody notices, and a year later
  the page is twice the size.

  So you write the limit down where a machine checks it. Say, 170 KB of JavaScript for the
  home page. CI fails a pull request that goes over. The team then decides on purpose: cut
  something, or raise the budget with a reason.
analogy: A suitcase weight limit at the airport. You don't find out you packed too much after you've landed.
example:
  language: json
  code: |
    {
      "budgets": [
        { "path": "/", "resourceSizes": [{ "resourceType": "script", "budget": 170 }] }
      ]
    }
usage: This pull request breaks the performance budget by 40 KB; can the PDF library load on demand?
related: [ code-splitting, tree-shaking, continuous-integration, lab-data ]
level: 2
lessons: [ perf.cost-of-javascript, perf.shipping-less-javascript ]
