term: layout file
aka: [ layout.tsx, shared layout, nested layout ]
short: A wrapper component that frames every page below its folder and stays mounted when you move between them.
explain: |
  Most pages share a header, a menu and a footer. Copying them into every page means copying
  every fix too. Write the frame once, and each page is drawn inside it.

  In Next.js a `layout.tsx` receives the page as `children`. Layouts nest: the root layout
  wraps a blog layout, which wraps each post. Moving between two posts swaps only the page.
  The layout keeps its state, such as an open menu or a half-typed search.
analogy: A picture frame on the wall. You change the photo inside; the frame never comes down.
example:
  language: tsx
  code: |
    // app/blog/layout.tsx
    export default function BlogLayout({ children }: { children: React.ReactNode }) {
      return (
        <section>
          <nav>All posts</nav>
          {children}
        </section>
      );
    }
usage: Put the sidebar in the dashboard layout file, so it keeps its scroll position between pages.
related: [ file-based-routing, client-side-navigation, component, state ]
level: 2
lessons: [ next.app-router ]
