deepDive: |-
  **Two keys save hours.** Press Tab halfway through a name and the shell completes it,
  quotes and all. Press the up arrow to bring back your last command.

  **Quoting.** `mkdir "holiday photos"` and `mkdir holiday\ photos` both make one folder.
  The quotes and the backslash are for the shell. `mkdir` only ever sees one name. Names
  with spaces trip up scripts and AI-written commands alike, which is why developers avoid
  them.

  **Hidden files.** `ls` skips names that start with a dot, such as `.git` or `.env`. Run
  `ls -a` to see them. `-a` is an **option**: an argument that changes how a program
  behaves, rather than naming what it works on.

  **Windows.** PowerShell and Command Prompt write paths as `C:\Users\sam`, with
  backslashes. Most web developers on Windows use WSL, which gives a Linux shell with the
  same commands as this lesson.

  **Error wording differs.** In zsh, the default shell on a Mac, a failed `cd` prints
  `cd: no such file or directory: missing`. Bash prints `cd: missing: No such file or
  directory`. Same meaning, different order.
