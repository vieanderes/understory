id: cs.memory-and-runtimes
title: Memory and runtimes
objective: Explain stack and heap, GC, and how V8 interprets and JIT-compiles.
level: advanced
minutes: 10
concepts: [cs.stack-and-heap, cs.garbage-collection, cs.jit]
prerequisites: [perf.cost-of-javascript, js.references-and-copying]
opening:
  text: >-
    You'll know where your values live, who cleans them up, and why the same function gets
    faster as it runs. It turns "memory keeps climbing" from a mystery into a search.

steps:
  - type: prose
    id: name-stack-and-heap
    body: >-
      Your program's memory has two main areas. Each call gets a **frame** on the **stack**
      for its parameters and local variables, as in the recursion lesson. When the call
      returns, its frame is gone.


      Objects and arrays live on the **heap**, a bigger area. A variable holds only a
      reference to one, so an object outlives the call that made it. (It isn't the heap from
      the trees lesson.)

  - type: predict-output
    id: predict-copy-or-share
    concept: cs.stack-and-heap
    difficulty: 1
    language: js
    code: |
      function addPoint(score, player) {
        score = score + 1;
        player.score = player.score + 1;
      }

      let score = 10;
      const player = { score: 10 };
      addPoint(score, player);
      console.log(score, player.score);
    question: One point is added to a number and to an object. What does it log?
    choices:
      - text: '`11 11`'
        feedback: >-
          The function's frame got its own copy of the number. Changing the copy leaves the
          caller's `score` at 10.
      - text: '`10 11`'
        correct: true
        feedback: >-
          Right. The number was copied. The object was shared, as the references lesson showed.
      - text: '`10 10`'
        feedback: >-
          The object isn't copied. Both names point at one object on the heap, so the change
          shows outside.

  - type: prose
    id: name-garbage-collection
    body: >-
      Who frees the heap? The **garbage collector**. It starts from the **roots**: globals,
      and the variables in live stack frames. It follows every reference, like a graph walk,
      and marks what it reaches. Anything unmarked is garbage, and its memory is reused.


      So the rule is simple: reachable means kept. A leak is memory you no longer need that's
      still reachable.

  - type: bug-hunt
    id: pick-cache-survives
    concept: cs.garbage-collection
    difficulty: 2
    language: js
    code: |
      const cache = new Map();

      function report(id) {
        const data = [];
        for (let i = 0; i < 200000; i++) data.push({ id: i });
        cache.set(id, data);
        return data.length;
      }

      for (let id = 0; id < 10; id++) report(id);
    prompt: >-
      Every `report` call has returned, so every `data` variable is gone. Yet all ten arrays
      stay on the heap, 84 MB of them. Tap the line that keeps them alive.
    lines: [6]
    reasons:
      - text: The global `Map` still points at every array
        correct: true
        feedback: >-
          Yes. The `Map` is a root's neighbour, so everything in it is reachable.
      - text: '`data` is never set to `null`'
        feedback: >-
          The frame that held `data` is gone already. The `Map` is what still points at it.
      - text: '`push` copies each object twice'
        feedback: >-
          `push` stores one reference. The arrays stay because something can still reach them.

  - type: ai-review
    id: review-cache-key-grows
    concept: cs.garbage-collection
    difficulty: 3
    language: js
    request: Building a user's report is slow. Cache it so repeat requests are instant.
    flawClass: performance
    code: |
      const cache = new Map();

      function getReport(request) {
        // request looks like { userId: 2, requestedAt: 1726650000000 }
        const key = JSON.stringify(request);
        if (!cache.has(key)) {
          cache.set(key, buildReport(request.userId));
        }
        return cache.get(key);
      }
    prompt: >-
      An assistant wrote this. The test asked for one report and got the right rows. In
      production the server's memory climbs all day, and no request is ever instant. Tap the
      line at fault.
    lines: [5]
    reasons:
      - text: '`Map` can''t use strings as keys'
        feedback: >-
          It can use anything as a key, and strings work well. The trouble is what this string
          contains.
      - text: The key includes the time, so it never repeats
        correct: true
        feedback: >-
          Yes. 300 requests from 3 users made 300 entries and 284 MB. Key by `userId`.
      - text: '`cache.get` should be awaited'
        feedback: >-
          `Map` methods are synchronous. There's nothing to wait for. Look at when `has` can
          ever be true.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'Ask for one user''s report twice, a moment apart'
          correct: true
          feedback: >-
            Right. The second call should hit the cache, and here it never does.
        - text: Ask for one report and check its rows
          feedback: >-
            That's the test it passed. The rows are right, but no key ever repeats.
        - text: Check the cache starts empty
          feedback: >-
            It does start empty. The trouble is that it only ever grows.
    fix: |
      const key = request.userId;          // 3 users, 3 entries, 6 MB
      // and cap the cache, or entries for users who left stay for ever

  - type: code-challenge
    id: write-garbage
    concept: cs.garbage-collection
    difficulty: 4
    language: ts
    prompt: >-
      Write `garbage(heap, roots)`. `heap` maps each object's id to the ids it references.
      `roots` are the ids the program can reach directly. Return the ids a collector would
      free, sorted.


      An object is live if a root reaches it, through any chain of references. Everything
      else is garbage. That includes two objects that only point at each other.


      So with `app` as the only root, a `parent` and `child` that reference each other are
      both returned.
    hints:
      - It's the graphs lesson again. Traverse from the roots, and keep a list of what you reach.
      - Live objects can form cycles, so check your list before you visit an id again.
      - 'Start with `const live: string[] = [];` and `const toVisit = [...roots];`'

  - type: prose
    id: name-interpreter-and-jit
    body: >-
      One more thing the runtime does for you. **V8** is the engine that runs JavaScript in
      Chrome and in Node. It turns your code into **bytecode**, simple instructions, and an
      **interpreter** runs them one at a time. That starts at once, but runs slowly.


      A **hot** function, one that runs a lot, goes to the **JIT compiler**. It makes
      **machine code**, the instructions the CPU runs directly.

  - type: predict-output
    id: predict-warm-function
    concept: cs.jit
    difficulty: 2
    language: js
    code: |
      function total(prices) {
        let sum = 0;
        for (let i = 0; i < prices.length; i++) sum = sum + prices[i];
        return sum;
      }
      // prices holds 1,000 whole numbers. performance.now() is the time in ms
      let start = performance.now();
      for (let run = 0; run < 100; run++) total(prices);
      console.log((performance.now() - start).toFixed(1));   // 0.7

      start = performance.now();
      for (let run = 0; run < 100; run++) total(prices);
      console.log((performance.now() - start).toFixed(1));
    question: The first 100 runs took 0.7 ms. Nothing changed. What did the next 100 take?
    choices:
      - text: '`0.7`, the work is identical'
        feedback: >-
          The work is identical. How it's run isn't. By now the engine has noticed this
          function is busy.
      - text: '`0.1`'
        correct: true
        feedback: >-
          Right. V8 compiled the hot function to machine code.
      - text: '`1.4`, the engine is tiring'
        feedback: >-
          Engines don't tire. A function that runs a lot gets more effort spent on making it
          fast.

  - type: explain-back
    id: explain-reachable
    concept: cs.garbage-collection
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A server's memory climbs all day, though every request finishes. How does the collector
      decide what to free, and how can a cache defeat it?
    rubric:
      - The collector frees only what no root can reach, following references from globals and live frames.
      - A long-lived cache is reachable, so everything stored in it is kept.
      - A cache needs keys that repeat and a cap, or it grows for ever.
    modelAnswer: >-
      The collector starts from the roots, the globals and the variables in running calls,
      and follows every reference. What it reaches stays. A request's own variables die with
      its frame, but anything it put in a global cache is still reachable. If the keys never
      repeat, every request adds an entry and nothing is ever freed. So a cache needs keys
      that repeat, and a cap on its size.

recap:
  - Place values in a call's stack frame and objects on the heap, reached by reference.
  - Find what the garbage collector keeps, which is whatever a root can still reach.
  - Expect hot code to speed up as V8's JIT compiles it to machine code.

recall:
  - id: card-stack-vs-heap
    concept: cs.stack-and-heap
    front: What lives in a stack frame, and what lives on the heap?
    back: >-
      A frame holds one call's parameters and local variables, and is freed on return.
      Objects live on the heap, and variables hold references to them.
  - id: card-reachability
    concept: cs.garbage-collection
    front: How does a tracing garbage collector decide what to free?
    back: >-
      It follows references from the roots and marks what it reaches. Anything unmarked is
      unreachable, so it's freed.
  - id: card-cache-leak
    concept: cs.garbage-collection
    front: Why can a cache in a global `Map` leak memory?
    back: >-
      Everything in it stays reachable, so the collector never frees it. Keys that never
      repeat, or no size cap, let it grow for ever.
  - id: card-jit
    concept: cs.jit
    front: Why does a function get faster after it has run many times?
    back: >-
      V8 first interprets its bytecode. Once the function is hot, the JIT compiler turns it
      into machine code, which the CPU runs directly.

