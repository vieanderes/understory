    note: Design, functionality, complexity, tests, naming and more, in one guide.
    primary: true
    verified: true
  - kind: docs
    title: Small CLs
    authors: Google
    venue: Google Engineering Practices
    url: https://google.github.io/eng-practices/review/developer/small-cls.html
