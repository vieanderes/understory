approach: >-
  Let best[i] be the highest score of a walk that stops at checkpoint i. It is A[i] plus
  the largest best among the K checkpoints before it, and the answer is best[N - 1].
  Scanning back K checkpoints each time is O(N · K). A deque of indices whose best values
  fall from front to back keeps the window maximum at the front, so each checkpoint costs
  O(1) amortised and the whole walk is O(N).
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N and K both reach 100,000**. Checking K earlier
      checkpoints for each of N checkpoints can mean 10,000,000,000 steps. That times out.

      Note the argument order too: **K comes first**, then A.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in your own words at the top of the file. Both ends are forced stops, and the
      values can be negative: put both facts in the line.
    code:
      ts: |-
        // Max sum of stops from checkpoint 0 to N - 1 (both forced), moving 1 to K ahead each day.
      python: |-
        # Max sum of stops from checkpoint 0 to N - 1 (both forced), moving 1 to K ahead each day.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - two checkpoints, the smallest trail;
      - every checkpoint negative, so the best walk takes the longest days;
      - K = 1, which forces every stop;
      - K larger than the whole trail.
    input:
      - "(1, [5, -3])"
      - "(2, [-1, -1, -1, -1, -1])"
      - "(1, [3, -5, -2, 4])"
      - "(50, [4, -9, 8, -9, 1])"
  - kind: plan
    title: Write the recurrence down
    minutes: 3
    body: |-
      The last day of any walk to checkpoint i starts at one of the K checkpoints before
      it. So best[i] = A[i] + max(best[i - K .. i - 1]), with best[0] = A[0].

      This is **dynamic programming**. A greedy "take the biggest next value" fails: a big
      prize can sit behind a run of losses.
  - kind: write
    title: Bank the O(N · K) version first
    minutes: 4
    body: |-
      Write the recurrence directly with an inner loop. It passes the correctness tests and
      becomes your reference. Type it yourself: finding the recurrence is what the reviewer
      wants to see.
    code:
      ts: |-
        // Max sum of stops from checkpoint 0 to N - 1 (both forced), moving 1 to K ahead each day.
        // best[i] = A[i] + max(best[i - K..i - 1]), scanned directly: O(N * K), slow.
        function solution(K: number, A: number[]): number {
            const N = A.length;
            const best = new Array<number>(N);
            best[0] = A[0];
            for (let i = 1; i < N; i++) {
                let top = -Infinity;
                for (let j = Math.max(0, i - K); j < i; j++) top = Math.max(top, best[j]);
                best[i] = top + A[i];
            }
            return best[N - 1];
        }
      python: |-
        # Max sum of stops from checkpoint 0 to N - 1 (both forced), moving 1 to K ahead each day.
        # best[i] = A[i] + max(best[i - K..i - 1]), scanned directly: O(N * K), slow.
        def solution(K, A):
            N = len(A)
            best = [0] * N
            best[0] = A[0]
            for i in range(1, N):
                best[i] = max(best[max(0, i - K):i]) + A[i]
            return best[N - 1]
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Keep these results: the fast version
      must return the same values.
    expect: >-
      Two OKs, then 2, -3, 0 and 13 for your cases.
  - kind: plan
    title: Slide the window maximum with a deque
    minutes: 4
    body: |-
      The window over best moves by one each step, yet the inner loop rescans it. A
      **monotonic deque** of indices, best values falling from front to back, keeps the
      maximum at the front.

      At each i: drop the front if it is older than i - K, read the front, then pop smaller
      values off the back and push i.
  - kind: ask-ai
    title: Ask about the tie rule, not the algorithm
    minutes: 1
    body: |-
      One detail decides whether the deque stays small: pop on equal values or keep them.
      It is a narrow question, and knowing to ask it shows you understand the structure.
    prompt: >-
      In a monotonic deque for a sliding-window maximum, should I pop back elements whose
      value equals the new one, or keep them? Does either choice change the maximum read at
      the front? Two sentences, no code.
    expect: >-
      Either gives the right maximum. Popping equals keeps the deque shorter, so use <=.
  - kind: optimise
    title: Replace the inner loop with the deque
    minutes: 6
    body: |-
      Write this part yourself: the deque is the core of the task, so never delegate it. A
      fixed-size Int32Array with head and tail indices avoids slow shift() calls in
      JavaScript.
    code:
      ts: |-
        // Max sum of stops from checkpoint 0 to N - 1 (both forced), moving 1 to K ahead each day.
        // DP with a monotonic deque for the window maximum: O(N) time, O(N) space.
        function solution(K: number, A: number[]): number {
          const N = A.length;
          // best[i] = A[i] + max(best[i - K..i - 1]). A deque of indices with falling best values
          // keeps that window maximum at its front, so the DP is O(N) instead of O(N * K).
          const best = new Array<number>(N);
          const window = new Int32Array(N);
          let head = 0;
          let tail = 0;
          best[0] = A[0];
          window[tail++] = 0;
          for (let i = 1; i < N; i++) {
            if (window[head] < i - K) head++;
            best[i] = best[window[head]] + A[i];
            while (tail > head && best[window[tail - 1]] <= best[i]) tail--;
            window[tail++] = i;
          }
          return best[N - 1];
        }
      python: |-
        # Max sum of stops from checkpoint 0 to N - 1 (both forced), moving 1 to K ahead each day.
        # DP with a monotonic deque for the window maximum: O(N) time, O(N) space.
        from collections import deque


        def solution(K, A):
            N = len(A)
            # best[i] = A[i] + max(best[i - K..i - 1]). A deque of indices with falling best values
            # keeps that window maximum at its front, so the DP is O(N) instead of O(N * K).
            best = [0] * N
            best[0] = A[0]
            window = deque([0])
            for i in range(1, N):
                if window[0] < i - K:
                    window.popleft()
                best[i] = best[window[0]] + A[i]
                while window and best[window[-1]] <= best[i]:
                    window.pop()
                window.append(i)
            return best[N - 1]
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write a timing test
    minutes: 2
    body: |-
      A 100,000-element line is too long for test-input.txt, so ask for a tiny generator you
      run once in a scratch file. It is throwaway code, fine to delegate. Check it calls
      your function with K first.
    prompt: >-
      Write 5 lines of TypeScript that build an array of 100,000 random integers between
      -10000 and 10000, call solution(50000, A), and print how many milliseconds it took.
      Nothing else.
    expect: >-
      A result in well under 500 ms. Delete the generator before you submit.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours. The window bound and the argument
      order are the classic slips.
    prompt: >-
      Review my current solution for off-by-one errors in the window, negative values, and
      time complexity. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the timing code and any debug output. Check the header comment states the
      complexity. Then submit.
