approach: >-
  Parse each run into a map from case id to its slice and two flags: any trial passed, and
  every trial passed. Keep only the ids found in both maps. Count the flags for the two
  overall lines, rounding down. Group the shared ids by slice, and flag a slice when
  (baseline all-pass count − candidate all-pass count) × 100 > D × slice size, which
  compares the exact fractions without rounding. Sort the slices and add "no regressions"
  when none is flagged.
complexity: O((N + M) log(N + M)) time, O(N + M) space
steps:
  - kind: read
    title: Read the definitions before the format
    minutes: 3
    body: |-
      Three definitions decide everything: **pass@k** (any trial passed), **pass^k** (every
      trial passed), and **regressed** (compared on exact values).

      Then note what is left out: cases in only one run. The trial counts can differ
      between runs; the definitions do not care.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Name the join, the two metrics and the exact comparison.
    code:
      ts: |-
        // Join runs on case id; pass@k = any P, pass^k = all P; flag slices where (b - c) * 100 > D * size.
      python: |-
        # Join runs on case id; pass@k = any P, pass^k = all P; flag slices where (b - c) * 100 > D * size.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 3
    body: |-
      Write down the inputs most likely to break a quick solution:

      - a case in only one of the runs;
      - a drop exactly equal to D, which is not a regression;
      - a drop of one case in three with D = 33, where rounding first would hide it;
      - slice names that sort differently by length and by character.
    input:
      - "([\"a s P\", \"b s F\"], [\"a s P\", \"d s F\"], 0)"
      - "([\"a s P\", \"b s P\", \"c s P\", \"d s P\", \"e s P\", \"f s P\", \"g s P\", \"h s P\", \"i s P\", \"j s P\"], [\"a s F\", \"b s P\", \"c s P\", \"d s P\", \"e s P\", \"f s P\", \"g s P\", \"h s P\", \"i s P\", \"j s P\"], 10)"
      - "([\"a s P\", \"b s P\", \"c s P\"], [\"a s F\", \"b s P\", \"c s P\"], 33)"
      - "([\"x-1 a-b PP\", \"x-2 a PP\", \"x-3 ab PP\"], [\"x-3 ab FF\", \"x-2 a FF\", \"x-1 a-b FF\"], 99)"
  - kind: ask-ai
    title: Check the exact comparison with a narrow question
    minutes: 1
    body: |-
      The threshold is the subtle part. Confirm the arithmetic, not the solution.
    prompt: >-
      Without writing code: on a slice of 3 cases, pass^k falls from 3 of 3 to 2 of 3, and
      D = 33. Using exact values, is the drop more than 33 percentage points? And would
      comparing the rounded-down percentages, 100 and 66, give the same answer? One sentence
      each.
    expect: >-
      Exactly, the drop is 33.33 points, which is more than 33. Rounded, 100 − 66 = 34 also
      exceeds 33, but rounding can hide or invent a regression in other cases, so compare
      (3 − 2) × 100 > 33 × 3.
  - kind: plan
    title: Plan the data shape
    minutes: 2
    body: |-
      One map per run: id to slice, "any passed" and "all passed". The shared ids are the
      candidate's ids that the baseline also has. Then one map from slice to its shared
      ids. Everything else is counting.
  - kind: write
    title: Write the solution yourself
    minutes: 8
    body: |-
      Write it in the order of the output: the two overall lines, then the slices. Keep the
      exact comparison as whole-number arithmetic.
    code:
      ts: |-
        // Join runs on case id; pass@k = any P, pass^k = all P; flag slices where (b - c) * 100 > D * size.
        function solution(B: string[], C: string[], D: number): string[] {
          type Row = { slice: string; any: boolean; all: boolean };
          const parse = (entries: string[]): Map<string, Row> => {
            const rows = new Map<string, Row>();
            for (const entry of entries) {
              const [id, slice, trials] = entry.split(' ');
              rows.set(id!, { slice: slice!, any: trials!.includes('P'), all: !trials!.includes('F') });
            }
            return rows;
          };
          const base = parse(B);
          const cand = parse(C);
          const shared = [...cand.keys()].filter((id) => base.has(id));
          const pct = (count: number, total: number): number => Math.floor((100 * count) / total);
          const count = (rows: Map<string, Row>, ids: string[], key: 'any' | 'all'): number =>
            ids.filter((id) => rows.get(id)![key]).length;

          const n = shared.length;
          const summary = [
            `pass@k ${pct(count(base, shared, 'any'), n)} ${pct(count(cand, shared, 'any'), n)}`,
            `pass^k ${pct(count(base, shared, 'all'), n)} ${pct(count(cand, shared, 'all'), n)}`,
          ];
          const bySlice = new Map<string, string[]>();
          for (const id of shared) {
            const slice = cand.get(id)!.slice;
            bySlice.set(slice, [...(bySlice.get(slice) ?? []), id]);
          }
          for (const slice of [...bySlice.keys()].sort()) {
            const ids = bySlice.get(slice)!;
            const before = count(base, ids, 'all');
            const after = count(cand, ids, 'all');
            // Compare the exact fractions by cross-multiplying: (before - after) / n > D / 100.
            if ((before - after) * 100 > D * ids.length) {
              summary.push(`regressed ${slice} ${pct(before, ids.length)} ${pct(after, ids.length)}`);
            }
          }
          if (summary.length === 2) summary.push('no regressions');
          return summary;
        }
      python: |-
        # Join runs on case id; pass@k = any P, pass^k = all P; flag slices where (b - c) * 100 > D * size.
        def solution(B, C, D):
            def parse(entries):
                rows = {}
                for entry in entries:
                    case_id, slice_name, trials = entry.split(' ')
                    rows[case_id] = (slice_name, 'P' in trials, 'F' not in trials)
                return rows

            base = parse(B)
            cand = parse(C)
            shared = [case_id for case_id in cand if case_id in base]

            def pct(count, total):
                return 100 * count // total

            def count(rows, ids, key):
                return sum(1 for case_id in ids if rows[case_id][key])

            n = len(shared)
            summary = [
                'pass@k %d %d' % (pct(count(base, shared, 1), n), pct(count(cand, shared, 1), n)),
                'pass^k %d %d' % (pct(count(base, shared, 2), n), pct(count(cand, shared, 2), n)),
            ]
            by_slice = {}
            for case_id in shared:
                by_slice.setdefault(cand[case_id][0], []).append(case_id)
            for slice_name in sorted(by_slice):
                ids = by_slice[slice_name]
                before = count(base, ids, 2)
                after = count(cand, ids, 2)
                # Exact comparison by cross-multiplying: (before - after) / n > D / 100.
                if (before - after) * 100 > D * len(ids):
                    summary.append('regressed %s %d %d' % (slice_name, pct(before, len(ids)), pct(after, len(ids))))
            if len(summary) == 2:
                summary.append('no regressions')
            return summary
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 2
    body: |-
      Press **Run code**. Both examples must say OK. Check your cases by hand: they are
      small on purpose.
    expect: >-
      Two OKs. Your first case ends in "no regressions", the second in "no regressions", the
      third in "regressed s 100 66", and the fourth lists a, a-b and ab in that order.
  - kind: ai-writes
    title: Let the assistant write a larger input
    minutes: 2
    body: |-
      A realistic eval run has many cases. Ask for the input only and check the overall
      lines by counting.
    prompt: >-
      Give me one test input line in the format (["c1 billing PP"], ["c1 billing PF"], 10)
      with 10 cases in each run over 3 slices, 2 to 4 trials per case, two case ids present
      in only one run, and a mix of all-pass, flaky and all-fail cases. The line only, no
      answer and no code.
    expect: >-
      One line. Your overall percentages match a count by hand over the 8 shared cases.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution for these rules: only shared cases count, percentages
      round down, the regression test uses exact values, and slices are in alphabetical
      order. List any problems in one line each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
