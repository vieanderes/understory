term: tree shaking
aka: [tree-shaking, dead code elimination]
short: A bundler step that drops code you import from a library but never call.
explain: |
  You import one date function from a library with three hundred. Without this step, all
  three hundred ship to the browser.

  The bundler follows `import` and `export` statements, sees what is used, and leaves the
  rest out. It works with ES modules, not with `require`. Code with side effects at the top
  level can't be dropped safely, which is why packages declare `"sideEffects": false`.
analogy: Shaking an apple tree so only the ripe apples you want fall into the basket.
example:
  language: ts
  code: |
    // only format ships
    import { format } from 'date-fns';

    // the whole library ships: a namespace import used dynamically
    import * as dates from 'date-fns';
    dates[userChoice]();
usage: Tree shaking can't help here, because the library is CommonJS, so all of it ends up in the bundle.
related: [bundler, code-splitting, performance-budget]
level: 3
lessons: [perf.shipping-less-javascript]
