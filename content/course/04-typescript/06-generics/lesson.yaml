id: ts.generics
title: Generics
objective: Write one helper that works for any type and hands back the type it was given.
level: essential
minutes: 10
concepts: [ts.generics, ts.generic-constraints, ts.type-argument-inference]
prerequisites: [ts.typing-the-boundary]
opening:
  text: >-
    You'll write one helper that works for any kind of value and still catches your typos.
    That's what generics buy you over `any`.

steps:
  - type: predict-output
    id: predict-any-helper
    concept: ts.generics
    difficulty: 1
    language: ts
    code: |
      function firstOf(items: any[]) {
        return items[0];
      }
      const holds = [{ bookId: "B-1", expiresAt: 1767225600000 }];
      const hold = firstOf(holds);
      console.log(hold.expiredAt.toFixed(0));
    question: A library helper. Line 6 misspells `expiresAt`. What happens?
    choices:
      - text: It compiles, then throws when it runs
        correct: true
        feedback: >-
          Right. `any` in, `any` out, and `any` allows any property you like.
      - text: The checker flags line 6
        feedback: >-
          Nothing links the result to the list. The helper threw the type away.
      - text: It compiles and logs `undefined`
        feedback: >-
          One step further: it then calls `.toFixed` on `undefined`, which throws.

  - type: prose
    id: type-parameter-links
    body: |-
      The helper needs to say "I return the same kind of thing I was given". A **type
      parameter** does that. It's a name, in angle brackets, for a type chosen fresh at each
      call:

      ```ts
      function firstOf<T>(items: T[]): T | undefined {
        return items[0];
      }
      ```

      A function with one is **generic**. Call `firstOf(holds)`, and `T` becomes the hold
      type, so the typo is an error. A `T` that appears only in the result links it to
      nothing.

  - type: multiple-choice
    id: pick-inferred-union
    concept: ts.type-argument-inference
    difficulty: 2
    language: ts
    code: |
      function firstOf<T>(items: T[]): T | undefined {
        return items[0];
      }
      const seat = firstOf(["A1", "A2"]);
      const mixed = firstOf([4500, "GBP"]);
    question: '`seat` is `string | undefined`. What type is `mixed`?'
    choices:
      - text: '`string | number | undefined`'
        correct: true
        feedback: >-
          Right. The list is `(string | number)[]`, so that's what `T` becomes.
      - text: '`number | undefined`'
        feedback: >-
          The first item doesn't decide. The checker reads the whole list.
      - text: '`any`'
        feedback: >-
          A mixed list doesn't fall back to `any`. The union stays checked.

  - type: fill-blank
    id: fill-last-of
    concept: ts.generics
    difficulty: 2
    language: ts
    prompt: >-
      Make `lastOf` generic, so `lastOf(holds)` gives back a hold, or `undefined` for an empty
      list.
    template: |
      function lastOf{{1}}(items: {{2}}): {{3}} {
        return items[items.length - 1];
      }
    blanks:
      - key: '1'
        answer: <T>
      - key: '2'
        answer: 'T[]'
      - key: '3'
        answer: T | undefined
    bank: [<T>, <any>, 'T[]', 'any[]', T | undefined, any]

  - type: prose
    id: constraints-open-the-body
    body: |-
      Inside the function, `T` could be anything, so you can't read properties off it. A
      **constraint** says what every `T` must have:

      ```ts
      function cheaper<T extends { pricePence: number }>(a: T, b: T): T {
        if (a.pricePence <= b.pricePence) return a;
        return b;
      }
      ```

      `extends` here means "must at least have". The result is still `T`, so callers get back
      exactly the type they passed in.

  - type: ai-review
    id: review-generic-fetch
    concept: ts.generics
    difficulty: 3
    language: ts
    request: Write a typed helper that fetches JSON, so callers get the right type.
    flawClass: edge-case
    code: |
      async function getJson<T>(url: string): Promise<T> {
        const response = await fetch(url);
        return response.json();
      }

      type Weather = { city: string; celsius: number };

      async function showWeather(): Promise<string> {
        const weather: Weather = await getJson("/api/weather");
        return `${weather.city}: ${weather.celsius.toFixed(1)}°C`;
      }
    prompt: >-
      The API renamed `celsius` to `temp`, and this still compiles. Tap the line that let it.
    lines: [1]
    reasons:
      - text: '`T` appears only in the result, so nothing checks it'
        correct: true
        feedback: >-
          Right. It's an `as` in disguise. The caller names a type and nobody checks it.
      - text: '`fetch` can''t be used inside a generic'
        feedback: >-
          It can. The trouble is that no argument decides `T`, so the result is a bare claim.
      - text: The `Weather` annotation on line 9 is wrong
        feedback: >-
          It matches what the code wants. Nothing ever compares it with the real reply.
    fix: |
      async function getJson(url: string): Promise<unknown> {
        const response = await fetch(url);
        return response.json();
      }
      // Then parse the unknown value, as in the last lesson.

  - type: prose
    id: keyof-and-lookup
    body: |-
      Two more tools let a generic talk about property names:

      ```ts
      type Ticket = { id: string; tier: string };
      type TicketKey = keyof Ticket;   // "id" | "tier"
      type TicketId = Ticket["id"];    // string
      ```

      **keyof** gives the union of a type's property names. `T[K]` looks up the type of
      property `K`. Together, a function can accept only real property names.

  - type: fill-blank
    id: fill-pluck
    concept: ts.generic-constraints
    difficulty: 3
    language: ts
    prompt: >-
      Complete `pluck`, which collects one property from every item. A wrong key mustn't
      compile.
    template: |
      function pluck<T, K {{1}} {{2}} T>(items: T[], key: {{3}}): {{4}}[] {
        return items.map((item) => item[key]);
      }
    blanks:
      - key: '1'
        answer: extends
      - key: '2'
        answer: keyof
      - key: '3'
        answer: K
      - key: '4'
        answer: T[K]
    bank: [extends, keyof, K, 'T[K]', string, typeof, implements, T]

  - type: code-challenge
    id: write-group-by
    concept: ts.generic-constraints
    difficulty: 4
    language: ts
    prompt: >-
      Write `groupBy(items, key)`.


      Return a `Map` from each distinct value of `item[key]` to the items that have it. Items
      keep their order, groups appear in first-seen order, and an empty list gives an empty
      `Map`. Don't change the input.


      Example: three tickets with tiers `day`, `weekend`, `day`, grouped by `"tier"`, give two
      groups.
    hints:
      - '`item[key]` has the type `T[K]`, which is the `Map`''s key type.'
      - >-
        `groups.get(value)` gives `T[] | undefined`. Check for `undefined` before pushing.
      - >-
        Start with `const groups = new Map<T[K], T[]>();` and loop with `for...of`.

  - type: explain-back
    id: explain-link-output-to-input
    concept: ts.generics
    difficulty: 3
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks why you'd write `firstOf<T>(items: T[]): T | undefined` rather than
      take `any[]`. Defend the generic version.
    rubric:
      - '`any` switches checking off and spreads into the result, so any property read compiles.'
      - '`T` is worked out from the list at each call, and the return type reuses it.'
      - It costs one type parameter, worth it whenever the output's type depends on the input's.
    modelAnswer: >-
      With `any[]` the result is `any`, which allows every property, so a typo compiles and
      fails at run time. With `T[]` the checker works out `T` from each list I pass, and the
      return type reuses it. `firstOf(holds)` gives back a hold, so a misspelt property is an
      error. It costs one type parameter, and that's worth it whenever the output's type
      depends on the input's.

recap:
  - Tie a function's output type to its input with a type parameter.
  - Add a constraint when the body needs to read a property.
  - Accept only real property names with `keyof`.

recall:
  - id: card-why-type-parameter
    concept: ts.generics
    front: What can a type parameter say that `any` can't?
    back: >-
      That two positions share a type: the result has the item type of the list you passed.
      The type is chosen per call.
  - id: card-generic-call
    concept: ts.type-argument-inference
    front: You call `firstOf(["A1", "A2"])` without writing a type. How does the checker know `T`?
    back: >-
      It works `T` out from the argument. The list is `string[]`, so `T` is `string`.
  - id: card-constraint
    concept: ts.generic-constraints
    front: What does `K extends keyof T` buy you?
    back: >-
      Only real property names are accepted, and returning `T[K]` gives the type of that
      property back.
  - id: card-keyof
    concept: ts.generic-constraints
    front: 'What is `keyof { id: string; tier: string }`?'
    back: >-
      `"id" | "tier"`: the union of its property names.

references:
  - kind: docs
    title: Generics
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/docs/handbook/2/generics.html
    note: Type parameters, constraints and when not to use one.
    primary: true
    verified: true
  - kind: docs
    title: Keyof Type Operator
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/docs/handbook/2/keyof-types.html
    note: '`keyof T` and indexed access types like `T[K]`.'
    primary: true
    verified: true
  - kind: docs
    title: Type Compatibility
    authors: Microsoft
