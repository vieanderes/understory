id: tooling.terminal
title: The terminal
objective: Type commands in a terminal, and move between folders and read files with `pwd`, `ls`, `cd` and `cat`.
level: essential
minutes: 10
concepts: [tooling.shell, tooling.paths]
prerequisites: [basics.first-program]
opening:
  text: >-
    You'll type your first commands and move around your files without a mouse. Every tool in
    the rest of this chapter starts here.

steps:
  - type: prose
    id: what-a-terminal-is
    body: |-
      A **terminal** is a window where you type instructions instead of clicking. Mac has
      one called Terminal. Windows has Terminal too.

      Inside it runs the **shell**: the program that reads each line you type and carries it
      out. The `$` is its **prompt**. It means "ready, type something".

      ```text
      $ echo Hello
      Hello
      ```

      You type the part after `$` and press Enter. The line below is the answer.

  - type: prose
    id: commands-and-arguments
    body: |-
      That line was a **command**. The first word names a program to run. The words after it
      are **arguments**: what the program should work on. Spaces separate them.

      ```text
      $ cat notes.txt
      Buy flour
      ```

      `cat` prints a file, and `notes.txt` says which one. `mkdir photos` makes a folder called
      `photos`. Need a space inside one name? Wrap it in quotes: `mkdir "old photos"`.

  - type: predict-output
    id: predict-echo
    concept: tooling.shell
    difficulty: 1
    language: bash
    code: |
      $ echo Good morning
    question: What does the shell print on the next line?
    choices:
      - text: '`Good morning`'
        correct: true
        feedback: >-
          Yes. `echo` is the program, and it prints its two arguments back.
      - text: '`echo Good morning`'
        feedback: >-
          The shell doesn't repeat your line. It runs `echo`, and `echo` prints its arguments.
      - text: Nothing, because there's no file called `Good`
        feedback: >-
          That's how `cat` would treat it. `echo` doesn't open files. It prints its words.

  - type: ai-review
    id: review-folder-with-space
    concept: tooling.shell
    difficulty: 2
    language: bash
    request: Make one folder called holiday photos, and show me what's here.
    flawClass: edge-case
    code: |
      mkdir holiday photos
      ls
    prompt: >-
      An AI assistant wrote these commands. `ls` now shows `holiday` and `photos`. Tap the line
      at fault.
    lines: [1]
    reasons:
      - text: The space splits the name into two arguments
        correct: true
        feedback: >-
          Yes. `mkdir` got two names, so it made two folders. Quotes keep the name whole.
      - text: '`mkdir` can only make one folder at a time'
        feedback: >-
          It happily takes several names. That's exactly why two folders appeared.
      - text: '`ls` split the name when it printed it'
        feedback: >-
          `ls` shows what's really there. The split happened when `mkdir` read its arguments.
    fix: |
      mkdir "holiday photos"
      ls

  - type: prose
    id: files-folders-paths
    body: |-
      The files and folders here are the same ones you see in Finder or File Explorer.
      Developers often say **directory** for a folder.

      A **path** names a file by the folders you pass through to reach it, joined with `/`:

      ```text
      /Users/sam/recipes/soups/tomato.txt
      ```

      A path starting with `/` begins at the very top of the disk. `~` is short for your
      **home** folder, here `/Users/sam`.

  - type: prose
    id: the-working-directory
    body: |-
      The shell always stands in one folder, the **working directory**. `pwd` prints it. `ls`
      lists what's inside it. `cd` moves you.

      ```text
      $ pwd
      /Users/sam
      $ ls
      notes.txt  photos  recipes
      $ cd recipes
      ```

      A path without a leading `/` is **relative**: it starts from where you stand. `..` means
      the folder above. `cd` on its own takes you home.

  - type: fill-blank
    id: fill-move-between-folders
    concept: tooling.paths
    difficulty: 2
    language: bash
    prompt: >-
      You're in `soups`. Move over to `cakes`, then print `notes.txt` from your home folder.
      Fill the gaps.
    template: |
      $ pwd
      /Users/sam/recipes/soups
      $ cd {{1}}
      $ pwd
      /Users/sam/recipes/cakes
      $ cat {{2}}
      Buy flour
    blanks:
      - key: '1'
        answer: ../cakes
      - key: '2'
        answer: ~/notes.txt
    bank: [../cakes, cakes, /cakes, ~/notes.txt, notes.txt]

  - type: bug-hunt
    id: hunt-wrong-folder
    concept: tooling.paths
    difficulty: 2
    language: bash
    code: |
      $ pwd
      /Users/sam
      $ ls recipes/soups
      tomato.txt
      $ cat tomato.txt
      cat: tomato.txt: No such file or directory
    prompt: The file is right there in the listing. Tap the command that went wrong.
    lines: [5]
    reasons:
      - text: The path starts from `/Users/sam`, not `soups`
        correct: true
        feedback: >-
          Yes. A relative path starts where you stand. Try `cat recipes/soups/tomato.txt`.
      - text: '`ls` should have moved you into `soups`'
        feedback: >-
          Most people think that at first. `ls` only looks. Only `cd` moves you.
      - text: '`cat` can''t open `.txt` files'
        feedback: >-
          It can print any text file. It looked in the wrong folder.
    fix: |
      $ pwd
      /Users/sam
      $ ls recipes/soups
      tomato.txt
      $ cat recipes/soups/tomato.txt
      Tomato soup

  - type: parsons
    id: arrange-new-folder
    concept: tooling.paths
    difficulty: 3
    language: bash
    prompt: You're in `/Users/sam`. Make a `breads` folder inside `recipes`, move into it, and check where you are. One block doesn't belong.
    blocks:
      - id: into-recipes
        code: cd recipes
        subgoal: Go to the right folder
      - id: make-breads
        code: mkdir breads
        subgoal: Make the new folder
      - id: into-breads
        code: cd breads
        subgoal: Move into it
      - id: check
        code: pwd
        subgoal: Check where you are
    distractors:
      - id: absolute-recipes
        code: cd /recipes
        feedback: >-
          The leading `/` starts at the top of the disk, not at home. `recipes` lives in
          `/Users/sam`.

  - type: explain-back
    id: explain-no-such-file
    concept: tooling.paths
    difficulty: 3
    prompt: >-
      A classmate runs `cat notes.txt` and sees `No such file or directory`. The file is on
      their computer. What's going on, and how do they fix it?
    rubric:
      - A relative path is looked up from the working directory only.
      - The shell is standing in a different folder from the file.
      - '`pwd` and `ls` show where you are, then `cd` there or give the full path.'
    modelAnswer: >-
      `notes.txt` is a relative path, so the shell looks for it in the working directory
      only. The file lives in some other folder. Run `pwd` to see where you are and `ls` to see
      what's here. Then `cd` into the right folder, or give the path from where you stand.

recap:
  - "Type a command with its arguments at the `$` prompt."
  - "Find out where you are with `pwd` and `ls`, and move with `cd`."
  - "Read a path, and fix a `No such file or directory` error."
recall:
  - id: card-terminal-and-shell
    concept: tooling.shell
    front: What's the difference between the terminal and the shell?
    back: >-
      The terminal is the window you type in. The shell is the program inside it that reads
      each command and runs it.
  - id: card-command-parts
    concept: tooling.shell
    front: In `mkdir photos`, which part is the program and which is the argument?
    back: >-
      `mkdir` is the program. `photos` is the argument: the folder to make.
  - id: card-navigation
    concept: tooling.paths
    front: What do `pwd`, `ls` and `cd` do?
    back: >-
      `pwd` prints the working directory. `ls` lists what's in it. `cd` moves to another
      folder.
  - id: card-relative-path
    concept: tooling.paths
    front: Where does a relative path like `soups/tomato.txt` start from?
    back: >-
      From the working directory. A path starting with `/` starts from the top of the disk
      instead.
  - id: card-dot-dot
    concept: tooling.paths
    front: You're in `/Users/sam/recipes/cakes`. Where does `cd ../..` take you?
    back: >-
      `/Users/sam`. Each `..` goes up one folder.

