term: type erasure
aka:
  - erased types
short: Compiling removes every type and leaves plain JavaScript, so no types exist while the program runs.
explain: |
  TypeScript checks your code, then deletes the types. What runs in the browser or on the
  server is ordinary JavaScript. There is no `User` type at run time to check against.

  That's why `as User` can't protect you from bad data, and why you can't write
  `if (x instanceof User)` for a type alias. At the edges of your program, check the real
  values with code that runs.
analogy: Scaffolding round a new building. It shapes the work, then it's taken down before anyone moves in.
example:
  language: ts
  code: |
    // what you write
    function greet(name: string): string {
      return `Hi ${name}`;
    }
    // what runs
    // function greet(name) { return `Hi ${name}`; }
usage: Because of type erasure, nothing checks that the API really sent a number.
related:
  - type-assertion
  - unknown-type
level: 3
