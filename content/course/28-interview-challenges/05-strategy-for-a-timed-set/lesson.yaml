id: interview.timed-strategy
title: Strategy for a timed set
objective: Split a timed set sensibly, bank partial credit with a brute force, and find your own bugs by stress testing against it.
level: essential
minutes: 10
concepts: [interview.triage, interview.stress-testing]
prerequisites: [interview.js-traps]
opening:
  text: >-
    You'll spend a timed test where the points are, and find your own bugs before the hidden
    tests do. Both come from the same habit: write the slow version first.

steps:
  - type: prose
    id: triage
    body: |-
      A timed test is several tasks under one clock, scored by hidden tests. Read every task
      and its limits first. Start with the one you know best. Give each a **time box**, a
      fixed slice of the clock, and move on when it's up.

      Before chasing the fast idea, submit a **brute force** that compiles. It banks the
      correctness points. Keep five minutes at the end to check.

  - type: multiple-choice
    id: first-five-minutes
    concept: interview.triage
    difficulty: 1
    question: Three tasks, 90 minutes, one timer. What do you do first?
    choices:
      - text: Read all three tasks and their limits
        correct: true
        feedback: >-
          Yes. Five minutes of reading tells you where the sure points are.
      - text: Start task one straight away
        feedback: >-
          Task one isn't always the easiest. Without a look at the others, you can't plan the time.
      - text: Start the hardest while you're fresh
        feedback: >-
          Tempting, but it risks the sure points. The hard one can eat the whole clock.

  - type: parsons
    id: order-the-plan
    concept: interview.triage
    difficulty: 2
    prompt: Put this plan for 90 minutes and three tasks in order.
    language: text
    blocks:
      - id: read
        code: '0:00  read all three tasks and their limits'
        subgoal: Plan
      - id: familiar
        code: '0:05  solve the most familiar task, test edge cases'
        subgoal: Bank the sure points
      - id: brute
        code: '0:30  second task: brute force first, submit it'
        subgoal: Bank partial credit
      - id: improve
        code: '0:50  improve the second task if the idea comes'
      - id: last
        code: '1:10  last task: at least a brute force that compiles'
      - id: check
        code: '1:25  stop, and check every submission compiles'
        subgoal: Protect the score
    distractors:
      - id: polish
        code: '1:25  rewrite task one so it reads more elegantly'
        feedback: >-
          Task one already scores. Polish earns nothing from a hidden-test scorer.
      - id: hardest
        code: '0:05  start the hardest task while fresh'
        feedback: >-
          The hardest task can swallow the clock. Bank the familiar points first.

  - type: multiple-choice
    id: bank-brute-force
    concept: interview.triage
    difficulty: 3
    question: Twenty minutes left. You have a working O(n²) idea, and no fast one yet. What now?
    choices:
      - text: Write the O(n²) version, submit, then improve
        correct: true
        feedback: >-
          Right. It banks the correctness tests and some performance ones.
      - text: Keep thinking until the fast idea comes
        feedback: >-
          If it never comes, you leave with nothing. A brute force usually scores all the correctness tests.
      - text: Skip it and polish the other two
        feedback: >-
          Working tasks gain nothing from polish. The empty task is where the points are.

  - type: prose
    id: stress-testing
    body: |-
      That brute force has a second job. It's slow but **plainly correct**, so it can check
      your fast version.

      Generate many small random inputs. Run both versions on each, and stop at the first
      input where they disagree. That's **stress testing**. Start the generator from a
      **seed**, a fixed first number, so every run makes the same inputs.

  - type: fill-blank
    id: fill-stress-loop
    concept: interview.stress-testing
    difficulty: 3
    prompt: Complete the loop that compares two versions returning numbers, and returns the first input where they differ.
    language: js
    template: |
      for (let run = 0; run < runs; run++) {
        const input = {{1}}();
        if (fast(input) !== {{2}}(input)) {
          return {{3}};
        }
      }
      return null;
    blanks:
      - key: '1'
        answer: generate
      - key: '2'
        answer: slow
      - key: '3'
        answer: input
    bank: [generate, slow, input, Math.random, fast, run]

  - type: multiple-choice
    id: shrink-the-case
    concept: interview.stress-testing
    difficulty: 3
    question: The stress test finds a failing list of 40 numbers. What's your next move?
    choices:
      - text: Generate shorter lists until a tiny one fails
        correct: true
        feedback: >-
          Yes. A tiny failing case can be traced by hand in a minute.
      - text: Step through all 40 in the debugger
        feedback: >-
          You'd find it eventually, but slowly. A three-item case shows the same bug at a glance.
      - text: Save the 40 numbers as a test, move on
        feedback: >-
          Keeping it is good, but the bug is still there. Shrink it so you can see the cause.

  - type: ai-review
    id: review-stress-helper
    concept: interview.stress-testing
    difficulty: 4
    language: js
    request: Run fast and slow on random inputs and return the first input where they disagree.
    flawClass: logic
    code: |
      function stressTest(fast, slow, generate, runs) {
        for (let run = 0; run < runs; run++) {
          const input = generate();
          const expected = slow(generate());
          if (fast(input) !== expected) return input;
        }
        return null;
      }
    prompt: >-
      An assistant wrote this. A quick check with a generator that always returns `4` passed.
      With a random generator, it reports failures even when `fast` and `slow` are the same.
      Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`slow` gets a different input from `fast`'
        correct: true
        feedback: >-
          Yes. Calling `generate` twice makes two inputs. Pass `input` to both.
      - text: '`!==` can''t compare numbers'
        feedback: >-
          It compares numbers fine. The trouble is that the two numbers came from different inputs.
      - text: The loop should start at 1
        feedback: >-
          Starting at 0 runs exactly `runs` times. The count isn't what goes wrong.
    verify:
      question: 'Which quick check would have caught this before you trusted it?'
      choices:
        - text: 'Pass one function as both and expect `null`'
          correct: true
          feedback: >-
            Yes. Two identical functions must never disagree.
        - text: 'Run it with a generator that always returns `4`'
          feedback: >-
            That's the check that passed. Both calls to `generate` give the same input.
        - text: 'Raise `runs` to ten thousand'
          feedback: >-
            More runs only report more false failures. You need a case where the right answer is known.
    fix: |
      const expected = slow(input);

  - type: code-challenge
    id: write-stress-test
    concept: interview.stress-testing
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: stress.starter.py
      solution: stress.solution.py
      tests: stress.tests.py
    prompt: >-
      Write `stressTest(fast, slow, generate, runs)`. Call `generate` up to `runs` times.
      Run both functions on each input, and return the first input where their results
      differ. If they always agree, return `null`.


      Results can be arrays, so compare them by value (`JSON.stringify` in TypeScript, `!=` in Python). The tests pass in a
      seeded generator, so every run is the same.
    hints:
      - The loop from the fill-in step is most of it.
      - Two arrays with the same items are still different objects, so `!==` says they differ.
      - 'Compare the results by value: `JSON.stringify` in TypeScript, `!=` in Python.'

  - type: explain-back
    id: explain-stress-finds-bugs
    concept: interview.stress-testing
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Your hand-written tests all pass. Why can a stress test against a slow version still
      find a bug?
    rubric:
      - The slow version is simple enough to trust, so it acts as the expected answer.
      - Random inputs reach cases you didn't think to write, like all negatives or one item.
      - Many small inputs run in seconds, and the first disagreement is a concrete failing case.
    modelAnswer: >-
      My own tests only cover the cases I thought of. The slow version is simple enough
      to trust, so it can supply the expected answer for any input. Hundreds of small random
      inputs reach odd cases, like a list of all negatives. The first disagreement is a real
      failing input I can shrink and trace by hand.

recap:
  - Read every task first, and give each one a time box.
  - Submit a compiling brute force before chasing the fast idea.
  - Stress test the fast version against the slow one, then shrink the failure.
recall:
  - id: card-triage-order
    concept: interview.triage
    front: In a timed set of three tasks, how do you spend the first five minutes?
    back: >-
      Read every task and its complexity line, then pick the order, most familiar first.
  - id: card-bank-brute
    concept: interview.triage
    front: Why submit a brute force before you have the fast idea?
    back: >-
      It usually passes every correctness test, so it banks points if the fast idea never
      comes.
  - id: card-stress-parts
    concept: interview.stress-testing
    front: What are the parts of a stress test?
    back: >-
      A slow, plainly correct version, a seeded generator of small inputs, a loop that
      compares the two, and shrinking the first failure.
  - id: card-seeded
    concept: interview.stress-testing
    front: Why seed the random generator in a stress test?
    back: >-
      The same seed makes the same inputs, so a failure can be run again after the fix.

references:
  - kind: paper
    title: 'QuickCheck: A Lightweight Tool for Random Testing of Haskell Programs'
    authors: Koen Claessen and John Hughes
    year: 2000
    venue: ICFP 2000
    url: https://doi.org/10.1145/351240.351266
    note: The idea behind stress testing in its original form, a property checked on many random inputs.
    primary: true
    verified: true

deepDive: |-
  A timing for 90 minutes and three tasks, from candidate reports. Spend five minutes reading
  every statement and complexity line. Take the most familiar task first. Submit a brute force
  on the last one if the fast idea doesn't come, and keep five minutes at the end to check. Speed doesn't change
  the automatic score, so finishing early earns nothing but checking time.

  The edge-case checklist, every time: the smallest input, the largest, all equal, all
  negative, duplicates, sorted and reverse sorted, and sums past 2^53 in JavaScript.

  Stress testing is common in competitive programming, where it's often run as a shell loop
  over a generator, a brute force and the real solution. Property-based testing libraries,
  such as QuickCheck in Haskell and fast-check in JavaScript, turn the same idea into a
  tool, and shrink the failing input for you.

  The generator in the tests multiplies by 48,271 and takes the remainder by 2^31 - 1. It
  stays below 2^53 at every step, so JavaScript numbers keep it exact. A generator that
  multiplied by a much larger constant would lose digits and stop being exact.
