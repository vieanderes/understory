id: clean
number: 26
title: "Clean code"
summary: "Code that other people can read, change and trust: names, small functions, flat control flow, honest comments, clean error handling, the right amount of abstraction, pure cores, code smells, design principles in proportion, and review."
why: "Code is read far more often than it is written, and every unclear line costs the next person time."
youCanBuild: "A messy module refactored under tests, with a written review explaining each change."
concepts:
  - id: clean.intent-revealing-names
    title: "Intent-revealing names"
    summary: "A good name says what a value means or a function does, so the reader never has to open it to find out."
  - id: clean.consistent-vocabulary
    title: "Consistent vocabulary"
    summary: "One word per idea across a codebase, such as always fetch or always load, so different words signal different things."
  - id: clean.name-length-and-scope
    title: "Name length and scope"
    summary: "A short name suits a variable used for three lines, and a longer, precise name suits one read across files."
  - id: clean.single-purpose-functions
    title: "One job per function"
    summary: "A function does one thing at one level of detail, so its name can say everything it does."
  - id: clean.parameter-lists
    title: "Short parameter lists"
    summary: "More than three positional parameters are hard to call correctly, so related ones become one options object."
  - id: clean.flag-arguments
    title: "Flag arguments"
    summary: "A true or false argument that switches behaviour hides two functions in one, and splitting them makes each call site readable."
  - id: clean.command-query-separation
    title: "Command-query separation"
    summary: "A function either changes state or returns an answer, not both, so asking a question never has a side effect."
  - id: clean.guard-clauses
    title: "Guard clauses"
    summary: "Checking the special cases first and returning early leaves the main path unindented and easy to follow."
  - id: clean.nesting-depth
    title: "Nesting depth"
    summary: "Every extra level of indentation is one more condition the reader must hold in mind, so deep nesting is a warning sign."
  - id: clean.lookup-tables
    title: "Lookup tables"
    summary: "A map from keys to values or functions replaces a long chain of if or switch branches that only choose a value."
  - id: clean.why-comments
    title: "Comments that explain why"
    summary: "Code shows what happens, so a comment earns its place by saying why, such as a constraint, a trade-off or a link to the bug."
  - id: clean.magic-values
    title: "Magic values"
    summary: "An unexplained literal such as 86400 or 0.2 becomes a named constant that states its meaning and lives in one place."
  - id: clean.dead-code
    title: "Dead code"
    summary: "Unused functions and commented-out blocks mislead readers and rot, and version control already keeps the history."
  - id: clean.fail-fast
    title: "Fail fast"
    summary: "Checking inputs at the start and stopping with a clear error puts the failure next to its cause."
  - id: clean.swallowed-errors
    title: "Swallowed errors"
    summary: "An empty catch or a catch that only logs hides failures, so errors are handled, rethrown with context, or left to propagate."
  - id: clean.error-types
    title: "Specific error types"
    summary: "Named error classes or result values let callers handle the cases they expect and let the rest fail loudly."
  - id: clean.pure-functions
    title: "Pure functions"
    summary: "A pure function's result depends only on its arguments and it changes nothing outside, so it is trivial to test and reuse."
  - id: clean.functional-core
    title: "Functional core, imperative shell"
    summary: "Decisions are made in a pure core, and a thin outer shell does the reading, writing and calling that the core asked for."
  - id: clean.hidden-state
    title: "Hidden state"
    summary: "Module-level variables, singletons and mutation of arguments make a function's behaviour depend on history the caller cannot see."
  - id: clean.code-smells
    title: "Code smells"
    summary: "Long functions, long parameter lists, primitive obsession, feature envy and shotgun surgery are signs that a design needs attention."
  - id: clean.refactoring-moves
    title: "Refactoring moves"
    summary: "Named moves such as extract function, rename, introduce parameter object and replace conditional with polymorphism change structure without changing behaviour."
  - id: clean.refactoring-under-tests
    title: "Refactoring under tests"
    summary: "Small steps, each followed by a green test run, keep behaviour fixed while the structure changes."
  - id: clean.knowledge-duplication
    title: "Duplicated knowledge"
    summary: "DRY is about one source of truth for each rule or fact, not about removing every pair of similar lines."
  - id: clean.rule-of-three
    title: "The rule of three"
    summary: "Waiting until the third copy before extracting shows what really varies, so the abstraction fits."
  - id: clean.wrong-abstraction
    title: "The wrong abstraction"
    summary: "A shared helper that gains a flag for every caller is costlier than duplication, and inlining it again is a valid fix."
  - id: clean.solid
    title: "SOLID"
    summary: "Single responsibility, open-closed, Liskov substitution, interface segregation and dependency inversion are heuristics for code that changes safely."
  - id: clean.yagni-and-kiss
    title: "YAGNI and KISS"
    summary: "Build what is needed now in the simplest way that works, because speculative flexibility is paid for on every read."
  - id: clean.composition-over-inheritance
    title: "Composition over inheritance"
    summary: "Combining small objects or functions is easier to change than a deep class hierarchy, where a change to the base ripples down."
  - id: clean.review-priorities
    title: "Review priorities"
    summary: "A reviewer checks correctness, design, tests and security before naming and style, which tools should mostly handle."
  - id: clean.review-comments
    title: "Review comments"
    summary: "A good comment says what, why and how blocking it is, such as a question, a suggestion, a nit or a must-fix."
  - id: clean.small-changes
    title: "Small changes"
    summary: "Small, focused pull requests get faster and more careful reviews than large ones, which reviewers tend to skim."
