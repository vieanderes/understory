term: fixture
aka: [test fixture, test data, recorded fixture]
short: Known data or setup a test starts from, prepared the same way every run.
explain: |
  A test that checks "overdue invoices are flagged" needs some invoices first: one overdue,
  one not. Preparing that starting point by hand in every test is repetitive and drifts.
  Sharing it keeps tests short and their starting point clear.

  The word covers several things: sample data files, builder functions like
  `makeInvoice({ dueDate })`, recorded API replies played back in tests, and Playwright's
  setup helpers. The trap is one giant shared dataset every test leans on. Change it for
  one test and twenty others break. Build what each test needs, close to the test.
analogy: The ingredients a cookery show lays out in little bowls before the cameras roll.
example:
  language: ts
  code: |
    const makeInvoice = (overrides = {}) => ({
      id: 'inv-1',
      amountPence: 12000,
      dueDate: '2026-01-31',
      paid: false,
      ...overrides,
    });

    const overdue = makeInvoice({ dueDate: '2025-12-01' });
usage: Record the provider's reply as a fixture so the test doesn't call their sandbox every run.
related: [stub, mock, snapshot-test]
level: 2
lessons:
