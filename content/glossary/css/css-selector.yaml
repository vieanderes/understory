term: selector
aka: [CSS selector, class selector, type selector]
short: The part of a CSS rule before the braces that picks which elements the rule styles.
explain: |
  A style sheet needs a way to say which elements a rule is for. The first
  half of every rule does the picking. `p` picks every paragraph, `.price` picks every
  element with that class, and `#menu` picks the one element with that id.

  Selectors combine. `nav a` means links inside a `nav`, and `button:hover` means a button
  under the pointer. When two rules pick the same element and disagree, the stronger
  selector wins, which is where specificity comes in. Prefer one class per job. It reads clearly and is simple to
  override.
analogy: The address on an envelope. It decides which houses get the letter, not what the letter says.
example:
  language: css
  code: |
    p { line-height: 1.5; }          /* every paragraph */
    .price { font-weight: 700; }     /* class="price" */
    nav a { text-decoration: none; } /* links inside nav */
usage: The selector `.card p` also catches the footer text, so give that paragraph its own class.
twin:
  term: specificity
  difference: A selector decides which elements a rule applies to. Specificity is the score that decides which of several matching rules wins.
related: [specificity, cascade, pseudo-class, pseudo-element, utility-class]
level: 1
