id: pro.react
title: React like a pro
objective: Derive values instead of syncing state, keep effects for the outside world, draw component boundaries well, and name hooks clearly.
level: advanced
minutes: 10
concepts: [pro.derived-state, pro.effect-discipline, pro.component-boundaries]
prerequisites: [react.hooks-and-refs]
opening:
  text: >-
    You'll spot the React habits that mark code as junior, and replace them with simpler
    ones. Fewer effects and less state mean fewer renders and fewer bugs.

steps:
  - type: prose
    id: derived-state
    body: |-
      You've met every habit in this lesson. Now you'll use them the way a reviewer does.

      First question on any state: could I work this out instead?

      ```tsx
      const fullName = first + ' ' + last;
      ```

      A value you can compute from props or state needs no state and no effect. The pro
      rule is **derive, don't sync**.

  - type: bug-hunt
    id: hunt-synced-name
    concept: pro.derived-state
    difficulty: 1
    language: tsx
    code: |
      function Greeting({ first, last }: { first: string; last: string }) {
        const [fullName, setFullName] = useState('');
        useEffect(() => {
          setFullName(first + ' ' + last);
        }, [first, last]);
        return <p>Hello, {fullName}</p>;
      }
    prompt: >-
      A pull request adds this greeting. For a moment it says "Hello, " with no name. Tap the
      line where the extra copy starts.
    lines: [2]
    reasons:
      - text: The name is a copy an effect fills later
        correct: true
        feedback: >-
          Yes. Write `const fullName = first + ' ' + last;` and delete the state and the effect.
      - text: '`fullName` is missing from the dependencies'
        feedback: >-
          Adding it would run the effect on its own output. The effect shouldn't exist at all.
      - text: The state should start as `first`
        feedback: >-
          That still shows a wrong name first. Work it out during render instead.
    fix: |
      function Greeting({ first, last }: { first: string; last: string }) {
        const fullName = first + ' ' + last;
        return <p>Hello, {fullName}</p>;
      }

  - type: ai-review
    id: review-stale-selection
    concept: pro.derived-state
    difficulty: 3
    language: tsx
    request: Add a details panel that shows the selected item, and let people rename items.
    flawClass: logic
    code: |
      const [items, setItems] = useState(startingItems);
      const [selected, setSelected] = useState(items[0]);

      function rename(id: number, title: string) {
        setItems(items.map((item) => (item.id === id ? { ...item, title } : item)));
      }

      return (
        <>
          <ItemList items={items} onSelect={setSelected} onRename={rename} />
          <Details item={selected} />
        </>
      );
    prompt: >-
      An assistant wrote this. Rename the selected item, and the list shows the new title.
      The details panel keeps the old one. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`selected` keeps its own copy of an item'
        correct: true
        feedback: >-
          Right. Keep the id in state and find the item during render.
      - text: '`rename` changes the item in place'
        feedback: >-
          It doesn't: `map` and spread make a new item. The copy in `selected` is the old one.
      - text: '`Details` needs a `key`'
        feedback: >-
          A key resets a component's state. `Details` has none; it's handed a stale object.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Select an item, rename it, then read the details panel
          correct: true
          feedback: >-
            Yes. Only the selected item has a second, stale copy.
        - text: Rename an item that isn't selected
          feedback: >-
            The panel shows a different item, so it stays right. The bug never shows.
        - text: Select a second item, then read the panel
          feedback: >-
            Selecting stores a fresh copy, so this passes. Renaming is what makes it stale.
    fix: |
      const [items, setItems] = useState(startingItems);
      const [selectedId, setSelectedId] = useState(items[0].id);
      const selected = items.find((item) => item.id === selectedId);

      function rename(id: number, title: string) {
        setItems(items.map((item) => (item.id === id ? { ...item, title } : item)));
      }

      return (
        <>
          <ItemList items={items} onSelect={(item) => setSelectedId(item.id)} onRename={rename} />
          <Details item={selected} />
        </>
      );

  - type: code-challenge
    id: write-visible-todos
    concept: pro.derived-state
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      This to-do list copies its filtered list into state and syncs it with an effect.
      Ticking `Hide done` does nothing, and new to-dos never appear.


      Delete the copy and the effect. Work out the visible to-dos during render, from
      `todos`, the search text and the checkbox.
    hints:
      - Look at what the effect's dependency list leaves out.
      - Everything the effect computes can run straight in the component body.
      - "Replace the state and the effect with `const visible = todos.filter((todo) => {`."

  - type: prose
    id: effect-discipline
    body: |-
      Second question: what is this effect talking to?

      **Effect discipline** means an effect is only for staying in step with something outside
      React: a subscription, a timer, a connection.

      Everything else has a better home. Work caused by a click goes in the handler.
      Values you can compute are derived. State that should start fresh gets a new `key`.

  - type: multiple-choice
    id: pick-real-effect
    concept: pro.effect-discipline
    difficulty: 2
    question: Which of these really needs an effect?
    choices:
      - text: Listening for the window's `resize` event
        correct: true
        feedback: >-
          Yes. The window is outside React, and the cleanup stops listening.
      - text: Logging a message when a button is clicked
        feedback: >-
          The click caused it, so it belongs in the click handler.
      - text: Filtering a list when the search changes
        feedback: >-
          That's a derived value. Filter during render.
      - text: Clearing a form when the contact changes
        feedback: >-
          A `key` tied to the contact resets the form's state, with no effect.

  - type: fill-blank
    id: fill-key-reset
    concept: pro.effect-discipline
    difficulty: 2
    prompt: Give the form fresh state whenever `userId` changes, with no effect.
    language: tsx
    template: |
      function ProfilePage({ userId }: { userId: string }) {
        return <ProfileForm {{1}}={userId} userId={userId} />;
      }
    blanks:
      - key: '1'
        answer: key
    bank: [key, id, ref, reset]

  - type: prose
    id: component-boundaries
    body: |-
      Last question: does this component need this prop?

      A layout that only passes `user` down to a sidebar is drilling it. Hand the layout the
      finished sidebar as `children` instead. The layout arranges parts, and knows nothing
      about users. That's a clean **component boundary**.

  - type: multiple-choice
    id: pick-children
    concept: pro.component-boundaries
    difficulty: 3
    language: tsx
    code: |
      <Page cart={cart} />

      function Page({ cart }: { cart: Cart }) {
        return <Header cart={cart} />; // Page never reads cart
      }

      function Header({ cart }: { cart: Cart }) {
        return <CartButton count={cart.items.length} />;
      }
    question: '`Page` and `Header` only pass `cart` along. What is the cleaner design?'
    choices:
      - text: Pass the finished `CartButton` as `children`
        correct: true
        feedback: >-
          Yes. `Page` and `Header` arrange what they're given, and never touch `cart`.
      - text: Put `cart` in a global variable
        feedback: >-
          It hides who uses it, and every test shares one cart. Composition is simpler.
      - text: Give `Page` more props for later
        feedback: >-
          More props tie `Page` to data it doesn't use. Pass the ready-made part instead.

  - type: explain-back
    id: explain-derive-not-sync
    concept: pro.derived-state
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Why is computing a value during render better than copying it into state and syncing
      it with an effect?
    rubric:
      - The effect runs after render, so the screen first shows a stale or empty value.
      - Two copies of the truth drift apart when a dependency or an update is missed.
      - A derived value is always current and needs one render.
    modelAnswer: >-
      An effect runs after the render, so the first paint shows the old value, then React
      renders again. Worse, you now keep two copies of the same fact. Miss one dependency,
      like the checkbox in the to-do list, and they drift. Computing it during render is
      always right.

recap:
  - Derive values from props and state during render, and keep ids, not copies, in state.
  - Keep effects for the outside world, put click work in handlers, and reset with a `key`.
  - Pass ready-made parts as `children` instead of drilling props through layers.
recall:
  - id: card-derive
    concept: pro.derived-state
    front: What's the rule for a value you can compute from props or state?
    back: >-
      Derive, don't sync: compute it during render, with no state and no effect.
  - id: card-effect-use
    concept: pro.effect-discipline
    front: What is an effect for?
    back: >-
      Staying in step with something outside React, such as a subscription, a timer or a
      third-party widget.
  - id: card-key-reset
    concept: pro.effect-discipline
    front: How do you give a component fresh state when an id changes, without an effect?
    back: >-
      Render it with that id as its `key`. A new key makes React start a new instance.
  - id: card-children
    concept: pro.component-boundaries
    front: A component only passes a prop down to a child. What's the cleaner design?
    back: >-
      Let the parent build the child and pass it as `children`, so the middle component
      never needs the prop.

references:
  - kind: docs
    title: You Might Not Need an Effect
    authors: React team
    venue: react.dev
    url: https://react.dev/learn/you-might-not-need-an-effect
    note: The catalogue of effects that should be derived values, handlers or keys.
    primary: true
    verified: true
  - kind: docs
    title: Passing Props to a Component
    authors: React team
    venue: react.dev
    url: https://react.dev/learn/passing-props-to-a-component
    note: Passing JSX as `children` to keep components apart.
    verified: true
  - kind: docs
    title: Choosing the State Structure
    authors: React team
    venue: react.dev
    url: https://react.dev/learn/choosing-the-state-structure
    note: Avoiding duplicated state, with a selected item kept by id.
    verified: true

deepDive: >-
  The behaviour here was run with React and jsdom. The synced greeting rendered twice, and
  its server render showed "Hello, " with no name, because effects never run on the server.
  In the stale-selection example, the details panel kept the old title after a rename,
  because `selected` still pointed at the old object.


  The same review questions extend to hooks. A custom hook starts with `use` and is named
  for what it gives you, such as `useOnlineStatus`. If it calls no hooks, make it a plain
  function. The next lesson adds one more question: is this slow enough to be worth
  keeping between renders?
