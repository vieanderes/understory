id: next.app-router
title: Pages, layouts and links
objective: Turn folders into pages, share a layout, link between pages, and show loading and error states.
level: essential
minutes: 10
concepts: [next.file-routing, next.layouts, next.links, next.loading-and-error]
prerequisites: [next.what-nextjs-adds]
opening:
  text: >-
    You'll add pages to an app by making folders, and give them one shared header. Then you'll
    make a page that crashes show a friendly message instead of a broken screen.

steps:
  - type: prose
    id: folders-and-files
    body: >-
      In the last lesson, `app/page.tsx` was the home page. Every other page works the same
      way. A folder under `app` adds a part to the URL, and a `page.tsx` inside it draws that
      page:


      ```text

      app/page.tsx               →  /

      app/about/page.tsx         →  /about

      app/recipes/page.tsx       →  /recipes

      app/recipes/soup/page.tsx  →  /recipes/soup

      ```


      Each URL your app answers is a **route**.

  - type: predict-output
    id: predict-urls
    concept: next.file-routing
    difficulty: 1
    language: text
    code: |
      app/page.tsx
      app/contact/page.tsx
      app/shop/basket/page.tsx
    question: Which of these URLs shows a "404 not found" page?
    choices:
      - text: '`/shop`'
        correct: true
        feedback: >-
          Right. The `shop` folder has no `page.tsx` of its own.
      - text: '`/contact`'
        feedback: >-
          `app/contact/page.tsx` exists, so `/contact` is a page.
      - text: '`/shop/basket`'
        feedback: >-
          That one has a `page.tsx`. A folder without one only adds a part to the URLs below
          it.

  - type: prose
    id: dynamic-segments
    body: >-
      A shop with 500 products can't have 500 folders. A folder name in square brackets
      matches any value: `app/recipes/[slug]/page.tsx` serves `/recipes/soup`,
      `/recipes/pancakes` and the rest.


      The page gets the value in `params`. In Next.js 16, `params` is a promise, so you
      `await` it:


      ```tsx

      export default async function RecipePage({ params }: PageProps<'/recipes/[slug]'>) {
        const { slug } = await params;
        return <h1>Recipe: {slug}</h1>;
      }

      ```


      `PageProps` is a type Next.js makes for each route, so it knows `params` holds a `slug`.

  - type: ai-review
    id: review-sync-params
    concept: next.file-routing
    difficulty: 2
    language: tsx
    request: Add a page for each book at /books/some-title.
    flawClass: hallucinated-api
    code: |
      // app/books/[slug]/page.tsx
      export default function BookPage({ params }: { params: any }) {
        return <h1>Book: {params.slug}</h1>;
      }
    prompt: >-
      An assistant wrote this, in the style of older Next.js versions. `/books/emma` shows only
      "Book:", and the terminal says ``Route "/books/[slug]" used `params.slug`. `params` is a
      Promise``. Tap the line at fault.
    lines: [3]
    reasons:
      - text: It reads `slug` without awaiting `params`
        correct: true
        feedback: >-
          Yes. A promise has no `slug` property, so the heading gets `undefined`.
      - text: The folder should be `[title]`
        feedback: >-
          The name in the brackets only has to match the key you read. `slug` matches here.
      - text: A page can't have a `params` prop
        feedback: >-
          Every page in a bracket folder gets `params`. It arrives as a promise now.
    fix: |
      // app/books/[slug]/page.tsx
      export default async function BookPage({ params }: PageProps<'/books/[slug]'>) {
        const { slug } = await params;
        return <h1>Book: {slug}</h1>;
      }

  - type: prose
    id: layouts-and-links
    body: >-
      A `layout.tsx` wraps every page below it. The page arrives as its `children`, like the
      children you passed in React. Its props type is `LayoutProps`, the layout's twin of
      `PageProps`.


      Move between two pages under one layout, and only the page part changes. That needs a
      `<Link>` from `next/link`. A plain `<a>` makes the browser load a whole new document, so
      everything starts again, the layout included.

  - type: multiple-choice
    id: pick-plain-link
    concept: next.links
    difficulty: 2
    question: >-
      A layout's search box holds "soup". Someone clicks a plain `<a>` to another recipe. What's
      in the box now?
    choices:
      - text: Nothing, because the whole page reloaded
        correct: true
        feedback: >-
          Right. A plain link fetches a new document, and every input starts empty again.
      - text: '"soup", because the layout stayed'
        feedback: >-
          That's what `<Link>` gives you. A plain `<a>` throws the whole page away first.
      - text: '"soup", because browsers remember inputs'
        feedback: >-
          Sometimes they do when you press Back. A new page load from a link starts empty.

  - type: fill-blank
    id: fill-shop-layout
    concept: next.layouts
    difficulty: 2
    language: tsx
    prompt: >-
      Give every page under `/shop` the same header, with links that keep it on screen. Fill
      the gaps.
    template: |
      // app/shop/layout.tsx
      import {{1}} from '{{2}}';

      export default function ShopLayout({ children }: LayoutProps<'/shop'>) {
        return (
          <>
            <header>
              <{{1}} {{3}}="/shop/basket">Basket</{{1}}>
            </header>
            <main>{children}</main>
          </>
        );
      }
    blanks:
      - key: '1'
        answer: Link
      - key: '2'
        answer: next/link
      - key: '3'
        answer: href
    bank: [Link, a, next/link, react, href, to]

  - type: prose
    id: loading-and-error
    body: >-
      Two more files handle the moments between. A `loading.tsx` shows while a page below it is
      still loading, then gives way to the page.


      An `error.tsx` shows in place of a page that crashed, and the rest of the layout keeps
      working. It gets the `error`, and a `retry` function that tries the page again. It has to
      start with `'use client'`. The next lesson says why.

  - type: code-challenge
    id: build-error-page
    concept: next.loading-and-error
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write `app/recipes/error.tsx`. Next.js shows it when the recipes page crashes, and passes
      it `error` and `retry`.


      Show a heading, `Couldn't load the recipes`, and the error's `message` in a paragraph.
      Add a button labelled `Try again` that calls `retry` when clicked.
    hints:
      - The props arrive as one object. Destructure `error` and `retry` from it.
      - The message is `error.message`, like any JavaScript error.
      - 'The button needs `onClick={() => retry()}`.'

  - type: explain-back
    id: explain-link-keeps-layout
    concept: next.links
    difficulty: 3
    prompt: >-
      A music player sits in the root layout. Why does it keep playing across `<Link>` clicks,
      but stop on a plain `<a>`?
    rubric:
      - The root layout wraps every page, and `<Link>` changes only the page inside it.
      - The layout, and the player in it, stay on screen with their state.
      - A plain `<a>` loads a whole new document, so the player starts again from nothing.
    modelAnswer: >-
      The player lives in the root layout, which wraps every page. `<Link>` swaps only the page
      part, so the layout and its player stay mounted and keep playing. A plain `<a>` asks the
      browser for a whole new document. Everything on the old page is thrown away, the player
      included.

recap:
  - Add a page by making a folder with a `page.tsx`, and read `[slug]` with `await params`.
  - Share a header with `layout.tsx`, and move between pages with `<Link>`.
  - Show a fallback while a page loads, and a friendly `error.tsx` when it crashes.

recall:
  - id: card-public-segment
    concept: next.file-routing
    front: What makes a folder under `app` a page of its own?
    back: >-
      A `page.tsx` file inside it. Without one, the folder only adds a part to the URLs of the
      folders below it.
  - id: card-await-params
    concept: next.file-routing
    front: How does `app/books/[slug]/page.tsx` read the slug in Next.js 16?
    back: >-
      Make the page `async` and write `const { slug } = await params;`. `params` is a promise.
  - id: card-layout-survives
    concept: next.layouts
    front: What survives a `<Link>` move between two pages under one layout?
    back: >-
      The layout and everything in it, including what someone typed. Only the page below
      changes.
  - id: card-error-file
    concept: next.loading-and-error
    front: What does an `error.tsx` file get from Next.js?
    back: >-
      The `error` that was thrown, and a `retry` function that renders the page again. The
      file starts with `'use client'`.

references:
  - kind: docs
    title: Layouts and Pages
    authors: Vercel
    venue: Next.js documentation, version 16
    url: https://nextjs.org/docs/app/getting-started/layouts-and-pages
    note: Pages from folders, nested layouts, dynamic segments and `<Link>`.
    primary: true
    verified: true
  - kind: docs
    title: Linking and Navigating
    authors: Vercel
    venue: Next.js documentation, version 16
    url: https://nextjs.org/docs/app/getting-started/linking-and-navigating
    note: What `<Link>` does differently from a plain link, including prefetching.
    verified: true
  - kind: docs
    title: Error Handling
    authors: Vercel
    venue: Next.js documentation, version 16
    url: https://nextjs.org/docs/app/getting-started/error-handling
    note: "`error.tsx`, `retry`, `not-found.tsx`, and where each boundary sits."
    primary: true
    verified: true

deepDive: >-
  **Prefetching.** `<Link>` fetches the page it points to as soon as the link scrolls into
  view, in production. By the time someone clicks, the page is often already there.


  **More special files.** `not-found.tsx` shows when a page calls `notFound()`, for example a
  recipe slug that doesn't exist. `global-error.tsx` catches a crash in the root layout itself,
  which an ordinary `error.tsx` can't, since it sits inside that layout. `template.tsx` is a
  layout that starts fresh on every move.


  **Organising folders.** A folder in parentheses, such as `(shop)`, groups routes and shares a
  layout without adding to the URL. A folder starting with `_` is left out of routing, so it can
  hold components. `[...parts]` catches any number of segments as an array.


  **`reset` versus `retry`.** `error.tsx` also receives `reset`, which re-renders without
  fetching the page again. The docs recommend `retry` in most cases.
