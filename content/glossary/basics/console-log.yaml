term: console.log
aka: [print to the console]
short: The instruction that shows a value in the output, so you can see what your code did.
explain: |
  Code works out values out of sight. `console.log(...)` makes them visible: whatever sits
  in the brackets appears in the output, each call on a new line.

  It's the first tool every programmer learns, and one they use for life to peek inside a
  program. It only shows, though. It gives nothing back to your code.
analogy: Thinking out loud. Everyone can hear the number, but saying it doesn't write it down anywhere.
example:
  language: js
  code: |
    console.log("Hello");        // Hello
    console.log(6 * 7);          // 42
    const total = 12;
    console.log("total", total); // total 12
usage: Leave a labelled console.log in the loop for now, and delete it once the total looks right.
twin:
  term: return-value
  difference: '`console.log` shows a value to a person and the program carries on without it. A return value hands the value back to the code, which can use it.'
related: [return-value, debugger, string]
level: 1
lessons: [basics.first-program, basics.watching-code]
