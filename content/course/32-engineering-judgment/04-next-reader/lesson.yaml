id: judgment.next-reader
title: What confuses the next person
objective: Find what will surprise the next reader, such as a hidden invariant, an implicit contract or a misleading name, and fix the surprise.
level: advanced
minutes: 10
concepts: [judgment.surprise, judgment.hidden-invariants, judgment.implicit-contracts]
prerequisites: [clean.code-review, judgment.what-to-verify]
opening:
  text: >-
    You'll find the code that will mislead the next person to change it, and fix the
    surprise, not the style. Many bugs in old code start as a rule nobody wrote
    down.

steps:
  - type: prose
    id: least-surprise
    body: >-
      The clean-code chapter covered names and comments. This lesson is about behaviour. The next person
      reads a function's name and shape, then guesses the rest.


      When code does what it looks like it does, it's safe to change. That's the
      **principle of least surprise**. Every surprise is a bug waiting for someone who didn't
      know.

  - type: predict-output
    id: predict-find-adds
    concept: judgment.surprise
    difficulty: 1
    language: js
    code: |
      function findMember(members, email) {
        let member = members.find((m) => m.email === email);
        if (!member) {
          member = { email, joined: new Date() };
          members.push(member);
        }
        return member;
      }

      const members = [];
      findMember(members, "kim@example.com"); // is she signed up?
      console.log(members.length);
    question: A teammate uses `findMember` to check a sign-up form. What does line 12 log?
    choices:
      - text: "`0`"
        feedback: >-
          That's what the name promises. But `findMember` adds a member whenever it finds none.
      - text: "`1`"
        correct: true
        feedback: >-
          Right. A "find" that writes. That's the surprise someone trips on.
      - text: "`undefined`"
        feedback: >-
          `members.length` is always a number. The question is whether a lookup changed the
          list.

  - type: multiple-choice
    id: pick-remove-surprise
    concept: judgment.surprise
    difficulty: 2
    question: What removes the surprise in `findMember` for every future caller?
    choices:
      - text: Split it into `findMember` and `addMember`
        correct: true
        feedback: >-
          Yes. Each call now does what it says, and the caller chooses.
      - text: A comment saying it may add a member
        feedback: >-
          Callers read the call site, not the comment. `findMember(...)` still reads like a
          lookup.
      - text: Rename the parameter to `membersToChange`
        feedback: >-
          A hint inside the function, but every call site still says `findMember`. The
          behaviour should match the name.
      - text: Wrap each call in `try` and `catch`
        feedback: >-
          Nothing throws. The surprise is a quiet write, and no `catch` will ever see it.

  - type: prose
    id: implicit-contracts
    body: >-
      Callers depend on more than you promised: the order of a list, `null` against `[]`, how
      long a call takes, the wording of an error. Nobody wrote it down, yet code relies on it.


      That's an **implicit contract**. With enough callers, every behaviour they can see
      becomes one. So a change that keeps every test green can still break someone.

  - type: ai-review
    id: review-recent-borrowers
    concept: judgment.implicit-contracts
    difficulty: 3
    language: js
    request: Make recentBorrowers faster. It runs an `includes` check for every loan.
    flawClass: regression
    code: |
      // loans arrive newest first; the home page shows the first five
      function recentBorrowers(loans) {
        const seen = {};
        for (const loan of loans) {
          if (!(loan.memberId in seen)) seen[loan.memberId] = true;
        }
        return Object.keys(seen).map(Number);
      }
    prompt: >-
      The old version kept members newest first. Its tests check for no duplicates, and they
      still pass. Since the change, the library's "Recently active" box shows the same
      long-standing members every day. Tap the line at fault.
    lines: [7]
    reasons:
      - text: Integer keys come back in ascending order
        correct: true
        feedback: >-
          Yes. `Object.keys` sorts number-like keys, so newest first is gone.
      - text: "`in` misses a member whose id is 0"
        feedback: >-
          `0 in { 0: true }` is `true`, so id 0 works. The order on line 7 is what changed.
      - text: "`map(Number)` turns the ids into strings"
        feedback: >-
          The reverse: object keys are strings, and `Number` turns them back. The order is
          what regressed.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Loans out of id order, checking the exact order
          correct: true
          feedback: >-
            Yes. It pins the contract the home page relies on: newest first.
        - text: A list with the same member twice
          feedback: >-
            That's the test that already passed. It checks duplicates, not order.
        - text: A timing test with 100,000 loans
          feedback: >-
            It proves the speed-up, and says nothing about the order callers see.
    fix: |
      function recentBorrowers(loans) {
        // A Set keeps first-seen order, so the newest borrower stays first.
        return [...new Set(loans.map((loan) => loan.memberId))];
      }

  - type: prose
    id: hidden-invariants
    body: >-
      A **hidden invariant** is a rule the code relies on but never enforces: "the timetable
      is sorted by start time", or "every order has at least one line".


      It holds until someone adds data a new way. Then the break shows up far from the
      change, in code that trusted the rule. A comment states a rule. Only code that keeps
      it, or checks it, protects it.

  - type: bug-hunt
    id: hunt-unsorted-timetable
    concept: judgment.hidden-invariants
    difficulty: 3
    language: js
    code: |
      // timetable is sorted by start time, earliest first
      function nextLesson(timetable, now) {
        return timetable.find((lesson) => lesson.start > now);
      }

      // Added this term, for before-school clubs:
      function addClub(timetable, club) {
        timetable.push(club);
      }
    prompt: >-
      Chess club meets at 08:00 and was added this term. At 07:30, the school screen says
      the next lesson is Maths at 09:00. Tap the line at fault.
    lines: [8]
    reasons:
      - text: "`push` puts the club at the end, out of order"
        correct: true
        feedback: >-
          Yes. `find` trusts the sorted order, and `push` quietly broke it.
      - text: "`find` should be `filter`"
        feedback: >-
          `filter` returns every later lesson. Taking the first match is right, as long as the
          list is sorted.
      - text: "`>` should be `>=`"
        feedback: >-
          That only changes a lesson that starts exactly now. It can't make 09:00 win over
          08:00.
    fix: |
      function addClub(timetable, club) {
        const at = timetable.findIndex((lesson) => lesson.start > club.start);
        if (at === -1) timetable.push(club);
        else timetable.splice(at, 0, club);
      }

  - type: code-challenge
    id: write-add-lesson
    concept: judgment.hidden-invariants
    difficulty: 4
    language: ts
    editable: '9'
    prompt: >-
      Make the timetable's rule impossible to forget. Write `addLesson(timetable, lesson)`,
      the one way lessons get added:


      - Return a new array sorted by `start`, and leave `timetable` unchanged.

      - Times are `"HH:MM"` strings, so they compare as text.

      - Refuse an overlap: throw an `Error` whose message names the lesson it clashes with.

      - A lesson may start the minute another ends.


      Example: adding Chess club, `08:00` to `08:45`, to `[Maths]` at `09:00` gives
      `[Chess club, Maths]`.
    hints:
      - The starter copies and appends. Which two rules from the list does it never check?
      - >-
        Two lessons overlap when each starts before the other ends. Strict `<` lets one end
        exactly when the next begins.
      - >-
        Find a clash with `timetable.find((other) => lesson.start < other.end && ...)`, throw
        if there is one, then return a sorted copy with `toSorted`.

  - type: explain-back
    id: explain-keep-the-order
    concept: judgment.implicit-contracts
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks: a teammate wants `recentBorrowers` to return ids sorted, since
      "nobody promised an order". Do you agree? Defend your answer.
    rubric:
      - Callers depend on what they can observe, promised or not, and the home page relies on newest first.
      - Before changing it, find the callers, or pin today's order with a test, so nothing breaks quietly.
      - If the order must change, make the contract explicit with a name, a test or a new function, and move callers over.
    modelAnswer: >-
      I'd push back. Nobody wrote the order down, but the home page depends on newest first,
      so it's a contract in practice. Changing it silently is how a green test suite ships a
      regression. First I'd search for callers and add a test that pins the current order. If
      we still need sorted ids, I'd add a separate function, such as `borrowerIdsSorted`,
      and leave the existing one alone.

recap:
  - Make code do what its name and shape suggest, so the next change is safe.
  - Treat any behaviour callers can see as a contract, promised or not.
  - Enforce a hidden rule in code, in one place, rather than in a comment.

recall:
  - id: card-least-surprise
    concept: judgment.surprise
    front: What makes a function surprising to the next person who calls it?
    back: >-
      It does something its name and shape don't suggest, such as a "find" that adds a
      record.
  - id: card-implicit-contract
    concept: judgment.implicit-contracts
    front: What is an implicit contract? Give an example.
    back: >-
      Behaviour callers rely on that nobody promised, such as the order of a list, or `null`
      against `[]`.
  - id: card-object-keys
    concept: judgment.implicit-contracts
    front: Why can swapping a list for an object's keys change the order?
    back: >-
      `Object.keys` lists integer-like keys in ascending order, first, whatever order they were
      added in.
  - id: card-hidden-invariant
    concept: judgment.hidden-invariants
    front: How do you protect a rule like "the timetable is sorted"?
    back: >-
      Enforce it in code, in one place, such as a single `addLesson` that keeps the order and
      refuses overlaps.

references:
  - kind: essay
    title: Hyrum's Law
    authors: Hyrum Wright
    url: https://www.hyrumslaw.com/
    note: With enough users of an API, every observable behaviour will be depended on by somebody.
    primary: true
    verified: false
  - kind: book
    title: "Software Engineering at Google: Lessons Learned from Programming Over Time"
    authors: Titus Winters, Tom Manshreck and Hyrum Wright
    year: 2020
    venue: O'Reilly Media
    note: Why changing code that others depend on is the hard part of keeping it alive.
    primary: true
    verified: false
  - kind: spec
    title: "ECMAScript Language Specification: OrdinaryOwnPropertyKeys"
    authors: Ecma TC39
    venue: ECMA-262
    url: https://tc39.es/ecma262/#sec-ordinaryownpropertykeys
    note: Integer-like keys first in ascending order, then other strings in the order they were added.
    verified: false
  - kind: paper
    title: Applying "Design by Contract"
    authors: Bertrand Meyer
    year: 1992
    venue: IEEE Computer 25(10)
    note: Preconditions, postconditions and invariants written down and checked, rather than assumed.
    verified: false

deepDive: >-
  The idea that every observable behaviour becomes a contract is often called Hyrum's Law. It
  explains why big codebases change slowly. Callers depend on iteration order, and on the exact
  text of an error that someone parses. They depend on a call being fast enough to sit inside
  a loop, even on a bug that someone worked around. The work of changing such code is finding those
  callers first.


  Hash maps in many languages make this worse on purpose. Go randomises the order of map
  iteration, so no caller can come to depend on it. JavaScript went the other way: `Map` and
  `Set` keep insertion order, as the spec guarantees, and plain objects keep it for string
  keys but sort integer-like ones. Know which one you have before you rely on its order.


  A hidden invariant can live in a type as well as in a function. A `SortedTimetable` type
  that only `addLesson` can create means the compiler rejects any other way of building one.
  At run time, a check that throws when the rule is broken turns a far-away wrong answer into
  a clear error at the place that broke it. That's the essence of design by contract:
  preconditions, postconditions and invariants that are written down and checked.


  Surprise comes in quieter forms too: a function that returns `null` on one path and `[]`
  on another, a getter that writes, or a "pure" helper that reads the clock. Each is safe
  until the first caller who believed the shape.
