term: passkey
aka: [WebAuthn, FIDO2, passwordless sign-in]
short: A sign-in key pair kept on your device, unlocked with a fingerprint, face or PIN, not a password.
explain: |
  Passwords get reused, guessed and typed into fake sites. This replaces them. Your device
  makes a key pair for each site. The site keeps only the public half; the private half
  never leaves your device.

  To sign in, the site sends a random challenge and the device signs it after you unlock it.
  The signature is bound to the site's real domain, so a look-alike site gets nothing it
  can use. A leaked database of public keys is useless to an attacker.
analogy: A wax seal only your ring can make. Anyone can check the seal, but nobody can copy the ring from it.
usage: Offer a passkey at sign-up, so most people never set a password a phishing page could steal.
twin:
  term: authentication
  difference: Authentication is the job of proving who you are, by any method. A passkey is one way to do it, with a device-held key instead of a password.
related: [authentication, hashing, session, openid-connect]
level: 2
lessons: [backend.oauth-and-passkeys]
