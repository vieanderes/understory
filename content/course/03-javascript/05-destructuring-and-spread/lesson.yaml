id: js.destructuring-and-spread
title: Destructuring, spread and defaults
objective: Unpack objects and arrays into variables, copy and merge them with spread, and give parameters defaults.
level: essential
minutes: 10
concepts: [js.destructuring, js.spread-and-rest, js.default-values]
prerequisites: [js.everyday-syntax]
opening:
  text: >-
    You'll pull values out of objects in one line, and merge settings without losing anyone's
    choice. Modern code, from small scripts to React, is full of these three dots and braces.

steps:
  - type: prose
    id: name-destructuring
    body: |-
      Reading several properties one by one gets long. **Destructuring** unpacks them in one go:

      ```js
      const film = { title: "Up", minutes: 96 };
      const { title, minutes } = film;
      ```

      Now `title` is `"Up"` and `minutes` is 96. The names must match the property names. For an
      array, square brackets unpack by position: `const [first, second] = list;`.

  - type: predict-output
    id: predict-object-destructuring
    concept: js.destructuring
    difficulty: 1
    language: js
    code: |
      const film = { title: "Up", minutes: 96, rating: 8 };
      const { title, score } = film;
      console.log(title, score);
    question: A film card reads its data. What does this log?
    choices:
      - text: '`Up undefined`'
        correct: true
        feedback: >-
          Right. There's no `score` property, so `score` is `undefined`.
      - text: '`Up 96`'
        feedback: >-
          Braces match by name, not by position. Only square brackets go by position.
      - text: '`Up 8`'
        feedback: >-
          Close guess, but the property is called `rating`. A name that doesn't match finds
          nothing.
      - text: A `ReferenceError`
        feedback: >-
          A missing property isn't an error. Its variable is `undefined`, like `film.score`
          would be.

  - type: prose
    id: name-parameters-and-shorthand
    body: |-
      Destructuring works in a function's parameters too:

      ```js
      function describe({ title, minutes }) {
        return `${title} (${minutes} min)`;
      }
      ```

      It goes the other way as well. `{ title, minutes }` builds an object from two variables,
      short for `{ title: title, minutes: minutes }`. That's **property shorthand**. One catch:
      `describe()` with nothing throws a `TypeError`, because there's no object to unpack.

  - type: fill-blank
    id: fill-shorthand-and-parameters
    concept: js.destructuring
    difficulty: 2
    language: js
    prompt: Build the film with property shorthand, then unpack it in the parameters. Fill the gaps.
    template: |
      const title = "Up";
      const minutes = 96;
      const film = { {{1}}, minutes };

      function describe({ title, {{2}} }) {
        return `${title} (${minutes} min)`;
      }
      console.log(describe({{3}})); // Up (96 min)
    blanks:
      - key: '1'
        answer: title
      - key: '2'
        answer: minutes
      - key: '3'
        answer: film
    bank: [title, minutes, film, rating, film.title]

  - type: prose
    id: name-default-values
    body: |-
      A parameter can have a **default value**, used when the caller leaves it out:

      ```js
      function label(size = "M") {
        return "Size " + size;
      }
      ```

      `label()` gives `"Size M"`. Destructuring takes defaults too: `const { size = "M" } =
      order`. A default steps in only for `undefined`. Pass `null`, and `null` is what you
      get.

  - type: predict-output
    id: predict-default-null
    concept: js.default-values
    difficulty: 2
    language: js
    code: |
      function label(size = "M") {
        return "Size " + size;
      }
      console.log(label());
      console.log(label(null));
    question: A form sends `null` when no size was picked. What do the two lines log?
    choices:
      - text: '`Size M`, then `Size null`'
        correct: true
        feedback: >-
          Right. A default only fills in for `undefined`, and `null` is a real value.
      - text: '`Size M`, then `Size M`'
        feedback: >-
          Most people expect that. But `null` was passed on purpose, so the default stays out.
      - text: '`Size undefined`, then `Size null`'
        feedback: >-
          Leaving the argument out gives `undefined`, and that's exactly when the default
          steps in.

  - type: prose
    id: name-spread-and-rest
    body: >-
      Three dots, `...`, **spread** a list or an object out into a new one. `[...songs,
      "Encore"]` is a new array with one more song. `{ ...defaults, ...saved }` is a new object
      with both sets of properties. When both have the same key, the later one wins.


      In a parameter list the dots do the opposite. `function total(...prices)` gathers every
      argument into one array. That's a **rest parameter**.

  - type: playground
    id: fix-settings-merge
    concept: js.spread-and-rest
    difficulty: 3
    prompt: >-
      The reader chose the dark theme, but the page says light. Fix the merge on line 3 so
      their choice wins and the text size still comes from the defaults.
    html: |
      <h1>Reading settings</h1>
      <p id="summary"></p>
    js: |
      const defaults = { theme: "light", fontSize: 16 };
      const saved = { theme: "dark" };
      const settings = { ...saved, ...defaults };
      document.querySelector("#summary").textContent =
        "Theme: " + settings.theme + ", text size: " + settings.fontSize;
    editable: [js]
    checks:
      - label: The page says the theme is dark
        selector: '#summary'
        text: 'Theme: dark'
      - label: The text size is still 16
        selector: '#summary'
        text: 'text size: 16'
    solution:
      js: |
        const defaults = { theme: "light", fontSize: 16 };
        const saved = { theme: "dark" };
        const settings = { ...defaults, ...saved };
        document.querySelector("#summary").textContent =
          "Theme: " + settings.theme + ", text size: " + settings.fontSize;
    hints:
      - Both objects have a `theme`. Which one wins?
      - When two keys clash, the one spread later wins.
      - Spread `defaults` first and `saved` second.

  - type: code-challenge
    id: write-plan-trip
    concept: js.spread-and-rest
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `planTrip(trip, ...)`. A trip has `from`, `to` and maybe a `stops` array. Any
      number of extra stops follow as more arguments.


      Return a new trip with the same `from` and `to`, and `stops` holding the old stops then
      the extra ones. A trip with no `stops` starts from an empty list. Don't change the trip
      you were given.


      Example: `planTrip({ from: "Leeds", to: "York" }, "Tadcaster")` returns `{ from: "Leeds",
      to: "York", stops: ["Tadcaster"] }`.
    hints:
      - Three jobs, three tools. Unpack the trip, gather the extras, build a new list.
      - '`{ from, to, stops = [] }` in the parameters handles a missing list. `...extraStops` gathers the rest.'
      - 'Return `{ from, to, stops: [...stops, ...extraStops] }`.'

  - type: explain-back
    id: explain-merge-order
    concept: js.spread-and-rest
    difficulty: 3
    prompt: |-
      ```js
      const settings = { ...saved, ...defaults };
      ```

      The reader saved the dark theme, yet the page shows the default light one. Why, and what
      fixes it?
    rubric:
      - Spread copies the properties of each object into a new one, in the order written.
      - When two objects have the same key, the one spread later overwrites the earlier one.
      - Spreading `defaults` first and `saved` second lets the reader's choice win.
    modelAnswer: >-
      Spread copies each object's properties into the new one, left to right. Both objects have
      a `theme`, so the later one wins. Here `defaults` comes last, and its light theme
      overwrites the dark one the reader saved. Writing `{ ...defaults, ...saved }` fills in
      every default first, then lets the saved choices replace them.

recap:
  - Unpack objects by name and arrays by position, in variables and in parameters.
  - Give a parameter a default, and remember it only fills in for `undefined`.
  - Copy, add to and merge with spread, and gather arguments with a rest parameter.

recall:
  - id: card-destructure-by-name
    concept: js.destructuring
    front: What does `const { score } = film` give when `film` has no `score`?
    back: >-
      `undefined`. Object destructuring matches by property name, and a missing name finds
      nothing. It isn't an error.
  - id: card-default-null
    concept: js.default-values
    front: With `function label(size = "M")`, what is `size` after `label(null)`?
    back: >-
      `null`. A default only steps in when the value is `undefined`.
  - id: card-merge-order
    concept: js.spread-and-rest
    front: In `{ ...a, ...b }`, which value wins when both have the same key?
    back: >-
      The one from `b`. Properties are copied left to right, so the later one overwrites the
      earlier one.
  - id: card-rest-parameter
    concept: js.spread-and-rest
    front: What does `...prices` do in `function total(...prices)`?
    back: >-
      It gathers every argument passed into one array called `prices`. That's a rest
      parameter.

