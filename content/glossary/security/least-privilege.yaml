term: least privilege
aka:
  - principle of least privilege
  - PoLP
short: Giving each person, service or tool only the access its job needs, and no more.
explain: |
  Things go wrong: a key leaks, a dependency turns malicious, an agent gets tricked. What
  happens next depends on what that thing was allowed to touch.

  A reporting job that can only read one table can't drop the database. An agent with
  read-only access can't delete a branch. Least privilege doesn't stop the break-in; it
  shrinks the damage when one happens.
analogy: A hotel key card that opens your room and the gym, not every door on the floor.
usage: That CI token has admin on every repo, and least privilege says it needs write on one.
