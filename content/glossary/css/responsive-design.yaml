term: responsive design
aka:
  - responsive layout
  - responsive web design
short: Building one page that rearranges itself to work well on any screen size.
explain: |
  People open the same page on a phone, a tablet, a laptop and a huge monitor. Building a
  separate site for each is hopeless.

  So you build one that adapts. Use fluid widths and `fr` units instead of fixed pixels, and images that shrink. Size text in `rem`. Add media queries where the layout has to change.
  Start with the narrowest screen. The `<meta name="viewport">` tag is required, or phones
  pretend to be a desktop and shrink everything.
analogy: Water in a glass. Pour it into any shape and it fills that shape.
example:
  language: html
  code: |
    <meta name="viewport" content="width=device-width, initial-scale=1">
usage: That table breaks the responsive design; on a phone the whole page scrolls sideways.
twin:
  term: media-query
  difference: Responsive design is the goal, a page that fits every screen. A media query is one of the tools for it, and a fluid grid can often get there without one.
related:
  - media-query
  - css-grid
  - rem
  - responsive-image
level: 1
