term: long-running operation
aka: [async job, job resource, status URL, 202 Accepted]
short: Work too slow for one request, accepted at once and tracked at its own address until it ends.
explain: |
  Some work takes minutes: rendering a report, zipping an album. A request that waits that
  long will hit a proxy's timeout and fail, even though the work goes on.

  So the server answers `202 Accepted` straight away with the address of a new job. The
  client polls that address, which reports `queued`, `running`, then `succeeded` with a link
  to the result, or `failed` with a reason. Failure is part of the design: a job that never
  reports it leaves clients polling forever.
analogy: Dropping off shoes for repair. You get a ticket now, and check back until they're ready.
example:
  language: http
  code: |
    POST /v1/reports HTTP/1.1

    HTTP/1.1 202 Accepted
    Location: /v1/jobs/8c1e
    Retry-After: 5

    GET /v1/jobs/8c1e HTTP/1.1
    -> {"status": "running", "progress": 0.4}
usage: Exports can take ten minutes, so make it a long-running operation with a status URL, not a request that hangs.
related: [polling, queue, retry-after, status-code, webhook]
level: 2
lessons: [backend.long-running-and-bulk]
