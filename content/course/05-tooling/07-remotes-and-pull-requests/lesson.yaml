deepDive: |-
  The outputs here are real, from git 2.53, captured against a remote on the same machine. Only
  the address was swapped for a GitHub one. GitHub adds a few `remote:` lines of its own to a
  push.

  `git pull` is two commands. `git fetch` downloads the remote's commits and moves
  `origin/main`, your laptop's record of where the remote's `main` was. Then Git merges
  `origin/main` into your branch. `git status` compares the two, which is why it can say
  "Your branch is behind 'origin/main' by 1 commit".

  When both sides have new commits, `git pull` needs a rule for combining them. Git 2.53 stops
  with "Need to specify how to reconcile divergent branches" until you choose. `pull.rebase
  false` merges. `pull.rebase true` replays your commits on top instead, which keeps history
  in one line.

  When you really do mean to overwrite a branch, say your own after tidying it, use
  `git push --force-with-lease`. It refuses if the remote holds commits you haven't fetched.

  Teams usually protect `main` on GitHub, so a push to it is refused and every change goes
  through a pull request. The `gh` command-line tool can open one with `gh pr create`.
