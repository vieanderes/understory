id: clean.design-principles
title: Design principles in proportion
objective: Apply SOLID, KISS, YAGNI and composition over inheritance where they help, and notice when they make code worse.
level: advanced
minutes: 10
concepts: [clean.solid, clean.yagni-and-kiss, clean.composition-over-inheritance]
prerequisites: [arch.coupling-and-cohesion]
opening:
  text: >-
    You'll learn the design principles every senior engineer quotes, and when to ignore them.
    Used in proportion they keep code safe to change, and overused they bury it in layers.

steps:
  - type: prose
    id: single-responsibility
    body: >-
      Senior engineers quote a handful of design principles. Here are four, each with the
      mistake it prevents.


      First, **single responsibility**: a piece of code should have one reason to change. A
      reason is a person or rule that might ask for a change. If the tax rules and the email
      design both touch one function, it has two jobs.

  - type: multiple-choice
    id: pick-reasons-to-change
    concept: clean.solid
    difficulty: 1
    question: A `Report` class loads sales data, calculates totals and emails the PDF. How many reasons does it have to change?
    choices:
      - text: Three
        correct: true
        feedback: >-
          Yes. New data, new rules and new mail each touch it.
      - text: One, it makes reports
        feedback: >-
          "Makes reports" hides three jobs. Each one changes for a different person's reason.
      - text: Two, data and output
        feedback: >-
          Calculating totals is a job of its own. Tax rules change without new data or email.

  - type: prose
    id: keep-the-promise
    body: >-
      A subclass can **override** a method: give it a method with the same name, and that one
      runs instead of the parent's.


      The second principle says what an override may not do. Code written for the parent must
      still work when handed the subclass. That's the **Liskov substitution principle**: a
      subclass keeps every promise its parent makes.

  - type: ai-review
    id: review-read-only-store
    concept: clean.solid
    difficulty: 3
    language: ts
    request: The demo site must never change files. Add a read-only store.
    flawClass: logic
    code: |
      class FileStore {
        files = new Map<string, string>();
        save(name: string, text: string) { this.files.set(name, text); }
        read(name: string) { return this.files.get(name); }
      }

      class ReadOnlyFileStore extends FileStore {
        save(name: string, text: string) {
          throw new Error('This store is read-only');
        }
      }

      function backUp(store: FileStore, report: string) {
        store.save('report.txt', report);
      }
    prompt: >-
      An assistant wrote `ReadOnlyFileStore`. On the demo site, the nightly `backUp` now
      crashes, though it was written for any `FileStore`. Tap the line that breaks the promise.
    lines: [9]
    reasons:
      - text: It throws where the parent promised to save
        correct: true
        feedback: >-
          Yes. `backUp` trusts `FileStore`'s promise, and the subclass breaks it.
      - text: '`backUp` should check which store it got'
        feedback: >-
          That pushes the problem onto every caller. The subclass shouldn't claim to be a `FileStore`.
      - text: '`read` should throw too'
        feedback: >-
          Reading is safe on the demo site. The broken promise is `save`.
    fix: |
      // not a FileStore at all: it only offers read, so backUp can't be handed one
      class ReadOnlyFileStore {
        store: FileStore;
        constructor(store: FileStore) { this.store = store; }
        read(name: string) { return this.store.read(name); }
      }

  - type: prose
    id: principles-in-proportion
    body: |-
      Third, **YAGNI**: you aren't gonna need it. Build today's need plainly, and add
      flexibility when a real change asks for it. Its partner is **KISS**, keep it simple.

      Every principle can be overdone. An interface with one implementation, three layers
      around a simple rule: each is a principle applied too early. AI assistants love this
      kind of extra.

  - type: bug-hunt
    id: pick-yagni-first-version
    concept: clean.yagni-and-kiss
    difficulty: 2
    language: ts
    code: |
      type Channel = 'email' | 'sms' | 'push';

      const senders = {
        email: (to: string, text: string) => sendEmail(to, text),
        sms: (to: string, text: string) => { throw new Error('SMS not built yet'); },
        push: (to: string, text: string) => { throw new Error('Push not built yet'); },
      };

      export function notifyShipped(channel: Channel, to: string) {
        return senders[channel](to, 'Your order has shipped');
      }
    prompt: >-
      You asked an assistant to email customers when an order ships. Nobody has asked for
      SMS or push. Tap the lines YAGNI says to delete.
    lines: [5, 6]
    reasons:
      - text: Senders for channels nobody asked for
        correct: true
        feedback: >-
          Yes. They only throw, yet someone must read and test them.
      - text: The email sender, it should be a class
        feedback: >-
          A class adds nothing here. The email line is the one doing today's job.
      - text: The `Channel` type is too narrow
        feedback: >-
          Wider still would be more guessing. With only email needed, it could go too.
    fix: |
      export function notifyShipped(to: string) {
        return sendEmail(to, 'Your order has shipped');
      }

  - type: prose
    id: composition
    body: |-
      Fourth, overriding has a quieter trap. In the challenge below, `Cart.addMany` calls
      `this.add` inside. A subclass that counts in both `add` and `addMany` counts every item
      twice. It depended on how its parent works inside.

      **Composition** avoids that: hold a `Cart` in a field and pass calls on to it. Name the
      field with `#`, as in `#cart`, to make it private: only the class's own code can use it.

  - type: code-challenge
    id: write-audited-cart
    concept: clean.composition-over-inheritance
    difficulty: 3
    language: ts
    prompt: >-
      `AuditedCart extends Cart` counts additions, but `Cart.addMany` calls `add`, so items
      added with `addMany` are counted twice. `super.add(...)` in the starter runs the
      parent's version. Rewrite `AuditedCart` with composition.


      Hold a `Cart` in a private field. Pass `add`, `addMany` and `total` on to it. `additions`
      counts each item once. `AuditedCart` must not extend `Cart`.
    hints:
      - The double count comes from the parent calling a method the child has overridden.
      - With a field instead of `extends`, the cart's `addMany` calls the cart's own `add`, not yours.
      - 'Start with `export class AuditedCart {`, a field `additions = 0;` and `#cart = new Cart();`.'

  - type: explain-back
    id: explain-fragile-base
    concept: clean.composition-over-inheritance
    difficulty: 3
    prompt: Why can overriding a method break when the base class changes, while passing calls to a held object doesn't?
    rubric:
      - A subclass depends on how the base class works inside, such as which methods call which.
      - A change inside the base class can then call the override in new ways.
      - A held object is used only through its public methods, so its internals stay its own business.
    modelAnswer: >-
      A subclass is tied to how the parent works inside. If the parent's `addMany` starts
      calling `add`, the child's override suddenly runs twice. When you hold an object and
      pass calls to it, you only rely on what its methods promise. Its insides can change
      freely.

recap:
  - Give code one reason to change, and let a subclass keep its parent's promises.
  - Build today's need plainly, and add flexibility when a real change asks for it.
  - Prefer holding an object and passing calls on over extending its class.
recall:
  - id: card-srp
    concept: clean.solid
    front: How do you test a class against the single responsibility principle?
    back: >-
      Count its reasons to change. More than one, such as data, rules and delivery, means
      more than one responsibility.
  - id: card-liskov
    concept: clean.solid
    front: What does the Liskov substitution principle ask of a subclass?
    back: >-
      That it keeps every promise of its parent, so code written for the parent still works.
  - id: card-yagni
    concept: clean.yagni-and-kiss
    front: What does YAGNI warn against?
    back: >-
      Building flexibility for needs nobody has yet. Every speculative layer costs reading and
      testing now.
  - id: card-composition
    concept: clean.composition-over-inheritance
    front: What is composition over inheritance?
    back: >-
      Holding another object in a field and calling it, instead of extending its class.

references:
  - kind: essay
    title: Yagni
    authors: Martin Fowler
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/Yagni.html
    note: The costs of building for imagined needs, counted one by one.
    primary: true
    verified: true
  - kind: docs
    title: Liskov substitution principle
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Liskov_substitution_principle
    note: The principle, with the rectangle and square example.
    verified: true
  - kind: docs
    title: Composition over inheritance
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Composition_over_inheritance
    note: The principle, its benefits and its costs.
    primary: true
    verified: true

deepDive: >-
  Single responsibility and Liskov substitution are two of the five **SOLID** heuristics.
  Open-closed says to add behaviour without editing what works. Interface segregation asks
  for small interfaces, not one for everything. Dependency inversion says to depend on an
  interface, not a concrete class.


  The rectangle and square is the textbook Liskov case. A `Square` whose `setWidth` also sets
  the height breaks code that stretches a `Rectangle` and expects the height to stay put.


  The cart bug is the fragile base class problem. It's why many style guides say to
  design a class for inheritance or forbid it. TypeScript and JavaScript can't seal a
  class, so composition is the practical guard.


  Dependency inversion is the principle behind ports and adapters, later in the
  Architecture module. It earns its keep at real boundaries, such as a database, a payment
  provider or a clock. Inside one module, an interface with a single implementation is
  usually noise.


  SOLID came from object-oriented design, but most of it carries over to functions and
  modules. "One reason to change" works as well for a file as for a class.
