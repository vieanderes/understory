    note: Custom formatters, extra fields and structured output with the standard library.
    primary: true
    verified: true

deepDive: >-
  All output here is real: `uv init --package` from uv 0.9.15, `ModuleNotFoundError: No module
  named 'notes_api'` from plain `python3`, mypy's `[no-untyped-def]` and `[type-arg]` codes,
  and ruff's `ANN201` and `ANN001`. The JSON lines came from a short `logging.Formatter`
  subclass whose `format` method returns `json.dumps` of the level, the message and the extra
  fields, read with `getattr(record, "request_id", None)`. Libraries such as structlog do the
  same with less code. An f-string such as `logger.info(f"Saved for {request_id}")` buries
  the id in the message, so its field stays `null` and no filter finds it.


  Teams also pick ruff rule sets in `pyproject.toml`, for example
  `select = ["E", "F", "I", "B", "UP", "ANN"]`: errors, imports, likely bugs, modern syntax
  and missing annotations. Look the letters up when you need them.


  Two more habits finish the picture. Settings arrive through one Pydantic settings object at
  start-up, so a missing variable fails at boot, not mid-request. Public functions carry a
  short docstring that says what they promise, and ruff's `D` rules can require it. A
  `pre-commit` hook runs the same ruff and mypy commands before each commit, so CI rarely has
  anything left to reject.
