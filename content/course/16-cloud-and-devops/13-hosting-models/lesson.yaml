id: cloud.hosting-models
title: Choosing where to host
objective: Choose between a VPS, a managed platform, functions and Kubernetes for a real project, and defend the choice on work, cost and control.
level: essential
minutes: 10
concepts: [cloud.vps, cloud.managed-platforms, cloud.kubernetes, cloud.golden-paths]
prerequisites: [cloud.reverse-proxies, cloud.ci-cd, cloud.backups]
opening:
  text: >-
    You'll choose where a project should run, and defend it in money, work and control.
    You've done the jobs by hand, so now you can judge who should do them.

steps:
  - type: prose
    id: jobs-you-did
    body: >-
      Look back at what this chapter had you do. You patched a server, renewed certificates,
      set up a proxy, deployed new versions, checked health and restored a backup.


      Every app needs those jobs done by someone. Choosing where to host is choosing which
      jobs stay yours, and which you pay a provider to do.

  - type: prose
    id: vps-and-managed
    body: >-
      Two ends of the range. A **VPS**, a virtual private server, is a rented virtual machine
      at a flat monthly price. The provider keeps it powered and online. Everything inside
      is yours.


      A **managed platform**, also called a PaaS, takes your code or image and does the
      rest. It builds, runs, balances, renews certificates and restarts crashes. You pay more
      per hour for it.

  - type: bug-hunt
    id: hunt-one-machine
    concept: cloud.vps
    difficulty: 1
    language: bash
    code: |
      # /etc/caddy/Caddyfile on our one server
      notes.example.com {
      	reverse_proxy localhost:3001 localhost:3002 localhost:3003
      }
    prompt: >-
      A small team runs everything on one VPS. The plan says "three copies, so a hardware
      fault can't take us down." Tap the line that breaks that promise.
    lines: [3]
    reasons:
      - text: All three copies run on the same machine
        correct: true
        feedback: >-
          Yes. When that server dies, the proxy and every copy go with it.
      - text: Caddy needs a port after the domain
        feedback: >-
          Caddy serves a named site on 443 with its own certificate. The site line is fine.
      - text: Three copies are too few for a failover
        feedback: >-
          Two would do, if they sat on different machines. The count isn't the problem here.
    fix: |
      # two VPSs behind the provider's load balancer
      # each runs its own copies, so one machine can die
      reverse_proxy 10.0.0.2:3000 10.0.0.3:3000

  - type: prose
    id: functions-and-kubernetes
    body: >-
      Two more options. **Serverless functions** run one handler per request and cost
      nothing while idle. Lesson 14 looks at them closely.


      **Kubernetes** is a program that keeps containers running across a group of servers,
      called a cluster. It gives the most control at scale. It's also the most to learn, and
      someone has to keep the cluster itself healthy.

  - type: multiple-choice
    id: pick-startup-model-api
    concept: cloud.managed-platforms
    difficulty: 2
    question: >-
      Five people build a summary API on a hosted language model. Traffic is small. Where
      should it run?
    choices:
      - text: A managed platform, calling the model's API
        correct: true
        feedback: >-
          Right. Their time goes into the product, and the model provider runs the GPUs.
      - text: A rented GPU server running their own model
        feedback: >-
          A GPU server bills every hour, busy or idle. At small traffic, paying per token is far cheaper.
      - text: A Kubernetes cluster, to be ready for scale
        feedback: >-
          Scale they don't have yet, paid for with work they can't spare. A platform scales far enough for now.
      - text: One VPS they patch themselves
        feedback: >-
          It can work, and it's cheap. But five people then own patching, certificates and recovery too.

  - type: code-challenge
    id: write-monthly-cost
    concept: cloud.managed-platforms
    difficulty: 3
    language: ts
    prompt: >-
      Write `monthlyCost(plan, requestsMillions)` so the team can compare two price shapes.


      A `'fixed'` plan buys whole servers, each handling `millionsPerServer`, never fewer
      than `minServers`, at `perServer` each. A `'usage'` plan costs its `base`, plus
      `perMillion` for each million past `includedMillions`. Throw on negative traffic.


      So two servers minimum at 10 each cost `20`, even with no traffic.
    hints:
      - Branch on `plan.kind` first. The two shapes share nothing.
      - Servers come whole, so round up. The minimum is a floor under that count.
      - "`Math.ceil(requestsMillions / plan.millionsPerServer)` is the servers the traffic needs."

  - type: ai-review
    id: review-small-team-kubernetes
    concept: cloud.kubernetes
    difficulty: 3
    language: js
    request: Write a helper that suggests a hosting model for a new project.
    flawClass: logic
    code: |
      function suggestHosting(app) {
        if (app.needsRootAccess) return 'vps';
        if (app.requestsPerMonth < 1000000) return 'managed platform';
        if (app.engineers < 3) return 'kubernetes';
        return 'managed platform';
      }
    prompt: >-
      The only test was a quiet hobby app, which got "managed platform". So it shipped. Then
      a busy side project run by one person got a surprising answer. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It gives the smallest teams the most operations work
        correct: true
        feedback: >-
          Yes. A cluster needs people to run it. The comparison points backwards.
      - text: One million requests is the wrong cut-off
        feedback: >-
          Any cut-off is a judgement call. One branch gives advice that's plainly the wrong way round.
      - text: A VPS should be the last check
        feedback: >-
          If an app truly needs root, a VPS is the model that offers it. That check is fair.
    fix: |
      // a big team can carry a cluster, a small one buys the platform
      if (app.engineers >= 30) return 'kubernetes';
      return 'managed platform';

  - type: prose
    id: name-golden-path
    body: >-
      Picture a product with 40 engineers and 30 services on Kubernetes. Most teams don't
      want to learn the cluster.


      So a platform team builds a **golden path**: a supported template that starts a new
      service with the build, deploy, logs and alerts already wired up. It's the default way,
      not the only way. A team may leave it, and then owns the extra work.

  - type: multiple-choice
    id: pick-leave-path
    concept: cloud.golden-paths
    difficulty: 2
    question: >-
      The golden path offers Postgres. One team truly needs a search engine it doesn't
      include. What should happen?
    choices:
      - text: They leave the path and own the extra work
        correct: true
        feedback: >-
          Right. The path is paved, not walled. Leaving it is allowed, and costs them.
      - text: They make Postgres do the job anyway
        feedback: >-
          Forcing a bad fit hurts the product. A golden path is the default, not a rule.
      - text: The platform team adds it for them first
        feedback: >-
          It might, later, if many teams need it. Waiting on another team blocks this one now.

  - type: explain-back
    id: explain-platform-first
    concept: cloud.managed-platforms
    difficulty: 4
    prompt: >-
      A two-person team wants Kubernetes for a new product, "to be ready for scale". Why is a
      managed platform likely the better first choice?
    rubric:
      - A managed platform does the deploys, TLS, balancing and restarts, which leaves two people free to build the product.
      - Kubernetes adds a cluster to learn, secure and run, which is ongoing work for a team that size.
      - The extra cost per hour is small next to engineer time, and they can move when scale or limits demand it.
    modelAnswer: >-
      Two people have one scarce thing, and it's their time. A managed platform takes the
      operations work away: deploys, certificates, balancing, restarts. They pay more per
      hour than on raw servers, but at their size that's small money. Kubernetes gives
      control they don't need yet, and a cluster they'd have to learn, secure and keep
      running. If they outgrow the platform's limits or prices, they can move then. A
      container that reads its config from the environment moves in days.

recap:
  - Choose a VPS for control and a flat price, knowing every operations job is yours.
  - Choose a managed platform to buy those jobs back, and call a model API rather than run GPUs early.
  - Choose Kubernetes when a team can carry a cluster, and offer others a golden path onto it.

recall:
  - id: card-vps
    concept: cloud.vps
    front: What do you get with a VPS, and what comes with it?
    back: >-
      A virtual machine with root at a flat price. Patching, deploys, certificates, backups
      and recovery are all your work.
  - id: card-managed-platform
    concept: cloud.managed-platforms
    front: What does a managed platform do for you, and what does it cost you?
    back: >-
      It builds, runs, balances and restarts your app. You pay more per hour or request, and
      accept its limits.
  - id: card-single-server
    concept: cloud.vps
    front: Why don't three app copies on one VPS give you redundancy?
    back: >-
      The server under them is still one machine. When it fails, the proxy and all three
      copies go together.
  - id: card-model-api
    concept: cloud.managed-platforms
    front: Why does a small team call a hosted model's API instead of renting a GPU server?
    back: >-
      A GPU server bills every hour, busy or idle. At small traffic, paying per token costs
      far less, and someone else runs the hardware.
  - id: card-golden-path
    concept: cloud.golden-paths
    front: What is a golden path, and may a team leave it?
    back: >-
      A supported template that starts a service with build, deploy, logs and alerts wired
      up. Yes, a team may leave it, and then owns the extra work.

