id: testing.doubles-and-integration
title: Test doubles and integration
objective: Stub and spy on what you don't own, control the clock, and test against a real database.
level: essential
minutes: 10
concepts: [testing.stubs-and-fakes, testing.mocks, testing.fake-at-the-boundary, testing.database-tests]
prerequisites: [testing.unit-tests, db.constraints]
opening:
  text: >-
    You'll test a checkout without charging a card or sending an email, and still know both
    would have happened. And you'll see when a stand-in hides the very bug you wanted to find.

steps:
  - type: prose
    id: stubs-fakes-and-spies
    body: |-
      `checkout(order, payments, mail)` gets its payment and mail services as arguments. So
      a test can pass in stand-ins, the way a film uses a stunt double. That's a **test
      double**.

      A **stub** gives a fixed answer: `charge` always says `{ ok: false }`. A **fake** is a
      small working version, like an array standing in for a table. A **spy** records its
      calls:

      ```js
      const sent = [];
      const mail = { send: async (to) => { sent.push(to); } };
      ```

  - type: predict-output
    id: predict-stub-and-spy
    concept: testing.mocks
    difficulty: 1
    language: js
    code: |
      test('a declined charge sends nothing', async () => {
        const payments = { charge: async () => ({ ok: false }) };
        const sent = [];
        const mail = { send: async (to) => { sent.push(to); } };
        await checkout(order, payments, mail);
        expect(sent).toEqual([]);
      });
    question: '`checkout` stops when a charge is declined. What does this test do?'
    choices:
      - text: Passes, with no card charged and no email sent
        correct: true
        feedback: >-
          Right. The stand-ins did the payment and mail parts, and the spy kept count.
      - text: Fails, since no real email was sent
        feedback: >-
          Not sending is the point. The spy's list is empty, which is what the test wants.
      - text: Fails, because `charge` never reached a bank
        feedback: >-
          The bank isn't in the room. The stub answers "declined" at once, as told.

  - type: prose
    id: fake-at-the-boundary
    body: >-
      What do you replace? Only what you don't own: the card provider, the mail service, the
      clock. Each sits behind an interface you do own, like `payments.charge`. That's
      **fake at the boundary**.


      The clock counts too. `new Date()` reads the computer's clock right now, and
      `getHours()` gives its hour. Take the time as an argument, and a test can choose it.

  - type: ai-review
    id: review-time-dependent-test
    concept: testing.fake-at-the-boundary
    difficulty: 2
    language: js
    request: 'Greet people on the dashboard: Good morning before noon, Good afternoon after. Add a test.'
    flawClass: edge-case
    code: |
      export function greeting() {
        const hour = new Date().getHours();
        return hour < 12 ? 'Good morning' : 'Good afternoon';
      }

      test('greets the user', () => {
        expect(greeting()).toBe('Good morning');
      });
    prompt: >-
      An assistant wrote this at 9 am, and the test passed. CI runs it at 2 pm. Tap the line
      at fault.
    lines: [2]
    reasons:
      - text: Reads the real clock, so tests can't pick an hour
        correct: true
        feedback: >-
          Yes. Pass the time in, and each test chooses its own hour.
      - text: Noon should still say Good morning
        feedback: >-
          The request says after noon is afternoon. The trouble is when the test runs.
      - text: '`toBe` can''t compare text'
        feedback: >-
          It can: two strings with the same letters are `toBe` each other. The clock is the problem.
    fix: |
      export function greeting(now) {
        return now.getHours() < 12 ? 'Good morning' : 'Good afternoon';
      }

      test('says good morning before noon', () => {
        expect(greeting(new Date('2026-09-25T09:00'))).toBe('Good morning');
      });

      test('says good afternoon from noon', () => {
        expect(greeting(new Date('2026-09-25T12:00'))).toBe('Good afternoon');
      });

  - type: ai-review
    id: review-stub-hides-rename
    concept: testing.stubs-and-fakes
    difficulty: 3
    language: js
    request: Add a test for the order summary line.
    flawClass: logic
    code: |
      export async function orderSummary(api, id) {
        const order = await api.getOrder(id);
        return `Order ${id}: £${(order.total / 100).toFixed(2)}`;
      }

      test('shows the order total', async () => {
        const api = { getOrder: async () => ({ id: 42, total: 1299 }) };
        expect(await orderSummary(api, 42)).toBe('Order 42: £12.99');
      });
    prompt: >-
      The orders API renamed `total` to `amount` last week. This test still passes, and the
      live page shows `£NaN`. Tap the line that hides the bug.
    lines: [7]
    reasons:
      - text: The stub still answers with the old `total`
        correct: true
        feedback: >-
          Yes. A stub is only as true as the day it was written.
      - text: '`toFixed(2)` rounds the pence wrongly'
        feedback: >-
          `12.99` comes out right. The live page has no `total` to divide at all.
      - text: The test should call the real API
        feedback: >-
          Then it would be slow and flaky. Keep the stub, but make it match the real reply.
    fix: |
      export async function orderSummary(api, id) {
        const order = await api.getOrder(id);
        return `Order ${id}: £${(order.amount / 100).toFixed(2)}`;
      }

      test('shows the order total', async () => {
        const api = { getOrder: async () => ({ id: 42, amount: 1299 }) };
        expect(await orderSummary(api, 42)).toBe('Order 42: £12.99');
      });

  - type: prose
    id: database-tests
    body: >-
      Your own database is not a boundary. Constraints, SQL and transactions live there, and
      a fake array happily stores the same email twice. So a **database test** runs against
      the same engine as production: a real PostgreSQL, started for the test run.


      Each test runs inside a transaction and ends with `ROLLBACK`. The next test starts on
      clean tables, and nothing is ever deleted by hand.

  - type: fill-blank
    id: fill-transaction-per-test
    concept: testing.database-tests
    difficulty: 3
    language: sql
    prompt: >-
      Run the duplicate-email test against the real table, and leave nothing behind for the
      next test. Fill the gaps.
    template: |
      {{1}};
      INSERT INTO users (email) VALUES ('sam@example.com');
      INSERT INTO users (email) VALUES ('sam@example.com');
      -- ERROR:  duplicate key value violates unique constraint "users_email_key"
      {{2}};
      SELECT count(*) FROM users;   -- {{3}}
    blanks:
      - key: '1'
        answer: BEGIN
      - key: '2'
        answer: ROLLBACK
      - key: '3'
        answer: '0'
    bank: [BEGIN, COMMIT, ROLLBACK, DELETE, '0', '1']

  - type: code-challenge
    id: write-checkout-tests
    concept: testing.mocks
    difficulty: 4
    language: ts
    editable: '14-23'
    prompt: >-
      Test `checkout` with doubles. The first test has its stub and spy ready: run checkout
      and check the result and what was sent. In the second, build your own, and record
      what was charged too.


      We'll run your tests against four broken copies of `checkout`. Each must fail one.
    hints:
      - A spy is an array plus a function that pushes into it. You can spy on `charge` too.
      - A stub that ignores its argument can't notice a wrong amount. Record it.
      - 'Check the list at the end: `expect(sent).toEqual([''sam@example.com''])`.'

  - type: explain-back
    id: explain-why-real-database
    concept: testing.fake-at-the-boundary
    difficulty: 4
    prompt: >-
      A teammate fakes the database in every test, so the suite runs in two seconds. Which
      bugs can that suite never find, and where should the fake line be drawn?
    rubric:
      - Anything the database enforces or computes, such as constraints, SQL and transactions, never runs against a fake.
      - Fakes belong at the boundary with systems you don't own, behind an interface you do.
      - Your own database is part of your system, so its rules are tested on the real engine, in rolled-back transactions.
    modelAnswer: >-
      The fake can't refuse a duplicate email, can't run a join, can't roll anything back.
      Every rule that lives in the schema passes untested, because the schema isn't there.
      Draw the line at what you don't own: the card provider, the mail service, the clock.
      Those get a stub or a spy behind your own interface. The database is yours, so its
      tests run against a real one, each inside a transaction that rolls back.

recap:
  - Stub what you don't own, spy on what must happen, and record what your code sent.
  - Pass the clock in, so a test chooses the time.
  - Test constraints and SQL against a real database, one rolled-back transaction per test.

recall:
  - id: card-stub-fake-spy
    concept: testing.stubs-and-fakes
    front: What tells a stub, a fake and a spy apart?
    back: >-
      A stub returns a canned answer. A fake is a small working version. A spy records its
      calls so a test can assert on them.
  - id: card-clock
    concept: testing.fake-at-the-boundary
    front: How do you test code that behaves differently before and after noon?
    back: >-
      Pass the time in as an argument instead of reading the clock inside. Each test then
      picks its own hour.
  - id: card-boundary
    concept: testing.fake-at-the-boundary
    front: Which parts of a system should a test replace with a double?
    back: >-
      Only the ones you don't own, such as a payment provider or mail service, behind an
      interface you do own.
  - id: card-rollback-per-test
    concept: testing.database-tests
    front: How does a database test leave the table clean without a delete?
    back: >-
      It runs inside `BEGIN` and ends with `ROLLBACK`, so every row it added disappears.

references:
  - kind: essay
    title: Mocks Aren't Stubs
    authors: Martin Fowler
    year: 2007
    venue: martinfowler.com
    url: https://martinfowler.com/articles/mocksArentStubs.html
    note: The vocabulary of doubles, and the difference between checking state and checking interactions.
    primary: true
    verified: true
  - kind: docs
    title: Vi
    authors: VoidZero Inc. and Vitest contributors
    venue: Vitest documentation
    url: https://vitest.dev/api/vi.html
    note: '`vi.fn`, `mock.calls`, and fake timers with `vi.useFakeTimers` and `vi.setSystemTime`.'
    primary: true
    verified: true
  - kind: docs
    title: Mocking
    authors: VoidZero Inc. and Vitest contributors
    venue: Vitest documentation
    url: https://vitest.dev/guide/mocking.html
    note: Spies on functions and modules, and when not to mock.
    verified: true

deepDive: >-
  Vitest builds spies for you: `vi.fn()` records every call in `mock.calls`, and
  `mockResolvedValue` makes it answer like an async stub. `vi.setSystemTime` fakes the clock
  when you can't pass it in. The hand-made versions in this lesson do the same jobs, and show
  there's no magic in them.


  A mock asserts on how code was called, which couples the test to the calls. A refactor
  that sends the same email through a different method breaks it. Prefer checking results,
  and spy only on effects you can't see any other way, like an email going out. Strictly, a
  mock is set up with expectations in advance; calling a spy you assert on a mock is the
  everyday simplification.


  A stub freezes the other side's API on the day you wrote it. Contract tests, at the end of
  this chapter, check the stub's shape against the real provider.


  Without the rollback, the second test sees the first test's row. Order-dependent tests
  are the usual result: they pass alone and fail together.
