deepDive: >-
  **Async in the browser.** The Python here runs on the page's own event loop, so the tests
  await your coroutine on it, and `asyncio.sleep` works as usual. `asyncio.run` can't start
  a second loop there, and threads can't start at all, so the challenge never needs either.
  Every sample was run with CPython 3.12. With 20 calls and a semaphore made inside the
  per-call function, the peak was 20 at once. Shared, it was 5.


  **TaskGroup.** Since Python 3.11, `async with asyncio.TaskGroup() as tg:` with
  `tg.create_task(...)` is the stricter sibling of `gather`. If one task fails, it cancels
  the rest and raises every error together. `gather` by default lets the others run on.


  **Semaphores and rate limits.** A semaphore caps calls in flight, not calls per minute.
  For a hard per-minute limit, add backoff on `429`, from the last lesson, or a token
  bucket.
