term: context engineering
aka:
  - context management
short: Deciding everything a model sees on each call, from instructions and tools to history and retrieved files.
explain: |
  A model knows only what's in front of it on this call. In a long agent run, that means the system prompt, the tools, every message and every tool
  result. All of it is resent each turn.

  The work is choosing what earns a place. Keep the task, the decisions and recent turns.
  Summarise old turns, load files only when a step needs them, and trim tool output. Let a helper
  read bulky material elsewhere and report back.

  More is not better. A bloated context costs more on every turn and makes the model notice
  less. Count the tokens before each call and act on the number.
analogy: Packing a rucksack for a long hike. Every item is weight carried for the whole trip.
usage: The prompt is fine; it's a context engineering problem, with the key fact buried under forty tool results.
twin:
  term: prompt
  difference: A prompt is what you send on one call. Context engineering is the ongoing choice of what goes into it, turn after turn, across a long run.
