id: interview.react-component-round
title: The component round in React
objective: Build the same widgets as React components with a clear interface, effects that clean up and focus that goes where people expect.
level: advanced
minutes: 10
concepts: [interview.component-api, interview.effect-cleanup, interview.focus-management]
prerequisites: [interview.component-round, react.effects]
opening:
  text: >-
    You'll build tabs, a rating and a dropdown menu as React components that an interviewer
    would happily merge. The catches here are the ones React rounds are really about.

steps:
  - type: prose
    id: what-you-need
    body: |-
      This lesson assumes you've written a few React components. The pieces it uses:

      - **Props** are a component's inputs; callbacks like `onChange` are its outputs.
      - `useState` keeps a value between renders and redraws when it changes.
      - `useEffect` runs code after a render, and the function it returns cleans up.
      - `useRef` holds a DOM node, so you can call `.focus()` on it.

  - type: prose
    id: what-is-scored
    body: |-
      A React component round hands you a widget to build in 45 minutes: tabs, a modal, a
      dropdown. The interviewer checks four things. Is state kept once, with the rest
      **derived** during render? Is it props in, callbacks out? Do effects clean up? Does
      focus go somewhere sensible?

      Say each choice aloud. Let an assistant type boilerplate, not the focus logic you'll
      have to explain.

  - type: playground
    id: fix-tabs-state
    concept: interview.component-api
    difficulty: 2
    prompt: >-
      Click Reviews: the tab changes but the panel doesn't. The panel text is stored twice.
      Delete the second `useState` and work the panel out from `active`.
    jsx: |
      import { useState } from "react";
      const TABS = [["Details", "Size M, cotton"], ["Reviews", "4 reviews"], ["Returns", "Free for 30 days"]];

      export default function Tabs() {
        const [active, setActive] = useState(0);
        const [panel, setPanel] = useState(TABS[0][1]);
        return (<div>
          <div role="tablist">{TABS.map(([label], i) => (
            <button key={label} role="tab" aria-selected={i === active}
              onClick={() => setActive(i)}>{label}</button>))}
          </div>
          <div role="tabpanel">{panel}</div>
        </div>);
      }
    checks:
      - label: The first panel shows at the start
        selector: '[role="tabpanel"]'
        text: Size M, cotton
      - label: Clicking Reviews selects that tab
        actions: [{ click: '[role="tab"]:nth-child(2)' }]
        selector: '[role="tab"][aria-selected="true"]'
        count: 1
        text: Reviews
      - label: Clicking Reviews shows its panel
        actions: [{ click: '[role="tab"]:nth-child(2)' }]
        selector: '[role="tabpanel"]'
        text: 4 reviews
    solution:
      jsx: |
        import { useState } from "react";
        const TABS = [["Details", "Size M, cotton"], ["Reviews", "4 reviews"], ["Returns", "Free for 30 days"]];

        export default function Tabs() {
          const [active, setActive] = useState(0);
          const panel = TABS[active][1];
          return (<div>
            <div role="tablist">{TABS.map(([label], i) => (
              <button key={label} role="tab" aria-selected={i === active}
                onClick={() => setActive(i)}>{label}</button>))}
            </div>
            <div role="tabpanel">{panel}</div>
          </div>);
        }
    hints:
      - The click only calls `setActive`. Nothing ever calls `setPanel`.
      - The panel text is always `TABS[active][1]`. It doesn't need its own state.
      - Replace the `useState` line for `panel` with `const panel = TABS[active][1];`.

  - type: playground
    id: control-the-rating
    concept: interview.component-api
    difficulty: 3
    prompt: >-
      Pick 3 stars: the sentence stays at 0, because `Stars` keeps its own copy. Make it
      **controlled**: the parent owns the value, so read `value` and call `onChange`.
    jsx: |
      import { useState } from "react";
      function Stars({ value, onChange }) {
        const [picked, setPicked] = useState(value);
        return (<fieldset><legend>Rating</legend>{[1, 2, 3, 4, 5].map((n) => (
          <label key={n}><input type="radio" name="stars" checked={picked === n}
            onChange={() => setPicked(n)} /> {n}</label>))}
        </fieldset>);
      }

      export default function Review() {
        const [stars, setStars] = useState(0);
        return (<div><Stars value={stars} onChange={setStars} />
          <p>You chose {stars} of 5</p></div>);
      }
    checks:
      - label: Picking 3 stars updates the sentence
        actions: [{ click: 'label:nth-of-type(3) input' }]
        selector: p
        text: You chose 3 of 5
      - label: Exactly one star is checked
        actions: [{ click: 'label:nth-of-type(3) input' }]
        selector: 'input:checked'
        count: 1
    solution:
      jsx: |
        import { useState } from "react";
        function Stars({ value, onChange }) {
          return (<fieldset><legend>Rating</legend>{[1, 2, 3, 4, 5].map((n) => (
            <label key={n}><input type="radio" name="stars" checked={value === n}
              onChange={() => onChange(n)} /> {n}</label>))}
          </fieldset>);
        }

        export default function Review() {
          const [stars, setStars] = useState(0);
          return (<div><Stars value={stars} onChange={setStars} />
            <p>You chose {stars} of 5</p></div>);
        }
    hints:
      - The parent never hears about the click. Which function tells it?
      - '`useState(value)` copies the prop once. Later changes to `value` never reach `picked`.'
      - Delete `picked`. Use `checked={value === n}` and `onChange={() => onChange(n)}`.

  - type: prose
    id: effects-clean-up
    body: |-
      Widgets often listen outside themselves: Escape on the whole page, a click outside a
      menu. That listener goes on `document` inside a `useEffect`.

      Whatever an effect adds, its **cleanup** function removes. React runs cleanup on
      unmount and before the effect runs again. In development, Strict Mode runs setup,
      cleanup, setup on purpose, so a missing cleanup shows up early.

  - type: ai-review
    id: review-missing-cleanup
    concept: interview.effect-cleanup
    difficulty: 3
    language: tsx
    request: Close the dialog when the user presses Escape anywhere on the page.
    flawClass: logic
    code: |
      function Dialog({ onClose, children }: DialogProps) {
        useEffect(() => {
          function onKey(event: KeyboardEvent) {
            if (event.key === 'Escape') onClose();
          }
          document.addEventListener('keydown', onKey);
        }, [onClose]);
        return <div role="dialog" aria-modal="true">{children}</div>;
      }
    prompt: >-
      An assistant wrote this. Its test opened the dialog once and pressed Escape, and it
      passed. In the app, one Escape calls `onClose` twice, and more after each open. Tap
      the line at fault.
    lines: [6]
    reasons:
      - text: The listener is added but never removed
        correct: true
        feedback: >-
          Yes. Every setup adds one more, and none go away. Return a cleanup.
      - text: '`onClose` shouldn''t be a dependency'
        feedback: >-
          Leaving it out gives a stale `onClose`. The listeners would still pile up.
      - text: Escape should be handled on the dialog div
        feedback: >-
          That works only while focus is inside. Page-wide is fine, if it's removed again.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Open, close and reopen, then expect one `onClose` per Escape
          correct: true
          feedback: >-
            Yes. The extra listeners only show after a second setup.
        - text: Open once and press Escape
          feedback: >-
            That's the test it already passed. One setup adds one listener, so one call.
        - text: Check the dialog renders its children
          feedback: >-
            Rendering is fine. The bug lives in listeners left on the document.
    fix: |
      document.addEventListener('keydown', onKey);
      return () => document.removeEventListener('keydown', onKey);

  - type: prose
    id: focus-in-and-back
    body: |-
      A popup also owns **focus**, the element that receives the keyboard. When a modal or
      menu opens, move focus into it. When it closes, send focus back to the button that
      opened it.

      Skip that, and a keyboard user is left at the top of the page. Interviewers test it by
      putting the mouse down and pressing Tab.

  - type: fill-blank
    id: fill-focus-return
    concept: interview.focus-management
    difficulty: 3
    prompt: >-
      The modal focuses Cancel when it opens, and gives focus back to its opener when it
      closes. Fill the gaps.
    language: tsx
    template: |
      function ConfirmDelete({ onClose }: { onClose: () => void }) {
        const cancelRef = useRef<HTMLButtonElement>(null);
        useEffect(() => {
          const opener = document.{{1}} as HTMLElement | null;
          cancelRef.current?.{{2}}();
          return () => opener?.focus();
        }, []);
        return (
          <div role="dialog" aria-modal="{{3}}" aria-labelledby="delete-title">
            <h2 id="delete-title">Delete this file?</h2>
            <button ref={cancelRef} onClick={onClose}>Cancel</button>
          </div>
        );
      }
    blanks:
      - key: '1'
        answer: activeElement
      - key: '2'
        answer: focus
      - key: '3'
        answer: 'true'
    bank: [activeElement, body, focus, blur, click, 'true', 'false']

  - type: code-challenge
    id: build-menu-button
    concept: interview.focus-management
    difficulty: 4
    language: tsx
    starter: menu.starter.tsx
    solution: menu.solution.tsx
    tests: menu.tests.tsx
    prompt: >-
      Turn the mouse-only dropdown into an accessible menu button. The button has
      `aria-haspopup="menu"` and `aria-expanded`. The list is a `menu` of `menuitem`s.


      Opening focuses the first item. ArrowDown and ArrowUp move focus and wrap round. Enter
      or a click calls `onSelect`, closes the menu and returns focus to the button. Escape
      closes without picking and returns focus too.
    hints:
      - Keep two pieces of state, `open` and the `active` index, and refs for the button and the items.
      - An effect that runs when `open` or `active` changes can call `focus()` on the active item. Items need `tabIndex={-1}` to take focus.
      - Handle keys in one `onKeyDown` on the list. Write one `close()` that hides the menu and focuses the button.

  - type: explain-back
    id: explain-derive
    concept: interview.component-api
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      The interviewer asks why your tabs keep only the active index, not the panel text as
      well. What do you say?
    rubric:
      - The panel text can be worked out from the index, so storing it makes a second copy.
      - Two copies need updating together, and the first forgotten update leaves them out of step.
      - Deriving during render keeps one source of truth, so the screen can't disagree with itself.
    modelAnswer: >-
      The panel is a function of the active index, so I compute it during render. If I
      stored it too, every place that changes the index would have to change the panel as
      well. Miss one and the tab and the panel disagree, which is exactly the starter's
      bug. One piece of state means the screen can't contradict itself.

recap:
  - Keep one piece of state and derive the rest during render.
  - Give widgets `value` and `onChange`, and clean up every listener an effect adds.
  - Move focus into a popup when it opens and back to its opener when it closes.
recall:
  - id: card-derive
    concept: interview.component-api
    front: A value can be worked out from state or props. Where does it live?
    back: >-
      Nowhere. Compute it during render, so there's no second copy to fall out of step.
  - id: card-controlled
    concept: interview.component-api
    front: What makes a React widget controlled?
    back: >-
      The parent owns the value and passes `value` and `onChange`. The widget keeps no copy
      of its own.
  - id: card-cleanup
    concept: interview.effect-cleanup
    front: An effect calls `document.addEventListener`. What must it return?
    back: >-
      A cleanup function that calls `removeEventListener` with the same handler, or the
      listeners pile up.
  - id: card-strict-mode
    concept: interview.effect-cleanup
    front: What does Strict Mode do to effects in development, and why?
    back: >-
      It runs setup, cleanup, setup for every effect, so a missing cleanup shows up at once.
  - id: card-menu-focus
    concept: interview.focus-management
    front: Where does focus go when a menu opens and when it closes?
    back: >-
      Into the first menu item on open. Back to the menu button on close, by Escape or by
      picking an item.

