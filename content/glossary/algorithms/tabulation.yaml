term: tabulation
aka: [bottom-up DP, bottom-up dynamic programming, dp table]
short: Filling a table of answers from the smallest case upwards, so each entry uses ones already filled in.
explain: |
  Memoisation starts at the big question and recurses down, saving answers on the way.
  This goes the other way. Start at the smallest case and fill a table forwards with a
  plain loop.

  No recursion means no stack depth limit and no function-call overhead. You must choose
  an order where every entry's inputs are already there.

  Often each row needs only the row before. Then you can keep two rows, or two variables,
  and drop the memory from O(n) to O(1).
analogy: Filling in a times-table grid row by row. Each square comes from ones you've already written.
example:
  language: python
  code: |
    def min_coins(coins, amount):
        best = [0] + [float("inf")] * amount   # best[a] = fewest coins for a
        for a in range(1, amount + 1):
            for c in coins:
                if c <= a:
                    best[a] = min(best[a], best[a - c] + 1)
        return best[amount] if best[amount] != float("inf") else -1
usage: The memoised version blows the stack at 10,000, so switch to tabulation and loop upwards.
twin:
  term: memoisation
  difference: Tabulation fills every answer from the smallest up with a loop. Memoisation starts at the big question, recurses, and saves only the answers it meets.
related: [dynamic-programming, memoisation, loop, space-complexity]
level: 3
lessons: [algo.dynamic-programming]
