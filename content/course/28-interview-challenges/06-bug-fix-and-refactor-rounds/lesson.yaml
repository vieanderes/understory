id: interview.bug-fix-round
title: Bug-fix and refactor rounds
objective: Read unfamiliar code before changing it, fix a bug in the fewest lines, and refactor in small steps that keep tests green.
level: essential
minutes: 10
concepts: [interview.reading-first, interview.minimal-fix]
prerequisites: [interview.online-assessments]
opening:
  text: >-
    You'll fix bugs in code you've never seen, changing as few lines as the task allows.
    It's a whole task type in online tests, and the first phase of many AI-enabled rounds.

steps:
  - type: prose
    id: the-format
    body: |-
      What you need: reading JavaScript, and running tests. In a **bug-fix task** you get
      working-looking code, a failing test and a rule: change at most two or three lines.
      More than that and you've rewritten it, not fixed it.

      AI-enabled rounds often open the same way, with a bug to find before the main
      feature. It's usually not an algorithm puzzle. It's a small slip in ordinary code.

  - type: multiple-choice
    id: pick-first-move
    concept: interview.reading-first
    difficulty: 1
    question: A bug-fix task opens with one failing test. What do you do first?
    choices:
      - text: Run the test and read the code it calls
        correct: true
        feedback: >-
          Yes. The failure and the code together point at the cause.
      - text: Rewrite the function the way you'd write it
        feedback: >-
          A rewrite breaks the line limit and risks new bugs. The task wants the one fault.
      - text: Paste it into the assistant and ask for a fix
        feedback: >-
          Reviewers watch for this. A small bug found by reading scores better than a prompt.

  - type: predict-output
    id: predict-coercion
    concept: interview.reading-first
    difficulty: 2
    language: js
    code: |
      const qty = '2';   // read from a form field
      console.log(qty + 1, qty * 3);
    question: What does this log?
    choices:
      - text: '`21 6`'
        correct: true
        feedback: >-
          Right. `+` joins strings, but `*` converts to numbers first.
      - text: '`3 6`'
        feedback: >-
          Most people pick this. With a string on either side, `+` joins instead of adding.
      - text: '`21 222`'
        feedback: >-
          Strings don't repeat with `*` in JavaScript. It converts `'2'` to 2 and multiplies.

  - type: bug-hunt
    id: hunt-mutation
    concept: interview.reading-first
    difficulty: 2
    language: js
    code: |
      function sortedByPrice(items) {
        return items.sort((a, b) => a.price - b.price);
      }
      const cart = [{ name: 'tea', price: 3 }, { name: 'jam', price: 2 }];
      const cheapFirst = sortedByPrice(cart);
      console.log(cart[0].name);   // the basket view expects 'tea'
    prompt: >-
      The basket now shows items in the wrong order, though nobody touched the basket code.
      Tap the line that causes it.
    lines: [2]
    reasons:
      - text: '`sort` reorders the caller''s array in place'
        correct: true
        feedback: >-
          Yes. The function changed its argument, so `cart` itself got sorted.
      - text: The comparator sorts from highest to lowest
        feedback: >-
          `a.price - b.price` sorts cheapest first, which is what the name promises.
      - text: '`sort` returns a new array'
        feedback: >-
          It returns the same array, now sorted. That's exactly why `cart` changed.
    fix: |
      return [...items].sort((a, b) => a.price - b.price);

  - type: prose
    id: cause-not-symptom
    body: |-
      Fix the **cause**, not the symptom. If a total is one too low, adding 1 at the end
      passes one test and breaks others.

      Four slips cause most of these bugs: an off-by-one bound, a wrong comparison, a
      string where a number was meant, and a function changing its argument. Check for
      those first.

  - type: multiple-choice
    id: pick-cause-fix
    concept: interview.minimal-fix
    difficulty: 3
    language: js
    code: |
      function sumLast(readings, n) {
        let total = 0;
        for (let i = readings.length - n; i < readings.length - 1; i++) {
          total += readings[i];
        }
        return total;
      }
      // sumLast([4, 5, 6], 2) returns 5, but 11 is expected
    question: Which one-line change fixes the cause?
    choices:
      - text: Loop while `i < readings.length`
        correct: true
        feedback: >-
          Yes. The loop stopped one early, so the last reading was never added.
      - text: Return `total + readings.at(-1)`
        feedback: >-
          It passes this test, but it patches the symptom. `sumLast(readings, 0)` would now return 6.
      - text: Start at `readings.length - n - 1`
        feedback: >-
          That shifts the window left and adds 4 and 5, giving 9. The end bound is what's wrong.

  - type: parsons
    id: order-refactor
    concept: interview.reading-first
    difficulty: 3
    prompt: >-
      A refactor task hands you 100 lines of nested `if`s and says keep the behaviour. Order
      your moves.
    language: text
    blocks:
      - id: run-tests
        code: Run the tests and see them pass
        subgoal: Pin the behaviour
      - id: add-test
        code: Add a test for any path nothing covers
      - id: guard
        code: Turn one nested check into an early return
        subgoal: Change in small steps
      - id: run-again
        code: Run the tests again
      - id: extract
        code: Pull one block into a named helper, then run the tests
      - id: rename
        code: Rename unclear variables, then run the tests
    distractors:
      - id: rewrite-all
        code: Rewrite the whole function, then run the tests once
        feedback: >-
          One big change that fails tells you nothing about which part broke.
      - id: delete-tests
        code: Delete the tests that fail after a change
        feedback: >-
          A test that fails after a refactor has caught a change in behaviour. Listen to it.

  - type: ai-review
    id: review-refactor-guard
    concept: interview.reading-first
    difficulty: 3
    language: js
    request: Flatten the nested ifs in submit without changing what it does.
    flawClass: logic
    code: |
      // before
      function submit(order, user) {
        if (order.items.length > 0) {
          if (user.verified) charge(order);
          audit(order, user);
        }
      }
      // after, from the assistant
      function submit(order, user) {
        if (order.items.length === 0) return;
        if (!user.verified) return;
        charge(order);
        audit(order, user);
      }
    prompt: >-
      The refactor reads better, and the tests pass: they only use verified users. Tap the
      line that changed the behaviour.
    lines: [11]
    reasons:
      - text: Unverified orders now skip the audit
        correct: true
        feedback: >-
          Yes. Before, every order with items was audited. Guard only the `charge`.
      - text: The empty check should use `<= 0`
        feedback: >-
          A length is never negative, so `=== 0` matches the old `> 0` exactly.
      - text: '`audit` must run before `charge`'
        feedback: >-
          The old code charged first too. The order is unchanged; one path is lost.
    fix: |
      function submit(order, user) {
        if (order.items.length === 0) return;
        if (user.verified) charge(order);
        audit(order, user);
      }

  - type: code-challenge
    id: fix-free-rooms
    concept: interview.minimal-fix
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: rooms.starter.py
      solution: rooms.solution.py
      tests: rooms.tests.py
    prompt: >-
      `freeRooms(rooms, bookings, start, end)` should return the rooms free for every night
      from `start` up to `end`, in alphabetical order. A booking's `end` is its checkout
      day, so it isn't a night.


      Some tests fail. Find the cause and fix it. **You may change at most 3 lines.**


      So a guest checking out on day 3 doesn't block a stay from day 3 to day 5.
    hints:
      - Run the tests and read the failing names first. They say which case is wrong.
      - 'Two stays that touch on a checkout day share no night. Check the overlap comparison.'
      - One failure is about the list you were given. Look for a call that changes its argument.

  - type: explain-back
    id: explain-cause-fix
    concept: interview.minimal-fix
    difficulty: 4
    prompt: >-
      Back-to-back bookings clashed. Why is fixing the overlap comparison better than
      skipping bookings whose `end` equals the stay's `start`?
    rubric:
      - The cause is the comparison treating a shared checkout day as a shared night.
      - A skip rule patches one symptom and misses the other side, a guest arriving on checkout day.
      - Fixing the comparison corrects every case in one line and keeps within the line limit.
    modelAnswer: >-
      The overlap test used `<=` and `>=`, so touching on a checkout day counted as a clash.
      A skip rule for `end === start` handles a guest leaving that day. It misses one
      arriving on the checkout day, and it adds lines. Changing both to strict comparisons fixes the
      cause, so every touching case is right in one line.

recap:
  - Run the failing test and read the code before editing.
  - Check the usual slips first, and fix the cause in few lines.
  - Refactor in small steps, running the tests after each.
recall:
  - id: card-first-move
    concept: interview.reading-first
    front: What are your first two moves in a bug-fix task?
    back: >-
      Run the failing test, then read the code it calls, following the data until you find
      where it goes wrong.
  - id: card-four-slips
    concept: interview.reading-first
    front: Which four slips cause most bugs in bug-fix tasks?
    back: >-
      An off-by-one bound, a wrong comparison, type coercion, and a function that changes its
      argument.
  - id: card-symptom
    concept: interview.minimal-fix
    front: What's the sign that a fix patches a symptom?
    back: >-
      It adjusts the output for the failing case instead of changing the line that produced
      it, so another case still breaks.
  - id: card-refactor-steps
    concept: interview.reading-first
    front: How do you refactor messy code safely under time?
    back: >-
      Get tests passing first, then make one small change at a time and run the tests after
      each.

references:
  - kind: essay
    title: "Meta's AI-Enabled Coding Interview: How to Prepare"
    authors: Hello Interview
    url: https://www.hellointerview.com/blog/meta-ai-enabled-coding
    note: The bug-fix phase, the kinds of bug it uses, and why reading first scored better.
    primary: true
    verified: true
  - kind: book
    title: 'Refactoring: Improving the Design of Existing Code'
    authors: Martin Fowler
    year: 2018
    venue: Addison-Wesley, 2nd edition
    url: https://martinfowler.com/books/refactoring.html
    note: Small behaviour-preserving steps with the tests run after each one.
    verified: true

deepDive: >-
  Online assessment task libraries include bug-fixing tasks with a cap on changed lines. One
  public example report allows two, and scores zero when no line changes. The cap exists to test
  reading, so a clean rewrite isn't an option.


  Meta's AI-enabled round, reported since late 2025, opens with a bug in a multi-file
  project. The reported bugs are type casts, off-by-one loops, wrong conditions and wrong
  boundaries. Some interviewers ban the assistant for this phase. Candidates who read the
  code first and fixed it by hand gave stronger early signals.


  Shopify interviewers reportedly watch whether you fix a one-character bug by hand rather
  than prompting again. The rule across all of them: when the fix is small, type it.


  Two JavaScript slips come up again and again. `sort`, `reverse` and `splice` change the
  array they're called on; `toSorted`, `toReversed` and `toSpliced` return a copy. And
  values from forms, query strings and JSON keys are strings until you convert them.
