id: atlas.memory-and-cleanup
title: Who cleans up
objective: Say who frees memory in Swift, Rust and JavaScript, and close connections and files on a line you choose.
level: essential
minutes: 10
concepts: [atlas.memory-models, atlas.resource-cleanup]
prerequisites: [atlas.language-landscape, cs.memory-and-runtimes, js.errors, db.storage-and-pooling]
opening:
  text: >-
    You'll know who frees memory in Swift, Rust and JavaScript, and what none of them frees for
    you. That second part is behind a classic outage: a server that runs out of connections.

steps:
  - type: prose
    id: name-reference-counting
    body: >-
      The last big question: who frees memory? In JavaScript, a **garbage collector** runs now
      and then and frees what nothing can reach. You met it in the memory and runtimes lesson.


      Swift, and mostly Python, use **reference counting** instead. Each object counts the
      names that point at it. The moment the count hits zero, it's freed.

  - type: predict-output
    id: predict-arc-free
    concept: atlas.memory-models
    difficulty: 2
    language: text
    code: |
      // Swift. deinit runs when the object is freed
      class Order {
        deinit { print("order freed") }
      }
      var a: Order? = Order()
      var b = a            // a second name for the same order
      a = nil
      print("a dropped")
      b = nil
      print("b dropped")
    question: When does "order freed" print?
    choices:
      - text: Right after "a dropped"
        feedback: >-
          `b` still points at the order. One name is enough to keep it.
      - text: Between `b = nil` and "b dropped"
        correct: true
        feedback: >-
          Right. The last name went, and the order went with it.
      - text: When the program exits
        feedback: >-
          That's closer to a garbage collector. Swift counts names and frees at zero.

  - type: prose
    id: name-ownership
    body: >-
      Rust does neither. Every value has exactly one **owner**, one name responsible for it.
      Assign it to another name and ownership **moves**: the old name can't be used any more.


      The compiler checks every use before the program runs. When the owner's block ends, the
      value is freed, on a line you can point at.

  - type: predict-output
    id: predict-rust-move
    concept: atlas.memory-models
    difficulty: 3
    language: text
    code: |
      // Rust. String::from makes text that owns its memory
      fn main() {
          let order = String::from("order 7");
          let moved = order;          // ownership moves to `moved`
          println!("{}", moved);
          println!("{}", order);
      }
    question: The last line prints `order` after it moved. What does Rust do?
    choices:
      - text: Prints "order 7" twice
        feedback: >-
          In most languages, yes. In Rust, `order` handed its value over on line 4.
      - text: Refuses to compile
        correct: true
        feedback: >-
          Right. "Borrow of moved value", before anything ran.
      - text: Prints once, then crashes
        feedback: >-
          A crash happens while running. Rust settles ownership at compile time, so it never runs.

  - type: prose
    id: name-resource-cleanup
    body: >-
      Now the catch. Memory isn't the only thing a program holds. Open files, network
      sockets and database connections are limited, and no collector hands them back on time.


      So you close them yourself, on a known line. In JavaScript that's `finally`, from the
      errors lesson. In Python it's a `with` block, from the files lesson.

  - type: ai-review
    id: review-release-on-collection
    concept: atlas.resource-cleanup
    difficulty: 3
    language: js
    request: Count a user's unread messages, using a client from the database pool.
    flawClass: logic
    code: |
      export async function unreadCount(pool, userId) {
        const client = await pool.connect();
        // client goes out of scope below, so it gets cleaned up
        const { rows } = await client.query(
          'SELECT count(*) FROM messages WHERE user_id = $1 AND read = false',
          [userId],
        );
        return Number(rows[0].count);
      }
    prompt: >-
      An assistant wrote this. Each test passed. In production, after ten requests, every new
      request hangs. The pool holds ten clients. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Nothing gives the client back to the pool
        correct: true
        feedback: >-
          Yes. That's Swift or Rust thinking. JavaScript frees memory, not pool clients. Release it.
      - text: '`count(*)` should be `count(id)`'
        feedback: >-
          Both count the rows. The query is fine; the client it borrowed never goes back.
      - text: '`Number()` should be `parseInt()`'
        feedback: >-
          Either turns the count into a number. The hang comes from the pool, not the result.
    fix: |
      export async function unreadCount(pool, userId) {
        const client = await pool.connect();
        try {
          const { rows } = await client.query(SQL, [userId]);
          return Number(rows[0].count);
        } finally {
          client.release();          // back to the pool, even if the query throws
        }
      }

  - type: fill-blank
    id: fill-with-block
    concept: atlas.resource-cleanup
    difficulty: 2
    language: python
    prompt: >-
      The same idea in Python. Close the file when the block ends, even if reading fails.
    template: |
      def count_lines(path):
          {{1}} open(path) {{2}} file:
              return len(file.readlines())
    blanks:
      - key: '1'
        answer: with
      - key: '2'
        answer: as
    bank: [with, as, try, finally, del]

  - type: code-challenge
    id: write-with-client
    concept: atlas.resource-cleanup
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '4-6'
    prompt: >-
      Write the helper that makes the leak impossible. `withClient(pool, work)` borrows a
      client, runs `work(client)`, and returns its result.


      The client goes back with `client.release()` every time, even when `work` throws. The
      error should still reach the caller.
    hints:
      - The release has to run on both paths, success and error.
      - '`finally` runs after `try`, whether or not it threw, and the error carries on up.'
      - 'Wrap it: `try { return await work(client); } finally { ... }`'

  - type: explain-back
    id: explain-who-frees
    concept: atlas.memory-models
    difficulty: 3
    prompt: >-
      Swift frees an object the moment its last name goes. Why can't a JavaScript developer
      count on that to close a database connection?
    rubric:
      - Swift counts references, so it frees at a known moment, the instant the count hits zero.
      - JavaScript's garbage collector runs when it chooses, and frees memory, not connections.
      - So connections, files and sockets are closed on a known line, with `finally` or a helper.
    modelAnswer: >-
      Swift keeps a count for every object and frees it the instant nothing points at it. So a
      Swift object can close its connection as it goes, at a moment you can predict.
      JavaScript has no counts. Its collector runs when it likes, maybe much later, and it only
      reclaims memory. A connection left open stays taken until then, or for ever. So I'd
      release it myself, in a `finally`, or through a helper that always does.

recap:
  - Say who frees memory, from Swift's counts to JavaScript's collector to Rust's owners.
  - Expect Rust to refuse a use after a move, before anything runs.
  - Close connections and files on a known line, with `finally` or `with`.

recall:
  - id: card-refcount-vs-gc
    concept: atlas.memory-models
    front: When is an object freed under reference counting, and under a garbage collector?
    back: >-
      Reference counting frees it the instant the last reference goes. A collector frees it
      at some later run, with no promise of when.
  - id: card-ownership
    concept: atlas.memory-models
    front: How does Rust free memory without a collector or counts?
    back: >-
      Each value has one owner, and it's freed where the owner's block ends. The compiler
      refuses any use after a move.
  - id: card-close-yourself
    concept: atlas.resource-cleanup
    front: Why must a JavaScript program release a pool client itself?
    back: >-
      The collector frees memory when it chooses, and never returns connections. Release in a
      `finally` so the error path does it too.

references:
  - kind: docs
    title: Automatic Reference Counting
    authors: Apple
    venue: The Swift Programming Language
    url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/automaticreferencecounting/
    note: How Swift counts references, and when an instance is deallocated.
    primary: true
    verified: true
  - kind: docs
    title: What is Ownership?
    authors: Steve Klabnik and Carol Nichols
    venue: The Rust Programming Language
    url: https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html
    note: Ownership, moves, and why a use after a move fails to compile.
    primary: true
    verified: true
  - kind: docs
    title: pg.Pool
    authors: Brian Carlson
    venue: node-postgres documentation
    url: https://node-postgres.com/apis/pool
    note: Ten clients by default, no timeout by default, and why every client must be released.
    verified: true

deepDive: >-
  What ran. The Swift counter ran with Swift 6.2 and printed "order freed" between the two
  drop lines. The Rust move rests on the Rust book: the compiler reports error E0382,
  "borrow of moved value". The pool leak rests on node-postgres, whose pool holds ten
  clients by default and, with no timeout set, waits for ever for a free one.


  Python is mostly reference counting. `sys.getrefcount` on a fresh list shows its count
  go up when a second name points at it. Mostly, because two objects that point at each
  other never reach zero, so CPython also runs a collector for those cycles. Swift can't
  break such a cycle by itself: you mark one side `weak`.


  Rust also lets you borrow a value without taking ownership, with `&`. The compiler
  checks that no borrow outlives its owner. That check is why Rust needs no collector, and
  also why its compiler is famously strict.


  JavaScript does have `FinalizationRegistry`, a callback after an object is collected. Its
  own documentation says to avoid it where possible: it may run late, or never.
