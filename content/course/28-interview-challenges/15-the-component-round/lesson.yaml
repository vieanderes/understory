id: interview.component-round
title: The component round
objective: Build tabs, a dialog, a star rating and a dropdown in plain HTML, CSS and JavaScript that work with a mouse, a keyboard and a screen reader.
level: advanced
minutes: 10
concepts: [interview.native-elements, interview.aria-state, interview.roving-focus]
prerequisites: [interview.frontend-round, design.keyboard-and-focus]
opening:
  text: >-
    You'll build the small widgets a frontend round asks for, with no framework. Each one
    works by mouse, keyboard and screen reader, which is where the marks are.

steps:
  - type: prose
    id: what-you-need
    body: |-
      You need a little DOM, and here it all is.

      - `document.querySelector(css)` finds an element. `addEventListener("click", fn)` runs `fn` on a click.
      - `element.hidden = true` hides it from everyone, screen readers included.
      - A **role** tells a screen reader what a custom element is: `role="tab"`.
      - An **aria attribute** says its state: `aria-selected="true"`.
      - A **tab stop** is a place the Tab key lands. `tabindex="0"` makes one, and `tabindex="-1"` removes it.

  - type: prose
    id: what-is-scored
    body: |-
      The round sounds like "build a tab component, no libraries". You get 45 to 60
      minutes, a blank page and an interviewer watching.

      They score four things: mouse, keyboard, what a screen reader hears, and state kept
      in one place. Say your order, then test each one aloud.

      Assistant allowed? Use it for boilerplate, and check its ARIA yourself. That's where
      it slips.

  - type: prose
    id: tabs-roles
    body: |-
      Tabs have three roles. A `tablist` holds the `tab` buttons. Each `tab` points at its
      `tabpanel` with `aria-controls`.

      ```html
      <div role="tablist" aria-label="Plan details">
        <button role="tab" aria-selected="true" aria-controls="panel-0">Features</button>
        <button role="tab" aria-selected="false" aria-controls="panel-1">Pricing</button>
      </div>
      <div role="tabpanel" id="panel-0">Unlimited projects</div>
      <div role="tabpanel" id="panel-1" hidden>Nine pounds a month</div>
      ```

      One rule holds it together. The selected tab, `aria-selected` and the visible panel
      always change together, in one function.

  - type: playground
    id: sync-selected-tab
    concept: interview.aria-state
    difficulty: 2
    prompt: >-
      Write `select(index)`. It marks tab `index` selected and the others not. It makes
      only that tab a tab stop and shows only its panel. The last line clicks Pricing.
    html: |
      <div role="tablist" aria-label="Plan details">
        <button role="tab" id="tab-0" aria-controls="panel-0">Features</button>
        <button role="tab" id="tab-1" aria-controls="panel-1">Pricing</button>
        <button role="tab" id="tab-2" aria-controls="panel-2">Support</button>
      </div>
      <div role="tabpanel" id="panel-0" aria-labelledby="tab-0">Unlimited projects</div>
      <div role="tabpanel" id="panel-1" aria-labelledby="tab-1">Nine pounds a month</div>
      <div role="tabpanel" id="panel-2" aria-labelledby="tab-2">Email within a day</div>
    js: |
      const tabs = document.querySelectorAll('[role="tab"]');
      const panels = document.querySelectorAll('[role="tabpanel"]');

      function select(index) {
        // Sync aria-selected, tabIndex and hidden for every tab and panel.
      }

      tabs.forEach((tab, i) => tab.addEventListener("click", () => select(i)));
      select(0);
      // A test click on Pricing, like a visitor's.
      tabs[1].click();
    editable: [js]
    showTree: true
    checks:
      - label: Pricing is the selected tab
        selector: '#tab-1'
        attribute: { name: aria-selected, value: 'true' }
      - label: The other two tabs say false
        selector: '[role="tab"][aria-selected="false"]'
        count: 2
      - label: Only Pricing is a tab stop
        selector: '[role="tab"][tabindex="0"]'
        count: 1
        text: Pricing
      - label: Only the Pricing panel shows
        selector: '[role="tabpanel"]:not([hidden])'
        count: 1
        text: Nine pounds a month
    solution:
      js: |
        const tabs = document.querySelectorAll('[role="tab"]');
        const panels = document.querySelectorAll('[role="tabpanel"]');

        function select(index) {
          tabs.forEach((tab, i) => {
            tab.setAttribute("aria-selected", String(i === index));
            tab.tabIndex = i === index ? 0 : -1;
            panels[i].hidden = i !== index;
          });
        }

        tabs.forEach((tab, i) => tab.addEventListener("click", () => select(i)));
        select(0);
        tabs[1].click();
    hints:
      - Loop over `tabs` with `forEach((tab, i) => ...)`, and compare `i` with `index`.
      - '`setAttribute("aria-selected", String(i === index))` writes `"true"` or `"false"`.'
      - Set `tab.tabIndex` to 0 or -1, and `panels[i].hidden` to `i !== index`.

  - type: prose
    id: native-first
    body: |-
      Before you write any ARIA, ask whether an element already does the job. It usually
      beats a div.

      A `<dialog>` opened with `showModal()` closes on Escape. The page behind goes
      **inert**: no clicks, no Tab. And `close()` returns focus to the opener. Radios with
      one `name` in a `<fieldset>` bring arrow keys and "2 of 5" for free. Hide their
      circles with a visually-hidden class, never `display: none`.

  - type: ai-review
    id: review-dialog-show
    concept: interview.native-elements
    difficulty: 3
    language: js
    request: Ask before deleting a file. Use the native dialog element.
    flawClass: edge-case
    code: |
      const dialog = document.querySelector("#confirm-delete");
      const openButton = document.querySelector("#delete");

      openButton.addEventListener("click", () => {
        dialog.show();
      });

      dialog.querySelector("#cancel").addEventListener("click", () => {
        dialog.close();
      });
    prompt: >-
      An assistant wrote this. Clicking Delete opens the box and Cancel closes it, so the
      demo looked fine. Then the interviewer pressed Escape and Tab. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`show()` opens it as non-modal'
        correct: true
        feedback: >-
          Yes. Escape does nothing and Tab walks behind it. `showModal()` fixes both.
      - text: Cancel should hide it with `hidden`
        feedback: >-
          `close()` is right. It also fires the `close` event and restores focus.
      - text: The dialog needs `role="dialog"` added
        feedback: >-
          A `<dialog>` already has that role. Adding it again changes nothing.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Open it, press Escape, and expect it closed
          correct: true
          feedback: >-
            Yes. A non-modal dialog ignores Escape, so this fails at once.
        - text: Click Delete, then click Cancel
          feedback: >-
            That's the demo that already worked. Clicks never touch the modal behaviour.
        - text: Check the dialog has the dialog role
          feedback: >-
            A `<dialog>` has that role whether it opens as modal or not.
    fix: |
      dialog.showModal();

  - type: playground
    id: build-star-rating
    concept: interview.native-elements
    difficulty: 3
    prompt: >-
      The keyboard can't reach these spans. Rebuild the rating as a fieldset with the legend
      "Rate your stay". Inside, put five labelled radios named `rating`, each with the class
      `visually-hidden`.
    html: |
      <p>Rate your stay</p>
      <div class="stars">
        <span>1 star</span>
        <span>2 stars</span>
        <span>3 stars</span>
        <span>4 stars</span>
        <span>5 stars</span>
      </div>
    css: |
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      label { cursor: pointer; margin-right: 8px; }
      input:checked + label { font-weight: bold; }
      input:focus-visible + label { outline: 2px solid; }
    editable: [html]
    checks:
      - label: The legend asks the question
        selector: fieldset legend
        text: Rate your stay
      - label: Five radios share the name rating
        selector: 'fieldset input[type="radio"][name="rating"]'
        count: 5
      - label: Each radio has its own label
        selector: 'fieldset label[for]'
        count: 5
      - label: The radios are hidden, not removed
        selector: 'input[type="radio"].visually-hidden'
        count: 5
        style: { property: position, value: absolute }
    solution:
      html: |
        <fieldset>
          <legend>Rate your stay</legend>
          <input type="radio" id="r1" name="rating" value="1" class="visually-hidden">
          <label for="r1">1 star</label>
          <input type="radio" id="r2" name="rating" value="2" class="visually-hidden">
          <label for="r2">2 stars</label>
          <input type="radio" id="r3" name="rating" value="3" class="visually-hidden">
          <label for="r3">3 stars</label>
          <input type="radio" id="r4" name="rating" value="4" class="visually-hidden">
          <label for="r4">4 stars</label>
          <input type="radio" id="r5" name="rating" value="5" class="visually-hidden">
          <label for="r5">5 stars</label>
        </fieldset>
    hints:
      - Swap the `div` for a `fieldset`, and the `p` for a `legend` inside it.
      - Each star becomes an `input` with `type="radio"` and `name="rating"`, followed by its `label`.
      - 'Give each input an `id`, point its label at it with `for`, and add `class="visually-hidden"`.'

  - type: prose
    id: roving-tabindex
    body: |-
      The whole tab list is **one tab stop**. Tab jumps from the list to the panel, not
      through every tab.

      Inside, the arrow keys move. Right goes to the next tab and wraps at the end. Left
      goes back, and Home and End jump. Each move selects a tab, gives it `tabindex="0"`
      and focuses it. The rest get `-1`. That's a **roving tabindex**.

  - type: code-challenge
    id: write-mount-tabs
    concept: interview.roving-focus
    difficulty: 4
    language: tsx
    starter: tabs.starter.tsx
    solution: tabs.solution.tsx
    tests: tabs.tests.tsx
    prompt: >-
      This is plain DOM code, no React. `mountTabs(root)` wires up the tab list inside
      `root`. Clicks already select a tab and show its panel.


      Add the keyboard. Only the selected tab has `tabindex="0"`, the rest `-1`.
      ArrowRight and ArrowLeft move to the next or previous tab and wrap round. Home and
      End jump to the first and last. Every move selects the tab and moves focus to it.


      The tests click and type the way a person would, then check the attributes and
      focus.
    hints:
      - Look at `select`. It already owns `aria-selected` and `hidden`, so it should own `tabIndex` too.
      - Listen for `keydown` on each tab. `event.key` is `"ArrowRight"`, `"Home"` and so on.
      - 'Work out the next index, then call `select(next)` and `tabs[next].focus()`. Wrap with `i === last ? 0 : i + 1`.'

  - type: explain-back
    id: explain-native-first
    concept: interview.native-elements
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      The interviewer asks why you used radios and a `<dialog>` rather than divs with
      ARIA. What do you say?
    rubric:
      - Native elements already have the right role and state for screen readers.
      - They bring keyboard support for free, such as arrows in radios and Escape in a modal.
      - Less hand-written code means fewer places for the ARIA and the screen to drift apart.
    modelAnswer: >-
      Native elements come with the behaviour I'd otherwise write and test by hand. Radios
      give arrow keys, one tab stop and the right announcement. A modal `<dialog>` gives
      Escape, an inert page behind and focus returned on close. ARIA only describes
      behaviour, it doesn't add any. So I reach for a div with a role only when no element
      fits, like tabs.

recap:
  - Keep a widget's roles and aria states in step with what the screen shows.
  - Reach for native elements first, like radios and a modal `<dialog>`.
  - Make a tab list one tab stop that the arrow keys move through.
recall:
  - id: card-tab-roles
    concept: interview.aria-state
    front: Which roles and attributes make up an accessible tab list?
    back: >-
      `tablist` around `tab` buttons, each with `aria-selected` and `aria-controls` naming
      its `tabpanel`. Unselected panels are `hidden`.
  - id: card-show-modal
    concept: interview.native-elements
    front: What does `showModal()` give you that `show()` doesn't?
    back: >-
      Escape closes it, the page behind is inert, and focus returns to the opener on close.
  - id: card-rating-radios
    concept: interview.native-elements
    front: How do you build an accessible star rating?
    back: >-
      Five radios with one `name` in a `fieldset` with a `legend`, visually hidden but never
      `display: none`, each with a label.
  - id: card-roving
    concept: interview.roving-focus
    front: What is a roving tabindex?
    back: >-
      Only the active item in a widget has `tabindex="0"`. The arrow keys move that and
      focus together, so the widget is one tab stop.

references:
  - kind: spec
    title: Tabs Pattern
    authors: W3C Web Accessibility Initiative
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/patterns/tabs/
    note: The roles, states and keyboard for a tab list, including roving focus.
    primary: true
    verified: true
  - kind: docs
    title: 'The dialog element'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/dialog
    note: '`show()` against `showModal()`, the inert page behind a modal, and closing with Escape.'
    primary: true
    verified: true
  - kind: spec
    title: Disclosure (Show/Hide) Pattern
    authors: W3C Web Accessibility Initiative
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/
    note: A button with `aria-expanded` that shows and hides content, used for navigation dropdowns.
    verified: true
  - kind: spec
    title: Radio Group Pattern
    authors: W3C Web Accessibility Initiative
    venue: ARIA Authoring Practices Guide
    url: https://www.w3.org/WAI/ARIA/apg/patterns/radio/
    note: The keyboard native radios already provide, and why a group is one tab stop.
    verified: true

deepDive: |-
  **What we checked.** In Chromium, a `<dialog>` opened with `show()` ignored Escape, and
  Tab walked to the buttons behind it. Opened with `showModal()`, Escape closed it, the page
  behind could not be clicked or tabbed to, and `close()` returned focus to the opener.

  **Automatic or manual tabs.** The challenge selects a tab as soon as focus arrives,
  called automatic activation. When a panel is slow to load, the pattern allows manual
  activation instead: arrows move focus only, and Enter or Space selects. Say which you
  chose and why.

  **Where interviewers push next.** A tab list whose tabs arrive from data. A dialog that
  puts focus on its first field, or on Cancel for a destructive action. A dropdown that
  closes on a click outside, with one listener on `document` removed on close. And "how
  would you test it", which the challenge's tests answer: query by role and name, press
  keys, check focus and attributes.

  **The dropdown.** A dropdown of links is a disclosure: a button with `aria-expanded`
  (`"true"` or `"false"`) and `aria-controls` naming the list, which is `hidden` when
  closed. Escape closes it and puts focus back on the button. The classic slip is toggling
  `hidden` and forgetting `aria-expanded`, so a screen reader still says "collapsed". Keep
  both in one function, as with the tabs.

  **Not `role="menu"`.** The menu role promises app-style keys: arrows between items and
  typing a letter to jump. A site's account links are a disclosure, and screen reader users
  expect Tab to move through them.
