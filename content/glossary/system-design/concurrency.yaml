term: concurrency
aka: [concurrent]
short: Several tasks in progress over the same period, taking turns while each one waits.
explain: |
  A web server waits a lot: for the database, for a file, for another API. While one
  request waits, it can work on another. Many requests are in progress, even with only one
  thread doing the work.

  That's how JavaScript's event loop handles thousands of connections. It helps waiting
  work, called **I/O-bound**. It doesn't speed up heavy maths, called **CPU-bound**, because
  only one task actually runs at any instant. A long calculation blocks every request
  behind it.
analogy: One cook running three pans. Only one pair of hands, but while the pasta boils they chop the onions.
usage: The server handles plenty of concurrency; the problem is one CSV export blocking the event loop for six seconds.
twin:
  term: parallelism
  difference: Concurrency is dealing with many things at once by taking turns. Parallelism is doing many things at the same instant, on separate cores.
related: [parallelism, race-condition, backpressure, thread, process]
level: 2
lessons: [scale.concurrency-vs-parallelism]
