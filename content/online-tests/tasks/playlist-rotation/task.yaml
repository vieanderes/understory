id: playlist-rotation
title: ShuffledPlaylist
topic: arrays
difficulty: easy
type: algorithmic
recommendedMinutes: 15
signature:
  params:
    - { name: A, type: "int[]" }
    - { name: K, type: int }
  returns: "int[]"
statement: |-
  A music player keeps a playlist of N tracks as an array A of track numbers. Pressing the
  shuffle button K times moves the last track to the front of the list, once per press.
  A negative K means the button was held in reverse: each of the |K| presses moves the first
  track to the end.

  For example, pressing it once on [4, 8, 1, 6] gives [6, 4, 8, 1], and pressing it once in
  reverse gives [8, 1, 6, 4].

  Write a function:

  {{signature}}

  that, given an array A of N integers and an integer K, returns the playlist after K presses.

  For example, given A = [4, 8, 1, 6] and K = 2, the function should return [1, 6, 4, 8].

  Given A = [4, 8, 1, 6] and K = −1, the function should return [8, 1, 6, 4].

  Given A = [3, 5] and K = 4, the function should return [3, 5].

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..100,000];
  - K is an integer within the range [−1,000,000,000..1,000,000,000];
  - each element of array A is an integer within the range [1..1,000,000].
examples:
  - { args: [[4, 8, 1, 6], 2], expected: [1, 6, 4, 8] }
  - { args: [[4, 8, 1, 6], -1], expected: [8, 1, 6, 4] }
  - { args: [[3, 5], 4], expected: [3, 5] }
timeLimitMs: 500
tests:
  - name: extreme_empty
    description: empty playlist
    group: correctness
    cases:
      - { args: [[], 3], expected: [] }
      - { args: [[], 0], expected: [] }
      - { args: [[], -7], expected: [] }
  - name: extreme_single
    description: a single track
    group: correctness
    cases:
      - { args: [[9], 1000000000], expected: [9] }
      - { args: [[9], -5], expected: [9] }
  - name: zero_and_full_turns
    description: K = 0 and K a multiple of N
    group: correctness
    cases:
      - { args: [[1, 2, 3], 0], expected: [1, 2, 3] }
      - { args: [[1, 2, 3], 999999999], expected: [1, 2, 3] }
      - { args: [[1, 2, 3], -6], expected: [1, 2, 3] }
  - name: negative_k
    description: presses in reverse, including |K| larger than N
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4, 5], -2], expected: [3, 4, 5, 1, 2] }
      - { args: [[1, 2, 3, 4, 5], -1000000000], expected: [1, 2, 3, 4, 5] }
      - { args: [[1, 2, 3, 4, 5], -999999998] }
  - name: small_random
    description: random, N = 100, large K
    group: correctness
    cases:
      - generate: { seed: 201, args: [{ kind: ints, n: 100, min: 1, max: 1000000 }, { kind: int, min: -1000000000, max: 1000000000 }] }
      - generate: { seed: 202, args: [{ kind: ints, n: 97, min: 1, max: 1000000 }, { kind: int, min: -1000000000, max: 1000000000 }] }
  - name: large_random
    description: random, N = 100,000, K = 50,001
    group: performance
    cases:
      - generate: { seed: 203, args: [{ kind: ints, n: 100000, min: 1, max: 1000000 }, { kind: value, value: 50001 }] }
  - name: extreme_large
    description: N = 100,000, K = −999,950,001
    group: performance
    cases:
      - generate: { seed: 204, args: [{ kind: permutation, n: 100000 }, { kind: value, value: -999950001 }] }
