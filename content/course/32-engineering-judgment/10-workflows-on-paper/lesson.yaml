    authors: Object Management Group
    year: 2017
    venue: OMG
    url: https://www.omg.org/spec/UML/2.5.1
    note: The standard behind activity partitions, sequence diagrams and state machines.
    verified: false

deepDive: >-
  Start rough. A swimlane with five boxes on a whiteboard settles who does what. Only then
  draw the sequence diagram, for the calls and replies, and the state diagram, for the thing
  that changes over time. Three small diagrams beat one huge one.


  An approval step needs its own failure paths. What if the host never answers? A good
  design sends a reminder after a set time, then parks the episode or escalates to someone
  else. It also says who may approve, and records who did. Those are the questions an
  incident review asks first.


  Mermaid source lives in the repository as text, so a diagram changes in the same pull
  request as the code, and reviewers see the diff. Many code hosts render it in Markdown.


  A state diagram translates almost line for line into code: a table of allowed moves, and a
  function that refuses any move not in it. The challenge's check can then run in your test
  suite, so nobody can add a state without a way out.
