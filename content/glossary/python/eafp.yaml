term: EAFP
aka:
  - easier to ask forgiveness than permission
short: The Python habit of trying an operation and catching the specific failure, instead of checking first.
explain: |
  Before opening a file, you could check it exists, is readable and isn't a folder. Or you
  could open it and handle the one error that matters if it fails.

  Python favours the second. Try the operation, and catch the narrow exception you expect,
  such as `KeyError` or `FileNotFoundError`. The code reads as the happy path, with the
  failure handled beside it.

  It also avoids a race. The file can vanish between your check and your open. Trying is the
  only check that can't go stale. The trap is a bare `except:` that swallows every bug.
analogy: Walking into the shop and seeing if it's open, instead of phoning ahead first.
example:
  language: python
  code: |
    try:
        price = prices[item_id]
    except KeyError:
        price = DEFAULT_PRICE
usage: Prefer EAFP here; the file can disappear between the exists check and the open.
twin:
  term: lbyl
  difference: EAFP tries the operation and handles the failure. LBYL checks every condition first, which reads clearly but can go stale before the operation runs.
related:
  - lbyl
  - race-condition
  - traceback
level: 2
lessons:
  - pro.pythonic
