id: agents.designing-for-uncertainty
title: Designing for an agent that can be wrong
objective: Design the user's side of an agent that is sometimes wrong, with visible confidence and sources, a clarifying question when a guess would be costly, previews and undo, and a handoff to a person.
level: advanced
minutes: 10
concepts: [agents.showing-confidence, agents.clarifying-questions, agents.undo-and-handoff]
prerequisites: [agents.human-in-the-loop, aisys.thresholds-and-calibration, ai.rag]
opening:
  text: >-
    You'll design what a person sees when your agent might be wrong: how sure it is, when it
    asks, what it lets them undo. It's the difference between a wrong answer and a lost customer.

steps:
  - type: multiple-choice
    id: pick-welcome-line
    concept: agents.showing-confidence
    difficulty: 1
    question: A restaurant's booking agent greets every guest. Which first line causes the fewest surprises?
    choices:
      - text: I book, move and cancel tables. Refunds go to staff.
        correct: true
        feedback: >-
          Yes. Guests know what it does, and what it won't try.
      - text: Hi, I'm here to help with anything.
        feedback: >-
          Friendly, but "anything" invites refund and complaint requests it can't handle.
          Each one ends in disappointment.
      - text: I'm an AI and may make mistakes.
        feedback: >-
          True, and almost useless. It doesn't say what to check or what it can do.
      - text: Ask me anything. I'm 99% accurate.
        feedback: >-
          Nobody can check that number, and the first mistake makes it a broken promise.

  - type: prose
    id: confidence-in-words
    body: |-
      People bring expectations from talking to staff. So say how sure the agent is, in
      plain words, with the **sources** behind the answer:

      ```text
      Yes, dogs are welcome on the terrace. [House rules, section 4]
      I couldn't find a rule about cakes. Staff can tell you.
      ```

      Skip the "92% sure". A number the model states about itself tends to run high, and
      nobody has checked it. A score is **calibrated** when its 92% is right 92 times in a
      hundred. Confidence thresholds and calibration showed how to measure that.

  - type: ai-review
    id: review-percent-reply
    concept: agents.showing-confidence
    difficulty: 3
    language: ts
    request: Show guests how sure the agent is about each answer.
    flawClass: logic
    code: |
      type Answer = { text: string; sources: string[]; selfRating: number };

      function formatReply(answer: Answer): string {
        if (answer.sources.length === 0) {
          return "I couldn't find that in the house rules. Staff can help.";
        }
        const sure = Math.round(answer.selfRating * 100);
        return `${answer.text} (${sure}% sure)`;
      }
    prompt: >-
      An assistant wrote this. Its tests passed and guests liked the numbers. Then an audit
      found "95% sure" answers were wrong one time in five. Tap the lines at fault.
    lines: [7, 8]
    reasons:
      - text: An uncalibrated number replaces the sources
        correct: true
        feedback: >-
          Right. Guests can't check a percentage. They can check the house rule.
      - text: The number should keep one decimal place
        feedback: >-
          More digits look more precise. The trouble is that the number itself isn't trustworthy.
      - text: With no sources, it should still answer
        feedback: >-
          An answer feels kinder, but with nothing behind it, it's a guess. "I couldn't find
          that" is the honest part.
      - text: '`Math.round` can give 100% sure'
        feedback: >-
          It can, but capping at 99% leaves the same false precision. The sources are missing.

  - type: prose
    id: ask-or-guess
    body: |-
      Some requests have two readings. "Cancel my booking", from a guest with two bookings.

      A **clarifying question** asks which one before acting. Ask when the request is
      ambiguous *and* a wrong guess is costly. Ask once, briefly, with options to tap.

      Don't ask about everything, though. An agent that checks "Did you mean tonight?" for
      every cheap request is as tiring as one that guesses wrong.

  - type: multiple-choice
    id: pick-cancel-reply
    concept: agents.clarifying-questions
    difficulty: 2
    question: A guest with two bookings writes "cancel my booking". What should the agent reply?
    choices:
      - text: 'Which one? Fri 12 June, or Sat 20 June?'
        correct: true
        feedback: >-
          Yes. One short question, two options, and nothing cancelled yet.
      - text: Done, I've cancelled your next booking.
        feedback: >-
          The nearest date is a guess. If it's the wrong one, a party of six loses its table.
      - text: Could you tell me more about your request?
        feedback: >-
          It does ask, but it makes the guest write an essay. Offer the two bookings as choices.
      - text: I've cancelled both, to be safe.
        feedback: >-
          Safe for the agent, not the guest. Cancelling more than asked is the costliest guess.

  - type: prose
    id: preview-undo-handoff
    body: |-
      Before an action, show a **preview**: what will change, in one line, with a Confirm
      button. After it, offer **undo** where you can. When you can't, say so before the
      click: "Cancelling releases the table. This can't be undone."

      When the agent is stuck, a **handoff** passes the chat to a person. Send the whole
      conversation along, so the guest never repeats themselves.

  - type: bug-hunt
    id: hunt-cancelled-too-soon
    concept: agents.undo-and-handoff
    difficulty: 3
    language: tsx
    code: |
      function CancelButton({ booking }: { booking: Booking }) {
        const [status, setStatus] = useState("");

        async function cancel() {
          setStatus("Booking cancelled.");
          await api.cancel(booking.id);
        }

        return (
          <>
            <button onClick={cancel}>Cancel {booking.date}</button>
            <p role="status">{status}</p>
          </>
        );
      }
    prompt: >-
      The agent's chat shows this button. Every cancel worked in testing. One evening the
      booking service was down, and 30 guests who saw "cancelled" got a no-show fee. Tap the line at fault.
    lines: [5]
    reasons:
      - text: It says cancelled before the server confirms it
        correct: true
        feedback: >-
          Yes. The message claimed a result nobody had checked yet.
      - text: The button isn't disabled while cancelling
        feedback: >-
          Worth fixing for double clicks. But the fee came from a message that claimed success.
      - text: '`role="status"` reads the message aloud'
        feedback: >-
          That's what screen reader users need. The words were wrong, not their delivery.
      - text: The status starts as an empty string
        feedback: >-
          An empty status shows nothing, which is right before any click.
    fix: |
      async function cancel() {
        setStatus("Cancelling...");
        try {
          await api.cancel(booking.id);
          setStatus("Booking cancelled.");
        } catch {
          setStatus("Couldn't cancel. Your booking is still on.");
        }
      }
    verify:
      question: Which test would have caught this?
      choices:
        - text: Make the cancel call fail, then read the message
          correct: true
          feedback: >-
            Right. Only a failing server shows the message lying.
        - text: Click cancel and check a message appears
          feedback: >-
            That's the test that passed. With a working server, the early message looks correct.
        - text: Click twice and count the server calls
          feedback: >-
            It finds double cancels. It never makes the call fail, so the false message stays hidden.

  - type: fill-blank
    id: fill-handoff
    concept: agents.undo-and-handoff
    difficulty: 3
    language: ts
    prompt: >-
      The agent is stuck, so a person takes over. Pass along what the guest asked and the
      whole chat. Then tell the guest what happens next.
    template: |
      function handOff(chat: Chat): string {
        staffQueue.add({
          request: {{1}},
          tried: chat.toolCalls,
          transcript: {{2}},
        });
        return {{3}};
      }
    blanks:
      - key: '1'
        answer: chat.firstMessage
      - key: '2'
        answer: chat.messages
      - key: '3'
        answer: '"A person has this chat and will reply within an hour."'
    bank:
      - chat.firstMessage
      - '"Guest needs help"'
      - chat.messages
      - chat.messages.slice(-1)
      - '"A person has this chat and will reply within an hour."'
      - '"Email the restaurant and describe the problem."'

  - type: code-challenge
    id: write-decide-reply
    concept: agents.clarifying-questions
    difficulty: 4
    language: ts
    starter: reply.starter.ts
    solution: reply.solution.ts
    tests: reply.tests.ts
    prompt: >-
      Write `decideReply(request)`. The `confidence` is calibrated, 0 to 1. Return the
      first that applies:


      1. Ambiguous and costly if wrong: `"ask"`.

      2. Confidence under 0.5: `"hand-off"`.

      3. An action you can't undo, below 0.8: `"hand-off"`. Any other action:
      `"preview-then-act"`.

      4. A question at 0.9 or more, cheap if wrong: `"answer"`. Any other question:
      `"answer-with-sources"`.
    hints:
      - The order of the four rules is the whole design. Write them as early returns, top to bottom.
      - 'Ambiguity alone isn''t enough to ask. It takes `ambiguous` and `costlyIfWrong` together.'
      - 'Start with `if (request.ambiguous && request.costlyIfWrong) return "ask";`, then the 0.5 check.'

  - type: explain-back
    id: explain-confidence-to-designer
    concept: agents.showing-confidence
    difficulty: 4
    audience: non-technical
    kind: decide
    prompt: >-
      A designer wants "92% sure" beside every agent answer. Defend what you'd show instead.
    rubric:
      - A number the model states about itself runs high and hasn't been checked against outcomes.
      - Plain words plus the sources let a person check the answer.
      - When the agent can't find support, it says so and offers a person.
    modelAnswer: >-
      That number comes from the model rating itself, and those ratings run high. Its 92% can
      be wrong one time in five, and guests would trust it anyway. I'd show the answer in
      plain words with the rule it came from. Anyone can check it in a click. When it
      finds nothing, it says "I couldn't find that" and offers staff. Only a number we've
      measured against real outcomes earns a place on screen.

recap:
  - Say what the agent can do, and show answers in plain words with their sources.
  - Ask one short question with options when a guess is ambiguous and costly.
  - Preview actions, offer undo or warn when there is none, and hand off with the whole chat.

recall:
  - id: card-why-no-percent
    concept: agents.showing-confidence
    front: Why not show the model's own "92% sure" next to an answer?
    back: >-
      A confidence the model states about itself tends to run high and hasn't been checked
      against outcomes. Show plain words and the sources instead.
  - id: card-when-to-ask
    concept: agents.clarifying-questions
    front: When should an agent ask a clarifying question instead of guessing?
    back: >-
      When the request has two readings and a wrong guess is costly. Ask once, with options
      to tap.
  - id: card-irreversible
    concept: agents.undo-and-handoff
    front: What should the interface do before an action that can't be undone?
    back: >-
      Show a preview of what will change and say plainly that it can't be undone, before the
      person confirms.
  - id: card-good-handoff
    concept: agents.undo-and-handoff
    front: What does a good handoff to a person carry along?
    back: >-
      The original request, what the agent already tried and the whole chat, so the user never
      repeats themselves.

references:
  - kind: paper
    title: Guidelines for Human-AI Interaction
    authors: Saleema Amershi, Dan Weld, Mihaela Vorvoreanu, Adam Fourney, Besmira Nushi, Penny Collisson, Jina Suh, Shamsi Iqbal, Paul N. Bennett, Kori Inkpen, Jaime Teevan, Ruth Kikin-Gil and Eric Horvitz
    year: 2019
    venue: CHI 2019
    url: https://doi.org/10.1145/3290605.3300233
    note: Eighteen tested guidelines, among them "make clear what the system can do", "scope services when in doubt" and "support efficient correction".
    primary: true
    verified: true
  - kind: docs
    title: People + AI Guidebook
    authors: Google PAIR
    year: 2019
    url: https://pair.withgoogle.com/guidebook/
    note: The chapters Mental Models (setting expectations), Explainability + Trust (whether and how to show confidence) and Errors + Graceful Failure.
    primary: true
    verified: true
  - kind: essay
    title: 10 Usability Heuristics for User Interface Design
    authors: Jakob Nielsen
    venue: Nielsen Norman Group
    url: https://www.nngroup.com/articles/ten-usability-heuristics/
    note: Visibility of system status, and user control and freedom, which is where undo comes from.
    verified: true
  - kind: paper
    title: Language Models (Mostly) Know What They Know
    authors: Saurav Kadavath et al.
    year: 2022
    venue: arXiv 2207.05221
    url: https://arxiv.org/abs/2207.05221
    note: Large models are well calibrated on multiple-choice questions in the right format, so calibration is something you measure per task, not assume.
    verified: true
  - kind: paper
    title: 'Can LLMs Express Their Uncertainty? An Empirical Evaluation of Confidence Elicitation in LLMs'
    authors: Miao Xiong, Zhiyuan Hu, Xinyang Lu, Yifei Li, Jie Fu, Junxian He and Bryan Hooi
    year: 2024
    venue: ICLR 2024
    url: https://arxiv.org/abs/2306.13063
    note: Confidence that chat models state in words tends to be overconfident; agreement between several sampled answers does better.
    verified: true

deepDive: >-
  The code challenge ran in Node 24 with the course harness. No model was called.


  **Where calibrated confidence comes from.** The `confidence` in the challenge isn't the
  model rating itself. It's a score you've checked against labelled outcomes, as Confidence
  thresholds and calibration did with a bucket table. Signals that often calibrate better
  than a self-rating: whether retrieval found a source above a similarity bar, whether two
  samples of the answer agree, and a small classifier trained on past corrections.


  **Bands, not digits.** Even a calibrated score reads better as a band in words: "found in
  the rules", "likely, worth a check", "not found". Users act on the band anyway, and a band
  hides noise that a third digit would show off.


  **Undo windows.** Many actions that look final can be delayed instead. Hold a sent email
  or a cancellation for ten seconds with an Undo button, then commit. Where the outside
  world can't wait, for a payment or a message to a third party, the preview and the
  "can't be undone" line carry the whole load.


  **Asking costs something too.** Every question adds a turn and a chance the person gives
  up. Track how often a clarifying question was answered with the option the agent would
  have guessed. If it's nearly always, stop asking that one.
