term: prompt
short: The instructions and input you send a model, written to get the answer you want.
explain: |
  A model continues text. The prompt is the text it continues from: a task, some context,
  maybe a few examples, and the user's question. Change the wording and you can change the
  answer.

  In an app, a prompt is code. It lives in version control, it has tests (evals), and an edit
  can break things like any other code change. Clear instructions, the exact output format
  and an example or two usually beat clever wording.
analogy: A brief for a decorator. A vague brief gets a vague room; a clear brief with a sketch of the finished room gets you that room.
usage: Don't tweak the prompt in production; put the change through the eval set first.
twin:
  term: system-prompt
  difference: The prompt is everything you send in a call. The system prompt is one part of it, the standing instructions that go first on every call.
