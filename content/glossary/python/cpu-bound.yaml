term: CPU-bound
aka:
  - CPU-bound work
  - compute-bound
short: Work whose speed is limited by how fast the processor can calculate, not by waiting.
explain: |
  Resizing ten thousand images, scoring every row of a big table, parsing a huge file. The
  processor is busy the whole time. There is no waiting to overlap.

  In standard Python, threads don't help: the GIL lets only one thread run Python code at a
  time. You need processes, each with its own interpreter on its own core. Or you need code that runs
  outside Python, such as a vectorised array operation.

  Processes cost something. Each one starts an interpreter, and data sent to it is copied. Send
  big chunks of work, not one tiny item at a time.
analogy: Doing long division by hand. Only more people working on separate sheets makes it faster.
example:
  language: python
  code: |
    from concurrent.futures import ProcessPoolExecutor

    if __name__ == "__main__":
        with ProcessPoolExecutor() as pool:
            scores = list(pool.map(score_document, documents, chunksize=50))
usage: Tokenising the corpus is CPU-bound, so threads gave us nothing; a process pool used all eight cores.
twin:
  term: io-bound
  difference: CPU-bound work keeps the processor busy, so it needs more cores or faster code. I/O-bound work waits on something outside, so overlapping the waits is enough.
related:
  - io-bound
  - gil
  - parallelism
  - vectorisation
level: 2
lessons: [pyai.threads-and-processes, scale.web-workers]
