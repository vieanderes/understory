summary: >-
  TypeScript decides whether a value fits a type by looking at its properties, never at the
  name of its type. This is **structural typing**. A `Refund` fits where a `Price` is expected
  if it has everything a `Price` has. Java and C# work the other way, by name, which is
  called nominal typing.


  The choice follows from JavaScript itself. Most JavaScript values are object literals with
  no class behind them, and code has always accepted "anything with an `id` and a `name`".
  Structural typing describes that code as it is. The cost is that two types with the same
  shape are interchangeable, so an order id can pass where a user id belongs.


  Two rules sit on top. The **excess property check** rejects unknown properties on an object
  literal written straight into a typed spot, because a property nothing will read is almost
  always a typo. And **brands** add a type-only property when you want two same-shaped types
  kept apart. Knowing when each applies is what lets you predict the checker.
remember:
  - A value fits a type when it has every required property with a compatible type, and extra properties are allowed.
  - Type names play no part in the check, so two types with the same shape are interchangeable.
  - The excess property check applies only to fresh object literals, written directly where a type is expected, including arguments and return values.
  - "Annotate a variable, `const options: AlarmOptions = { ... }`, to get typo checks on an object you pass later."
  - 'A brand, such as `string & { readonly __brand: "UserId" }`, makes same-shaped types incompatible at no runtime cost.'
  - '`readonly` is checked only by the compiler and only one level deep, and a readonly type still fits a mutable one.'
  - A function with fewer parameters fits a function type with more, which is why callbacks can ignore arguments.
  - A class type is structural too, unless it has private members such as `#balance`, which a plain object can't copy.
sections:
  - title: What "fits" means, rule by rule
    body: |-
      The checker compares the target type's properties one by one. Each must exist on the
      source, unless optional, and its type must fit in turn. Anything else on the source is
      ignored. Some consequences surprise people:

      ```ts
      type Point = { x: number; y: number };
      type Frozen = { readonly x: number; readonly y: number };

      const frozen: Frozen = { x: 1, y: 2 };
      const loose: Point = frozen; // allowed: readonly doesn't affect fit
      loose.x = 99;
      console.log(frozen.x); // 99

      class Coordinate {
        x = 0;
        y = 0;
      }
      const plain: Coordinate = { x: 3, y: 4 }; // a plain object fits a class type
      console.log(plain instanceof Coordinate); // false

      const handlers: Array<(item: string, index: number) => void> = [];
      handlers.push((item) => console.log(item)); // fewer parameters is fine
      ```

      `readonly` is a promise about one reference, not about the object. Another reference
      typed without `readonly` can still write. For a real guarantee at run time, use
      `Object.freeze`, which is also shallow.

      A class is checked by shape as well, so `{ x: 3, y: 4 }` counts as a `Coordinate`,
      even though `instanceof` says it isn't one. The exception is private state. A
      class with a `#balance` field can't be imitated, because a plain object can't have that
      field: `Property '#balance' is missing in type '{ deposit(): void; }'`.

      Function types flip one rule. A function that takes **fewer** parameters fits a type
      with more, since extra arguments are ignored in JavaScript. That's why `forEach` and
      `map` callbacks can skip the index. Parameter types are compared in reverse: a handler
      for `Book` doesn't fit where any `Item` might arrive, because it may read a property an
      `Item` lacks. That check is strict for function-typed properties under `strict`, and
      loose for method syntax, as the deep dive explains.
  - title: The excess property check, exactly
    body: |-
      The check fires on a **fresh object literal**: one written directly where a type is
      expected. That covers a variable annotation, an argument and a return value. It also
      fires with `satisfies`:

      ```ts
      type Label = { id: string; note?: string };

      function make(): Label {
        return { id: "L-1", noe: "fragile" };
        // Object literal may only specify known properties, but 'noe' does not exist
        // in type 'Label'. Did you mean to write 'note'?
      }

      const viaSatisfies = { id: "L-2", noe: "x" } satisfies Label; // same error
      ```

      Once the object is stored in an unannotated variable, it has its own inferred type and
      loses freshness. From then on only the structural rule applies.

      A second rule catches a related mistake. If every property of a type is optional, it's
      a **weak type**, and any object would fit it. So the checker demands at least one
      property in common:

      ```ts
      type Options = { retries?: number; timeoutMs?: number };
      const opts = { retry: 3 };
      const o: Options = opts;
      // Type '{ retry: number; }' has no properties in common with type 'Options'.
      ```

      With unions, the check is looser. An object literal may carry properties from any
      member of the union, unless the union has a discriminant like `kind`, in which case the
      checker picks the member and checks against it alone.

      When extra properties are intended, say so in the type. An index signature such as
      `Record<string, number>` accepts any key. Avoid silencing the check with `as`, which
      also switches off the checks you wanted.
  - title: Branded types for ids, money and checked strings
    body: |-
      Structural typing makes every `string` interchangeable. A function that takes an order
      id and a user id, both strings, compiles with the arguments swapped. A **brand** adds a
      property that exists only in the type, so the shapes differ:

      ```ts
      type UserId = string & { readonly __brand: "UserId" };
      type OrderId = string & { readonly __brand: "OrderId" };

      function toUserId(raw: string): UserId {
        if (!/^U-\d+$/.test(raw)) throw new Error(`Not a user id: ${raw}`);
        return raw as UserId; // the one place a cast is allowed
      }
      function toOrderId(raw: string): OrderId {
        if (!/^O-\d+$/.test(raw)) throw new Error(`Not an order id: ${raw}`);
        return raw as OrderId;
      }

      function cancelOrder(order: OrderId, by: UserId): string {
        return `${by} cancelled ${order}`;
      }

      const user = toUserId("U-42");
      const order = toOrderId("O-7");

      console.log(cancelOrder(order, user)); // U-42 cancelled O-7
      console.log(user.toUpperCase()); // U-42, still a string
      // cancelOrder(user, order);
      // Argument of type 'UserId' is not assignable to parameter of type 'OrderId'.
      // cancelOrder("O-7", user);
      // Argument of type 'string' is not assignable to parameter of type 'OrderId'.
      ```

      The `__brand` property never exists at run time: the value is a plain string. The
      constructor functions are the only places allowed to cast, and they check the value
      first. So a `UserId` in a signature now means "a string someone has validated".

      Brands work for anything where mixing values is a bug: pence versus pounds, a raw
      string versus sanitised HTML, a validated email. The cost is ceremony. Every value has
      to pass through a constructor, and libraries that return plain strings need wrapping.
      Use them for a few high-risk types, not for every string.
pitfalls:
  - '**Expecting a misspelt property in a variable to be caught.** Stored in an unannotated variable, the object loses its freshness and extra properties pass. Annotate the variable, or write the object in the call.'
  - '**Fixing an excess property error with `as`.** `{ id: "L-1", noe: "x" } as Label` compiles, and it also hides every other mistake in that object. Correct the property name, or add it to the type if it belongs there.'
  - '**Treating `readonly` as a runtime guarantee.** It is erased, it only covers one level, and a readonly value can be assigned to a mutable type and changed through it. Use `readonly string[]` for inner arrays, and `Object.freeze` when you need runtime protection.'
  - '**Assuming a class type means a class instance.** Any object with the same public shape fits, so `instanceof` can be `false` for a value typed as that class. Use a private `#field` if only real instances should fit.'
  - '**Relying on names to keep ids apart.** `type UserId = string` is only an alias, so any string fits. Use a brand when swapping two ids would be a real bug.'
interview:
  - question: What's structural typing, and how is it different from nominal typing?
    answer: >-
      Structural typing checks compatibility by shape; nominal typing checks it by declared
      name. In TypeScript, a value fits a type if it has all the required properties with
      compatible types, whatever its type is called or where it came from. In Java or C#, a
      class must explicitly implement an interface. TypeScript chose structure because
      JavaScript code is full of object literals and duck-typed functions, and structure
      describes that code without forcing classes on it. The benefit is flexibility: test
      doubles, plain objects and different libraries' types interoperate freely. The cost is
      that same-shaped types are interchangeable, so an order id fits where a user id is
      expected. When that matters I add a brand, or use a class with a private field.
  - question: Why does TypeScript reject an object literal with an extra property but accept the same object from a variable?
    answer: >-
      Because the excess property check is a separate, narrower rule than assignability.
      By the structural rule, extra properties are always fine. But on a fresh object
      literal, written directly where a type is expected, nothing else can ever read an
      unknown property, so it's almost certainly a typo such as `noe` for `note`. The
      checker reports it. Once the object is in an unannotated variable, it has its own
      type and other code might use the extra properties, so only the structural rule
      applies. The practical fix is to annotate the variable. There's a related rule for
      weak types, where every property is optional: the value must share at least one
      property with the type.
  - question: How would you stop someone passing an order id where a user id is expected, when both are strings?
    answer: >-
      I'd use branded types. `type UserId = string & { readonly __brand: "UserId" }` adds a
      property that exists only in the type system, so `UserId` and `OrderId` no longer
      have the same shape and swapping them is a compile error. A plain `string` doesn't fit
      either. Values get a brand through one constructor function that validates the string
      and then casts, so the cast lives in exactly one checked place. At run time it's still
      a plain string, so there's no cost and it serialises normally. The trade-off is
      friction: data from the database or an API needs to go through the constructor. I'd
      reserve brands for identifiers and units where a mix-up causes real damage.
  - question: Is readonly in TypeScript the same as Object.freeze?
    answer: >-
      No. `readonly` is a compile-time rule on one reference; `Object.freeze` is a runtime
      rule on the object. `readonly` is erased, so plain JavaScript can still write to the
      property. It's shallow, so `readonly items: string[]` still allows `push`, and you
      need `readonly string[]` for the array itself. And it doesn't affect assignability: a
      readonly object can be assigned to a mutable type and changed through that alias.
      `Object.freeze` actually stops writes at run time, silently in sloppy mode and with a
      `TypeError` in strict mode, but it's shallow too and costs a call. I use `readonly` to
      document intent in types, and freeze only when untrusted code could mutate shared
      data.
