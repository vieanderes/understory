summary: >-
  Your HTML file is not what the browser, the app you read websites in, draws. The
  browser's **parser**, the part that reads HTML, turns the file into a tree of objects in
  memory. There's one object per element, each inside the object for its outer
  element. That tree is the **DOM**, the Document Object Model.
  The screen is drawn from the DOM, JavaScript reads and changes the DOM, and screen readers, apps
  that read a page aloud, get their information from it too.


  Two consequences shape everyday front-end work. First, the DOM can differ from the file.
  The parser adds missing elements and repairs mistakes, and scripts change the tree after it
  is built. So when a page looks wrong, you inspect the DOM in the developer tools, the inspection
  panels built into the browser, not the source. Second, changing the page from JavaScript means changing DOM objects: find an
  element with `document.querySelector`, then set a property such as `textContent`, and the
  screen follows.


  Almost every tool you'll use later, from plain scripts to React, is a way of changing this
  tree. Understanding it now makes those tools far less mysterious.
remember:
  - The DOM is the tree of objects the browser builds from your HTML, and the screen, JavaScript and screen readers all work from it rather than from the file.
  - View page source shows the file as it arrived, while the Elements panel shows the DOM as it is now, with repairs and script changes.
  - '`document.querySelector` returns the first element that matches, or `null`, meaning "nothing", when none does.'
  - A script can only find elements the parser has already built, so a script placed above its element gets `null`.
  - Setting `textContent` replaces everything inside the element, child elements included, with plain text.
  - '`textContent` never turns text into tags, which makes it the safe way to show anything a person typed.'
  - Text between tags, spaces and line breaks included, becomes text nodes, so `childNodes` counts more than `children`.
  - The parser repairs broken HTML by rules in the HTML Standard, so every modern browser builds the same tree from the same mistakes.
sections:
  - title: 'Nodes: what the tree is made of'
    body: |-
      Every object in the DOM is called a **node**, one point in the tree. Elements are the
      nodes you've met, but there are others. The text inside an element is a **text node**.
      A comment becomes a comment node. At the very top sits the **document** node, which is
      the `document` object your scripts start from.

      That includes the whitespace between tags. Press Enter and a few spaces between two
      list items, and the parser keeps them as a text node, even though the browser draws
      nothing for them. You can see the difference with two properties:

      ```html
      <ul>
        <li>Mon</li>
        <li>Tue</li>
      </ul>
      <script>
        const list = document.querySelector("ul");
        console.log(list.children.length);   // 2
        console.log(list.childNodes.length); // 5
      </script>
      ```

      `children` holds only the element children, the two `li` elements. `childNodes` holds
      every node: a whitespace text node, `li`, whitespace, `li`, whitespace. That's five. In
      practice you almost always want `children`.

      The `document` object has shortcuts to the top of the tree, all checked in Chrome:

      ```js
      console.log(document.documentElement); // the html element
      console.log(document.head);            // the head element
      console.log(document.body);            // the body element
      console.log(document.title);           // the text of the title, as a string
      ```

      Because the parser always creates `html`, `head` and `body`, these exist on every page,
      even one whose file contains a single `h1`.
  - title: When the element isn't there yet
    body: |-
      The parser builds the DOM from the top of the file down. When it reaches a `script`
      element, it stops, runs the script, and only then carries on. So a script can only see
      what's above it.

      This page puts the script first:

      ```html
      <head>
        <script>
          const heading = document.querySelector("h1");
          console.log(heading); // null
          heading.textContent = "Open now";
        </script>
      </head>
      <body>
        <h1>Opening soon</h1>
      </body>
      ```

      When the script runs, the `h1` doesn't exist yet. `querySelector` finds nothing and
      returns `null`, a value that means "no object here". The next line then tries to set a
      property on nothing, and Chrome's Console shows:

      ```text
      Uncaught TypeError: Cannot set properties of null (setting 'textContent')
      ```

      The heading stays "Opening soon". The error message is the clue: "properties of null"
      means the thing before the dot was `null`, so the element wasn't found. There are two
      usual causes: the script ran too early, or the selector matches nothing, often a typo.

      For now, put scripts at the end of `body`, after everything they touch. The JavaScript
      chapter shows attributes that let a script sit in `head` and still wait. When an
      element might truly be missing, check before you use it:

      ```js
      const banner = document.querySelector("h2");
      if (banner === null) {
        console.log("No h2 on this page");
      } else {
        banner.textContent = "Open now";
      }
      ```

      Also remember that `querySelector` returns only the **first** match. On a page with
      two paragraphs, `document.querySelector("p")` changes the first and leaves the second
      alone.
  - title: What textContent does, and why it's the safe choice
    body: |-
      Setting `textContent` doesn't edit the text. It throws away everything inside the
      element and puts one text node in its place. Anything nested inside goes too:

      ```html
      <p>Open <strong>daily</strong> from 9</p>
      <script>
        const sign = document.querySelector("p");
        console.log(sign.textContent);              // Open daily from 9
        sign.textContent = "Closed today";
        console.log(sign.querySelector("strong"));  // null
      </script>
      ```

      Reading `textContent` joins all the text inside, tags stripped. Writing it replaces the
      lot, so the `strong` element is gone. To change only the bold word, select the `strong`
      and set its `textContent` instead.

      The second property of `textContent` matters even more. It never treats your string as
      HTML:

      ```html
      <p>Hello</p>
      <script>
        const note = document.querySelector("p");
        note.textContent = "<b>Hi</b>";
        console.log(note.innerHTML);        // &lt;b&gt;Hi&lt;/b&gt;
        console.log(note.children.length);  // 0
      </script>
      ```

      The page shows the characters `<b>Hi</b>`, and no `b` element is created. Its cousin
      `innerHTML` does the opposite: it parses the string as HTML and builds real elements.
      That's dangerous with text a person typed, like a chat message or a review. Someone
      could type markup that runs their own code in other visitors' browsers. That attack is
      called cross-site scripting, or XSS. So the rule is: show typed text with `textContent`.
  - title: Reading the real tree in the developer tools
    body: |-
      The **developer tools** are a panel of inspection tools built into every desktop
      browser. In Chrome, right-click any part of a page and choose "Inspect". The Elements
      panel opens with that element selected in the DOM.

      A few habits make it useful:

      - **Hover to find.** Hovering a node in the panel highlights it on the page, and the
        other way round with the arrow tool in the corner.
      - **Edit to experiment.** Double-click text or a tag to change it live. The page
        updates at once, but only in your browser. A reload brings back the file.
      - **Use `$0` in the Console.** In Chrome's Console, `$0` is the node selected in the
        Elements panel, so `$0.textContent` reads it.

      The Elements panel is also where repairs become visible. Chrome builds this from a
      paragraph written straight inside a table:

      ```html
      <!-- What you write -->
      <table><p>Note</p><tr><td>1</td></tr></table>
      <!-- What the Elements panel shows -->
      <p>Note</p><table><tbody><tr><td>1</td></tr></tbody></table>
      ```

      The paragraph moved in front of the table, and a `tbody` appeared around the row.
      Source view would show neither change.

      Because these repairs are standard, the Web Content Accessibility Guidelines dropped
      their old rule about well-formed markup. WCAG 2.2 removed success criterion 4.1.1,
      Parsing, as obsolete: browsers and screen readers work from the repaired tree, not the
      file. Tidy markup still matters, because a repair that differs from your intent still
      changes what people get.
pitfalls:
  - '**Running a script before its element exists.** A script in `head` runs before `body` is parsed, so `querySelector` returns `null` and the next line throws. Put the script at the end of `body`.'
  - '**Trusting View page source.** It shows the file, not what the browser built or what scripts changed. Inspect the DOM in the Elements panel instead.'
  - '**Expecting edits in the Elements panel to stick.** They change only the live DOM in your browser. Copy the fix into your file, or it vanishes on reload.'
  - '**Setting `textContent` on a parent to change one word.** It wipes the child elements too, so a bold word loses its `strong`. Select the inner element and change that.'
  - '**Putting typed text into `innerHTML`.** The string is parsed as HTML, so a visitor can inject markup that runs code. Use `textContent` for anything a person typed.'
  - '**Expecting `querySelector` to change every match.** It returns only the first. The JavaScript chapter shows how to work with all of them.'
verify:
  - lens: leaks
    check: 'Anything a person typed is shown with `textContent`, never `innerHTML`, so their text cant turn into tags or scripts.'
  - lens: breaks
    check: 'A script that finds elements runs after they exist, so `querySelector` doesnt return `null` and stop at the first property.'
  - lens: breaks
    check: '`textContent` is set on the innermost element that holds the text, because setting it on a parent wipes out every child element.'
  - lens: confuses
    check: 'A scripts changes are checked in the Elements panel, because View page source shows only the file as it was downloaded.'
  - lens: tests
    check: 'Each DOM change is tried on the page, and once with the element missing, to see the script fail clearly rather than silently.'
interview:
  - question: What is the DOM, and how does it differ from the HTML source?
    answer: >-
      The DOM is the live tree of objects the browser builds from the HTML, and the source is
      only the text it started from. The parser reads the file top to bottom and creates a
      node for every element, piece of text and comment, nested as the tags were. The screen
      is drawn from that tree, JavaScript reads and changes it, and the accessibility tree is
      derived from it. The two differ in two ways. The parser repairs and completes the markup,
      adding `html`, `head`, `body` and `tbody` and closing unclosed elements. Then scripts
      change the tree after it's built. So View page source can be misleading for debugging.
      I use the Elements panel, which shows the current DOM, and I only trust the source for
      what the server sent.
  - question: What's the difference between textContent and innerHTML?
    answer: >-
      `textContent` treats a string as plain text, and `innerHTML` parses it as HTML. Setting
      `textContent` to `"<b>Hi</b>"` shows those characters on screen and creates no element.
      Setting `innerHTML` to the same string creates a real `b` element. Both replace
      everything that was inside the element. The choice is mostly about safety. If the
      string contains anything a user typed, `innerHTML` opens the door to cross-site
      scripting, because injected markup can run code in other visitors' browsers. So I use
      `textContent` by default, and `innerHTML` only for markup I wrote myself. There's
      also `innerText`, which respects styling: it skips text hidden with CSS, the
      styling language, while `textContent` includes it. Reading `innerText` forces the browser to work out layout, so
      it's slower.
  - question: Your querySelector call returns null. How do you debug it?
    answer: >-
      `null` means no element matched at the moment the line ran, so I check the selector and
      the timing. First, the selector: I copy it into the Console and run
      `document.querySelector` there, after the page has loaded. If it's still `null`, it's a typo or the element doesn't exist.
      The Elements panel shows what's really there, which may differ from my file after repairs. If it works in the Console but not in my
      script, it's timing: the script ran before the parser reached the element, typically
      because it sits in `head`. The fix is to move the script to the end of `body`, or to use
      the `defer` attribute the JavaScript chapter covers. For elements that are optional on some pages, I check for `null` before using
      the result, instead of letting a TypeError stop the rest of the script.
