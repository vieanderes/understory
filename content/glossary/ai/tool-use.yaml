term: tool use
aka:
  - tool calling
  - function calling
short: A model replying with a request to run a named function with arguments, which your code then runs.
explain: |
  A model can only produce text. To check the weather or look up an order, it writes a
  structured request: call this tool, with these arguments. Your code decides whether to run
  it, runs it, and sends the result back.

  The model never runs anything itself. That's the safety point: your code validates the
  arguments, checks permissions and can refuse. A tool's name and description are part of
  the prompt, so write them as carefully as the prompt.
analogy: An order slip in a restaurant. The waiter writes it; the kitchen decides whether it can make the dish, and cooks it.
example:
  language: json
  code: |
    {
      "type": "tool_call",
      "name": "get_order",
      "arguments": { "orderId": "A-1042" }
    }
usage: With tool use, check the order belongs to this user before running get_order.
twin:
  term: agent
  difference: Tool use is one step, where the model asks for one call and your code runs it. An agent repeats that in a loop, choosing each next tool from what the last one returned.
