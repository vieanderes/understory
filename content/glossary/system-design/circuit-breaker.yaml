term: circuit breaker
aka: [breaker]
short: A guard that stops calling a failing service for a while, failing fast instead of waiting each time.
explain: |
  When a service you depend on is down, each call waits for a timeout. Hundreds of calls
  waiting at once tie up your own server, and the failure spreads.

  The guard counts recent failures. Past a threshold it **opens**: calls fail at once, with
  a fallback if you have one. After a pause it goes **half-open** and lets one test call
  through. If that works it **closes** again. It protects you, and it gives the struggling
  service room to recover.
analogy: The trip switch in your fuse box. One faulty toaster cuts its circuit, instead of setting the house on fire.
example:
  language: ts
  code: |
    if (breaker.isOpen()) return cachedRates();
    try {
      const rates = await fetchRates({ timeoutMs: 800 });
      breaker.recordSuccess();
      return rates;
    } catch (err) {
      breaker.recordFailure();
      return cachedRates();
    }
usage: Wrap the shipping API in a circuit breaker; when it's down, checkout should show a flat rate, not hang.
twin:
  term: retry
  difference: A retry tries the same call again, betting the failure is brief. A circuit breaker stops trying for a while, betting it isn't. Retries without a breaker can bury a struggling service.
related: [retry, load-shedding, single-point-of-failure]
level: 2
lessons: [scale.failure-handling, backend.calling-other-apis, ai.failures, aisys.cost-and-latency]
