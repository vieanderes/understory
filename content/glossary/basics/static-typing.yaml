term: static typing
aka:
  - statically typed
  - static type system
  - compile-time type checking
short: Checking every value's type before the program runs, so type mistakes stop the build.
explain: |
  Pass a string where a number belongs and something will go wrong. The question is when
  you find out: on your machine before shipping, or on a user's phone at midnight.

  A statically typed language checks types when the code is compiled or type-checked. TypeScript,
  Go, Rust, Swift and Kotlin work this way. A whole class of mistake can't reach production,
  and editors can rename and autocomplete with confidence.

  The trap is treating it as proof the program is right. The checker knows a value is a
  number, not that it's the right number. And data from outside still needs checking when it
  arrives, because the checker never saw it.
analogy: A builder checking the plans before laying a brick, rather than discovering the door is too narrow afterwards.
example:
  language: ts
  code: |
    function total(prices: number[]): number {
      return prices.reduce((sum, p) => sum + p, 0);
    }

    total(["12", "8"]); // error before the code ever runs
usage: Static typing caught the renamed field in every caller; in the old Python script we'd have found it in production.
twin:
  term: dynamic-typing
  difference: Static typing checks types before the program runs. Dynamic typing checks them as each line executes, so the same mistake appears only when that line is reached.
related:
  - dynamic-typing
  - type-annotation
  - type-hint
  - type-erasure
  - compiler
