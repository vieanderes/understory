id: judgment.what-breaks
title: Finding what breaks
objective: List the ways code can fail, from outside input and partial failure to boundaries and time, and pick the test that matters.
level: advanced
minutes: 10
concepts: [judgment.failure-modes, judgment.partial-failure, judgment.time-and-boundaries]
prerequisites: [testing.what-to-test, judgment.what-to-verify]
opening:
  text: >-
    You'll list the ways code can fail before your users find them, then pick the test
    that matters. It's how a reviewer finds the bug in code that every test calls
    fine.

steps:
  - type: prose
    id: four-families
    body: |-
      "What could break?" has a short list of answers. Code fails in four families:

      - **Input from outside:** empty, huge, malformed or hostile.
      - **Dependencies:** a service you call is slow, down or wrong.
      - **Concurrency:** two requests touch the same thing at once.
      - **Resources:** memory, disk, connections or quota run out.

      Writing that list for one piece of code is listing its **failure modes**.

  - type: multiple-choice
    id: pick-family
    concept: judgment.failure-modes
    difficulty: 1
    question: A bike dock takes 30 seconds to answer an unlock request. Which family is that?
    choices:
      - text: A dependency
        correct: true
        feedback: >-
          Right. The dock is something your code calls and can't control.
      - text: Input from outside
        feedback: >-
          Input is what arrives at your code. The dock is something your code calls, so it's a
          dependency.
      - text: Concurrency
        feedback: >-
          Nothing ran at the same time here. One slow answer from another system is a
          dependency failing.
      - text: Resources
        feedback: >-
          No memory or disk ran out on your side. The slowness belongs to the system you
          called.

  - type: bug-hunt
    id: hunt-empty-week
    concept: judgment.time-and-boundaries
    difficulty: 2
    language: js
    code: |
      // The weekly card on a weather station's page.
      function weeklyAverage(readings) {
        let total = 0;
        for (const reading of readings) total += reading.celsius;
        return Math.round((total / readings.length) * 10) / 10;
      }
    prompt: >-
      A station that was offline all week shows `Average: NaN°C`. Tap the line that should
      have seen this coming.
    lines: [5]
    reasons:
      - text: An empty week divides zero by zero
        correct: true
        feedback: >-
          Yes. `0 / 0` is `NaN`. Decide what an empty week shows, then test it.
      - text: The loop skips the last reading
        feedback: >-
          `for...of` visits every reading. With none to visit, line 5 divides by a length of
          zero.
      - text: "`Math.round` can't round negative numbers"
        feedback: >-
          It rounds negatives fine, so frosty weeks work. The `NaN` comes from dividing by zero
          readings.
    fix: |
      function weeklyAverage(readings) {
        if (readings.length === 0) return null; // the card says "No readings this week"
        let total = 0;
        for (const reading of readings) total += reading.celsius;
        return Math.round((total / readings.length) * 10) / 10;
      }

  - type: prose
    id: partial-failure
    body: >-
      Some failures stop halfway. A bike-share app takes a £5 deposit, then asks the dock to
      unlock a bike. If the dock is offline, the money is gone and no bike moves.


      A step that half succeeds is a **partial failure**. For every step, ask: if this one
      throws, what has already happened? Then decide who undoes it.

  - type: ai-review
    id: review-start-ride
    concept: judgment.partial-failure
    difficulty: 3
    language: js
    request: Start a ride. Take a £5 deposit, then unlock the bike.
    flawClass: logic
    code: |
      async function startRide(rider, bikeId) {
        await payments.hold(rider.cardId, 500); // £5 deposit
        await docks.unlock(bikeId);             // the dock is a remote device
        return { riderId: rider.id, bikeId, startedAt: Date.now() };
      }
    prompt: >-
      Every test used a fake dock that always unlocks. In the first rainy week, riders
      reported deposits taken and no bike. Tap the line whose failure strands the money.
    lines: [3]
    reasons:
      - text: If the unlock throws, nothing releases the deposit
        correct: true
        feedback: >-
          Yes. The hold worked, the unlock didn't, and nothing undoes the hold.
      - text: The deposit should come after the unlock
        feedback: >-
          Then a failed hold leaves a bike free with no deposit. Swapping moves the gap; it
          doesn't close it.
      - text: "`await` runs the two calls in parallel"
        feedback: >-
          `await` waits for the hold to finish before the unlock starts. They run one after
          the other.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A fake dock that throws, then check the deposit
          correct: true
          feedback: >-
            Yes. It forces the half-done state and checks that something cleans up.
        - text: A rider whose card is declined
          feedback: >-
            That fails at the first step, before anything needs undoing. The gap opens after
            the hold.
        - text: Starting 1,000 rides at once
          feedback: >-
            A load test with a dock that always works never sees an unlock fail.
    fix: |
      async function startRide(rider, bikeId) {
        const hold = await payments.hold(rider.cardId, 500);
        try {
          await docks.unlock(bikeId);
        } catch (error) {
          await payments.release(hold.id); // undo the step that worked
          throw error;
        }
        return { riderId: rider.id, bikeId, startedAt: Date.now() };
      }

  - type: prose
    id: time-is-an-edge
    body: >-
      Time is the boundary that fools careful people. Opening hours run past midnight. Users
      live in other time zones. Clocks change twice a year in many countries.


      Each of these is an edge that the happy path never reaches. So a test has to name it on
      purpose, with a fixed date and time.

  - type: predict-output
    id: predict-clock-change
    concept: judgment.time-and-boundaries
    difficulty: 3
    language: js
    code: |
      // A daily 09:00 reminder, on a server set to London time.
      const today = new Date(2026, 2, 28, 9, 0); // 28 March, 09:00
      const DAY = 24 * 60 * 60 * 1000;
      const tomorrow = new Date(today.getTime() + DAY);
      console.log(tomorrow.getHours());
    question: On 29 March, UK clocks jump from 01:00 to 02:00. What does line 5 log?
    choices:
      - text: "`9`"
        feedback: >-
          That's what the code means, not what it does. It adds 24 hours, and 29 March has only
          23.
      - text: "`10`"
        correct: true
        feedback: >-
          Right. On a 23-hour day, 24 hours after 09:00 is 10:00.
      - text: "`8`"
        feedback: >-
          The clocks jump forward, so local time runs ahead. Adding 24 real hours lands at
          10:00, not 08:00.

  - type: code-challenge
    id: write-is-open
    concept: judgment.time-and-boundaries
    difficulty: 3
    language: ts
    editable: '8'
    prompt: >-
      A night bakery sells bread from 22:00 to 06:00, and its page says "Open now". Write
      `isOpen(hours, now)`. Times are `"HH:MM"` strings in 24-hour local time.


      - Open from `opens`, included, up to `closes`, not included.

      - When `closes` is earlier than `opens`, the hours run past midnight.

      - When they're equal, the shop is open all day.


      Example: `isOpen({ opens: '22:00', closes: '06:00' }, '03:15')` is `true`.
    hints:
      - The starter works for a day shop. Try the bakery's hours at `'03:15'` and see why it fails.
      - >-
        Zero-padded strings compare in time order, so `'09:30' < '17:00'` is `true`. Past
        midnight, "open" means late evening or early morning.
      - >-
        Handle equal times first. Then `if (hours.opens < hours.closes)` is the day case, which
        the starter already gets right.

  - type: explain-back
    id: explain-stranded-deposits
    concept: judgment.partial-failure
    difficulty: 4
    audience: incident
    kind: risk
    prompt: >-
      Post an update in the incident channel about the stranded deposits. Say what else could
      fail along the same path, and how you'll check.
    rubric:
      - It names the partial failure, where the hold worked, the unlock failed and nothing released it.
      - It names another failure on the path, such as an unlock that times out after freeing the bike.
      - It says how to check, such as a test with a failing fake dock and a query for holds with no ride.
    modelAnswer: >-
      Cause found: `startRide` holds £5, then unlocks. With the dock offline, the unlock threw
      and nothing released the hold. Fix: release on failure, tested with a fake dock that
      throws. Still open on the same path: an unlock that times out may have freed the bike,
      and releasing then gives a free ride. We're listing holds older than an hour with no
      ride, and releasing those by hand.

recap:
  - List a function's failure modes across input, dependencies, concurrency and resources.
  - For every step, ask what has already happened if it throws, and undo it.
  - Test edges by name, such as an empty list, midnight or the day the clocks change.

recall:
  - id: card-four-families
    concept: judgment.failure-modes
    front: Which four families of failure do you list for a piece of code?
    back: >-
      Input from outside, dependencies, concurrency, and resources running out.
  - id: card-partial-failure
    concept: judgment.partial-failure
    front: What question finds a partial failure in a sequence of steps?
    back: >-
      For each step: if this one throws, what has already happened, and what undoes it?
  - id: card-next-day
    concept: judgment.time-and-boundaries
    front: Why doesn't adding 24 hours always give the same time tomorrow?
    back: >-
      A day with a clock change has 23 or 25 hours. Add a calendar day instead, with
      `setDate(date.getDate() + 1)`.
  - id: card-past-midnight
    concept: judgment.time-and-boundaries
    front: Hours run from 22:00 to 06:00. When is the shop open?
    back: >-
      When the time is at or after 22:00, or before 06:00. Past midnight, either side counts.

references:
  - kind: book
    title: The Art of Software Testing
    authors: Glenford J. Myers
    year: 1979
    venue: Wiley
    note: The book that named boundary-value analysis, testing at and either side of each limit.
    primary: true
    verified: false
  - kind: paper
    title: Sagas
    authors: Hector Garcia-Molina and Kenneth Salem
    year: 1987
    venue: ACM SIGMOD 1987
    note: A long task as steps that each have an undo, run in reverse when a later step fails.
    primary: true
    verified: false
  - kind: book
    title: "Release It! Design and Deploy Production-Ready Software, second edition"
    authors: Michael T. Nygard
    year: 2018
    venue: Pragmatic Bookshelf
    note: How calls to other systems fail in production, and the patterns that contain them.
    verified: false
  - kind: docs
    title: Date
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date
    note: Local time against UTC, months counted from 0, and why date maths needs care.
    verified: false

deepDive: >-
  A timeout is a third outcome, not a failure. If `docks.unlock` times out, the bike may or
  may not be free. Releasing the deposit can hand out a free ride, and keeping it can charge
  for a bike nobody got. The safe move is to record the ride as `pending` before the first
  step. Then ask the dock for the bike's state, or let a reconciliation job settle pending
  rides later.


  Undoing a step that already worked is called compensation. The pattern of steps, each
  with its compensation, is a saga. It doesn't give you a transaction: other code can see the
  half-done state in between, and a compensation can fail too. That's why the pending record
  matters. Something has to remember what still needs settling.


  JavaScript's `Date` counts months from 0, so `new Date(2026, 2, 28)` is 28 March. It works
  in the machine's local time unless you use the UTC methods. Run time-sensitive tests with a
  fixed time zone, such as `TZ=Europe/London node --test`, and pass `now` into functions
  instead of reading the clock inside them. Then a test can ask for 23:59 on the day the
  clocks change.
