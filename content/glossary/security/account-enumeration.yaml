term: account enumeration
aka: [user enumeration, username enumeration]
short: Finding out which email addresses have accounts from how a sign-in, sign-up or reset form replies.
explain: |
  "No account with that email" sounds helpful. It also tells anyone with a list of
  addresses which ones are your customers. That list feeds phishing and targeted password
  guessing.

  So login, sign-up and password reset must answer the same way whether or not the account
  exists. Same message, same status code, same redirect. Timing counts too: a reply that
  skips the password hash for unknown users comes back measurably faster.
analogy: A receptionist who says "she's not in today" instead of "nobody of that name works here". Either way you learn nothing about the staff list.
example:
  language: text
  code: |
    Leaks:  "No account found for that email."
    Safe:   "If that address has an account, we've sent a reset link."
usage: The reset page says "unknown email", which is account enumeration; give every case the same reply.
related: [credential-stuffing, authentication, rate-limiting]
level: 2
lessons: [security.abuse-and-privacy]
