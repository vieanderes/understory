term: PKCE
aka: [proof key for code exchange, code verifier, code challenge]
short: A one-time secret an app invents at sign-in, so only it can swap the returned code for tokens.
explain: |
  In the OAuth sign-in flow, the provider sends a short code back through the browser. The
  app then swaps it for tokens. If an attacker grabs that code on the way, they could swap
  it first.

  So before starting, the app invents a random secret and sends only its hash. When it
  swaps the code, it sends the secret itself. The provider checks they match. A stolen code
  is useless without the secret, which never left the app. Use it for every client, not only
  for phone apps.
analogy: Tearing a raffle ticket in half. You hand over one half now, and only your half claims the prize.
example:
  language: http
  code: |
    GET /authorize?response_type=code&client_id=app
      &code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
      &code_challenge_method=S256&state=af0ifjsldkj HTTP/1.1

    POST /token HTTP/1.1
    grant_type=authorization_code&code=SplxlOBeZQQYbYS6WxSbIA
      &code_verifier=dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
usage: The callback works, but without PKCE a code stolen from the redirect could be swapped by someone else.
related: [oauth, openid-connect, access-token, csrf]
level: 3
lessons: [backend.oauth-and-passkeys]
