id: react.props-and-composition
title: Props and children
objective: "Pass data into components with props, fill them with `children`, and show parts of the page only when a condition holds."
level: essential
minutes: 10
concepts: [react.props, react.children, react.conditional-rendering]
prerequisites: [react.what-react-is]
opening:
  text: >-
    You'll write one component and use it many times, each time with different content. And
    you'll dodge the stray `0` that turns up on almost everyone's first badge.

steps:
  - type: prose
    id: what-props-are
    body: |-
      A component is a function, and **props** are its arguments. You write them like HTML
      attributes:

      ```jsx
      function Badge({ label }) {
        return <span className="badge">{label}</span>;
      }

      <Badge label="New" />
      ```

      React collects the attributes into one object, `{ label: "New" }`, and passes it in.
      The braces in `({ label })` unpack it. Props are read-only: the parent owns them.

  - type: predict-output
    id: predict-badge-props
    concept: react.props
    difficulty: 1
    language: jsx
    code: |
      function Badge({ label }) {
        return <span className="badge">{label}</span>;
      }

      <Badge label="New" count={3} />
    question: What does the page show for this `Badge`?
    choices:
      - text: '`<span class="badge">New</span>`'
        correct: true
        feedback: >-
          Right. `Badge` only uses `label`, so `count` arrives and goes unused.
      - text: '`<span class="badge">New 3</span>`'
        feedback: >-
          `count` is passed, but nothing in `Badge` puts it on screen. A prop only shows where
          you use it.
      - text: '`<span class="badge" count="3">New</span>`'
        feedback: >-
          Props go to your function, not onto the HTML. Only what `Badge` returns reaches the
          page.

  - type: prose
    id: children-and-slots
    body: |-
      Components can wrap other content, like a `div` does. Whatever you write between the
      tags arrives as a prop called **children**:

      ```jsx
      function Card({ title, children }) {
        return <section><h2>{title}</h2>{children}</section>;
      }
      ```

      `Card` doesn't know what's inside. It only decides where it goes. Any prop can carry
      JSX this way, like `actions={<button>Delete</button>}`. In TypeScript, the type for
      anything React can draw is `React.ReactNode`.

  - type: bug-hunt
    id: hunt-missing-children
    concept: react.children
    difficulty: 2
    language: jsx
    code: |
      function Card({ title }) {
        return (
          <section className="card">
            <h2>{title}</h2>
          </section>
        );
      }

      <Card title="Tea">
        <p>Hot, with milk</p>
      </Card>
    prompt: >-
      The card shows its heading, but "Hot, with milk" never appears. No error anywhere. Tap
      the line at fault.
    lines: [1]
    reasons:
      - text: '`Card` never takes or places `children`'
        correct: true
        feedback: >-
          Right. Take `children` in the braces and put `{children}` under the heading.
      - text: A `p` can't sit inside a component
        feedback: >-
          Any JSX can go between a component's tags. It arrives as `children`, used or not.
      - text: '`title` should be written `{title}` in the tag'
        feedback: >-
          A plain string works as a prop, like an HTML attribute. The heading does show.
    fix: |
      function Card({ title, children }) {
        return (
          <section className="card">
            <h2>{title}</h2>
            {children}
          </section>
        );
      }

  - type: fill-blank
    id: fill-dialog-slots
    concept: react.children
    difficulty: 2
    language: jsx
    prompt: >-
      The dialog shows its body, then a footer with the buttons it's given. Fill the gaps.
    template: |
      function Dialog({ title, actions, children }) {
        return (
          <div className="dialog">
            <h2>{title}</h2>
            {{1}}
            <footer>{{2}}</footer>
          </div>
        );
      }

      <Dialog title="Delete photo?" {{3}}={<button>Delete</button>}>
        <p>This can't be undone.</p>
      </Dialog>
    blanks:
      - key: '1'
        answer: '{children}'
      - key: '2'
        answer: '{actions}'
      - key: '3'
        answer: actions
    bank: ['{children}', '{actions}', '{title}', actions, children, footer]

  - type: prose
    id: conditional-rendering
    body: |-
      Often part of a component should only show sometimes. Braces take any expression:

      ```jsx
      {unread > 0 && <span>{unread} new</span>}
      {online ? <p>Online</p> : <p>Away</p>}
      ```

      `a ? b : c` gives `b` when `a` is true, and `c` when it isn't. `&&` hands back one of its
      sides, like `||` in chapter 3: the right one when the left is truthy, else the left one.
      React draws nothing for `false`, `null` or `undefined`. This is **conditional
      rendering**.

  - type: predict-output
    id: predict-zero-count
    concept: react.conditional-rendering
    difficulty: 2
    language: jsx
    code: |
      function Inbox({ unread }) {
        return <p>Inbox {unread && <span>{unread} new</span>}</p>;
      }

      <Inbox unread={0} />
    question: What does the paragraph say?
    choices:
      - text: '`Inbox 0`'
        correct: true
        feedback: >-
          Right. `0 && ...` gives `0`, and React draws numbers, even zero.
      - text: '`Inbox`'
        feedback: >-
          Most people expect this. But `&&` returns the `0` itself, and React shows a number
          as text.
      - text: '`Inbox 0 new`'
        feedback: >-
          The `span` never renders, since `&&` stops at the falsy `0`. What's left is the `0`.

  - type: code-challenge
    id: build-inbox-card
    concept: react.conditional-rendering
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      `InboxCard` gets a `title`, an `unread` number and `children`. Show the title in an `h2`,
      then a `<span className="badge">` with the unread count, then the children.


      Hide the badge completely at 0, with no stray `0`. Above 9, the badge says `9+`. So
      `unread={12}` shows `9+`.
    hints:
      - Look at the `&&` line when `unread` is 0. What does `0 && anything` give?
      - The left side of `&&` should be a true or false question, like `unread > 0`.
      - "Start with `{unread > 0 && ...}`, then pick the text with `unread > 9 ? '9+' : unread`. Don't forget `children`."

  - type: explain-back
    id: explain-zero-trap
    concept: react.conditional-rendering
    difficulty: 3
    prompt: >-
      A badge written as `{count && <span>{count}</span>}` shows a lonely `0` when there's
      nothing new. Why, and how do you fix it?
    rubric:
      - '`&&` returns its left side when that side is falsy, so it gives `0`.'
      - React draws nothing for `false`, `null` and `undefined`, but it draws numbers, including 0.
      - Fix it with a real true or false on the left, like `count > 0`, or a `? :`.
    modelAnswer: >-
      `&&` doesn't give back `true` or `false`. When the left side is falsy, it returns that
      side as it is, so `0 && <span>` gives `0`. React skips `false`, `null` and `undefined`,
      but a number is something to show, so the `0` lands on the page. Writing `count > 0 &&`
      makes the left side a real `false`, which draws nothing.

recap:
  - Pass data into a component with props, and read them as one object.
  - Build containers that place `children` without knowing what's inside.
  - Show parts of the page with `&&` and `? :`, without a stray `0`.

recall:
  - id: card-props-object
    concept: react.props
    front: 'What does `Badge` receive for `<Badge label="New" count={3} />`?'
    back: >-
      One props object, `{ label: "New", count: 3 }`. It shows only what it uses.
  - id: card-children
    concept: react.children
    front: Where does content written between a component's tags end up?
    back: >-
      In its `children` prop. The component decides where to place it, or drops it by never
      using it.
  - id: card-zero-and
    concept: react.conditional-rendering
    front: What does `{items.length && <List />}` show when there are no items?
    back: >-
      A `0`. `&&` returns the falsy `0`, and React draws numbers. Write `items.length > 0 &&`.
  - id: card-props-read-only
    concept: react.props
    front: Who owns a component's props, and can the component change them?
    back: >-
      The parent owns them. The component only reads them; new values come with the next
      render from the parent.

references:
  - kind: docs
    title: Passing Props to a Component
    authors: Meta
    venue: React documentation
    url: https://react.dev/learn/passing-props-to-a-component
    note: Reading props, default values, and passing JSX as `children`.
    primary: true
    verified: true
  - kind: docs
    title: Conditional Rendering
    authors: Meta
    venue: React documentation
    url: https://react.dev/learn/conditional-rendering
    note: '`&&`, `? :` and returning `null`, with the warning about a `0` on the left of `&&`.'
    primary: true
    verified: true

deepDive: >-
  **Props are frozen in development.** Assigning `props.label = "Sale"` throws `TypeError:
  Cannot assign to read only property 'label'`. A production build skips the freeze, so the
  same line quietly works there. Never rely on that.


  **Default values.** Destructuring takes defaults, like any function: `function Avatar({
  size = 40 })`. The default applies when the prop is missing or `undefined`, not when it's
  `null` or `0`.


  **Forwarding props.** `<Card {...props} />` passes every prop along. It's handy in a thin
  wrapper, but it hides what a component accepts, so use it sparingly.
