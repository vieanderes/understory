    verified: true

deepDive: >-
  A **partial unique index** applies `UNIQUE` to some rows only. `CREATE UNIQUE INDEX ON
  subscriptions (user_id) WHERE status = 'active'` lets a user keep many cancelled
  subscriptions but only one active one.


  `ON CONFLICT (email) DO UPDATE SET name = EXCLUDED.name` is an **upsert**: insert, or update
  the row that's already there. `EXCLUDED` is the row you tried to insert.


  An exclusion constraint generalises `UNIQUE`. With the `btree_gist` extension,
  `EXCLUDE USING gist (room_id WITH =, during WITH &&)` refuses two bookings of one room whose
  times overlap.


  The room-capacity case in the lab has no one-row fix like `UNIQUE`. Keep a `bookings_left`
  counter updated with the conditional update, or run the check and insert at serializable
  isolation, as the next lesson shows.
