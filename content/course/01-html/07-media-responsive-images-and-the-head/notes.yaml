summary: >-
  Images are usually the heaviest part of a page, and the part most likely to make it feel
  broken. Until a picture's file arrives, the browser, the app
  showing the page, doesn't know its shape, so it gives it
  no space. When the file lands, everything below jumps down. The fix is two attributes,
  `width` and `height`, which let the browser reserve the right space from the start.


  The second problem is size. A phone doesn't need the same huge photo as a wide monitor.
  `srcset` lists the same picture in several widths, and the browser downloads the smallest
  one that will still look sharp on that screen. `sizes` tells it how wide the image will be
  drawn, and `picture` offers newer file formats or a different crop.


  The `head` is the other half of this lesson: the facts about a page that aren't drawn but
  change how it behaves. The character set decides whether letters display correctly. The
  `viewport` tag decides whether a phone shows your page at its own width or zoomed out. The
  `title` and `lang` attribute are what screen readers (apps that read a page aloud), browser
  tabs and search results rely on. A few lines, written once, affect every visitor.
remember:
  - Give every `img` `width` and `height` attributes matching the file's shape, so the browser reserves space before the file arrives and nothing below jumps.
  - The browser turns `width` and `height` into an aspect ratio, so the reserved space stays the right shape even when CSS, the styling language, shrinks the image to fit.
  - With `w` descriptors, the browser picks the smallest file at least as wide as the drawn width times the screen's device pixel ratio.
  - Without `sizes`, the browser assumes the image fills the whole window width, so add `sizes` for any image drawn narrower.
  - In `picture`, the `source` elements only offer files, and the `img` is what's drawn, so `alt`, `width` and `height` go on the `img`.
  - Every page needs `lang` on `html`, `meta charset="utf-8"` first in `head`, a viewport tag and a unique `title`.
  - Never block zooming in the viewport tag, because people with low vision need to enlarge text.
  - Use `loading="lazy"` for images further down the page, never for the main image at the top.
sections:
  - title: Why a missing size makes the page jump
    body: |-
      Here's a test in Chrome at phone width, 390 pixels. The page holds three images whose
      files never arrive, to freeze the moment before loading. A common style rule shrinks
      images to fit the screen.

      ```html
      <img src="trail.jpg" alt="A path along a grassy ridge" width="1600" height="900">
      <img src="view.jpg">
      <img src="sea.jpg" alt="The sea from the ridge">
      ```

      ```text
      trail.jpg   374 x 210 pixels reserved
      view.jpg    0 x 0
      sea.jpg     0 x 0
      ```

      The first image has no file yet, but it already takes up space. Chrome turned the two
      attributes into a shape, an **aspect ratio** of 1600 to 900, and then fitted that shape
      to the 374 pixels available. Its computed style reads `aspect-ratio: auto 1600 / 900`.
      So the attributes don't force the image to be 1600 pixels wide on a phone. They describe
      its proportions, and the layout does the rest.

      The other two get nothing, even the one with `alt` text. When their files land, each
      one grows and pushes everything below it down the page. That movement is called
      **layout shift**. It makes people lose their place and tap the wrong thing.

      Google measures it as Cumulative Layout Shift, one of its Core Web Vitals, a small set
      of numbers for how a page feels to use. A score of 0.1 or less counts as good. Images
      without dimensions are one of the most common causes of a bad score, and the cheapest
      to fix.

      Use the file's real pixel size. Your image editor or the file's details in your
      computer's file browser will show it.
  - title: How the browser picks a file from srcset
    body: |-
      Screens differ in how many physical dots they pack into each pixel of your layout. That
      number is the **device pixel ratio**, or DPR. An older laptop has 1. Most phones have 2
      or 3. A slot 400 pixels wide on a phone with DPR 2 needs an 800-pixel file to look sharp.

      With `w` descriptors, the browser works it out for you:

      1. Find the width the image will be drawn at, from `sizes`, or the whole window width
         if there's no `sizes`.
      2. Multiply by the device pixel ratio.
      3. Pick a file at least that wide, preferring the smallest.

      Here's what Chrome chose for one image in several set-ups, all tested:

      ```html
      <img src="trail-800.jpg" alt="A path along a grassy ridge"
           srcset="trail-480.jpg 480w, trail-800.jpg 800w, trail-1600.jpg 1600w">
      ```

      ```text
      window 400, DPR 1   needs 400    ->  trail-480.jpg
      window 400, DPR 2   needs 800    ->  trail-800.jpg
      window 400, DPR 3   needs 1200   ->  trail-1600.jpg
      window 1440, DPR 1  needs 1440   ->  trail-1600.jpg
      ```

      The HTML Standard lets each browser make its own final choice. A browser may pick a file it already has in its cache, and the standard
      also allows a smaller one on a slow connection. So test with
      an empty cache, and don't write code that depends on one exact file loading. The
      `currentSrc` property of the image tells you which file was used.
  - title: sizes, density descriptors and picture
    body: |-
      Without `sizes`, the browser assumes an image fills the window. For a photo in a
      two-column layout on a 1440-pixel screen, that means downloading the 1600-pixel file
      for a slot a fraction of the size. `sizes` fixes the guess:

      ```html
      <img src="trail-800.jpg" alt="A path along a grassy ridge"
           srcset="trail-480.jpg 480w, trail-800.jpg 800w, trail-1600.jpg 1600w"
           sizes="(min-width: 800px) 50vw, 100vw">
      ```

      Read it as: on windows at least 800 pixels wide, the image is drawn at half the window,
      `50vw`. Otherwise it's the full width, `100vw`. The browser needs this hint because it
      picks the file while it's still reading the HTML, before the page's layout exists. In a
      test with `sizes="300px"` on a 1440-pixel window, Chrome picked `trail-480.jpg` at DPR 1
      and `trail-800.jpg` at DPR 2.

      For an image that's always the same size, like a logo, use density descriptors:

      ```html
      <img src="logo.png" srcset="logo.png 1x, logo@2x.png 2x" alt="City Library" width="100" height="50">
      ```

      On a DPR 2 screen, Chrome loaded `logo@2x.png`, a 200-pixel file, and still drew it 100
      pixels wide.

      `picture` goes one step further. Its `source` elements offer alternatives, and the
      browser takes the first one it can use:

      ```html
      <picture>
        <source srcset="soup.avif" type="image/avif">
        <source srcset="soup.webp" type="image/webp">
        <img src="soup.jpg" alt="A bowl of tomato soup" width="1200" height="800">
      </picture>
      ```

      AVIF and WebP are newer formats that make smaller files. A browser that can't decode a
      `type` skips that `source`. A `source` with `media="(max-width: 600px)"` can offer a
      different crop to narrow screens instead. Whatever is chosen, the `img` is the element
      that's drawn and announced, so it carries `alt`, `width` and `height`.
  - title: Lazy loading, figures and video
    body: |-
      `loading="lazy"` tells the browser to wait until an image is near the visible part of
      the page before downloading it. In a test, a lazy image 5,000 pixels down wasn't
      requested at all until the page was scrolled to it. On a long page of photos that saves
      a lot of data.

      ```html
      <img src="gallery-12.jpg" alt="Wild orchids by the path" width="800" height="600" loading="lazy">
      ```

      Don't use it on the main image at the top. That one should load as early as possible.
      Google's Largest Contentful Paint, another Core Web Vital, measures how long the biggest
      thing on screen takes to appear, and delaying it makes the score worse.

      When an image needs a visible caption, wrap it in `figure` with a `figcaption`:

      ```html
      <figure>
        <img src="visits.png" alt="Line chart of visits rising each month" width="800" height="400">
        <figcaption>Visits per month, 2025</figcaption>
      </figure>
      ```

      Chrome exposes a figure named by its caption, holding the image named by its `alt`. The
      two do different jobs: the caption is for everyone, the `alt` replaces the picture.
      Don't copy one into the other.

      Video follows the same ideas:

      ```html
      <video controls width="1280" height="720" poster="walk-poster.jpg">
        <source src="walk.mp4" type="video/mp4">
        <track kind="captions" src="walk.en.vtt" srclang="en" label="English">
      </video>
      ```

      `controls` shows the play button and volume. `poster` is the picture shown before
      playing. The `track` adds captions from a text file. WCAG 2.2, the Web Content
      Accessibility Guidelines, requires captions for recorded video with sound in success
      criterion 1.2.2, Captions (Prerecorded), level A.
  - title: A complete head, line by line
    body: |-
      Here's a head you can start every page from:

      ```html
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ridge trail: a 6 km coastal walk</title>
          <meta name="description" content="A 6 km walk along a grassy ridge, with sea views.">
          <link rel="icon" href="/icon.svg">
        </head>
      ```

      Each line earns its place.

      - **`lang="en"`** says what language the page is in. Screen readers use it to pick a
        voice and pronunciation. WCAG 2.2 success criterion 3.1.1, Language of Page, level A,
        requires it.
      - **`charset`** tells the browser how to turn the file's bytes into letters. The
        standard requires it within the first 1024 bytes of the file, so put it first. Without
        it, accented letters and symbols can turn into strange characters.
      - **`viewport`** makes a phone lay the page out at its own width. In a test with a
        390-pixel phone, Chrome laid the page out 980 pixels wide without the tag, then
        shrank it. With the tag, the page was 390 pixels wide.
      - **`title`** names the tab, bookmarks and the search result. It's usually the first thing a screen reader says on arrival. WCAG 2.2 success criterion 2.4.2, Page Titled, level A,
        requires a title that describes the page. Make each one unique, with the specific
        part first.
      - **`description`** is a summary search engines may show under the title. They may
        also write their own.
      - **`link rel="icon"`** sets the small tab icon.

      One thing never to add: `user-scalable=no` or `maximum-scale=1` in the viewport tag.
      They stop people zooming in, which fails WCAG 2.2 success criterion 1.4.4, Resize Text,
      level AA.
pitfalls:
  - '**Leaving out `width` and `height`.** The page looks fine on a fast connection, so the jump goes unnoticed. On a slow phone, everything below the image moves. Add the file''s pixel size.'
  - '**Using `srcset` without `sizes` for a narrow image.** The browser assumes full window width and downloads a file far bigger than the slot. Add `sizes` that match how wide the image is drawn.'
  - '**Lazy-loading the main image.** The most important picture on the page then waits for layout before it even starts downloading. Keep `loading="lazy"` for images further down.'
  - '**Putting `alt` on a `source`.** Only the `img` inside `picture` is drawn and announced. Put `alt`, `width` and `height` on the `img`.'
  - '**Blocking zoom in the viewport tag.** `maximum-scale=1` looks tidy but stops people with low vision enlarging text. Use `width=device-width, initial-scale=1` and nothing more.'
  - '**Giving every page the same title.** Tabs, bookmarks and screen reader users can''t tell the pages apart. Put the page''s own subject first, then the site name if you like.'
verify:
  - lens: breaks
    check: 'Every `img` has `width` and `height` matching the files shape, so the page doesnt jump while images load.'
  - lens: breaks
    check: 'Every page has `lang`, `meta charset="utf-8"` first, a viewport tag that allows zooming and a unique `title`.'
  - lens: scales
    check: 'Large photos come in several widths with `srcset` and `sizes`, so a phone never downloads a file sized for a wide monitor.'
  - lens: breaks
    check: 'The main image at the top never uses `loading="lazy"`, because delaying it slows the part people see first.'
  - lens: tests
    check: 'Each page is loaded with a slow connection in the developer tools, watching for jumps and for image files bigger than theyre drawn.'
interview:
  - question: How do you stop images from causing layout shift?
    answer: >-
      Put `width` and `height` attributes on every `img`, matching the file's pixel size. Browsers turn them into an aspect ratio in their built-in styles.
      So even when CSS makes the image fluid, the right space is reserved before the file
      arrives. Without them the image's box starts with no height, then grows when the
      file lands, pushing content down. That's measured as Cumulative Layout Shift, a Core Web
      Vital where 0.1 or less is good. The same applies to `video`, embeds and anything
      injected later, like adverts, which need reserved space too. In `picture`, the
      dimensions go on the `img`. The trade-off is keeping them in sync: if a design swaps
      the crop, the attributes must change with it.
  - question: Explain srcset and sizes. How does the browser pick an image?
    answer: >-
      `srcset` lists candidate files with their real widths, like `trail-800.jpg 800w`, and
      `sizes` tells the browser how wide the image will be drawn. The browser multiplies the
      drawn width by the device pixel ratio and picks the smallest candidate at least that
      wide. On a 400-pixel phone with a ratio of 2, it needs 800 pixels, so it takes the
      800-wide file. It needs `sizes` because it chooses while parsing, before layout; without
      it, it assumes the full window width and often overfetches. For fixed-size images I use
      `1x` and `2x` descriptors instead. The standard leaves the final choice to the browser. It may prefer a
      cached file, so I never depend on one exact file loading.
  - question: What goes in the head of every page, and why?
    answer: >-
      A `meta charset="utf-8"` first, a viewport tag, a unique `title`, and `lang` on the
      `html` element, plus usually a description and an icon. The charset must come within the
      first 1024 bytes so the browser decodes the letters correctly from the start. The
      viewport tag, `width=device-width, initial-scale=1`, makes phones lay out at their own
      width rather than about 980 pixels shrunk down. The `title` names the tab and the search
      result, and it's usually the first thing a screen reader announces,
      which is WCAG 2.4.2. The
      `lang` attribute sets pronunciation, WCAG 3.1.1. The description may appear in search
      results. What I leave out matters too: never `user-scalable=no` or `maximum-scale=1`,
      because blocking zoom fails WCAG 1.4.4.
