id: sysdesign.estimation
title: Back-of-the-envelope estimation
objective: Estimate requests per second, peak load, storage and bandwidth from users and behaviour, and turn a latency target into a budget.
level: essential
minutes: 10
concepts: [sysdesign.qps-estimation, sysdesign.storage-estimation, sysdesign.latency-numbers]
prerequisites: [sysdesign.the-method]
opening:
  text: >-
    You'll turn "10 million users" into requests per second, terabytes and milliseconds, and
    let code do the sums. Those three numbers decide whether one database is enough.

steps:
  - type: prose
    id: why-estimate
    body: |-
      An estimate isn't a maths test. Its job is to tell you which kind of design you need:
      one server, a cache and replicas, or data split across many machines.

      In an interview, say your assumptions out loud and round hard. The interviewer often
      hands you the numbers. Nobody needs the exact figure, only its size.

  - type: prose
    id: name-qps
    body: |-
      Load is counted in requests per second, often called **QPS**, queries per second. It
      comes from a short chain:

      ```text
      per day    = daily users × actions each
      per second = per day ÷ 86,400 seconds
      peak       = per second × a peak factor
      ```

      Traffic isn't even, so assume a peak of two or three times the average, and say so.
      Count reads and writes separately.

  - type: multiple-choice
    id: pick-design-band
    concept: sysdesign.qps-estimation
    difficulty: 1
    question: >-
      Your estimate says 12,000 reads a second at peak. One database serves about 5,000.
      What does the design need?
    choices:
      - text: A cache or read replicas in front
        correct: true
        feedback: >-
          Yes. The reads outgrow one database, so spread or absorb them.
      - text: Nothing, one database is plenty
        feedback: >-
          12,000 is more than twice what it serves. The peak would swamp it.
      - text: Fifty databases, each with a share
        feedback: >-
          Splitting data is for writes or size one machine can't hold. Reads have cheaper fixes.

  - type: code-challenge
    id: write-estimate
    concept: sysdesign.storage-estimation
    difficulty: 2
    language: ts
    prompt: >-
      Let code do the sums. Write `estimate(load)`. Return `averagePerSecond` and
      `peakPerSecond`, each rounded up with `Math.ceil`, and `storageBytes`.


      Use exactly 86,400 seconds a day. The peak is the exact average times `peakFactor`, then
      rounded up. Storage is actions per day × `bytesPerAction` × `retentionDays` ×
      `replicas`.


      One million users with one action each gives 12 a second on average.
    hints:
      - Everything starts from one number, the actions per day.
      - Round only at the end. Rounding the average first would change the peak.
      - Start with `const perDay = load.dailyUsers * load.actionsPerUser;`

  - type: prose
    id: name-storage
    body: |-
      Storage follows the same pattern:

      ```text
      records per day × bytes each × days kept × copies
      ```

      Run your function on a chat app: 10 million users sending 40 messages of 200 bytes,
      kept a year, three copies. It plans for about 88 TB, plus room for indexes. That's
      more than one disk, so storage shapes this design as much as load.

  - type: ai-review
    id: review-minutes-not-seconds
    concept: sysdesign.qps-estimation
    difficulty: 2
    language: ts
    request: Write a helper that estimates peak requests per second for capacity planning.
    flawClass: logic
    code: |
      function peakPerSecond(dailyUsers: number, actionsPerUser: number) {
        const perDay = dailyUsers * actionsPerUser;
        const perSecond = perDay / (24 * 60);
        return Math.ceil(perSecond * 3);
      }
    prompt: >-
      An assistant wrote this. Its test only checked that the result is a whole number. The
      plan it produced asked for 60 times the servers you need. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`24 * 60` counts minutes, not seconds'
        correct: true
        feedback: >-
          Yes. Dividing by minutes makes the rate 60 times too high.
      - text: A peak factor of 3 is too high
        feedback: >-
          Three is a common assumption. It triples the answer, it doesn't multiply it by 60.
      - text: '`Math.ceil` should be `Math.round`'
        feedback: >-
          Rounding changes the answer by less than one. The error here is 60 times.
    fix: |
      const perSecond = perDay / (24 * 60 * 60);

  - type: prose
    id: name-latency-numbers
    body: |-
      Time has its own rough scale, the **latency numbers**. A µs is a millionth of a
      second, a ns a billionth.

      ```text
      read from main memory              100 ns
      random 4 KB read from an SSD        16 µs
      round trip in the same datacentre  500 µs
      California to the Netherlands      150 ms  (and back)
      ```

      Each row is tens to hundreds of times the one above. Crossing an ocean inside a loop is
      slow, whatever the code does.

  - type: ai-review
    id: review-query-loop
    concept: sysdesign.latency-numbers
    difficulty: 3
    language: ts
    request: Load the 20 dishes on a menu page.
    flawClass: performance
    code: |
      async function loadMenu(dishIds: string[]) {
        const dishes = [];
        for (const id of dishIds) {
          dishes.push(await db.query('SELECT * FROM dishes WHERE id = $1', [id]));
        }
        return dishes;
      }
    prompt: >-
      An assistant wrote this. It was quick in tests. Then the database moved to another
      continent, and the page takes three seconds. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Each dish waits for its own round trip
        correct: true
        feedback: >-
          Yes. Twenty trips across an ocean add up. Fetch them in one query.
      - text: '`SELECT *` reads too many columns'
        feedback: >-
          Extra columns cost little. The time goes on waiting, not on bytes.
      - text: The loop should use `forEach`
        feedback: >-
          `forEach` doesn't wait for promises, and the queries would still be 20 trips.
    fix: |
      async function loadMenu(dishIds: string[]) {
        return db.query('SELECT * FROM dishes WHERE id = ANY($1)', [dishIds]);
      }

  - type: explain-back
    id: explain-rough-is-enough
    concept: sysdesign.qps-estimation
    difficulty: 3
    prompt: >-
      Your estimate says 12,000 requests a second at the peak, but it could be off by half.
      Why is it still useful for the design?
    rubric:
      - Design choices change at orders of magnitude, not at small differences.
      - 12,000 against 1,200 or 120,000 decides the architecture, and a factor of two rarely does.
      - The estimate makes assumptions visible, so they can be checked and corrected.
    modelAnswer: >-
      Designs change at orders of magnitude. At 120 a second one server and one database are
      plenty. At 12,000 you need a cache, several servers and read replicas. At a million you
      split the data. Being off by half keeps you in the same band, so the design holds. The
      numbers also put my assumptions on the table, where someone can correct them.

recap:
  - Get requests per second from users, actions and 86,400 seconds, then add a peak factor.
  - Get storage from records, bytes, days kept and copies.
  - Know the latency scale, from nanoseconds in memory to 150 ms across an ocean.
recall:
  - id: card-seconds-per-day
    concept: sysdesign.qps-estimation
    front: Which number turns a daily count into a per-second rate?
    back: >-
      The seconds in a day, 86,400. Divide by it, then apply a peak factor.
  - id: card-peak-factor
    concept: sysdesign.qps-estimation
    front: Why multiply the average rate by a peak factor?
    back: >-
      Traffic isn't even across the day. Systems must survive the busiest hour, often two or
      three times the average.
  - id: card-storage-formula
    concept: sysdesign.storage-estimation
    front: What do you multiply to estimate storage?
    back: >-
      Records per day, bytes per record, days kept, and the number of copies. Then add room
      for indexes.
  - id: card-latency-ladder
    concept: sysdesign.latency-numbers
    front: Roughly how long is a round trip inside one datacentre, and across an ocean?
    back: >-
      About half a millisecond in a datacentre. About 150 ms between California and the
      Netherlands.

