term: fan-out on read
aka: [pull model, read fan-out, fan-out-on-read]
short: Building a feed when it is opened, by gathering recent posts from every account followed.
explain: |
  Nothing happens when someone posts. When you open your feed, the system fetches recent
  posts from each account you follow and merges them.

  Writes stay cheap, and a post from a huge account costs nothing extra. Reads get
  expensive for someone who follows thousands of accounts. That's why many feeds use both,
  pulling only for the few accounts with enormous followings.
analogy: Walking to the newsagent and picking up each paper you want, every time you want to read.
usage: Use fan-out on read for accounts above a million followers, and merge them into the stored feed.
twin:
  term: fan-out-on-write
  difference: Fan-out on read does the work when a feed is opened, so writes are cheap. Fan-out on write does it when a post is made, so reads are cheap.
related: [fan-out-on-write, hot-key, cache, cursor-pagination]
level: 3
lessons: [sysdesign.case-news-feed]
