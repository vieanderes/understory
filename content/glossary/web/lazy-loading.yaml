term: lazy loading
aka: [lazy-load, loading="lazy"]
short: Waiting to fetch an image, file or piece of code until it is about to be needed.
explain: |
  A long page may have fifty images, and most visitors never scroll to the bottom. Fetching
  all of them up front wastes data and slows the part people do see.

  `loading="lazy"` on an image or iframe fetches it only as it nears the screen. The trap
  is the image already on screen: lazy-loading the main image delays it and hurts LCP. Load
  the first screen eagerly and everything below the fold lazily.
analogy: A waiter who brings dessert menus only when you've finished your main course.
example:
  language: html
  code: |
    <img src="/hero.avif" fetchpriority="high" alt="...">
    <!-- far down the page -->
    <img src="/gallery-12.avif" loading="lazy" width="400" height="300" alt="...">
usage: Lazy loading the gallery cut the first load from 6 MB to 900 KB.
twin:
  term: code-splitting
  difference: Lazy loading is when to fetch something, only once it's needed. Code splitting is how JavaScript gets cut into separate files, so there is something to fetch later.
related: [code-splitting, largest-contentful-paint, cumulative-layout-shift]
level: 1
lessons: [perf.web-vitals, perf.shipping-less-javascript]
