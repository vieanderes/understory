term: cascade
aka:
  - the cascade
  - CSS cascade
short: The process that picks one winning value when several style rules set the same property.
explain: |
  Your stylesheet says the heading is blue. Another rule says it's grey. Both match. The
  browser can only paint one colour, so it needs a fair way to decide.

  It checks in order. First origin and `!important`, then cascade layers, then specificity. Last comes source order, where the later rule wins a tie. Most "my CSS doesn't work" bugs are a rule losing this contest. The browser's dev tools show the losers struck through.
analogy: A tie-break in a competition. If the scores are level, the next rule decides, then the next, until someone wins.
example:
  language: css
  code: |
    p { color: grey; }
    .intro { color: navy; }   /* wins: more specific */
    p { color: teal; }        /* loses to .intro, wins over the first p */
usage: The theme rule loses in the cascade because it's in an earlier file with a weaker selector.
twin:
  term: specificity
  difference: The cascade is the whole contest for which value wins. Specificity is one round of it, the score a selector earns from its IDs, classes and element names.
related:
  - specificity
  - cascade-layer
level: 1
lessons:
  - css.cascade
