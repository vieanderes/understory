deepDive: >-
  In script, `dialog.showModal()` does what `command="show-modal"` does, and
  `dialog.close()` closes it. React code usually holds the dialog in a ref, as in the fix
  above.


  A modal makes the rest of the page **inert**: it can't be clicked, focused or found by a
  screen reader. In Chromium, Tab from the last control inside can still move to the
  browser's own toolbar, but never to the page behind.


  Put `autofocus` on the control that should get focus first. For a destructive question,
  that's often Cancel, so a stray Enter does no harm.


  Give `details` elements the same `name` and only one stays open at a time: an accordion
  with no script. `popover` with `popovertarget` gives a floating panel that closes on
  Escape or a click outside.


  The full tabs pattern also links each tab to its panel with `aria-controls`, and names each
  panel with `aria-labelledby` pointing at its tab.
