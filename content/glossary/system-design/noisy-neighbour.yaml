term: noisy neighbour
aka: [noisy neighbor]
short: One customer whose heavy use of shared resources makes the service slow for everyone else.
explain: |
  Customers on one system share workers, connections and disks. When one of them enqueues
  fifty thousand jobs, every customer who arrives afterwards waits behind all of them. The
  system is healthy and has capacity, yet most people see it as broken.

  The cures limit how much one customer can take. Schedule queued work per customer in turn,
  not in arrival order. Cap the workers, connections or rate one customer may use. Watch the
  oldest waiting job per customer, because a healthy average hides a starved one.
analogy: The flat upstairs running three washing machines at once, so your shower runs cold.
usage: One tenant's export is a noisy neighbour again; give each tenant its own queue and a cap on workers.
related: [multi-tenancy, bulkhead, starvation, rate-limiting]
level: 2
lessons: [scale.fair-queues, arch.tenants]
