term: state
aka:
  - component state
  - useState
short: A value React remembers for a component between draws, changed through a setter function.
explain: |
  A plain variable in a component resets every time React calls the function. To remember a
  count or an open menu, ask React with `useState`. You get the value and a setter.

  Calling the setter doesn't change the variable you're holding. It asks React to draw the
  component again, with the new value. That's why reading it straight after setting it shows
  the old one: each draw sees a snapshot.
analogy: A sticky note on a whiteboard. To change it, you hand a new note to the person at the board, and they redraw.
example:
  language: tsx
  code: |
    function Counter() {
      const [count, setCount] = useState(0);
      return (
        <button onClick={() => setCount(count + 1)}>
          Clicked {count} times
        </button>
      );
    }
usage: The filter text is state in the list, so the search box can't see it.
twin:
  term: props
  difference: State is owned by the component and changed with its setter. Props are handed in by the parent and never changed by the child.
related:
  - props
  - re-render
  - lifting-state-up
  - ref
level: 1
