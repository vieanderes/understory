deepDive: >-
  The snippets here ran against MSW 3.0.2 and Testcontainers 12.2.0 on Node 24. MSW 3 renamed
  the unhandled-request option: `server.listen({ onUnhandledFrame: 'error' })` makes a request
  with no handler fail with `Cannot bypass a request when using the "error" strategy`. In MSW
  2 the same option is `onUnhandledRequest`. The default in both only warns, and lets the
  request carry on to the real network.


  A strict schema belongs on the fixture check, where a new value should make noise. Your
  production code should be the opposite: tolerant of a status it doesn't know, with a
  fallback label, because the vendor won't wait for your release.


  Contract tests from the last lesson suit two teams who can both run them. A third-party
  vendor won't verify your pact, so a scheduled re-recording against their sandbox plays
  that role. It runs on a timer rather than in their build, so it finds drift a day later,
  not before they ship.


  A Testcontainers PostgreSQL run printed `duplicate key value violates unique constraint
  "loans_book_id_key"` for a repeated insert, the error a fake array never raises. Start one
  container per test file or per run, not per test, and isolate tests with rolled-back
  transactions as in lesson 5. Starting a container per test turns seconds into minutes.
