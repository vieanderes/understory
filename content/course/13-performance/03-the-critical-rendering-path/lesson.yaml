id: perf.critical-rendering-path
title: What keeps the screen blank
objective: Say what the browser needs before its first paint, unblock scripts with `defer` and `async`, and load the main image and fonts early.
level: essential
minutes: 10
concepts: [perf.critical-rendering-path, perf.render-blocking, perf.resource-hints, perf.lcp-assets]
prerequisites: [perf.web-vitals, html.media-and-head, css.typography]
opening:
  text: >-
    You'll spot what keeps a page white while it loads, and move it out of the way. It's
    often one tag, and the fix is often one word.

steps:
  - type: prose
    id: the-path
    body: >-
      When HTML arrives, the browser **parses** it: reads the tags into the DOM. It reads the
      CSS too. Then it works out every box's size and place, called **layout**, and
      **paints** the pixels.


      Before the first paint it needs the HTML so far and all of the CSS. That route from
      bytes to pixels is the **critical rendering path**. Anything on it keeps the screen
      white.

  - type: predict-output
    id: predict-slow-stylesheet
    concept: perf.critical-rendering-path
    difficulty: 1
    language: html
    code: |
      <head>
        <!-- this file takes 2 s to arrive -->
        <link rel="stylesheet" href="site.css">
      </head>
      <body>
        <h1>Hello</h1>
      </body>
    question: The HTML arrives at once. When does "Hello" show on screen?
    choices:
      - text: At once, unstyled at first
        feedback: >-
          Most people pick this. The browser won't paint unstyled text and restyle it. It
          waits for the CSS.
      - text: After about 2 seconds
        correct: true
        feedback: >-
          Right. In Chromium it painted at 2,048 ms. Without the stylesheet, 28 ms.
      - text: After every image has loaded
        feedback: >-
          Painting doesn't wait for images. It waits for the HTML so far and the CSS.

  - type: prose
    id: blocking-scripts
    body: >-
      A plain `<script src>` is **parser-blocking**. The parser stops at the tag, waits for
      the file, runs it, then carries on. Nothing below it can paint meanwhile: a 2-second
      script in the head held "Hello" back 2,024 ms.


      Two attributes fix that. With `defer`, the file downloads while parsing goes on, and
      runs when parsing ends, in page order. With `async`, it runs the moment it arrives, in
      any order.

  - type: playground
    id: fix-blocking-scripts
    concept: perf.render-blocking
    difficulty: 2
    prompt: >-
      Both scripts in the head stop the parser. `app.js` needs the finished page, so give it
      `defer`. `analytics.js` needs nothing, so give it `async`.
    html: |
      <!doctype html>
      <html lang="en">
        <head>
          <title>Opening hours</title>
          <script src="analytics.js"></script>
          <script src="app.js"></script>
        </head>
        <body>
          <h1>Opening hours</h1>
          <p>Monday to Friday, 9 till 5.</p>
        </body>
      </html>
    checks:
      - label: '`app.js` has `defer`'
        selector: 'script[src="app.js"]'
        attribute: { name: defer }
      - label: '`analytics.js` has `async`'
        selector: 'script[src="analytics.js"]'
        attribute: { name: async }
    solution:
      html: |
        <!doctype html>
        <html lang="en">
          <head>
            <title>Opening hours</title>
            <script src="analytics.js" async></script>
            <script src="app.js" defer></script>
          </head>
          <body>
            <h1>Opening hours</h1>
            <p>Monday to Friday, 9 till 5.</p>
          </body>
        </html>
    hints:
      - An attribute goes inside the opening tag, after `src="..."`.
      - '`<script src="app.js" defer></script>`, and the same shape with `async` for the other.'

  - type: prose
    id: lazy-images
    body: >-
      `loading="lazy"` on an image says "fetch this only when it's near the screen". It
      saves data on images far down the page.


      The catch: the browser can't know what's near the screen until layout is done. So a
      lazy image waits for the CSS before it even starts to download. For the page's main
      image, that wait lands straight on LCP.

  - type: bug-hunt
    id: hunt-lazy-hero
    concept: perf.lcp-assets
    difficulty: 2
    language: html
    code: |
      <head>
        <link rel="stylesheet" href="site.css">
      </head>
      <body>
        <img src="hero.jpg" alt="A path along a ridge"
             width="800" height="400" loading="lazy">
        <h1>Walks near you</h1>
        <!-- three screens further down -->
        <img src="map.jpg" alt="Map of the routes"
             width="800" height="400" loading="lazy">
      </body>
    prompt: >-
      The hero at the top is this page's LCP element, and LCP is slow. `site.css` takes a
      second to arrive. Tap the line at fault.
    lines: [6]
    reasons:
      - text: The lazy hero waits for layout before starting
        correct: true
        feedback: >-
          Right. We measured: lazy, it started at 1,022 ms. Eager, at 5 ms.
      - text: '`width` and `height` slow the image down'
        feedback: >-
          They cost nothing. They reserve the space, which keeps CLS at zero. Keep them.
      - text: The map should be eager too
        feedback: >-
          The map is three screens down, so lazy suits it. The hero is what people see first.
    fix: |
      <img src="hero.jpg" alt="A path along a ridge"
           width="800" height="400" fetchpriority="high">

  - type: prose
    id: preload-and-priority
    body: >-
      Some files the browser finds late. A web font is named inside the CSS, so it isn't
      fetched until the CSS arrives. `<link rel="preload">` says "fetch this now", and `as`
      says what it is.


      Fonts are always fetched in CORS mode, so a font preload needs `crossorigin`, or the
      browser fetches it twice. And `fetchpriority="high"` moves one file up the queue, such
      as the main image.

  - type: fill-blank
    id: fill-preload-font
    concept: perf.resource-hints
    difficulty: 2
    language: html
    prompt: Fetch the body font early, and put the hero image first in the queue. Fill the gaps.
    template: |
      <link rel="{{1}}" href="/fonts/body.woff2"
            as="{{2}}" type="font/woff2" crossorigin>
      <img src="/hero.jpg" alt="A path along a ridge"
           width="800" height="400" fetchpriority="{{3}}">
    blanks:
      - key: '1'
        answer: preload
      - key: '2'
        answer: font
      - key: '3'
        answer: high
    bank: [preload, stylesheet, font, style, high, lazy]

  - type: ai-review
    id: review-preload-no-crossorigin
    concept: perf.resource-hints
    difficulty: 3
    language: html
    request: Preload our body font so the text doesn't flash.
    flawClass: performance
    code: |
      <head>
        <link rel="preload" href="/fonts/body.woff2"
              as="font" type="font/woff2">
        <link rel="stylesheet" href="/site.css">
      </head>
    prompt: >-
      An assistant wrote this. The page looks right, so a quick look passes it. But the
      network panel lists `body.woff2` twice. Tap the line at fault.
    lines: [2, 3]
    reasons:
      - text: The font preload is missing `crossorigin`
        correct: true
        feedback: >-
          Yes. Without it the preload doesn't match the CORS-mode font request.
      - text: '`as="font"` should be `as="style"`'
        feedback: >-
          `as` names what the file is, and this is a font. `style` is for a stylesheet.
      - text: The preload must come after the stylesheet
        feedback: >-
          Early is the point of a preload. Order isn't why the file downloads twice.
    verify:
      question: 'How would you prove the fix worked?'
      choices:
        - text: 'The network panel lists `body.woff2` once'
          correct: true
          feedback: >-
            Yes. One request means the preload matched the font fetch.
        - text: 'The text still looks right after a reload'
          feedback: >-
            It looked right before the fix too. The extra download never showed on screen.
        - text: 'Lighthouse''s score goes up a little'
          feedback: >-
            Scores wobble between runs. A small rise could be noise, not this fix.
    fix: |
      <link rel="preload" href="/fonts/body.woff2"
            as="font" type="font/woff2" crossorigin>

  - type: explain-back
    id: explain-white-screen
    concept: perf.critical-rendering-path
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A page's HTML arrives in 100 ms. The screen stays white for two seconds, then
      everything appears at once. What would you look for, and how would you fix it?
    rubric:
      - The first paint needs the parsed HTML and all the CSS, so a slow stylesheet holds it back.
      - A plain script in the head stops the parser, so the content below it can't paint yet.
      - Make the CSS smaller or faster, and mark scripts `defer` or `async`.
    modelAnswer: >-
      The HTML isn't the hold-up, so something on the critical rendering path is. The
      browser paints nothing until all the CSS is in. A plain script in the head stops the
      parser too. One of those took two seconds. I'd find it in the network panel,
      shrink the CSS, and put `defer` or `async` on the script.

recap:
  - 'Name what blocks the first paint: stylesheets, and plain scripts above the content.'
  - Unblock scripts with `defer` or `async`, and fetch late-found fonts with a preload.
  - Keep the main image eager and high priority, and lazy-load only what's far down.

recall:
  - id: card-what-blocks-paint
    concept: perf.critical-rendering-path
    front: What does the browser need before it can paint the first frame?
    back: >-
      The HTML parsed so far and all of the CSS.
  - id: card-defer-vs-async
    concept: perf.render-blocking
    front: How do `defer` and `async` differ in when the script runs?
    back: >-
      `defer` runs after parsing ends, in page order. `async` runs on arrival, in any order.
  - id: card-font-preload
    concept: perf.resource-hints
    front: What does a font preload need besides `rel="preload"`?
    back: >-
      `as="font"` and `crossorigin`. Without `crossorigin` the font downloads twice.
  - id: card-lazy-hero
    concept: perf.lcp-assets
    front: Why shouldn't the main image have `loading="lazy"`?
    back: >-
      A lazy image waits for layout before it starts to download, and that delay lands on LCP.

references:
  - kind: spec
    title: 'HTML Standard: the script element'
    authors: WHATWG
    venue: WHATWG
    url: https://html.spec.whatwg.org/multipage/scripting.html
    note: When classic, `defer`, `async` and module scripts run.
    primary: true
    verified: true
  - kind: docs
    title: Understand the critical path
    authors: Chrome team
    venue: web.dev
    url: https://web.dev/learn/performance/understanding-the-critical-path
    note: Which resources block rendering, which block the parser, and why.
    verified: true
  - kind: docs
    title: Preload critical assets to improve loading speed
    authors: Houssein Djirdeh, Jeremy Wagner and Milica Mihajlija
    venue: web.dev
    url: https://web.dev/articles/preload-critical-assets
    note: Preload, the `as` attribute, and why fonts need `crossorigin`.
    verified: true
  - kind: docs
    title: Optimize Largest Contentful Paint
    authors: Philip Walton and Barry Pollard
    venue: web.dev
    url: https://web.dev/articles/optimize-lcp
    note: Never lazy-load the LCP image, and raise it with `fetchpriority`.
    verified: true

deepDive: >-
  The numbers here come from Chromium against a local server that delays each file. A
  stylesheet with `media="print"` isn't render-blocking, because its media doesn't match the
  screen. It still downloads, at the lowest priority.


  While the parser is blocked, a **preload scanner** reads ahead in the raw HTML and starts
  fetching images, scripts and stylesheets it finds. That's why the eager hero started at
  5 ms, even behind a slow stylesheet. It can't see inside CSS, which is why fonts need a
  preload.


  `type="module"` scripts are deferred by default. Preload sparingly: everything marked
  urgent competes with the CSS that the first paint is waiting for.


  Image bytes matter too. AVIF and WebP files are usually far smaller than JPEG at the same
  quality, and `srcset` from the HTML chapter lets a phone fetch a smaller file.
