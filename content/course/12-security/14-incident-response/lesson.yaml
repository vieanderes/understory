id: security.incident-response
title: Incident response
objective: Handle a leaked key or a taken-over account step by step, contain it first, and write a review without blame.
level: advanced
minutes: 10
concepts: [security.ir-lifecycle, security.containment, security.blameless-postmortem]
prerequisites: [security.detection-and-logging, security.secrets]
opening:
  text: >-
    You'll know what to do, in order, when a key leaks or an account is taken over. Calm
    steps beat panic, and the review will fix the system, not blame a person.

steps:
  - type: prose
    id: what-an-incident-is
    body: >-
      An **incident** is a security problem happening now. Say a teammate pushed an API key for
      your email service to a public repository. This morning your logs show that key sending
      thousands of emails from an address you don't know.


      Everyone on call meets something like this. The people who handle it well aren't
      smarter. They follow a plan they agreed on before anything went wrong.

  - type: prose
    id: the-lifecycle
    body: >-
      That plan is the incident **lifecycle**, six phases in order:


      1. **Prepare**: plans, contacts and logs, before anything happens.

      2. **Detect**: an alert or a report says something is wrong.

      3. **Contain**: stop the damage growing.

      4. **Eradicate**: remove the cause, such as the key in the code.

      5. **Recover**: bring the service back safely.

      6. **Review**: learn what to change.

  - type: multiple-choice
    id: pick-phase-for-revoke
    concept: security.ir-lifecycle
    difficulty: 1
    question: You switch the leaked email key off so it stops working. Which phase is that?
    choices:
      - text: Contain
        correct: true
        feedback: >-
          Right. It stops the damage growing, before you know how the key leaked.
      - text: Eradicate
        feedback: >-
          Close, but eradicating removes the cause: the key in the repository. Switching it off stops the damage.
      - text: Recover
        feedback: >-
          Recovering brings the service back with a new key. First, the old one has to stop working.

  - type: prose
    id: containment
    body: >-
      **Containment** limits the damage before you fix the cause. **Revoke** the leaked key:
      switch it off at the provider, so it stops working everywhere at once. For a taken-over
      account, sign it out of every session and lock it.


      Contain before you clean up. Every minute the key still works, it sends more emails.
      And keep the evidence: the logs show what the key did, and who was affected.

  - type: multiple-choice
    id: pick-containment-for-account
    concept: security.containment
    difficulty: 2
    question: >-
      Someone took over a customer's account and is changing their payout details. What do you
      do first?
    choices:
      - text: Sign the account out everywhere and lock it
        correct: true
        feedback: >-
          Yes. That cuts the attacker off now. Then you find out how they got in.
      - text: Read the logs to learn how they got in
        feedback: >-
          You'll need that, but the attacker is still in the account. Cut them off first.
      - text: Delete the account and start fresh
        feedback: >-
          That destroys the evidence and the customer's data. Lock it, then investigate.

  - type: parsons
    id: order-leaked-key-response
    concept: security.ir-lifecycle
    difficulty: 3
    language: text
    prompt: >-
      The email key leaked in a public repository. Put the response in lifecycle order. One
      step doesn't belong.
    blocks:
      - id: revoke-key
        code: 'contain: revoke the leaked key at the email provider'
      - id: remove-from-code
        code: 'eradicate: remove the key from the code, and add a check that blocks secrets in commits'
      - id: new-key
        code: 'recover: create a new key, store it outside the code, redeploy'
      - id: write-review
        code: 'review: write up what happened and what will change'
    distractors:
      - id: delete-logs
        code: 'clean up: delete the logs that show the key being used'
        feedback: >-
          Those logs are the evidence. They show who got emails and what else the key touched.

  - type: ai-review
    id: review-account-takeover-plan
    concept: security.containment
    difficulty: 3
    language: text
    request: Write our runbook for when a customer's account is taken over.
    flawClass: logic
    code: |
      alert: an account changed its email and payout details
      step_1: sign the account out everywhere and lock it
      step_2: clear the account's activity log to undo the attacker's changes
      step_3: restore the email and payout details, reset the password
      step_4: unlock the account and tell the customer what happened
      step_5: write up what happened
    prompt: >-
      An assistant wrote this runbook, and the customer gets their account back. A month later,
      the same attacker takes over ten more accounts the same way. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Clearing the log destroys how they got in
        correct: true
        feedback: >-
          Yes. The log showed how they got in. Keep it, and close that way in.
      - text: Locking the account should come after the reset
        feedback: >-
          Locking first cuts the attacker off. Resetting while they're signed in leaves them in.
      - text: The customer shouldn't be told
        feedback: >-
          Telling them is right, and often a legal duty. The lost evidence is the problem.
    fix: |
      alert: an account changed its email and payout details
      step_1: sign the account out everywhere and lock it
      step_2: read the activity log: how did they get in, what did they change?
      step_3: restore the email and payout details, reset the password
      step_4: close the way in they used, for every account
      step_5: unlock, tell the customer, and write a blameless review

  - type: prose
    id: blameless
    body: >-
      The last phase is a **post-mortem**, a written review of what happened. A **blameless**
      one looks for the system causes, not a person to blame. Not "Sam pushed the key", but
      "nothing stopped a key reaching a public repository".


      Blame teaches people to hide the next incident. A blameless review asks what let the
      mistake through, so the fix holds whoever is at the keyboard.

  - type: ai-review
    id: review-postmortem-draft
    concept: security.blameless-postmortem
    difficulty: 3
    language: text
    request: Draft the post-mortem for the leaked email key.
    flawClass: logic
    code: |
      summary: our email key was used to send 40,000 spam emails
      timeline: pushed Monday 18:02, revoked Tuesday 09:15
      cause: Sam was careless and pushed a file with the key in it
      action: remind everyone to be more careful with keys
    prompt: >-
      An assistant drafted this. It's quick and accurate. Next quarter, a different person
      leaks a different key the same way. Tap the line at fault.
    lines: [3]
    reasons:
      - text: It blames a person, so the system never changes
        correct: true
        feedback: >-
          Right. Ask why a key could reach a public repository at all, then fix that.
      - text: The timeline needs the exact seconds
        feedback: >-
          Minutes are plenty here. The review misses the cause, not precision.
      - text: The summary should leave out the number of emails
        feedback: >-
          The scale belongs in the summary. The cause names a person instead of a gap.
    fix: |
      summary: our email key was used to send 40,000 spam emails
      timeline: pushed Monday 18:02, revoked Tuesday 09:15
      cause: keys lived in a file in the repo, and nothing blocked a commit containing one
      action: move keys to the host's secret settings; add a secret check to every commit

  - type: explain-back
    id: explain-blameless-summary
    concept: security.blameless-postmortem
    difficulty: 4
    prompt: >-
      Write the two or three lines your team reads first about the leaked email key: what
      happened, why it could happen, and what changes. No names.
    rubric:
      - Says what happened and what damage it did.
      - Names the system gap that let it happen, not the person who pushed the key.
      - Gives a change that stops the same leak whoever makes the next mistake.
    modelAnswer: >-
      From Monday evening to Tuesday morning, a leaked email key sent spam from our account
      until we revoked it. The key sat in a file in the repository. Nothing checked commits for secrets, so one
      push made it public. Keys now live in the host's secret settings, and every commit is
      scanned for secrets before it's accepted.

recap:
  - 'Work an incident in order: contain the damage before you remove the cause.'
  - Revoke a leaked key or lock a taken-over account first, and keep the logs as evidence.
  - Review blamelessly, fixing the gap that let the mistake through, not the person.

recall:
  - id: card-lifecycle
    concept: security.ir-lifecycle
    front: What are the phases of incident response, in order?
    back: >-
      Prepare, detect, contain, eradicate, recover, review.
  - id: card-contain-first
    concept: security.ir-lifecycle
    front: Why contain before you eradicate?
    back: >-
      The damage keeps growing while you investigate. Stop it first, then find and remove the cause.
  - id: card-revoke-key
    concept: security.containment
    front: A key has leaked. What is the first thing you do with it?
    back: >-
      Revoke it at the provider, so it stops working everywhere. Removing it from the code comes later.
  - id: card-blameless
    concept: security.blameless-postmortem
    front: Why are post-mortems blameless?
    back: >-
      Blame makes people hide incidents. A fix to the system holds whoever is at the keyboard.

references:
  - kind: docs
    title: 'Incident Response Recommendations and Considerations for Cybersecurity Risk Management: A CSF 2.0 Community Profile'
    authors: A. Nelson, S. Rekhi, M. Souppaya and K. Scarfone
    year: 2025
    venue: NIST Special Publication 800-61 Revision 3
    url: https://csrc.nist.gov/pubs/sp/800/61/r3/final
    note: The current NIST guidance, which replaced Revision 2 and its lifecycle in April 2025.
    primary: true
    verified: true
  - kind: docs
    title: Computer Security Incident Handling Guide
    authors: P. Cichonski, T. Millar, T. Grance and K. Scarfone
    year: 2012
    venue: NIST Special Publication 800-61 Revision 2
    url: https://csrc.nist.gov/pubs/sp/800/61/r2/final
