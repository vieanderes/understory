term: golden set
aka:
  - golden dataset
  - gold set
short: A small, hand-checked list of questions with known right answers, used to score an AI system.
explain: |
  You change a prompt, and a few answers look better. Did the system improve, or did you
  only look at the ones that improved? Without fixed questions, you can't tell.

  So you write twenty to fifty real questions first. For each, you note the right answer
  and the source that holds it. Add a few the system should refuse. Every change runs
  against the same set, and the numbers say whether it helped.

  Small and checked by a person beats large and guessed. Grow it from real failures: each
  bug a user reports becomes a new case.
analogy: The same set of test recipes a bakery bakes each time it changes oven. Same inputs, so the results compare.
usage: Add that wrong answer to the golden set before you touch the prompt.
