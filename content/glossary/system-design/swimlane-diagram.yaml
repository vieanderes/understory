term: swimlane diagram
aka:
  - swimlane
  - swim lane
  - cross-functional flowchart
short: A flowchart split into rows or columns, one per actor, so you see who does each step.
explain: |
  A workflow has several hands in it: a person, an AI step, the system itself. A plain
  flowchart hides who owns what.

  Give each actor a lane, and put each step in the lane of whoever does it. Arrows that
  cross lanes are hand-offs, and hand-offs are where work gets stuck or lost.

  It's a good first drawing for any process with people in it. It shows where a human
  must approve and where an AI acts alone.
analogy: Lanes in a swimming pool. Each swimmer stays in their own, and you see who's where.
usage: Put the reviewer in their own lane on the swimlane diagram, so the approval step is obvious.
related:
  - sequence-diagram
  - state-diagram
  - human-in-the-loop
level: 2
lessons:
