term: label
aka: [form label, label element]
short: Visible text tied to a form field that names it, read out when the field gets focus.
explain: |
  A box with no text beside it is a guessing game. The `label` element names a field, and
  linking the two with `for` and `id` does more. Screen readers announce it, and clicking
  the text puts the cursor in the box.

  The link is what matters. Text that only sits nearby looks right but isn't connected, so a
  screen reader says "edit text" and nothing else.
analogy: The name on a door. It stays there as long as you need it, even after you've walked in.
example:
  language: html
  code: |
    <label for="email">Email address</label>
    <input id="email" name="email" type="email">
usage: That checkbox has no label, so the screen reader only says "checkbox, not checked".
twin:
  term: placeholder
  difference: A label stays visible and is announced as the field's name. A placeholder is faint hint text inside the box that disappears as soon as someone types.
related: [placeholder, html-form, accessible-name]
level: 1
lessons: [html.forms, design.forms-that-help]
