summary: >-
  A form is a conversation. The page asks, the person answers, and the page says what it
  needs next. Every field needs a name that stays visible, a hint when the answer has a
  format, and an error that says what went wrong and how to fix it. Each of those must reach
  a screen reader too, which means linking them in the markup, not only placing them nearby.


  The machinery is small. A `label` gives the field its accessible name. `aria-describedby`
  adds a description, read after the name. `aria-invalid` flags a wrong answer, and a
  `fieldset` with a `legend` names a group of choices. On top of that, `autocomplete` lets
  the browser fill in what it already knows, and `inputmode` picks the right phone keyboard.


  Timing matters as much as markup. Check on submit, then move focus to the problem: the
  first field, or an error summary on a long form. Don't shout at someone halfway through
  typing. WCAG 2.2 turns most of this into success criteria, from 3.3.1 Error Identification
  to the newer 3.3.7 Redundant Entry and 3.3.8 Accessible Authentication (Minimum).
remember:
  - Every field needs a visible label linked by `for` and `id`, because a placeholder vanishes as soon as someone types.
  - '`aria-describedby` makes hints and errors part of the field''s description, read in the order the ids are listed.'
  - An error message names the problem and the fix, such as "Enter a postcode, like SW1A 1AA", never only "Invalid".
  - Validate when the person submits, move focus to the first problem, and only then recheck a field as they correct it.
  - '`autocomplete` tokens such as `email`, `postal-code`, `cc-number` and `one-time-code` let browsers fill fields and help WCAG 1.3.5 Identify Input Purpose.'
  - Use `inputmode="numeric"` on a text field for codes and card numbers, and keep `type="number"` for quantities you might step up and down.
  - A radio group or a set of related fields needs a `fieldset` whose `legend` states the question.
  - WCAG 2.2 criterion 3.3.8 means a login must not depend on memorising or transcribing, so allow paste and password managers.
sections:
  - title: What a screen reader hears for a field
    body: |-
      A screen reader announces a field as name, role, state, then description. The browser
      computes the **accessible name** from the first source that exists, in this order:
      `aria-labelledby`, then `aria-label`, then a `label`, then `title`, and finally
      `placeholder` as a last resort. Chromium 153 reports these:

      ```html
      <!-- textbox "Card number": the placeholder is a fallback name -->
      <input placeholder="Card number">

      <!-- textbox "Postcode", invalid, required,
           description "Enter a full postcode For example, SW1A 1AA" -->
      <label for="postcode">Postcode</label>
      <input id="postcode" required aria-invalid="true"
             aria-describedby="postcode-error postcode-hint">
      <p id="postcode-hint">For example, SW1A 1AA</p>
      <p id="postcode-error">Enter a full postcode</p>

      <!-- group "Delivery speed", then radio "Standard" -->
      <fieldset>
        <legend>Delivery speed</legend>
        <label><input type="radio" name="speed"> Standard</label>
      </fieldset>
      ```

      Three details follow from this. The description joins the texts in the order of the
      ids in `aria-describedby`, not the order on screen. So list the error first if it
      should be heard first. Text referenced by `aria-describedby` is read even when it's
      `hidden`, which is handy for a hint only screen readers need, and a trap if a stale
      error stays linked. Clear the attribute when the error goes.

      `required` is announced as "required", so the label doesn't need to say it for a
      screen reader. A label of "Name *" is read as "Name star" by some screen readers.
      Say "(optional)" on the few optional fields, or explain the asterisk once at the top.

      ARIA also has `aria-errormessage`, which points at an error only while
      `aria-invalid="true"`. Chromium exposes it that way, but screen reader support has been
      uneven, so `aria-describedby` remains the dependable choice.
  - title: Helping people type less
    body: |-
      The fastest field is one the browser fills in. `autocomplete` names what a field is
      for, using tokens from the HTML standard:

      ```html
      <label for="full-name">Full name</label>
      <input id="full-name" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">

      <label for="postcode">Postcode</label>
      <input id="postcode" autocomplete="postal-code">

      <label for="card">Card number</label>
      <input id="card" inputmode="numeric" autocomplete="cc-number">

      <label for="code">Code from the text message</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code">

      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password">
      ```

      Other common tokens: `given-name`, `family-name`, `tel`, `street-address`,
      `address-line1`, `country-name`, `bday`, `username`, `current-password`, `cc-name`,
      `cc-exp` and `cc-csc`. `new-password` tells a password manager to suggest a strong
      one, and `current-password` to fill the saved one. WCAG 2.2 criterion 1.3.5 Identify
      Input Purpose (Level AA) asks for these tokens on fields that collect information about
      the user.

      `inputmode` chooses the on-screen keyboard without changing what the field accepts. Its
      values are `none`, `text`, `decimal`, `numeric`, `tel`, `search`, `email` and `url`.
      That's why a card number is `inputmode="numeric"` on a text field rather than
      `type="number"`. A number input is meant for quantities: it can show a spinner, and the
      arrow keys, or in some browsers the scroll wheel, change the value. Its `valueAsNumber` also turns `0012`
      into `12`. Card numbers, postcodes and codes are strings of digits, not quantities.

      Two more ways to save typing. Don't ask twice: WCAG 2.2 criterion 3.3.7 Redundant
      Entry (Level A) wants information already given in the same process to be filled in or
      offered, like a "same as delivery address" option. And ask only what you need. Every
      field removed is one nobody can get wrong.
  - title: When to validate, and the error summary
    body: |-
      Validating too early punishes people. An email field that turns red after the first
      letter is telling someone off for not having finished. A good rhythm:

      1. Check a field when the person leaves it only if it's clearly wrong, or wait for
         submit.
      2. On submit, show every error at once and move focus to the first problem.
      3. Once a field has shown an error, recheck it as they type, so the message goes away
         the moment it's fixed.

      CSS has this built in. `:invalid` matches a bad value from page load. `:user-invalid`
      matches only after the person has interacted with the field, so style errors with
      `:user-invalid`. Many teams add `novalidate` to the form and show their own messages,
      because the browser's bubbles disappear, can't be styled and vary between browsers.

      On a long form, lead with an **error summary**: a heading and a list of links to each
      problem, focused when the form fails.

      ```js
      function showSummary(form, errors) {
        const summary = form.querySelector("#error-summary");
        const list = summary.querySelector("ul");
        list.replaceChildren(
          ...errors.map(({ id, message }) => {
            const link = document.createElement("a");
            link.href = `#${id}`;
            link.textContent = message;
            const item = document.createElement("li");
            item.append(link);
            return item;
          }),
        );
        summary.hidden = false;
        summary.focus(); // the container has tabindex="-1"
        document.title = `Error: ${document.title.replace(/^Error: /, "")}`;
      }
      ```

      With `<div id="error-summary" tabindex="-1" hidden>`, an `h2` "There is a problem"
      and an empty `ul` inside, the screen reader reads the heading and the list on focus.
      Each link jumps to its field, whose own message is linked with `aria-describedby`.
      Prefixing the page title with "Error:" helps too, because the title is the first thing
      announced when a page reloads with errors after a server-side check.
  - title: The WCAG 2.2 criteria behind a good form
    body: |-
      Most form advice maps to a numbered success criterion. Knowing the numbers helps in an
      audit and in an interview.

      - **1.3.1 Info and Relationships (A)**: labels, groups and required states are in the
        markup, not only visible. That's `label`, `fieldset` and `legend`.
      - **1.3.5 Identify Input Purpose (AA)**: fields about the user carry `autocomplete`
        tokens.
      - **2.5.3 Label in Name (A)**: the accessible name contains the visible label text, so
        a voice user can say "click Email".
      - **3.3.1 Error Identification (A)**: an error found automatically is identified, and
        described to the user in text.
      - **3.3.2 Labels or Instructions (A)**: fields that need input have labels or
        instructions.
      - **3.3.3 Error Suggestion (AA)**: when a fix is known, suggest it: "Enter a date in
        the past", not "Invalid date".
      - **3.3.4 Error Prevention (Legal, Financial, Data) (AA)**: for orders, payments and
        legal commitments, let people review, correct or reverse before it's final.
      - **3.3.7 Redundant Entry (A)**, new in 2.2: don't make people retype what they
        already gave in the same process, unless that's essential, needed for security, or
        the earlier answer is no longer valid.
      - **3.3.8 Accessible Authentication (Minimum) (AA)**, new in 2.2: no step of logging
        in may rely on a cognitive function test, such as remembering a password or solving
        a puzzle, unless there's an alternative or a mechanism to help. Allowing paste and
        password managers counts as help. Recognising objects or your own content is an
        allowed exception at AA.
      - **3.3.9 Accessible Authentication (Enhanced) (AAA)** removes those two exceptions.
      - **4.1.3 Status Messages (AA)**: a message like "Saved" is announced without moving
        focus, through a live region.

      In practice 3.3.8 rules out blocking paste in password fields and a login that asks
      you to type characters 3, 5 and 8 of a secret, because both defeat password managers.
pitfalls:
  - '**Using a placeholder as the label.** It saves space in a mock-up, and a screen reader even reads it as a fallback name. It vanishes once someone types, and pale grey often fails contrast. Use a visible `label`, and keep placeholders for examples, if at all.'
  - '**Error text that only looks attached.** Red text under a field reads as linked to the eye, so it looks done. Screen readers hear nothing until you point `aria-describedby` at it and set `aria-invalid="true"`.'
  - '**Validating on every keystroke from the start.** Instant feedback feels helpful to build, but it flags half-typed answers as wrong. Check on submit or on leaving a field, then live only after an error has been shown.'
  - '**`type="number"` for digit strings.** Card numbers and codes are made of digits, so the type feels right. It adds a spinner, lets arrow keys change the value and treats `0012` as 12. Use a text field with `inputmode="numeric"`.'
  - '**Blocking paste in password fields.** It sounds like security, but it forces people to type a password from memory and breaks password managers, which fails WCAG 3.3.8. Allow paste.'
  - '**Leaving stale errors linked.** The message is hidden after a fix, yet `aria-describedby` still points at it, and hidden descriptions are still read. Remove the id and `aria-invalid` when the error clears.'
verify:
  - lens: breaks
    check: 'Every field has a visible `label`, and no placeholder stands in for one.'
  - lens: breaks
    check: 'Error messages are linked with `aria-describedby`, fields get `aria-invalid`, and both are removed when the error clears.'
  - lens: confuses
    check: 'Each error message says how to fix the problem, not only that something is wrong.'
  - lens: tests
    check: 'The form is submitted empty with a screen reader running, checking focus moves to the first error and it is read aloud.'
interview:
  - question: Why isn't a placeholder enough as a label?
    answer: >-
      Because it disappears the moment someone types, so nothing on screen says what the
      field was for. That hurts anyone checking their answers, and people with memory or
      attention difficulties most. Placeholder text is also usually pale grey, which often
      fails the 4.5 to 1 contrast rule, and it can be mistaken for a filled-in value.
      Browsers do use a placeholder as a last-resort accessible name, so a screen reader may
      announce it, but the sighted problems remain. The fix is a visible `label` linked with
      `for` and `id`, which also enlarges the click target. A hint with a format example
      belongs in text under the label, linked with `aria-describedby`. Placeholders are fine
      for a short example, never as the only name.
  - question: Walk me through accessible error handling on a checkout form.
    answer: >-
      On submit I validate everything, then make each error visible, linked and focused. For
      each bad field I show a message that says how to fix it, like "Enter the 3 digits on
      the back of your card", and satisfy 3.3.1 and 3.3.3. I set `aria-invalid="true"` and add
      the message id to `aria-describedby`, so the field is announced as invalid with the
      message. On a short form I move focus to the first bad field. On a long one I show an
      error summary at the top, a heading plus links to each field, and focus that. I prefix
      the page title with "Error:". As the user corrects a field I recheck it live, and
      remove the message and attributes when it's fixed. Colour is never the only signal.
  - question: When should a form validate its fields?
    answer: >-
      Mostly on submit, and live only after a field has already shown an error. Validating on
      every keystroke from the start flags answers that aren't finished yet, which is
      confusing and noisy for screen reader users. Checking when a field loses focus is a
      reasonable middle ground for clear-cut formats, like a malformed email address. After
      submit, focus moves to the first problem and each message says how to fix it. From
      then on, rechecking as the person types is kind, because the error clears the moment
      it's fixed. In CSS, `:user-invalid` supports this rhythm: unlike `:invalid`, it only
      matches after interaction. The exception is a constraint people can't guess, such as
      a username being taken, where early feedback saves a wasted submit.
  - question: What does WCAG 2.2 criterion 3.3.8 mean for a login page?
    answer: >-
      Accessible Authentication (Minimum), Level AA, says no step of logging in may depend on
      a cognitive function test unless there's an alternative or help. Remembering a password
      and transcribing a code are cognitive tests, so the page must support the help:
      password managers must be able to fill the field, and paste must work. That rules out
      blocking paste, splitting a one-time code into boxes that break paste, and asking for
      characters 3, 5 and 8 of a secret. Alternatives that pass include passkeys, a link
      sent by email and a one-time code that can be pasted or autofilled with
      `autocomplete="one-time-code"`. A puzzle CAPTCHA fails unless another method is
      offered. At AA, recognising objects is allowed. The AAA criterion, 3.3.9, removes that
      exception.
