summary: >-
  A bug-fix task hands you code you did not write, a failing test and a limit on how many
  lines you may change. The limit is the point: it tests whether you can find the cause by
  reading, rather than rewriting until the tests go green. Refactor tasks test the same skill
  from the other side: change the structure, keep the behaviour.


  Both formats appear as online test types and as the first phase of AI-enabled live rounds,
  where a small slip sits in ordinary multi-file code before the main feature. The bugs are
  rarely algorithmic. They are off-by-one bounds, wrong comparisons, strings where numbers
  were meant, functions that change their arguments, and missing awaits.


  The method is always the same. Run the failing test, read what it expects, follow the data
  through the code to the line where it goes wrong, and change that line. For a refactor, pin
  the behaviour with tests first, then move in small steps and run the tests after each one.
remember:
  - >-
    Run the failing test first and read its expectation; the failure and the code together
    point at the cause.
  - >-
    Fix the line that produces the wrong value, not the output; a patch on the result passes one
    test and breaks another.
  - >-
    Most bug-fix tasks come from four slips: an off-by-one bound, a wrong comparison, a string
    where a number was meant, and a function that mutates its argument.
  - >-
    `sort`, `reverse` and `splice` change the array they are called on; `toSorted`, `toReversed`
    and `toSpliced` return a copy.
  - >-
    A line limit means a rewrite is not an answer, and a submission that changes nothing
    scores zero.
  - >-
    Before refactoring, pin the current behaviour with tests, then change one small thing at a
    time and run them after each change.
  - >-
    When the fix is a character or two, type it yourself; reviewers watch whether you reach
    for the assistant for small things.
sections:
  - title: A playbook for a bug-fix task
    body: |-
      1. **Read the task's rules.** How many lines may change? Which files? Is the assistant
         allowed in this phase?
      2. **Run the tests.** Read the names of the failing ones. A name such as "a guest
         arriving on the checkout day does not clash" tells you the case before you read any
         code.
      3. **Read the expectation, then the code it calls.** Start at the entry point the test
         uses and follow the data. Note every place a value is transformed or compared.
      4. **Form one hypothesis and test it by reasoning.** "The comparison treats a shared
         boundary day as an overlap." Check it against a passing test too: a good hypothesis
         explains why those pass.
      5. **Change the smallest thing that fixes the cause.** Usually one operator, one bound
         or one copy.
      6. **Run every test, not only the failing one.** A fix that turns one test green and
         another red is a patch.
      7. **Say the fix in one sentence** if a person is watching: what was wrong, why, and why
         this change covers every case.

      An ideal answer to the booking task in this lesson changes two lines: both comparisons
      become strict (`booking.start < end && booking.end > start`), and the sort works on a
      copy (`[...rooms].sort()`). Nothing else moves. The explanation is two sentences: stays
      that touch on a checkout day share no night, and the function must not reorder the
      caller's list.
  - title: The usual suspects, with proof
    body: |-
      Beyond the four classic slips, a handful of JavaScript behaviours cause most bugs in
      these tasks. Each line below was run on Node 24.

      ```js
      // 1. `||` treats 0 and '' as missing. `??` only replaces null and undefined.
      const discount = 0;
      console.log(discount || 10, discount ?? 10); // 10 0

      // 2. forEach does not wait for async callbacks.
      const saved = [];
      const save = (x) => new Promise((resolve) => setTimeout(() => { saved.push(x); resolve(); }, 1));
      async function saveAllBroken(items) {
        items.forEach(async (item) => { await save(item); });
        return saved.length;
      }
      async function saveAllFixed(items) {
        for (const item of items) await save(item);
        return saved.length;
      }
      saveAllBroken(['a', 'b'])
        .then((n) => {
          console.log('broken sees', n); // broken sees 0
          return saveAllFixed(['c', 'd']);
        })
        .then((n) => console.log('fixed sees', n)); // fixed sees 4

      // 3. A date string without a time is read as UTC midnight, not local midnight.
      console.log(new Date('2026-10-01').toISOString()); // 2026-10-01T00:00:00.000Z

      // 4. An empty array is truthy, so check its length.
      const errors = [];
      console.log(errors ? 'has errors' : 'clean', errors.length > 0 ? 'has errors' : 'clean');
      // has errors clean
      ```

      Add to these the classics: `==` converting types, `parseInt` without a radix, a `var`
      in a loop captured by callbacks, a missing `return` in an arrow function with
      braces, and a mutable default shared between calls. When you read unfamiliar code, scan
      for these first, because they are cheap to spot.
  - title: Refactoring safely with a characterisation test
    body: |-
      A refactor task says "keep the behaviour", but the existing tests may cover only part of
      it. A **characterisation test** records what the old code does on many inputs, right or
      wrong, and demands the new code does the same. It is the fastest way to earn the
      confidence to restructure.

      ```js
      import assert from 'node:assert/strict';

      function shippingBefore(order) {
        let fee = 0;
        if (order) {
          if (order.items.length > 0) {
            if (order.country === 'GB') {
              if (order.total >= 50) {
                fee = 0;
              } else {
                fee = 4.99;
              }
            } else {
              if (order.express) {
                fee = 19.99;
              } else {
                fee = 12.5;
              }
            }
          } else {
            fee = null;
          }
        } else {
          fee = null;
        }
        return fee;
      }

      // After: guard clauses first, then one decision per line.
      function shippingAfter(order) {
        if (!order || order.items.length === 0) return null;
        if (order.country === 'GB') return order.total >= 50 ? 0 : 4.99;
        return order.express ? 19.99 : 12.5;
      }

      const orders = [null, undefined, { items: [], country: 'GB', total: 80 }];
      for (const country of ['GB', 'FR']) {
        for (const total of [0, 49.99, 50, 120]) {
          for (const express of [false, true]) {
            orders.push({ items: ['x'], country, total, express });
          }
        }
      }
      assert.deepEqual(orders.map(shippingAfter), orders.map(shippingBefore));
      console.log(`same result on ${orders.length} inputs`); // same result on 19 inputs
      ```

      Pick inputs from every branch and every boundary (49.99 and 50 here). Then refactor in
      named steps, each small enough to undo: introduce a guard clause, extract a helper,
      rename a variable, replace a flag with an early return. Run the check after each one. If
      a step breaks it, you know exactly which step, and you undo only that.
  - title: Reading an unfamiliar project quickly
    body: |-
      Multi-file bug phases give you a file tree and a few minutes. Read in this order:

      - **The failing test**, for the expected behaviour and the entry point.
      - **The types or interfaces**, for what each value is supposed to be. A field typed as a
        number that arrives from JSON or a form as a string is a planted bug waiting to be found.
      - **The call path** from the entry point to where the value is produced. Skip everything
        off that path.
      - **Every write to the value that is wrong.** Search the project for the variable or
        property name and read each assignment.

      Say what you are doing as you go: "The test expects 11; `sumLast` returns 5. The loop
      stops at `length - 1`, so the last reading is never added." In AI-enabled rounds some
      interviewers restrict the assistant during this phase, and candidates who found the bug
      by reading gave the strongest early signals. If the assistant is allowed, use it to
      explain an unfamiliar API, not to find the bug for you.
pitfalls:
  - >-
    **Editing before running the tests.** A guess made before reading the failure often fixes
    the wrong thing. Run the tests, read the names and expectations, then open the code.
  - >-
    **Patching the output.** Adding 1 to a total or special-casing the failing input passes one
    test and leaves the cause. Find the line that produced the wrong value and change that.
  - >-
    **Rewriting the function.** It breaks the line limit and risks new bugs. The task wants the
    one fault fixed in place.
  - >-
    **Fixing one side of a symmetric bug.** An overlap check has two comparisons, and a boundary
    bug usually sits in both. Test both sides: a stay that ends on the day another starts, and
    one that starts on the day another ends.
  - >-
    **Refactoring without a safety net.** Tests that only cover the happy path let a behaviour
    change slip through, as the unaudited unverified orders showed. Add characterisation tests
    for every branch first.
  - >-
    **Prompting for a one-character fix.** Reviewers read it as not understanding the code.
    Type small fixes yourself and explain them.
interview:
  - question: >-
      Walk me through how you would debug a failing test in a codebase you have never seen.
    answer: >-
      I start from the test, not the code. I run it, read its name and the expected versus
      actual values, and find the entry point it calls. Then I follow the data along that one
      path, noting each place the value is transformed or compared, until I find where it
      first goes wrong. I form one hypothesis and check it explains the passing tests too.
      Then I make the smallest change at the cause and run the whole suite, not only the
      failing test. If reading does not find it, I add a log or a breakpoint at the midpoint
      of the path and bisect. The trade-off is patience: reading first feels slower, but it
      avoids fixes that move the bug somewhere else.
  - question: >-
      What is the difference between fixing a symptom and fixing the cause? Give an example.
    answer: >-
      A symptom fix adjusts the output for the case you saw; a cause fix changes the line
      that produced the wrong value, so every case is right. For example, a function that sums
      the last n readings returns 5 instead of 11 because the loop stops at `length - 1`.
      Returning `total + readings.at(-1)` passes that test, but `sumLast(readings, 0)` now
      returns the last reading instead of 0. Changing the bound to `i < readings.length` fixes
      every case. The signal I look for is whether the fix mentions the failing input's
      specifics. If it does, it is probably a patch.
  - question: >-
      How do you refactor legacy code that has few tests?
    answer: >-
      I pin the current behaviour first with characterisation tests: I call the code with
      inputs from every branch and boundary and record whatever it returns, right or wrong.
      Then I refactor in small, named steps: add a guard clause, extract a helper, rename,
      and run the tests after each. If one fails, I know which step caused it and undo only
      that. I keep behaviour changes, even bug fixes I spot, out of the refactor and do them
      separately afterwards, so a reviewer can see which commit changed behaviour. The
      trade-off is that characterisation tests also lock in existing bugs, so I note any
      suspicious outputs for a follow-up rather than fixing them silently.
  - question: >-
      In an AI-enabled round, would you use the assistant to find the bug?
    answer: >-
      Usually not for finding it, and I would check whether it is allowed in that phase.
      Planted bugs are small: an off-by-one, a wrong comparison, a string where a number was
      expected. Reading the failing test and following the data finds them in a few minutes,
      and it shows the interviewer I understand the code. I would use the assistant to
      explain an unfamiliar library call or to draft extra tests around the fix. If I did ask
      it about the bug, I would state my own hypothesis first and treat its answer as a second
      opinion to verify, not as the fix.
