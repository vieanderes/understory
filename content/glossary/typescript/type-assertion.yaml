term: type assertion
aka:
  - as cast
  - type cast
short: Telling the checker to treat a value as a given type with `as`, with no check while running.
explain: |
  `const user = data as User` makes the error go away. Nothing checks it, now or later. If
  `data` isn't a user, the program crashes somewhere else, far from the cause.

  Treat every `as` as a small debt. It's fine when you know more than the checker, as with
  `as const`. For outside data, parse it or use a type guard instead.
analogy: Writing "checked" on a parcel you never opened. The next person trusts the label.
example:
  language: ts
  code: |
    const res = await fetch('/api/user');
    const user = (await res.json()) as User; // trusted, not checked
    user.email.toLowerCase(); // crashes if email is missing
usage: That type assertion hides a missing field; parse the response instead.
twin:
  term: satisfies
  difference: An assertion with `as` overrides the checker and can lie. `satisfies` asks the checker to confirm the value fits, and keeps the value's own exact type.
related:
  - type-guard
  - narrowing
  - any-type
level: 2
lessons:
  - ts.typing-the-boundary
