summary: >-
  The page you see is drawn from the **DOM**, a tree of objects the browser builds from the
  HTML. Every element is an object with properties you can read and change from JavaScript.
  Change the object and the browser redraws the page to match. This lesson covers the three
  moves behind most interactive pages: read what someone typed, switch a class to change a
  look, and add or remove elements.


  Each move has a safe way and a risky way. Text goes in with `textContent`, which shows it as
  plain characters. `innerHTML` parses its string as HTML, so text a visitor typed can become
  a live element with a script attached. That bug has a name, **cross-site scripting** (XSS),
  and it is one of the most common security flaws on the web.


  Changing the DOM also has a cost. The browser works out sizes and positions (layout) before
  it paints, and some reads force it to do that work at once. Code that mixes reads and writes
  in a loop can make a page stutter. Knowing when layout runs is what separates DOM code that
  works from DOM code that stays fast with a thousand rows.
remember:
  - "`textContent` inserts text as plain characters, while `innerHTML` parses the string as HTML, so never give `innerHTML` anything a user typed."
  - A form field's `value` is always a string, a checkbox's state lives in `checked`, and a number input also offers `valueAsNumber`.
  - "`classList.add`, `remove` and `toggle` change one class and keep the rest, while assigning `className` replaces them all."
  - Keep looks in CSS and switch classes from JavaScript, so the script says what state an element is in, not how it looks.
  - Build elements with `createElement`, fill them with `textContent`, and insert them with `append` or `replaceChildren`, and appending a node already in the page moves it.
  - Reading geometry such as `offsetWidth` or `getBoundingClientRect()` after a style change forces a synchronous layout, so batch all reads before all writes.
  - "`querySelectorAll` returns a static snapshot, while `getElementsByClassName` and `children` return live collections that update as the page changes."
  - A property is the element's current state and an attribute is the starting markup, so `input.value` changes as someone types while `getAttribute("value")` does not.
sections:
  - title: Properties, attributes and live collections
    body: |-
      HTML attributes set up an element's **starting** state. The DOM object then holds its
      **current** state in properties. For most attributes the two stay in step: set
      `link.href` and the `href` attribute changes too. Form fields are the exception people
      trip on. The `value` attribute is the default, and the `value` property is what's in the
      box now.

      ```html
      <input id="qty" value="1">
      <script>
        const qty = document.querySelector("#qty");
        qty.value = "3"; // what a visitor typing 3 does
        console.log(qty.value); // 3, the property: current state
        console.log(qty.getAttribute("value")); // 1, the attribute: the starting markup
        console.log(qty.defaultValue); // 1, the property that mirrors the attribute
        console.log(typeof qty.value); // string
      </script>
      ```

      So a form reset puts `value` back to `defaultValue`, and CSS attribute selectors such as
      `input[value="3"]` don't match what someone typed. Read state from properties.

      Collections come in two kinds. `querySelectorAll` gives a **static** `NodeList`, a
      snapshot taken when you called it. `getElementsByClassName`, `getElementsByTagName` and
      `element.children` give **live** `HTMLCollection`s that update themselves.

      ```html
      <ul><li class="item">Milk</li></ul>
      <script>
        const list = document.querySelector("ul");
        const staticList = document.querySelectorAll(".item"); // NodeList, a snapshot
        const liveList = document.getElementsByClassName("item"); // HTMLCollection, live
        const row = document.createElement("li");
        row.className = "item";
        row.textContent = "Bread";
        list.append(row);
        console.log(staticList.length, liveList.length); // 1 2
      </script>
      ```

      Live collections bite when you loop over one while removing items from it: the length
      shrinks under the loop and every other item is skipped. Copy it first with
      `[...collection]`, or use `querySelectorAll`, which is the safer default.
  - title: textContent, innerText, innerHTML and XSS
    body: |-
      Three properties read and write an element's contents, and they differ in what they do
      with markup and with layout.

      - `textContent` gets or sets raw text. Setting it replaces the children with one text
        node. No parsing, no layout, and it's the right default.
      - `innerText` returns the text as rendered: it skips hidden elements and follows CSS
        line breaks. To know what's hidden it needs up-to-date layout, so reading it can
        force one.
      - `innerHTML` parses a string as HTML and builds real elements from it.

      That parsing is the danger. If the string contains anything a visitor controls, they
      control your page. A `script` element inserted through `innerHTML` never runs, which
      makes people feel safe, but event handler attributes do run.

      ```html
      <div id="a"></div><div id="b"></div><div id="c"></div>
      <script>
        const comment = '<img src="x" onerror="console.log(\'script ran\')">';

        document.querySelector("#a").textContent = comment;
        console.log(document.querySelector("#a").children.length); // 0, plain characters

        document.querySelector("#b").innerHTML = comment;
        console.log(document.querySelector("#b").children.length); // 1, a real img element

        document.querySelector("#c").innerHTML = "<script>console.log('never runs')<\/script>";
        console.log(document.querySelector("#c").innerHTML); // the script is there, inert
        // A moment later, when the image fails to load: script ran
      </script>
      ```

      In a real attack the handler reads cookies or tokens, or posts as the victim. The
      defence is layered. Put untrusted data in with `textContent`, `createElement` and
      `setAttribute`. When you must render user-written HTML, such as a rich-text comment,
      pass it through a sanitiser library like DOMPurify first. `insertAdjacentHTML` and
      `outerHTML` parse HTML too, so the same rule applies. URLs are a second channel: setting
      `link.href` to a visitor's `javascript:` URL runs code on click, so allow only `http:`
      and `https:`. A Content Security Policy header adds a safety net, but it doesn't replace
      escaping.
  - title: Layout, reflow and layout thrashing
    body: |-
      After your script changes the DOM, the browser has work to do before anything appears. It
      recalculates styles, runs **layout** (also called reflow) to find every box's size and
      position, then paints pixels. Normally it does this once, after your code finishes,
      however many changes you made.

      Some reads break that. `offsetWidth`, `offsetHeight`, `clientWidth`, `scrollTop`,
      `getBoundingClientRect()`, `getComputedStyle()` and `innerText` must return correct
      numbers. If a write has made layout stale, the browser runs layout right now,
      synchronously, to answer. A loop that alternates a read and a write forces a layout on
      every pass. That's **layout thrashing**.

      ```html
      <div class="bar" style="width:100px">a</div>
      <div class="bar" style="width:120px">b</div>
      <div class="bar" style="width:80px">c</div>
      <script>
        const bars = [...document.querySelectorAll(".bar")];

        // Thrashing: each read needs a fresh layout, because the write before it changed one.
        function widenSlow() {
          for (const bar of bars) {
            const width = bar.offsetWidth; // read: forces layout
            bar.style.width = `${width + 10}px`; // write: invalidates it again
          }
        }

        // Batched: every read first, then every write. One layout, not one per bar.
        function widenFast() {
          const widths = bars.map((bar) => bar.offsetWidth); // reads
          bars.forEach((bar, i) => {
            bar.style.width = `${widths[i] + 10}px`; // writes
          });
        }

        widenSlow();
        widenFast();
        console.log(bars.map((bar) => bar.offsetWidth)); // [120, 140, 100]
      </script>
      ```

      With three bars you won't notice. With a few hundred rows, or inside a scroll handler, it
      costs frames. The fixes: read everything first, then write. Schedule visual writes with
      `requestAnimationFrame`, which runs right before the next paint. Animate `transform` and
      `opacity`, which the browser can usually change without layout, instead of `width`,
      `top` or `margin`. The Performance panel in DevTools flags forced layouts with a warning.
  - title: Rendering a list from data
    body: |-
      Real pages rarely add one element. They take an array, from a server or from state, and
      show all of it. The clean pattern is a render function: data in, DOM out, the whole list
      rebuilt from the data each time it changes.

      ```html
      <ul id="books"><li>old</li></ul>
      <script>
        const books = [
          { title: "Emma", author: "Jane Austen" },
          { title: "Middlemarch", author: "George Eliot" },
        ];

        function renderBooks(list, books) {
          const rows = books.map((book) => {
            const row = document.createElement("li");
            const title = document.createElement("strong");
            title.textContent = book.title; // data goes in as text, never as markup
            row.append(title, ` by ${book.author}`);
            return row;
          });
          list.replaceChildren(...rows); // clears the old rows, inserts the new, in one call
        }

        const list = document.querySelector("#books");
        renderBooks(list, books);
        console.log(list.children.length); // 2
        console.log(list.textContent); // Emma by Jane AustenMiddlemarch by George Eliot
      </script>
      ```

      Building the rows while they're detached, then inserting them together, touches the live
      page once. A `DocumentFragment` does the same job in older code: append rows to the
      fragment, then append the fragment, which moves its children into the page. For a
      repeated chunk of markup, a `template` element holds inert HTML you copy with
      `template.content.cloneNode(true)` and then fill with `textContent`.

      Rebuilding everything is simple and correct, but it throws away focus, scroll position
      inside rows and any listeners on them. That's the problem UI libraries such as React
      solve: you still write "data in, UI out", and they work out the smallest set of DOM
      changes. Knowing the manual version explains what they optimise.
pitfalls:
  - >-
    **Putting typed text in with `innerHTML`.** It works in testing, because testers type
    names, not markup. The first visitor who types an `img` tag with an `onerror` attribute
    runs code in everyone's browser. Use `textContent`, or build elements, and sanitise any
    HTML you must render.
  - >-
    **Growing a list with `list.innerHTML += row`.** Each `+=` serialises the whole list to a
    string, parses it again and rebuilds every child. Old rows lose their listeners, focus and
    typed input, and the cost grows with every row. Create one element and `append` it.
  - >-
    **Assigning `className` to add a state.** `card.className = "read"` wipes `card` and every
    other class, so the styles that hang on them vanish. Use `card.classList.add("read")`, or
    `toggle("read", isRead)` with a boolean to force the state either way.
  - >-
    **Doing arithmetic on `value`.** `qtyBox.value + 1` gives `"21"` for a box holding `2`,
    because `value` is a string. Convert with `Number(box.value)` or read `valueAsNumber`, and
    check for `NaN`, which is what an empty number box gives.
  - >-
    **Querying before the element exists.** A classic script in the `head` runs before the
    body is parsed, so `querySelector` returns `null` and the next line throws. Load it with
    `defer` or `type="module"`, or put it at the end of the body.
  - >-
    **Reading layout inside a write loop.** Checking `offsetHeight` after each style change
    forces a layout every pass. Gather the measurements first, then apply the changes.
verify:
  - lens: leaks
    check: 'Text a visitor typed reaches the page through `textContent` or new elements, never `innerHTML`, so markup cannot run as code.'
  - lens: breaks
    check: 'State changes use `classList`, never `className =`, which wipes the element''s other classes.'
  - lens: scales
    check: 'New rows are appended one element at a time, because `innerHTML +=` rebuilds every row and drops their listeners.'
  - lens: tests
    check: 'Post a comment containing `<b>hi</b>` and check the tags appear as plain text.'
interview:
  - question: What's the difference between `textContent`, `innerText` and `innerHTML`?
    answer: >-
      `textContent` works with raw text, `innerText` with rendered text, and `innerHTML` with
      markup. Setting `textContent` replaces the children with a single text node and never
      parses anything, so it's the fast, safe default for data. `innerText` reflects what's
      visible: it skips hidden elements and applies CSS line breaks, which means reading it
      can force a layout. `innerHTML` parses its string into real elements, which is handy for
      trusted templates but an XSS hole for anything a user supplied. I use `textContent` for
      data, `createElement` for structure, and `innerHTML` only with static strings or
      sanitised HTML.
  - question: What is cross-site scripting, and how do you prevent it in front-end code?
    answer: >-
      XSS is when attacker-controlled text ends up interpreted as code in another user's
      page. In the DOM, the usual route is a string passed to `innerHTML`,
      `insertAdjacentHTML` or `outerHTML`: an `img` with an `onerror` handler runs even
      though inserted `script` tags don't. Prevention is layered. Treat all data as text:
      `textContent`, `setAttribute` and `createElement`. If rich HTML is a feature, sanitise
      it with a maintained library such as DOMPurify. Validate URLs so a `javascript:` link
      can't reach an `href`. Frameworks escape by default, so the risk moves to escape hatches
      like React's `dangerouslySetInnerHTML`. Finally, a Content Security Policy limits the
      damage when something slips through, but it's a net, not the fix.
  - question: What is layout thrashing, and how do you avoid it?
    answer: >-
      It's forcing the browser to recalculate layout many times in one frame by interleaving
      DOM writes with geometry reads. Normally the browser batches changes and lays out once
      before painting. But reading `offsetWidth` or `getBoundingClientRect()` after a write
      needs a correct answer now, so layout runs synchronously. In a loop over many elements
      that's one layout per iteration. The fix is to batch: do all reads, then all writes.
      For animation, schedule writes in `requestAnimationFrame` and prefer `transform` and
      `opacity`, which usually skip layout. DevTools' Performance panel marks forced reflows,
      so I measure before and after rather than guessing.
  - question: How would you add a thousand rows to a list efficiently?
    answer: >-
      Build the rows detached and insert them in one operation. I'd map the data to elements
      with `createElement` and `textContent`, then call `list.append(...rows)` or
      `list.replaceChildren(...rows)`, or collect them in a `DocumentFragment`. That touches
      the live tree once, so style and layout run once. What I avoid is `innerHTML +=` in a
      loop, which reparses the whole list each time, and reading layout between inserts. If
      the list can grow to tens of thousands, the DOM itself becomes the cost, so I'd
      paginate or virtualise, rendering only the rows in view.
