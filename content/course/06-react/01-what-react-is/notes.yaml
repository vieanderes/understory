summary: >-
  React is a JavaScript library for building interfaces out of components. A component is a
  function that returns a description of one piece of the page, written in JSX. You describe
  what the page should look like for the current data, and React works out which DOM changes
  get the real page there. That swap, from writing the steps to writing the result, is what
  people mean when they call React **declarative**.


  The problem it solves is keeping the page in step with the data. Written by hand, every
  change to the data needs a matching DOM edit, and every screen state needs a path from every
  other state. Miss one and the count says 2 while the list shows 3. React removes that class
  of bug: there is one description, and the page is always drawn from it.


  React itself only renders. It has no router, no data loading and no build step of its own.
  A tool such as Vite compiles the JSX and bundles the code, and a framework such as Next.js
  adds routing, server rendering and data loading on top. For a static page with no changing
  state, plain HTML is lighter. React earns its cost once several parts of a page depend on
  the same changing data.
remember:
  - You describe what the page should show for the current data, and React works out and applies the DOM changes.
  - A component is a function whose name starts with a capital letter and which returns JSX.
  - JSX compiles to function calls that build plain objects, React elements, so braces can hold any JavaScript expression but no statements.
  - React draws strings and numbers, skips `true`, `false`, `null` and `undefined`, renders arrays item by item, and throws on a plain object.
  - Text in braces is escaped, so `{userInput}` can't inject HTML; only `dangerouslySetInnerHTML` bypasses that.
  - JSX uses DOM property names such as `className` and `htmlFor`, and `style` takes an object, while `aria-*` and `data-*` keep their hyphens.
  - '`createRoot(container)` makes one root per container, `root.render()` can be called again to update it, and `root.unmount()` tears it down.'
sections:
  - title: Why declarative code has fewer bugs
    body: |-
      Picture a to-do list with an empty state. By hand, you need code for every transition:
      empty to one item, one item to empty, one to two. Each transition edits the DOM in its
      own way. With three states and one message, that's already six paths to keep right, and
      each new feature multiplies them.

      Declarative code has one path. You write what each state looks like, and React handles
      every transition by comparing the new description with the last one.

      ```tsx
      function TodoList({ todos }: { todos: string[] }) {
        if (todos.length === 0) {
          return <p>Nothing to do</p>;
        }
        return (
          <>
            <ul>
              {todos.map((todo) => (
                <li key={todo}>{todo}</li>
              ))}
            </ul>
            <p>{todos.length} left</p>
          </>
        );
      }
      ```

      There's no code for "the last item was removed". The component describes the empty
      list, and React gets there from whatever was on screen. The `key` tells React which
      item is which; the lists lesson explains it.

      The price is that React owns the part of the DOM it renders. If other code edits those
      nodes directly, React doesn't know, and its next commit may overwrite the edit or fail.
      Keep hand-written DOM code out of React's subtree, or hand it a node React leaves empty.
  - title: What braces accept, and what React does with each value
    body: |-
      Braces take one **expression**: anything that produces a value. A variable, a call, a
      ternary, a `map`. They can't take a statement such as `if` or `for`, because JSX
      compiles to a function call and statements can't sit inside an argument list. Put an
      `if` before the `return` instead.

      What React draws depends on the value:

      ```tsx
      import { renderToStaticMarkup } from 'react-dom/server';

      const html = renderToStaticMarkup(
        <p>
          {false}{null}{undefined}{true}|{0}|{NaN}|{''}|{[1, 2]}|{'<b>'}
        </p>,
      );
      console.log(html); // <p>|0|NaN||12|&lt;b&gt;</p>
      ```

      Booleans, `null` and `undefined` vanish, which is what makes conditional rendering work.
      Numbers show, even `0` and `NaN`. Arrays render each item in turn. The string `'<b>'`
      arrives as text, escaped, never as a tag. A plain object throws "Objects are not valid
      as a React child", the error you see when you write `{user}` instead of `{user.name}`.

      That escaping is a security feature. Anything a user typed can go in braces without
      opening a script injection hole. The one way round it is named to make you stop and
      think: `dangerouslySetInnerHTML={{ __html: markup }}`. Only pass it HTML you've
      sanitised or written yourself.
  - title: Attributes are DOM properties
    body: |-
      JSX attributes follow the DOM's property names, not HTML's attribute names. That's why
      `class` becomes `className` and `for` becomes `htmlFor`: the DOM element has
      `element.className` and `label.htmlFor`. Event handlers are camelCase too, `onClick`
      rather than `onclick`.

      `style` takes an object with camelCase keys. A bare number means pixels for most
      length properties, and strings pass through as written. Two groups keep their HTML
      spelling: `aria-*` and `data-*`.

      ```tsx
      import { renderToStaticMarkup } from 'react-dom/server';

      console.log(
        renderToStaticMarkup(
          <label htmlFor="email" className="field" data-id="3" aria-label="Email" style={{ marginTop: 8, fontSize: '2rem' }}>
            Email
          </label>,
        ),
      );
      // <label for="email" class="field" data-id="3" aria-label="Email" style="margin-top:8px;font-size:2rem">Email</label>
      ```

      The output is plain HTML again. React translates each prop back into the attribute the
      browser expects when it writes the DOM.
  - title: The root, and what happens when you render into it again
    body: |-
      `createRoot` connects React to one DOM element. From then on React manages everything
      inside it. An app usually has exactly one root, made once at start-up.

      Calling `root.render` a second time doesn't start over. React compares the new element
      with the old one and changes only what differs, keeping the existing DOM nodes where it
      can. `root.unmount()` removes everything React rendered and releases the root.

      ```tsx
      import { act } from 'react';
      import { createRoot } from 'react-dom/client';

      const container = document.createElement('div');
      const root = createRoot(container);

      act(() => root.render(<p className="a">one</p>));
      const first = container.firstChild;

      act(() => root.render(<p className="b">two</p>));
      console.log(container.firstChild === first); // true: same node, new class and text

      act(() => root.render(<section>two</section>));
      console.log(container.firstChild === first); // false: a new type means a new node

      act(() => root.unmount());
      console.log(container.innerHTML); // ''
      ```

      `act` here only makes the test wait for React to finish; app code calls `root.render`
      directly. The same comparison runs on every state change, which is why the note you're
      typing survives when the list around it changes. When the HTML was already rendered on
      a server, you use `hydrateRoot` instead, which attaches React to the existing markup
      rather than building it.
pitfalls:
  - >-
    **A lowercase component name.** `<badge />` makes an unknown HTML element and never calls
    your function, and nothing errors. Name components with a capital letter.
  - >-
    **Putting an object in braces.** `{user}` throws "Objects are not valid as a React
    child". Render a field, `{user.name}`, or format the object into a string.
  - >-
    **Writing an `if` inside JSX.** Braces take expressions only, so the build fails. Use a
    ternary or `&&` in the JSX, or an `if` with an early `return` above it.
  - >-
    **Editing React's DOM by hand.** A `querySelector` and `textContent` inside a React
    subtree gets overwritten on the next commit, or confuses the comparison. Change state,
    and let React change the page.
  - >-
    **Calling `createRoot` on every update.** React warns in development that the container
    was already passed to `createRoot`, and tells you the fix: create the root once and call
    `root.render` on it again.
interview:
  - question: What problem does React solve, compared with updating the DOM yourself?
    answer: >-
      It keeps the page in step with the data, so you describe results instead of steps. By
      hand, every change needs a matching DOM edit, and the number of transitions between
      screen states grows fast; forgetting one leaves the page showing stale data. In React a
      component describes what the page looks like for the current props and state. On each
      update React calls it again, compares the new description with the previous one, and
      commits only the differences. So the count and the list can't disagree: both come from
      the same data in the same render. The cost is a runtime of tens of kilobytes and a
      build step for JSX, which isn't worth it for a mostly static page.
  - question: What does JSX compile to?
    answer: >-
      Function calls that return plain objects called React elements. With the modern
      transform, `<h1 className="t">Hi</h1>` becomes a call to `jsx` from `react/jsx-runtime`
      with the type `"h1"` and the props `{ className: "t", children: "Hi" }`. A lowercase
      tag passes a string, meaning an HTML element; a capitalised one passes the variable,
      meaning your component. That's why braces take expressions only, why a component needs
      a capital letter, and why a component returns one root: it's one return value. The
      element is a description; nothing renders until React decides to call the component.
  - question: Is it safe to render user input in JSX?
    answer: >-
      Yes, as text. React escapes strings in braces, so `{comment}` containing a script tag
      shows the characters and runs nothing. Elements also carry a `$$typeof` symbol that
      JSON can't encode, so a crafted object from an API can't pass for an element. The holes
      you open yourself are `dangerouslySetInnerHTML`, which inserts raw HTML, and `href`
      values: a `javascript:` URL in a link would run code, and React 19 replaces it
      with a URL that throws instead, but you should still validate URLs from users. If you must
      render user HTML, sanitise it first with a maintained library.
  - question: What's the difference between a library and a framework, and where does React sit?
    answer: >-
      React is a library: you call it to render components, and it has no opinion on routing,
      data loading or file layout. A framework calls your code and decides the structure: Next.js
      picks routes from folders, renders on the server and loads data before the page is sent.
      Plain React with Vite suits a client-only app such as a dashboard behind a login. A
      framework suits anything that needs fast first loads, search indexing or server-side data.
      The React team itself recommends starting new apps with a framework, because routing and
      data loading are problems every real app meets.
