term: stale-while-revalidate
aka: [ SWR, serve stale ]
short: Answering at once with an expired cached copy while a fresh one is fetched in the background.
explain: |
  When a cached copy expires, someone has to wait for the fresh one. With this rule, nobody
  waits: the old copy is served one last time, and the refresh happens behind it.

  In HTTP it's a `Cache-Control` directive. `max-age` says how long a copy is fresh. This
  directive adds a window when a stale copy may still be served. Caches in Next.js work the
  same way. The cost is that one visitor sees the old data after it changed.
analogy: A newsagent who hands you yesterday's paper while today's delivery is unloaded, instead of making you wait at the door.
example:
  language: http
  code: |
    HTTP/1.1 200 OK
    Cache-Control: public, max-age=60, stale-while-revalidate=600
usage: With stale-while-revalidate the page never waits on the API, though it may be a minute behind.
related: [ cache-control, cache, cdn, incremental-static-regeneration, use-cache ]
level: 3
lessons: [ perf.caching-layers, nextserver.caching ]
