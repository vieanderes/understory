id: pro.pythonic
title: Pythonic Python
objective: 'Write Python the way Python developers expect: EAFP, comprehensions, unpacking, context managers, logging instead of print, and the standard library first.'
level: essential
minutes: 10
concepts: [pro.pythonic-idioms, pro.eafp, pro.python-logging, pro.stdlib-first]
prerequisites: [python.report-tool]
opening:
  text: >-
    You'll write Python that looks like it was written by someone who uses it every day.
    Reviewers notice the difference in the first five lines.

steps:
  - type: prose
    id: pythonic-idioms
    body: |-
      A reviewer spots Python written like another language in the first five lines.
      **Pythonic** code uses the shapes you learned in the Python chapter:

      - Loop over items, not indexes. Use `enumerate` and `zip` when you need more.
      - Unpack: `name, score = pair`, not `pair[0]` and `pair[1]`.
      - Build lists with comprehensions, and open files with `with`.

      Each swap removes a place for a bug to hide.

  - type: prose
    id: stdlib-first
    body: |-
      The second habit: check the **standard library** before you write a helper. You've used
      `Counter` and `defaultdict`. Two more you'll meet early:

      ```python
      from itertools import batched
      from statistics import median

      for group in batched(emails, 100):   # tuples of up to 100
          send_all(group)

      print(median([120, 80, 3000]))       # 120
      ```

      They're tested, fast, and every Python reader knows them.

  - type: fill-blank
    id: fill-batched
    concept: pro.stdlib-first
    difficulty: 1
    language: python
    prompt: >-
      The model API takes at most 50 texts per call. Send the reviews in groups of 50, with
      the standard library. Fill the gaps.
    template: |
      from itertools import {{1}}

      for group in {{1}}(reviews, {{2}}):
          classify_all(group)
    blanks:
      - key: '1'
        answer: batched
      - key: '2'
        answer: '50'
    bank: [batched, median, Counter, '50', '100']

  - type: prose
    id: logging
    body: |-
      `print` is for a program's real output. Diagnostics go through **logging**:

      ```python
      import logging

      logger = logging.getLogger(__name__)      # one per file
      logger.info("Imported %d rows", 120)
      ```

      `%d` marks where the number goes. Each message has a level: `debug`, `info`, `warning`
      or `error`. The entry point picks what shows with
      `logging.basicConfig(level=logging.INFO)`, so no one edits code to see more.

  - type: fill-blank
    id: fill-logger
    concept: pro.python-logging
    difficulty: 2
    language: python
    prompt: Log each save at info level through a module logger, not `print`.
    template: |
      import logging

      logger = logging.{{1}}(__name__)

      def save_notes(notes):
          logger.{{2}}("Saved %d notes", len(notes))
    blanks:
      - key: '1'
        answer: getLogger
      - key: '2'
        answer: info
    bank: [getLogger, info, print, Logger, basicConfig]

  - type: code-challenge
    id: write-pythonic-refactor
    concept: pro.pythonic-idioms
    difficulty: 3
    language: python
    starter: tags.starter.py
    solution: tags.solution.py
    tests: tags.tests.py
    prompt: >-
      A pull request adds `top_tags(posts)`, and it reads like translated JavaScript. Make it
      Pythonic. Loop over items, count with `Counter`, and return `most_common(3)`.


      Swap the `print` for `logger.info("counted %d tags", ...)`. It must return the same
      pairs as before, such as `[("quick", 3), ("dinner", 2), ("vegan", 2)]`.
    hints:
      - Two loops over items replace both `range(len(...))` loops. No index is needed.
      - A `Counter` starts every key at 0, so `counts[tag] += 1` needs no `if`.
      - Start with `counts = Counter()`, then `for post in posts:` and `for tag in post["tags"]:`.

  - type: prose
    id: eafp
    body: |-
      The last habit has a name: **EAFP**, easier to ask forgiveness than permission. Try the
      thing, and catch the one error you expect. Reading a missing file raises
      `FileNotFoundError`:

      ```python
      try:
          text = Path(path).read_text()
      except FileNotFoundError:
          text = ""
      ```

      The other style checks first. Between the check and the act, the world can change.

  - type: ai-review
    id: review-check-then-read
    concept: pro.eafp
    difficulty: 3
    language: python
    request: Load a saved draft, or an empty one if there's no file.
    flawClass: race
    code: |
      from pathlib import Path

      def load_draft(path):
          draft = Path(path)
          if draft.exists():
              return draft.read_text()
          return ""
    prompt: >-
      An assistant wrote this. A cleanup job deletes old drafts every minute. A few times a
      day, line 6 crashes with `FileNotFoundError`. Tap the line that makes that possible.
    lines: [5]
    reasons:
      - text: The file can vanish between the check and the read
        correct: true
        feedback: >-
          Yes. Try the read, and catch `FileNotFoundError` instead.
      - text: '`read_text` needs an encoding'
        feedback: >-
          A good habit, but a missing encoding can't cause `FileNotFoundError`.
      - text: '`Path` needs a string, not a path'
        feedback: >-
          `Path` accepts a string or another path. The check passed, then the file went.
    fix: |
      def load_draft(path):
          try:
              return Path(path).read_text()
          except FileNotFoundError:
              return ""

  - type: explain-back
    id: explain-narrow-except
    concept: pro.eafp
    difficulty: 3
    prompt: >-
      EAFP says "try it first". Why does it only work when the `except` names the exact error
      you expect?
    rubric:
      - The `except` should catch only the case you planned for, such as a missing file.
      - A broad `except` also catches real bugs, like wrong types or typos.
      - Those then turn into a quiet default instead of a loud error.
    modelAnswer: >-
      Trying first is fine because you know which failure is normal, like a missing file.
      Catching `Exception` catches everything else too, including a `TypeError` from bad data
      or a typo. Those bugs then return a default quietly. Naming `FileNotFoundError` keeps
      the expected case quiet and lets real bugs fail loudly.

recap:
  - Refactor translated code into loops over items, `Counter` and unpacking.
  - Reach for the standard library, such as `batched` and `median`, before writing a helper.
  - Log diagnostics with a module logger, and try first, catching only the error you expect.
recall:
  - id: card-enumerate
    concept: pro.pythonic-idioms
    front: How do you loop over a list and get each item's number, starting at 1?
    back: >-
      `for i, item in enumerate(items, start=1):`
  - id: card-eafp
    concept: pro.eafp
    front: What does EAFP stand for, and what does it look like?
    back: >-
      Easier to ask forgiveness than permission: `try` the operation and catch the one
      specific exception you expect.
  - id: card-logger
    concept: pro.python-logging
    front: How does a module get its own logger?
    back: >-
      `logger = logging.getLogger(__name__)` at the top of the module.
  - id: card-counter
    concept: pro.stdlib-first
    front: Which standard library class counts items and gives the most common ones?
    back: >-
      `collections.Counter`, with `.most_common(n)`.

references:
  - kind: spec
    title: PEP 8 – Style Guide for Python Code
    authors: Guido van Rossum, Barry Warsaw, Alyssa Coghlan
    venue: Python Enhancement Proposals
    url: https://peps.python.org/pep-0008/
    note: The shared style every Python reviewer expects.
    primary: true
    verified: true
  - kind: docs
    title: Logging HOWTO
