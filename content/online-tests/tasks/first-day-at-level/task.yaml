id: first-day-at-level
title: FirstDayAtLevel
topic: binary-search
difficulty: easy
type: bug-fix
recommendedMinutes: 15
maxChangedLines: 1
signature:
  params:
    - { name: A, type: "int[]" }
    - { name: X, type: int }
  returns: int
statement: |-
  A water gauge logs a reservoir's level once a day during a wet season, so the level never
  falls: A[K] is the level on day K, and A is sorted in non-decreasing order. The dashboard
  shows the first day on which the level was at least X, or −1 if it never got there.

  The function below is meant to find that day with a binary search, but it returns wrong
  answers for some inputs. Find the bug and fix it. **You can modify at most one line.**

  {{signature}}

  For example, given A = [1, 3, 3, 5, 8] and X = 4, the function should return 3.

  Given A = [1, 3, 3, 5, 8] and X = 3, the function should return 1.

  Given A = [2, 4] and X = 9, the function should return −1.

  Assume that:

  - N is an integer within the range [1..1,000];
  - each element of array A is an integer within the range [0..1,000,000];
  - array A is sorted in non-decreasing order;
  - X is an integer within the range [0..1,000,000].

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [[1, 3, 3, 5, 8], 4], expected: 3 }
  - { args: [[1, 3, 3, 5, 8], 3], expected: 1 }
  - { args: [[2, 4], 9], expected: -1 }
tests:
  - name: extreme_single
    description: one day
    group: correctness
    cases:
      - { args: [[5], 5], expected: 0 }
      - { args: [[5], 6], expected: -1 }
      - { args: [[5], 0], expected: 0 }
  - name: exact_level
    description: the level X appears in the log
    group: correctness
    cases:
      - { args: [[0, 2, 4, 6, 8, 10], 6], expected: 3 }
      - { args: [[1, 2, 3, 4], 4], expected: 3 }
  - name: all_equal
    description: the level never changes
    group: correctness
    cases:
      - { args: [[7, 7, 7, 7, 7], 7], expected: 0 }
      - { args: [[7, 7, 7], 8], expected: -1 }
  - name: small_random
    description: random sorted levels, N = 50
    group: correctness
    cases:
      - generate: { seed: 901, args: [{ kind: sorted, n: 50, min: 0, max: 30 }, { kind: int, min: 0, max: 30 }] }
      - generate: { seed: 902, args: [{ kind: sorted, n: 50, min: 0, max: 100 }, { kind: int, min: 0, max: 120 }] }
  - name: medium_random
    description: random sorted levels, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 903, args: [{ kind: sorted, n: 1000, min: 0, max: 1000000 }, { kind: int, min: 0, max: 1000000 }] }
      - generate: { seed: 904, args: [{ kind: sorted, n: 1000, min: 0, max: 200 }, { kind: int, min: 0, max: 200 }] }
