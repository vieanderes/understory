term: fan-out on write
aka: [push model, write fan-out, fan-out-on-write]
short: Copying each new post into every follower's stored feed at the moment it is written.
explain: |
  When someone posts, a background job adds the post to the feed of each follower. Reading
  a feed is then one quick lookup, which matters because feeds are read far more often
  than posts are written.

  The catch is accounts with millions of followers. One post becomes millions of writes,
  and followers see it late. Big systems push for ordinary accounts and pull for those few.
analogy: A newspaper delivered to every subscriber's door each morning, ready to read.
usage: Fan-out on write is fine for most accounts, but the celebrity accounts need to be pulled at read time.
twin:
  term: fan-out-on-read
  difference: Fan-out on write does the work when a post is made, so reads are cheap. Fan-out on read does it when a feed is opened, so writes are cheap.
related: [fan-out-on-read, hot-key, queue, cache]
level: 3
lessons: [sysdesign.case-news-feed]
