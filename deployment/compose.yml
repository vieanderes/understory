# Understory on one VPS: the app behind Caddy. Caddy terminates TLS and gets its own
# certificates, so there is no certbot and no cron to renew them.
#
#   DOMAIN=understory.example docker compose -f deployment/compose.yml up -d --build
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # Next writes its image and fetch cache here.
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
