    note: Says to revoke or rotate a committed secret first, before any history rewriting.
    verified: true

deepDive: |-
  **Your first commit.** On a new machine Git doesn't know who you are. Set it once:

  ```bash
  git config --global user.name "Sam Lee"
  git config --global user.email "sam@example.com"
  ```

  Skip it, and Git guesses from your computer's name and prints a long note after the commit.
  `git init` may also print hints about the branch name `master`. Setting
  `git config --global init.defaultBranch main` silences them.

  **Seeing the change.** `git diff` shows lines you changed but haven't staged. A `-` line was
  removed and a `+` line was added. `git diff --staged` shows what's in the basket.

  **Editing after `git add`.** The staging area holds the version you added, not the file. Edit
  again, and `git status` lists the file twice: once under "Changes to be committed", once
  under "Changes not staged". The commit saves the older, added version. Run `git add` again
  right before you commit.

  **An ignored file that's already tracked.** `.gitignore` only affects untracked files. To
  stop tracking one, run `git rm --cached .env`, then add it to `.gitignore`.
