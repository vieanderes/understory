id: ts
number: 4
title: TypeScript
summary: "JavaScript with notes about what each value is, read by a checker before the code runs. Type your everyday code, then check data where it enters the program."
why: "The checker finds typos, missing values and wrong kinds of data while you type, long before a user does."
youCanBuild: "A typed data model with a parser that checks data where it enters."
concepts:
  - id: ts.type-checker
    title: The type checker
    summary: A program that reads your code before it runs and reports a type error wherever a value doesn't match what its type promises.
  - id: ts.annotations
    title: Type annotations
    summary: "A note like `: number` after a name or a parameter, saying what kind of value it must hold."
  - id: ts.type-erasure
    title: Type erasure
    summary: Compiling deletes every type and leaves plain JavaScript, so nothing checks types while the program runs.
  - id: ts.type-inference
    title: Type inference
    summary: The checker works out a type from the value it starts with, so most variables need no annotation.
  - id: ts.function-and-array-types
    title: Array and function types
    summary: "`string[]` is a list of strings, and a function's parameters and return value each get their own type."
  - id: ts.object-types
    title: Object types
    summary: "`type` or `interface` gives a name to the shape of an object: which properties it has, and the type of each."
  - id: ts.optional-properties
    title: Optional properties
    summary: "A `?` after a property name means it may be missing, so reading it gives `undefined` as well, and the checker makes you handle that."
  - id: ts.structural-typing
    title: Structural typing
    summary: A value fits a type when it has the properties that type asks for, whatever the value's own type is called.
    confusableWith: [ts.excess-property-checks]
  - id: ts.excess-property-checks
    title: Excess property checks
    summary: An object written straight into a typed spot may not have properties the type doesn't list, which catches misspelt names.
    confusableWith: [ts.structural-typing]
  - id: ts.union-types
    title: Union types
    summary: "A value of type `A | B` is one or the other, so only what both share can be used before you check which."
  - id: ts.narrowing
    title: Narrowing
    summary: "Checks such as `typeof`, `=== null` and `in` tell the checker which member of a union you hold inside that branch."
    confusableWith: [ts.type-assertions, ts.escape-hatches]
  - id: ts.discriminated-unions
    title: Discriminated unions
    summary: A union whose members share a property with a different fixed value in each, so checking that property picks one member.
  - id: ts.exhaustiveness
    title: Exhaustiveness checks with never
    summary: "Passing the leftover value to a function that takes `never` breaks the build when someone adds a case nobody handles."
  - id: ts.unknown
    title: unknown and any
    summary: "`unknown` accepts every value and allows nothing until you check it, while `any` switches checking off."
  - id: ts.type-assertions
    title: Type assertions
    summary: "`as` tells the checker to believe a value has a type, and checks nothing while the program runs."
    confusableWith: [ts.narrowing, ts.runtime-schemas]
  - id: ts.runtime-schemas
    title: Parsing at the boundary
    summary: Code that checks outside data while the program runs and returns either a typed value or a failure.
    confusableWith: [ts.type-assertions]
  - id: ts.generics
    title: Generics
    summary: A type parameter stands for a type chosen at each call, so a function can hand back the same type it was given.
  - id: ts.generic-constraints
    title: Generic constraints
    summary: "`extends` on a type parameter limits which types it accepts, so the function body can use what they share."
  - id: ts.type-argument-inference
    title: Type argument inference
    summary: The checker works out a type parameter from the values passed, so most generic calls need no types written.
  - id: ts.keyof-and-typeof
    title: keyof and typeof
    summary: "`typeof` turns a value into its type, and `keyof` turns a type into the union of its property names."
  - id: ts.utility-types
    title: Utility types
    summary: Built-in helpers such as `Partial`, `Pick`, `Omit` and `Record` make a new type from one you already have.
  - id: ts.satisfies
    title: satisfies and as const
    summary: "`satisfies` checks a value against a type and keeps its exact inferred type, and `as const` keeps literal values."
  - id: ts.strict-flags
    title: Strictness settings
    summary: "`strict` switches on the checks that catch `null` and missing types, and `noUncheckedIndexedAccess` adds `undefined` to every index read."
  - id: ts.escape-hatches
    title: Escape hatches
    summary: "`any`, `as` and the `!` after a value each switch a check off at one spot, so the error returns while the program runs."
    confusableWith: [ts.narrowing]
  - id: ts.tsconfig
    title: tsconfig.json
    summary: The project's settings file for the checker. It says which files to check, how strictly, and what kind of JavaScript to produce.
  - id: ts.module-resolution
    title: Module settings
    summary: "`module` and `moduleResolution` describe the program that will run your code, so the checker finds imports the way it will."
  - id: ts.declaration-files
    title: Declaration files
    summary: A `.d.ts` file describes the types of JavaScript code. It holds no code, and nothing checks it against the real package.
