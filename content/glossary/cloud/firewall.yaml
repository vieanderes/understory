term: firewall
aka: [host firewall, security group, ufw]
short: A filter that decides which network traffic may reach or leave a machine, by port and address.
explain: |
  A fresh server listens on whatever its programs open, including a database meant only for
  local use. Anything listening on a public address is a door that strangers will try.

  So deny incoming traffic by default and open only what you serve, usually 22, 80 and 443.
  Clouds add their own filter in front of the machine, and it's worth using both. One known
  trap: containers that publish ports can add rules that go round the host's filter.
analogy: A guard at the gate with a short list of doors visitors may use. Every other door stays locked, whoever knocks.
example:
  language: bash
  code: |
    ufw default deny incoming
    ufw allow 22/tcp
    ufw allow 80,443/tcp
    ufw enable
usage: Postgres was reachable from the internet; close 5432 on the firewall and keep it on the private network.
related: [least-privilege, ssh]
level: 1
lessons: [cloud.linux-server]
