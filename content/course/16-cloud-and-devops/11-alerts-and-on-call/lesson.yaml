deepDive: >-
  How small is "too few requests"? There's no single number. The minimum in this lesson, 20
  requests in five minutes, is a starting point. A quiet service can use a longer window at
  night instead, so there's always enough traffic to judge. Some teams alert on the absolute
  number of failed users as well, so a total outage at 3 a.m. still pages.


  Mature teams page on how fast the error budget is burning, over a long and a short window
  together. The system design chapter's SLO lesson works through that, with the numbers.


  Rolling back first works when your own change caused the harm. Sometimes something outside
  breaks, such as a model provider or a payment service. Then your levers are a fallback, a
  feature flag that turns the feature off, or a clear message to users. Plan those levers
  before you need them, and write them in a runbook: the page links to the steps.


  The security chapter's incident response lesson follows a leaked key through the same
  shape: contain, fix, recover, review.
