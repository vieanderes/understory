term: alert fatigue
aka: [alarm fatigue, noisy alerts]
short: When so many unimportant warnings fire that people stop reading them, and miss the real one.
explain: |
  An alert that fires every hour for nothing teaches people to ignore it. Soon the channel
  is muted, and the night a real attack or outage happens, nobody looks.

  So every alert must be actionable: someone should know what to do when it fires. Alert on
  patterns, such as many failed logins for one account, not on every single failure. Delete
  or demote alerts that nobody acts on. Fatigue is a security failure, not a comfort issue.
analogy: The car alarm in the street that goes off every night. By the third week, nobody looks out of the window.
usage: We get forty pages a week and act on two; that's alert fatigue, so cut the rest to dashboard only.
related: [alerting, on-call, slo, observability]
level: 2
lessons: [security.detection-and-logging]
