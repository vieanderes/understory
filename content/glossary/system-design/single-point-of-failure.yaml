term: single point of failure
aka: [SPOF]
short: One part of a system that, if it breaks, takes the whole system down with it.
explain: |
  You run four app servers so one can die safely. But they all talk to one database, one
  load balancer and one DNS provider. If any of those fails, the four servers don't help.

  Finding them means walking the path of a request and asking, for each box, "what if this
  disappears?" The fix is a spare that takes over, or a way to keep working without it. Not
  every one is worth removing; some are cheaper to accept, with a quick recovery plan.
analogy: A string of old fairy lights. One blown bulb and the whole string goes dark.
usage: The cron server is a single point of failure; if it dies, no invoices go out and nobody notices.
related: [replication, load-balancer, circuit-breaker, vertical-scaling]
level: 2
lessons: [cloud.scaling-and-cost]
