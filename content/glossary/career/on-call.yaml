term: on-call
aka:
  - on-call rota
short: Taking a turn as the person who responds when production breaks, day or night.
explain: |
  Systems fail at 3 a.m. too. Teams share the job on a rota. For a week, one person carries
  the alerts and acts first when something breaks.

  It works when alerts are few and real, each with a runbook saying what to check first. An
  alert that fires and needs no action trains people to ignore the next one. A good team
  treats every night-time page as a bug to fix.
analogy: The doctor on call at a hospital. Most nights are quiet, but someone has to be reachable, with clear notes for when the phone rings.
usage: I'm on-call this week, so I'll take the alert; can you swap Thursday with me?
