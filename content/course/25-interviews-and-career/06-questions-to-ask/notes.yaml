summary: |-
  "What would you like to ask us?" closes most rounds, and it's the only part of the loop where you're the one gathering evidence. Used well, it does two jobs at once. It tells you how the team really works, not how it presents itself, and it shows the interviewer how you think: what you care about is a signal of level.

  The rule that makes questions useful is to ask for a recent, specific example rather than an opinion. "How do you handle incidents?" gets a polished answer. "Can you walk me through your last incident?" gets the truth, because real examples are hard to polish on the spot.

  Then read the answers. How specific they are matters more than what they claim. These notes give a bank of strong questions per interviewer with why each works, the follow-ups that dig, what healthy and worrying answers sound like, and model answers for the question-shaped questions interviewers ask you.
remember:
  - Ask for a recent example, not an opinion, because examples are hard to polish and show what really happens.
  - Four questions reveal most about an AI team, how they decide what to build, how they know a model change helped, their last incident, and what a senior owns.
  - Match questions to the person, reviews and incidents for engineers, priorities and growth for managers, decisions for product, pay and logistics for the recruiter.
  - Vagueness where you asked for an example, blame in an incident story, and no measure of quality are signals to follow up, not verdicts on their own.
  - Never ask what the company's website already answers, since it suggests you didn't prepare.
  - Different interviewers giving conflicting answers to the same question is information in itself.
  - Your questions are scored too, so a question about how quality is measured signals a senior engineer.
sections:
  - title: A question bank, by interviewer, with why each works
    body: |-
      You'll get five to ten minutes. Choose two or three per round.

      **For an engineer on the team.**

      - "How was the last prompt or model change checked before it shipped?" Shows whether evals exist and are used, or quality is judged by feel.
      - "Can you walk me through your last incident and what changed afterwards?" Shows blameless culture, monitoring and follow-through.
      - "What did the last code review you received teach you?" Shows whether reviews are real conversations or rubber stamps.
      - "How long does it take a change to go from merged to production?" Shows deployment health and how much process weighs.

      **For the engineering manager.**

      - "How do you decide what the team builds next quarter?" Shows who holds priorities and how stable they are.
      - "What did the last person promoted to senior do differently?" Shows what the role actually rewards.
      - "What's the biggest risk to the team's plans this year?" Shows candour and self-awareness.
      - "How are new people onboarded, and when do they usually ship first?" Shows whether onboarding is designed or left to chance.

      **For a product manager.**

      - "Tell me about a feature you decided not to build. Why?" Shows whether decisions rest on evidence.
      - "How do you know an AI feature is working for users?" Shows whether product metrics and quality metrics connect.

      **For the recruiter.** Pay range, level, the process and timeline, remote policy, holiday. Those belong here, not with the engineers.
  - title: Follow-ups that turn an answer into evidence
    body: |-
      The first answer is often the rehearsed one. The follow-up gets the real one. Three that work almost everywhere:

      - **"Can you give me an example?"** Turns a principle ("we care about quality") into a fact.
      - **"What happened next?"** Tests follow-through. An incident review that produced no changes is worth knowing about.
      - **"What would you change about that?"** Invites candour and shows you respect their judgement.

      A worked exchange:

      ```text
      You:   How do you know a prompt change made things better?
      Them:  We have a really strong focus on quality.
      You:   Could you walk me through the last prompt change?
      Them:  We rewrote the support prompt last month. The team felt it was
             clearer, and we have a test set, though it hasn't been run in a while.
      You:   What stops it being run on every change?
      Them:  Honestly, nobody owns it. It's something we want to fix.
      ```

      You've learnt three things: quality is judged by feel today, a test set exists, and nobody owns it. That's not necessarily a reason to decline. It might be the opportunity: owning evals could be your first big contribution. But you now know, and you can ask the manager whether that's work they'd back.

      Keep your tone curious, never interrogating. You're a future colleague trying to understand how things work, not an auditor.
  - title: Reading the answers, healthy and worrying
    body: |-
      **Incidents.** Healthy: "A cache change leaked data between users. We turned it off in ten minutes, found the cache key missed the user, added a check and a test, and now any cache on personal data gets a security review." Worrying: "We found who changed the prompt and they fixed it." A person named instead of a cause means the same failure can happen again, and suggests people hide mistakes.

      **Quality.** Healthy: "Every prompt change runs against 400 real questions in CI; a drop of two points blocks the merge." Worrying: "People said it felt better." Or an eval set nobody has run this quarter.

      **Priorities.** Healthy: a clear owner, a planning rhythm, and an example of something they chose not to do. Worrying: "Whatever the founder saw at the weekend" or three different answers from three people.

      **On-call.** Healthy: a rota, a sense of how often pages happen, and time given back after a bad night. Worrying: "It's fine" with no numbers, or one person who's always the one who fixes things.

      **Growth.** Healthy: a named example of someone promoted and what they did. Worrying: "It depends" with no example.

      One worrying answer isn't a verdict. Weigh it against everything else, and consider asking a follow-up of a different interviewer. A pattern across several people is the signal to take seriously.
  - title: Questions for AI teams in particular
    body: |-
      AI teams have their own failure modes, and these questions surface them.

      - "Who owns the eval set, and how does it grow?" A named owner and a habit of adding real failures is a strong sign.
      - "What happens when your model provider changes or retires a model?" Shows whether they pin versions, test upgrades against evals, and have a fallback.
      - "How much of the work is prompts and retrieval, and how much is training or fine-tuning?" Tells you what you'll actually do day to day.
      - "How do you handle personal data in prompts and logs?" Shows whether privacy is designed in or bolted on.
      - "How do you stop the assistant taking a harmful action?" For agent products, shows whether write actions need confirmation and tools are scoped.
      - "What does a request cost you, and who watches it?" Shows whether cost is a known number or a monthly surprise.

      Pick the two closest to the role. For an agent product, the harmful-action question matters most. For an assistant over customer documents, ask about personal data and tenant isolation.

      Keep notes after each round: the question, the answer, and how specific it was. Before accepting an offer, reread them side by side.
pitfalls:
  - >-
    **"No, I think you've covered everything."** It reads as low interest. Always have two
    or three questions ready per round.
  - >-
    **Questions the website answers.** "What does the company do?" suggests you didn't
    prepare. Ask what only they can answer.
  - >-
    **Asking for opinions.** "Do you enjoy working here?" gets a yes from almost everyone.
    Ask for a recent example instead.
  - >-
    **The same questions for every interviewer.** An engineer can't tell you the promotion
    criteria, and a recruiter can't describe code review. Match the question to the person.
  - >-
    **Pay questions with engineers.** They rarely know, and it can feel awkward. Save pay,
    holiday and benefits for the recruiter.
  - >-
    **Ignoring what you hear.** Candidates often notice warning signs, then forget them when
    the offer arrives. Keep notes and reread them before deciding.
interview:
  - question: Do you have any questions for us?
    answer: >-
      Always yes, with two or three chosen for this interviewer. To a senior engineer on an
      AI team: "How was the last prompt or model change checked before it shipped? Can you
      walk me through your last incident, and what changed afterwards? And what's the most
      useful thing a code review has taught you here?" Each asks for a recent example, suits
      an engineer, and can't be answered from the website. Follow up once on the most
      revealing answer: "What would you change about that?" Leave a minute at the end to
      thank them. The questions are scored too, so asking how quality is measured signals
      exactly the judgement they're hiring for.
  - question: What are you looking for in your next team?
    answer: >-
      Give two or three concrete things that are true for you and that you've seen evidence
      of here. "Three things. AI at the centre of the product, so quality work matters to the
      business. A team that measures model changes rather than judging them by feel, since
      that's how I work best. And room to own something across teams, like evaluation or the
      retrieval layer. From what I've heard today, your eval gate and the plan to share it
      across product teams fit well." This answer doubles as a check: if you can't connect
      your wishes to what you've heard, that's worth noticing before you accept.
  - question: What do you know about our company?
    answer: >-
      Show research beyond the homepage, then connect it to the role. "You build scheduling
      software for clinics, and last spring you launched an assistant that drafts appointment
      summaries. Your engineering blog described moving from one large prompt to retrieval
      over each clinic's own documents, which cut wrong answers. The posting says you want to
      extend the assistant to more workflows and to own evals across teams. That's the part
      I'd most like to talk about." Specific details from their own writing show genuine
      interest. Avoid reciting funding figures or headcount; they say nothing about why you
      want the job.
terms:
  - term: Questions for us
    say: A polite formality at the end.
    means: The one part of the loop where you gather evidence, and it is scored too. What you
      ask about signals your level.
  - term: Recent example
    say: Asking how they do things.
    means: Asking them to walk through the last time something happened, such as their last
      incident. Real examples are hard to polish, so they show how the team actually works.
  - term: Red flag
    say: Proof the team is bad.
    means: A signal worth a follow-up question, such as vagueness where you asked for an example
      or blame in an incident story. One alone is not a verdict.
  - term: Blameless postmortem
    say: Nobody is held responsible.
    means: An incident review that looks for causes in systems and processes rather than a
      person to punish. People still own the follow-up actions.
