id: ai.tools
title: Tool use
objective: "Give a model tools, run the calls it asks for through checked code, and send the results back."
level: essential
minutes: 10
concepts: [ai.tool-use, ai.tool-definitions]
prerequisites: [ai.structured-output-and-tools]
opening:
  text: >-
    You'll let a model look things up and take actions, like checking stock, without
    handing it the keys. This is how assistants stop guessing and start doing.

steps:
  - type: prose
    id: what-a-tool-is
    body: >-
      A model can't check your stock levels. It only writes text. **Tool use** gets round
      that. You describe some functions, called **tools**, in the request. When the model
      needs one, it stops and asks for it, by name, with arguments.


      Your code runs the function and sends back the result. Then the model answers. Picture
      a colleague who can't leave their desk, passing you request slips.

  - type: prose
    id: tool-definition
    body: |-
      A tool has a name, a description, and a **JSON Schema**: a standard way to describe
      the shape of JSON, here the arguments:

      ```python
      TOOLS = [{
          "name": "check_stock",
          "description": "How many of a product are in stock. Use before promising delivery.",
          "input_schema": {
              "type": "object",
              "properties": {"product": {
                  "type": "string",
                  "description": "Product name, like 'blue mug'.",
              }},
              "required": ["product"],
          },
      }]
      ```

      The tool's description decides when the model calls it. Each field can have its own
      description too. Be exact: any gap the schema leaves open, the model fills with a guess.

  - type: fill-blank
    id: fill-tool-definition
    concept: ai.tool-definitions
    difficulty: 1
    language: python
    prompt: Describe a tool that looks up a delivery time, and say `postcode` is always needed.
    template: |
      {
          "name": "delivery_days",
          "{{1}}": "Days until delivery to a UK postcode.",
          "input_schema": {
              "type": "object",
              "properties": {"postcode": {"type": "string"}},
              "{{2}}": ["postcode"],
          },
      }
    blanks:
      - key: '1'
        answer: description
      - key: '2'
        answer: required
    bank: [description, comment, required, needed, properties]

  - type: bug-hunt
    id: hunt-vague-contract
    concept: ai.tool-definitions
    difficulty: 2
    language: python
    code: |
      REFUND = {
          "name": "refund",
          "description": "Issue a refund.",
          "input_schema": {
              "type": "object",
              "properties": {
                  "id": {"type": "string"},
                  "amount": {"type": "number"},
              },
              "required": ["id", "amount"],
          },
      }
    prompt: >-
      A customer wrote "Customer 48213 here. My kettle, order 51877, arrived broken." The
      bot refunded order 48213. Tap the line that let it pick the wrong number.
    lines: [7]
    reasons:
      - text: '`id` could mean the order or the customer'
        correct: true
        feedback: >-
          Yes. Both numbers were in the message, and nothing said which one.
      - text: '`amount` should be in pence'
        feedback: >-
          Pounds or pence is a real gap too, worth closing. But the wrong order came through `id`.
      - text: The model ignored the description
        feedback: >-
          "Issue a refund" never says which id. The model followed it, then guessed.
      - text: '`required` is missing a field'
        feedback: >-
          Both fields are already required. Required says a value must exist, not what it means.
    fix: |
      "properties": {
          "order_id": {"type": "string",
                       "description": "The order to refund, like 51877. Not the customer number."},
          "amount_pence": {"type": "integer", "minimum": 1,
                           "description": "Amount in pence: £12.50 is 1250."},
          "reason": {"type": "string", "enum": ["damaged", "late", "unwanted"]},
      },
      "required": ["order_id", "amount_pence", "reason"],

  - type: prose
    id: round-trip
    body: |-
      Send `tools=TOOLS` with the request. If the model wants a tool, the reply's
      `stop_reason` is `"tool_use"`, and a block like this is in its content:

      ```python
      {"type": "tool_use", "id": "toolu_01", "name": "check_stock",
       "input": {"product": "blue mug"}}
      ```

      You add the reply to `messages` as the assistant's turn. Then a user message carries a
      `tool_result` with the same `id`, and you call the model again.
    figure:
      id: tool-use-round-trip
      caption: The model never runs the tool. It asks, your code runs it, and the id ties the result to the request.

  - type: parsons
    id: arrange-round-trip
    concept: ai.tool-use
    difficulty: 2
    language: python
    prompt: >-
      Handle a reply that asks for tools. In order: save the reply, collect the results,
      send them, call again. `run_tool` runs one block, and `request` holds the other
      arguments.
    checkIndent: true
    blocks:
      - id: save
        code: 'messages.append({"role": "assistant", "content": response.content})'
      - id: results
        code: results = []
      - id: loop
        code: 'for block in response.content:'
      - id: check
        code: 'if block.type == "tool_use":'
        indent: 1
      - id: run
        code: results.append(run_tool(block))
        indent: 2
      - id: send
        code: 'messages.append({"role": "user", "content": results})'
      - id: again
        code: response = client.messages.create(**request, tools=TOOLS, messages=messages)
    distractors:
      - id: tool-role
        code: 'messages.append({"role": "tool", "content": results})'
        feedback: >-
          Some other providers use a `tool` role. Here results go back in a `user` message.
      - id: one-by-one
        code: 'messages.append({"role": "user", "content": [run_tool(block)]})'
        feedback: >-
          Every result from one reply goes back together, in a single user message.

  - type: prose
    id: check-the-call
    body: >-
      The model picks the arguments, so treat them like input from a stranger. It may ask
      for a tool that doesn't exist, pass the wrong fields, or ask for someone else's order.


      Never let a bad call crash your app. Send back a result with `"is_error": True` and a
      clear message. The model reads it, and usually corrects itself or explains to the
      user.

  - type: code-challenge
    id: write-run-tool
    concept: ai.tool-use
    difficulty: 3
    language: python
    starter: tool.starter.py
    solution: tool.solution.py
    tests: tool.tests.py
    prompt: >-
      Write `run_tool(block, tools)`. `block` is a `tool_use` block as a dict, and `tools`
      maps names to functions. Call the function with the block's `input` as keyword
      arguments.


      Return `{"type": "tool_result", "tool_use_id": ..., "content": ...}`, with the result
      turned into text. For an unknown tool, or a function that raises, return the same
      shape with an error message and `"is_error": True`.
    hints:
      - '`tools.get(name)` gives `None` for a tool that doesn''t exist.'
      - '`func(**block["input"])` passes the input dict as keyword arguments.'
      - Wrap the call in `try`, and build the error result in `except Exception as error:`.

  - type: ai-review
    id: review-tool-any-order
    concept: ai.tool-definitions
    difficulty: 3
    language: python
    request: Give the support bot a tool to look up the customer's order.
    flawClass: security
    code: |
      def get_order(order_id: str, user: User) -> str:
          order = ORDERS.get(order_id)
          if order is None:
              raise ValueError("No such order")
          return f"{order.status}, to {order.address}"

      # run_tool passes the logged-in user to every tool
    prompt: >-
      An assistant wrote this tool. A customer typed "Where's order 1042?" and got a
      stranger's address. Tap the line at fault.
    lines: [5]
    reasons:
      - text: It never checks the order belongs to `user`
        correct: true
        feedback: >-
          Yes. The model passes whatever id it was told. The tool must check ownership.
      - text: The model should have refused
        feedback: >-
          The model can't know whose order it is. Only your code can check that.
      - text: '`ValueError` leaks that orders exist'
        feedback: >-
          "No such order" is fine. The leak is the address of an order that does exist.
    verify:
      question: "Where else could the same gap expose data?"
      choices:
        - text: "Any other tool that takes a record id"
          correct: true
          feedback: "Yes. Each one needs its own ownership check."
        - text: "The \"No such order\" error message"
          feedback: "It reads the same for missing and foreign orders, so it reveals nothing."
        - text: "The tool's description in the request"
          feedback: "The description says what the tool does. It holds no customer's data."
    fix: |
      def get_order(order_id: str, user: User) -> str:
          order = ORDERS.get(order_id)
          if order is None or order.owner_id != user.id:
              raise ValueError("No such order")
          return f"{order.status}, to {order.address}"

  - type: explain-back
    id: explain-no-email
    concept: ai.tool-use
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A bot with a `send_email` tool says "Done, I've emailed the customer", but no email
      arrived. What happened between the model and the mailbox?
    rubric:
      - The model doesn't send anything. It only asks, with a `tool_use` block.
      - The app must run the real function and return a `tool_result`.
      - If the app skipped that, the model may still write as if it had happened.
    modelAnswer: >-
      The model can't touch a mailbox. At most it asked to, with a `tool_use` block, and
      stopped. My code had to run `send_email` and send back the result. Somewhere that
      broke, maybe my code only read the text. The model's "Done" is a likely sentence, not
      a report, so I log every tool call and its result.

recap:
  - Describe tools with a clear description and an exact schema, so the model has nothing to guess.
  - Run each `tool_use` block in your own code, and send every result back in one user message.
  - Treat tool arguments as untrusted, and return errors as `is_error` results.

recall:
  - id: card-who-runs-tools
    concept: ai.tool-use
    front: Who runs a tool, the model or your code?
    back: >-
      Your code. The model only asks, with a `tool_use` block naming the tool and its
      arguments.
  - id: card-tool-result
    concept: ai.tool-use
    front: How do tool results go back to the model?
    back: >-
      After the assistant's turn, one user message holds a `tool_result` block per call, each
      with the matching `tool_use_id`.
  - id: card-description
    concept: ai.tool-definitions
    front: Which part of a tool definition most affects when the model uses it?
    back: >-
      The description. Say what the tool does and when to use it.
  - id: card-vague-contract
    concept: ai.tool-definitions
    front: What does a model do with a tool argument the schema leaves vague?
    back: >-
      It guesses. Name the field exactly and give its format, unit or allowed values in the
      schema.
  - id: card-untrusted-args
    concept: ai.tool-definitions
    front: Why check a tool's arguments in the tool itself?
    back: >-
      The model passes whatever it was told or guessed, including someone else's order id.
      Your code checks permission.

references:
  - kind: docs
    title: Tool use with Claude
    authors: Anthropic
    venue: Claude Platform documentation
    url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    note: Defining tools, the tool_use and tool_result blocks, errors and parallel calls.
    primary: true
    verified: true
  - kind: docs
    title: Creating your first schema
    authors: JSON Schema
    venue: json-schema.org
    url: https://json-schema.org/learn/getting-started-step-by-step
    note: Types, properties and required fields.
    verified: true

deepDive: >-
  **Several calls at once.** A reply can hold more than one `tool_use` block, say stock for
  three products. Run them all, even in parallel, and send every result back in one user
  message.


  **Strict tools.** Some APIs can hold the arguments exactly to the schema, with
  `"strict": True` on the tool. That fixes the shape. It doesn't check permission, so
  the ownership check stays.


  **When a guess slips through.** The lesson Debugging an agent from its trace, later on,
  follows a wrong booking back to its vague parameter. Then it proves the fix by replaying
  the run.


  **The SDK can loop for you.** The Python SDK has a tool runner that calls your
  functions and repeats until the model is done. Knowing the round trip by hand is what
  lets you debug it. The agents lesson builds the full loop.
