deepDive: >-
  At 200,000 days all on target, the brute force takes n times n plus 1, over 2, steps:
  20,000,100,000.


  The rough limits on the constraints screen assume about 100 million simple steps a
  second, a common rule of thumb for judges. From it: n ≤ 20 allows exponential work, n ≤
  500 allows O(n³), n ≤ 5,000 allows O(n²), and n up to a million needs O(n log n) or O(n).
  Treat these as a sanity check, not a law.


  **In a timed test**, the statement often names the expected complexity, such as
  "O(N)". Read it first: it tells you the brute force won't pass the large tests, and
  roughly which pattern will. The later lessons in this chapter each open with the
  signals that point at one pattern.


  The one-pass answer is a tiny case of dynamic programming. The best run ending today
  depends only on one number carried from yesterday.
