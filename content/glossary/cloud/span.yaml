term: span
aka:
  - trace span
  - child span
short: One timed step inside a trace, with a name, a start, a duration and details about that step.
explain: |
  A trace follows one request through a system. It's made of smaller pieces, each one a
  single step: a database query, a model call, a tool call.

  Each piece records when it started, how long it took, whether it failed and a few
  attributes. Pieces nest. An agent run is the parent, and every model call and tool call
  under it is a child. Now a slow run shows you which step was slow.

  Keep secrets and personal data out of the attributes. Record sizes, ids and versions,
  and leave message text out by default.
analogy: One line in a delivery driver's log, such as "left depot 9.02, arrived 9.40". The whole day's log is the trace.
usage: Add a span per tool call, so we can see which step eats the twelve seconds.
related:
  - distributed-tracing
  - observability
  - structured-logging
level: 2
lessons:
  - agents.watching-agents
  - agents.debugging-from-a-trace
