term: path parameter
aka:
  - route parameter
  - path param
short: A variable piece of an address's path that names one particular item.
explain: |
  An API has thousands of orders but one route for them. So the route has a slot,
  written `/orders/{id}` or `/orders/:id`, and each request fills it: `/orders/42`.

  It's for identity, the thing you mean. The server must still treat it as untrusted
  input: parse it, validate it, and check the caller may see item 42. Changing one digit
  in the address is the oldest trick there is.
analogy: The seat number on a ticket. The row and venue are fixed; the number says which seat is yours.
example:
  language: python
  code: |
    @app.get("/orders/{order_id}")
    def read_order(order_id: int):
        return find_order(order_id)
usage: The path parameter arrives as a string, so parse it before you hit the database.
twin:
  term: query-string
  difference: A path parameter identifies the resource, so changing it means a different thing. A query string adjusts the view of it, such as filters or sort order.
related:
  - url
  - endpoint
  - rest
level: 2
