summary: >-
  A tree stores items so that each step down rules out a large share of the rest. That one
  idea gives three structures with three jobs. A **binary search tree** keeps keys in order
  and finds, inserts and deletes in O(log n) while it stays balanced. A **heap** gives up
  full order and keeps only the promise that the smallest item is on top, which is all a
  priority queue needs. A **B-tree** is a search tree built for disk, so wide that a billion
  keys sit four levels deep.


  The costs differ because the machines differ. In memory, a comparison is cheap and the
  depth of the tree is what you count. On disk, a page read costs far more than all the comparisons inside it. So you want as few
  levels as possible, and you pack each node to the size of a page. That's why databases, file systems and key-value stores index with B-trees
  and their relatives.


  You rarely write these structures at work. You meet them through a sorted map, a task
  scheduler, a timer queue or a database index. Knowing how they work tells you when an
  index will help, why sorted inserts can hurt, and why re-sorting an array on every insert falls over
  under load.
remember:
  - A binary search tree finds a key in O(height), which is O(log n) only while the tree stays balanced.
  - Self-balancing trees, such as AVL and red-black trees, rotate nodes on insert and delete to keep the height O(log n).
  - A binary heap is a complete tree in an array where each parent is no larger than its children, so the minimum is at index 0.
  - Heap push and pop cost O(log n), peek costs O(1), and building a heap from n items costs O(n).
  - The children of index i sit at 2i + 1 and 2i + 2, and its parent at floor((i - 1) / 2).
  - A B-tree node fills one disk page with hundreds of keys, so a lookup costs about log base fan-out of n page reads, around four for a billion keys.
  - B-trees stay perfectly balanced by splitting full nodes upwards, so every leaf is at the same depth.
  - Databases use B+ trees, with linked leaf pages, because they serve equality, ranges and ORDER BY from one index.
sections:
  - title: Traversal, deletion and balance in a binary search tree
    body: |-
      A binary search tree keeps one invariant: every key in a node's left subtree is
      smaller, and every key in its right subtree is larger. An **in-order traversal** (left,
      node, right) therefore visits keys in sorted order, which is what a sorted map uses to
      iterate.

      Deleting has three cases. A leaf is removed. A node with one child is replaced by that
      child. A node with two children takes the key of its **in-order successor**, the
      smallest key in its right subtree. That successor is then deleted from below, where it
      has at most one child.

      Every operation costs O(height). A random insertion order gives a height of about
      O(log n), but sorted or nearly sorted input gives a line. Self-balancing trees fix this
      with **rotations**, which change the shape without changing the in-order sequence.

      ```ts
      type TreeNode = { key: number; left: TreeNode | null; right: TreeNode | null };
      const node = (key: number, left: TreeNode | null = null, right: TreeNode | null = null): TreeNode => ({ key, left, right });

      function inOrder(root: TreeNode | null, out: number[] = []): number[] {
        if (root === null) return out;
        inOrder(root.left, out);
        out.push(root.key);
        inOrder(root.right, out);
        return out;
      }

      function height(root: TreeNode | null): number {
        return root === null ? 0 : 1 + Math.max(height(root.left), height(root.right));
      }

      // The left child becomes the parent. The sorted order is unchanged.
      function rotateRight(root: TreeNode): TreeNode {
        const pivot = root.left as TreeNode;
        root.left = pivot.right;
        pivot.right = root;
        return pivot;
      }

      const leaning = node(30, node(20, node(10)));
      console.log(height(leaning), inOrder(leaning)); // 3 [ 10, 20, 30 ]
      const fixed = rotateRight(leaning);
      console.log(height(fixed), inOrder(fixed), fixed.key); // 2 [ 10, 20, 30 ] 20
      ```

      An **AVL tree** keeps the heights of every node's two subtrees within 1 of each other.
      A **red-black tree** colours nodes and keeps rules that bound the height to about twice
      the minimum. AVL trees are more tightly balanced, so lookups are slightly faster.
      Red-black trees do fewer rotations on insert and delete. Java's `TreeMap` is a
      red-black tree. JavaScript has no built-in sorted map: `Map` keeps insertion order, not
      key order.
  - title: A binary heap you can run
    body: |-
      A binary heap is a **complete** tree: every level is full except possibly the last,
      which fills from the left. That shape is what lets it live in a plain array with no
      pointers. The **heap property** is weaker than a search tree's: each parent is no
      larger than its children, and siblings are in no particular order.

      Push appends the item and **sifts it up**, swapping with its parent while it's
      smaller. Pop takes index 0, moves the last item to the top and **sifts it down**,
      swapping with its smaller child. Both walk one path of height log n. Node 24 has no
      built-in priority queue, so this is the shape a library gives you.

      ```ts
      class MinHeap<T> {
        private items: T[] = [];
        constructor(private readonly less: (a: T, b: T) => boolean) {}

        get size(): number {
          return this.items.length;
        }

        peek(): T | undefined {
          return this.items[0];
        }

        push(item: T): void {
          this.items.push(item);
          let i = this.items.length - 1;
          while (i > 0) {
            const parent = Math.floor((i - 1) / 2);
            if (!this.before(i, parent)) break;
            this.swap(i, parent);
            i = parent;
          }
        }

        pop(): T | undefined {
          const top = this.items[0];
          const last = this.items.pop();
          if (this.items.length > 0 && last !== undefined) {
            this.items[0] = last;
            let i = 0;
            while (true) {
              const left = 2 * i + 1;
              const right = left + 1;
              let first = i;
              if (left < this.items.length && this.before(left, first)) first = left;
              if (right < this.items.length && this.before(right, first)) first = right;
              if (first === i) break;
              this.swap(i, first);
              i = first;
            }
          }
          return top;
        }

        private before(i: number, j: number): boolean {
          return this.less(this.items[i] as T, this.items[j] as T);
        }

        private swap(i: number, j: number): void {
          [this.items[i], this.items[j]] = [this.items[j] as T, this.items[i] as T];
        }
      }

      type Job = { name: string; priority: number };
      const jobs = new MinHeap<Job>((a, b) => a.priority < b.priority);
      jobs.push({ name: 'invoice', priority: 3 });
      jobs.push({ name: 'refund', priority: 1 });
      jobs.push({ name: 'newsletter', priority: 9 });
      jobs.push({ name: 'receipt', priority: 2 });
      console.log(jobs.peek()?.name); // refund

      const order: string[] = [];
      for (let job = jobs.pop(); job !== undefined; job = jobs.pop()) order.push(job.name);
      console.log(order); // [ 'refund', 'receipt', 'invoice', 'newsletter' ]
      ```

      A heap is not stable: two jobs with equal priority can come out in either order.
  - title: What heaps are for
    body: |-
      Reach for a heap whenever you repeatedly need the smallest or largest of a changing
      set.

      - **Scheduling.** Timers ordered by due time, jobs by priority, retries by next attempt.
      - **Top k.** Keep a min-heap of size k while you stream n items. Each new item that
        beats the top replaces it. That's O(n log k) time and O(k) memory, far better than
        sorting everything when k is small.
      - **Merging k sorted lists.** Put the head of each list in a heap and pop the smallest,
        which is how external sorts and log merges work, in O(n log k).
      - **Shortest paths.** Dijkstra's algorithm, in the graphs lesson, is breadth-first
        search with a heap in place of the queue.

      ```ts
      // Uses the MinHeap class from the section above.
      function topK(scores: number[], k: number): number[] {
        const heap = new MinHeap<number>((a, b) => a < b);
        for (const score of scores) {
          if (heap.size < k) heap.push(score);
          else if (score > (heap.peek() as number)) {
            heap.pop();
            heap.push(score);
          }
        }
        const out: number[] = [];
        for (let s = heap.pop(); s !== undefined; s = heap.pop()) out.push(s);
        return out.reverse();
      }
      console.log(topK([5, 1, 9, 3, 7, 9, 2], 3)); // [ 9, 9, 7 ]
      ```

      Two facts come up in interviews. First, you can build a heap from an unsorted array in
      O(n), not O(n log n): sift down from the last parent back to the root. Most nodes sit
      near the bottom and move only a little. Second, **heap sort** builds a max-heap and
      pops into the end of the array. It sorts in place in O(n log n) even in the worst case.
      It isn't stable, though, and its jumpy memory access makes it slower in practice than
      a good merge or quick sort.

      What a heap can't do cheaply: find an arbitrary item (O(n)), or list everything in
      order without popping it all. If you need both order and lookups, you want a balanced
      search tree.
  - title: How a database B-tree is laid out and kept balanced
    body: |-
      A B-tree node holds many sorted keys and one more child pointer than keys. The keys
      split the key space: everything between two neighbouring keys lives under the pointer
      between them. A lookup does a binary search inside the node, which is already in
      memory, then follows one pointer, one page read per level.

      The height is roughly the logarithm of the key count, in base fan-out.

      ```js
      for (const fanOut of [2, 100, 300, 500]) {
        console.log(fanOut, Math.ceil(Math.log(1e9) / Math.log(fanOut)));
      }
      // 2 30
      // 100 5
      // 300 4
      // 500 4
      ```

      Inserts go into a leaf. When a leaf is full it **splits** into two half-full nodes and
      pushes its middle key up into the parent. If the parent is full it splits too. When the
      root splits, the tree gains a level at the top. Growth happens only at the root, so
      every leaf stays at the same depth, and no rebalancing pass is ever needed. Deletes do
      the reverse, merging or borrowing from siblings. PostgreSQL skips the merging: it
      leaves half-empty pages alone and only removes pages that become completely empty.

      Databases use the **B+ tree** variant. Inner nodes hold only keys and pointers, so
      they fit more keys per page. Leaves hold the entries, each pointing at a row, and each
      leaf links to its neighbour. A range query like `WHERE created_at BETWEEN $1 AND $2`
      descends once to the first match and then walks sideways along the leaves. The same
      walk returns rows in key order, so an index can satisfy `ORDER BY` without a sort.

      The top levels of a busy index are small and read constantly, so they stay in the
      buffer cache. In practice a lookup often costs one or two real disk reads.

      B-trees aren't the only design. Hash indexes answer equality in about one step but
      can't serve ranges or order. Write-heavy stores such as RocksDB and Cassandra use
      **LSM trees**, which buffer writes in memory and flush sorted files, trading slower
      reads for cheaper writes.
pitfalls:
  - '**Building a search tree from sorted input.** Each key goes right, the tree becomes a linked list and every operation is O(n). Use a self-balancing tree from a library, or shuffle when you control the input.'
  - '**Re-sorting an array for every insert.** Each push then costs O(n log n), which is fine for five items and collapses at twenty thousand. Use a heap when you only need the next smallest item.'
  - '**Expecting a heap''s array to be sorted.** Only index 0 is guaranteed. Printing the array or iterating over it gives heap order, not sorted order. Pop repeatedly, or sort a copy, when you need everything in order.'
  - '**Relying on a heap to keep equal items in insertion order.** Heaps are not stable, so jobs with equal priority can swap places. Add a sequence number as a tie-breaker in the comparator.'
  - '**Using `Array.prototype.shift` as a queue pop at scale.** Removing index 0 moves every other item, O(n) each time. A heap pops from the top in O(log n) by moving the last item up, never shifting the array.'
  - '**Thinking an index helps every query.** A B-tree index on `(last_name, first_name)` serves lookups on `last_name`. A query on `first_name` alone can''t descend to one spot, because entries are sorted by `last_name` first. PostgreSQL 18 can skip-scan such an index, which pays off only when the leading column has few distinct values. Match the column order to how you query.'
interview:
  - question: Why do databases use B-trees rather than binary search trees for indexes?
    answer: >-
      Because on disk the cost is page reads, and a B-tree needs far fewer of them. Both are
      logarithmic, but a binary tree's base is 2, so a billion keys need about thirty
      levels. Each level is a separate page read, and a page read costs vastly more than a
      comparison in memory. A B-tree node is sized to a page and holds hundreds of keys, so
      the same billion keys fit in about four levels, and the top levels usually sit in the
      cache. Splitting keeps every leaf at the same depth without rebalancing, and the B+
      tree variant links its leaves so range scans and ORDER BY are one walk along the
      bottom. For purely in-memory data, a balanced binary tree or a hash map is often the
      better choice, because there the depth is cheap and the wide nodes waste comparisons.
  - question: Implement a priority queue. What operations does it support and at what cost?
    answer: >-
      I'd use a binary min-heap stored in an array. Push appends the item and sifts it up,
      swapping with its parent at `floor((i - 1) / 2)` while it's smaller, O(log n). Pop
      saves index 0, moves the last item to the top and sifts it down, swapping with the
      smaller of the children at `2i + 1` and `2i + 2`, also O(log n). Peek reads index 0 in
      O(1). Building from n existing items costs O(n) with bottom-up heapify. The comparator
      is a parameter, so the same code serves timers, jobs or Dijkstra. One trade-off is that
      finding or updating an arbitrary item is O(n) unless you keep an index map beside it.
      Another is that the heap isn't stable, so equal priorities need a sequence number if
      order among them matters.
  - question: How would you find the 10 largest values in a stream of a billion numbers?
    answer: >-
      Keep a min-heap of size 10 as the numbers stream past. The heap holds the ten largest
      values seen so far, with the smallest of them on top. For each new number, if the heap
      has fewer than ten items I push it. Otherwise, if the number beats the top, I pop the
      top and push the new one. Each step is O(log 10), so the whole pass is O(n log k) time
      and O(k) memory, and it never holds the billion numbers at once. Sorting would need
      O(n log n) time and all the data in memory. If the numbers were split across machines,
      each would compute its own top ten and a final step would merge them. For a single
      in-memory array, quickselect finds the top k in average O(n), but it needs the whole
      array and reorders it.
  - question: What makes a binary search tree unbalanced, and how do self-balancing trees fix it?
    answer: >-
      Insertion order. A plain BST hangs each key on the first empty side, so sorted input
      sends every key right and the tree becomes a linked list with O(n) operations. Random
      order gives an expected height of O(log n), but real data is often sorted, such as
      timestamps or auto-increment ids. Self-balancing trees check a balance condition after
      each insert or delete and repair it with rotations, which change parent and child
      links without changing the in-order sequence. An AVL tree keeps sibling subtree heights
      within one. A red-black tree uses node colours to keep the longest path at most about
      twice the shortest. AVL gives slightly faster lookups, red-black fewer rotations on
      writes. In practice I use a library or the language's sorted map, such as Java's
      `TreeMap`, rather than writing one.
