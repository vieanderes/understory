id: webhook-ledger
title: WebhookLedger
topic: api-integration
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: E, type: "int[]" }
    - { name: D, type: "int[]" }
    - { name: V, type: "int[]" }
    - { name: X, type: "int[]" }
  returns: "int[][]"
statement: |-
  A service receives webhooks that report changes to records. Webhook K has the event id
  E[K] and says: record D[K] is now at version V[K] with the value X[K]. The sender
  delivers at least once and does not keep order, so the same event can arrive twice, and an
  old version can arrive after a newer one.

  The webhooks are handled in array order, with these rules:

  - an event whose id has already arrived, earlier in the array, is a **duplicate** and is
    ignored, whatever happened to the earlier copy;
  - otherwise, if the record is already at version V[K] or higher, the event is **stale**
    and is ignored;
  - otherwise the record takes version V[K] and value X[K]. Every record starts at version
    0.

  Write a function:

  {{signature}}

  that, given arrays E, D, V and X of N integers each, returns an array of rows. The first
  row is [U, S]: the number of duplicates and the number of stale events. Then comes one row
  [D, V, X] for every record that took at least one event, giving its final version and
  value, in ascending order of record id.

  For example, given E = [1, 2, 3, 2, 4], D = [7, 7, 9, 7, 7], V = [1, 3, 1, 3, 2] and
  X = [10, 30, 5, 30, 20], the function should return [[1, 1], [7, 3, 30], [9, 1, 5]].
  Event 2 arrives twice, and event 4 brings version 2 after record 7 has reached version 3.

  Given E = [5, 5], D = [1, 2], V = [1, 1] and X = [8, 9], the function should return
  [[1, 0], [1, 1, 8]]: the second webhook reuses event id 5, so it is a duplicate even
  though it names another record.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of arrays E and D is an integer within the range [1..1,000,000,000];
  - each element of array V is an integer within the range [1..1,000,000,000];
  - each element of array X is an integer within the range [0..1,000,000,000].
examples:
  - { args: [[1, 2, 3, 2, 4], [7, 7, 9, 7, 7], [1, 3, 1, 3, 2], [10, 30, 5, 30, 20]], expected: [[1, 1], [7, 3, 30], [9, 1, 5]] }
  - { args: [[5, 5], [1, 2], [1, 1], [8, 9]], expected: [[1, 0], [1, 1, 8]] }
tests:
  - name: extreme_single
    description: one webhook
    group: correctness
    cases:
      - { args: [[1], [1], [1], [0]], expected: [[0, 0], [1, 1, 0]] }
      - { args: [[1000000000], [1000000000], [1000000000], [1000000000]], expected: [[0, 0], [1000000000, 1000000000, 1000000000]] }
  - name: equal_version
    description: the same version twice with different events is stale
    group: correctness
    cases:
      - { args: [[1, 2], [4, 4], [2, 2], [10, 99]], expected: [[0, 1], [4, 2, 10]] }
      - { args: [[3, 1, 2], [4, 4, 4], [5, 4, 6], [50, 40, 60]], expected: [[0, 1], [4, 6, 60]] }
  - name: duplicate_of_stale
    description: a duplicate is counted as a duplicate even if its first copy was stale
    group: correctness
    cases:
      - { args: [[1, 2, 2, 2], [8, 8, 8, 8], [5, 1, 1, 1], [1, 2, 2, 2]], expected: [[2, 1], [8, 5, 1]] }
      - { args: [[9, 9, 9], [3, 3, 3], [1, 2, 3], [7, 8, 9]], expected: [[2, 0], [3, 1, 7]] }
  - name: out_of_order
    description: versions arrive in reverse and in a shuffle
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4], [2, 2, 2, 2], [4, 3, 2, 1], [40, 30, 20, 10]], expected: [[0, 3], [2, 4, 40]] }
      - { args: [[1, 2, 3, 4, 5], [6, 5, 6, 5, 6], [2, 1, 1, 9, 3], [1, 2, 3, 4, 5]], expected: [[0, 1], [5, 9, 4], [6, 3, 5]] }
  - name: small_random
    description: random webhooks, N = 50
    group: correctness
    cases:
      - generate: { seed: 5101, args: [{ kind: ints, n: 50, min: 1, max: 30 }, { kind: ints, n: 50, min: 1, max: 5 }, { kind: ints, n: 50, min: 1, max: 6 }, { kind: ints, n: 50, min: 0, max: 100 }] }
      - generate: { seed: 5102, args: [{ kind: ints, n: 50, min: 1, max: 1000 }, { kind: ints, n: 50, min: 1, max: 20 }, { kind: ints, n: 50, min: 1, max: 1000000000 }, { kind: ints, n: 50, min: 0, max: 1000000000 }] }
  - name: medium_random
    description: random webhooks, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 5103, args: [{ kind: ints, n: 2000, min: 1, max: 1500 }, { kind: ints, n: 2000, min: 1, max: 100 }, { kind: ints, n: 2000, min: 1, max: 50 }, { kind: ints, n: 2000, min: 0, max: 1000 }] }
  - name: large_random
    description: random webhooks, few repeats, N = 100,000
    group: performance
    cases:
      - generate: { seed: 5104, args: [{ kind: ints, n: 100000, min: 1, max: 1000000000 }, { kind: ints, n: 100000, min: 1, max: 1000000000 }, { kind: ints, n: 100000, min: 1, max: 1000000000 }, { kind: ints, n: 100000, min: 0, max: 1000000000 }] }
  - name: large_hot_records
    description: ten records, many versions, N = 100,000
    group: performance
    cases:
      - generate: { seed: 5105, args: [{ kind: permutation, n: 100000 }, { kind: ints, n: 100000, min: 1, max: 10 }, { kind: ints, n: 100000, min: 1, max: 100000 }, { kind: ints, n: 100000, min: 0, max: 1000 }] }
  - name: large_redelivery
    description: half of the webhooks are repeats, N = 100,000
    group: performance
    cases:
      - generate: { seed: 5106, args: [{ kind: ints, n: 100000, min: 1, max: 50000 }, { kind: ints, n: 100000, min: 1, max: 5000 }, { kind: ints, n: 100000, min: 1, max: 100 }, { kind: ints, n: 100000, min: 0, max: 1000 }] }
