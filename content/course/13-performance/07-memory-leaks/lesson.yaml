deepDive: >-
  The 49 MB and 8 MB came from Node with `--expose-gc`, forcing a collection before each
  reading. In V8, closures made in the same call share one set of captured variables. If any
  of them uses `rows`, all of them keep it.


  `addEventListener` also takes `{ signal }` from an `AbortController`. One
  `controller.abort()` then removes every listener added with that signal, which is handy
  when a widget adds several.


  A cache that only grows is a leak with a nicer name. Give it a size limit or a lifetime.
  `WeakMap` holds its keys weakly: an entry goes when nothing else refers to its key object.


  In React, an effect that adds a listener or starts a timer returns a function that removes
  or clears it. The Performance monitor in DevTools graphs the heap live, which shows a
  climbing line before you take any snapshot.
