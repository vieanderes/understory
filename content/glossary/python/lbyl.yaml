term: LBYL
aka:
  - look before you leap
short: The habit of checking every condition before an operation, so it can't fail when it runs.
explain: |
  `if key in prices:` before reading `prices[key]`. `if os.path.exists(path):` before opening
  it. Each check guards the line after it.

  It reads clearly. It suits cases where failure is common and cheap to test, or can't be undone. Many languages without cheap exceptions work this way.

  The trap is a check that goes stale. Another process deletes the file between the check and
  the open, and the code fails anyway. When the world can change in between, try and catch.
analogy: Phoning the shop to ask if it's open before you walk there. By the time you arrive, it may have shut.
example:
  language: python
  code: |
    if item_id in prices:
        price = prices[item_id]
    else:
        price = DEFAULT_PRICE
usage: LBYL is fine for the dict lookup, but for the file use try and except.
twin:
  term: eafp
  difference: LBYL checks first and then acts. EAFP acts and handles the failure, which stays correct when things change between a check and the act.
related:
  - eafp
  - guard-clause
  - race-condition
level: 3
lessons:
  - pro.pythonic
