deepDive: >-
  **What JSX compiles to.** The build tool turns `<li className="todo">Buy milk</li>` into
  `jsx("li", { className: "todo", children: "Buy milk" })`, imported from `react/jsx-runtime`.
  A lowercase tag becomes a string, an HTML element. A capitalised one becomes the variable,
  your component.


  **The element object.** An element also carries `$$typeof`, set to a `Symbol`. JSON can't
  encode a symbol, so an object from a server or a user can never pass for an element. That
  closes one route to script injection. In React 19 the symbol is
  `Symbol.for("react.transitional.element")`, and `ref` is an ordinary prop.


  **Why purity matters more later.** React may start a render, pause it, throw it away and
  start again. A render that wrote to the outside world would leave traces of work that never
  reached the screen. Only the commit happens once per update.
