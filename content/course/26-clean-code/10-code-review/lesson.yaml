id: clean.code-review
title: Reviewing code like a senior
objective: Review in order of what matters, write comments that are clear about severity, and keep changes small enough to review well.
level: advanced
minutes: 9
concepts: [clean.review-priorities, clean.review-comments, clean.small-changes]
prerequisites: [cloud.progressive-delivery, clean.duplication]
opening:
  text: >-
    You'll review a change the way experienced engineers do: the dangerous things first,
    the cosmetic things last. Good reviews catch real bugs and teach the author something.

steps:
  - type: prose
    id: review-order
    body: |-
      Review in order of what it costs to miss. First **correctness**: does it do what it
      claims, including the edge cases? Then security and data safety. Then design: does it
      fit, and can it change safely? Then tests.

      Naming and readability come last. Formatting shouldn't come up at all: the linter and
      formatter own it.

  - type: multiple-choice
    id: pick-first-check
    concept: clean.review-priorities
    difficulty: 1
    question: You have ten minutes to review a change. What do you check first?
    choices:
      - text: Does it do the right thing?
        correct: true
        feedback: >-
          Yes. A well-named bug is still a bug. Correctness comes first.
      - text: Are the variable names good?
        feedback: >-
          Names matter, but a clear name on wrong logic still ships the wrong logic.
      - text: Is the formatting consistent?
        feedback: >-
          That's the formatter's job. Don't spend your ten minutes on it.

  - type: bug-hunt
    id: hunt-hidden-change
    concept: clean.review-priorities
    difficulty: 3
    language: ts
    code: |
      export function applyCoupon(order: Order, coupon: Coupon): Order {
        if (coupon.expiresAt > new Date()) return order;
        const discount = Math.round((order.totalPence * coupon.percent) / 100);
        return { ...order, totalPence: order.totalPence - discount };
      }
    prompt: >-
      The pull request says "Rename variables only". This function changed too. Tap the line
      that changes behaviour.
    lines: [2]
    reasons:
      - text: Valid coupons are now ignored, expired ones applied
        correct: true
        feedback: >-
          Yes. The comparison flipped. A "rename only" title invites skimming.
      - text: '`Math.round` loses pennies'
        feedback: >-
          Rounding to whole pence is expected here. Line 2 is the real change.
      - text: The spread copies the whole order
        feedback: >-
          Copying and overriding one field is the right way to return a changed order.
    fix: |
      export function applyCoupon(order: Order, coupon: Coupon): Order {
        if (coupon.expiresAt < new Date()) return order;
        const discount = Math.round((order.totalPence * coupon.percent) / 100);
        return { ...order, totalPence: order.totalPence - discount };
      }

  - type: ai-review
    id: review-missing-ownership
    concept: clean.review-priorities
    difficulty: 4
    language: ts
    request: Add a function that returns an invoice by id for the logged-in user.
    flawClass: security
    code: |
      export async function getInvoice(user: User, invoiceId: string) {
        const invoice = await db.invoices.find(invoiceId);
        if (!invoice) throw new NotFoundError(invoiceId);
        return invoice;
      }
    prompt: >-
      An assistant wrote this. Its tests pass, but they only ever log in as the invoice's
      owner. Tap the line that must not ship as it is.
    lines: [4]
    reasons:
      - text: It returns any user's invoice
        correct: true
        feedback: >-
          Exactly. `user` is never checked against the owner. That's a must-fix, not a nit.
      - text: '`find` should be `findOne`'
        feedback: >-
          The method name is fine for this example. Nobody checks who owns the invoice.
      - text: '`NotFoundError` should be a 500'
        feedback: >-
          A missing invoice is a not-found case. The problem is the invoice that is found.
    fix: |
      export async function getInvoice(user: User, invoiceId: string) {
        const invoice = await db.invoices.find(invoiceId);
        if (!invoice || invoice.ownerId !== user.id) throw new NotFoundError(invoiceId);
        return invoice;
      }

  - type: prose
    id: comment-labels
    body: |-
      Start each comment with a label, so the author knows how much it matters:

      - **question**: I don't follow, can you explain?
      - **suggestion**: consider this, your call.
      - **nit**: tiny, optional polish.
      - **must-fix**: this blocks the merge, and here's why.

      Say what you saw and why it matters. Praise what's good, too.

  - type: multiple-choice
    id: pick-comment-label
    concept: clean.review-comments
    difficulty: 2
    question: '"`getData` could be `loadInvoices`. It works either way." Which label fits?'
    choices:
      - text: nit
        correct: true
        feedback: >-
          Right. It's small and optional, and the label says so.
      - text: must-fix
        feedback: >-
          Nothing breaks with the old name. Blocking the merge for it costs the author a day.
      - text: question
        feedback: >-
          The reviewer isn't asking anything. It's a small, optional suggestion.

  - type: prose
    id: small-changes
    body: |-
      Reviewers read a 50-line change closely. At 2,000 lines, they skim, and bugs slip
      through. Keep pull requests **small and focused**: one idea each, with refactors and
      features in separate changes.

      Reviews show changes as a **diff**: a `-` line was removed, and a `+` line was added.

  - type: bug-hunt
    id: pick-split-pr
    concept: clean.small-changes
    difficulty: 2
    language: text
    code: |2
       // Fix: VAT was rounded down on invoices
      -export function calcTotal(lines: Line[]): number {
      +export function invoiceTotal(lines: Line[]): number {
         const net = lines.reduce((sum, line) => sum + line.pricePence * line.qty, 0);
      -  const vat = Math.floor(net * VAT_RATE);
      +  const vat = Math.round(net * VAT_RATE);
         return net + vat;
       }
    prompt: >-
      The pull request is titled "Fix VAT rounding". Tap the line that belongs in a separate
      pull request.
    lines: [3]
    reasons:
      - text: The rename, which breaks every caller of `calcTotal`
        correct: true
        feedback: >-
          Yes. A rename is a refactor. Hidden in a fix, it gets skimmed.
      - text: The switch from `floor` to `round`
        feedback: >-
          That's the fix the title promises. It belongs right here.
      - text: The `reduce` that sums the lines
        feedback: >-
          That line didn't change. No `-` or `+` in front means it's context.
    fix: |2
       // Fix: VAT was rounded down on invoices
       export function calcTotal(lines: Line[]): number {
         const net = lines.reduce((sum, line) => sum + line.pricePence * line.qty, 0);
      -  const vat = Math.floor(net * VAT_RATE);
      +  const vat = Math.round(net * VAT_RATE);
         return net + vat;
       }

  - type: explain-back
    id: explain-review-comment
    concept: clean.review-comments
    difficulty: 3
    prompt: >-
      Write the comment you'd leave on the assistant's `getInvoice`. Start it with a label.
    rubric:
      - It starts with must-fix, because the change can't merge as it is.
      - It says what's wrong, in words the author can check, such as any user reading any invoice.
      - It says why it matters or how to fix it, such as checking the owner before returning.
    modelAnswer: >-
      must-fix: `getInvoice` never compares `invoice.ownerId` with `user.id`, so any logged-in
      user can read any invoice by guessing its id. Could we treat a stranger's invoice as not
      found, and add a test that logs in as someone else?

recap:
  - Review correctness and security first, then design and tests, then naming.
  - Label each comment as a question, suggestion, nit or must-fix, and say why.
  - Ask for small, focused changes that can be read closely.
recall:
  - id: card-review-order
    concept: clean.review-priorities
    front: In what order do you review a change?
    back: >-
      Correctness, then security and data safety, then design and tests, then naming. Leave
      formatting to tools.
  - id: card-labels
    concept: clean.review-comments
    front: What are the four common labels for a review comment?
    back: >-
      Question, suggestion, nit and must-fix. Only must-fix blocks the merge.
  - id: card-good-comment
    concept: clean.review-comments
    front: What does a useful review comment contain?
    back: >-
      How serious it is, what you saw, and why it matters.
  - id: card-small-prs
    concept: clean.small-changes
    front: A pull request mixes a refactor and a feature. What do you ask for?
    back: >-
      Two pull requests: the refactor first, then the feature, each small enough to read
      closely.

