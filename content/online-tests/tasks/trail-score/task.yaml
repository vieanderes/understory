id: trail-score
title: TrailScore
topic: dynamic-programming
difficulty: hard
type: algorithmic
recommendedMinutes: 45
signature:
  params:
    - { name: K, type: int }
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A hiking trail has N checkpoints in a line, numbered from 0 to N − 1. Checkpoint I is
  worth A[I] points, and the value may be negative. A hiker starts at checkpoint 0 and must
  finish at checkpoint N − 1. Each day the hiker walks forward between 1 and K checkpoints
  and stops at the one reached. The hiker's score is the sum of the points of every
  checkpoint where they stop, including the first and the last.

  Write a function:

  {{signature}}

  that, given an integer K and an array A of N integers, returns the highest score the
  hiker can reach.

  For example, given K = 2 and A = [3, −5, −2, 4, −8, −1, 6], the function should return
  10: the hiker stops at checkpoints 0, 2, 3, 5 and 6, for 3 − 2 + 4 − 1 + 6 = 10.

  Given K = 3 and the same array A, the function should return 13, by stopping at
  checkpoints 0, 3 and 6.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [2..100,000];
  - K is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [−10,000..10,000].
examples:
  - { args: [2, [3, -5, -2, 4, -8, -1, 6]], expected: 10 }
  - { args: [3, [3, -5, -2, 4, -8, -1, 6]], expected: 13 }
tests:
  - name: extreme_small
    description: two checkpoints
    group: correctness
    cases:
      - { args: [1, [-4, -6]], expected: -10 }
      - { args: [100000, [10000, 10000]], expected: 20000 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [1, [1, -2, 3, -4]], expected: -2 }
      - { args: [4, [0, 5, -1, -1, -1, -1, 2]] }
  - name: negative_only
    description: every checkpoint costs points
    group: correctness
    cases:
      - generate: { seed: 701, args: [{ kind: value, value: 3 }, { kind: ints, n: 40, min: -10000, max: -1 }] }
      - generate: { seed: 702, args: [{ kind: value, value: 100 }, { kind: ints, n: 60, min: -10000, max: -1 }] }
  - name: small_random
    description: random, N = 100
    group: correctness
    cases:
      - generate: { seed: 703, args: [{ kind: int, min: 1, max: 10 }, { kind: ints, n: 100, min: -100, max: 100 }] }
      - generate: { seed: 704, args: [{ kind: value, value: 6 }, { kind: ints, n: 100, min: -10000, max: 10000 }] }
  - name: medium_random
    description: random, N = 3,000
    group: correctness
    cases:
      - generate: { seed: 705, args: [{ kind: value, value: 200 }, { kind: ints, n: 3000, min: -10000, max: 10000 }] }
  - name: large_random
    description: random, N = 100,000, K = 50,000
    group: performance
    cases:
      - generate: { seed: 706, args: [{ kind: value, value: 50000 }, { kind: ints, n: 100000, min: -10000, max: 10000 }] }
  - name: extreme_large
    description: falling values and K = N, N = 100,000
    group: performance
    cases:
      - generate: { seed: 707, args: [{ kind: value, value: 100000 }, { kind: repeat, times: 20000, unit: [10000, 5000, 0, -5000, -10000] }] }
      - generate: { seed: 708, args: [{ kind: value, value: 100000 }, { kind: ints, n: 100000, min: -10000, max: -9000 }] }
