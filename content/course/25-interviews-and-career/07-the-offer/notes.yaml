summary: |-
  An offer is a package: base salary, bonus, equity with its vesting schedule, the level you join at, sign-on money and benefits. Comparing two offers honestly means putting each part on a yearly basis and keeping certain money apart from money that depends on results or a future sale. Then you weigh what money can't show: the level, the team, the work and what you learnt about them in the loop.

  Negotiation at this stage is expected. Recruiters budget for it, and a warm, reasoned ask, made once with a specific number, rarely costs an offer. The strongest reasons are market data for the level and a real competing offer. The weakest moves are anchoring on your current salary, inventing an offer, or haggling repeatedly.

  These notes give a runnable way to lay offers side by side, the questions to ask about equity, how to find market data without guessing, and what to cover at every stage from the first recruiter call to accepting or declining. They give no salary figures: pay varies too much by country, city, company and year, so the notes show how to find the numbers instead.
remember:
  - Compare offers yearly, with certain money (base), maybe money (bonus, equity) and one-off money (sign-on) in separate columns.
  - Ask for more once, warmly, with a specific number and a reason, such as published ranges for the level or a real competing offer.
  - Keep your current salary out of the conversation, because it anchors the offer on your past pay instead of the market rate.
  - When base is at the top of the band, ask about level, a sign-on bonus, equity or start date, since those often move when base can't.
  - Level is the lever people forget, because it sets the pay band, the scope and the next promotion for years.
  - Never invent a competing offer, since recruiters can ask to see it and trust goes with it.
  - Get the full offer in writing, including equity terms, before you accept, and look up the pay rules where the job is.
sections:
  - title: Laying offers side by side
    body: |-
      Put each offer into three yearly numbers: certain, maybe and one-off. The figures below are illustrative only; replace them with your own.

      ```js
      // Illustrative figures only. Certain money, maybe money and one-off money stay apart.
      function perYear(offer, vestYears = 4) {
        const bonus = offer.base * (offer.bonusTarget ?? 0) * (offer.bonusPayoutGuess ?? 0);
        const equity = ((offer.equityGrant ?? 0) / vestYears) * (offer.equityHaircut ?? 0);
        return {
          certain: offer.base,
          maybe: Math.round(bonus + equity),
          oneOff: offer.signOn ?? 0,
        };
      }

      const a = { base: 120_000, signOn: 20_000, bonusTarget: 0.1, bonusPayoutGuess: 0.7 };
      const b = { base: 130_000, equityGrant: 80_000, equityHaircut: 0.2 };
      console.log('A', perYear(a)); // A { certain: 120000, maybe: 8400, oneOff: 20000 }
      console.log('B', perYear(b)); // B { certain: 130000, maybe: 4000, oneOff: 0 }
      ```

      Two numbers here are your judgement, and saying so is the point. `bonusPayoutGuess` is how much of the target bonus you expect to see; ask what the bonus actually paid out in recent years. `equityHaircut` is how much of private-company equity's paper value you count; a young start-up's options deserve a low figure, since their value depends on a sale or listing that may never happen.

      Offer B wins on certain money every year. Offer A's sign-on is real but paid once. Ask whether it must be repaid if you leave within a set period, which is common.

      Then write a second list that money can't capture: level, the team you met, the quality of answers to your questions, the product, the commute or remote policy, and what you'd learn.
  - title: Equity, and the questions that price it
    body: |-
      Equity comes in two common forms, and they behave differently.

      **Shares granted outright** (often called restricted stock units, or RSUs) become yours as they vest. At a listed company you can value them at today's share price, remembering that it moves.

      **Options** are the right to buy shares later at a fixed price, the strike price. They're worth something only if the shares end up worth more than the strike, and you usually pay to exercise them. At a private company there may be no way to sell until a sale or listing.

      Questions to ask, in writing:

      - How many shares or options, and what fraction of the company is that? A share count alone means nothing.
      - What's the vesting schedule, and is there a cliff before the first portion vests?
      - For options: what's the strike price, and how long do I have to exercise vested options if I leave?
      - What was the latest valuation or share price used to value the grant?
      - Are there refresh grants for existing staff, and how are they decided?

      Tax treatment of equity varies by country and by the type of grant, sometimes sharply. Before you rely on any equity figure, check the rules where you'll be taxed, and consider advice from an accountant who deals with employee equity.
  - title: Finding market data without guessing
    body: |-
      A counter-offer needs a number with a reason behind it. Build the number from several sources and prefer ones specific to the company, level and location.

      - **The posting itself.** Many places now require a pay range in the job advert. Check the posting and the company's other postings for the same level.
      - **The recruiter.** Ask on the first call: "What's the budgeted range for the role?" It's a normal question.
      - **Crowdsourced pay sites.** Sites where employees report pay by company and level are useful for large tech companies, weaker for small ones. Filter by location and date.
      - **People you know.** Former colleagues at similar companies often share ranges if you ask directly and share yours.
      - **Official statistics.** National statistics offices publish earnings by occupation. They're broad, but a useful floor.

      Write down the range from each source and the date. Your ask sits near the top of what the evidence supports for that level and location, not the top of the widest range you found.

      Also look up the rules on pay where the job is. Some places ban employers from asking about salary history, and many require pay ranges in postings. Knowing the local rule tells you what you can decline to answer.
  - title: What to cover at each stage
    body: |-
      Each stage has a few beats. Say them in your own words; a recited script sounds recited, and recruiters hear a lot of them.

      - **First recruiter call, asked for expectations.** Defer numbers until you both know it's a fit, and ask for their budgeted range. If pressed, give a researched range for the level and location, not your current pay.
      - **The offer arrives.** Thanks and real interest first. Ask for the full details in writing, including equity terms, and for a few days to decide.
      - **The counter, by email.** Warmth, then one specific number with its reason (published ranges for the level, or a real competing offer), then a fallback such as a sign-on bonus, then when you'll confirm.
      - **With a real competing offer.** State its base plainly, say why you'd prefer them, and say you're ready to accept if they can match.
      - **When base is capped.** Ask whether the loop would support the higher level, then about a sign-on bonus or a larger equity grant.
      - **A tight deadline.** Ask for a short, specific extension with a reason, such as finishing one other process.
      - **Accepting.** Confirm the final terms in writing, thank everyone who helped, and agree the start date.
      - **Declining.** Thank them, give a short reason (another role is a closer fit), and leave the door open. Keep it brief and warm.

pitfalls:
  - >-
    **Naming your current salary.** It anchors the offer on your past pay. Ask for their
    range and talk about the market rate for the level.
  - >-
    **Counting a sign-on bonus every year.** It's paid once, and may have to be repaid if
    you leave early. Keep it in its own column.
  - >-
    **Valuing start-up options at paper value.** Their worth depends on a future sale or
    listing, and you usually pay to exercise. Count them low and ask for the terms.
  - >-
    **Inventing a competing offer.** Recruiters can ask for it in writing. If it's
    discovered, you lose the trust and possibly the offer.
  - >-
    **Negotiating many rounds.** Repeated small asks sour the relationship. Ask once, for
    everything that matters, with a reason.
  - >-
    **Accepting verbally before seeing it in writing.** Details like equity terms and start
    date can differ from the call. Get the written offer first.
  - >-
    **Forgetting level.** A higher level usually moves the whole band, the scope and the next
    promotion. If the loop went well, ask whether it supports the level above.
interview:
  - question: What are your salary expectations?
    answer: |-
      **What they're really asking:** will you fit the budget, and can they anchor the offer low?

      **How to answer:** early in the process, defer the number politely and ask for their budgeted range; their range helps you more than your number helps them. If they insist, give a researched range tied to the level and location, from published ranges and people at similar companies, and aim towards the top of their band. Once they've shared a range, respond to it honestly.

      **Avoid** naming your current salary as the anchor, and refusing to engage at all, which can stall the process.
  - question: What's your current salary?
    answer: |-
      **What they're really asking:** what's the least they can offer you?

      **How to answer:** decline gently and redirect to the market rate for this role and level, since the roles differ, then ask for their range. This keeps the offer anchored on the job, not your past pay, which may have been below market. Check the local rules: in some places employers aren't allowed to ask. If you choose to share, share the whole package and say what you're targeting, so the number doesn't become the ceiling.

      **Avoid** inventing or inflating a figure, and sharing base alone without your target.
  - question: Do you have any other offers?
    answer: |-
      **What they're really asking:** how fast do they need to move, and how much room is there to negotiate?

      **How to answer:** truthfully and briefly. If you're in other processes, say how far along and when you expect to hear, then say why this role is your first choice and that you'd like to keep timelines aligned. If you aren't, say you're talking to a couple of companies and this role is the one you're most keen on. Mentioning a real parallel process is fair and often speeds a decision.

      **Avoid** inventing an offer or inflating its terms, since recruiters may ask to see it, and using a real offer as a threat.
  - question: We need your answer by Friday. Can you commit?
    answer: |-
      **What they're really asking:** are you serious about this role, or keeping them as a backup?

      **How to answer:** if you're ready, say yes. If not, ask for a short, specific extension, such as two or three working days, with a reason: finishing one other process, or reading the equity terms properly. Most companies prefer a considered yes to a rushed one, and a small extension is a normal request. If they refuse, weigh what that pressure tells you about working there.

      **Avoid** accepting to buy time and then backing out, which burns the relationship and your reputation.
  - question: Why should we pay you more than the offer?
    answer: |-
      **What they're really asking:** is there a reason they can take to whoever approves the budget?

      **How to answer:** give a reason, not a demand, and tie it to the role. Two kinds of reason work: market data for this level and location, and evidence from the loop that your scope is closer to the level above, such as ownership you've already had in production. Then name one specific number, or ask about the higher level. Keep the tone warm and collaborative, since you'll work with these people.

      **Avoid** reasons based on personal costs, such as rent, which say nothing about the role's value, and ultimatums.
terms:
  - term: Total compensation
    say: The salary.
    means: Base salary, bonus, equity and sign-on money, each put on a yearly basis. Certain
      money, money that depends on results and one-off money belong in separate columns.
  - term: Vesting
    say: When the shares arrive.
    means: The schedule over which granted equity becomes yours, commonly four years. Leave
      early and the unvested part is gone.
  - term: Cliff
    say: A delay in pay.
    means: A period, often the first year, before any equity vests. At the cliff a first portion
      vests at once, then vesting continues in smaller steps.
  - term: RSUs and options
    say: Both are shares.
    means: Restricted stock units are shares granted outright, worth the share price when they
      vest. Options are the right to buy at a fixed strike price and are worth something
      only if the share price rises above it.
  - term: Level
    say: A title on the offer.
    means: The grade you join at. It sets the pay band, the scope you are trusted with and the
      path to the next promotion, often for years.
  - term: Anchoring
    say: Whoever names a number first loses.
    means: The first number in a negotiation pulls the rest towards it. Your current salary
      anchors the offer on past pay, while market data for the level anchors it on the rate.
