term: design token
short: A named design decision, like a colour or a spacing step, stored once and used everywhere.
explain: |
  A team picks a blue for buttons, and a year later there are forty slightly different
  blues. Tokens stop that. The decision gets a name, `--colour-accent`, and every screen
  uses the name.

  Good ones come in layers: raw palette values, then role tokens that say what a colour is
  for, such as surface or accent. Components use only the roles. Change a role's value and
  every screen follows. That's how dark mode works.
analogy: Paint with a name on the tin. Ask for Hallway Blue and you get the same shade every time.
example:
  language: css
  code: |
    :root {
      --blue-600: oklch(0.55 0.15 255);
      --colour-accent: var(--blue-600);
      --space-2: 16px;
    }
    .button { background: var(--colour-accent); }
usage: Use the design token, not that hard-coded hex value, or dark mode won't pick it up.
twin:
  term: custom-property
  difference: A design token is the decision, "the accent colour". A CSS custom property is one way to store it in code. The same token can also become a utility class.
related: [custom-property, design-system, utility-class, contrast-ratio]
level: 2
lessons: [design.design-tokens]
