id: explain.talking-through-a-diagram
title: Talking through a diagram
objective: Talk someone through a diagram in a sensible order, narrate how the data flows, and point out where it can fail.
level: advanced
minutes: 10
concepts: [explain.diagram-order, explain.narrating-data-flow]
prerequisites: [judgment.workflows-on-paper, explain.walking-through-code]
opening:
  text: >-
    You'll talk someone through a diagram so they could redraw it from memory. You'll use it
    in design reviews, onboarding and every interview with a whiteboard.

steps:
  - type: prose
    id: start-with-the-user
    body: |-
      Here's a bakery's pre-order system, drawn in Mermaid:

      ```text
      flowchart LR
        customer -->|order| app
        app -->|order| api
        api -->|save as pending| db
        api -->|order id| queue
        queue --> worker
        worker -->|charge| payments
        worker -->|mark paid| db
        worker -->|receipt| email
      ```

      Don't start with the box in the middle. Start with the **user** and what they want:
      *a customer orders bread for Saturday.* Then add each box as the order meets it.

  - type: multiple-choice
    id: pick-first-box
    concept: explain.diagram-order
    difficulty: 1
    question: Which box do you talk about first?
    choices:
      - text: The database, since everything is stored there
        feedback: >-
          It matters, but nobody knows yet why data arrives there. Start where the story
          starts.
      - text: The customer, and what they want to do
        correct: true
        feedback: >-
          Yes. Every box after that is a step in their story.
      - text: The queue, the most interesting part
        feedback: >-
          Interesting to you. Without the order that feeds it, the queue has no meaning yet.
      - text: The worker, since it does the most
        feedback: >-
          Its jobs only make sense once you know what reaches it. Begin with the customer.

  - type: prose
    id: one-request
    body: >-
      Now follow one real request, box by box, and say what moves on each arrow.


      *A customer orders two loaves. The app sends the order to the API. The API saves it as
      pending and replies "received" straight away. Only the order id goes on the queue.*


      "The API talks to the queue" says nothing. **Narrating data flow** means naming what
      travels, and when.

  - type: parsons
    id: arrange-narration
    concept: explain.narrating-data-flow
    difficulty: 2
    language: text
    prompt: >-
      Put this walkthrough of the bakery diagram in order. One line doesn't belong.
    blocks:
      - id: goal
        code: A customer orders two loaves for Saturday in the app.
        subgoal: The user and their goal
      - id: send
        code: The app sends the order to the API.
        subgoal: One request, box by box
      - id: save
        code: The API saves it as pending and replies "received".
        subgoal: One request, box by box
      - id: enqueue
        code: It puts only the order id on the queue.
        subgoal: One request, box by box
      - id: charge
        code: A worker takes the id and charges the card.
        subgoal: One request, box by box
      - id: finish
        code: Then it marks the order paid and emails a receipt.
        subgoal: One request, box by box
      - id: pause
        code: Any questions on that path before we look at failures?
        subgoal: Invite questions
    distractors:
      - id: spec
        code: The database runs PostgreSQL 17 with 64 GB of memory.
        feedback: >-
          A spec, not a step in the story. Save it for when someone asks.

  - type: bug-hunt
    id: hunt-talk-order
    concept: explain.diagram-order
    difficulty: 3
    language: text
    code: |
      you: This is the orders database, the heart of the system.
      you: Beside it is the queue, and a worker reads from that.
      you: The worker sends charges to payments and receipts to email.
      you: In front of all that sits the API.
      you: And customers use the app, which calls the API.
    prompt: >-
      By line 2 your listener asks, "But what starts all this?" Tap the line where the talk
      went wrong.
    lines: [1]
    reasons:
      - text: It starts in the middle, not with the user
        correct: true
        feedback: >-
          Right. The customer comes last here, so nothing before it has a reason.
      - text: Line 3 doesn't say what data moves
        feedback: >-
          It does: charges and receipts. The trouble is the order the boxes arrive in.
      - text: The database needs more detail
        feedback: >-
          More detail on line 1 would deepen the problem. The listener needs the story's start.
      - text: Line 5 is too short
        feedback: >-
          Short is fine. It's in the wrong place: it should open the talk.
    fix: |
      you: A customer orders bread for Saturday in the app.
      you: The app sends the order to the API, which saves it as pending.

  - type: prose
    id: mark-failures
    body: >-
      Then walk the same request again, asking at each arrow: *what if this fails?* The card
      charge times out. The worker crashes after charging.


      You drew failure paths in Drawing the workflow. Now say them out loud: what happens, who
      notices, and what the customer sees. Point at the box as you say it.

  - type: code-challenge
    id: write-talk-order
    concept: explain.diagram-order
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '2-3'
    prompt: >-
      Turn a Mermaid flowchart into the order to talk it through. Write `talkOrder(lines,
      start)`. Each line is an arrow, such as `api --> queue`, or `api -->|order id| queue`
      with a label. Skip any line without `-->`.


      Start at `start`, and follow its arrows in the order they're listed. Go all the way
      down each one before the next, so the main path comes first. List each box once, and
      leave out boxes `start` never reaches.


      Example: take `customer --> app`, `app --> api`, `api --> queue`, `api --> db` and
      `queue --> worker`. From `customer`, return `customer`, `app`, `api`, `queue`,
      `worker`, `db`.
    hints:
      - Build a map from each box to the boxes its arrows point to, in the order they're listed.
      - >-
        Split on `-->` for the two ends. A label is the `|...|` at the start of the right-hand
        part, so remove it.
      - >-
        Write a `visit(box)` that returns if `box` is already in the order, otherwise adds it,
        then visits each box it points to.

  - type: ai-review
    id: review-failure-notes
    concept: explain.narrating-data-flow
    difficulty: 4
    language: text
    request: Write my speaker notes for the failure part of the bakery walkthrough.
    flawClass: edge-case
    code: |
      queue: if the worker is down, orders wait on the queue, nothing lost
      payments: a timed-out charge is retried with the same idempotency key
      worker: if it crashes after charging, the queue redelivers the id
      worker: a fresh attempt charges again, so the order still gets paid
      email: if email fails, the order stays paid and the receipt is retried
      api: if the database is down, the API returns an error and saves nothing
    prompt: >-
      The review went well. In week two, a customer is charged twice for one order. Tap the
      line your notes got wrong.
    lines: [4]
    reasons:
      - text: A fresh attempt charges the card a second time
        correct: true
        feedback: >-
          Right. Reuse the order id as the idempotency key, and the provider charges once.
      - text: A queue loses orders when the worker is down
        feedback: >-
          Holding messages until a worker takes them is the queue's job. Line 1 is right.
      - text: Email failure should cancel the order
        feedback: >-
          The bread is paid for. A missing receipt is retried, not a reason to cancel.
      - text: The API should save the order anyway
        feedback: >-
          With the database down there's nowhere to save it. An honest error is right.
    fix: |
      worker: the retry reuses the order id as its idempotency key, so the card is charged once
    verify:
      question: Which test would have caught this before week two?
      choices:
        - text: A unit test of the charge function
          feedback: >-
            It passes. The fault lives between charging and marking the order paid.
        - text: Kill the worker after charging, then redeliver
          correct: true
          feedback: >-
            Yes. One charge at the provider afterwards means the notes are true.
        - text: A load test of the queue
          feedback: >-
            Volume won't recreate a crash at that exact moment. Cause the crash on purpose.
        - text: Run the happy-path demo again
          feedback: >-
            The demo went well the first time. Failures only show when you cause them.

  - type: explain-back
    id: talk-the-reviewer-through
    concept: explain.narrating-data-flow
    difficulty: 4
    audience: reviewer
    kind: explain
    prompt: >-
      A reviewer joins late and asks you to talk them through the bakery diagram. Say it out
      loud first, as if pointing at the boxes. Then type what you said.
    rubric:
      - It starts with the customer and their goal, then adds boxes in the order the order meets them.
      - It names what moves on each arrow, such as the full order to the API but only its id on the queue.
      - It pauses for questions, or says where to look hardest, before the failures.
    modelAnswer: >-
      A customer pre-orders bread for Saturday in the app. The app sends the order to the
      API, which saves it as pending and replies "received" at once. Only the order id goes
      on the queue. A worker picks it up, charges the card, marks the order paid and emails a
      receipt. That's the main path. Any questions before the failures? The worker is where
      I'd look hardest.

  - type: explain-back
    id: what-if-it-fails
    concept: explain.narrating-data-flow
    difficulty: 5
    audience: interviewer
    kind: risk
    prompt: >-
      An interviewer points at the worker box: "What happens when this fails?" Answer them,
      pointing at the arrows as you go. Try it out loud first.
    rubric:
      - It names failure points around the worker, such as it being down, a charge timing out, or a crash after charging.
      - It says what happens at each, such as orders waiting on the queue and retries reusing an idempotency key.
      - It says how you'd notice, such as the age of the oldest message or orders stuck as pending.
    modelAnswer: >-
      Three ways. If the worker is down, orders wait on the queue. The customer already has
      their confirmation, and nothing is lost. A timed-out charge is retried with the order
      id as its idempotency key. So the card is charged once. A crash after charging is safe
      for the same reason. I'd alert on the oldest message's age, and on orders pending over ten
      minutes.

recap:
  - Start with the user and their goal, then add boxes as the request meets them.
  - Name what moves on each arrow, and pause for questions after the main path.
  - Walk the request again to mark each failure point and what happens there.

recall:
  - id: card-first-box
    concept: explain.diagram-order
    front: Where do you start when you talk someone through a diagram?
    back: >-
      With the user and what they want to do. Then each box in the order their request meets
      it.
  - id: card-main-path
    concept: explain.diagram-order
    front: Why follow the main path before the side branches?
    back: >-
      The main path is the story. Side branches only make sense once the listener knows what
      reaches them.
  - id: card-arrows
    concept: explain.narrating-data-flow
    front: What should you say about each arrow in a diagram?
    back: >-
      What data moves along it and when, such as "only the order id goes on the queue".
  - id: card-failure-walk
    concept: explain.narrating-data-flow
    front: How do you show where a design can fail?
    back: >-
      Walk the same request again, asking "what if this fails?" at each arrow, and say what
      happens and who notices.

references:
  - kind: docs
    title: The C4 model for visualising software architecture
    authors: Simon Brown
    url: https://c4model.com/
    note: Diagrams at a few zoom levels, each starting from the people who use the system.
    primary: true
    verified: false
  - kind: docs
    title: Flowcharts syntax
    authors: Mermaid
    venue: Mermaid documentation
    url: https://mermaid.js.org/syntax/flowchart.html
    note: Arrows, labels and node shapes for the flowcharts in this lesson.
    primary: true
    verified: false
  - kind: book
    title: 'The Back of the Napkin: Solving Problems and Selling Ideas with Pictures'
    authors: Dan Roam
    year: 2008
    venue: Portfolio
    note: Building a picture up in front of people, one piece at a time, as you talk.
    verified: false

deepDive: >-
  Drawing live beats showing a finished diagram. When you add one box at a time, the
  listener's attention is exactly where your pen is. A finished picture of twelve boxes
  makes them read all twelve while you talk about one. If you must show it finished, cover
  or grey out the parts you haven't reached.


  For a long diagram, pick the one request that matters for the question at hand, and say
  out loud which paths you're skipping. "I'll leave refunds aside" tells the listener those
  boxes aren't forgotten.


  Interviews add a twist: the interviewer often interrupts with "what if this fails?" before
  you reach your failure walk. That's the same move, early. Answer it at that arrow, then
  carry on. The system design chapter turns this into a method, and Presenting your build
  covers a full talk around a diagram.
