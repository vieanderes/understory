term: reconciliation
aka:
  - diffing
short: React comparing the new description of the page with the last one to find what changed.
explain: |
  After a draw, React holds two trees: what the page was and what it should be. It walks them
  side by side and changes only the real elements that differ.

  It matches elements by position and type. Same type in the same place keeps its state;
  a different type throws the old one away. In lists it matches by `key`, which is why an
  index as key can hand one row's state to another.
analogy: Spot the difference between two pictures. You circle only what changed, and leave the rest alone.
example:
  language: tsx
  code: |
    // same type, same place: the input keeps its text
    {isAdmin ? <input key="a" /> : <input key="a" />}

    // different type: state is thrown away
    {isAdmin ? <input /> : <textarea />}
usage: During reconciliation React sees a different component type here, so the form loses what the user typed.
twin:
  term: re-render
  difference: Reconciliation is the comparison React makes after calling your components. A re-render is the call itself, and it happens whether or not anything ends up changing.
related:
  - re-render
  - key-prop
level: 3
lessons:
  - react.ui-as-a-function-of-state
  - react.lists-and-keys
