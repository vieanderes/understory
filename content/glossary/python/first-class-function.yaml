term: first-class function
aka: [first-class functions, functions as values, key function, higher-order function]
short: A function treated like any other value, so it can be stored, passed in or returned.
explain: |
  If functions are values, a sort doesn't need to know what you're sorting by. You hand it
  a small function that picks the part to compare, and it calls that for every item.

  In Python and JavaScript, a function is an object. Pass it by name without brackets:
  `key=len` hands over the function, while `key=len()` calls it once, too early. A function
  that takes or returns another is called higher-order. `sorted`, `max` and `min` with `key=`
  are the everyday Python examples.
analogy: Handing a friend your shopping list rather than doing the shop yourself. The list is the instruction, and they carry it out.
example:
  language: python
  code: |
    words = ["kiwi", "fig", "banana"]
    sorted(words, key=len)           # ['fig', 'kiwi', 'banana']

    rules = {"upper": str.upper, "lower": str.lower}
    rules["upper"]("hi")             # 'HI'
usage: Since functions are first-class functions here, pass the scoring rule in instead of adding another flag.
related: [lambda, closure, callback, function]
level: 2
lessons: [python.functions-as-values]
