id: backend.api-evolution
title: Changing an API safely
objective: Tell a compatible change from a breaking one, rename a field with expand and contract, and choose between REST, RPC and GraphQL.
level: advanced
minutes: 10
concepts: [backend.versioning, backend.compatibility, backend.rest-rpc-graphql]
prerequisites: [backend.api-design, ts.typing-the-boundary]
opening:
  text: >-
    You'll change an API that last year's phone apps still call, and none of them will
    break. And you'll know which style of API to reach for before the first endpoint exists.

steps:
  - type: prose
    id: what-compatibility-is
    body: >-
      Phone apps from last year still call your API, and you can't update them all. A change
      is **compatible** when every old client keeps working.


      Adding a field is compatible, as long as readers ignore what they don't know. A new
      value, like a new order status, is an addition too. Three changes break old readers:
      removing a field, renaming one, and changing a field's type.

  - type: predict-output
    id: predict-retyped-total
    concept: backend.compatibility
    difficulty: 2
    language: js
    code: |
      // The server changed total from pence (1250) to a decimal string ("12.50").
      const order = JSON.parse('{"id":42,"total":"12.50","currency":"GBP"}');
      console.log(order.total + 100);
    question: The old app adds a delivery fee of 100 pence. What prints?
    choices:
      - text: '`12.50100`'
        correct: true
        feedback: >-
          Yes. `+` with a string joins. No error, and a total that only looks right.
      - text: '`112.5`'
        feedback: >-
          That needs a number. The server now sends text, and `+` joins text.
      - text: A `TypeError`
        feedback: >-
          Nothing throws. That's the danger: the type changed and the code carried on, wrong.

  - type: bug-hunt
    id: hunt-unknown-status
    concept: backend.compatibility
    difficulty: 3
    language: js
    code: |
      function statusLabel(order) {
        switch (order.status) {
          case "paid":
            return "Paid";
          case "shipped":
            return "On its way";
          default:
            throw new Error(`Unknown status: ${order.status}`);
        }
      }
    prompt: >-
      Last year's app has this. The server starts sending `"refunded"`, and the app's order
      screen crashes for refunded orders. Tap the line at fault.
    lines: [8]
    reasons:
      - text: It treats a value it doesn't know as impossible
        correct: true
        feedback: >-
          Yes. Statuses grow with the product. Show a neutral label for unknown ones instead.
      - text: The server should never add a new status
        feedback: >-
          Products grow, and so do their statuses. A client built to survive that is the fix.
      - text: '`switch` can''t compare strings'
        feedback: >-
          It can, and `"paid"` works. Only the value nobody listed reaches the `throw`.
    fix: |
      function statusLabel(order) {
        switch (order.status) {
          case "paid":
            return "Paid";
          case "shipped":
            return "On its way";
          default:
            return "Updated";
        }
      }

  - type: prose
    id: versions-and-expand-contract
    body: >-
      Most breaks can be avoided. To rename `total` to `amount`: send both, let clients move
      over, then drop `total` once nothing reads it. That's **expand, then contract**.


      When a break truly can't be avoided, give it a **version** and keep the old one
      running. Put the version in the path, `/v2/orders`, or in a header, `Api-Version: 2`.

  - type: ai-review
    id: review-renamed-field
    concept: backend.compatibility
    difficulty: 3
    language: js
    request: Rename `total` to `amount` in the orders API, since that's what the new dashboard calls it.
    flawClass: edge-case
    code: |
      function orderResponse(order) {
        return {
          id: order.id,
          amount: order.totalPence,
          currency: order.currency,
        };
      }
    prompt: >-
      An assistant wrote this. The dashboard reads `amount`, and its test passes. Within an
      hour the phone app shows "undefined GBP" on every order. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Renaming a field removes it for every existing client
        correct: true
        feedback: >-
          Yes. Send both names for now. Remove `total` once no client reads it.
      - text: '`totalPence` should be divided by 100'
        feedback: >-
          The unit didn't change; the old version sent pence too. The name is what vanished.
      - text: The response needs a `version` field
        feedback: >-
          A version number wouldn't bring `total` back. The old app reads a field that's gone.
    fix: |
      function orderResponse(order) {
        return {
          id: order.id,
          total: order.totalPence,
          amount: order.totalPence,
          currency: order.currency,
        };
      }

  - type: code-challenge
    id: write-breaking-changes
    concept: backend.compatibility
    difficulty: 4
    language: ts
    prompt: >-
      Write `breakingChanges(before, after)` to run before each release. Each schema maps a
      field of an order to `{ type, required }`. Return the changes old clients can't
      survive, as strings.


      A field in `before` but not `after`: `'removed total'`. A field whose `type` differs:
      `'changed total from number to string'`. A field new in `after` that's `required`, which
      old clients never send: `'added required region'`. Walk `before` first, then `after`.
      An optional new field isn't breaking.
    hints:
      - Two loops, one over each schema's keys.
      - A renamed field shows up as a removal on one side and an optional addition on the other.
      - 'Start with `for (const name of Object.keys(before))` and look the name up in `after`.'

  - type: prose
    id: rest-rpc-graphql
    body: |-
      Styles differ in who shapes the answer. **REST** gives each resource a URL, as you've
      built. **RPC** gives each action one, `POST /getOrders`. **tRPC** is RPC in TypeScript,
      with types shared by client and server. **GraphQL** has one endpoint, and the client
      names the fields it wants:

      ```text
      { user(id: "7") { name orders(last: 2) { total } } }
      ```

      ```json
      {"data":{"user":{"name":"Ana","orders":[{"total":450},{"total":999}]}}}
      ```

  - type: multiple-choice
    id: pick-api-style
    concept: backend.rest-rpc-graphql
    difficulty: 3
    question: A phone screen shows a user's name and their last two order totals. Which style fetches only that?
    choices:
      - text: A GraphQL query naming those fields
        correct: true
        feedback: >-
          Right. The client names exactly the fields it shows. One request, nothing extra.
      - text: REST, with `GET /users/7` and `GET /users/7/orders`
        feedback: >-
          Two requests, and both send every field, wanted or not. REST's shape is the server's.
      - text: RPC, with `getUser(7)` and `getOrders(7)`
        feedback: >-
          Still two calls, each returning whatever the procedure returns. The client can't
          choose the shape.

  - type: explain-back
    id: explain-expand-contract
    concept: backend.versioning
    difficulty: 4
    prompt: >-
      A team wants to rename `total` to `amount` without a `/v2/`. Describe the order of
      changes that keeps every client working throughout.
    rubric:
      - First expand, sending both `total` and `amount` with the same value.
      - Then let each client move to `amount` on its own schedule, while the server watches who still reads `total`.
      - Only when nothing reads `total` is it removed, which is the contract step.
    modelAnswer: >-
      Add `amount` next to `total`, both holding the same value. Nothing breaks: old clients
      keep their field and new ones get the new name. Then update the clients one by one,
      and log which still read `total`. When that log goes quiet and stays quiet, drop
      `total`. At no moment was a client asked for a field that wasn't there.

recap:
  - Tell a compatible change from a breaking one before you ship it.
  - Rename with expand-then-contract, and version only a break you can't avoid.
  - Pick REST, RPC, tRPC or GraphQL by who chooses the response's shape.

recall:
  - id: card-breaking-changes
    concept: backend.compatibility
    front: Name the three changes that break an old client of a JSON API.
    back: >-
      Removing a field, renaming one, and changing a field's type. Adding an optional field
      is safe.
  - id: card-tolerant-reader
    concept: backend.compatibility
    front: Why should a client ignore fields and values it doesn't know?
    back: >-
      So the server can grow. New fields and new statuses then change nothing for old code.
  - id: card-expand-contract
    concept: backend.versioning
    front: What is expand-then-contract?
    back: >-
      Add the new field alongside the old, move the clients, then remove the old field once
      nothing reads it.
  - id: card-graphql-cost
    concept: backend.rest-rpc-graphql
    front: What does GraphQL let the client do that REST doesn't?
    back: >-
      Name exactly the fields it wants, across related things, in one request. The server must
      then limit how much one query may ask for.

references:
  - kind: essay
    title: Tolerant Reader
    authors: Martin Fowler
    year: 2011
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/TolerantReader.html
    note: Why a client should read only what it needs and ignore the rest.
    verified: false
  - kind: spec
    title: GraphQL
    authors: GraphQL Foundation
    year: 2021
    venue: GraphQL specification, October 2021 edition
    url: https://spec.graphql.org/October2021/
    note: The schema, the query language, and a client selecting fields.
    primary: true
    verified: true
  - kind: docs
    title: Queries
    authors: GraphQL Foundation
    venue: graphql.org
    url: https://graphql.org/learn/queries/
    note: Requesting exactly the fields you need.
    verified: true
  - kind: docs
    title: Concepts
    authors: tRPC contributors
    venue: tRPC documentation
    url: https://trpc.io/docs/concepts
    note: tRPC as RPC at heart, with procedures as query, mutation or subscription.
    verified: true
  - kind: rfc
    title: 'RFC 9110: HTTP Semantics'
    authors: R. Fielding, M. Nottingham and J. Reschke (eds)
    year: 2022
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc9110
    note: '`Vary` (section 12.5.5), for a response that depends on a request header.'
    primary: true
    verified: true

deepDive: >-
  A version chosen by a header needs one more header on the response: `Vary: Api-Version`.
  `Vary` tells caches which request headers changed the answer. Without it, a cache may hand
  a stored v1 response to a client that asked for v2.


  Strictness cuts both ways. A server should reject unknown fields in a request, since a
  misspelt field is a bug. A client should ignore unknown fields in a response, since a new
  field is the server growing. A schema library's strict mode is for the first, not the
  second.


  GraphQL checks every query against its schema before running it. Ask for a field that
  doesn't exist and the whole query is refused, in an `errors` list in the body, usually with
  status `200`. HTTP caches and status-based monitoring see nothing, so teams add their own.


  gRPC is RPC for traffic between your own services. A `.proto` file declares the procedures
  and messages, tools generate client and server code from it, and messages travel as compact
  binary over HTTP/2. Browsers can't call it directly.
