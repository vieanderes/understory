term: comment
aka: [code comment]
short: A note in the code for people to read, which the computer skips.
explain: |
  Code tells the computer what to do. It doesn't always tell the next reader why. Anything
  after `//` on a line is ignored when the program runs, so you can leave a note there.

  Good notes explain why, because the code already says what. Programmers also put `//` in
  front of a line to switch it off while they test an idea.
analogy: A pencilled note on a recipe. "Less salt next time" helps the next cook, and the oven never reads it.
example:
  language: js
  code: |
    // Prices already include VAT, so don't add it again.
    const total = price * quantity;
    // console.log(total);
usage: That comment says what the line does, so tell me why instead.
related: [statement, console-log, decomposition]
level: 1
lessons: [basics.first-program]
