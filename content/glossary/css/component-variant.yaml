term: variant
aka: [component variant]
short: A named option of a component from a fixed list, like primary or danger, with set styles.
explain: |
  A button comes in a few looks: primary for the main action, secondary for the rest,
  danger for deleting. Rather than passing colours, you pass a name, `variant="danger"`.

  The list is closed on purpose. In TypeScript, a union of names makes a typo a compile
  error. Two separate choices, like size and intent, become two props, not six combined
  names.
analogy: Sizes on a coffee menu. Small, medium or large, and you can't order a bit bigger than medium.
example:
  language: tsx
  code: |
    type ButtonProps = {
      variant: "primary" | "secondary" | "danger";
      size?: "small" | "medium";
    };

    <Button variant="danger">Delete</Button>;
usage: Add a ghost variant to the button instead of overriding its colours in the toolbar.
related: [component-library, props, design-system, union-type]
level: 2
lessons: [design.component-apis]
