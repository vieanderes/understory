summary: >-
  Keyboard access is the foundation most other assistive technology stands on. Screen
  readers, switch devices and many voice tools drive the page through the same focus that Tab
  moves. So if something works only with a mouse, it fails a whole set of people at once, and
  it fails 2.1.1 Keyboard, a level A criterion.


  Three things decide whether a page works from the keyboard. Every control must be
  **reachable**: it's focusable and on the Tab path. The **order** must make sense, which
  normally means the source order matches the reading order. And focus must be **visible**
  and not covered, so people can see where they are. Native elements give you the first for
  free. The second is a layout discipline. The third is a CSS job that designers often undo
  by accident.


  Beyond that sit the cases where you move focus on purpose: a composite widget such as a
  toolbar that uses arrow keys, a route change in a single page app, an item that's deleted
  while it has focus, or a menu that opens over the page. Each has a known pattern, and each
  gets worse when improvised.
remember:
  - Tab reaches links with `href`, buttons, form fields and anything with `tabindex="0"`, in source order, and skips disabled, hidden and inert elements.
  - A positive `tabindex` jumps ahead of every element at 0, page-wide, so never use one.
  - '`tabindex="-1"` makes an element focusable by script without adding it to the Tab path, which suits headings you move focus to.'
  - '`:focus-visible` matches when the browser judges a focus ring helps: after keyboard use, in text fields, and not after a mouse click on a button.'
  - Focus must stay visible (2.4.7, AA) and must not be completely hidden by sticky headers or banners (2.4.11 Focus Not Obscured (Minimum), AA).
  - A composite widget such as a toolbar or tab list is one Tab stop, and arrow keys move inside it with a roving `tabindex`.
  - When content under focus disappears, such as after a delete or a route change, move focus to a sensible place yourself, or it falls back to the `body`.
  - The `inert` attribute removes a region from focus, clicks and the accessibility tree in one go.
sections:
  - title: What Tab reaches, and in what order
    body: |-
      The browser keeps a list called the **sequential focus navigation order**. Elements with a
      positive `tabindex` come first, lowest number first, then everything at 0 or naturally
      focusable, in source order. Here is a page with a bit of everything:

      ```html
      <button id="a">A</button>
      <input id="b">
      <button id="c" tabindex="2">C</button>
      <div id="d" tabindex="0">D</div>
      <button id="e" tabindex="1">E</button>
      <button id="f" disabled>F</button>
      <a id="g">G</a>
      <a id="h" href="#">H</a>
      <div inert><button id="i">I</button></div>
      <button id="j" hidden>J</button>
      <button id="k" style="visibility: hidden">K</button>
      <button id="l" style="opacity: 0">L</button>
      <span id="m" contenteditable>M</span>
      ```

      Pressing Tab eight times in Chromium visits:

      ```text
      e c a b d h l m
      ```

      E and C jump the queue because of their positive values. F is disabled, G has no `href`,
      I is inert, and J and K aren't rendered, so all five are skipped. L is the trap: an
      element with `opacity: 0` is invisible but still focusable, so keyboard users land on
      nothing. Content that's visually hidden on purpose, such as a skip link, must become
      visible when it's focused. The editable span is focusable, as any text field is.

      The **skip link** is the other classic. A link to `#main` as the first focusable element
      lets keyboard users pass the navigation on every page, which 2.4.1 Bypass Blocks (A)
      asks for. Landmarks such as `main` and `nav` do the same job for screen reader users.
  - title: Roving tabindex for composite widgets
    body: |-
      A toolbar with ten buttons shouldn't cost ten Tab presses. The ARIA Authoring Practices
      treat composite widgets, such as toolbars, tab lists, radio groups, menus and grids, as
      **one Tab stop**. Tab enters and leaves; arrow keys move inside. The usual technique is a
      **roving tabindex**: the active item has `tabindex="0"` and every other item has `-1`.
      When an arrow key moves, the two swap and the new item gets focus.

      ```html
      <div role="toolbar" aria-label="Text formatting">
        <button type="button" tabindex="0">Bold</button>
        <button type="button" tabindex="-1">Italic</button>
        <button type="button" tabindex="-1">Underline</button>
      </div>
      <button type="button">After</button>
      <script>
        const toolbar = document.querySelector('[role="toolbar"]');
        const items = [...toolbar.querySelectorAll('button')];

        toolbar.addEventListener('keydown', (event) => {
          const current = items.indexOf(document.activeElement);
          if (current === -1) return;
          const last = items.length - 1;
          const next = {
            ArrowRight: current === last ? 0 : current + 1,
            ArrowLeft: current === 0 ? last : current - 1,
            Home: 0,
            End: last,
          }[event.key];
          if (next === undefined) return;
          event.preventDefault();
          items[current].tabIndex = -1;
          items[next].tabIndex = 0;
          items[next].focus();
        });
      </script>
      ```

      Driving it with the keyboard in Chromium gives:

      ```text
      Tab→Bold  ArrowRight→Italic  ArrowRight→Underline  ArrowRight→Bold  End→Underline
      Tab→After  Shift+Tab→Underline  Home→Bold  ArrowLeft→Underline
      ```

      Notice Shift+Tab returns to Underline, the last item used, not the first. The widget
      remembers its place because the `0` moved with focus.

      The alternative is `aria-activedescendant`: focus stays on the container and the
      attribute points at the active item's `id`. It suits a combobox, where focus must stay in
      the text field while arrows move through the options. Roving tabindex is simpler for
      everything else, because real focus means the browser scrolls the item into view and
      draws the ring.
  - title: Moving focus on purpose
    body: |-
      Focus should only move when the user asks. But sometimes the element with focus is
      removed, and then `document.activeElement` becomes the `body`. Chromium remembers the spot
      for the next Tab, but WebKit doesn't, and a screen reader can lose its place and start
      again from the top. Neither tells the user what happened.

      **After a delete**, move focus to the next item in the list, or to the list's heading if
      it's now empty. **When a modal dialog opens**, focus goes inside and returns to the button
      that opened it when it closes; `dialog` with `showModal()` does most of this, as a later
      lesson shows. **When a panel opens over the page**, such as an off-canvas menu, put
      `inert` on the rest of the page. It removes those elements from the Tab order, from
      clicks and from the accessibility tree at once, so nothing behind the panel can be
      reached.

      **After a client-side route change**, the page changes but no page load happens, so
      assistive technology may not notice. Next.js ships a route announcer that reads the new
      page's `document.title`, falling back to the `h1` and then the path, so give every page a
      distinct title. If you also want keyboard focus at the start of the new content, move it
      to the heading from a component in the root layout:

      ```tsx
      'use client';

      import { usePathname } from 'next/navigation';
      import { useEffect, useRef } from 'react';

      // Rendered once in the root layout, so it survives navigations.
      export function RouteFocus() {
        const pathname = usePathname();
        const previous = useRef(pathname);

        useEffect(() => {
          // First render: the browser already put focus at the top of a fresh page.
          if (previous.current === pathname) return;
          previous.current = pathname;
          const heading = document.querySelector<HTMLElement>('main h1');
          if (!heading) return;
          heading.tabIndex = -1; // focusable by script, not added to the Tab path
          heading.focus();
        }, [pathname]);

        return null;
      }
      ```

      Test the router's own behaviour with a keyboard first. Routers differ, and focusing twice
      makes screen readers announce twice.
  - title: Seeing focus, and keeping it in view
    body: |-
      Two AA criteria cover the ring. **2.4.7 Focus Visible** says a keyboard-operable interface
      has a mode where the focus indicator is visible. **2.4.11 Focus Not Obscured (Minimum)**,
      new in 2.2, says the focused element is not entirely hidden by content the author made.
      The AAA criterion **2.4.13 Focus Appearance** adds size and contrast: an indicator at
      least as large as a 2 CSS pixel perimeter of the control, with 3 to 1 contrast between
      its focused and unfocused pixels.

      `:focus-visible` follows the browser's judgement of whether a ring helps. Checking it in
      Chromium:

      ```text
      button focused by a mouse click          false
      text input focused by a mouse click      true
      button focused by Tab                    true
      heading .focus() after a mouse click     false
      heading .focus() after a key press       true
      ```

      Script focus inherits the last way the user interacted. That's what you want after a
      route change: a keyboard user sees the ring on the heading, a mouse user doesn't. If you
      need the ring regardless, `element.focus({ focusVisible: true })` asks for it, but check
      browser support before relying on it.

      For 2.4.11, the usual culprit is a sticky header. Tab backwards up a page and the focused
      link can sit completely underneath it. In Chromium, a link 20 pixels from the top of the
      viewport stayed fully under a 64 pixel sticky header after Shift+Tab. With one line, the
      browser scrolled it clear:

      ```css
      html {
        /* Match the sticky header, so scrolling into view stops below it. */
        scroll-padding-top: 64px;
      }
      ```

      Draw the ring with `outline`, not `box-shadow`. In forced colours mode, such as a Windows
      contrast theme, the browser removes box shadows but keeps outlines.
pitfalls:
  - '**Removing the outline globally.** `*:focus { outline: none }` in a reset strands every keyboard user. Style `:focus-visible` instead, and keep a ring with enough contrast against the background.'
  - '**Using positive `tabindex` to fix order.** It works on one page and breaks every other, because the numbers are page-wide. Fix the source order instead.'
  - '**Adding `tabindex="0"` to text.** Paragraphs and headings on the Tab path slow everyone down, and screen readers already move through text with their own keys. Only interactive things belong there.'
  - '**Hiding things with `opacity: 0` or off-screen positioning while they stay focusable.** Keyboard users land on invisible controls. Use `hidden`, `inert` or `display: none`, or make the element visible on focus.'
  - '**Letting focus fall to the body.** Deleting the focused row, or re-rendering the list around it, leaves focus on the `body`, and a screen reader user loses their place. Decide where focus goes before you remove the element.'
  - '**Covering focus with sticky UI.** Headers, cookie banners and chat buttons hide focused controls and fail 2.4.11. Add `scroll-padding` and test by tabbing backwards.'
verify:
  - lens: breaks
    check: 'No stylesheet removes the outline without a `:focus-visible` style that replaces it.'
  - lens: breaks
    check: 'When a focused element is removed or re-rendered, focus moves somewhere deliberate instead of falling to the `body`.'
  - lens: confuses
    check: 'Tab order follows the source order, with no positive `tabindex` anywhere.'
  - lens: tests
    check: 'Every screen is walked with Tab and Shift+Tab, checking each control is reachable, visible when focused and works with Enter or Space.'
interview:
  - question: A designer wants the focus outline removed. How do you respond?
    answer: >-
      I'd keep a focus indicator but make it look intentional, using `:focus-visible`. For
      keyboard users the ring is the cursor, and removing it fails 2.4.7 Focus Visible, a level
      AA criterion. The usual complaint is the ring after a mouse click, and `:focus-visible`
      addresses exactly that: browsers don't match it when a button is clicked, but do after
      Tab and always in text fields. So I'd offer a branded ring, for example a 2 or 3 pixel
      outline in the accent colour with an offset, checked for 3 to 1 contrast against the
      background. I'd draw it with `outline` rather than `box-shadow`, because forced colours
      mode strips box shadows. The trade-off is small: a ring that shows only for keyboard
      users costs the design nothing.
  - question: What is a roving tabindex and when do you need one?
    answer: >-
      It's the technique for making a composite widget one Tab stop with arrow-key movement
      inside. Only the active item has `tabindex="0"`, the rest have `-1`, and on an arrow key
      you swap the values and call `focus()` on the new item. You need it for toolbars, tab
      lists, radio-like groups, menus and grids, where the ARIA Authoring Practices say Tab
      should move past the whole widget. A nice property is memory: Tab back in and you return
      to the last active item. The alternative, `aria-activedescendant`, keeps focus on the
      container and points at the active child, which suits a combobox whose text field must
      keep focus. Roving tabindex is usually simpler, since real focus gets scrolling and the
      focus ring for free.
  - question: How do you handle focus when a single page app changes route?
    answer: >-
      Make sure the change is announced, then decide deliberately where keyboard focus goes.
      With no full page load, screen readers may not notice anything changed, and focus can be
      left on a link that no longer exists, which drops it to the body. Next.js includes a
      route announcer that reads the new `document.title`, then the `h1`, then the path, so
      distinct titles matter. For focus, a common pattern is a small client component in the
      root layout that watches the pathname and focuses the new page's `h1`, made focusable
      with `tabindex="-1"`. I'd skip it on the first render, since a fresh page already starts
      at the top. The trade-off is double announcements if the router already moves focus, so
      I test with a real screen reader before shipping it.
  - question: What does the `inert` attribute do, and when would you use it?
    answer: >-
      `inert` makes an element and everything inside it unfocusable, unclickable and absent
      from the accessibility tree. I'd use it on the rest of the page while a custom overlay is
      open, such as an off-canvas menu or a full-screen image viewer, so Tab can't wander behind
      it and a screen reader can't read what's underneath. It replaces older workarounds that
      set `tabindex="-1"` on every control and `aria-hidden` on the background, which often
      drifted out of sync. A modal `dialog` opened with `showModal()` already makes the rest of
      the page inert, so I'd reach for `inert` directly only for non-dialog overlays. The risk
      is forgetting to remove it, which leaves the page dead, so tie it to the same state that
      opens the overlay.
