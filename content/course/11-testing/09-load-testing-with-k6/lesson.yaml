id: testing.load-testing
title: Load testing with k6
objective: Read latency and throughput, find the knee, and gate a release on percentiles.
level: advanced
minutes: 10
concepts: [testing.load-scenarios, testing.percentiles, testing.knee]
prerequisites: [testing.e2e-playwright, backend.http-in-depth]
opening:
  text: >-
    You'll find how many users your server takes before it slows, from a script rather
    than a launch day. You'll also stop trusting the average.

steps:
  - type: prose
    id: latency-and-throughput
    body: >-
      Picture a shop with four tills, each serving one customer a minute. **Throughput** is
      how many customers leave per minute: four at most. **Latency** is how long one
      customer takes, queue included.


      A server works the same way. Its workers are the tills, and requests are the
      customers. A **load test** sends more and more requests to find where it struggles.

  - type: multiple-choice
    id: pick-what-grows
    concept: testing.knee
    difficulty: 1
    question: Eight customers now arrive each minute at the four tills. What happens?
    choices:
      - text: The queue grows, and so does every wait
        correct: true
        feedback: >-
          Right. Four still leave each minute. The rest wait, longer and longer.
      - text: Throughput doubles to eight a minute
        feedback: >-
          There's no fifth till. Four a minute is the ceiling, however many arrive.
      - text: Each till serves faster to keep up
        feedback: >-
          A till takes a minute whatever the queue. Only more tills raise the ceiling.

  - type: prose
    id: what-the-knee-is
    body: >-
      A real run: four workers, 100 ms per request. Up to four users, each extra user added
      about ten requests a second. Past four, throughput stayed at 39 a second and latency
      climbed. That bend is the **knee**.


      The knee marks the capacity of the tightest resource. Here it was four workers. In a
      real app it's a connection pool, a CPU or a lock.

  - type: prose
    id: percentiles
    body: >-
      A **percentile** is the latency a given share of requests stay under. The **p95** is the
      line 95% stay below, so one request in twenty is slower than it.


      The mean hides the tail. Ten requests averaging 185 ms sounds fine. A p95 of 825 ms says
      one visitor in twenty waited most of a second. Set your limits on p95 and p99, never on
      the average.

  - type: code-challenge
    id: write-percentile
    concept: testing.percentiles
    difficulty: 4
    language: ts
    prompt: >-
      Write `percentile(samples, p)`, the way k6 reports `p(95)`. Sort a copy of the samples,
      smallest first. `Math.ceil` rounds up: the rank is `p / 100` times the count, rounded
      up, and never below 1. Return the sample at that rank, counting from 1.


      Leave `samples` as you found it. Return `null` for an empty list.


      So for ten samples, `p(95)` and `p(100)` both give the largest, and `p(50)` the fifth.
    hints:
      - '`[...samples].sort((a, b) => a - b)` sorts a copy and leaves the original alone.'
      - The rank counts from 1, so take one off before you index the array.
      - 'Start with `const rank = Math.ceil((p / 100) * sorted.length);`'

  - type: prose
    id: scenarios
    body: >-
      **k6** is a tool that runs a load test from a script. Each virtual user, or **VU**,
      calls your function in a loop, like one person clicking again and again.


      A **scenario** says how load changes over time: `stages` ramp the number of VUs up.
      `thresholds` fail the run when a number passes a limit, so CI can stop a slow release.

  - type: fill-blank
    id: fill-ramp-and-threshold
    concept: testing.load-scenarios
    difficulty: 2
    language: js
    prompt: >-
      Ramp to 60 VUs in three stages, and fail the run if the p95 goes over 200 ms. Fill
      the gaps.
    template: |
      import http from "k6/http";

      export const options = {
        {{1}}: [
          { duration: "10s", target: 5 },
          { duration: "10s", target: 20 },
          { duration: "10s", target: 60 },
        ],
        thresholds: { http_req_duration: ["{{2}}<200"] },
      };

      export default function () {
        http.{{3}}("http://localhost:8090/price");
      }
    blanks:
      - key: '1'
        answer: stages
      - key: '2'
        answer: p(95)
      - key: '3'
        answer: get
    bank: [stages, steps, p(95), avg, get, fetch]

  - type: ai-review
    id: review-threshold-on-avg
    concept: testing.percentiles
    difficulty: 4
    language: js
    request: Add a load test to CI that fails if checkout gets slow.
    flawClass: edge-case
    code: |
      export const options = {
        vus: 20,
        duration: "30s",
        thresholds: { http_req_duration: ["avg<150"] },
      };
    prompt: >-
      An assistant wrote this. The threshold passes in CI every run. Then customers complain
      that checkout "sometimes hangs". Tap the line at fault.
    lines: [4]
    reasons:
      - text: A threshold on the average can't see a slow tail
        correct: true
        feedback: >-
          Yes. One request in twenty can take a second while the average sits under 150.
      - text: 20 VUs is too few to find anything
        feedback: >-
          More load would push the average up too. The metric is wrong, whatever the load.
      - text: The duration should be ten minutes
        feedback: >-
          A longer run gives more samples of the same average. The tail would still be hidden.
    fix: |
      export const options = {
        vus: 20,
        duration: "30s",
        thresholds: { http_req_duration: ["p(95)<200", "p(99)<500"] },
      };
    verify:
      question: Which check shows the new thresholds can see a slow tail?
      choices:
        - text: Make one request in ten slow and see CI fail
          correct: true
          feedback: Yes. Inject the tail on purpose, and the p95 threshold trips.
        - text: Run it and see it pass
          feedback: The average threshold passed too. A gate you've never seen fail may not be watching.
        - text: Lower the average limit to 100 ms
          feedback: A stricter average still averages the tail away. Only a percentile sees it.

  - type: explain-back
    id: explain-why-flat-throughput
    concept: testing.knee
    difficulty: 4
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer reads the load-test report. From 4 to 32 VUs, throughput stays at 39 a
      second while p95 climbs from 103 ms to 826 ms. They ask what the server is doing.
    rubric:
      - Four workers are always busy, so the server completes 40 requests a second and no more.
      - Every extra VU joins a queue, so each request waits for the ones ahead of it.
      - Only more of the bottleneck resource, a fifth worker or a faster one, raises the ceiling.
    modelAnswer: >-
      The four workers never rest. Each takes 100 ms, so together they finish 40 a second,
      and that's the ceiling. Every user past four is in a queue. At 32 VUs a request waits
      behind seven others, which is where 826 ms comes from. Adding users adds waiting, not
      throughput. To lift the line you need the bottleneck to grow: more workers, or a faster
      one. Everything else is queue length.

recap:
  - Script a ramp in k6, with thresholds the run must meet.
  - Read p95 and p99 for the tail the mean hides.
  - Find the knee where throughput flattens, and name the resource behind it.

recall:
  - id: card-p95-meaning
    concept: testing.percentiles
    front: What does a p95 of 825 ms mean for your visitors?
    back: >-
      95% of requests finished under 825 ms, and one in twenty took longer.
  - id: card-knee
    concept: testing.knee
    front: What two things happen to a server past its knee?
    back: >-
      Throughput stops rising, and latency climbs with every extra user, because requests
      queue for the busy resource.
  - id: card-threshold-metric
    concept: testing.percentiles
    front: Why set a threshold on `p(95)` rather than `avg`?
    back: >-
      The average can stay low while one request in twenty is slow. The p95 fails on that tail.

