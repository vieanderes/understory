term: dead-letter queue
aka: [DLQ, dead letter queue, poison message queue]
short: A separate holding place for jobs that failed too many times, set aside for a person to inspect.
explain: |
  Some jobs will never succeed: a malformed payload, a deleted record, a bug. Retrying
  them forever wastes workers and can block the jobs behind them.

  So after a set number of attempts, the job moves aside, with its error. Someone looks,
  fixes the cause, and replays it. A growing pile here is a signal worth an alert; a pile
  nobody watches is data quietly lost.
analogy: The post office's undeliverable mail room. Letters with bad addresses go there, instead of circling the sorting machine forever.
usage: Forty orders are sitting in the dead-letter queue since Tuesday's deploy; nobody's alerted on it.
related: [queue, retry, message-broker]
level: 2
lessons: [scale.queues-and-workers]
