term: CSS grid
aka:
  - grid layout
  - CSS grid layout
short: A two-direction layout that places items into rows and columns defined on the container.
explain: |
  A photo gallery, a dashboard, a page with a header, sidebar and footer. These need things
  to line up across rows and down columns at the same time.

  Set `display: grid` and describe the **tracks**: `grid-template-columns: 1fr 3fr`. The
  `fr` unit shares out leftover space. `repeat(auto-fill, minmax(200px, 1fr))` gives you
  as many columns as fit, with no media query. Items can span tracks or be placed into
  named areas.
analogy: A muffin tray. The tray decides where the holes are; each muffin drops into one, or a big one takes two.
example:
  language: css
  code: |
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
usage: The cards need to line up in columns too, so use CSS grid instead of wrapping flex rows.
twin:
  term: flexbox
  difference: Grid controls rows and columns together from the container. Flexbox handles a single line, where each item's content decides its size.
related:
  - flexbox
  - responsive-design
level: 1
