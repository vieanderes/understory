deepDive: >-
  **Don't read refs while rendering.** React doesn't know when `ref.current` changes, so a
  render that shows it can be out of date, as the clicker showed. Read and write refs in event
  handlers and effects. The one exception is setting a ref once, on the first render.


  **Refs to your own components.** In React 19, `ref` is an ordinary prop for function
  components. A `TextField` can accept `ref` and hand it to its own `input`, with no
  `forwardRef`.


  **Before you write a hook.** Many good ones exist already. `useSyncExternalStore` is React's
  own way to subscribe to something outside React, like the browser's online status, and
  it's what libraries use under the hood.
