term: media query
aka:
  - "@media"
  - breakpoint
short: A condition in a stylesheet that applies some rules only when the screen or device matches.
explain: |
  A three-column layout looks great on a laptop and crushed on a phone. You need some
  rules that only switch on when there's room.

  `@media (min-width: 48rem) { ... }` applies its rules from that width up. Write the
  phone styles first and add rules as space grows; this is called mobile first. Queries
  can test more than width: `prefers-color-scheme` for dark mode and
  `prefers-reduced-motion` for people who get sick from animation.
analogy: A coat rule for school. "If it's below ten degrees, wear a coat." Same child, different outfit depending on the weather.
example:
  language: css
  code: |
    .layout { display: grid; gap: 16px; }

    @media (min-width: 48rem) {
      .layout { grid-template-columns: 1fr 3fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none; }
    }
usage: Add a media query at 48rem so the sidebar only appears when there's room for it.
twin:
  term: responsive-design
  difference: A media query is one tool, a single condition with rules attached. Responsive design is the whole aim of a page that works at every size, often achieved with fluid grids and no query at all.
related:
  - responsive-design
  - rem
level: 2
lessons:
  - css.responsive-design
