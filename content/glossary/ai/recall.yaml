term: recall
aka: [sensitivity, true positive rate]
short: Of all the items that truly belonged, the share a classifier managed to catch.
explain: |
  There were 100 spam emails, and the filter caught 70. Its recall is 70%. High recall
  means little slips through.

  You can reach 100% by flagging everything, which is useless. So it's read together with
  precision. Missing a fraud case costs more than a false alarm? Favour this one. A false
  alarm costs more? Favour precision.
analogy: A net with small holes. It catches nearly every fish, along with a fair amount of weed.
usage: The fraud model's recall is only 60%; we're letting four in ten fraudulent orders through.
twin:
  term: precision
  difference: Recall asks how many of the right items got flagged. Precision asks how many of the flagged items were right.
related: [precision, recall-at-k, confidence-threshold]
level: 2
lessons: [aisys.thresholds-and-calibration]
