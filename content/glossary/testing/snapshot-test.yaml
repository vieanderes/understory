term: snapshot test
aka: [snapshot testing, snapshot]
short: A test that saves output once, then fails whenever later output differs from the saved copy.
explain: |
  Writing the full expected output by hand is tedious for a big object or a rendered
  component. So the first run stores it in a file, and later runs compare against that file.

  They're cheap to write and tempting to wave through. When one fails, the quickest fix is
  pressing "update", and people do it without reading the diff. Then the test catches
  nothing. Keep snapshots small and specific, such as one error message or one serialised
  object, and prefer an assertion that states what matters.
analogy: Taking a photo of a tidy room. Any change shows up, but so does a moved cushion, and soon you stop looking closely.
example:
  language: ts
  code: |
    test('formats the receipt', () => {
      expect(formatReceipt(order)).toMatchInlineSnapshot(`
        "2 x Notebook   £7.00
        Total          £7.00"
      `);
    });
usage: Nobody reads that 400-line snapshot test; replace it with three assertions on the parts we care about.
related: [assertion, fixture]
level: 2
lessons: [testing.components]
