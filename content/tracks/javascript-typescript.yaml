# JavaScript and TypeScript by hand: the behaviour coding rounds test and how a pro writes it,
# for someone who has let AI write their code for a while. Python has its own path.
# Schema: fastTrackSchema in src/core/content/notes.ts.
title: TypeScript fundamentals
name: TypeScript
order: 2
promise: Write correct JavaScript and TypeScript by hand again, without an assistant filling the gaps.
outcomes:
  - Predict what coercion, references, closures and this do before you run the code
  - Type data at a boundary and narrow it safely
  - Spot the amateur habits a reviewer notices first
decision: Have you let an assistant write most of your code for a while?
readyWhen:
  - You can predict what coercion, references, closures and this do before you run the code.
  - You can type data at a boundary and narrow it without casting.
  - You can name three amateur habits in a code sample and fix them.
proof:
  title: One small program, written by hand in TypeScript
  evidence:
    - The program in strict TypeScript, no assistant
    - Types at every boundary, no casts
    - Tests that pass
coverage:
  covered: [JavaScript behaviour, TypeScript types, Readable code]
  partial: [Classes and prototypes]
  outside: [Python, HTML and CSS, Framework specifics]
summary: >-
  For anyone who has let AI write their JavaScript for a while. The behaviour coding rounds
  test, TypeScript's types, how a pro writes both, and a syntax refresher to keep beside you.
method:
  - Read the key idea and the Remember box.
  - Type one example from memory in an empty file and run it. Reading code is not writing it.
  - Answer the interview questions out loud, then read the strong answer.
  - Read the top mistakes, and check your own habits against them.
shapes:
  - label: Reading unfamiliar code
    text: >-
      Find the inputs and outputs first, then trace one small example by hand. Name what each
      function does before you judge how it does it.
  - label: Writing under time
    text: >-
      Plain loops and clear names first, then tidy up. A correct, readable answer beats a
      clever one that fails an edge case.
  - label: Explaining a choice
    text: >-
      Say what you picked, why, and what it costs: "a Map, because lookups are O(1); it uses
      more memory than a sorted array".
  - label: Reviewing code
    text: >-
      Correctness first (edge cases, errors, mutation), then names and structure, then speed.
      Say which comments block a merge and which are suggestions.
days:
  - title: JavaScript traps
    why: >-
      The behaviours interviewers probe and AI-written code hides: coercion, references,
      closures, this, promises and the event loop.
    artifact: "The JavaScript behaviours, predicted"
    must: [js.coercion, js.references-and-copying, js.closures, js.functions-and-this, js.promises, js.event-loop, js.built-in-toolbox]
    should: [js.arrays, js.destructuring-and-spread, js.errors, js.prototypes-and-classes]
  - title: TypeScript
    why: >-
      Senior roles expect typed code: how the type system thinks, narrowing, typing a boundary
      and generics.
    artifact: "Typed boundaries"
    must: [ts.everyday-types, ts.narrowing, ts.typing-the-boundary, ts.generics]
    should: [ts.structural-typing, ts.advanced-types, ts.strictness]
  - title: Code like a pro
    why: >-
      What separates an amateur's code from a pro's. This is what a reviewer notices first.
    depth: true
    artifact: "A reviewer's eye for your own code"
    must: [pro.amateur-tells, pro.modern-javascript, pro.typescript, clean.naming, clean.functions, cs.complexity]
    should: [clean.control-flow, clean.errors]
guides: [syntax-refresher, amateur-vs-pro]
