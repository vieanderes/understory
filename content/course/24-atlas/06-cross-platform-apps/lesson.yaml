id: atlas.cross-platform
title: Cross-platform apps
objective: Say how React Native, Flutter, Kotlin Multiplatform and Capacitor draw the screen, and keep a model API key out of any app.
level: advanced
minutes: 10
concepts: [atlas.react-native, atlas.flutter, atlas.kotlin-multiplatform, atlas.app-secrets]
prerequisites: [atlas.one-product-three-platforms, react.what-react-is, security.secrets]
opening:
  text: >-
    You'll know what each cross-platform framework puts on the screen, and which one fits a
    team. And you'll ship an AI feature in an app without handing out your API key.

steps:
  - type: prose
    id: three-ways-to-draw
    body: >-
      Every phone has its own building blocks for the screen: its buttons, lists and text.
      Those are **native views**. A phone can also show a **web view**: a browser window
      inside an app, with no address bar.


      Cross-platform frameworks differ in which one they use. Some drive native views, one
      draws every pixel itself, and some show your web app in a web view.

  - type: prose
    id: name-react-native
    body: >-
      **React Native** is React with native views in place of the DOM. You write components
      with `<View>` and `<Text>` instead of `<div>` and `<p>`, and each becomes the phone's
      own view.


      **Expo** is the usual toolkit around it. Its `eas` tool builds the app in the cloud, and
      sends **over-the-air updates**: new JavaScript for installed apps, with no store release.

  - type: predict-output
    id: predict-what-view-becomes
    concept: atlas.react-native
    difficulty: 1
    language: jsx
    code: |
      import { View, Text } from 'react-native';

      export function NextBus({ due }) {
        return (
          <View>
            <Text>Next bus in {due} minutes</Text>
          </View>
        );
      }
    question: This runs on an iPhone. What does `<View>` become on the screen?
    choices:
      - text: An iPhone's own native view
        correct: true
        feedback: >-
          Right. React decides what's on screen, and the phone's own views show it.
      - text: A `<div>` in a hidden web page
        feedback: >-
          There's no web page here. That's how a web-view app works, not React Native.
      - text: Pixels drawn by React itself
        feedback: >-
          React Native doesn't draw. It creates the phone's views and lets the phone draw them.

  - type: prose
    id: name-other-routes
    body: >-
      **Flutter** draws every pixel itself, from code in a language called Dart. The app looks
      identical everywhere, and uses no native views. **Kotlin Multiplatform** shares only the
      business rules, written in Kotlin. The screens stay native on each phone.


      **Capacitor** takes your finished web app and shows it in a web view. A **bridge** lets
      it call native features such as the camera.

  - type: fill-blank
    id: fill-pick-route
    concept: atlas.kotlin-multiplatform
    difficulty: 2
    language: js
    prompt: >-
      Four teams, four briefs. Match each brief to the route that fits it best.
    template: |
      const route = {
        'our web app, in the stores in two weeks':     '{{1}}',
        'a React team, first phone app':               '{{2}}',
        'one brand look, pixel for pixel, everywhere': '{{3}}',
        'native screens, shared business rules':       '{{4}}',
      };
    blanks:
      - key: '1'
        answer: Capacitor
      - key: '2'
        answer: React Native
      - key: '3'
        answer: Flutter
      - key: '4'
        answer: Kotlin Multiplatform
    bank: [Capacitor, React Native, Flutter, Kotlin Multiplatform]

  - type: ai-review
    id: review-ota-native-module
    concept: atlas.react-native
    difficulty: 3
    language: bash
    request: Add barcode scanning to the recipe app, and get it to users today without a store release.
    flawClass: logic
    code: |
      # add the camera module, which includes native code
      npx expo install expo-camera
      # ...the scanner screen is written in JavaScript against expo-camera
      eas update --message "Add barcode scanning"
    prompt: >-
      An assistant wrote this. The developer made a fresh build on their own phone, and the
      scanner worked. On every installed copy, the scanner screen fails. Tap the line at fault.
    lines: [4]
    reasons:
      - text: An over-the-air update can't add native code
        correct: true
        feedback: >-
          Yes. Updates carry JavaScript, styles and images. A native module needs a new store build.
      - text: '`npx expo install` should be `npm install`'
        feedback: >-
          `expo install` picks a version that matches your Expo setup. It's the right command.
      - text: The message is too long for an update
        feedback: >-
          The message is a label for the team. The problem is what an update can carry.
    fix: |
      npx expo install expo-camera
      # native code changed, so build a new app and send it through the stores
      eas build --platform all
      eas submit --platform all
      # later JavaScript-only changes can go over the air to this build

  - type: prose
    id: name-app-secrets
    body: >-
      Now an AI feature. An app is a download, and anyone can unpack it and read every string
      inside, keys included. You saw the same with the browser bundle in the security chapter.


      Apps add a twist: old versions stay installed for months. A leaked key can't be pulled
      back by shipping a fix. So the app calls your **own server**, and only the server holds
      the key.

  - type: ai-review
    id: review-key-in-app
    concept: atlas.app-secrets
    difficulty: 3
    language: js
    request: Add a Summarise button to our React Native app, using the model API.
    flawClass: security
    code: |
      const MODEL_KEY = 'mk_live_4f9a2c';

      export async function summarise(text) {
        const response = await fetch('https://api.model.example/v1/summarise', {
          method: 'POST',
          headers: { 'x-api-key': MODEL_KEY, 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        return (await response.json()).summary;
      }
    prompt: >-
      An assistant wrote this. Summaries work on every test phone. A month after launch, the
      model bill is ten times the forecast. Tap the line at fault.
    lines: [1]
    reasons:
      - text: The key ships inside every copy of the app
        correct: true
        feedback: >-
          Yes. Someone unpacked it and uses your key. Call your own server, which holds it.
      - text: '`fetch` should use `GET` for a summary'
        feedback: >-
          Sending text to be processed is a `POST`. The method isn't why the bill grew.
      - text: The response should be checked with `response.ok`
        feedback: >-
          Worth doing, but a missing check doesn't cost money. Someone else is spending yours.
    fix: |
      export async function summarise(text, sessionToken) {
        // our server checks who's asking, then calls the model with its own key
        const response = await fetch('https://api.recipes.example/summarise', {
          method: 'POST',
          headers: { authorization: `Bearer ${sessionToken}`, 'content-type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        return (await response.json()).summary;
      }

  - type: code-challenge
    id: write-summary-endpoint
    concept: atlas.app-secrets
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '4-5'
    prompt: >-
      Write the server side. `handleSummarise(request, env, callModel)` gets the app's
      `request.user` and `request.body.text`. No user returns status `401`. Empty or missing
      text returns `400`, and text over 5000 characters `413`.


      Otherwise call `callModel(env.MODEL_KEY, text)` and return `{ status: 200, body: { summary } }`.
      Refuse before you call the model: every call costs money.
    hints:
      - Three early returns, one for each way a request can be refused, then the model call.
      - Check the user first, then the text. Empty text is `text.trim() === ''`.
      - 'Start with `if (!request.user) return { status: 401, body: { error: ''Sign in first'' } };`'

  - type: explain-back
    id: explain-flutter-vs-rn
    concept: atlas.flutter
    difficulty: 3
    prompt: >-
      A designer says Flutter and React Native are "the same thing". What differs on the
      screen, and when does that difference matter?
    rubric:
      - React Native creates the phone's own views, so controls look and behave like the platform's.
      - Flutter draws every pixel itself, so the app looks identical everywhere and platform habits must be imitated.
      - It matters when the product should feel native and follow OS changes, or when one exact brand look must hold everywhere.
    modelAnswer: >-
      Both give you one codebase for two phones, and that's where the likeness ends. React
      Native asks the phone for its own views. A switch is the iPhone's switch, and an
      Android list scrolls like Android. Flutter paints everything itself, so the app is
      identical on both, and anything platform-shaped has to be imitated. If the product
      should feel native and pick up each OS's changes, that's React Native. If the brand
      must look one way everywhere, Flutter fits.

recap:
  - Tell React Native's native views from Flutter's own drawing and Capacitor's web view.
  - Ship native changes as a store build, and only JavaScript over the air.
  - Keep model API keys on your server, and let the app call the server.

recall:
  - id: card-react-native
    concept: atlas.react-native
    front: What does a React Native component become on the phone, and what can an over-the-air update change?
    back: >-
      A real native view. An update can change JavaScript, styles and images, never native
      code.
  - id: card-flutter
    concept: atlas.flutter
    front: How does Flutter put a button on the screen?
    back: >-
      It draws every pixel itself, from Dart code. No native view is created, so the button
      looks the same on every phone.
  - id: card-kmp
    concept: atlas.kotlin-multiplatform
    front: What does Kotlin Multiplatform share, and what does it leave native?
    back: >-
      The business rules, written once in Kotlin. The screens stay native on each phone.
  - id: card-key-in-app
    concept: atlas.app-secrets
    front: Why can't a mobile app hold a model API key, even hidden?
    back: >-
      Anyone can unpack the app and read it, and old versions stay installed for months. The
      app calls your server, which holds the key.

