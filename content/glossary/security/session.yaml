term: session
aka:
  - session cookie
  - session id
short: The server's record that a browser is logged in, found again by an id stored in a cookie.
explain: |
  HTTP forgets you between requests. So at login the server creates a record: "user 42,
  logged in until six". It gives the browser a long random id in a cookie. Every request
  sends the cookie, and the server looks the record up.

  Logging someone out takes one step: delete the record. The cookie should be `HttpOnly`,
  `Secure` and `SameSite`. And the id should change at login, so an attacker can't plant one
  in advance.
analogy: A cloakroom ticket. The ticket is only a number; your coat stays behind the counter, and the attendant can cancel the ticket at any time.
usage: Rotate the session id on login, or an id set before login stays valid after it.
twin:
  term: jwt
  difference: A session keeps the state on the server and hands the browser an id to look it up. A JWT hands the browser the state itself, signed, with nothing to look up.
related:
  - jwt
  - authentication
  - csrf
  - cookie
level: 1
lessons:
  - security.broken-auth
