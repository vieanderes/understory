summary: >-
  An **array** is one value that holds a whole list of values, in order. Instead of `song1`,
  `song2` and `song3`, you keep one `songs` list and let the code work through it. That matters
  because real programs rarely know in advance how many things they'll handle: a basket might
  hold two items or two hundred.


  Every item sits at a numbered position, its **index**, and counting starts at 0. So the last
  item is always at `length - 1`, one less than the number of items. Nearly every list bug a
  beginner meets comes from forgetting that one fact.


  You reach for an array whenever you have many things of the same kind: prices, names, tasks,
  messages. Pair it with a loop and the same few lines handle any length. When the values are
  different facts about one thing, like a person's name and age, an array is the wrong shape.
  That's the next lesson, objects.
remember:
  - An array keeps many values in one list, in order, inside square brackets.
  - Indexes start at 0, so the first item is `list[0]` and the last is `list[list.length - 1]`.
  - Reading an index where nothing is stored gives `undefined`, not an error.
  - '`length` is the number of items, which is always one more than the last index.'
  - '`push` adds an item to the end and changes the list itself.'
  - A `const` array can still gain or change items, because `const` only fixes which list the name points at.
  - '`for...of` visits every item in order, and a counting `for` loop is the choice when you also need the position.'
  - To total a list, start a variable at 0 before the loop and add to it inside, never replace it.
sections:
  - title: What an index really is
    body: |-
      An index isn't "item number one, two, three". It's how far the item sits from the start.
      The first item is zero steps from the start, so its index is 0. The second is one step
      along, so its index is 1.

      That explains the rule you'll use most: a list of 3 items has indexes 0, 1 and 2. Its
      length is 3, and index 3 is one step past the end.

      ```js
      const fruits = ["apple", "banana", "cherry"];
      console.log(fruits.length); // 3
      console.log(fruits[fruits.length - 1]); // cherry
      console.log(fruits[3]); // undefined
      console.log(fruits[-1]); // undefined
      ```

      The last line surprises people who know other languages. In some of them, `-1` means
      "the last item". In JavaScript, square brackets with `-1` find nothing and give
      `undefined`.

      The same square brackets also work on the left of `=`. There they put a new value at
      that position, replacing what was there:

      ```js
      const fruits = ["apple", "banana", "cherry"];
      fruits[1] = "blueberry";
      console.log(fruits); // [ 'apple', 'blueberry', 'cherry' ]
      ```

      That last line prints the whole list. Node, a program that runs JavaScript outside a
      browser, shows an array in square brackets and puts text in single quotes. The quotes
      tell you those items are strings.

      Notice that reading past the end never stops the program. JavaScript hands you
      `undefined` and carries on. The trouble shows up later, on the line that tries to use
      that value. Lesson 9 follows one of those bugs back to its source.
  - title: Two ways to loop, and when to pick each
    body: |-
      `for...of` hands you each item and hides the index. That's the right choice most of the
      time, because there's no counter to get wrong.

      Sometimes you need the position too, for example to number a list for the screen. Then
      use the counting `for` loop from lesson 5, and read each item by its index:

      ```js
      const songs = ["Intro", "Chorus", "Outro"];
      for (let i = 0; i < songs.length; i++) {
        console.log(`${i + 1}. ${songs[i]}`);
      }
      // 1. Intro
      // 2. Chorus
      // 3. Outro
      ```

      Two details carry the whole loop. It starts at `let i = 0`, the first index. And it keeps
      going while `i < songs.length`, which stops after the last index. Write `i <= songs.length`
      and the loop runs one extra round, where `songs[3]` is `undefined`. That mistake is so
      common it has a name: an **off-by-one error**.

      The `i + 1` is for people. Humans count from 1 and code counts from 0, so you add 1 when
      you show a position and subtract 1 when a person gives you one.

      A rule of thumb: use `for...of` unless the loop body mentions the position. The moment
      you write `i` in the output or compare neighbouring items, switch to the counting loop.
  - title: 'The running total, and its cousins'
    body: |-
      The total in this lesson follows a pattern you'll write for the rest of your career.
      Make a variable before the loop, update it on every round, and read it after the loop.
      A variable used like that is called an **accumulator**, because it gathers a result.

      The same shape answers many different questions. Only the starting value and the update
      change:

      ```js
      const prices = [4, 10, 6, 12];

      let count = 0;
      for (const price of prices) {
        if (price > 5) {
          count = count + 1;
        }
      }
      console.log(count); // 3

      let highest = prices[0];
      for (const price of prices) {
        if (price > highest) {
          highest = price;
        }
      }
      console.log(highest); // 12

      const cheap = [];
      for (const price of prices) {
        if (price <= 6) {
          cheap.push(price);
        }
      }
      console.log(cheap); // [ 4, 6 ]
      ```

      Counting starts at 0 and adds 1. Finding the highest starts at the first item, not at 0.
      Start at 0 and a list of only negative numbers would wrongly report 0 as the highest.
      Building a new list starts with an empty `[]` and pushes the items that pass the test.

      Where the accumulator lives matters. Make it inside the loop and it's reset to its start
      value every round, so you only ever see the last item's effect.
  - title: The empty list, and what average does with it
    body: |-
      Every function that takes a list should be asked one question: what if the list is
      empty? The challenge in this lesson says you can assume it never is. Real code can't
      always assume that.

      ```js
      function average(numbers) {
        let total = 0;
        for (const number of numbers) {
          total = total + number;
        }
        return total / numbers.length;
      }

      console.log(average([2, 4, 6])); // 4
      console.log(average([])); // NaN
      ```

      With no numbers, the loop never runs, `total` stays 0, and the length is 0. Zero divided
      by zero has no answer, so JavaScript gives `NaN`, short for "Not a Number". Like
      `undefined`, it doesn't stop the program. It quietly flows on into every sum it touches.

      The fix is a decision, not a trick. What should the average of nothing be? For a star
      rating with no reviews, maybe 0. For a report, maybe the function should say "no data".
      Here's the first choice:

      ```js
      function average(numbers) {
        if (numbers.length === 0) {
          return 0;
        }
        let total = 0;
        for (const number of numbers) {
          total = total + number;
        }
        return total / numbers.length;
      }

      console.log(average([])); // 0
      ```

      Checking the empty case first, before any other work, keeps the main part of the
      function free of special cases.
pitfalls:
  - '**Starting to count at 1.** Everyday counting starts at 1, so `list[1]` feels like the first item. It''s the second. The first is always `list[0]`.'
  - '**Using `list[list.length]` for the last item.** The length counts items, but indexes start at 0, so that index is one past the end and gives `undefined`. Write `list[list.length - 1]`.'
  - '**Writing `<=` in a counting loop over a list.** `i <= list.length` runs one round too many and reads `undefined`. Use `i < list.length`.'
  - '**Replacing the total instead of adding to it.** `total = price` throws away the running total every round, so only the last price survives. Write `total = total + price`.'
  - '**Making the accumulator inside the loop.** A `let total = 0;` inside the curly brackets starts again every round. Put it before the loop and read it after.'
  - '**Thinking `const` freezes a list.** `const` stops you pointing the name at a different list, so `fruits = ["kiwi"]` stops with `TypeError: Assignment to constant variable.` It doesn''t stop `push` or `fruits[0] = "kiwi"`.'
interview:
  - question: Why do arrays in JavaScript start at index 0?
    answer: >-
      Because an index measures how far an item is from the start of the list, and the first
      item is zero steps away. Seen that way, the rules follow on their own. A list of n items
      uses indexes 0 up to n - 1, so the last item is at `length - 1`. A counting loop reads
      `for (let i = 0; i < list.length; i++)`. Most languages you'll meet, including Python,
      Java and C, count from 0 for the same reason. The cost is a translation step whenever
      people are involved. Humans number things from 1, so when you show a position you add 1,
      and when a person types "item 2" you subtract 1 to get the index. Forgetting that step in
      either direction is the classic off-by-one error.
  - question: What happens when you read an array index that doesn't exist?
    answer: >-
      You get `undefined`, and the program carries on without an error. That applies to an
      index past the end, like `list[list.length]`, and to a negative one like `list[-1]`. It
      feels friendly, but it moves the problem. The `undefined` travels on until some line tries
      to use it, for example reading `.title` from it. Only then does the program stop, with
      `TypeError: Cannot read properties of undefined`, often in a different function from the
      real mistake. So when you see `undefined` where a list item should be, check the index
      that produced it first. When a missing item is a real possibility, test for it on purpose
      rather than letting `undefined` flow on.
  - question: Write a function that returns the largest number in a list. What edge cases do you check?
    answer: >-
      I'd keep a running best, start it at the first item, and replace it whenever a later item
      is bigger. Starting at the first item matters. If I started at 0, a list of only negative
      numbers like `[-5, -2, -9]` would wrongly return 0, a number that isn't in the list. Then
      I'd check three edge cases. A list with one item should return that item. A list where
      the largest is first or last should still work, which tests both ends. And an empty list
      has no largest number at all, so I'd decide with the caller what it should return, since
      `list[0]` would be `undefined`. The loop visits each item once, so the work grows in step
      with the length of the list.
