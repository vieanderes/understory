id: basics.watching-code
title: Watching code run
objective: Watch values change with `console.log`, and pause code with breakpoints and stepping.
level: essential
minutes: 10
concepts: [basics.probes, basics.debugger]
prerequisites: [basics.debugging]
opening:
  text: >-
    You'll learn to watch your code run and see every value change. It's how you catch the
    bugs that give a wrong answer without any error.

steps:
  - type: prose
    id: bugs-without-errors
    body: |-
      Some bugs never cause an error. The code runs to the end and gives the wrong answer:

      ```js
      let left = 0;
      for (const task of tasks) {
        if (task.Done === false) {
          left = left + 1;
        }
      }
      console.log(`Tasks left: ${left}`);
      ```

      One task is still open, but this shows `Tasks left: 0`. There's no error message and no
      line number. To find this bug, you need to see inside while the code runs.

  - type: prose
    id: console-log-probe
    body: |-
      You already have a tool for that: `console.log`. Put one inside the loop, and every
      round shows you its values. It takes several values, split by commas, and prints them on
      one line:

      ```js
      for (const price of prices) {
        total = total + price;
        console.log(price, total);
      }
      ```

      A line like this, added only to look inside, is often called a **probe**. You delete it
      once the bug is fixed.

  - type: code-challenge
    id: write-probe-tasks
    concept: basics.probes
    difficulty: 2
    language: js
    starter: tasks.starter.js
    solution: tasks.solution.js
    tests: tasks.tests.js
    prompt: >-
      Here's the buggy code. Add the probe `console.log(task.title, task.Done);` as the first
      line inside the loop, and run it.


      Look at what the probe shows for `Done`. Then fix the bug, so it shows `Tasks left: 1`.
    hints:
      - The probe shows `undefined` where you'd expect `true` or `false`.
      - '`undefined` means the object has no property with that name. Compare it with the list.'
      - Property names care about capital letters. The list says `done`.

  - type: prose
    id: breakpoints-and-stepping
    body: >-
      A probe shows only what you thought to print. A **debugger** shows everything. It's a
      tool that pauses your program on a line you choose, called a **breakpoint**. While it's
      paused, you can read every variable. It even shows text in quotes, which `console.log`
      hides.


      Browsers have a debugger in their developer tools, and so do code editors.

  - type: ai-review
    id: review-ai-tasks-fix
    concept: basics.debugger
    difficulty: 3
    language: js
    request: Fix my tasks-left count. It always says 0.
    flawClass: logic
    code: |
      const tasks = [
        { title: "Buy milk", done: true },
        { title: "Call the dentist", done: false },
      ];
      let left = 0;
      for (const task of tasks) {
        if (task.done === "false") {
          left = left + 1;
        }
      }
      console.log(`Tasks left: ${left}`);
    prompt: 'An AI assistant sent this fix. It still shows `Tasks left: 0`. Tap the line at fault.'
    lines: [7]
    reasons:
      - text: '`"false"` in quotes is text, not the boolean `false`'
        correct: true
        feedback: >-
          Right. `===` compares exactly, and text never equals a boolean. A debugger shows the quotes.
      - text: '`done` should still be `Done`'
        feedback: >-
          That was the first bug. The list says `done`, so the name is right now.
      - text: '`left` should be a `const`'
        feedback: >-
          `left` goes up inside the loop, so it needs `let`.
    fix: |
      if (task.done === false) {
        left = left + 1;
      }

  - type: prose
    id: stepping
    body: >-
      Once it's paused, you move on in small steps, with three buttons.


      **Step over** runs the current line and pauses on the next one. **Step into** goes inside
      the function this line calls. **Step out** finishes the function you're in and pauses in
      the one that called it.


      The debugger also shows the call stack from the last lesson: the pile of functions still
      running.

  - type: multiple-choice
    id: pick-step-move
    concept: basics.debugger
    difficulty: 2
    language: js
    code: |
      const left = countLeft(tasks);
      console.log(`Tasks left: ${left}`);
    question: You're paused on line 1. You want to watch the loop inside `countLeft`. Which button?
    choices:
      - text: Step into
        correct: true
        feedback: >-
          Right. It goes inside `countLeft` and pauses on its first line.
      - text: Step over
        feedback: >-
          That runs all of `countLeft` in one go and pauses on line 2. You'd miss the loop.
      - text: Step out
        feedback: >-
          Step out leaves the function you're in. On line 1 you aren't inside one yet.

  - type: code-challenge
    id: write-fix-warmest
    concept: basics.probes
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      A cold week had these temperatures: -5, -2 and -9 degrees. `warmest` says the warmest
      was 0, a day that never happened.


      Add the probe `console.log(temp, best);` inside the loop and run it. Watch `best` in the
      Console. Then fix `warmest` so it shows `-2`.
    hints:
      - Look at `best` in the Console. Does it ever change?
      - Every temperature is below 0, so none of them beats the starting value of `best`.
      - Start `best` at a temperature from the list, not at 0.

  - type: explain-back
    id: explain-watching-values
    concept: basics.probes
    difficulty: 3
    prompt: '`warmest` gave a wrong answer with no error. How does watching the values lead you to the bug?'
    rubric:
      - You print or pause inside the code to see each value as it changes.
      - You compare each value with what you expected it to be.
      - The first place they differ points at the line with the bug.
    modelAnswer: >-
      A probe or a breakpoint in the loop shows `best` every round. I expected it to become -5,
      then -2. It stayed 0 from the start, so the bug was in how `best` began, not in the loop.

recap:
  - "Add a `console.log` probe to watch values change."
  - "Find the first value that differs from what you expected."
  - "Pause on a breakpoint and step over, into or out."
recall:
  - id: card-probe
    concept: basics.probes
    front: A bug gives a wrong answer but no error. What's the quickest way to look inside?
    back: >-
      Add a `console.log` probe where the values change, like inside a loop, and run it.
  - id: card-breakpoint
    concept: basics.debugger
    front: What does a breakpoint do?
    back: >-
      It pauses the program on that line in a debugger, so you can read every variable.
  - id: card-step-moves
    concept: basics.debugger
    front: What do step over, step into and step out do?
    back: >-
      Over runs the line and pauses on the next. Into goes inside the called function. Out
      finishes the function and pauses in its caller.

