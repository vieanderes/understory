term: B-tree
aka: [B+ tree, B+tree]
short: A wide, shallow search structure whose nodes each hold hundreds of sorted keys, sized to one disk page.
explain: |
  Reading from disk is slow, and it comes in pages of a few kilobytes. A two-way tree of a
  billion keys is thirty levels deep, so thirty slow reads per lookup.

  Here each node fills one page with hundreds of keys and children. A billion keys fit in
  three or four levels, so a lookup reads three or four pages. The keys stay sorted, so
  range scans walk along neighbouring pages.

  It's the shape behind most database indexes. When you add an index in Postgres, this is
  usually what gets built.
analogy: A library's signs. Floor, then aisle, then shelf, and three looks find any of a million books.
usage: The index is a B-tree, so the range query reads a few pages instead of scanning the whole table.
twin:
  term: binary-search-tree
  difference: A B-tree keeps hundreds of keys per node to stay shallow on disk. A binary search tree keeps one key per node and lives in memory.
related: [binary-search-tree, index, tree]
