summary: >-
  A function is the smallest unit of design you have. When it does one job, its name can
  say everything it does, a test can cover it in a few cases, and a change to one rule
  touches one place. When it does four jobs, every change risks the other three, and the
  name either lies or grows an "and".


  Four habits keep functions small and honest. Give each one **one job at one level of
  abstraction**, so it reads as a short list of steps. Keep **parameter lists short**, and
  pass related values as one options object so every argument is named at the call. Replace
  **flag arguments** that switch behaviour with two functions whose names say what each
  does. And separate **commands** that change state from **queries** that answer a
  question, so looking never has a side effect.


  None of these is a line limit. The goal is that a reader can predict what a call does
  from its name and arguments alone. Taken too far, splitting scatters a simple algorithm
  across ten tiny functions, and that costs reading too.
remember:
  - A function should do one job, and if you need "and" to describe it, it does two.
  - Keep each function at one level of abstraction, so high-level steps aren't mixed with string building or arithmetic.
  - More than two or three positional parameters invite swapped arguments, so pass related values as one options object.
  - Give a destructured options parameter a default of `{}`, or calling the function without it throws a `TypeError`.
  - A boolean argument that switches behaviour hides two functions, so split it into two named functions.
  - Command-query separation means a function either changes state or returns an answer, never both.
  - A pure function returns a result from its arguments alone and changes nothing outside, which makes it trivial to test.
sections:
  - title: One level of abstraction, read top to bottom
    body: |-
      "One job" is easiest to judge through **levels of abstraction**. A high-level function
      should read like a list of steps in the language of the problem. When the same body
      also adds up prices and glues strings together, the reader has to switch between the
      big picture and the details on every line.

      ```js
      // Before: the steps of a checkout, mixed with arithmetic and text building.
      function checkoutBefore(order, db, mailer) {
        let total = 0;
        for (const item of order.items) total += item.pricePence * item.qty;
        db.save({ id: order.id, totalPence: total });
        let body = 'Thanks for your order.\n';
        for (const item of order.items) body += `${item.qty} x ${item.name}\n`;
        body += `Total: £${(total / 100).toFixed(2)}`;
        mailer.send(order.email, body);
      }

      // After: the top function reads as three steps; the details live one level down.
      function orderTotalPence(items) {
        return items.reduce((sum, item) => sum + item.pricePence * item.qty, 0);
      }

      function receiptText(items, totalPence) {
        const lines = items.map((item) => `${item.qty} x ${item.name}`);
        return ['Thanks for your order.', ...lines, `Total: £${(totalPence / 100).toFixed(2)}`].join('\n');
      }

      function checkout(order, db, mailer) {
        const totalPence = orderTotalPence(order.items);
        db.save({ id: order.id, totalPence });
        mailer.send(order.email, receiptText(order.items, totalPence));
      }

      const order = {
        id: 'o1',
        email: 'sam@example.com',
        items: [{ name: 'Mug', pricePence: 850, qty: 2 }],
      };
      const db = { save: (row) => console.log('saved', row) };
      const mailer = { send: (to, body) => console.log(`to ${to}:\n${body}`) };
      checkout(order, db, mailer);
      // saved { id: 'o1', totalPence: 1700 }
      // to sam@example.com:
      // Thanks for your order.
      // 2 x Mug
      // Total: £17.00
      ```

      The payoff is more than looks. `orderTotalPence` and `receiptText` are pure, so they
      can be tested with plain data and no fake database. `checkout` is now a thin
      coordinator whose only job is the order of the steps. Reading from the top, each
      function leads to the ones below it, sometimes called the **stepdown rule**.

      Stop splitting when a new function would have no better name than its body. A helper
      called once, whose name restates one obvious line, adds a jump without adding meaning.
  - title: Parameters, options objects and their defaults
    body: |-
      One or two positional parameters are fine when their meaning is obvious from the
      function: `Math.max(a, b)`, `orderTotalPence(items)`. Past that, positional arguments
      become a memory test, and values of the same type swap silently. An options object
      names every value at the call and makes order irrelevant.

      Destructuring defaults have two details that trip people up. First, the object itself
      needs a default, or a call with no options throws. Second, a default only replaces
      `undefined`, not `null`.

      ```js
      function paginate(items, { page = 1, pageSize = 2 } = {}) {
        const start = (page - 1) * pageSize;
        return items.slice(start, start + pageSize);
      }

      const books = ['Dune', 'Emma', 'Ulysses', 'Beloved', 'Hamlet'];
      console.log(paginate(books)); // [ 'Dune', 'Emma' ]
      console.log(paginate(books, { page: 3 })); // [ 'Hamlet' ]
      console.log(paginate(books, { page: undefined })); // [ 'Dune', 'Emma' ]
      console.log(paginate(books, { page: null })); // []
      ```

      The last line is the surprise. `null` is a real value, so the default is skipped and
      `page` becomes `null`. Arithmetic turns `null` into `0`, so `start` is `-2` and
      `slice(-2, 0)` returns nothing. No error, only an empty page. If callers might send
      `null`, from JSON for example, normalise it inside the function with `page ?? 1`.

      In TypeScript, give the options object a type. A misspelt field like `pagesize` then
      fails to compile, which positional arguments can never offer.

      ```ts
      type PageOptions = { page?: number; pageSize?: number };

      function paginateTyped<T>(items: T[], { page = 1, pageSize = 20 }: PageOptions = {}): T[] {
        const start = (page - 1) * pageSize;
        return items.slice(start, start + pageSize);
      }

      console.log(paginateTyped(['a', 'b', 'c'], { pageSize: 2 })); // [ 'a', 'b' ]
      ```
  - title: Commands, queries and pure functions
    body: |-
      A **query** returns an answer and changes nothing. A **command** changes something
      and returns nothing. Keeping them apart means callers can ask a question as often as
      they like, in any order, from a log line or a debugger, without changing the outcome.

      JavaScript's own library breaks the rule in a famous place. `sort` reorders the array
      in place and also returns it, so code that looks like a query mutates its input.
      `toSorted`, available since ES2023, is the query version.

      ```js
      const prices = [30, 10, 20];
      const cheapestFirst = prices.sort((a, b) => a - b);
      console.log(prices); // [ 10, 20, 30 ]  the original changed too

      const scores = [30, 10, 20];
      const ranked = scores.toSorted((a, b) => a - b);
      console.log(scores, ranked); // [ 30, 10, 20 ] [ 10, 20, 30 ]
      ```

      A **pure function** goes one step further than a query. Its result depends only on
      its arguments, and it has no side effects: no mutation of inputs, no I/O, no reading
      the clock or a global. Given the same input it always returns the same output.

      ```js
      // Pure: returns a new cart and leaves the old one alone.
      function addItem(cart, item) {
        return { ...cart, items: [...cart.items, item] };
      }

      const empty = { items: [] };
      const withPen = addItem(empty, { name: 'Pen', pricePence: 120 });
      console.log(empty.items.length, withPen.items.length); // 0 1
      ```

      Pure functions are the easiest code to test, reuse and reason about, because there is
      no hidden state to set up. The practical pattern is to push decisions into pure
      functions and keep the commands, such as saving and sending, in a thin outer layer.
      A later lesson in this chapter builds on that as functional core, imperative shell.
  - title: When the rules bend
    body: |-
      These are heuristics, and a senior engineer knows their exceptions.

      **Commands that return something.** `array.pop()` removes and returns an item, and
      `map.set(key, value)` returns the map so calls can chain. A stack without `pop` would
      be clumsy. A command that returns the id of the row it created is also common and
      harmless. The rule is about surprise: a function named like a question must never
      change anything. `nextTicketNumber()` may change state because its name says so;
      `currentTicketNumber()` may not.

      **Booleans that are data, not a switch.** `setMuted(isMuted)` passes a value through
      from a checkbox. The function does one thing, sets the flag, whichever value it gets.
      A flag argument is a problem when `true` and `false` run different code paths, like
      `formatRows(rows, true)`.

      **Long parameter lists that are really one idea.** If `start`, `end` and `timezone`
      always travel together, the fix isn't only an options object. It may be a new type,
      such as a `DateRange`, which the refactoring catalogue calls *introduce parameter
      object*. Validation and helper functions then have a home.

      **Too many tiny functions.** Splitting a 20-line algorithm into eight one-line helpers
      forces the reader to jump around to follow it. Extract when the new name says more
      than the code it hides, or when a piece is reused or tested alone.
pitfalls:
  - "**Forgetting the default on a destructured options parameter.** `function f({ a = 1 })` throws a `TypeError` when called as `f()`, because there is no object to destructure. Write `function f({ a = 1 } = {})`."
  - "**Expecting destructuring defaults to replace `null`.** Defaults apply only to `undefined`, so `{ page: null }` gives you `null`. Normalise with `page ?? 1` when values may come from JSON."
  - "**Hiding a side effect in a getter or query.** A `getBalance` that also records an audit event, or a `total` that caches into the cart, changes state every time someone looks. Split the effect into a named command."
  - "**Mutating an argument.** `items.sort()` or `order.status = 'paid'` inside a helper changes the caller's data behind their back. Return a new value, for example with `toSorted` or a spread copy."
  - "**Splitting by line count instead of by job.** A long function that does one clear thing in sequence can be fine, and three short ones that share state through module variables are worse. Split where a name adds meaning."
  - "**Adding one more positional boolean.** `sendEmail(to, body, true, false)` is unreadable at the call. Use an options object with named fields, or separate functions for separate behaviours."
interview:
  - question: How do you decide when a function is doing too much?
    answer: >-
      I ask whether I can describe it in one sentence without "and", and whether every line
      sits at the same level of abstraction. A `checkout` that sums prices, saves a row and
      formats an email has three reasons to change, and its body mixes the steps of the
      process with arithmetic and string building. I extract the details into functions
      named after what they return, such as `orderTotalPence` and `receiptText`, and leave
      `checkout` as a short coordinator. The extracted parts are often pure, which makes them
      simple to test. The limit is indirection: I don't extract a helper whose name adds
      nothing over the one line it hides.
  - question: What is command-query separation, and where would you break it?
    answer: >-
      It's the rule that a function either changes state, a command, or returns
      information, a query, but not both. The benefit is that queries are safe to call
      anywhere and any number of times, from a log, a render or a debugger, without changing
      behaviour. The classic violation is a getter that increments a counter, so every look
      skips a value. I break it when the combination is the point and the name says so:
      `stack.pop()`, an atomic `nextId()` or an insert that returns the new id. Splitting
      those would add a race between the read and the write. What I never allow is a
      question-shaped name with a side effect.
  - question: When do you use an options object instead of positional parameters?
    answer: >-
      Once a function takes more than two or three parameters, or any parameter whose
      meaning isn't obvious at the call, such as a boolean. `createUser("Ana", true, false)`
      is unreadable, and arguments of the same type swap silently, as with a room id and a
      guest id. An options object names every value at the call, makes order irrelevant and
      lets optional fields have defaults. In TypeScript its type catches misspelt fields. I
      always default the object itself to `{}` so the call without options works. The
      trade-off is a little more ceremony, so I keep positional parameters for short,
      obvious signatures like `add(a, b)`.
  - question: Why do people say pure functions are easier to test?
    answer: >-
      Because the whole behaviour is in the arguments and the return value, so a test is
      input, call, compare, with no setup or teardown. A pure function doesn't read the
      clock, a global, a database or the network, and it doesn't change its inputs. That
      also makes it safe to call twice, cache or run in parallel. Real programs still need
      side effects, so the design move is to keep decisions pure and push effects to a thin
      outer layer: compute the new cart in a pure function, then save it. The trade-off is
      passing more data in explicitly, such as the current time, instead of reaching out for
      it.
terms:
  - term: One job
    say: A function should be short.
    means: A function should do one thing at one level of abstraction, so its name says everything it
      does. Length is a symptom, not the rule.
  - term: Level of abstraction
    say: How complicated the code is.
    means: How close a step is to the problem or to the machine. A function that mixes 'charge the
      order' with string building makes the reader switch levels mid-read.
  - term: Flag argument
    say: A handy option.
    means: A boolean that switches what a function does, hiding two functions behind one name.
      `save(order, true)` says nothing at the call; `saveDraft(order)` does.
  - term: Command-query separation
    say: Getters and setters.
    means: A function either changes state, a command, or returns an answer, a query, never both. Asking
      a question then never has a side effect.
  - term: Pure function
    say: A function with no side effects.
    means: A function whose result depends only on its arguments *and* which changes nothing outside
      itself. Same input, same output, so a test needs no set-up.
  - term: Options object
    say: A way to pass lots of settings.
    means: One object parameter whose named properties replace a long positional list, so arguments
      can't be swapped. Default it to `{}`, or calling without it throws.
