term: invariant
aka: [loop invariant, invariants]
short: A fact about your variables that stays true every time a loop goes round.
explain: |
  Binary search goes wrong at the edges: is it `<` or `<=`, `mid` or `mid + 1`? Guessing
  leads to infinite loops. Deciding one rule first settles every choice.

  For example: "if the target is there, it lies between lo and hi". Set it up before the loop and keep it true with every update. When the loop ends, it
  tells you the answer.

  Saying it out loud is the best defence against off-by-one errors. Reviewers ask for it
  because it shows why the code is right, not that one example passed.
analogy: A ship's captain checking "the harbour is still ahead of us" after every turn of the wheel.
example:
  language: python
  code: |
    def first_true(lo, hi, ok):
        # invariant: ok(x) is False for x < lo, True for x >= hi
        while lo < hi:
            mid = (lo + hi) // 2
            if ok(mid):
                hi = mid        # keeps: True from hi onwards
            else:
                lo = mid + 1    # keeps: False below lo
        return lo
usage: State the invariant for the window first; then whether to shrink with if or while is clear.
related: [binary-search, off-by-one-error, two-pointers]
level: 3
lessons: [cs.searching-and-sorting, algo.binary-search-patterns]
