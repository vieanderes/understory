term: container image
aka: [ Docker image, Dockerfile, OCI image ]
short: A packaged, read-only snapshot of an app with its runtime and libraries, ready to start anywhere.
explain: |
  You want the same app on a laptop, in CI and in production. So you need one package holding
  the code, runtime, libraries and start command.

  A Dockerfile lists the steps that build it, and each step makes a cached layer. Put the
  steps that change least first, such as installing packages, so a code change rebuilds only
  the last layers. Tag every build with its version or commit, never only `latest`, so a
  deploy names exactly what runs.
analogy: A cake mix with every ingredient measured in. Add water anywhere and you get the same cake.
example:
  language: text
  code: |
    FROM node:22-slim
    WORKDIR /app
    COPY package.json pnpm-lock.yaml ./
    RUN corepack enable && pnpm install --frozen-lockfile
    COPY . .
    RUN pnpm build
    CMD ["node", "dist/server.js"]
usage: Build the container image once in CI and promote that exact tag to staging and production.
related: [ container, build-artefact, container-orchestration, secret ]
level: 1
lessons: [ cloud.building-images, cloud.containers ]
