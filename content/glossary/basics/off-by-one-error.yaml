term: off-by-one error
aka: [off by one, fencepost error, OBOE]
short: A mistake where a count or a loop goes one step too far, or stops one step short.
explain: |
  Lists count from 0, so a list of 3 items has positions 0, 1 and 2. Write
  `i <= list.length` and the loop also visits position 3. Nothing is there, so you get
  `undefined`.

  It's one of the most common bugs in all of programming. Check the edges: the first item,
  the last item and an empty list. Start at 0 and use `<` with `length`; that's the safe
  habit.
analogy: Fence posts. A 10 metre fence with a post every metre needs 11 posts, not 10.
example:
  language: js
  code: |
    const items = ["tea", "milk", "bread"];
    for (let i = 0; i <= items.length; i++) {
      console.log(items[i]); // last lap prints undefined
    }
    // fix: i < items.length
usage: The last row says undefined, so look for an off-by-one error in the loop condition.
related: [loop, array-index, array, bug, binary-search, invariant, edge-case]
