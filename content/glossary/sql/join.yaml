term: join
aka: [SQL join, inner join, left join]
short: A query step that matches rows from two tables on a shared column and combines them.
explain: |
  Your orders table stores `customer_id`, not the customer's name. To show "order 12 by
  Sam", you need both tables at once. A join lines them up wherever the ids match.

  An inner join keeps only rows that match on both sides. A left join keeps every row from
  the left table and fills the gaps with `NULL`, which is what you want for "customers and
  their orders, including those with none". The trap: joining to a table with many matches
  repeats the left row once per match, and a `SUM` afterwards counts things twice.
analogy: Matching socks from two laundry piles by colour. Each pair goes together; a left join also keeps the odd socks from the first pile.
example:
  language: sql
  code: |
    SELECT c.name, o.total_pence
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.id;
usage: The totals doubled because the join to order_items repeats each order once per item.
