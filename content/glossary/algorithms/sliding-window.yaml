term: sliding window
aka: [fixed window, variable window, sliding windows]
short: A stretch of neighbouring items that moves along a list, updated by what enters and leaves.
explain: |
  "The longest stretch of a string with no repeated letter." Checking every stretch is
  O(n²) or worse. But neighbouring stretches overlap almost entirely.

  So keep one stretch and slide it. The right edge grows it by one item. When a rule
  breaks, the left edge shrinks it until the rule holds again. Each item enters once and
  leaves once, so it's O(n).

  A fixed size, like "any 7 days", moves both edges together. It only works for
  contiguous runs. If the answer can skip items, it's a different pattern.
analogy: A train window on a long journey. The view changes a little at each end, and you never re-look at the whole countryside.
example:
  language: python
  code: |
    def longest_unique(text):
        seen, left, best = set(), 0, 0
        for right, ch in enumerate(text):
            while ch in seen:          # rule broken: shrink from the left
                seen.remove(text[left])
                left += 1
            seen.add(ch)
            best = max(best, right - left + 1)
        return best
usage: It's a contiguous run with a condition, so try a sliding window before anything clever.
twin:
  term: two-pointers
  difference: A sliding window moves both edges forwards and tracks everything between them. Two pointers often start at opposite ends and look only at the two items they point to.
related: [two-pointers, subarray, prefix-sum, hash-set]
