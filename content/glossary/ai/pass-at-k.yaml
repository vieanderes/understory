term: pass@k
aka:
  - pass at k
short: The chance that at least one of several attempts at a task succeeds.
explain: |
  Agents vary from run to run. Run a task five times and it might succeed three. One number
  can't describe that, so you ask a question about k tries.

  This metric asks: if I try k times, will at least one work? It rises as k grows. It suits
  tools where a person sees several attempts and picks the best, such as a coding assistant
  offering drafts.

  It flatters an agent users meet once. A support bot with a high score here can still fail
  one customer in three.
analogy: A footballer taking five penalties. You ask whether at least one went in.
usage: pass@k is fine for the draft generator, because the user picks the best of five.
twin:
  term: pass-hat-k
  difference: pass@k asks whether at least one of k tries succeeds, so it rises with k. pass^k asks whether all k succeed, so it falls with k and measures reliability.
related:
  - pass-hat-k
  - eval
  - trajectory
level: 3
lessons:
  - agents.evals-for-agents
