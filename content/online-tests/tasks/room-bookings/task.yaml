id: room-bookings
title: RoomBookings
topic: greedy
difficulty: easy
type: bug-fix
recommendedMinutes: 15
maxChangedLines: 1
signature:
  params:
    - { name: B, type: "int[][]" }
  returns: int
statement: |-
  A meeting room receives N booking requests. Request K is a pair B[K] = [S, E]: it needs
  the room from minute S to minute E, both included. Two requests clash when they share at
  least one minute. The room manager wants to accept as many requests as possible, with no
  two accepted requests clashing.

  The function below is meant to count them: it sorts the requests by their last minute and
  accepts each one that starts after the last accepted request ends. It returns wrong
  answers for some inputs. Find the bug and fix it. **You can modify at most one line.**

  {{signature}}

  For example, given B = [[1, 4], [3, 5], [5, 7], [8, 9]], the function should return 3,
  for the requests [1, 4], [5, 7] and [8, 9].

  Given B = [[0, 2], [1, 3]], the function should return 1.

  Given B = [[2, 2], [2, 2]], the function should return 1.

  Assume that:

  - N is an integer within the range [1..1,000];
  - each element of array B is a pair [S, E] of integers with 0 ≤ S ≤ E ≤ 1,000,000.

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [[[1, 4], [3, 5], [5, 7], [8, 9]]], expected: 3 }
  - { args: [[[0, 2], [1, 3]]], expected: 1 }
  - { args: [[[2, 2], [2, 2]]], expected: 1 }
tests:
  - name: extreme_single
    description: one request
    group: correctness
    cases:
      - { args: [[[0, 0]]], expected: 1 }
      - { args: [[[5, 1000000]]], expected: 1 }
  - name: starts_at_zero
    description: requests starting at minute 0
    group: correctness
    cases:
      - { args: [[[0, 1], [2, 3], [4, 5]]], expected: 3 }
      - { args: [[[3, 9], [0, 4], [5, 6]]], expected: 2 }
  - name: touching
    description: one request ends on the minute the next starts
    group: correctness
    cases:
      - { args: [[[1, 3], [3, 5], [5, 7]]], expected: 2 }
      - { args: [[[1, 2], [3, 4], [2, 3]]], expected: 2 }
  - name: small_random
    description: random requests, N = 30
    group: correctness
    cases:
      - generate: { seed: 1001, args: [{ kind: pairs, n: 30, min: 0, max: 60 }] }
      - generate: { seed: 1002, args: [{ kind: pairs, n: 30, min: 0, max: 10 }] }
  - name: medium_random
    description: random requests, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 1003, args: [{ kind: pairs, n: 1000, min: 0, max: 1000000 }] }
