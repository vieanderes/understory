term: automation bias
aka:
  - rubber-stamping
short: People's tendency to accept what a confident automated system proposes without checking it properly.
explain: |
  Put a person in front of a queue of AI proposals. The first ten get read carefully. By the
  two-hundredth, they're approved in a second, because the system was right the last hundred
  times.

  That's not laziness; it's how attention works. The danger is a high approval rate that looks
  like quality but is really fatigue.

  Design against it. Show uncertainty and sources, and put high-risk items first. Keep each reviewer's workload
  realistic, and seed known-bad items to check reviewers still catch them.
analogy: Following the satnav into a lake because it's been right all week.
usage: Ninety-nine per cent approval may be automation bias, not quality, so seed some known-bad items.
twin:
  term: human-in-the-loop
  difference: Automation bias is the human tendency to trust the machine. Human in the loop is the design that asks a person to check. Automation bias quietly defeats it.
related:
  - human-in-the-loop
  - eval
  - hallucination
level: 3
lessons:
