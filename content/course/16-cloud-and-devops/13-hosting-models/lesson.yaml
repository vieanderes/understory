deepDive: >-
  The Caddyfile in the bug hunt was checked with `caddy adapt` on Caddy 2.11.4. The rest of
  this lesson is judgement, resting on the providers' own documentation. We've left prices
  out on purpose, because they change monthly. The price shapes don't. A server is a flat
  fee, used or idle. An instance-hour is a fee you can stop paying at night. Per request
  costs nothing when nobody visits, and grows without a ceiling. The code challenge lets
  you find where two shapes cross for your own numbers.


  A quiet favourite sits between the ends: two or three plain servers behind the
  provider's managed load balancer. You keep root and low prices. The provider keeps the
  balancer redundant, which is hard to do yourself.


  Failure modes differ more than prices. On a VPS you fail alone, at 3 a.m., with full
  access to fix it. On a platform you fail with everyone else in that region, and can only
  wait and read a status page. With Kubernetes the cluster is one more thing that breaks.


  Running your own model changes the sums once traffic is steady and high, or when data
  may not leave your network. Then a GPU busy most of the day can beat per-token prices.
  Measure your tokens per day first, as lesson 10 shows.


  Lock-in is real and often overstated. An app in a container, reading its config from the
  environment, moves between these models in days. An app built on one platform's queues,
  storage and edge features doesn't.
