term: falsy
aka:
  - falsiness
short: A value that counts as false in a condition, such as 0, an empty string, null or undefined.
explain: |
  Only a few values fail an `if`: `false`, `0`, `-0`, `0n`, `''`, `null`, `undefined` and
  `NaN`. Everything else passes.

  The trap is when one of them is a real answer. A price of `0` or an empty note is valid
  data, yet `price || 10` replaces it. Use `??` when you only mean "missing".
analogy: The few keys on a ring that open nothing. Learn those, and you know every other key works.
example:
  language: js
  code: |
    const quantity = 0;
    quantity || 1; // 1: the real 0 is lost
    quantity ?? 1; // 0
usage: A quantity of 0 is falsy, so the cart drops the line instead of showing zero.
twin:
  term: truthy
  difference: Falsy is the short list of values that count as false. Truthy is everything else, so the falsy list is the one worth learning by heart.
related:
  - truthy
  - nullish-coalescing
  - type-coercion
level: 1
lessons: [js.coercion, python.decisions-and-loops]
