summary: >-
  Git records the history of a folder as a series of snapshots called commits. Each commit
  stores the complete state of every tracked file, a message, an author and a pointer to the
  commit before it. Git doesn't store "what changed". It stores whole snapshots and works out
  the changes when you ask, which is why checking out any old version is fast and exact.


  Between your files and the history sits the staging area, also called the index. `git add`
  copies the current content of a file into it, and `git commit` turns exactly what's in it
  into the next snapshot. That middle step is what lets you commit one clear change at a time
  while other edits wait, and it explains most confusing `git status` output.


  `.gitignore` keeps files out of that process: secrets, installed packages, build output and
  system clutter. It only works on files Git isn't tracking yet, and nothing you put in it can
  remove a file from a commit that already exists. That's why a leaked key has to be replaced,
  not only deleted.
remember:
  - A commit is a full snapshot of the tracked files plus a message, an author, a timestamp and the hash of its parent.
  - Git has three copies of every file to compare, the last commit, the staging area and your working folder, and `git status` reports the differences between them.
  - '`git add` copies a file''s content into the staging area at that moment, so later edits need another `git add`.'
  - Every object is named by a hash of its content, so identical content always gets the same name and any change gets a new one.
  - '`git diff` shows unstaged changes, `git diff --staged` shows what the next commit will contain, and `git diff HEAD` shows both.'
  - '`.gitignore` only affects untracked files, so a tracked file needs `git rm --cached` before ignoring it.'
  - A secret that reached a commit is compromised for good, so replace it first and clean the history second.
  - '`git commit --amend` doesn''t edit a commit, it replaces it with a new one that has a new hash.'
sections:
  - title: What's inside a commit
    body: |-
      Git stores everything in `.git/objects` as three kinds of object:

      - A **blob** holds the content of one file, with no name attached.
      - A **tree** is a folder listing: names, file modes and the hash of each blob or
        sub-tree.
      - A **commit** points at one tree, the snapshot, and records the parent commit, the
        author, the committer, times and the message.

      You can look at them directly. In a new repository with one recipe file:

      ```text
      $ git add recipes/pancakes.txt README.md
      $ git commit -q -m "Add pancake recipe"
      $ git cat-file -p HEAD
      tree 808dbcf1bd3b78e0df10b7dd71ee1a55f1ee4b2a
      author Sam Lee <sam@example.com> 1790357762 +0200
      committer Sam Lee <sam@example.com> 1790357762 +0200

      Add pancake recipe
      $ git cat-file -p 'HEAD^{tree}'
      100644 blob ae5e354863163528256fab6c692aaada622e83bd    README.md
      040000 tree e3f628a2f4e88a1274461fc964b324c02e8f30f6    recipes
      $ git cat-file -p 'HEAD:recipes'
      100644 blob bc63b641d194c1716ec81fef8c2d823d5ee18aa5    pancakes.txt
      ```

      The long number after the email is the time, in seconds since 1970, and `+0200` is the
      time zone. The first commit has no `parent` line. Every later one does. Your commit hash
      will differ from anyone else's, because the commit includes the author and the time. The
      blob and tree hashes won't: they depend only on content and names. Git computes it as SHA-1 of a short header plus the
      bytes, which you can reproduce in Node:

      ```js
      const { createHash } = require("node:crypto");
      const content = "flour, eggs, milk\n";
      const header = `blob ${Buffer.byteLength(content)}\0`;
      console.log(createHash("sha1").update(header + content).digest("hex"));
      // bc63b641d194c1716ec81fef8c2d823d5ee18aa5
      ```

      Naming by content has consequences. Two files with the same content are stored once.
      Changing one byte gives a new blob, so a new tree, so a new commit. And because a commit
      includes its parent's hash, changing any old commit changes every hash after it. That's
      what makes history tamper-evident, and it's why "editing" a commit always means making
      a new one.
  - title: The three trees and what git status compares
    body: |-
      At any moment there are three versions of each file: the one in the last commit
      (`HEAD`), the one in the staging area and the one in your folder, the **working tree**.
      The staging area is a real file, `.git/index`, that lists a path and a blob hash for
      every tracked file. `git ls-files --stage` prints it.

      `git status` is two comparisons: `HEAD` against the index ("Changes to be committed") and
      the index against the working tree ("Changes not staged"). Its short form shows both
      as two letters:

      ```text
      $ echo "flour, eggs, milk, butter" > recipes/pancakes.txt
      $ git add recipes/pancakes.txt
      $ echo "flour, eggs, milk, butter, salt" > recipes/pancakes.txt
      $ echo "3 eggs" > omelette.txt
      $ git status -s
      MM recipes/pancakes.txt
      ?? omelette.txt
      ```

      The left `M` says the staged version differs from `HEAD` (butter). The right `M` says the
      file differs from the staged version (salt). `??` is untracked. A commit now saves the
      butter version only, because `git add` copied the content at that moment, not a link
      to the file.

      The three `diff` commands map onto the same picture:

      - `git diff` compares the working tree with the index: what you haven't staged.
      - `git diff --staged` compares the index with `HEAD`: exactly what `git commit` will
        record.
      - `git diff HEAD` compares the working tree with `HEAD`: everything since the last
        commit.

      Reading `git diff --staged` before each commit is the cheapest review you'll ever do.
      For files with several unrelated edits, `git add -p` walks through each changed block
      and asks whether to stage it, so one file can feed two separate commits.
  - title: Undoing at each level
    body: |-
      Each of the three trees has its own undo, and they differ in how dangerous they are:

      ```bash
      git restore --staged recipes/pancakes.txt   # unstage: index back to HEAD, file untouched
      git restore recipes/pancakes.txt            # discard edits: file back to the index
      git commit --amend -m "Add pancake recipe"  # replace the last commit with a new one
      git rm --cached .env                        # stop tracking, keep the file on disk
      ```

      Two details trip people up. First, `git restore <file>` copies from the index, not from
      the last commit. If you staged a version, then edited again, restore gives you the
      staged version back. Second, it overwrites your uncommitted edits with no copy kept.
      Git can only give back what it stored, so anything never added or committed is gone.

      `--amend` builds a new commit from the current index and the previous commit's parent,
      then moves the branch to it. The old commit still exists for a while, and the next
      lesson shows how to find it. The hash changes:

      ```text
      $ git log --format=%h
      fe0dea2
      $ git commit -q --amend -m "Add pancake recipe with butter"
      $ git log --format=%h
      a341133
      ```

      That's harmless for a commit only you have. For a commit you've already shared, amending
      creates a second version of history that others have to reconcile. Shared mistakes are
      undone with a new commit instead, which the next lesson covers with `git revert`.

      Commit sizing follows from all this. A commit that does one thing, with a message that
      says what and why in the imperative ("Add butter to pancakes"), can be reviewed, reverted
      and searched on its own. The staging area exists so you can build commits like that.
  - title: How .gitignore patterns match
    body: |-
      Each line of `.gitignore` is a pattern, matched against paths relative to the folder
      that holds the file:

      ```text
      .env
      *.log
      !keep.log
      /build
      node_modules/
      ```

      - A plain name such as `.env` matches at any depth.
      - `*` matches anything except `/`, so `*.log` catches every log file.
      - A leading `!` re-includes something an earlier line excluded, here `keep.log`.
      - A leading `/` anchors the pattern to this folder: `/build` ignores the top-level
        `build` but not `src/build`.
      - A trailing `/` matches folders only.
      - Lines starting with `#` are comments.

      When a file is ignored and you don't know why, ask Git. `git check-ignore -v` prints the
      file and line that matched:

      ```text
      $ git check-ignore -v a.log build/app.js
      .gitignore:2:*.log      a.log
      .gitignore:4:/build     build/app.js
      ```

      Where rules live matters. `.gitignore` is committed and shared, so it's for the
      project's own junk: `node_modules/`, `dist/`, `.env`. Rules for your own machine, such as
      your editor's settings folder or `.DS_Store`, belong in a global ignore file set with
      `git config --global core.excludesFile ~/.gitignore_global`, or in `.git/info/exclude`
      for one repository only. Neither is shared.

      The rule that trips everyone: ignoring never applies to a file Git already tracks. Adding
      `.env` to `.gitignore` after committing it changes nothing. `git rm --cached .env`
      removes it from the index, the next commit records it as deleted, and from then on the
      ignore rule keeps it out.
pitfalls:
  - '**Editing after `git add` and expecting the edit in the commit.** The index holds the content from the moment you added it. Run `git diff --staged` before committing, and `git add` again after any late edit.'
  - '**Running `git add .` before `.gitignore` exists.** Secrets and `node_modules` land in the first commit. Write `.gitignore` first, then check `git status` before the first commit.'
  - '**Adding a tracked file to `.gitignore` and expecting it to vanish.** Ignore rules skip tracked files. Run `git rm --cached <file>`, commit, and keep the ignore line.'
  - '**Deleting a committed secret and calling it fixed.** Every earlier commit still contains it, and so does every clone. Revoke or rotate the key first, then decide whether to rewrite history.'
  - '**Discarding changes with `git restore` without looking.** It overwrites uncommitted edits and keeps no copy. Run `git diff <file>` first, or commit work in progress on a branch.'
  - '**Amending a commit you''ve already pushed.** The new hash forks history for everyone who pulled. Add a new commit instead, and keep `--amend` for commits only you have.'
verify:
  - lens: leaks
    check: '`.gitignore` lists `.env` and `node_modules/` before the first `git add`, so no secret or download enters a commit.'
  - lens: leaks
    check: 'A secret that reached a commit is replaced with a new one, because deleting the file leaves it in history.'
  - lens: confuses
    check: 'Each commit holds one change, with a message saying what changed, so a reader of `git log` can follow it.'
  - lens: tests
    check: '`git status` and `git diff --staged` are read before every commit, so you save exactly what you meant.'
interview:
  - question: What is a Git commit, technically?
    answer: >-
      A commit is an object that points at a snapshot of the whole project and at its parent
      commit. The snapshot is a tree object, a folder listing whose entries point at blobs
      for file contents and at sub-trees for folders. The commit adds the author, committer,
      timestamps and message. Every object is named by a hash of its content, so a commit's
      hash covers its tree and its parent's hash, and changing anything in the past changes
      every hash after it. Git stores snapshots rather than diffs and computes diffs on
      demand. It doesn't waste space, because unchanged files point at the same blob, and
      packfiles later compress similar objects as deltas. The trade-off is that large binary
      files that change often grow the repository quickly.
  - question: Why does Git have a staging area?
    answer: >-
      It separates "what I've changed" from "what goes into the next commit", so each commit
      can hold one coherent change. I might fix a bug and start a refactor in the same
      files. With the index I stage the bug fix, even individual blocks with `git add -p`,
      commit it with its own message, and keep the refactor for later. That makes history
      easier to review, bisect and revert. The index also makes `git status` meaningful: it
      compares the last commit with the index, and the index with the working tree. The cost
      is an extra concept, and a classic surprise: the index holds content from the moment of
      `git add`, so edits after that need to be added again.
  - question: You committed an API key and pushed it. What do you do?
    answer: >-
      Treat the key as compromised and revoke or rotate it first, before touching the
      repository. Anyone who cloned or fetched has it, forks and caches may have it, and
      automated scanners find leaked keys on public hosts within minutes. Then stop the leak
      continuing: `git rm --cached .env`, add it to `.gitignore`, move the new key to an
      environment variable or a secrets store, and commit. Rewriting history with a tool such
      as `git filter-repo` removes the file from old commits, but it changes every hash from
      that point and everyone must re-clone or reset, so it's worth doing for a private repo
      or a very sensitive value, and never a substitute for rotation.
  - question: What's the difference between `git diff`, `git diff --staged` and `git diff HEAD`?
    answer: >-
      They compare different pairs of the three trees. `git diff` compares the working tree
      with the index, so it shows edits you haven't staged yet. `git diff --staged` compares
      the index with the last commit, which is exactly what `git commit` will record right
      now. `git diff HEAD` compares the working tree with the last commit, staged and
      unstaged together. In practice I read `git diff --staged` before every commit, because
      it's the only one that shows precisely what I'm about to save. A common confusion is
      running plain `git diff` after `git add` and seeing nothing: the changes aren't gone,
      they've moved to the index.
