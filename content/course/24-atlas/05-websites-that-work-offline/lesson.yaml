deepDive: >-
  A real worker ran in Chromium over localhost, which counts as secure, against a Node server
  that logged every hit. With the page controlled, a cache-first logo made no server hits at
  all. Offline, the page showed the saved offline page, and a URL that was never cached
  failed with "Failed to fetch". The playground's worker is pretend so you can switch the
  signal off, and its decision is the same one a real handler makes.


  The update case is the one that bites. We changed `sw.js` without `skipWaiting`: the
  registration reported a worker waiting, and a reload didn't change that. A worker takes
  over only when every tab it controls is gone. `skipWaiting` plus `clients.claim` makes the
  new worker take the page at once, which most sites want.


  A service worker controls only its **scope**: the folder its script was served from, and
  everything below it. That's why `sw.js` usually sits at the site's root. The seven-day
  limit counts days of Safari use, not calendar days. A web app on the Home Screen keeps its
  own count, which resets each time it's opened.
