id: css.flexbox
title: Flexbox
objective: Build a nav bar, centre anything, and stop a long title pushing the rest off screen.
level: essential
minutes: 10
concepts: [css.flexbox, css.flex-axes, css.flex-sizing]
prerequisites: [css.display-and-flow]
opening:
  text: >-
    You'll build a nav bar, centre anything, and fix a long title that shoves its row off a
    phone. These are the layouts you'll write most weeks.

steps:
  - type: prose
    id: what-flex-does
    body: |-
      Blocks stack down the page. Often you want them side by side: a nav bar, a row of
      cards, a button next to a field.

      ```css
      .albums { display: flex; }
      ```

      That makes `.albums` a **flex container**. Its children, now called flex items, line up
      in a row. Only the direct children move. What's inside each one stays as it was.

  - type: playground
    id: line-up-the-albums
    concept: css.flexbox
    difficulty: 1
    prompt: >-
      The three albums stack down the page. Add `display: flex;` to `.albums` and watch them
      jump into a row.
    html: |
      <h2>New this week</h2>
      <div class="albums">
        <div class="album">Salt Road</div>
        <div class="album">Paper Suns</div>
        <div class="album">Northbound</div>
      </div>
    css: |
      body { font-family: sans-serif; }
      .albums { }
      .album {
        width: 96px;
        height: 96px;
        margin: 4px;
        padding: 8px;
        background: rebeccapurple;
        color: white;
      }
    editable: [css]
    checks:
      - label: The albums sit in a flex row
        selector: .albums
        style: { property: display, value: flex }
    solution:
      css: |
        body { font-family: sans-serif; }
        .albums { display: flex; }
        .album {
          width: 96px;
          height: 96px;
          margin: 4px;
          padding: 8px;
          background: rebeccapurple;
          color: white;
        }
    hints:
      - The declaration goes on the parent, `.albums`, not on each album.
      - It's the `display` property.
      - 'Write `.albums { display: flex; }`.'

  - type: prose
    id: spacing-and-alignment
    body: |-
      The direction the items run is the **main axis**. In a row, it goes left to right. Three
      properties on the container place the items:

      - `justify-content` spreads them along it: `flex-start`, `center`, `space-between`
      - `align-items` lines them up across it: `flex-start`, `center`, `stretch`
      - `gap: 16px` puts space between them, never at the ends

  - type: playground
    id: build-the-nav
    concept: css.flex-axes
    difficulty: 2
    prompt: >-
      On `.bar`, push the logo and the links to opposite ends with `justify-content:
      space-between`, and line them up with `align-items: center`. Then make `.links` a flex
      row with `gap: 16px`.
    html: |
      <nav class="bar">
        <a class="logo" href="#">Night Radio</a>
        <div class="links">
          <a href="#">Shows</a>
          <a href="#">Schedule</a>
          <a href="#">About</a>
        </div>
      </nav>
    css: |
      body { margin: 0; font-family: sans-serif; }
      .bar {
        display: flex;
        padding: 12px 16px;
        background: midnightblue;
      }
      .bar a { color: white; text-decoration: none; }
      .logo { font-size: 24px; font-weight: bold; }
      .links { }
    editable: [css]
    checks:
      - label: Logo and links sit at opposite ends
        selector: .bar
        style: { property: justify-content, value: space-between }
      - label: They line up in the middle
        selector: .bar
        style: { property: align-items, value: center }
      - label: The links form a flex row
        selector: .links
        style: { property: display, value: flex }
      - label: The links have a 16px gap
        selector: .links
        style: { property: gap, value: 16px }
    solution:
      css: |
        body { margin: 0; font-family: sans-serif; }
        .bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 12px 16px;
          background: midnightblue;
        }
        .bar a { color: white; text-decoration: none; }
        .logo { font-size: 24px; font-weight: bold; }
        .links { display: flex; gap: 16px; }
    hints:
      - The first two declarations go in `.bar`, the last two in `.links`.
      - '`.links` is a flex item of `.bar` and can be a flex container too.'
      - 'In `.links`, write `display: flex; gap: 16px;`.'

  - type: prose
    id: centre-anything
    body: |-
      `flex-direction: column` turns the main axis downwards. The items stack, and the two
      properties swap jobs: `justify-content` now works up and down, and `align-items` left
      and right.

      This is the classic way to centre anything in a box:

      ```css
      .box { display: flex; justify-content: center; align-items: center; }
      ```

  - type: playground
    id: centre-the-message
    concept: css.flex-axes
    difficulty: 2
    prompt: >-
      Centre the icon, the message and the button in the middle of the dashed box, stacked in
      a column. Use `display`, `flex-direction`, `justify-content` and `align-items` on
      `.empty`.
    html: |
      <div class="empty">
        <div class="icon"></div>
        <p>Your playlist is empty</p>
        <button>Browse shows</button>
      </div>
    css: |
      body { font-family: sans-serif; }
      .empty {
        height: 280px;
        border: 2px dashed mediumpurple;
      }
      .icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: mediumpurple;
      }
    editable: [css]
    checks:
      - label: The box is a flex container
        selector: .empty
        style: { property: display, value: flex }
      - label: The items run in a column
        selector: .empty
        style: { property: flex-direction, value: column }
      - label: They're centred top to bottom
        selector: .empty
        style: { property: justify-content, value: center }
      - label: They're centred side to side
        selector: .empty
        style: { property: align-items, value: center }
    solution:
      css: |
        body { font-family: sans-serif; }
        .empty {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 280px;
          border: 2px dashed mediumpurple;
        }
        .icon {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          background: mediumpurple;
        }
    hints:
      - All four declarations go in `.empty`.
      - In a column, `justify-content` works up and down.
      - '`center` is the value for both `justify-content` and `align-items`.'

  - type: prose
    id: flex-one-and-min-width
    body: >-
      `flex: 1` on an item says: take the spare space. Items with `flex: 1` share it equally,
      whatever widths they had. `flex: none` keeps an item at its own size.


      One catch: a flex item won't shrink narrower than its content. Text that can't wrap
      holds it wide open and pushes its neighbours out. `min-width: 0` removes that floor.

  - type: predict-output
    id: predict-flex-one-ignores-width
    concept: css.flex-sizing
    difficulty: 3
    language: html
    code: |
      <style>
        .row { display: flex; width: 600px; }
        .title { width: 100px; flex: 1; }
        .length { width: 200px; flex: 1; }
      </style>
      <div class="row">
        <div class="title"></div>
        <div class="length"></div>
      </div>
    question: "Both items set a different `width`, and both have `flex: 1`. How wide do they end up?"
    choices:
      - text: The same width, sharing the row equally
        correct: true
        feedback: >-
          Right. `flex: 1` shares the row equally, so the widths are ignored.
      - text: Their own widths, plus an equal share of the rest
        feedback: >-
          A common guess. `flex: 1` ignores the widths and shares the whole row.
      - text: Their own widths, with space left over
        feedback: >-
          With `flex: 1` the items grow into the spare space, so they fill the row.

  - type: playground
    id: fix-the-track-row
    concept: css.flex-sizing
    difficulty: 3
    prompt: >-
      On this 280px phone, the long title shoves 4:05 out of the row. Give `.info` `flex: 1;`
      to take the spare space, then `min-width: 0;` so it can shrink. Watch the ellipsis
      appear.
    html: |
      <div class="phone">
        <div class="track">
          <div class="info">
            <div class="title">Harbour Lights, Recorded Live at the Old Town Hall</div>
            <div class="artist">The Tidewater Band</div>
          </div>
          <span class="length">4:05</span>
        </div>
      </div>
    css: |
      body { font-family: sans-serif; }
      .phone { width: 280px; border: 2px solid black; }
      .track { display: flex; gap: 8px; padding: 8px; }
      .info { }
      .title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .artist { color: dimgrey; }
      .length { flex: none; }
    editable: [css]
    checks:
      - label: The info takes the spare space
        selector: .info
        style: { property: flex-grow, value: '1' }
      - label: The info can shrink below its content
        selector: .info
        style: { property: min-width, value: 0px }
    solution:
      css: |
        body { font-family: sans-serif; }
        .phone { width: 280px; border: 2px solid black; }
        .track { display: flex; gap: 8px; padding: 8px; }
        .info { flex: 1; min-width: 0; }
        .title {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .artist { color: dimgrey; }
        .length { flex: none; }
    hints:
      - The title's own rule is fine. The flex item is `.info`.
      - A flex item's floor is its content, and `nowrap` makes that the whole title.
      - 'Write `.info { flex: 1; min-width: 0; }`.'

  - type: explain-back
    id: explain-name-overflow
    concept: css.flexbox
    difficulty: 4
    prompt: >-
      The title is set to end in an ellipsis. So why does it still push 4:05 off the phone
      until `.info` gets `min-width: 0`?
    rubric:
      - A flex item won't shrink narrower than its content unless told to.
      - The title can't wrap, so the content of `.info` is the whole long line.
      - '`min-width: 0` removes the floor, so `.info` shrinks and the ellipsis shows.'
    modelAnswer: >-
      `.info` is the flex item, and a flex item won't shrink below its content. Its content is
      a title that can't wrap, so its floor is the whole line. It stays that wide and pushes
      4:05 out. `min-width: 0` removes the floor. `.info` shrinks to the space left, and the
      title's ellipsis finally has something to cut.

recap:
  - 'Line children up in a row with `display: flex`, and space them with `gap`.'
  - Push, align and centre items with `justify-content` and `align-items`.
  - 'Let items grow with `flex: 1`, and shrink them past their content with `min-width: 0`.'

recall:
  - id: card-column-axes
    concept: css.flex-axes
    front: In a column, which property centres items across the container?
    back: >-
      `align-items`. The main axis runs down, so `justify-content` follows it and `align-items`
      goes across.
  - id: card-centre-recipe
    concept: css.flex-axes
    front: Which three declarations centre a box's contents both ways?
    back: >-
      `display: flex`, `justify-content: center` and `align-items: center`, all on the
      container.
  - id: card-flex-one
    concept: css.flex-sizing
    front: 'Two items have different widths and `flex: 1`. How wide are they?'
    back: >-
      The same. `flex: 1` shares the row equally and ignores their widths.
  - id: card-min-width-auto
    concept: css.flexbox
    front: Why does a flex item refuse to shrink below its text?
    back: >-
      A flex item won't go narrower than its content. `min-width: 0` removes that floor.

references:
  - kind: spec
    title: CSS Flexible Box Layout Module Level 1
    authors: Elika J. Etemad, Tab Atkins Jr., Rossen Atanassov
    venue: W3C
