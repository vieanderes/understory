term: model routing
aka: [model router, LLM routing, model cascade]
short: Sending each request to the cheapest model likely to handle it, and escalating when it can't.
explain: |
  Most requests are routine. A small model answers them well, faster and for a fraction of the
  price. A router picks the model per request, by a rule or a classifier.

  Measure cost per finished task, not per call. If the small model fails and the request
  escalates, you've paid twice and waited longer. Route on evidence from your evals, not
  on a guess about which questions are simple.
analogy: A hospital triage nurse. Grazes go to the nurse practitioner, chest pains go straight to the doctor.
usage: Model routing cut the bill by half, but escalations doubled latency on the long questions.
related: [fallback, eval, token, latency]
level: 3
lessons: [aisys.cost-and-latency]
