term: Git
aka:
  - version control
  - source control
short: A program that records snapshots of a project's files so you can compare, undo and combine changes.
explain: |
  You've broken something that worked an hour ago, and you can't remember what you
  changed. Or two people edited the same file. Without a history, both are a nightmare.

  This tool keeps that history in a hidden `.git` folder on your own machine: every saved
  snapshot, who made it and why. It works offline and needs no website. Branches let you
  try ideas side by side, and merging brings them back together. Most of its scary errors
  mean one thing: it won't throw away work without asking.
analogy: Save points in a video game. Try the risky jump; if it goes wrong, load the last save.
example:
  language: bash
  code: |
    $ git init
    $ git add notes.md
    $ git commit -m "Add meeting notes"
    $ git log --oneline
    3f2a1c9 Add meeting notes
usage: Git has the old version; check the history before you rewrite it from memory.
twin:
  term: repository-host
  difference: Git is the tool on your machine that keeps the history. A repository host is a website that stores a copy of that history online and adds pull requests, reviews and CI around it.
related:
  - commit
  - branch
  - repository-host
level: 1
lessons:
