deepDive: >-
  Most phones pack 2 or 3 screen pixels into each CSS pixel. That's the device pixel ratio.
  A 400-pixel slot on a ratio 2 phone needs an 800-pixel file to look sharp, and the browser
  does that sum when it picks from `srcset`.


  The browser picks a file while it reads the HTML, before CSS has worked out any sizes. So
  when an image isn't full width, add `sizes` to say how wide it will be drawn, for example
  `sizes="(min-width: 800px) 50vw, 100vw"`. Without it, the browser assumes the whole
  window.


  The standard leaves the final choice to the browser. It may prefer a file it already has
  cached, so test with an empty cache.


  `picture` wraps `source` elements and an `img`. It can offer a newer file format, or a
  different crop for narrow screens. The `img` is always what's drawn, so `alt`, `width` and
  `height` belong on it.


  `meta charset="utf-8"` tells the browser how to turn bytes into letters. Put it first in
  `head`: the standard requires it within the first 1024 bytes. The `head` can also link a
  tab icon, with `<link rel="icon" href="/icon.svg">`.
