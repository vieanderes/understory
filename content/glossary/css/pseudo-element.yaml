term: pseudo-element
aka:
  - pseudo element
  - "::before"
  - "::after"
short: A selector after a double colon that styles a part of an element, or content CSS adds.
explain: |
  You want a small arrow after every external link. Or a different colour for an input's placeholder text. There's no element there to style.

  Two colons reach those parts. `::before` and `::after` insert generated content, and
  need a `content` property to appear. `::placeholder`, `::marker` and `::selection`
  style built-in parts. Generated text is decoration: screen readers may skip it, so
  never put meaning only there.
analogy: The drop cap at the start of a chapter. It's part of the first word, yet the printer styles it on its own.
example:
  language: css
  code: |
    .external::after {
      content: " ↗";
    }
    input::placeholder { color: grey; }
    li::marker { color: teal; }
usage: The arrow comes from an ::after rule, so you won't find it in the HTML.
twin:
  term: pseudo-class
  difference: A pseudo-element creates or targets a part of an element and uses two colons. A pseudo-class selects a whole element by its state and uses one.
related:
  - pseudo-class
level: 2
lessons:
  - css.cascade
