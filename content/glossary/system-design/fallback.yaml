term: fallback
aka: [fallback model, fallback path, fallbacks]
short: A planned, smaller way to still help when the main path fails.
explain: |
  Dependencies fail. When the main model is overloaded, you can show an error, or you can
  do something less good that still helps: a smaller model, a cached answer, plain search
  results.

  Decide each fallback before launch, and run your evals on it. Trigger it only for errors
  a different path can fix, such as overloads, timeouts and rate limits. A fallback that
  catches every error turns your own bugs into quiet, wrong answers.
analogy: The bus replacement service when the trains stop. Slower, still gets you home.
usage: If the primary model times out twice, the fallback is the small model with a shorter prompt.
twin:
  term: retry
  difference: A retry tries the same thing again. A fallback does something different and usually lesser.
related: [circuit-breaker, retry, graceful-degradation, transient-error]
level: 2
lessons: [ai.failures, aisys.demo-to-system, aisys.cost-and-latency, agents.when-a-part-fails]
