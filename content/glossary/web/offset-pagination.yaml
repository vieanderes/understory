term: offset pagination
aka: [offset-based pagination, page-number pagination, LIMIT and OFFSET]
short: Fetching a long list in pages by saying how many records to skip and how many to take.
explain: |
  An API won't return a million records in one reply. You ask for them a page at a time:
  skip 0 take 100, skip 100 take 100, and so on.

  It's simple and lets you jump to page 50. But if records are added or deleted while you
  page, everything shifts: you skip some and see others twice. And the database still
  walks past every skipped row, so deep pages get slow. For syncing, use a cursor instead.
analogy: Reading a book by counting pages from the front each time, while someone tears pages out.
example:
  language: http
  code: |
    GET /v1/orders?limit=100&offset=200 HTTP/1.1
usage: Offset pagination skipped forty orders, because new ones arrived at the top while we paged.
twin:
  term: cursor-pagination
  difference: Offset pagination counts how many records to skip, so inserts and deletes shift the pages. Cursor pagination starts after the last record you saw, so the pages stay stable.
related: [cursor-pagination, query-string, index]
level: 2
lessons: [integrations.paging-through]
