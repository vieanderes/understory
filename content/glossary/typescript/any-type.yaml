term: any type
aka:
  - any
short: A type that switches the checker off for a value, so every use of it is allowed.
explain: |
  `any` says "trust me". You can call any method on it, pass it anywhere, and nothing is
  checked. Mistakes reach your users instead of your editor.

  Worse, it spreads. Anything computed from an `any` is `any` too. Reach for `unknown` when
  you don't know a type yet, and turn on `noImplicitAny` so it never creeps in unasked.
analogy: A master key handed to a stranger. Every door opens, and you no longer know who went where.
example:
  language: ts
  code: |
    const data: any = JSON.parse(text);
    data.user.name.toUpperCase(); // no error, may crash
usage: Replace that any with unknown and parse the response, or a bad field crashes the page.
twin:
  term: unknown-type
  difference: '`any` lets you do anything with a value, unchecked. `unknown` lets you do nothing until you prove what it is, so it is the safe one.'
related:
  - unknown-type
  - type-assertion
level: 1
lessons:
  - ts.typing-the-boundary
  - ts.strictness
