id: token-bucket-gate
title: TokenBucketGate
topic: reliability
difficulty: easy
type: coding
recommendedMinutes: 15
signature:
  params:
    - { name: C, type: int }
    - { name: R, type: int }
    - { name: T, type: "int[]" }
  returns: "int[]"
statement: |-
  A service sits behind a rate limiter that uses a token bucket. The bucket holds at most C
  tokens and is full when the first request arrives. Every second, R new tokens are added,
  but the bucket never holds more than C. Each request takes one token. A request that finds
  the bucket empty is rejected and takes nothing.

  Request K arrives at second T[K]. The times never decrease, and several requests can
  arrive in the same second: they are handled in array order. The tokens for a second are
  added before any request of that second is handled.

  Write a function:

  {{signature}}

  that, given integers C and R and an array T of N integers, returns an array of N integers:
  1 if request K is accepted and 0 if it is rejected.

  For example, given C = 2, R = 1 and T = [0, 0, 0, 1, 1, 3], the function should return
  [1, 1, 0, 1, 0, 1]. The first two requests empty the bucket, so the third is rejected. At
  second 1 one token arrives, so one of the two requests gets through. By second 3 two
  tokens have arrived.

  Given C = 3, R = 0 and T = [5, 6, 7, 8], the function should return [1, 1, 1, 0], because
  the bucket never refills.

  Assume that:

  - N is an integer within the range [1..1,000];
  - C is an integer within the range [1..1,000];
  - R is an integer within the range [0..1,000];
  - each element of array T is an integer within the range [0..1,000,000,000];
  - array T is sorted in non-decreasing order.

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [2, 1, [0, 0, 0, 1, 1, 3]], expected: [1, 1, 0, 1, 0, 1] }
  - { args: [3, 0, [5, 6, 7, 8]], expected: [1, 1, 1, 0] }
tests:
  - name: extreme_single
    description: one request
    group: correctness
    cases:
      - { args: [1, 0, [0]], expected: [1] }
      - { args: [5, 5, [1000000000]], expected: [1] }
  - name: no_refill
    description: R = 0, the bucket only empties
    group: correctness
    cases:
      - { args: [2, 0, [0, 10, 20, 30]], expected: [1, 1, 0, 0] }
      - { args: [1, 0, [3, 3]], expected: [1, 0] }
  - name: burst_same_second
    description: many requests in one second
    group: correctness
    cases:
      - { args: [3, 10, [7, 7, 7, 7, 7]], expected: [1, 1, 1, 0, 0] }
      - { args: [2, 1, [0, 0, 1, 1, 1, 2]] }
  - name: refill_capped
    description: a long gap refills only up to C
    group: correctness
    cases:
      - { args: [2, 1, [0, 0, 100, 100, 100]], expected: [1, 1, 1, 1, 0] }
      - { args: [1000, 1000, [0, 1000000000]] }
  - name: steady_rate
    description: requests at exactly the refill rate
    group: correctness
    cases:
      - { args: [1, 1, [0, 1, 2, 3, 4]], expected: [1, 1, 1, 1, 1] }
      - { args: [1, 2, [0, 0, 1, 1, 2, 2]], expected: [1, 0, 1, 0, 1, 0] }
  - name: small_random
    description: random times, N = 60
    group: correctness
    cases:
      - generate: { seed: 2101, args: [{ kind: value, value: 4 }, { kind: value, value: 1 }, { kind: sorted, n: 60, min: 0, max: 40 }] }
      - generate: { seed: 2102, args: [{ kind: value, value: 10 }, { kind: value, value: 3 }, { kind: sorted, n: 60, min: 0, max: 15 }] }
  - name: medium_random
    description: random times, N = 1,000
    group: correctness
    cases:
      - generate: { seed: 2103, args: [{ kind: value, value: 50 }, { kind: value, value: 7 }, { kind: sorted, n: 1000, min: 0, max: 1000 }] }
