id: js.fetch-cancellation
title: Fetching data
objective: "Load data with `fetch`, show it on the page, send JSON, and cancel requests you no longer need."
level: essential
minutes: 10
concepts: [js.fetch, js.sending-data, js.cancellation]
prerequisites: [js.requests-and-responses, js.promises]
opening:
  text: >-
    You'll load data from a server, put it on the page and send new data back. It's how a page
    stops being a poster and starts being an app.

steps:
  - type: prose
    id: what-fetch-promises
    body: |-
      `fetch(url)` sends a `GET` request and returns a promise for the **response**:

      ```js
      const response = await fetch("/books/12");
      console.log(response.status, response.ok); // 200 true
      const book = await response.json();
      ```

      `ok` is `true` for a 2xx status. `json()` reads the body and parses it. The promise
      fulfils whenever an answer arrives, even a 404. It rejects only when no answer comes back.

  - type: predict-output
    id: predict-404-resolves
    concept: js.fetch
    difficulty: 1
    language: js
    code: |
      try {
        const response = await fetch("/books/99");
        console.log("answered", response.status, response.ok);
      } catch (error) {
        console.log("failed", error.name);
      }
    question: There's no book 99, so the server answers `404`. What does this log?
    choices:
      - text: '`answered 404 false`'
        correct: true
        feedback: >-
          Yes. A 404 is still an answer, so the promise fulfils.
      - text: '`failed Error`'
        feedback: >-
          Some libraries reject on an error status. `fetch` only rejects when no answer arrives
          at all.
      - text: '`failed TypeError`'
        feedback: >-
          That's what a lost connection gives you. Here the server did answer.
      - text: '`answered 404 true`'
        feedback: >-
          It does fulfil. But `ok` checks for a 2xx status, and 404 isn't one.

  - type: playground
    id: show-the-menu
    concept: js.fetch
    difficulty: 2
    prompt: >-
      A café page fetches its menu from a stand-in server. Read the body as JSON, then add an
      `li` to the list for each dish. Watch the menu appear.
    html: |
      <h2>Menu</h2>
      <ul id="menu"></ul>
      <p id="specials"></p>
      <script>
        // A stand-in server, because this page can't reach the internet.
        async function fetch(url) {
          if (url === "/menu") {
            return { ok: true, status: 200, json: async () => ["Soup", "Pie", "Salad"] };
          }
          return { ok: false, status: 404, json: async () => ({ error: "Not found" }) };
        }
      </script>
    js: |
      const menu = document.querySelector("#menu");

      async function showMenu() {
        const response = await fetch("/menu");
        // Read the body as JSON, then add an li for each dish.
      }
      showMenu();
    editable: [js]
    showTree: true
    checks:
      - label: The menu lists three dishes
        selector: '#menu li'
        count: 3
      - label: Soup comes first
        selector: '#menu li:first-child'
        text: Soup
    solution:
      js: |
        const menu = document.querySelector("#menu");

        async function showMenu() {
          const response = await fetch("/menu");
          const dishes = await response.json();
          for (const dish of dishes) {
            const item = document.createElement("li");
            item.textContent = dish;
            menu.append(item);
          }
        }
        showMenu();
    hints:
      - '`await response.json()` gives you the array of dishes.'
      - Loop over the dishes with `for...of`.
      - For each one, `document.createElement("li")`, set its `textContent`, then `menu.append` it.

  - type: playground
    id: handle-not-found
    concept: js.fetch
    difficulty: 3
    prompt: >-
      The café has no specials today, so the server answers 404. The page shows "Today: [object
      Object]". Check `response.ok`, and show "No specials today" instead.
    html: |
      <h2>Specials</h2>
      <p id="specials"></p>
      <script>
        // A stand-in server, because this page can't reach the internet.
        async function fetch(url) {
          if (url === "/menu") {
            return { ok: true, status: 200, json: async () => ["Soup", "Pie", "Salad"] };
          }
          return { ok: false, status: 404, json: async () => ({ error: "Not found" }) };
        }
      </script>
    js: |
      const specials = document.querySelector("#specials");

      async function showSpecials() {
        const response = await fetch("/specials");
        const dishes = await response.json();
        specials.textContent = "Today: " + dishes;
      }
      showSpecials();
    editable: [js]
    checks:
      - label: The page says No specials today
        selector: '#specials'
        text: No specials today
    solution:
      js: |
        const specials = document.querySelector("#specials");

        async function showSpecials() {
          const response = await fetch("/specials");
          if (!response.ok) {
            specials.textContent = "No specials today";
            return;
          }
          const dishes = await response.json();
          specials.textContent = "Today: " + dishes.join(", ");
        }
        showSpecials();
    hints:
      - The 404 body is an object with an `error`, not a list of dishes.
      - Check `response.ok` before you read the body.
      - If it's `false`, set the text and `return` early.

  - type: prose
    id: sending-data
    body: |-
      To send data, pass a second argument with the method, a header and a body:

      ```js
      const response = await fetch("/reviews", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ book: 12, stars: 5 }),
      });
      ```

      The body travels as text, so `JSON.stringify` turns the object into JSON. The
      `Content-Type` header tells the server it's JSON.

  - type: bug-hunt
    id: hunt-object-body
    concept: js.sending-data
    difficulty: 3
    language: js
    code: |
      async function saveRecipe(recipe) {
        const response = await fetch("/recipes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: recipe,
        });
        return response.ok;
      }
      saveRecipe({ title: "Pancakes", serves: 4 });
    prompt: >-
      The server replies 400 and says it received `[object Object]`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: The object isn't turned into JSON text
        correct: true
        feedback: >-
          Right. A body must be text, so the object became `[object Object]`.
      - text: A `POST` can't carry a body
        feedback: >-
          Carrying a body is what `POST` is for. The trouble is what this body holds.
      - text: The header should be `text/plain`
        feedback: >-
          The header is right for JSON. The body isn't JSON yet. `JSON.stringify(recipe)`
          fixes it.
    fix: |
      body: JSON.stringify(recipe),

  - type: prose
    id: signal-and-controller
    body: |-
      A search box fetches on every key press. Answers can come back in any order, so an old
      answer may land last. Cancel the request you no longer need:

      ```js
      const controller = new AbortController();
      fetch("/search?q=tea", { signal: controller.signal });
      controller.abort(); // that fetch rejects with an AbortError
      ```

      `AbortSignal.timeout(5000)` is a signal that aborts on its own after five seconds. It
      gives a slow call, like one to an AI model, a deadline.

  - type: ai-review
    id: review-search-race
    concept: js.cancellation
    difficulty: 3
    language: js
    request: Search the library as the user types, and cancel the previous request each time.
    flawClass: race
    code: |
      let controller = null;
      input.addEventListener("input", async () => {
        if (controller) controller.abort();
        const current = new AbortController();
        const url = "/search?q=" + encodeURIComponent(input.value);
        try {
          const response = await fetch(url, { signal: current.signal });
          showResults(await response.json());
        } catch (error) {
          if (error.name !== "AbortError") throw error;
        }
      });
    prompt: >-
      This looked fine on a fast laptop. On slow wifi, typing `emma` shows the results for `em`.
      Tap the line at fault.
    lines: [4]
    reasons:
      - text: The new controller is never stored in `controller`
        correct: true
        feedback: >-
          Exactly. Nothing is ever aborted, so the slowest answer wins.
      - text: '`abort()` also cancels the request about to start'
        feedback: >-
          A new request gets a new signal. Aborting the old controller can't touch it.
      - text: Answers always arrive in the order they were sent
        feedback: >-
          Nothing guarantees that. A short query can match more books and take the server
          longer.
      - text: The `catch` hides the newer results
        feedback: >-
          Ignoring an `AbortError` is right, since the code asked for it. Here no abort ever
          happens.
    fix: |
      controller = new AbortController();
      // and pass controller.signal to fetch

  - type: code-challenge
    id: write-send-json
    concept: js.sending-data
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `sendJson(url, data)`. It sends `data` to `url` in a `POST` request, as JSON, with a
      `Content-Type` header of `application/json`. It returns the parsed JSON the server sends
      back.


      If the response isn't ok, throw an `Error` whose message includes the status code.


      Example: `await sendJson("/reviews", { stars: 5 })` sends the body `{"stars":5}` and
      returns the server's reply.
    hints:
      - The starter sends the object itself and never looks at the status.
      - '`JSON.stringify(data)` makes the body. The header goes in `headers`.'
      - After the `await fetch(...)`, check `response.ok` before `return response.json();`.

  - type: explain-back
    id: explain-404-no-catch
    concept: js.fetch
    difficulty: 3
    prompt: |-
      ```js
      try {
        const response = await fetch("/playlists/7");
        const playlist = await response.json();
        title.textContent = playlist.name;
      } catch (error) {
        title.textContent = "Playlist not found";
      }
      ```

      Playlist 7 was deleted. The heading shows "undefined". Why didn't the `catch` run?
    rubric:
      - A 404 is an answer, so the promise from `fetch` fulfils instead of rejecting.
      - The error body parses fine, and it has no `name`, so the heading gets `undefined`.
      - Check `response.ok` and handle the failure before reading the body.
    modelAnswer: >-
      `fetch` only rejects when no answer arrives. The server did answer, with a 404, so nothing
      was thrown. The 404 body is valid JSON too, only without a `name`, so the heading shows
      `undefined`. The fix is to check `response.ok` first and show the message when it's
      `false`.

recap:
  - Fetch JSON, check `response.ok`, and put the data on the page.
  - Send an object as JSON with `POST`, a `Content-Type` header and `JSON.stringify`.
  - Cancel a request you no longer need with an `AbortController`.

recall:
  - id: card-fetch-rejects
    concept: js.fetch
    front: When does the promise from `fetch` reject, and what happens on a 404?
    back: >-
      It rejects when no answer arrives or the request is aborted. A 404 fulfils, with
      `response.ok` set to `false`.
  - id: card-check-ok
    concept: js.fetch
    front: What should your code do before it reads a response's body?
    back: >-
      Check `response.ok`. A 404 or 500 still arrives with a body, often an error object.
  - id: card-post-json
    concept: js.sending-data
    front: What three options does a `fetch` need to send an object as JSON?
    back: >-
      `method: "POST"`, `headers: { "Content-Type": "application/json" }` and
      `body: JSON.stringify(data)`.
  - id: card-abort-previous
    concept: js.cancellation
    front: How do you stop an old search answer from replacing a newer one?
    back: >-
      Keep the last `AbortController`, call `abort()` on it before each new request, and pass the
      new controller's `signal` to `fetch`.
  - id: card-timeout-signal
    concept: js.cancellation
    front: How do you give a request a five-second deadline?
    back: >-
      Pass `signal: AbortSignal.timeout(5000)`. If it runs out, the fetch rejects with a
      `TimeoutError`.

