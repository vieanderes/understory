id: tooling.working-with-ai
title: Working with AI without losing skill
objective: Apply generation-then-comprehension, and decide what to delegate.
level: essential
minutes: 10
concepts: [tooling.ai-comprehension, tooling.ai-delegation]
prerequisites: [tooling.node]
opening:
  text: >-
    You'll learn a simple habit that lets you use an AI assistant and still get better at
    coding. Skip it, and the assistant can quietly do your learning for you.

steps:
  - type: predict-output
    id: predict-cheapest
    concept: tooling.ai-comprehension
    difficulty: 1
    language: js
    code: |
      // Written by an assistant. Its one test, [30, 45, 12], returned 12.
      function cheapestPrice(prices) {
        return prices.sort()[0];
      }
      console.log(cheapestPrice([45, 120, 8]));
    question: Read line 3 first. What does line 5 log?
    choices:
      - text: '`120`'
        correct: true
        feedback: >-
          Well spotted. `sort()` compares as text, and `"120"` comes before `"45"`.
      - text: '`8`'
        feedback: >-
          That's what the name promises. But plain `sort()` orders items as text, so `"120"`
          wins.
      - text: '`45`'
        feedback: >-
          `sort()` does reorder the array, in place. In text order, `"120"` comes first.

  - type: prose
    id: the-study
    body: >-
      That test passed, and the bug was still there. Only reading caught it.


      In one careful experiment, engineers learnt a new library. Half used an AI assistant. On a
      quiz afterwards, the AI group scored clearly lower, and weren't really faster. The
      biggest gap was in debugging, the skill you need to check an assistant's work.


      Lowest of all: people who pasted each error back and asked for a fix.

  - type: prose
    id: the-protocol
    body: |-
      The people who scored well still used the assistant. They also kept thinking about the
      code. Turn that into a habit, **generation-then-comprehension**:

      1. Say what the code must do.
      2. Read it, line by line.
      3. Predict the result of one test.
      4. Only then run it.

      A wrong prediction points at the exact line you didn't understand.

  - type: parsons
    id: arrange-protocol
    concept: tooling.ai-comprehension
    difficulty: 2
    language: js
    prompt: You're handed `cheapestPrice`. Put your notes in the order of the habit. One block doesn't belong.
    blocks:
      - id: state
        code: '// Must: return the lowest number in the list.'
        subgoal: Say what it must do
      - id: read
        code: '// Read: sort() has no compare function, so it sorts as text.'
        subgoal: Read it
      - id: predict
        code: 'const predicted = 120; // for [45, 120, 8]'
        subgoal: Predict one test
      - id: run
        code: const actual = cheapestPrice([45, 120, 8]);
        subgoal: Run it
      - id: compare
        code: console.log(actual === predicted);
        subgoal: Compare
    distractors:
      - id: predict-by-running
        code: const predicted = cheapestPrice([45, 120, 8]);
        feedback: >-
          That's a run dressed up as a prediction. It tests the code against itself.

  - type: ai-review
    id: review-weakened-check
    concept: tooling.ai-comprehension
    difficulty: 2
    language: js
    request: The price check prints false. Make it pass.
    flawClass: logic
    code: |
      // check.js, after the assistant's edit
      function cheapestPrice(prices) {
        return prices.sort()[0];
      }

      console.log(cheapestPrice([45, 120, 8]) === 120);
    prompt: >-
      The check used to end in `=== 8`. The assistant says "Fixed, it prints true now". Tap
      the line it made worse.
    lines: [6]
    reasons:
      - text: It changed the check to agree with the bug
        correct: true
        feedback: >-
          Yes. Now the check protects the bug. Always read the whole change.
      - text: '`===` should be `==`'
        feedback: >-
          Both compare two numbers the same way. The trouble is the number: 120 isn't the
          cheapest.
      - text: It should log the price, not true or false
        feedback: >-
          A true or false check is fine. This one expects the wrong answer now.
    fix: |
      // check.js
      function cheapestPrice(prices) {
        return prices.toSorted((a, b) => a - b)[0];
      }

      console.log(cheapestPrice([45, 120, 8]) === 8);

  - type: prose
    id: what-to-delegate
    body: >-
      Handing work to an assistant isn't the problem. Handing it over unchecked is.


      Ask two questions. Can you check the result, with a test or a careful read? And can you
      afford to skip the practice? Forty rows of sample data pass both. The async code you're
      learning this month fails the second.


      One more thing: feeling sure about code is not a check.

  - type: multiple-choice
    id: pick-delegation
    concept: tooling.ai-delegation
    difficulty: 3
    question: You're learning async JavaScript this month. Which task do you hand to the assistant whole?
    choices:
      - text: Forty rows of test data, checked by your script
        correct: true
        feedback: >-
          Yes. You can check every row, and typing data isn't practice you need.
      - text: The retry logic, since async is where you're slowest
        feedback: >-
          Being slow at it is the sign you need the practice. And you can't check it yet.
      - text: The refund maths, since the answer looked right
        feedback: >-
          Looking right isn't a check. A test or a traced read is.

  - type: ai-review
    id: review-invented-method
    concept: tooling.ai-comprehension
    difficulty: 3
    language: js
    request: Fix cheapestPrice, and leave the check alone this time.
    flawClass: hallucinated-api
    code: |
      function cheapestPrice(prices) {
        if (prices.length === 0) return undefined;
        return prices.min();
      }

      console.log(cheapestPrice([45, 120, 8]) === 8);
    prompt: >-
      The third try. The assistant says "Tested, it prints true". First say what the function
      must return. Then tap the line at fault.
    lines: [3]
    reasons:
      - text: Arrays have no `min` method
        correct: true
        feedback: >-
          Right. It sounds real, so the assistant made it up. Node throws `prices.min is not a
          function`.
      - text: An empty list should return `0`
        feedback: >-
          `undefined` is a fair answer for no prices. Line 3 crashes on every other list.
      - text: '`min()` reorders the array, like `sort()`'
        feedback: >-
          There's no `min` to reorder anything. Arrays don't have one, so line 3 throws.
    verify:
      question: The assistant said "Tested". What would have shown that was false?
      choices:
        - text: Running line 5 yourself, once
          correct: true
          feedback: >-
            Yes. One run throws the error the assistant never saw.
        - text: Asking the assistant if it's sure
          feedback: >-
            It already said "Tested". Feeling sure, yours or its, isn't a check.
        - text: Reading its explanation of the fix
          feedback: >-
            An explanation describes the code it meant to write. Only a run shows what this code does.
    fix: |
      function cheapestPrice(prices) {
        if (prices.length === 0) return undefined;
        return prices.toSorted((a, b) => a - b)[0];
      }

      console.log(cheapestPrice([45, 120, 8]) === 8);

  - type: code-challenge
    id: change-order-price
    concept: tooling.ai-comprehension
    difficulty: 4
    language: ts
    prompt: >-
      Code from an assistant is really yours once you can change it. The starter holds an
      assistant's `orderPrice(items, promoPercent)`. Read it, then change it for the new rules.
      No assistant here.


      - Orders of 5 or more items get 10% off the subtotal.

      - Discounts don't stack. The larger percentage wins.

      - An empty order costs `0`, with no delivery fee.


      Round the discount to a whole penny. Every other order pays the 250 pence fee. Example:
      five items of 1500 pence with a promo of 5 cost `7000`.
    hints:
      - >-
        Look at where the starter picks the percentage. The new rule has two sources and needs
        one winner.
      - >-
        The group percentage depends on `items.length`. `Math.max` picks the larger of two
        numbers. Work out the discount once, after the loop.
      - >-
        Start with `if (items.length === 0) return 0;`. After the loop, set `let percent =
        promoPercent;` and raise it to 10 when there are 5 or more items and it's lower.

  - type: explain-back
    id: explain-skill-loss
    concept: tooling.ai-delegation
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      In the study, the group who used an AI assistant learnt less. Why, and how does
      predicting a test protect you?
    rubric:
      - Finishing a task and understanding it are different, and delegation gives only the first.
      - Understanding comes from reading, tracing and fixing errors, which they handed over.
      - A prediction needs a model of the code, and a wrong one shows the line you missed.
    modelAnswer: >-
      Both groups got the work done, but the quiz measured understanding. People who handed
      over the writing and debugging skipped the effort that builds it. A prediction puts that
      effort back. You can't predict a result without a picture of the code. A wrong guess shows
      exactly where that picture is off.

recap:
  - "Generate code, then make sure you understand it."
  - "Decide whether a task is safe to hand over."
  - "Test what an assistant wrote before you trust it."
recall:
  - id: card-protocol-steps
    concept: tooling.ai-comprehension
    front: What are the four steps of generation-then-comprehension?
    back: >-
      Say what the code must do, read it, predict one test, and only then run it.
  - id: card-predict-first
    concept: tooling.ai-comprehension
    front: Why predict the result of one test before you run an assistant's code?
    back: >-
      A prediction needs a picture of the code. A wrong one points at the line you didn't
      understand.
  - id: card-delegation-test
    concept: tooling.ai-delegation
    front: Which two questions decide whether to hand a task to an assistant?
    back: >-
      Can you check the result? Can you afford to skip the practice?
  - id: card-passing-test
    concept: tooling.ai-comprehension
    front: Why did `prices.sort()[0]` pass its test but return 120?
    back: >-
      Plain `sort()` orders items as text. The test's numbers happened to sort the same way as
      text.
  - id: card-invented-method
    concept: tooling.ai-comprehension
    front: An assistant's code calls a method that sounds right. What do you check first?
    back: >-
      That it exists. Assistants invent likely names, like `prices.min()`. Run it or look it
      up.

references:
  - kind: paper
    title: How AI Impacts Skill Formation
    authors: Shen, J. H. and Tamkin, A.
    year: 2026
    venue: arXiv 2601.20245
    url: https://arxiv.org/abs/2601.20245
    note: The randomised experiment behind this lesson, with the six interaction patterns and their scores.
    primary: true
    verified: true
  - kind: paper
    title: Do Users Write More Insecure Code with AI Assistants?
    authors: Perry, N., Srivastava, M., Kumar, D. and Boneh, D.
    year: 2023
    venue: "CCS '23: ACM SIGSAC Conference on Computer and Communications Security"
    url: https://dl.acm.org/doi/10.1145/3576915.3623157
    note: Participants with an assistant wrote less secure code and believed it was more secure.
    primary: true
    verified: true
  - kind: essay
    title: How AI assistance impacts the formation of coding skills
    venue: Anthropic
    url: https://www.anthropic.com/research/AI-assistance-coding-skills
    note: The authors' plain-language summary of the study and its six patterns.
    verified: true
deepDive: |-
  The study is Shen and Tamkin (2026): 52 mostly junior engineers learning Trio, an async
  Python library. It found six ways people used the assistant:

  - AI delegation: the assistant wrote everything. Fastest, and the lowest scores.
  - Progressive AI reliance: questions at first, then everything delegated.
  - Iterative AI debugging: the assistant checked and repaired the code.
  - Generation-then-comprehension: generated code, then asked questions about it.
  - Hybrid code-explanation: asked for an explanation with each piece of code.
  - Conceptual inquiry: asked only about ideas, and fixed errors alone.

  The first three scored low and the last three high.

  A second study, Perry and colleagues (2023), found people with an assistant wrote less secure
  code, while rating it as more secure. That's why feeling sure is not a check.

  Keep the limits in mind. It was one library, 52 people and a quiz straight afterwards. It
  says nothing yet about what people remember a month later.

  The habit grows later. The lesson What to check before you trust code turns "read it, then
  predict" into five questions you ask of any change: what could break, whether it holds at
  10x, what will confuse the next reader, what it could expose, and how you'd prove it works.

  This app builds the habit in. The code editor is Unplugged: no autocomplete, no assistant.
  From module 3 on, lessons include an ai-review step with one planted flaw.
