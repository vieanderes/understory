term: type annotation
aka:
  - annotation
short: 'A note such as `: number` after a name or parameter, saying what kind of value it must hold.'
explain: |
  `function area(width: number, height: number)` tells the checker, and the next reader,
  what the function accepts. Pass it a string and the editor underlines it before you run
  anything.

  Annotate where inference can't see: parameters, return types of exported functions, and
  data arriving from outside. Annotating every local variable adds noise and nothing else.
analogy: The label on a kitchen jar. It says "sugar", so nobody pours salt into it by mistake.
example:
  language: ts
  code: |
    function area(width: number, height: number): number {
      return width * height;
    }
    area(3, '4'); // error: string is not number
usage: Add a type annotation to the parameter, or callers can pass anything.
twin:
  term: type-inference
  difference: An annotation is a type you write. Inference is the type the checker works out when you don't, and good code leans on it for everything local.
related:
  - type-inference
level: 1
lessons:
  - ts.everyday-types
