term: union type
aka:
  - union
short: A type that allows one of several types, written with a vertical bar between them.
explain: |
  An id might be a number or a string. `number | string` says exactly that. A status might
  be one of three words: `'idle' | 'loading' | 'done'`.

  Before you can use the value, you have to find out which one you've got. Calling
  `.toUpperCase()` on `number | string` is an error until you check. That check is called
  narrowing.
analogy: A parcel locker that takes a small box or an envelope. Before opening it, you don't know which one is inside.
example:
  language: ts
  code: |
    type Status = 'idle' | 'loading' | 'done';
    let status: Status = 'idle';
    status = 'finished'; // error: not one of the three
usage: Make the status a union type of the three strings, so a typo can't slip through.
twin:
  term: discriminated-union
  difference: A union type allows any of several types. A discriminated union is a union of object types that share one tag field, so a single check tells you which one you hold.
related:
  - narrowing
  - discriminated-union
  - never-type
level: 1
lessons:
  - ts.narrowing
