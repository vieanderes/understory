term: amortised cost
aka: [ amortised, amortized, amortised O(1), amortized analysis ]
short: The average cost per operation over a long run, with rare slow steps paid off by cheap ones.
explain: |
  Pushing onto a JavaScript array is usually instant. Now and then the array is full, so
  the engine copies everything into a bigger block. That one push is slow.

  Because the block doubles each time, the copies add up to about one extra step per push.
  Spread over all the pushes, each costs O(1). That's the amortised cost.

  It isn't the average case over random inputs. It's a guarantee over any sequence of
  operations. One single call can still be slow, which matters for a real-time screen.
analogy: A season ticket. One big payment, but spread over every match it's cheap per game.
example:
  language: js
  code: |
    const stack = [];
    for (let i = 0; i < 1_000_000; i++) {
      stack.push(i); // mostly O(1), sometimes a full copy
    }
    // total work about 2n: O(1) per push, amortised
usage: Each push is O(1) amortised cost, so the whole monotonic stack pass stays linear.
related: [ big-o, time-complexity, array, monotonic-stack ]
level: 3
