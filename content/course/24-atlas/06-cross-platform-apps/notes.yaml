summary: |-
  Cross-platform frameworks give you one codebase for iPhone and Android, and they differ in the one thing users see: what's on the screen. React Native drives the phone's own native views from React components. Flutter draws every pixel itself with its own engine, from Dart code. Kotlin Multiplatform shares business rules written in Kotlin and leaves the screens native. Capacitor shows your web app in the system web view, with a bridge to native features.

  That difference decides fit. A React team shipping its first app reaches for React Native with Expo. A product that must look identical everywhere suits Flutter. A team with native apps that wants to stop writing logic twice suits Kotlin Multiplatform. A finished web app that needs a store presence quickly suits Capacitor.

  Two production facts cut across all of them. Over-the-air updates can replace JavaScript and assets, never native code, so a new native module needs a store build. And anything shipped in an app can be read by anyone who unpacks it, while old versions stay installed for months, so a model API key lives only on your server. These notes add how each framework works underneath, a comparison for choosing, the limits of over-the-air updates, and a complete, safe design for an AI feature in a mobile app.
remember:
  - React Native creates real native views from React components, Flutter paints its own pixels, Kotlin Multiplatform shares logic with native screens, and Capacitor runs a web app in a web view.
  - An over-the-air update can change JavaScript, styles and images, but any change to native code, such as a new native module or permission, needs a new store build.
  - Anything inside a shipped app, including keys and endpoints, can be extracted, so a model API key belongs on your server and the app calls the server.
  - Old app versions stay installed for months, so a leaked key can't be recalled by shipping a fix, only by rotating it at the provider.
  - The server in front of the model is where you authenticate the user, validate input, enforce per-user limits and control cost.
  - Choose the framework by the team and the product, a React team suits React Native, one exact brand look suits Flutter, and existing native apps suit Kotlin Multiplatform.
  - Every cross-platform framework needs native code for capabilities it doesn't wrap, so budget for someone who can read Swift and Kotlin.
sections:
  - title: How each framework works underneath
    body: |-
      **React Native.** Your JavaScript runs in an engine bundled inside the app, usually Hermes, which compiles JavaScript to bytecode at build time so the app starts faster. The current architecture lets JavaScript call native code directly through an interface called JSI, instead of sending serialised messages across an asynchronous bridge. The renderer, Fabric, turns your component tree into native views: a `<Text>` becomes the platform's own text view. Native modules expose device features to JavaScript. Expo adds a large set of maintained modules, cloud builds (EAS Build), and over-the-air updates (EAS Update).

      **Flutter.** Dart code is compiled ahead of time to machine code for release builds. Flutter's engine draws the whole UI onto a surface, so a button is pixels Flutter painted, not a platform button. That's why an app looks identical on both platforms and why platform conventions, such as how a list scrolls or how text selection behaves, must be imitated by Flutter's widget libraries. Platform channels carry calls to native code for device features.

      **Kotlin Multiplatform.** Shared Kotlin code compiles to JVM bytecode for Android and to native code for iOS, where Swift sees it as a framework. `expect` and `actual` declarations let shared code call platform-specific implementations. Screens are usually SwiftUI and Jetpack Compose; JetBrains' Compose Multiplatform can share screens too, for teams that want it.

      **Capacitor.** Your built web app runs in the system web view (WKWebView on iOS, Android's WebView), and plugins bridge JavaScript calls to native code. It inherits the web view's rendering and start-up cost, and it gets you into the stores with the web app you already have.
  - title: Choosing between them
    body: |-
      A comparison on the criteria that usually decide.

      ```text
      Framework         Screen                   Language      Best fit
      React Native      native views             TS / JS       React team, native feel, OTA updates
      Flutter           own drawing engine       Dart          one exact look, custom visuals
      Kotlin MP         native screens           Kotlin        existing native apps, shared logic
      Capacitor         web app in a web view    web stack     a web app that needs the stores fast
      Native            native views             Swift/Kotlin  platform-specific core features
      ```

      Some worked calls:

      - **A React web team building a companion app** for its product: React Native with Expo. They share TypeScript types, validation and API clients with the web app, and over-the-air updates let them fix JavaScript bugs without waiting for review.
      - **A children's learning app with heavy custom illustration and animation**, meant to look the same everywhere: Flutter. Platform look-and-feel matters little, and drawing everything itself is an advantage.
      - **A bank with mature native apps** tired of implementing fee rules twice: Kotlin Multiplatform for the rules, keeping the native screens and the teams' skills.
      - **An internal tool that already works as a responsive web app** and must be installable on managed phones: Capacitor, adding a few plugins for the camera and push.

      Whatever you choose, some features won't be wrapped. Budget time and skills for writing or maintaining native modules in Swift and Kotlin. And check the state of the libraries you need, such as Bluetooth, payments or maps, before committing: a framework is only as good as its support for your hardest feature.
  - title: What over-the-air updates can and can't do
    body: |-
      An over-the-air update replaces the JavaScript bundle and assets that an installed app loads, without a store release. It's one of React Native's biggest practical advantages, and it has firm limits.

      **Can change:** JavaScript logic, screens written in JavaScript, styles, images and other bundled assets.

      **Can't change:** anything compiled into the native app. That includes adding or upgrading a native module, changing permissions such as camera access, changing the app icon or splash screen configuration, and upgrading React Native itself. Those need a new build through the stores.

      Expo protects against sending an update to a build that can't run it with a **runtime version**: each build declares one, and each update targets one. An update built for a runtime version that includes a new native module won't be offered to older builds. The failure in the lesson happens when that safeguard is misconfigured, for example a runtime version that isn't bumped when native code changes.

      Good practice follows from that:

      - Bump the runtime version whenever native code changes, ideally automatically from a fingerprint of the native project.
      - Roll updates out gradually, and keep a way to roll back to the previous update.
      - Treat over-the-air updates as a fast path for fixes, not a way around review for new features. Both stores' policies limit what downloaded code may change, such as the app's main purpose, so read the current rules.
      - Keep the server compatible with every runtime version still in use.
  - title: A safe design for an AI feature in an app
    body: |-
      The app never talks to the model provider. It talks to your server, which holds the key and decides whether each request deserves a paid model call.

      The server's job, in order:

      - **Authenticate the user.** A signed-in session or token, verified on every request.
      - **Validate input.** Type, size and content limits, refused before any model call.
      - **Enforce per-user limits.** A leaked session or a script can't then spend your budget.
      - **Call the model** with the key from its secret store, with a timeout.
      - **Log usage per user** so cost is visible and abuse stands out.

      A per-user limit can be small:

      ```js
      // A fixed-window limit per user, checked before any paid model call.
      function createLimiter({ limit, windowMs, now = Date.now }) {
        const windows = new Map(); // userId -> { start, count }
        return function allow(userId) {
          const t = now();
          const w = windows.get(userId);
          if (!w || t - w.start >= windowMs) {
            windows.set(userId, { start: t, count: 1 });
            return true;
          }
          if (w.count >= limit) return false;
          w.count += 1;
          return true;
        };
      }

      let clock = 0;
      const allow = createLimiter({ limit: 3, windowMs: 60_000, now: () => clock });
      console.log([1, 2, 3, 4].map(() => allow('user-7'))); // [ true, true, true, false ]
      console.log(allow('user-8')); // true: each user has their own window
      clock = 60_000;
      console.log(allow('user-7')); // true: a new minute, a new window
      ```

      It prints the fourth call refused, another user allowed, and a fresh window a minute later. In production the counts live in a shared store such as Redis so every server instance sees them, and the refused request returns status 429.

      Two further layers help. Platform attestation (App Attest on iOS, the Play Integrity API on Android) lets the server check that a request comes from a genuine copy of your app, which raises the bar for scripts. And if a key ever leaks, rotate it at the provider at once; the server-side design means rotation breaks nothing in shipped apps.
pitfalls:
  - >-
    **Putting a model key in the app, however hidden.** Obfuscation slows extraction; it
    doesn't stop it. Keep the key on your server and have the app call the server.
  - >-
    **Sending a native change over the air.** Installed builds lack the native code, and
    the new screen crashes. Ship native changes as a store build, and bump the runtime
    version.
  - >-
    **Choosing Flutter for native feel, or React Native for pixel-identical design.** Each
    is strong at the other thing. Match the framework to what the product needs to look like.
  - >-
    **Assuming every device feature is wrapped.** Some need native modules in Swift and
    Kotlin. Check library support for your hardest feature before choosing.
  - >-
    **A proxy endpoint with no limits.** An authenticated but unlimited endpoint lets one
    account run up the bill. Add per-user rate limits and input size caps.
  - >-
    **Breaking old app versions.** Users update slowly, and a changed endpoint breaks every
    old copy. Keep the server compatible with every version still in use.
verify:
  - lens: leaks
    check: The app bundle holds no API key or secret, and every model call goes through your server, which holds the key.
  - lens: scales
    check: The proxy endpoint has per-user rate limits and input size caps, so one account cannot run up the bill.
  - lens: breaks
    check: A change that adds or upgrades native code ships as a store build, never as an over-the-air update.
  - lens: tests
    check: Each release is tested as an update over the oldest version still in use, not only as a fresh install.
interview:
  - question: What's the difference between React Native and Flutter?
    answer: >-
      The key difference is what ends up on the screen. React Native runs your React code in
      an embedded JavaScript engine and creates the platform's own native views, so a switch
      is the real iOS or Android switch and follows each OS's behaviour and accessibility.
      Flutter compiles Dart ahead of time and draws every pixel with its own engine, so the
      app looks identical everywhere and platform conventions are imitated by its widgets.
      React Native suits a team that knows React and wants a native feel, plus over-the-air
      JavaScript updates. Flutter suits a product with a strong custom visual identity. Both
      need native code for features they don't wrap.
  - question: How would you add an LLM feature to a mobile app without leaking the API key?
    answer: >-
      The key never goes in the app, because anyone can unpack an app and read its strings,
      and old versions stay installed for months. The app calls my own endpoint with the
      user's session token. The server authenticates the user, validates the input size,
      checks a per-user rate limit, then calls the model with the key from its secret store,
      and logs usage per user. I'd add platform attestation, App Attest on iOS and Play
      Integrity on Android, to reject requests from scripts. For long responses, I'd stream
      from the server to the app. If a key leaked anyway, I'd rotate it at the provider,
      which breaks nothing because no app holds it.
  - question: What can an over-the-air update change in a React Native app, and what can't it?
    answer: >-
      It can change the JavaScript bundle and assets: logic, screens written in JavaScript,
      styles and images. It can't change anything compiled into the native app, such as a
      new or upgraded native module, new permissions, the app icon, or the React Native
      version. Those need a new store build. Expo guards this with a runtime version: an
      update only reaches builds with a matching runtime version, so a correctly configured
      project can't send JavaScript that depends on native code the build lacks. I'd bump
      the runtime version automatically when native code changes, roll updates out
      gradually, and keep a rollback path.
  - question: When would you choose Kotlin Multiplatform?
    answer: >-
      When a team already has, or wants, native apps and the pain is duplicated business
      logic. Kotlin Multiplatform shares domain code, such as validation, pricing rules,
      networking and storage, written once in Kotlin and compiled for Android and iOS, while
      each platform keeps its own native UI in SwiftUI and Jetpack Compose. That keeps the
      best platform feel and lets teams adopt it gradually, one module at a time. It suits a
      bank or retailer with mature native apps. It's a weaker fit for a small web team
      starting from nothing, who'd need to learn Kotlin and both native UI toolkits; React
      Native would get them shipping sooner.
