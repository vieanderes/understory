approach: >-
  The answer can never be larger than N + 1: with N tickets, at least one of the numbers
  1 to N + 1 is free. So put every held number in a set, then count up from 1 until you
  reach a number the set does not have. Each look-up is instant, so the whole thing is one
  pass.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N up to 100,000** and the word **efficient** tell you
      the performance tests will use a large array. A nested loop over A will time out.

      Now read the story. Note the one rule that matters: the answer is a positive number
      that is not in A.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Type the task in your own words at the top of the file. If you cannot say it in one
      line, you have not understood it yet. Reviewers read this comment too.
    code:
      ts: |-
        // Return the smallest positive number that does not appear in A.
      python: |-
        # Return the smallest positive number that does not appear in A.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - only zero and negative numbers, so the answer is 1;
      - every number from 1 to N present, so the answer is N + 1;
      - duplicates, which must not be counted twice;
      - a single element.

      Put them in test-input.txt now. You will check them once the code runs.
    input:
      - "[-3, -1, 0]"
      - "[1, 2, 3, 4]"
      - "[2, 2, 2]"
      - "[1]"
  - kind: ask-ai
    title: Ask the assistant to confirm one rule, not to solve
    minutes: 1
    body: |-
      Use the assistant to check your reading of the task. A narrow question like this one
      shows the reviewer you think before you code. Never paste the task and ask for the
      answer: the transcript shows it.
    prompt: >-
      Without solving it: if A holds every number from 1 to N, the answer is N + 1, and it
      can never be larger than N + 1. Is that right? One sentence.
    expect: The assistant agrees, and you now know the answer lies between 1 and N + 1.
  - kind: plan
    title: Pick the data structure that makes the check instant
    minutes: 2
    body: |-
      You need to ask "is this number in A?" many times. On an array that is a scan each
      time: O(N²) in total. A set answers it at once.

      Plan: build a set from A, then start at 1 and count up while the set has the number.
      At most N + 1 checks, so O(N).
  - kind: write
    title: Write the solution yourself
    minutes: 4
    body: |-
      It is five lines. Type it yourself: it is faster than prompting, and the transcript
      shows you could. Keep the header comment and add the complexity to it.
    code:
      ts: |-
        // Return the smallest positive number that does not appear in A.
        // The answer is at most N + 1, so a set and a count up from 1: O(N) time, O(N) space.
        function solution(A: number[]): number {
            const held = new Set(A);
            let ticket = 1;
            while (held.has(ticket)) ticket++;
            return ticket;
        }
      python: |-
        # Return the smallest positive number that does not appear in A.
        # The answer is at most N + 1, so a set and a count up from 1: O(N) time, O(N) space.
        def solution(A):
            held = set(A)
            ticket = 1
            while ticket in held:
                ticket += 1
            return ticket
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code** (or F9). The three examples must say OK. Then read each "Returned
      value" for your own cases against the rule, not against a guess.
    expect: >-
      Three OKs, then 1 for the negative case, 5 for 1 to 4, 1 for [2, 2, 2] and 2 for [1].
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Generating inputs is a good job for the assistant: it is quick at variety, and you stay
      in charge of what the right answer is. Ask for inputs only, no code and no answers.
    prompt: >-
      Give me 5 more test inputs for this function, one per line, in the format
      [1, 3, 6]. Cover a gap in the middle, a large number far above N, unsorted input and
      a mix of negatives and positives. Inputs only, no answers and no code.
    expect: Five lines you can paste into test-input.txt. Run again and check each result.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      A second pair of eyes catches what you stopped seeing. Ask for problems, not a
      rewrite, so the code stays yours.
    prompt: >-
      Review my current solution for correctness and time complexity. List any problems in
      one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output: printing slows the performance tests. Check the header
      comment states the complexity. Then submit.

      After submitting, open the detailed report: every performance test should say OK.
