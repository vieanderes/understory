term: lambda
aka: [lambda expression, anonymous function]
short: A tiny nameless function written inline, holding one expression and no statements.
explain: |
  Sorting by price needs a small function that says "compare this part". Writing a full
  `def` for one line you use once is more ceremony than the idea deserves.

  So Python lets you write it inline: `lambda item: item["price"]`. It may hold one
  expression, and no assignments, loops or `return`. Anything longer, or anything worth a
  name in a traceback, deserves a `def`. Lambdas made in a loop all see the loop variable's
  last value, unless you bind it as a default argument.
analogy: A sticky note with one instruction on it. Handy for a quick job; write a proper manual for anything more.
example:
  language: python
  code: |
    rooms = [{"name": "Oak", "seats": 8}, {"name": "Elm", "seats": 4}]
    biggest = max(rooms, key=lambda room: room["seats"])

    from operator import itemgetter
    by_seats = sorted(rooms, key=itemgetter("seats"))
usage: That lambda has grown three conditions; give it a def and a name so the sort reads clearly.
related: [first-class-function, closure, function]
level: 2
lessons: [python.functions-as-values]
