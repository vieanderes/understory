summary: >-
  Types drift when the same fact lives in several places. Deriving means writing the fact
  once, as a value or a type, and computing every other type from it. `typeof` turns a value
  into a type, `keyof` takes its property names, `T[K]` looks up one property's type, and
  `(typeof LIST)[number]` turns an `as const` list into a union. Change the source, and
  everything downstream follows or fails to compile.


  The utility types, `Partial`, `Pick`, `Omit`, `Record`, `ReturnType` and the rest, aren't
  magic. They're written in TypeScript with two tools you can use yourself. A **mapped type**
  loops over keys and builds a new object type. A **conditional type** tests a type and picks
  a branch, with `infer` to pull a piece out. Template literal types add string patterns on
  top. Knowing how they work explains their sharp edges, such as `Omit` flattening a union.


  `satisfies` completes the set. An annotation replaces the inferred type with the one you
  wrote. `satisfies` checks the value against a type and keeps the inferred one, so a table
  is both validated and exact. Use derived types in application code freely; write your own
  mapped and conditional types sparingly, where a library or shared module earns the extra
  reading.
remember:
  - Write each fact once and derive the rest with `typeof`, `keyof`, indexed access `T[K]` and `(typeof LIST)[number]`.
  - Utility types change only the type, so `Omit<User, "passwordHash">` removes nothing from the object at run time.
  - "A mapped type, `{ [K in keyof T]: ... }`, loops over keys, and `Partial`, `Required`, `Readonly`, `Pick` and `Record` are each one line of it."
  - "A conditional type, `T extends U ? X : Y`, picks a type by a test, and `infer` names the part to extract, which is how `ReturnType`, `Parameters` and `Awaited` work."
  - "A conditional type on a bare type parameter runs once per union member; wrap both sides in brackets, `[T] extends [U]`, to test the union as a whole."
  - "`satisfies` checks a value and keeps its inferred type, an annotation replaces the inferred type, and `as const` narrows to readonly literals; `as const satisfies T` gives you both."
  - "`keyof` and `Omit` on a union keep only the keys every member shares, so use a distributive helper for unions."
  - "`Omit` doesn't check its keys, so `Omit<User, \"pasword\">` compiles and removes nothing."
sections:
  - title: Mapped types and key remapping
    body: |-
      A mapped type builds an object type by looping over a union of keys. Here are four
      built-in helpers, written out:

      ```ts
      type MyPartial<T> = { [K in keyof T]?: T[K] };
      type MyRequired<T> = { [K in keyof T]-?: T[K] };
      type Mutable<T> = { -readonly [K in keyof T]: T[K] };
      type MyPick<T, K extends keyof T> = { [P in K]: T[P] };
      ```

      `?` and `readonly` add a modifier; `-?` and `-readonly` remove one. Looping over
      `keyof T` is called **homomorphic**, and it keeps each property's existing modifiers,
      which is why `Partial` of a readonly property stays readonly.

      An `as` clause renames keys as it loops. A **template literal type** builds the new
      name, and mapping a key to `never` drops it:

      ```ts
      type Booking = { id: string; guests: number; notes?: string };

      type Getters<T> = {
        [K in keyof T as `get${Capitalize<string & K>}`]: () => T[K];
      };
      type BookingGetters = Getters<Booking>;
      // { getId: () => string; getGuests: () => number;
      //   getNotes?: (() => string | undefined) | undefined }

      type NumbersOnly<T> = {
        [K in keyof T as T[K] extends number ? K : never]: T[K];
      };
      type BookingNumbers = NumbersOnly<Booking>; // { guests: number }
      ```

      `string & K` is there because `keyof T` may include number and symbol keys, and
      `Capitalize` only accepts strings. Template literal types are useful outside mapped
      types too:

      ```ts
      type Pixels = `${number}px`;
      const gap: Pixels = "12px"; // fine
      const wrong: Pixels = "12em";
      // Type '"12em"' is not assignable to type '`${number}px`'.

      type Handler = `on${Capitalize<"click" | "hover">}`; // "onClick" | "onHover"
      ```

      A template over a union produces every combination, so two unions of ten members make
      a hundred strings. That's fine for event names and a warning sign for anything bigger.
  - title: Conditional types, infer and distribution
    body: |-
      A conditional type reads like a ternary on types. `infer` declares a type variable
      inside the pattern, filled in when the test matches:

      ```ts
      type MyReturnType<F> = F extends (...args: any[]) => infer R ? R : never;
      type ElementOf<T> = T extends readonly (infer Item)[] ? Item : T;

      async function loadCart(id: string) {
        return { id, items: ["MUG-1"] };
      }
      type Loaded = MyReturnType<typeof loadCart>; // Promise<{ id: string; items: string[] }>
      type Cart = Awaited<ReturnType<typeof loadCart>>; // { id: string; items: string[] }
      type Args = Parameters<typeof loadCart>; // [id: string]
      type Item = ElementOf<string[]>; // string
      ```

      `Awaited` unwraps promises all the way down, so `Awaited<Promise<Promise<number>>>` is
      `number`. The `any[]` in `MyReturnType` is the standard idiom: it lets any parameter list
      match.

      When the checked type is a **bare type parameter** and you pass a union, the condition
      runs once per member and the results are joined. This is a **distributive** conditional
      type:

      ```ts
      type ToArray<T> = T extends unknown ? T[] : never;
      type ToArrayWhole<T> = [T] extends [unknown] ? T[] : never;

      type A = ToArray<string | number>; // string[] | number[]
      type B = ToArrayWhole<string | number>; // (string | number)[]
      type C = ToArray<never>; // never
      type D = ToArrayWhole<never>; // never[]
      ```

      Distribution is what makes the filters work. `Exclude<T, U>` is
      `T extends U ? never : T`: each member that matches becomes `never`, and `never`
      vanishes from a union. `Extract` is the mirror image, and `NonNullable<T>` is written
      `T & {}` in today's library, which drops `null` and `undefined`.

      Two edge cases matter. `never` is the empty union, so a distributive type given `never`
      returns `never` without running. And a test like `IsString<string | number>` gives
      `boolean`, because the two members give `true` and `false`. Wrap in brackets whenever
      you mean "the whole type".
  - title: Annotation, satisfies and as const, side by side
    body: |-
      Three ways to give a value a type, and each keeps different information:

      ```ts
      type Colour = "red" | "green" | "blue";
      type RGB = [number, number, number];

      const annotated: Record<Colour, string | RGB> = {
        red: "#f00", green: [0, 255, 0], blue: "#00f",
      };
      annotated.red.toUpperCase();
      // Property 'toUpperCase' does not exist on type 'string | RGB'.

      const checked = {
        red: "#f00", green: [0, 255, 0], blue: "#00f",
      } satisfies Record<Colour, string | RGB>;
      checked.red.toUpperCase(); // fine: checked.red is string
      checked.green; // [number, number, number]

      const frozen = { red: "#f00", green: [0, 255, 0], blue: "#00f" } as const;
      frozen.green; // readonly [0, 255, 0], but nothing checked the keys
      ```

      The annotation checked the object, then threw away what it knew: every property is now
      `string | RGB`. `satisfies` ran the same check, so misspelt and missing keys are still
      errors, yet each property kept its own type. Note that `green` became a tuple: `satisfies`
      guides inference with the target type as well as checking against it. `as const` kept
      the most detail but checked nothing.

      Combine them when you want literal values that are also validated:

      ```ts
      const ROUTES = {
        home: "/",
        basket: "/basket",
      } as const satisfies Record<string, `/${string}`>;
      type Path = (typeof ROUTES)[keyof typeof ROUTES]; // "/" | "/basket"
      ```

      When to use which: annotate function parameters, return types and variables whose
      type should be the wider contract, such as a `let` you'll reassign. Use `satisfies` for
      configuration and lookup tables. Use `as const` for lists and tables that feed derived
      types. None of the three exists at run time.
  - title: Utility types on unions, and when to stop
    body: |-
      Most utility types are homomorphic mapped types, and those distribute over a union:
      `Partial<A | B>` is `Partial<A> | Partial<B>`. `Omit` isn't one. It's
      `Pick<T, Exclude<keyof T, K>>`, and `keyof` of a union is only the shared keys. So it
      flattens a discriminated union and loses every member-specific property:

      ```ts
      type Message =
        | { kind: "text"; id: string; body: string }
        | { kind: "image"; id: string; url: string; width: number };

      type Flat = Omit<Message, "id">; // { kind: "text" | "image" }

      type DistributiveOmit<T, K extends PropertyKey> = T extends unknown
        ? Omit<T, K>
        : never;
      type Draft = DistributiveOmit<Message, "id">;
      // Omit<text message, "id"> | Omit<image message, "id">

      const draft: Draft = { kind: "image", url: "/cat.png", width: 640 }; // fine
      ```

      The helper uses distribution on purpose, so each member keeps its own shape. The same
      trap catches `Pick` and any `keyof` you take of a union.

      Type-level code has costs. Deep recursive conditional types slow the editor, produce
      error messages several screens long, and can hit the checker's depth limit, reported as
      "Type instantiation is excessively deep and possibly infinite". In application code,
      prefer a few named types and the built-in helpers. Save clever type code for a shared
      library where many call sites benefit, and test it with a type-level assertion, such as
      assigning the result to a variable of the expected type in a test file.
pitfalls:
  - "**Trusting `Omit` to hide data.** It only changes the type; the object keeps every property. Build a new object with the fields you mean to send, or parse the output through a schema."
  - "**A typo in `Omit` or `Exclude`.** `Omit<User, \"pasword\">` compiles, because the key parameter accepts any string. Test the result, or write a stricter helper with `K extends keyof T`."
  - "**Using `Omit` or `keyof` on a union.** Both keep only the shared keys, so a discriminated union collapses to its common fields. Use a distributive helper, `T extends unknown ? Omit<T, K> : never`."
  - "**Annotating a table and losing its keys.** `const PRICES: Record<string, number>` accepts `PRICES.huuge` as a `number`. Use `satisfies Record<Size, number>` so the keys stay exact and complete."
  - "**Forgetting `Awaited` on an async function.** `ReturnType<typeof loadCart>` is a `Promise`, not the cart. Write `Awaited<ReturnType<typeof loadCart>>`."
  - "**Mixing up the two `typeof`s.** `typeof x === \"string\"` is JavaScript and runs; `type T = typeof x` is TypeScript and is erased. The type form only works on values, never on types."
verify:
  - lens: leaks
    check: 'A public view of a record is built field by field, because `Omit` changes the type and leaves the object whole.'
  - lens: breaks
    check: 'Lookup tables use `satisfies Record<Key, Value>`, so a new key without an entry fails to compile.'
  - lens: confuses
    check: 'Unions come from one list with `(typeof LIST)[number]`, so nobody has to update three places.'
  - lens: tests
    check: 'Test what a function sends, such as the JSON of a public user, not only that it compiles.'
interview:
  - question: How is `Partial` implemented, and what's a mapped type?
    answer: >-
      `Partial<T>` is `{ [K in keyof T]?: T[K] }`: a mapped type that loops over every key of
      `T` and re-declares it as optional with the same value type. Mapped types are the loop
      of the type system. `Required` uses `-?` to remove optionality, `Readonly` adds
      `readonly`, `Pick` loops over a chosen subset of keys, and `Record<K, V>` loops over any
      key union. Since TypeScript 4.1, an `as` clause can rename keys with a template literal
      type, or drop them by mapping to `never`, which is how you'd build `Getters<T>` or keep
      only number properties. One detail: a mapped type over `keyof T` keeps the original
      modifiers and distributes over unions. That's why `Partial` behaves well on a
      discriminated union, while `Omit`, built from `Pick` and `Exclude`, flattens it.
  - question: What's the difference between an annotation, `satisfies` and `as const`?
    answer: >-
      An annotation checks the value and then replaces its inferred type with the declared
      one, so a `Record<Colour, string | RGB>` loses the knowledge that `red` is a string.
      `satisfies`, since TypeScript 4.9, checks the value against the type, catching missing
      and misspelt keys, but keeps the inferred type, so `red` stays `string`. `as const`
      narrows everything to readonly literal types and checks nothing. I annotate parameters,
      returns and anything whose type should be the wider contract. I use `satisfies` for
      config and lookup tables, and `as const satisfies T` when I want exact literals that
      are also validated, for example a routes table whose values feed a `Path` union. None
      of them emits any JavaScript.
  - question: What are conditional types and `infer`? Write `ReturnType`.
    answer: >-
      A conditional type, `T extends U ? X : Y`, chooses a type based on whether `T` is
      assignable to `U`. Inside the `extends` clause, `infer R` declares a type variable
      that's filled in if the pattern matches. So `ReturnType` is
      `T extends (...args: any) => infer R ? R : any`: if `T` is a function, capture what it
      returns. The same shape gives `Parameters`, the element type of an array, or the value
      inside a promise, though `Awaited` handles nested promises recursively. They're what let
      you derive types from existing functions: `Awaited<ReturnType<typeof loadCart>>` stays
      in sync with the implementation. The trade-off is readability and checker cost, so I
      keep custom ones in shared code with type tests.
  - question: What is a distributive conditional type?
    answer: >-
      When a conditional type checks a bare type parameter and receives a union, it's applied
      to each member separately and the results are joined. So with
      `ToArray<T> = T extends unknown ? T[] : never`, `ToArray<string | number>` is
      `string[] | number[]`, not `(string | number)[]`. That's the mechanism behind
      `Exclude` and `Extract`: matching members map to `never`, which disappears from the
      union. Two consequences catch people out. Passing `never` returns `never`, because it's
      an empty union. And a check like `IsString<string | number>` gives `boolean`. When I
      want the union treated as one type, I wrap both sides in a tuple, `[T] extends [U]`,
      which switches distribution off.
  - question: How do you keep a union type and a runtime list of the same values in sync?
    answer: >-
      Make the runtime list the source and derive the type from it. I write
      `const SIZES = ["small", "medium", "large"] as const` and
      `type Size = (typeof SIZES)[number]`. `as const` keeps the literals, and indexing with
      `number` gives the union of the elements. Then any table keyed by size uses
      `satisfies Record<Size, T>`, so adding a size fails to compile until every table has an
      entry, and the list is still there at run time for dropdowns or validation, such as
      `SIZES.includes(input)`. The alternative, a hand-written union plus a separate array,
      compiles happily when one of them goes stale. An `enum` also gives both, but it emits
      code, doesn't work with Node's type stripping, and is less flexible than a literal union.
