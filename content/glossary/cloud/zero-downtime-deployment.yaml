term: zero-downtime deployment
aka: [ zero-downtime release, rolling deployment, rolling update ]
short: Releasing a new version while users keep being served, with new instances ready before old ones stop.
explain: |
  Stop the app, copy the new version, start it again: for those seconds, every visitor gets an
  error. Deploy ten times a day and that adds up.

  Instead, start new instances and wait until their health checks pass. Send them traffic,
  then let the old ones finish and stop. A rolling update does it a few instances at a time.
  For a while both versions run side by side, so the database schema and any API must work
  with both.
analogy: Changing a train's crew at a station without stopping the passengers from boarding.
usage: This isn't a zero-downtime deployment yet, because the old instances are killed before the new ones pass health checks.
related: [ blue-green-deployment, health-check, rollback, migration, load-balancer ]
level: 2
lessons: [ cloud.releases ]
