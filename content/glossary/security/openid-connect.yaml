term: OpenID Connect
aka: [OIDC, ID token, sign in with]
short: A standard on top of OAuth that tells an app who signed in, with a signed token.
explain: |
  OAuth lets an app act on your data somewhere else. It doesn't say who you are. Every
  "Sign in with" button needs that answer, so a layer was added on top of OAuth to give it.

  Alongside the access token, the app gets an ID token: a signed JWT about the person. Check
  its signature, issuer, audience, expiry and nonce before trusting it. Then key your users
  on the issuer and the subject id, never on the email, which can change or be reused.
analogy: OAuth is a valet key for your car. This is the name badge that says whose car it is.
example:
  language: json
  code: |
    {
      "iss": "https://accounts.example.com",
      "sub": "248289761001",
      "aud": "my-app-client-id",
      "email": "sam@example.com",
      "exp": 1767225600,
      "nonce": "n-0S6_WzA2Mj"
    }
usage: Use OpenID Connect for sign-in, and store the user by `iss` and `sub` rather than by email.
twin:
  term: oauth
  difference: OAuth hands an app an access token so it may call an API for you. OpenID Connect adds an ID token that tells the app who you are.
related: [oauth, jwt, access-token, pkce, authentication]
level: 2
lessons: [backend.oauth-and-passkeys]
