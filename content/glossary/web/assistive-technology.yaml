term: assistive technology
aka: [access technology]
short: Software or hardware that helps a disabled person use a device, like a screen reader.
explain: |
  People use computers in many ways. A blind person may listen with a screen reader. Someone
  with a tremor may use a single switch, or their voice. Someone with low vision may zoom
  the page to 400 per cent.

  Your page talks to all of these through one channel: the accessibility tree. Use real
  elements, give every control a name, and they mostly work. Build from bare `div`s, and
  most of them can't.
analogy: Glasses, a hearing aid, a walking stick. Tools that fit the person, as long as the world is built to work with them.
usage: Test the checkout with real assistive technology, not only the automated checker.
related: [screen-reader, accessibility-tree, keyboard-navigation, wcag]
level: 2
lessons: [design.accessibility-foundations]
