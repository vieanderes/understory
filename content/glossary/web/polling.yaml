term: polling
aka: [ poll, long polling ]
short: Asking another system again and again, on a timer, whether anything has changed.
explain: |
  If the other system can't call you, you call it. Every minute, ask: anything new since last
  time?

  It is simple and dependable, and you control the pace. The costs are delay, up to one
  interval, and requests that mostly come back empty, which count against rate limits. A
  common design uses both. Webhooks bring speed, and a slower poll is the safety net for
  anything they missed.
analogy: A child on a car journey asking "are we there yet?" every five minutes.
example:
  language: ts
  code: |
    setInterval(async () => {
      const changes = await api.listOrders({ updatedAfter: lastSeen });
      await save(changes);
    }, 60_000);
usage: The vendor has no webhooks, so we fall back to polling every five minutes with updated-after.
twin:
  term: webhook
  difference: With polling you ask on a schedule whether anything changed. With a webhook the other system tells you the moment it happens.
related: [ webhook, delta-sync, data-reconciliation, rate-limiting ]
level: 2
lessons: [ integrations.webhooks-and-polling ]
