term: non-functional requirement
aka: [non-functional requirements, NFR, quality attribute, scale requirements]
short: How much and how well a system must work, such as load, latency, availability or cost.
explain: |
  Functional requirements say what the system does: shorten a link, send a message.
  These say how well. How many requests a second? How fast? How often can it be down?
  How much may it cost?

  They're only useful as numbers. "Fast" decides nothing; "200 ms at p95 for 50 requests
  a second" decides whether you need a cache. They drive most design choices.
analogy: A car brief saying four seats, but also how fast, how far on a tank and at what price.
usage: We never wrote down the non-functional requirements, so nobody knows if two seconds is acceptable.
twin:
  term: functional-requirement
  difference: A functional requirement says what the system does. A non-functional requirement says how well and at what scale it must do it.
related: [functional-requirement, latency, percentile, slo, back-of-the-envelope-estimate]
