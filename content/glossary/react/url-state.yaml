term: URL state
aka: [search params state, query string state]
short: Values kept in the page address, like filters or the open tab, so links and reloads keep them.
explain: |
  You filter a list, copy the link and send it to a friend. They open it and see the whole
  list, unfiltered. The filter lived in the component, and the link carried none of it.

  Values a person would expect to bookmark or share belong in the address: the search text,
  the filters, the page number, the open tab. The address survives a reload and works with
  Back and Forward. Read it as the source of truth, and update it when the person changes
  something. Use replace rather than push for every keystroke, or Back becomes useless.
analogy: Writing the page number on a bookmark, instead of trying to remember it.
example:
  language: tsx
  code: |
    const params = useSearchParams();
    const query = params.get('q') ?? '';

    function onSearch(text: string) {
      router.replace(`?q=${encodeURIComponent(text)}`);
    }
usage: Keep the filters in URL state, so the link in the bug report opens the same view.
twin:
  term: state
  difference: Component state lives in memory and vanishes on reload or when a link is shared. URL state lives in the address, so it travels with the link and survives a refresh.
related: [state, query-string, url, client-side-navigation]
level: 2
lessons: [react.state-placement]
