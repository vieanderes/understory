id: security.supply-chain
title: "When a dependency turns malicious"
objective: "Spot a risky change in a lockfile diff, know what an install script can reach, and respond when a package you use is hijacked."
level: advanced
minutes: 10
concepts: [security.install-scripts, security.compromised-dependency]
prerequisites: [security.attacker-playbook, security.secrets, tooling.node-and-npm]
opening:
  text: >-
    Most of the code in your app was written by strangers, and you install it unread. You'll
    learn to spot the risky change in a pull request, and what to do on the bad day.

steps:
  - type: prose
    id: what-a-dependency-is
    body: >-
      A **dependency** is a package your code uses. The ones you install yourself sit in
      `package.json`. They have dependencies of their own, and those have more. The packages
      you never chose are **transitive dependencies**.


      The lockfile from the tooling chapter records every one of them, with its exact version.
      A small app often has hundreds.

  - type: multiple-choice
    id: pick-transitive
    concept: security.compromised-dependency
    difficulty: 1
    language: json
    code: |
      // package.json
      { "dependencies": { "date-picker": "^3.2.0" } }

      // package-lock.json, trimmed
      "node_modules/date-picker": { "version": "3.2.1" },
      "node_modules/tiny-calendar": { "version": "2.0.4" }
    question: Which package is a transitive dependency?
    choices:
      - text: '`tiny-calendar`'
        correct: true
        feedback: >-
          Right. Nobody on your team chose it. `date-picker` pulled it in.
      - text: '`date-picker`'
        feedback: >-
          That one is in `package.json`, so your team chose it directly.
      - text: Neither, since both are in the lockfile
        feedback: >-
          The lockfile lists both. Only one of them appears in `package.json`.

  - type: prose
    id: install-scripts
    body: >-
      A package can ship an **install script**, often named `postinstall`. npm runs it the moment
      the package is installed, on your laptop or in CI. None of your code has run yet.


      It runs with your permissions. It can read your files and your environment variables, and
      in CI those hold tokens and cloud keys. In the lockfile, such a package is marked
      `"hasInstallScript": true`.

  - type: bug-hunt
    id: find-lockfile-jump
    concept: security.install-scripts
    difficulty: 2
    language: json
    code: |
      "node_modules/tiny-calendar": {
        "version": "2.1.0",
        "resolved": "https://registry.npmjs.org/tiny-calendar/-/tiny-calendar-2.1.0.tgz",
        "hasInstallScript": true,
        "license": "MIT"
      },
    prompt: >-
      A pull request updates `date-picker`, and this is part of the lockfile change. Tap the line
      that deserves a closer look before merging.
    lines: [4]
    reasons:
      - text: A calendar package now runs code at install
        correct: true
        feedback: >-
          Yes. A date library has no reason to run code at install.
      - text: The version number went up
        feedback: >-
          Versions change all the time. What's new here is code that runs on install.
      - text: The licence is MIT
        feedback: >-
          MIT is a common, permissive licence. It says nothing about what the code does.

  - type: prose
    id: ignore-scripts
    body: >-
      You can tell npm not to run install scripts at all:


      ```bash

      npm ci --ignore-scripts

      ```


      In CI, where the secrets live, that closes the easiest door. A few packages need their
      script, for example to build native code. Allow those on purpose, after reading what
      they run.

  - type: fill-blank
    id: fill-ci-install
    concept: security.install-scripts
    difficulty: 2
    language: bash
    prompt: >-
      CI installs exactly what the lockfile says, and runs no install scripts. Fill the command.
    template: |
      npm {{1}} {{2}}
      npm test
    blanks:
      - key: '1'
        answer: ci
      - key: '2'
        answer: --ignore-scripts
    bank: [ci, install, --ignore-scripts, --force, update]

  - type: prose
    id: compromised-package
    body: >-
      Now the bad day. An attacker takes over a maintainer's npm account and publishes a new
      version with a script that steals environment variables. Your CI installed it this morning.


      Removing the package isn't enough, since the script already ran. Anything it could read
      counts as stolen: find which builds pulled it, rotate those secrets, and pin a known-good
      version.

  - type: parsons
    id: order-compromise-response
    concept: security.compromised-dependency
    difficulty: 3
    language: text
    prompt: >-
      A package in your lockfile was hijacked and ran a script in CI. Put the response in order.
    blocks:
      - id: find-builds
        code: Find every build and laptop that installed the bad version
      - id: rotate
        code: Rotate every secret those machines could read
      - id: pin
        code: Pin the last good version in the lockfile
      - id: rebuild
        code: Rebuild and redeploy from the clean lockfile
    distractors:
      - id: upgrade-only
        code: Upgrade to the fixed version, and you're done
        feedback: >-
          The script already ran and read your secrets. Upgrading doesn't un-steal them.

  - type: ai-review
    id: review-remove-and-move-on
    concept: security.compromised-dependency
    difficulty: 3
    language: bash
    request: A package we use was hijacked this morning. Clean it up.
    flawClass: security
    code: |
      npm uninstall tiny-calendar
      npm install tiny-calendar@2.0.4
      git commit -am "Pin tiny-calendar to 2.0.4"
      git push   # all clean now
    prompt: >-
      An assistant wrote this, and the bad version is gone. Tap the line whose claim is false.
    lines: [4]
    reasons:
      - text: CI secrets the script read are still out there
        correct: true
        feedback: >-
          Right. Pinning stops the next install. Rotate everything the script could reach.
      - text: '`2.0.4` should be the newest version instead'
        feedback: >-
          The last known-good version is the safe pin. Newest might be the bad one.
      - text: '`npm uninstall` leaves the files behind'
        feedback: >-
          It removes the package. The damage was done when the script ran.
    verify:
      question: How would you prove the cleanup is done?
      choices:
        - text: The old CI tokens are refused
          correct: true
          feedback: >-
            Yes. Dead tokens are the only proof the stolen copies are useless.
        - text: '`npm ls` shows version 2.0.4'
          feedback: >-
            That proves the pin, not the secrets. The copies the script sent still work.
        - text: CI passes on the new commit
          feedback: >-
            A green build says the code works. It can't tell you a token was stolen.
    fix: |
      npm uninstall tiny-calendar
      npm install tiny-calendar@2.0.4
      git commit -am "Pin tiny-calendar to 2.0.4"
      git push
      # then rotate every secret CI could read, and check the provider logs

  - type: explain-back
    id: explain-rotate-after-removal
    concept: security.compromised-dependency
    difficulty: 4
    audience: incident
    kind: risk
    prompt: >-
      Someone posts in the incident channel: "We removed the bad package within an hour, so
      we're safe." Warn them what could still go wrong.
    rubric:
      - The install script ran as soon as the package was installed, before anyone removed it.
      - It could read environment variables and files, including CI tokens and keys, and send them away.
      - Rotate every secret the job could reach and watch for use of the old ones, since removal revokes nothing.
    modelAnswer: >-
      We're not safe yet. The script ran the moment CI installed the package, with CI's
      permissions. It could read every token and key in that job and send them away. Removing
      it stops the next install, but those copies still work. Rotate every secret that job
      could reach now, then check the logs for anything that used the old ones.

recap:
  - Tell your own dependencies from the transitive ones in a lockfile.
  - Flag new install scripts in a lockfile diff, and run CI with `--ignore-scripts`.
  - After a hijacked package, find what ran, rotate what it could read, and pin a good version.

recall:
  - id: card-install-script
    concept: security.install-scripts
    front: When does a package's `postinstall` script run, and what can it read?
    back: >-
      As soon as the package is installed, with your permissions. It can read files and
      environment variables, including CI secrets.
  - id: card-ignore-scripts
    concept: security.install-scripts
    front: Which command installs from the lockfile without running install scripts?
    back: "`npm ci --ignore-scripts`"
  - id: card-compromised-steps
    concept: security.compromised-dependency
    front: A package you use was hijacked and ran in CI. What are the steps?
    back: >-
      Find which builds installed it, rotate every secret they could read, pin a known-good
      version, and rebuild.

