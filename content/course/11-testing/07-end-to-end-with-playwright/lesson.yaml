id: testing.e2e-playwright
title: End-to-end with Playwright
objective: Automate one purchase path, and fix a flaky test.
level: essential
minutes: 10
concepts: [testing.e2e, testing.locators, testing.flakiness]
prerequisites: [testing.components, design.accessibility-foundations]
opening:
  text: >-
    You'll have a browser buy a kettle on its own, every time the code changes. And you'll
    know why a test that "sometimes fails" is a bug in the test, not bad luck.

steps:
  - type: prose
    id: what-e2e-is
    body: |-
      An **end-to-end test** starts a real browser, opens your running app and does what a
      person would. Every layer runs, from the page to the database.

      **Playwright** drives a browser from a script. A **locator** like `getByRole` or
      `getByLabel` finds an element the way a user would. Each step is `await`ed, since the
      browser answers a moment later:

      ```js
      test('adds a kettle', async ({ page }) => {
        await page.goto('/');
        await page.getByRole('button', { name: 'Add to basket' }).click();
      });
      ```

  - type: predict-output
    id: predict-role-locator
    concept: testing.locators
    difficulty: 1
    language: html
    code: |
      <label for="qty">Quantity</label> <input id="qty" value="1">
      <button id="add">Add to basket</button>

      <!-- the test -->
      await page.getByLabel('Quantity').fill('2');
      await page.getByRole('button', { name: 'Add to basket' }).click();
    question: What happens when the test runs?
    choices:
      - text: The field gets `2`, and the button is clicked
        correct: true
        feedback: >-
          Right. The label names the input, and the button's text is its name.
      - text: It fails, since neither element has `data-testid`
        feedback: >-
          Test ids are a fallback. The accessible name is already there, and Playwright reads it.
      - text: It fails, because `id="qty"` isn't used
        feedback: >-
          The id links the label to the input. `getByLabel` follows that link on its own.

  - type: prose
    id: auto-waiting
    body: >-
      A locator doesn't look once. It **retries** until the element exists and can be acted
      on. If the timeout ends first, the error names the locator it waited for. Assertions
      retry too: `expect(locator).toHaveText(...)` keeps checking until the text matches.


      That's why a good end-to-end test has no `sleep`. The waiting is inside every step.

  - type: fill-blank
    id: fill-purchase-journey
    concept: testing.e2e
    difficulty: 2
    language: js
    prompt: >-
      Finish the journey. Set the quantity by its label and press the button by its name.
      Then wait for `Basket: 2 items`. Fill the gaps.
    template: |
      test('buys two kettles', async ({ page }) => {
        await page.goto('/');
        await page.{{1}}('Quantity').fill('2');
        await page.getByRole('button', { {{2}}: 'Add to basket' }).click();
        await expect(page.getByText('Basket: 2 items')).{{3}}();
      });
    blanks:
      - key: '1'
        answer: getByLabel
      - key: '2'
        answer: name
      - key: '3'
        answer: toBeVisible
    bank: [getByLabel, getById, name, text, toBeVisible, toExist]

  - type: predict-output
    id: predict-fixed-wait-flakes
    concept: testing.flakiness
    difficulty: 3
    language: text
    code: |
      // the basket updates 200 to 600 ms after the click, at random
      await page.getByRole('button', { name: 'Add to basket' }).click();
      await page.waitForTimeout(300);
      expect(await page.locator('#basket').textContent()).toBe('Basket: 2 items');

      $ npx playwright test --repeat-each 10
    question: '`waitForTimeout` sleeps for a fixed time. Out of ten runs on the same code, how many pass?'
    choices:
      - text: Some. One run gave 1 of 10
        correct: true
        feedback: >-
          Right. 300 ms only beats a short delay. It's a coin toss.
      - text: All ten, since 300 ms is enough
        feedback: >-
          Enough on a good run. When the update takes 500 ms, the check reads `0 items` and
          fails.
      - text: None, because the sleep blocks the update
        feedback: >-
          The page keeps running during the sleep. The trouble is that the sleep is sometimes
          too short.

  - type: prose
    id: flakiness
    body: >-
      A test that passes and fails on the same code is **flaky**. Nobody trusts it, so nobody
      reads it, so a real failure hides behind it.


      Nearly every flake is a fixed wait, shared state between tests, or a real network. The
      fix is never a longer sleep. Replace the sleep with a retrying assertion, give each test
      its own data, and stub the network you don't own.

  - type: ai-review
    id: review-longer-sleep
    concept: testing.flakiness
    difficulty: 4
    language: js
    request: The basket test fails now and then in CI. Make it reliable.
    flawClass: race
    code: |
      test('buys two kettles', async ({ page }) => {
        await page.goto('/');
        await page.getByLabel('Quantity').fill('2');
        await page.getByRole('button', { name: 'Add to basket' }).click();
        await page.waitForTimeout(2000);
        expect(await page.locator('#basket').textContent()).toBe('Basket: 2 items');
      });
    prompt: >-
      An assistant wrote this. Ten local runs pass, and the change ships. CI is now two
      seconds slower per test, and a slow CI machine still fails it weekly. Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: A longer sleep is still a guess
        correct: true
        feedback: >-
          Yes. Any fixed number loses to a slower machine. A locator assertion waits.
      - text: '`fill` should come after the click'
        feedback: >-
          The quantity has to be set before adding. The order is fine; the wait is the flaw.
      - text: '`textContent` should be `innerText`'
        feedback: >-
          Both read the text once, right now. Neither one retries, which is what's needed.
    fix: |
      test('buys two kettles', async ({ page }) => {
        await page.goto('/');
        await page.getByLabel('Quantity').fill('2');
        await page.getByRole('button', { name: 'Add to basket' }).click();
        await expect(page.getByText('Basket: 2 items')).toBeVisible();
      });
    verify:
      question: How would you show the fixed test isn't flaky any more?
      choices:
        - text: Run it many times with a slowed CPU or network
          correct: true
          feedback: Yes. Slow timing breaks guesses, and a retrying assertion still passes.
        - text: Run it ten times locally
          feedback: The sleep passed ten local runs too. A fast machine hides timing bugs.
        - text: See it pass once in CI
          feedback: It failed only weekly before. One green run says almost nothing about a rare flake.

  - type: code-challenge
    id: fix-flaky-basket-test
    concept: testing.flakiness
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    editable: '27-31'
    prompt: >-
      `testAddingToBasket` sleeps 50 ms, then reads the basket. It passes on a quick page
      and fails on a slow one. Make it wait the way Playwright does, with `eventually`.


      We'll run it on pages that answer in 10, 60 and 350 ms, and on a broken one.
    hints:
      - A longer sleep only moves the guess. Something has to check again and again.
      - '`eventually` takes a function and runs it until it stops throwing.'
      - 'Wrap the check: `await eventually(() => expect(...).toBe(...))`.'

  - type: explain-back
    id: explain-why-not-sleep
    concept: testing.e2e
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A teammate says a `waitForTimeout(500)` after each click makes the suite "stable
      enough". Why does a retrying assertion beat it on both speed and reliability?
    rubric:
      - A fixed sleep always waits the full time, even when the page was ready at once.
      - A slower machine or a busier server makes the same sleep too short, so the test flakes there.
      - A retrying assertion returns the moment the condition holds and waits longer only when it must.
    modelAnswer: >-
      A sleep is a guess about how slow the page will be. On a fast run it wastes the whole
      half second. On a slow run it isn't enough, and the test fails on code that works. A
      retrying assertion asks the page again and again until the text is there. It finishes
      the instant the basket updates, and it keeps waiting when a slow machine needs it. Faster
      on good days, correct on bad ones.

recap:
  - Drive one real journey through a browser with role and label locators.
  - Let locators and assertions wait, and never add a sleep.
  - Call a test flaky when it passes and fails on the same code, then fix its wait, state or network.

recall:
  - id: card-locator-by-role
    concept: testing.locators
    front: "What does `getByRole('button', { name: 'Add to basket' })` match, and why is it stable?"
    back: >-
      The button whose accessible name is that text. Styling and structure can change and it
      still matches.
  - id: card-auto-wait
    concept: testing.locators
    front: What does a locator do when its element isn't on the page yet?
    back: >-
      It retries until the element appears and can be acted on. If the timeout ends first,
      the error names the locator.
  - id: card-flaky-definition
    concept: testing.flakiness
    front: What makes a test flaky, and what are the three usual causes?
    back: >-
      It passes and fails on the same code. A fixed wait, shared state between tests, or a
      real network.
  - id: card-e2e-scope
    concept: testing.e2e
    front: What does an end-to-end test check that no lower level can?
    back: >-
      That every layer works together through the real interface, from the page to the
      database.

