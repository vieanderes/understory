id: judgment.intents-and-priorities
title: From intent to a ranked list
objective: Turn what users are trying to do into a ranked list with jobs to be done, impact and effort, MoSCoW or RICE, and written non-goals.
level: advanced
minutes: 10
concepts: [judgment.jobs-to-be-done, judgment.intent-mapping, judgment.prioritisation-scores, judgment.non-goals]
prerequisites: [aisys.shaping-the-build, aisys.classifiers-at-the-fork, judgment.what-leaks]
opening:
  text: >-
    You'll turn "can we add a chat assistant?" into a map of needs and a ranked list you can
    defend. It's how you decide what an AI feature should do before anyone
    writes a prompt.

steps:
  - type: prose
    id: the-job-not-the-feature
    body: >-
      A plant shop asks for "a chat assistant". First, ask what people are trying to get
      done. That's the **job to be done**: the progress someone wants, in their
      situation.


      Write it as a job story: "When my basil's leaves turn yellow, I want to know why, so I
      can save it." It names no feature. A chat, a care guide or a phone call could all do
      that job.

  - type: multiple-choice
    id: pick-the-job
    concept: judgment.jobs-to-be-done
    difficulty: 1
    question: Which one is a job, not a feature?
    choices:
      - text: When I'm away, I want my seedlings watered
        correct: true
        feedback: >-
          Yes. It's the progress someone wants, and many features could deliver it.
      - text: A watering calendar in the app
        feedback: >-
          That's one feature that might help. The job is what the person is trying to get
          done.
      - text: An AI chat assistant
        feedback: >-
          That's a way to deliver something. Starting from the tool skips the question of what
          people need.
      - text: Push notifications for watering
        feedback: >-
          Another feature. It might serve the job, or end up switched off and ignored.

  - type: prose
    id: map-the-intents
    body: |-
      An **intent map** lists what people come to do, how they'd say it, and what handles
      it. For a chat assistant, each intent routes to a tool. A **fallback** catches
      everything else.

      ```yaml
      - intent: care_advice
        examples: ["why is my basil yellow?", "how often to water ferns"]
        route: care_guide
      - intent: check_stock
        examples: ["any lavender in stock?", "do you sell olive trees"]
        route: search_stock
      - intent: fallback
        route: hand_to_person
      ```

      Every example is a ready-made test case for the router.

  - type: ai-review
    id: review-order-lookup
    concept: judgment.intent-mapping
    difficulty: 3
    language: yaml
    request: Map the plant shop assistant's intents to its tools.
    flawClass: data-exposure
    code: |
      - intent: check_stock
        examples: ["any lavender in stock?", "do you sell olive trees"]
        route: search_stock(query)
      - intent: order_status
        examples: ["where's order 4411?", "has my order shipped"]
        route: lookup_order(order_id)
      - intent: care_advice
        examples: ["why is my basil yellow?", "how often to water ferns"]
        route: care_guide(question)
      - intent: fallback
        route: hand_to_person
    prompt: >-
      An assistant drafted this map, and the team built from it. Testers asked about their
      own orders, and every answer was right. Tap the line that could expose customer data.
    lines: [6]
    reasons:
      - text: Any order number returns that order, whoever asks
        correct: true
        feedback: >-
          Yes. Scope the lookup to the signed-in customer's own orders.
      - text: Order numbers belong in the examples
        feedback: >-
          Examples are phrasings for testing the router. The leak is in what the tool will
          look up.
      - text: The fallback should route to a tool
        feedback: >-
          Handing unclear requests to a person is a safe fallback. The leak is somewhere else.
      - text: Care advice needs the customer's id
        feedback: >-
          Care tips are the same for everyone. Nothing private passes through that tool.
    fix: |
      - intent: order_status
        examples: ["where's order 4411?", "has my order shipped"]
        route: lookup_order(order_id, customer_id from the session)
    verify:
      question: Which test would have caught this?
      choices:
        - text: Ask about another customer's order number
          correct: true
          feedback: >-
            Yes. Testers only asked about orders they owned, so nobody tried this.
        - text: Ask about your own order in five phrasings
          feedback: >-
            That's good for the router. But every phrasing still asks about an order you own.
        - text: Measure how often the right intent is picked
          feedback: >-
            The routing was right. The tool did as it was told, and it was told too little.
        - text: Send gibberish to check the fallback
          feedback: >-
            The fallback works fine. The leak happens on a request that was routed correctly.

  - type: code-challenge
    id: write-check-intent-map
    concept: judgment.intent-mapping
    difficulty: 3
    language: ts
    editable: '9'
    prompt: >-
      Write `checkIntentMap(intents, tools)`, a lint for intent maps. Walk the intents in
      order and report, as strings: `'name: no route'` for an empty route, `'name: unknown
      tool x'` for a route not in `tools`, and `'name: needs 2 examples'` for fewer than two.
      The fallback needs no examples.


      An example already used by an earlier intent, ignoring case and outer spaces, gives
      `'name: "Example" is also in other'`. Finally, add `'no fallback'` if no intent is named
      `fallback`.
    hints:
      - Do the per-intent checks inside one loop over `intents`, and the fallback check after it.
      - A route that's empty isn't also an unknown tool, so use `if` and `else if` for those two.
      - Keep a `Map` from each example, trimmed and lower-cased, to the first intent that used it.

  - type: prose
    id: rank-the-list
    body: >-
      Now rank what to build. **Impact and effort**: do high-impact, low-effort items first.
      **MoSCoW** sorts each item into Must, Should, Could, or Won't this time. **RICE** scores
      reach × impact × confidence ÷ effort.


      Every Won't goes in the spec as a **non-goal**, such as "no ordering in chat". The
      scores are guesses, so keep the evidence beside each one.

  - type: bug-hunt
    id: hunt-unearned-confidence
    concept: judgment.prioritisation-scores
    difficulty: 3
    language: yaml
    code: |
      # RICE = reach × impact × confidence ÷ effort (person-weeks)
      - item: care advice in chat
        reach: 3000       # chats a month, from the help inbox
        impact: 2
        confidence: 80%   # 40 inbox questions sampled
        effort: 4
        score: 1200
      - item: photo diagnosis
        reach: 3000       # the same inbox
        impact: 3
        confidence: 100%  # nobody has tried it yet
        effort: 6
        score: 1500
    prompt: >-
      A script scored two ideas, and photo diagnosis came out on top. Tap the estimate that
      doesn't hold up.
    lines: [11]
    reasons:
      - text: An untried idea claims full confidence
        correct: true
        feedback: >-
          Yes. With no evidence, 50% at most, and it drops below care advice.
      - text: Photo diagnosis should reach fewer people
        feedback: >-
          Reach comes from the same inbox count as care advice. It's the confidence that has
          nothing behind it.
      - text: An impact of 3 is too high
        feedback: >-
          3 means massive, and saving a dying plant might be. The number with no evidence is
          the confidence.
      - text: Effort should be counted in days
        feedback: >-
          Any unit works if every item uses the same one, and these do. The flaw is elsewhere.
    fix: |
      confidence: 50%   # nobody has tried it yet: test it on 20 real photos first

  - type: multiple-choice
    id: pick-useful-non-goal
    concept: judgment.non-goals
    difficulty: 3
    question: Which is a useful non-goal for the assistant's first release?
    choices:
      - text: It won't take orders or issue refunds
        correct: true
        feedback: >-
          Yes. People might expect it, and it rules out risky tools.
      - text: It won't be slow
        feedback: >-
          That's a requirement in disguise. Write it as a target instead, like replies within
          3 seconds.
      - text: It won't have bugs
        feedback: >-
          Nobody can promise that, and it rules nothing out. A non-goal removes specific work.
      - text: It won't do anything not listed here
        feedback: >-
          Too broad to help anyone. Name the things people would expect, so reviewers stop
          asking for them.

  - type: explain-back
    id: explain-why-a-wont
    concept: judgment.non-goals
    difficulty: 4
    audience: non-technical
    kind: decide
    prompt: >-
      The shop's owner asks why ordering through the chat is a Won't this time. Explain your
      call so she can agree or push back.
    rubric:
      - It ties the ranking to evidence about the jobs, such as most chats asking for care advice or stock.
      - It names the cost and risk, such as payments, sign-in and confirmations, with money at stake.
      - It says what would bring it back, and that writing it down stops people expecting it now.
    modelAnswer: >-
      Most people who chat with us want care advice or to check stock, so those come first.
      Ordering in chat would mean handling payments, sign-in and confirmations: a lot of work,
      with money at stake. The shop already takes orders well. So it's a Won't for this
      release, written down so nobody expects it. If customers keep asking to order in chat,
      we'll move it up next time.

recap:
  - Write the job people are trying to get done before you name a feature.
  - Map each intent to example phrasings and a route, with a fallback for the rest.
  - Rank with impact and effort, MoSCoW or RICE, and write every Won't down as a non-goal.

recall:
  - id: card-job-story
    concept: judgment.jobs-to-be-done
    front: How do you write a job story?
    back: >-
      "When [situation], I want to [progress], so I can [outcome]." It names the need, and no
      feature.
  - id: card-intent-map
    concept: judgment.intent-mapping
    front: What does each row of an intent map hold, and what else does the map need?
    back: >-
      An intent, example phrasings and the tool or feature that handles it. The map also needs
      a fallback for everything else.
  - id: card-rice
    concept: judgment.prioritisation-scores
    front: What does RICE multiply, and where does it most often go wrong?
    back: >-
      Reach × impact × confidence ÷ effort. The inputs are guesses, and confidence often claims
      evidence nobody has.
  - id: card-non-goal
    concept: judgment.non-goals
    front: What makes a non-goal useful?
    back: >-
      It names something people would plausibly expect, such as ordering in chat, so the work
      and the risky tools are ruled out on purpose.

references:
  - kind: essay
    title: Know Your Customers' "Jobs to Be Done"
    authors: Clayton M. Christensen, Taddy Hall, Karen Dillon, David S. Duncan
    year: 2016
    venue: Harvard Business Review, September 2016
    url: https://hbr.org/2016/09/know-your-customers-jobs-to-be-done
    note: The case for framing products by the progress customers want to make.
    primary: true
    verified: false
  - kind: essay
    title: Replacing The User Story With The Job Story
    authors: Alan Klement
    year: 2013
    venue: JTBD.info
    note: The "When, I want to, so I can" format used in this lesson.
    verified: false
  - kind: essay
    title: 'RICE: Simple prioritization for product managers'
    authors: Sean McBride
    venue: Intercom blog
    note: The original RICE write-up, with its scales for impact and confidence.
    primary: true
    verified: false
  - kind: docs
    title: MoSCoW Prioritisation
    authors: Agile Business Consortium
    venue: The DSDM Agile Project Framework handbook
    note: Must, Should, Could and Won't have this time, as the method defines them.
    verified: false

deepDive: >-
  For an assistant, the intent map is also its permission list. Every route is a tool the
  model can call, so every intent you add is power you hand it. A non-goal is often a tool
  you deliberately don't give it, such as `issue_refund` in the first release.


  The examples do double duty. Collect real phrasings from the help inbox, label each with
  its intent, and you have an eval set for the router from the classifier lessons. Track
  accuracy per intent, and track how often the fallback fires. A fallback rate that climbs
  means people want something the map doesn't cover yet.


  The RICE write-up suggests fixed scales: impact of 3 for massive, 2 high, 1 medium, 0.5
  low and 0.25 minimal, and confidence of 100%, 80% or 50%. Fixed scales stop each person
  inventing their own. Below 50%, the advice is to treat the idea as a long shot.


  An impact and effort grid is often drawn as four boxes: quick wins, big bets, fill-ins,
  and time sinks to avoid. It's the fastest of these methods, and good enough for most
  backlogs.
