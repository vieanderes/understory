term: agent memory
aka:
  - long-term memory
  - persistent memory
short: What an AI system saves between conversations so it can use it again later.
explain: |
  A model forgets everything when the conversation ends. To remember a user's preferences
  or a lesson learnt, the system has to write them somewhere and read them back.

  There are kinds. Semantic memory holds facts. Episodic memory holds what happened.
  Procedural memory holds how to do things. Short-term memory is the context window itself.

  The hard part is the write policy. Save everything, and memory fills with duplicates and
  stale facts. Decide when to add, update, merge and forget, and date every entry.
analogy: A notebook a nurse leaves for the next shift. Useful only if it's kept short, current and true.
usage: Agent memory still says they use the old API, so add expiry to the write policy.
