summary: >-
  A levelled task is one project delivered in four stages, usually within 90 minutes. Level
  1 asks for basic operations, level 2 for processing such as scans or reports, level 3 for a
  harder feature, and level 4 for a change that forces you to refactor while every earlier
  test keeps passing. You see each level only after passing the one before.


  That structure changes what good code means. Speed and cleverness matter less than a data
  model that absorbs new requirements. The classic example is an in-memory database of
  records and fields: a `Map` from key to a `Map` from field to an entry object gives
  constant-time reads and writes, sorted scans in a few lines, and room for later facts such
  as an expiry time.


  Most candidates do not finish, and the score is the share of tests passed across the levels
  reached. So bank each level before starting the next, keep the design small, and route
  every read through one place so the next rule changes one method instead of five.
remember:
  - >-
    A levelled task scores tests passed across the levels you reach, so a clean level 3 beats a
    broken level 4.
  - >-
    Design level 1 so later levels extend it: a small, clear model with room for more facts per
    value, and nothing built for requirements you cannot see yet.
  - >-
    A `Map` from key to a `Map` from field to `{ value }` gives O(1) set, get and delete, and
    never splits strings to find a field.
  - >-
    Store each value in an entry object, so an expiry time or a version can be added without
    changing callers.
  - >-
    Route every read through one helper, so a new rule such as expiry changes one place.
  - >-
    Scans sort by field name and format each item exactly as the statement shows, because the
    tests compare strings exactly.
  - >-
    Copy every example from the statement into your own checks, word for word, and run them
    after each level.
sections:
  - title: A 90-minute playbook
    body: |-
      A plan that protects banked points while leaving time for the refactor level:

      ```text
      0:00  read level 1 twice; list every method, return type and format
      0:05  pick the data model; write the class shell with every method stubbed
      0:10  level 1: implement, run the given tests, add edge cases (missing key, repeat set)
      0:25  level 2: implement through one read helper; test sorting and formats
      0:45  level 3: extend the entry object and the helper; keep level 1 and 2 green
      1:10  level 4: the refactor; change shape first, run old tests, then add behaviour
      1:25  stop adding; make sure the file runs and every passing level still passes
      ```

      Three rules matter more than the timings. **Never move on with a failing test** in the
      current level, since later levels build on it and the next level stays locked anyway.
      **Run all earlier tests after every change**, because a regression in level 1 costs
      points you had already earned. **Read the statement's return values literally**: a
      method that returns `"true"` as a string, or an empty string for "not found", fails if
      you return `true` or `null`.

      An ideal level 1 looks small. A `Map` of `Map`s, entry objects, one private helper that
      finds an entry, methods of three to eight lines each, no validation the statement does
      not ask for, and no classes or abstractions for levels you have not seen.
  - title: Design choices that survive four levels
    body: |-
      Level 4 is unknown when you write level 1, so you cannot design for it directly. You can
      design so that the likely kinds of change are cheap:

      - **New facts about a value** (expiry, version, owner, size): an entry object gives them
        a home. A bare string forces a change to every read.
      - **New rules about visibility** (expired, deleted, locked): one helper that returns the
        live entry, or the live fields of a record, means the rule lives in one place.
      - **New ways to list data** (by prefix, top N, by value): keep records keyed by their
        natural key and derive lists when asked, rather than maintaining extra indexes early.
      - **New inputs on every call** (a timestamp, a user): route calls through a small number
        of methods so a new parameter threads through quickly.

      Two habits help as well. Delete a record when its last field goes, so "does this key
      exist" stays a single `has`. And keep formatting in one small function, such as a
      `format(field, value)` helper, so an output format change is one edit.

      What to avoid is the opposite mistake: building a generic engine at level 1. An event
      log, an abstract storage interface or a query language costs time you need for level 3,
      and the unseen level 4 rarely matches what you guessed.
  - title: Checking the statement's examples as a script
    body: |-
      Levelled tasks come with tests, but writing the statement's examples as a script of
      calls catches format slips before you submit, and makes regressions visible the moment
      they happen. One row per call keeps it short.

      ```ts
      import assert from 'node:assert/strict';
      import { Database } from './database';

      // One row per call: the method, its arguments, and the exact result the statement shows.
      // Paste every example from the statement in here, word for word, and run it after each level.
      type Step = [method: keyof Database, args: string[], expected: unknown];

      const level1And2: Step[] = [
        ['set', ['book1', 'title', 'Dune'], undefined],
        ['set', ['book1', 'year', '1965'], undefined],
        ['get', ['book1', 'title'], 'Dune'],
        ['get', ['book1', 'isbn'], null],
        ['delete', ['book1', 'year'], true],
        ['delete', ['book1', 'year'], false],
        ['scan', ['book1'], ['title(Dune)']],
        ['scanByPrefix', ['book1', 'ti'], ['title(Dune)']],
        ['scan', ['book9'], []],
      ];

      function play(steps: Step[]): void {
        const db = new Database();
        steps.forEach(([method, args, expected], i) => {
          const actual = (db[method] as (...a: string[]) => unknown)(...args);
          assert.deepEqual(actual, expected, `step ${i + 1}: ${String(method)}(${args.join(', ')})`);
        });
      }

      play(level1And2);
      console.log('all steps match');
      ```

      When a row fails, the message names the step and the call, so you can see at once which
      rule broke. Keep adding rows as each level unlocks, and never delete the old ones: they
      are your guarantee that the refactor at level 4 kept everything else working.
  - title: Complexity, and when to change the structure
    body: |-
      With a map of maps, `set`, `get` and `delete` are O(1) on average. A scan of a record
      with f fields is O(f) to filter plus O(k log k) to sort the k fields that match. For
      the sizes these tasks use, that is fast enough, and it is the answer to give first.

      If an interviewer pushes on very large records scanned very often, name the options and
      their costs:

      - **Keep the field names sorted** in an array beside the map. Scans become a binary
        search for the prefix plus a walk, but each insert becomes O(f) to keep the order.
      - **Cache the sorted list** and invalidate it on every write to that record. Cheap when
        reads far outnumber writes.
      - **A trie** of field names gives prefix lookups proportional to the prefix length plus
        the results, at the cost of more memory and more code.

      The senior answer is to say the simple structure is right until measurements say
      otherwise, and to know which of these you would reach for if they did.
pitfalls:
  - >-
    **A flat map keyed by `key.field`.** Splitting on the separator breaks when a field contains
    it, and a scan walks every field in the database. Use a map of maps.
  - >-
    **`set` that replaces the whole record.** Writing a new `Map` on every set loses the other
    fields. Get or create the record, then set the one field.
  - >-
    **Storing bare strings.** Level 3 then has to change the stored shape and every read. Store
    `{ value }` from the start.
  - >-
    **Leaving empty records behind.** A key with no fields then shows up as existing. Delete the
    record when its last field is removed.
  - >-
    **Returning the wrong kind of "nothing".** `null`, `undefined`, `""`, `[]` and `"false"` are
    all different to a test. Return exactly what the statement names.
  - >-
    **Building for level 4 at level 1.** Generic engines and extra indexes cost time you need
    later and rarely match the real level 4. Keep the model small and the reads in one place.
interview:
  - question: >-
      Why did you choose a map of maps rather than a single flat map?
    answer: >-
      Because the data has two levels, records and their fields, and the operations work at
      both. A map of maps gives O(1) access to a record and then to a field, and a scan only
      touches the fields of one record. A flat map keyed by `key.field` needs string splitting
      to recover the parts, which breaks when a name contains the separator, and a scan has to
      walk every field in the store. The map of maps also makes "delete the record when its
      last field goes" a single `delete`. The trade-off is slightly more code for creating and
      cleaning up inner maps, which a small helper handles.
  - question: >-
      How do you design level 1 when you cannot see level 4?
    answer: >-
      I design for the kinds of change that usually come, not for a guess at the specific one.
      Later levels typically add facts about each value, rules about which values are visible,
      new ways of listing data, and a new input such as a timestamp on every call. So I store
      each value in an entry object, route every read through one helper, keep formatting in
      one function, and keep the method count small. What I avoid is building speculative
      infrastructure, because it costs time I need for level 3 and rarely matches the real
      level 4. The goal is that each new level changes one or two places.
  - question: >-
      You are 60 minutes in and one level 3 test keeps failing. What do you do?
    answer: >-
      I give it a short, fixed time box, about five minutes, and read the failing test's
      expected value against the statement word for word. At this stage the cause is usually a
      boundary, such as `<` versus `<=` at an expiry moment, or a format detail, such as a
      string `"true"` or an empty result. If the box runs out, I make sure levels 1 and 2 still
      pass and the file runs, because those points are banked, and I decide whether the
      remaining level 3 tests are within reach. A partially passing level 3 still scores. What
      I avoid is a big rewrite late in the task, which risks the earlier levels.
  - question: >-
      What is the complexity of your prefix scan, and could it be faster?
    answer: >-
      For a record with f fields, filtering by prefix is O(f) and sorting the k matches is O(k
      log k), so O(f + k log k) per scan, with O(1) for set, get and delete. That is the right
      default, because writes stay cheap and the code is short. If scans on very large records
      dominated, I would keep a sorted array of field names beside the map, so a scan becomes a
      binary search plus a walk over the matches, at the cost of O(f) inserts. A cached sorted
      list invalidated on write suits read-heavy use, and a trie suits many different prefixes.
      I would only switch after measuring.
