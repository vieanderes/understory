summary: >-
  Small style sheets stay tidy by themselves. Large ones don't. Once hundreds of rules share
  one page, every override needs a longer selector than the rule it beats, and nobody dares
  delete anything. **CSS architecture** is how you organise rules so a large style sheet stays
  predictable.


  Modern CSS has built-in tools for it. **Cascade layers** let you decide which group of rules
  wins before specificity is even counted, so a one-class utility can beat a component with an
  ID. **Nesting** keeps a component's rules together in one block. `:has()` lets a rule react to
  what an element contains, which used to need JavaScript. **Logical properties** describe
  sides by the direction of the text, so one rule serves English and Arabic.


  Reach for layers as soon as a site mixes a reset, third-party CSS, components and
  utilities. Use nesting for states and small variations, not for deep trees. Use `:has()` when
  the style depends on content. And write logical properties by default in new code, because
  they cost nothing in left-to-right pages and save a rewrite later.
remember:
  - The cascade compares origin and importance, then the style attribute, then layers, then specificity, then source order.
  - For normal rules the layer named last wins, and rules outside every layer beat all layers.
  - For `!important` rules the order flips, so the earliest layer wins and layered importance beats unlayered importance.
  - A layer's position is fixed the first time its name appears, so declare the order in one `@layer` statement at the top.
  - Inside a nested rule, `&` stands for the outer selector, and a nested selector without `&` means a descendant.
  - '`:has()` styles an element by what it contains or what follows it, and it counts as specific as its most specific argument.'
  - Logical properties follow the text, so `inline` runs along a line, `block` runs down the page, and `start` is where a line begins.
  - Unlike Sass, native nesting can't glue text onto `&`, so `&-title` doesn't make `.card-title`.
sections:
  - title: Where layers sit in the cascade
    body: |-
      When two declarations set the same property on the same element, the cascade decides in
      a fixed order of questions. It stops at the first one that picks a winner:

      1. **Origin and importance**: browser defaults, the reader's settings, or your CSS, and
         whether a declaration is `!important`.
      2. **The style attribute**: a `style="..."` on the element beats your selectors.
      3. **Layers**: which layer the rule is in.
      4. **Specificity**: the selector's score.
      5. **Source order**: the later rule wins.

      So layers come before specificity. We tested this in Chromium with
      `@layer base, components;`. An ID rule inside `components` lost to a plain `p` rule
      outside any layer. Unlayered rules act like one last layer that beats all the others.

      Layers can contain layers, named with a dot:

      ```css
      @layer reset, base, components, utilities;
      @layer components.buttons { .button { padding: 8px 16px; } }
      @layer components.cards { .card { padding: 16px; } }
      ```

      Rules written straight inside `components`, outside its sub-layers, beat both
      sub-layers, the same way unlayered rules beat layers.

      `!important` turns the layer order around:

      ```css
      @layer base, components;
      @layer base { .note { color: blue !important; } }
      @layer components { .note { color: red !important; } }
      .note { color: orange !important; }
      ```

      The note came out blue. For important declarations, the earliest layer wins, and any
      layered important declaration beats an unlayered one. That lets a reset protect a value
      that later code must never override, such as hiding elements with the `hidden`
      attribute.

      One more keyword: `revert-layer` as a value undoes the current layer's declaration and
      uses what earlier layers said. Our test got the `base` colour back in a `theme` layer.
  - title: Nesting without surprises
    body: |-
      Nesting is shorthand. The browser turns each nested rule back into a full selector, and
      the result must be one you could have written by hand.

      ```css
      .card {
        padding: 8px;
        .title { font-size: 20px; }
        &:hover { outline: 2px solid teal; }
        .theme-dark & { color: white; }
        @media (min-width: 600px) {
          padding: 24px;
          .title { font-size: 28px; }
        }
      }
      ```

      Line by line, that means:

      - `.title` with no `&` is a descendant: `.card .title`.
      - `&:hover` attaches to the card itself: `.card:hover`.
      - `.theme-dark &` puts the card after something else: `.theme-dark .card`, a card inside
        a dark area.
      - A media query can nest too. Declarations directly inside it apply to `.card` on wider
        screens.

      We ran this in Chromium: at 800px wide the card had 24px of padding and a 28px title, and
      at 500px wide it had 8px and 20px.

      If you've used Sass, the tool that compiles an extended CSS into plain CSS, one habit
      breaks. In Sass, `&-title` inside `.card` makes `.card-title`. Native CSS nesting treats
      `&` as a whole selector, not as text to glue onto, so `&-title` isn't valid. Chromium
      dropped the rule entirely.

      Keep nesting shallow, about one or two levels. Each level adds a descendant step, and
      deep nesting builds long, specific selectors, which is what layers were meant to end.
  - title: What :has() makes possible
    body: |-
      Before `:has()`, CSS could style an element only by looking at its ancestors and the
      siblings before it. `:has()` looks the other way: down into its children, or ahead at the
      siblings after it.

      Style a form while any field in it fails validation:

      ```css
      form:has(input:invalid) { border-left: 4px solid crimson; }
      ```

      `:invalid` matches a field whose value breaks the rules set in the HTML, such as a
      `required` field that's empty. In our test, a form with an empty required input got the
      border, and a form without one didn't.

      Style a heading by what comes next:

      ```css
      h2:has(+ p) { margin-bottom: 4px; }
      ```

      `+ p` means the very next sibling is a paragraph. Only headings followed straight away by
      a paragraph get the tighter margin.

      Style a list once it's long:

      ```css
      ul:has(> li:nth-child(4)) { display: grid; grid-template-columns: 1fr 1fr; }
      ```

      `:nth-child(4)` matches an element that's the fourth child of its parent. So a list with
      a fourth item splits into two columns. In our test, a four-item list matched and a
      three-item list didn't.

      Three limits to know. The argument can't contain another `:has()` or a pseudo-element
      such as `::before`. It's unforgiving: one invalid selector in its list, and Chromium
      threw away the whole rule. And its specificity is that of its most specific argument, so
      `.card:has(#hero)` scores like a class plus an ID, which beat `.card.card.card` in our
      test.
  - title: Logical properties in every direction
    body: |-
      Logical properties name sides by how text flows, not by the screen. Two words do the
      work. **Inline** is the direction a line of text runs. **Block** is the direction lines
      stack. Each has a `start` and an `end`.

      In English, inline start is the left and block start is the top. In Arabic, with
      `dir="rtl"`, inline start is the right. Some Chinese and Japanese layouts use vertical
      text, set with `writing-mode: vertical-rl`, and then inline runs down the page and block
      runs from right to left. We tested vertical text in Chromium. There,
      `margin-inline-start: 48px` set the top margin, `padding-block: 8px` set the left and
      right padding, and `inline-size: 100px` set the height.

      The useful set:

      - `margin-inline`, `padding-block` and their `-start` and `-end` forms replace
        left, right, top and bottom.
      - `inline-size` and `block-size` replace `width` and `height`.
      - `inset-inline-start` replaces `left` for positioned boxes. In a right-to-left box, an
        absolute child with `inset-inline-start: 0` sat against the right edge.
      - `text-align: start` aligns text to where lines begin.
      - `border-start-start-radius` rounds the corner where block start meets inline start.

      Flexbox and grid are logical already. In a right-to-left page, the first flex item sat on
      the right with no extra CSS. So a right-to-left version of a page often needs only its
      remaining physical properties swapped.
pitfalls:
  - '**Declaring the layer order too late.** A layer''s position is fixed the first time its name appears, so an `@layer a, b;` statement after the layer blocks changes nothing. Put the order statement at the very top of the first style sheet.'
  - '**Leaving some CSS unlayered by accident.** Unlayered rules beat every layer, so one forgotten file quietly wins every clash. Put third-party CSS in its own early layer, and keep your own rules in layers too.'
  - '**Expecting Sass nesting.** `&-title` inside `.card` doesn''t make `.card-title` in native CSS, and the rule is dropped. Write the full class name as its own rule.'
  - '**Nesting deeply.** Five levels of nesting build a selector with five parts, high specificity and tight coupling to the HTML. Keep it to one or two levels, mostly for `&:hover`, `&:focus-visible` and media queries.'
  - '**One bad selector inside `:has()`.** The whole rule is thrown away, silently. Check the selector in the browser''s developer tools, which show a rule only if it was accepted.'
  - '**Mixing physical and logical twins.** `margin-left: 0` after `margin-inline-start: 16px` sets the same side in left-to-right text, and the later one wins. Pick logical properties for a component and use them throughout.'
interview:
  - question: What problem do cascade layers solve, and how do they interact with specificity?
    answer: >-
      Cascade layers let you decide which group of rules wins before specificity is counted,
      which ends specificity wars. On a big site, overriding a component often means writing
      a longer selector, and then the next override needs a longer one still. With layers,
      I declare an order once, for example `@layer reset, base, components, utilities;`.
      Between layers, the later layer wins whatever the selectors, so a one-class utility
      beats a component rule with an ID. Specificity then only matters inside a layer. Two
      things to watch. Unlayered rules beat all layers, so everything should be layered,
      including third-party CSS. And `!important` reverses the order, so the earliest layer
      wins for important declarations. That reversal is useful for a reset that must not be
      overridden.
  - question: Give me a real use for `:has()`.
    answer: >-
      `:has()` styles an element based on its contents, so a component can react to what's
      inside it without extra classes or JavaScript. A card that contains an image can switch
      to a two-column layout with `.card:has(img)`. A form can show a warning border while
      any field is invalid with `form:has(input:invalid)`. A label can be styled when its
      checkbox is ticked. Before `:has()`, each of these needed a script to add a class. I
      keep the argument narrow, like `.card:has(> img)`, because the browser has to recheck
      it as the page changes. Its specificity equals its most specific argument, so `:has(#id)`
      weighs as much as an ID. It's supported in all current major browsers, so it's safe for
      new work.
  - question: How do you make a layout work for right-to-left languages?
    answer: >-
      I use logical properties, so sides follow the text direction instead of the screen. The
      page sets `dir="rtl"` on the `html` element for Arabic or Hebrew. Then
      `margin-inline-start` means the left in English and the right in Arabic, and
      `padding-block` means top and bottom in both. Flexbox and grid already follow the
      direction, so a flex row reverses on its own. Mirroring every left and right by hand in
      a separate style sheet is the old approach and drifts out of step. Some things
      shouldn't flip, such as a play icon or a phone number, so I check those individually.
      The trade-off is habit: logical names are longer and less familiar at first.
  - question: How is native CSS nesting different from Sass nesting?
    answer: >-
      Native nesting runs in the browser, and `&` is a real selector, not text. That has two
      effects. First, you can't build class names by concatenation: Sass turns `&-title`
      into `.card-title`, while native CSS rejects it. Second, `&` takes the specificity of
      the whole outer selector list, the way `:is()` does. Inside `.card, #featured`, a
      nested `& .title` weighs as much as an ID, even on a plain card, so it beats a two-class
      selector. Sass instead writes out each combination separately.
      Native nesting also accepts nested media queries directly inside a rule. The advantage
      is no build step. The trade-off is that you lose Sass tricks like concatenation, so
      naming patterns built on them need full class names instead.
