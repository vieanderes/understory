term: steelman
aka:
  - steelmanning
  - steel man
short: Stating the strongest honest version of a view you disagree with, before arguing against it.
explain: |
  It's tempting to reject the other option by describing its weakest form. That wins the
  meeting and loses the lesson.

  Instead, argue the rejected option as well as its best supporter would. If your choice
  still wins, your reasoning is sound. If it doesn't, you've found out before writing the code.

  The trap is steelmanning a straw man: listing a weak objection and calling it the strongest.
  Ask someone who favours the other option whether you got it right.
analogy: Sparring with a partner who hits properly. Going gently feels nice and teaches nothing.
usage: Before we pick the queue, steelman the cron job; it's simpler and might be enough.
related:
  - pre-mortem
  - trade-off
  - design-doc
level: 2
lessons:
