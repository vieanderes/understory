term: ports and adapters
aka:
  - hexagonal architecture
short: An architecture where the core logic defines the interfaces it needs and outside services plug into them.
explain: |
  Your rules shouldn't care which database, email provider or model you use. So the core
  declares what it needs, a **port**: "something that can save an order". Each real service
  gets an **adapter** that fits that port.

  Swap the database and you write a new adapter; the core doesn't change. In tests, a small
  in-memory adapter replaces the real one. The dependency always points inward: adapters
  know the core, never the other way round.
analogy: A camera body with a lens mount. The body defines the mount, any lens built for it clicks on, and the body never changes.
usage: With ports and adapters, the model call is one adapter, so switching providers takes a day.
related:
