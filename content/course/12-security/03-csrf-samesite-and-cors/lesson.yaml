deepDive: >-
  The "domain you'd buy" is the registrable domain: one label plus a public suffix such as
  `.com` or `.co.uk`. Browsers read the Public Suffix List to find it. So `a.github.io` and
  `b.github.io` are different sites, because `github.io` is on that list.


  A server can also check the `Origin` header, which the browser sets on a POST and a page
  can't change. A POST whose origin isn't yours is refused. OWASP suggests it alongside
  tokens, not instead of them.


  Chrome gives a fresh cookie with no `SameSite` a two-minute grace, during which a
  cross-site POST still carries it. It exists for old sign-in flows, and it's one more
  reason to set `SameSite` yourself.


  Frameworks usually handle tokens for you. Next.js Server Actions check the `Origin`
  header, and form libraries add hidden token fields.
