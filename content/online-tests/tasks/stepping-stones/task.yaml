id: stepping-stones
title: SteppingStones
topic: dynamic-programming
difficulty: hard
type: algorithmic
recommendedMinutes: 40
signature:
  params:
    - { name: A, type: "int[]" }
    - { name: K, type: int }
  returns: int
statement: |-
  A path crosses a pond on N stones, numbered from 0 to N − 1. Stone I carries A[I]
  points, which may be negative. You start on stone 0 and must finish on stone N − 1.
  Each jump moves forward by 1 to K stones.

  Your total is the sum of the points on every stone you land on, including the first
  and the last.

  Write a function:

  {{signature}}

  that, given an array A of N integers and an integer K, returns the highest total you
  can reach. If N = 1, the function should return A[0].

  For example, given A = [1, −2, 0, 9, −1, −2] and K = 3, the function should return 8.
  The route lands on stones 0, 2, 3 and 5.

  Given A = [−4, −6] and K = 5, the function should return −10.

  Write an **efficient** algorithm for the following assumptions:

  - N and K are integers within the range [1..100,000];
  - each element of array A is an integer within the range [−10,000..10,000].
examples:
  - { args: [[1, -2, 0, 9, -1, -2], 3], expected: 8 }
  - { args: [[-4, -6], 5], expected: -10 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: a single stone
    group: correctness
    cases:
      - { args: [[-5], 1], expected: -5 }
      - { args: [[7], 3], expected: 7 }
  - name: negative_only
    description: all stones negative, jump as far as you can
    group: correctness
    cases:
      - { args: [[-1, -1, -1, -1, -1, -1, -1], 3], expected: -3 }
  - name: simple
    description: equal positive stones, K longer than the path
    group: correctness
    cases:
      - { args: [[2, 2, 2, 2], 3], expected: 8 }
      - { args: [[5, -100, -100, 5], 100000], expected: 10 }
  - name: sorted
    description: ascending and descending stones
    group: correctness
    cases:
      - { args: [[-5, -4, -3, -2, -1, 0, 1], 2], expected: -8 }
      - { args: [[10, 5, 0, -5, -10], 2], expected: 5 }
  - name: extreme_min_max_value
    description: a big gain behind a wall of losses, duplicates in the window
    group: correctness
    cases:
      - { args: [[0, -10000, -10000, -10000, 10000, 0], 3], expected: 0 }
      - { args: [[0, -10000, -10000, -10000, 10000, 0], 4], expected: 10000 }
      - { args: [[1, 3, 3, -7, 3, 1], 2], expected: 11 }
  - name: small_random
    description: random stones, N = 400
    group: correctness
    cases:
      - generate: { seed: 11, args: [{ kind: ints, n: 400, min: -100, max: 100 }, { kind: value, value: 6 }] }
      - generate: { seed: 12, args: [{ kind: ints, n: 200, min: -10000, max: 10000 }, { kind: int, min: 1, max: 20 }] }
  - name: medium_random
    description: random stones, N = 3,000
    group: correctness
    cases:
      - generate: { seed: 13, args: [{ kind: ints, n: 3000, min: -10000, max: 10000 }, { kind: value, value: 100 }] }
  - name: large_random
    description: random stones, long jumps, N = 100,000, K = 50,000
    group: performance
    cases:
      - generate: { seed: 5, args: [{ kind: ints, n: 100000, min: -10000, max: 10000 }, { kind: value, value: 50000 }] }
  - name: large_short_jumps
    description: random stones, short jumps, N = 100,000, K = 3
    group: performance
    cases:
      - generate: { seed: 17, args: [{ kind: ints, n: 100000, min: -10000, max: 10000 }, { kind: value, value: 3 }] }
  - name: extreme_large
    description: all stones at the minimum, N = K = 100,000
    group: performance
    cases:
      - generate: { seed: 1, args: [{ kind: constant, n: 100000, value: -10000 }, { kind: value, value: 100000 }] }
