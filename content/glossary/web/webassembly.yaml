term: WebAssembly
aka:
  - Wasm
short: A compact binary format browsers run beside JavaScript, so code compiled from other languages runs in a page.
explain: |
  JavaScript is the browser's only language. But some work, such as video encoding or image
  filters, already exists in C++ or Rust. Rewritten in JavaScript, it runs slowly.

  Compile that code to this format and the browser runs it at close to native speed. It stays in
  the same sandbox as the page. JavaScript loads the module and calls its functions.

  It is not a faster way to build ordinary UI. It can't touch the page directly, every call
  across the boundary costs something, and the download is bigger. Use it for heavy
  computation, and measure the gain.
analogy: A guest chef brought in for one dish. Brilliant at it, but the house cooks still run the restaurant.
usage: The image filter is a C library, so we'll compile it to WebAssembly instead of porting it.
related:
  - runtime
  - cpu-bound
level: 3
lessons:
