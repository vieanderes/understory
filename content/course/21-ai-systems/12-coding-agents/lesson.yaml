id: aisys.coding-agents
title: Engineering with coding agents
objective: "Work with agentic coding tools in a team: give them context files, keep diffs small, use tests and linters as the feedback loop, and own what ships."
level: essential
minutes: 9
concepts: [aisys.agent-context-files, aisys.agent-feedback-loops, aisys.owning-generated-code]
prerequisites: [ai.reviewing-ai-code, tooling.working-with-ai]
opening:
  text: >-
    You'll set up a repository where a coding agent works well, with changes small enough
    to trust. And you'll have a clear answer when an interviewer asks about these tools.

steps:
  - type: prose
    id: context-files
    body: |-
      A **context file** is a README for agents. `AGENTS.md` is an open format many tools
      read, and Claude Code reads `CLAUDE.md` or `AGENTS.md`.

      Put in what a new colleague needs on day one: the build, test and lint commands, the
      conventions, where things live, the rules. Keep it short and true. When the agent
      makes the same mistake twice, add a line.

  - type: multiple-choice
    id: pick-context-file
    concept: aisys.agent-context-files
    difficulty: 1
    question: A coding agent keeps running `npm test`, but your repo uses `pnpm`. What's the lasting fix?
    choices:
      - text: Write the commands in the repo's `AGENTS.md`
        correct: true
        feedback: >-
          Yes. Every session reads it, so you correct it once.
      - text: Correct it in chat each session
        feedback: >-
          That works for one session. The next one starts without your correction.
      - text: Switch the project to npm
        feedback: >-
          Changing your tooling to suit a guess is backwards. Tell the agent instead.

  - type: parsons
    id: arrange-small-change
    concept: aisys.agent-feedback-loops
    difficulty: 2
    language: bash
    prompt: Arrange one small, agent-assisted bug fix, from branch to commit. One block doesn't belong.
    blocks:
      - id: branch
        code: git switch -c round-totals
        subgoal: Start a small branch
      - id: red
        code: pnpm test src/price.test.ts   # your new test fails first
        subgoal: Prove the bug
      - id: ask
        code: '# ask the agent for the smallest change that passes'
        subgoal: Delegate the edit
      - id: checks
        code: pnpm test && pnpm lint && pnpm typecheck
        subgoal: Let the checks judge
      - id: read
        code: git diff
        subgoal: Read every line
      - id: commit
        code: git commit -am "Round totals half-up"
        subgoal: Commit the change
    distractors:
      - id: push-first
        code: git commit -am "wip" && git push
        feedback: >-
          That ships before any check or review. The agent's work goes out unread.

  - type: prose
    id: feedback-loops
    body: |-
      An agent is fast, and now and then confidently wrong. So give it **feedback loops** it
      can run itself: tests, type checks, linters. Each one catches a mistake in seconds,
      not in review.

      Keep diffs small: one task, one branch, a change you can read in full. For bigger
      work, ask for a plan first and review that.

  - type: multiple-choice
    id: pick-huge-diff
    concept: aisys.agent-feedback-loops
    difficulty: 2
    question: For a one-line bug, an agent changed 1,400 lines in 30 files. Tests pass. What now?
    choices:
      - text: Discard it and ask for the smallest fix
        correct: true
        feedback: >-
          Yes. Nobody can review 1,400 lines well. Narrow the task and try again.
      - text: Merge it, since the tests pass
        feedback: >-
          Tests only cover what they check. The other 1,399 lines are unreviewed changes.
      - text: Review all 1,400 lines carefully
        feedback: >-
          You could, but it'd take hours, and it's a change nobody asked for.

  - type: ai-review
    id: review-flaky-sleep
    concept: aisys.owning-generated-code
    difficulty: 4
    language: ts
    request: Fix this flaky test. It fails about one run in ten on CI.
    flawClass: race
    code: |
      test('saves the draft after typing stops', async () => {
        const save = vi.fn();
        const editor = createEditor({ onSave: save, debounceMs: 300 });
        editor.type('Hello');
        await new Promise((resolve) => setTimeout(resolve, 350)); // was 310
        expect(save).toHaveBeenCalledWith('Hello');
      });
    prompt: >-
      The agent raised the wait from 310 to 350 ms, and the test passed 20 runs locally.
      You're about to approve it. Tap the line at fault.
    lines: [5]
    reasons:
      - text: It still races the real clock
        correct: true
        feedback: >-
          Right. Slow CI can still lose. Fake timers let the test move the clock.
      - text: '`vi.fn()` can''t record arguments'
        feedback: >-
          A mock function records every call with its arguments. That part works.
      - text: 'The debounce should be 350 ms too'
        feedback: >-
          Changing the product to suit the test hides the problem. The test's timing is the bug.
    fix: |
      vi.useFakeTimers();
      editor.type('Hello');
      vi.advanceTimersByTime(300);
      expect(save).toHaveBeenCalledWith('Hello');

  - type: prose
    id: owning-it
    body: |-
      Whoever merges a change **owns** it: its correctness, its tests, its design. "The
      agent wrote it" is never an answer in an incident review.

      Watch for one habit in particular. Told to get the checks green, an agent may weaken
      the checks instead: a skipped test, a looser assertion, a lint rule switched off. Read
      the diff of the tests as closely as the diff of the code.

  - type: ai-review
    id: review-weakened-test
    concept: aisys.owning-generated-code
    difficulty: 3
    language: ts
    request: The rounding test fails. Fix it.
    flawClass: logic
    code: |
      // price.test.ts, after the agent's change
      import { roundTotal } from './price';

      test('rounds totals half-up', () => {
        expect(roundTotal(10.245)).toBeCloseTo(10.25, 1);
      });

      test('keeps whole totals', () => {
        expect(roundTotal(12)).toBe(12);
      });
    prompt: >-
      The agent replied "Fixed, all 214 tests pass". Its diff touched only this file.
      `roundTotal(10.245)` still returns `10.24`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: It loosened the assertion instead of fixing the code
        correct: true
        feedback: >-
          Yes. Within 0.05 now counts as right, so the bug passes. Fix `roundTotal` instead.
      - text: '`toBeCloseTo` doesn''t exist in Vitest'
        feedback: >-
          It exists, and it's right for floating-point results. Here it hides a real bug.
      - text: The whole-number test should go too
        feedback: >-
          That test is fine. The first one was weakened to pass.
    fix: |
      test('rounds totals half-up', () => {
        expect(roundTotal(10.245)).toBe(10.25);   // keep the test, fix price.ts
      });

  - type: explain-back
    id: explain-small-diffs
    concept: aisys.agent-feedback-loops
    difficulty: 3
    prompt: >-
      Why do small diffs and fast checks matter more when an agent writes the code than
      when a colleague does?
    rubric:
      - An agent produces code faster than anyone can review it, and it can be confidently wrong.
      - Fast tests, types and linters that the agent runs catch its mistakes before a person looks.
      - A small diff is one a reviewer can read in full, which is what ownership requires.
    modelAnswer: >-
      An agent writes far faster than I can read. It sounds as sure when it's wrong as when
      it's right. So the checks have to be automatic and quick, and the agent should run them
      after each change. Then I review what's left. A small diff keeps that review honest,
      because I can read every line I'm about to own.

recap:
  - Put commands, conventions and rules in a context file like `AGENTS.md`.
  - Keep each change small, tested first, and checked by tests, types and linters.
  - Read every line you merge, the tests included, because you own it.
recall:
  - id: card-context-file
    concept: aisys.agent-context-files
    front: What belongs in an `AGENTS.md` file?
    back: >-
      The build, test and lint commands, the conventions, where things live and the rules
      a new colleague would need.
  - id: card-when-to-add
    concept: aisys.agent-context-files
    front: When should you add a line to a repository's context file?
    back: >-
      When an agent makes the same mistake twice. Correct it once in the file, not in every
      chat.
  - id: card-feedback-loop
    concept: aisys.agent-feedback-loops
    front: Why should an agent run the tests, type checks and linters itself?
    back: >-
      They catch its mistakes in seconds, before a person spends time reviewing.
  - id: card-ownership
    concept: aisys.owning-generated-code
    front: Who owns a bug in code an agent wrote?
    back: >-
      Whoever merged it. Merging means taking on its correctness, tests and design.

