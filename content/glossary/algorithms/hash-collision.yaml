term: hash collision
aka: [collision, collisions]
short: Two different keys landing in the same slot of a lookup table.
explain: |
  A hash function squeezes endless possible keys into a fixed number of slots. Sooner or
  later two keys get the same slot. The table has to keep both and tell them apart.

  Chaining keeps a short list in each slot. Probing tries the next free slot. Either way,
  a few clashes cost almost nothing. When many keys pile into one slot, a lookup walks
  them one by one, and O(1) quietly becomes O(n).

  Real maps grow and rehash as they fill, which keeps clashes rare. A bad hash function, or
  keys chosen by an attacker, can still bring them back.
analogy: Two guests given the same coat hook. The cloakroom hangs both there and checks names when you collect.
example:
  language: python
  code: |
    buckets = [[] for _ in range(4)]

    def put(key, value):
        slot = hash(key) % len(buckets)
        buckets[slot].append((key, value))  # chaining: share the slot

    put("tea", 1)
    put("jam", 2)  # may land in the same slot as "tea"
usage: Lookups crawled because the custom hash only read the prefix, so every key was a hash collision.
related: [hash-map, hashing, time-complexity]
