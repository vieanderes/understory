term: object storage
aka: [blob storage, bucket, storage bucket]
short: A service that keeps whole files under flat keys, cheaply, durably and at any size.
explain: |
  User photos and documents don't belong on your server's disk, which vanishes on redeploy
  and isn't shared between servers. They don't belong in the database either, which slows
  down with large values.

  So they go in a separate service. You put a file under a key, like
  `avatars/7f3a.webp`, and get it back by that key. There are no real folders, only
  prefixes. Each object is written and replaced whole, never edited in place. Generate keys
  yourself rather than trusting the uploader's file name, or one person can overwrite
  another's file.
analogy: A left-luggage office. You hand over a bag, get a ticket, and use the ticket to get it back.
example:
  language: ts
  code: |
    const key = `uploads/${crypto.randomUUID()}.webp`;
    await storage.put(key, bytes, { contentType: 'image/webp' });
    const file = await storage.get(key);
usage: Don't write uploads to the container's disk; put them in object storage and keep only the key in the database.
related: [signed-url, cdn, stateless, managed-platform]
level: 2
lessons: [backend.files]
