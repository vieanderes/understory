approach: >-
  Let best[i] be the highest total of a route that ends on stone i. It is A[i] plus the
  largest best among the K stones before it. Computing that maximum by scanning is
  O(N · K). A deque of indices whose best values fall from front to back keeps the window
  maximum at the front, and every stone enters and leaves it once, so the whole pass is
  O(N).
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N and K both reach 100,000**. Looking back over K stones
      from each of N stones is up to 10,000,000,000 steps. That times out.

      Now the story. Note two rules: you must land on the last stone, and points can be
      negative, so skipping is not always free.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words at the top of the file. A clear line now makes the
      recurrence easy to see in the next step.
    code:
      ts: |-
        // Highest sum of stones landed on, from stone 0 to stone N - 1, jumping 1 to K ahead.
      python: |-
        # Highest sum of stones landed on, from stone 0 to stone N - 1, jumping 1 to K ahead.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - a single stone, where the answer is A[0];
      - all stones negative, so the best route jumps as far as it can;
      - K longer than the path;
      - K = 1, which forces every stone.
    input:
      - "([7], 1)"
      - "([-1, -1, -1, -1, -1], 2)"
      - "([2, 2, 2], 10)"
      - "([3, -5, 4], 1)"
  - kind: plan
    title: Find the recurrence first
    minutes: 3
    body: |-
      A route to stone i comes from one of the K stones before it. So the best total ending
      on i is A[i] plus the best of those K totals. That is a **dynamic programme**:
      best[0] = A[0], and the answer is best[N - 1].

      Do not try to be greedy: a big gain can sit behind a wall of losses.
  - kind: write
    title: Bank the O(N · K) version first
    minutes: 4
    body: |-
      Write the recurrence directly, with an inner loop over the window. It passes the
      correctness tests and gives you a reference for the fast version. Type it yourself:
      it is short, and it shows you found the recurrence.
    code:
      ts: |-
        // Highest sum of stones landed on, from stone 0 to stone N - 1, jumping 1 to K ahead.
        // best[i] = A[i] + max(best[i - K..i - 1]), scanned directly: O(N * K), slow.
        function solution(A: number[], K: number): number {
            const n = A.length;
            const best = new Array<number>(n);
            best[0] = A[0];
            for (let i = 1; i < n; i++) {
                let top = -Infinity;
                for (let j = Math.max(0, i - K); j < i; j++) {
                    if (best[j] > top) top = best[j];
                }
                best[i] = A[i] + top;
            }
            return best[n - 1];
        }
      python: |-
        # Highest sum of stones landed on, from stone 0 to stone N - 1, jumping 1 to K ahead.
        # best[i] = A[i] + max(best[i - K..i - 1]), scanned directly: O(N * K), slow.
        def solution(A, K):
            n = len(A)
            best = [0] * n
            best[0] = A[0]
            for i in range(1, n):
                best[i] = A[i] + max(best[max(0, i - K):i])
            return best[n - 1]
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Write down your four results: the fast
      version has to match them exactly.
    expect: >-
      Two OKs, then 7, -3, 6 and 2 for your cases.
  - kind: plan
    title: Keep the window maximum in a deque
    minutes: 4
    body: |-
      The inner loop recomputes a maximum over a window that only slides by one. A
      **monotonic deque** keeps it ready: indices whose best values fall from front to back.

      Before stone i, drop the front if it is out of the window. Read the front. After
      computing best[i], pop smaller values from the back, then push i.
  - kind: ask-ai
    title: Ask how to pop from the front cheaply
    minutes: 1
    body: |-
      JavaScript arrays have no fast pop from the front: shift() is O(N). Asking about
      the language is a good use of the assistant. It is narrow and it is not the
      algorithm.
    prompt: >-
      In TypeScript, I use an array as a queue and need O(1) removal from the front. What
      is the usual trick instead of shift()? One sentence and one line of code.
    expect: >-
      Keep a head index and move it forward instead of removing. In Python,
      collections.deque with popleft() does the same job.
  - kind: optimise
    title: Replace the inner loop with the deque
    minutes: 6
    body: |-
      Write this yourself: the deque is the idea the task is testing, so it is the one part
      never to delegate. Keep your test lines; they catch a front that leaves the window
      too late.
    code:
      ts: |-
        // Highest sum of stones landed on, from stone 0 to stone N - 1, jumping 1 to K ahead.
        // DP with a monotonic deque for the window maximum: O(N) time, O(N) space.
        function solution(A: number[], K: number): number {
          // best[i] is the highest total that ends on stone i: A[i] plus the best of the K
          // stones before it. A deque of indices, with best values falling from front to back,
          // keeps that maximum at the front, so each stone costs O(1) amortised: O(N).
          const n = A.length;
          const best = new Array<number>(n);
          best[0] = A[0]!;
          const window: number[] = [0];
          let head = 0;
          for (let i = 1; i < n; i++) {
            if (window[head]! < i - K) head += 1;
            best[i] = A[i]! + best[window[head]!]!;
            while (window.length > head && best[window[window.length - 1]!]! <= best[i]!) {
              window.pop();
            }
            window.push(i);
          }
          return best[n - 1]!;
        }
      python: |-
        # Highest sum of stones landed on, from stone 0 to stone N - 1, jumping 1 to K ahead.
        # DP with a monotonic deque for the window maximum: O(N) time, O(N) space.
        from collections import deque


        def solution(A, K):
            # best[i] is A[i] plus the best of the K stones before it. A deque of indices with
            # falling best values keeps that maximum at the front: O(N).
            n = len(A)
            best = [0] * n
            best[0] = A[0]
            window = deque([0])
            for i in range(1, n):
                if window[0] < i - K:
                    window.popleft()
                best[i] = A[i] + best[window[0]]
                while window and best[window[-1]] <= best[i]:
                    window.pop()
                window.append(i)
            return best[n - 1]
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write random inputs
    minutes: 2
    body: |-
      Random inputs are where a deque bug shows. Let the assistant produce them, then run
      each with the slow and the fast version and compare. Do not ask it for the answers.
    prompt: >-
      Give me 4 test input lines in the format ([1, -2, 0], 2): arrays of 12 to 20 random
      integers between -20 and 20, with K values of 1, 3, 5 and 25. Lines only, no answers
      and no code.
    expect: Four lines. The fast version returns the same value as the slow one on each.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only. The window bound (i - K) and the tie rule on the back are the
      two places a reviewer looks first.
    prompt: >-
      Review my current solution for off-by-one errors in the window, correctness with
      negative values, and time complexity. List any problems in one line each. Do not
      rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and the scratch slow version. Check the header comment states
      the complexity. Then submit.
