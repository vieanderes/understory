deepDive: >-
  **Reconciliation** is React's name for lining up the new elements with the old ones. It
  works from the top down, so a changed parent type resets everything below it: a counter
  inside a `<div>` that becomes a `<section>` starts again from zero.


  An index key is safe when the list never reorders, filters or inserts, and its rows hold
  no state. A static menu, say. Everywhere else it moves state between rows.


  Keys only need to be unique among siblings, not across the page. Two lists can both use
  `key={1}`.


  React warns about a missing key only in development. A production build says nothing, and
  quietly falls back to the index.
