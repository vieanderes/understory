summary: >-
  Python is a general-purpose language that runs a file from top to bottom, one statement at
  a time. It's the default language of AI work: model SDKs, data tools, notebooks and eval
  scripts all arrive in Python first. If you know JavaScript, most ideas carry over. What
  changes is the spelling, and a few rules that are stricter than JavaScript's.


  Three differences matter from the first line. Python is **dynamically but strongly
  typed**: a name can hold any type, but Python never converts types behind your back, so
  `"Age: " + 30` is an error, not `"Age: 30"`. A **name is a label on an object**, made by
  assigning to it, with no `let` or `const`. And **indentation is syntax**: the indented
  lines after a colon are the block, so layout decides what runs.


  f-strings are the everyday way to build text, the equivalent of template literals. They
  convert values for you, and a format after a colon controls decimals, padding and
  separators. Reach for them whenever text meets a number. Don't reach for `+` to glue text
  and values together: it only works when every piece is already a string.
remember:
  - Python is dynamically typed, so a name can hold any type, and strongly typed, so it never converts one type into another for you.
  - A name is a label bound to an object, and assignment binds the label; it never copies the object.
  - 'An f-string, `f"Total: {total:.2f}"`, converts values to text and formats them with the spec after the colon.'
  - Indentation is the block structure, so moving a line in or out changes what the program does.
  - An `if` or `for` block does not create a new scope, so a name assigned inside it is still visible after it.
  - '`True`, `False` and `None` are capitalised, and `None` plays the part of both `null` and `undefined`.'
  - '`==` never converts types, so `1 == "1"` is `False`, which makes it behave like JavaScript''s `===`.'
sections:
  - title: Names, objects and types
    body: |-
      Every value in Python is an **object**, even a number. An object has three things: a
      type, an identity and a value. A name is a label that points at an object.
      Assignment makes the label point somewhere; it never copies anything.

      ```python
      count = 3
      print(type(count))    # <class 'int'>
      count = "three"       # allowed: the label now points at a str
      print(type(count))    # <class 'str'>

      a = [1]
      b = a                 # a second label on the same list
      print(a is b)         # True
      b = b + [2]           # + builds a new list; b now points at it
      print(a, b)           # [1] [1, 2]
      ```

      The last two lines are the subtle part. `b = b + [2]` doesn't change the list that
      `a` names. It builds a new list and moves the label `b` onto it. Lesson 4 comes back
      to this, because it's the root of most "why did my list change" bugs.

      Coming from JavaScript, the model is familiar: JS variables also hold references to
      objects. What's missing is `const`. Python has no way to stop a name being rebound, so
      the convention is to write a constant in capitals, `MAX_RETRIES = 3`, and trust
      everyone to leave it alone. Type checkers, from lesson 13, can enforce it with
      `Final`.

      Python checks types while the program runs. JavaScript does too, but it quietly
      converts where Python refuses. `"3" + 4` is a `TypeError`, while `"3" * 4` is
      `"3333"`, because repeating text a whole number of times is well defined. When you do
      want a conversion, ask for it: `str(7)`, `int("42")`, `float("3.5")`. `int("3.5")`
      raises a `ValueError`, because that text isn't a whole number.
  - title: Strong typing and equality, compared with JavaScript
    body: |-
      JavaScript has two equality operators because `==` converts types before comparing.
      Python has one `==`, and it never converts between unrelated types. It behaves like
      `===` for text and numbers, with two differences worth knowing.

      ```python
      print(1 == "1")      # False: no conversion, like ===
      print(1 == 1.0)      # True: numbers compare by value across int and float
      print(True == 1)     # True: bool is a subclass of int
      print(True + True)   # 2
      print([1, 2] == [1, 2])  # True: lists compare by contents
      ```

      The last line is the big change. In JavaScript, `[1, 2] === [1, 2]` is `false`,
      because it compares references. Python's `==` compares values, item by item, for
      lists, tuples, dicts and sets. To ask "the same object?", Python has a separate
      operator, `is`, which lesson 4 covers.

      `bool` being a kind of `int` is an old design choice. It means `sum([True, False,
      True])` is `2`, a handy way to count matches. It also means a dict can't hold both
      `1` and `True` as separate keys, since they're equal and hash the same.

      Strong typing also applies to comparisons. `3 < "4"` is a `TypeError` in Python,
      where JavaScript converts and answers `true`. You find the bug on the line that has
      it, not three functions later.
  - title: The format spec inside an f-string
    body: |-
      After the colon in `{value:spec}` comes a small language. Its parts go in a fixed
      order: fill and alignment, sign, width, thousands separator, precision, then type.
      You rarely need more than two at a time.

      ```python
      total = 1234567.891
      print(f"{total:,.2f}")        # 1,234,567.89
      print(f"[{'tea':>6}]")        # [   tea]
      print(f"[{'tea':*^9}]")       # [***tea***]
      print(f"{0.256:.1%}")         # 25.6%
      print(f"{42:05d}")            # 00042
      print(f"{-3:+d} {3:+d}")      # -3 +3

      name = "Ana"
      print(f"{name!r}")            # 'Ana', the repr, with quotes
      print(f"{name=}")             # name='Ana', handy while debugging

      width = 8
      print(f"[{3.14159:{width}.2f}]")  # [    3.14], the width comes from a name
      ```

      `>` aligns right, `<` left and `^` centres, with an optional fill character before
      it. `.2f` means two decimals in fixed-point notation, `%` multiplies by 100 and adds a
      percent sign, and `d` is a whole number. `!r` asks for the developer view of a value,
      which puts quotes round text: useful in log lines, where `''` and `' '` would
      otherwise look the same.

      The spec is handed to the object, so types can define their own. Dates do:
      `f"{when:%d %b %Y}"` gives `09 Mar 2026` for a `date` of 9 March 2026. Since Python
      3.12, an f-string can also reuse its own quote character inside the braces, which
      older versions refused.

      `.2f` rounds the binary float, not the decimal you typed. `f"{2.675:.2f}"` shows
      `2.67`, because 2.675 is stored as a hair under it. For display that's fine. For
      money you total and compare, lesson 2 shows the options.
  - title: Blocks, scope and how a file runs
    body: |-
      A colon opens a block, and the block is every following line indented further. Four
      spaces is the convention (PEP 8), and formatters such as ruff enforce it. Mixing tabs
      and spaces in one block raises a `TabError`. An empty block isn't allowed, so Python
      has `pass`, a statement that does nothing, as a placeholder.

      The surprise for a JavaScript developer is scope. `let` and `const` live inside the
      nearest braces. Python has no block scope at all: only a function (and a class, or a
      module) makes a new scope. A name assigned inside an `if` or a `for` is still there
      after it.

      ```python
      def label_for(hour):
          if hour < 12:
              greeting = "Good morning"
          else:
              greeting = "Hello"
          return greeting        # fine: the if made no new scope

      print(label_for(9))        # Good morning

      for n in range(3):
          pass
      print(n)                   # 2: the loop variable survives the loop
      ```

      The flip side: if only one branch assigns the name, the other path raises
      `UnboundLocalError` or `NameError` when the name is read. Give the name a value on
      every path, or before the `if`.

      Inside brackets, a statement can run over several lines with no backslash, which is
      how long calls and lists are written. Outside brackets, the line break ends the
      statement.

      A file runs from top to bottom, and `def` is itself a statement: it creates the
      function when that line runs. That's why you'll see this at the end of scripts:

      ```python
      def main():
          print("running as a script")

      if __name__ == "__main__":
          main()
      ```

      Python sets `__name__` to `"__main__"` for the file you run, and to the module's
      name when another file imports it. So the script's work runs on `python3 app.py` but
      not on `import app`.
pitfalls:
  - '**Joining text and numbers with `+`.** Python raises `TypeError: can only concatenate str (not "int") to str`. Use an f-string, `f"Age: {age}"`, or convert explicitly with `str(age)`.'
  - '**Forgetting the `f`.** `"Hi {name}"` prints the braces as typed, with no error. When a template shows up literally in output, check for the missing prefix first.'
  - '**Writing `true`, `null` or `undefined`.** Python raises `NameError: name ''true'' is not defined`. The spellings are `True`, `False` and `None`, and there is no separate `undefined`.'
  - '**Assigning a name in only one branch.** Without block scope, reading the name after an `if` that skipped the assignment fails at run time. Assign it on every path or give it a default first.'
  - '**Trusting `.2f` for money.** Floats are binary, so `f"{2.675:.2f}"` shows `2.67`. Format floats for display, but keep money in integer cents or `decimal.Decimal`.'
  - '**Mixing tabs and spaces.** The file may look aligned in your editor and still fail with `TabError`. Set the editor to insert four spaces, and let a formatter keep it that way.'
interview:
  - question: Is Python strongly or weakly typed, and how does that compare with JavaScript?
    answer: >-
      Python is dynamically and strongly typed. Dynamic means types belong to values, not
      names, so the same name can hold an `int` and later a `str`, and types are checked as
      the code runs. Strong means Python doesn't convert between unrelated types
      implicitly: `"3" + 4` raises a `TypeError`, and `1 == "1"` is `False`. JavaScript is
      also dynamic, but weakly typed, so it converts and gives `"34"` or `true`. The
      practical gain is that a type mistake fails where it happens. The cost is that you
      still only find it at run time, which is why production Python adds type hints and a
      checker such as mypy or pyright in CI.
  - question: What does `b = a` do in Python when `a` is a list?
    answer: >-
      It binds a second name to the same list object; nothing is copied. Python names are
      references, so after `b = a`, `a is b` is `True` and `b.append(x)` is visible through
      `a`. That's the same as JavaScript assigning an array. The distinction to draw is
      between mutating and rebinding. `b.append(x)` mutates the shared object. `b = b + [x]`
      builds a new list and rebinds `b`, leaving `a` alone. If I need an independent list I
      copy explicitly, with `a.copy()`, `list(a)` or `a[:]`, and I remember those copies
      are shallow: nested objects are still shared, so for nested data I'd use
      `copy.deepcopy` or build new inner objects.
  - question: How does Python scope differ from JavaScript's `let` and `const`?
    answer: >-
      Python has function scope, not block scope. `let` and `const` are confined to the
      nearest braces, but an `if`, `for` or `while` in Python creates no scope, so a name
      assigned inside is visible after the block, including the loop variable. New scopes
      come from functions, classes, modules and comprehensions. Name lookup follows the
      LEGB order: local, enclosing function, global, then built-ins. The practical risk is
      a name assigned on only one branch, which raises `UnboundLocalError` or `NameError`
      on the other path. The fix is to assign a default before the branch. It also means
      short functions matter more in Python, because the function is the unit that
      contains names.
  - question: What is `if __name__ == "__main__":` for?
    answer: >-
      It runs code only when the file is executed directly, not when it's imported. Python
      sets the module variable `__name__` to `"__main__"` for the entry file and to the
      module's own name on import. Putting the script's work behind that check lets the
      same file be a runnable script and an importable module, so tests can import its
      functions without triggering side effects such as network calls or file writes. The
      usual shape is a `main()` function called from the guard. In a packaged project I'd
      often go further and expose `main` as a console-script entry point in
      `pyproject.toml`, so the guard becomes a convenience rather than the only way in.
