id: atlas.what-suits-what
title: Choosing a language
objective: Choose a language for a job from its hard constraints first, then its libraries and your team.
level: essential
minutes: 10
concepts: [atlas.problem-fit, atlas.ecosystems, atlas.webassembly]
prerequisites: [atlas.language-landscape, pyai.first-model-call]
opening:
  text: >-
    You'll pick a language for a job and defend it in two sentences. The answer comes from the
    job, not from which language you like best.

steps:
  - type: prose
    id: name-problem-fit
    body: >-
      Start with the **hard constraints**, the things a language must do or it's out. Where
      must the code run: a browser, a phone, a server? Can the machine have a runtime
      installed?


      Only then the soft ones: which libraries the job needs, and what the team knows. A
      language that fails one hard constraint loses, however good it is at the rest.

  - type: multiple-choice
    id: pick-runs-in-browser
    concept: atlas.problem-fit
    difficulty: 1
    question: A chart must redraw in the reader's browser as they drag a slider. The team knows Python. Which language?
    choices:
      - text: JavaScript
        correct: true
        feedback: >-
          Right. Browsers run JavaScript. Where it runs decides first.
      - text: Python, the team knows it
        feedback: >-
          The team matters once the hard constraints pass. This one must run in a browser.
      - text: Go, for the speed
        feedback: >-
          Go doesn't run in a browser as it is. And a chart isn't limited by speed.

  - type: prose
    id: name-ecosystems
    body: >-
      A language comes with an **ecosystem**: its libraries, its tools, the hosts that run it,
      and the people who know it. That often decides more than the language itself.


      Python owns data and model training: numpy, pandas, the training libraries. But calling
      a model API is different. The big providers ship official SDKs for TypeScript too.

  - type: multiple-choice
    id: pick-sdk-in-ts
    concept: atlas.ecosystems
    difficulty: 2
    question: A TypeScript team wants to summarise support tickets with a model API. What should they do?
    choices:
      - text: Stay in TypeScript and use the provider's SDK
        correct: true
        feedback: >-
          Right. It's one API call, and the official TypeScript SDK makes it.
      - text: Rewrite the backend in Python first
        feedback: >-
          Python's lead is in training and data work. Calling an API works from either.
      - text: Wait for a TypeScript model library
        feedback: >-
          The model runs at the provider. You only need a client for its API, and it exists.

  - type: ai-review
    id: review-team-favourite
    concept: atlas.problem-fit
    difficulty: 3
    language: ts
    request: Write a helper that suggests a language for a job from our team's skills.
    flawClass: edge-case
    code: |
      const teamKnows = ['Python', 'Go'];

      function suggest(job: { runsOn: string; noRuntimeAllowed: boolean }) {
        for (const language of teamKnows) {
          if (language === 'Python' && job.noRuntimeAllowed) return 'Go';
          return language;
        }
        return 'Python';
      }
    prompt: >-
      An assistant wrote this. Every test job ran on a server or in a terminal, and the
      answers looked sensible. Then someone asked about a browser widget, and it said
      "Python". Tap the line at fault.
    lines: [5]
    reasons:
      - text: It never checks where the job runs
        correct: true
        feedback: >-
          Yes. One hard constraint is tested, the other never. Rule out by `runsOn` first.
      - text: '`Go` should be `Rust`'
        feedback: >-
          Either ships without a runtime. The missing check is about the browser, not the
          binary.
      - text: The loop should try every language first
        feedback: >-
          It does return early. But no order of the team's languages includes one that runs
          in a browser.
    fix: |
      function suggest(job: { runsOn: string; noRuntimeAllowed: boolean }) {
        if (job.runsOn === 'browser') return 'JavaScript';   // the hard constraint, first
        if (job.noRuntimeAllowed) return 'Go';
        return teamKnows[0];
      }

  - type: code-challenge
    id: write-shortlist
    concept: atlas.problem-fit
    difficulty: 3
    language: ts
    prompt: >-
      Write `shortlist(job, candidates)`. Keep each candidate whose `runsOn` includes the
      job's `runsOn`. If `noRuntimeAllowed`, also drop every candidate that `needsRuntime`.


      Return the names, the ones in `job.team` first, otherwise in the order given. So a
      browser job keeps only JavaScript, whoever is on the team.
    hints:
      - Two steps. Filter by the hard constraints, then order what's left.
      - A candidate the team knows can still fail a hard constraint, so filter before you sort.
      - 'Start with `const fits = candidates.filter((c) => c.runsOn.includes(job.runsOn) && ...)`'

  - type: prose
    id: name-webassembly
    body: >-
      One way round the browser constraint: **WebAssembly**, or Wasm. It's a compact binary
      format that browsers run beside JavaScript, at close to native speed. Rust, C++ and Go
      compile to it.


      It suits a heavy library you already have in another language: an image editor's
      filters, or a small model run in the page. A chart with a slider doesn't need it.

  - type: fill-blank
    id: fill-load-wasm
    concept: atlas.webassembly
    difficulty: 2
    language: js
    prompt: >-
      A photo site compiled a Rust resizing library to `resize.wasm`. Load it in the page and
      take out the function it exports.
    template: |
      const { instance } = await WebAssembly.{{1}}(fetch('/resize.wasm'));
      const { {{2}} } = instance.{{3}};
      console.log(newHeight(4000, 3000, 800)); // 600
    blanks:
      - key: '1'
        answer: instantiateStreaming
      - key: '2'
        answer: newHeight
      - key: '3'
        answer: exports
    bank: [instantiateStreaming, require, newHeight, resize, exports, imports]

  - type: explain-back
    id: explain-worse-language-wins
    concept: atlas.ecosystems
    difficulty: 3
    prompt: >-
      A team picks a language they find clumsier than their favourite, and they're right to.
      What could make that the better choice?
    rubric:
      - A hard constraint, such as where the code must run, may rule the favourite out.
      - The libraries the job needs may exist only in the other language's ecosystem.
      - Hosting, tools and hiring for that language may cost less than porting or learning.
    modelAnswer: >-
      The language is a small part of the decision. If the job must run in a browser or on a
      phone, the favourite may not run there at all. If it needs model training or a PDF library, the code that already exists counts.
      Rewriting it takes months.
      And a language brings its hosts, tools and hiring pool. A clumsier syntax is cheap next
      to any of those. So the constraints pick, and taste comes last.

recap:
  - Rule languages out by hard constraints first, where the code runs and what it may need.
  - Then choose by the libraries the job needs and what the team knows.
  - Reach for WebAssembly when heavy code in another language must run in a browser.

recall:
  - id: card-hard-constraints
    concept: atlas.problem-fit
    front: What are a job's hard constraints, and what do they do to the choice?
    back: >-
      Where the code must run, and whether a runtime can be installed. A language that fails
      one is out, whatever else it offers.
  - id: card-ecosystem
    concept: atlas.ecosystems
    front: What does a language's ecosystem include?
    back: >-
      Its libraries, tools, hosts and hiring pool. Together they often decide more than the
      language's own features.
  - id: card-wasm
    concept: atlas.webassembly
    front: What is WebAssembly for?
    back: >-
      Running code compiled from Rust, C++ or Go in the browser, beside JavaScript. It suits
      heavy libraries you already have in those languages.

