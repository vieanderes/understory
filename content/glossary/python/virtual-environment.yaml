term: virtual environment
aka:
  - venv
  - .venv
short: A private folder of installed packages for one project, kept apart from every other project.
explain: |
  Project A needs version 1 of a library; project B needs version 2. Install both into
  your computer's one Python and one of them breaks.

  So each project gets its own folder, usually `.venv`, with its own copy of the
  interpreter and its own packages. Tools like `uv` create and use it for you. Never commit it, and never install packages into the system Python. If something odd happens, delete it and recreate it from the lockfile.
analogy: Separate toolboxes for separate jobs. The plumbing tools never get mixed up with the bike repair kit.
example:
  language: bash
  code: |
    $ uv venv
    $ source .venv/bin/activate
    $ uv pip install httpx
    $ which python
    /home/dev/report-tool/.venv/bin/python
usage: It works in the terminal but not in the editor, because the editor isn't using the virtual environment.
related:
  - package-manager
  - lockfile
level: 1
lessons:
  - python.projects-and-uv
