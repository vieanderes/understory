term: Conventional Commits
aka:
  - conventional commit
  - commit convention
short: A shared format for commit subjects that opens each with a type, such as feat or fix.
explain: |
  Release notes and version numbers are tedious to work out by hand. If every commit subject
  says what kind of change it is, a tool can do it.

  The convention puts a type first: `feat` for a feature, `fix` for a bug, `docs`, `refactor`,
  `test`. An optional scope sits in brackets, and `!` marks a breaking change. A release
  tool then bumps the version and writes the changelog.

  It's a team choice, not a rule of Git. Follow whatever the project already does, and don't
  let the prefix replace a clear subject saying what changed.
analogy: Colour-coded folders. Anyone can sort the pile without opening a single one.
example:
  language: text
  code: |
    feat(cart): show saved-for-later items
    fix(auth): refresh the session before it expires
    refactor!: rename the orders table to purchases
usage: We follow Conventional Commits here, so the release tool can tell a fix from a breaking change.
related:
  - commit
  - semantic-versioning
  - atomic-commit
level: 2
lessons:
  - pro.commits-and-prs
