term: discriminated union
aka:
  - tagged union
short: Object types sharing one fixed field, so checking that field reveals which one you hold.
explain: |
  A request is loading, failed or done. Give each shape a `status` field with its own fixed
  value. Then `if (state.status === 'done')` tells the checker you have the shape with
  `data`, and nothing else.

  It stops impossible states, such as `data` and `error` both set. Add a `never` check in the
  `default` of a `switch`, and adding a fourth status breaks the build until you handle it.
analogy: Coloured lanyards at a conference. One glance at the colour tells staff which rooms you can enter.
example:
  language: ts
  code: |
    type Result =
      | { status: 'loading' }
      | { status: 'failed'; error: string }
      | { status: 'done'; data: string[] };

    function show(r: Result) {
      if (r.status === 'done') return r.data.length;
    }
usage: Model the request as a discriminated union, so error and data can't both be set.
twin:
  term: union-type
  difference: A discriminated union is a union whose members share a tag field. A plain union has no tag, so telling its members apart takes `typeof` or `in` checks.
related:
  - union-type
  - narrowing
  - never-type
level: 2
lessons:
  - ts.narrowing
