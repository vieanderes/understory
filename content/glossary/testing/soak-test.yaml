term: soak test
aka: [endurance test, soak testing]
short: Ordinary traffic held steady for hours, to catch problems that only build up with time.
explain: |
  Some bugs need time, not traffic. A small memory leak, a connection that never goes back
  to the pool, a log file that fills the disk. A ten-minute test sees none of them.

  So run normal load for hours, sometimes overnight, and watch the trends. Memory, open
  connections and response times should stay flat. A line that keeps climbing, however
  slowly, is the bug.
analogy: Leaving a new bath full overnight to see whether it leaks. A quick splash would never show it.
usage: Response times creep up after six hours, so add a soak test to the release checklist.
twin:
  term: stress-testing
  difference: A stress test raises the load past normal to find the breaking point. A soak test keeps normal load and raises the time.
related: [stress-testing, spike-test, memory-leak, connection-pool]
level: 2
lessons: [testing.breaking-it-on-purpose]
