deepDive: >-
  `flex` is short for three values: grow, shrink and basis. `flex: 1` means `1 1 0%`: grow,
  shrink, and start from zero, which is why widths are ignored. `flex: auto` means `1 1 auto`:
  start from each item's own width, then share what's left. `flex: none` means `0 0 auto`.


  With different grow factors, the spare space is shared in proportion. In a 500px row, items
  of `flex: 1 1 100px` and `flex: 2 1 100px` next to a fixed 120px one end up 160px and 220px.
  The 180px left over is split one share to two.


  Shrinking is weighted by size as well as factor, so a wide item gives up more. Two items of
  basis 300px and 100px in a 300px row become 225px and 75px.


  A flex item with `overflow` other than `visible` has no content floor, which is why
  `overflow: hidden` on the item itself also works.
