id: cleaning-rooms
title: CleaningRooms
topic: sorting
difficulty: medium
type: algorithmic
recommendedMinutes: 35
signature:
  params:
    - { name: S, type: "int[]" }
    - { name: E, type: "int[]" }
    - { name: C, type: int }
  returns: int
statement: |-
  A study centre has N bookings. Booking I uses a room from minute S[I] up to minute E[I].
  After a booking ends, its room needs C minutes of cleaning: if a booking ends at minute
  E, its room is free again from minute E + C.

  Write a function:

  {{signature}}

  that, given arrays S and E of N integers and an integer C, returns the smallest number
  of rooms that can hold every booking.

  For example, given S = [30, 0, 60, 10], E = [75, 40, 90, 20] and C = 10, the function
  should return 2. One room takes the bookings from minutes 0 and 60. The other takes the
  bookings from minutes 10 and 30.

  Given S = [0, 10, 20], E = [10, 20, 30] and C = 0, the function should return 1.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - arrays S and E have the same length N;
  - 0 ≤ S[I] < E[I] ≤ 1,000,000,000 for every I;
  - C is an integer within the range [0..1,000,000].
examples:
  - { args: [[30, 0, 60, 10], [75, 40, 90, 20], 10], expected: 2 }
  - { args: [[0, 10, 20], [10, 20, 30], 0], expected: 1 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: a single booking
    group: correctness
    cases:
      - { args: [[0], [1], 0], expected: 1 }
      - { args: [[5], [1000000000], 1000000], expected: 1 }
  - name: back_to_back
    description: back to back with and without cleaning
    group: correctness
    cases:
      - { args: [[0, 10, 20], [10, 20, 30], 1], expected: 2 }
      - { args: [[0, 15], [10, 25], 5], expected: 1 }
      - { args: [[0, 14], [10, 25], 5], expected: 2 }
  - name: all_equal
    description: identical bookings each need a room
    group: correctness
    cases:
      - { args: [[3, 3, 3, 3], [8, 8, 8, 8], 0], expected: 4 }
  - name: nested
    description: nested bookings, an early free room reused first
    group: correctness
    cases:
      - { args: [[0, 1, 2], [100, 50, 3], 0], expected: 3 }
      - { args: [[0, 1, 5], [100, 4, 9], 0], expected: 2 }
  - name: unsorted
    description: bookings given out of order
    group: correctness
    cases:
      - { args: [[50, 0, 25, 75], [60, 10, 35, 85], 15], expected: 1 }
      - { args: [[50, 0, 25, 75], [60, 10, 35, 85], 16], expected: 2 }
  - name: extreme_min_max_value
    description: the extremes of the value range
    group: correctness
    cases:
      - { args: [[0, 999999999], [999999999, 1000000000], 1000000], expected: 2 }
      - { args: [[0, 999999999], [998999999, 1000000000], 1000000], expected: 1 }
  - name: small_random
    description: random bookings, N = 40
    group: correctness
    cases:
      - { args: [[512, 87, 903, 344, 61, 778, 230, 455, 690, 12, 381, 947, 166, 599, 823, 274, 408, 731, 55, 640, 199, 866, 327, 492, 713, 148, 975, 259, 536, 804, 93, 677, 418, 361, 720, 31, 588, 244, 851, 470], [540, 131, 951, 360, 99, 812, 268, 478, 733, 58, 410, 990, 186, 641, 850, 309, 452, 760, 70, 699, 241, 895, 349, 525, 755, 175, 1000, 293, 571, 830, 140, 703, 470, 399, 745, 77, 612, 290, 880, 515], 7] }
      - { args: [[40, 10, 70, 25, 55, 5, 85, 30, 60, 15], [65, 30, 95, 50, 80, 20, 100, 45, 90, 35], 3] }
  - name: large_back_to_back
    description: back-to-back bookings, newest first, N = 100,000
    group: performance
    cases:
      - generate: { seed: 1, args: [{ kind: range, n: 100000, start: 999990, step: -10 }, { kind: range, n: 100000, start: 1000000, step: -10 }, { kind: value, value: 0 }] }
  - name: large_staggered
    description: staggered bookings with cleaning, N = 100,000
    group: performance
    cases:
      - generate: { seed: 2, args: [{ kind: range, n: 100000, start: 0, step: 3 }, { kind: range, n: 100000, start: 50, step: 3 }, { kind: value, value: 25 }] }
  - name: extreme_large
    description: every booking overlaps every other, N = 100,000
    group: performance
    cases:
      - generate: { seed: 3, args: [{ kind: range, n: 100000, start: 0, step: 1 }, { kind: constant, n: 100000, value: 1000000000 }, { kind: value, value: 0 }] }
