summary: >-
  Candidates who sit timed online tests often share what they got. The lists overlap
  heavily: the largest K with -K present, N unique numbers that sum to zero, a string with
  no three identical letters in a row, the fewest deletions to put every A before every B,
  network rank, the jump game, the widest gap between points, fair indexes, values that
  equal their count, and the day of the week K days later.


  You will almost certainly not get one of these exact tasks. Platforms keep their hiring
  tasks private and keep writing new ones. What you will get is the same small set of
  patterns underneath: a set for "is it there?", a count per key, a running total carried
  through one pass, a sort followed by a scan of neighbours, a greedy reach, a remainder,
  and an answer you build rather than search for.


  So the useful preparation is to name the pattern behind each reported task, solve a few
  of them properly with tests at full size, and practise the naming step until it is fast.
  Real tests are usually harder than the reports suggest, with nastier corners, so the
  method matters more than any remembered answer.
remember:
  - Name the pattern before you write code; the pattern gives you the data structure and the Big-O to aim for.
  - '"Is its partner here?" is a Set, and each check is O(1).'
  - '"How often does each value appear?" is a count per key in a Map or a counting array.'
  - Deciding at each position between two choices, such as delete this A or delete every B so far, is one pass with two running values.
  - A task that asks you to produce any valid answer, such as N unique numbers summing to 0, wants a construction, not a search.
  - Largest gaps between points come from sorting and comparing neighbours, so O(n log n).
  - Write `(index + k) % 7`, with brackets, because `%` binds tighter than `+`.
  - Real tests are harder than the reported ones, so practise the method, not the answers.
sections:
  - title: The ten tasks and their patterns
    body: |-
      Each reported task, the pattern it wears, and the cost to aim for at 100,000 items:

      - **Largest K with both K and -K present.** A Set of the values, then keep the
        largest positive x with -x in the set. O(n).
      - **N unique integers that sum to 0.** Build it: pairs i and -i, plus 0 when N is
        odd. O(n), no search at all.
      - **No three identical letters in a row.** Count each run of equal letters. A run of
        length L needs L - 2 deletions when L is 3 or more. O(n).
      - **Fewest deletions so every A comes before every B.** One pass with the count of Bs
        so far and the best deletions so far. O(n).
      - **Max network rank.** Count each city's roads in one pass, then a road's pair has
        rank roads(a) + roads(b) - 1. O(n + m).
      - **Jump game.** Carry the furthest reachable index. You are stuck the moment the loop
        passes it. O(n).
      - **Widest vertical gap between points.** Only x matters. Sort the x values and take
        the largest difference between neighbours. O(n log n).
      - **Fair indexes.** Prefix sums on two arrays at once. An index is fair when the front
        and back of both arrays all have the same sum. O(n).
      - **Values that equal their count.** Count each value, then keep the largest value
        whose count equals itself. O(n).
      - **Day of the week K days later.** The index of the start day, plus K, remainder 7.
        O(1).

      Other tasks on the same lists follow the same shapes: the fewest adjacent swaps to
      make a palindrome is two pointers with a greedy choice, and the longest concatenation
      of words with unique letters is backtracking with a set of used letters.
  - title: 'Worked: the fewest deletions for all A before all B'
    body: |-
      The brute force tries every split point: everything left of the split must be A,
      everything right must be B. Counting the wrong letters on each side is O(n) per split,
      so O(n^2) overall, about ten billion steps at 100,000 letters.

      The one-pass version keeps two numbers. `bs` is how many Bs you have seen.
      `deletions` is the fewest deletions that make the prefix so far valid. A B at the end
      of a valid prefix keeps it valid, so it only adds to `bs`. An A has two options:
      delete it, which costs `deletions + 1`, or keep it, which means every B before it must
      go, costing `bs`. Take the smaller.

      ```ts
      function minDeletions(letters: string): number {
        let bs = 0;
        let deletions = 0;
        for (const letter of letters) {
          if (letter === 'B') bs++;
          else deletions = Math.min(deletions + 1, bs);
        }
        return deletions;
      }

      console.log(minDeletions('BAAABAB')); // 2
      console.log(minDeletions('BBBAAAA')); // 3
      console.log(minDeletions('AAAABBBBA')); // 1
      ```

      It was compared with the split-point brute force on 5,000 random strings of up to ten
      letters, with no difference. The same idea, a running count of one kind of item
      paired against the other kind, is the passing cars task from the prefix sums lesson.
  - title: The other five, in code
    body: |-
      Short versions of the tasks the lesson names but does not practise. Each was run on
      Node 24 with the outputs shown.

      ```ts
      function canReachEnd(jumps: number[]): boolean {
        let reach = 0;
        for (let i = 0; i < jumps.length; i++) {
          if (i > reach) return false;
          reach = Math.max(reach, i + (jumps[i] ?? 0));
        }
        return true;
      }
      // [2, 3, 1, 1, 4] -> true, [3, 2, 1, 0, 4] -> false

      function widestGap(xs: number[]): number {
        const sorted = [...xs].sort((a, b) => a - b);
        let best = 0;
        for (let i = 1; i < sorted.length; i++) {
          best = Math.max(best, (sorted[i] ?? 0) - (sorted[i - 1] ?? 0));
        }
        return best;
      }
      // [5, 5, 1, 9, 3] -> 4

      function sumToZero(n: number): number[] {
        const out: number[] = [];
        for (let i = 1; i <= Math.floor(n / 2); i++) out.push(i, -i);
        if (n % 2 === 1) out.push(0);
        return out;
      }
      // 5 -> [1, -1, 2, -2, 0]
      ```

      Notice what each avoids. The jump game never tries paths, it only carries one number.
      The widest gap copies before sorting, so the caller's array is untouched, and passes a
      comparator, because a bare `sort()` compares numbers as text. The construction has
      nothing to test beyond uniqueness and the sum, which makes it quick to verify.

      Fair indexes and values that equal their count are the prefix sums and counting
      lessons again. For fair indexes, keep the two totals and two running front sums; an
      index K is fair when `2 * frontA === totalA`, `2 * frontB === totalB` and
      `frontA === frontB`. For `[4, -1, 0, 3]` and `[-2, 5, 0, 3]` that gives 2 fair
      indexes.
  - title: Practising reported tasks well
    body: |-
      A list of tasks is only useful if you practise the step you will need on the day:
      recognising the pattern under a new story. A routine that works:

      1. Read the statement and stop. Say the pattern and the target Big-O before you look
         at any solution.
      2. Write the header comment and a test table with the corners: empty, one item,
         duplicates, all equal, the answer at the far end, the largest size.
      3. Solve it in 15 minutes, closed book. If you cannot, read a solution, close it, and
         retype it from memory the next day.
      4. Compare your answer with a brute force on random small inputs.

      Keep a one-line log per task: the story, the pattern, the trap. After a dozen tasks
      the log is your cheat sheet, and you will notice that the traps repeat too: an
      off-by-one when a run resets, a missing bracket around a remainder, `sort()` without
      a comparator, a cap or a zero case the example never shows.
  - title: 'Two more, in code: palindrome swaps and unique letters'
    body: |-
      Two tasks from the same lists, each run on Node 24 and checked against a brute force.

      **The fewest swaps of neighbouring letters to make a palindrome**, or -1. First
      decide whether it's possible: at most one letter may have an odd count. Then two
      pointers. For the letter at `left`, find its nearest partner from the right and walk
      it out to `right`, one swap per step. If it has no partner, it's the middle letter:
      step it one place inward and try again.

      ```ts
      function minSwapsToPalindrome(text: string): number {
        const counts = new Map<string, number>();
        for (const c of text) counts.set(c, (counts.get(c) ?? 0) + 1);
        const odd = [...counts.values()].filter((n) => n % 2 === 1).length;
        if (odd > 1) return -1; // at most one letter can sit alone in the middle
        const chars = [...text];
        let swaps = 0;
        let left = 0;
        let right = chars.length - 1;
        while (left < right) {
          let k = right;
          while (chars[k] !== chars[left]) k--; // the nearest partner, from the right
          if (k === left) {
            // No partner: this is the middle letter. Step it inward and try again.
            [chars[k], chars[k + 1]] = [chars[k + 1], chars[k]];
            swaps++;
            continue;
          }
          for (; k < right; k++) {
            [chars[k], chars[k + 1]] = [chars[k + 1], chars[k]];
            swaps++;
          }
          left++;
          right--;
        }
        return swaps;
      }
      // 'mamad' -> 3, 'ntiin' -> 1, 'aabb' -> 2, 'asflkj' -> -1
      ```

      It is O(n²), fine for a few thousand letters. For 200,000, count the moves with a
      Fenwick tree instead of swapping, for O(n log n), and say so.

      **The longest string made by joining words with no letter used twice.** Drop words
      that repeat a letter of their own, then backtrack: include a word if it shares no
      letter with what you have, and explore on.

      ```ts
      function longestUniqueConcat(words: string[]): number {
        const usable = words.filter((w) => new Set(w).size === w.length);
        let best = 0;
        function explore(start: number, used: string): void {
          best = Math.max(best, used.length);
          for (let i = start; i < usable.length; i++) {
            // used holds at most 26 letters, so includes stays cheap here.
            if (![...usable[i]].some((c) => used.includes(c))) explore(i + 1, used + usable[i]);
          }
        }
        explore(0, '');
        return best;
      }
      // ['un', 'iq', 'ue'] -> 4, ['cha', 'r', 'act', 'ers'] -> 6
      ```

      At most 26 letters fit, so the search stays small however many words there are.

pitfalls:
  - >-
    **Memorising answers.** The exact task rarely appears, and a remembered answer to a
    slightly different task is wrong. Memorise patterns and traps instead.
  - >-
    **Resetting a run to 0.** When the letter changes, the new letter is a run of 1. A reset
    to 0 undercounts every later run.
  - >-
    **Forgetting operator precedence.** `index + k % 7` wraps only `k`. Put the sum in
    brackets.
  - >-
    **Searching when you could build.** A task that accepts any valid answer rewards a
    construction you can prove in one sentence, not a random or exhaustive search.
  - >-
    **Stopping at the example.** Reported tasks hide their points in corners: zero where K
    must be positive, duplicates, an empty string, a road listed from either end.
verify:
  - lens: tests
    check: For each task, test its corners, such as an empty input, duplicates, zero where K must be positive, and a second run after the first.
  - lens: scales
    check: Test each solution at the stated maximum size, so a quadratic scan shows up before the hidden performance tests find it.
  - lens: confuses
    check: Name the pattern in a comment above the solution, such as a count per key, so a reader sees the plan first.
interview:
  - question: You get a task you have never seen. How do you start?
    answer: >-
      I name the pattern before I write code. I restate the input and output, read the
      limits, and ask which known shape it wears: a set for membership, a count per key, a
      running total, a sort then a scan, a greedy reach, or a construction. That choice
      gives me the data structure and the Big-O to aim for. Then I write the edge cases and
      the brute force as a comment, so I have something to compare against. The trade-off
      is a minute or two before typing, which is far cheaper than discovering halfway that
      the approach cannot meet the limits.
  - question: How would you find the fewest deletions so every A comes before every B?
    answer: >-
      One pass with two running values. I count the Bs seen so far and keep the fewest
      deletions that make the prefix valid. A B never breaks a valid prefix, so it only
      adds to the count. For an A I choose the cheaper of deleting it, one more deletion,
      or keeping it and deleting every B before it. That is O(n) time and O(1) space. The
      brute force tries every split point and is O(n^2), which I would still write first to
      cross-check the fast version on small random strings.
  - question: Why does your network rank subtract 1?
    answer: >-
      Because the road between the two cities touches both of them, so adding their road
      counts counts it twice. I count each city's roads once in an array indexed by city,
      which is O(n + m), then each road's pair has rank roads(a) + roads(b) - 1 in O(1).
      The assumption is at most one road per pair, which the statement gives. If pairs not
      joined by a road counted too, I would look at the two or three busiest cities instead,
      since checking every pair would be quadratic.
  - question: The task asks for any N unique integers that sum to zero. How do you answer?
    answer: >-
      I build the answer instead of searching for it. For i from 1 to N / 2, I add i and
      -i, and when N is odd I add 0. Every pair cancels, every number is distinct, and it is
      O(N). The point interviewers look for is recognising that "return any valid array" is
      a constructive task: the proof fits in one sentence, and a test only needs to check
      the length, the uniqueness and the sum, not a specific array.
terms:
  - term: Reported task
    say: The questions that will come up.
    means: A task a candidate remembers from a test. Platforms keep writing new ones, so learn the
      pattern underneath, not the answer.
  - term: Construction
    say: Search for an answer that works.
    means: When any valid answer is accepted, build one directly, such as pairs of `k` and `-k` plus a
      `0` when N is odd, instead of searching.
  - term: Running state
    say: Store everything, then decide.
    means: A few values carried through one pass, such as the fewest deletions so far, each updated from
      the previous position. It gives O(n) time and O(1) memory.
  - term: Network rank
    say: Add up both cities' roads.
    means: Both cities' road counts added together, minus 1 if a road joins them, because that road
      would otherwise be counted twice.
  - term: "`(index + k) % 7`"
    say: Write it as `index + k % 7`.
    means: "`%` binds tighter than `+`, so without brackets only k is reduced. Bracket the sum."
