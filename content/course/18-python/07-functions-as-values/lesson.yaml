id: python.functions-as-values
title: Functions as values
objective: Pass functions as values, write a lambda, rank with sorted, max and min by a key, and never shadow a built-in.
level: essential
minutes: 10
concepts: [python.functions-as-values, python.sorting-with-key, python.shadowing-builtins]
prerequisites: [python.functions]
opening:
  text: >-
    You'll rank search results, pick the best reply and find the cheapest model, each in one
    line. The trick is handing a function to another function, which AI code does constantly.

steps:
  - type: prose
    id: functions-are-values
    body: |-
      A function is a value, as in JavaScript. Without brackets, its name is the function
      itself, not a call:

      ```python
      words = ["kiwi", "fig", "banana"]
      sorted(words, key=len)   # ['fig', 'kiwi', 'banana']
      max(words, key=len)      # 'banana'
      min(words, key=len)      # 'fig'
      ```

      `key=len` hands `len` over. `sorted`, `max` and `min` call it on each item and compare
      what it returns, here the lengths.

  - type: bug-hunt
    id: hunt-called-key
    concept: python.functions-as-values
    difficulty: 2
    language: python
    code: |
      words = ["kiwi", "fig", "banana"]
      longest = max(words, key=len())
      print(longest)
    prompt: 'This fails with `TypeError: len() takes exactly one argument (0 given)`. Tap the line at fault.'
    lines: [2]
    reasons:
      - text: The brackets call `len` instead of passing it
        correct: true
        feedback: >-
          Right. `key=len` hands the function over, and `max` calls it for each word.
      - text: '`max` can''t take a `key`'
        feedback: >-
          It can: `max`, `min` and `sorted` all take one. The trouble is what's passed.
      - text: '`len` doesn''t work on text'
        feedback: >-
          It does. Here it's called once, with nothing, before `max` even starts.
    fix: |
      words = ["kiwi", "fig", "banana"]
      longest = max(words, key=len)
      print(longest)

  - type: prose
    id: lambda
    body: |-
      For a one-off rule, write a **lambda**: a small function with no name. It's
      JavaScript's `r => r.score`:

      ```python
      results = [{"id": "a", "score": 0.72}, {"id": "b", "score": 0.91}]
      best = max(results, key=lambda r: r["score"])
      ranked = sorted(results, key=lambda r: r["score"], reverse=True)
      ```

      `lambda r: r["score"]` takes `r` and returns its score. A lambda holds one expression,
      with no `return`. `reverse=True` sorts from high to low.

  - type: fill-blank
    id: fill-cheapest-model
    concept: python.functions-as-values
    difficulty: 2
    prompt: Pick the model with the lowest price per call.
    language: python
    template: |
      models = [{"name": "large", "price": 15}, {"name": "small", "price": 1}]
      cheapest = {{1}}(models, key={{2}} m: m["price"])
    blanks:
      - key: '1'
        answer: min
      - key: '2'
        answer: lambda
    bank: [min, max, sorted, lambda, def, '=>']

  - type: prose
    id: max-with-get
    body: |-
      Any function works as a key, methods included. A dict's `get` is a function too:

      ```python
      votes = {"yes": 3, "no": 5}
      winner = max(votes, key=votes.get)
      ```

      `max` walks the keys, calls `votes.get` on each, and compares the counts. It returns
      the item it walked, a key, not the number the key function gave back.

  - type: predict-output
    id: predict-max-get
    concept: python.sorting-with-key
    difficulty: 2
    language: python
    code: |
      probs = {"cat": 0.2, "dog": 0.7, "owl": 0.1}
      print(max(probs, key=probs.get))
    question: What does this show?
    choices:
      - text: '`dog`'
        correct: true
        feedback: >-
          Yes. It's the key whose value is highest.
      - text: '`0.7`'
        feedback: >-
          A common slip. `max` returns an item it walked, a key, not what `get` returned.
      - text: '`owl`'
        feedback: >-
          That's the biggest key by alphabet, which `max(probs)` would give. `key` compares
          the values.

  - type: prose
    id: shadowing
    body: |-
      `list`, `max`, `sum`, `str` and `input` aren't keywords. They're **built-ins**:
      ordinary names Python fills in for you. Assign to one, and you hide the original for
      the rest of the file:

      ```python
      list = ["tea", "cake"]
      letters = list("abc")   # TypeError: 'list' object is not callable
      ```

      That's called **shadowing**. Pick a name that says what it holds, like `orders`.

  - type: bug-hunt
    id: hunt-shadowed-list
    concept: python.shadowing-builtins
    difficulty: 3
    language: python
    code: |
      list = ["a1", "b2", "a1"]
      unique = list(set(list))
      print(unique)
    prompt: "Line 2 fails with `TypeError: 'list' object is not callable`. Tap the line at fault."
    lines: [1]
    reasons:
      - text: Naming a list `list` hides the built-in
        correct: true
        feedback: >-
          Right. Rename it, say `ids`, and `list(set(ids))` works again.
      - text: Line 2, because that's where it failed
        feedback: >-
          Line 2 is fine on its own. Line 1 changed what `list` means.
      - text: A set can't be turned into a list
        feedback: >-
          It can: `list(set(...))` is a common way to drop duplicates.
    fix: |
      ids = ["a1", "b2", "a1"]
      unique = list(set(ids))
      print(unique)

  - type: code-challenge
    id: write-top-ids
    concept: python.sorting-with-key
    difficulty: 3
    language: python
    starter: rank.starter.py
    solution: rank.solution.py
    tests: rank.tests.py
    editable: '2-3'
    prompt: >-
      A search step scores passages against a question. Write `top_ids(passages, k)`,
      returning the ids of the `k` highest-scoring passages, best first. Each passage is a
      dict with an `id` and a `score`.


      Example: scores of 0.4, 0.9 and 0.7 for `a`, `b` and `c` with `k` 2 give `["b", "c"]`.
    hints:
      - 'The lambda step sorts dicts by their `score`, high to low.'
      - 'Sort first, slice to `k`, then collect each passage''s `id`.'
      - 'Start with `sorted(passages, key=lambda p: p["score"], reverse=True)`.'

  - type: explain-back
    id: explain-key-returns-item
    concept: python.sorting-with-key
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      What does `key` do in `max(results, key=lambda r: r["score"])`, and what does `max`
      give back?
    rubric:
      - '`key` takes a function, which `max` calls on each result.'
      - '`max` compares the scores that function returns.'
      - It returns the whole result with the top score, not the score.
    modelAnswer: >-
      The lambda turns each result into its score, and `max` compares those scores. What it
      hands back is the result itself, the whole dict with the highest score. The key only
      decides the order.

recap:
  - Pass a function by name, with no brackets, to `sorted`, `max` or `min`.
  - Write a one-off key with `lambda`, and rank high to low with `reverse=True`.
  - Keep built-in names like `list` and `max` free, and pick names that say what they hold.
recall:
  - id: card-key-function
    concept: python.functions-as-values
    front: How do you find the longest string in `words`?
    back: >-
      `max(words, key=len)`. `len` goes in without brackets, so `max` can call it.
  - id: card-lambda
    concept: python.functions-as-values
    front: How do you sort `results` by each item's `"score"`, highest first?
    back: >-
      `sorted(results, key=lambda r: r["score"], reverse=True)`.
  - id: card-max-get
    concept: python.sorting-with-key
    front: How do you get the key with the highest value in a dict `counts`?
    back: >-
      `max(counts, key=counts.get)`. It returns the key, not the value.
  - id: card-shadowing
    concept: python.shadowing-builtins
    front: Why does `list("abc")` fail after `list = [1, 2]`?
    back: >-
      The assignment hid the built-in `list` behind your list, which can't be called. Pick
      another name.

