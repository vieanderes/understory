deepDive: >-
  **Kappa.** Agreement beyond chance is usually measured with Cohen's kappa:
  `(observed - chance) / (1 - chance)`, where chance is the agreement two raters would reach
  by guessing at their own pass rates. The always-pass judge above scores exactly 0. Kappa
  has cousins. With more than two raters, Fleiss' kappa generalises it. With ordered
  scores, such as 1 to 5, a weighted kappa counts a 4 against a 5 as a smaller miss than a
  1 against a 5. Rough bands are often quoted, with 0.6 to 0.8 called substantial, but they
  are conventions, not laws.


  A judge also needs its own held-out set. If you tune the judge prompt on the same items
  you measure it on, its kappa will look better than it is. Split the labelled items, tune
  on one part, and report on the other.


  For online evals, sample by slice rather than uniformly. A rare slice, such as refunds,
  may be 2% of traffic and most of the risk. Oversample it, and weight it back when you
  report an overall number.
