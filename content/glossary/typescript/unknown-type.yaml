term: unknown type
aka:
  - unknown
short: A type for a value you know nothing about yet, which you must check before using.
explain: |
  Data from a request, a file or `JSON.parse` could be anything. Typing it `unknown` is
  honest. You can store it and pass it along, but you can't read a property until you check.

  Checking is narrowing: `typeof`, a type guard or a schema parser. That turns the outside
  world into typed data at one place, the boundary, and the rest of the code can trust it.
analogy: A parcel with no label. You can carry it around, but you open it carefully before using what's inside.
example:
  language: ts
  code: |
    const data: unknown = JSON.parse(text);
    data.name; // error: data is unknown
    if (typeof data === 'object' && data !== null && 'name' in data) {
      data.name; // allowed
    }
usage: Type the webhook body as unknown and validate it before anything else touches it.
twin:
  term: any-type
  difference: '`unknown` blocks every use until you check the value. `any` allows every use and checks nothing, so it hides the very bugs `unknown` catches.'
related:
  - any-type
  - type-guard
  - narrowing
level: 2
lessons:
  - ts.typing-the-boundary
  - pro.typescript
