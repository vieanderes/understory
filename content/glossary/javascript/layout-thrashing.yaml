term: layout thrashing
aka: [forced reflow, forced synchronous layout, reflow]
short: Code that alternates reading sizes and changing styles, forcing the browser to redo layout again and again.
explain: |
  The browser works out sizes and positions, called layout, before it paints. Normally it
  waits and does that once for all your changes. But if you change a style and then ask how
  tall something is, it must do layout right now to answer.

  Do that in a loop, a read then a write then a read, and layout runs on every pass. A list
  of a thousand items can stutter for seconds. The fix is to batch: do all the reads first,
  then all the writes.
analogy: Re-measuring the whole room every time you move one chair, instead of measuring once and then moving them all.
example:
  language: js
  code: |
    // Thrashes: each read forces layout after the last write
    for (const box of boxes) {
      box.style.width = `${box.offsetWidth + 10}px`;
    }
    // Batched: read everything, then write everything
    const widths = boxes.map((box) => box.offsetWidth);
    boxes.forEach((box, i) => (box.style.width = `${widths[i] + 10}px`));
usage: The profiler shows layout thrashing in that resize loop, so read all the heights before setting any.
related: [dom, main-thread, long-task, profiling]
level: 3
lessons: [js.changing-the-page]
