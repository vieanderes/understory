term: union-find
aka: [disjoint set union, DSU, disjoint set, disjoint-set]
short: A structure tracking which items are in the same group, with fast merging of two groups.
explain: |
  Links arrive one by one: "these two computers are connected". After each, you want to
  ask whether two computers can reach each other, or how many separate networks there are.

  Each item points to a parent, and the root of its chain names the group. To merge two
  groups, point one root at the other. Finding the root is the "find"; merging is the
  "union".

  Two tricks keep it near O(1). Flatten the chain as you walk it, and hang the smaller
  group under the larger. It can't split groups apart again.
analogy: Clubs merging. Every member knows who to ask, and that person knows the club's president. Ask the president and you know the club.
example:
  language: js
  code: |
    const parent = new Map();
    function find(x) {
      if (!parent.has(x)) parent.set(x, x);
      if (parent.get(x) !== x) parent.set(x, find(parent.get(x))); // flatten
      return parent.get(x);
    }
    function union(a, b) {
      parent.set(find(a), find(b));
    }
    // same group?  find(a) === find(b)
usage: Edges arrive one at a time, so union-find beats rerunning a BFS after every link.
related: [graph, depth-first-search, topological-sort]
level: 3
lessons: [algo.dependencies, cs.graphs]
