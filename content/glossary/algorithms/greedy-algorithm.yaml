term: greedy algorithm
aka: [greedy, greedy choice, exchange argument]
short: An approach that takes the best-looking option at each step and never reconsiders it.
explain: |
  To fit the most meetings into one room, keep picking the meeting that ends soonest and
  doesn't clash. No looking ahead, no undoing. It's fast, often one sort and one pass.

  It's only right when you can argue no better answer needs a different choice. For
  meetings you can: swapping in an earlier-ending one never hurts. That's an exchange
  argument.

  Often it's wrong. Making 6p from 1p, 3p and 4p coins, greedy takes 4 + 1 + 1. The best
  is 3 + 3. When greedy fails, the problem usually wants dynamic programming.
analogy: Packing a car boot by always grabbing the biggest bag left. Often fine, and sometimes it leaves the case that would have fitted.
example:
  language: js
  code: |
    function mostMeetings(meetings) {
      meetings.sort((a, b) => a.end - b.end); // earliest finish first
      let count = 0, freeAt = -Infinity;
      for (const m of meetings) {
        if (m.start >= freeAt) { count++; freeAt = m.end; }
      }
      return count;
    }
usage: The greedy algorithm fails for 6 with coins 1, 3 and 4, so prove it safe or switch to DP.
twin:
  term: dynamic-programming
  difference: A greedy algorithm commits to the best-looking choice now and never looks back. Dynamic programming keeps the best answer for every smaller problem and combines them.
related: [dynamic-programming, comparator, brute-force]
level: 2
lessons: [algo.intervals-and-greedy]
