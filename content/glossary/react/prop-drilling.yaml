term: prop drilling
aka:
  - props drilling
short: Passing a value through several layers of components that don't use it, only to reach a deep child.
explain: |
  The page knows the current user. A button six levels down needs it. Every component in
  between takes `user` and hands it on, without using it.

  A few levels is fine and clear to follow. Past that, consider passing components as
  `children` so the value skips the middle, or React context for values many parts need,
  such as a theme.
analogy: A note passed along a row of desks to the back of the class. Everybody handles it; only one person reads it.
example:
  language: tsx
  code: |
    <Page user={user} />
    // Page -> <Sidebar user={user} />
    // Sidebar -> <Menu user={user} />
    // Menu -> <Avatar user={user} /> // the only one that reads it
usage: That's six levels of prop drilling for one avatar; pass the avatar in as children.
twin:
  term: react-context
  difference: Prop drilling passes a value by hand through every layer. React context lets any child below a provider read it directly, at the cost of hiding where it came from.
related:
  - props
  - react-context
  - lifting-state-up
level: 2
