id: cs.data-representation
title: Data representation
objective: Explain bits, integers, floating point, money, and Unicode and UTF-8.
level: essential
minutes: 10
concepts: [cs.binary-integers, cs.floating-point, cs.money, cs.unicode]
prerequisites: [db.sql-queries, js.coercion]
opening:
  text: >-
    You'll know why ten 10p coins don't make a pound in code, and why one emoji counts as
    two characters. Both bugs reach real invoices and real name fields.

steps:
  - type: prose
    id: name-bits
    body: >-
      Everything in a computer is **bits**: switches that are 0 or 1. Eight bits make a
      **byte**.


      A whole number is stored in binary, in a fixed number of bits. Each extra bit doubles
      how many values fit. A Postgres `integer` column has 32 bits, so its top value is
      2,147,483,647. One more, and there's no room left. A `bigint` column has 64 bits, room
      for about nine quintillion.

  - type: sql
    id: fix-id-overflow
    concept: cs.binary-integers
    difficulty: 2
    prompt: >-
      An events table has used up its `integer` ids. Run it and read the error. Then change the
      `id` column's type to `bigint`, so the new row fits.
    starter: |
      CREATE TABLE events (id integer PRIMARY KEY, name text NOT NULL);
      INSERT INTO events VALUES (2147483647, 'signup');
      INSERT INTO events VALUES (2147483648, 'login');
      SELECT * FROM events;
    solution: |
      CREATE TABLE events (id bigint PRIMARY KEY, name text NOT NULL);
      INSERT INTO events VALUES (2147483647, 'signup');
      INSERT INTO events VALUES (2147483648, 'login');
      SELECT * FROM events;
    checks:
      ordered: false
    hints:
      - The error names the type that's too small.
      - The type sits after `id` in `CREATE TABLE`.

  - type: prose
    id: name-floating-point
    body: >-
      A JavaScript number is a 64-bit **floating point** value. Fractions are stored in binary
      too, built from halves, quarters and eighths.


      In binary, 0.1 never ends, the way a third never ends in decimal. So it's rounded to the
      nearest value that fits, a hair away from 0.1. Whole numbers stay exact, up to
      `Number.MAX_SAFE_INTEGER`, which is about nine quadrillion.

  - type: predict-output
    id: predict-ten-coins
    concept: cs.floating-point
    difficulty: 1
    language: js
    code: |
      let pounds = 0;
      for (let coin = 0; coin < 10; coin++) {
        pounds = pounds + 0.1;      // add a 10p coin
      }
      console.log(pounds === 1);
    question: Ten coins of 10p each. What does it log?
    choices:
      - text: '`true`'
        feedback: >-
          On paper, yes. In Node the total came to `0.9999999999999999`. Each `0.1` was a hair
          short.
      - text: '`false`'
        correct: true
        feedback: >-
          Right. Each `0.1` is a hair off, and ten of them show.
      - text: It throws an error
        feedback: >-
          Nothing throws. The sum is quietly wrong, which is worse. No error points at it.

  - type: prose
    id: name-money
    body: >-
      So how do real apps handle **money**? They count whole pence, which are exact. Turn
      pounds into pence once, as the price comes in. Add and multiply in pence. Divide by 100
      only when you show the amount.


      Even that first step needs care. `4.35 * 100` gives `434.99999999999994`, so round it.

  - type: fill-blank
    id: fill-whole-pence
    concept: cs.money
    difficulty: 2
    language: js
    prompt: >-
      Three items at £4.35. Keep the maths in pence, then show pounds. Fill the gaps.
    template: |
      const pricePence = Math.{{1}}(4.35 * 100);     // 435
      const totalPence = pricePence * 3;             // 1305, exact

      const pounds = new Intl.NumberFormat('en-GB', {
        style: 'currency',
        currency: 'GBP',
      });
      console.log(pounds.format(totalPence / {{2}}));   // £13.05
    blanks:
      - key: '1'
        answer: round
      - key: '2'
        answer: '100'
    bank: [round, floor, '100', '10', '3']

  - type: prose
    id: name-unicode
    body: >-
      Text is numbers too. **Unicode** gives every character a number, its **code point**.
      "A" is 65, and the grinning face 😀 is 128,512. **UTF-8** writes those numbers as 1 to 4
      bytes in files and on the network.


      JavaScript keeps a string as 16-bit pieces. Most characters take one piece, but an emoji
      takes two. `length` counts pieces, not characters. `[...text]` splits text into whole
      characters.

  - type: ai-review
    id: review-slice-cuts-emoji
    concept: cs.unicode
    difficulty: 3
    language: js
    request: Shorten long display names to 7 characters for the sidebar.
    flawClass: edge-case
    code: |
      function shortName(name) {
        if (name.length <= 7) return name;
        return name.slice(0, 7);
      }
    prompt: >-
      An assistant wrote this. The tests used plain names like "Alexander", and passed. A
      user called "Rosie 😀 Lee" now shows as "Rosie �" in the sidebar. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`slice` cut the emoji in half'
        correct: true
        feedback: >-
          Yes. The emoji is two pieces, and the cut fell between them.
      - text: '`<=` should be `<`'
        feedback: >-
          That only changes what happens to names of exactly 7. It can't produce a broken
          character.
      - text: The sidebar's font has no emoji
        feedback: >-
          A missing glyph would show for the whole emoji. Here half of it was removed before
          the font was asked.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Shorten a name with an emoji near the cut
          correct: true
          feedback: >-
            Yes. That's where `slice` can split a character in two.
        - text: Shorten a long plain name
          feedback: >-
            That's the test it passed. Plain letters are one piece each, so any cut is clean.
        - text: Pass a name of exactly 7 letters
          feedback: >-
            A good boundary, but nothing gets cut. The bug needs a cut through an emoji.
    fix: |
      function shortName(name) {
        const characters = [...name];   // whole characters, emoji included
        if (characters.length <= 7) return name;
        return characters.slice(0, 7).join('');
      }

  - type: code-challenge
    id: write-split-bill
    concept: cs.money
    difficulty: 4
    language: ts
    prompt: >-
      Write `splitBill(totalPence, people)`. Return each person's share, in whole pence. The
      shares must add up to the total exactly.


      Everyone gets the rounded-down share. The pennies left over go one each to the first
      people in the list. Throw unless `totalPence` is a whole number of 0 or more, and
      `people` a whole number of 1 or more.


      So `splitBill(1000, 3)` is `[334, 333, 333]`.
    hints:
      - Two numbers do all the work. They are the whole-pence share, and the pennies left over.
      - '`Math.floor(totalPence / people)` is the share, and `totalPence % people` is the leftover.'
      - 'In the loop, person `i` gets one extra penny while `i` is less than the leftover.'

  - type: explain-back
    id: explain-tenth
    concept: cs.floating-point
    difficulty: 4
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer's till adds prices held as numbers like `0.1` and `4.35`, and a total is
      sometimes a penny out. Explain why a JavaScript number can't hold 0.1 exactly.
    rubric:
      - A number is stored in binary floating point, with a fixed count of bits for its digits.
      - In binary, 0.1 is a fraction that never ends, so it's rounded to the nearest value that fits.
      - Sums carry those small errors along, so money is kept as whole pence, which are exact.
    modelAnswer: >-
      A JavaScript number is stored in binary, with a fixed number of digits. Binary fractions
      are built from halves, quarters and eighths. A tenth can't be made from those exactly,
      the way a third can't be written out in decimal. So the stored value is the nearest one
      that fits, a hair away from 0.1. Add enough of them and a hair shows in the pennies.
      Whole numbers are exact, so keep money in pence.

recap:
  - Pick a column type with room to grow, because a fixed number of bits has a top value.
  - Expect binary floating point to round most decimal fractions, and keep money in whole pence.
  - Tell code points from bytes and from `length`, and never cut a string mid-character.

recall:
  - id: card-bits
    concept: cs.binary-integers
    front: Why can an `integer` id column run out, and what's the fix?
    back: >-
      It has 32 bits, so its top value is 2,147,483,647. Use `bigint`, with 64 bits, for ids
      that can grow past it.
  - id: card-float
    concept: cs.floating-point
    front: Why is `0.1 + 0.2` not exactly `0.3` in JavaScript?
    back: >-
      Numbers are binary floating point. 0.1 and 0.2 never end in binary, so each is rounded,
      and the errors show in the sum.
  - id: card-money
    concept: cs.money
    front: How should code store an amount of money?
    back: >-
      As a whole number of the smallest unit, such as pence, or in a decimal type. Never as a
      binary float.
  - id: card-unicode
    concept: cs.unicode
    front: What's the difference between a code point and its UTF-8 bytes?
    back: >-
      A code point is the character's number in Unicode. UTF-8 writes that number as 1 to 4
      bytes.

references:
  - kind: paper
    title: What every computer scientist should know about floating-point arithmetic
    authors: David Goldberg
    year: 1991
    venue: ACM Computing Surveys, 23(1)
    url: https://doi.org/10.1145/103162.103163
    note: The standard account of rounding error, and of the IEEE 754 format.
    primary: true
    verified: true
  - kind: rfc
    title: 'RFC 3629: UTF-8, a transformation format of ISO 10646'
    authors: F. Yergeau
    year: 2003
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc3629
    note: Defines UTF-8, with the table of which code points take 1, 2, 3 or 4 bytes.
    primary: true
    verified: true
  - kind: docs
    title: 'String: length'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/length
    note: Why `length` counts UTF-16 code units, and what that does to emoji.
    verified: true
  - kind: docs
    title: Number.MAX_SAFE_INTEGER
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Number/MAX_SAFE_INTEGER
    note: The largest whole number a JavaScript number holds exactly, and why.
    verified: true

deepDive: >-
  All outputs are from Node 24. Ten additions of `0.1` gave `0.9999999999999999`, and
  `0.1 + 0.2` gave `0.30000000000000004`. Printed to 20 places, `0.1` is
  `0.10000000000000000555`. Whole numbers are exact up to `Number.MAX_SAFE_INTEGER`, which is
  9,007,199,254,740,991. Past it, adding 1 and adding 2 gave the same result. For bigger
  whole numbers JavaScript has `BigInt`. Databases have an exact decimal type for money,
  called `numeric` in PostgreSQL.


  Two's complement in one line: in 8 bits, the top place is worth minus 128, not 128. So
  eight 1s mean minus 1. JavaScript's bit operators work on 32 bits. There, minus 1 is 32
  ones, which read as 4,294,967,295 when treated as unsigned.


  In UTF-8, "A" took 1 byte, "é" 2, "€" 3 and the grinning face 4. The first 128 code points
  match old ASCII byte for byte, which is why UTF-8 won. A code point past 65,535 needs two
  16-bit units in a JavaScript string. That pair is what `slice` cut in half.


  Splitting by code point isn't the end of it. "é" can be one code point, or an "e" plus a
  combining accent. They look alike, have lengths 1 and 2, and aren't `===` until you call
  `normalize()`. A family emoji is several people joined by invisible joiners. Its `length`
  was 8, and the code-point fix cut it down to one man. `Intl.Segmenter` splits text into
  what a reader would call characters, and kept the family whole.
