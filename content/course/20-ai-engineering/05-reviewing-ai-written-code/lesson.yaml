id: ai.reviewing-ai-code
title: Reviewing AI-written code
objective: Apply a checklist of flaw classes.
level: essential
minutes: 10
concepts: [ai.hallucination, ai.flaw-classes, ai.review-checklist]
prerequisites: [tooling.working-with-ai, ai.how-llms-work, security.injection-and-ssrf]
opening:
  text: >-
    You'll review generated code with a fixed list of questions, so what reads well doesn't
    slip through. You've been doing one of these on every ai-review step since module 3.

steps:
  - type: bug-hunt
    id: hunt-invented-method
    concept: ai.hallucination
    difficulty: 1
    language: python
    code: |
      # An assistant wrote this to total a basket.
      prices = [3.50, 4.00, 2.25]
      total = prices.sum()
      print(f"Total: {total}")
    prompt: >-
      It reads fine, and it stops with `AttributeError: 'list' object has no attribute
      'sum'`. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Python lists have no `sum` method
        correct: true
        feedback: >-
          Right. It's `sum(prices)`. The method sounded right, so the model wrote it.
      - text: The prices need to be whole numbers
        feedback: >-
          Adding floats works fine. The method being called doesn't exist.
      - text: The f-string can't show a float
        feedback: >-
          f-strings show floats happily. The program stops a line earlier.
    fix: |
      prices = [3.50, 4.00, 2.25]
      total = sum(prices)
      print(f"Total: {total}")

  - type: prose
    id: name-hallucination
    body: >-
      A model writes the likeliest next token, and a method called `sum` is likely. It doesn't
      look up whether `sum` exists. Fluent, plausible and false is a **hallucination**. In code
      it's an invented method, an unpublished package, or an option the library never had.


      So the first question of any review is: does every name here exist? Not "does it read
      right", which it always does.
  - type: multiple-choice
    id: pick-flaw-class
    concept: ai.flaw-classes
    difficulty: 2
    language: js
    code: |
      // "return the last n items"
      function lastN(items, n) {
        return items.slice(-n);
      }
      lastN(['a', 'b', 'c', 'd'], 2);   // ['c', 'd']
      lastN(['a', 'b', 'c', 'd'], 0);   // ['a', 'b', 'c', 'd']
    question: Asked for the last 0 items, it returns all four. Which kind of flaw is that?
    choices:
      - text: A hallucinated API
        feedback: >-
          `slice` is real and does what the docs say. The mistake is an input nobody tried.
      - text: An unhandled edge case
        correct: true
        feedback: >-
          Right. `slice(-0)` is `slice(0)`. The test tried 2 and 3, never 0.
      - text: A performance flaw
        feedback: >-
          `slice` is quick. The answer is wrong, not slow.

  - type: prose
    id: name-flaw-classes
    body: >-
      Generated code fails in recurring ways. Six **flaw classes** cover most of them, and every
      ai-review since module 3 planted one. **Logic**: a wrong rule. **Race**: a gap between a
      check and a write. **Security**: untrusted data reaching a query. **Hallucinated API**: a
      name that doesn't exist. **Edge case**: an input nobody tried, like 0. **Performance**:
      fine at 10, dead at 100,000.
  - type: bug-hunt
    id: hunt-swallowed-error
    concept: ai.flaw-classes
    difficulty: 3
    language: js
    code: |
      async function saveOrder(order) {
        try {
          await db.insert('orders', order);
        } catch (error) {
          console.log('save failed');
        }
        return 'saved';
      }
    prompt: >-
      The disk filled up at 3 a.m. and the log says "save failed" 400 times. Every caller was
      told the order was saved. Tap the line at fault.
    lines: [5]
    reasons:
      - text: The error is logged and then ignored
        correct: true
        feedback: >-
          Yes. It printed "save failed", then returned "saved". Rethrow, or return a failure.
      - text: '`console.log` should be `console.error`'
        feedback: >-
          A better log level, and the caller would still be told "saved". The level isn't the flaw.
      - text: The `try` should wrap the `return` too
        feedback: >-
          Moving the return inside changes nothing. The catch still turns a failure into success.
    fix: |
      } catch (error) {
        console.error('save failed', error);
        throw error;              // the caller must know
      }

  - type: multiple-choice
    id: pick-what-test-proves
    concept: ai.review-checklist
    difficulty: 3
    language: js
    code: |
      // the assistant's test for saveOrder
      test('saves an order', async () => {
        await saveOrder({ id: 'o-41', pence: 1250 });
      });
      // ✓ saves an order (3 ms)
    question: The test is green. What does it prove about saving?
    choices:
      - text: That the order was written to the database
        feedback: >-
          Nothing reads the database afterwards. The test would pass with the insert deleted.
      - text: That `saveOrder` doesn't throw
        correct: true
        feedback: >-
          Right. And after the previous step, it can't throw. Green, and empty.
      - text: That the id and price are valid
        feedback: >-
          No assertion looks at them. A test with no `expect` checks nothing at all.

  - type: prose
    id: name-review-checklist
    body: >-
      Reading for plausibility misses this, because generated code is built to be
      plausible. So use a **review checklist**: the same questions on every change.


      Does every name exist? What input breaks it: empty, zero, huge, two at once? Where does
      untrusted data go? What happens on failure? What does the test assert? What does it cost
      at 100,000? Research found assistant users wrote less secure code and felt surer.
  - type: ai-review
    id: review-string-built-query
    concept: ai.review-checklist
    difficulty: 4
    language: ts
    request: Add an endpoint that returns one customer's orders.
    flawClass: security
    code: |
      // customerId comes straight from the request's query string
      async function ordersFor(customerId) {
        const rows = await db.query(
          `SELECT id, total FROM orders WHERE customer_id = '${customerId}'`,
        );
        return rows;
      }
    prompt: >-
      An assistant wrote this. It returns the right orders for every customer id the tester
      typed. Run the checklist: where does untrusted data go? Tap the line at fault.
    lines: [4]
    reasons:
      - text: The query is built from the request by string
        correct: true
        feedback: >-
          Yes. `customer=x' OR '1'='1` returns everyone's orders. Use a parameter, `$1`.
      - text: The id should come from the path instead
        feedback: >-
          Either would carry the same untrusted text. Where it comes from isn't the flaw. Where
          it goes is.
      - text: Returning the rows leaks the row shape
        feedback: >-
          Returning id and total is the function's job. The injection sits one line higher.
    fix: |
      const rows = await db.query(
        'SELECT id, total FROM orders WHERE customer_id = $1',
        [customerId],
      );

  - type: code-challenge
    id: write-unknown-imports
    concept: ai.hallucination
    difficulty: 4
    language: ts
    prompt: >-
      Write `unknownImports(imports, allowed)`. Each import has a `name` and a `from` path.
      `allowed` lists the packages your project installs. Return the packages that aren't on
      it, sorted, each once.


      A path starting with `.` or `node:` isn't a package: skip it. A sub-path like
      `'lodash/get'` belongs to `lodash`. A scoped path like `'@acme/utils/x'` belongs to
      `'@acme/utils'`.


      So `[{ name: 'fmt', from: 'money-format-pro' }]` against `['zod']` gives
      `['money-format-pro']`.
    hints:
      - Write a small helper that turns a path into its package name. `split('/')` is most of it.
      - A scoped package starts with `@`, so it keeps its first two parts instead of one.
      - "Keep a `found` list, push a package only if it isn't in `allowed` or `found`, then `sort()`."

  - type: explain-back
    id: explain-looks-right
    concept: ai.hallucination
    difficulty: 4
    prompt: >-
      A teammate approves generated code because it "looks right" and the assistant "is usually
      correct". Why is that not a review, and what would be?
    rubric:
      - Generated code is built to look right, because the model writes the likeliest tokens, not checked ones.
      - Looking right says nothing about invented names, untried inputs, untrusted data or swallowed errors.
      - A review asks a fixed list of questions on every change and runs the code on the inputs that break it.
    modelAnswer: >-
      Looking right is the one thing generated code is guaranteed to do. The model produces
      the likeliest text. Likely text reads well whether or not the method exists. "Usually
      correct" is a rate, and a review is for the other times. A review asks the same
      questions every time. Does each name exist? What input breaks this? Where does untrusted
      data go? What happens on failure? What does the test assert? Then it runs the code on
      those inputs.
recap:
  - Check that every name in generated code exists before you check anything else.
  - Name the flaw class you're looking for, since each one has a question that finds it.
  - Run the same checklist on every generated change, and never approve on plausibility.

recall:
  - id: card-hallucination
    concept: ai.hallucination
    front: What does a hallucination look like in generated code?
    back: >-
      A method, package or option that doesn't exist, written because it sounded likely. It
      reads fine and fails at run time.
  - id: card-flaw-classes
    concept: ai.flaw-classes
    front: Name the six flaw classes this course reviews for.
    back: >-
      Logic, race, security, hallucinated API, edge case and performance.
  - id: card-swallowed-error
    concept: ai.flaw-classes
    front: Why is a catch block that only logs a flaw?
    back: >-
      The failure is hidden and the caller is told it worked. Rethrow, or return a result that
      says it failed.
  - id: card-checklist
    concept: ai.review-checklist
    front: Why use a fixed checklist instead of reading the code carefully?
    back: >-
      Generated code is built to read well. A fixed list of questions finds invented names,
      untried inputs and empty tests that plausibility misses.

references:
  - kind: paper
    title: How AI Impacts Skill Formation
    authors: Judy Hanwen Shen and Alex Tamkin
    year: 2026
    venue: arXiv 2601.20245
    url: https://arxiv.org/abs/2601.20245
    note: Which ways of working with an assistant kept people's skills, and which didn't.
    primary: true
    verified: true
  - kind: paper
    title: Do Users Write More Insecure Code with AI Assistants?
    authors: Neil Perry, Megha Srivastava, Deepak Kumar and Dan Boneh
    year: 2023
    venue: Proceedings of the 2023 ACM SIGSAC Conference on Computer and Communications Security
    url: https://doi.org/10.1145/3576915.3623157
    note: People with an assistant wrote less secure code and rated it as more secure.
    primary: true
    verified: true

deepDive: >-
  The three outputs in this lesson are real, on Node 24. `amounts.sum()` threw the
  `TypeError` shown, and `slice(-0)` returned the whole array. The swallowing `saveOrder`
  printed "save failed" and then returned "saved". No model was called. The samples are
  the shapes we've seen assistants produce, written by hand.


  The six flaw classes are this course's own list, and every ai-review step since module 3
  is tagged with one. The working-with-AI lesson introduced the habit; this lesson names the
  questions. The security study in Read next is the one that lesson quoted. Assistant users
  wrote less secure code and felt surer. That is why a feeling of correctness isn't a check.


  A hallucinated package is worse than a hallucinated method. The method fails at once. The
  package name might be registered by someone else, in the hope that generated code imports
  it. That's a supply-chain attack. The challenge's allow-list is the cheap defence: only
  packages you chose get installed.


  The checklist is deliberately dull. Its value is that it doesn't depend on how alert you are at five o'clock. And the
  model's fluency can't talk you out of a question you were always going to ask.
