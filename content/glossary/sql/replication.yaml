term: replication
aka: [read replica, leader and followers, primary and replica]
short: Keeping full copies of the same database on several machines, kept in step with one main copy.
explain: |
  One database server can only answer so many reads, and if it dies, everything stops.
  Copying all the data to other machines gives you spare readers and a stand-by.

  Usually one leader takes the writes and streams them to followers. Most setups copy
  asynchronously, so a follower can be a moment behind: a user saves a profile, the next
  page reads from a follower, and the old value appears. That's **replica lag**. Read your
  own writes from the leader.
analogy: Photocopies of a recipe pinned up in every kitchen. Everyone can cook at once, but a correction to the original takes a moment to reach the copies.
usage: Send the dashboard reads to the read replica, but read the profile page from the leader so people see their own edit.
twin:
  term: sharding
  difference: Replication copies all the data to every machine, which helps reads and survival. Sharding splits the data so each machine holds only a part, which helps writes and size.
related: [sharding, eventual-consistency, cap-theorem, single-point-of-failure]
level: 2
lessons: [sysdesign.replication, db.storage-and-pooling]
