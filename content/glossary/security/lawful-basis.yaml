term: lawful basis
aka: [legal basis, lawful bases, legitimate interests]
short: The legal reason, chosen before collecting, that allows you to process someone's personal data for one purpose.
explain: |
  Under data protection law such as the GDPR, you may not keep personal data because it
  might be useful. Each purpose needs a reason the law accepts, picked before you collect.

  There are six. The common ones are a contract with the person, a legal obligation,
  consent, and legitimate interests. Consent is the wrong pick for anything you'd do anyway, such as storing a delivery
  address. People can withdraw consent at any time. Record the basis next
  to the purpose, so retention and erasure rules can follow from it.
analogy: A doctor needing a reason to read your notes. Treating you counts; curiosity doesn't.
usage: What's our lawful basis for keeping the phone numbers after the order ships? If there isn't one, delete them.
related: [pii, data-minimisation, pseudonymisation, data-processor]
level: 3
lessons: [security.personal-data]
