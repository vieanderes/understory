    title: Web Content Accessibility Guidelines (WCAG) 2.2
    authors: Alastair Campbell, Chuck Adams, Rachael Bradley Montgomery, Michael Cooper, Andrew Kirkpatrick
    year: 2023
    venue: W3C Recommendation
