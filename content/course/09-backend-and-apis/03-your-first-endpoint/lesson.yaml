deepDive: >-
  `Request` and `Response` are the same objects `fetch` uses in the browser. That's why the
  same handler shape runs almost anywhere: Next.js route handlers, Deno, Bun and Cloudflare
  Workers all call a function with a `Request` and expect a `Response` back. Only the line
  that starts the server changes.


  Add `"type": "module"` to `package.json` when a `.js` file uses `import`. Node 24 runs
  the file without it, but prints a `MODULE_TYPELESS_PACKAGE_JSON` warning and parses the
  file twice.


  `curl -d` sends `Content-Type: application/x-www-form-urlencoded` unless you say
  otherwise. `request.json()` reads the text as JSON anyway, but polite clients send
  `-H "Content-Type: application/json"`. The next lesson covers `-H`.


  Frameworks such as Hono and Express add a router: `app.get("/todos/:id", ...)` instead of
  a chain of `if`s. They do exactly what you wrote, with less typing and the id pulled out
  for you.
