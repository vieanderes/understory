deepDive: >-
  Everything ran in Docker Compose: Caddy 2.11.4 in front of two Node 24 apps. Round robin
  answered app1, app2, app1, app2. With app2 stopped and no health check, the four requests
  returned `200 502 200 502`. Caddy logged `dial tcp: lookup app2 on 127.0.0.11:53: no
  such host`. With `health_uri /health` and `health_interval 2s`, all four returned 200 five
  seconds after the stop. The log showed each failed check. In the seconds before a check
  fails, a request can still land on the dead app. Caddy can retry it on another upstream
  with `lb_try_duration`, and remember a failure for a while with `fail_duration`.


  `lb_policy least_conn` sends each request to the upstream with the fewest in flight. It
  suits an endpoint that calls a language model. One request takes 50 ms and the next takes
  20 seconds, so turns alone can pile work onto one copy. The sticky run used `lb_policy
  cookie`: Caddy set a cookie named `lb`, and a new one when app2 was gone.


  The `X-Forwarded-For` test ran against nginx 1.31 with `proxy_set_header X-Forwarded-For
  $proxy_add_x_forwarded_for`. We sent `10.0.0.1` and the app saw `10.0.0.1,
  172.66.172.252`, the second being the address Docker's network showed nginx. Caddy
  replaced the header we sent, because it doesn't trust clients by default. Know which one
  your proxy does before your app reads that header. Express's `trust proxy` setting and the
  `proxy-addr` package count proxies from the right, as the challenge does.


  Open-source nginx balances round robin by default, and offers `least_conn` and `ip_hash`.
  Its documentation lists `sticky cookie` and active `health_check` as part of the
  commercial subscription. Caddy served `localhost` with a certificate from "Caddy Local
  Authority", which is why `curl` needed `-k`. On a public domain, the same Caddyfile with
  a real name gets a public certificate by ACME, as lesson 3 described.
