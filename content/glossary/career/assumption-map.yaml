term: assumption map
aka: [assumption mapping, riskiest assumption]
short: The bets a plan rests on, written as claims that could be false and ranked by risk.
explain: |
  Every build rests on beliefs. Users want this. The data is good enough. The model can
  read these forms. If one is false, the build is wasted.

  Write each as a claim that could be wrong. Rank them by how damaging and how uncertain
  they are. Then test the riskiest one first, with the smallest thing that can prove it
  false.
analogy: Checking the ice is thick enough before planning the skating party.
usage: Top of the assumption map is that the scans are readable; test that before we design a single screen.
related: [vertical-slice, success-metric, pre-mortem]
level: 3
lessons: [aisys.shaping-the-build]
