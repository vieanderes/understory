id: testing.tdd
title: The TDD loop
objective: Apply red, green, refactor to a pricing rule, writing the next failing test yourself.
level: essential
minutes: 10
concepts: [testing.red-green-refactor, testing.refactoring, testing.test-first-design]
prerequisites: [testing.unit-tests]
opening:
  text: >-
    You'll build a pricing rule one test at a time, and never write a line the tests didn't
    ask for. The code that comes out is small, and you'll know it works at every step.

steps:
  - type: prose
    id: the-loop
    body: >-
      In lesson 1 you wrote tests for code that already existed. **Test-driven development**
      flips the order, in a loop of three moves. Red: write one test that fails. Green:
      write the least code that passes it. Refactor: tidy the code while the tests stay
      green.


      Small steps. The test says what to build next, and the green run says you built it.

  - type: predict-output
    id: predict-red-run
    concept: testing.red-green-refactor
    difficulty: 1
    language: js
    code: |
      // price.test.js
      import { priceFor } from './price.js';

      test('one mug costs the unit price', () => {
        expect(priceFor(1, 400)).toBe(400);
      });
      // price.js is empty
    question: You run the test before writing any code. What happens?
    choices:
      - text: 'It fails: `priceFor is not a function`'
        correct: true
        feedback: >-
          Right. That's the red step. The test tells you exactly what's missing.
      - text: It fails with `expected undefined to be 400`
        feedback: >-
          Close. `priceFor` doesn't exist at all, so the call itself throws before any `expect`.
      - text: It's skipped, since the file is empty
        feedback: >-
          Vitest runs every test it finds. This one runs, calls nothing, and fails.

  - type: predict-output
    id: predict-least-code
    concept: testing.red-green-refactor
    difficulty: 2
    language: js
    code: |
      // price.js, the smallest change that goes green
      export function priceFor() {
        return 400;
      }
      // then a second test:
      test('three mugs cost three times the unit price', () => {
        expect(priceFor(3, 400)).toBe(1200);
      });
    question: What does the run say after the second test is added?
    choices:
      - text: 'One passes, one fails: `expected 400 to be 1200`'
        correct: true
        feedback: >-
          Yes. The hard-coded 400 was honest for one test. The second forces the real rule.
      - text: Both pass, since 400 is the unit price
        feedback: >-
          The function ignores its arguments. Three mugs come back as 400, and the test says so.
      - text: Both fail, because the arguments are missing
        feedback: >-
          Missing parameters aren't an error in JavaScript. The first test still gets its 400.

  - type: prose
    id: triangulation
    body: >-
      Returning `400` looks silly, and it's the point. The least code that passes is the
      honest measure of what the tests demand. The second test forces `qty * unitPence`.


      That's **triangulation**: a second example pins the rule the first left open. Add
      examples until the obvious code is the general code.

  - type: fill-blank
    id: fill-discount-step
    concept: testing.red-green-refactor
    difficulty: 2
    language: js
    prompt: >-
      The third test says ten mugs get ten percent off: `priceFor(10, 400)` is `3600`. Go
      green with the least code. `Math.floor` rounds down. Fill the gaps.
    template: |
      export function priceFor(qty, unitPence) {
        if (qty {{1}} 10) return qty * unitPence - Math.floor(qty * unitPence / {{2}});
        return qty * unitPence;
      }
    blanks:
      - key: '1'
        answer: '>='
      - key: '2'
        answer: '10'
    bank: ['>=', '>', '10', '100', '0.9']

  - type: prose
    id: refactoring-and-design
    body: >-
      **Refactoring** changes the structure and keeps the behaviour. You can only claim that
      with tests that ran before and after. Without them, a refactor is a rewrite with hope.


      Writing the test first also tests the **design**. You call `priceFor(10, 400)` before it
      exists, so you find out how it feels to call. An awkward signature shows up in the
      test, before it's spread through the code.

  - type: ai-review
    id: review-refactor-changed-behaviour
    concept: testing.refactoring
    difficulty: 4
    language: js
    request: Tidy up priceFor. Same behaviour, cleaner code.
    flawClass: logic
    code: |
      export function priceFor(qty, unitPence) {
        const full = qty * unitPence;
        return qty >= 10 ? full * 0.9 : full;
      }
      // tests: priceFor(1, 400) is 400, priceFor(3, 400) is 1200, priceFor(10, 400) is 3600
    prompt: >-
      An assistant wrote this. All three tests pass. Then a customer buys eleven mugs at 37
      pence and the total shows `366.3`. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`* 0.9` drops the rounding to whole pence'
        correct: true
        feedback: >-
          Yes. A refactor kept the tests green but changed behaviour the tests never pinned.
      - text: '`qty >= 10` should be `qty > 10`'
        feedback: >-
          Ten mugs get the discount, and the third test checks it. The comparison is right.
      - text: The tests should have been deleted first
        feedback: >-
          The tests are what lets you refactor. They needed one more case, not fewer.
    fix: |
      export function priceFor(qty, unitPence) {
        const full = qty * unitPence;
        const discount = qty >= 10 ? Math.floor(full / 10) : 0;
        return full - discount;
      }
      // and a test that pins it: priceFor(11, 37) is 367

  - type: code-challenge
    id: write-price-for
    concept: testing.test-first-design
    difficulty: 4
    language: ts
    prompt: >-
      New rule: from 50 items, take twenty percent off instead of ten. Round the discount
      down, as before.


      Red first: fill in the test, so it fails on the code as it stands. Then change
      `priceFor` until it passes. We'll check both moves, and the old rules too.
    hints:
      - Write the test before you touch `priceFor`. The comment gives the answer to expect.
      - Twenty percent off is `Math.floor(full / 5)`. Check 50 before you check 10.
      - 'Start the test with `expect(priceFor(50, 400))`.'

  - type: explain-back
    id: explain-why-least-code
    concept: testing.test-first-design
    difficulty: 4
    prompt: >-
      A teammate says returning a hard-coded `400` to pass the first test is a waste of a
      step. What does the step buy you?
    rubric:
      - It proves the test can fail and then pass, so the test is checking something real.
      - It keeps you from writing code no test asked for, which is code with no proof.
      - The next test, not a guess, decides what the code becomes.
    modelAnswer: >-
      The silly version proves the loop works: the test went red, then green, on that change
      alone. It also stops you guessing. Anything beyond `400` is code nobody asked for and
      nothing checks. The second test, three mugs, is what earns the multiplication. Each
      test buys one piece of the rule, so the code has a reason for every line. That's the
      discipline, not the `400`.

recap:
  - 'Run the loop: one failing test, the least code to pass it, then tidy.'
  - Refactor only with tests that were green before and stay green after.
  - Let the first call in a test shape the function's design.

recall:
  - id: card-three-moves
    concept: testing.red-green-refactor
    front: What are the three moves of the TDD loop, and what does each prove?
    back: >-
      Red proves the test can fail. Green proves the code passes it. Refactor proves the
      tidy-up changed nothing, because the tests stay green.
  - id: card-least-code
    concept: testing.red-green-refactor
    front: Why write the least code that passes, even a hard-coded value?
    back: >-
      It shows exactly what the tests demand. The next test forces the general rule.
  - id: card-refactor-definition
    concept: testing.refactoring
    front: What makes a change a refactor rather than a rewrite?
    back: >-
      The behaviour stays the same, and green tests before and after are the proof.
  - id: card-design-feedback
    concept: testing.test-first-design
    front: How does writing the test first improve the design?
    back: >-
      You call the function before it exists, so an awkward signature shows in one place
      instead of across the code.

references:
  - kind: book
    title: 'Test Driven Development: By Example'
    authors: Kent Beck
    year: 2003
    venue: Addison-Wesley
    note: The loop, triangulation, and the case for the smallest step.
    primary: true
    verified: true
  - kind: book
    title: Refactoring
    authors: Martin Fowler
    year: 2018
    venue: Addison-Wesley, second edition
    url: https://refactoring.com/
    note: The definition, and the rule that a refactor needs tests around it.
    verified: true
  - kind: essay
    title: Test Driven Development
    authors: Martin Fowler
    year: 2023
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/TestDrivenDevelopment.html
    note: The three steps in one page, with the reminder to refactor after every green.
    verified: true

deepDive: >-
  The review's `366.3` is `407 * 0.9`: a tenth of 407 pence isn't whole. `Math.floor` on
  the discount keeps every price in whole pence, as the schema design lesson in chapter 10
  stores them.


  TDD isn't for everything. Exploring an unknown API or a layout is faster without it, and
  the tests come after. It shines when the rule is clear and the edges are many, such as
  pricing, dates and validation.


  The loop's timer is the refactor step. Skip it for a week and the tests are green over code
  nobody can read. Every green run is the moment to tidy, because it's the only moment you
  know it's safe.
