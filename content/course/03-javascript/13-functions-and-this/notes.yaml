summary: >-
  `this` is an extra input every ordinary function receives, and the **call** decides its
  value, not the place the function was written. Call it as `cart.add()` and `this` is the
  cart. Hand `cart.add` to a button or to `map`, and whoever calls it later decides. That one
  rule explains the most common JavaScript error in object-oriented code: "cannot read
  properties of undefined".


  There are five ways a call sets `this`, and they have an order of precedence: `new`, then an
  explicit `bind`, `call` or `apply`, then the object before the dot, then the default, which
  is `undefined` in strict code. Arrow functions sit outside the system: they have no `this`
  of their own and use the one from the code around them.


  In practice you meet `this` when a method becomes a callback: an event handler, a timer, an
  array method, a promise `then`. The fixes are an arrow wrapper, `bind`, or an arrow class
  field, and each has a cost worth knowing. Interviewers love this topic because it tests
  whether you understand how functions are called, not only how they are written.
remember:
  - "`this` is set by how a function is called, not where it's defined, except in arrow functions, which take `this` from the surrounding code."
  - "The rules in order of precedence are `new`, then `bind`, then `call` or `apply`, then the object before the dot, then the default."
  - A plain call gives `this` as `undefined` in strict code, which includes classes and modules, and the global object in sloppy scripts.
  - Passing `obj.method` without calling it passes the function alone, so the caller later decides `this` and the object is lost.
  - "`call` and `apply` invoke at once with a chosen `this`, arguments listed or in an array, while `bind` returns a new function with `this` fixed for good."
  - A bound function ignores later `call`, `apply` and `bind`, but `new` still overrides its bound `this`.
  - Arrow functions have no own `this`, `arguments`, `prototype` or `new`, so don't use them as object methods that need the object.
  - Every `bind` call and every inline arrow makes a new function, so keep the reference if you'll need to remove a listener later.
sections:
  - title: The five rules, in order
    body: |-
      When an ordinary function runs, the engine picks `this` by asking about the call, in
      this order.

      1. Was it called with `new`? Then `this` is the brand new object.
      2. Is it a bound function? Then `this` is the bound value.
      3. Was it called with `call` or `apply`? Then `this` is the first argument.
      4. Was it called as `obj.fn()`? Then `this` is `obj`.
      5. Otherwise, the default: `undefined` in strict code, the global object in sloppy
         code.

      Arrow functions skip the list and use the `this` of the code they were written in.

      ```js
      // Run as an ES module (a .mjs file), so the code is strict.
      function who() {
        return this?.name ?? String(this);
      }
      const lamp = { name: "lamp", who };
      const fan = { name: "fan" };

      console.log(who()); // undefined, the default rule in strict code
      console.log(lamp.who()); // lamp, the object before the dot
      console.log(who.call(fan)); // fan
      console.log(who.apply(fan, [])); // fan
      console.log(lamp.who.call(fan)); // fan, explicit beats implicit

      const bound = who.bind(fan);
      console.log(bound()); // fan
      console.log(bound.call(lamp)); // fan, a bound function ignores call

      function Light(name) {
        this.name = name;
      }
      const BoundLight = Light.bind(fan);
      console.log(new BoundLight("desk").name); // desk, new beats bind
      console.log(fan.name); // fan, untouched

      const heater = {
        name: "heater",
        later() {
          return [1].map(() => this.name); // the arrow uses later's this
        },
      };
      console.log(heater.later()); // [ 'heater' ]
      const arrow = () => this;
      console.log(arrow.call(fan)); // undefined, call can't change an arrow's this
      ```

      Where does "the object before the dot" come from? The engine evaluates `lamp.who` to a
      **reference** that remembers both the function and `lamp`. Calling the reference right
      away passes `lamp` as `this`. Store it in a variable first and only the function
      survives. That's why `(lamp.who)()` still works but `const f = lamp.who; f()` doesn't.

      The top-level `this` differs by context too: `undefined` in an ES module,
      `module.exports` in a CommonJS file, and `window` in a classic browser script.
  - title: Losing `this`, and three ways to keep it
    body: |-
      Any time a method travels without its object, `this` goes missing. Destructuring does
      it, so does passing a method as a callback.

      ```js
      class Chat {
        messages = [];
        send(text) {
          this.messages.push(text);
          return this.messages.length;
        }
      }
      const chat = new Chat();
      const tryIt = (label, fn) => {
        try {
          fn();
        } catch (error) {
          console.log(`${label}: ${error.constructor.name}`);
        }
      };

      const { send } = chat;
      tryIt("destructured", () => send("hi")); // destructured: TypeError
      tryIt("callback", () => ["hi"].forEach(chat.send)); // callback: TypeError

      ["a"].forEach((text) => chat.send(text)); // arrow wrapper
      ["b"].forEach(chat.send, chat); // the thisArg some APIs accept
      const boundSend = chat.send.bind(chat); // bind, kept for later
      ["c"].forEach(boundSend);
      console.log(chat.messages); // [ 'a', 'b', 'c' ]

      class SafeChat {
        messages = [];
        send = (text) => {
          this.messages.push(text); // an arrow field: one function per instance
          return this.messages.length;
        };
      }
      const safe = new SafeChat();
      const { send: safeSend } = safe;
      console.log(safeSend("hello")); // 1
      console.log(Object.hasOwn(safe, "send"), Object.hasOwn(SafeChat.prototype, "send")); // true false
      ```

      Each fix has a cost. An **arrow wrapper** at the call site is the clearest and costs
      nothing permanent, but it's a new function each time, so you can't remove it as a
      listener unless you keep it. **`bind` in the constructor**, `this.send =
      this.send.bind(this)`, gives one stable reference per instance, which suits
      `removeEventListener`. An **arrow class field** does the same with less ceremony, but
      the function lives on each instance rather than the prototype. That means more memory
      with many instances, no `super.send()` from a subclass, and a subclass can't override
      it with an ordinary method. Some APIs, like `forEach` and `map`, take a `thisArg`, but
      most callers, such as timers and promises, don't.

      In the browser, a `function` passed to `addEventListener` gets the element as `this`.
      So the detached method finds the wrong object rather than none, which is why the bug
      surfaces as a missing property such as `this.items`.
  - title: Arrow functions are more than short syntax
    body: |-
      An arrow function has no `this`, `arguments`, `super` or `new.target` of its own. It
      looks all of them up in the surrounding scope, like any other variable. It also has no
      `prototype`, so it can't be a constructor.

      ```js
      const basket = {
        items: ["tea", "jam"],
        countArrow: () => this?.items.length, // this is the module's, not the basket's
        count() {
          return this.items.length;
        },
      };
      console.log(basket.countArrow()); // undefined
      console.log(basket.count()); // 2

      const Make = () => {};
      try {
        new Make();
      } catch (error) {
        console.log(error.message); // Make is not a constructor
      }
      console.log(Make.prototype); // undefined

      function outer() {
        const inner = () => arguments.length; // outer's arguments, not inner's
        return inner(1, 2, 3);
      }
      console.log(outer("only one")); // 1
      ```

      So the rule of thumb: use arrows for callbacks inside methods, where you want the
      method's `this`. Use method shorthand, `count() {}`, for methods on objects and classes,
      where you want the caller's object. The object literal's braces are not a scope, so an
      arrow written as a property sees the `this` outside the literal.

      Two more places an arrow is wrong. A DOM handler that relies on `this` being the element
      breaks, so read `event.currentTarget` instead. And a function that needs `arguments`
      should use rest parameters, `(...args)`, which work in both kinds.
  - title: call, apply and bind in practice
    body: |-
      `call` and `apply` invoke a function once with a chosen `this`. The only difference is
      how you pass arguments: `fn.call(obj, a, b)` lists them, `fn.apply(obj, [a, b])` takes an
      array. Spread syntax has replaced most `apply` uses, `Math.max(...prices)` instead of
      `Math.max.apply(null, prices)`. `call` still appears when borrowing a method, such as
      `Object.prototype.hasOwnProperty.call(obj, key)`, which works even on objects without
      that method. Today `Object.hasOwn(obj, key)` is the neater version.

      `bind` returns a new **bound function**. Extra arguments are fixed in front, which is
      **partial application**. Writing a simplified version is a common interview task:

      ```js
      function myBind(fn, thisArg, ...preset) {
        return function bound(...args) {
          // Called with new: ignore thisArg, as the real bind does.
          if (new.target) {
            return new fn(...preset, ...args);
          }
          return fn.apply(thisArg, [...preset, ...args]);
        };
      }

      function price(currency, amount) {
        return `${this.shop}: ${currency}${amount.toFixed(2)}`;
      }
      const inPounds = myBind(price, { shop: "Bakery" }, "£");
      console.log(inPounds(2.5)); // Bakery: £2.50
      console.log(inPounds.call({ shop: "Other" }, 3)); // Bakery: £3.00

      const inEuros = price.bind({ shop: "Café" }, "€");
      console.log(inEuros(4)); // Café: €4.00
      console.log(inEuros.name, inEuros.length); // bound price 1
      ```

      The real `bind` also names the result `bound price` and sets `length` to the number of
      parameters left. Binding an arrow function changes nothing about its `this`, though the
      preset arguments still apply. And because a bound function is a different object from
      the original, `fn.bind(x) === fn.bind(x)` is `false`: bind once and keep the result.
pitfalls:
  - >-
    **Passing a method as a callback.** `addEventListener("click", cart.add)`,
    `setTimeout(timer.tick, 1000)` and `promise.then(store.save)` all detach the method, so it
    runs with the wrong `this`. Wrap it, `() => cart.add()`, or pass a bound copy.
  - >-
    **Writing object methods as arrows.** `{ total: () => this.items.length }` takes `this`
    from outside the object literal, usually `undefined`. Use method shorthand, `total() {}`,
    whenever a method needs its object.
  - >-
    **Binding at the call site, then trying to remove it.** `removeEventListener("keydown",
    this.onKey.bind(this))` creates a new function that was never added. Bind once in the
    constructor, or use an arrow field, or use an `AbortController` signal.
  - >-
    **A regular `function` callback inside a method.** `this.prices.map(function (p) { return
    p + this.fee; })` gives the inner function its own `this`, `undefined` in a class. Use an
    arrow so it sees the method's `this`.
  - >-
    **Relying on sloppy-mode defaults.** In an old non-module script a plain call sets `this`
    to `window`, so `this.name` quietly reads a global instead of throwing. Use modules or
    `"use strict"` so the bug surfaces as an error.
interview:
  - question: How is the value of `this` determined in JavaScript?
    answer: >-
      By the call site, in a fixed order of precedence. With `new`, `this` is the newly
      created object. If the function is bound, it's the bound value. With `call` or `apply`,
      it's the first argument. Called as `obj.method()`, it's `obj`. Otherwise it's
      `undefined` in strict code, or the global object in sloppy code. Arrow functions are the
      exception: they have no own `this` and use the enclosing scope's, fixed where they're
      written. The practical consequence is that a method passed as a callback loses its
      object, because the caller makes a plain call or picks its own `this`, like an event
      target. I fix that with an arrow wrapper, `bind`, or an arrow class field.
  - question: What are the differences between arrow functions and regular functions?
    answer: >-
      The big one is `this`: arrows don't have their own, so they use the surrounding
      scope's, and `call`, `apply` and `bind` can't change it. They also lack `arguments`,
      `super` and `new.target`, have no `prototype`, and throw if called with `new`. That makes
      arrows ideal for callbacks inside methods, like `this.items.map((item) => this.format(item))`,
      where you want the method's `this`. It makes them wrong for object and prototype methods
      that need the receiver, and for DOM handlers that read `this` as the element. As class
      fields they keep `this` bound, at the cost of one function per instance instead of one
      shared on the prototype.
  - question: What's the difference between `call`, `apply` and `bind`?
    answer: >-
      `call` and `apply` invoke the function immediately with a chosen `this`. `call` takes
      the arguments one by one and `apply` takes them as an array. `bind` doesn't call
      anything: it returns a new function whose `this`, and optionally leading arguments, are
      fixed permanently. A bound function ignores a later `call` or `bind`, though `new` still
      creates a fresh object. Today spread syntax covers most `apply` uses, and `call` is
      mostly for borrowing methods. `bind` is the one I still use, for handlers that must keep
      their object and be removable later, which means binding once and storing the result,
      since each `bind` call returns a different function.
  - question: Implement `Function.prototype.bind`.
    answer: >-
      The core is a closure that remembers `fn`, `thisArg` and the preset arguments, then
      calls `fn.apply(thisArg, [...preset, ...args])`. As a method on `Function.prototype`, the
      original function is `this` inside `myBind`, so I'd capture `const fn = this` first. A
      complete version handles `new`: if `new.target` is set, it should construct with
      `new fn(...preset, ...args)` and ignore `thisArg`, matching the spec. Details I'd
      mention but might skip: the real `bind` sets `name` to `"bound " + name` and `length` to
      the remaining parameter count, and a bound function has no `prototype` property of its
      own. It's a good test of closures, rest and spread, `apply` and `new.target` in one go.
  - question: A class method works when called directly but throws when used as a click handler. Why?
    answer: >-
      Because passing `obj.method` passes only the function, and `this` is decided by whoever
      calls it. When the browser runs the handler, it calls it with the element as `this`.
      The element doesn't have the class's fields, so something like `this.items.push` throws
      because `this.items` is `undefined`. Class bodies are strict, so a plain call would give
      `undefined` rather than silently using the global object. The fixes: register
      `() => obj.method()`, bind once in the constructor and register the bound copy, or
      define the method as an arrow class field. If the listener must be removed later, the
      exact same function reference must be passed to `removeEventListener`, or I use an
      `AbortController` signal.
terms:
  - term: "`this`"
    say: The object the method belongs to.
    means: "The value set by how a function is *called*: `cart.add()` makes it `cart`, but passing
      `cart.add` as a callback loses the cart. Arrow functions are the exception and use `this` from
      the code around them."
  - term: Default binding
    say: A plain call gives `this` as the global object.
    means: Only in sloppy scripts. In strict code, which includes classes and modules, a plain call
      gives `this` as `undefined`.
  - term: Arrow function
    say: A shorter way to write a function.
    means: A function with no own `this`, `arguments` or `prototype`, which can't be called with `new`.
      It uses `this` from the code where it was written.
  - term: "`call`, `apply` and `bind`"
    say: Three ways to do the same thing.
    means: "`call` and `apply` invoke at once with a chosen `this`, arguments listed or in an array.
      `bind` returns a new function whose `this` is fixed for good, except under `new`."
  - term: Losing `this`
    say: The method breaks as a click handler.
    means: Passing `obj.method` hands over the function alone, so the caller decides `this` later. Wrap
      it in an arrow, `bind` it, or make it an arrow class field.
