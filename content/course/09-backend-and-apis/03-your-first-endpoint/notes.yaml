summary: >-
  An endpoint is a function the server calls with a request and whose return value becomes
  the response. Everything a web framework does sits around that idea: it listens on a port,
  parses the incoming bytes into a request object, picks your function by method and path,
  and turns what you return into bytes on the wire.


  The lesson uses the **fetch-style handler**, `(request: Request) => Response`, built on the
  same `Request` and `Response` classes the browser's `fetch` uses. Node 24 ships them as
  globals, and Next.js route handlers, Hono, Deno, Bun and Cloudflare Workers all call your
  code this way. Learn the shape once and it runs almost anywhere.


  The hard parts of a real endpoint are the ones the happy path hides: a body that isn't
  valid JSON, a field that's missing, two requests arriving at once, and state that must
  survive a restart. These notes cover each, plus how to test a handler without starting a
  server at all.
remember:
  - A handler takes a request and returns a response, and routing picks the handler by method and path.
  - '`request.json()` returns a promise and throws on invalid JSON, so await it inside a `try` and answer `400` when it fails.'
  - A request body is a stream that can be read once, so read it into a variable and reuse that.
  - Answer a create with `201` and a `Location` header pointing at the new resource.
  - Every routing chain ends with a `404`, so a request that matches nothing still gets a clear answer.
  - A fetch-style handler can be tested by calling it with `new Request(...)`, with no server and no port.
  - State in a module variable is lost on restart and isn't shared between server copies, so real data goes in a database.
  - An `await` between reading and writing shared state lets another request run in between, which is where race conditions come from.
sections:
  - title: A complete handler, tested without a server
    body: |-
      Here is the lesson's to-do API written against real `Request` and `Response` objects,
      with the edge cases handled. `URLPattern`, a global in Node 24, pulls the id out of the
      path the way framework routers do.

      ```ts
      type Todo = { id: number; title: string; done: boolean };
      const todos: Todo[] = [{ id: 1, title: 'Buy milk', done: false }];
      let nextId = 2;

      const oneTodo = new URLPattern({ pathname: '/todos/:id' });

      export async function handle(request: Request): Promise<Response> {
        const url = new URL(request.url);

        if (url.pathname === '/todos') {
          if (request.method === 'GET') return Response.json(todos);
          if (request.method === 'POST') {
            let body: unknown;
            try {
              body = await request.json();
            } catch {
              return Response.json({ error: 'Body must be JSON' }, { status: 400 });
            }
            const title = (body as { title?: unknown }).title;
            if (typeof title !== 'string' || title.trim() === '') {
              return Response.json({ error: 'title is required' }, { status: 400 });
            }
            const todo = { id: nextId++, title, done: false };
            todos.push(todo);
            return Response.json(todo, { status: 201, headers: { Location: `/todos/${todo.id}` } });
          }
        }

        const match = oneTodo.exec(url);
        if (match && request.method === 'GET') {
          const todo = todos.find((t) => t.id === Number(match.pathname.groups.id));
          if (todo) return Response.json(todo);
        }

        return Response.json({ error: 'Not found' }, { status: 404 });
      }

      const base = 'http://localhost';
      const show = async (res: Response) => console.log(res.status, await res.text());

      await show(await handle(new Request(`${base}/todos`, { method: 'POST', body: '{"title":"Call Sam"}' })));
      await show(await handle(new Request(`${base}/todos`, { method: 'POST', body: '{title:' })));
      await show(await handle(new Request(`${base}/todos/2`)));
      await show(await handle(new Request(`${base}/todos/99`)));
      ```

      Saved as a `.mts` file and run with `npx tsx`, it prints:

      ```text
      201 {"id":2,"title":"Call Sam","done":false}
      400 {"error":"Body must be JSON"}
      200 {"id":2,"title":"Call Sam","done":false}
      404 {"error":"Not found"}
      ```

      Testing like this is fast and needs no port, which is why fetch-style handlers are
      pleasant to unit test. Keep a few end-to-end tests that go through a real server too, to
      catch problems in the wiring.
  - title: What the server package does for you
    body: |-
      Node's own `node:http` module speaks a different, older shape: a callback with an
      `IncomingMessage` and a `ServerResponse` that you write to. A package such as
      `@hono/node-server` sits between the two. For each connection it:

      - parses the request line and headers into a `Request`, with a full URL built from the
        `Host` header;
      - exposes the body as a stream, read only when you call `json()` or `text()`;
      - calls your `fetch` function and awaits the `Response` it returns;
      - writes the status, headers and body back, streaming the body if it's a stream.

      That's why the same handler moves between Node, Next.js and edge runtimes: only the
      adapter changes. Frameworks add a router, middleware for logging, authentication and
      CORS, and helpers for cookies and validation. Under all of it is still request in,
      response out.

      Bodies are streams because they can be large. Reading one consumes it, so a second read
      fails:

      ```ts
      const once = new Request('http://localhost/todos', { method: 'POST', body: '{"title":"x"}' });
      await once.json();
      await once.json(); // TypeError: Body is unusable: Body has already been read
      ```

      If two pieces of code need the body, read it once and pass the value, or call
      `request.clone()` before the first read.
  - title: Shared state and concurrent requests
    body: |-
      Node runs your JavaScript on one thread, so two requests never execute the same line at
      the same moment. That makes `nextId++` safe inside one process: it runs start to finish
      without interruption. The danger appears at every `await`. While one request waits for a
      database or another API, Node runs other requests, and they can change what the first
      one read.

      ```ts
      import { setTimeout as sleep } from 'node:timers/promises';

      let seatsLeft = 1;
      const sold: string[] = [];

      async function book(name: string) {
        if (seatsLeft > 0) {
          await sleep(10); // stands in for a database call or a payment check
          seatsLeft = seatsLeft - 1;
          sold.push(name);
        }
      }

      await Promise.all([book('Ada'), book('Grace')]);
      console.log(seatsLeft, sold); // -1 [ 'Ada', 'Grace' ]
      ```

      Both requests saw one seat before either took it. This is a **check-then-act** race, and
      it gets worse with several server processes, where even `nextId++` breaks because each
      process has its own counter.

      The fix lives in the database: let it generate ids, and make the check and the change one
      atomic statement, such as `UPDATE ... SET seats_left = seats_left - 1 WHERE seats_left > 0`,
      or a transaction with a lock. The database chapter covers both.
pitfalls:
  - '**Forgetting `await` on `request.json()`.** The body is a promise and every field reads as `undefined`. Await it, and let TypeScript flag the mistake by typing the handler as `async`.'
  - '**Letting invalid JSON crash the handler.** `request.json()` throws a `SyntaxError` on bad input, which becomes a `500`. Catch it and answer `400`, because the client sent the bad data.'
  - '**Trusting the body''s shape.** `body.title` could be missing, a number or an object. Check types before use, which the validation lesson does properly.'
  - '**Reading the body twice.** The second read throws. Read once, or clone first.'
  - '**Comparing path strings loosely.** `/todos/` and `/todos` are different strings, and `Number("")` is `0`. Decide on trailing slashes and reject ids that aren''t whole numbers.'
  - '**Counting ids in a variable in production.** Two processes hand out the same id, and a restart starts again from 2. Let the database generate ids.'
interview:
  - question: Walk me through what happens between a request arriving and your handler running.
    answer: >-
      The server process accepts a TCP connection, reads the request line and headers, and
      builds a request object: method, a URL assembled from the path and the `Host` header,
      headers, and the body as an unread stream. Middleware may run first for logging,
      authentication or body limits. The router matches the method and path against its
      routes, extracts parameters such as the id, and calls the matching handler. The handler
      reads the body if it needs it, does its work, and returns a response, which the server
      serialises back onto the connection. Keeping the body lazy matters: a server can reject
      an unauthorised or oversized request without reading megabytes it will discard.
  - question: Is `nextId++` in a Node handler safe under concurrent requests?
    answer: >-
      Inside one process, yes, because Node runs JavaScript on a single thread and that line
      completes without interruption. Across processes, no: two copies of the server each
      have their own counter and hand out the same ids, and a restart resets it. The subtler
      problem inside one process is any `await` between reading shared state and writing it,
      because other requests run during the wait. So I never keep real state in memory: the
      database generates ids with an identity column, and check-then-act logic becomes one
      atomic statement or a transaction. In-memory counters are fine for tests and
      prototypes.
  - question: How do you test an HTTP handler?
    answer: >-
      Mostly by calling it directly. A fetch-style handler is a function from `Request` to
      `Response`, so a unit test builds `new Request(url, { method, body })`, awaits the
      handler and asserts on the status, headers and parsed body. That's fast, needs no port
      and makes edge cases cheap to cover: invalid JSON, missing fields, unknown ids, the wrong
      method. I inject dependencies such as the database behind an interface so tests use an
      in-memory fake. Then a small number of end-to-end tests start the real server and hit
      it over HTTP, to catch wiring problems like middleware order or a missing route
      registration, which unit tests can't see.
  - question: What status should a create endpoint return, and what should it include?
    answer: >-
      `201 Created`, with a `Location` header giving the URL of the new resource and usually
      the resource itself in the body, including server-generated fields like the id and
      timestamps. That saves the client a second request and tells it where to find the
      thing later. If the work happens asynchronously and the resource doesn't exist yet,
      `202 Accepted` with a link to a status resource is more honest. A `200` works in
      practice but loses information, and returning nothing forces the client to guess the
      id.
