id: interview.four-hour-build
title: The four-hour build
objective: Turn a brief into a scoped plan, ship a thin working slice first, and leave time for tests and a README that shows your thinking.
level: essential
minutes: 10
concepts: [interview.scoping, interview.vertical-slice, interview.readme-for-reviewers]
prerequisites: [interview.ai-assisted, pro.commits-and-prs]
opening:
  text: >-
    You'll turn a four-hour brief into a plan that finishes with something working, tested
    and explained. Most candidates run out of time on features, so the plan is your edge.

steps:
  - type: prose
    id: assumptions-and-must-haves
    body: |-
      What you need: you've built a small web app with an API. A four-hour build starts
      from a brief such as "a support assistant that answers from these help articles".

      **Scoping** means writing down what you'll build and what you won't:

      - Assumptions: about 30 articles, English only, no login.
      - Must-haves: answer from the articles, cite the article, say "I don't know" when
        nothing matches.

      Everything else waits.

  - type: multiple-choice
    id: pick-first-twenty
    concept: interview.scoping
    difficulty: 1
    question: The clock starts on that support-assistant brief. What do you write first?
    choices:
      - text: Questions, assumptions and three must-haves
        correct: true
        feedback: >-
          Yes. Twenty minutes of scoping decides what the other three hours build.
      - text: Set up the project and the database
        feedback: >-
          Setup feels like progress. But you don't know what to set up until you've scoped it.
      - text: Build the chat screen
        feedback: >-
          Starting with the part you can see is common. It says nothing yet about what matters.

  - type: ai-review
    id: review-drafted-scope
    concept: interview.scoping
    difficulty: 3
    language: yaml
    request: Scope this brief for a four-hour build. Keep it to three must-haves.
    flawClass: logic
    code: |
      brief: suggest dinners from the 40 recipes given, using what's in the fridge
      assumptions:
        - 40 recipes, English, no login
        - ingredients typed as a comma-separated list
      must-haves:
        - suggest recipes that use the listed ingredients
        - show which ingredients each one still needs
        - a hosted vector database for recipe search
      later: meal plans, a shopping list, user accounts
    prompt: >-
      A new brief, and an assistant drafted the scope. It reads like a plan. Tap the line
      that isn't a must-have.
    lines: [8]
    reasons:
      - text: It's infrastructure the brief never asked for
        correct: true
        feedback: >-
          Yes. Forty recipes fit in memory. A reviewer will ask why it's there.
      - text: Missing ingredients should wait for later
        feedback: >-
          Showing what's missing is what makes a suggestion useful. It earns its place.
      - text: Assuming no login is too risky
        feedback: >-
          The brief mentions no users. Writing the assumption down is exactly right.
    fix: |
      brief: suggest dinners from the 40 recipes given, using what's in the fridge
      assumptions:
        - 40 recipes, English, no login
        - ingredients typed as a comma-separated list
      must-haves:
        - suggest recipes that use the listed ingredients
        - show which ingredients each one still needs
        - say so when nothing matches
      later: meal plans, a shopping list, user accounts, a vector database past 10,000 recipes

  - type: prose
    id: thin-slice
    body: |-
      Next, a **thin vertical slice**: one path working end to end. A text box sends a
      question to your API, the API finds an article, and the answer comes back. Ugly is fine.

      Now everything after it improves a working app. Commit each time something new works,
      so the history shows the build step by step.

  - type: parsons
    id: order-time-plan
    concept: interview.vertical-slice
    difficulty: 3
    language: text
    prompt: Put the four hours in order.
    blocks:
      - id: scope
        code: Read the brief, ask, write assumptions and must-haves
        subgoal: Plan
      - id: skeleton
        code: 'A thin path from UI through API to data, running'
        subgoal: Build
      - id: happy-path
        code: The core happy path end to end, committing often
      - id: states
        code: Error, empty and loading states, guardrails, a small eval set
      - id: tests
        code: Tests on the core logic
        subgoal: Finish
      - id: readme
        code: 'README: trade-offs, next steps, how you used AI'
      - id: rehearse
        code: Rehearse the demo, prepare a fallback, stop adding features
    distractors:
      - id: polish-first
        code: Polish the design system and animations
        feedback: >-
          It looks good in a demo, but reviewers grade the working slice and your reasoning.
      - id: all-layers
        code: Finish the whole database layer before any UI
        feedback: >-
          Layer by layer leaves nothing working end to end until late. The slice comes first.

  - type: multiple-choice
    id: pick-at-two-forty-five
    concept: interview.vertical-slice
    difficulty: 3
    question: At 2:45 answers and citations work. There are no tests. What next?
    choices:
      - text: Test the core, and list streaming under next steps
        correct: true
        feedback: >-
          Yes. Tests on the core are graded. A feature you list shows scoping.
      - text: Add streaming answers, then tests if time allows
        feedback: >-
          Most people pick this, as it demos well. Then time runs out and there are no tests.
      - text: Rewrite the retrieval to make it cleaner
        feedback: >-
          It works now. A late rewrite risks the one path you can demo.

  - type: prose
    id: readme-first
    body: |-
      Reviewers read the **README** before the code. Give it these sections: what it does,
      how to run it, assumptions, architecture, trade-offs, how you used AI, and next
      steps.

      Before you stop, clone the repo into a new folder and follow your own README from the
      top. It catches the missing step and the committed secret.

  - type: ai-review
    id: review-committed-key
    concept: interview.readme-for-reviewers
    difficulty: 4
    language: text
    request: Draft the README for my help-article assistant from these notes.
    flawClass: security
    code: |
      What: answers support questions from 30 help articles, citing each source
      Run: npm install, then npm run dev
      Key: MODEL_API_KEY=sk-live-8f2c1e9a is in .env, committed so it runs
      Assumptions: English only, no login, articles change weekly
      Architecture: page -> /api/ask -> in-memory index -> model
      Trade-offs: in-memory search, no vector database below 10,000 articles
      AI use: drafted the chunker and tests; I rewrote the refusal check
      Next: streaming, answer feedback, a larger eval set
    prompt: >-
      An assistant wrote this from your notes. You tried it on a clean machine and it ran
      first time, so it looked done. Tap the line a reviewer will stop at.
    lines: [3]
    reasons:
      - text: A live key is committed to the repository
        correct: true
        feedback: >-
          Yes. Anyone who sees the repo can use it. Commit `.env.example` and rotate the key.
      - text: The architecture line needs a full diagram
        feedback: >-
          A diagram helps, but a one-line flow is fine for a README. The key is the real risk.
      - text: AI use shouldn't be admitted in a README
        feedback: >-
          Saying where AI helped and how you checked it is what reviewers want to read.
    fix: |
      What: answers support questions from 30 help articles, citing each source
      Run: cp .env.example .env, add your MODEL_API_KEY, npm install, npm run dev
      Assumptions: English only, no login, articles change weekly
      Architecture: page -> /api/ask -> in-memory index -> model
      Trade-offs: in-memory search, no vector database below 10,000 articles
      AI use: drafted the chunker and tests; I rewrote the refusal check
      Next: streaming, answer feedback, a larger eval set

  - type: explain-back
    id: explain-slice-first
    concept: interview.vertical-slice
    difficulty: 4
    prompt: >-
      Two candidates stop at four hours. Why does a thin slice that works score higher than
      three polished layers that don't connect?
    rubric:
      - The slice proves the whole path works, so there's something real to demo and test.
      - Unconnected layers can't be run, so reviewers can't check them.
      - Each later hour improved a working app, so running out of time costs polish, not the core.
    modelAnswer: >-
      The slice works from the text box to the answer, so the reviewer can run it. I can
      demo it and test it. Three unconnected layers can't be run, so they show effort but
      nothing checkable. And because the slice came first, every hour after it improved a
      working app. Running out of time cost me polish, not the core.

recap:
  - Scope the brief into assumptions and three must-haves in twenty minutes.
  - Build one thin path end to end first, and commit as each piece works.
  - Save time for core tests and a README that explains your decisions.
recall:
  - id: card-first-twenty
    concept: interview.scoping
    front: What do you write in the first twenty minutes of a four-hour build?
    back: >-
      Your questions, your assumptions and three must-haves. Everything else waits or goes
      under next steps.
  - id: card-slice
    concept: interview.vertical-slice
    front: What is a thin vertical slice?
    back: >-
      One path working end to end, from the UI through the API to the data, built before
      anything is polished.
  - id: card-readme-sections
    concept: interview.readme-for-reviewers
    front: Which sections does a README for reviewers need?
    back: >-
      What it does, how to run it, assumptions, architecture, trade-offs, how AI was used and
      next steps.
  - id: card-failure-modes
    concept: interview.scoping
    front: Name three common ways a four-hour build fails.
    back: >-
      Too much built and the core unfinished, setup that fails on a clean machine, and
      secrets or unexplained infrastructure in the repository.

references:
  - kind: essay
    title: How to Ace the Take-Home Assignment Interview 2026
    authors: F1Jobs Team
    year: 2026
    venue: F1Jobs
    url: https://www.f1jobs.io/resources/blog/take-home-assignment-interview-guide
    note: What reviewers grade in take-homes, and the common ways they fail.
    primary: true
    verified: true
  - kind: docs
    title: 'The Twelve-Factor App: III. Config'
    authors: Adam Wiggins
    url: https://12factor.net/config
    note: Why configuration and credentials live in environment variables, not in the code.
    primary: true
    verified: true

deepDive: >-
  A four-hour plan that works for most briefs:


  - 0:00 to 0:20: read the brief, ask questions, write assumptions and three must-haves.

  - 0:20 to 0:35: a skeleton, one thin path from UI through API to data, running.

  - 0:35 to 2:15: the core happy path end to end, committing often.

  - 2:15 to 2:50: error, empty and loading states, validation, guardrails, a small eval set.

  - 2:50 to 3:15: tests on the core logic.

  - 3:15 to 3:40: the README, with a diagram, trade-offs, next steps and how you used AI.

  - 3:40 to 4:00: rehearse the demo, prepare a fallback, stop adding features.


  Reviewers grade a working slice, scoping judgement and code quality. They check error and
  empty states, tests on the core logic, the README and readable commits. Then they ask you
  to defend each decision. For AI builds, add a small eval set of ten to twenty real questions with known
  answers, a line on cost and latency, and the guardrails you chose. First reviews often take
  minutes, and the discussion afterwards often counts more than the code.


  The failure modes repeat across candidate reports. Too much is built and the core flow is
  unfinished. Setup fails on a clean machine. There are no tests, no written assumptions, or
  one giant commit. Secrets get committed, or infrastructure appears that nobody asked for. Before you stop, clone the repo
  into a new folder and follow your own README from the top. It catches the missing step
  and the committed key in five minutes.
