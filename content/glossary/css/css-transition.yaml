term: transition
aka: [CSS transition, transition-duration, timing function]
short: A CSS instruction to change a property gradually over a set time instead of all at once.
explain: |
  Without help, a style change is instant. A button snaps from grey to blue on hover. A
  short fade tells the eye what changed, so the interface feels like it responds to you.

  You name the property, a duration and a timing function, such as `ease-out`. It runs
  between two states, like hover and not. Keep it to about 150 to 300 milliseconds, and
  animate `transform` and `opacity` where you can. Changing `width` or `top` forces layout
  on every frame, which can stutter.
analogy: A dimmer switch instead of a light switch. Same end state, but you see it arrive.
example:
  language: css
  code: |
    .button {
      transition: background-color 200ms ease-out;
    }
    .button:hover { background-color: var(--accent); }
usage: Put the transition on the button itself, not on `:hover`, or it only animates one way.
twin:
  term: css-transform
  difference: A transition is about time, spreading a change over milliseconds. A transform is about shape, moving, turning or scaling how a box is drawn.
related: [css-transform, prefers-reduced-motion, pseudo-class]
level: 2
lessons: [css.transitions]
