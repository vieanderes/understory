deepDive: >-
  The chapter Interview challenges trains the build itself: a four-hour plan in its lesson
  on the four-hour build, and the walkthrough in its lesson on presenting your build. This
  lesson is the reviewer's side of the table.


  An unpaid take-home longer than a working day is a big ask. It's fair to ask whether a
  shorter version exists, or whether an existing project of yours could stand in. Many
  companies say yes.


  On the follow-up call, expect a change to the brief, such as "now it has 10,000
  documents" or "now two teams must not see each other's files". The reviewer wants your
  reasoning more than code. Name what breaks first, and what you'd change.
