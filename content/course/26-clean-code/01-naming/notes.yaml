summary: >-
  A name is the first, and often the only, documentation a reader gets. When a name says
  what a value means or what a function does, the reader can trust it and move on. When it
  doesn't, they have to open the function, trace the value or ask someone. Code is read far
  more often than it is written, so that cost is paid again on every read.


  Good names follow a few rules. They reveal intent: `priceWithTax`, not `t`. They carry
  the unit when a number has one: `timeoutMs`, `priceInPence`. Booleans read as yes-or-no
  questions: `isActive`, `hasPaid`. One idea gets one word across the codebase, so a new
  word signals something new. And a name's length grows with the distance it travels: `p`
  for a one-line loop, `maxUploadSizeBytes` for a setting read across files.


  A name that lies is worse than a name that says nothing. `x` warns you to look closer;
  `isValid` holding a list of errors invites a bug that passes review. When a name is hard
  to choose, treat it as a design signal: the thing you are naming probably does two jobs.
remember:
  - A good name answers what a value is for or what a function does, so nobody has to open it to find out.
  - A misleading name is worse than a meaningless one, because readers trust it and stop checking.
  - Put the unit in the name of any number that has one, such as `timeoutMs`, `sizeBytes` or `priceInPence`.
  - Name booleans as positive yes-or-no questions, such as `isActive`, `hasPaid` or `canEdit`, and avoid negatives like `isNotReady`.
  - Use one word per idea across a codebase, so different words signal different things.
  - A name's length should match its scope, short for a loop variable and full for anything read across files.
  - Use the words of the problem domain, such as booking, guest and check-in, so code and conversations share a vocabulary.
  - If you can't name a function without "and", it does two jobs and wants splitting.
sections:
  - title: Units, types and domain words in names
    body: |-
      Numbers are where names fail most expensively. `setTimeout` takes milliseconds, many
      APIs take seconds, and money may be pounds or pence. If the unit lives only in
      someone's head, a caller will eventually pass the wrong one, and nothing complains.

      ```js
      // Before: is delay in seconds or milliseconds? The caller has to guess.
      function scheduleReminder(send, delay) {
        return setTimeout(send, delay);
      }

      // After: the unit is in the name, and the conversion happens in one place.
      const MS_PER_SECOND = 1000;

      function scheduleReminderIn(send, delaySeconds) {
        const delayMs = delaySeconds * MS_PER_SECOND;
        return setTimeout(send, delayMs);
      }

      scheduleReminderIn(() => console.log('reminder sent'), 0.2); // after about 200 ms
      ```

      The same goes for other hidden facts a value carries. `priceInPence` tells you it is
      a whole number and not a float of pounds. `createdAtIso` tells you it is a string, not
      a `Date`. `userId` says it is an id, not the whole user object, which stops the classic
      mistake of passing `user` where `user.id` was expected.

      Don't encode what the type system already says. `strName` or `arrOrders` repeat the
      type and go stale when the type changes. In TypeScript the type is on hover; the name
      should carry meaning the type can't, like the unit or the role.

      **Domain language** matters as much. If the business says "booking", "guest" and
      "check-in", the code should say `booking`, `guest` and `checkIn`, not `record`,
      `entity` and `processItem`. Then a bug report written by a support agent maps
      straight onto the code, and new engineers learn one vocabulary, not two.
  - title: Booleans, functions and the shape of a good name
    body: |-
      Different kinds of names follow different grammar, and following it makes code read
      like prose.

      - **Values** are nouns: `order`, `totalSpent`, `activeUsers`. Collections are plural,
        so `for (const user of users)` reads naturally.
      - **Booleans** are yes-or-no questions: `isOpen`, `hasPaid`, `canEdit`,
        `shouldRetry`. Functions that return a boolean follow the same pattern:
        `isEligible(user)`.
      - **Functions** that do something start with a verb: `sendReceipt`, `saveBooking`.
        Functions that compute a value can be named by what they return:
        `averageOrderValue(orders)`.

      Keep booleans positive. `if (!isNotReady)` makes the reader flip two negatives in
      their head. Name the positive case, `isReady`, and negate it at the call when you
      need to.

      Use opposites that pair up: `open` and `close`, `start` and `stop`, `add` and
      `remove`, `min` and `max`, `first` and `last`. A codebase with `openConnection` and
      `destroyConnection` makes people wonder whether destroy does more than close.

      Avoid words that carry no information: `data`, `info`, `item`, `manager`, `handle`,
      `process`, `temp`. `userData` tells you nothing `user` doesn't, and `processOrder`
      could mean anything. Ask what the function really does: `chargeOrder`,
      `validateOrder`, `shipOrder`. Numbered names like `data2` are a sign that two things
      need different names that say how they differ, such as `rawRows` and `cleanRows`.
  - title: Scope decides length, and search decides spelling
    body: |-
      A name's job is to carry meaning to wherever it is read. A loop variable read one
      line below needs almost no help, because its meaning is right there. A module-level
      setting read in ten files has no context around it, so its name must carry all of it.

      ```js
      const MAX_BASKET_ITEMS = 50; // read across the app, so it spells everything out

      function basketIsFull(items) {
        return items.length >= MAX_BASKET_ITEMS;
      }

      const prices = [3, 4, 5];
      let total = 0;
      for (const p of prices) total += p; // p lives for one line
      console.log(total, basketIsFull(prices)); // 12 false
      ```

      A useful habit is to ask whether the name can be found by search. `e`, `d` or `tmp` in
      a large file match hundreds of places. `reminderAfterDays` matches exactly the lines
      you care about. That's also why squashed forms like `usrCnt` hurt: nobody knows
      whether to search for `usr`, `user`, `cnt` or `count`.

      Common, universally known abbreviations are fine: `id`, `url`, `html`, `i` in a
      counted loop, `err` or `error` in a `catch`. The test is whether a new team member
      would read it without pausing. A team glossary for domain abbreviations helps when
      the business uses its own short forms.
  - title: Renaming safely in a real codebase
    body: |-
      Renaming is the most common refactoring, and in a typed codebase it is also one of
      the safest. Editors that understand the language, such as VS Code with TypeScript,
      offer **Rename Symbol** (F2 by default). It renames the declaration and every
      reference that the compiler can resolve, across files, and leaves unrelated text with
      the same spelling alone. That is far safer than find and replace.

      Its limits are worth knowing. It can't see names used as strings, such as a property
      read with a key built at run time, `obj[fieldName]`, a key in a JSON file or a database column. It can't
      see other repositories that import your package. Search for the old name as plain
      text afterwards, and run the tests.

      A name that other code depends on, such as an exported function of a published
      package or a field in an API response, is a contract. Rename it in two steps: add the
      new name, keep the old one as a deprecated alias, and remove the alias in a later
      major version.

      ```ts
      export function inactiveUserNames(users: { name: string }[]): string[] {
        return users.map((user) => user.name);
      }

      /** @deprecated Use `inactiveUserNames`. Removed in the next major version. */
      export const chk = inactiveUserNames;
      ```

      Editors show `@deprecated` names struck through, which nudges callers to move without
      breaking anyone on the day you rename.
pitfalls:
  - "**Naming a value after its first use rather than its meaning.** A value called `result` or `response` tells you where it came from, not what it holds. Name it after what it is, such as `activeBookings` or `invoiceTotal`."
  - "**Letting a name drift from what the code does.** Someone changes `total` from money to an item count and keeps the name, and a test passes by coincidence. When behaviour changes, rename in the same commit."
  - "**Using synonyms for one idea.** `getUser`, `fetchOrders` and `loadInvoices` for the same kind of read make readers hunt for a difference that isn't there. Pick one verb per idea and keep a new verb for a new behaviour."
  - "**Negative booleans.** `isNotEnabled` and `disableRetry` force double negatives like `if (!isNotEnabled)`. Name the positive case and negate it at the call site."
  - "**Numbers without units.** A bare `timeout = 30` is read as seconds by one person and milliseconds by another. Put the unit in the name: `timeoutSeconds`, `timeoutMs`."
  - "**Long names in tiny scopes.** `for (const currentProductPriceInPence of prices)` buries a one-line loop. Short scope, short name; save full names for values that travel."
  - "**Encoding the type in the name.** `strEmail` and `ordersArray` repeat what the type system says and go stale when the type changes. Spend the characters on meaning instead."
verify:
  - lens: confuses
    check: Every number that has a unit carries it in its name, such as `timeoutMs` or `priceInPence`.
  - lens: confuses
    check: No `if` tests a value whose name promises a yes-or-no but which holds a list, an object or a count.
  - lens: breaks
    check: After a rename, search the old name as plain text to catch string keys, JSON and config that Rename Symbol can't see.
  - lens: tests
    check: When a change alters what a value holds, rename it in the same commit and test with data where the old and new meanings differ.
interview:
  - question: What makes a good variable or function name?
    answer: >-
      A good name tells the reader what a value means or what a function does, so they
      never have to open it to find out. Concretely, I look for intent, not mechanics:
      `priceWithTax` over `t`, `averageOrderValue` over `calc`. Numbers carry their unit,
      like `timeoutMs`. Booleans read as positive questions, like `hasPaid`. The codebase
      uses one word per idea and the words of the business domain. Length follows scope, so
      a one-line loop can use `p`, but an exported setting spells itself out. The trade-off
      is verbosity: a name that tries to say everything becomes noise, so I let context
      carry what it can and let the name carry the rest.
  - question: Why is a misleading name worse than a short, meaningless one?
    answer: >-
      Because readers believe names, and a wrong one turns that trust into a bug. A name
      like `x` gives nothing away, so the reader checks what it holds. A name like `isValid`
      that actually holds an array of errors invites `if (isValid)`, which is always true
      for an array and looks right to the author and the reviewer. The bug ships because the
      code reads correctly. That's why I treat a stale or inaccurate name as a defect, not a
      style nit, and why a rename belongs in the same commit as the behaviour change that
      made the old name wrong.
  - question: How do you decide how long a name should be?
    answer: >-
      By how far the name travels from its definition. A variable used for two lines has
      its context right beside it, so `i` or `p` is fine and a long name only adds noise.
      A value read across files, like an exported constant or a public function, has no
      surrounding context, so the name must carry all of it: `MAX_UPLOAD_SIZE_BYTES`,
      `inactiveUserNames`. I also think about search: a name you can grep for precisely is
      worth a few extra characters in a large codebase. What I avoid at every length is
      squashed abbreviations like `usrCnt`, which save typing once and cost reading forever.
  - question: How would you rename a widely used function safely?
    answer: >-
      Inside one typed codebase, I use the editor's Rename Symbol, which renames every
      reference the compiler can resolve, then search for the old name as text and run the
      tests. The text search catches what the compiler can't see: string keys, JSON,
      configuration and templates. If the name is part of a public contract, such as an
      exported package function or an API field, I don't rename in one step. I add the new
      name, keep the old as a deprecated alias with a `@deprecated` doc comment, and remove
      it in the next major version. The trade-off is a period of two names, which is
      cheaper than breaking every consumer at once.
terms:
  - term: Intent-revealing name
    say: A long, descriptive name.
    means: A name that says what a value is for or what a function does, so nobody has to open it to
      find out. Length follows scope; a long name can still say nothing.
  - term: Misleading name
    say: Any name is better than `x`.
    means: A name that lies is worse than a meaningless one. Readers trust `isValid` and stop checking,
      while `x` warns them to look closer.
  - term: Unit in the name
    say: The type already says it's a number.
    means: A type says `number`, not seconds or milliseconds. `timeoutMs` or `priceInPence` puts the
      unit where every reader sees it.
  - term: Boolean name
    say: Any name for a true or false value.
    means: A positive yes-or-no question such as `isActive`, `hasPaid` or `canEdit`. Negatives like
      `isNotReady` turn conditions into double negatives.
  - term: Consistent vocabulary
    say: Synonyms make code less repetitive.
    means: One word per idea across the codebase, so `fetch`, `get` and `load` don't mean the same thing
      in three places, and a new word signals something new.
  - term: Name length
    say: Short names are lazy.
    means: Length should grow with scope. `p` is fine in a one-line loop; a setting read across files
      needs the full `maxUploadSizeBytes`.
