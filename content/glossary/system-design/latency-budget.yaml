term: latency budget
aka: [time budget, latency allowance]
short: A total time allowed for a request, shared out among the steps it passes through.
explain: |
  The page must answer in 300 ms. The database gets 50, the search 100, the model call
  the rest. Writing the shares down shows at once when one step can't fit.

  The budget also sets timeouts: a step that runs over its share should give up or fall
  back. For AI features, split it between time to first token, which users feel, and total
  time.
analogy: A household budget. Rent, food and bus fares are fixed out of the same pay, so one overspend squeezes the rest.
usage: The reranker takes 400 ms of a 500 ms latency budget; either drop it or shrink the shortlist.
related: [latency, timeout, percentile, time-to-first-token]
level: 2
lessons: [sysdesign.estimation, aisys.cost-and-latency]
