    note: The blameless post-mortem, why blame hides incidents, and what a good write-up holds.
    verified: true

deepDive: >-
  The six phases are often called PICERL. NIST's 2012 guide grouped them into four:
  preparation; detection and analysis; containment, eradication and recovery; and
  post-incident activity. Its 2025 revision folds incident response into the NIST
  Cybersecurity Framework's functions instead. Either way, teams most often go wrong on the
  order of contain, eradicate and recover.


  A leaked key is revoked, not only deleted. Removing it from the code, or even from the Git
  history, doesn't help once someone has copied it. Revoking makes every copy useless.


  A good post-mortem has a timeline, contributing causes, and actions with owners and dates.
  The test of "blameless" is simple: swap any person's name for "someone", and the lessons
  should still read the same.
