# CodeQL for the Swift package in ios/UnderstoryKit. CodeQL reads Swift by watching the
# compiler, so the job builds the package on macOS. Default setup's autobuild took about
# 13 minutes of a 15-minute run on every pull request, so this runs only when ios/ changes,
# plus once a week for new queries.
name: CodeQL Swift

on:
  pull_request:
    branches: [main]
    paths: ['ios/**', '.github/workflows/codeql-swift.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/codeql-swift.yml']
  schedule:
    - cron: '41 4 * * 1' # Mondays, 04:41 UTC
  workflow_dispatch:

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      # The two libraries only. The tests need node_modules and add nothing to the scan.
      - run: swift build --package-path ios/UnderstoryKit
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
