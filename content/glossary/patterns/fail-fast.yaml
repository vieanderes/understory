term: fail fast
aka: [fail early, fail-fast]
short: Stopping with a clear error at the first sign of bad input, instead of carrying on.
explain: |
  A bad value that slips through turns into a `NaN` three calls later, far from its cause.
  Checking it where it arrives, and stopping there, puts the error next to the mistake.

  Validate at the edge of your code: request bodies, config, file contents. Throw a
  specific error that says what was wrong. The rest of the code can then trust its inputs.
analogy: A smoke alarm in the kitchen, not one that only goes off once the whole house is burning.
example:
  language: ts
  code: |
    if (!Number.isInteger(qty) || qty < 1) {
      throw new RangeError(`qty must be a positive integer, got ${qty}`);
    }
usage: Fail fast on a missing env var at start-up, not on the first request at midnight.
related: [guard-clause, swallowed-error, exception, data-validation-model]
level: 2
lessons: [clean.errors]
