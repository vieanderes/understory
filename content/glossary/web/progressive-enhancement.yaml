term: progressive enhancement
aka: [works without JavaScript]
short: Building a page that works with plain HTML first, then adding scripts that improve it when they load.
explain: |
  JavaScript fails more often than you think: a slow phone, a blocked script, a flaky
  train connection. If the form needs a script to submit, it does nothing until then.

  Start from HTML that works on its own: a real `<form>` with an action, real links. Then
  layer scripts on top for instant feedback. In Next.js a form whose `action` is a Server
  Action submits before hydration, and becomes smoother after it.
analogy: A staircase beside the escalator. The escalator is nicer; when it breaks, you can still get upstairs.
example:
  language: tsx
  code: |
    // submits as a normal POST even before the page's JavaScript loads
    <form action={addComment}>
      <textarea name="text" required />
      <button>Post</button>
    </form>
usage: Keep the checkout form as progressive enhancement, so it submits on a phone that is still loading the bundle.
related: [server-action, semantic-html, hydration]
level: 2
lessons: [nextserver.server-actions]
