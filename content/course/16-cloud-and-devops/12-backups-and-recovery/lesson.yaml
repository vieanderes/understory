deepDive: >-
  This all ran on PostgreSQL 17.11 in Docker. The primary started with `archive_mode=on` and
  an `archive_command` that copied WAL files to a volume. After the base backup at 1,000 rows
  we added 200, noted `now()`, and deleted all 1,200. We forced the last WAL file out with
  `pg_switch_wal()`.


  On the primary, the two settings that matter are `archive_mode = on` and an
  `archive_command` such as `'cp %p /wal/%f'`, where `%p` is the WAL file's path and `%f`
  its name. In real life `/wal` is storage on another machine. The restore was a new
  container on a copy of the base backup, with an empty `pg_wal` and a `recovery.signal`
  file. It set `restore_command = 'cp /wal/%f %p'` and `recovery_target_time =
  '2026-09-18 17:50:48+00'`. Its log read
  "starting point-in-time recovery", then "recovery stopping before commit of transaction
  741". It counted 1,200 rows about one second after starting. A real database is bigger.
  Restore time grows with the base backup's size and the WAL to replay, which is why you
  measure it.


  The replica was built with `pg_basebackup -R`, which writes `standby.signal` and the
  connection settings. It showed a `replay_lag` of 26 ms, and had replayed the delete a third
  of a second later. A deliberately delayed replica, with `recovery_min_apply_delay`, gives a
  short window to stop a mistake. It doesn't replace a backup.


  The restore test in the parsons step ran on PostgreSQL 17.11 too. A custom-format dump
  (`pg_dump -Fc`) of 5,000 bookings loaded into a scratch database in 0.36 s of real time,
  and the count came back as 5000. A dump is fine for a small database or a copy for a
  laptop. Managed databases do base backups and WAL archiving for you. The restore
  test is still yours to run.


  "Breaking it on purpose", in the testing chapter, turns the restore drill into a habit:
  break something on a schedule, on purpose, and check the recovery works.
