term: idempotency key
aka: [ Idempotency-Key, request id for retries ]
short: A unique value sent with a request, so the server recognises a retry and doesn't repeat the work.
explain: |
  You send "create a payment" and the connection drops. Did it go through? Retrying might
  charge twice; not retrying might charge nothing.

  Generate a unique key for the operation and send it with every attempt. The server stores
  the key with the result. A repeat with the same key gets that result, not a second payment.
  No such header at the vendor? Store your own reference on the record, and look it up before
  retrying a create.
analogy: A raffle ticket number. Hand in the same ticket twice and you're still in the draw once.
example:
  language: http
  code: |
    POST /v1/invoices HTTP/1.1
    Idempotency-Key: 4c1e7f0a-9b2d-4e61-8f3a-2d5c9e8b7a10
    Content-Type: application/json

    {"customer":"cus_17","amount":4200}
usage: Generate the idempotency key once per invoice, not per attempt, or the retries create duplicates.
related: [ idempotent, retry, webhook ]
level: 2
lessons: [ integrations.writing-to-other-systems ]
