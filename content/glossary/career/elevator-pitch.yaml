term: tell me about yourself
aka: [elevator pitch, personal introduction, walk me through your CV]
short: A one-minute introduction in the order now, before and next, opening most interview rounds.
explain: |
  It's the one question you control completely. It sets the interviewer's first picture of
  your level and hands them the thread for the next forty minutes.

  Now: what you do and what you're strongest at. Before: how you got here, with one proof
  that you deliver. Next: why this role is the obvious step. Keep a one-minute and a
  two-minute version, and stop where they can pick up a thread.
analogy: The blurb on the back of a book. Enough to want to read on, no more.
usage: Your tell me about yourself ran four minutes; cut it to now, one proof, and why this team.
related: [proof-point, story-bank, behavioural-interview, star-method]
level: 1
lessons: [career.your-narrative]
