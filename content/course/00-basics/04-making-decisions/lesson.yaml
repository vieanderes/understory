id: basics.conditions
title: Making decisions
objective: Compare values and choose what runs with `if` and `else`.
level: essential
minutes: 10
concepts: [basics.comparisons, basics.if-else]
prerequisites: [basics.operators]
opening:
  text: >-
    You'll make your code choose what to do, like a game deciding whether you've won. It
    takes one small new word: `if`.

steps:
  - type: prose
    id: booleans
    body: >-
      Code can compare values. `5 > 3` asks "is 5 greater than 3?", and the answer is `true`.
      Every comparison answers `true` or `false`. These two values are called **booleans**.


      The comparisons are `>` and `<`, `>=` and `<=` for "or equal", `===` for equal, and `!==`
      for not equal.


      Why three signs for equal? One `=` already means "now holds". Two, `==`, has quirks
      you'll meet later. Three compare exactly.

  - type: predict-output
    id: predict-comparison
    concept: basics.comparisons
    difficulty: 1
    language: js
    code: |
      console.log(10 > 4);
      console.log(3 > 8);
    question: What do these lines show?
    choices:
      - text: '`true`, then `false`'
        correct: true
        feedback: >-
          Yes. A comparison answers with `true` or `false`.
      - text: '`10`, then `8`'
        feedback: >-
          A comparison doesn't pick a number. It answers a yes-or-no question.
      - text: '`yes`, then `no`'
        feedback: >-
          Right idea. JavaScript's words for yes and no are `true` and `false`.

  - type: prose
    id: if-else
    body: |-
      Now let the answer choose what happens:

      ```js
      const age = 20;
      if (age >= 18) {
        console.log("Welcome in");
      } else {
        console.log("Adults only, sorry");
      }
      ```

      `if` checks the condition in brackets. When it's `true`, the code in the curly brackets
      runs. When it's `false`, the `else` part runs instead. Only one of them ever runs.

  - type: predict-output
    id: predict-if
    concept: basics.if-else
    difficulty: 2
    language: js
    code: |
      const temperature = 12;
      if (temperature > 20) {
        console.log("T-shirt weather");
      } else {
        console.log("Bring a jumper");
      }
    question: What does this show?
    choices:
      - text: '`Bring a jumper`'
        correct: true
        feedback: >-
          Right. 12 isn't greater than 20, so `else` runs.
      - text: '`T-shirt weather`'
        feedback: >-
          The condition is `12 > 20`, which is `false`. So the first part is skipped.
      - text: Both lines
        feedback: >-
          `if` and `else` are a choice. Exactly one of them runs.

  - type: fill-blank
    id: fill-lift-check
    concept: basics.comparisons
    difficulty: 2
    language: js
    prompt: A lift carries at most 8 people. Pick the comparison that lets exactly 8 ride.
    template: |
      const people = 8;
      if (people {{1}} 8) {
        console.log("Going up");
      } else {
        console.log("Too many, wait for the next one");
      }
    blanks:
      - key: '1'
        answer: '<='
    bank: ['<=', '<', '=', '>=']

  - type: bug-hunt
    id: hunt-single-equals
    concept: basics.comparisons
    difficulty: 3
    language: js
    code: |
      let stock = 0;
      if (stock = 5) {
        console.log("In stock");
      } else {
        console.log("Sold out");
      }
    prompt: Stock is 0, but this shows `In stock`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: One `=` puts 5 into `stock` instead of comparing
        correct: true
        feedback: >-
          Exactly. `stock` became 5, and 5 counts as true. Compare with `>`.
      - text: '`stock` should be a `const`'
        feedback: >-
          `let` is fine here. The problem is what line 2 does to `stock`.
      - text: The `else` is in the wrong place
        feedback: >-
          The `else` is right. Line 2 changes `stock` before anything is checked.
    fix: |
      let stock = 0;
      if (stock > 0) {
        console.log("In stock");
      } else {
        console.log("Sold out");
      }

  - type: prose
    id: else-if
    body: |-
      Need more than two choices? Chain them with `else if`:

      ```js
      if (score >= 90) {
        console.log("Gold");
      } else if (score >= 70) {
        console.log("Silver");
      } else {
        console.log("Bronze");
      }
      ```

      The computer checks from the top. It runs the first branch that's true, then skips the
      rest.

  - type: bug-hunt
    id: hunt-branch-order
    concept: basics.if-else
    difficulty: 3
    language: js
    code: |
      const score = 95;
      if (score >= 70) {
        console.log("Silver");
      } else if (score >= 90) {
        console.log("Gold");
      } else {
        console.log("Bronze");
      }
    prompt: A score of 95 shows `Silver`, not `Gold`. Tap the line that catches 95 by mistake.
    lines: [2]
    reasons:
      - text: The lower bar is checked first, and 95 passes it
        correct: true
        feedback: >-
          Right. The first true branch wins, so check the highest bar first.
      - text: '`>=` should be `>`'
        feedback: >-
          95 is above 70 either way. The order of the checks is what goes wrong.
      - text: '`score` should be a `let`'
        feedback: >-
          The score never changes, so `const` is fine. Look at which check runs first.
    fix: |
      const score = 95;
      if (score >= 90) {
        console.log("Gold");
      } else if (score >= 70) {
        console.log("Silver");
      } else {
        console.log("Bronze");
      }

  - type: code-challenge
    id: write-ticket-price
    concept: basics.if-else
    difficulty: 3
    language: js
    starter: starter.js
    editable: '4'
    solution: solution.js
    tests: tests.js
    prompt: >-
      A cinema charges 5 pounds for children under 12, and 9 pounds for everyone else. The
      starter has `age`.


      Use `if` and `else` to give `price` the right value. Then show `Ticket: 5 pounds` or
      `Ticket: 9 pounds`, using `price`.
    hints:
      - Decide first, show afterwards. The `if` sets `price`, and one `console.log` shows it.
      - Under 12 means `age < 12`.
      - 'Start with `if (age < 12) {`, then `price = 5;` inside the curly brackets.'

  - type: explain-back
    id: explain-else-if-order
    concept: basics.if-else
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: |-
      ```js
      const score = 95;
      if (score >= 90) {
        console.log("Gold");
      } else if (score >= 70) {
        console.log("Silver");
      } else {
        console.log("Bronze");
      }
      ```

      This shows only `Gold`, although 95 is also at least 70. Why?
    rubric:
      - The computer checks the conditions from the top down.
      - It runs the first branch whose condition is true.
      - Every branch after that is skipped, even if its condition is true too.
    modelAnswer: >-
      The conditions are checked in order. `score >= 90` is true, so the Gold branch runs.
      After one branch runs, the rest of the chain is skipped. The Silver check never happens.

recap:
  - "Compare two values and get `true` or `false`."
  - "Choose what runs with `if` and `else`."
  - "Check several cases in turn with `else if`."
recall:
  - id: card-booleans
    concept: basics.comparisons
    front: What does a comparison like `4 < 9` give you?
    back: >-
      A boolean: `true` or `false`. Here, `true`.
  - id: card-equals
    concept: basics.comparisons
    front: What's the difference between `=` and `===`?
    back: >-
      `=` puts a value into a variable. `===` asks whether two values are equal.
  - id: card-else-if
    concept: basics.if-else
    front: In an `if`, `else if`, `else` chain, which branches run?
    back: >-
      Only the first one whose condition is true. If none is, the `else` runs.

references:
  - kind: docs
    title: Comparisons
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/comparison
    note: Every comparison operator, with the surprises.
    primary: true
    verified: true
  - kind: docs
    title: "Conditional branching: if, '?'"
    authors: Ilya Kantor
    venue: The Modern JavaScript Tutorial
    url: https://javascript.info/ifelse
    note: '`if`, `else` and `else if`, with small tasks.'
    primary: true
    verified: true
  - kind: docs
    title: if...else
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/if...else
    note: The full reference.
    verified: true

deepDive: >-
  Already know this? You'll also meet `==` with two signs. It converts both sides to the
  same type before comparing, so `"5" == 5` is `true`. That's called type coercion, and it
  surprises people, which is why this course uses `===`.


  A condition doesn't have to be a comparison. Any value works, and JavaScript decides
  whether it counts as true. `0` and empty text count as false. That's why `if (stock = 5)`
  passed: 5 counts as true.
