deepDive: >-
  Why the first run is slow: V8 first runs a function in its interpreter. Once the function
  is hot, a compiler turns it into fast machine code. Memory and CPU caches warm up too. The
  Memory and runtimes lesson covers the interpreter and the JIT.


  Tools do the repeating for you. Vitest's `bench`, `mitata` and `tinybench` warm up, run
  many times and report percentiles. For a web page, the browser's Performance panel records
  every task with its time.


  Percentiles don't average. The p95 of a day isn't the average of each hour's p95. Keep
  the raw timings, or a histogram, and work the percentile out from those.


  Budgets for chat products often name two numbers: time to first token, and total time.
  Streaming fixes the first. Only a faster or smaller model, or a shorter answer, fixes the
  second.
