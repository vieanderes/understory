id: ts.everyday-types
title: Typing everyday code
objective: Type variables, arrays, functions and objects, and handle a property that may be missing.
level: essential
minutes: 10
concepts: [ts.type-inference, ts.function-and-array-types, ts.object-types, ts.optional-properties]
prerequisites: [ts.what-typescript-is]
opening:
  text: >-
    You'll type the code you write every day: lists, functions and objects. Then you'll catch
    the bug behind every "undefined" you've ever seen on a web page.

steps:
  - type: prose
    id: let-the-checker-infer
    body: |-
      You don't have to annotate everything. When a variable starts with a value, the checker
      works out its type from that value:

      ```ts
      let nights = 3;
      nights = "three";
      // Type 'string' is not assignable to type 'number'.
      ```

      That's **type inference**. Hover over a name in your editor to see what was inferred.
      Parameters have no starting value, so those you annotate.

  - type: bug-hunt
    id: hunt-inferred-type
    concept: ts.type-inference
    difficulty: 1
    language: ts
    code: |
      let label = "Loading";
      let attempts = 0;

      function onFailed(statusCode: number): void {
        attempts = attempts + 1;
        label = statusCode;
      }
    prompt: >-
      Only the parameter has an annotation, yet the checker underlines a line. Tap it.
    lines: [6]
    reasons:
      - text: '`label` was inferred as a `string`'
        correct: true
        feedback: >-
          Right. `"Loading"` made it a `string`, and a number doesn't fit.
      - text: '`attempts` has no annotation'
        feedback: >-
          It doesn't need one. It started as `0`, so it's a `number`, and line 5 fits.
      - text: A `let` can't change inside a function
        feedback: >-
          It can. The trouble is the kind of value, not the change.
    fix: |
      label = `Failed with ${statusCode}`;

  - type: prose
    id: arrays-and-functions
    body: |-
      A list gets square brackets after the type of its items. `number[]` is a list of
      numbers, and `string[]` a list of strings:

      ```ts
      function average(scores: number[]): number {
        return scores.reduce((sum, s) => sum + s, 0) / scores.length;
      }
      ```

      Now every call is checked twice: is it a list, and is everything in it a number? A
      function that returns nothing gets `: void`.

  - type: multiple-choice
    id: pick-rejected-calls
    concept: ts.function-and-array-types
    difficulty: 2
    language: ts
    code: |
      function average(scores: number[]): number {
        return scores.reduce((sum, s) => sum + s, 0) / scores.length;
      }
      average([7, 9, 10]);
      average(["7", "9"]);
      average(7);
    question: Which calls does the checker reject?
    choices:
      - text: Lines 5 and 6
        correct: true
        feedback: >-
          Right. Line 5 has text in the list. Line 6 has no list.
      - text: Only line 5
        feedback: >-
          A single number isn't a list. The checker says `number` doesn't fit `number[]`.
      - text: Only line 6
        feedback: >-
          `"7"` looks like a number, but it's text. Every item must be a `number`.
      - text: None of them
        feedback: >-
          JavaScript would run them all. The annotation `number[]` is what rules two out.

  - type: prose
    id: object-types
    body: |-
      Most data is objects. `type` gives the shape of one a name:

      ```ts
      type Film = {
        title: string;
        minutes: number;
      };

      function runtime(film: Film): string {
        return `${film.minutes} min`;
      }
      ```

      That's an **object type**. `interface Film { ... }` does the same job, written without
      the `=`. Teams tend to pick one and stick to it.

  - type: fill-blank
    id: fill-film-type
    concept: ts.object-types
    difficulty: 2
    language: ts
    prompt: >-
      A film has a title, a length in minutes, and a list of tags such as `"horror"`. Complete
      the type and use it.
    template: |
      {{1}} Film = {
        title: {{2}};
        minutes: number;
        tags: {{3}};
      };

      function describe(film: {{4}}): string {
        return `${film.title}, ${film.minutes} min`;
      }
    blanks:
      - key: '1'
        answer: type
      - key: '2'
        answer: string
      - key: '3'
        answer: 'string[]'
      - key: '4'
        answer: Film
    bank: [type, interface, string, 'string[]', '[string]', Film, film, object]

  - type: prose
    id: optional-properties
    body: |-
      Some films have a subtitle and some don't. A `?` says a property may be missing:

      ```ts
      type Film = { title: string; subtitle?: string };
      ```

      Reading `film.subtitle` now gives `string | undefined`. Read the `|` as "or". Use it as
      a string straight away and the checker stops you:

      ```text
      'film.subtitle' is possibly 'undefined'.
      ```

      Handle the missing case first, with `if` or `??`.

  - type: predict-output
    id: predict-missing-subtitle
    concept: ts.optional-properties
    difficulty: 2
    language: ts
    code: |
      type Film = { title: string; subtitle?: string };

      function shout(film: Film): string {
        return film.subtitle.toUpperCase();
      }
      function heading(film: Film): string {
        return film.subtitle ?? film.title;
      }
    question: What does the checker report?
    choices:
      - text: 'Line 4: `subtitle` is possibly `undefined`'
        correct: true
        feedback: >-
          Right. Line 7 handles the missing case with `??`, and line 4 doesn't.
      - text: Errors on lines 4 and 7
        feedback: >-
          Line 7 is safe. `??` swaps in the title whenever the subtitle is `undefined`.
      - text: Nothing, since `subtitle` is a string
        feedback: >-
          The `?` added `undefined`. A missing subtitle has no `toUpperCase` to call.

  - type: code-challenge
    id: write-film-label
    concept: ts.optional-properties
    difficulty: 3
    language: ts
    prompt: >-
      Write `filmLabel(film)`. With a subtitle it gives `"Alien: Director's Cut (117 min)"`,
      and without one it gives `"Alien (117 min)"`.


      The starter compiles, yet shows `"Alien: undefined (117 min)"`. The checker lets a
      missing value into a template string, so this one is up to you.
    hints:
      - Look at `${film.subtitle}` in the starter. What does it print when there's no subtitle?
      - '`film.subtitle` is `string | undefined`. Check for `undefined` before building the text.'
      - 'Start with `if (film.subtitle === undefined) { return ... }` and return the short label there.'

  - type: explain-back
    id: explain-where-to-annotate
    concept: ts.type-inference
    difficulty: 2
    prompt: >-
      Why do you annotate a function's parameters, but usually not `let nights = 3`?
    rubric:
      - A variable with a starting value gets its type inferred from that value.
      - A parameter has no value to infer from until someone calls the function.
      - The parameter's annotation is what every call is checked against.
    modelAnswer: >-
      `let nights = 3` starts with a number, so the checker infers `number` on its own. Writing
      it out adds nothing. A parameter has no value inside the function until a caller passes
      one. Its annotation is the rule every call gets checked against, so that's where you
      write types.

recap:
  - Let the checker infer variables, and annotate function parameters.
  - Type lists with `[]` and objects with `type` or `interface`.
  - Handle a property marked `?` before you use it.

recall:
  - id: card-where-to-annotate
    concept: ts.type-inference
    front: Which do you annotate, `let total = 0` or the parameters of `function add(a, b)`?
    back: >-
      The parameters. `total` gets `number` from its starting value. Parameters have nothing to
      infer from.
  - id: card-list-type
    concept: ts.function-and-array-types
    front: How do you write the type of a list of prices, and of a list of names?
    back: >-
      `number[]` and `string[]`: the item type, then square brackets.
  - id: card-type-or-interface
    concept: ts.object-types
    front: Write a `Film` type with a `title` and `minutes`, as a `type` and as an `interface`.
    back: >-
      `type Film = { title: string; minutes: number };` and
      `interface Film { title: string; minutes: number }`.
  - id: card-optional-read
    concept: ts.optional-properties
    front: '`subtitle?: string`. What type do you get when you read `film.subtitle`?'
    back: >-
      `string | undefined`. Handle `undefined` first, with `if` or `??`.

