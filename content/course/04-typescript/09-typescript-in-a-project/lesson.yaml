id: ts.configuration
title: TypeScript in a project
objective: Set up `tsconfig.json`, match the module settings to what runs your code, and treat declaration files with care.
level: advanced
minutes: 10
concepts: [ts.tsconfig, ts.module-resolution, ts.declaration-files]
prerequisites: [ts.strictness, tooling.quality-gates]
opening:
  text: >-
    You'll set up the checker for a real project, so a green build means your types were
    checked. You'll also know which tools check types and which only strip them.

steps:
  - type: prose
    id: what-tsconfig-is
    body: |-
      A project has many files. `tsconfig.json` tells the checker which to read and how
      strictly:

      ```json
      {
        "compilerOptions": {
          "strict": true,
          "noUncheckedIndexedAccess": true,
          "noEmit": true
        },
        "include": ["src"]
      }
      ```

      `tsc` is the checker as a program of its own. You start it by typing `tsc` in a
      **terminal**, a window for typing commands. `noEmit` means "check only": another tool
      writes the JavaScript.

  - type: fill-blank
    id: fill-tsconfig
    concept: ts.tsconfig
    difficulty: 2
    language: json
    prompt: >-
      Set up a project that checks everything in `src`. Follow the comments.
    template: |
      {
        "compilerOptions": {
          // every check in the strict family
          "{{1}}": true,
          // add undefined to reads like tracks[0]
          "{{2}}": true,
          // check only: another tool writes the JavaScript
          "{{3}}": true
        },
        "{{4}}": ["src"]
      }
    blanks:
      - key: '1'
        answer: strict
      - key: '2'
        answer: noUncheckedIndexedAccess
      - key: '3'
        answer: noEmit
      - key: '4'
        answer: include
    bank: [strict, noUncheckedIndexedAccess, noEmit, include, exclude, skipLibCheck, emit]

  - type: prose
    id: checker-versus-build
    body: >-
      A **bundler** packs your files for the browser, and a dev server shows the page as you
      work. Both strip types one file at a time, without checking them. So a page can run
      with type errors in it.


      File by file, they can't tell if an imported name is a type. `export type` says so.
      Only `tsc` checks, so CI, the server that tests every change, runs it.

  - type: bug-hunt
    id: hunt-type-re-export
    concept: ts.module-resolution
    difficulty: 3
    language: ts
    code: |
      // src/orders/types.ts
      export type Order = { id: string; totalPence: number };
      export const CURRENCY = "GBP";

      // src/orders/index.ts
      import { Order, CURRENCY } from "./types";

      export { Order, CURRENCY };

      export function label(order: Order): string {
        return `${order.id}: ${order.totalPence} ${CURRENCY}`;
      }
    prompt: >-
      `tsc` passes. The dev server, working file by file, crashes: `'./types.js' does
      not provide an export named 'Order'`. Tap the line at fault.
    lines: [8]
    reasons:
      - text: One file alone can't show that `Order` is a type
        correct: true
        feedback: >-
          Yes. The tool keeps the name, but types vanish. Write `export type { Order }`.
      - text: A type can't be shared between files
        feedback: >-
          It can, and line 10 uses it fine. The trouble is the JavaScript, where types don't
          exist.
      - text: The import on line 6 needs `.js`
        feedback: >-
          The message names `./types.js`, so the file was found. One export inside it is
          missing.
      - text: A `const` can't be exported again
        feedback: >-
          Exporting a value again is ordinary module syntax. `CURRENCY` exists at run time.
          `Order` is the name with nothing behind it.
    fix: |
      import { Order, CURRENCY } from "./types";

      export type { Order };
      export { CURRENCY };

  - type: prose
    id: settings-describe-the-host
    body: >-
      Module settings don't change how your code runs. They describe the program that will
      run it, so the checker finds imports the same way.


      `moduleResolution` is the rule for finding the file behind an import. `bundler` matches
      a bundler, which fills in missing file extensions. Node and the browser don't: they
      want `./total.js` written out. `node16` matches Node.

  - type: bug-hunt
    id: hunt-bare-import
    concept: ts.module-resolution
    difficulty: 3
    language: ts
    code: |
      // tsconfig.json: "moduleResolution": "bundler"
      // index.html: <script type="module" src="dist/app.js"></script>
      // No bundler runs. tsc writes dist/app.js and dist/average.js.

      // src/app.ts
      import { average } from "./average";

      console.log(average([4, 8]));
    prompt: >-
      `tsc` passes, but the browser asks for `dist/average` and gets a 404. Tap the line at
      fault.
    lines: [6]
    reasons:
      - text: The browser needs the full name, `./average.js`
        correct: true
        feedback: >-
          Right. `bundler` let the short path pass, and `tsc` copied it as written.
      - text: '`tsc` should have added `.js` itself'
        feedback: >-
          Most people expect that. But `tsc` never rewrites an import path.
      - text: '`average` needs `export default`'
        feedback: >-
          A named import is fine. The browser never found the file to look inside.
    fix: |
      import { average } from "./average.js";

  - type: prose
    id: declaration-files
    body: |-
      A **package** is code someone published for others to reuse. One written in plain
      JavaScript has no types. A **declaration file**, ending in `.d.ts`, describes them:

      ```ts
      declare module "tiny-qr" {
        export function toDataUrl(text: string): Promise<string>;
      }
      ```

      `declare` says "this exists somewhere else". The file holds no code. Many are installed
      as packages named `@types/...`. Nothing checks a declaration against the real package,
      so a wrong one compiles.

  - type: ai-review
    id: review-invented-declaration
    concept: ts.declaration-files
    difficulty: 3
    language: ts
    request: Fix the missing types for the package 'tiny-qr' and render a receipt QR code.
    flawClass: hallucinated-api
    code: |
      // src/tiny-qr.d.ts
      declare module "tiny-qr" {
        export function renderQr(text: string, size: number): Promise<string>;
      }

      // src/receipt.ts
      import { renderQr } from "tiny-qr";

      export async function receiptQr(orderId: string): Promise<string> {
        return renderQr(`order:${orderId}`, 256);
      }
    prompt: >-
      An assistant wrote both files, and `tsc` passes. The package really exports one
      function, `toDataUrl(text)`. Tap the line at fault.
    lines: [3]
    reasons:
      - text: It declares a function the package doesn't export
        correct: true
        feedback: >-
          Right. Nothing checks a declaration against the real JavaScript, so the invention
          compiled.
      - text: The declaration has no function body
        feedback: >-
          Declaration files never hold code. Adding a body is itself an error. The code comes
          from the package.
      - text: '`declare module` only works inside `@types`'
        feedback: >-
          Any `.d.ts` your `tsconfig` includes can declare a module. This one was found.
      - text: Line 7 should use `import type`
        feedback: >-
          `import type` is erased, and line 10 calls the function. A value import is right. The
          name is the problem.
    fix: |
      // src/tiny-qr.d.ts: matches what the package exports
      declare module "tiny-qr" {
        export function toDataUrl(text: string): Promise<string>;
      }

      // src/receipt.ts
      import { toDataUrl } from "tiny-qr";

      export async function receiptQr(orderId: string): Promise<string> {
        return toDataUrl(`order:${orderId}`);
      }

  - type: fill-blank
    id: fill-declaration
    concept: ts.declaration-files
    difficulty: 2
    language: ts
    prompt: >-
      The JavaScript package `slugify-lite` exports one function, `slugify(text)`, which
      returns text. Write its declaration.
    template: |
      {{1}} module "slugify-lite" {
        export {{2}} slugify(text: {{3}}): {{4}};
      }
    blanks:
      - key: '1'
        answer: declare
      - key: '2'
        answer: function
      - key: '3'
        answer: string
      - key: '4'
        answer: string
    bank: [declare, import, function, const, string, string, void, any]

  - type: explain-back
    id: explain-green-build
    concept: ts.tsconfig
    difficulty: 3
    prompt: >-
      The dev server shows the page, yet the project has type errors. Why didn't it stop
      you, and where must the check run?
    rubric:
      - The dev server and bundler strip types file by file and never run the checker.
      - Only `tsc`, reading `tsconfig.json`, checks the types with the chosen settings.
      - CI must run `tsc` as a required step, because nothing else enforces it.
    modelAnswer: >-
      The dev server only strips types, one file at a time, so it never looks at whether
      they're right. That keeps it fast, and it means a page runs with type errors. Only
      `tsc` checks, using the settings in `tsconfig.json`. So CI runs `tsc` as its
      own required step, or the checks count for nothing.

recap:
  - Write a `tsconfig.json` that checks strictly and leaves the output to the bundler.
  - Match `moduleResolution` to whatever runs your code.
  - Treat every `.d.ts` file as a promise nothing checks.

recall:
  - id: card-no-emit
    concept: ts.tsconfig
    front: 'What does `"noEmit": true` do, and why would you want it?'
    back: >-
      `tsc` checks but writes no JavaScript. The bundler produces the output, and `tsc` is
      the check.
  - id: card-dev-server-check
    concept: ts.tsconfig
    front: Does the dev server check your types?
    back: >-
      No. It strips them file by file. Only `tsc` checks, so CI must run it.
  - id: card-bundler-or-node16
    concept: ts.module-resolution
    front: 'When is `"moduleResolution": "bundler"` the wrong choice, and what goes wrong?'
    back: >-
      When Node runs the output directly. `bundler` allows `./total` without `.js`, and Node
      can't find it.
  - id: card-declare
    concept: ts.declaration-files
    front: What JavaScript does a `.d.ts` file produce, and who checks it?
    back: >-
      None, and nobody. It's a promise about code that lives elsewhere, and a broken promise
      fails at run time.

