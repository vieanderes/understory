term: full sync
aka: [ full resync, full import, full refresh ]
short: Copying every record from another system each run, whether or not it changed.
explain: |
  The simplest way to keep a copy up to date is to fetch the lot, every time. No clever
  bookkeeping, and nothing can be missed.

  It also shows deletions: whatever didn't come back is gone at the source. The cost is time
  and rate limit, which grow with the data, not with the changes. So most syncs run deltas
  often and a full pass weekly. The full pass repairs whatever the deltas got wrong.
analogy: Repainting the whole fence every spring, instead of touching up the scratched bits.
usage: The full sync takes six hours now; switch to deltas nightly and keep the full sync for Sundays.
twin:
  term: delta-sync
  difference: A full sync copies everything every run, which is simple and catches deletions. A delta sync copies only what changed since last time. It's fast, but needs a dependable way to find changes.
related: [ delta-sync, data-reconciliation, soft-delete ]
level: 2
lessons: [ integrations.full-and-delta-sync ]
