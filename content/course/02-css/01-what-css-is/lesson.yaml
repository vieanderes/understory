deepDive: >-
  Colours come in several forms. Names such as `teal` cover 148 colours. A hex code such as
  `#1e6f5c` gives red, green and blue as pairs of hexadecimal digits. `rgb(30 111 92)` says
  the same in decimal, and `hsl()` works in hue, saturation and lightness.


  An element can carry several classes, separated by spaces: `class="new vegan"`. The rule
  `.new.vegan`, with no space, matches only elements that have both.


  A `style` attribute on one element, such as `<p style="color: red">`, also works. It's hard
  to reuse and hard to override, so keep it for quick experiments.


  The browser drops a declaration it can't read, then carries on with the next one. That's
  why a typo fails silently. The developer tools in every browser mark such a line with a
  warning, which is the quickest way to find it.
