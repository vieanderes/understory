term: attribute
aka: [HTML attribute]
short: A named setting inside a start tag, such as where a link goes or which image to show.
explain: |
  A link needs a destination and an image needs a file. You give those as a name and a
  value inside the start tag: `href="/menu"`, `src="cake.jpg"`.

  Each element accepts its own set, and a few work everywhere, such as `id`, `class` and
  `lang`. A misspelt one is ignored without a word, so check the spelling when nothing
  happens.
analogy: The options on a coffee order. Same drink, but oat milk and a large cup change what you get.
example:
  language: html
  code: |
    <a href="/menu">Menu</a>
    <img src="cake.jpg" alt="A slice of lemon cake">
    <input type="email" required>
usage: Add the required attribute to the email field, and the browser blocks an empty form for you.
related: [html-element, html-tag, alt-text, aria]
level: 1
lessons: [html.everyday-elements]
