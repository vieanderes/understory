id: scale
number: 14
title: Concurrency and scale
summary: "What changes when many requests arrive at once and several copies of your server share one database. Cap how much runs at once, keep CPU work off the main thread, close races, and make retries, queues and scheduled jobs safe to run twice."
why: "Code that is correct for one user can be wrong for two at once."
youCanBuild: "A batched, rate-safe pipeline of model calls, an idempotent payment endpoint, a queue worker for long AI jobs, and a scheduled job that runs once across servers."
lab: overselling-simulator
concepts:
  - id: scale.concurrency
    title: Concurrency
    summary: Several tasks are in progress over the same period, taking turns on one thread while each waits.
    confusableWith: [scale.parallelism]
  - id: scale.parallelism
    title: Parallelism
    summary: Several computations run at the same instant, on separate cores.
    confusableWith: [scale.concurrency]
  - id: scale.cpu-and-io-bound
    title: CPU-bound and I/O-bound work
    summary: Work that waits on a network, a disk or a database overlaps on one thread, and work that computes only speeds up on more cores.
  - id: scale.server-copies
    title: Several copies of a server
    summary: A busy app runs several copies of its server behind a load balancer, each with its own memory, sharing one database.
  - id: scale.bounded-concurrency
    title: Bounded concurrency
    summary: A cap on how many operations are in flight at once, so a fast caller can't flood a slower service.
    confusableWith: [scale.batching]
  - id: scale.batching
    title: Batching
    summary: Grouping many items into one call, which spreads the fixed cost of each call, up to the size the service accepts.
    confusableWith: [scale.bounded-concurrency]
  - id: scale.backpressure
    title: Backpressure
    summary: A slow consumer makes a fast producer wait or refuses its work, so a buffer between them can't grow without limit.
    confusableWith: [scale.load-shedding]
  - id: scale.blocking-the-loop
    title: Blocking the event loop
    summary: A long synchronous computation in a Node server delays every other request, because they all share one thread.
  - id: scale.worker-threads
    title: Worker threads
    summary: Extra threads inside one Node process, each running its own JavaScript, for CPU-bound work.
    confusableWith: [scale.web-workers]
  - id: scale.web-workers
    title: Web Workers
    summary: A worker runs a script on another thread in the browser, with no access to the DOM, so the page stays responsive.
    confusableWith: [scale.worker-threads, atlas.service-workers]
  - id: scale.message-passing
    title: Message passing
    summary: "A worker and the code that started it share no variables: they send each other copies of data with `postMessage` and listen for replies."
  - id: scale.race-condition
    title: Race conditions
    summary: The result depends on the timing or order of concurrent operations, and some orders give a wrong result.
  - id: scale.check-then-act
    title: Check-then-act
    summary: A decision made on a value read earlier is wrong if another actor changes the value before the write.
    confusableWith: [scale.lost-update]
  - id: scale.lost-update
    title: Lost update
    summary: Two actors read the same value, both compute from it and write, and the second write erases the first.
    confusableWith: [scale.check-then-act]
  - id: scale.optimistic-locking
    title: Optimistic locking
    summary: Read a version number with the row, and write only if the version is unchanged, so a stale save is refused instead of erasing a newer one.
    confusableWith: [scale.pessimistic-locking]
  - id: scale.pessimistic-locking
    title: Pessimistic locking
    summary: Lock the row as you read it, so other writers wait until the transaction ends.
    confusableWith: [scale.optimistic-locking]
  - id: scale.holds
    title: Holds
    summary: A hold reserves stock for one buyer for a limited time while they pay.
  - id: scale.hold-expiry
    title: Hold expiry and confirmation
    summary: An unpaid hold returns its stock when it expires, and confirmation succeeds only for a hold that is still active, checked in the same statement as the write.
  - id: scale.invariant-proof
    title: Checking every transition
    summary: List every operation that changes the numbers, and show each one keeps the rule, such as sold plus held never passing capacity.
  - id: scale.idempotency-keys
    title: Idempotency keys
    summary: The client sends a unique key with an operation, and the server stores the key with the result and returns that result for any repeat.
    confusableWith: [backend.safe-and-idempotent]
  - id: scale.deduplication-window
    title: Deduplication windows
    summary: Keys are kept for a bounded time, so a repeat that arrives after the window is treated as a new request.
  - id: scale.queues
    title: Queues and workers
    summary: A queue stores jobs durably between the code that adds them and the workers that process them, so slow work leaves the request.
  - id: scale.at-least-once
    title: At-least-once delivery
    summary: A job is delivered again until a worker acknowledges it, so a job can run more than once, whatever the queue promises, and must be safe to repeat.
  - id: scale.visibility-timeout
    title: Visibility timeouts
    summary: A received job is hidden from other workers for a set time and reappears if it is not acknowledged before then.
  - id: scale.dead-letter-queue
    title: Dead-letter queues
    summary: A job that fails a set number of times moves to a separate queue for a person to inspect, so it stops looping.
  - id: scale.single-runner
    title: One run across servers
    summary: With several servers each running the schedule, one run per tick needs the servers to claim the tick in a shared store.
    confusableWith: [scale.leases]
  - id: scale.leases
    title: Leases
    summary: A lease is a lock in a shared store that expires after a set time, so a slow run can't overlap the next and a crashed holder can't keep it for ever.
    confusableWith: [scale.single-runner]
  - id: scale.catch-up
    title: Missed runs and catch-up
    summary: A job that remembers where it got to, a watermark, covers any gap after downtime and is safe to run twice.
  - id: scale.schedule-time-zones
    title: Schedules and time zones
    summary: A local-time schedule meets daylight saving changes, where an hour is skipped or repeated, so schedules are kept in UTC.
  - id: scale.timeouts
    title: Timeouts
    summary: Every remote call has a deadline, because a call without one can hold its resources for ever.
  - id: scale.retries-with-jitter
    title: Retries with backoff and jitter
    summary: Retry only failures that may pass next time, wait longer after each one, and add a random part so clients don't retry in step.
  - id: scale.circuit-breaker
    title: Circuit breakers
    summary: After repeated failures the caller stops calling for a while and fails fast, then lets a trial request through to test recovery.
    confusableWith: [scale.load-shedding]
  - id: scale.load-shedding
    title: Load shedding
    summary: An overloaded service refuses excess requests early and cheaply, so the requests it accepts still finish in time.
    confusableWith: [scale.backpressure, scale.circuit-breaker]
