term: Kadane's algorithm
aka: [Kadane, maximum subarray, maximum slice, max slice sum]
short: One pass finding the largest sum of neighbouring items, extending the run or restarting at each item.
explain: |
  Find the stretch of days with the best total profit, where some days lose money. Every
  stretch is O(n²). There's a one-pass trick.

  Walk the list and keep the best total of a stretch ending here. At each item, either add
  it to that stretch or start fresh from it, whichever is bigger. Track the best seen.

  It's dynamic programming squeezed into two variables. Watch the all-negative list: the
  answer is the least negative item, unless the task allows an empty stretch.
analogy: A walk where you keep a running score of the scenery. When the score sinks below zero, you forget the walk so far and start counting again from here.
example:
  language: js
  code: |
    function bestSlice(nums) {
      let endingHere = nums[0], best = nums[0];
      for (let i = 1; i < nums.length; i++) {
        endingHere = Math.max(nums[i], endingHere + nums[i]); // extend or restart
        best = Math.max(best, endingHere);
      }
      return best;
    }
usage: Kadane's algorithm gives the best slice in one pass; mind the all-negative test.
twin:
  term: sliding-window
  difference: Kadane's algorithm restarts the stretch whenever it helps, so the length varies freely. A sliding window grows and shrinks by a rule about what's inside.
related: [subarray, dynamic-programming, prefix-sum, sliding-window]
level: 3
lessons: [algo.maximum-slice]
