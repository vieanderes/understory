id: css.what-css-is
title: What CSS is
objective: Write CSS rules that colour and shape a page, and pick out elements with a class.
level: essential
minutes: 10
concepts: [css.rules, css.class-selectors, css.everyday-properties]
prerequisites: [html.first-page]
opening:
  text: >-
    You'll write your first CSS and watch a plain page change colour, size and shape as you
    type. Every styled page you've ever used is built from the rules you'll meet here.

steps:
  - type: prose
    id: what-css-is
    body: |-
      HTML says what each part of a page is. **CSS** says how it looks: colours, sizes,
      spacing and layout.

      ```css
      h1 { color: teal; }
      ```

      That line tells the browser: find every `h1` and draw its text in teal. Change the line,
      and every `h1` on the page changes with it.

  - type: playground
    id: colour-the-heading
    concept: css.rules
    difficulty: 1
    prompt: >-
      The CSS tab holds one rule. Change `black` to `teal` and watch the heading.
    html: |
      <h1>Night Market</h1>
      <p>Street food, music and paper lanterns. Every Friday from 6pm.</p>
    css: |
      h1 { color: black; }
    editable: [css]
    checks:
      - label: The heading is teal
        selector: h1
        style: { property: color, value: 'rgb(0, 128, 128)' }
    solution:
      css: |
        h1 { color: teal; }
    hints:
      - The colour is the word after `color:`.
      - Replace `black` with `teal`, and keep the semicolon.
      - 'The rule reads `h1 { color: teal; }`.'

  - type: prose
    id: anatomy-of-a-rule
    body: |-
      ```css
      p { color: navy; font-size: 20px; }
      ```

      That whole line is a **rule**. `p` is the selector: it picks which elements to style.
      Inside the braces sit declarations. Each one is a property, a colon, then a value, and
      it ends with a semicolon. `px` means pixels, so `font-size: 20px` makes the text 20
      pixels tall.

  - type: multiple-choice
    id: pick-the-value
    concept: css.rules
    difficulty: 1
    language: css
    code: |
      li { font-size: 18px; }
    question: Which part is the value?
    choices:
      - text: '`18px`'
        correct: true
        feedback: >-
          Yes. The value comes after the colon and says how much.
      - text: '`font-size`'
        feedback: >-
          That's the property, the thing being set. The value comes after the colon.
      - text: '`li`'
        feedback: >-
          That's the selector. It picks the elements, here every list item.

  - type: prose
    id: where-css-lives
    body: |-
      On a real site, CSS sits in its own file, such as `styles.css`. One line in the page's
      `head` links it:

      ```html
      <link rel="stylesheet" href="styles.css">
      ```

      Every page that links the file gets the same look, so one change restyles a whole site.
      For a quick test, CSS can also sit in a `<style>` element in the `head`. The CSS tab here
      works like a linked file.

  - type: playground
    id: style-the-ticket
    concept: css.everyday-properties
    difficulty: 2
    prompt: >-
      Turn this into a ticket. Add these to the `section` rule one at a time, and watch each
      land: `background: gold;`, `border: 3px dashed black;`, `padding: 16px;` and
      `text-align: center;`.
    html: |
      <section>
        <h2>Night Market</h2>
        <p>Admit one. Friday, 6pm.</p>
      </section>
    css: |
      section {
        font-family: sans-serif;
      }
    editable: [css]
    checks:
      - label: The ticket is gold
        selector: section
        style: { property: background-color, value: 'rgb(255, 215, 0)' }
      - label: It has a dashed border
        selector: section
        style: { property: border-top-style, value: dashed }
      - label: It has 16px of padding
        selector: section
        style: { property: padding-top, value: 16px }
      - label: The text is centred
        selector: section
        style: { property: text-align, value: center }
    solution:
      css: |
        section {
          font-family: sans-serif;
          background: gold;
          border: 3px dashed black;
          padding: 16px;
          text-align: center;
        }
    hints:
      - Each declaration goes on its own line inside the braces.
      - Copy each one exactly, semicolon and all.
      - 'The first new line is `background: gold;`.'

  - type: prose
    id: class-selectors
    body: |-
      `p` styles every paragraph. Often you want only some. You met `class` in the HTML
      chapter as a label for styling. Here's how CSS uses it:

      ```html
      <li class="sold-out">Lanterns</li>
      ```

      ```css
      .sold-out { color: grey; }
      ```

      A dot and a class name make a **class selector**. Only elements with that class
      change, and one class can go on as many elements as you like.

  - type: playground
    id: mark-the-new-stalls
    concept: css.class-selectors
    difficulty: 2
    prompt: >-
      Tacos and churros are new tonight. In the HTML, add `class="new"` to both of their `li`
      tags. Then write a `.new` rule that makes them `crimson` and `bold`.
    html: |
      <h2>Tonight's stalls</h2>
      <ul>
        <li>Dumplings</li>
        <li>Tacos</li>
        <li>Churros</li>
        <li>Bao buns</li>
      </ul>
    css: |
      li { font-size: 20px; }
    editable: [html, css]
    checks:
      - label: Two stalls have the class new
        selector: .new
        count: 2
      - label: The new stalls are crimson
        selector: .new
        style: { property: color, value: 'rgb(220, 20, 60)' }
      - label: The new stalls are bold
        selector: .new
        style: { property: font-weight, value: '700' }
      - label: The other stalls stay black
        selector: 'li:not(.new)'
        style: { property: color, value: 'rgb(0, 0, 0)' }
    solution:
      html: |
        <h2>Tonight's stalls</h2>
        <ul>
          <li>Dumplings</li>
          <li class="new">Tacos</li>
          <li class="new">Churros</li>
          <li>Bao buns</li>
        </ul>
      css: |
        li { font-size: 20px; }
        .new { color: crimson; font-weight: bold; }
    hints:
      - The class goes inside the start tag, like `<li class="new">`.
      - In CSS, a class selector starts with a dot.
      - 'Add the rule `.new { color: crimson; font-weight: bold; }`.'

  - type: bug-hunt
    id: hunt-silent-rule
    concept: css.rules
    difficulty: 2
    language: css
    code: |
      .price {
        colour: green;
        font-weight: bold;
      }
    prompt: >-
      The prices turn bold but never green. The page shows no error. Tap the line at fault.
    lines: [2]
    reasons:
      - text: CSS spells it `color`, the American way
        correct: true
        feedback: >-
          Right. The browser skips a property it doesn't know, without a word.
      - text: '`green` isn''t a colour CSS knows'
        feedback: >-
          `green` is one of the named colours. The trouble is the property name before it.
      - text: A rule can hold only one declaration
        feedback: >-
          A rule can hold as many as you like. Each ends in a semicolon, as here.
    fix: |
      .price {
        color: green;
        font-weight: bold;
      }

  - type: explain-back
    id: explain-one-rule-many-prices
    concept: css.class-selectors
    difficulty: 2
    prompt: >-
      A shop shows 200 prices across its pages. Why is one `.price` rule in a linked file
      better than styling each price by hand?
    rubric:
      - The class selector picks every element with the class, wherever it is.
      - Every page links the same file, so one edit changes every price at once.
      - The HTML keeps saying what things are, and the CSS alone decides the look.
    modelAnswer: >-
      Each price carries the class `price`, and the `.price` rule picks out every one of them.
      All the pages link the same style sheet, so changing that one rule restyles all 200 at
      once. Nobody hunts through the HTML. The HTML says what each thing is, and the CSS
      decides how it looks.

recap:
  - Write a rule with a selector and declarations, and watch the page change.
  - Colour, border, pad and centre a box with everyday properties.
  - Style only some elements by giving them a class.

recall:
  - id: card-parts-of-a-rule
    concept: css.rules
    front: 'Name the parts of `p { color: navy; }`.'
    back: >-
      `p` is the selector. `color: navy;` is a declaration: the property `color`, a colon, the
      value `navy` and a semicolon.
  - id: card-link-a-stylesheet
    concept: css.rules
    front: How does a page load the CSS in `styles.css`?
    back: >-
      With `<link rel="stylesheet" href="styles.css">` in its `head`.
  - id: card-class-selector
    concept: css.class-selectors
    front: How do you style only the list items marked as new?
    back: >-
      Give them `class="new"` in the HTML, then write a rule for the selector `.new`.
  - id: card-unknown-property
    concept: css.rules
    front: 'What does the browser do with `colour: green;`?'
    back: >-
      It ignores it. `colour` isn't a CSS property, so the declaration is skipped with no
      message on the page.

