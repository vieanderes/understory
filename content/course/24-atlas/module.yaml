id: atlas
number: 24
title: Atlas
summary: "A map of the languages and platforms beyond the web: what a language catches, how it runs and who cleans up, then websites that work offline, cross-platform and native apps, the stores, and desktop apps. Choose a route for a product with reasons, and ship an AI feature in an app without leaking its key."
why: "The right platform saves months, and the wrong one costs them."
youCanBuild: "A written platform decision for one product, an offline-first website, and a server endpoint that lets an app use a model API safely."
concepts:
  - id: atlas.platforms
    title: Platforms, native and cross-platform
    summary: A platform is a place code runs with its own rules, such as the browser, a server, a phone or a desktop; native code uses the platform's own language and toolkit, and cross-platform code runs on several from one codebase.
  - id: atlas.type-systems
    title: Static and dynamic typing
    summary: A static type system checks types before the program runs, and a dynamic one checks them as each operation executes.
  - id: atlas.runtimes
    title: Runtimes and binaries
    summary: A script needs its runtime installed, such as Node or Python, while an ahead-of-time compiler emits a binary of machine code that runs with nothing else installed.
  - id: atlas.memory-models
    title: Memory management models
    summary: Memory is reclaimed by a garbage collector in JavaScript, Go and Kotlin, mainly by reference counting in Swift and Python, and by compile-time ownership rules in Rust.
  - id: atlas.resource-cleanup
    title: Closing resources on a known line
    summary: Files, sockets and database connections are not returned by a garbage collector, so code releases them itself, with finally in JavaScript or with in Python.
  - id: atlas.problem-fit
    title: Fitting a language to a problem
    summary: "Hard constraints come first, such as where the code runs and whether a runtime can be installed; libraries and the team's knowledge decide among what is left."
  - id: atlas.ecosystems
    title: Ecosystems
    summary: A language's libraries, tooling, hosting options and hiring pool often decide more than the language's own features.
  - id: atlas.webassembly
    title: WebAssembly
    summary: A compact binary format that browsers run beside JavaScript, so code compiled from Rust, C++ or Go can run in a page.
  - id: atlas.device-apis
    title: Device API access
    summary: Web, cross-platform and native code differ in which device capabilities they reach, such as Bluetooth, NFC, background work and push, and a missing one is a hard constraint.
  - id: atlas.decision-framework
    title: Platform decision framework
    summary: Routes are scored 1 to 5 against weighted criteria such as team, reach, device APIs and cost, with the weights written down before the scoring.
  - id: atlas.distribution
    title: Reach and distribution
    summary: The web reaches anyone with a link, and app stores add discovery, trust and payments against review delays, fees, an install step and slow updates.
  - id: atlas.service-workers
    title: Service workers
    summary: A script that runs apart from any page, intercepts the network requests of its scope, and can answer them from a cache.
    confusableWith: [scale.web-workers]
  - id: atlas.offline-strategies
    title: Offline caching strategies
    summary: Cache-first, network-first and stale-while-revalidate each decide differently whether a request is answered from the cache or the network.
  - id: atlas.installability
    title: Installability and the web app manifest
    summary: A manifest with a name, icons and a display mode, served over HTTPS, lets the browser install the site as an app.
  - id: atlas.ios-pwa-limits
    title: PWA limits on iOS
    summary: On iOS install is a manual Add to Home Screen step, a site's saved data can be deleted, and push works only for web apps on the Home Screen.
  - id: atlas.react-native
    title: React Native and Expo
    summary: React components drive the phone's own native views, and Expo builds the app and sends over-the-air updates that can change JavaScript but never native code.
    confusableWith: [atlas.flutter, atlas.webview-shells]
  - id: atlas.flutter
    title: Flutter
    summary: Flutter draws every pixel with its own engine from Dart code, so the UI looks the same on each platform and uses no native views.
    confusableWith: [atlas.react-native]
  - id: atlas.kotlin-multiplatform
    title: Kotlin Multiplatform
    summary: Business rules written once in Kotlin compile for Android, iOS and other targets, and the screens stay native on each.
  - id: atlas.webview-shells
    title: Web-view shells, Capacitor and Tauri
    summary: A web app runs inside the system web view with a bridge to native features, on phones with Capacitor and on desktop and phones with Tauri.
    confusableWith: [atlas.react-native, atlas.electron]
  - id: atlas.app-secrets
    title: Secrets and shipped apps
    summary: Anyone can unpack an app and read its strings, and old versions stay installed for months, so a model API key lives on your server and the app calls the server.
  - id: atlas.declarative-native-ui
    title: SwiftUI and Jetpack Compose
    summary: Both build the screen from state and redraw what depends on a changed value, as React does.
  - id: atlas.code-signing
    title: Code signing
    summary: A build is signed with a private key tied to the developer's account, phones install only builds that verify, and every update must carry the same signature.
  - id: atlas.store-release
    title: Store review and release trains
    summary: Store review and slow installs make each release expensive, so teams ship on a schedule with phased roll-outs, keep the server working for old versions, and compare versions as numbers.
  - id: atlas.electron
    title: Electron
    summary: A desktop app that ships Chromium and Node, with a main process that can touch the system and web pages that reach it only through functions a preload script exposes.
    confusableWith: [atlas.webview-shells]
