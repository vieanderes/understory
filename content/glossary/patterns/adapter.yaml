term: adapter
aka:
  - adapter pattern
short: A thin layer translating between the shape your code expects and the shape another system offers.
explain: |
  A payment provider's API speaks its own language: its field names, its error codes, its
  idea of money in pence. Your code wants `charge(amount)` and a clear error. An adapter sits
  between them and translates both ways.

  It keeps a third party's quirks in one file. When the provider changes its API, or you
  switch providers, only the adapter changes.
analogy: A travel plug. The socket and the plug both stay as they are; the small thing in between makes them fit.
usage: Keep the provider's error codes in the adapter, so nothing else knows they exist.
related:
  - ports-and-adapters
  - dependency-injection
  - coupling
level: 2
