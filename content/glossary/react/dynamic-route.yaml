term: dynamic route
aka: [dynamic segment, "[slug]", catch-all route]
short: A URL pattern with a placeholder, so one page file serves many addresses such as every product.
explain: |
  A shop with a thousand products can't have a thousand page files. It needs one page that
  reads which product you asked for from the address.

  In Next.js a folder named in square brackets, such as `[id]`, matches any value in that
  part of the path. The page receives the value in `params`, which is a promise in current
  versions, so you `await` it. `[...slug]` matches several parts at once. Treat the value
  as untrusted input: anyone can type any address.
analogy: A form letter with a blank for the name. One letter, printed for everyone, each with their own name filled in.
example:
  language: tsx
  code: |
    // app/products/[id]/page.tsx
    export default async function Product({ params }: { params: Promise<{ id: string }> }) {
      const { id } = await params;
      const product = await getProduct(id);
      if (!product) notFound();
      return <h1>{product.name}</h1>;
    }
usage: The dynamic route should call notFound when the id doesn't exist, not crash with a 500.
related: [file-based-routing, path-parameter, static-generation]
level: 2
lessons: [next.app-router]
