term: fencing token
aka: [fencing tokens]
short: A number that rises with each lock grant, so stale holders can have their writes refused.
explain: |
  A lease can expire while its holder is paused and still believes it holds it. Two workers
  then both think they own the job, and both write.

  So each grant carries a number one higher than the last. Every write sends its number, and
  the protected store remembers the highest it has seen. A write with a lower number comes
  from a holder that has been replaced, and the store refuses it. The safety lives in the
  store, not in the worker's belief.
analogy: Numbered tickets at a deli counter. If you're holding 41 and the screen says 42, the server won't take your order.
example:
  language: sql
  code: |
    UPDATE reports SET body = $1, token = $2
    WHERE id = $3 AND token < $2;
usage: The stale worker overwrote the report after its lease expired; we need a fencing token on that write.
related: [lease, race-condition, lost-update]
level: 3
lessons: [scale.overselling, scale.cron]
