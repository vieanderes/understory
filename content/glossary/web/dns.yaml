term: DNS
aka:
  - Domain Name System
  - name lookup
short: The internet's directory that turns a site's name into the numeric address of a server.
explain: |
  Computers find each other by numbers, like `203.0.113.7`. People remember names, like
  `shop.example`. Before a browser can connect, something has to translate one into the
  other.

  The browser asks a **resolver**. It works its way down a tree of servers until the **authoritative** one for that domain answers. Answers come with a TTL, how long they
  may be cached. That's why a changed record can take minutes or hours to reach everyone.
analogy: Your phone's contacts. You tap a name; the phone dials the number you'd never remember.
example:
  language: bash
  code: |
    $ dig +short shop.example A
    203.0.113.7
    $ dig +short shop.example AAAA
    2001:db8::7
usage: Lower the TTL a day before the move, or DNS will keep sending people to the old server.
related:
