deepDive: >-
  An index doesn't always win. If a condition matches a large share of the table, reading it
  straight through is cheaper than jumping about, and the planner picks `Seq Scan` on purpose.
  The lab's row slider shows where that line falls.


  A **partial index** holds only some rows: `CREATE INDEX ON orders (placed_at) WHERE status =
  'pending'` stays tiny when most orders are done. A **covering index** adds columns with
  `INCLUDE`, so a query can be answered from the index alone.


  On a busy production table, plain `CREATE INDEX` blocks writes until it finishes.
  `CREATE INDEX CONCURRENTLY` doesn't, at the cost of taking longer. The migrations lesson
  uses it.


  Postgres has other index types for other shapes of data: GIN for full-text search and JSON,
  GiST for ranges and maps. The `pgvector` extension adds HNSW indexes, which find the nearest
  embeddings for AI search in the same way a B-tree finds an email.
