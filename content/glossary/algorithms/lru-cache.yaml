term: LRU cache
aka: [least recently used cache, LRU, LRU eviction]
short: A fixed-size store that, when full, throws out whichever entry was used longest ago.
explain: |
  A cache can't grow forever. When it's full, something has to go. A good guess is the
  entry nobody has touched for the longest, since it's least likely to be wanted soon.

  Both reads and writes must be O(1). The classic build pairs two parts. A hash map finds an entry, and a doubly linked
  list keeps entries in order of use.

  In JavaScript a `Map` remembers insertion order, so it does both jobs. On each read,
  delete the key and set it again to move it to the end. The first key is then the
  oldest, ready to evict.
analogy: A small bookshelf by your bed. When a new book comes in, the one you haven't opened for longest goes back to the loft.
example:
  language: js
  code: |
    class LRU {
      constructor(limit) { this.limit = limit; this.map = new Map(); }
      get(key) {
        const value = this.map.get(key);
        if (value !== undefined) { this.map.delete(key); this.map.set(key, value); } // now newest
        return value;
      }
      set(key, value) {
        this.map.delete(key); this.map.set(key, value);
        if (this.map.size > this.limit) this.map.delete(this.map.keys().next().value); // oldest
      }
    }
usage: Build the LRU cache on a Map; deleting and re-setting a key moves it to the back in O(1).
related: [cache, hash-map, linked-list, cache-invalidation]
level: 2
