term: this keyword
aka:
  - this binding
short: A hidden value inside a function that points at the object the function was called on.
explain: |
  In `cart.count()`, `this` inside `count` is `cart`. It isn't fixed when you write the
  function. It's decided each time, by how the function is called.

  That's the trap. Pass `cart.count` to a click handler and it's called on its own, with no
  object in front, so `this` is `undefined`. Fix it with `bind`, or use an arrow function,
  which has no `this` of its own and borrows the one around it.
analogy: The word "here" in a text message. It means wherever the sender is right then, not where the phone was made.
example:
  language: js
  code: |
    const cart = {
      items: 2,
      count() {
        return this.items;
      },
    };
    cart.count(); // 2
    const count = cart.count;
    count(); // TypeError: this is undefined
usage: The this binding is lost once the method becomes a callback, so bind it or wrap it in an arrow.
related:
  - prototype
  - callback
  - closure
level: 2
lessons:
  - js.functions-and-this
