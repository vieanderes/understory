term: file-based routing
aka: [ file routing, App Router ]
short: Turning the folders of a project into the addresses of a site, one folder per URL part.
explain: |
  A site needs a list that says which address shows which page. You can write that list by
  hand, or let the folders be the list. Make `app/blog/page.tsx` and `/blog` exists.

  In Next.js each folder under `app` is one part of the path. Only a folder with a `page.tsx`
  becomes a page you can visit. Other files beside it, such as a helper component, stay
  private. A folder in square brackets matches any value in that spot.
analogy: A filing cabinet where the drawer labels are the street address. Open the drawer marked blog and the page is inside.
example:
  language: text
  code: |
    app/page.tsx              ->  /
    app/blog/page.tsx         ->  /blog
    app/blog/[slug]/page.tsx  ->  /blog/any-post
    app/blog/card.tsx         ->  not a page
usage: With file-based routing, adding a settings page is one new folder and a page.tsx inside it.
related: [ layout-file, dynamic-route, client-side-navigation, url ]
level: 1
lessons: [ next.app-router ]
