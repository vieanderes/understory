term: stack trace
aka: [backtrace]
short: The list printed with an error that shows every function still running when it broke.
explain: |
  When an error stops the program, JavaScript prints where it was. There's one `at` line per
  function still running, newest first. `todo.js:6:15` means line 6, character 15.

  The top line is where it broke, but often not where the mistake is. A bad value can be
  made in one function and passed along quietly. Walk down to the first line in your own
  file, then back to where the value came from.
analogy: A trail of breadcrumbs. It shows the path you took to reach the spot where you got lost.
example:
  language: text
  code: |
    TypeError: Cannot read properties of undefined (reading 'title')
        at formatTask (todo.js:6:15)
        at lastTask (todo.js:10:10)
        at renderList (todo.js:13:26)
usage: Paste the full stack trace into the ticket, not only the last line.
twin:
  term: call-stack
  difference: A stack trace is a snapshot printed when something breaks. The call stack is the live pile it was copied from, which changes with every call and return.
related: [call-stack, runtime-error, traceback, debugger]
level: 1
lessons: [basics.debugging, js.errors]
