term: responsible disclosure
aka: [coordinated disclosure, coordinated vulnerability disclosure, bug bounty, security.txt]
short: Reporting a security flaw privately to its owner and agreeing a date before going public.
explain: |
  You find a hole in someone's app. Posting it publicly helps attackers before users are
  safe. Saying nothing leaves it open. The middle path is to tell the owner first.

  Look for `/.well-known/security.txt` or a bug bounty programme. Send the minimum evidence,
  never real users' data, and agree a date for publishing. Remember the legal line: testing
  is lawful only on systems you own or have written permission to test.
analogy: Telling a neighbour their back door is open, quietly and to them, rather than posting it on the street noticeboard.
example:
  language: text
  code: |
    Contact: mailto:security@example.com
    Expires: 2027-01-01T00:00:00Z
    Policy: https://example.com/security-policy
usage: Publish a security.txt and a responsible disclosure policy, so researchers know where to send what they find.
related: [threat-model, privilege-escalation]
level: 2
lessons: [security.attacker-playbook]
