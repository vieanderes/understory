id: testing.first-test
title: Your first test
objective: "Write a test with `test` and `expect`, read what the runner prints, and make sure the test can fail."
level: essential
minutes: 10
concepts: [testing.automated-tests, testing.assertions, testing.test-naming, testing.tests-that-cannot-fail]
prerequisites: [js.modules, tooling.quality-gates]
opening:
  text: >-
    You'll write code that checks your code, and run it in under a second. Every challenge
    you've passed here was marked by tests like these, and now you write them.

steps:
  - type: prose
    id: what-a-test-is
    body: |-
      Say you've written `total(prices)`. You could call it, print the answer and read it.
      Then do that again after every change, for ever.

      An **automated test** does the checking for you. It's a few lines of code that call
      your function with a known input and compare the answer:

      ```js
      test('an empty basket costs nothing', () => {
        expect(total([])).toBe(0);
      });
      ```

      `test` takes a name and a function. If the answer is wrong, the test **fails** and
      shows its name.

  - type: multiple-choice
    id: pick-what-broke
    concept: testing.test-naming
    difficulty: 1
    question: 'A run prints `× a free item adds nothing to the total`. Which behaviour broke?'
    choices:
      - text: Adding an item that costs 0
        correct: true
        feedback: >-
          Right. A good name reads as a sentence about what broke.
      - text: Adding two items together
        feedback: >-
          The name doesn't mention two items. It's about a free one.
      - text: Totalling an empty basket
        feedback: >-
          That would be its own test, with its own name. This one is about a free item.

  - type: prose
    id: expect-and-matchers
    body: |-
      Look inside the test. `expect(total([]))` holds the value your code gave back.
      `.toBe(0)` is a **matcher**: it compares that value with the one you expected.
      Together they make an assertion, a check that must hold.

      `toBe` suits numbers, text, `true` and `false`. Arrays and objects need `toEqual`,
      which compares what's inside them.

  - type: predict-output
    id: predict-tobe-array
    concept: testing.assertions
    difficulty: 2
    language: js
    code: |
      test('sorts the prices, cheapest first', () => {
        expect(sortPrices([400, 250])).toBe([250, 400]);
      });
    question: '`sortPrices` works and returns `[250, 400]`. Does the test pass?'
    choices:
      - text: No, `toBe` wants the very same array
        correct: true
        feedback: >-
          Yes. Two arrays with the same items are still two arrays. Use `toEqual`.
      - text: Yes, the items and their order match
        feedback: >-
          Most people pick this. But `toBe` asks "same array?", and these are two arrays.
      - text: No, the order is wrong
        feedback: >-
          The order is right. The matcher is the problem: `toBe` compares identity.

  - type: prose
    id: the-runner
    body: |-
      A **test runner** finds your tests, runs them all and reports each one. In JavaScript
      a popular runner is Vitest. Tests live in files ending `.test.js`, and `npx vitest`
      runs them. When one fails, you see its name, what you expected and what came back:

      ```text
       ❯ cart.test.js (2 tests | 1 failed)
         × three items add up

      AssertionError: expected 755 to be 750 // Object.is equality
      ```

  - type: fill-blank
    id: fill-first-test
    concept: testing.assertions
    difficulty: 2
    language: js
    prompt: Finish the test file. Two mugs at 400 cost 800.
    template: |
      import { test, expect } from 'vitest';
      import { total } from './cart.js';

      {{1}}('two mugs cost 800', () => {
        {{2}}(total([400, 400])).{{3}}(800);
      });
    blanks:
      - key: '1'
        answer: test
      - key: '2'
        answer: expect
      - key: '3'
        answer: toBe
    bank: [test, run, expect, assert, toBe, equals]

  - type: prose
    id: see-it-fail
    body: >-
      A test that has never failed might not be checking anything. So when a new test goes
      green, break the code on purpose. Change `sum + price` to `sum - price` and run it.


      Red? Good: the test can catch that mistake. Undo the change. If it stayed green, the
      test was never really looking.

  - type: bug-hunt
    id: hunt-cant-fail
    concept: testing.tests-that-cannot-fail
    difficulty: 2
    language: js
    code: |
      test('an empty basket costs nothing', () => {
        expect(total([])).toBe(0);
      });

      test('three items add up', () => {
        const prices = [250, 100, 400];
        expect(total(prices)).toBe(total(prices));
      });
    prompt: >-
      One of these tests passes whatever `total` does, even if it returns nonsense. Tap its
      assertion.
    lines: [7]
    reasons:
      - text: It compares `total` with itself
        correct: true
        feedback: >-
          Yes. Wrong or right, both sides match. Write the answer out: `750`.
      - text: The empty basket isn't a real case
        feedback: >-
          It's a real one, and a common crash. That test is fine: it expects a fixed `0`.
      - text: '`toBe` can''t compare numbers'
        feedback: >-
          It can. The trouble is where the expected value comes from: the code under test.
    fix: |
      test('three items add up', () => {
        expect(total([250, 100, 400])).toBe(750);
      });
    verify:
      question: How would you prove the fixed test can fail?
      choices:
        - text: Make `total` return `0` and watch it go red
          correct: true
          feedback: Yes. A test you've seen fail is checking something real.
        - text: Run the suite and see it pass
          feedback: The broken test passed too. Green alone can't show a test would ever fail.
        - text: Add a third test for one item
          feedback: More cases are welcome, but they say nothing about whether this one can fail.

  - type: code-challenge
    id: write-basket-tests
    concept: testing.automated-tests
    difficulty: 3
    language: ts
    editable: '7-13'
    prompt: >-
      `total` is done. Write its two tests. Here each test is a function, so we can run it
      again: fill in `testEmptyBasket` and `testThreeItems`, one `expect` each.


      We'll run your tests on the real `total`, where both must pass. Then on three broken
      copies, and each copy must fail at least one of them.
    hints:
      - Each test calls `total` with a basket you choose and states the exact answer.
      - Work the answer out yourself. Never ask `total` what it should be.
      - 'The first one is `expect(total([])).toBe(0);`'

  - type: explain-back
    id: explain-why-automate
    concept: testing.automated-tests
    difficulty: 2
    audience: non-technical
    kind: explain
    prompt: >-
      Your manager doesn't code. They ask why you spend time writing tests when you could
      check the basket total by hand. Explain it without jargon.
    rubric:
      - A test checks the answer again by itself after every change, so nobody has to remember to look.
      - It writes down the right answer, so a wrong result raises an alarm instead of slipping past.
      - Its name says which thing broke, so the fix starts in the right place.
    modelAnswer: >-
      Checking by hand works once, while someone is looking. A test writes down the right
      answer, like "three items cost £7.50". Then the computer checks it after every change,
      for free, for as long as the code lives. If a change breaks the total, the alarm goes
      off straight away, and it says which check failed. Nobody has to remember to look.

recap:
  - Write a test with `test`, `expect` and a matcher, and name it as a sentence.
  - Read the runner's report of expected against received.
  - Break the code once to prove a new test can fail.

recall:
  - id: card-assertion-parts
    concept: testing.assertions
    front: In `expect(total([])).toBe(0)`, what does each part do?
    back: >-
      `expect` holds the value the code returned. `toBe(0)` is the matcher that compares it
      with the value you expected.
  - id: card-tobe-toequal
    concept: testing.assertions
    front: When do you use `toEqual` instead of `toBe`?
    back: >-
      For arrays and objects. `toEqual` compares what's inside, and `toBe` asks for the very
      same object.
  - id: card-see-it-fail
    concept: testing.tests-that-cannot-fail
    front: Why break the code on purpose after a new test passes?
    back: >-
      To see the test go red. A test you've never seen fail might not be checking anything.
  - id: card-test-name
    concept: testing.test-naming
    front: What should a test's name say?
    back: >-
      The behaviour and the condition, as a sentence. A failure then reads as what broke.

