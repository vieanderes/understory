id: interview.ai-assisted
title: AI-assisted rounds
objective: "Use an assistant in an interview the way reviewers reward: plan first, let it clarify, look up syntax, suggest tests and review, and own every line."
level: essential
minutes: 10
concepts: [interview.plan-before-prompting, interview.model-chat, interview.prompt-shape, interview.verifying-ai-output]
prerequisites: [interview.bug-fix-round]
opening:
  text: >-
    You'll work with an assistant in an interview the way reviewers score highest. The
    trick is that you drive, and the assistant only helps you check.

steps:
  - type: prose
    id: what-is-scored
    body: |-
      An **AI-assisted round** puts an assistant in your editor. One platform names
      three skills it scores:

      - **computational thinking**: you plan the solution yourself;
      - **prompt writing**: your questions are clear and checkable;
      - **AI proofreading**: you catch what it gets wrong.

      Reviewers read your whole chat. "Solve this for me" is the one prompt that fails
      outright.

  - type: prose
    id: model-chat
    body: |-
      A strong chat has four kinds of prompt, in this order:

      - **Clarify**: a question the task doesn't answer. "Can A be empty?"
      - **Syntax**: a fact you'd look up. "Does `sort()` change the array?"
      - **Tests**: "Suggest inputs that might break my solution."
      - **Review**: "List problems in my code. Don't rewrite it."

      About five prompts in all. The assistant never writes the solution.

  - type: bug-hunt
    id: review-transcript
    concept: interview.model-chat
    difficulty: 1
    language: text
    code: |
      you: Can A contain 0? Should [0, 0] return 0?
      you: Can the same number appear several times?
      you: In TypeScript, how do I build a Set from an array?
      you: Suggest 5 inputs my tests miss. Don't rewrite my code.
      you: It fails, fix it.
    prompt: >-
      The task: return the largest K where both K and -K are in the array. The reviewer
      reads this chat. Tap the prompt that costs you.
    lines: [5]
    reasons:
      - text: It hands the bug over without naming it
        correct: true
        feedback: >-
          Yes. Say what fails and on which input. Then the fix is yours.
      - text: Asking about 0 shows you misread the task
        feedback: >-
          It's the opposite. You found an edge case before coding, and that's scored.
      - text: A syntax question looks like weak TypeScript
        feedback: >-
          Checking one fact is what careful engineers do. It's the vague last line that hurts.
    fix: |
      you: [2, 2, -2] returns 0, expected 2. Do duplicates break my Set check?

  - type: prose
    id: prompt-shape
    body: |-
      Tests and Review prompts are bigger asks. Give them five parts: **Job**, **Why**,
      **Context**, **Constraints** and **Done**. Here's a Tests prompt:

      ```text
      Job: List edge cases for my function.
      Why: Hidden tests decide my score.
      Context: solution(A) returns the largest K > 0 with K and -K in A.
      Constraints: Don't write or change the solution.
      Done: 8 cases, each with input and expected output.
      ```

      The Constraints line keeps the assistant out of your code.

  - type: parsons
    id: order-prompt-shape
    concept: interview.prompt-shape
    difficulty: 2
    language: text
    prompt: >-
      Put this Review prompt in the order of the shape: Job, Why, Context, Constraints, Done.
    blocks:
      - id: job
        code: Review my largest-K solution for bugs.
      - id: why
        code: I'm least sure about duplicates and zero.
      - id: context
        code: It builds a Set of A, then checks each positive x for -x.
      - id: constraints
        code: Don't rewrite it. Point to lines.
      - id: done
        code: List each problem with its line and a failing input.
    distractors:
      - id: write-it
        code: Then write the fixed version for me.
        feedback: >-
          That asks for the solution. A reviewer reads it as outsourcing.

  - type: multiple-choice
    id: pick-short-or-shaped
    concept: interview.prompt-shape
    difficulty: 2
    question: Which ask deserves the full five-part shape?
    choices:
      - text: A hint to speed up your O(n²) solution
        correct: true
        feedback: >-
          Right. It's a bigger ask. Its constraint is "hint only, no code".
      - text: Can the array be empty?
        feedback: >-
          A one-line fact stays one line. Labels on it read as robotic.
      - text: Does `sort()` change the array?
        feedback: >-
          It's a syntax check, so ask it as written. And yes, it sorts in place.
      - text: Is `Array.prototype.at` available here?
        feedback: >-
          A version check needs no labels. Ask it plainly and move on.

  - type: fill-blank
    id: write-review-prompt
    concept: interview.prompt-shape
    difficulty: 2
    prompt: Finish the Review prompt so the assistant checks your code and leaves it yours.
    language: text
    template: |
      Job: Review my merge function.
      Why: A booking inside a longer one is the case I'm least sure of.
      Context: It sorts a copy by start, then stretches the last block.
      Constraints: Don't {{1}} it. Point to lines.
      Done: Each problem with its line and an input that {{2}}.
    blanks:
      - key: '1'
        answer: rewrite
      - key: '2'
        answer: fails
    bank: [rewrite, run, test, fails, passes, compiles]

  - type: ai-review
    id: review-tie-break
    concept: interview.verifying-ai-output
    difficulty: 3
    language: js
    request: Return the most used tag. On a tie, return the one used first.
    flawClass: logic
    code: |
      function mostUsed(tags) {
        const counts = new Map();
        for (const tag of tags) {
          counts.set(tag, (counts.get(tag) ?? 0) + 1);
        }
        let best = null;
        let bestCount = 0;
        for (const [tag, count] of counts) {
          if (count >= bestCount) {
            best = tag;
            bestCount = count;
          }
        }
        return best;
      }
    prompt: >-
      The round hands you this assistant code. It passed the example, which had no tie.
      Your tie test fails: `mostUsed(["bug", "ui", "ui", "bug"])` returns `"ui"`. Tap the
      line at fault.
    lines: [9]
    reasons:
      - text: '`>=` lets a later tie replace the earlier tag'
        correct: true
        feedback: >-
          Yes. A Map keeps first-use order. Change it to `>` by hand, then rerun.
      - text: A Map doesn't keep insertion order
        feedback: >-
          It does, and that's why a strict `>` is all the fix needs.
      - text: '`bestCount` should start at `-1`'
        feedback: >-
          Every count is at least 1, so starting at 0 is fine. The comparison is the problem.
    fix: |
      function mostUsed(tags) {
        const counts = new Map();
        for (const tag of tags) {
          counts.set(tag, (counts.get(tag) ?? 0) + 1);
        }
        let best = null;
        let bestCount = 0;
        for (const [tag, count] of counts) {
          if (count > bestCount) {
            best = tag;
            bestCount = count;
          }
        }
        return best;
      }

  - type: code-challenge
    id: fix-merge-bookings
    concept: interview.verifying-ai-output
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: merge.starter.py
      solution: merge.solution.py
      tests: merge.tests.py
    prompt: >-
      The task: `mergeBookings(bookings)` takes room bookings as `[start, end]` in minutes
      since midnight. Return the busy blocks, sorted by start. Bookings that overlap **or
      touch** join into one block, and the caller's array stays unchanged.


      The starter is an assistant's version. It's wrong about the task, not the language.
      It passes the example,
      where `[[540, 600], [570, 660], [720, 780]]` gives `[[540, 660], [720, 780]]`. The
      hidden tests don't pass. Write the cases the example leaves out, then fix it.
    hints:
      - Try `[[600, 660], [660, 720]]`, then `[[480, 1020], [540, 600]]`. What should each give?
      - The statement says touching bookings join. One comparison misreads that.
      - Use `<=` to join a touching booking, and keep `Math.max` of the two ends.

  - type: explain-back
    id: explain-plan-first
    concept: interview.plan-before-prompting
    difficulty: 4
    prompt: >-
      The reviewer reads your chat. Why does planning aloud and writing tests before you
      prompt protect your score?
    rubric:
      - Your plan and tests set the standard, so a wrong answer shows up against them.
      - The edge cases you named are where a plausible answer breaks.
      - The chat then shows clarifying, testing and reviewing, never outsourcing, so the work is yours.
    modelAnswer: >-
      If I say my approach and edge cases first, I have a standard any code must meet.
      Plausible code usually handles the example and misses the tie, the empty input or the
      large tier. My tests fail on exactly those, so I catch it. And the chat shows me
      clarifying, looking up syntax, asking for test ideas and a review. The reviewer sees
      the solution is mine.

recap:
  - Plan aloud and write your tests before the first prompt.
  - Use the assistant to clarify, look up syntax, suggest tests and review.
  - Give bigger asks the shape Job, Why, Context, Constraints, Done.
recall:
  - id: card-wrong-task
    concept: interview.verifying-ai-output
    front: Generated code runs and its explanation sounds sure. What do you still check?
    back: >-
      That it does what the statement asks: the tie-break, the units, every rule. Check it
      against your own test cases.
  - id: card-plan-first
    concept: interview.plan-before-prompting
    front: What do you do before your first prompt in an AI-assisted round?
    back: >-
      Restate the task, say your approach and edge cases aloud, and write the test cases.
  - id: card-one-character
    concept: interview.verifying-ai-output
    front: Code you were handed has a one-character bug. How do you fix it?
    back: >-
      By hand, saying why, then rerun the tests. It shows you understand the code.
  - id: card-plausible-wrong
    concept: interview.verifying-ai-output
    front: Where does an assistant's plausible answer usually break?
    back: >-
      On the cases the example leaves out: ties, touching or nested ranges, empty input and
      large inputs.
  - id: card-prompt-shape
    concept: interview.prompt-shape
    front: What five parts does a Tests or Review prompt have?
    back: >-
      Job, Why, Context, Constraints and Done. Short factual questions stay one line.

references:
  - kind: essay
    title: "Meta's AI-Enabled Coding Interview: How to Prepare"
    authors: Hello Interview
    url: https://www.hellointerview.com/blog/meta-ai-enabled-coding
    note: The three-phase format, the file tree, and how the round is scored.
    verified: true
  - kind: essay
    title: Yes, You Can Use AI in Our Interviews. In fact, we insist
    authors: Simon Newton
    year: 2025
    venue: Canva Engineering Blog
    url: https://www.canva.dev/blog/engineering/yes-you-can-use-ai-in-our-interviews/
    note: Why one company expects assistants in interviews, and what it grades.
    verified: true
  - kind: docs
    title: Prompt engineering overview
    authors: Anthropic
    url: https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview
    note: Be clear and direct, give context and say why, and state what a finished answer looks like.
    verified: false
  - kind: docs
    title: "Guidance on Candidates' AI Usage"
    authors: Anthropic
    url: https://www.anthropic.com/candidate-ai-guidance
    note: An example of a company stating where AI is and isn't allowed in its process.
    verified: true

deepDive: >-
  Formats differ, and so does what the assistant may do. On a typical assessment platform the
  built-in AI assistant sits beside the editor. The employer reads the whole transcript, to
  see whether you asked reasonable questions or tried to get a complete solution. That is
  why this lesson's chat only clarifies, looks up syntax, suggests tests and reviews.


  Since late 2025, Meta's AI-enabled round runs 60 minutes in a live coding interview tool. It has a file
  tree and a chat that can read the files but not edit them. One multi-file problem runs in three
  phases: fix a bug, build a core feature, then optimise for tiered large inputs. Canva
  expects candidates to use an assistant and grades whether you catch and fix problems in
  generated code. Shopify lets candidates bring their own tools, and interviewers watch
  whether you fix a one-character bug by hand.


  Some companies forbid AI in interviews and take-homes unless told otherwise. When the
  round allows it, treat the transcript as part of your submission. Short, specific
  prompts that name inputs, outputs and edge cases read as engineering. A string of
  "still broken, try again" reads as hands-off.


  The code in this lesson was run on Node 24: the tie-break returns `"ui"`, and the
  assistant's merge splits `[600, 660]` and `[660, 720]` and shortens `[480, 1020]` to 600 when
  `[540, 600]` sits inside it.
