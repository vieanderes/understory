term: total compensation
aka:
  - total comp
  - TC
  - compensation package
short: Everything a job pays in a year added together, salary, bonus, equity and sign-on.
explain: |
  Two offers with the same salary can be worth very different amounts. One has a bonus and
  shares, the other doesn't. So compare the whole package, per year.

  Put each part on a yearly basis. Count base, the bonus you'd expect, and a quarter of a four-year
  share grant. Spread any sign-on over the time it covers. Keep certain money apart from money
  that depends on results or a future sale.

  Then look past the number. The level, the team and the work shape the next five years more than one year's pay.
analogy: Comparing two phone contracts by the yearly total, not by the monthly price on the poster.
usage: On total compensation the second offer wins, but it's mostly unvested equity, so it's closer than it looks.
twin:
  term: vesting
  difference: Total compensation adds up everything a year of work pays. Vesting is the schedule that decides when the equity part actually becomes yours.
related:
  - vesting
  - levelling
level: 2
