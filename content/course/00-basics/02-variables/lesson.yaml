    primary: true
    verified: true

deepDive: >-
  Already comfortable? One subtlety: `const` stops the name from pointing at a new value. It
  doesn't freeze the value itself. A `const` list can still get new items added. You'll see
  that in the lesson on lists.


  You may also meet `var` in older code. It's the original way to make variables, with
  looser rules about where a name can be seen. Modern code uses `let` and `const`.
