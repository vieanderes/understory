term: native form validation
aka: [constraint validation, HTML form validation]
short: Checks the browser runs on form fields before sending, driven by attributes such as required and type.
explain: |
  An empty email box, or "abc" in a number field, should never reach the server. Add
  `required`, `type="email"` or `min="1"`, and the browser checks before it sends. It stops
  the form and shows a message by the field.

  It's free, and it works without JavaScript. It isn't security, though, because anyone can
  send a request without your form. Always check again on the server.
analogy: The steward at the gate who checks you have a ticket. Handy, but the venue still checks the seats inside.
example:
  language: html
  code: |
    <form>
      <input name="email" type="email" required>
      <input name="guests" type="number" min="1" max="8">
      <button>Book</button>
    </form>
usage: Native form validation catches the empty field, but the API still has to reject it.
related: [html-form, html-attribute, form-label]
level: 2
lessons: [html.forms]
