term: stable sort
aka: [sort stability, stable sorting]
short: A sort that keeps items with equal keys in the order they started in.
explain: |
  Sort a leaderboard by score and two players are tied on 90. Which comes first? A sort
  with this property leaves them as they were before sorting.

  That lets you sort by several keys in turns. Sort by name, then by score, and players
  with equal scores stay in name order. JavaScript's `Array.prototype.sort` and Python's
  `sorted` both promise it.

  Quicksort usually doesn't; merge sort does. When an output contract names a tie-break, put it in the comparator. Don't rely on the
  order you happened to start with.
analogy: A queue at a bakery sorted by ticket number. People who drew the same number stay in the order they arrived.
example:
  language: js
  code: |
    const players = [
      { name: 'Ana', score: 90 },
      { name: 'Ben', score: 75 },
      { name: 'Cal', score: 90 },
    ];
    players.sort((a, b) => b.score - a.score);
    // Ana, Cal, Ben: the two 90s keep their original order
usage: It's a stable sort, so sort by name first and then by score, and ties come out alphabetical.
related: [comparator, merge-sort, quicksort, lexicographic-order]
level: 2
lessons: [cs.searching-and-sorting, interview.reading-the-task, python.functions-as-values]
