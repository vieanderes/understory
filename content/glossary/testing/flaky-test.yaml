term: flaky test
aka: [flaky, flake, flakiness]
short: A test that sometimes passes and sometimes fails on the same code, with nothing changed.
explain: |
  It fails on CI, you press re-run, it passes. Nothing changed. That's worse than a test
  that always fails, because the team learns to ignore red builds, and then misses a real
  bug.

  The causes are usually timing, order or shared state: a fixed `sleep`, a test that
  depends on the one before, a real clock or network, data another test left behind.
  Quarantine it with a ticket, then fix the cause. Re-running until green hides it.
analogy: A smoke alarm that goes off at random. After a week, nobody leaves the building when it rings.
usage: The checkout spec is a flaky test; it waits 500 ms for the toast instead of waiting for it to appear.
twin:
  term: regression
  difference: A flaky test fails now and then with no change to the code. A regression fails every time, since a specific change broke something that used to work.
related: [end-to-end-test, regression, fixture]
level: 1
lessons: [testing.e2e-playwright]
