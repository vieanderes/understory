term: queue
aka: [job queue, message queue, task queue]
short: A waiting line of jobs that background workers take in turn, so the sender needn't wait.
explain: |
  Sending a welcome email or resizing a photo can take seconds. Making the user's request
  wait for it is slow, and a failure loses the job. So the request writes a job into a
  line and returns at once; a worker picks it up.

  Most of them deliver **at least once**: if a worker crashes before confirming, the job
  comes back and runs again. So handlers must be idempotent. Jobs that keep failing go to a
  dead-letter queue instead of looping forever.
analogy: The ticket rail in a restaurant kitchen. The waiter clips the order up and goes back to the tables; the next free cook takes it.
example:
  language: ts
  code: |
    // in the request: record the job and return
    await jobs.add('send-receipt', { orderId });

    // in the worker, somewhere else
    worker.process('send-receipt', async ({ orderId }) => {
      await sendReceipt(orderId); // may run twice
    });
usage: Move the PDF export onto a queue; the request times out after 30 seconds and the work is lost.
twin:
  term: message-broker
  difference: A queue is the line of waiting jobs. A message broker is the server that holds queues or logs and moves messages between many apps.
related: [dead-letter-queue, message-broker, idempotent, backpressure]
level: 1
lessons: [scale.queues-and-workers]
