term: PCI DSS
aka: [PCI compliance, card data security standard, PCI]
short: The card industry's security rules for any business that stores, handles or transmits card numbers.
explain: |
  Card numbers are worth stealing, so the card networks set rules for anyone who touches
  them. A business that handles card numbers on its own servers faces hundreds of checks:
  network rules, encryption, access logs, yearly audits.

  Most small teams avoid nearly all of it by never touching a card number. A hosted payment
  page or the provider's embedded fields collect the card, and your server only ever sees a
  token. Your duty shrinks to a short self-assessment. Logging a raw request body from the
  payment form can undo that in one line.
analogy: Letting the bank's own cashier count the cash, so you never have to own a vault.
usage: Use the hosted checkout so card numbers never touch our servers and PCI DSS stays a short questionnaire.
related: [strong-customer-authentication, secret, encryption, webhook]
