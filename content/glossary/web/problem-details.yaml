term: problem details
aka:
  - RFC 9457
  - application/problem+json
  - error format
short: A standard JSON shape for API errors, with a type, a title, a status and a detail.
explain: |
  Every API needs to say what went wrong. If each endpoint invents its own error shape,
  every client needs special code for each one.

  This standard gives one shape. It has `type`, `title`, `status` and `detail`, and you
  may add your own fields, such as which input failed. It's sent with the content type
  `application/problem+json`.

  Keep internals out of it. A stack trace or a SQL message in `detail` helps an attacker
  more than a user.
analogy: A standard accident report form. Every insurer can read it, whoever fills it in.
example:
  language: json
  code: |
    {
      "type": "https://example.com/errors/invalid-input",
      "title": "Invalid input",
      "status": 400,
      "detail": "limit must be between 1 and 100"
    }
usage: Return problem details from every handler, so the client has one error path.
related:
  - status-code
  - rest
  - api
level: 2
lessons:
  - interview.backend-round
