id: design
number: 8
title: Accessibility and design systems
summary: Interfaces that every visitor can use, built from tokens and components. Test each screen by keyboard, by checker and by ear.
why: "An interface that some people cannot operate is a broken interface."
youCanBuild: "An accessible form, a themed component library with variants, and a dialog that handles focus."
concepts:
  - id: design.assistive-technology
    title: Assistive technology
    summary: Software or hardware that helps someone use a device, such as a screen reader, which reads the accessibility tree aloud.
  - id: design.accessible-name
    title: Accessible name
    summary: The text a screen reader announces for a control. It comes from the control's text or label, or from `aria-label` when there is no text.
    confusableWith: [design.roles-and-states]
  - id: design.roles-and-states
    title: Roles and states
    summary: A role says what a control is, such as a button, and a state says how it is now, such as pressed or expanded.
    confusableWith: [design.accessible-name]
  - id: design.keyboard-access
    title: Keyboard access
    summary: Everything a mouse can do, the keyboard can do too. Buttons, links and fields take focus and answer keys, and a `div` does neither.
  - id: design.focus-order
    title: Focus order
    summary: Tab moves through the focusable elements in source order, so the source order must match the order people see.
    confusableWith: [design.focus-management]
  - id: design.focus-visible
    title: A visible focus ring
    summary: "A keyboard user needs to see where focus is. `:focus-visible` styles the ring for keyboard use, and `outline: none` takes it away."
  - id: design.wcag
    title: WCAG
    summary: The Web Content Accessibility Guidelines, a W3C list of testable rules. Most laws and contracts ask for level AA.
  - id: design.contrast
    title: Colour contrast
    summary: How far apart two colours are in lightness, as a ratio. Body text needs at least 4.5 to 1, and large text and controls 3 to 1.
  - id: design.colour-alone
    title: Never colour alone
    summary: Colour can support a message but never carry it alone, so an error or a link also has text, an icon or an underline.
  - id: design.reduced-motion
    title: Reduced motion
    summary: "`prefers-reduced-motion: reduce` reports that someone asked for less movement, and the page answers by removing or replacing the motion."
  - id: design.tokens
    title: Design tokens
    summary: A design token is a named design decision, such as a colour or a spacing step, stored once and used everywhere.
  - id: design.colour-roles
    title: Colour roles
    summary: A role token names what a colour is for, such as surface or accent, and points at a raw palette colour.
  - id: design.type-and-spacing-scale
    title: Type scale and spacing grid
    summary: A short list of text sizes and a spacing unit, such as 8 px, so every measurement comes from a few related values.
  - id: design.theming
    title: Theming
    summary: A theme gives the role tokens new values, so every component changes look without changing its code.
  - id: design.colour-scheme
    title: prefers-color-scheme and dark mode
    summary: A media query that reports whether someone prefers light or dark, which a theme answers by swapping role token values.
  - id: design.native-semantics
    title: Building on native elements
    summary: A component that renders the matching native element, such as `button`, gets its keys, focus and role for free.
  - id: design.variants
    title: Variants
    summary: A variant is a named option of a component, such as size or intent, from a short fixed list, each with a fixed set of styles.
  - id: design.constrained-props
    title: Props that cannot be misused
    summary: A component whose props accept only a closed set of typed options makes a wrong value a compile error.
  - id: design.utility-classes
    title: Utility classes
    summary: A utility class sets one declaration, and a design is composed by listing classes in the markup, as Tailwind does.
  - id: design.tailwind-theme
    title: The Tailwind theme
    summary: Tailwind's theme variables are design tokens. Each one generates matching classes, and square brackets step outside it.
  - id: design.component-extraction
    title: Extracting a component
    summary: A group of utility classes that repeats becomes one component, which keeps the markup and its classes in one place.
  - id: design.native-widgets
    title: Native widgets first
    summary: "`details`, `dialog`, `select` and `popover` give keys, focus and states for free, so reach for them before building a widget by hand."
  - id: design.focus-management
    title: Focus management
    summary: When a modal dialog opens, focus moves into it, the page behind can't be reached, and focus returns to the trigger when it closes.
    confusableWith: [design.focus-order]
  - id: design.aria-patterns
    title: ARIA widget patterns
    summary: The ARIA Authoring Practices describe the roles, states and keys people expect from widgets such as tabs, menus and comboboxes.
  - id: design.form-labels
    title: Labels and hints
    summary: Every field has a visible label that stays, and a hint linked with `aria-describedby`. A placeholder is not a label.
  - id: design.error-messages
    title: Form error messages
    summary: An error says what is wrong and how to fix it, sits by its field, and is linked to it so a screen reader announces it.
  - id: design.field-groups
    title: Grouping fields
    summary: A `fieldset` with a `legend` groups related fields, such as radio buttons, and gives the group a name.
  - id: design.locale-formatting
    title: Locale-aware formatting
    summary: The `Intl` objects format dates, numbers and money for a locale, so code never builds those strings by hand.
  - id: design.pluralisation
    title: Pluralisation
    summary: Languages have different plural forms, so a message picks its form with `Intl.PluralRules` instead of adding an s.
  - id: design.rtl
    title: Language and direction
    summary: The `lang` attribute tells a screen reader how to pronounce text, and `dir="rtl"` turns the reading direction round.
