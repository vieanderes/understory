summary: >-
  Counting replaces comparing. Instead of sorting a list or checking every pair, you walk it
  once and keep a tally: an array indexed by value when the values are small whole numbers,
  a `Map` from value to count for anything else. Questions about duplicates, missing values,
  permutations, anagrams and the most common item then take O(n) time.


  The leader, or majority value, is the item in more than half the positions. A count map
  finds it in O(n) time and O(n) memory. The Boyer-Moore voting algorithm finds it in O(1)
  memory by pairing off different values: the leader outnumbers everything else combined, so
  it is the one left standing. Because something is always left standing, the candidate must
  be counted again before you trust it.


  The signals are phrases like "each integer from 1 to N", "missing", "appears twice",
  "permutation", "anagram", "most frequent", "more than half", "dominator" and "equi leader".
  A value range in the constraints such as `[1..N]` or `[0..100]` tells you an array of counts
  fits; a range like `[−2,147,483,648..2,147,483,647]` tells you it does not and a map is the
  tool.
remember:
  - Values in a small known range are counted with an array indexed by value, anything else with a `Map`.
  - With n numbers, the smallest missing positive is at most n + 1, so only 1 to n + 1 need a slot.
  - The leader is a value in strictly more than half the items, so a list has at most one.
  - Boyer-Moore voting keeps one candidate and a count, cancelling different values, and is O(n) time and O(1) space.
  - The voting pass always leaves a candidate, so a second pass must count it before returning it.
  - A value that leads both halves of a split must lead the whole list, so find the overall leader first.
  - A "set every counter to the maximum" event is made O(1) with a lazy floor applied when a counter is next touched.
  - Count with `counts.set(key, (counts.get(key) ?? 0) + 1)`, and sort numbers with `(a, b) => a - b`.
sections:
  - title: The counting template
    body: |-
      Two shapes cover nearly every counting task. A `Map` works for any value, including
      strings and huge numbers. An array is faster and smaller when values are whole numbers
      in a known range, and it lets you walk the values in order afterwards.

      ```js
      function countBy(items, keyOf = (item) => item) {
        const counts = new Map();
        for (const item of items) {
          const key = keyOf(item);
          counts.set(key, (counts.get(key) ?? 0) + 1);
        }
        return counts;
      }

      function mostFrequent(items) {
        let best;
        let bestCount = 0;
        for (const [value, count] of countBy(items)) {
          if (count > bestCount) {
            best = value;
            bestCount = count;
          }
        }
        return best; // on a tie, the value seen first wins
      }

      // Values from 0 to maxValue: O(n + k) time, no comparisons at all.
      function countingSort(values, maxValue) {
        const counts = new Array(maxValue + 1).fill(0);
        for (const value of values) counts[value]++;
        const sorted = [];
        for (let value = 0; value <= maxValue; value++) {
          for (let c = 0; c < counts[value]; c++) sorted.push(value);
        }
        return sorted;
      }

      console.log(countBy(['tea', 'cake', 'tea']).get('tea')); // 2
      console.log(mostFrequent(['b', 'a', 'b'])); // 'b'
      console.log(countingSort([3, 0, 5, 3, 1], 5)); // [0, 1, 3, 3, 5]
      console.log(mostFrequent([])); // undefined
      ```

      `countBy` is O(n) time and O(d) space for d distinct keys. The optional `keyOf` makes
      it group anagrams too: count by the sorted letters of each word. A `Map` beats a plain
      object here because its keys keep their type, so `1` and `'1'` stay apart, and there
      are no inherited keys such as `constructor`.
  - title: 'Classic problem: raising every counter at once'
    body: |-
      The deep dive sketches the lazy floor. This is the full solution, because the details
      decide whether it passes. There are n counters starting at 0. Operation `x` from 1 to n
      increases counter `x`. Operation `n + 1` sets every counter to the current maximum.

      ```js
      function maxCounters(n, operations) {
        const counters = new Array(n).fill(0);
        let floor = 0; // every counter is at least this
        let top = 0; // the true maximum so far
        for (const op of operations) {
          if (op === n + 1) {
            floor = top;
            continue;
          }
          const i = op - 1;
          counters[i] = Math.max(counters[i], floor) + 1;
          top = Math.max(top, counters[i]);
        }
        return counters.map((count) => Math.max(count, floor));
      }

      console.log(maxCounters(5, [3, 4, 4, 6, 1, 4, 4])); // [3, 2, 2, 4, 2]
      console.log(maxCounters(1, [2, 2, 1])); // [1]
      console.log(maxCounters(3, [])); // [0, 0, 0]
      ```

      O(n + m) time for m operations, O(n) space. Two things break the naive version. Filling
      the array on every max event makes it O(n × m). And tracking `top` by scanning the
      counters is also O(n) per event. Keeping `top` as a running value, updated on every
      increase, fixes both.
  - title: 'Classic problem: counting equal-leader splits'
    body: |-
      Split a list into a non-empty left and right part. How many split points leave both
      parts with the same leader? The key argument: if a value has more than half of each
      part, it has more than half of the whole. So only the overall leader can qualify.

      ```js
      function equiLeaders(values) {
        let candidate;
        let count = 0;
        for (const value of values) {
          if (count === 0) candidate = value;
          count += value === candidate ? 1 : -1;
        }
        let total = 0;
        for (const value of values) if (value === candidate) total++;
        if (total * 2 <= values.length) return 0;

        let splits = 0;
        let left = 0;
        for (let i = 0; i < values.length - 1; i++) {
          if (values[i] === candidate) left++;
          const leftSize = i + 1;
          const rightSize = values.length - leftSize;
          if (left * 2 > leftSize && (total - left) * 2 > rightSize) splits++;
        }
        return splits;
      }

      console.log(equiLeaders([4, 3, 4, 4, 4, 2])); // 2
      console.log(equiLeaders([1, 2])); // 0
      console.log(equiLeaders([7])); // 0
      ```

      O(n) time, O(1) space. The brute force counts the leader of both parts at each of n − 1
      splits, O(n²). Comparing with `left * 2 > leftSize` keeps everything in whole numbers
      and avoids rounding questions about "half".
  - title: 'Follow-up: the missing number in O(1) extra space'
    body: |-
      The lesson's counting array uses O(n) extra memory. A common follow-up asks for O(1).
      The trick is to use the array itself as the tally: put every value `v` from 1 to n at
      index `v − 1` by swapping, then the first index that does not hold its own number is
      the gap.

      ```js
      function firstMissingPositive(nums) {
        const a = [...nums]; // leave the caller's array alone
        const n = a.length;
        for (let i = 0; i < n; i++) {
          // Keep swapping until slot i holds a value that is placed or cannot be placed.
          while (a[i] >= 1 && a[i] <= n && a[a[i] - 1] !== a[i]) {
            const j = a[i] - 1;
            [a[i], a[j]] = [a[j], a[i]];
          }
        }
        for (let i = 0; i < n; i++) if (a[i] !== i + 1) return i + 1;
        return n + 1;
      }

      console.log(firstMissingPositive([3, 1, 6, 4, 1, 2])); // 5
      console.log(firstMissingPositive([-1, -3])); // 1
      console.log(firstMissingPositive([1, 2, 3])); // 4
      console.log(firstMissingPositive([])); // 1
      ```

      O(n) time: each swap puts one value in its final place, so there are at most n swaps in
      total. The copy above costs O(n) memory; in the real follow-up you say the in-place
      version mutates the input, and ask whether that is allowed. The check
      `a[a[i] - 1] !== a[i]` is what stops duplicates looping forever.
  - title: Explaining the voting algorithm aloud
    body: |-
      Interviewers like Boyer-Moore because the code is six lines and the proof is the whole
      point. Say it as a story about pairs: "Every time I see a value different from the
      candidate, I cancel one of each. A cancel removes at most one copy of the leader and at
      least one other value. The leader has more copies than everything else combined, so
      the others run out first and the leader survives."

      Then say why the second pass exists before being asked: "Without a leader, something
      still survives, for example `[1, 2, 3]` leaves 3. So I count the candidate and return
      it only if `count * 2 > n`."

      The route from brute force is worth a sentence too: counting each value's occurrences
      is O(n²), sorting and reading the middle is O(n log n) and works because a leader must
      sit at index `Math.floor(n / 2)`, a map is O(n) time and O(n) space, voting is O(n)
      time and O(1) space. Offer the map first if memory is not a concern, since it is
      clearer to review. Test with an empty list, a value at exactly half, the leader at the
      start, and the leader only at the end.
  - title: 'Practice task: the frog and the river'
    body: |-
      A well-known training syllabus has four counting tasks. MaxCounters and MissingInteger are the two
      classics above and in the lesson. PermCheck, "does the list hold each of 1 to n
      exactly once?", is a counting array with a length check. The fourth is
      **FrogRiverOne**.

      Leaves fall on a river, one per second: `A[K]` is where the leaf lands at second K.
      The frog crosses when every position from 1 to X is covered. Return the earliest
      second, or -1.

      ```ts
      function frogRiverOne(x: number, leaves: number[]): number {
        const covered = new Set<number>();
        for (const [second, position] of leaves.entries()) {
          covered.add(position);
          // Positions run from 1 to x, so x different ones means the river is covered.
          if (covered.size === x) return second;
        }
        return -1;
      }
      // x = 5, [1, 3, 1, 4, 2, 3, 5, 4] -> 6
      ```

      The trap is checking "is every position covered?" with a loop from 1 to X after each
      leaf. That is O(N × X), and the performance tests time it out. The set's size answers
      the same question in O(1), because a repeat leaf doesn't grow it. A counting array of
      length X + 1 with a running count of new positions works the same way.

pitfalls:
  - "**Returning the candidate unchecked.** The voting pass always leaves a candidate, even in `[1, 2, 3]`. Count it in a second pass and return it only when it has more than half."
  - "**Half is not more than half.** A value in exactly half the items is not a leader. Compare with `count * 2 > n`, which also avoids fractions."
  - "**A counting array for a huge range.** An array sized to the largest value needs gigabytes when ids reach 10⁹. Use a `Map`, or clamp to the range that can matter, like 1 to n + 1."
  - "**Bare `sort()` on numbers.** It compares strings, so `10` sorts before `2`. Pass `(a, b) => a - b`, or better, count instead of sorting."
  - "**Plain objects as counters.** `counts[key]` coerces keys to strings and inherits keys such as `constructor`. A `Map` keeps types and starts empty."
  - "**Resetting all counters in a loop.** A \"set every counter\" event inside a loop over operations is O(n × m). Keep a lazy floor and apply it when a counter is touched and once at the end."
interview:
  - question: Find the majority element in O(1) extra space.
    answer: >-
      I use Boyer-Moore voting, then verify the survivor: O(n) time, O(1) space. I keep a
      candidate and a count. When the count is zero, the current value becomes the
      candidate; a matching value adds one, a different one subtracts one. Each subtraction
      cancels one copy of the candidate against one other value, and since the leader
      outnumbers all other values together, it cannot be cancelled out. The pass always
      leaves some value, even when there is no majority, so a second pass counts it and I
      return it only if `count * 2 > n`. If memory is not constrained I would ship a count
      map instead, because it is clearer and also answers "most frequent" when there is no
      majority.
  - question: When would you use an array for counting instead of a hash map?
    answer: >-
      When the values are whole numbers in a small, known range, such as ratings from 0 to 5
      or positions from 1 to n. Then the value is the index, updates are plain array writes
      with no hashing, memory is one slot per possible value, and walking the array visits
      the values in sorted order for free, which is counting sort. A map is the choice for
      strings, objects, negative numbers or a range far larger than the input, such as ids up
      to 10⁹, where an array would be mostly empty and huge. The trade-off is that an array
      costs O(k) for the range k even when few values appear.
  - question: How would you find every value that appears in more than a third of the items?
    answer: >-
      I extend the voting idea to two candidates and two counts, then verify both, in O(n)
      time and O(1) space. At most two values can each have more than a third. For each item
      I add to the matching candidate, or fill an empty slot, or else decrement both counts,
      which cancels three different values at once. A value with more than a third of the
      items cannot be cancelled out completely, so it ends up as a candidate. The survivors
      may be false, so a second pass counts each and keeps those with `count * 3 > n`. A map
      is the simpler alternative when memory allows.
  - question: What's the smallest positive integer missing from an unsorted array?
    answer: >-
      At most n + 1, which is what makes it linear. With n numbers, only 1 to n + 1 can be the
      answer, so I tick off values in that range in a boolean array of size n + 2 and walk up
      from 1 to the first gap: O(n) time and O(n) space, ignoring negatives, zeros and huge
      values. Sorting first costs O(n log n), and checking 1, 2, 3 with `includes` is O(n²).
      If O(1) extra space is required, I place each value `v` at index `v − 1` by swapping and
      then look for the first index that does not hold its own number, but that mutates the
      input, so I confirm the caller allows it or copy first.
terms:
  - term: Counting array
    say: A hash map with number keys.
    means: An array indexed by value, used when values are small whole numbers in a known range. It
      skips hashing, so it's faster and leaner than a `Map` in that case.
  - term: Leader
    say: The most common value.
    means: A value in *strictly more than half* the positions, so a list has at most one. The most
      common value is often not a leader at all.
  - term: Boyer-Moore voting
    say: It finds the most frequent element.
    means: It keeps one candidate and a count, cancelling pairs of different values, in O(n) time and
      O(1) space. It finds the leader only if one exists, so a second pass must count the candidate.
  - term: Lazy update
    say: Update every counter when asked to.
    means: Record an operation that touches everything, such as raising every counter to a floor, and
      apply it to a counter only when it's next touched and once at the end. The operation becomes
      O(1).
