term: incremental static regeneration
aka: [ISR, incremental regeneration, time-based revalidation]
short: Serving a prebuilt page and rebuilding it in the background after a set time, without a full redeploy.
explain: |
  A prebuilt page is fast but goes stale. Rebuilding the whole site for one changed price is
  slow. Rebuild only that page, now and then, while visitors keep getting the old copy.

  You give the page a lifetime, such as `revalidate = 60`. After it expires, the next
  visitor still gets the old page, and that visit starts a rebuild in the background.
  Visitors after that get the new one. So someone always sees the stale copy once.
analogy: A shop window display that gets redone overnight. Today's shoppers see yesterday's display; tomorrow's see the new one.
example:
  language: tsx
  code: |
    // app/products/page.tsx
    export const revalidate = 60; // seconds

    export default async function Products() {
      return <List items={await getProducts()} />;
    }
usage: With incremental static regeneration at sixty seconds, a price change shows within a minute or two.
related: [static-generation, stale-while-revalidate, cache-tag, cache-invalidation]
