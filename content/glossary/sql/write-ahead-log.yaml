term: write-ahead log
aka: [WAL, redo log]
short: A file where a database records each change before applying it, so a crash can be replayed.
explain: |
  A crash can come halfway through writing a change to the table files. Without a record of
  what was planned, the database can't tell which half got done.

  So Postgres first appends the change to a log and flushes it to disk. Only then does it
  report the commit as done. After a crash, it replays the log to finish or discard each
  change. The same stream feeds replicas and point-in-time recovery.
analogy: A chef writing each order on the ticket rail before cooking. If the power cuts out, the tickets say what was promised.
usage: The commit returns only after the write-ahead log hits disk, which is why a crash didn't lose the payment.
related: [acid, transaction, replication, point-in-time-recovery]
level: 3
lessons: [db.what-a-database-is]
