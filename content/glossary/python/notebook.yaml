term: notebook
aka:
  - .ipynb
  - kernel notebook
short: A document of cells mixing runnable code, its output and written notes, run one cell at a time.
explain: |
  Exploring data means trying something, looking at the result and trying again. A notebook
  keeps each step's code, table or chart and your notes together on one page.

  Its freedom is also its trap. Cells can run in any order, and the kernel remembers
  everything, even cells you've since deleted. A notebook can show a result its own code no
  longer produces.

  Restart and run all before you trust or share one. When the analysis settles, move the
  code into a module with tests, and keep the notebook for the story.
analogy: A lab notebook. Great for working out ideas; not the thing you ship to customers.
usage: The chart in the notebook doesn't match the code any more; restart the kernel and run all.
related:
  - dataframe
level: 2
