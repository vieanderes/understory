term: branch
aka:
  - git branch
  - feature branch
short: A movable name that points at the latest snapshot in one line of work.
explain: |
  You want to try a new feature without breaking the version everyone uses. You need a
  separate line of work that can grow on its own.

  It's not a copy of your files. It's a tiny label holding one commit's hash, and each new
  commit moves the label forward. Switching between them is instant. Keep them
  short-lived: a branch that lives for weeks drifts so far from `main` that merging it
  back becomes its own project.
analogy: A sticky note on a page in a notebook saying "Alex's draft is up to here". Add a page and you move the note.
example:
  language: bash
  code: |
    $ git switch -c add-search
    Switched to a new branch 'add-search'
    $ git branch
    * add-search
      main
usage: Cut a branch from main for the hotfix; don't stack it on your unfinished feature.
twin:
  term: commit
  difference: A branch is a label that moves. A commit is the snapshot it points at, which stays exactly as it was.
related:
  - commit
  - merge
  - trunk-based-development
level: 1
lessons:
  - tooling.git-as-a-graph
