term: iterator
short: An object that remembers its place and returns the next item each time it's asked.
explain: |
  A loop needs something that knows where it is. Which item came last? Is there another?
  That job belongs to a small object with a position.

  Its `__next__` method returns the next value, or raises `StopIteration` when it's done. Its `__iter__` returns itself. Once finished, it stays finished.
  Generators and open files are iterators, which is why a second loop over one silently
  does nothing.
analogy: A bookmark. It knows exactly where you are, and when you reach the last page it has nowhere left to go.
example:
  language: python
  code: |
    it = iter(["a", "b"])
    next(it)   # 'a'
    next(it)   # 'b'
    next(it)   # raises StopIteration
usage: The second loop prints nothing because the iterator was used up by the first one.
twin:
  term: iterable
  difference: An iterator is a one-way cursor that runs out. An iterable is the collection that can hand out new iterators, so it can be looped over again.
