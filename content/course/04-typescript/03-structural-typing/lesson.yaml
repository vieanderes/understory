id: ts.structural-typing
title: Structural typing
objective: Say whether an object fits a type by its shape, and catch a misspelt property.
level: essential
minutes: 10
concepts: [ts.structural-typing, ts.excess-property-checks]
prerequisites: [ts.everyday-types]
opening:
  text: >-
    You'll know why TypeScript accepts one object and rejects another that looks the same.
    That's the difference between catching a typo and shipping it.

steps:
  - type: prose
    id: shape-not-name
    body: |-
      TypeScript checks shapes, not names. A value fits a type when it has every property
      the type asks for. Extra properties are fine:

      ```ts
      type Point = { x: number; y: number };
      function describe(p: Point): string {
        return `${p.x}, ${p.y}`;
      }
      const pin = { x: 3, y: 4, label: "Home" };
      describe(pin); // fine: pin has an x and a y
      ```

      This is **structural typing**. The checker compares properties, never type names.

  - type: predict-output
    id: predict-refund-as-price
    concept: ts.structural-typing
    difficulty: 1
    language: ts
    code: |
      type Price = { pence: number; currency: string };
      type Refund = { pence: number; currency: string; reason: string };
      function format(price: Price): string {
        return `${price.pence / 100} ${price.currency}`;
      }
      const refund: Refund = { pence: 4500, currency: "GBP", reason: "damaged" };
      console.log(format(refund));
    question: '`format` wants a `Price` and gets a `Refund`. What happens?'
    choices:
      - text: It compiles and runs
        correct: true
        feedback: >-
          Right. A `Refund` has everything a `Price` needs, so it fits.
      - text: It fails, because the names differ
        feedback: >-
          Names don't matter here. TypeScript checks which properties a value has.
      - text: It fails, because of the extra `reason`
        feedback: >-
          Extra properties are fine when the value comes from a variable.

  - type: prose
    id: fresh-literals
    body: |-
      There's one exception. An object written straight into a typed spot may only name
      properties the type lists:

      ```text
      Object literal may only specify known properties,
      but 'noe' does not exist in type 'Label'. Did you mean to write 'note'?
      ```

      That's the **excess property check**. It exists to catch typos, since nothing would
      ever read a misspelt property. Store the object in a variable first, and the check
      no longer applies.

  - type: predict-output
    id: predict-typo-literal
    concept: ts.excess-property-checks
    difficulty: 2
    language: ts
    code: |
      type Label = { id: string; pence: number; note?: string };
      function printLabel(label: Label): void {
        console.log(label.id, label.note ?? "no note");
      }
      const draft = { id: "L-1", pence: 4500, noe: "fragile" };
      printLabel(draft);
      printLabel({ id: "L-2", pence: 4500, noe: "fragile" });
    question: Both objects misspell `note`. Which call does the checker reject?
    choices:
      - text: Only line 7
        correct: true
        feedback: >-
          Right. The object written in the call can't name properties `Label` lacks.
      - text: Both lines
        feedback: >-
          `draft` has everything `Label` needs, so it fits by shape. Extras pass.
      - text: Neither
        feedback: >-
          An object written straight into a typed spot gets the extra check, and line 7 fails
          it.

  - type: code-challenge
    id: fix-snooze-typo
    concept: ts.excess-property-checks
    difficulty: 2
    language: ts
    starter: alarm.starter.ts
    solution: alarm.solution.ts
    tests: alarm.tests.ts
    prompt: >-
      `morningAlarm()` should snooze for 5 minutes, until 7:35. It snoozes until 7:39, and
      the checker is silent.


      Annotate `options` as `AlarmOptions`. The checker then points at the typo, the way the
      last step showed. Fix it.
    hints:
      - '`options` is stored in a variable before it''s passed, so the typo check is skipped.'
      - '`const options: AlarmOptions = ...` puts the object straight into a typed spot.'
      - The checker asks whether you meant `snoozeMinutes`. Rename the property to that.

  - type: prose
    id: readonly-is-shallow
    body: |-
      `readonly` before a property stops anyone assigning a new value to it:

      ```ts
      type Playlist = { readonly id: string };
      playlist.id = "P-2";
      // Cannot assign to 'id' because it is a read-only property.
      ```

      It guards that one property, and nothing inside it. A `readonly` list can still gain
      items. For a list nobody may change, write `readonly string[]`.

  - type: bug-hunt
    id: hunt-shallow-readonly
    concept: ts.structural-typing
    difficulty: 3
    language: ts
    code: |
      type Playlist = {
        readonly id: string;
        readonly trackIds: string[];
      };
      function withBonus(list: Playlist): Playlist {
        list.trackIds.push("T-BONUS");
        return list;
      }
      const shared: Playlist = { id: "P-1", trackIds: ["T-1"] };
      withBonus(shared);
      console.log(shared.trackIds); // [ 'T-1', 'T-BONUS' ]
    prompt: >-
      A shared playlist gains a track nobody added, though every property is `readonly`. Tap
      the line of the type that allows it.
    lines: [3]
    reasons:
      - text: '`readonly` stops reassigning, not changing the list'
        correct: true
        feedback: >-
          Right. Type it `readonly string[]` and the `push` stops compiling.
      - text: '`readonly` needs `Object.freeze` beside it'
        feedback: >-
          Those are separate things. `readonly` only exists for the checker, and it's erased.
      - text: '`readonly` is ignored inside a type'
        feedback: >-
          It isn't. Assigning to `shared.id` does fail. The gap is depth, not the keyword.
    fix: |
      type Playlist = {
        readonly id: string;
        readonly trackIds: readonly string[];
      };
      function withBonus(list: Playlist): Playlist {
        return { ...list, trackIds: [...list.trackIds, "T-BONUS"] };
      }

  - type: code-challenge
    id: write-total-minor
    concept: ts.structural-typing
    difficulty: 3
    language: ts
    starter: total.starter.ts
    solution: total.solution.ts
    tests: total.tests.ts
    prompt: >-
      Write `totalPence(items)`. Each item has a `pricePence` and may have a `quantity`.
      Return price times quantity, added up.


      A missing quantity means 1, and 0 means 0. Tickets, meals, anything with the right
      shape counts.


      Example: `totalPence([{ pricePence: 4500 }, { pricePence: 500, quantity: 3 }])` is
      `6000`.
    hints:
      - '`quantity?: number` means the value you read is `number | undefined`.'
      - >-
        `item.quantity || 1` turns 0 into 1, because 0 is falsy. `??` only replaces
        `undefined`.
      - Loop with `for...of` and add `item.pricePence * (item.quantity ?? 1)`.

  - type: explain-back
    id: explain-literal-versus-variable
    concept: ts.excess-property-checks
    difficulty: 3
    prompt: >-
      Why does passing a variable with a misspelt property compile, while the same object
      written in the call does not?
    rubric:
      - Fitting a type is about shape, and extra properties don't stop a value fitting.
      - The excess property check is a separate rule for objects written straight into a typed spot.
      - Stored in a variable first, the object skips that rule, so the typo slips through.
    modelAnswer: >-
      Both objects have the properties the type asks for, so both fit by shape. An object
      written in the call gets one extra check. It forbids properties the type never lists,
      so the typo is caught. The variable got its own inferred type first, so the check
      doesn't apply. Annotating the variable brings it back.

recap:
  - Say whether a value fits a type by looking at its properties.
  - Annotate an object so the checker catches a misspelt property.
  - Spot a `readonly` that only goes one level deep.

recall:
  - id: card-assignable-by-shape
    concept: ts.structural-typing
    front: When does a value fit where a type is expected?
    back: >-
      When it has every property the type asks for, with matching types. Names play no part,
      and extras are allowed.
  - id: card-fresh-literal
    concept: ts.excess-property-checks
    front: Which objects get the excess property check?
    back: >-
      Objects written straight into a typed spot. Store one in an unannotated variable first
      and the check is skipped.
  - id: card-annotate-options
    concept: ts.excess-property-checks
    front: An options object lives in a variable. How do you get typo checks on it?
    back: >-
      Annotate the variable, like `const options: AlarmOptions = { ... }`.
  - id: card-shallow-readonly
    concept: ts.structural-typing
    front: '`readonly items: string[]`. Can code still add an item?'
    back: >-
      Yes. `readonly` stops reassigning `items`, not `push`. Write `readonly string[]` to stop
      both.

references:
  - kind: docs
    title: Type Compatibility
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/docs/handbook/type-compatibility.html
    note: How structural checking works, including the loose check on method parameters.
    primary: true
    verified: true
  - kind: docs
    title: Object Types
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/docs/handbook/2/objects.html
    note: Optional properties, `readonly` and excess property checks.
    primary: true
    verified: true

deepDive: >-
  Two type names for plain strings are the same type, so an order id happily passes where a
  user id belongs. The usual answer is a brand: an extra property that exists only in the type,
  so the shapes differ and a plain string no longer fits.


  `exactOptionalPropertyTypes` tightens optional properties, so `note?: string` stops accepting
  an explicit `undefined`. It isn't part of `strict`, and turning it on finds real bugs in code
  that passes `undefined` around.


  Methods are checked more loosely than other properties. A method written as
  `onScan(item: Item): void` accepts a handler that only handles a narrower kind of item, which
  can crash at run time. Written as `onScan: (item: Item) => void`, it gets the strict check. The
  looseness is there for history: arrays and browser event handlers rely on it.
