term: time complexity
aka: [running time, runtime complexity]
short: How the number of steps a piece of code takes grows as its input grows.
explain: |
  Count how often the innermost step runs, as a function of the input size n. A single
  loop over the list runs n times. A loop inside a loop runs n times n.

  That count, written in Big O, is the time cost. It decides whether a solution passes a
  hidden performance test. Ten thousand items is fine for O(n²); a million is not.

  The trap is calls that look like one step but loop inside. `includes`, `indexOf`,
  `shift` and string building all walk the data.
analogy: Checking every guest's name against the list at the door. Twice the guests, twice the checks.
example:
  language: python
  code: |
    def has_duplicate(items):
        for i in range(len(items)):          # n times
            for j in range(i + 1, len(items)):  # up to n times each
                if items[i] == items[j]:
                    return True
        return False
    # n * n steps: O(n²) time
usage: What's the time complexity if we sort first? O(n log n), then one pass to find neighbours.
twin:
  term: space-complexity
  difference: Time complexity counts the steps the code takes. Space complexity counts the extra memory it needs while it runs. You often trade one for the other.
related: [big-o, space-complexity, hidden-quadratic, amortised-cost]
level: 1
