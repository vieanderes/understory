approach: >-
  Parse the registry once into a map from tool name to its mode and a map of parameter
  types. For each call, split it into the name, the approved flag and a map of arguments.
  Then run the checks in the order of the verdict list and return the first that applies:
  unknown tool, unknown key, missing parameter, bad value, unapproved write, ok.
complexity: O(total length of R and C) time and space
steps:
  - kind: read
    title: Read the verdict list as code
    minutes: 2
    body: |-
      The numbered list is the structure of your solution: one check per line, in that
      order, and the first that applies wins.

      Then read the `int` rule twice. "One or more digits, optionally after a single minus
      sign" rules out `+3`, `1.5`, `-` and `1e3`.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      One comment with the order of the checks.
    code:
      ts: |-
        // Per call: unknown-tool, unknown-arg, missing-arg, bad-type, needs-approval, else ok; first match wins.
      python: |-
        # Per call: unknown-tool, unknown-arg, missing-arg, bad-type, needs-approval, else ok; first match wins.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - a tool with no parameters, called with and without an argument;
      - a call with several problems at once;
      - int look-alikes;
      - `approved` at the start of the arguments.
    input:
      - "([\"ping read\"], [\"ping\", \"ping x=1\"])"
      - "([\"refund write order:int notify:bool\"], [\"refund order=x extra=1\", \"refund order=x\"])"
      - "([\"page read n:int\"], [\"page n=007\", \"page n=+3\", \"page n=-\", \"page n=1e3\"])"
      - "([\"send write to:text\"], [\"send approved to=team\"])"
  - kind: ask-ai
    title: Ask for the int pattern, a syntax question
    minutes: 1
    body: |-
      A regular expression is the shortest way to test an int, and it is fair to ask for
      the pattern. Ask for both languages and for a whole-string match.
    prompt: >-
      One line each: a regular expression that matches a whole string of one or more digits
      with an optional leading minus, and how to test a whole-string match with it in
      TypeScript and in Python.
    expect: >-
      /^-?[0-9]+$/.test(value) in TypeScript, and re.fullmatch(r'-?[0-9]+', value) in
      Python.
  - kind: write
    title: Write the solution yourself
    minutes: 6
    body: |-
      Parse the registry first, then one block per call with the checks in order. Split an
      argument at its first `=` only.
    code:
      ts: |-
        // Per call: unknown-tool, unknown-arg, missing-arg, bad-type, needs-approval, else ok; first match wins.
        function solution(R: string[], C: string[]): string[] {
          type Tool = { write: boolean; params: Map<string, string> };
          const tools = new Map<string, Tool>();
          for (const entry of R) {
            const [name, mode, ...params] = entry.split(' ');
            const types = new Map<string, string>();
            for (const param of params) {
              const [key, type] = param.split(':');
              types.set(key!, type!);
            }
            tools.set(name!, { write: mode === 'write', params: types });
          }
          const valid: Record<string, (value: string) => boolean> = {
            int: (value) => /^-?[0-9]+$/.test(value),
            bool: (value) => value === 'true' || value === 'false',
            text: () => true,
          };
          return C.map((call) => {
            const [name, ...rest] = call.split(' ');
            const tool = tools.get(name!);
            if (tool === undefined) return 'unknown-tool';
            let approved = false;
            const args = new Map<string, string>();
            for (const token of rest) {
              if (token === 'approved') approved = true;
              else {
                const at = token.indexOf('=');
                args.set(token.slice(0, at), token.slice(at + 1));
              }
            }
            // The checks run in the order of the verdict list, so the first that applies wins.
            if ([...args.keys()].some((key) => !tool.params.has(key))) return 'unknown-arg';
            if ([...tool.params.keys()].some((key) => !args.has(key))) return 'missing-arg';
            for (const [key, type] of tool.params) {
              if (!valid[type]!(args.get(key)!)) return 'bad-type';
            }
            if (tool.write && !approved) return 'needs-approval';
            return 'ok';
          });
        }
      python: |-
        # Per call: unknown-tool, unknown-arg, missing-arg, bad-type, needs-approval, else ok; first match wins.
        import re


        def solution(R, C):
            tools = {}
            for entry in R:
                parts = entry.split(' ')
                params = {}
                for param in parts[2:]:
                    key, kind = param.split(':')
                    params[key] = kind
                tools[parts[0]] = (parts[1] == 'write', params)

            def valid(kind, value):
                if kind == 'int':
                    return re.fullmatch(r'-?[0-9]+', value) is not None
                if kind == 'bool':
                    return value in ('true', 'false')
                return True

            verdicts = []
            for call in C:
                parts = call.split(' ')
                if parts[0] not in tools:
                    verdicts.append('unknown-tool')
                    continue
                write, params = tools[parts[0]]
                approved = False
                args = {}
                for token in parts[1:]:
                    if token == 'approved':
                        approved = True
                    else:
                        key, value = token.split('=', 1)
                        args[key] = value
                # The checks run in the order of the verdict list, so the first that applies wins.
                if any(key not in params for key in args):
                    verdicts.append('unknown-arg')
                elif any(key not in args for key in params):
                    verdicts.append('missing-arg')
                elif any(not valid(kind, args[key]) for key, kind in params.items()):
                    verdicts.append('bad-type')
                elif write and not approved:
                    verdicts.append('needs-approval')
                else:
                    verdicts.append('ok')
            return verdicts
    codeMode: full
  - kind: run
    title: Run the example and your cases
    minutes: 1
    body: |-
      Press **Run code**. The example must say OK. Check each verdict of your cases against
      the list.
    expect: >-
      OK on the example, then ["ok", "unknown-arg"], ["unknown-arg", "missing-arg"],
      ["ok", "bad-type", "bad-type", "bad-type"] and ["ok"].
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution for the order of the verdicts, the int rule and where the
      approved word can appear. List any problems in one line each. Do not rewrite the
      code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
