summary: >-
  Graph search is how you answer questions about things joined by links: rooms and doors,
  cells on a map, users and friendships, pages and links. Two searches cover nearly every
  coding-round version. Breadth-first search (BFS) explores in rings from the start, so it
  finds the fewest steps. Depth-first search (DFS) follows one path to its end before trying
  another, which suits "is it reachable", "how many groups" and "explore everything".


  The signals are in the wording. "Fewest moves", "shortest path", "minimum number of steps"
  or "how many minutes until everything is reached" want BFS. "How many islands", "how many
  connected groups", "can you get from A to B" and "fill this region" suit either search, and
  DFS is usually the shorter code. A grid, a maze, a board or a list of pairs such as
  `[a, b]` meaning "a is linked to b" is a graph in disguise.


  Both searches cost O(V + E): every node is visited once and every link is looked at once,
  or twice for undirected links. On a grid that is O(rows × columns). The two things that
  make them correct and fast are the same in every version: a `seen` set, so no node is
  processed twice, and a real queue or stack with constant-time operations.


  BFS is only a shortest-path algorithm when every step costs the same. With weighted
  edges, such as road lengths, you need Dijkstra's algorithm, which swaps the queue for a
  heap.
remember:
  - BFS finds the fewest steps in an unweighted graph because its queue hands out nodes in order of distance.
  - Mark a node as seen when you add it to the queue or stack, not when you take it out, or it gets queued many times.
  - Both BFS and DFS cost O(V + E) time and O(V) memory, which is O(rows × columns) on a grid.
  - A grid cell's neighbours come from adding the four steps to its row and column and skipping cells off the edge, blocked or seen.
  - Count connected components by starting a search from every node that is not yet seen and adding one each time.
  - Multi-source BFS puts every start in the queue at distance 0, which gives each node its distance to the nearest start in one pass.
  - Keep a parent map during BFS to rebuild the path itself, not only its length.
  - In JavaScript use a head index instead of `shift()` and a `Set` instead of `includes`, and prefer an explicit stack to deep recursion.
sections:
  - title: The BFS template, with the path rebuilt
    body: |-
      Most graph questions give you links as a list of pairs or as an object from each node
      to its neighbours. This template works on the second shape and returns the path
      itself. The `parent` map does two jobs: it is the `seen` set, and it records how each
      node was first reached, so walking it backwards from the goal rebuilds a shortest
      route.

      ```js
      // O(V + E) time, O(V) memory.
      function shortestPath(graph, start, goal) {
        const parent = new Map([[start, null]]);
        const queue = [start];
        for (let head = 0; head < queue.length; head++) {
          const node = queue[head];
          if (node === goal) {
            const path = [];
            for (let at = goal; at !== null; at = parent.get(at)) path.push(at);
            return path.reverse();
          }
          for (const next of graph[node] ?? []) {
            if (parent.has(next)) continue;
            parent.set(next, node);
            queue.push(next);
          }
        }
        return null;
      }

      const rooms = {
        hall: ['kitchen', 'stairs'],
        kitchen: ['hall', 'garden'],
        stairs: ['hall', 'attic'],
        garden: ['kitchen', 'attic'],
        attic: ['stairs', 'garden'],
      };
      console.log(shortestPath(rooms, 'hall', 'attic')); // ['hall', 'stairs', 'attic']
      console.log(shortestPath(rooms, 'hall', 'hall')); // ['hall']
      console.log(shortestPath(rooms, 'hall', 'cellar')); // null
      ```

      The queue is a plain array read through `head`. Nothing is ever removed, so each
      read is O(1), and the array grows to at most V items. If you only need the distance,
      store it in a `Map` in place of the parent, or process the queue one ring at a time
      and count the rings.
  - title: Connected components from a list of links
    body: |-
      "There are n computers and a list of cables; how many separate networks are there?"
      is the same question as counting islands, with the neighbours given as pairs. Build an
      adjacency list first, then start a DFS from every node not yet seen.

      ```js
      // O(n + e) time and memory for n nodes and e links.
      function countComponents(n, links) {
        const graph = Array.from({ length: n }, () => []);
        for (const [a, b] of links) {
          graph[a].push(b);
          graph[b].push(a); // undirected: add both directions
        }
        const seen = new Uint8Array(n);
        let components = 0;
        for (let startNode = 0; startNode < n; startNode++) {
          if (seen[startNode]) continue;
          components++;
          seen[startNode] = 1;
          const stack = [startNode];
          while (stack.length > 0) {
            const node = stack.pop();
            for (const next of graph[node]) {
              if (seen[next]) continue;
              seen[next] = 1;
              stack.push(next);
            }
          }
        }
        return components;
      }

      console.log(countComponents(5, [[0, 1], [1, 2], [3, 4]])); // 2
      console.log(countComponents(3, [])); // 3
      console.log(countComponents(0, [])); // 0
      console.log(countComponents(4, [[0, 1], [1, 0], [2, 2]])); // 3
      ```

      Nodes with no links are components of their own, which is why the outer loop runs over
      every node and not only over the ends of links. A `Uint8Array` of flags is a compact
      `seen` set when nodes are numbered 0 to n minus 1. When the links arrive one at a time
      and you must answer "are these two connected yet?" after each, union-find from the
      dependencies lesson is the better tool.
  - title: Multi-source BFS on a grid
    body: |-
      "Each cell shows the distance to the nearest charging point" or "how many minutes until
      the whole grid is reached" looks as if it needs one BFS per start. It needs one BFS in
      total: put every start in the queue at distance 0. The rings then grow from all starts
      at once, and each cell is first reached from its nearest one.

      ```js
      // O(rows × cols) time and memory, however many chargers there are.
      function distanceToCharger(grid) {
        const rows = grid.length;
        const cols = rows === 0 ? 0 : grid[0].length;
        const dist = Array.from({ length: rows }, () => new Array(cols).fill(-1));
        const queue = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r][c] === 'C') {
              dist[r][c] = 0;
              queue.push([r, c]);
            }
          }
        }
        const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (let head = 0; head < queue.length; head++) {
          const [r, c] = queue[head];
          for (const [dr, dc] of steps) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            if (grid[nr][nc] === '#' || dist[nr][nc] !== -1) continue;
            dist[nr][nc] = dist[r][c] + 1;
            queue.push([nr, nc]);
          }
        }
        return dist;
      }

      console.log(distanceToCharger(['C..', '.#.', '..C'])); // [[0, 1, 2], [1, -1, 1], [2, 1, 0]]
      console.log(distanceToCharger(['.#C'])); // [[-1, -1, 0]]
      console.log(distanceToCharger([])); // []
      ```

      The `dist` table doubles as the `seen` set: `-1` means not reached yet, and it stays
      `-1` for walls and for cells no charger can reach. For "minutes until everything is
      reached", return the largest distance, or `-1` if any open cell stayed unreached.
  - title: Edge cases and choosing between BFS and DFS
    body: |-
      The cases that break graph code are few and predictable. Test each one:

      - The start is the goal: the answer is 0 steps, or a path of one node.
      - The goal cannot be reached: return the agreed sentinel, often `-1` or `null`.
      - An empty grid, or a grid of one cell.
      - A start cell that is itself blocked.
      - Links that repeat, or a node linked to itself: the `seen` check absorbs both.
      - The largest input, all open: this catches `shift()`, `includes` and recursion depth.

      Choosing the search is a short conversation with yourself. If the question asks for a
      minimum number of equal-cost steps, it is BFS, full stop. If it asks whether something
      is reachable, how many groups there are, or the size of each group, either works, and
      an iterative DFS with an array as a stack is the least code. If it asks you to explore
      every path, not every node, such as listing all routes, that is backtracking: DFS
      without a global `seen` set, which is exponential and only fits small inputs.

      Mutating the grid to mark visited cells, for example overwriting `X` with `.`, saves
      memory, but some tests check the input is unchanged, and strings in JavaScript cannot
      be changed in place anyway. A separate `seen` structure is the safe default.
  - title: Explaining a graph solution aloud
    body: |-
      Interviewers want to hear you name the graph before you search it. A clear run through
      for the warehouse robot sounds like this:

      1. "I'll treat each open cell as a node, with up to four neighbours. Shelves aren't
         nodes."
      2. "The question wants the fewest moves and every move costs the same, so BFS: the
         first time I reach `E` is by a shortest route."
      3. "The brute force would be DFS over every path, keeping the shortest. That's
         exponential, because paths overlap. BFS visits each cell once instead."
      4. "I'll keep a `seen` set and add to it when I queue a cell, so nothing is queued
         twice. The queue holds row, column and distance."
      5. "Cost: each cell enters the queue once and checks four neighbours, so O(rows ×
         columns) time and memory."
      6. "Tests: start next to the exit, exit walled in, a one-cell grid, and a full-size
         open grid for speed."

      If asked "why not DFS?", the answer is that DFS finds some path, not the shortest,
      unless it explores every path, which costs far more.
pitfalls:
  - "**Marking seen when popping.** The same cell gets queued once per neighbour that reaches it, which can blow up memory and time. Mark it at the moment you push it."
  - "**Using `shift()` on a big queue.** Each call can move every remaining item. Read the queue with a head index, or use `collections.deque` in Python."
  - "**A `seen` array checked with `includes`.** Each check scans the whole list, so the search becomes quadratic. Use a `Set`, a flag array, or a number key such as `row * cols + col`."
  - "**String keys without a separator.** `` `${r}${c}` `` makes cell (1, 12) and cell (11, 2) the same key. Write `` `${r},${c}` `` or a number key."
  - "**Recursive DFS on a large region.** Node's default stack holds about ten thousand simple frames, so a 300 by 300 island overflows it. Use an explicit stack."
  - "**Forgetting isolated nodes.** Looping only over the ends of links misses nodes with no links at all. Loop over every node when counting components."
  - "**Using BFS on weighted edges.** BFS counts links, not their cost. With different costs use Dijkstra's algorithm, a heap in place of the queue."
interview:
  - question: Why does BFS give the shortest path, and when doesn't it?
    answer: >-
      BFS gives the shortest path because it visits nodes in order of their distance from the
      start, as long as every edge costs the same. The queue is first in, first out, so every
      node at distance d is processed before any at distance d plus 1. The first time the
      goal comes off the queue, no shorter route can still be waiting. That breaks when edges
      have different weights: a route with three short roads can beat one long road, but BFS
      reports the one-road route because it has fewer links. Then I'd use Dijkstra's
      algorithm, which orders by total cost with a heap, at O((V + E) log V). With weights of
      only 0 and 1, a double-ended queue gives the same result in linear time.
  - question: How would you count the number of islands, and what does it cost?
    answer: >-
      I scan every cell, and each land cell I haven't seen starts a new island, which I count
      and then flood with a search that marks all its connected land. Every cell is marked
      once and checks four neighbours, so it's O(rows × columns) time and O(rows × columns)
      memory for the `seen` set in the worst case. I'd use an iterative DFS with an explicit
      stack, because a recursive one overflows the call stack on one large island in
      JavaScript. BFS works equally well. If the grid may be modified I could mark cells in
      place to save memory, but I'd confirm that with the interviewer, because callers
      rarely expect their input to change.
  - question: A grid has several exits. How do you find each cell's distance to its nearest exit?
    answer: >-
      I run one multi-source BFS: every exit goes into the queue at distance 0 before the
      search starts. The rings then grow from all exits at once, so the first time the search
      reaches a cell, it has come from the nearest exit. That's O(rows × columns) in total,
      against O(exits × rows × columns) if I ran a separate BFS from each exit. A distance
      table filled with `-1` doubles as the seen set, and cells that stay `-1` are
      unreachable. The same idea answers "how many minutes until everything is reached": it's
      the largest distance, or `-1` if an open cell stays unreached.
  - question: When would you pick DFS over BFS?
    answer: >-
      I pick DFS when I need to explore everything or follow a path to its end, and BFS when
      I need the fewest steps. Counting components, checking reachability and flood fill can
      use either, and DFS is often shorter to write. DFS is also the natural shape for cycle
      detection in directed graphs, topological order by finishing time, and backtracking
      over choices. Memory differs by graph shape: BFS holds a whole ring, which can be wide,
      while DFS holds one path, which can be long. In JavaScript I write DFS with an explicit
      stack for large inputs, because recursion overflows around ten thousand frames.
terms:
  - term: Breadth-first search (BFS)
    say: It explores level by level.
    means: It uses a queue, so nodes come out in order of their distance from the start. The first time
      it reaches a node is by the fewest edges, which holds only when every edge costs the same.
  - term: Depth-first search (DFS)
    say: It finds the path.
    means: It follows one path as deep as it goes before backtracking, with recursion or an explicit
      stack. It finds *a* path, not the shortest one.
  - term: O(V + E)
    say: Linear in the number of nodes.
    means: Every node is handled once and every edge checked once or twice. On a grid that is O(rows ×
      columns), since each cell has at most four edges.
  - term: Seen set
    say: Mark a node as visited when you visit it.
    means: Mark it when you *add* it to the queue or stack. Marking on removal lets the same node be
      queued many times.
  - term: Connected component
    say: An island.
    means: A largest set of nodes in which every node can reach every other. Count them by starting a
      search from each node not yet seen.
  - term: Multi-source BFS
    say: Run a BFS from each start.
    means: Put every start in the queue at distance 0 and run one BFS. Each node gets its distance to
      the nearest start in a single O(V + E) pass.
