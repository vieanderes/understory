term: continuous integration
aka:
  - CI
short: Automatically building and testing every change as soon as it's pushed, before it joins the main line.
explain: |
  Ten people change the same code all day. If you only check that it all fits together
  on Friday, you'll spend Friday untangling a week of breakage.

  So every push triggers a pipeline on a clean machine: install, lint, type-check, test,
  build. A red result blocks the merge. It only works if the checks are fast and
  trustworthy, and if a failing run is fixed at once. A flaky test teaches people to
  press retry without reading.
analogy: A spell-checker that marks every page of the group essay the moment it's added, not the night before the deadline.
example:
  language: yaml
  code: |
    # runs on every push and pull request
    check:
      steps:
        - pnpm install --frozen-lockfile
        - pnpm lint
        - pnpm typecheck
        - pnpm test
usage: CI is red on main, so nobody merges until the broken test is fixed.
twin:
  term: continuous-delivery
  difference: Continuous integration checks every change by building and testing it. Continuous delivery goes further and keeps every passing change ready to release, often deploying it automatically.
related:
  - continuous-delivery
  - linter
  - pull-request
  - flaky-test
  - regression
  - least-privilege
level: 1
