term: subsequence
aka: [subsequences, longest common subsequence, LCS]
short: Items picked from a list in their original order, where skipping items in between is allowed.
explain: |
  From "garden", "gdn" is one: g, then d, then n, in order, skipping the rest. Reordering
  isn't allowed, so "ndg" isn't.

  A list of n items has 2ⁿ of them, one for every choice of keep or skip. Trying them all
  is hopeless past about twenty items.

  Problems about the longest or best one usually want dynamic programming. The state is
  "how far into each list am I", and each step decides keep or skip.
analogy: Picking songs from an album for a playlist. You can leave tracks out, but they still play in album order.
example:
  language: python
  code: |
    def is_subsequence(small, big):
        it = iter(big)
        return all(ch in it for ch in small)  # each match consumes big in order

    is_subsequence("gdn", "garden")  # True
    is_subsequence("ndg", "garden")  # False: wrong order
usage: Gaps are allowed, so it's a subsequence problem, and a sliding window won't work.
twin:
  term: subarray
  difference: A subsequence keeps the order but may skip items. A subarray is a run of neighbours with no gaps.
related: [subarray, dynamic-programming, two-pointers]
level: 2
lessons: [algo.dynamic-programming]
