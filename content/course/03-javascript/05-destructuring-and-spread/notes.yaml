summary: >-
  Destructuring, spread, rest and defaults are the syntax of modern JavaScript data
  handling. Destructuring unpacks values from objects by name and from arrays by position.
  Spread copies the contents of an array, an object or any iterable into a new one. Rest does
  the reverse, gathering leftovers into one array or object. Defaults fill in values that
  are `undefined`.


  Together they make a style of code that builds new values instead of changing old ones:
  `{ ...defaults, ...saved }` merges settings, `[...list, item]` adds to a list, and
  `const { password, ...safe } = user` drops a field. React state, Redux reducers and most
  configuration code are written this way, because a new object is cheap to compare with the
  old one.


  The one thing to keep in mind is that spread is **shallow**. It copies one level of
  properties. Nested objects and arrays are shared between the copy and the original, so
  changing them through the copy changes the original too. Knowing exactly what is copied and
  what is shared is the core of this topic, and a standard interview question.
remember:
  - Spread copies one level only; nested objects and arrays are shared by reference between the copy and the original.
  - In `{ ...a, ...b }`, later properties overwrite earlier ones, so put defaults first and overrides last.
  - Defaults, in parameters and in destructuring, apply only when the value is `undefined`, never for `null`.
  - Destructuring `null` or `undefined` throws a `TypeError`, so give an options parameter a default of `{}`.
  - '`const { a, ...rest } = obj` copies every other own property into a new object, the idiomatic way to omit a field without mutating.'
  - Object spread copies own enumerable properties only, so prototype methods and class identity are lost.
  - For a deep copy use `structuredClone`; for updating nested state, spread each level you change.
sections:
  - title: Shallow copies and what is shared
    body: |-
      Spread creates a new outer object or array, then copies each property value across.
      For primitives the value is the data. For objects the value is a **reference**, so the
      copy points at the same nested object.

      ```js
      const booking = { guest: "Ana", nights: 2, extras: ["breakfast"] };
      const copy = { ...booking };

      copy.guest = "Ben"; // replaces a value on the copy only
      copy.extras.push("parking"); // changes the shared array

      console.log(booking.guest); // Ana
      console.log(booking.extras); // [ 'breakfast', 'parking' ]
      console.log(copy.extras === booking.extras); // true
      ```

      To change nested data without touching the original, copy every level on the path to
      the change and share the rest. This is the pattern behind immutable state updates:

      ```js
      const state = {
        user: { name: "Ana", prefs: { theme: "light", fontSize: 16 } },
        items: ["tea"],
      };

      const next = {
        ...state,
        user: {
          ...state.user,
          prefs: { ...state.user.prefs, theme: "dark" },
        },
      };

      console.log(state.user.prefs.theme); // light
      console.log(next.user.prefs.theme); // dark
      console.log(next.items === state.items); // true, untouched parts are shared
      ```

      Sharing untouched branches is a feature: it's cheap, and a framework can tell what
      changed with a reference check. When you need a full independent copy,
      `structuredClone(value)` copies every level, including dates, maps and sets. It throws
      on functions and returns class instances as plain objects.
  - title: What object spread copies, and Object.assign
    body: |-
      Object spread copies **own enumerable** properties, including symbol keys. It skips
      inherited properties, and it reads getters, storing their current value rather than
      the getter itself.

      ```js
      class Cart {
        constructor() {
          this.items = ["tea"];
        }
        count() {
          return this.items.length;
        }
      }

      const plain = { ...new Cart() };
      console.log(plain); // { items: [ 'tea' ] }
      console.log(typeof plain.count); // undefined, methods live on the prototype
      console.log(plain instanceof Cart); // false

      console.log({ ...null, ...undefined }); // {}, object spread ignores them
      try {
        console.log([...null]);
      } catch (error) {
        console.log(error.message); // null is not iterable
      }
      console.log([..."tea"]); // [ 't', 'e', 'a' ]
      console.log([...new Set([1, 1, 2])]); // [ 1, 2 ]
      ```

      Array spread is different in kind: it uses the iteration protocol, so it works on
      strings, sets, maps and anything iterable, and throws for `null`, `undefined` and plain
      objects.

      `Object.assign(target, ...sources)` is the older tool. It copies the same properties,
      but into an existing target, which it mutates, and it triggers setters on that target.
      `Object.assign({}, a, b)` behaves like `{ ...a, ...b }`. Reach for `Object.assign` when
      you really mean to change an existing object; otherwise spread is clearer.

      One performance note: spreading inside a loop, `acc = { ...acc, [key]: value }` in a
      `reduce`, copies the whole object on every step, which is O(n²) for n keys. Build the
      object with plain assignment inside the function that owns it, or use
      `Object.fromEntries`.
  - title: Destructuring details worth knowing
    body: |-
      Defaults are evaluated lazily, only when needed. Renaming and defaults combine. And
      destructuring can assign to variables that already exist, with one syntax catch.

      ```js
      let calls = 0;
      const pick = () => {
        calls++;
        return "M";
      };
      const { size = pick() } = { size: "L" };
      const { colour = pick() } = {};
      console.log(size, colour, calls); // L M 1

      const { title: heading = "Untitled" } = {};
      console.log(heading); // Untitled

      const [, second] = ["gold", "silver", "bronze"];
      console.log(second); // silver

      let first = "a";
      let last = "b";
      [first, last] = [last, first];
      console.log(first, last); // b a

      let status;
      ({ status } = { status: "paid" }); // brackets needed
      console.log(status); // paid

      const [missing = "none"] = [null];
      console.log(missing); // null, a default ignores null
      ```

      Without the brackets, `{ status } = ...` at the start of a statement parses as a block,
      and you get a `SyntaxError`. Swapping two variables with array destructuring needs no
      temporary variable.

      Destructuring pairs well with `Object.entries` in a loop:
      `for (const [dish, count] of Object.entries(orders))`. And a function that takes many
      optional settings reads best as one destructured options object with defaults, which
      lets callers pass them by name and in any order:

      ```js
      function search({ query = "", page = 1, pageSize = 20 } = {}) {
        return `${query}|${page}|${pageSize}`;
      }
      console.log(search()); // |1|20
      console.log(search({ page: 3 })); // |3|20
      ```

      The `= {}` at the end makes `search()` with no argument work. It doesn't help with
      `search(null)`, which still throws, since defaults ignore `null`.
  - title: Rest parameters versus arguments
    body: |-
      Before rest parameters, functions read extra arguments from `arguments`, an
      array-like object available in regular functions. It isn't a real array, so it has no
      `map` or `filter`, and arrow functions don't have their own: an arrow sees the
      `arguments` of the regular function around it.

      ```js
      function total(...prices) {
        return prices.reduce((sum, price) => sum + price, 0);
      }
      console.log(total(3, 4.5, 2)); // 9.5
      console.log(total()); // 0, rest is always an array, possibly empty

      function legacy() {
        return Array.isArray(arguments);
      }
      console.log(legacy(1, 2)); // false

      console.log(Math.max(...[3, 9, 4])); // 9, spread in a call
      ```

      A rest parameter is a real array, contains only the arguments you didn't name, and
      works in arrow functions. It must come last: `function f(...a, b)` is a
      `SyntaxError`. The same three dots in a call, `Math.max(...list)`, spread an array into
      separate arguments, which replaced the old `Math.max.apply(null, list)`. Very large
      arrays can exceed the engine's argument limit, which in Node 24 sits somewhere above
      a hundred thousand items, so use a loop or `reduce` for those.
pitfalls:
  - '**Treating a spread copy as independent.** Nested arrays and objects are still shared, so `copy.items.push(x)` changes the original. Spread each level you change, or use `structuredClone`.'
  - '**Merging in the wrong order.** `{ ...saved, ...defaults }` lets defaults overwrite the user''s choices. Defaults first, overrides last.'
  - '**Expecting a default to replace `null`.** Defaults only apply to `undefined`, and APIs and forms often send `null`. Normalise with `??` where `null` means "not given".'
  - '**Destructuring an argument that may be missing.** `function f({ id })` throws when called with no argument. Add a default: `function f({ id } = {})`.'
  - '**Spreading a class instance.** The copy is a plain object without the prototype, so methods vanish and `instanceof` fails. Use a method that returns a new instance, or keep data classes plain.'
  - '**Spreading into an accumulator in a loop.** `reduce` with `{ ...acc, [k]: v }` copies the whole object each step, O(n²). Assign into one object you own, or use `Object.fromEntries`.'
interview:
  - question: What's the difference between a shallow copy and a deep copy?
    answer: >-
      A shallow copy creates a new top-level object but copies property values as they are,
      so nested objects are shared by reference; a deep copy duplicates every level. Spread,
      `Object.assign`, `Array.from` and `slice` are all shallow. So after
      `const copy = { ...order }`, `copy.items.push(x)` changes `order.items` as well. For a
      deep copy I use `structuredClone`, which handles dates, maps, sets and cycles, though
      not functions or class prototypes. The JSON round trip is lossy. In practice I rarely
      deep copy: for state updates I copy only the path I'm changing and share the rest,
      which is cheaper and lets frameworks detect changes by reference.
  - question: How would you update a nested value in React state without mutating it?
    answer: >-
      Spread every level on the path to the change and replace the value at the end. To
      set the theme inside `state.user.prefs`, I write
      `{ ...state, user: { ...state.user, prefs: { ...state.user.prefs, theme: "dark" } } }`.
      Each spread creates a new object for that level, so React sees new references along the
      path and re-renders, while unchanged branches keep their references and memoised
      children can skip work. Mutating in place and calling the setter with the same object
      would be ignored, because React compares by reference. When nesting gets deep, I
      flatten the state shape, or use a helper like Immer, which lets you write mutations
      against a draft and produces the copies for you.
  - question: What's the difference between the spread operator and Object.assign?
    answer: >-
      Both copy own enumerable properties shallowly, left to right, with later keys winning.
      The difference is the target. Spread always creates a new object. `Object.assign`
      writes into the object you give it as the first argument, mutating it, and it triggers
      setters on that target, where spread defines plain properties. So `{ ...a, ...b }` and
      `Object.assign({}, a, b)` produce equivalent results, but `Object.assign(a, b)` changes
      `a`. I use spread for immutable updates and reach for `Object.assign` only when mutating
      an existing object is the intent, such as adding defaults to an instance in a
      constructor.
  - question: Why does `function f(size = "M")` still give `null` when called with `f(null)`?
    answer: >-
      Because a default parameter applies only when the argument is `undefined`, either
      omitted or passed explicitly as `undefined`. `null` is a real value meaning "deliberately
      empty", so the language respects it. Destructuring defaults follow the same rule. This
      bites when data comes from JSON or a database, where missing values often arrive as
      `null`. If `null` should also mean "use the default", I normalise inside the function
      with `size ?? "M"`, which covers both. The upside of the rule is that callers can
      pass `null` on purpose to switch a default off.
