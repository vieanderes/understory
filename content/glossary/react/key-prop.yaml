term: key prop
aka:
  - list key
short: A stable, unique id on each list item, so React can tell the items apart between draws.
explain: |
  Render a list with `map` and React needs to know which item is which. Was a row deleted, or
  did they all shift up? `key={todo.id}` answers that.

  Use an id from the data. An array index looks fine until the list is sorted or an item is
  removed: then the keys move to different items, and state such as a half-typed input ends
  up on the wrong row. Changing a component's key on purpose resets its state.
analogy: Name badges at a reunion. People can swap seats, and you still know who's who.
example:
  language: tsx
  code: |
    <ul>
      {todos.map((todo) => (
        <TodoRow key={todo.id} todo={todo} />
      ))}
    </ul>
usage: The key prop is the array index, so deleting a row moves its checkbox state to the next one.
related:
  - reconciliation
  - props
level: 2
