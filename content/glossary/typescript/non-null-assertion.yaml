term: non-null assertion
aka: [non-null assertion operator, bang operator, definite assignment]
short: The `!` after an expression, telling the compiler to treat it as never null or undefined.
explain: |
  `map.get(id)!` says "trust me, it's there". The compiler stops complaining. It checks
  nothing at run time and emits no code. If you're wrong, the crash comes later, far from
  the cause.

  Prefer a real check: an `if` that throws a clear error, or a fallback. Keep `!` for the
  rare case where the code around it makes the value certain.
analogy: Signing for a parcel without opening the box. Fine until it turns out to be empty.
example:
  language: ts
  code: |
    const user = users.get(id)!; // no check at run time
    const safe = users.get(id);
    if (!safe) throw new Error(`No user ${id}`);
usage: That non-null assertion is hiding a real case; the lookup misses for deleted users.
related: [type-assertion, narrowing, any-type]
level: 2
lessons: [pro.typescript]
