id: pro.production-python
title: Production-grade Python
objective: 'Structure a Python project for a team: src layout, strict type checking in CI, and structured JSON logs without secrets.'
level: advanced
minutes: 10
concepts: [pro.src-layout, pro.strict-tooling, pro.structured-logging]
prerequisites: [pyai.fastapi]
opening:
  text: >-
    You'll set up a Python service the way a team keeps one healthy for years. The checks
    catch problems before review, and the logs answer questions at three in the morning.

steps:
  - type: prose
    id: src-layout
    body: |-
      `uv init --package` sets a project up the way teams keep them, the **src layout**:

      ```text
      notes-api/
        pyproject.toml
        src/notes_api/__init__.py
      ```

      The package sits one level down, under `src`. Standing in the project folder isn't
      enough to import it. `uv run` first installs it into the project's environment, the way
      a user would get it. So your tests check the installed code, not a stray folder.

  - type: multiple-choice
    id: pick-src-layout
    concept: pro.src-layout
    difficulty: 1
    question: Why does the src layout put the package under `src/`?
    choices:
      - text: So tests run against the installed package
        correct: true
        feedback: >-
          Yes. Nothing imports it by accident, so packaging bugs show up in tests.
      - text: So the folder looks tidier
        feedback: >-
          Tidier is a bonus. The point is that the folder alone can't be imported.
      - text: Because Python can't import from the root
        feedback: >-
          It can, and that's the trouble. The root makes the package importable without installing it.

  - type: predict-output
    id: predict-import-outside
    concept: pro.src-layout
    difficulty: 2
    language: bash
    code: |
      $ cd notes-api
      $ python3 -c "import notes_api"    # -c runs the code in quotes
    question: You're in the project folder, outside `uv run`. What happens?
    choices:
      - text: 'A `ModuleNotFoundError` for `notes_api`'
        correct: true
        feedback: >-
          Right. The package lives under `src`, and nothing installed it for this Python.
      - text: It imports, since you're in the folder
        feedback: >-
          That's the flat layout's behaviour. Under `src`, the folder alone isn't enough.
      - text: uv installs it automatically
        feedback: >-
          Only commands run through `uv run` get the project environment. Plain `python3` doesn't.

  - type: prose
    id: strict-tooling
    body: |-
      A team settles types once, in `pyproject.toml`, not in review comments:

      ```text
      [tool.mypy]
      strict = true
      ```

      **Strict** mode refuses any function without type hints, so every boundary is typed.
      CI runs mypy and ruff on every pull request. Reviews can then talk about design,
      because a machine already argued about the rest.

  - type: fill-blank
    id: fill-strict-annotations
    concept: pro.strict-tooling
    difficulty: 2
    language: python
    prompt: >-
      `mypy --strict` says `Function is missing a type annotation` on line 1. Type the
      parameter and the return. Fill the gaps.
    template: |
      def word_count(text: {{1}}) -> {{2}}:
          return len(text.split())
    blanks:
      - key: '1'
        answer: str
      - key: '2'
        answer: int
    bank: [str, int, list, None, Any]

  - type: prose
    id: structured-logging
    body: |-
      In production, machines search the logs. **Structured logging** gives each event fields,
      not only a sentence. `extra` adds them, and each becomes an attribute of the log record:

      ```python
      logger.info("Note saved", extra={"request_id": "r-42"})
      ```

      A formatter class then writes the record as one JSON line. It reads
      `record.levelname`, `record.getMessage()`, and `getattr(record, "request_id", None)`,
      which gives `None` when the field is missing.

  - type: code-challenge
    id: write-json-formatter
    concept: pro.structured-logging
    difficulty: 3
    language: python
    starter: formatter.starter.py
    solution: formatter.solution.py
    tests: formatter.tests.py
    prompt: >-
      Finish `JsonFormatter.format(record)`. Return one line of JSON with `level`, `message`
      and `request_id`. With no request id, it's `null`.


      So `logger.info("Note saved", extra={"request_id": "r-42"})` becomes
      `{"level": "INFO", "message": "Note saved", "request_id": "r-42"}`.
    hints:
      - Build a dict with the three fields, then turn it into text with `json.dumps`.
      - '`record.getMessage()` fills in any `%d`, so use it rather than the raw message.'
      - '`getattr(record, "request_id", None)` reads the field, or gives `None` when it''s missing.'

  - type: ai-review
    id: review-logged-key
    concept: pro.structured-logging
    difficulty: 3
    language: python
    request: Log each note creation with enough detail to debug it later.
    flawClass: security
    code: |
      def create_note(body: NoteIn, api_key: str, request_id: str) -> Note:
          logger.info("Creating note", extra={"request_id": request_id, "api_key": api_key})
          note = store.add(body.title, body.text)
          logger.info("Note created", extra={"request_id": request_id, "note_id": note.id})
          return note
    prompt: >-
      An assistant wrote this. The logs look tidy and searchable, and every test passes,
      because tests never read the log store. Tap the line at fault.
    lines: [2]
    reasons:
      - text: It writes the caller's API key into the logs
        correct: true
        feedback: >-
          Exactly. Anyone reading logs can now use the key. Log its id instead.
      - text: It should log after the note is created
        feedback: >-
          Logging the start is useful. The problem is one of the fields it records.
      - text: '`extra` can''t hold two fields'
        feedback: >-
          It holds any number. The trouble is what one of them contains.
    fix: |
      def create_note(body: NoteIn, api_key: str, request_id: str) -> Note:
          logger.info("Creating note", extra={"request_id": request_id})
          note = store.add(body.title, body.text)
          logger.info("Note created", extra={"request_id": request_id, "note_id": note.id})
          return note

  - type: explain-back
    id: explain-strict-in-ci
    concept: pro.strict-tooling
    difficulty: 4
    prompt: >-
      A reviewer keeps writing "add type hints" on pull requests. Why is strict mypy
      and ruff in CI the better fix?
    rubric:
      - A tool checks every change the same way, every time.
      - Missing types fail the build before a person ever looks.
      - Review time then goes to design and behaviour, not repeated style comments.
    modelAnswer: >-
      A person forgets and gets tired, while a tool checks every change the same way. With
      strict mode in CI, an untyped function fails the build before review starts. The
      reviewer stops repeating the same comment and spends their attention on design and
      behaviour instead.

recap:
  - Put the package under `src/` so tests run against the installed code.
  - Turn on strict mypy in `pyproject.toml`, and run it with ruff in CI.
  - Log events as JSON fields such as a request id, and never log secrets.
recall:
  - id: card-src-layout
    concept: pro.src-layout
    front: What does the src layout protect you from?
    back: >-
      Importing the package from the project folder by accident, so tests run against the
      installed package, as users get it.
  - id: card-strict
    concept: pro.strict-tooling
    front: Where does a team configure mypy and ruff, and where do they run?
    back: >-
      In `pyproject.toml`, and the same commands run locally and in CI.
  - id: card-extra
    concept: pro.structured-logging
    front: How do you attach a request id to one log call with the standard library?
    back: >-
      `logger.info("Note saved", extra={"request_id": request_id})`, with a formatter that
      writes the fields out.
  - id: card-no-secrets
    concept: pro.structured-logging
    front: What must never go into a structured log, however useful it looks?
    back: >-
      Secrets and credentials, such as API keys, tokens and passwords.

