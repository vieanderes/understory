term: throughput
aka: [requests per second, RPS, QPS]
short: How much work a system finishes per unit of time, such as requests handled each second.
explain: |
  A server might answer one request in 50 ms but handle 2,000 of them every second, because
  it works on many at once. That rate is a separate thing from how long each one takes.

  The two pull against each other near the limit. As load rises, the rate climbs, then
  flattens at the **knee of the curve**, and after that waits grow fast while no more work
  gets done. Load tests look for that knee, so you know the real capacity.
analogy: How many pizzas the shop sends out per hour, whatever the wait for each one.
usage: Batching the inserts tripled throughput, but each request now waits up to 200 ms for its batch.
twin:
  term: latency
  difference: Throughput is how many requests finish per second. Latency is how long one request takes. Batching often raises the first and worsens the second.
related: [latency, backpressure, horizontal-scaling]
level: 1
lessons: [perf.measure-first, testing.load-testing]
