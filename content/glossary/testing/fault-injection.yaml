term: fault injection
aka: [fault-injection testing, failure injection]
short: Making a dependency fail on purpose, slow, erroring, silent or cut off, to watch how your code copes.
explain: |
  Every database, vendor and model API you call will one day be slow or broken. If you've
  never seen that happen, your timeouts, retries and fallbacks are untested guesses.

  So cause the failure yourself. In a unit test, a stub returns errors or hangs. On the
  network, a proxy between you and the dependency adds delay or drops connections. Cover all
  four kinds: slow, error, no reply and a dropped connection. A quick `500` is the polite
  failure; the hang is what takes services down. Keep the schedule seeded, so a failing run
  can be replayed.
analogy: A fire drill. You set off the alarm on a calm day to learn whether everyone knows the way out.
example:
  language: ts
  code: |
    const slowProvider = {
      async complete() {
        await new Promise((r) => setTimeout(r, 30_000));
        throw new Error('never answered');
      },
    };
    const reply = await answer('hi', { provider: slowProvider, timeoutMs: 2_000 });
    expect(reply.fallback).toBe(true);
usage: Our retry logic has never seen a hang; add fault injection with a thirty-second delay and watch the timeout fire.
twin:
  term: chaos-experiment
  difference: Fault injection is the technique of breaking one thing on purpose, anywhere from a unit test up. A chaos experiment applies it to a running system, with a hypothesis and a stop rule.
related: [chaos-experiment, stub, retry, circuit-breaker]
level: 2
lessons: [testing.breaking-it-on-purpose]
