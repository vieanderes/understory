    note: Nonce and hash strategies, and why `unsafe-inline` defeats them.
    primary: true
    verified: true
  - kind: docs
    title: Content-Security-Policy (CSP) header
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy
    note: Every directive, including `script-src`, `frame-ancestors` and nonces.
    verified: true

deepDive: >-
  A nonce must be fresh per response and unguessable, so an attacker can't copy it into
  their injected script. Reuse one across responses and it protects nothing.


  When a policy lists a nonce, browsers ignore `'unsafe-inline'` beside it. That lets a site
  ship both for very old browsers. Remove the nonce, though, and `'unsafe-inline'` opens the
  door wide.


  Escaping is not sanitising. Escaping turns `<` into `&lt;` so it shows as a character.
  Sanitising removes dangerous parts and keeps some HTML, which you need only when users
  must submit formatted text. It's far harder to get right; use a tested library such as
  DOMPurify, never a regular expression.


  A CSP can report violations without enforcing them: `Content-Security-Policy-Report-Only`
  sends a report to an address you name. Roll a policy out that way first, watch what it
  would block, then enforce it.
