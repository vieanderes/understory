term: priority queue
aka: [PQ, priority queues]
short: A waiting line where the most urgent item comes out first, whatever order items arrived in.
explain: |
  A hospital's A&E doesn't see patients in arrival order. The most urgent goes next. Lots
  of programs need the same thing: the next timer due, the cheapest route so far.

  It's a promise about behaviour: add an item with a priority, take out the best one. A
  heap is the usual way to build it, with O(log n) for both.

  Dijkstra's shortest path, merging k sorted lists and scheduling all use one. When a
  task says "repeatedly take the smallest", that's the signal.
analogy: The boarding order at a gate. Families and priority passes go first, whoever reached the gate earlier.
example:
  language: python
  code: |
    import heapq

    tasks = []
    heapq.heappush(tasks, (2, "reply to email"))
    heapq.heappush(tasks, (1, "fix the outage"))
    heapq.heappush(tasks, (3, "tidy the backlog"))
    heapq.heappop(tasks)  # (1, "fix the outage")
usage: Use a priority queue keyed on distance, and you always expand the closest node next.
twin:
  term: fifo-queue
  difference: A priority queue hands out the most urgent item first. A FIFO queue hands out the oldest item first, in arrival order.
related: [binary-heap, fifo-queue, breadth-first-search]
level: 2
lessons: [algo.heaps-and-top-k, cs.trees]
