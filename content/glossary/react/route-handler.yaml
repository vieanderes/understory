term: route handler
aka: [ route.ts, API route ]
short: A file that answers HTTP requests at its URL with data, such as JSON, instead of a page.
explain: |
  Sometimes the caller isn't a person but a program: a mobile app, another service, a payment
  provider. It wants JSON, not HTML.

  A `route.ts` file exports functions named after HTTP methods, such as `GET` and `POST`. Each
  receives the standard `Request` and returns a `Response`. It's a real public endpoint. So it
  checks its input and answers bad requests with a `400`, not a crash.
analogy: The staff entrance round the back of a shop. Deliveries come in there; customers use the front door.
example:
  language: ts
  code: |
    // app/api/tasks/route.ts
    export async function POST(request: Request) {
      const body = await request.json().catch(() => null);
      if (!body?.title) {
        return Response.json({ error: 'title is required' }, { status: 400 });
      }
      const task = await createTask(body.title);
      return Response.json(task, { status: 201 });
    }
usage: The mobile app can't call a Server Action, so give it a route handler that returns JSON.
twin:
  term: server-action
  difference: A route handler is an endpoint with a URL that anything can call. A Server Action is a function your own forms and components call, with the request made for you.
related: [ server-action, endpoint, http-method, status-code, proxy-file ]
level: 2
lessons: [ nextserver.route-handlers ]
