summary: >-
  An architecture decision record, or ADR, is a short, numbered note in the repository that
  captures one significant decision: the context that forced it, the decision itself, and
  its consequences, costs included. Code shows what a team built. ADRs keep why, which is
  the part that disappears when people move on and chat history scrolls away.


  The value shows up a year later. A new lead wonders why the app is a modular monolith, or
  why search lags edits by a few seconds, and finds the answer in ten minutes of reading
  instead of a month of re-arguing. Reviewers point at a record instead of explaining it
  again. AI coding agents read the records and keep the boundaries they describe.


  ADRs work because they're cheap and immutable. Each one is a page or less, written when
  the decision is made, agreed in a pull request, and never edited afterwards except to
  change its status. When a decision changes, a new record supersedes the old one, so the
  log shows how the thinking moved. The notes add a full example, a process that keeps the
  records alive, and the twelve-factor practices that later chapters build on.
remember:
  - An ADR records one significant decision as context, decision and consequences, with a number, a date and a status.
  - The context states the forces at the time, the problem and constraints, never the decision again.
  - Consequences list costs next to gains, plus the change in circumstances that would make the team revisit.
  - ADRs are immutable history, so a changed decision gets a new record that supersedes the old one, which links forward.
  - Write an ADR for decisions that are expensive to reverse or that people will ask about, not for every library choice.
  - Agree an ADR in a pull request, so the discussion and the record land together.
  - Naming the options you rejected, and why, is often the most useful part for the next reader.
sections:
  - title: A complete record, as it sits in the repository
    body: |-
      Real ADRs are Markdown files. The lesson showed the fields as short lines. Here is a
      full one, in the shape most teams use, based on Michael Nygard's original format with
      an options section added.

      ```text
      docs/adr/0009-modular-monolith.md

      # 9. Build the booking app as a modular monolith

      Date: 2026-03-09
      Status: Accepted

      Context
      Four developers, one product, launch in five months. We expect bookings,
      payments and notifications as modules, but the boundaries are unproven.
      Bookings and payments must change together: a booking is confirmed only
      when its deposit is taken. Peak load is about 20 requests a second.

      Options considered
      1. Separate services for bookings, payments and notifications.
         Rejected: three pipelines and no shared transaction for a team of four,
         before we know the boundaries are right.
      2. A plain monolith with no enforced boundaries.
         Rejected: nothing stops modules reaching into each other, which makes
         a later split expensive.
      3. A modular monolith. Chosen.

      Decision
      One deployable app. Each module lives in src/modules/<name> with one
      index.ts entry file. no-restricted-imports fails the build on deeper
      imports. Each module owns its tables; no cross-module joins.

      Consequences
      Good: calls between modules are function calls; booking and deposit share
      one transaction; one pipeline to run.
      Bad: every change deploys everything; one module cannot scale alone; a
      crash in notifications takes bookings down with it.
      Revisit if a module needs its own scaling, its own release pace, or its
      own team.
      ```

      Notice what makes it useful. The context carries numbers, team size, deadline and
      load, because those are what change. The rejected options explain why the obvious
      alternatives lost, which is the question a newcomer asks first. The decision says how
      it will be enforced, not only what it is. And the last line gives a future reader a
      test: if a module now needs its own scaling, the reasons have run out, and it's time
      for a new record.
  - title: Keeping the log alive
    body: |-
      ADRs fail in two ways: nobody writes them, or they stop being true. A small process
      prevents both.

      Write the record before or with the change, as a pull request. Status starts as
      proposed. Discussion happens on the pull request, and the record is edited until the
      team agrees, then merged as accepted. The history of the argument stays linked to
      the decision.

      After acceptance, the body is frozen. When the decision changes, write a new record
      that says "Supersedes 0007" and change only the old record's status line to
      "Superseded by 0015". Both directions matter: someone landing on the old record must
      find the new one.

      A short script in CI keeps those links honest:

      ```ts
      import { readdirSync, readFileSync } from 'node:fs';
      import { join } from 'node:path';

      const dir = 'docs/adr';
      const problems: string[] = [];
      const numbers = new Set(readdirSync(dir).map((file) => file.slice(0, 4)));

      for (const file of readdirSync(dir).filter((f) => /^\d{4}-.+\.md$/.test(f))) {
        const text = readFileSync(join(dir, file), 'utf8');
        const status = text.match(/^Status: (.+)$/m)?.[1];
        if (!status) {
          problems.push(`${file}: no status line`);
          continue;
        }
        if (status.startsWith('Superseded')) {
          const successor = status.match(/by (\d{4})/)?.[1];
          if (!successor) problems.push(`${file}: superseded, but by which record?`);
          else if (!numbers.has(successor)) problems.push(`${file}: successor ${successor} not found`);
        }
      }

      console.log(problems.join('\n') || 'all records consistent');
      process.exitCode = problems.length > 0 ? 1 : 0;
      ```

      Run on Node 24 against three records, one of them marked superseded with no
      successor, it printed `0009-modular-monolith.md: superseded, but by which record?`
      and exited with code 1.

      Finally, make the records findable. Link `docs/adr/` from the README and from the
      contributor guide, and name it in the instructions file that coding agents read, so
      they check the records before changing a boundary.
  - title: What deserves a record, and how long it should be
    body: |-
      A useful test: would reversing this decision take more than a week, or will someone
      ask "why did we do this?" If yes, write it down. Typical candidates:

      - the architecture's shape: monolith, modular monolith or services;
      - the primary database, and how tenants are kept apart;
      - how services communicate: synchronous calls, events, an outbox;
      - where the model call lives and which provider sits behind the port;
      - authentication approach, hosting platform, deployment strategy;
      - deliberate exceptions to a team rule, such as one service in another language.

      Not candidates: which date library, naming conventions, a refactor that changes no
      boundary. Those belong in a style guide or in the pull request itself.

      Keep records short. The original format asks for one or two pages at most, in full
      sentences. Most good records are half a page. If a record grows longer, it's usually
      a design document, which is fine: write the design document, and let the ADR record
      the decision with a link to it.

      A compact alternative for small decisions is the **Y-statement**, one sentence with
      fixed parts: "In the context of *a situation*, facing *a concern*, we decided for *an
      option* and neglected *the alternatives*, to achieve *the benefits*, accepting that
      *the costs*." It forces the same discipline in fewer words, and it's handy as the
      summary line at the top of a full record.
  - title: The twelve-factor app, a set of decisions already made
    body: |-
      Some decisions are common enough that someone has written them down for everyone.
      The **twelve-factor app** is a list of practices for building services that deploy
      cleanly to cloud platforms. The tooling chapter covered config in the environment,
      and the cloud chapter relies on the rest. The twelve, in order:

      1. **Codebase**: one codebase in version control, many deploys.
      2. **Dependencies**: declare them explicitly and isolate them.
      3. **Config**: store it in the environment, not in the code.
      4. **Backing services**: treat databases, queues and caches as attached resources, swapped by config.
      5. **Build, release, run**: keep the three stages strictly separate.
      6. **Processes**: run the app as stateless processes; state lives in backing services.
      7. **Port binding**: the app serves HTTP by binding a port itself.
      8. **Concurrency**: scale out by running more processes.
      9. **Disposability**: start fast and shut down gracefully.
      10. **Dev/prod parity**: keep development, staging and production as similar as possible.
      11. **Logs**: write logs as an event stream to standard output, and let the platform collect them.
      12. **Admin processes**: run one-off tasks, such as migrations, as processes against the same release.

      Several are architecture decisions in disguise. Stateless processes are why sessions
      live in a database or a cookie, not in server memory, and why any instance can take
      any request. Backing services as attached resources is the ports and adapters idea
      at the infrastructure level. Disposability is what makes rolling deploys and
      autoscaling safe. When a team departs from one of them, for example by keeping state
      on local disk, that departure is exactly the kind of choice worth an ADR.
pitfalls:
  - "**A context that restates the decision.** \"We decided to split notifications\" explains nothing. Write the forces: what hurt, the numbers, the constraints at the time."
  - "**Consequences that read like an advert.** Listing only benefits hides the cost that will surprise someone later, such as a read model's lag. Write the costs and the trigger for revisiting."
  - "**Editing an accepted record.** It rewrites history and removes the reasoning people relied on. Change only the status and write a superseding record."
  - "**Writing records after the fact, from memory.** The rejected options and the real constraints are already forgotten. Write the record in the pull request that makes the change."
  - "**Recording everything.** A log full of trivial choices buries the ones that matter, and people stop reading it. Keep ADRs for decisions that are costly to reverse or likely to be questioned."
  - "**Hiding the records.** A folder nobody knows about helps nobody. Link it from the README and the contributor and agent instructions."
interview:
  - question: How do you document architectural decisions on a team?
    answer: >-
      With architecture decision records: short, numbered Markdown files in the repository,
      one per significant decision. Each has a status, the context with the real
      constraints, the options considered, the decision, and consequences that include
      costs and a trigger for revisiting. I propose one as a pull request, so the
      discussion is attached, and merge it as accepted. Records are immutable: when a
      decision changes, a new record supersedes the old one, and the old one links forward.
      The benefit is that newcomers, reviewers and coding agents can find the why in
      minutes. The cost is a little discipline, so I keep them to decisions that are
      expensive to reverse, like the database, service boundaries or tenancy model, and
      skip library choices.
  - question: Tell me about a technical decision you'd make differently now. How did you find out?
    answer: >-
      A good answer names a concrete decision, the context at the time, and the signal that
      changed it. For example: we chose a separate search index to fix 900 ms product
      searches, and the record listed faster search as the benefit but not the lag. When
      shoppers edited products and search showed old names, the missing consequence was
      clear in hindsight. The decision itself was right for the context; the record was
      incomplete. We superseded it with a record that kept the index, added a
      read-your-writes fix for editors, and named a revisit condition. The lesson I'd draw
      is to write the costs down deliberately, because that's where surprises come from.
  - question: What belongs in the consequences section of a decision record?
    answer: >-
      Both what the decision buys and what it costs, stated concretely, plus the conditions
      that would make the team reconsider. For a modular monolith: cheap in-process calls
      and a shared transaction on the plus side; every change deploys everything and no
      module scales alone on the minus side; revisit if one module needs its own scaling or
      team. Listing costs matters most, because costs are what surprise future readers,
      and a record with only benefits reads as a sales pitch. The revisit condition turns
      the record into something testable: a future lead can check whether the original
      reasons still hold instead of guessing.
  - question: What are the twelve-factor principles, and which matter most for deploying to the cloud?
    answer: >-
      They're twelve practices for services that deploy cleanly to cloud platforms, from
      one codebase and explicit dependencies through to logs as event streams and admin
      tasks as one-off processes. The ones I'd single out are config in the environment,
      so one build runs in every environment; stateless processes, so any instance can
      serve any request and you scale by adding instances; disposability, fast start and
      graceful shutdown, which rolling deploys and autoscaling depend on; strict build,
      release and run stages, so a release is an immutable build plus config you can roll
      back; and logs to standard output for the platform to collect. The list is from
      2011, so I treat it as guidance, not law, but most container platforms assume it.
