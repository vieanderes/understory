deepDive: >-
  **How dependencies are compared.** React uses `Object.is`, which works like `===`. An object
  or function made during render is new every time, so an effect that depends on one runs
  after every render. Create it inside the effect, or depend on its plain parts, such as
  `options.theme`.


  **The linter.** The `react-hooks/exhaustive-deps` rule lists every value an effect reads and
  warns when one is missing from the array. When it wants a value you don't want to react to,
  change the code, often with an updater, rather than silencing the rule.


  **Strict Mode's extra round** only happens in development. A production build sets the
  effect up once. The extra round is a test: if setting up twice breaks something, the
  cleanup is incomplete.
