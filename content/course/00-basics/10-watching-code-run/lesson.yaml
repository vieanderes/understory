deepDive: |-
  Typing `debugger;` on a line works like a breakpoint you write into the code. When the
  developer tools are open, the program pauses there. When they're closed, it does nothing.

  Debuggers can do more than pause. A conditional breakpoint pauses only when a condition is
  true, such as `task.title === "Buy milk"`. A logpoint prints a value without pausing, like a
  probe you never have to delete.

  Node has a debugger too. `node inspect app.js` starts one in the terminal, and Chrome can
  attach to it for the full view.
