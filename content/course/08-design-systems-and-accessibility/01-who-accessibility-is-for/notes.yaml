summary: >-
  Accessibility means people with disabilities can perceive, understand, operate and navigate
  what you build. That covers blind people who listen to a page, people with low vision who
  zoom to 400%, people who can't use a mouse, Deaf people who need captions, and people with
  cognitive disabilities who need plain steps. It also covers everyone having a bad day: a
  broken arm, a glaring screen, a slow connection.


  Most of it rests on one mechanism. The browser turns your DOM into an **accessibility
  tree**: a slimmer tree in which each node has a role, a name, a state and sometimes a value
  and a description. Screen readers, voice control and switch software never see your pixels.
  They read that tree through the operating system. Semantic HTML fills it in for free, and
  ARIA patches it where HTML can't, without adding any behaviour.


  The rulebook is WCAG 2.2 from the W3C. It sorts testable success criteria under four
  principles and three levels, and level AA is what laws, public sector rules and contracts
  usually point at. Knowing who each rule serves turns it from a checklist into a design
  decision.
remember:
  - Assistive technology reads the accessibility tree, not the screen, so what isn't in the tree doesn't exist for its users.
  - Every control needs a role, an accessible name and, if it changes, a state, which WCAG 2.2 calls Name, Role, Value (4.1.2, level A).
  - Native HTML elements fill in the tree and the keyboard behaviour, while ARIA only changes what the tree says.
  - The accessible name comes from `aria-labelledby`, then `aria-label`, then the native label or content, then `title`, and the first source with text wins.
  - A visible label must appear inside the accessible name, because voice control users say what they see (2.5.3 Label in Name).
  - WCAG 2.2 has four principles, known as POUR (perceivable, operable, understandable, and the R for working with any browser or assistive technology), with 13 guidelines and success criteria at levels A, AA and AAA.
  - Level AA conformance means every A and AA criterion is met on full pages, and it's the level laws and contracts usually ask for.
  - 4.1.1 Parsing is obsolete and removed in WCAG 2.2, so no audit should fail a page for it.
sections:
  - title: From DOM to speech
    body: |-
      A screen reader doesn't parse your HTML. The browser builds an **accessibility tree** from
      the DOM and the computed styles, and hands it to the operating system's accessibility API.
      On macOS that's the one VoiceOver uses, on Windows it's UI Automation and older APIs that
      NVDA, JAWS and Narrator use, and on Android it's the one TalkBack uses.

      The tree drops what carries no meaning. A `div` with no role often disappears into plain
      text, `display: none` and `hidden` remove a whole subtree, and `aria-hidden="true"` removes
      it from the tree while keeping it on screen. Chromium shows this tree in DevTools, and
      Playwright can print it. This page:

      ```html
      <main>
        <h2>Order 42</h2>
        <label>Email <input type="email" aria-describedby="h"></label>
        <p id="h">We never share it</p>
        <button aria-pressed="true">Mute</button>
        <button aria-expanded="false">Menu</button>
        <div onclick="save()">Save</div>
        <a>Help</a>
        <img src="cake.png">
      </main>
      ```

      becomes this tree in Chromium, printed with Playwright's `ariaSnapshot()`:

      ```text
      - main:
        - heading "Order 42" [level=2]
        - text: Email
        - textbox "Email"
        - paragraph: We never share it
        - button "Mute" [pressed]
        - button "Menu"
        - text: Save Help
        - img
      ```

      Four lessons sit in that output. The `div` with a click handler is plain text: no role, so
      nothing says it can be pressed. An `a` without `href` isn't a link at all, so it merges
      into the same run of text. An image with no
      `alt` stays in the tree with no name, and some screen readers read its file name instead.
      And the hint's link isn't lost: the full tree gives the textbox the description "We never
      share it", read after the name.

      Screen readers also have their own ways of moving. In a browse mode they read the page
      like a document and jump by headings, landmarks, links or form fields with single keys.
      That's why headings and landmarks such as `main` and `nav` matter as much as buttons do.
  - title: Beyond screen readers
    body: |-
      Screen readers are the famous case, but most assistive technology works differently, and
      each kind leans on a different part of your page.

      - **Screen magnifiers** and browser zoom enlarge a small part of the page. People see a
        slice at a time, so a message that appears far from where they are working goes
        unnoticed. Content must also reflow at 320 CSS pixels wide without scrolling in two
        directions (1.4.10 Reflow, AA).
      - **Voice control**, such as Voice Control on macOS and iOS or Voice Access on Android,
        lets people say "click Send". It matches what they say against accessible names. A
        button that shows "Send" but is named "Submit" can't be clicked by voice. That's 2.5.3
        Label in Name, level A.
      - **Switch access** turns one or two buttons into a scanning cursor that steps through
        every focusable control. Each extra tab stop costs time, and a keyboard trap costs the
        whole page.
      - **Braille displays** show one line of the tree at a time, so clear names and roles
        matter even more than prose.
      - **Captions and transcripts** serve Deaf and hard of hearing people, and anyone in a
        quiet carriage.
      - **Reading and cognitive aids** benefit from plain language, consistent layout and forms
        that don't ask twice.

      One markup choice often serves several groups. A real `button` with visible text gives the
      screen reader a role and a name, the voice user a word to say, the switch user a stop,
      and the keyboard user Enter and Space.
  - title: The law and the rulebook
    body: |-
      Several laws require accessible websites, and most of them measure it with WCAG. In the EU
      the Web Accessibility Directive covers public sector sites, and the European Accessibility
      Act, applied from 28 June 2025, covers many private services, including online shops,
      banking and e-books. Both lean on the standard EN 301 549, which maps to WCAG 2.1 AA for
      web content. In the UK the Equality Act 2010 requires reasonable adjustments, and public
      sector bodies have their own accessibility regulations. In the US, the ADA is the basis of
      many lawsuits against inaccessible sites, and federal agencies follow Section 508. Since
      WCAG 2.2 only adds criteria, a site that meets 2.2 AA also meets 2.1 AA.

      WCAG 2.2 itself has a fixed shape:

      - **Four principles**, known as POUR: perceivable, operable, understandable, and an R
        principle that asks content to work with current and future browsers and assistive
        technology. Its main criterion is 4.1.2 Name, Role, Value.
      - **13 guidelines** under them, such as 1.4 Distinguishable and 2.1 Keyboard Accessible.
        Guidelines aren't testable.
      - **Success criteria** under each guideline, each testable and each with a level. There are
        87 numbers. One, 4.1.1 Parsing, is marked obsolete and removed, which leaves 86: 31 at
        level A, 24 at AA and 31 at AAA.
      - **Levels** stack. AA means every A and every AA criterion. AAA is not recommended as a
        policy for whole sites, because some content can't meet it.

      Conformance applies to **full pages** and **complete processes**. A checkout can't
      conform if its payment step fails, and you can't exclude a broken widget from a claim.
      The W3C's Understanding documents explain each criterion, and its Techniques show known
      ways to pass and to fail.
  - title: What WCAG 2.2 added
    body: |-
      WCAG 2.2 added nine success criteria. Six are at A or AA, so they're part of any AA target:

      - **2.4.11 Focus Not Obscured (Minimum), AA.** A focused control is not entirely hidden
        by content the author created, such as a sticky header or a cookie banner.
      - **2.5.7 Dragging Movements, AA.** Anything done by dragging can also be done with a
        single pointer without dragging. A sortable list gets Move up and Move down buttons.
      - **2.5.8 Target Size (Minimum), AA.** Pointer targets are at least 24 by 24 CSS pixels,
        with exceptions: enough spacing around a smaller target, an equivalent larger control,
        links inside a sentence, targets the browser draws, and essential presentations.
      - **3.2.6 Consistent Help, A.** If help such as contact details or a chat appears on
        several pages, it appears in the same relative order.
      - **3.3.7 Redundant Entry, A.** Information already entered in the same process is filled
        in or offered for selection, such as "Billing address same as delivery".
      - **3.3.8 Accessible Authentication (Minimum), AA.** No step of logging in may depend on a
        cognitive function test, such as remembering a password or solving a puzzle, unless
        there's an alternative or a helping mechanism. Letting password managers fill the
        field and allowing paste both count. Blocking paste on a password field fails.

      The other three are AAA: 2.4.12 Focus Not Obscured (Enhanced), 2.4.13 Focus Appearance
      and 3.3.9 Accessible Authentication (Enhanced).

      One criterion went the other way. **4.1.1 Parsing** asked for well-formed markup because
      old assistive technology parsed HTML itself. It no longer does, since browsers build the
      tree, so the criterion is obsolete and removed in 2.2. Duplicate IDs still matter where
      they break a relationship, such as `aria-describedby` pointing at the wrong element, but
      that's a failure of 1.3.1 or 4.1.2, not of parsing.
pitfalls:
  - '**Adding ARIA to a `div` instead of using the element.** `role="button"` makes the tree say "button" but adds no focus, no Enter and no Space. Use `button`, and keep ARIA for what HTML has no element for.'
  - '**Hiding focusable things with `aria-hidden`.** The control leaves the tree but stays on the Tab path, so keyboard users land on something their screen reader can''t describe. Hide the whole thing with `hidden`, or use `inert` for a region.'
  - '**Naming a control differently from its visible text.** `aria-label="Submit"` on a button showing "Send message" breaks voice control. Drop the label, or make it start with the visible words.'
  - '**Treating an automated scan as an audit.** Checkers such as axe catch missing names and low contrast, but not a confusing name, a wrong focus order or a trap. Pair every scan with a keyboard pass and a screen reader pass.'
  - '**Failing pages for 4.1.1 Parsing.** Old audit templates still list it. In WCAG 2.2 it''s obsolete and removed, so report the real consequence, a broken name or relationship, under 1.3.1 or 4.1.2.'
  - '**Thinking accessibility is only for blind users.** Most barriers hit keyboard, voice, zoom and cognitive users too. Test with the keyboard and at 400% zoom, not only with a screen reader.'
verify:
  - lens: breaks
    check: 'Every control is a real `button`, `a` or form field, and ARIA is added only where HTML has no element.'
  - lens: breaks
    check: 'Nothing focusable sits inside an `aria-hidden` region, so keyboard users never land on a control their screen reader can''t describe.'
  - lens: confuses
    check: 'Each control''s accessible name starts with its visible text, so voice control users can say what they see.'
  - lens: tests
    check: 'An automated scan is followed by a keyboard pass and a screen reader pass, because scans miss confusing names and traps.'
interview:
  - question: How does a screen reader know what's on a web page?
    answer: >-
      It reads the accessibility tree that the browser builds from the DOM, not the pixels or
      the HTML source. The browser maps each element to a role, a name, states and a
      description, and exposes them through the operating system's accessibility API, which
      VoiceOver, NVDA, JAWS or TalkBack query. Semantic elements fill that tree in: a `button`
      becomes role button with its text as the name. Presentational CSS and click handlers
      don't, so a `div` with `onClick` is announced as plain text. ARIA edits the tree, for
      example `aria-expanded` on a disclosure button, but it adds no keyboard behaviour. I check
      the tree in the browser's accessibility panel, or with Playwright's `ariaSnapshot()` in
      tests, because that's exactly what assistive technology will get.
  - question: What is WCAG 2.2, and what does "conforms to level AA" mean?
    answer: >-
      WCAG 2.2 is the W3C's set of testable accessibility criteria, and AA conformance means a
      full page meets every level A and level AA criterion. It's organised under four
      principles known as POUR, perceivable, operable, understandable and the R principle of
      working with assistive technology, then 13 guidelines, then
      the success criteria, 86 in force since 4.1.1 Parsing was removed. The levels stack, so
      AA includes all of A. Conformance is per full page and per complete process, so one
      inaccessible payment step fails the checkout. AA is what the EU standard EN 301 549, many
      public sector rules and most contracts target. AAA isn't recommended as a site-wide
      policy, because some content can't meet it, but single AAA criteria such as 44 pixel
      targets are worth adopting where they fit.
  - question: What changed from WCAG 2.1 to 2.2 that affects a typical product team?
    answer: >-
      Six new A and AA criteria and one removal. Focus Not Obscured means a sticky header or
      banner can't completely cover the focused control, which `scroll-padding-top` often fixes.
      Dragging Movements means every drag, such as reordering a list, has a single-pointer
      alternative. Target Size (Minimum) asks for 24 by 24 CSS pixel targets or enough spacing.
      Consistent Help keeps help links in the same order across pages. Redundant Entry means a
      checkout never asks for the same address twice. Accessible Authentication means login
      can't rely on memory or puzzles alone, so allow paste and password managers. And 4.1.1
      Parsing is obsolete, so audits stop failing pages for markup errors that no longer affect
      assistive technology. Everything is additive, so 2.2 AA also satisfies 2.1 AA.
  - question: When would you use `aria-label`, and when not?
    answer: >-
      I use `aria-label` only when a control has no visible text, such as an icon button. It
      replaces any name the element would get from its content, so on a button with text it
      hides that text from screen readers and breaks voice control, which matches what people
      see. If a visible heading or label already exists, `aria-labelledby` pointing at it is
      better, because the name stays in sync and translates with the page. For extra help text,
      such as a password rule, I use `aria-describedby`, which adds a description after the
      name instead of replacing it. The trade-off of any ARIA naming is drift: it's invisible, so
      nobody notices when it goes stale, and tests that query by role and name are the guard.
