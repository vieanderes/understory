id: js.promises
title: Promises and async/await
objective: "Wait for slow work with promises and `await`, catch its errors, and run several jobs at once."
level: essential
minutes: 10
concepts: [js.promises, js.async-await, js.concurrent-awaits, js.promise-combinators]
prerequisites: [js.modules, js.errors, js.arrays]
opening:
  text: >-
    You'll load several things at once instead of one after another, and catch the ones that
    fail. It's often the difference between a page that takes five seconds and one that takes
    a blink.

steps:
  - type: prose
    id: why-code-waits
    body: |-
      Some work takes time. A **server**, a computer elsewhere that answers requests, might
      need half a second to send a forecast. The page can't freeze while it waits.

      So JavaScript starts slow work and carries on. `setTimeout` shows the idea:

      ```js
      setTimeout(showTip, 2000); // run showTip in 2 seconds
      console.log("Welcome");    // runs now
      ```

  - type: predict-output
    id: predict-timeout-order
    concept: js.promises
    difficulty: 1
    language: js
    code: |
      console.log("Order placed");
      setTimeout(() => console.log("Receipt ready"), 1000);
      console.log("Keep browsing");
    question: In what order do the three lines appear?
    choices:
      - text: Placed, browsing, then receipt
        correct: true
        feedback: >-
          Right. The timer waits a second, and the code carries on without it.
      - text: Placed, receipt, then browsing
        feedback: >-
          That's the order of the lines. But `setTimeout` doesn't pause anything, so line 3
          runs straight away.
      - text: Placed, then browsing, and no receipt
        feedback: >-
          The receipt does come. The timer fires a second later, after the other two lines.

  - type: prose
    id: states-and-await
    body: |-
      A **promise** is an object for a result that arrives later. It starts *pending*, then
      settles once: *fulfilled* with a value, or *rejected* with an error.

      ```js
      async function showForecast() {
        const forecast = await loadForecast("Leeds");
        console.log(forecast.high);
      }
      ```

      `await` pauses this function until the promise settles, then hands over the value. A
      rejection makes `await` throw, so `try`/`catch` catches it.

  - type: predict-output
    id: predict-async-returns-promise
    concept: js.async-await
    difficulty: 2
    language: js
    code: |
      async function getHigh() {
        return 18;
      }
      console.log(getHigh());
    question: The function returns a number. What does the browser console show?
    choices:
      - text: A promise that holds 18
        correct: true
        feedback: >-
          Yes. An `async` function always hands back a promise.
      - text: '`18`'
        feedback: >-
          Most people pick this. But `async` wraps the return value in a promise, and you
          need `await` to get the 18 out.
      - text: '`undefined`'
        feedback: >-
          The function does return something straight away. It's a promise that already holds
          18.

  - type: bug-hunt
    id: hunt-missing-await
    concept: js.async-await
    difficulty: 3
    language: js
    code: |
      async function saveFavourite(city) {
        throw new Error("storage full");
      }
      async function addFavourite(city) {
        try {
          saveFavourite(city);
          return "saved";
        } catch (error) {
          return "failed";
        }
      }
      console.log(await addFavourite("Leeds"));
    prompt: >-
      This runs in a module. Storage is full, yet it logs `saved`, then an uncaught error.
      Tap the line at fault.
    lines: [6]
    reasons:
      - text: The call isn't awaited, so `catch` never sees it
        correct: true
        feedback: >-
          Exactly. With `await`, the rejection is thrown inside the `try`, and `catch` gets it.
      - text: A `throw` in an async function skips every `catch`
        feedback: >-
          An awaited rejection is thrown right where you await. It lands in the `try`. Here
          nothing awaits it.
      - text: '`return "saved"` runs before `saveFavourite` starts'
        feedback: >-
          `saveFavourite` starts on line 6 and fails straight away. Its failure is dropped, not
          delayed.
      - text: '`addFavourite` needs its own `try` around the call'
        feedback: >-
          It already has one. A `try` only catches what's thrown inside it, and a promise
          nobody awaits never throws there.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'A save that fails gives "failed"'
          correct: true
          feedback: >-
            Right. Without `await`, it says "saved" instead.
        - text: 'A save that works gives "saved"'
          feedback: >-
            That passes with or without `await`. Only a failure needs the `catch`.
        - text: 'A call with an empty city name'
          feedback: >-
            The city is never used. What matters is whether a failed save is caught.
    fix: |
      async function addFavourite(city) {
        try {
          await saveFavourite(city);
          return "saved";
        } catch (error) {
          return "failed";
        }
      }

  - type: prose
    id: await-is-then
    body: |-
      The work starts when you *call* `loadForecast`. `await` only waits for it. In a loop,
      each `await` holds up the next call. So start every call first, then wait once:

      ```js
      const calls = cities.map((city) => loadForecast(city));
      const forecasts = await Promise.all(calls);
      ```

      `Promise.all` waits for all of them and fails if any fails. `Promise.allSettled` waits
      for every result, good or bad. Each result has a `status`, `"fulfilled"` or `"rejected"`,
      and a fulfilled one holds its `value`.

  - type: playground
    id: race-the-forecasts
    prompt: >-
      Five forecasts load one after another. Replace the `for` loop with the two lines from
      the last step, using `Promise.all`. Watch the time on the page drop.
    html: |
      <h1>Forecasts</h1>
      <p id="list">Loading...</p>
      <p id="time"></p>
    js: |
      // A stand-in server: each forecast takes 400 ms to arrive.
      function loadForecast(city) {
        return new Promise((resolve) => setTimeout(() => resolve(city + " 18°"), 400));
      }
      const cities = ["Leeds", "York", "Hull", "Bath", "Ely"];
      async function show() {
        const start = Date.now(); // the time now, in milliseconds
        const forecasts = [];
        for (const city of cities) {
          forecasts.push(await loadForecast(city));
        }
        document.querySelector("#list").textContent = forecasts.join(", ");
        document.querySelector("#time").textContent = "Took " + (Date.now() - start) + " ms";
      }
      show();
    editable: [js]

  - type: fill-blank
    id: fill-dashboard-all-settled
    concept: js.promise-combinators
    difficulty: 3
    language: js
    prompt: >-
      Bug report: when the news server is down, the whole dashboard stays blank. Show every
      widget that did load.
    template: |
      const results = await Promise.{{1}}(widgets.map((widget) => load(widget)));
      for (const result of results) {
        if (result.status === "{{2}}") {
          show(result.{{3}});
        } else {
          showOffline();
        }
      }
    blanks:
      - key: '1'
        answer: allSettled
      - key: '2'
        answer: fulfilled
      - key: '3'
        answer: value
    bank: [all, allSettled, fulfilled, rejected, value, status]

  - type: code-challenge
    id: write-map-with-limit
    concept: js.concurrent-awaits
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: pool.starter.py
      solution: pool.solution.py
      tests: pool.tests.py
    prompt: >-
      Starting 5 forecasts at once is fine. Starting 5,000 floods the server, and it starts
      refusing you. AI model APIs are strict about this, so real code caps the calls in flight.


      Write `mapWithLimit(items, limit, fn)`. It calls the async `fn(item, index)` for every
      item. At most `limit` calls run at once. When one finishes, the next one starts. It
      resolves with the results in the order of `items`. It rejects if a call rejects. An empty
      list resolves with `[]`.


      For example, `mapWithLimit(["Leeds", "York", "Hull"], 2, loadForecast)` runs two calls,
      starts Hull when one finishes, and resolves with three forecasts in that order.
    hints:
      - Look at the starter. `map` starts every call at once, before anything is awaited.
      - >-
        Picture `limit` workers sharing one counter. Each worker loops: take the next index,
        await that call, store the result at that index.
      - >-
        Start with `let next = 0;` and an inner `async function worker()` that loops `while
        (next < items.length)`.

  - type: explain-back
    id: explain-eight-seconds
    concept: js.concurrent-awaits
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks: to load five forecasts, would you await each one in a loop, or use
      `Promise.all`? Defend your choice.
    rubric:
      - In a loop each call starts after the one before has finished, so the times add up.
      - Calling all five first lets them overlap, and `Promise.all` waits only for the slowest.
      - The loop is right when each call needs the result of the one before.
    modelAnswer: >-
      `Promise.all`, because the forecasts don't depend on each other. A call starts when you
      call the function. Awaiting in a loop pauses before each next call, so five 400
      millisecond calls take two seconds. Starting all five first lets them overlap, and
      `Promise.all` waits for the slowest, about 400 milliseconds. I'd use the loop when each
      call needs the result of the one before.

recap:
  - Start slow work, carry on, and pick the result up later with `await`.
  - Put `await` inside the `try`, so a failure reaches your `catch`.
  - Start calls first and wait once with `Promise.all` or `Promise.allSettled`.

recall:
  - id: card-timeout-later
    concept: js.promises
    front: What happens to the line after `setTimeout(showTip, 2000)`?
    back: >-
      It runs straight away. The timer only schedules `showTip` for later and never pauses the
      code.
  - id: card-async-return
    concept: js.async-await
    front: What does calling an `async` function return, and what does a `throw` inside it do?
    back: >-
      It always returns a promise. A `throw` rejects that promise, so the caller only sees the
      error if it awaits it.
  - id: card-sequential-cost
    concept: js.concurrent-awaits
    front: Why are five calls awaited in a loop slower than the same calls with `Promise.all`?
    back: >-
      In the loop each call starts after the last one ends, so the times add up. With
      `Promise.all` they overlap, and the slowest sets the total.
  - id: card-combinators
    concept: js.promise-combinators
    front: How do `Promise.all` and `Promise.allSettled` treat one rejected promise?
    back: >-
      `all` rejects at once with that error. `allSettled` records it as `rejected` and waits for
      the rest.

