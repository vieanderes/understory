term: CSRF
aka:
  - cross-site request forgery
  - XSRF
short: An attack where another site makes your browser send a request to a site you're logged in to.
explain: |
  You're logged in to your bank in one tab. In another, a page you visit quietly submits a
  form to the bank: "transfer £500". Your browser attaches your bank cookie, as it does for
  every request, and the bank sees a valid login.

  The defence lets the server tell your own pages from someone else's. Use `SameSite`
  cookies and a token the attacker's page can't read. Check the `Origin` header on anything
  that changes state.
analogy: A stranger slipping a letter into your office's post tray. It goes out with the company stamp, so the other end trusts it.
usage: That endpoint changes the email on a GET with a cookie and no token, so it's open to CSRF.
twin:
  term: xss
  difference: CSRF borrows your browser to send a request, and the attacker's code never runs on your site. XSS runs the attacker's script inside your site.
related:
  - xss
  - cors
  - session
  - cookie
level: 2
lessons:
