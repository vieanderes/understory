summary: >-
  A sliding window is a contiguous run of items that you update as it moves, instead of
  rebuilding it. When the window moves one place, one item enters and one leaves, so each
  step costs constant work and the whole scan is O(n). It turns "check every subarray", which
  is O(n²) windows or worse, into a single pass.


  Windows come in two sizes. A **fixed window** of k items suits "every k consecutive days"
  and "anagrams of a word inside a text". A **variable window** grows on the right and shrinks
  on the left while a rule is broken, and suits "longest run with no repeats", "longest run
  with at most k distinct values" and "shortest run whose sum reaches a target". Both rest on
  the same fact: the two edges only move forwards, so each item enters once and leaves once.


  The signals are "consecutive", "contiguous", "subarray", "substring" and a best length or
  best sum. The window has one precondition that interviewers like to probe: shrinking must
  make the window "less" of something (fewer repeats, a smaller sum). With negative numbers
  that fails for sums, and you reach for prefix sums with a map, or a deque, instead.
remember:
  - A sliding window updates a contiguous run as it moves, adding the entering item and removing the leaving one, so a scan costs O(n).
  - A fixed window of k slides by `sum += a[i] - a[i - k]`, and the first window is summed once before the loop.
  - A variable window grows `right` every step and moves `left` forward while the window breaks its rule.
  - A nested `while` in a variable window is still O(n), because `left` and `right` each move at most n times in total.
  - A window only works if shrinking a valid window keeps it valid, which fails for sums once values can be negative.
  - For the longest valid window record the length after shrinking, and for the shortest record it while the window is still valid.
  - Keep what is inside the window in a `Map` of counts or a `Set`, so checking the rule costs O(1).
  - Counting windows with exactly k of something is at most k minus at most k minus one.
sections:
  - title: One template for variable windows
    body: |-
      Nearly every variable-window problem fits the same skeleton. What changes is the state
      you keep and the rule that says the window is broken.

      ```js
      // Longest window where no value repeats. O(n) time, O(d) space for d distinct values.
      function longestWithoutRepeat(items) {
        const counts = new Map();
        let left = 0;
        let best = 0;
        for (let right = 0; right < items.length; right++) {
          counts.set(items[right], (counts.get(items[right]) ?? 0) + 1); // 1. add the new item
          while (counts.get(items[right]) > 1) {                          // 2. shrink while broken
            counts.set(items[left], counts.get(items[left]) - 1);
            left++;
          }
          best = Math.max(best, right - left + 1);                        // 3. record a valid window
        }
        return best;
      }

      // Shortest window with sum at least target. Values must be positive.
      function shortestWithSum(values, target) {
        let left = 0;
        let sum = 0;
        let best = Infinity;
        for (let right = 0; right < values.length; right++) {
          sum += values[right];
          while (sum >= target) {                // valid: record, then try to shrink
            best = Math.min(best, right - left + 1);
            sum -= values[left];
            left++;
          }
        }
        return best === Infinity ? 0 : best;
      }

      console.log(longestWithoutRepeat([...'abcabcbb'])); // 3
      console.log(longestWithoutRepeat([])); // 0
      console.log(shortestWithSum([2, 3, 1, 2, 4, 3], 7)); // 2
      console.log(shortestWithSum([1, 1], 5)); // 0
      ```

      Notice where the answer is recorded. For the longest window you shrink until the
      window is valid, then record. For the shortest you record while it is valid, then
      shrink to see if something shorter still works. Mixing these up is the most common
      window bug.

      A small upgrade for the no-repeat case stores each value's last index and jumps `left`
      straight past the earlier copy: `left = Math.max(left, last.get(x) + 1)`. The
      `Math.max` stops `left` moving backwards when the old copy is already outside.
  - title: 'Three more classics: k distinct, anagram positions, window maximum'
    body: |-
      **Longest run with at most k distinct values**, for example the longest stretch of a
      shopping trip that visits at most two shops. The state is a count map, and the window
      is broken when the map has more than k keys. O(n) time, O(k) space.

      ```js
      function longestAtMostKDistinct(items, k) {
        const counts = new Map();
        let left = 0;
        let best = 0;
        for (let right = 0; right < items.length; right++) {
          counts.set(items[right], (counts.get(items[right]) ?? 0) + 1);
          while (counts.size > k) {
            const out = items[left];
            counts.set(out, counts.get(out) - 1);
            if (counts.get(out) === 0) counts.delete(out); // size must reflect what is inside
            left++;
          }
          best = Math.max(best, right - left + 1);
        }
        return best;
      }

      console.log(longestAtMostKDistinct([1, 2, 1, 2, 3], 2)); // 4
      console.log(longestAtMostKDistinct([1, 2, 3], 0)); // 0
      ```

      **Every start index of an anagram of a word inside a text.** A fixed window the length
      of the word, with letter counts. Track how many letters currently have a matching
      count, so each slide costs O(1) instead of comparing whole maps. O(n) time, O(alphabet)
      space.

      ```js
      function anagramStarts(text, word) {
        const need = new Map();
        for (const ch of word) need.set(ch, (need.get(ch) ?? 0) + 1);
        const have = new Map();
        let matched = 0; // letters whose count in the window equals the count needed
        const out = [];
        const add = (ch, delta) => {
          if (!need.has(ch)) return;
          if (have.get(ch) === need.get(ch)) matched--;
          have.set(ch, (have.get(ch) ?? 0) + delta);
          if (have.get(ch) === need.get(ch)) matched++;
        };
        for (let i = 0; i < text.length; i++) {
          add(text[i], 1);
          if (i >= word.length) add(text[i - word.length], -1);
          if (matched === need.size) out.push(i - word.length + 1);
        }
        return out;
      }

      console.log(anagramStarts('cbaebabacd', 'abc')); // [0, 6]
      console.log(anagramStarts('ab', 'abc')); // []
      ```

      **Maximum of every window of k.** A sum can be updated when an item leaves, a maximum
      cannot. Keep a deque of indices whose values decrease from front to back. The front is
      the current maximum. A new value evicts every smaller value from the back, since those
      can never be a maximum again. Each index enters and leaves once, so O(n) time and O(k)
      space. A head index replaces `shift`, which would cost O(k) per call.

      ```js
      function windowMaxima(values, k) {
        const deque = []; // indices, values decreasing
        let head = 0;
        const out = [];
        for (let i = 0; i < values.length; i++) {
          while (deque.length > head && values[deque[deque.length - 1]] <= values[i]) deque.pop();
          deque.push(i);
          if (deque[head] <= i - k) head++; // the front slid out of the window
          if (i >= k - 1) out.push(values[deque[head]]);
        }
        return out;
      }

      console.log(windowMaxima([1, 3, -1, -3, 5, 3, 6, 7], 3)); // [3, 3, 5, 5, 6, 7]
      console.log(windowMaxima([4], 1)); // [4]
      ```
  - title: When a window is the wrong tool, and the exactly-k trick
    body: |-
      A variable window is correct only if the rule is **monotonic**: once a window is
      broken, every larger window containing it is broken too, and once valid, every smaller
      window inside it is valid. "No repeats" and "at most k distinct" have this property.
      "Sum at least target" has it only for non-negative values.

      With negatives, `[5, -10, 6]` shows the failure. A window that drops the 5 might look
      like progress, but dropping -10 would have raised the sum. For "count or find subarrays
      with sum k" when negatives appear, use prefix sums with a hash map: O(n) time, and no
      assumption about signs. For the shortest subarray with sum at least k and negatives, the
      known O(n) solution is prefix sums with a monotonic deque.

      "Exactly k" is not monotonic either: a window with exactly k distinct values contains
      smaller windows with fewer, so neither growing nor shrinking keeps it valid. The trick
      is to count windows with at most k and subtract those with at most k - 1. For each
      `right`, every start from `left` to `right` is valid, so you add `right - left + 1`.

      ```js
      function countAtMost(items, k) {
        const counts = new Map();
        let left = 0;
        let total = 0;
        for (let right = 0; right < items.length; right++) {
          counts.set(items[right], (counts.get(items[right]) ?? 0) + 1);
          while (counts.size > k) {
            const out = items[left++];
            counts.set(out, counts.get(out) - 1);
            if (counts.get(out) === 0) counts.delete(out);
          }
          total += right - left + 1; // windows ending at right
        }
        return total;
      }

      const countExactlyK = (items, k) => countAtMost(items, k) - (k > 0 ? countAtMost(items, k - 1) : 0);

      console.log(countExactlyK([1, 2, 1, 2, 3], 2)); // 7
      console.log(countExactlyK([1, 1], 1)); // 3
      ```
  - title: Saying it aloud, from brute force to window
    body: |-
      For "longest substring without repeating characters", a strong live answer runs like
      this.

      1. "Brute force: try every start and extend until a repeat. O(n²) windows, and O(n³)
         if I check each for repeats from scratch."
      2. "Consecutive letters and a longest length: that's a window. If `s[i..j]` has no
         repeat, neither does any window inside it, so the rule is monotonic."
      3. "I move `right` one letter at a time. If the new letter is already inside, I move
         `left` until it isn't. A set tells me what's inside in O(1)."
      4. "There's a `while` in the `for`, but `left` only moves forward, so across the whole
         run it moves at most n times. O(n) time, O(alphabet) space."
      5. "Edges: empty string gives 0, all one letter gives 1, all distinct gives n."

      For fixed windows the edge cases are about k: `k` of 0, `k` larger than the array, `k`
      equal to the length (one window), and all negative values, which is why `best` starts at
      the first window's sum and not at 0. Interviewers also ask what happens with Unicode:
      `text[i]` reads UTF-16 code units, so an emoji is two items. Spreading with
      `[...text]` iterates by code point if that matters.
pitfalls:
  - "**Starting the best at 0.** With all-negative values the best fixed-window sum is negative, and `best = 0` returns a sum no window has. Start from the first window's sum, or from `-Infinity`."
  - "**Recording the answer at the wrong moment.** For a longest window, record after shrinking back to valid. For a shortest window, record inside the shrink loop while the window is still valid."
  - "**Leaving zero counts in the map.** `counts.size` counts keys, so a letter whose count fell to 0 still looks present. Delete the key when its count reaches 0."
  - "**Using a window on sums with negatives.** Shrinking no longer lowers the sum, so the window skips answers. Use prefix sums with a map, or a monotonic deque."
  - "**Calling `shift` on a deque array.** Each `shift` moves every item, which quietly makes the window maximum O(n × k). Keep a head index and advance it."
  - "**Off-by-one in the window length.** The window from `left` to `right` inclusive has `right - left + 1` items. For a fixed window, the item leaving at step `i` is `a[i - k]`."
interview:
  - question: Why is a sliding window with a while loop inside a for loop still O(n)?
    answer: >-
      Because the total work is bounded by how far the pointers move, and each moves at
      most n times. The outer loop advances `right` once per item. The inner loop advances
      `left`, and `left` never moves backwards or past `right`. So across the whole run the
      inner loop body executes at most n times in total, not n times per outer step. Each
      item is added once when `right` reaches it and removed at most once when `left` passes
      it. With O(1) map or set operations, that gives O(n) time. The argument breaks if the
      body does more than constant work, such as comparing two whole count maps, which is
      why fixed-window anagram search tracks a matched counter instead.
  - question: Find the shortest subarray whose sum is at least a target. Does your approach change if values can be negative?
    answer: >-
      Yes: with positive values a variable window works in O(n), with negatives it does not.
      For positives I grow `right`, and while the sum reaches the target I record the length
      and shrink from `left`. That's correct because removing an item always lowers the sum,
      so once a window falls short, shrinking further never helps. With negatives, removing
      an item can raise the sum, so the window can discard a start that would have worked.
      Then I use prefix sums: a subarray `i..j` has sum `prefix[j + 1] - prefix[i]`, and a
      monotonic deque of candidate starts finds the shortest in O(n). The trade-off is
      complexity of the code, so I'd confirm the constraints on signs first.
  - question: How would you find all anagrams of a short word inside a long text?
    answer: >-
      With a fixed window the length of the word and letter counts, in O(n) time. I count
      the word's letters once. Then I slide a window across the text, adding the entering
      letter and removing the leaving one. Comparing two count maps on every step costs
      O(alphabet), which is fine for 26 letters, but I can make it O(1) by tracking how many
      letters currently have exactly the needed count and recording a start whenever that
      equals the number of distinct letters in the word. The brute force sorts every window,
      O(n × m log m) for a word of length m. Edge case: a word longer than the text returns
      no matches.
  - question: Count the subarrays with exactly k distinct values.
    answer: >-
      I count subarrays with at most k distinct values and subtract those with at most k
      minus 1. "Exactly k" is not monotonic, so a single window cannot shrink correctly, but
      "at most k" is. For at most k, I run a variable window with a count map and, for each
      `right`, shrink until the map has at most k keys. Every start between `left` and
      `right` then gives a valid subarray ending at `right`, so I add `right - left + 1`.
      Two passes, O(n) time and O(k) space. The trick generalises to any "exactly" question
      whose "at most" form is monotonic.
terms:
  - term: Sliding window
    say: Any loop that looks at a subarray.
    means: A contiguous range whose edges only move forwards. It adds the entering item and removes the
      leaving one instead of rebuilding, so a whole scan is O(n).
  - term: Subarray
    say: Any selection of items from an array.
    means: A contiguous run of items. A subsequence keeps the order but may skip items, and a window
      can't model one.
  - term: Fixed window
    say: Sum every group of k items.
    means: A window of exactly k items that sums the first k once, then slides with `sum += a[i] - a[i -
      k]`, for O(n) instead of O(n × k).
  - term: Variable window
    say: It's the same as two pointers.
    means: A two-pointer scan where `right` grows every step and `left` moves forward while the window
      breaks its rule. It only works if shrinking a valid window keeps it valid, which fails for
      sums with negative values.
  - term: Exactly k
    say: Shrink the window until it has exactly k.
    means: Windows count *at most k* cleanly but not *exactly k*, so count exactly k as `atMost(k) -
      atMost(k - 1)`.
