summary: >-
  Most TypeScript you write is ordinary code with a few annotations in the right places. The
  checker infers the type of anything that starts with a value, so variables rarely need one.
  You annotate the places where no value exists yet: function parameters, and the shapes of
  the objects your program passes around.


  Those shapes get names with `type` or `interface`. For a plain object the two are nearly
  interchangeable, and a team picks one style. The differences show up at the edges: only an
  interface can be reopened and merged, and only a `type` can name a union, a tuple or a
  computed type.


  The most useful everyday feature is the optional property. A `?` tells the checker a value
  may be missing, and from then on it makes you handle `undefined` before you use it. That
  turns the classic "undefined" on a web page into an error you fix in the editor.
remember:
  - Let the checker infer variables and return values, and annotate parameters and exported object shapes.
  - A `let` widens a starting value to its general type, such as `string`, while a `const` keeps the exact literal, such as `"open"`.
  - Callback parameters are typed from where the callback is used, so `prices.map((p) => ...)` needs no annotation on `p`.
  - '`type` and `interface` both name object shapes, but only an interface merges when declared twice, and only a `type` can be a union.'
  - '`note?: string` may be left out entirely, while `note: string | undefined` must be written, even if its value is `undefined`.'
  - Use `??` for defaults, because `||` also replaces `0`, `""` and `false`.
  - A callback typed to return `void` may return a value, and the caller promises to ignore it.
sections:
  - title: How inference picks a type
    body: |-
      Inference follows a few rules you can predict. A `let` can change later, so its type
      widens to the general kind. A `const` can't, so it keeps the exact value as a
      **literal type**. Arrays take a union of what's in them. Object properties widen, since
      a property can be reassigned:

      ```ts
      let status = "open"; // string
      const fixed = "open"; // "open"
      const mixed = [1, "two"]; // (string | number)[]
      const cart = { item: "tea", qty: 2 }; // { item: string; qty: number }
      ```

      Inference also runs backwards, from where a value goes. This is **contextual typing**.
      A callback passed to `map` gets its parameter type from the array:

      ```ts
      const prices = [4.5, 12, 3];
      const labels = prices.map((p) => `£${p.toFixed(2)}`); // p: number, labels: string[]

      function total(items: number[]) {
        return items.reduce((sum, n) => sum + n, 0); // return type inferred: number
      }

      console.log(labels, total(prices)); // [ '£4.50', '£12.00', '£3.00' ] 19.5
      ```

      So when do you annotate? Parameters, always: they have no value to infer from. Return
      types on exported functions, often: the annotation pins the contract, so a mistake in
      the body is reported inside the function, not at every caller. Variables, rarely: only
      when the starting value is narrower or wider than you mean, such as an empty array
      that will hold bookings, `const bookings: Booking[] = []`.

      Hover in your editor to see what was inferred. If the hover surprises you, add an
      annotation and read the error it produces.
  - title: type versus interface, precisely
    body: |-
      For an object shape, both work and both are erased. Pick one per codebase and use the
      other where it's needed. The real differences:

      ```ts
      interface Film {
        title: string;
      }
      interface Film {
        minutes: number;
      }
      const alien: Film = { title: "Alien", minutes: 117 }; // both declarations merged
      ```

      An interface is **open**: a second declaration with the same name merges into the
      first. Libraries rely on this, so you can add a property to a global type such as
      `Window`. Declare a `type` twice and you get `Duplicate identifier 'Film'`.

      A `type` is an alias for any type at all, so it can name things an interface can't:
      unions (`"draft" | "sent"`), tuples (`[number, number]`), function types and types
      computed from other types.

      Extending differs when properties clash. `interface C extends A` checks that the new
      property fits the old one and reports the clash where you wrote it:

      ```text
      Interface 'C' incorrectly extends interface 'A'.
        Types of property 'id' are incompatible.
          Type 'number' is not assignable to type 'string'.
      ```

      An intersection, `type AB = A & B`, never complains when you declare it. It combines
      `id: string` and `id: number` into `id: never`, and you only find out when you try to
      build a value: `Type 'string' is not assignable to type 'never'`.

      A reasonable default: `interface` for object shapes that others may extend, `type` for
      everything else. Consistency matters more than the choice.
  - title: Function types in everyday code
    body: |-
      Parameters can be optional, have defaults, or collect the rest into an array. A
      function type expression names the shape of a callback:

      ```ts
      type OnSaved = (id: string) => void;

      const log: OnSaved = (id) => console.log(`saved ${id}`);
      const ids: string[] = [];
      const collect: OnSaved = (id) => ids.push(id); // push returns a number, still fine

      function greet(name: string, greeting = "Hello", punctuation?: string): string {
        return `${greeting}, ${name}${punctuation ?? "."}`;
      }

      function sum(...amounts: number[]): number {
        return amounts.reduce((total, n) => total + n, 0);
      }

      log("B-1"); // saved B-1
      collect("B-2");
      console.log(ids); // [ 'B-2' ]
      console.log(greet("Sam")); // Hello, Sam.
      console.log(greet("Sam", "Hi", "!")); // Hi, Sam!
      console.log(sum(4.5, 3, 12)); // 19.5
      console.log(sum()); // 0
      ```

      A default value makes a parameter optional and infers its type, so `greeting` is a
      `string`. Optional parameters come after required ones.

      Notice `collect`. Its arrow returns the number from `push`, yet it fits `OnSaved`. A
      function type returning `void` means "the caller ignores the result", not "must return
      nothing". That lets you pass `ids.push` style one-liners as callbacks. The rule is
      different for a declaration: `function save(): void { return 1; }` is an error, because
      there you are the one promising.

      For lists you won't change, `readonly string[]` removes `push`, `pop` and the other
      mutating methods from the type. A function that takes `readonly string[]` accepts
      both kinds of array, so it's the kinder parameter type.
  - title: Missing values, optional properties and nullish operators
    body: |-
      A `?` property and a `| undefined` property look alike but differ in one way:

      ```ts
      type Draft = { title: string; note?: string };
      type Saved = { title: string; note: string | undefined };

      const a: Draft = { title: "Buy milk" }; // fine: note may be left out
      const b: Saved = { title: "Buy milk", note: undefined }; // must be written
      const c: Saved = { title: "Buy milk" };
      // Property 'note' is missing in type '{ title: string; }' but required in type 'Saved'.
      ```

      Use `?` for things callers may leave out, such as options. Use `| undefined` when you
      want every caller to decide on purpose.

      Two operators handle a missing value. `?.` stops and gives `undefined` if the left side
      is `null` or `undefined`. `??` supplies a default for exactly those two values. `||`
      supplies it for every falsy value, which is often a bug:

      ```ts
      type Settings = { volume?: number; theme?: { name: string } };

      function describe(s: Settings): string {
        const volumeOr = s.volume || 50;
        const volumeNullish = s.volume ?? 50;
        const theme = s.theme?.name ?? "light";
        return `${volumeOr} ${volumeNullish} ${theme}`;
      }

      console.log(describe({ volume: 0 })); // 50 0 light
      console.log(describe({ theme: { name: "dark" } })); // 50 50 dark
      ```

      A muted volume of 0 became 50 with `||`. With `??` it stays 0.

      One more subtlety: `"volume" in { volume: undefined }` is `true`, while
      `"volume" in {}` is `false`. At run time a key can exist and hold `undefined`. By
      default the checker treats both the same. The `exactOptionalPropertyTypes` setting
      makes it tell them apart.
pitfalls:
  - '**Annotating every variable.** `const count: number = 0` repeats what the checker knows and hides the useful annotations. Annotate parameters and exported contracts, and let the rest be inferred.'
  - '**Leaving an empty array to inference.** An empty starting value tells the checker nothing useful about what the array will hold. Annotate it: `const bookings: Booking[] = []`.'
  - '**Using `||` for a default.** It replaces `0`, `""` and `false` as well as `undefined`, so a quantity of 0 becomes 1. Use `??`, which only replaces `null` and `undefined`.'
  - '**Intersecting types with clashing properties.** `A & B` where both have `id` with different types gives `id: never` and no error until you build a value. Use `interface ... extends`, which reports the clash where you declare it.'
  - '**Trusting a template string to catch a missing value.** `${film.subtitle}` accepts `undefined` and prints the word. Check for `undefined` first, or turn on a lint rule for template expressions.'
interview:
  - question: When would you use an interface and when a type alias?
    answer: >-
      For plain object shapes they're almost the same, so I follow the codebase's
      convention. The differences decide the edge cases. An interface is open: declaring it
      twice merges the declarations, which is how you add properties to a global like
      `Window` or augment a library's types. A type alias can name anything: unions, tuples,
      function types and types computed with mapped or conditional types, which an interface
      can't express. When extending, `interface extends` reports an incompatible property
      where you declare it, while an intersection silently produces `never` for a clashing
      property. My default is `interface` for public object shapes that others may extend
      and `type` for unions and derived types. Accidental merging is the risk with
      interfaces, so I avoid reusing names.
  - question: How much should you annotate, and how much should you leave to inference?
    answer: >-
      Annotate the boundaries of a function and let inference handle the inside.
      Parameters always need annotations, since nothing tells the checker their type.
      Exported functions usually get an explicit return type: it documents the contract,
      and a mistake in the body is reported inside the function instead of at every
      caller. Local variables almost never need one, because inference from the starting
      value is exact and stays in sync when the code changes. The exceptions are values
      that start narrower or emptier than they'll become, such as an empty array or a
      variable that starts as `null`. Over-annotating has a cost: it adds noise and can
      widen a type you wanted kept narrow, such as a literal.
  - question: "What's the difference between `name?: string` and `name: string | undefined`?"
    answer: >-
      The first means the property may be absent; the second means it must be present but
      may hold `undefined`. With `name?: string`, `{}` is a valid value. With
      `name: string | undefined`, you have to write `{ name: undefined }`, so every caller
      makes a deliberate choice. Reading either gives `string | undefined`, so you handle
      the missing case the same way, with a check or `??`. At run time the two differ:
      `"name" in obj` is `false` for an absent key and `true` for a key holding `undefined`.
      By default TypeScript lets `name?: string` accept an explicit `undefined` too. The
      `exactOptionalPropertyTypes` setting forbids that, which matters when absent and
      `undefined` mean different things, such as in a partial update.
  - question: Why does TypeScript let a callback that returns a number fit a type that returns void?
    answer: >-
      Because `void` in a function type means the caller ignores the result, not that the
      function must return nothing. It exists for substitutability. `forEach` takes a
      callback returning `void`, and you often pass something like `(id) => ids.push(id)`,
      which returns the new length. Rejecting that would break common code for no safety
      gain, since the caller never reads the value. The rule is stricter where you make the
      promise yourself: a function declared with `: void` that returns a value is an error.
      The trade-off is small: if you later start using the result of a `void` callback, the
      checker won't help, so type it as returning the real value if you need it.
terms:
  - term: Type inference
    say: TypeScript guesses the types.
    means: The checker computes a type from a value's starting point, following fixed rules, so
      variables and return values rarely need an annotation. Parameters have no starting value, so
      they do.
  - term: "`type` and `interface`"
    say: Interfaces are for objects, types for everything else.
    means: Both name object shapes. Only an interface can be declared twice and merge; only a `type` can
      name a union, a tuple or a computed type.
  - term: Widening
    say: "`let status = 'open'` has the type `'open'`."
    means: A `let` widens its starting value to the general type, here `string`. A `const` keeps the
      literal type `'open'`.
  - term: Optional property
    say: "`note?: string` is the same as `note: string | undefined`."
    means: "`note?` may be left out entirely. `note: string | undefined` must be written, even when its
      value is `undefined`."
  - term: "`??`"
    say: The same as `||`.
    means: "`??` falls back only on `null` or `undefined`. `||` also replaces `0`, `''` and `false`."
  - term: "`void` return type"
    say: A `void` callback must return nothing.
    means: A callback typed to return `void` may return a value; the caller only promises to ignore it.
      That's why `items.forEach((x) => list.push(x))` compiles.
