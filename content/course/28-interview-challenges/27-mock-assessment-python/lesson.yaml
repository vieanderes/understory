id: interview.mock-python
title: "Mock assessment C, in Python"
objective: "Sit a timed three-task assessment in Python, scored on hidden correctness and performance tests."
level: advanced
minutes: 90
assessment: true
concepts: [interview.hidden-tests, interview.expected-complexity]
prerequisites: [interview.mock-b]
opening:
  text: >-
    Three tasks in 90 minutes, this time in Python 3.13. The code runs at about half
    native speed, so the complexity line matters even more.

steps:
  - type: prose
    id: brief
    body: |-
      Three tasks, one clock, 90 minutes. Each task states its expected worst-case
      complexity. Let that line pick the algorithm.

      Read all three first. Start with the one you know best. If a fast idea won't come,
      submit a correct slow version: it still banks the correctness tests.

      **Run** checks only the examples. **Submit** runs the hidden tests.

  - type: prose
    id: python-costs
    body: |-
      Python hides a few linear costs behind short syntax. Watch for them.

      - `x in some_list` scans the list. `x in some_set` doesn't.
      - `some_list.pop(0)` shifts every other item. Use `collections.deque` or a heap.
      - `sorted()` is O(N log N), so don't call it inside a loop.
      - Deep recursion stops at about 1,000 calls. Write the loop instead.

      Big numbers are fine. Python's `int` never overflows.

  - type: code-challenge
    id: task-magnitudes
    concept: interview.hidden-tests
    difficulty: 2
    language: python
    starter: magnitudes.starter.py
    solution: magnitudes.solution.py
    tests: magnitudes.tests.py
    hidden: magnitudes.hidden.py
    performance: magnitudes.performance.py
    bruteForce: magnitudes.brute.py
    timeLimitMs: 2000
    prompt: |-
      **Task 1: distinct magnitudes.** A vibration sensor logs N readings in a list `A`.
      Some readings are negative. The **magnitude** of a reading is its absolute value.

      Write a function:

      ```python
      def distinct_magnitudes(A: list[int]) -> int
      ```

      that returns the number of different magnitudes in `A`.

      For example, given `A = [-5, -3, -1, 0, 3, 6]`, the function should return `5`.
      The magnitudes are 5, 3, 1, 0 and 6, and 3 appears twice.

      Write an efficient algorithm for the following assumptions:

      - N is an integer within the range [1..100,000].
      - Each element of list A is an integer within the range [-2,147,483,648..2,147,483,647].

      Expected worst-case time complexity is O(N).
    hints:
      - Two readings share a magnitude when their absolute values are equal.
      - Checking `in` on a list reads the whole list. With 100,000 different values, that is billions of steps.
      - Put every `abs(value)` in a set and return its length.

  - type: code-challenge
    id: task-pairs
    concept: interview.expected-complexity
    difficulty: 3
    language: python
    starter: pairs.starter.py
    solution: pairs.solution.py
    tests: pairs.tests.py
    hidden: pairs.hidden.py
    performance: pairs.performance.py
    bruteForce: pairs.brute.py
    timeLimitMs: 3000
    prompt: |-
      **Task 2: two-item bundles.** A shop sells N items. Item I costs A[I]. A bundle is
      a pair of different items (P, Q) with 0 ≤ P < Q < N. It qualifies for a discount
      when A[P] + A[Q] ≤ K.

      Write a function:

      ```python
      def count_bundles(A: list[int], K: int) -> int
      ```

      that returns the number of bundles that qualify. The count can exceed 2^31.

      For example, given `A = [4, 1, 7, 3, 2]` and `K = 6`, the function should return
      `5`. The pairs of prices are (4, 1), (4, 2), (1, 3), (1, 2) and (3, 2).

      Write an efficient algorithm for the following assumptions:

      - N is an integer within the range [1..100,000].
      - Each element of list A is an integer within the range [-1,000,000,000..1,000,000,000].
      - K is an integer within the range [-1,000,000,000..1,000,000,000].

      Expected worst-case time complexity is O(N * log(N)).
    hints:
      - The order of the items doesn't matter for the count. The log in the complexity line points at sorting.
      - In a sorted list, if the smallest and largest prices fit, the smallest fits with every price between them too.
      - Use two pointers from both ends. When the pair fits, add `right - left` and move `left`. Otherwise move `right`.

  - type: code-challenge
    id: task-rooms
    concept: interview.expected-complexity
    difficulty: 4
    language: python
    starter: rooms.starter.py
    solution: rooms.solution.py
    tests: rooms.tests.py
    hidden: rooms.hidden.py
    performance: rooms.performance.py
    bruteForce: rooms.brute.py
    timeLimitMs: 3000
    prompt: |-
      **Task 3: rooms with cleaning.** A study centre has N bookings. Booking I uses a
      room from minute S[I] up to minute E[I]. After a booking ends, its room needs C
      minutes of cleaning. If a booking ends at E, its room is free again from minute
      E + C.

      Write a function:

      ```python
      def rooms_needed(S: list[int], E: list[int], C: int) -> int
      ```

      that returns the smallest number of rooms that can hold every booking.

      For example, given `S = [30, 0, 60, 10]`, `E = [75, 40, 90, 20]` and `C = 10`, the
      function should return `2`. One room takes the bookings from 0 and 60. The other
      takes the bookings from 10 and 30.

      Write an efficient algorithm for the following assumptions:

      - N is an integer within the range [1..100,000].
      - Lists S and E have the same length N.
      - 0 ≤ S[I] < E[I] ≤ 1,000,000,000 for every I.
      - C is an integer within the range [0..1,000,000].

      Expected worst-case time complexity is O(N * log(N)).
    hints:
      - Treat each booking as lasting until E + C. Now it's the classic question of the most bookings that overlap.
      - Take the bookings in order of start. A new one can reuse the room that frees up first, if it's free by then.
      - Keep the free-again minutes in a `heapq` heap. `heap[0]` is the earliest. Sorting a list for each booking, or `pop(0)`, costs O(N) each time.

recap:
  - Read the complexity line first and let it name the algorithm.
  - In Python, `in` on a list and `pop(0)` are linear. Sets, deques and heaps aren't.
  - Bank a correct slow solution when the fast idea is late.

recall:
  - id: card-in-list
    concept: interview.expected-complexity
    front: Why does `if x not in seen` time out when `seen` is a list of 100,000 values?
    back: >-
      `in` on a list checks each item in turn, so a loop over N values costs O(N²). A set
      answers the same question in O(1) on average.
  - id: card-pop-front
    concept: interview.expected-complexity
    front: What does `queue.pop(0)` cost on a Python list, and what do you use instead?
    back: >-
      O(N), because every other item shifts left. Use `collections.deque` and
      `popleft()`, or a `heapq` heap when you need the smallest item.
  - id: card-big-ints
    concept: interview.hidden-tests
    front: A count can reach 5 billion. What changes in Python compared with JavaScript?
    back: >-
      Nothing to guard against. Python's `int` is exact at any size, while a JavaScript
      number is exact only up to 2^53.
  - id: card-recursion
    concept: interview.hidden-tests
    front: Your recursive Python solution passes every example and fails on the largest hidden input. Why?
    back: >-
      Python stops at about 1,000 nested calls with a `RecursionError`. Rewrite the
      recursion as a loop with your own stack.

