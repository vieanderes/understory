term: key-value store
aka: [key-value database, KV store]
short: A data store that saves and fetches values by one unique key, and little else.
explain: |
  Give it a key, get the value. No queries across values, no joins. Because it asks so
  little, it can be very fast and spread across many machines.

  It fits sessions, caches, feature settings and counters. If you ever need "all values
  where...", you need another store, or you build and maintain your own index.
analogy: A coat check. Hand over ticket 42, get coat 42. Don't ask for all the blue coats.
usage: Keep the rate-limit counters in a key-value store with a short expiry.
related: [nosql, cache, hash-map, document-database]
level: 2
lessons: [sysdesign.sql-or-nosql]
