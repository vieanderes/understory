summary: >-
  Flexbox lays out a row or a column of boxes and shares the space between them. You turn it
  on with `display: flex` on a parent, which becomes the **flex container**. Its direct
  children become **flex items**. The direction they run is the **main axis**; the direction
  across it is the **cross axis**. `justify-content` places items along the main axis and
  `align-items` across it.


  The real work of flexbox is sizing. Each item starts from a size called its **flex basis**.
  The container adds up those sizes, compares the total with its own width, and then grows or
  shrinks the items to fit, following their `flex` values. Once you know that one loop, every
  width a flex row produces can be worked out on paper.


  Reach for flexbox for one-dimensional layouts: a nav bar, a toolbar, a button beside a
  field, a card whose footer sits at the bottom, centring. When items must line up in rows
  **and** columns at once, like a card gallery, grid in the next lesson is the better tool.
remember:
  - '`display: flex` on a parent turns its direct children into flex items laid out along the main axis, a row by default.'
  - '`justify-content` works along the main axis and `align-items` across it, and `flex-direction: column` swaps which way that is.'
  - '`flex` sets grow, shrink and basis: `flex: 1` is `1 1 0%`, `flex: auto` is `1 1 auto`, and `flex: none` is `0 0 auto`.'
  - Spare space is shared out by grow factors, and missing space is taken back by shrink factor times basis, so bigger items shrink more.
  - A flex item won't shrink below its content by default, because its `min-width` is `auto`; `min-width` of 0 removes that floor.
  - Items stretch across the cross axis by default, which is why cards in a flex row come out the same height.
  - '`gap` spaces items only between each other, and margins between flex items never collapse.'
  - '`order` and `row-reverse` change what the eye sees, not the order keyboards and screen readers follow.'
sections:
  - title: The sizing loop, step by step
    body: |-
      For every flex row, the browser runs the same steps.

      1. Find each item's **flex basis**, its starting size. With `flex-basis: auto`, that's
         the item's `width`, or its content's size if it has no width. `flex: 1` sets the
         basis to 0.
      2. Add up the bases and the gaps, and subtract from the container's width. The result
         is the **free space**. It can be positive (room left) or negative (too much stuff).
      3. If it's positive, share it out in proportion to each item's `flex-grow`.
      4. If it's negative, take it back in proportion to `flex-shrink` **times the basis**.
      5. If an item hits its `min-width` or `max-width`, freeze it there and share the rest
         again among the others.

      Here's the difference between `flex: 1` and `flex: auto` in a 600px row, where the two
      items have widths of 100px and 300px:

      ```css
      .row { display: flex; width: 600px; }
      .a { width: 100px; }
      .b { width: 300px; }

      /* with flex: auto on both: bases 100 + 300, 200px free, 100 each
         -> 200px and 400px */
      /* with flex: 1 on both: bases 0 + 0, 600px free, 300 each
         -> 300px and 300px */
      ```

      Gaps come out before sharing. Three `flex: 1` items in a 600px row with `gap: 20px`
      share 560px, about 186.67px each.

      Shrinking uses the basis as a weight. In a 400px row, items with `flex: 0 1 400px` and
      `flex: 0 1 200px` overflow by 200px. The weights are 400 and 200, so the first gives up
      two thirds: they end at 266.67px and 133.33px. Big items lose more, so small ones like
      icons stay usable. Set `flex-shrink: 0`, or `flex: none`, on anything that must never
      shrink.

      Step 5 in action: with `flex: 1` on two items in a 600px row, and `max-width: 100px`
      on the first, the first freezes at 100px and the second takes the other 500px.
  - title: Why an item refuses to shrink
    body: |-
      Ordinary blocks have a `min-width` of 0. Flex items don't: their `min-width` starts as
      `auto`, which means "no narrower than my content". For text, the content's smallest size
      is its longest word. With `white-space: nowrap`, it's the whole line.

      That floor is why a long title shoves its neighbours off a phone, and why one long word
      can break a row:

      ```html
      <style>
        .row { display: flex; width: 200px; }
        .name { flex: 1; }
        .time { flex: none; }
      </style>
      <div class="row">
        <div class="name">Supercalifragilisticexpialidocious</div>
        <div class="time">4:05</div>
      </div>
      <!-- .name stays as wide as the word, about 215px, and the row overflows -->
      ```

      Three things lower the floor:

      - `min-width: 0` on the item, the usual fix. The item then shrinks to fit, and the word
        overflows inside it, where `overflow` or an ellipsis can deal with it.
      - Any `overflow` other than `visible` on the item.
      - A `width` smaller than the content. The automatic floor is the smaller of the content
        size and the width you set, so `width: 50px` wins.

      The floor only applies to the item itself. In the lesson, the title had the ellipsis,
      but `.info` was the flex item, so `.info` needed `min-width: 0`. When a row misbehaves,
      find the direct child of the flex container: that's where the fix goes.

      In a column, the same rule applies to height. A flex item's `min-height` is `auto`, so a
      scrolling panel inside a column layout keeps growing instead of scrolling until it gets
      `min-height: 0`.
  - title: Alignment beyond the centre
    body: |-
      The default for `align-items` behaves as `stretch`: each item grows across the cross
      axis to fill the line. That's why cards in a flex row match the tallest card, with no
      extra code. A fixed `height` on an item cancels its stretch, and any other
      `align-items` value, such as `center`, makes items only as tall as their content.

      `align-self` overrides `align-items` for one item:

      ```css
      .toolbar { display: flex; align-items: stretch; }
      .toolbar .badge { align-self: center; }  /* only the badge is centred */
      ```

      **Auto margins** are the most useful trick in flexbox. In a flex container, an `auto`
      margin swallows all the free space on its side. So `margin-left: auto` on the last item
      pushes it to the far end, and everything before it stays at the start:

      ```css
      .bar { display: flex; gap: 16px; }
      .bar .account { margin-left: auto; }
      /* logo and links on the left, the account link alone on the right */
      ```

      That's often better than `space-between`, which spreads every item and puts a single
      item at the start, not the end. `margin: auto` on a lone item centres it both ways,
      another way to centre anything.

      A column needs room to align in. `justify-content: center` in a column only moves items
      when the container is taller than its content, so give it a `height` or `min-height`
      first. Without one, the column is exactly as tall as its items and there's nothing to
      share.
  - title: Wrapping, order and what counts as an item
    body: |-
      By default all items stay on one line and shrink to fit. `flex-wrap: wrap` lets them
      move to a new line instead. Each line then shares out its own space, so a lone item on
      the last line grows to fill the whole width:

      ```css
      .tags { display: flex; flex-wrap: wrap; width: 250px; }
      .tag { flex: 1 1 100px; }
      /* three tags: two of 125px on the first line, one of 250px on the second */
      ```

      That's right for tags and buttons, wrong for a gallery where cards should line up in
      columns. For that, use grid.

      `order` moves an item without touching the HTML, and `flex-direction: row-reverse`
      flips a whole row. Both change only what the eye sees. Tabbing with the keyboard and
      reading with a screen reader still follow the HTML. A form whose fields look like
      name, email, message but tab as message, name, email is disorienting, and it can fail
      the accessibility requirement that focus order keeps meaning. Change the HTML order
      when the order matters.

      Two details of what counts as a flex item:

      - Every direct child is blockified. A `span` inside a flex container computes to
        `display: block`, so it takes width and height.
      - Loose text directly inside the container becomes an item of its own. In
        `Total <b>£48</b>` inside a flex container with `gap: 10px`, the word "Total" and
        the `b` are two items with a 10px gap, and the space between them is dropped.
pitfalls:
  - '**Putting `display: flex` on the child instead of the parent.** Flex arranges the children of the element that has it. Put it on the container of the things you want in a row.'
  - '**Adding `min-width: 0` to the wrong element.** The floor belongs to the flex item, the direct child of the flex container, not to the text deep inside it.'
  - '**Expecting `justify-content: center` to centre a column vertically with no height.** The column is only as tall as its items, so there''s nothing to share. Give the container a `height` or `min-height`.'
  - '**Using `space-between` to push one item to the end.** With a single item it sits at the start. Use `margin-left: auto` on the item instead.'
  - '**Reordering with `order` for layout convenience.** Keyboard and screen reader order stays with the HTML. Reorder the HTML when order carries meaning.'
  - '**Icons that squash.** A small icon in a crowded row shrinks with the rest. Give it `flex: none` or `flex-shrink: 0`.'
interview:
  - question: "What's the difference between `flex: 1` and `flex: auto`?"
    answer: >-
      Both let items grow and shrink, but they start from different sizes. `flex: 1` is
      `1 1 0%`: the basis is zero, so the whole row is shared out equally and the items end
      up the same width whatever their content. `flex: auto` is `1 1 auto`: each item starts
      from its own width or content size, and only the space left over is shared equally. In
      a 600px row with items of 100px and 300px, `flex: 1` gives 300 and 300, and
      `flex: auto` gives 200 and 400. I use `flex: 1` for equal columns and `flex: auto`
      when items should keep their natural proportions. With `flex: 1`, remember the
      automatic minimum still stops an item going below its longest word.
  - question: Why doesn't my text ellipsis work inside a flex item?
    answer: >-
      Because the flex item won't shrink below its content, so there's never anything to
      cut. A flex item's `min-width` defaults to `auto`, which means its content's minimum
      size. With `white-space: nowrap`, that's the full line of text. The item stays that
      wide, the row overflows, and `text-overflow: ellipsis` never triggers. The fix is
      `min-width: 0` on the flex item itself, the direct child of the container, not on the
      text element inside it. `overflow: hidden` on the item works too, since it also removes
      the automatic minimum. The same applies to `min-height` in column layouts with a
      scrolling area.
  - question: How do you centre an element horizontally and vertically?
    answer: >-
      Make the parent a flex container with `justify-content: center` and
      `align-items: center`. That centres the children along both axes, whatever their size,
      and it keeps working when the content changes. The parent needs a height taller than
      the child, or there's no vertical space to share. An alternative is `margin: auto` on a
      single flex item, which absorbs the free space on all four sides. For horizontal centring only, a block with a
      width and `margin: 0 auto` still works without any flex at all.
