deepDive: >-
  `try` can have two more parts. `else:` runs only when nothing was raised, and `finally:`
  runs whatever happened, even after a `return`, which suits clean-up. `except ValueError as
  error:` gives you the exception object, and `raise ... from error` keeps the original
  cause in the traceback.


  Python 3.11 and later also mark the failing part of a line with `^` and `~` under it,
  which the tracebacks above leave out. Catching `Exception` is sometimes right
  at the very top of a program, to log and exit; deep inside, catch the narrowest type you
  can handle. `logging.exception` logs a message with the full traceback.
