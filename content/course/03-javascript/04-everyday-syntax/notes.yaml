summary: >-
  This lesson's symbols, `&&`, `||`, `!`, `? :`, `?.`, `??`, `switch`, `break` and
  `continue`, appear in nearly every file of a real codebase. They look like small
  conveniences, but each has a precise rule, and most production bugs with them come from
  a fuzzy idea of that rule: `||` treating 0 as missing, `?.` hiding a bug it should have
  surfaced, a `switch` case running into the next.


  The key idea underneath is that `&&`, `||` and `??` don't return booleans. They return one
  of their operands, and they stop evaluating as soon as the answer is known. That makes them
  tools for defaults and guards, not only for conditions. `??` and `?.` are the modern pair
  for data with gaps: they react to `null` and `undefined` only, never to 0, `""` or
  `false`.


  Declarations belong in the same everyday toolkit, and they're a favourite interview topic:
  `const` by default, `let` when a value changes, and `var` only in old code. The difference
  shows in hoisting and the **temporal dead zone**, covered below with the rest of the
  precise rules.
remember:
  - '`a || b` returns `a` if it is truthy, otherwise `b`; `a && b` returns `a` if it is falsy, otherwise `b`; neither evaluates `b` unless needed.'
  - '`x ?? y` returns `y` only when `x` is `null` or `undefined`, so use it for defaults where 0, `""` or `false` are real values.'
  - '`a?.b` gives `undefined` when `a` is `null` or `undefined` and skips the rest of the chain; it guards only the link it is written on.'
  - A `switch` compares with `===` and runs on from the matching case until a `break` or `return`.
  - '`let` and `const` are block-scoped and hoisted into a temporal dead zone, so reading them before their declaration throws a `ReferenceError`.'
  - '`var` is function-scoped and hoisted as `undefined`, and function declarations are hoisted whole, so they can be called before the line that defines them.'
  - '`const` stops reassignment of the name, not changes to the object it points to.'
  - '`??` cannot be mixed with `||` or `&&` without brackets; it is a `SyntaxError`.'
sections:
  - title: Short-circuiting and what the operators return
    body: |-
      `||` and `&&` evaluate left to right and stop as soon as the result is decided. They
      hand back the operand that decided it, not `true` or `false`.

      ```js
      console.log("" || "guest"); // guest
      console.log("Ana" || "guest"); // Ana
      console.log(0 || null); // null, the last operand when none is truthy
      console.log("Ana" && "Ana".length); // 3
      console.log(0 && "never evaluated"); // 0

      console.log(0 || 5, 0 ?? 5); // 5 0
      console.log("" || "x", "" ?? "x"); // x (then an empty string)
      console.log(null ?? undefined ?? "fallback"); // fallback
      ```

      Short-circuiting is how guards work: `user && user.name` never reads `.name` of `null`,
      and `isValid(form) && submit(form)` only submits when validation passes. That second
      style is compact but hides a side effect in an expression, so many teams prefer an `if`
      for anything that does work.

      Precedence matters when you combine them. `&&` binds tighter than `||`, so
      `a || b && c` means `a || (b && c)`. The language forbids mixing `??` with either
      without brackets, because the intent would be unclear:

      ```js
      // null || 1 ?? 2;  SyntaxError: Unexpected token '??'
      console.log((null || 1) ?? 2); // 1
      ```

      There are assignment forms too. `a ||= b`, `a &&= b` and `a ??= b` assign only when the
      operator would pick `b`, and skip the assignment otherwise:

      ```js
      const settings = { volume: 0, theme: null };
      settings.volume ||= 5; // 0 is falsy, so it becomes 5
      settings.theme ??= "light"; // null, so it becomes "light"
      console.log(settings); // { volume: 5, theme: 'light' }
      ```

      The first line is the classic bug: a muted volume of 0 becomes 5. `??=` would have kept
      it.
  - title: Optional chaining in depth
    body: |-
      `?.` checks the value on its left. If that value is `null` or `undefined`, the whole
      rest of the chain is skipped and the expression gives `undefined`. Otherwise it carries
      on normally. It has three forms: `obj?.prop`, `obj?.[key]` and `fn?.(args)`.

      ```js
      const order = { customer: { name: "Ana" }, items: [] };

      console.log(order.address?.city); // undefined
      console.log(order.address?.city.toUpperCase()); // undefined, the chain stopped
      console.log(order.items?.[0]); // undefined
      console.log(order.cancel?.()); // undefined, no such method

      try {
        console.log(order.customer?.address.city);
      } catch (error) {
        console.log(error.message); // Cannot read properties of undefined (reading 'city')
      }
      ```

      The last case is the one to understand. `order.customer` exists, so `?.` lets the chain
      continue, and `.address` is `undefined`. Reading `.city` of that throws, because no
      `?.` guards that link. Put `?.` after every value that may legitimately be missing, and
      nowhere else.

      Two limits. `?.` can't be used on the left of `=`: `order?.status = "paid"` is a
      `SyntaxError`. And `fn?.()` only guards against a missing function; if the property
      holds a number, calling it still throws "is not a function".

      Overuse is a real problem in production code. If an order must always have a customer,
      writing `order.customer?.name` turns a data bug into a quiet `undefined` that surfaces
      three screens later as a blank label. Use `?.` where absence is expected and normal, and
      let the code fail loudly where it isn't.
  - title: var, let, const, hoisting and the temporal dead zone
    body: |-
      Before any code in a scope runs, the engine registers every declaration in it. That is
      **hoisting**. What differs is the state each kind of name starts in:

      - **Function declarations** are ready with their body, so you can call them earlier.
      - **`var`** starts as `undefined`. It's scoped to the whole function, ignores blocks, and
        can be declared twice.
      - **`let` and `const`** exist but are uninitialised until their line runs. Touching them
        before that throws a `ReferenceError`. That window is the **temporal dead zone**.
        They're scoped to the nearest block, and redeclaring one is a `SyntaxError`.

      ```js
      console.log(total); // undefined, var is hoisted as undefined
      var total = 10;

      console.log(greet()); // hello, the whole function is hoisted
      function greet() {
        return "hello";
      }

      try {
        console.log(count);
      } catch (error) {
        console.log(error.message); // Cannot access 'count' before initialization
      }
      let count = 1;

      const cart = [];
      cart.push("tea"); // allowed, the array itself can change
      console.log(cart); // [ 'tea' ]
      try {
        cart = ["cake"];
      } catch (error) {
        console.log(error.message); // Assignment to constant variable.
      }
      ```

      The dead zone exists to catch mistakes. With `var`, reading too early gives `undefined`
      and the bug travels on. With `let` it fails on the line at fault. Even `typeof count`
      throws inside the dead zone, unlike `typeof` on an undeclared name.

      Function expressions follow the rule of their variable: `const save = () => {}` can't
      be called before its line. In a classic browser script, a top-level `var` also becomes a
      property of `window`, while `let` and `const` do not. Modules never add globals.

      The modern default is `const` for everything, `let` when you reassign, and no `var`.
      Since `const` doesn't make objects immutable, freeze them or treat them as read-only by
      convention when that matters.
  - title: 'switch: fall-through, scoping and alternatives'
    body: |-
      A `switch` evaluates its expression once, compares it with each `case` using `===`,
      jumps to the first match, and runs from there until `break`, `return` or the end.
      Deliberate fall-through groups cases:

      ```js
      function deliveryDays(region) {
        switch (region) {
          case "england":
          case "wales":
            return 2;
          case "scotland":
            return 3;
          default:
            return 5;
        }
      }
      console.log(deliveryDays("wales")); // 2
      console.log(deliveryDays("Wales")); // 5, "Wales" !== "wales"
      ```

      All cases share one block, so `let` or `const` with the same name in two cases is a
      `SyntaxError`, and a `let` declared in one case is in its dead zone when another case
      runs. Wrap each case's body in braces, `case "wales": { ... }`, whenever it declares
      variables.

      When every case maps a value to a value, a lookup object or `Map` is often clearer and
      can't fall through:

      ```js
      const FEES = { standard: 3, express: 8 };
      const fee = (shipping) => FEES[shipping] ?? 0;
      console.log(fee("express"), fee("pigeon")); // 8 0
      ```

      Keep `switch` for branches that run different statements. In TypeScript, a `switch` on
      a union type with a `never` check in `default` makes the compiler flag any case you
      forgot, which the TypeScript chapters cover.

      For loops, `break` and `continue` affect the innermost loop. A **label** lets you leave
      an outer one: write `outer:` before the outer `for`, then `break outer`. And neither
      keyword works inside a `forEach` callback, since that's a function, not a loop body;
      use `for...of` when you need to stop early.
pitfalls:
  - '**Using `||` for defaults when 0 or `""` is valid.** `quantity || 1` turns a real 0 into 1, and `name || "Anonymous"` erases an empty name that was intended. Use `??`.'
  - '**Sprinkling `?.` everywhere.** It turns broken invariants into silent `undefined` values that fail far from the cause. Guard only what may legitimately be missing.'
  - '**Forgetting `break` in a `switch`.** The next case runs too, often with no error. End each case with `break` or `return`, and mark deliberate fall-through with a comment.'
  - '**Declaring variables in `switch` cases without braces.** Cases share one scope, so names clash or hit the temporal dead zone. Give each case its own `{ }` block.'
  - '**Reading a `let` or `const` before its line.** The temporal dead zone throws a `ReferenceError`. Move the declaration up, or move the use below it.'
  - '**Thinking `const` freezes the value.** `const cart = []` still allows `cart.push(...)`. Use `Object.freeze` for shallow immutability, or copy on update.'
interview:
  - question: What's the difference between `??` and `||`?
    answer: >-
      `||` falls back for any falsy value; `??` falls back only for `null` and `undefined`.
      So `0 || 5` is 5 but `0 ?? 5` is 0, and the same goes for `""` and `false`. That makes
      `??` the right default operator whenever those values are meaningful: a quantity of 0,
      a volume of 0, an empty display name the user chose. `||` still fits when every falsy
      value really means "nothing here", such as an empty search string. Two details: `??`
      can't be mixed with `||` or `&&` without brackets, it's a syntax error, and there's
      `??=` for assigning a default only when the property is nullish.
  - question: Explain hoisting and the temporal dead zone.
    answer: >-
      Hoisting means every declaration in a scope is registered before the scope's code runs,
      so the names exist from the start. The difference is initialisation. A `var` is
      initialised to `undefined`, so reading it early silently gives `undefined`. A function
      declaration is initialised with its body, so it can be called before its line. `let`,
      `const` and `class` are hoisted but left uninitialised, and any access before the
      declaration runs throws a `ReferenceError`; that span is the temporal dead zone. Even
      `typeof` throws there. The TDZ is a feature: it makes use-before-declaration fail at
      the line at fault instead of letting `undefined` travel through the program.
  - question: When do you use var, let and const?
    answer: >-
      I use `const` by default, `let` when the variable is reassigned, such as a loop counter
      or an accumulator, and `var` never in new code. `const` and `let` are block-scoped, so
      a variable declared in an `if` or a loop stays there, and a `for (let i ...)` loop gets
      a fresh binding per iteration, which is what closures in the loop expect. `var` is
      function-scoped, can be redeclared, and at the top of a classic script becomes a
      property of `window`. `const` signals to the reader that the name won't be pointed
      elsewhere, but it doesn't make the object immutable: `push` on a `const` array works.
  - question: What does optional chaining do, and when shouldn't you use it?
    answer: >-
      `a?.b` evaluates to `undefined` instead of throwing when `a` is `null` or `undefined`,
      and it short-circuits the rest of the chain, so `a?.b.c` is safe when `a` is missing.
      It also works for brackets, `a?.[i]`, and calls, `a.method?.()`. It only guards the
      link it's written on: if `a` exists and `b` is missing, `.c` still throws. I don't use
      it where the value is required by the data model, because it converts a bug into a
      silent `undefined` that surfaces somewhere else, often as blank UI. It's for data that
      is optional by design, such as an optional address or a feature a browser may lack.
  - question: Do `&&` and `||` return booleans?
    answer: >-
      No, they return one of their operands. `a || b` evaluates `a`; if it's truthy it
      returns `a` without evaluating `b`, otherwise it returns `b`. `a && b` returns `a` if
      it's falsy, otherwise `b`. So `"Ana" || "guest"` is `"Ana"`, and `user && user.name` is
      either a falsy `user` or the name. That's why they work as defaults and guards, and why
      in JSX `{count && <Badge />}` renders a literal 0 when `count` is 0. When I need a real
      boolean I write `Boolean(x)` or `count > 0` explicitly.
