    note: Every instruction used here, `FROM`, `WORKDIR`, `COPY`, `RUN` and `CMD`.
    primary: true
    verified: true
  - kind: docs
    title: What is Docker?
    authors: Docker
    venue: Docker Docs
    url: https://docs.docker.com/get-started/docker-overview/
    note: Images, containers, and the namespaces that isolate them.
    primary: true
    verified: true
  - kind: docs
