id: design.accessibility-foundations
title: Who accessibility is for
objective: Describe how people use a page with assistive technology, and give every control a role, a name and a state.
level: essential
minutes: 10
concepts: [design.assistive-technology, design.accessible-name, design.roles-and-states]
prerequisites: [html.semantic-structure, react.props-and-composition]
opening:
  text: >-
    You'll meet the people who use your pages without a mouse or a screen, and fix what they
    hear. It's the difference between a page some people can't use and one everyone can.

steps:
  - type: prose
    id: who-it-serves
    body: >-
      **Accessibility** means people with disabilities can use what you build. That's about
      one person in six.


      Think of someone who is blind, and listens to the page. Someone with a tremor, who
      can't aim a mouse. Someone with low vision, zoomed to 400%. And the rest of us, some
      days: a broken wrist, a phone in bright sun, a baby on one arm.

  - type: prose
    id: assistive-technology
    body: >-
      **Assistive technology** is software or hardware that helps someone use a device. The
      best known is a **screen reader**: it reads the page aloud and takes commands from the
      keyboard. VoiceOver comes with every Mac and iPhone.


      A screen reader never sees your pixels. It reads the accessibility tree you met in the
      HTML chapter. Each entry has a **role**, what it is, and a **name**, what it's called.

  - type: multiple-choice
    id: pick-what-it-hears
    concept: design.assistive-technology
    difficulty: 1
    language: html
    code: |
      <button>Send</button>
    question: A screen reader lands on this. What does it say?
    choices:
      - text: '"Send, button"'
        correct: true
        feedback: >-
          Right. The name, then the role, both straight from the tree.
      - text: '"Send"'
        feedback: >-
          The name alone would sound like text. The role tells the listener they can press it.
      - text: Nothing, it only reads text
        feedback: >-
          It reads every control too. Buttons, links and fields are what it's for.

  - type: prose
    id: what-aria-is
    body: >-
      Sometimes the tree needs help. An icon button has no text, so it has no name.


      **ARIA** is a set of HTML attributes that fix the tree. `aria-label="Play"` gives a
      name, and `role="button"` gives a role. ARIA changes only what's announced. It adds no
      keys and no behaviour, so a real `button` beats ARIA on a `div`.

  - type: playground
    id: name-the-icon-buttons
    concept: design.accessible-name
    difficulty: 2
    prompt: >-
      Both buttons show only a picture, so the tree names neither. Give the first
      `aria-label="Play"` and the second `aria-label="Next track"`. Watch the attributes
      appear in the tree.
    html: |
      <p>Now playing: Rain on the Roof</p>
      <button class="play">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
      </button>
      <button class="next">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M5 4v16l11-8zM17 4h3v16h-3z"/></svg>
      </button>
    css: |
      body { font-family: sans-serif; }
      button { padding: 8px; border: 2px solid #1d4ed8; background: white; }
      svg { display: block; fill: #1d4ed8; }
    editable: [html]
    showTree: true
    checks:
      - label: The first button is named Play
        selector: 'button.play[aria-label="Play"]'
        count: 1
      - label: The second button is named Next track
        selector: 'button.next[aria-label="Next track"]'
        count: 1
    solution:
      html: |
        <p>Now playing: Rain on the Roof</p>
        <button class="play" aria-label="Play">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
        </button>
        <button class="next" aria-label="Next track">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M5 4v16l11-8zM17 4h3v16h-3z"/></svg>
        </button>
    hints:
      - The attribute goes on each `button`, not on the picture.
      - The picture has `aria-hidden`, so the tree skips it.
      - '`<button class="play" aria-label="Play">` names the first one.'

  - type: prose
    id: label-beats-text
    body: >-
      Here's a catch. `aria-label` doesn't add to the visible text. It replaces it.


      So `<button aria-label="Submit">Send message</button>` is announced as "Submit". A
      voice control user says "click Send message", and nothing happens. Visible text is
      already a name. Keep `aria-label` for controls with no text at all.

  - type: ai-review
    id: review-label-hides-count
    concept: design.accessible-name
    difficulty: 2
    language: tsx
    request: Add a basket link that shows how many items are in it.
    flawClass: logic
    code: |
      function BasketLink({ count }: { count: number }) {
        return (
          <a href="/basket" aria-label="Basket">
            Basket ({count} items)
          </a>
        );
      }
    prompt: >-
      An assistant wrote this. It looks right, and a test finds the link by its text. A
      screen reader user never hears the count. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`aria-label` replaces the visible text'
        correct: true
        feedback: >-
          Yes. The name is only "Basket", so the count is never read. Drop the label.
      - text: The link needs `role="link"` too
        feedback: >-
          An `a` with `href` is a link already. The trouble is the name, not the role.
      - text: The count needs its own `aria-label`
        feedback: >-
          Another label would replace text again. The visible text was a good name all along.
    fix: |
      function BasketLink({ count }: { count: number }) {
        return (
          <a href="/basket">
            Basket ({count} items)
          </a>
        );
      }

  - type: prose
    id: states
    body: >-
      A **state** is how a control is right now: pressed, expanded, checked. A checkbox
      reports its own. A button that toggles doesn't know it toggles.


      So you add `aria-pressed="false"`, and your script flips it to `"true"`. A class like
      `on` only changes pixels. Style by the attribute instead, and the look and the
      announcement can't drift apart.

  - type: playground
    id: announce-the-toggle
    concept: design.roles-and-states
    difficulty: 3
    prompt: >-
      This mute switch is a `div`, so it has no role and no state. Make it a `button` with
      `aria-pressed="false"`. Keep its class. Then press it and watch the attribute flip.
    html: |
      <p>Chat notifications</p>
      <div class="toggle">Mute</div>
    css: |
      body { font-family: sans-serif; }
      .toggle { padding: 8px 16px; border: 2px solid #0f766e; background: white; color: #0f766e; }
      .toggle[aria-pressed="true"] { background: #0f766e; color: white; }
    js: |
      // getAttribute reads an attribute, and setAttribute changes it.
      const toggle = document.querySelector(".toggle");
      toggle.addEventListener("click", () => {
        const on = toggle.getAttribute("aria-pressed") === "true";
        toggle.setAttribute("aria-pressed", on ? "false" : "true");
      });
    editable: [html]
    showTree: true
    checks:
      - label: The switch is a `button`
        selector: button.toggle
        count: 1
      - label: It starts with `aria-pressed="false"`
        selector: 'button.toggle[aria-pressed="false"]'
        count: 1
      - label: No `div` is left
        selector: div
        count: 0
    solution:
      html: |
        <p>Chat notifications</p>
        <button class="toggle" aria-pressed="false">Mute</button>
    hints:
      - Change the tag, then add one attribute.
      - Both the start tag and the end tag become `button`.
      - '`<button class="toggle" aria-pressed="false">Mute</button>`.'

  - type: explain-back
    id: explain-div-toggle-is-silent
    concept: design.roles-and-states
    difficulty: 3
    prompt: >-
      A "Mute" switch is a `div` whose click handler swaps a class named `on`. Why does a
      screen reader user hear nothing useful?
    rubric:
      - A screen reader reads the accessibility tree, and a `div` has no role there.
      - A class changes the pixels, not the tree, so on and off sound the same.
      - A `button` gives the role, and `aria-pressed` gives the state.
    modelAnswer: >-
      The screen reader reads the tree, not the pixels. A `div` has no role, so nothing says
      it can be pressed. The `on` class changes the colour and nothing else, so muted and
      unmuted sound identical. A `button` brings the role and the keys, and `aria-pressed`
      carries the state that flips.

recap:
  - Picture who uses a page by ear, by keyboard or zoomed in, and why.
  - Name icon buttons with `aria-label`, and leave visible text alone.
  - Give a toggle a real role and an `aria-pressed` state that flips.

recall:
  - id: card-what-a-screen-reader-reads
    concept: design.assistive-technology
    front: What does a screen reader read, and what does it announce for each control?
    back: >-
      The accessibility tree, not the pixels. For each control it says the name, then the
      role, such as "Send, button".
  - id: card-aria-changes
    concept: design.accessible-name
    front: What does ARIA change, and what doesn't it change?
    back: >-
      It changes what the accessibility tree announces: names, roles and states. It adds no
      keyboard behaviour.
  - id: card-label-replaces
    concept: design.accessible-name
    front: 'Why is `<a aria-label="Basket">Basket (3 items)</a>` a bug?'
    back: >-
      `aria-label` replaces the visible text, so the count is never announced.
  - id: card-state-in-step
    concept: design.roles-and-states
    front: Why does a toggle button need `aria-pressed` when a checkbox needs nothing?
    back: >-
      A checkbox reports its own state. A button doesn't know it toggles, so you set and flip
      the state.

