term: statement
short: One complete instruction in a program, such as making a variable or running an if.
explain: |
  A program is a list of instructions, run from the top down. Each one is a statement:
  `let total = 0;`, an `if` with its block, `return total;`. Many end with a semicolon.

  A statement does something. It doesn't produce a value you can store. That's why
  `const x = if (done) { ... }` is a syntax error. Most statements hold expressions inside
  them.
analogy: A step in a recipe. "Preheat the oven" is a whole step, while "200 degrees" is only part of one.
example:
  language: js
  code: |
    let total = 0;               // statement
    for (const item of cart) {   // statement
      total += item.price;       // statement
    }
    console.log(total);          // statement
usage: Put each statement on its own line, because three on one line hides where it breaks.
twin:
  term: expression
  difference: A statement is a whole instruction that does something. An expression is a piece that works out to a value, and statements are often built around one.
related: [expression, if-statement, syntax-error]
level: 2
lessons: [basics.operators, basics.functions]
