id: lowest-free-ticket
title: LowestFreeTicket
topic: counting-elements
difficulty: easy
type: algorithmic
recommendedMinutes: 20
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A cloakroom gives out numbered tickets. The numbers still in guests' hands are listed in
  an array A of N integers. Faulty scanners also log zero and negative numbers, which are
  not tickets.

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the lowest ticket number (greater than 0)
  that nobody holds.

  For example, given A = [2, 5, 1, 2, 7, 3], the function should return 4.

  Given A = [1, 2, 3], the function should return 4.

  Given A = [−4, 0], the function should return 1.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [−1,000,000..1,000,000].
examples:
  - { args: [[2, 5, 1, 2, 7, 3]], expected: 4 }
  - { args: [[1, 2, 3]], expected: 4 }
  - { args: [[-4, 0]], expected: 1 }
timeLimitMs: 400
tests:
  - name: extreme_single
    description: a single element
    group: correctness
    cases:
      - { args: [[1]], expected: 2 }
      - { args: [[2]], expected: 1 }
      - { args: [[-1000000]], expected: 1 }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [[3, 1, 2, 5]], expected: 4 }
      - { args: [[1, 1, 1, 1]], expected: 2 }
  - name: extreme_min_max_value
    description: minimal and maximal values
    group: correctness
    cases:
      - { args: [[-1000000, 1000000]], expected: 1 }
      - { args: [[1, 1000000]], expected: 2 }
  - name: positive_only
    description: shuffled sequence 1..100 without one number
    group: correctness
    cases:
      - generate: { seed: 11, args: [{ kind: permutation, n: 100, drop: 1 }] }
  - name: negative_only
    description: only negative numbers and zero
    group: correctness
    cases:
      - generate: { seed: 12, args: [{ kind: ints, n: 100, min: -1000000, max: 0 }] }
  - name: medium
    description: chaotic sequences, length about 10,000
    group: performance
    cases:
      - generate: { seed: 21, args: [{ kind: ints, n: 10000, min: -1000, max: 1000 }] }
      - generate: { seed: 22, args: [{ kind: permutation, n: 10000, drop: 1 }] }
  - name: large_1
    description: chaotic plus sequence 1, 2, ..., 40,000 (without minus)
    group: performance
    cases:
      - generate: { seed: 31, args: [{ kind: permutation, n: 40000 }] }
  - name: large_2
    description: shuffled sequence 1, 2, ..., 100,000 (without one number)
    group: performance
    cases:
      - generate: { seed: 41, args: [{ kind: permutation, n: 100000, drop: 1 }] }
  - name: large_3
    description: chaotic, N = 100,000, values in [-1,000,000..1,000,000]
    group: performance
    cases:
      - generate: { seed: 51, args: [{ kind: ints, n: 100000, min: -1000000, max: 1000000 }] }
