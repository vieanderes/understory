id: algo.bfs-and-dfs
title: BFS and DFS
objective: Traverse grids and graphs, find shortest paths in unweighted graphs with BFS, and count connected regions with DFS.
level: advanced
minutes: 10
concepts: [algo.bfs-shortest-path, algo.dfs-components, algo.grid-graphs]
prerequisites: [algo.binary-search-patterns, cs.graphs]
opening:
  text: >-
    You'll solve maze and map problems, the most common graph questions in a coding round.
    The trick is seeing a grid as a graph, then picking the search that fits.

steps:
  - type: prose
    id: picture-graph-search
    body: |-
      A **graph** is things (nodes) joined by links (edges): rooms and doors, servers and
      cables, cells on a map. Two searches walk it:

      - **BFS**, breadth-first search, takes the oldest item from a queue. It spreads out
        in rings, nearest first.
      - **DFS**, depth-first search, takes the newest from a stack. It dives down one path
        before trying another.

      Signals: "fewest steps" wants BFS. "How many regions" or "reachable" suits either.

  - type: multiple-choice
    id: spot-bfs-or-dfs
    concept: algo.bfs-shortest-path
    difficulty: 1
    question: A robot needs the fewest moves across a warehouse grid. Which search?
    choices:
      - text: BFS, with a queue
        correct: true
        feedback: >-
          Yes. It reaches cells in order of distance, so the first arrival is shortest.
      - text: DFS, with a stack
        feedback: >-
          DFS finds a path, but it may wander a long way round first.
      - text: Binary search over the moves
        feedback: >-
          Binary search needs a yes-or-no check that flips once. Paths don't give one.

  - type: prose
    id: grid-as-graph
    body: |-
      A grid is a graph in disguise. Each open cell is a node. Its neighbours are the cells
      up, down, left and right. Walls aren't nodes at all.

      ```js
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (const [dr, dc] of steps) {
        const r = row + dr;
        const c = col + dc;
        if (grid[r]?.[c] === undefined) continue; // off the edge
      }
      ```

      `grid[r]?.[c]` gives `undefined`, not an error, when row `r` doesn't exist.

  - type: multiple-choice
    id: pick-why-seen
    concept: algo.grid-graphs
    difficulty: 2
    question: A grid has no walls at all. Why does the search still need a `seen` set?
    choices:
      - text: Every cell is its neighbour's neighbour
        correct: true
        feedback: >-
          Right. Without `seen`, two cells keep adding each other back forever.
      - text: To stop it walking off the edge
        feedback: >-
          The bounds check does that. `seen` guards against coming back to a cell.
      - text: It only matters when there are walls
        feedback: >-
          Walls block cells. Loops come from links going both ways, which every grid has.

  - type: prose
    id: why-bfs-is-shortest
    body: |-
      In BFS, each queue entry carries its distance: the start is 0, its neighbours 1, and
      so on. Distances leave the queue in order, never going down.

      So the first time BFS reaches a cell, it got there by a shortest path. Stop there and
      return the distance. Mark a cell as seen when you add it. Mark it later, and the queue
      fills with copies.

  - type: code-challenge
    id: write-fewest-steps
    concept: algo.bfs-shortest-path
    difficulty: 4
    language: python
    starter: steps.starter.py
    solution: steps.solution.py
    tests: steps.tests.py
    prompt: >-
      A warehouse robot starts at `S` and must reach `E`. Each string is a row, `#` is a
      shelf, `.` is floor. Write `fewest_steps(grid)` in Python: the fewest moves up, down,
      left or right, or `-1` if `E` can't be reached.


      `fewest_steps(["S.#", "..#", "#.E"])` is `4`.


      **Target:** O(rows × columns) for grids up to 300 by 300. The tests include a walled-in
      exit, a start next to the exit, and a full-size open floor. A `seen` list checked with
      `in` runs out of time there.
    hints:
      - Find `S`, then search outwards from it in rings. Which structure hands out the oldest item first?
      - '`collections.deque` with `popleft()`, holding `(row, col, distance)`. Keep `seen` as a `set` of `(row, col)`.'
      - 'Mark a cell seen when you add it. Return the distance the moment you take `E` off the queue.'

  - type: ai-review
    id: review-seen-list
    concept: algo.grid-graphs
    difficulty: 4
    language: js
    request: Write a function that counts the open cells reachable from the top-left corner.
    flawClass: performance
    code: |
      function reachable(grid) {
        const seen = ['0,0'];
        const queue = [[0, 0]];
        while (queue.length > 0) {
          const [row, col] = queue.shift();
          for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const r = row + dr, c = col + dc;
            const key = `${r},${c}`;
            if (grid[r]?.[c] !== '.' || seen.includes(key)) continue;
            seen.push(key);
            queue.push([r, c]);
          }
        }
        return seen.length;
      }
    prompt: >-
      An assistant wrote this. It's correct, and the 5 by 5 test ran in a blink. On an open
      300 by 300 grid it took 33 seconds. Tap the line at fault.
    lines: [9]
    reasons:
      - text: '`includes` scans the whole list every time'
        correct: true
        feedback: >-
          Exactly. 90,000 cells, each checked against a growing list. A `Set` took 48 ms.
      - text: The four directions should be a constant
        feedback: >-
          Making that small array each time costs a little. It isn't where 33 seconds go.
      - text: Template strings are slow to build
        feedback: >-
          Building a key is quick. Looking it up in a list of thousands is the slow part.
    verify:
      question: Which test would have flagged this before users did?
      choices:
        - text: A large open grid, run against a time limit
          correct: true
          feedback: >-
            Yes. Only many cells make the list scans add up.
        - text: A grid walled off at the start
          feedback: >-
            Nothing is reachable, so the list stays tiny and it's instant.
        - text: A grid with a single open cell
          feedback: >-
            One cell, one entry. It passes quickly and proves nothing about size.
    fix: |
      const seen = new Set(['0,0']);
      // ...then seen.has(key), seen.add(key) and seen.size

  - type: prose
    id: counting-islands
    body: |-
      Now count regions instead of finding a path. Picture a map where `X` is land. An
      **island** is land cells joined up, down, left or right.

      Scan every cell. Each land cell you haven't seen starts a new island: add one, then
      run a **DFS** from it that marks the whole island seen. Each cell is visited once, so
      it's O(rows × columns).

  - type: code-challenge
    id: write-count-islands
    concept: algo.dfs-components
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: islands.starter.py
      solution: islands.solution.py
      tests: islands.tests.py
    prompt: >-
      A map app labels each island. Write `countIslands(grid)`: each string is a row, `X` is
      land and `.` is water. Cells touching only at a corner are separate islands.


      `countIslands(['X.', '.X'])` is `2`.


      **Target:** O(rows × columns). The tests include an empty map, a check that the input
      isn't changed, and one 300 by 300 island. Recursing into every cell overflows the call
      stack there, so keep your own stack.
    hints:
      - Loop over every row and column. Most cells need nothing. Only unseen land matters.
      - Each unseen `X` means a new island. Count it, then mark every cell joined to it.
      - 'Start the marking with `const stack = [[row, col]];` and pop until it''s empty.'

  - type: explain-back
    id: explain-bfs-shortest
    concept: algo.bfs-shortest-path
    difficulty: 4
    audience: teammate
    kind: decide
    prompt: >-
      A teammate wants DFS for a maze's shortest route, since it's less code. Defend BFS,
      and say what it costs.
    rubric:
      - BFS hands out cells in order of distance, so its first arrival at the exit is by a shortest route.
      - DFS dives down one path, so its first arrival can be a long way round.
      - BFS queues each cell once, so it costs O(rows × columns), barely more code than DFS.
    modelAnswer: >-
      BFS finishes every cell one step away before any cell two steps away. So when it first
      reaches the exit, no shorter route can still be waiting. DFS follows whichever path it
      dived into, so its first arrival can be a long way round. BFS isn't much more code: a
      queue where DFS has a stack. Each cell is queued once, so it costs O(rows × columns).

recap:
  - Treat a grid as a graph, with neighbours worked out from the position.
  - Use BFS with a queue for the fewest steps between two cells.
  - Count regions by starting a DFS from each unseen cell.
recall:
  - id: card-grid-neighbours
    concept: algo.grid-graphs
    front: In a grid search, how do you find a cell's neighbours without an adjacency list?
    back: >-
      Add each of the four steps, like `[1, 0]` and `[0, -1]`, to its row and column. Skip
      anything off the grid, a wall, or already seen.
  - id: card-bfs-shortest
    concept: algo.bfs-shortest-path
    front: Why does BFS find the shortest path in an unweighted graph?
    back: >-
      Its queue visits nodes in order of distance, so the first arrival at the target is by a
      shortest route.
  - id: card-mark-on-add
    concept: algo.bfs-shortest-path
    front: When should BFS mark a cell as seen, and why?
    back: >-
      When it's added to the queue. Marking only when it's taken out lets the same cell be
      queued many times.
  - id: card-count-components
    concept: algo.dfs-components
    front: How do you count the islands on a grid?
    back: >-
      Scan every cell. Each unseen land cell adds one island, then a DFS from it marks the
      whole island seen.

