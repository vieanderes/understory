term: immutability
aka:
  - immutable
  - immutable update
short: Treating data as fixed once made, and producing a changed copy instead of editing the original.
explain: |
  Instead of `cart.push(item)`, you write `[...cart, item]`. The old cart stays as it was.
  The new one has the extra item.

  The payoff: "did anything change?" becomes a cheap identity check. A new object means a
  change. React, undo history and caches all rely on that. `const` doesn't give you this.
  It stops you reassigning the name, not editing the object behind it.
analogy: Saving a new version of a document. The old version is still there, untouched, for anyone who needs it.
example:
  language: js
  code: |
    const cart = ['tea'];
    const next = [...cart, 'milk'];
    cart; // ['tea']
    next; // ['tea', 'milk']
usage: Keep the state update immutable, or React won't notice that anything changed.
twin:
  term: mutation
  difference: Immutability leaves the original alone and makes a new copy with the change. Mutation edits the original in place, and everyone holding it sees the edit.
related:
  - mutation
  - spread-syntax
  - shallow-copy
level: 2
