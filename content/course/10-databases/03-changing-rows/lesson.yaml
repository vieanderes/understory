id: db.changing-rows
title: Adding, changing and deleting rows
objective: "Add rows with `INSERT`, change them with `UPDATE` and remove them with `DELETE`, touching only the rows you mean."
level: essential
minutes: 9
concepts: [db.insert, db.update-and-delete]
prerequisites: [db.reading-rows]
opening:
  text: >-
    You'll add, change and delete rows the way every sign-up form and settings page does. You'll
    also make the most famous database mistake on purpose, where it can't hurt.

steps:
  - type: prose
    id: insert-rows
    body: >-
      `INSERT` adds a row. Name the columns, then give the values in the same order:


      ```sql

      INSERT INTO subscribers (id, email, name)

      VALUES (7, 'lena@example.com', 'Lena Novak');

      ```


      A column you leave out gets its **default**, a value the table fills in for you. Here
      `confirmed` starts as `false`. Naming the columns keeps the statement right even after
      someone adds a column.

  - type: sql
    id: add-subscriber
    concept: db.insert
    difficulty: 1
    prompt: >-
      Omar Haddad has signed up with `omar@example.com`. Add him with id `7`, then run the
      `SELECT` to see him in the list.
    setup: &subscribers |
      CREATE TABLE subscribers (
        id integer PRIMARY KEY,
        email text NOT NULL,
        name text NOT NULL,
        confirmed boolean NOT NULL DEFAULT false,
        subscribed boolean NOT NULL DEFAULT true
      );
      INSERT INTO subscribers VALUES
        (1, 'ana@example.com', 'Ana Silva', true, true),
        (2, 'ben@example.com', 'Ben Okafor', true, true),
        (3, 'priya@example.com', 'Priya Shah', true, true),
        (4, 'sam.lee@example.com', 'Sam Lee', true, true),
        (5, 's.lee@example.net', 'Sam Lee', true, true),
        (6, 'win@prize.example', 'Winner', false, true);
    starter: |
      INSERT INTO subscribers (id, email, name)
      VALUES ();
      SELECT * FROM subscribers;
    solution: |
      INSERT INTO subscribers (id, email, name)
      VALUES (7, 'omar@example.com', 'Omar Haddad');
      SELECT * FROM subscribers;
    checks:
      query: SELECT * FROM subscribers ORDER BY id
    showSchema: true
    hints:
      - Three values go in the brackets, in the order the columns are named.
      - Text values need single quotes. The id doesn't.

  - type: prose
    id: update-rows
    body: >-
      `UPDATE` changes rows that already exist. `SET` says what changes, and `WHERE` says which
      rows:


      ```sql

      UPDATE subscribers SET subscribed = false WHERE id = 2;

      ```


      Leave out the `WHERE` and every row changes. Postgres won't ask "are you sure?". It
      reports how many rows changed, and that number is your first warning.

  - type: sql
    id: unsubscribe-one
    concept: db.update-and-delete
    difficulty: 2
    prompt: >-
      Priya clicked "unsubscribe". Run the starter and read how many rows changed: everyone
      left the newsletter. Fix it so only Priya, id 3, unsubscribes.
    setup: *subscribers
    starter: |
      UPDATE subscribers SET subscribed = false;
      SELECT * FROM subscribers;
    solution: |
      UPDATE subscribers SET subscribed = false WHERE id = 3;
      SELECT * FROM subscribers;
    checks:
      query: SELECT * FROM subscribers ORDER BY id
    showSchema: true
    hints:
      - The result line says `UPDATE · 6 rows changed`. It should say 1.
      - Add a `WHERE` that picks Priya's row by its id.

  - type: prose
    id: preview-then-change
    body: >-
      `DELETE FROM subscribers WHERE ...` removes the rows the `WHERE` matches. There's no undo.


      So developers use a habit. Write the `WHERE` in a `SELECT` first and look at what comes
      back. Happy? Swap `SELECT *` for `DELETE`, keeping the same `WHERE`.


      Add `RETURNING *` to an `INSERT`, `UPDATE` or `DELETE`, and it shows the rows it touched.

  - type: sql
    id: delete-unconfirmed
    concept: db.update-and-delete
    difficulty: 2
    prompt: >-
      Sign-ups that never confirmed their email are spam. Preview them with the `SELECT`. Then
      delete them, with `RETURNING *` to see what went.
    setup: *subscribers
    starter: |
      SELECT * FROM subscribers WHERE confirmed = false;
    solution: |
      DELETE FROM subscribers WHERE confirmed = false RETURNING *;
    checks:
      query: SELECT * FROM subscribers ORDER BY id
    showSchema: true
    hints:
      - Keep the `WHERE` exactly as it is.
      - '`DELETE FROM subscribers` replaces `SELECT * FROM subscribers`, and `RETURNING *` goes at the end.'

  - type: ai-review
    id: review-update-by-name
    concept: db.update-and-delete
    difficulty: 3
    language: sql
    request: Change Sam Lee's email to sam.lee@example.org. He's the one who signed up first.
    flawClass: logic
    code: |
      UPDATE subscribers
      SET email = 'sam.lee@example.org'
      WHERE name = 'Sam Lee';
    prompt: >-
      An assistant wrote this, and it worked on a test copy. In production it reported
      `UPDATE 2`. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Two people share the name, so both rows changed
        correct: true
        feedback: >-
          Right. Names repeat. The `id` picks exactly one person: `WHERE id = 4`.
      - text: The new email needs double quotes
        feedback: >-
          Double quotes mean a column name. Text values take single quotes, as here.
      - text: '`SET` must come after `WHERE`'
        feedback: >-
          The order is `UPDATE`, `SET`, then `WHERE`, as written. The match is too broad.
    fix: |
      UPDATE subscribers
      SET email = 'sam.lee@example.org'
      WHERE id = 4;

  - type: explain-back
    id: explain-safe-change
    concept: db.update-and-delete
    difficulty: 3
    audience: teammate
    kind: risk
    prompt: >-
      A teammate is about to run an `UPDATE` by hand on a table with real customers. Warn them
      what could go wrong, and how they'd check it changes only the rows they mean.
    rubric:
      - Without a `WHERE`, or with a loose one, every matching row changes, possibly all of them.
      - Run the same `WHERE` as a `SELECT` first and look at the rows it matches.
      - Match on something unique such as the id, not a name, and check the count reported.
    modelAnswer: >-
      The danger is changing more rows than you meant. Forget the `WHERE` and every row
      changes. Match on a name and every customer with that name changes. So first run the
      same condition as a `SELECT` and look at what comes back. Match on the id, since names
      repeat. After running it, check the count: `UPDATE 1` when you meant one row.

recap:
  - Add rows with `INSERT INTO table (columns) VALUES (...)`, naming the columns.
  - Change or remove rows with `UPDATE` and `DELETE`, always with a `WHERE`.
  - Preview the `WHERE` as a `SELECT`, match by id, and read the row count.

recall:
  - id: card-insert-columns
    concept: db.insert
    front: Why name the columns in an `INSERT`?
    back: >-
      The values then match by name, not position, so the statement stays right when columns
      are added. Columns left out get their default.
  - id: card-update-no-where
    concept: db.update-and-delete
    front: What does an `UPDATE` without a `WHERE` change?
    back: Every row in the table.
  - id: card-preview
    concept: db.update-and-delete
    front: What's the habit before running a `DELETE`?
    back: >-
      Run the same `WHERE` as a `SELECT` and check the rows. Then swap `SELECT *` for
      `DELETE`.
  - id: card-returning
    concept: db.update-and-delete
    front: What does `RETURNING *` add to an `UPDATE`?
    back: It returns the rows the statement changed, as they are after the change.

