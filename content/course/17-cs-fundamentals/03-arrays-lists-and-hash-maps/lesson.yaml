id: cs.arrays-lists-hash-maps
title: Arrays, lists and hash maps
objective: Pick the right container, explain how a hash map finds a key, and count with a Map.
level: essential
minutes: 10
concepts: [cs.arrays-and-linked-lists, cs.hash-maps, cs.collisions, cs.map-and-object]
prerequisites: [js.references-and-copying, cs.complexity]
opening:
  text: >-
    You'll pick the right container for a job, by knowing what each one is quick at. Then
    you'll fix two real counting bugs with a Map.

steps:
  - type: prose
    id: name-arrays-and-lists
    body: >-
      An **array** keeps items in numbered slots, like seats in a row. Reading seat 50,000 is
      one step. Adding at the front with `unshift` moves everyone along a seat: O(n).


      A **linked list** is a chain of small objects. Each holds a value and a reference to the
      next, in `next`. Adding at the front is one step. Reaching item 50,000 means following
      50,000 `next` references.

  - type: trace-table
    id: trace-linked-list
    concept: cs.arrays-and-linked-lists
    difficulty: 2
    language: js
    code: |
      const caz = { value: 'Caz', next: null };
      const ben = { value: 'Ben', next: caz };
      const ana = { value: 'Ana', next: ben };
      let node = ana;
      node = node.next;
      node = node.next;
    prompt: >-
      Here's a linked list of three people. Write `node.value` after each line.
    columns: [node.value]
    rows:
      - line: 4
        values: [Ana]
        given: true
      - line: 5
        values: [Ben]
      - line: 6
        values: [Caz]

  - type: prose
    id: name-hash-map
    body: >-
      A **hash map** finds things by key without searching. Picture numbered buckets. A
      **hash function** turns each key into a bucket number.


      ```js
      function bucketOf(key) {
        return key.length % 4;    // a toy hash: always 0, 1, 2 or 3
      }
      ```


      To look a key up, run the same function and go straight to that bucket: O(1) on
      average. Real hash functions mix every character, so keys spread out.

  - type: multiple-choice
    id: pick-collision
    concept: cs.collisions
    difficulty: 3
    language: js
    code: |
      // after adding five names with the toy hash, key.length % 4
      const buckets = [
        ['zara'],                 // bucket 0
        [],                       // bucket 1
        ['li'],                   // bucket 2
        ['ana', 'ben', 'kim'],    // bucket 3: three keys in one bucket is a collision
      ];
    question: You look up `'kim'`. The hash sends you to bucket 3. What happens there?
    choices:
      - text: It finds `'ana'`, the first key stored
        feedback: >-
          A bucket isn't one slot. The map compares the keys inside it until one matches
          yours.
      - text: It checks the bucket's keys one by one
        correct: true
        feedback: >-
          Right. Three comparisons here. If every key collided, a lookup would be O(n) again.
      - text: It fails, a bucket holds one key
        feedback: >-
          Collisions are normal, and every hash map handles them. Here the bucket keeps a
          short list.

  - type: prose
    id: name-map-vs-object
    body: >-
      JavaScript's hash map is **Map**. You've used `set(key, value)` and `get(key)`. Two more:
      `has(key)` answers true or false, and `size` counts the keys. `get` on a missing key
      gives `undefined`.


      A plain object works like a map too. You met one catch: it inherits keys like
      `constructor`. Here's another. An object turns every key into text. A Map keeps
      the key itself, so two different objects stay two different keys.

  - type: playground
    id: fix-tag-counts
    concept: cs.hash-maps
    difficulty: 2
    prompt: >-
      Bug report: the tag counter shows "NaN" for every tag. Fix line 4, so a tag seen for the
      first time starts at 0.
    html: |
      <p id="css"></p>
      <p id="js"></p>
    js: |
      const tags = ["css", "js", "css", "css"];
      const counts = new Map();
      for (const tag of tags) {
        counts.set(tag, counts.get(tag) + 1);
      }
      document.querySelector("#css").textContent = "css: " + counts.get("css");
      document.querySelector("#js").textContent = "js: " + counts.get("js");
    editable: [js]
    checks:
      - label: css shows 3
        selector: '#css'
        text: 'css: 3'
      - label: js shows 1
        selector: '#js'
        text: 'js: 1'
    solution:
      js: |
        const tags = ["css", "js", "css", "css"];
        const counts = new Map();
        for (const tag of tags) {
          counts.set(tag, (counts.get(tag) ?? 0) + 1);
        }
        document.querySelector("#css").textContent = "css: " + counts.get("css");
        document.querySelector("#js").textContent = "js: " + counts.get("js");
    hints:
      - The first time, `counts.get(tag)` gives `undefined`. What's `undefined + 1`?
      - '`??` gives a fallback when the left side is `undefined`.'
      - 'Use `(counts.get(tag) ?? 0) + 1`.'

  - type: ai-review
    id: review-object-as-counter
    concept: cs.map-and-object
    difficulty: 3
    language: js
    request: Count how many times each user visited.
    flawClass: edge-case
    code: |
      function countVisits(visits) {
        const counts = {};
        for (const user of visits) {
          counts[user] = (counts[user] ?? 0) + 1;
        }
        return counts;
      }
    prompt: >-
      An assistant wrote this. `visits` holds user objects, like `{ name: 'Ana' }`. Ana
      visited once and Ben twice, but the result says one user visited 3 times. Tap the line
      at fault.
    lines: [2]
    reasons:
      - text: An object turns every user into the same text key
        correct: true
        feedback: >-
          Yes. Every user becomes `'[object Object]'`. A Map keeps each object as its own key.
      - text: '`?? 0` should be `|| 0`'
        feedback: >-
          Both give 0 for a missing count. The trouble is which key the count lands on.
      - text: The loop should use `let` instead of `const`
        feedback: >-
          `const` is fine: each pass gets a fresh `user`. The counts all land on one key.
    fix: |
      function countVisits(visits) {
        const counts = new Map();          // keeps each user object as its own key
        for (const user of visits) {
          counts.set(user, (counts.get(user) ?? 0) + 1);
        }
        return counts;
      }

  - type: code-challenge
    id: write-fullest-bucket
    concept: cs.collisions
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `fullestBucket(keys, bucketCount)`. It uses the toy hash from this lesson: a key's
      bucket is `key.length % bucketCount`. Return how many keys the fullest bucket holds.


      No keys gives `0`.


      So `['ana', 'ben', 'kim']` with 4 buckets gives `3`. All three have length 3, so they
      collide.
    hints:
      - You need a running count per bucket. A `Map` from bucket number to count fits well.
      - After you raise a bucket's count, compare it with the largest count seen so far.
      - 'Start with `const sizes = new Map();` and, in the loop, `const bucket = key.length % bucketCount;`'

  - type: explain-back
    id: explain-map-is-fast
    concept: cs.hash-maps
    difficulty: 4
    prompt: >-
      A guest list has 100,000 names. `names.includes(name)` is slow, and `guests.has(name)` on
      a `Map` is near instant. Why is the `Map` so much quicker?
    rubric:
      - '`includes` compares the name with each item in turn, so the cost is O(n).'
      - A `Map` hashes the key to a bucket number and looks only in that bucket.
      - So its cost stays about the same at any size, unless many keys collide in one bucket.
    modelAnswer: >-
      `includes` has no shortcut. It starts at the first name and compares each one, so a
      missing name means checking every one of them. A `Map` does a sum on the key, the hash, and
      gets a bucket number. It looks in that one bucket and nowhere else. A good hash spreads
      keys evenly, so a bucket holds one or two. The cost barely changes as the list grows.
      It would only slow down if many keys collided, since a bucket is searched one by one.

recap:
  - Use an array for access by position, and expect inserts at the front to cost O(n).
  - Use a `Map` to find things by key in O(1), because a hash goes straight to a bucket.
  - Count with a `Map`, which keeps any key as itself, where an object turns keys into text.

recall:
  - id: card-array-vs-list
    concept: cs.arrays-and-linked-lists
    front: What is an array quick at, and what is a linked list quick at?
    back: >-
      An array reads any index in one step, but inserting at the front moves everything. A
      linked list inserts at the front in one step, but reaching item n takes n hops.
  - id: card-hash-map
    concept: cs.hash-maps
    front: How does a hash map find a key without searching?
    back: >-
      A hash function turns the key into a bucket number. The lookup goes straight to that
      bucket, which is O(1) on average.
  - id: card-collision
    concept: cs.collisions
    front: What is a hash collision, and what does it cost?
    back: >-
      Two keys landing in one bucket. The bucket is searched key by key, so many collisions
      turn O(1) into O(n).
  - id: card-map-vs-object
    concept: cs.map-and-object
    front: Give two ways a `Map` is safer than a plain object used as a map.
    back: >-
      It has no inherited keys such as `constructor`, and it keeps any key as itself, where an
      object turns every key into text. It also knows its `size`.

references:
  - kind: spec
    title: 'ECMAScript Language Specification: Map Objects'
    authors: Ecma TC39
    venue: Ecma International, ECMA-262
    url: https://tc39.es/ecma262/multipage/keyed-collections.html#sec-map-objects
    note: Requires `Map` access times that are sublinear in the number of entries, and defines insertion order.
    primary: true
    verified: true
  - kind: docs
    title: Map
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
    note: Has a table comparing `Map` with plain objects on keys, order, size and safety.
    verified: true
  - kind: essay
    title: 'Optimizing hash tables: hiding the hash code'
    authors: Sathya Gunasekaran
    year: 2018
    venue: V8 blog
    url: https://v8.dev/blog/hash-code
    note: How one real engine stores the hash codes behind `Map` and `Set`.
    verified: true

deepDive: >-
  An object also reorders keys that look like numbers: `'9'` and `'10'` come before `'zoe'`,
  whatever order you added them. A `Map` keeps the order you added.


  The numbers are from Node 24. Pushing 100,000 items took 2 ms, and `unshift` took 2,668 ms.
  Looking up 1,000 names among 100,000 took 1,794 ms with `includes` and 0.18 ms with
  `Map.has`. `Set` is the same structure with keys only. Use it when you only ask "is it in
  there?".


  Keeping a short list in each bucket is called chaining. The other way is probing: when a
  bucket is taken, try the next one along. Both rely on a hash that spreads keys evenly, and
  on growing the table before it fills. Our toy hash is a bad one on purpose. Most names
  have 3 to 6 letters, so they crowd into a few buckets.


  Plain objects have more traps than `constructor`. The key `1` and the key `'1'` are the same
  key, since object keys are strings. A `Map` kept them apart, and its `size` was 2. Every
  plain object also answers to `toString` and `__proto__`. If users choose the keys, that's
  a security problem as well as a bug.


  JavaScript arrays aren't always one block of slots underneath. Engines switch to a slower
  form for arrays with big gaps. Filled from 0 upwards, as here, they behave as described.
