term: workspace
aka: [workspaces, package workspace, workspace protocol]
short: A package manager feature that links a repository's own packages so they import each other directly.
explain: |
  In a repository with several packages, `import '@shop/ui'` should find the copy next door.
  It shouldn't fetch a published version from the registry. You don't want to publish after
  every edit to test a change.

  The package manager reads the list of package folders, installs once, and links each
  local package into `node_modules`. A dependency written as `"workspace:*"` means "use the
  copy in this repository". Each folder still has its own `package.json`. Its dependencies stay declared, so tools
  can run tasks in the right order.
analogy: Office desks pushed together. Colleagues pass papers across instead of posting them to each other.
example:
  language: json
  code: |
    {
      "name": "@shop/web",
      "dependencies": {
        "@shop/ui": "workspace:*"
      }
    }
usage: Add the new package to the workspace list, or the web app will try to download it from the registry.
related: [monorepo, package-manager, lockfile]
level: 2
lessons: [arch.monorepos]
