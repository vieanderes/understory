term: comparator
aka: [compare function, comparison function, sort key]
short: A small function that takes two items and says which should come first in a sort.
explain: |
  A sort needs to know what "smaller" means for your data. You tell it with a function of
  two items, `a` and `b`. Return a negative number if `a` goes first, positive if `b`
  goes first, zero if they tie.

  Ties are where hidden tests catch you. "Sort by score, highest first, then by name"
  means two checks in one function. Python uses a key function instead: return a tuple
  like `(-score, name)` and it compares the parts in order.

  Never return a boolean. `(a, b) => a > b` gives true or false, never negative, and some
  engines then sort wrongly.
analogy: The rule a judge uses at a dog show to decide between any two dogs. Give a clear rule and the whole ranking follows.
example:
  language: js
  code: |
    rows.sort((a, b) =>
      b.score - a.score ||        // higher score first
      a.name.localeCompare(b.name) // tie: alphabetical
    );
usage: Your comparator returns a boolean, so the order's undefined; return b.score minus a.score instead.
related: [stable-sort, lexicographic-order, binary-heap]
level: 2
lessons: [interview.reading-the-task, cs.searching-and-sorting]
