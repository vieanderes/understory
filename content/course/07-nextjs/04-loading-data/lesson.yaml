deepDive: >-
  **A secret can leak through HTML too.** A Client Component also renders on the server, where
  `process.env.WEATHER_KEY` has its real value. If it puts that value on screen, the key is in
  the HTML the server sends, even without the prefix. The browser then renders `undefined`, and
  you get a hydration error as a warning sign. Read secrets only in Server Components.


  **`server-only`.** Import the `server-only` package at the top of a file that holds server
  code. If a Client Component ever imports it, the build stops with `'server-only' cannot be
  imported from a Client Component module`.


  **Reading a database directly.** A Server Component can call a database client instead of
  `fetch`, since its code never reaches the browser. You'll do that after the databases chapter.


  **Parallel waits.** Two awaits in a row wait one after the other. Start both, then `await
  Promise.all([a, b])`, when neither needs the other's answer.
