approach: >-
  Walk the queue and add each volunteer's energy to the team you are building. The moment
  the total reaches K, close the team and start a new one from zero. Closing early never
  hurts: any later cut would use more volunteers and leave fewer for the teams after it. So
  one greedy pass gives the largest count.
complexity: O(N) time, O(1) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      **N up to 100,000** and **efficient** mean one pass, or close to it. Trying every way
      to cut the queue is out.

      Note the words that shape the answer: teams are **next to each other**, each volunteer
      joins **at most one**, and some may join none.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      One line pins down what you maximise. It is the number of teams, not the energy.
    code:
      ts: |-
        // Cut A into as many consecutive groups with sum at least K as possible; return the count.
      python: |-
        # Cut A into as many consecutive groups with sum at least K as possible; return the count.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      - one volunteer strong enough alone;
      - one volunteer who is not;
      - every volunteer ready alone;
      - values at the top of the range, where totals get large;
      - leftover volunteers at the end who never reach K.
    input:
      - "(1, [5])"
      - "(10, [3])"
      - "(5, [5, 5, 5])"
      - "(1000000000, [1000000000, 1000000000])"
      - "(4, [1, 1, 1, 1, 1, 1, 1])"
  - kind: ask-ai
    title: Check a limit you are unsure of
    minutes: 1
    body: |-
      Energies go up to a billion, so a running total can pass two billion, beyond a 32-bit
      integer. Ask whether that is safe instead of guessing. It is a narrow question that
      gives nothing away.
    prompt: >-
      In TypeScript, can a number hold integers above two billion exactly? One sentence.
    expect: >-
      Yes. Integers are exact up to about 9 × 10^15, so a plain number is safe. Python
      integers have no limit.
  - kind: plan
    title: Convince yourself greedy is safe
    minutes: 3
    body: |-
      A DP over every possible last team is correct but O(N²), too slow for 100,000.

      Instead, close a team as soon as it reaches K. If a better answer cut later, moving that
      cut earlier still leaves a ready team and gives the rest more volunteers. So the early
      cut is never worse.
  - kind: write
    title: Write the solution yourself
    minutes: 3
    body: |-
      It is a running total and a counter. Type it yourself: the greedy rule is the insight
      being tested. Put the one-line reason in a comment, because reviewers look for it.
    code:
      ts: |-
        // Cut A into as many consecutive groups with sum at least K as possible; return the count.
        // Closing a team the moment it reaches K never hurts: one pass, O(N) time, O(1) space.
        function solution(K: number, A: number[]): number {
          let teams = 0;
          let energy = 0;
          for (const x of A) {
            energy += x;
            if (energy >= K) {
              teams++;
              energy = 0;
            }
          }
          return teams;
        }
      python: |-
        # Cut A into as many consecutive groups with sum at least K as possible; return the count.
        # Closing a team the moment it reaches K never hurts: one pass, O(N) time, O(1) space.
        def solution(K, A):
            teams = 0
            energy = 0
            for x in A:
                energy += x
                if energy >= K:
                    teams += 1
                    energy = 0
            return teams
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Check each result against the rule, especially the leftover case.
    expect: Two OKs, then 1, 0, 3, 2 and 1 for your five cases.
  - kind: ai-writes
    title: Let the assistant find a counterexample, if one exists
    minutes: 2
    body: |-
      A greedy rule deserves a challenge. Asking the assistant to try to break it is a good
      use: it checks your reasoning without writing your code. Test any input it gives you.
    prompt: >-
      My solution closes a team as soon as its total reaches K. Try to find a small input,
      in the format (6, [2, 5, 1]), where a later cut gives more teams. If none exists, say
      so in one sentence. No code.
    expect: >-
      The assistant finds none. Any input it suggests returns the count you expect when you
      run it.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite, so the code stays yours.
    prompt: >-
      Review my current solution for correctness and time complexity. List any problems in
      one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output, since printing slows the performance tests. Check the header
      states the complexity, then submit.
