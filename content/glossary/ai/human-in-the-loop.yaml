term: human in the loop
aka:
  - human-in-the-loop
  - HITL
  - human approval
short: A design where a person must approve, correct or answer before an automated system goes on.
explain: |
  Some actions are too costly to get wrong: a refund, an email to every customer, a deleted
  record. Letting a model do them alone means trusting it every single time.

  So the run pauses at that point. A person sees the proposed action as a diff, with its sources and the model's reasons. They
  approve, edit or reject it. The run then resumes
  from saved state.

  It works only if the person really reviews. Hundreds of confident proposals a day turn approval into a reflex. So rank by risk, show
  uncertainty, and keep the queue humane.
analogy: A trainee pilot with an instructor beside them. The trainee flies; the instructor can take the controls.
usage: Refunds over the threshold go to a human in the loop; smaller ones run alone and get sampled weekly.
twin:
  term: automation-bias
  difference: Human in the loop is the design that puts a person at the decision. Automation bias is the tendency that makes that person approve without really checking.
