term: blameless postmortem
aka:
  - postmortem
  - post-mortem
  - incident review
short: A write-up after an incident that asks how the system let it happen, never who to blame.
explain: |
  Something broke, and it's fixed. Now the team writes down what happened: a timeline, the
  impact, the causes, and actions to stop a repeat.

  Blameless means the question is "what made this mistake possible?", not "who made it?".
  People who fear blame hide details, and hidden details are how the same incident happens
  twice. "The engineer ran the wrong command" becomes "the command had no confirmation, and
  production looked like staging".
analogy: An air accident report. It doesn't sack the pilot; it changes the cockpit so no pilot makes that mistake again.
usage: In the postmortem, write "the deploy skipped the migration check", not who pressed the button.
twin:
  term: pre-mortem
  difference: A postmortem looks back at an incident that happened. A pre-mortem looks forward, imagining before launch that the work has failed and asking why.
related:
  - pre-mortem
  - on-call
level: 2
lessons:
  - security.incident-response
  - explain.incident-updates
  - career.questions-to-ask
