term: guardrail metric
aka: [counter-metric, health metric]
short: A measure that mustn't get worse while the main target improves.
explain: |
  Any target can be met the cheap way. Cut average handling time by closing tickets
  before they're solved. The target looks great, customers are furious.

  A guardrail metric catches that. Pair handling time with the reopen rate, or speed with
  accuracy. If the guardrail slips, the win doesn't count.
analogy: Timing a sprint, but also checking the runner stayed in their lane.
usage: Handling time dropped, but the reopen rate is our guardrail metric and it went up 8%.
related: [success-metric, metrics, slo]
level: 2
lessons: [aisys.shaping-the-build]
