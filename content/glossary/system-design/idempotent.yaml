term: idempotent
aka:
  - idempotency
  - idempotence
short: Safe to repeat, because doing it twice leaves things the same as doing it once.
explain: |
  Networks fail halfway. A client sends "charge £20", the reply gets lost, and the client
  tries again. If the operation is safe to repeat, nothing bad happens.

  Setting a value is naturally safe to repeat; adding to it isn't. For the rest, the client
  sends an **idempotency key** and the server remembers which keys it has already handled.
analogy: A lift button. Pressing it five times calls the lift once.
example:
  language: http
  code: |
    POST /payments HTTP/1.1
    Idempotency-Key: 7f3a9c
    Content-Type: application/json

    {"amount": 2000}
usage: Make the webhook handler idempotent, because the provider will send the same event twice.
related:
  - retry
  - queue
  - saga
  - message-broker
  - race-condition
  - http-method
  - side-effect
level: 2
