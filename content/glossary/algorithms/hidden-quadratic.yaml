term: hidden quadratic
aka: [accidental quadratic, hidden O(n²), quadratic trap]
short: A loop that looks linear but calls something inside it that also walks the whole list.
explain: |
  One loop, so O(n)? Not if each round calls `includes`, `indexOf`, `shift`, `splice` or
  `slice`. Each of those walks the array too. One loop of n rounds, each costing n, is
  O(n²).

  It passes the small example in a blink. Then a hidden test with 100,000 items times out.
  Building a string with `+=` in some languages and copying with spread inside a loop do
  the same.

  Look inside every loop for calls that take time proportional to the data. Swap a list
  lookup for a set, and `shift` for a moving index.
analogy: Walking to the end of the street and back for every single letter you post. One trip each looks fine until there are a thousand letters.
example:
  language: js
  code: |
    // looks O(n), is O(n²): includes scans `unique` each time
    const unique = [];
    for (const id of ids) if (!unique.includes(id)) unique.push(id);

    // O(n): the set answers in one step
    const uniqueIds = [...new Set(ids)];
usage: That includes() inside the loop is a hidden quadratic; it'll time out on the performance tests.
related: [time-complexity, hash-set, array, fifo-queue, big-o]
level: 2
lessons: [interview.js-traps, interview.online-assessments]
