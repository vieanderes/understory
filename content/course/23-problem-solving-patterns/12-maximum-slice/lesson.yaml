id: algo.maximum-slice
title: Maximum slice
objective: Find the best contiguous run in one pass by carrying the best slice ending here, and carry the right running value for variants such as one buy and one sale.
level: advanced
minutes: 10
concepts: [algo.kadane, algo.slice-state]
prerequisites: [algo.counting-and-leaders]
opening:
  text: >-
    You'll find the best run of consecutive days in one pass, not two nested loops. The
    same move solves "best time to buy and sell", a favourite interview question.

steps:
  - type: prose
    id: picture-max-slice
    body: |-
      A **slice** is a run of neighbouring items: days 3 to 7, not days 3 and 7. Many tasks
      ask for the best one: the most profitable stretch, the longest winning streak.

      The brute force tries every start and every end: O(n²). The pattern here does it in
      one pass.

      Reach for it when a task says "consecutive", "contiguous", "subarray" or "buy then
      sell".

  - type: multiple-choice
    id: spot-slice-signal
    concept: algo.kadane
    difficulty: 1
    question: Which task is a maximum slice?
    choices:
      - text: The most profitable stretch of consecutive trading days
        correct: true
        feedback: >-
          Yes. "Consecutive" plus "best total" is the signal.
      - text: The two products whose prices add up to a budget
        feedback: >-
          Two items anywhere in the list is a complement lookup with a map.
      - text: The most common status code in a log
        feedback: >-
          "Most common" is counting, from the last lesson.
      - text: The smallest order number not used yet
        feedback: >-
          That's counting too: tick off what's there, find the first gap.

  - type: prose
    id: name-kadane
    body: |-
      Ask a smaller question at each day: what's the best slice **ending here**? Either it
      extends the best one ending yesterday, or it starts afresh today.

      ```js
      ending = Math.max(change, ending + change);
      best = Math.max(best, ending);
      ```

      Keep the larger, track the best you've seen. One pass, O(n) time, O(1) space. It's
      called **Kadane's algorithm**.

  - type: predict-output
    id: predict-all-negative
    concept: algo.kadane
    difficulty: 2
    language: js
    code: |
      function bestSlice(values) {
        let ending = 0;
        let best = 0;
        for (const value of values) {
          ending = Math.max(0, ending + value);
          best = Math.max(best, ending);
        }
        return best;
      }
      console.log(bestSlice([-3, -1, -2]));
    question: This version starts at 0. What does it log?
    choices:
      - text: '`0`'
        correct: true
        feedback: >-
          Right. That's the empty slice. If a slice needs one item, the answer is -1.
      - text: '`-1`'
        feedback: >-
          That's the right answer when a slice must hold an item. Starting at 0 hides it.
      - text: '`-6`'
        feedback: >-
          That's the whole list. `Math.max(0, ...)` never lets the running sum drop below 0.

  - type: code-challenge
    id: write-best-streak
    concept: algo.kadane
    difficulty: 3
    language: ts
    twin:
      language: python
      starter: streak.starter.py
      solution: streak.solution.py
      tests: streak.tests.py
    prompt: >-
      A finance app highlights your best stretch. Write `bestStreak(changes)`: each number
      is one day's change in a balance. Return the largest total over one or more
      consecutive days.


      `bestStreak([2, -5, 3, 4, -1])` is `7`. The list has at least one day. If every day
      is a loss, return the smallest loss.


      **Target:** O(n) for up to 300,000 days. The tests include all losses, one day, and a
      full-size run. Trying every start and end runs out of time.
    hints:
      - What's the best total of a run that ends exactly today?
      - It's today alone, or today added to the best run ending yesterday. Don't start at 0.
      - 'Start `ending` and `best` at `-Infinity`. Each day, set `ending = Math.max(change, ending + change)`, then update `best`.'

  - type: prose
    id: name-slice-state
    body: |-
      Variants carry a different running value. Take prices over days: buy once, sell
      later, find the best profit.

      Carry the **lowest price so far**. Each day, selling today earns `price - lowest`.
      Check that first, then update the lowest, so you never sell before you buy. It's the
      same shape: one pass, one or two running values.

  - type: code-challenge
    id: write-max-profit
    concept: algo.slice-state
    difficulty: 3
    language: python
    starter: profit.starter.py
    solution: profit.solution.py
    tests: profit.tests.py
    prompt: >-
      Now in Python. A backtest asks for the best profit from one buy and one later sale.
      Write `max_profit(prices)`. Return `0` if no sale makes money.


      `max_profit([7, 1, 5, 3, 6, 4])` is `5`: buy at 1, sell at 6.


      **Target:** O(n) for up to 100,000 prices. The tests include an empty list, falling
      prices, the lowest price last, and a full-size run.
    hints:
      - For a sale today, which earlier price do you want to have bought at?
      - The lowest price seen before today. Keep it as you go.
      - 'Start `lowest = float("inf")` and `best = 0`. Each day, update `best` with `price - lowest` first, then `lowest`.'

  - type: ai-review
    id: review-sell-before-buy
    concept: algo.slice-state
    difficulty: 3
    language: js
    request: Write maxProfit(prices), the best profit from buying once and selling later, or 0.
    flawClass: logic
    code: |
      function maxProfit(prices) {
        let lowest = prices[0];
        let highest = prices[0];
        for (const price of prices) {
          lowest = Math.min(lowest, price);
          highest = Math.max(highest, price);
        }
        return Math.max(0, highest - lowest);
      }
    prompt: >-
      An assistant wrote this in JavaScript. It passed `[1, 3, 6]`, where prices only rise.
      For `[9, 2, 5]` it returns 7, but the answer is 3. Tap the line at fault.
    lines: [6]
    reasons:
      - text: The highest price may come before the lowest
        correct: true
        feedback: >-
          Yes. It sells at 9 on day one, before buying at 2. Order matters.
      - text: '`lowest` should start at `Infinity`'
        feedback: >-
          Starting at the first price works as well. The flaw is ignoring the order of days.
      - text: '`Math.max(0, ...)` hides a real loss'
        feedback: >-
          Not buying at all earns 0, so 0 is the right floor here.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Prices whose peak comes before their low
          correct: true
          feedback: >-
            Yes. Then the global maximum sits on a day before you could buy.
        - text: Prices that only rise
          feedback: >-
            That's the test it passed. The lowest comes first, so order never matters.
        - text: A single price
          feedback: >-
            Highest and lowest are the same day, so it returns 0, which is right.
    fix: |
      let best = 0;
      for (const price of prices) {
        best = Math.max(best, price - lowest);
        lowest = Math.min(lowest, price);
      }
      return best;

  - type: explain-back
    id: explain-kadane-restart
    concept: algo.kadane
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      Talk the interviewer through `bestStreak`: why the best run ending today only needs
      yesterday's best, and what it costs.
    rubric:
      - Any run ending today is today alone, or today plus some run ending yesterday.
      - The biggest of those uses yesterday's best; if that's negative, start afresh.
      - One pass with two running values, so O(n) time and O(1) space.
    modelAnswer: >-
      Every run ending today is either today alone or today added to a run ending
      yesterday. To make it as big as possible, add the biggest run ending yesterday. If
      even that is negative, it only drags today down, so I start afresh. Anything earlier
      is already folded into yesterday's best. That's one pass with two numbers: O(n) time,
      O(1) space.

recap:
  - Carry the best slice ending here to find the best slice in O(n).
  - Start from the first item, or `-Infinity`, when a slice can't be empty.
  - Carry the right running value, like the lowest price, for each variant.
recall:
  - id: card-kadane-step
    concept: algo.kadane
    front: What are the two options for the best slice ending at index i?
    back: >-
      Extend the best slice ending at i - 1 with item i, or start afresh at item i.
  - id: card-all-negative
    concept: algo.kadane
    front: What goes wrong if `best` starts at 0 and every value is negative?
    back: >-
      It returns 0, the empty slice. Start at the first item when a slice needs one.
  - id: card-max-profit
    concept: algo.slice-state
    front: What running value solves "buy once, sell later" in one pass?
    back: >-
      The lowest price so far. Check `price - lowest` before updating it.

references:
  - kind: essay
    title: 'Programming Pearls: Algorithm Design Techniques'
    authors: Jon Bentley
    year: 1984
    venue: Communications of the ACM 27(9), 865-873
    url: https://doi.org/10.1145/358234.381162
    note: The column that tells how the problem went from cubic time to Kadane's linear scan.
    primary: true
    verified: true
  - kind: docs
    title: Maximum subarray problem
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Maximum_subarray_problem
    note: History, the empty-slice variant, and the proof of Kadane's algorithm.
    verified: true

deepDive: >-
  The one-pass method is Kadane's algorithm, named after the statistician Jay Kadane. Jon
  Bentley's Programming Pearls column told the story of the problem in 1984, from cubic
  to linear time.


  **Say which variant you're solving before you code.** Empty slice allowed or not is the
  question that most often costs points. Ask it out loud.


  **Two slices around a gap.** Some tasks sum two slices either side of a skipped index.
  Fill `left[i]`, the best slice ending at `i`, in a forward pass, and `right[i]`, the
  best starting at `i`, in a backward pass. Then try every gap `y` with
  `left[y - 1] + right[y + 1]`. Still O(n).


  More variants. For the best slice of at least `k` items, combine Kadane with a prefix
  sum. For the best product, carry both the largest and the smallest product ending here,
  since a negative times a negative can win. For "return the days, not the total",
  remember where the current run started whenever you start afresh.
