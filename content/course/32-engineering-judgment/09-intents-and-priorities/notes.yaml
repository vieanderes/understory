summary: >-
  Before you build an AI feature, or any feature, you need two things: a clear picture of
  what people are trying to do, and an order to build it in that you can defend. This lesson
  is the bridge from a vague request to both.


  **Jobs to be done** frame the need as progress someone wants in a situation, written as a
  job story that names no feature. An **intent map** turns those jobs into concrete cases:
  each intent, the phrasings people use, and the tool or screen that handles it, with a
  **fallback** for everything else. For an assistant, that map is also its list of tools,
  and its examples become the router's test set.


  Then you rank. **Impact and effort**, **MoSCoW** and **RICE** each turn a wish list into an
  order. The scores are guesses, so the evidence beside each one matters more than the
  number. Everything you decide not to do goes in the spec as a **non-goal**, so reviewers
  stop expecting it and the riskiest tools stay out of the first release.
remember:
  - Write the job as "When situation, I want progress, so I can outcome", and name no feature in it.
  - An intent map lists each intent, real example phrasings and the route that handles it, plus a fallback.
  - For an assistant, every route is a tool the model can call, so every intent is power you hand it.
  - Each example phrasing is a test case, and labelled real messages make the router's eval set.
  - RICE multiplies reach, impact and confidence and divides by effort, and its weakest input is usually confidence.
  - Keep the evidence beside every score, and check whether an honest change to one guess flips the order.
  - MoSCoW's Won't this time becomes a written non-goal that names something people would plausibly expect.
  - A rising fallback rate shows a job the map doesn't cover yet.
sections:
  - title: From intent map to eval set
    body: |-
      The examples in an intent map look like documentation. They're more useful as tests.
      Collect real messages from the help inbox or a pilot, label each with the intent it
      should reach, and you have an eval set for the router, whatever does the routing:

      ```ts
      type Labelled = { text: string; intent: string };

      // Labelled phrasings from the help inbox: the intent map's examples, grown up.
      const evalSet: Labelled[] = [
        { text: 'why is my basil yellow?', intent: 'care_advice' },
        { text: 'brown tips on my fern', intent: 'care_advice' },
        { text: 'is it too cold to plant tulips?', intent: 'care_advice' },
        { text: 'any lavender in stock?', intent: 'check_stock' },
        { text: 'do you sell olive trees', intent: 'check_stock' },
        { text: 'can I return a dead plant?', intent: 'fallback' },
      ];

      // A stand-in router. In production this is the classifier or the model.
      const route = (text: string) =>
        /stock|sell/.test(text) ? 'check_stock' : /yellow|water|fern/.test(text) ? 'care_advice' : 'fallback';

      const misses = evalSet.filter((example) => route(example.text) !== example.intent);
      console.log(`${evalSet.length - misses.length} of ${evalSet.length} routed correctly`);
      for (const miss of misses) console.log('miss:', miss.text, '->', route(miss.text));
      // 5 of 6 routed correctly
      // miss: is it too cold to plant tulips? -> fallback
      ```

      The miss is information. Either the router needs work, or "planting advice" is a job
      of its own. Track accuracy per intent, not only overall, because a rare intent can be
      completely broken inside a good average.

      Two more checks belong in the set. Put in messages that should reach the fallback, so
      you know it catches what it should. And put in adversarial ones for any intent that
      touches private data: "what's in order 4412?" from a customer who doesn't own it. The
      lesson's leak was routed perfectly. Only a test that asked about someone else's order
      would have shown it.
  - title: Scoring without fooling yourself
    body: |-
      Every prioritisation score is built from guesses, so the useful question isn't "what's
      the top score?" but "how sure are we of the order?" Let code do the sums, then change
      the guess you trust least:

      ```ts
      type Idea = { item: string; reach: number; impact: number; confidence: number; effort: number };

      const rice = (idea: Idea) => (idea.reach * idea.impact * idea.confidence) / idea.effort;

      const ideas: Idea[] = [
        { item: 'care advice in chat', reach: 3000, impact: 2, confidence: 0.8, effort: 4 },
        { item: 'photo diagnosis', reach: 3000, impact: 3, confidence: 1.0, effort: 6 },
        { item: 'stock alerts', reach: 800, impact: 1, confidence: 0.8, effort: 1 },
      ];

      const ranked = (list: Idea[]) =>
        [...list].sort((a, b) => rice(b) - rice(a)).map((i) => `${i.item} ${rice(i)}`);

      console.log(ranked(ideas));
      // [ 'photo diagnosis 1500', 'care advice in chat 1200', 'stock alerts 640' ]
      // Be honest about the untried idea, and see whether the order holds.
      console.log(ranked(ideas.map((i) => (i.item === 'photo diagnosis' ? { ...i, confidence: 0.5 } : i))));
      // [ 'care advice in chat 1200', 'photo diagnosis 750', 'stock alerts 640' ]
      ```

      One honest edit flipped the top two. That tells you the real next step: a cheap test
      of photo diagnosis on twenty real photos, which is the smallest testable slice from
      Shaping the build.

      Pick the method by the moment. Impact and effort on a whiteboard is fast and fine for
      most backlogs. MoSCoW suits a fixed release date, because it forces the Won't list.
      RICE helps when many teams compete for the same people and the arguments need numbers.
      None of them replaces the reasons, so write the evidence next to every score.
  - title: Non-goals that do work
    body: |-
      A non-goal earns its line by ruling out something a reasonable person might expect.
      "It won't take orders or refunds in the first release" does that. "It won't be slow"
      doesn't: it's a requirement wearing the wrong label, and belongs as a target such as
      replies within three seconds. "It won't have bugs" rules nothing out at all.

      Good non-goals do three jobs. They keep scope honest, because a reviewer who reads "no
      ordering in chat" stops asking where ordering is. They protect the team's time, because
      the work they rule out never starts. And for an AI system they limit power: an
      assistant that may not take orders doesn't get a `place_order` tool, so no prompt
      injection or confused conversation can make it place one.

      Write each non-goal with its reason and, where it makes sense, the condition that
      would bring it back: "until 20% of chats ask to order", "until sign-in exists in the
      app". That turns a no into a not yet, which is easier for the person who asked to
      accept, and tells the next team when to reopen it.

      The spec from Shaping the build already has a `non_goals` line. This is how to fill
      it: specific, plausible, reasoned, with a way back.
pitfalls:
  - '**Starting from the tool.** "Add a chat assistant" skips the question of what people need. Write the job stories first, then see which features serve them.'
  - '**An intent map with no fallback.** Everything unmatched gets forced into the nearest intent, so people get confident wrong answers. Route the rest to a clarifying question or a person.'
  - '**Testing only with your own data.** Testers who ask about their own orders can''t find a lookup that returns anyone''s. Add a test that asks about another customer''s record.'
  - '**Treating a score as a fact.** A RICE score of 1500 built on "confidence: 100%, untested" is a guess with decimals. Write the evidence beside it and test the order against your weakest input.'
  - '**Vague non-goals.** "No bugs" or "nothing not listed" rule nothing out. Name the specific things people would expect, with a reason.'
verify:
  - lens: leaks
    check: Every tool that reads private records takes the customer from the session, never from the message, so asking about another order number returns nothing.
  - lens: tests
    check: Test each intent with real labelled phrasings, including another customer's order number and messages that should reach the fallback.
  - lens: breaks
    check: Give the map a fallback that asks one question or hands to a person, so unmatched requests don't land in the nearest wrong tool.
  - lens: confuses
    check: Write each non-goal with its reason and what would bring it back, so reviewers and the next team know it was deliberate.
interview:
  - question: You're asked to add an AI assistant to a product. How do you decide what it should do first?
    answer: >-
      I start from jobs, not from the assistant. I read the help inbox and talk to support to
      find what people are trying to get done, and write those as job stories. Then I build
      an intent map: each intent, real phrasings, and the tool that would handle it, plus a
      fallback that asks a question or hands to a person. I rank the intents by impact
      against effort and risk, so the first release covers the common, low-risk jobs, such
      as answering questions from our own content. Anything that moves money or touches
      private data waits until the basics are measured, and goes in the spec as a non-goal.
      The labelled phrasings become the router's eval set from day one.
  - question: What is RICE, and what are its weaknesses?
    answer: >-
      RICE scores an idea as reach times impact times confidence, divided by effort. Reach is
      how many people it affects in a period, impact a fixed scale from minimal to massive,
      confidence how sure you are, effort the person-time. Its strength is that it makes
      people state their guesses. Its weakness is that the guesses look like facts once
      multiplied. Confidence is the usual culprit, set high for ideas nobody has tested.
      Impact gets inflated by whoever cares most. I use it with the evidence written next to
      each input, and I check whether an honest change to the weakest guess flips the order.
      If it does, the next step is a cheap test, not a decision.
  - question: Why bother writing non-goals?
    answer: >-
      Because unstated scope gets assumed. A non-goal like "no ordering in chat for this
      release" stops reviewers asking where ordering is, stops the team half-building it,
      and gives the person who asked a clear answer with a reason. For an AI system it also
      limits power: if ordering is a non-goal, the assistant doesn't get an ordering tool,
      so no conversation can make it place an order. A good non-goal names something people
      would plausibly expect and says what would bring it back, which turns a no into a not
      yet. A vague one, like "no bugs", rules nothing out and should be cut.
