id: tooling.remotes
title: Remotes and pull requests
objective: Clone a repository, push and pull commits, and open a pull request for review.
level: essential
minutes: 10
concepts: [tooling.remotes, tooling.pull-requests]
prerequisites: [tooling.git-as-a-graph]
opening:
  text: >-
    You'll share your commits with a team and bring theirs back to your laptop. Then you'll
    open a pull request, which is how almost every team gets code reviewed.

steps:
  - type: prose
    id: what-a-remote-is
    body: |-
      So far your repository lives on one laptop. A **remote** is another copy of it,
      somewhere else, that the whole team can reach.

      Most remotes live on **GitHub**, a website that hosts Git repositories and adds tools for
      review. GitLab and others do the same job.

      ```bash
      $ git clone https://github.com/example/recipes.git
      Cloning into 'recipes'...
      ```

      `git clone` copies the whole history down. Git names the copy you cloned from `origin`,
      and `git remote` lists the remotes by name.

  - type: fill-blank
    id: fill-clone
    concept: tooling.remotes
    difficulty: 1
    language: bash
    prompt: Copy the team's recipe repository to your laptop, then list its remotes. Fill the gaps.
    template: |
      $ git {{1}} https://github.com/example/recipes.git
      Cloning into 'recipes'...
      $ cd recipes
      $ git remote
      {{2}}
    blanks:
      - key: '1'
        answer: clone
      - key: '2'
        answer: origin
    bank: [clone, pull, init, origin, main, recipes]

  - type: prose
    id: push-and-pull
    body: |-
      Two commands move commits between the copies.

      - `git push` sends your new commits to the remote.
      - `git pull` brings the remote's new commits down and merges them into your branch.

      Committing only saves on your laptop, so your team sees nothing until you push. A new
      branch needs one extra step the first time: `git push -u origin <branch>` creates it on
      the remote too.

  - type: predict-output
    id: predict-rejected-push
    concept: tooling.remotes
    difficulty: 2
    language: bash
    code: |
      # Alex pushed "Add pancake recipe" a minute ago.
      # Sam never pulled it, and has a new commit.
      $ git commit -m "Add cooking times"
      $ git push
    question: What happens to Sam's push?
    choices:
      - text: Git refuses it and asks Sam to pull
        correct: true
        feedback: >-
          Right. Accepting it would throw away Alex's commit, so the remote says no.
      - text: It replaces Alex's commit with Sam's
        feedback: >-
          That would lose Alex's work. A push only adds commits. It never drops ones you lack.
      - text: GitHub merges the two commits itself
        feedback: >-
          A remote never merges on a push. Merging happens on a laptop, and Sam's is the one
          behind.

  - type: prose
    id: rejected-then-pull
    body: |-
      Here's what Sam sees:

      ```text
       ! [rejected]        main -> main (fetch first)
      hint: Updates were rejected because the remote contains work that you do not
      hint: have locally.
      ```

      The fix: `git pull`, then `git push` again. If Git asks how to combine the histories,
      run `git config --global pull.rebase false` once. Then it merges.

      There's also an override. `git push --force` makes the remote take your branch exactly
      as your laptop has it.

  - type: ai-review
    id: review-force-push
    concept: tooling.remotes
    difficulty: 3
    language: bash
    request: My push to main keeps getting rejected. Make it go through.
    flawClass: race
    code: |
      $ git push
       ! [rejected]        main -> main (fetch first)
      $ git push --force
       + 6e5b5a0...4534578 main -> main (forced update)
    prompt: >-
      A coding agent sorted out Sam's push and reported "Done". Next morning, Alex's pancake
      recipe is gone from GitHub. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`--force` threw away the commit Sam never had'
        correct: true
        feedback: >-
          Yes. GitHub now matches Sam's laptop, which never had Alex's commit. Pull, then push.
      - text: The push needed `-u origin main`
        feedback: >-
          `-u` is for a branch the remote doesn't have yet. `main` is already there.
      - text: GitHub should have merged the two itself
        feedback: >-
          A remote never merges on a push. Merging happens on a laptop, after `git pull`.
    fix: |
      $ git pull
      $ git push

  - type: prose
    id: what-a-pull-request-is
    body: >-
      Teams rarely push straight to `main`. You push a branch instead, then open a **pull
      request** on GitHub. It asks the team to merge your branch into `main`.


      Teammates read the changes there, comment on lines and approve. Checks run too. Only then
      does someone press Merge. Afterwards, everyone runs `git pull` on `main` to get it.

  - type: parsons
    id: arrange-pr-flow
    concept: tooling.pull-requests
    difficulty: 3
    language: bash
    prompt: You're fixing a typo in a recipe. Put the commands in order, up to opening the pull request. One block doesn't belong.
    blocks:
      - id: switch-main
        code: git switch main
        subgoal: Start from the team's latest work
      - id: pull-main
        code: git pull
        subgoal: Start from the team's latest work
      - id: new-branch
        code: git switch -c fix-soup-typo
        subgoal: Work on a branch
      - id: add
        code: git add soup.md
        subgoal: Save the change
      - id: commit
        code: git commit -m "Fix typo in soup recipe"
        subgoal: Save the change
      - id: push-branch
        code: git push -u origin fix-soup-typo
        subgoal: Share it and ask for review
      - id: open-pr
        code: '# open a pull request on GitHub'
        subgoal: Share it and ask for review
    distractors:
      - id: push-main
        code: git push origin main
        feedback: >-
          That skips review and sends commits straight to `main`. Push your branch, then ask.

  - type: multiple-choice
    id: pick-pushed-secret
    concept: tooling.remotes
    difficulty: 3
    language: bash
    code: |
      $ git log --oneline
      5c1e9a2 Remove .env
      a41f07d Add weather API setup
      $ git push
    question: Commit `a41f07d` included `.env`, holding an API key. What must you do now?
    choices:
      - text: Cancel the key and make a new one
        correct: true
        feedback: >-
          Yes. Once pushed, treat it as public. A new key makes the old one useless.
      - text: Nothing, the next commit removed it
        feedback: >-
          Most people think so. But `a41f07d` is still in the history, and anyone can open it.
      - text: Make the repository private
        feedback: >-
          Clones and copies made before that still hold the key. Only a new key is safe.

  - type: explain-back
    id: explain-rejected-push
    concept: tooling.remotes
    difficulty: 3
    prompt: Why does a push fail when a teammate pushed first, and why does pulling fix it?
    rubric:
      - The remote has a commit you don't have on your laptop.
      - Accepting your push would drop that commit, so the remote refuses.
      - Pulling merges their commit into yours, so your push only adds commits.
    modelAnswer: >-
      Your teammate's commit is on the remote but not on your laptop. If the remote took your
      push, its `main` would jump to your commit and their work would vanish from it. So it
      refuses. `git pull` brings their commit down and merges it with yours. Now your history
      contains both, and pushing only adds to what's there.

recap:
  - "Clone a repository, and share commits with `git push` and `git pull`."
  - "Fix a rejected push by pulling first, then pushing again."
  - "Push a branch and open a pull request instead of pushing to `main`."

recall:
  - id: card-origin
    concept: tooling.remotes
    front: What is `origin`?
    back: >-
      The name Git gives the remote you cloned from. `git remote` lists it.
  - id: card-push-pull
    concept: tooling.remotes
    front: What do `git push` and `git pull` each do?
    back: >-
      `push` sends your new commits to the remote. `pull` brings its new commits down and
      merges them into your branch.
  - id: card-fetch-first
    concept: tooling.remotes
    front: A push fails with `rejected (fetch first)`. What do you do?
    back: >-
      Run `git pull` to bring in the commits you lack, then `git push` again.
  - id: card-pull-request
    concept: tooling.pull-requests
    front: What is a pull request for?
    back: >-
      It asks to merge your branch into `main`, so teammates can review and approve it first.
  - id: card-pushed-secret
    concept: tooling.remotes
    front: You pushed a commit containing a password. Why isn't deleting it in a new commit enough?
    back: >-
      The old commit stays in the history, and others may have copied it. Change the password.

