term: WCAG
aka: [Web Content Accessibility Guidelines, WCAG 2.2]
short: The W3C's testable rules for an accessible web, graded in levels A, AA and AAA.
explain: |
  "Make it accessible" is too vague to check. WCAG turns it into success criteria you can
  test. Text contrast must reach 4.5 to 1, say, and everything must work by keyboard.

  Each criterion has a level. A is the minimum, AA is what most laws and contracts ask for,
  and AAA is the strictest. Version 2.2 is current. An automated checker covers only part of
  it, so test by keyboard and by ear too.
analogy: Building regulations for ramps and handrails. Not a matter of taste, but a list an inspector can check.
usage: The new modal fails WCAG on focus order, so it can't ship yet.
twin:
  term: aria
  difference: WCAG is the rulebook that says what accessible means and how to test it. ARIA is one technical tool, a set of attributes that describe elements to assistive technology.
related: [contrast-ratio, keyboard-navigation, assistive-technology, aria]
level: 2
lessons: [design.accessibility-foundations, design.contrast-colour-and-motion]
