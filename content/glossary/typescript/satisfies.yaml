term: satisfies
aka:
  - satisfies operator
short: An operator that checks a value fits a type while keeping the value's own, more exact type.
explain: |
  Annotating `const sizes: Record<string, number>` checks the object but forgets its keys, so
  `sizes.large` is allowed even if it doesn't exist. Writing `satisfies` after the value
  checks it and remembers the exact keys.

  So you get both: an error if the value doesn't fit, and autocomplete on what's really
  there. It never changes the value's type the way `as` does.
analogy: A tailor checking a suit against your measurements. It must fit, but it stays your suit, not a generic one.
example:
  language: ts
  code: |
    const sizes = {
      small: 8,
      large: 16,
    } satisfies Record<string, number>;

    sizes.large; // fine
    sizes.huge; // error: no such key
usage: Use satisfies on the route table, so we keep the literal keys and still get checked.
twin:
  term: type-assertion
  difference: '`satisfies` checks that a value fits and keeps its exact type. `as` overrides the type without checking, so it can hide a mismatch.'
related:
  - type-assertion
  - type-annotation
level: 3
lessons:
  - ts.advanced-types
