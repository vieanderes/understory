term: graceful degradation
aka: [degraded mode, degrade gracefully]
short: A planned order of reduced service, so a system keeps doing something useful as parts fail.
explain: |
  When a dependency fails, the choice isn't only "work" or "error". A document assistant
  can fall back to a smaller model, then to plain search results. A shop can hide
  recommendations and still sell.

  Plan the order before launch, and test each step. Some things never degrade: permission
  checks fail closed, so a failure means no access, never open access.
analogy: A restaurant with a broken oven still serving salads and desserts, with a note on the menu.
usage: If the model is down, graceful degradation shows search results with links instead of an answer.
related: [fallback, circuit-breaker, hard-dependency, load-shedding]
level: 2
lessons: [sysdesign.case-ai-assistant]
