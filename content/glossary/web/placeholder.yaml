term: placeholder
aka: [placeholder text, placeholder attribute]
short: Faint hint text inside an empty input box that disappears once someone starts typing.
explain: |
  The grey "e.g. name@example.com" inside a box comes from an attribute on the input. It's a
  hint about the format, shown only while the box is empty.

  It's a poor stand-in for a label. It vanishes as you type, so you forget what the box was
  for. It's often too faint to read, and some screen readers skip it. Put instructions in a
  label, or in a hint below the field.
analogy: The faded "Write here" on a fresh notepad page. Useful until you start writing, then it's gone.
example:
  language: html
  code: |
    <label for="phone">Phone number</label>
    <input id="phone" type="tel" placeholder="07700 900123">
usage: The design uses placeholder text as the only label, and that fails as soon as someone starts typing.
twin:
  term: form-label
  difference: A placeholder is a temporary hint inside the box, gone once you type. A label is the field's lasting name, visible and announced the whole time.
related: [form-label, html-form, contrast-ratio]
level: 1
lessons: [design.forms-that-help, html.forms]
