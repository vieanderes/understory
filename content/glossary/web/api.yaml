term: API
aka:
  - application programming interface
  - web API
short: The set of requests one program accepts from another, and what it promises to send back.
explain: |
  Programs need to use each other without reading each other's code. So one side
  publishes a menu: these are the things you can ask for, this is how to ask, this is
  what you'll get.

  On the web that usually means URLs that take and return JSON. A library's public functions are an API too. Once others depend on it, it's a **contract**: rename one
  field and someone else's code breaks. That's why APIs get versions and change slowly.
analogy: A restaurant menu. You don't go into the kitchen; you order from the list, and the kitchen keeps its promises.
usage: The mobile app reads that field, so removing it from the API is a breaking change.
twin:
  term: endpoint
  difference: The API is the whole menu of things a service offers. An endpoint is one item on it, one method and URL such as `GET /orders/{id}`.
related:
  - endpoint
  - rest
  - json
