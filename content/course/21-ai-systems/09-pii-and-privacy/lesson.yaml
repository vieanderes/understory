  - kind: spec
    title: Art. 4 GDPR, Definitions
    venue: General Data Protection Regulation
    url: https://gdpr-info.eu/art-4-gdpr/
    note: The legal definition of personal data and of processing.
    primary: true
    verified: true
  - kind: spec
    title: Art. 5 GDPR, Principles relating to processing of personal data
    venue: General Data Protection Regulation
    url: https://gdpr-info.eu/art-5-gdpr/
    note: Purpose limitation, data minimisation and storage limitation.
    verified: true
  - kind: spec
    title: Art. 17 GDPR, Right to erasure
    venue: General Data Protection Regulation
    url: https://gdpr-info.eu/art-17-gdpr/
    note: When a person can ask for their data to be deleted.
    primary: true
    verified: true
  - kind: docs
