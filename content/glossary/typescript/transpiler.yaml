term: transpiler
aka: [transpile, transpiling, type stripping, source-to-source compiler]
short: A tool that rewrites code into another version of a language, such as TypeScript into plain JavaScript.
explain: |
  Browsers and Node run JavaScript, not TypeScript. Something has to remove the types
  before the code runs. Tools that rewrite one form of source code into another do that.

  Most of them work one file at a time and never check the types. That's why they're so
  fast, and why your dev server happily runs code full of type errors. Only the checker,
  `tsc`, reads the whole program and reports them. So a green build means nothing unless CI
  runs `tsc --noEmit` as well.
analogy: A translator who rewrites every page in an hour but never checks whether the story makes sense.
usage: The transpiler only strips types, so the deploy went out with a type error; add `tsc --noEmit` to CI.
twin:
  term: compiler
  difference: A compiler usually translates down to a lower level, like machine code, and often checks the program on the way. A transpiler rewrites into a sibling language at the same level, often without checking anything.
related: [compiler, tsconfig, type-erasure, bundler]
level: 2
lessons: [ts.configuration]
