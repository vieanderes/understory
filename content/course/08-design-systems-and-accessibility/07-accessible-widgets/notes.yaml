summary: >-
  A widget is a control made of parts that act as one: a disclosure, a dialog, a set of
  tabs, a menu, a combobox. Each owes its users three things. Assistive technology must learn
  what it is and what state it's in, the keyboard must operate every part, and focus must
  land somewhere sensible when things open and close. Native HTML elements come with all
  three. A widget built from `div` elements has none until you add them by hand.


  So the order of work is fixed. First look for an element that already does the job:
  `button`, `details`, `dialog`, `select`, `input` with a `list`. Only when none fits do you
  build the widget yourself, following the WAI-ARIA Authoring Practices Guide (APG). That
  guide gives each pattern its roles, its states and its keyboard behaviour, and users of
  screen readers expect exactly that behaviour.


  ARIA changes what the accessibility tree reports and nothing else. A role adds no keys,
  no focus and no behaviour. That's why the first rule of ARIA is to avoid it when HTML can
  do the job, and why every ARIA widget is a promise that your script must keep.
remember:
  - Use a native element whenever one fits, because it brings its role, keyboard support and states for free.
  - ARIA only changes what assistive technology is told; it never adds keyboard behaviour or focus handling.
  - A role says what something is, a state such as `aria-expanded` or `aria-selected` changes as the user acts, and a property such as `aria-controls` describes a relationship that rarely changes.
  - '`dialog.showModal()` moves focus in, makes the rest of the page inert, closes on Escape and returns focus to the element that was focused before.'
  - A disclosure is a real `button` with `aria-expanded`, and a menu button adds `aria-haspopup="menu"` and a `role="menu"` list driven by arrow keys.
  - In a composite widget such as tabs or a listbox, Tab enters and leaves the widget once, and arrow keys move inside it.
  - A live region such as `role="status"` must exist in the page before its text changes, or the change isn't announced.
  - Never put `aria-hidden="true"` on something that can take focus, because keyboard users can reach it while screen readers cannot see it.
sections:
  - title: The rules of ARIA, and what the browser does with them
    body: |-
      The W3C's guidance on using ARIA boils down to five rules. Each one exists because
      people broke it.

      1. If a native element or attribute has the semantics and behaviour you need, use it.
      2. Don't change native semantics unless you really have to. `<h2 role="button">`
         removes a heading; put a `button` inside the `h2` instead.
      3. Every interactive ARIA control must work with the keyboard.
      4. Don't use `role="presentation"` or `aria-hidden="true"` on a focusable element.
      5. Every interactive element needs an accessible name.

      Chromium shows why rule 4 matters. Here is what its accessibility tree reports for
      these elements:

      ```html
      <button role="presentation">Buy</button>   <!-- still "button Buy" -->
      <h2 role="presentation">Offers</h2>        <!-- heading removed, text stays -->
      <div aria-hidden="true"><button>Close</button></div> <!-- gone from the tree -->
      <a>Cart</a>                                 <!-- no href: not a link at all -->
      ```

      A focusable element keeps its role, because hiding it would strand keyboard users. The
      heading loses its role, so it vanishes from a screen reader's list of headings. The
      hidden button is the worst case: Tab still lands on it, and a screen reader has little
      or nothing to say. Use `inert` or `hidden` when content should be gone for everyone.

      ARIA attributes come in three kinds. **Roles** say what a thing is: `tab`, `dialog`,
      `switch`. **States** change as people interact: `aria-expanded`, `aria-selected`,
      `aria-pressed`, `aria-checked`, `aria-invalid`. **Properties** describe stable facts and
      relationships: `aria-controls`, `aria-labelledby`, `aria-haspopup`. Your script owns the
      states. If `aria-expanded` says `false` while the panel is open, the page lies to the
      user.
  - title: Disclosure and menu button
    body: |-
      A **disclosure** shows and hides a region. `details` is the native one. When you need
      your own, perhaps because the trigger sits apart from the panel, use a real `button`
      with `aria-expanded`:

      ```html
      <button type="button" aria-expanded="false" aria-controls="filters">Filters</button>
      <div id="filters" hidden>Price, size, colour</div>
      <script>
        const trigger = document.querySelector('[aria-controls="filters"]');
        const panel = document.getElementById("filters");
        trigger.addEventListener("click", () => {
          const open = trigger.getAttribute("aria-expanded") === "true";
          trigger.setAttribute("aria-expanded", String(!open));
          panel.hidden = open;
        });
      </script>
      ```

      The `button` already handles Enter, Space and focus. Chromium reports it as a button,
      "expanded" or "collapsed", which is all a screen reader user needs.

      A **menu button** opens a list of actions, like Rename, Duplicate and Delete on a
      document. The APG pattern:

      - The trigger is a `button` with `aria-haspopup="menu"`, `aria-expanded` and
        `aria-controls` pointing at the menu.
      - The menu is `role="menu"`, and each action is `role="menuitem"`, with
        `tabindex="-1"` so only script moves focus there.
      - Enter, Space or Down Arrow opens the menu and focuses the first item. Up Arrow opens
        it on the last item.
      - Inside, Up and Down Arrow move, Home and End jump, and a typed letter moves to the
        next item starting with it.
      - Escape closes the menu and returns focus to the trigger. Activating an item does the
        same.

      That's a lot of behaviour, which is the point: `role="menu"` promises it. A site's
      navigation is a list of links in a `nav`, and a set of choices where one stays picked
      is a radio group or a `select`. Use the menu pattern only for commands.
  - title: The native dialog, in depth
    body: |-
      `dialog` has two modes. `show()` opens it in place, without blocking anything.
      `showModal()` opens it in the **top layer**, above every other element, and makes the
      rest of the document inert. In Chromium 153, this modal behaves as follows:

      ```html
      <button id="open">Delete</button>
      <dialog id="confirm" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Delete this file?</h2>
        <p>This can't be undone.</p>
        <form method="dialog">
          <button value="cancel" autofocus>Cancel</button>
          <button value="delete">Delete</button>
        </form>
      </dialog>
      <script>
        const dialog = document.getElementById("confirm");
        document.getElementById("open").addEventListener("click", () => {
          dialog.returnValue = ""; // it keeps the last answer between openings
          dialog.showModal();
        });
        dialog.addEventListener("close", () => {
          if (dialog.returnValue === "delete") console.log("deleting");
        });
      </script>
      ```

      - Focus moves to the `autofocus` element, or to the first focusable one without it.
      - Tab cycles through the dialog's controls. The page behind can't be focused, clicked or
        found in the accessibility tree.
      - Escape fires a `cancel` event, then `close`.
      - A button in a `form method="dialog"` closes the dialog and sets `returnValue` to its
        `value`, with no script of your own. The value survives until something sets it
        again, which is why the script clears it before each opening.
      - After closing, focus returns to the element that was focused before, here the Delete
        button.

      Name the dialog with `aria-labelledby` pointing at its heading, so a screen reader says
      "Delete this file?, dialog" on opening. The `closedby` attribute controls light
      dismissal: `closedby="any"` also closes on a click outside. A modal defaults to
      `closerequest`, which means Escape but not an outside click. The `requestClose()` method
      closes the dialog as Escape would, firing `cancel` first so you can stop it with
      `preventDefault()`.

      Two traps. Calling `showModal()` on a dialog already open with `show()` throws an
      `InvalidStateError`. And a non-modal dialog does none of the focus trapping: Escape
      leaves it open, and Tab walks out into the page.
  - title: Tabs, roving tabindex and active descendant
    body: |-
      Composite widgets, the ones with many parts, count as **one Tab stop**. Arrow keys move
      between the parts. There are two ways to build that.

      **Roving tabindex** moves real focus. The current part has `tabindex="0"` and the rest
      `tabindex="-1"`. On an arrow key you swap the values and call `focus()` on the new
      part. The tabs pattern uses it:

      ```js
      function onTabKey(event, tabs) {
        const current = tabs.indexOf(event.target);
        const moves = {
          ArrowRight: (current + 1) % tabs.length,
          ArrowLeft: (current - 1 + tabs.length) % tabs.length,
          Home: 0,
          End: tabs.length - 1,
        };
        const next = moves[event.key];
        if (next === undefined) return;
        event.preventDefault();
        tabs.forEach((tab, i) => {
          const selected = i === next;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          document.getElementById(tab.getAttribute("aria-controls")).hidden = !selected;
        });
        tabs[next].focus();
      }
      ```

      That's **automatic activation**: a panel shows as soon as its tab gets focus. It's right
      when panels load instantly. If showing a panel is slow, use **manual activation**:
      arrows only move focus, and Enter or Space selects. Label the `tablist` with
      `aria-label`, link each tab to its panel with `aria-controls`, and name each panel with
      `aria-labelledby`. Give a panel `tabindex="0"` when it holds no focusable content, so
      keyboard users can reach its text.

      **Active descendant** leaves real focus on the container and points at the current part
      with `aria-activedescendant="some-id"`. A combobox needs it, because focus must stay in
      the text box while the person types. The trade-off: you draw the highlight yourself, and
      the browser won't scroll the active item into view for you.
  - title: Combobox and live regions
    body: |-
      A **combobox** is a text box with a popup of suggestions, like a city search. Before
      building one, try `input` with a `datalist`, which gives suggestions natively. The APG
      pattern for your own:

      ```html
      <label for="city">City</label>
      <input id="city" role="combobox" aria-expanded="true" aria-controls="city-options"
             aria-autocomplete="list" aria-activedescendant="city-2">
      <ul id="city-options" role="listbox">
        <li id="city-1" role="option" aria-selected="false">Leeds</li>
        <li id="city-2" role="option" aria-selected="true">Lisbon</li>
      </ul>
      ```

      Chromium reports a combobox named "City", expanded, controlling a listbox with two
      options, and adds `hasPopup` listbox by itself. Down Arrow opens the list and moves the
      active option, Enter accepts, and Escape closes. Your script updates
      `aria-activedescendant`, `aria-selected` and `aria-expanded` on every move.

      A **live region** announces a change that happens away from focus: "Saved", "3 results",
      "Upload failed". Screen readers watch these containers and read new text:

      ```html
      <div role="status"></div> <!-- polite: waits for a pause in speech -->
      <div role="alert"></div>  <!-- assertive: interrupts -->
      <script>
        const status = document.querySelector('[role="status"]');
        function showSaved() {
          status.textContent = "Draft saved";
        }
      </script>
      ```

      Chromium exposes `role="status"` as `aria-live="polite"` with `aria-atomic="true"`,
      and `role="alert"` as assertive. The `output` element is a status region too. The
      region must be in the page before the text changes: a region inserted along with its
      message is often missed. Keep `alert` for things that need attention now, because
      interrupting is expensive. WCAG 2.2 success criterion 4.1.3 Status Messages (Level AA)
      requires this for status messages that don't take focus.
pitfalls:
  - '**Adding a role and stopping there.** `<div role="button">` looks finished in the accessibility tree, but it takes no focus and ignores Enter and Space. Use `button`, or add `tabindex="0"` and both keys yourself.'
  - '**Using `role="menu"` for site navigation.** It sounds right because it''s a menu of pages. The role promises arrow keys and commands, and screen readers switch mode for it. Use a `nav` with a list of links.'
  - '**Letting states go stale.** The panel opens, but `aria-expanded` still says `false`, because the script changed only a class. Update states in the same function that changes what the eye sees.'
  - '**Hiding focusable content with `aria-hidden`.** The page looks tidy to a screen reader, but Tab still lands on invisible controls. Use `inert` or `hidden` to remove it for everyone.'
  - '**Opening a modal with `show()`.** The dialog appears, so it looks done, yet the page behind stays reachable and Escape does nothing. Use `showModal()` for anything that must be answered first.'
  - '**Creating the live region with the message.** Inserting `<div role="alert">Saved</div>` in one go is often not announced. Render the empty region on load, then change its text.'
verify:
  - lens: breaks
    check: 'Modals open with `showModal()`, so focus moves in, Escape closes them and focus returns to the opener.'
  - lens: breaks
    check: 'ARIA states such as `aria-expanded` change in the same function that changes what the eye sees.'
  - lens: confuses
    check: 'Site navigation is a `nav` with a list of links, never `role="menu"`, which promises arrow keys.'
  - lens: tests
    check: 'Each widget is used by keyboard alone and with a screen reader, checking its role, its name and every state change.'
interview:
  - question: What's the first rule of ARIA, and why does it exist?
    answer: >-
      Don't use ARIA when a native element or attribute already does the job. ARIA only
      changes what the accessibility tree reports. A `div` with `role="button"` is announced
      as a button, but it isn't focusable, doesn't respond to Enter or Space and doesn't
      submit forms, so every bit of that behaviour becomes code you must write and test. A
      real `button` has it all, works in every browser and assistive technology, and can't
      drift out of sync. So I look for `button`, `details`, `dialog`, `select` or a
      `fieldset` first. I reach for ARIA when there's no native element, as with tabs or a
      combobox, and then I follow the APG pattern exactly, because users expect its keys.
  - question: How would you build an accessible modal dialog today?
    answer: >-
      With the native `dialog` element opened by `showModal()`, because the browser then
      handles the hard parts. Focus moves into the dialog, to the `autofocus` control or the
      first focusable one. The rest of the page becomes inert, so Tab, clicks and screen
      readers can't reach it. Escape fires `cancel` and closes it, and focus returns to the
      element that opened it. I'd name it with `aria-labelledby` pointing at its heading, and
      use a `form method="dialog"` so each button sets `returnValue`. For a destructive
      question I'd autofocus Cancel. The trade-off is less control over animation and
      stacking than a custom modal. A custom one must rebuild inertness, the focus trap,
      Escape and focus return, and one of them usually gets missed.
  - question: What's the difference between roving tabindex and aria-activedescendant?
    answer: >-
      Both make a composite widget one Tab stop with arrow keys inside, but roving tabindex
      moves real focus and active descendant doesn't. With roving tabindex, the current item
      has `tabindex="0"`, the others `-1`, and on each arrow key you swap the values and call
      `focus()`. The browser draws the focus ring and scrolls the item into view. With
      `aria-activedescendant`, focus stays on the container, which points at the current
      item's `id`. That's necessary in a combobox, where focus must stay in the text box so
      typing works. The cost is that you style the active item and scroll it into view
      yourself. I use roving tabindex for tabs, toolbars and radio-like groups, and active
      descendant for comboboxes and listboxes driven from a text box.
  - question: A search updates results as you type. How do you tell screen reader users?
    answer: >-
      With a polite live region that's already in the page, updated after the results
      settle. I'd render an empty `div role="status"` on load. When results arrive, I set its
      text to something short like "12 results", debounced so it isn't announced on every
      keystroke. Screen readers announce changes to that region without moving focus, which
      matters because the user is still typing. `role="status"` is polite, so it waits for a
      pause in speech. I'd avoid `role="alert"`: it interrupts, and search results aren't
      urgent. The region must exist before the change, because a region inserted with its
      message is often not announced. This is what WCAG 2.2 criterion 4.1.3 Status Messages
      asks for.
  - question: How do you make a streamed AI answer accessible to screen reader users?
    answer: >-
      Put the answer in a live region that exists before the first token arrives, with
      `aria-live="polite"`, so announcements wait for a pause instead of interrupting. But
      don't let it announce every token: a screen reader reading fragments as they land is
      noise. Mark the region `aria-busy="true"` while streaming, which asks assistive tech
      to hold back until it's false, and announce the finished answer, or sentence-sized
      pieces for long ones. A short status such as "Thinking" and "Answer ready" helps too.
      Errors go in a `role="alert"` region. Keep the basics: real buttons for Send and
      Stop, full keyboard use, focus that doesn't jump while text grows, and no typing
      animation for people who prefer reduced motion. Support for `aria-busy` varies, so I
      test with a real screen reader, not only axe.
