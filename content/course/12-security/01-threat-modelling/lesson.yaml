id: security.threat-modelling
title: What attackers want
objective: "Say what security means for a web developer, read the OWASP Top 10 as a map, and write a threat model for a small app."
level: essential
minutes: 10
concepts: [security.owasp-top-ten, security.assets-and-attackers, security.attack-surface, security.stride]
prerequisites: [backend.validation, backend.authorisation]
opening:
  text: >-
    You'll learn what attackers are after in a web app, and where they try to get in. With that
    map, every defence in this chapter has a clear job.

steps:
  - type: prose
    id: what-security-is
    body: >-
      Picture a notes app. Security means three things go wrong only for the right people.
      Nobody **reads** notes that aren't theirs. Nobody **changes** them. Nobody **knocks the
      app offline**.


      An **attacker** is anyone trying to make one of those happen: a curious user, a script
      that tries thousands of passwords, a former employee. Your job is to make that expensive.

  - type: prose
    id: owasp-map
    body: >-
      **OWASP** is a non-profit that shares web security advice for free. Its **Top 10**
      lists the most common serious risks, rebuilt from real app data every few years. The
      latest list:


      - Broken access control

      - Security misconfiguration

      - Supply chain failures

      - Cryptographic failures

      - Injection

      - Insecure design

      - Authentication failures

      - Integrity failures

      - Logging and alerting failures

      - Mishandled errors


      It's this chapter's map.

  - type: multiple-choice
    id: pick-owasp-risk
    concept: security.owasp-top-ten
    difficulty: 1
    language: text
    code: |
      GET /notes/41   → your note
      GET /notes/42   → someone else's note
    question: You change the number in the address and read a stranger's note. Which risk is that?
    choices:
      - text: Broken access control
        correct: true
        feedback: >-
          Right. Nobody checked the note was yours. It's first on the list.
      - text: Injection
        feedback: >-
          Injection is input read as code. Here a plain number reached data it shouldn't.
      - text: Cryptographic failures
        feedback: >-
          Nothing was encrypted or decrypted here. The server forgot to ask whose note it is.

  - type: prose
    id: assets-and-attackers
    body: >-
      A **threat model** is a short written list of what could go wrong, made before anyone
      tries. It starts with two questions. What's worth protecting? Those are the **assets**.
      Who would want them? Those are the attackers.


      For a clinic's booking app: patients' names and appointments, staff accounts, and the
      power to cancel bookings. The attackers: a nosy patient, a password-guessing bot, an
      angry ex-employee.

  - type: prose
    id: entry-points-and-boundaries
    body: |-
      Next, find where outsiders can send something in. Each such place is an **entry point**:

      ```text
      browser ──booking form──▶ api ──SQL──▶ database
      payment provider ──webhook──▶ api
      ```

      All entry points together are the **attack surface**. A **trust boundary** is where
      data moves into a more trusted part, like browser to API. Every crossing needs a check.

  - type: code-challenge
    id: write-boundary-crossings
    concept: security.attack-surface
    difficulty: 3
    language: ts
    prompt: >-
      List the places checks belong. Write `boundaryCrossings(trust, flows)`. `trust` maps each
      part to a number: `browser` 0, `api` 1, `database` 2. Higher is more trusted. Each flow is
      `{ from, to, data }`.


      A crossing is a flow whose `to` is more trusted than its `from`. Return one string per
      crossing, like `'order form from browser to api'`, in the order given. Skip a flow that
      names an unknown part. Data going the other way, or between equals, isn't a crossing.
    hints:
      - Look up both ends in `trust` before comparing them.
      - The check is one comparison, `from` against `to`.
      - "Start with `const fromTrust = trust[flow.from];` and test it for `undefined`."

  - type: prose
    id: stride
    body: >-
      For each entry point, ask what could go wrong. **STRIDE** is a checklist, one letter
      per kind of threat:


      - **S**poofing: pretending to be someone else

      - **T**ampering: changing data you shouldn't

      - **R**epudiation: denying you did something, with no record to prove it

      - **I**nformation disclosure: seeing data you shouldn't

      - **D**enial of service: making the app unusable

      - **E**levation of privilege: getting powers you weren't given

  - type: bug-hunt
    id: hunt-wrong-stride-letter
    concept: security.stride
    difficulty: 2
    language: yaml
    code: |
      # threats for the clinic booking app
      - entry: sign-in form
        threat: someone signs in with a stolen password
        stride: Spoofing
      - entry: booking form
        threat: a patient edits the hidden price field
        stride: Tampering
      - entry: error page
        threat: shows the database password to anyone
        stride: Tampering
      - entry: booking form
        threat: a bot sends 10,000 bookings a minute
        stride: Denial of service
    prompt: >-
      A teammate labelled each threat with its STRIDE letter. One label is wrong. Tap it.
    lines: [10]
    reasons:
      - text: A leaked password is information disclosure
        correct: true
        feedback: >-
          Yes. Nothing was changed. Someone saw what they shouldn't.
      - text: A stolen password is elevation, not spoofing
        feedback: >-
          Signing in as someone else is pretending to be them. That's spoofing.
      - text: Editing the price is information disclosure
        feedback: >-
          The patient changed data they shouldn't. Changing is tampering; seeing would be disclosure.
    fix: |
      - entry: error page
        threat: shows the database password to anyone
        stride: Information disclosure

  - type: ai-review
    id: review-threat-list-no-attacker
    concept: security.assets-and-attackers
    difficulty: 3
    language: yaml
    request: Write a threat model for the booking app so we can plan the security work.
    flawClass: logic
    code: |
      # threat-model-bookings.yaml
      controls:
        - limit every endpoint to 10 requests a minute
        - log every request
        - run a dependency scanner in CI
        - make passwords at least 12 characters
    prompt: >-
      An assistant wrote this. Each item is a real control. Yet nothing says what it
      protects, or from whom. Tap the line at fault.
    lines: [2]
    reasons:
      - text: It lists defences without assets or attackers
        correct: true
        feedback: >-
          Yes. Name the patient data and who wants it, and the right controls follow.
      - text: 10 requests a minute is too low
        feedback: >-
          Maybe, maybe not. Nobody can tell without knowing what's being protected, from whom.
      - text: Passwords should be 16 characters
        feedback: >-
          Tuning one control is guesswork until the threats are written down. That's the missing step.
    fix: |
      # threat-model-bookings.yaml
      assets: [patient appointments, staff accounts, cancelling bookings]
      attackers: [nosy patient, password-guessing bot, angry ex-employee]
      entry points: [sign-in form, booking form, payment webhook]
      threats:
        S sign-in: limit attempts per account
        I GET /bookings/:id: check the booking is the patient's
        D booking form: limit bookings per account

  - type: explain-back
    id: explain-why-start-with-assets
    concept: security.assets-and-attackers
    difficulty: 3
    prompt: >-
      A teammate wants to start the security work by "fixing everything on the OWASP Top 10".
      Why write a threat model first?
    rubric:
      - A list of risks has no order for your app, so effort goes to whatever's easiest.
      - Naming the assets and attackers says which threats are real for this system.
      - Each defence then answers a written threat, so a missing one is a visible gap.
    modelAnswer: >-
      The Top 10 is a map of common risks, not a plan for our app. Without a threat model
      we'd fix things in the order we think of them. Naming the patient data and who wants it
      tells us which threats matter most here. Then every defence answers a threat we wrote
      down, so we can see what's still open. The list helps us check we missed nothing.

recap:
  - Name the three things attackers want, and use the OWASP Top 10 as a map.
  - Write down the assets, the attackers and every entry point.
  - Check each trust boundary, and walk each entry point through STRIDE.

recall:
  - id: card-owasp-top-ten
    concept: security.owasp-top-ten
    front: What is the OWASP Top 10, and what sits at the top of the 2025 list?
    back: >-
      A list of the most common serious web app risks, rebuilt from real data every few years.
      Broken access control is first.
  - id: card-two-questions
    concept: security.assets-and-attackers
    front: What two questions does a threat model start with?
    back: >-
      What's worth protecting, and who would want it. Defences come after, to answer those.
  - id: card-trust-boundary
    concept: security.attack-surface
    front: What's a trust boundary, and what belongs there?
    back: >-
      The line where data crosses into a more trusted part, such as browser to API. The
      checks belong at that line.
  - id: card-stride-letters
    concept: security.stride
    front: Name the six STRIDE threat types.
    back: >-
      Spoofing, tampering, repudiation, information disclosure, denial of service, elevation
      of privilege.

