summary: >-
  LLMOps is ordinary software discipline applied to the parts of an AI feature that don't look
  like code: the prompt, the model name and its settings, the retrieval configuration. Each of
  them changes answers as surely as a code change does, so each is versioned in the
  repository, reviewed in a pull request, tested by an eval suite in CI, and recorded on every
  response it produces.


  The problem it solves is the silent regression. A model feature never crashes when it gets
  worse. It returns 200, on time, with a confident answer that is now wrong for one kind of
  question. Without versions on responses, traces per call and quality dashboards, you find out
  from a customer, weeks later, and you can't say which change caused it.


  Reach for the full loop as soon as a model feature has real users or more than one person
  editing prompts: versioned prompts, a small eval gate on every relevant pull request, a
  nightly full suite, a span per model call, and online quality metrics with alerts. A
  throwaway prototype needs none of it. A prompt stored in a database and edited live by
  non-engineers needs all of it more, because it bypasses review by design.
remember:
  - A prompt, a model name and its settings change behaviour like code, so they live in the repository and change only through reviewed pull requests.
  - Every response records the prompt name, prompt version, model and settings that produced it, or a bad answer can't be reproduced.
  - A pull request that touches a prompt, a model setting or retrieval runs a small eval suite, compared per slice with main, and fails on a real drop.
  - Some eval items are must-pass, such as a refusal of a dangerous request, and one failure blocks the merge whatever the average says.
  - Each model call gets a span with prompt version, model, tokens, cost, latency and stop reason, while message text stays out by default because it carries personal data.
  - Latency and error rate don't move when answers get worse, so quality is watched through online eval scores and user signals such as retries and edits.
  - Small eval sets are noisy, so judge a drop against its sampling error before you block or roll back.
sections:
  - title: What a versioned prompt looks like in the repository
    body: |-
      A prompt is more than its text. The model, the temperature and the output limit shape
      the answer too, so they belong in the same versioned object. Store it as a module or a
      data file next to the code that calls it, and give it a name and a version that a
      reviewer sees change in the diff.

      ```python
      import hashlib
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Prompt:
          name: str
          version: str
          model: str
          temperature: float
          max_tokens: int
          text: str

          @property
          def digest(self) -> str:
              # A hash of everything that shapes the answer catches an edit without a version bump.
              raw = f"{self.model}|{self.temperature}|{self.max_tokens}|{self.text}"
              return hashlib.sha256(raw.encode()).hexdigest()[:12]


      SUPPORT_ANSWER = Prompt(
          name="support-answer",
          version="v7",
          model="large-model-2026-06",
          temperature=0.2,
          max_tokens=1024,
          text="You answer questions about orders. Use only the sources given.",
      )


      def stamp(prompt: Prompt, reply_text: str) -> dict:
          # Every stored response carries what produced it.
          return {
              "text": reply_text,
              "prompt": prompt.name,
              "prompt_version": prompt.version,
              "prompt_digest": prompt.digest,
              "model": prompt.model,
          }


      print(stamp(SUPPORT_ANSWER, "Your order ships on Monday."))
      ```

      The digest is a safety net. People forget to bump the version, and a hash of the real
      inputs still tells two variants apart in your traces.

      Pin a dated model identifier where your provider offers one. An alias that always points
      at the newest model means the provider can change your behaviour without a pull request.
      If you must use an alias, record the model name the response reports, not the one you
      asked for.

      Teams that let product people edit prompts in a web tool still get these properties if
      the tool writes to the repository, or if it publishes immutable versions that the code
      pins and the eval gate runs against. Editing a live prompt in place gives up all of them.
  - title: A per-slice eval gate with must-pass items
    body: |-
      A single average hides the regression you care about. A prompt change can raise the
      overall score while breaking refunds, because refunds are a tenth of the set. So the gate
      compares **pass rates per slice** against the main branch, and treats some items as
      must-pass.

      ```python
      from collections import defaultdict


      def pass_rates(results):
          by_slice = defaultdict(list)
          for r in results:
              by_slice[r["slice"]].append(r["passed"])
          return {name: sum(v) / len(v) for name, v in by_slice.items()}


      def gate(baseline, candidate, max_drop=0.05):
          """Compare a pull request's eval run with main's. Return the reasons to fail."""
          failures = []
          # A must-pass item fails the build on its own, whatever the averages say.
          for r in candidate:
              if r.get("must_pass") and not r["passed"]:
                  failures.append(f"must-pass failed: {r['id']}")
          before, after = pass_rates(baseline), pass_rates(candidate)
          for name, rate in after.items():
              if name in before and before[name] - rate > max_drop:
                  failures.append(f"{name}: {before[name]:.2f} -> {rate:.2f}")
          return failures


      main_run = [
          {"id": "r1", "slice": "refunds", "passed": True},
          {"id": "r2", "slice": "refunds", "passed": True},
          {"id": "s1", "slice": "shipping", "passed": True},
          {"id": "x1", "slice": "safety", "passed": True, "must_pass": True},
      ]
      pr_run = [
          {"id": "r1", "slice": "refunds", "passed": True},
          {"id": "r2", "slice": "refunds", "passed": False},
          {"id": "s1", "slice": "shipping", "passed": True},
          {"id": "x1", "slice": "safety", "passed": False, "must_pass": True},
      ]

      problems = gate(main_run, pr_run)
      print(problems)
      raise SystemExit(1 if problems else 0)
      ```

      The non-zero exit code is what fails the CI job. Post the list as a pull request comment
      too, so the reviewer sees which slice moved and by how much.

      Where does the baseline come from? Either run the same suite on main in the same job,
      which doubles cost but controls for a changed model or judge, or store main's last
      scores as an artefact and compare with those. Rerun the baseline whenever the judge
      prompt or judge model changes, because a new judge moves every score at once.

      Keep the pull request suite small, a few dozen to a few hundred items, cached where the
      inputs haven't changed. The full suite, with slow agent runs and pairwise comparisons,
      runs nightly and on release branches.
  - title: Is the drop real? Noise in small eval sets
    body: |-
      Model outputs vary between runs, and a pass rate on 50 items moves by several points on
      noise alone. A gate that fails on every wobble teaches the team to rerun until green,
      which is worse than no gate. So compare a drop with its **sampling error** before
      trusting it.

      ```python
      import math


      def drop_is_real(p_before, n_before, p_after, n_after, z=2.0):
          # Standard error of the difference between two pass rates.
          se = math.sqrt(p_before * (1 - p_before) / n_before + p_after * (1 - p_after) / n_after)
          return (p_before - p_after) > z * se


      print(drop_is_real(0.90, 50, 0.84, 50))      # False: six points on 50 items is noise
      print(drop_is_real(0.90, 2000, 0.84, 2000))  # True: the same drop on 2,000 items is not
      ```

      This is a rough check that treats items as independent, but it gives the right
      instinct. Three practical consequences follow.

      - Grow the slices you gate on. A slice of ten items can't detect anything short of a
        collapse.
      - Run the same items on both branches. A paired comparison, counting items that flipped
        from pass to fail and back, is far more sensitive than two independent averages.
      - Reduce variance at the source: temperature 0 or low for the model under test, a fixed
        judge, and several samples per item for the ones that flip.

      Must-pass items sidestep the statistics on purpose. For a safety refusal, one failure is
      a finding, not noise.
  - title: Tracing a model call without leaking data
    body: |-
      A span per model call turns "answers got worse on Thursday" into a query. The fields are
      the ones the lesson lists. The shape below records them with a context manager and maps
      them to attribute names in one place, because the OpenTelemetry GenAI conventions are
      still marked as in development and can be renamed.

      ```python
      import time
      from contextlib import contextmanager

      SPANS = []  # stands in for a tracing exporter


      def to_otel(fields: dict) -> dict:
          # One mapping function, so a rename in the draft conventions touches one place.
          return {
              "gen_ai.request.model": fields.get("model"),
              "gen_ai.usage.input_tokens": fields.get("input_tokens"),
              "gen_ai.usage.output_tokens": fields.get("output_tokens"),
              "app.prompt.name": fields.get("prompt"),
              "app.prompt.version": fields.get("prompt_version"),
              "app.cost_usd": fields.get("cost_usd"),
              "app.stop_reason": fields.get("stop_reason"),
              "app.latency_ms": fields.get("latency_ms"),
          }


      @contextmanager
      def model_span(prompt, version, model):
          fields = {"prompt": prompt, "prompt_version": version, "model": model}
          start = time.perf_counter()
          try:
              yield fields
          finally:
              fields["latency_ms"] = round((time.perf_counter() - start) * 1000)
              SPANS.append(to_otel(fields))


      def fake_call():
          return {"text": "Refunds take five days.", "input_tokens": 1800, "output_tokens": 60,
                  "stop_reason": "end_turn"}


      with model_span("support-answer", "v7", "large-model-2026-06") as span:
          reply = fake_call()
          span.update(input_tokens=reply["input_tokens"], output_tokens=reply["output_tokens"],
                      stop_reason=reply["stop_reason"],
                      cost_usd=(reply["input_tokens"] * 3 + reply["output_tokens"] * 15) / 1_000_000)

      print(SPANS[0])
      ```

      The `finally` block matters: a call that raises or times out still produces a span, and
      failed calls are exactly the ones you want to see.

      The stop reason earns its place. A rise in replies that stopped at the token limit
      explains truncated answers that no error log would show.

      Message text is the hard part. You need examples to debug, and the text carries names,
      emails and order details. The usual compromise is metadata on every span, and full text
      only for a sampled, redacted subset kept in a store with its own access control and a
      short retention period, with deletion requests honoured there too. A span links to that
      record by id rather than holding the text.
  - title: Watching quality in production, and shipping changes safely
    body: |-
      Offline evals test the questions you thought of. Production shows you the ones you
      didn't, and model or data drift that arrives with no deploy at all. Four signals do most
      of the work.

      - An **online eval score**: a sample of real traffic, redacted, scored by a calibrated
        judge or a cheap check such as grounding, charted per slice and per prompt version.
      - **User behaviour**: retries, rephrased questions, edits to a draft, thumbs down,
        escalations to a person. Noisy alone, telling when several move together.
      - **Refusal and fallback rates**: a jump in "I can't help with that" often means a
        prompt edit made the model over-cautious.
      - **Shape metrics**: output length, stop reasons, tool calls per task. A sudden shift
        with no deploy points at the provider.

      Alert on these like any service level: a threshold, a window long enough to beat noise,
      and a named owner.

      Changes then go out the way risky code does. Put the prompt version behind a flag, send a
      few per cent of traffic to the new version, compare online scores per version, and widen
      or roll back. A **shadow run** sends real inputs to the new version without showing its
      answers, which is safe for read-only features and doubles their cost. Every failure you
      find goes back into the eval set, so the gate catches it next time.
pitfalls:
  - "**Recording only the prompt name.** `support-answer` without its version can't tell you which text ran on Tuesday. Record name, version, a digest of the inputs, and the model the response reports."
  - "**Gating on one average.** A change that helps the common case can halve a small slice and still raise the mean. Gate per slice, and add must-pass items for the cases that may never break."
  - "**Mocking the model in the eval job.** Unit tests mock the client, and that's fine. An eval that mocks the model measures nothing. The gate has to call the real model and the real judge, with the cost that implies."
  - "**Rerunning until green.** A flaky gate gets rerun until it passes, which turns it into a coin flip. Size slices so drops beat the noise, compare on the same items, and lower sampling temperature for the model under test."
  - "**Logging full prompts and replies on every span.** It's the quickest way to debug and the quickest way to put personal data into a system with wide access and long retention. Keep text out by default and sample it into a separate, redacted, access-controlled store."
  - "**Trusting a floating model alias.** An alias that points at the newest model lets the provider change behaviour with no pull request and no eval run. Pin a dated version where one exists, and run the eval suite before moving the pin."
  - "**Changing the judge and the prompt in one pull request.** Both move scores, so you can't tell which caused the difference. Change the judge alone, re-baseline, then change the prompt."
  - '**Shipping a new version to everyone at once.** CI evals test the questions you thought of, and live traffic brings the rest. Go through shadow, canary and A/B stages, with the old version one flag away.'
interview:
  - question: How would you stop a prompt change from quietly making answers worse?
    answer: >-
      Treat the prompt as code and put an eval gate in front of it. The prompt, model and
      settings live in the repository, so a change is a reviewed pull request. CI runs a small
      eval suite whenever prompts, model settings or retrieval code change, and compares pass
      rates per slice with main, failing on a drop beyond a threshold or on any must-pass item,
      such as a safety refusal. The scores post to the pull request. A larger suite runs
      nightly. After merge, the version ships behind a flag to a slice of traffic while online
      scores are compared per version. The trade-off is cost and speed: the gate calls real
      models, so I keep the pull request suite small and cached, and accept that it catches
      the common regressions rather than every one.
  - question: A customer says the assistant gave a wrong answer last Tuesday. How do you investigate?
    answer: >-
      I find the trace for that request and reproduce it with exactly what ran. Every response
      records its prompt name and version, the model and its settings, and the span links to
      the retrieved context and any tool calls. With that I can rerun the same prompt version
      on the same input and see whether the model, the retrieval or the prompt is at fault. If
      retrieval returned the wrong document, it's a search problem. If the right document was
      there and the answer ignored it, it's the prompt or the model. Either way the case goes
      into the eval set so the gate catches it next time. The catch is data retention: if
      message text isn't stored for that request, I may only have metadata, which is the
      price of keeping personal data out of traces.
  - question: What do you put in a trace for an LLM call, and what do you leave out?
    answer: >-
      Put in everything needed to explain cost, latency and behaviour, and leave out the raw
      text by default. Each call gets a span with the prompt name and version, the model,
      input, cached and output tokens, cost, latency, stop reason, and ids linking to
      retrieval and tool spans in the same trace. I map those to the OpenTelemetry GenAI
      attribute names in one function, since the conventions are still in development. Message
      text carries personal data, so it's off by default and captured only for a sampled,
      redacted subset in a separate store with tight access and short retention. The
      trade-off is debuggability: without text some bugs take longer, which I accept rather
      than copying customer data into every observability tool.
  - question: Your eval gate fails on about one pull request in five for changes that shouldn't matter. What do you do?
    answer: >-
      That's a noise problem, and I'd fix the gate rather than let people rerun it. First I'd
      check slice sizes: a pass rate on ten items swings by ten points per item, so small
      slices need more examples or shouldn't gate alone. Then I'd compare paired results on
      the same items, which is much more sensitive than two averages. I'd lower temperature
      for the model under test and pin the judge model and prompt, and sample the flaky items
      several times. I'd set the threshold from the observed run-to-run spread on unchanged
      code. The trade-off is that a looser threshold catches only larger regressions, so
      must-pass items cover the cases where a single failure matters.
  - question: How would you roll out a new prompt or model version to production?
    answer: >-
      In stages, each one exposing fewer people than the next and each with a way back. After
      the CI eval gate passes, I'd run the new version in **shadow**: it answers copies of live
      requests, is scored by online evals, and nobody sees its output. That's safe only for
      read-only features, and it doubles their cost. Then a **canary**: a few per cent of
      users get it, with automatic rollback if its online score, refusal rate or latency
      drops. Then an **A/B test**, sized to detect the change that matters, comparing the
      outcome metric such as resolved tickets, per slice. Then everyone, with the old version
      behind a flag. The trade-off is time, so small, low-risk prompt fixes can skip the A/B stage.
  - question: How do you A/B test an LLM feature, and what makes it harder than a button colour test?
    answer: >-
      Randomise by user, not by request, so each person gets one consistent version, and
      compare an outcome metric chosen in advance, such as task completion or tickets
      resolved, with a guardrail like escalation rate. It's harder for three reasons. Outputs
      are noisy even for the same input, so you need larger samples or paired offline evals
      alongside. The effects are often in slices, a better average hiding worse answers for
      one language or one kind of question, so I'd report per slice. And cost and latency
      differ between versions, so the winner has to be worth its price. I'd also watch
      for novelty effects and run long enough to cover a full weekly cycle.
