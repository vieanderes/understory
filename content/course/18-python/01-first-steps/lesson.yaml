id: python.first-steps
title: Python, coming from JavaScript
objective: Run Python, print values, name them, format text with f-strings, and read Python's indented blocks.
level: essential
minutes: 10
concepts: [python.running-python, python.names-and-values, python.f-strings, python.indentation]
opening:
  text: >-
    You already write JavaScript, so most of Python is new spelling for ideas you know.
    You'll run your first line in a minute, and translate a JavaScript function by the end.

steps:
  - type: prose
    id: running-a-file
    body: |-
      **Python** is a programming language, like JavaScript. It's the language of AI work:
      model SDKs, data tools and eval scripts are written for it first.

      On your own computer, Python lives in files ending in `.py`. You run one in the
      terminal with `python3 hello.py`. In this app, we run it for you.

      ```python
      print("Hello")
      ```

      `print` is Python's `console.log`.

  - type: code-challenge
    id: write-first-print
    concept: python.running-python
    difficulty: 1
    language: python
    starter: first.starter.py
    solution: first.solution.py
    tests: first.tests.py
    prompt: >-
      Run the code and watch `Hello` appear. Then make it print `Hello, Python` instead, and
      add a second line that prints the answer to `7 * 6`. Let Python do the maths.
    hints:
      - 'The text you see is whatever sits inside the quotes.'
      - 'A sum without quotes is worked out before it is shown.'
      - 'Change the first line to `print("Hello, Python")`. The sum goes in a second `print`, with no quotes.'

  - type: prose
    id: names-and-values
    body: |-
      Most of what you know carries over. The spelling changes:

      ```python
      city = "Oslo"       # no let or const
      count = 3           # no semicolons
      done = True         # True, False, None
      print(city, count)  # Oslo 3
      ```

      A **name** is made the first time you assign to it, and `#` starts a comment.
      `True`, `False` and `None` start with a capital. `None` plays the part of `null`.
      `print` puts a space between its values.

  - type: predict-output
    id: predict-no-conversion
    concept: python.names-and-values
    difficulty: 2
    language: python
    code: |
      age = 30
      label = "Age: " + age
      print(label)
    question: What happens when this runs?
    choices:
      - text: 'It stops with a `TypeError`'
        correct: true
        feedback: >-
          Right. Python won't turn the number into text for you.
      - text: '`Age: 30`'
        feedback: >-
          That's what JavaScript would do, and most people pick it. Python refuses to join
          text and a number.
      - text: '`Age: age`'
        feedback: >-
          `age` has no quotes, so it's the value 30. The trouble is its type.
      - text: '`30`'
        feedback: >-
          Nothing is dropped. The join itself fails before anything is shown.

  - type: prose
    id: f-strings
    body: |-
      The error reads `can only concatenate str (not "int") to str`. The fix is an
      **f-string**, Python's template literal. Put `f` before the quotes, and names in
      braces, with no `$`:

      ```python
      age = 30
      print(f"Age: {age}")
      print(f"Next year: {age + 1}")
      ```

      A format goes after a colon: `{price:.2f}` shows two decimals. Forget the `f`, and
      the braces print exactly as typed.

  - type: bug-hunt
    id: hunt-missing-f
    concept: python.f-strings
    difficulty: 2
    language: python
    code: |
      name = "Ana"
      unread = 3
      print("Hi {name}, you have {unread} new messages")
    prompt: 'This prints `Hi {name}, you have {unread} new messages`, braces and all. Tap the line at fault.'
    lines: [3]
    reasons:
      - text: The `f` before the quotes is missing
        correct: true
        feedback: >-
          Right. Without the `f`, braces are plain text.
      - text: The braces need a `$`, as in JavaScript
        feedback: >-
          That's the template-literal habit. An f-string uses plain braces, and the `f`
          before the quotes switches them on.
      - text: '`unread` must be turned into text first'
        feedback: >-
          An f-string converts it for you. It only needs the `f` to fill the braces.
    fix: |
      name = "Ana"
      unread = 3
      print(f"Hi {name}, you have {unread} new messages")

  - type: prose
    id: indentation
    body: |-
      Python has no braces around blocks. A colon opens a block, and the indented lines
      under it are the block:

      ```python
      def greet(hour):
          if hour < 12:
              return "Good morning"
          return "Hello"
      ```

      `def` makes a function, like `function` in JavaScript. `if` needs no brackets around
      its condition. A block ends where its indentation does. Four spaces is the
      convention, and a stray space is an error, not a matter of style.

  - type: bug-hunt
    id: hunt-indentation
    concept: python.indentation
    difficulty: 2
    language: python
    code: |
      temperature = 25
      if temperature > 20:
      print("Warm")
    prompt: 'This stops with `IndentationError: expected an indented block`. Tap the line to fix.'
    lines: [3]
    reasons:
      - text: The block after the colon must be indented
        correct: true
        feedback: >-
          Exactly. Without indentation, the `if` has no block at all.
      - text: '`if` needs brackets around the condition'
        feedback: >-
          Brackets are allowed but never needed in Python. The missing indent is the problem.
      - text: '`print` needs a semicolon'
        feedback: >-
          Python lines end at the line break. No semicolon needed.
    fix: |
      temperature = 25
      if temperature > 20:
          print("Warm")

  - type: code-challenge
    id: write-order-line
    concept: python.f-strings
    difficulty: 2
    language: python
    starter: order.starter.py
    solution: order.solution.py
    tests: order.tests.py
    editable: '2-3'
    prompt: |-
      Translate this JavaScript into Python, as `order_line(item, qty, price)`.

      ```js
      function orderLine(item, qty, price) {
        const total = qty * price;
        if (total >= 50) {
          return `${qty} x ${item}: ${total.toFixed(2)}, free delivery`;
        }
        return `${qty} x ${item}: ${total.toFixed(2)}`;
      }
      ```

      Example: `order_line("Tea", 4, 2.5)` returns `4 x Tea: 10.00`.
    hints:
      - 'The f-strings step shows names in braces, and a format after a colon.'
      - '`toFixed(2)` becomes `:.2f` inside the braces. `const` has no Python spelling, so drop it.'
      - 'Start with `total = qty * price`, then an `if total >= 50:` block that returns an f-string.'

  - type: explain-back
    id: explain-indentation
    concept: python.indentation
    difficulty: 3
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer who knows some JavaScript asks why you fuss over spaces. Why is a stray
      indent a bug in Python, when in JavaScript it's only untidy?
    rubric:
      - JavaScript marks blocks with braces and ignores indentation.
      - Python uses indentation to decide which block a line belongs to.
      - So moving a line in or out changes what runs, or stops the file with an error.
    modelAnswer: >-
      In JavaScript the braces say where a block ends, so indentation is only for people.
      Python has no braces: the indentation is the block. Indent a line and it joins the
      block above it. Dedent it and it leaves. That changes what runs, or it's an error.
      So in Python, spaces are part of the code.

recap:
  - Run Python and show values with `print`.
  - Name values without a keyword, and fill in text with f-strings.
  - Read blocks from the colon and the indentation, and translate a JavaScript function.
recall:
  - id: card-run-file
    concept: python.running-python
    front: How do you run a Python file called `report.py` from the terminal?
    back: >-
      `python3 report.py`. Python runs it from top to bottom.
  - id: card-true-none
    concept: python.names-and-values
    front: How do you write JavaScript's `true`, `false` and `null` in Python?
    back: >-
      `True`, `False` and `None`, each with a capital letter.
  - id: card-no-conversion
    concept: python.names-and-values
    front: 'What does `"Age: " + 30` do in Python?'
    back: >-
      It raises a `TypeError`. Python never turns a number into text for you.
  - id: card-f-string
    concept: python.f-strings
    front: How do you show a variable `total` with two decimal places inside text?
    back: >-
      With an f-string: `f"Total: {total:.2f}"`. Without the `f`, the braces print as typed.
  - id: card-indentation
    concept: python.indentation
    front: How does Python know where an `if` block ends?
    back: >-
      The block is the indented lines after the colon. It ends at the first line indented
      less.

