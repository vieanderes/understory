term: canary release
aka: [canary, canary deployment, progressive delivery]
short: Giving a new version a small share of real traffic, growing it only while its numbers stay healthy.
explain: |
  Tests never catch everything. Real users on real devices do. Better a bug hits one
  percent of them for ten minutes than everyone at once.

  The new version takes, say, five percent of traffic. You compare its error rate, latency
  and a product signal with the old version's. Write the guardrails down before starting,
  so the decision isn't argued afterwards. Healthy: grow to twenty-five, then a hundred.
  Not healthy: roll back, and only a few people noticed.
analogy: The canary miners carried underground. If it struggles, everyone else gets out before they're harmed.
usage: The canary release shows checkout errors up from 0.2 to 1.5 percent, so stop the rollout.
twin:
  term: blue-green-deployment
  difference: A canary release sends a small share of traffic to the new version and grows it gradually. Blue-green deployment moves all traffic at once, keeping the old version ready to switch back.
related: [blue-green-deployment, feature-flag, rollback, slo, metrics]
level: 2
lessons: [cloud.progressive-delivery]
