id: tooling.node-and-npm
title: npm and packages
objective: Install and use a package, run scripts, and keep installs repeatable with ranges and a lockfile.
level: essential
minutes: 10
concepts: [tooling.packages, tooling.package-json, tooling.semver, tooling.lockfile]
prerequisites: [tooling.node]
opening:
  text: >-
    You'll add someone else's code to your project with one command, and run it with Node.
    You'll also stop the classic "works on my machine" bug before it starts.

steps:
  - type: prose
    id: what-a-package-is
    body: |-
      A **package** is code someone published for anyone to use. **npm** comes with Node. It
      downloads packages from the **registry**, a free public library at npmjs.com.

      ```text
      $ npm install ms
      added 1 package in 412ms
      ```

      The code lands in `node_modules`, and `package.json` lists what your project uses. You
      import a package by its bare name, with no `./`:

      ```js
      import ms from "ms";
      console.log(ms("2 days")); // 172800000
      ```

  - type: fill-blank
    id: fill-import-package
    concept: tooling.packages
    difficulty: 1
    language: js
    prompt: You installed `ms`. Import it into `index.js`. Fill the gaps.
    template: |
      {{1}} ms from {{2}};
      console.log(ms("1 hour")); // 3600000
    blanks:
      - key: '1'
        answer: import
      - key: '2'
        answer: '"ms"'
    bank: [import, export, '"ms"', '"./ms"', '"node_modules"']

  - type: multiple-choice
    id: pick-made-up-package
    concept: tooling.packages
    difficulty: 2
    language: bash
    code: |
      $ npm install ms-humanize-pro
      npm error code E404
      npm error 404 Not Found - GET https://registry.npmjs.org/ms-humanize-pro - Not found
    question: An AI assistant told you to install this package. What most likely went wrong?
    choices:
      - text: The AI made up the package name
        correct: true
        feedback: >-
          Yes. AIs invent plausible names. Never install a lookalike: attackers publish malware
          under them.
      - text: The registry is down right now
        feedback: >-
          Then npm couldn't reach it at all. It did, and the registry answered "Not found".
      - text: You're in the wrong folder
        feedback: >-
          The folder only decides where a package lands. This name doesn't exist anywhere.
      - text: The package needs `./` in front
        feedback: >-
          `./` is for your own files. Packages come by bare name from the registry.

  - type: prose
    id: scripts
    body: |-
      Projects need the same commands again and again. `package.json` can name them under
      `scripts`:

      ```text
      "scripts": { "start": "node index.js" }

      $ npm start
      > weather@1.0.0 start
      > node index.js
      ```

      `npm start` and `npm test` run the scripts with those names. Any other name needs
      `run`, as in `npm run build`. Now nobody has to remember the exact command.

  - type: fill-blank
    id: fill-package-json
    concept: tooling.package-json
    difficulty: 2
    language: json
    prompt: >-
      Make `npm start` run `index.js` with Node, and `npm run check` run `check.js`. Fill the
      gaps.
    template: |
      {
        "name": "timer",
        "type": "module",
        "scripts": {
          "{{1}}": "{{2}} index.js",
          "{{3}}": "node check.js"
        },
        "dependencies": { "ms": "^2.1.3" }
      }
    blanks:
      - key: '1'
        answer: start
      - key: '2'
        answer: node
      - key: '3'
        answer: check
    bank: [start, run, node, npm, check, test]

  - type: prose
    id: ranges-are-sets
    body: |-
      Look at `"ms": "^2.1.3"`. That's not one version. It's a range.

      A version has three numbers, `major.minor.patch`. **Semantic versioning** is the
      author's promise: a patch fixes bugs, a minor adds features, a major may break your code.

      - `^2.1.3` accepts anything from 2.1.3 up to, not including, 3.0.0.
      - `~2.1.3` is stricter: patches only, up to 2.2.0.

      npm writes `^` by default, and picks the newest version the range allows.

  - type: predict-output
    id: predict-caret-range
    concept: tooling.semver
    difficulty: 2
    language: text
    code: |
      package.json    "ms": "^2.0.0"
      your laptop     ms 2.0.0, installed a year ago
      registry        2.0.0, 2.1.0, 2.1.1, 2.1.2, 2.1.3
      lockfile        (none shared)
    question: A new teammate runs `npm install` today. Which `ms` do they get?
    choices:
      - text: '`2.1.3`'
        correct: true
        feedback: >-
          Yes. `^2.0.0` allows it, and npm takes the newest match. Now you two differ.
      - text: '`2.0.0`, the same as your laptop'
        feedback: >-
          Most people expect that. But the range is all npm sees, and `2.0.0` is only its lowest
          member.
      - text: The install fails
        feedback: >-
          Nothing conflicts. Several versions fit the range, and npm picks one.

  - type: prose
    id: lockfile-and-frozen-install
    body: >-
      That's how "works on my machine" starts. The fix is the **lockfile**,
      `package-lock.json`. It records the exact version of every package installed,
      including the packages your packages use.


      Share it with the project, and `npm install` reuses those versions. On a server, use
      `npm ci`. It installs exactly what the lockfile says, or stops with an error if
      `package.json` disagrees.

  - type: ai-review
    id: review-delete-lockfile
    concept: tooling.lockfile
    difficulty: 3
    language: bash
    request: '`npm ci` says my package.json and lockfile aren''t in sync. Fix it.'
    flawClass: logic
    code: |
      # The lockfile is out of date, so start fresh
      rm package-lock.json
      npm install
    prompt: >-
      Your teammate added `chalk` to `package.json` but never ran `npm install`. Tap the line
      at fault in the AI's fix.
    lines: [2]
    reasons:
      - text: Every package can now jump to its newest version
        correct: true
        feedback: >-
          Yes. `npm install` on its own adds `chalk` and keeps every other version.
      - text: '`npm install` can''t run without a lockfile'
        feedback: >-
          It can, and it writes a new one. That new one may pick newer versions of everything.
      - text: '`rm` deletes `package.json` too'
        feedback: >-
          `rm` deletes only the names you give it. The damage is losing the pinned versions.
    fix: |
      # Add the missing package to the lockfile
      npm install

  - type: explain-back
    id: explain-week-apart
    concept: tooling.lockfile
    difficulty: 3
    prompt: >-
      Two installs from the same `package.json`, a week apart, run different code. Why, and
      what stops it?
    rubric:
      - '`package.json` holds ranges, and an install with no lockfile takes the newest match that day.'
      - A new release inside a range, of any package in the tree, changes the result.
      - A shared lockfile records exact versions, and `npm ci` installs those or fails.
    modelAnswer: >-
      `package.json` holds ranges like `^2.0.0`, not versions. Without a lockfile, each install
      picks the newest match on that day, for every package in the tree. A release during the
      week changes what you get. A shared lockfile records the exact versions. `npm install`
      reuses them, and `npm ci` installs exactly those or stops with an error.

recap:
  - Install a package with `npm install` and use it with `import`.
  - Name your project's commands as scripts, and run them with `npm start` or `npm run`.
  - Read `^` and `~` ranges, and keep installs identical with the lockfile and `npm ci`.

recall:
  - id: card-install-leaves
    concept: tooling.packages
    front: What three things does `npm install ms` leave in a new project folder?
    back: >-
      `package.json` listing `ms`, the code in `node_modules`, and `package-lock.json` with the
      exact version.
  - id: card-run-script
    concept: tooling.package-json
    front: Your `package.json` has a script called `build`. How do you run it?
    back: >-
      `npm run build`. Only `start` and `test` work without `run`.
  - id: card-caret-tilde
    concept: tooling.semver
    front: Which versions do `^1.2.3` and `~1.2.3` accept?
    back: >-
      `^1.2.3` accepts from 1.2.3 up to 2.0.0. `~1.2.3` accepts from 1.2.3 up to 1.3.0.
  - id: card-npm-ci
    concept: tooling.lockfile
    front: How does `npm ci` differ from `npm install`?
    back: >-
      `npm ci` installs exactly what the lockfile says, and stops with an error if
      `package.json` disagrees. `npm install` may resolve again and update the lockfile.

