term: hook
aka:
  - React hook
short: A function whose name starts with use, which lets a component keep values or reach React features.
explain: |
  `useState`, `useEffect`, `useRef` and `useContext` are the built-in ones. You can write your
  own by combining them, such as `useWindowWidth`.

  React tracks them by call order, so two rules apply. Call them at the top level of a
  component or another one of them, never inside a condition or loop. And call them in the
  same order on every draw. The linter enforces both.
analogy: The sockets in a wall. Plug in at the same places every time, and the house knows what's connected.
example:
  language: tsx
  code: |
    function useWindowWidth() {
      const [width, setWidth] = useState(window.innerWidth);
      useEffect(() => {
        const update = () => setWidth(window.innerWidth);
        window.addEventListener('resize', update);
        return () => window.removeEventListener('resize', update);
      }, []);
      return width;
    }
usage: That hook is called inside an if, so the order changes between renders and state gets mixed up.
related:
  - state
  - effect
  - ref
level: 1
