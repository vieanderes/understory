term: diff
aka:
  - patch
  - changeset
  - git diff
short: The exact lines added and removed between two versions of some files.
explain: |
  Reviewing a change means seeing what changed, not rereading every file. A diff shows only the differences. Removed lines get a minus, added lines get a plus, and a few
  unchanged lines sit around them for context.

  Each block of changes is called a hunk. Tools let you stage, review or revert one hunk at a time. That's how a messy afternoon becomes
  several tidy commits.

  Keep diffs small and focused. A reformat mixed into a fix turns three meaningful lines into
  three hundred, and the bug hides in the noise.
analogy: Tracked changes in a document. You read the edits, not the whole contract again.
example:
  language: text
  code: |
    @@ -12,3 +12,3 @@ def apply_discount(cart):
    -    if cart.total > 50:
    +    if cart.total >= 50:
             cart.discount = 5
usage: The diff is three hundred lines because the editor reformatted the file; revert that part.
related:
  - commit
  - pull-request
  - atomic-commit
  - code-review
level: 1
lessons:
  - pro.commits-and-prs
