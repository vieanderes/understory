term: Cumulative Layout Shift
aka: [ CLS, layout shift ]
short: A score for how much visible content jumps around unexpectedly while a page is open.
explain: |
  You go to tap a link and an advert loads above it. The link drops and you tap the advert.
  The page moved under your finger.

  Content moves when something arrives late without reserved room. Think of an image with no
  size, or a banner injected above the text. Give images `width` and `height`, give late
  content a `min-height`, and the score drops. Good is 0.1 or less. Movement within half a
  second of your own tap doesn't count.
analogy: Someone moving your chair as you sit down.
example:
  language: html
  code: |
    <!-- the browser reserves 4:3 space before the file arrives -->
    <img src="/chart.png" width="800" height="600" alt="Weekly sign-ups">
usage: The cookie banner pushes the page down, and that alone gives us a Cumulative Layout Shift of 0.3.
related: [ core-web-vitals, largest-contentful-paint, critical-rendering-path ]
level: 2
