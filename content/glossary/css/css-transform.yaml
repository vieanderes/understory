term: transform
aka: [CSS transform, translate, transform-origin]
short: A CSS property that moves, turns, scales or skews how a box is drawn, without moving its neighbours.
explain: |
  Sometimes you want a box to nudge up on hover or a card to grow a little. Changing its
  margin would push everything around it. A `transform` changes only how the box is drawn,
  so the rest of the page stays still.

  That's also why it's cheap to animate. The browser can redo the drawing without working
  out the layout again. Order matters: `translate` then `rotate` lands somewhere different
  from `rotate` then `translate`. `transform-origin` sets the point it turns and scales
  around, the centre by default.
analogy: Moving a sticker on a window. The sticker shifts, and the window frame stays put.
example:
  language: css
  code: |
    .card:hover {
      transform: translateY(-4px) scale(1.02);
    }
usage: Use a transform for the lift on hover, because animating `top` re-runs layout on every frame.
related: [css-transition, stacking-context, prefers-reduced-motion]
level: 2
lessons: [css.transitions]
