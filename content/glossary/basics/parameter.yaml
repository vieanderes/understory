term: parameter
aka: [function parameter]
short: A name in a function's definition that stands for an input the caller will pass in.
explain: |
  A function that greets someone needs to know who. You leave a named gap in its
  definition: `function greet(name)`. Inside, `name` works like a variable.

  The gap is filled each time the function is called, with whatever the caller passes.
  The values match by position, not by name. The first value goes into the first gap.
analogy: The blank box marked Name on a paper form. The form has the box, and each person writes something different in it.
example:
  language: js
  code: |
    function greet(name) {   // name is a parameter
      return `Hello, ${name}`;
    }
    greet("Sam");            // "Sam" is an argument
usage: Rename that parameter from x to price, so the function says what it expects.
twin:
  term: argument
  difference: A parameter is the name in the definition, the empty box. An argument is the value you pass when you call, the thing you put in the box.
related: [argument, function, return-value, rest-parameters]
level: 1
lessons: [basics.functions]
