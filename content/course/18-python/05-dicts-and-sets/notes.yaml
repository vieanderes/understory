summary: >-
  A dict maps keys to values, and a set holds unique keys with no values. Both are hash
  tables. Python turns each key into a number, its hash, and uses that number to jump
  straight to a slot. That's why a lookup costs about the same for ten keys or ten million,
  while a list has to be checked item by item.


  You reach for a dict whenever you look something up by name: parsed JSON, settings, a
  cache, a count per label, a group of records per customer. You reach for a set when all
  you need to know is "have I seen this?", or when you want to combine groups with union,
  intersection and difference. `get`, `defaultdict` and `Counter` cover the everyday jobs
  of reading safely, grouping and counting without boilerplate.


  The price is two rules. Keys must be hashable, which in practice means they can't change,
  so a tuple works and a list doesn't. And a set has no order you can rely on. A dict does
  keep insertion order, which Python has guaranteed since 3.7. When you need positions or
  duplicates, a list is still the right tool.
remember:
  - A dict or set finds a key by its hash, so `in`, lookup, insert and delete are O(1) on average, while `in` on a list is O(n).
  - A key must be hashable, and equal keys must have equal hashes, which is why lists, dicts and sets can't be keys but tuples of immutable values can.
  - Reading a missing key with brackets raises `KeyError`, `get(key, default)` returns a fallback, and `in` checks without reading.
  - Dicts keep insertion order, guaranteed since Python 3.7, but sets promise no order at all.
  - Use `Counter` to count, `defaultdict(list)` to group, and remember that reading a missing key from a `defaultdict` inserts it.
  - '`1`, `1.0` and `True` are equal and hash the same, so they are one and the same dict key.'
  - Build a set once before a loop that checks membership, which turns an O(n × m) scan into O(n + m).
  - '`list(dict.fromkeys(items))` removes duplicates and keeps the first-seen order, which `list(set(items))` doesn''t.'
sections:
  - title: How a dict works underneath
    body: |-
      A dict is a **hash table**. When you store `stock["tea"] = 12`, Python calls
      `hash("tea")`, turns that number into a slot index, and files the entry there. A lookup
      repeats the same sum and goes straight to the slot. It doesn't matter how many other
      keys there are.

      Two different keys can land in the same slot. That's a **collision**. CPython stores
      each entry's full hash beside it, and on a lookup it checks identity first, then
      compares the stored hash, and only then calls `__eq__`. If the slot holds another key,
      it probes the next candidate slot. When the table is about two-thirds full, it grows
      and refiles every key, so an insert is O(1) amortised: now and then one insert costs
      O(n), but the average stays constant.

      Since Python 3.6, CPython keeps the entries in a dense array in the order you added
      them, with a separate small index table pointing into it. Python 3.7 made that order a
      language rule. Deleting a key and adding it again moves it to the end.

      ```python
      stock = {"tea": 12, "cake": 3}
      stock["scone"] = 8
      del stock["tea"]
      stock["tea"] = 5
      print(list(stock))  # ['cake', 'scone', 'tea']

      prices = {1: "one"}
      prices[1.0] = "one point zero"
      prices[True] = "yes"
      print(prices)  # {1: 'yes'}
      ```

      The second half surprises people. `1 == 1.0 == True`, and equal values must hash the
      same, so all three are one key. The first spelling of the key stays and the value is
      overwritten.

      The worst case is O(n), when many keys collide. For strings Python protects against
      that on purpose: `str` hashes are salted with a random value per process, so an
      attacker can't craft request keys that all collide. That's also why a set of strings
      can print in a different order each time you run the script.
  - title: Hashability, and why keys can't change
    body: |-
      A value is **hashable** if it has a hash that never changes during its lifetime, and
      it can be compared with `==`. The contract is one line: if `a == b`, then
      `hash(a) == hash(b)`. Strings, numbers, `None`, tuples of hashable values and
      `frozenset` qualify. Lists, dicts and sets don't, because they can change in place.

      Why does change matter? A key is filed under its hash at the moment you insert it. If
      the key changed afterwards, its hash would change, and a lookup would search the wrong
      slot. The entry would still be in the table, but nobody could reach it. This class
      shows the failure, because it breaks the rule on purpose:

      ```python
      class Seat:
          def __init__(self, row):
              self.row = row

          def __eq__(self, other):
              return self.row == other.row

          def __hash__(self):
              return hash(self.row)


      seat = Seat("A")
      held = {seat}
      seat.row = "B"
      print(seat in held)       # False
      print(Seat("A") in held)  # False
      print(len(held))          # 1
      ```

      The seat is in the set, yet neither lookup finds it. Built-in mutable types refuse to
      be hashed so this can't happen by accident. A tuple is only as hashable as what it
      holds:

      ```python
      print(hash((3, 4)) == hash((3, 4)))  # True

      try:
          {(1, [2, 3])}
      except TypeError as error:
          print(error)  # unhashable type: 'list'

      roles = {frozenset({"read", "write"}): "editor"}
      print(roles[frozenset({"write", "read"})])  # editor
      ```

      Your own classes are hashable by identity by default. Define `__eq__` without
      `__hash__` and Python sets `__hash__` to `None`, making instances unhashable, because
      identity hashing would break the contract. A frozen dataclass, covered in the classes
      lesson, generates both from the fields.
  - title: Reading, grouping and counting without boilerplate
    body: |-
      Each tool fits a different question. `get` reads with a fallback and never changes the
      dict. `setdefault` inserts a default only if the key is missing, then returns the
      stored value. `defaultdict` calls a factory for every missing key it's asked for.
      `Counter` is a dict of counts where a missing key reads as `0` without being added.

      ```python
      from collections import Counter, defaultdict

      orders = [("ana", "tea"), ("ben", "cake"), ("ana", "cake")]

      by_customer = {}
      for customer, item in orders:
          by_customer.setdefault(customer, []).append(item)
      print(by_customer)  # {'ana': ['tea', 'cake'], 'ben': ['cake']}

      grouped = defaultdict(list)
      for customer, item in orders:
          grouped[customer].append(item)
      print(grouped["cy"])    # []
      print("cy" in grouped)  # True

      counts = Counter(["tea", "cake", "cake"])
      print(counts.most_common(1))            # [('cake', 2)]
      print(counts["scone"], "scone" in counts)  # 0 False

      defaults = {"model": "small", "temperature": 0.7}
      print(defaults | {"temperature": 0.2})  # {'model': 'small', 'temperature': 0.2}
      ```

      Look at the second `defaultdict` print. Reading `grouped["cy"]` inserted `"cy"`
      with an empty list. That's handy while building groups and a trap when you only meant
      to look. Check with `in` or `get` instead. When you hand a `defaultdict` to other code,
      `dict(grouped)` turns it back into a plain dict so nobody inserts keys by reading.

      `setdefault` evaluates its default every time, even when the key exists, so
      `setdefault(key, [])` builds a throwaway list on every call. `defaultdict` only calls
      its factory on a miss. `Counter` also supports `+` and `-` between counters, dropping
      any count that ends at zero or below, and `update` to add more items. `dict | other`
      (Python 3.9) builds a new merged dict where the right side wins, like
      `{...a, ...b}` in JavaScript.
  - title: Sets, their operations and what they cost
    body: |-
      A set is a hash table with keys and no values. Membership, `add` and `discard` are O(1)
      on average. The combining operators build a new set, and their cost follows from
      walking one or both sides:

      ```python
      monday = {"ana", "ben", "cy"}
      tuesday = {"ben", "dee"}
      print(sorted(monday | tuesday))  # ['ana', 'ben', 'cy', 'dee']
      print(sorted(monday & tuesday))  # ['ben']
      print(sorted(monday - tuesday))  # ['ana', 'cy']
      print(sorted(monday ^ tuesday))  # ['ana', 'cy', 'dee']
      print({"ben"} <= monday)         # True

      tags = ["b", "a", "b", "c", "a"]
      print(list(dict.fromkeys(tags)))  # ['b', 'a', 'c']
      ```

      Union is O(len(a) + len(b)). Intersection walks the smaller set and checks the larger,
      so it's O(min(len(a), len(b))). Difference walks the left side, O(len(a)). `<=` asks
      "is a subset of", and `^` keeps what is in exactly one side. The `sorted` calls are
      there because a set of strings prints in an order that can change between runs.
      `set(items)` itself costs O(n), so build it once, outside the loop that uses it.

      Coming from JavaScript, three differences matter. First, a plain JS object turns every
      key into a string, so `obj[1]` and `obj["1"]` are the same entry. A Python dict keeps
      `1` and `"1"` apart. Second, JS `Map` and `Set` compare objects by identity, so
      `new Set([[1, 2], [1, 2]]).size` is `2`. Python compares keys by value, so
      `{(1, 2), (1, 2)}` has one item, and a list isn't allowed at all. Third, JS objects put
      integer-like keys first in ascending order, whereas a Python dict keeps pure insertion
      order, like a JS `Map`. JS gained `union` and `intersection` methods on `Set` recently,
      and Node 22 onwards has them; Python has had the operators for decades.
pitfalls:
  - '**Reading external data with brackets.** An API reply, a JSON file or a form may lack a key, and `reply["text"]` stops the program with `KeyError`. Use `get` with a fallback, or check with `in` and handle the missing case on purpose.'
  - '**Testing `if counts.get(key):` to mean "is present".** A stored `0`, `""` or `[]` is falsy, so a real entry looks missing. Use `key in counts`, or compare `get` with `None` using `is`.'
  - '**Appending to the result of `get(key, [])`.** The fallback list is a new object that was never stored, so the append vanishes. Use `setdefault(key, []).append(x)` or a `defaultdict(list)`.'
  - '**Checking a `defaultdict` by reading it.** `groups["x"]` inserts `"x"` with an empty value, so later code sees groups that never had data. Check with `"x" in groups`, or convert with `dict(groups)` before handing it on.'
  - '**Writing `{}` for an empty set.** `{}` is an empty dict, and `{}.add(1)` fails with `AttributeError`. Write `set()`.'
  - '**Relying on the order a set prints in.** String hashes are salted per process, so the order can change between runs and tests turn flaky. Sort before you compare or print, or keep a list or dict when order matters.'
  - '**Adding or deleting keys while looping over a dict.** Python raises `RuntimeError: dictionary changed size during iteration`. Loop over a copy, `for key in list(d):`, or build a new dict with a comprehension.'
  - '**Calling `in` on a list inside a loop.** Each check scans the list, so n checks against m items cost O(n × m). Convert once with `set(known)` before the loop.'
interview:
  - question: How does a Python dict work, and what does a lookup cost?
    answer: >-
      It's a hash table, so lookup, insert and delete are O(1) on average and O(n) in the
      worst case. Python hashes the key, maps the hash to a slot, and checks identity, the
      stored hash and then `__eq__` to confirm it found the right key. Collisions are
      resolved by probing other slots. When the table is about two-thirds full it grows and
      refiles everything, so inserts are amortised O(1). Since 3.6 CPython stores entries in
      a dense array in insertion order, and 3.7 made insertion order a guarantee. The worst
      case needs many colliding hashes, which is why `str` hashes are randomised per process
      to stop hash-flooding attacks. The trade-off against a list is memory: a dict holds
      extra index space and a stored hash per entry.
  - question: Why can a tuple be a dict key but a list can't?
    answer: >-
      Because a key must keep the same hash for as long as it's in the table, and a list can
      change. A dict files each key under its hash at insert time. If the key mutated, its
      hash would change and every later lookup would search the wrong slot, so the entry
      would be stranded. Python prevents that by making built-in mutable types unhashable.
      A tuple can't change, so it's hashable, but only if everything inside it is: `(1, [2])`
      still raises `TypeError: unhashable type: 'list'`. For a set-like key you use
      `frozenset`. With custom classes the contract is that equal objects have equal hashes,
      so the hash should depend only on fields that never change, which a frozen dataclass
      gives you.
  - question: How do you remove duplicates from a list, keeping the original order?
    answer: >-
      `list(dict.fromkeys(items))`, which is O(n) and keeps the first occurrence of each
      value. It works because dict keys are unique and dicts keep insertion order. The
      tempting `list(set(items))` is also O(n) but throws the order away, since sets promise
      none. If the items aren't hashable, say dicts from a JSON payload, I dedupe on a
      hashable key instead: keep a `seen` set of ids and append a record only when its id is
      new. The one thing I avoid is `if x not in result` on a list, which is O(n²) and falls
      over at a hundred thousand items.
  - question: When would you use `Counter`, `defaultdict` or plain `get`?
    answer: >-
      `Counter` for counting, `defaultdict` for building groups, and `get` for reading data
      I don't control. `Counter(labels)` counts in one call, reads missing keys as `0`
      without inserting them, and gives `most_common(n)` for a top list. `defaultdict(list)`
      removes the "is the key there yet?" branch when grouping records by a field. `get` with
      a fallback is the safe read for API replies and config, and it never changes the dict.
      The trade-off with `defaultdict` is that reading a missing key inserts it, so I convert
      it to a plain dict before returning it from a function, or a caller's innocent lookup
      adds empty groups.
terms:
  - term: Dict
    say: Python's version of a JavaScript object.
    means: A hash table from any hashable key to a value, with O(1) average lookup, insert and delete.
      It keeps insertion order, guaranteed since Python 3.7.
  - term: Hashable
    say: Immutable.
    means: It has a hash that never changes, and equal values hash equally. Immutable built-ins usually
      are, but a tuple holding a list isn't.
  - term: Set
    say: A list without duplicates.
    means: A hash table of keys with no values, with O(1) average membership and fast union,
      intersection and difference. It keeps no order you can rely on.
  - term: "`defaultdict`"
    say: A dict that never raises `KeyError`.
    means: A dict that calls a factory for a missing key and *inserts* the result, so even reading a
      missing key adds it.
  - term: "`1`, `1.0` and `True`"
    say: Three different keys.
    means: They're equal and hash the same, so a dict treats them as one key.
  - term: Order-preserving dedupe
    say: "`list(set(items))`."
    means: A set drops the order. `list(dict.fromkeys(items))` removes duplicates and keeps the
      first-seen order.
