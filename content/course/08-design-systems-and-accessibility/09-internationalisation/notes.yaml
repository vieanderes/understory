summary: >-
  Internationalisation, often shortened to i18n, is building an interface so it can work in
  any language and region without rewriting code. Localisation is the second half: the
  translations and regional choices for one locale. A locale is a language tag such as
  `en-GB` or `ar-EG`, and it decides far more than words: the decimal mark, the date order,
  where a currency sign goes, how plurals work, how lists join and which way text runs.


  The rule that follows is to never hand-build a formatted string. JavaScript's `Intl`
  object carries the rules for hundreds of locales, from the Unicode CLDR data: numbers,
  dates, relative times, plurals, lists, sorting and splitting text into characters and
  words. Messages with variables go through a message format, such as ICU MessageFormat, so
  translators can reorder words and choose plural forms.


  The page has jobs too. `lang` tells browsers and screen readers the language, `dir` sets
  the direction, and CSS logical properties let one style sheet serve left-to-right and
  right-to-left layouts. Layouts must also survive text that grows in translation. Finally,
  the app must pick a locale sensibly: an explicit choice first, then the browser's
  preferences, then a default.
remember:
  - Never build dates, numbers, prices or plurals by hand; pass the locale to an `Intl` formatter and let it apply the rules.
  - Create an `Intl` formatter once and reuse it, because construction does the expensive locale lookup.
  - '`Intl` output can contain non-breaking spaces, such as U+00A0 and U+202F in French prices, so tests must not compare against plain spaces.'
  - Plural categories depend on the language, from one category in Japanese to six in Arabic, so messages keep one text per category rather than adding an s.
  - Don't concatenate translated fragments, because word order and grammar change between languages; use whole messages with placeholders.
  - Set `lang` on the `html` element and on any passage in another language, and `dir="rtl"` for Arabic or Hebrew.
  - Logical properties such as `margin-inline-start` and `padding-inline` follow the text direction, while `left` and `right` don't.
  - Choose the locale from an explicit user choice first, then `Accept-Language` or `navigator.languages`, falling back from `de-AT` to `de` to a default.
sections:
  - title: The rest of the Intl toolbox
    body: |-
      The lesson used `NumberFormat`, `DateTimeFormat` and `PluralRules`. Each has more
      options, and `Intl` has more formatters. Run in Node 24 (ICU 78, CLDR 48):

      ```js
      const price = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
      console.log(price.format(1234.5)); // "1 234,50 €", with U+202F and U+00A0
      console.log(new Intl.NumberFormat("en-GB", { notation: "compact" }).format(1234567)); // "1.2m"
      console.log(new Intl.NumberFormat("de-DE", { style: "percent" }).format(0.256)); // "26 %", U+00A0
      console.log(new Intl.NumberFormat("en-GB", { style: "unit", unit: "kilometer-per-hour" }).format(50)); // "50 km/h"

      const when = new Date(Date.UTC(2026, 2, 4, 14, 5));
      const london = { timeZone: "Europe/London" };
      console.log(new Intl.DateTimeFormat("en-GB", { dateStyle: "long", timeStyle: "short", ...london }).format(when));
      // "4 March 2026 at 14:05"
      console.log(new Intl.DateTimeFormat("en-US", { dateStyle: "long", timeStyle: "short", ...london }).format(when));
      // "March 4, 2026 at 2:05 PM"
      console.log(new Intl.DateTimeFormat("de-DE", { dateStyle: "full", ...london }).format(when));
      // "Mittwoch, 4. März 2026"

      const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
      console.log(rtf.format(-1, "day"), "|", rtf.format(2, "week")); // "yesterday | in 2 weeks"

      console.log(new Intl.ListFormat("en-GB").format(["tea", "coffee", "juice"])); // "tea, coffee and juice"
      console.log(new Intl.ListFormat("en-US").format(["tea", "coffee", "juice"])); // "tea, coffee, and juice"
      console.log(new Intl.ListFormat("en-GB", { type: "disjunction" }).format(["tea", "coffee"])); // "tea or coffee"

      const ordinal = new Intl.PluralRules("en-GB", { type: "ordinal" });
      const suffix = { one: "st", two: "nd", few: "rd", other: "th" };
      console.log([1, 2, 3, 4, 11, 12, 21, 22].map((n) => n + suffix[ordinal.select(n)]).join(" "));
      // "1st 2nd 3rd 4th 11th 12th 21st 22nd"
      ```

      Three things to notice. Pass `timeZone` whenever a date is shown: without it the
      formatter uses the machine's zone, so a server and a browser print different days for
      the same instant. `dateStyle` and `timeStyle` can't be mixed with single fields such
      as `hour` or `timeZoneName`; that throws a `TypeError`. And `numeric: "auto"` is what
      turns "1 day ago" into "yesterday".

      When you need to style part of the output, `formatToParts` returns typed pieces, such
      as `integer`, `group`, `decimal`, `fraction` and `currency`, so you can wrap the
      currency sign in its own element without parsing a string.
  - title: Sorting and splitting text
    body: |-
      `Array.prototype.sort()` with no comparator compares UTF-16 code units. That puts every
      capital before every lower-case letter and every accented letter after `z`.
      `Intl.Collator` sorts the way people in a locale expect:

      ```js
      const words = ["zebra", "Äpfel", "apple", "Zoo"];
      console.log([...words].sort()); // [ 'Zoo', 'apple', 'zebra', 'Äpfel' ]
      console.log([...words].sort(new Intl.Collator("de").compare)); // [ 'Äpfel', 'apple', 'zebra', 'Zoo' ]
      console.log(["zebra", "äpple", "apple", "öl"].sort(new Intl.Collator("sv").compare));
      // [ 'apple', 'zebra', 'äpple', 'öl' ]
      console.log(["item10", "item9", "item1"].sort(new Intl.Collator("en", { numeric: true }).compare));
      // [ 'item1', 'item9', 'item10' ]
      console.log(new Intl.Collator("en", { sensitivity: "base" }).compare("cafe", "Café")); // 0
      ```

      German treats `Ä` as a variant of `a`, so `Äpfel` sorts among the a-words (before
      `apple`, because `f` comes before `p`). Swedish treats `ä` and `ö` as separate letters
      after `z`. Same characters, different rules, which is why the locale matters.
      `numeric: true` sorts file names and order numbers by value, and
      `sensitivity: "base"` makes a search ignore case and accents.

      `Intl.Segmenter` splits text into what a reader sees as characters, words or sentences:

      ```js
      const text = "café 👍🏽🇬🇧";
      const graphemes = [...new Intl.Segmenter("en", { granularity: "grapheme" }).segment(text)];
      console.log(text.length, graphemes.length); // 13 7
      const words = new Intl.Segmenter("ja", { granularity: "word" }).segment("東京に住んでいます");
      console.log([...words].filter((s) => s.isWordLike).map((s) => s.segment));
      // [ '東京', 'に', '住', 'んで', 'い', 'ます' ]
      ```

      `length` counts UTF-16 code units, so an emoji with a skin tone counts as 4 and a flag
      as 4. A character limit on a chat message, or truncating a title, should count
      graphemes. Japanese has no spaces between words, so `split(" ")` can't find them, but
      the word segmenter can.
  - title: Messages, and why concatenation fails
    body: |-
      Code like `"Hello " + name + ", you have " + count + " items"` bakes English grammar
      into the program. German may move the verb, Russian needs three plural forms, and a
      translator handed the fragment "you have" can't know what follows. The answer is a
      **message**: one whole sentence per string, with named placeholders, that the
      translator can rearrange.

      The common format is **ICU MessageFormat**, used by libraries such as FormatJS, whose
      `intl-messageformat` package runs these lines in Node 24:

      ```js
      import { IntlMessageFormat } from "intl-messageformat";

      const en = new IntlMessageFormat(
        "{name} has {count, plural, =0 {no items} one {# item} other {# items}} in the basket.",
        "en-GB",
      );
      console.log(en.format({ name: "Sam", count: 0 })); // "Sam has no items in the basket."
      console.log(en.format({ name: "Sam", count: 1 })); // "Sam has 1 item in the basket."
      console.log(en.format({ name: "Sam", count: 1500 })); // "Sam has 1,500 items in the basket."

      const ru = new IntlMessageFormat(
        "В корзине {count, plural, one {# товар} few {# товара} many {# товаров} other {# товара}}.",
        "ru",
      );
      console.log(ru.format({ count: 21 })); // "В корзине 21 товар."
      console.log(ru.format({ count: 5 })); // "В корзине 5 товаров."
      ```

      `plural` picks a branch with `Intl.PluralRules` underneath. `=0` matches an exact
      number before the categories are tried, and `#` prints the count formatted for the
      locale, hence `1,500`. A `select` branch picks by a string, such as a grammatical
      gender: `{gender, select, female {her} male {him} other {them}}`. Every `plural` and
      `select` needs an `other` branch.

      JavaScript has no built-in message formatter yet; an `Intl.MessageFormat` is still a
      proposal. So apps use a library, and translators edit messages in files keyed by an id.
      Keep whole sentences in each message, even when that repeats words. Translators need
      the full context, and a sentence split across two keys can't be reordered.
  - title: Direction, lang and logical CSS
    body: |-
      `lang` does more than pick a screen reader voice. It picks the hyphenation dictionary for
      `hyphens: auto`, guides font choice for Chinese, Japanese and Korean, which share
      characters but not glyph shapes, and decides what the `:lang()` selector matches. WCAG 2.2 has two criteria for it: 3.1.1 Language of Page
      (Level A) for the `html` element, and 3.1.2 Language of Parts (Level AA) for passages in
      another language.

      `dir` sets the base direction: `ltr`, `rtl` or `auto`. With `auto` the browser looks at
      the first strong character, which suits user-generated content. In Chromium, a
      paragraph starting "שלום world" becomes `rtl`, and one starting "Hello שלום" stays
      `ltr`. Use `dir="auto"` on chat messages and form fields where people type in any
      language, and match it in CSS with `:dir(rtl)`.

      Logical properties describe layout relative to the text, not the screen:

      ```css
      .notice {
        margin-inline-start: 16px;   /* left in English, right in Arabic */
        padding-inline-end: 8px;
        border-inline-start: 4px solid;
        text-align: start;
      }
      ```

      Checked in Chromium inside `dir="rtl"`, that rule computes `margin-right: 16px`,
      `padding-left: 8px` and `border-right-width: 4px`. Flexbox and grid follow the
      direction too: a row of items starts on the right. So a layout built on logical
      properties, flex and grid mirrors itself with one attribute.

      Not everything should mirror. Arrows that mean "next" and "back" should flip. A play
      button, a clock, a graph's time axis and brand logos usually stay as they are. In
      script, `new Intl.Locale("ar").getTextInfo()` returns `{ direction: "rtl" }`, in Node
      24 and current Chromium, so the direction can come from the locale instead of a
      hard-coded list.
  - title: Text expansion and choosing a locale
    body: |-
      Translations are rarely the same length as English. German and Finnish words run
      long, and short labels grow the most: a three-letter button label can double or triple.
      Chinese and Japanese are often shorter but may need a larger font size to stay
      readable. So never size a button or a column to fit the English words. Let text wrap,
      use `min-width` rather than `width`, and test with long strings.

      **Pseudo-localisation** tests that before any translation exists. It swaps letters for
      accented look-alikes, pads each string and brackets it, so hard-coded strings, clipped
      text and missing fonts stand out:

      ```js
      const accents = { a: "á", e: "é", i: "í", o: "ó", u: "ú", c: "ç", n: "ñ", A: "Á", E: "É", O: "Ó" };

      function pseudoLocalise(message) {
        const swapped = message.replace(/\{[^}]*\}|./g, (part) =>
          part.length > 1 ? part : (accents[part] ?? part),
        );
        const padding = "~".repeat(Math.ceil(message.length * 0.4));
        return `[${swapped}${padding}]`;
      }

      console.log(pseudoLocalise("Add to basket")); // [Ádd tó báskét~~~~~~]
      console.log(pseudoLocalise("Hello, {name}")); // [Hélló, {name}~~~~~~]
      ```

      Placeholders pass through untouched, so the message still works.

      Choosing the locale is **negotiation**: match what the person wants against what you
      support. The best signal is an explicit choice, kept in a cookie, an account setting or
      the URL, like `/de/`. Without one, a server reads the `Accept-Language` header and a
      browser reads `navigator.languages`. Don't guess the language from the IP address: a
      traveller or a German speaker in Belgium gets the wrong one.

      ```js
      function negotiate(wanted, supported, fallback) {
        for (const tag of wanted) {
          const [canonical] = Intl.getCanonicalLocales(tag);
          const exact = supported.find((s) => s.toLowerCase() === canonical.toLowerCase());
          if (exact) return exact;
          const { language } = new Intl.Locale(canonical);
          const sameLanguage = supported.find((s) => new Intl.Locale(s).language === language);
          if (sameLanguage) return sameLanguage;
        }
        return fallback;
      }

      const supported = ["en-GB", "en-US", "de", "fr", "ar"];
      console.log(negotiate(["de-AT", "de", "en"], supported, "en-GB")); // de
      console.log(negotiate(["en-IE"], supported, "en-GB")); // en-GB
      console.log(negotiate(["pt-BR", "es"], supported, "en-GB")); // en-GB
      ```

      `Intl` formatters negotiate the same way on their own: `new Intl.NumberFormat("en-XX")`
      resolves to `en`, and `resolvedOptions().locale` tells you what you got.
pitfalls:
  - '**Comparing `Intl` output with plain spaces in tests.** The German price looks like `1.234,50 €`, so a test types a normal space and fails. `Intl` uses U+00A0 there, and U+202F in French grouping. Build the expected value with the same formatter, or replace ` ` and ` ` before comparing.'
  - '**Formatting dates without a time zone.** The code runs fine on your laptop, so the zone looks irrelevant. On a server in UTC, an evening order shows the next day. Pass `timeZone` explicitly, or format in the browser with the user''s zone.'
  - '**Concatenating translated fragments.** Reusing "you have" and "items" saves strings, but other languages reorder and inflect them. Keep one whole message per sentence with named placeholders and plural branches.'
  - '**Creating formatters inside a loop.** `new Intl.NumberFormat(...)` in a render or a `map` looks harmless, but each construction repeats the locale lookup and setup. Create it once per locale and reuse it.'
  - '**Using `left` and `right` in component styles.** It works in English, so nobody notices until the Arabic launch, when icons and padding sit on the wrong side. Use logical properties and `text-align: start` from the start.'
  - '**Counting characters with `length`.** It counts UTF-16 code units, so one flag emoji counts as 4 and limits cut characters in half. Count graphemes with `Intl.Segmenter`.'
verify:
  - lens: breaks
    check: 'Dates and times are formatted with an explicit `timeZone`, because a server in UTC moves evening orders to the next day.'
  - lens: breaks
    check: 'Translated text is one whole message per sentence with named placeholders and plural branches, never glued fragments.'
  - lens: scales
    check: 'Each `Intl` formatter is created once per locale and reused, not built inside a loop or a render.'
  - lens: confuses
    check: 'Component styles use logical properties such as `margin-inline-start`, so layouts flip correctly for right-to-left languages.'
  - lens: tests
    check: 'Tests build expected strings with the same formatter, because `Intl` output contains non-breaking spaces.'
interview:
  - question: Why shouldn't you build translated strings by concatenation?
    answer: >-
      Because concatenation hard-codes English word order and grammar into the program.
      `"You have " + n + " items"` assumes the number sits in the middle, that the plural is
      an added s and that "you have" means the same wherever it's reused. Other languages
      move the verb, inflect nouns by count and gender, and Russian needs different forms
      for 1, 2 and 5. I'd use whole messages with named placeholders in ICU MessageFormat,
      with `plural` and `select` branches, so a translator can reorder the sentence and
      supply every plural category the language needs. Numbers inside go through `#` or
      `Intl.NumberFormat`. The trade-off is more strings and some repetition, and a library
      such as FormatJS, since JavaScript has no built-in message formatter yet.
  - question: How do you handle plurals in a multilingual app?
    answer: >-
      Each message keeps one text per plural category, and `Intl.PluralRules` picks the
      category for the count and locale. The categories come from Unicode CLDR: `zero`,
      `one`, `two`, `few`, `many` and `other`. English uses `one` and `other`, Russian adds
      `few` and `many`, Arabic and Welsh use all six, and Japanese has only `other`. So
      `count === 1 ? "item" : "items"` is wrong for most of the world, and even in French 0
      counts as `one`. In practice I write ICU plural messages, where `=0` can override with
      a friendlier "no items" and `#` prints the formatted number. Ordinals are a separate
      rule set, `type: "ordinal"`, giving "1st, 2nd, 3rd" in English. Every branch needs an
      `other`, the fallback for fractions and unexpected counts.
  - question: How would you decide which locale to show a user?
    answer: >-
      An explicit choice wins, then the browser's preferences, then a default, with fallback
      from a region to its language. If the user picked a language, I keep it in the URL, such
      as `/de/`, a cookie or their account, because that's intent. Otherwise the server reads
      `Accept-Language`, sorted by quality values, and matches it against the locales I
      support: `de-AT` first tries an exact match, then any `de`, then the next preference.
      With no match it falls back to the default. I'd avoid IP geolocation for language,
      because location isn't language: travellers and multilingual countries break it. I
      also keep language separate from formats and time zone, and always offer a visible
      language switcher, labelled in each language's own name.
  - question: What changes when you add a right-to-left language?
    answer: >-
      The direction of the whole layout, so the markup and CSS must describe layout
      relative to the text. I set `lang="ar"` and `dir="rtl"` on the `html` element, and
      `dir="auto"` on user content that could be in any script. In CSS I use logical
      properties, like `margin-inline-start`, `padding-inline` and `inset-inline-end`, plus
      `text-align: start`. Flexbox and grid then mirror automatically. Directional icons,
      such as back and next arrows, flip, but media controls, clocks and logos don't.
      Numbers stay left to right inside RTL text. I'd test with real Arabic or Hebrew
      strings, since mixed-direction text, like an English product name in an Arabic
      sentence, is where the bidirectional algorithm surprises people. Retrofitting
      `left` and `right` everywhere is the expensive part, so logical properties from day
      one pay off.
