summary: >-
  React is a library for turning state into UI. It says nothing about URLs, about what the
  server sends on the first visit, or about where data and secrets live. Every real site has
  to answer those questions, and a **framework** answers them once, with conventions. You put
  code in agreed places, such as the default export of `app/page.tsx`, and the framework calls
  it at the right moment.


  Next.js adds four things to React. Routes come from folders. Components render on the
  server, so the first response is finished HTML instead of an empty `div`. Server
  Components can load data and read secrets during render, because their code never reaches
  the browser. And a build step decides which pages can be made once and shared, and which
  must be made per request.


  The payoff is a fast first paint, pages that crawlers and link previews can read, and one
  codebase for the server and the browser. The cost is a second environment to think about.
  Every component now has a "where does this run?" question attached, and caching becomes
  something you must understand rather than ignore. A small widget embedded in another page,
  or an internal tool where nobody minds a blank first second, may not need any of that.
remember:
  - >-
    Next.js is a framework: you write components in files it knows about, and it decides
    when to call them, at build time, per request or in the browser.
  - >-
    A server-rendered page arrives as HTML, so content shows before any JavaScript runs;
    clicks only work once React has hydrated the page.
  - >-
    On a first visit the browser gets HTML for a fast preview, the RSC payload to rebuild the
    component tree, and JavaScript to hydrate the Client Components.
  - >-
    On later `<Link>` navigations only the RSC payload is fetched, not a new HTML document,
    so shared layouts stay mounted.
  - >-
    `next dev` renders every page on every request and never prefetches, so caching, static
    pages and real performance can only be judged after `next build` and `next start`.
  - >-
    Next.js calls the default export of each `page.tsx` and `layout.tsx`; a named export is
    invisible to it.
  - >-
    `localhost` always means the machine typing it, so a dev server link works for nobody
    else until the app is deployed.
sections:
  - title: Library or framework, and who calls whom
    body: |-
      With a library, your code is in charge and calls the library. With a framework, the
      framework is in charge and calls your code. This is called **inversion of control**,
      and it's the reason file names matter so much in Next.js.

      The framework looks for specific names in specific folders:

      ```text
      app/layout.tsx          default export: wraps every page, holds <html> and <body>
      app/page.tsx            default export: the page at /
      app/recipes/page.tsx    default export: the page at /recipes
      app/recipes/loading.tsx default export: shown while that page loads
      next.config.ts          default export: settings for the build and the server
      public/cake.jpg         served as it is, at /cake.jpg
      ```

      None of these files is imported by your code. Next.js reads the folder tree, builds a
      route for each `page.tsx`, and wraps it in the layouts above it. When a request for
      `/recipes` arrives, it runs the layout and the page and sends the result.

      That's why the AI review in the lesson fails: `export function HarboursPage` compiles,
      but the framework asks the module for its default export and finds nothing. It's also
      why a mistyped file name, such as `pages.tsx` or `Page.tsx`, produces a 404 with no
      error at all. The convention is the interface.

      The trade-off is familiar from every framework. You give up choosing your own structure,
      and in return every Next.js project looks the same, so a new team member knows where
      the home page lives before opening a single file.
  - title: What travels to the browser on the first visit
    body: |-
      A plain React app sends an empty shell and a script. The browser downloads the script,
      runs React, and only then draws anything. Next.js renders on the server first, and the
      first response carries three things.

      ```text
      1. HTML          the finished page, shown at once, not yet interactive
      2. RSC payload   a compact description of the rendered component tree
      3. JavaScript    the code of the Client Components, used to hydrate them
      ```

      The **RSC payload** holds the output of Server Components, placeholders for Client
      Components with references to their code, and the props passed to them. React uses it
      to rebuild the component tree in the browser. **Hydration** then attaches event
      handlers to the HTML that's already on screen, so the page becomes interactive
      without being redrawn.

      Later navigations are different. When you click a `<Link>`, the browser asks only for
      the next route's RSC payload, with no HTML at all, and React updates the tree in place.
      That's how a layout and its state survive a page change.

      Keep the two costs apart. Server rendering improves the moment content first appears.
      It doesn't remove the JavaScript needed for interactivity: a heavy Client Component
      still has to download and hydrate before its buttons respond. Server Components are
      what cut that cost, because their code never ships. The next lessons are about
      choosing which is which.
  - title: Dev, build and start are three different servers
    body: |-
      `create-next-app` adds three scripts, and they behave differently enough to cause
      real bugs.

      ```bash
      npm run dev     # next dev: Turbopack, recompiles on save, renders every request
      npm run build   # next build: optimised bundles, prerenders static pages, prints routes
      npm run start   # next start: serves what the build made
      ```

      The dev server is built for fast feedback. It compiles a route when you first visit
      it, updates the open tab on save, and shows detailed error overlays. It also renders
      pages on demand every time and never caches them, and `<Link>` doesn't prefetch in
      development. So a page that will be frozen at build time looks perfectly fresh in dev.
      The rendering lesson returns to exactly this bug.

      `next build` is where the decisions happen. It bundles and minifies the code, runs
      pages that read nothing from the request and saves their HTML, and prints a table
      marking each route as static or dynamic. `next start` then serves that output the way
      a production host would.

      Two practical rules follow. Measure performance and check caching only against
      `build` plus `start`, never against `dev`. And run `npm run build` in CI, because it
      also type-checks and catches errors the dev server only reports when you happen to
      open the broken page. Turbopack is the default bundler in Next.js 16 for both
      commands; `--webpack` switches back when a plugin needs it. Next.js 16 needs Node.js
      20.9 or later.
  - title: When server rendering matters, and when it doesn't
    body: |-
      Server rendering earns its keep when the first response has to be useful on its own.
      A product page on a slow phone, an article shared in a chat app, a search result a
      crawler reads: all of these read the HTML the server sent. A crawler or link-preview
      bot that runs no JavaScript sees nothing of a client-rendered page.

      ```text
      Plain React (client rendering)      Next.js (server rendering)
      ---------------------------------   ---------------------------------
      HTML: <div id="root"></div>         HTML: <main><h1>Recipes</h1>...
      content after JS downloads and runs content as soon as HTML arrives
      bots see an empty page              bots see the content
      one environment: the browser        two: the server and the browser
      static files, any host              needs a Node.js server, or an export
      ```

      It matters less for a screen behind a login that no crawler will visit, or a small
      interactive widget dropped into an existing site. There the extra environment is cost
      without much benefit, and a client-only React app, or a Next.js static export, is a
      fair choice. Next.js can also export plain files when no page needs a server at visit
      time; the last lesson of this chapter covers it.

      A useful interview habit: name the metric. Server rendering improves first contentful
      paint and what bots see. Shipping less client JavaScript improves how soon the page
      responds to input. They are separate levers.
pitfalls:
  - >-
    **Exporting a page by name.** `export function Page()` compiles, but Next.js only calls
    the default export and reports that the default export is not a React component. Use
    `export default`.
  - >-
    **Judging speed or freshness in `next dev`.** Dev renders every request and skips
    prefetching, so it's slower in some ways and fresher in others than production. Check
    with `npm run build && npm run start`.
  - >-
    **Thinking server rendering means no JavaScript.** Client Components still ship and
    hydrate. The HTML appears early, but buttons wait for their code. Keep interactive parts
    small.
  - >-
    **Sharing a `localhost` link.** It points at the other person's own computer. Deploy, or
    use a tunnelling tool, to let someone else see the app.
  - >-
    **Misspelling a special file.** `Page.tsx` or `pages.tsx` is an ordinary module to the
    framework, so the route is a 404 with no error. Linux servers treat file names as
    case-sensitive even when your laptop forgives them.
interview:
  - question: What does Next.js add on top of React?
    answer: >-
      React renders components; Next.js decides where, when and at which URL. It adds
      file-based routing with nested layouts, rendering on the server so the first response
      is real HTML, Server Components that fetch data and read secrets without shipping
      their code, and a build step that prerenders what it can and renders the rest per
      request. It also brings streaming, image and font optimisation and metadata for link
      previews. The trade-off is a second environment: every component now runs on the
      server, the browser or both, and caching behaviour must be understood. For a small
      widget or a logged-in tool with no SEO needs, a client-only React app can be the
      simpler choice.
  - question: Walk me through what happens when someone opens a Next.js page for the first time.
    answer: >-
      The server renders the route and sends HTML first, so the browser paints real content
      straight away. Along with it comes the RSC payload, a serialised description of the
      rendered Server Component tree with placeholders and props for the Client Components.
      Then the Client Components' JavaScript downloads, React rebuilds the tree from the
      payload and hydrates, attaching event handlers to the existing HTML. Only after
      hydration do those buttons respond. On later navigations with `<Link>`, only the next
      route's payload is fetched, so layouts and their state stay mounted. The cost to watch
      is hydration: a large client bundle delays interactivity even though content showed
      early.
  - question: Why can a page look correct in development and be wrong in production?
    answer: >-
      Because `next dev` and `next build` make different decisions. The dev server renders
      every page on every request and never caches, so data always looks fresh. The build
      prerenders any page that reads nothing from the request and serves that saved HTML to
      everyone, so a page that fetched the weather at build time keeps showing that
      temperature. Prefetching is also production only. My rule is to verify caching and
      performance with `next build` and `next start`, read the route table the build prints,
      and run the build in CI so type errors and static-versus-dynamic surprises show up
      before a deploy.
