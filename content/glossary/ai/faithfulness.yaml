term: faithfulness
aka: [faithful, groundedness score, answer faithfulness]
short: Whether every claim in an answer is supported by the passages it was given.
explain: |
  A RAG system hands the model some passages and asks for an answer. A faithful answer
  says only what those passages say. An unfaithful one adds a claim from nowhere.

  It's measured per claim, often by a grader model with a rubric. A faithful answer can
  still be wrong if the passages were wrong, so track it beside recall at k.
analogy: A reporter who only writes what the sources said, even when the sources were mistaken.
usage: Faithfulness dropped after the prompt change; the model is filling gaps with general knowledge.
related: [grounding, recall-at-k, hallucination, llm-as-judge]
level: 3
lessons: [sysdesign.case-ai-assistant]
