id: algo.binary-search-patterns
title: Binary search patterns
objective: Find the first position where a yes-or-no check turns true, and binary-search the answer itself when a bigger answer always works.
level: advanced
minutes: 10
concepts: [algo.boundary-search, algo.search-on-answer]
prerequisites: [algo.sliding-window, cs.searching-and-sorting]
opening:
  text: >-
    You'll use binary search on questions that don't look like searching at all. Whenever a
    yes-or-no answer flips only once, you can find the flip in a handful of checks.

steps:
  - type: prose
    id: picture-binary-search
    body: |-
      You've met binary search on a sorted array: look in the middle, drop the half that
      can't hold the value, repeat. A million items take about 20 looks.

      It works on a yes-or-no check too. Builds run good, good, bad, bad, and never flip
      back. Halving finds the first bad one in a thousand builds in 10 checks.

      Signals: "first" or "last" position, "smallest capacity that works", a huge range.

  - type: multiple-choice
    id: spot-binary-signal
    concept: algo.boundary-search
    difficulty: 1
    question: Which task wants binary search?
    choices:
      - text: Find the first release where a test started failing
        correct: true
        feedback: >-
          Yes. Releases run pass, pass, fail, fail: one flip to find.
      - text: Find the most common error in a log
        feedback: >-
          "Most common" is counting with a map.
      - text: Find the longest run of days with no outage
        feedback: >-
          A run of neighbours is a sliding window or a running count.
      - text: Order build jobs so dependencies run first
        feedback: >-
          Dependencies want a topological sort.

  - type: prose
    id: name-boundary
    body: |-
      This is a **boundary search**. It uses a slightly different loop from exact search:

      ```js
      let lo = 1, hi = n; // hi surely answers yes
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (check(mid)) hi = mid; // mid might be the first yes
        else lo = mid + 1;        // the first yes is after mid
      }
      return lo;
      ```

      When `lo` and `hi` meet, they sit on the first yes.

  - type: multiple-choice
    id: pick-monotonic
    concept: algo.boundary-search
    difficulty: 2
    question: For which answers can this find the first `true`?
    choices:
      - text: false, false, true, true
        correct: true
        feedback: >-
          Right. It flips once and stays flipped, so each check rules out half.
      - text: true, false, true, false
        feedback: >-
          It flips back and forth. A `true` in the middle says nothing about the left side.
      - text: false, true, false, true
        feedback: >-
          The answers flip back. Binary search needs a single flip.

  - type: code-challenge
    id: write-first-bad
    concept: algo.boundary-search
    difficulty: 3
    language: python
    starter: bisect.starter.py
    solution: bisect.solution.py
    tests: bisect.tests.py
    prompt: >-
      A CI system numbers builds from 1 to `n`. Build `n` is bad, and once a build is bad,
      every later one is too. Write `first_bad(n, is_bad)` in Python: the first bad build.
      `is_bad(build)` runs the tests, so call it as few times as you can.


      With builds 6 to 8 bad, `first_bad(8, is_bad)` is `6`.


      **Target:** O(log n) checks. The tests include `n = 1`, a bad first build, and
      `n = 1,000,000,000` with at most 31 checks allowed. Checking one build at a time runs
      out of time.
    hints:
      - Checking the middle build tells you which half holds the first bad one.
      - 'On a bad build, the answer is that build or earlier: `hi = mid`. On a good one, it''s later: `lo = mid + 1`.'
      - 'Start `lo, hi = 1, n`, loop `while lo < hi`, use `mid = (lo + hi) // 2`, then return `lo`.'

  - type: prose
    id: name-search-on-answer
    body: |-
      Now the twist. Parcels ship in order over some days. What's the smallest daily
      capacity that works?

      If capacity c works, anything bigger works too. So "does c work?" runs no, no, yes,
      yes. **Search the answer**: binary-search c between the heaviest parcel and the total.
      For each guess, count the days it needs in one pass.

  - type: ai-review
    id: review-low-bound
    concept: algo.search-on-answer
    difficulty: 3
    language: js
    request: Write minShipCapacity(weights, days) using a daysNeeded(weights, capacity) helper.
    flawClass: edge-case
    code: |
      function minShipCapacity(weights, days) {
        let lo = 1;
        let hi = weights.reduce((total, weight) => total + weight, 0);
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (daysNeeded(weights, mid) <= days) {
            hi = mid;
          } else {
            lo = mid + 1;
          }
        }
        return lo;
      }
    prompt: >-
      An assistant wrote this. Tests with many light parcels passed. For `[10, 1, 1]` over 3
      days it returns `2`, though a 10 can't fit. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The lowest guess must be the heaviest parcel
        correct: true
        feedback: >-
          Right. Below that, `daysNeeded` still packs the 10 and lies about fitting.
      - text: '`hi` should be one more than the total'
        feedback: >-
          The total always works, so it's a safe top. The bottom is the problem.
      - text: '`hi = mid` should be `hi = mid - 1`'
        feedback: >-
          That could skip the answer when `mid` itself is the smallest that works.
    verify:
      question: Which test would have caught this?
      choices:
        - text: One heavy parcel with plenty of days
          correct: true
          feedback: >-
            Yes. Then the right answer is the heaviest parcel, above where the search
            starts.
        - text: Parcels all weighing 1, one per day
          feedback: >-
            The answer is 1, which is where the search starts anyway. The low bound is right
            by luck.
        - text: Many light parcels in a single day
          feedback: >-
            The answer is the total, at the top of the range. The broken bottom never
            matters.
    fix: |
      let lo = Math.max(...weights);

  - type: code-challenge
    id: write-min-ship-capacity
    concept: algo.search-on-answer
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: ship.starter.py
      solution: ship.solution.py
      tests: ship.tests.py
    prompt: >-
      A warehouse ships parcels in order, and a day's load can't exceed the capacity. Write
      `minShipCapacity(weights, days)`: the smallest capacity that ships everything within
      `days`. The starter gives you `daysNeeded`.


      `minShipCapacity([3, 2, 2, 4, 1, 4], 3)` is `6`. No parcels gives `0`.


      **Target:** O(n log(total)) for up to 500,000 parcels. The tests include one heavy
      parcel and a full-size run. Trying every capacity in turn runs out of time.
    hints:
      - The answer lies between the heaviest parcel and the total weight.
      - 'Find both with one loop. `Math.max(...weights)` passes every parcel as an argument, and throws a `RangeError` on 500,000 of them.'
      - 'Set `lo` to the heaviest and `hi` to the total, then run the boundary loop with `daysNeeded(weights, mid) <= days`.'

  - type: explain-back
    id: explain-search-on-answer
    concept: algo.search-on-answer
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer asks: there's no sorted array of capacities anywhere, so why can binary
      search find the smallest one? And what does it cost?
    rubric:
      - If a capacity works, every larger capacity works too.
      - So "does c work?" flips once over the range, and binary search finds the flip.
      - About log(total) guesses, each checked in one O(n) pass, so O(n log(total)).
    modelAnswer: >-
      Binary search needs answers that flip once, not a stored array. A capacity that works
      keeps working when it grows, so the checks run no, no, yes, yes over the range. That
      range runs from the heaviest parcel to the total. Each guess costs one pass to count
      days, so it's O(n log(total)).

recap:
  - Find the first yes in any check that flips once, with `lo < hi` and `hi = mid`.
  - Binary-search an answer when a bigger answer always works if a smaller one does.
  - Pick the search range from the problem, such as heaviest parcel to total.
recall:
  - id: card-boundary-need
    concept: algo.boundary-search
    front: What must be true of a yes-or-no check for a boundary search?
    back: >-
      It flips once and never flips back: all no, then all yes.
  - id: card-boundary-moves
    concept: algo.boundary-search
    front: In a first-true search, what happens to `hi` and `lo` on a yes and on a no?
    back: >-
      On a yes, `hi = mid`, since this could be the first. On a no, `lo = mid + 1`.
  - id: card-answer-signal
    concept: algo.search-on-answer
    front: Which phrases suggest binary-searching the answer?
    back: >-
      "Smallest capacity", "minimum speed", "least time" or "largest minimum", when one guess
      can be checked in a single pass.
  - id: card-answer-cost
    concept: algo.search-on-answer
    front: What does searching the ship capacity cost?
    back: >-
      O(n × log(total weight)): about log of the range guesses, each checked in one pass.

references:
  - kind: docs
    title: Sorting and searching cheatsheet for coding interviews
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/algorithms/sorting-searching/
    note: Binary search variants and practice problems.
    primary: true
    verified: true
  - kind: docs
    title: Binary search
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Binary_search
    note: Leftmost and rightmost variants, and the history of its off-by-one bugs.
    verified: true

deepDive: >-
  Every output here was run on Node 24. The flawed version returns 2 for `[10, 1, 1]` over 3
  days; the right answer is 10. On Node 24, `Math.max(...array)` throws a `RangeError`
  somewhere between 100,000 and 200,000 items; browsers differ, so use a loop on big input.


  Keep one template and reuse it: `lo < hi`, `hi = mid` on a yes, `lo = mid + 1` on a no,
  and return `lo`. The range must contain an answer that works, so pick `hi` as something
  that surely works. That habit avoids most off-by-one bugs.


  The exact-match search you met earlier uses `lo <= hi` and `hi = mid - 1`, because it
  can stop the moment it finds the value. A boundary search can't stop early: it's
  looking for the edge, so it keeps `mid` in the range.


  `Math.floor((lo + hi) / 2)` is safe in JavaScript, where numbers are doubles. In languages
  with 32-bit integers, `lo + hi` can overflow, which is why you'll see `lo + (hi - lo) / 2`.
  That bug sat in a well-known library's binary search for years. Python's `bisect` module
  has `bisect_left`, which is this lesson's boundary search on a sorted list.
