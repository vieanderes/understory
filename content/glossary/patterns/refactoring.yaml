term: refactoring
aka:
  - refactor
short: Changing how code is organised without changing what it does, so the next change is cheaper.
explain: |
  Rename a variable, pull a long block into a well-named function, split a file. The
  behaviour stays the same; the code reads better.

  What makes it safe: tests first, then small steps, running the tests after each.
  Refactoring mixed into a feature change hides both in the diff, so reviewers can check
  neither. Give it its own commit.
analogy: Tidying the kitchen between meals. Nobody eats differently, but the next meal is quicker to cook.
usage: Split the refactoring into its own PR; I can't see the behaviour change in this diff.
related:
  - code-smell
  - dry
level: 1
lessons:
  - clean.code-smells
