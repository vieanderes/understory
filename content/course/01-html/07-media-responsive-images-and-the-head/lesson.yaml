id: html.media-and-head
title: Images and the head
objective: Stop images from shifting the page, offer them in several sizes, and fill in the head.
level: essential
minutes: 10
concepts: [html.image-dimensions, html.responsive-images, html.metadata]
prerequisites: [html.everyday-elements, html.links-and-urls]
opening:
  text: >-
    You'll stop pages jumping while images load, and send phones a smaller file. Then you'll
    fill in the part of the page that search results and browser tabs read.

steps:
  - type: prose
    id: layout-shift
    body: >-
      Until a picture arrives, the browser doesn't know its shape. So its box starts 0 pixels
      tall. When the file lands, the box grows, and everything below jumps down. People tap
      the wrong thing.


      The fix is two attributes, `width` and `height`: the file's size in pixels. The browser
      then saves the right space straight away.

  - type: playground
    id: add-image-size
    concept: html.image-dimensions
    difficulty: 1
    prompt: >-
      The photo file is 1600 pixels wide and 900 tall. Add `width` and `height` to the `img`,
      so the browser can save space for it.
    html: |
      <h1>Ridge trail</h1>
      <img src="trail.jpg" alt="A path along a grassy ridge">
      <p>A 6 km walk with views of the sea.</p>
    editable: [html]
    checks:
      - label: The image has `width="1600"`
        selector: 'img[width="1600"]'
        count: 1
      - label: The image has `height="900"`
        selector: 'img[height="900"]'
        count: 1
    solution:
      html: |
        <h1>Ridge trail</h1>
        <img src="trail.jpg" alt="A path along a grassy ridge" width="1600" height="900">
        <p>A 6 km walk with views of the sea.</p>
    hints:
      - Both are attributes inside the `img` start tag.
      - They take plain numbers, with no `px`.
      - Add `width="1600" height="900"`.

  - type: bug-hunt
    id: hunt-jumping-page
    concept: html.image-dimensions
    difficulty: 2
    language: html
    code: |
      <h1>Ridge trail</h1>
      <img src="map.png" alt="Map of the route" width="800" height="600">
      <p>Start at the car park.</p>
      <img src="view.jpg" alt="The sea from the top of the ridge">
      <p><a href="/book">Book a guided walk</a></p>
    prompt: >-
      On a slow phone, people go to tap "Book a guided walk", the page jumps, and they miss.
      Tap the line at fault.
    lines: [4]
    reasons:
      - text: The browser can't save space for this image
        correct: true
        feedback: >-
          Right. Without `width` and `height`, its box grows when the file lands.
      - text: The link needs its own `img`
        feedback: >-
          The link is fine. Something above it changes size while the page loads.
      - text: The map's size is wrong
        feedback: >-
          The map says its size, so its space is saved from the start. The photo doesn't.
    fix: |
      <h1>Ridge trail</h1>
      <img src="map.png" alt="Map of the route" width="800" height="600">
      <p>Start at the car park.</p>
      <img src="view.jpg" alt="The sea from the top of the ridge" width="1200" height="800">
      <p><a href="/book">Book a guided walk</a></p>

  - type: prose
    id: srcset-candidates
    body: |-
      A phone doesn't need the same huge photo as a big monitor. `srcset` offers the picture
      in several widths:

      ```html
      <img src="trail-800.jpg" alt="A path along a grassy ridge"
           srcset="trail-480.jpg 480w, trail-800.jpg 800w, trail-1600.jpg 1600w">
      ```

      Each `w` gives a file's width in pixels. The browser picks the smallest file that still
      looks sharp, and `src` is the fallback.

  - type: predict-output
    id: predict-phone-candidate
    concept: html.responsive-images
    difficulty: 2
    language: html
    code: |
      <img src="trail-800.jpg" alt="A path along a grassy ridge"
           srcset="trail-480.jpg 480w, trail-800.jpg 800w, trail-1600.jpg 1600w">
    question: The picture fills a window 400 pixels wide, one screen pixel per pixel. Which file loads?
    choices:
      - text: '`trail-480.jpg`'
        correct: true
        feedback: >-
          Yes. It's the smallest file that covers 400 pixels.
      - text: '`trail-800.jpg`'
        feedback: >-
          It would look fine, but it's more bytes than needed. 480 pixels already cover 400.
      - text: '`trail-1600.jpg`'
        feedback: >-
          Biggest isn't best here. The extra pixels cost download time and add nothing you can
          see.

  - type: prose
    id: head-basics
    body: |-
      The `head` holds facts about the page that aren't drawn:

      ```html
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Ridge trail</title>
        <meta name="description" content="A 6 km ridge walk.">
      </head>
      ```

      `charset` tells the browser how to read the letters. `title` names the tab and the
      search result, and the description is the summary under it. `viewport` makes phones
      lay out the page at their own width.

  - type: playground
    id: fill-in-the-head
    concept: html.metadata
    difficulty: 2
    prompt: >-
      This page has no title, so its tab shows the address instead. Add a `title` that says
      Ridge trail, and a `meta` description for search results.
    html: |
      <!doctype html>
      <html>
        <head>
          <meta charset="utf-8">
        </head>
        <body>
          <h1>Ridge trail</h1>
        </body>
      </html>
    editable: [html]
    checks:
      - label: The page has a title that says Ridge trail
        selector: title
        text: Ridge trail
      - label: The page has a description
        selector: 'meta[name="description"][content]'
        count: 1
    solution:
      html: |
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8">
            <title>Ridge trail</title>
            <meta name="description" content="A 6 km walk along a grassy ridge.">
          </head>
          <body>
            <h1>Ridge trail</h1>
          </body>
        </html>
    hints:
      - Both new elements go inside `head`.
      - '`title` has an end tag. `meta` has none.'
      - The description is `<meta name="description" content="...">`.

  - type: multiple-choice
    id: pick-tiny-on-phone
    concept: html.metadata
    difficulty: 3
    question: On a phone, a new page looks zoomed out, with tiny text. What's most likely missing?
    choices:
      - text: The `viewport` meta tag
        correct: true
        feedback: >-
          Yes. Without it, phones lay the page out wide, then shrink it.
      - text: The `title`
        feedback: >-
          The title only names the tab. It doesn't change how the page is drawn.
      - text: The `description` meta tag
        feedback: >-
          The description is for search results. The browser doesn't use it to draw the page.
      - text: '`width` and `height` on the images'
        feedback: >-
          Those stop the page jumping while images load. They don't set the text size.

  - type: explain-back
    id: explain-jumping-page
    concept: html.image-dimensions
    difficulty: 3
    prompt: >-
      Your page looks fine once the photo has loaded. Why should the `img` still have `width`
      and `height` attributes?
    rubric:
      - Before the file arrives, the browser doesn't know the picture's shape.
      - The attributes give it that shape, so it can save a box of the right height.
      - Without them, the box grows when the file lands, and the page below jumps.
    modelAnswer: >-
      Before the file arrives, the browser can't know the picture's shape, so its box starts
      at 0 pixels tall. When the photo lands, the box grows and the page below jumps. With
      `width` and `height`, the browser knows the shape straight away and saves the right
      space. Nothing jumps.

recap:
  - Give every `img` a `width` and `height`, so nothing jumps.
  - Offer a photo in several widths with `srcset`.
  - Fill in `head` with a `title`, a description and a `viewport`.

recall:
  - id: card-width-height
    concept: html.image-dimensions
    front: 'Why give an `img` `width` and `height` attributes?'
    back: >-
      They give the browser the photo's shape before the file loads. It saves a box of the
      right height, so nothing below moves.
  - id: card-w-descriptor
    concept: html.responsive-images
    front: In `srcset="trail-480.jpg 480w"`, what does `480w` mean?
    back: >-
      The file is 480 pixels wide. The browser uses that to pick the smallest file that looks
      sharp.
  - id: card-head-jobs
    concept: html.metadata
    front: What do `title`, the description `meta` and the `viewport` `meta` each do?
    back: >-
      `title` names the tab and the search result. The description is the summary in search
      results. `viewport` makes phones use their own width.

