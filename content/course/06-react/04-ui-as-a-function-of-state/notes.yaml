summary: >-
  React turns state into pixels in three steps. A **trigger** asks for an update: the first
  `root.render`, or a state setter. In the **render** step React calls your components to get
  a fresh tree of React elements, plain objects that describe the page. In the **commit** step
  it compares that tree with the previous one and changes the DOM only where they differ. The
  comparison is called **reconciliation**.


  This split is why a React page can re-render often and stay fast, and why typed text,
  focus and scroll position survive updates: the DOM nodes that didn't change are never
  replaced. It also puts a hard rule on your components. React may call them at any time, as
  often as it likes, and may throw a render away. So rendering must be pure: the same props
  and state give the same JSX, and a render changes nothing outside itself.


  Side effects still happen, only elsewhere. Event handlers run when the user acts, and
  effects, a later lesson, run after the commit. Strict Mode helps you keep the line by
  calling components twice in development, so a render that leaks shows up at once.
remember:
  - An update runs in three steps, trigger, render and commit, and only the commit touches the DOM.
  - A component re-renders when its own state changes, when its parent re-renders, or when a context it reads changes.
  - When a parent renders, every child renders too, even with identical props, unless you opt out with `memo`.
  - Reconciliation compares element types position by position; the same type keeps the DOM node and its state, a different type destroys the whole subtree.
  - State belongs to a position in the tree, not to a component function or a variable.
  - A pure component returns the same JSX for the same props and state, and changes nothing that existed before the render started.
  - Mutating a variable or array created during the same render is fine; mutating props, state or anything outside is not.
  - Strict Mode, in development only, calls components, initialisers and updaters twice, and runs each effect's setup, cleanup, setup.
sections:
  - title: How reconciliation decides what to keep
    body: |-
      After a render, React walks the new element tree alongside the old one. At each position
      it asks one question: is the element type the same?

      - Same type, such as `div` then `div`, or `Field` then `Field`: React keeps the DOM node
        or component instance, with its state, and updates only the props that changed.
      - Different type, such as `div` then `section`: React unmounts the old subtree, state
        and all, and mounts the new one from scratch.

      That rule has a surprising edge. Changing a wrapper element resets everything inside it:

      ```tsx
      import { useState } from 'react';

      function Field() {
        const [text, setText] = useState('');
        return <input aria-label="Note" value={text} onChange={(e) => setText(e.target.value)} />;
      }

      // Toggling `boxed` wipes the note: the parent type changes, so Field remounts.
      export function Wrapped({ boxed }: { boxed: boolean }) {
        return boxed ? <section><Field /></section> : <div><Field /></div>;
      }

      // Toggling `big` keeps the note: same type, same position.
      export function Styled({ big }: { big: boolean }) {
        return <div>{big ? <Field /> : <Field />}</div>;
      }
      ```

      We typed into both and toggled. `Wrapped` came back empty; `Styled` kept the text. Two
      branches of a ternary that produce the same type at the same position are one
      component to React, whatever the source code looks like.

      The same mechanism explains a rule you'll meet soon: never define a component inside
      another component. The inner function is recreated on every render, so its type is a new
      function each time, and React remounts it, losing its state and focus on every keystroke.
      Keys, in the lists lesson, are the tool for telling React which item is which when
      position alone isn't enough.
  - title: What makes a component render, and how far it spreads
    body: |-
      Three things schedule a render of a component: its own state changes, a context it reads
      changes, or its parent renders. Changed props are not a separate trigger. A child only
      gets new props because its parent rendered, and when the parent renders the child renders
      whether its props changed or not.

      ```tsx
      import { useState } from 'react';

      let childRenders = 0;

      function Label({ text }: { text: string }) {
        childRenders++;
        return <span>{text}</span>;
      }

      export function Counter() {
        const [count, setCount] = useState(0);
        return (
          <button onClick={() => setCount(count + 1)}>
            <Label text="Clicks" /> {count}
          </button>
        );
      }
      ```

      One click, and `childRenders` goes from 1 to 2, although `Label` got the same string
      both times. Its commit changes nothing, because the output is identical.

      That's usually fine. A render is a function call that builds some objects; the commit,
      which touches the DOM, is the expensive part, and React skips it where nothing differs.
      Renders cost real time only when a component is slow to compute or a big subtree renders
      on every keystroke. The fixes, from cheapest: move state down so fewer components sit
      under it, pass slow parts in as `children` so they're built by a parent that doesn't
      re-render, and, when measurement says so, wrap a component in `memo` so React skips it
      when its props are equal. The performance lesson covers the last one.
  - title: What purity allows and forbids
    body: |-
      Purity isn't a ban on all mutation. It's a ban on changing anything that existed before
      the render began. Local mutation is fine: an array you create in this render is yours.

      ```tsx
      type Order = { id: string; total: number; paid: boolean };

      export function Unpaid({ orders }: { orders: Order[] }) {
        const rows = []; // created during this render, so pushing is fine
        let sum = 0;
        for (const order of orders) {
          if (order.paid) continue;
          sum += order.total;
          rows.push(<li key={order.id}>{order.id}: £{order.total.toFixed(2)}</li>);
        }
        return (
          <section>
            <ul>{rows}</ul>
            <p>Owed: £{sum.toFixed(2)}</p>
          </section>
        );
      }
      ```

      What breaks purity:

      - Mutating props or state, such as `props.items.sort()` or `state.list.push(x)`.
      - Writing to module variables, `window`, `localStorage` or the DOM.
      - Starting a request, a timer or a subscription.
      - Reading values that change between calls, such as `Date.now()` or `Math.random()`, to
        decide what to show. Two renders then disagree, and a page rendered on the server won't
        match the one the browser renders.

      Each of those has a proper home. A reaction to a click belongs in the handler. Syncing
      with something outside React after the page updates belongs in an effect. A random id
      comes from `useId`, and a value that must be computed once belongs in a lazy `useState`
      initialiser.
  - title: What Strict Mode does, exactly
    body: |-
      You turn Strict Mode on by wrapping part of the tree, usually the whole app:

      ```tsx
      import { StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';

      function App() {
        return <h1>Orders</h1>;
      }

      createRoot(document.getElementById('root')!).render(
        <StrictMode>
          <App />
        </StrictMode>,
      );
      ```

      In a development build, it then doubles the work that should be safe to repeat. We logged
      a component under Strict Mode in React 19 and saw this order: render, render, ref
      attached, effect, ref cleanup, effect cleanup, ref attached, effect. So it runs:

      - component bodies twice, and the initialisers of `useState`, `useMemo` and `useReducer`
        twice, keeping one result;
      - state updater functions twice;
      - each effect's setup, then its cleanup, then its setup again, as if the component
        mounted, unmounted and mounted;
      - ref callbacks the same way, attach, detach, attach.

      A pure component can't tell the difference. An impure one shows the bug in the first
      minute: a counter that adds twice, a list that grows two items, a listener that fires
      twice because the effect has no cleanup. Production builds skip all of it, so there's no
      cost to users. The fix is never to remove Strict Mode, it's to make the code safe to
      repeat.
pitfalls:
  - >-
    **Sorting or reversing a prop in place.** `sort`, `reverse` and `splice` change the
    parent's array during render. Use `toSorted`, `toReversed` and `toSpliced`, or copy first.
  - >-
    **Defining a component inside a component.** Its type is a new function on each render, so
    React remounts it and state and focus are lost. Define components at the top level of the
    module.
  - >-
    **Switching the wrapper element.** A condition that swaps `div` for `section` around a form
    resets the form. Keep the wrapper type stable and change a class instead.
  - >-
    **Reading the clock or a random number during render.** Two renders disagree, and server
    and client output mismatch. Compute it in a handler, an effect or a lazy initialiser.
  - >-
    **Turning off Strict Mode to stop double logs.** The double call only exposes an impurity
    that production can also hit. Fix the render or add the missing cleanup instead.
  - >-
    **Thinking a re-render means DOM work.** Rendering is cheap and commits only differences.
    Measure with the React DevTools profiler before optimising.
verify:
  - lens: breaks
    check: 'No component sorts, reverses or pushes into a prop while rendering, because the parent and its other children share that array.'
  - lens: breaks
    check: 'Rendering reads nothing that changes between calls, like the clock or a random number, so two renders give the same JSX.'
  - lens: confuses
    check: 'Components are defined at the top level of a file, never inside another component, so their state survives a re-render.'
  - lens: tests
    check: 'The app runs in Strict Mode during development, so an impure component shows itself through the double render.'
interview:
  - question: What's the difference between rendering and committing in React?
    answer: >-
      Rendering computes, committing applies. In the render step React calls your components
      and gets a new tree of elements; nothing on screen changes, and React may pause or throw
      that work away. In the commit step React reconciles the new tree with the previous one and
      makes the minimal DOM changes, then runs layout effects and, after paint, effects. That's
      why components must be pure, because a render may run more than once or never commit,
      while the commit happens once per update. It's also why a re-render usually isn't a
      performance problem: if the output is the same, the commit does nothing. What does cost
      is a render that's slow to compute, which is where moving state down or `memo` helps.
  - question: When does a React component re-render?
    answer: >-
      When its state changes, when a context it reads changes, or when its parent re-renders.
      The last one surprises people: a child re-renders because its parent did, even if its
      props are identical. Props changing isn't a trigger of its own, since new props only
      arrive through a parent render. If a render is expensive, I first restructure: move the
      state closer to where it's used so less sits beneath it, or pass heavy parts as `children`
      from a component that doesn't re-render. Only then, with a profiler showing the cost, I
      wrap the child in `memo`, which skips its render when props are shallowly equal. `memo`
      has its own cost, a comparison on every render and stable props to maintain.
  - question: Explain reconciliation. How does React decide what to keep?
    answer: >-
      It compares the new element tree with the previous one, position by position, by type.
      Same type at the same position: React keeps the DOM node or component instance, keeps its
      state, and updates changed props. Different type: it unmounts the old subtree with all its
      state and mounts the new one. Comparing only same-level positions keeps the algorithm
      linear instead of trying to find the minimal edit between two arbitrary trees. The
      trade-off shows in edge cases: swapping a `div` wrapper for a `section` resets every input
      inside, and a component defined inside another remounts on every render. For lists,
      where items move, keys tell React which element is which, so it can match by identity
      instead of index.
  - question: What does it mean for a React component to be pure, and why does React require it?
    answer: >-
      A pure component returns the same JSX for the same props, state and context, and doesn't
      change anything that existed before the render. React requires it because it controls
      when and how often rendering happens: it can call a component twice, render it in the
      background, pause and resume, or discard a render that never commits. Impure renders leave
      traces of work that never reached the screen, like a total counted twice or a request sent
      for a discarded render. Local mutation is allowed, so building an array inside the render
      is fine. Side effects go in event handlers or, when they sync with an outside system after
      commit, in effects. Strict Mode double-invokes renders in development to catch violations.
