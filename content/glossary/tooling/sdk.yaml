term: SDK
aka:
  - software development kit
  - client library
short: A library from a service's maker that wraps its API in ordinary functions for one language.
explain: |
  Calling an API by hand means building HTTP requests, adding headers, parsing JSON and
  retrying when it fails. Every team would write the same code again.

  The provider publishes a library that does this for you. You call a function with typed
  arguments and get typed objects back. Good ones also handle authentication, timeouts,
  retries and streaming.

  Know what it already does. Say the client retries twice, and your code wraps it in five retries. One failure becomes fifteen
  requests.
analogy: A universal remote that comes with the TV. You press "volume up" instead of sending infrared codes.
example:
  language: python
  code: |
    # By hand
    resp = httpx.post(URL, headers={"x-api-key": key}, json=body, timeout=30)
    resp.raise_for_status()
    text = resp.json()["content"][0]["text"]

    # With the provider's library
    reply = client.messages.create(model=MODEL, max_tokens=300, messages=messages)
usage: Check the SDK's default timeout before we add our own; it already retries rate limits.
related:
  - api
