term: reranking
aka:
  - reranker
  - re-ranking
short: Rescoring a shortlist of search results with a slower, sharper model that reads query and passage together.
explain: |
  A first search has to be fast, so it's rough: it fetches the 50 passages that look most
  likely. A reranker then reads the question and each passage side by side and reorders
  them. The best few go into the prompt.

  It can only reorder what the first search found. If the right passage isn't in the
  shortlist, no reranker brings it back. Widen the first search before tuning the second.
analogy: A recruiter skims 200 CVs for keywords, then the hiring manager reads the top 20 properly.
usage: Retrieval finds the right passage at rank 14, and reranking should lift it into the top five.
related:
  - vector-search
  - rag
  - embedding
level: 3
