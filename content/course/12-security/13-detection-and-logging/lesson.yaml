id: security.detection-and-logging
title: Detection and logging
objective: Log the events that matter without leaking secrets, tell detection from prevention, and alert on signals worth waking up for.
level: essential
minutes: 10
concepts: [security.security-logging, security.detection-vs-prevention, security.alerting-signals]
prerequisites: [security.abuse-and-privacy, security.secrets]
opening:
  text: >-
    You'll record the trail an attack leaves, without writing a password into it. And you'll
    raise an alert that means something, instead of one nobody reads.

steps:
  - type: prose
    id: what-to-log
    body: >-
      A **log** is the diary your server keeps. Each line records one event, and the team can
      search the lines later:


      ```json

      {"event":"login_failed","user":"kofi","ip":"203.0.113.7","requestId":"r-81f2","at":1758793200000}

      ```


      **Security logging** records the events you'd need to spot an attack and piece it
      together: logins, failed logins, access denied, a role change. The **request id** is a
      label the server gives each incoming request. It ties together every line that request
      wrote.

  - type: predict-output
    id: predict-leaked-password
    concept: security.security-logging
    difficulty: 1
    language: js
    code: |
      app.post('/login', (req, res) => {
        console.log('login attempt', JSON.stringify(req.body));
        // req.body is { "user": "kofi", "password": "hunter2" }
      });
    question: This line goes to a log file the whole team can search. What ends up in it?
    choices:
      - text: The username and the password, in plain text
        correct: true
        feedback: >-
          Right. The whole body includes the password, copied straight into the file.
      - text: Only the username, since passwords are special
        feedback: >-
          Nothing knows a field is a password. `JSON.stringify` writes every key it's given.
      - text: A hash of the body
        feedback: >-
          No hashing happens here. The raw text goes straight to the log.

  - type: prose
    id: what-never-to-log
    body: >-
      Secrets hide in more places than the body. Every signed-in request carries one in its
      headers:


      ```text

      Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOjd9.k3b...

      Cookie: sid=WzH7Njk5FxJhj9gi

      ```


      The **Authorization header** carries the caller's credential. A **bearer token** works
      for whoever holds it, like a concert ticket. A log is copied, shipped and searched, so a
      token in it works for everyone who can read it.

  - type: fill-blank
    id: fill-log-event
    concept: security.security-logging
    difficulty: 2
    language: js
    prompt: >-
      Log a failed login with enough to act on and nothing secret. Your server puts each
      request's id in `req.id`. Fill the gaps.
    template: |
      logger.warn({
        event: '{{1}}',
        user: req.body.{{2}},
        requestId: req.{{3}},
        ip: req.ip,
        at: Date.now(),
      });
    blanks:
      - key: '1'
        answer: login_failed
      - key: '2'
        answer: user
      - key: '3'
        answer: id
    bank: [login_failed, login_ok, user, password, id, headers]

  - type: ai-review
    id: review-log-the-token
    concept: security.security-logging
    difficulty: 3
    language: js
    request: Log each request so we can debug sign-in problems in production.
    flawClass: data-exposure
    code: |
      app.use((req, res, next) => {
        logger.info({
          method: req.method,
          path: req.path,
          headers: req.headers,
          at: Date.now(),
        });
        next();
      });
    prompt: >-
      An assistant wrote this, and it does help debug sign-in. Six months later, an analyst
      exports the logs and every user's session is in the file. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`headers` carries the `Cookie` and `Authorization` values'
        correct: true
        feedback: >-
          Yes. The session cookie and bearer token ride in the headers. Log a chosen few.
      - text: '`req.path` can contain a query string'
        feedback: >-
          In Express, `req.path` leaves the query string out. The whole header block is the spill.
      - text: '`Date.now()` should be an ISO string'
        feedback: >-
          A format choice, not a leak. The secrets riding in the headers are the problem.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Send a known cookie, then search the log for it
          correct: true
          feedback: >-
            Yes. The secret must never appear in what gets written.
        - text: Check each line has the method and path
          feedback: >-
            Those fields were always fine. The test never looks for a secret in the output.
        - text: Sign in and expect a `200`
          feedback: >-
            Sign-in works either way. Logging changes what's kept, not the response.
    fix: |
      app.use((req, res, next) => {
        logger.info({
          method: req.method,
          path: req.path,
          requestId: req.id,
          at: Date.now(),
        });
        next();
      });

  - type: code-challenge
    id: write-redact
    concept: security.security-logging
    difficulty: 3
    language: ts
    starter: redact.starter.ts
    solution: redact.solution.ts
    tests: redact.tests.ts
    prompt: >-
      Some code logs whole objects anyway, so the logger masks them first. Fix `redact(entry)`.


      Return a copy that masks sensitive keys: `password`, `token`, `authorization`, `cookie`
      and `card`, in any case. Their values become `'[redacted]'`. Look inside nested
      objects too, at any depth. Leave the original entry unchanged.


      So `{ auth: { token: 'eyJ' } }` becomes `{ auth: { token: '[redacted]' } }`.
    hints:
      - The starter only looks at the top level. What should happen when a value is itself an object?
      - '`typeof value === ''object'' && value !== null` spots a nested object, and `key.toLowerCase()` fixes the case.'
      - 'For a nested object, call `redact` on it and store what it returns: `out[key] = redact(value as Record<string, unknown>)`.'

  - type: prose
    id: detection-vs-prevention
    body: >-
      Security has two jobs. **Prevention** blocks an attack: validation, a rate limit, an
      ownership check. **Detection** notices an attack that got through: a log, an alert, a
      review.


      You need both, because prevention eventually fails. A new bug, a missed check, a stolen
      key. When it does, the logs are the only thing that says what happened.

  - type: prose
    id: alerting-on-signals
    body: >-
      An **alert** is a message that makes a person stop and look, often a phone
      notification. It should fire on a signal that needs action.


      Alert on every failed login and the real attack drowns in typos. The team mutes the
      channel, and the attack runs unwatched. "Five failures for one account within a minute"
      is a signal. "A failed login" is noise.

  - type: code-challenge
    id: write-accounts-to-alert
    concept: security.alerting-signals
    difficulty: 4
    language: ts
    starter: alert.starter.ts
    solution: alert.solution.ts
    tests: alert.tests.ts
    prompt: >-
      Write `accountsToAlert(events, threshold, windowMs, now)`, the rule behind a
      password-guessing alert. Each event is `{ type, user, at }`, with `at` a timestamp.


      Count events of type `'login_failed'` per user, but only those within `windowMs` before
      `now`. Return the users whose count reaches `threshold`, in the order they first appear.
      Ignore other event types, and failures older than the window.
    hints:
      - Walk the events once, keeping a count per user.
      - '`now - event.at > windowMs` marks an event as too old to count.'
      - 'Start with `const counts: Record<string, number> = {};` and a list for the order users appear in.'

  - type: explain-back
    id: explain-detection-and-prevention
    concept: security.detection-vs-prevention
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Your login has a rate limit and strong validation. A teammate says logging and alerts
      are now a waste of effort. What does that miss?
    rubric:
      - Prevention stops the attacks it was built for, but a new bug or a stolen key gets past it.
      - Detection notices the attack that slipped through, from the trail in the logs.
      - Without logs and alerts, a breach runs unseen and can't be pieced together afterwards.
    modelAnswer: >-
      A rate limit and validation stop the attacks you thought of. They can't stop the one you
      didn't: a new flaw, a leaked key, someone inside. Prevention fails quietly, and without
      detection nobody knows. The logs are the trail that shows something strange happened,
      and the alert makes someone look. You need both, because neither covers the other's gap.

recap:
  - Log the events that reveal an attack, with a request id, and keep passwords and tokens out.
  - Prevention blocks attacks; detection catches the ones that get through. Keep both.
  - Alert on a tuned signal, so a real attack isn't lost in noise nobody reads.

recall:
  - id: card-what-to-log
    concept: security.security-logging
    front: What belongs in a security log, and what must never?
    back: >-
      The event, time, user and request id. Never a password, token, card number or session id.
  - id: card-detection-vs-prevention
    concept: security.detection-vs-prevention
    front: Why keep detection when prevention is in place?
    back: >-
      Prevention eventually fails, to a new bug or a stolen key. Detection notices what got through.
  - id: card-alert-signal
    concept: security.alerting-signals
    front: Why not alert on every failed login?
    back: >-
      Normal typos bury the real attack, so the team mutes it. Alert on a pattern, like five failures a minute.
  - id: card-redaction
    concept: security.security-logging
    front: How do you log a request without leaking its secrets?
    back: >-
      Pick the fields you need, and mask sensitive keys at every depth, rather than logging the whole body or headers.

references:
  - kind: docs
    title: Logging Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    note: What to log, what to exclude, and how to keep logs usable for detection.
    primary: true
    verified: true
  - kind: docs
    title: Application Logging Vocabulary Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/Application_Logging_Vocabulary_Cheat_Sheet.html
    note: A shared vocabulary of security events worth logging, such as authentication failures.
    verified: true
  - kind: docs
    title: Redaction
    authors: pino contributors
    venue: pino documentation
    url: https://getpino.io/#/docs/redaction
    note: A Node logger that masks named paths, such as `req.headers.authorization`, before writing.
    verified: true

deepDive: >-
  Redacting by key name is a floor, not a ceiling. Secrets also hide in a query string, in an
  error message, or in a free-text field. Loggers such as pino let you name paths to mask,
  like `req.headers.authorization`, so the rule lives in one place.


  Alerts fail in two ways. Too many, and they're muted: alert fatigue, where the real one is
  missed among false ones. Too few, and an attack runs for months unseen. Tuning a threshold
  and a window sits between them, and it's never finished.


  Logs are evidence, so they need protecting too. Storage that can only be appended to, a
  separate account, and a retention window mean an attacker who gets in can't quietly erase
  the trail.


  Following one sensitive field through logs, errors, URLs, caches and prompts continues in the
  lesson *Following the data*.
