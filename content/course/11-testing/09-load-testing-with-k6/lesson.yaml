deepDive: >-
  The numbers in this lesson come from k6 1.6 against a Node server on one laptop. The server
  had a pool of four and a 100 ms sleep per request. Your server's knee is somewhere else. The
  shape is the same: throughput rises with users until one resource is always busy, then
  latency takes the growth.


  A ramp of VUs eases off when the server slows, because each VU waits for its reply. Real
  visitors don't. k6's `constant-arrival-rate` executor starts requests at a fixed rate
  whatever the server does, and reports the ones it couldn't start as
  `dropped_iterations`. Against the 40-a-second server, 60 a second pushed VUs to their cap
  and dropped the rest.


  The ramp in the fill-blank failed its threshold with `p(95)=1.37s`, while every check
  passed: each request returned `200`, late. Correct and slow is the failure a load test
  exists to find.


  Percentiles don't add up. A page that makes ten backend calls has a far worse p95 than any
  one call. It only takes one slow call to slow the page. That is the
  argument of the tail-at-scale paper, and why p99 matters for a service others call.


  A load test asks how the system copes with expected traffic. "Breaking it on purpose"
  goes past that, with stress, soak and spike tests, and faults such as a slow vendor.
