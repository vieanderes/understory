term: I/O-bound
aka:
  - IO-bound
  - I/O-bound work
short: Work whose speed is limited by waiting for networks, disks or other services rather than by calculation.
explain: |
  Calling a model, reading a file, querying a database: the processor sits idle while the
  answer travels. Most of the time is waiting.

  Waiting can overlap. Threads or async tasks let a hundred calls wait at once. The batch takes about as long as the
  slowest call. In Python, threads help here despite the GIL,
  because a thread releases the lock while it waits.

  Measure before you decide. A loop over a million numbers is slow for a different reason. More threads won't help it.
analogy: Doing laundry. The machine does the work; you can start the dishwasher while it runs.
usage: Fetching two hundred pages is I/O-bound, so a thread pool or asyncio will cut it from minutes to seconds.
twin:
  term: cpu-bound
  difference: I/O-bound work waits on something outside, so overlapping the waits speeds it up. CPU-bound work keeps the processor busy, so it only speeds up with more cores or faster code.
related:
  - cpu-bound
  - coroutine
  - gil
  - concurrency
