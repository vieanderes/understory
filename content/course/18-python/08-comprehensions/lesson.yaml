deepDive: >-
  Since Python 3.10, `zip(names, times, strict=True)` raises a `ValueError` when the lengths
  differ. Use it when the lists must line up, such as predictions and labels in an eval.


  Nested comprehensions read in the same order as nested loops: `[cell for row in grid for
  cell in row]` flattens a grid. Past two `for` clauses, a plain loop is usually clearer.
  And the name inside a comprehension stays inside it: after the line runs, `p` from
  `[p for p in prices]` is not defined outside.
