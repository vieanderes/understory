term: access token
aka: [ bearer token ]
short: A short-lived credential sent with each API call to prove the caller may make it.
explain: |
  Every call to an API has to show permission. Sending a password each time would be risky, so
  you send a pass that expires quickly instead.

  It goes in the `Authorization` header and usually lasts minutes to hours. If it leaks, the
  damage stops when it expires. Turn its `expires_in` into a deadline when it arrives. Refresh
  a minute before, rather than waiting for a `401` mid-job.
analogy: A day pass at a swimming pool. It gets you in today, and it's useless tomorrow.
example:
  language: http
  code: |
    GET /v1/contacts?limit=100 HTTP/1.1
    Authorization: Bearer eyJhbGciOiJSUzI1NiJ9...
usage: The access token expires after an hour, so the three-hour sync dies at 01:00 with a 401.
twin:
  term: refresh-token
  difference: An access token goes on every API call and expires quickly. A refresh token is used only to get a new access token, lasts much longer, and must be guarded harder.
related: [ refresh-token, oauth, oauth-scope, jwt, session ]
level: 2
lessons: [ integrations.tokens-that-expire ]
