id: pyai
number: 19
title: Python for AI engineering
summary: "The Python an AI engineer uses every day: your first model call, Pydantic at the boundary, generators and decorators, asyncio, threads and processes, pytest, FastAPI, NumPy and pandas."
why: Model services, eval pipelines and data work are written in Python, and they fail in Python-specific ways.
youCanBuild: A FastAPI service that calls a model, validates its reply with Pydantic, streams it, retries on rate limits, and is tested with a fake client.
concepts:
  - id: pyai.llm-api
    title: Models behind an API
    summary: A language model runs on a provider's servers. Your code reaches it through an API with an SDK, pays per token, and proves who pays with a secret API key kept in the environment.
  - id: pyai.pydantic-models
    title: Pydantic models
    summary: A BaseModel declares fields with type hints and validates and converts incoming data when an instance is created.
  - id: pyai.validation-errors
    title: Validation errors
    summary: Invalid data raises ValidationError listing every failing field, its location and why, instead of failing later.
  - id: pyai.pydantic-settings
    title: Settings from the environment
    summary: pydantic-settings reads configuration from environment variables and .env files into a typed, validated object.
  - id: pyai.generators
    title: Generators
    summary: A function with yield returns a generator that produces one value per step and pauses in between, so large or endless streams fit in memory.
  - id: pyai.decorators
    title: Decorators
    summary: A decorator is a function that takes a function and returns a wrapped one, applied with @ above the definition.
  - id: pyai.async-await
    title: async and await
    summary: An async def function returns a coroutine, and await pauses it until the awaited work finishes, letting the event loop run others.
  - id: pyai.gather-and-tasks
    title: gather and TaskGroup
    summary: asyncio.gather and a TaskGroup run coroutines concurrently and collect their results, and a TaskGroup cancels the rest when one fails.
  - id: pyai.semaphores
    title: Bounding concurrency
    summary: An asyncio.Semaphore caps how many calls run at once, which keeps you under a provider's rate limit.
  - id: pyai.async-timeouts
    title: Timeouts and blocking calls
    summary: asyncio.timeout cancels slow work, and a blocking call inside a coroutine stalls every other task on the loop.
  - id: pyai.gil
    title: The GIL
    summary: In the default CPython build a global interpreter lock lets only one thread run Python bytecode at a time, so threads speed up waiting but not computing.
  - id: pyai.threads-vs-processes
    title: Threads and processes
    summary: Threads share memory and suit I/O-bound work, while processes each have their own interpreter and suit CPU-bound work.
  - id: pyai.pytest-basics
    title: pytest basics
    summary: pytest finds files and functions named test_, and a plain assert statement reports both sides when it fails.
  - id: pyai.fixtures
    title: Fixtures
    summary: A fixture is a function that builds what a test needs, requested by naming it as a parameter, with setup and teardown around a yield.
  - id: pyai.parametrize
    title: Parametrize
    summary: "@pytest.mark.parametrize runs one test body over a table of inputs and expected outputs."
  - id: pyai.faking-model-calls
    title: Faking model calls
    summary: Tests replace the model client with a fake that returns recorded replies, so they are fast, free and deterministic.
  - id: pyai.fastapi-routes
    title: Typed routes
    summary: FastAPI reads path, query and body types from the function signature, validates requests with them, and generates an OpenAPI schema.
  - id: pyai.dependency-injection
    title: Dependencies
    summary: Depends declares what a route needs, such as a client or the current user, and FastAPI builds it for each request.
  - id: pyai.streaming-responses
    title: Streaming responses
    summary: A StreamingResponse or server-sent events send model tokens to the client as they arrive.
  - id: pyai.ndarrays
    title: Arrays, shape and dtype
    summary: An ndarray holds numbers of one dtype in a block of memory, with a shape that gives its size along each axis.
  - id: pyai.vectorisation
    title: Vectorisation
    summary: An operation on a whole array runs in compiled code, often a hundred times faster than a Python loop over its items.
  - id: pyai.broadcasting
    title: Broadcasting
    summary: Arrays of different shapes combine when each trailing dimension matches or is 1, and the smaller one is stretched without copying.
  - id: pyai.dataframes
    title: DataFrames
    summary: A DataFrame is a table of named columns, each a typed array, filtered with boolean masks and read from CSV, JSON or Parquet.
  - id: pyai.groupby
    title: groupby and joins
    summary: groupby splits rows by a key, aggregates each group, and merge joins two tables on shared columns.
  - id: pyai.notebooks
    title: Notebooks
    summary: A Jupyter notebook mixes code, output and notes in cells, which suits exploration and needs care to stay reproducible.
  - id: pyai.messages-api
    title: The Messages API from Python
    summary: "`client.messages.create` sends a model name, a `max_tokens` cap and the messages so far, and returns a list of content blocks, a stop reason and token counts."
  - id: pyai.streaming-tokens
    title: Streaming as a generator
    summary: A streamed reply arrives in small pieces, and a generator hands each piece on as it comes, so the first words appear before the reply is finished.
  - id: pyai.typed-output
    title: Validating a model's reply
    summary: A model's JSON reply is checked against a Pydantic model the moment it arrives, so a wrong type such as the string "false" fails loudly instead of misbehaving later.
  - id: pyai.rate-limits-and-retries
    title: Retrying with a decorator
    summary: A retry decorator wraps a call that may fail for a moment, such as a rate-limited request, and tries again after a wait that doubles each time.
