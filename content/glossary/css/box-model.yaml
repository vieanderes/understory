term: box model
aka:
  - CSS box model
short: Every element drawn as a rectangle of content, padding, border and margin, from the inside out.
explain: |
  Set a box to 300 pixels wide, add some padding and a border, and it comes out wider than
  300. That surprise is the first lesson of CSS layout.

  Each element is four layers: **content**, then **padding** (space inside the border),
  the **border**, then **margin** (space outside, pushing neighbours away). By default
  `width` sets only the content, so padding and border are added on top. Most projects
  switch to `box-sizing: border-box` everywhere, so `width` means the whole visible box.
analogy: A framed picture. The picture, the white mount around it, the frame, and the gap to the next picture on the wall.
example:
  language: css
  code: |
    *, *::before, *::after {
      box-sizing: border-box;
    }
    .card {
      width: 300px;   /* now includes padding and border */
      padding: 16px;
      border: 1px solid;
      margin-bottom: 24px;
    }
usage: The cards overflow by 34 pixels; check the box model, padding is being added on top of the width.
related:
  - flexbox
  - css-grid
level: 1
