summary: >-
  Up to now, every line of a program ran, every time. Real programs choose. A shop charges
  delivery only on small orders, a game shows "You win" only when you've won, a form shows an
  error only when a field is empty. This lesson gives you the two pieces that make choices
  possible.


  The first is the **comparison**: an expression like `age >= 18` that asks a yes-or-no
  question and works out to `true` or `false`. Those two values are called **booleans**.
  The second is `if` and `else`, which run a block of code only when a condition is true. A
  **block** is the code between a pair of curly brackets. A **condition** is the expression
  in the round brackets after `if`.


  Chains of `else if` let you pick one of several paths. The computer checks from the top
  and runs only the first branch whose condition is true. A **branch** is one of the paths
  through an `if`. Most bugs in decision code come from three places: a single `=` where
  `===` was meant, checks in the wrong order, and an edge value like exactly 18 landing on
  the wrong side.
remember:
  - A comparison asks a yes-or-no question and works out to a boolean, `true` or `false`.
  - '`===` asks whether two values are equal, while a single `=` puts a value into a variable.'
  - '`if` runs its block only when the condition is true, and `else` runs only when it is false, so exactly one of them runs.'
  - In an `else if` chain, only the first branch whose condition is true runs, so put the most specific check first.
  - Check the edge values, because `>` and `>=` differ only at the exact boundary.
  - A variable made with `let` or `const` inside a block exists only inside that block.
  - 'Any value can be a condition: `false`, `0`, `""`, `undefined`, `null` and `NaN` count as false, and the values you meet day to day otherwise count as true.'
sections:
  - title: Booleans are values too
    body: |-
      `true` and `false` aren't only something `if` reads. They're values, like numbers and
      strings, so you can store them in variables and show them.

      ```js
      const age = 20;
      const isAdult = age >= 18;
      console.log(isAdult);
      // true
      ```

      The comparison is worked out first, giving `true`, and the result is stored. Now
      `if (isAdult)` reads almost like English.

      Naming a boolean well makes decision code clearer. The convention is a name that reads
      as a yes-or-no question: `isAdult`, `hasPaid`, `canEdit`. Compare these two versions of
      the same check:

      ```js
      const basketTotal = 42;
      const qualifiesForFreeDelivery = basketTotal >= 50;
      if (qualifiesForFreeDelivery) {
        console.log("Delivery is free");
      } else {
        console.log("Delivery costs 5 pounds");
      }
      // Delivery costs 5 pounds
      ```

      The rule, "50 or more", now has a name. If the rule changes, you change one line, and
      the `if` still reads correctly. In a longer program the same boolean might be used in
      several places, and a name keeps them all in step.

      There's no need to write `if (isAdult === true)`. `isAdult` is already `true` or
      `false`, and comparing it to `true` gives back the same answer. It's a common sign of
      code written by someone new to booleans, and reviewers will often point it out.
  - title: Comparing text, and what `===` really checks
    body: |-
      `===` is called **strict equality**. It's `true` only when both sides are the same type
      and the same value. So a number never equals a string, even if they look alike.

      ```js
      console.log(10 === 10);
      console.log("10" === 10);
      console.log("apple" === "Apple");
      // true
      // false
      // false
      ```

      The second line is `false` because one side is text. The third is `false` because
      capital letters count. Two strings are equal only if every character matches, spaces
      included. `"Sam "` with a trailing space isn't `"Sam"`, a classic bug when checking a
      typed-in name.

      You can also use `<` and `>` on strings. They compare alphabetically, one character at
      a time, using each character's code. That gives two surprises.

      ```js
      console.log("apple" < "banana");
      console.log("Zebra" < "apple");
      console.log("10" < "9");
      // true
      // true
      // true
      ```

      Capital letters come before all lower-case letters, so `"Zebra"` sorts first. And
      digits in strings compare as characters, not numbers: `"1"` comes before `"9"`, so
      `"10"` counts as smaller. If you're comparing amounts, make sure they're numbers, not
      text.

      You'll also meet `==` with two signs, called **loose equality**. It converts both sides
      to the same type first, so `"5" == 5` is `true`. Those conversions follow rules few
      people remember, which is why most teams use `===` and `!==` everywhere.
  - title: Variables inside a block stay inside it
    body: |-
      A block does more than group lines. A variable made with `let` or `const` inside a
      block exists only inside that block. The part of a program where a name can be used is
      called its **scope**.

      ```js
      const age = 20;
      if (age >= 18) {
        let message = "Welcome in";
      }
      console.log(message);
      ```

      This stops on the last line with `ReferenceError: message is not defined`. The variable
      was made, used by nobody, and thrown away when the block ended.

      That explains a pattern you saw in the code challenge: make the variable *before* the
      `if`, then let each branch give it a value.

      ```js
      const age = 10;
      let price = 0;
      if (age < 12) {
        price = 5;
      } else {
        price = 9;
      }
      console.log(`Ticket: ${price} pounds`);
      // Ticket: 5 pounds
      ```

      `price` is made outside the block, so it lives on after the `if` ends. Inside the
      branches there's no `let`, only an assignment, so both branches change the same
      variable.

      This pattern has a useful side effect: it separates deciding from showing. The `if`
      only decides the price. One `console.log` afterwards shows it. If the wording of the
      message changes, there's one line to edit, not two. Code that works out a value first
      and uses it afterwards is easier to test, too, which matters once you write functions
      in lesson 6.

      Scope is a safety feature. A name made for one small job can't leak out and clash with
      a name somewhere else in the program.
  - title: Truthy and falsy values
    body: |-
      A condition doesn't have to be a comparison. You can put any value in the brackets of
      an `if`, and JavaScript decides whether it counts as true. Values that count as true are
      called **truthy**, and values that count as false are called **falsy**.

      The falsy list is short. These are the ones you'll meet in this chapter:

      - `false`
      - `0`
      - `""`, an empty string
      - `undefined`
      - `NaN`, the "not a number" result of failed maths

      Everything else is truthy, including some that look false:

      ```js
      if ("0") {
        console.log("The string \"0\" is truthy");
      }
      if (" ") {
        console.log("A single space is truthy");
      }
      // The string "0" is truthy
      // A single space is truthy
      ```

      The `\"` inside a string is a quote mark that belongs to the text, not the end of it.

      This is why the bug in the lesson, `if (stock = 5)`, didn't stop with an error. The
      single `=` put 5 into `stock`, the expression worked out to 5, and 5 is truthy. The
      branch ran, and `stock` was changed as a side effect.

      Truthiness has a real use: `if (name)` is a short way to check that a string isn't
      empty. But it hides intent. `if (stock)` is false for a stock of 0, which is exactly
      the case you probably care about. While you're learning, write the comparison you mean,
      such as `if (stock > 0)` or `if (name !== "")`. It says what you're checking, and it
      can't be fooled by a surprising value.
  - title: Designing an `else if` chain
    body: |-
      A chain of `else if` branches is a list of rules checked from the top. Three habits keep
      it correct.

      **Order from most specific to most general.** The first true branch wins. If a broad
      check like `score >= 70` comes before a narrow one like `score >= 90`, the narrow one
      can never run for scores it should catch.

      **Test the boundaries.** For every number in a condition, try the value itself and one
      each side. For "under 12 pays less", try 11, 12 and 13. `age < 12` and `age <= 12`
      differ only at 12, which is exactly the value a tester or a user will hit.

      **Decide what `else` means.** A final `else` catches everything the other branches
      didn't. That's often right, but it can hide surprises.

      ```js
      const rating = 7;
      if (rating >= 4) {
        console.log("Good");
      } else if (rating >= 1) {
        console.log("Poor");
      } else {
        console.log("Not rated");
      }
      // Good
      ```

      Ratings are meant to go from 1 to 5, but a bad value of 7 is shown as `Good` without
      complaint. When a value can be out of range, check for that first, in its own branch,
      and handle it on purpose.

      Sometimes a choice depends on two conditions at once. You can put an `if` inside
      another `if`, which is called **nesting**.

      ```js
      const age = 30;
      const hasTicket = true;
      if (age >= 18) {
        if (hasTicket) {
          console.log("Come in");
        } else {
          console.log("Buy a ticket first");
        }
      } else {
        console.log("Adults only");
      }
      // Come in
      ```

      Nesting works, but each level makes code harder to follow. The JavaScript chapter
      shows shorter ways to combine conditions. For now, keep nesting to two levels.
pitfalls:
  - '**Using `=` inside a condition.** `if (stock = 5)` assigns 5 instead of comparing, and 5 is truthy, so the branch always runs. It happens because `=` means equals on paper. Compare with `===`, `>` or `<`.'
  - '**Putting the broad check first.** In an `else if` chain, `score >= 70` above `score >= 90` catches 95 before the Gold check. Order branches from the narrowest condition to the widest.'
  - '**Getting the boundary wrong.** "At most 8" is `<= 8`, and `< 8` turns away the eighth person. Test the exact boundary value and one on each side.'
  - '**Making a variable inside the `if` and using it after.** A `let` inside the block disappears when the block ends, so the next line fails with `is not defined`. Make the variable before the `if` and assign it inside.'
  - '**Comparing numbers stored as text.** `"10" < "9"` is `true`, because strings compare character by character. Make sure amounts are numbers before you compare them.'
  - '**Writing `if (done === true)`.** A boolean is already true or false, so the extra comparison adds noise. Write `if (done)`, and name booleans so that reads well.'
interview:
  - question: What's the difference between `==` and `===` in JavaScript?
    answer: >-
      `===` compares value and type without converting anything, while `==` converts both
      sides to the same type first. So `"5" === 5` is `false`, because one side is a string
      and the other a number, but `"5" == 5` is `true`. That automatic conversion, called
      type coercion, follows rules that produce surprises, so a comparison with `==` can pass
      when it shouldn't. I use `===` and `!==` by default, and most style guides and linters,
      tools that check code for risky patterns, enforce that. If I need to compare a string
      with a number, I convert the string to a number myself, so anyone reading the code sees
      exactly what's happening. `==` has niche uses, but none a junior developer needs.
  - question: What are truthy and falsy values?
    answer: >-
      Falsy values are the ones JavaScript treats as false in a condition, and every other
      value is truthy. The falsy values you meet most are `false`, `0`, the empty string
      `""`, `undefined`, `NaN`, and `null`, a value that means "deliberately empty". So `if (name)` runs only when `name` is a
      non-empty string, which is a common shorthand. Some truthy values look false: the
      string `"0"`, a string holding a space, and the text `"false"` all count as true. The
      risk is that truthiness hides intent. `if (stock)` skips a stock of 0, which is often
      exactly the case that matters. So I use the shorthand for empty checks, and write an
      explicit comparison like `stock > 0` when zero is a meaningful value.
  - question: How would you test code that uses `if` and `else`?
    answer: >-
      I test every branch and every boundary, because that's where decision code breaks.
      First, I list the paths: each `if`, each `else if` and the final `else` needs at least
      one input that reaches it. Then I look at every number in a condition and test the
      value itself and one on each side. For a rule like "children under 12 pay 5 pounds", I
      check 11, 12 and 13, since `< 12` and `<= 12` only differ at 12. I also try values
      outside the expected range, like a negative age, to see which branch catches them. The
      trade-off is effort: long chains need many tests, which is often a sign the rule should
      be split into smaller pieces.
