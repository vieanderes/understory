term: truthy
aka:
  - truthiness
short: A value that passes a condition, which is any value outside a short list like 0 and "".
explain: |
  An `if` doesn't need `true` or `false`. It takes any value and decides. Most values pass:
  any non-empty string, any number but 0, every object and array, even an empty one.

  The trap is the edge cases. `'0'` and `'false'` pass, because they are non-empty strings.
  `[]` passes too, so `if (items)` can't tell you a list is empty. Check `items.length`.
analogy: A guest list that says "everyone welcome except these few names". If you're not on the short list, you're in.
example:
  language: js
  code: |
    if ('0') console.log('runs'); // non-empty string
    if ([]) console.log('runs'); // an empty array is still an object
    if (0) console.log('never runs');
usage: An empty array is truthy, so that check never shows the "no results" message.
twin:
  term: falsy
  difference: Truthy values count as true in a condition, and that's nearly everything. Falsy values are the short list that count as false; learn that list and you know both.
related:
  - falsy
  - type-coercion
  - boolean
level: 1
