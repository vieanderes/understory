term: thinking aloud
aka: [think aloud, thinking out loud, narrating your approach]
short: Saying your reasoning out loud as you solve a problem, so someone else can follow it.
explain: |
  An interviewer can only score what they hear. Silent typing gives them nothing, even if
  the code ends up right. Saying "the brute force is quadratic; a map gets it to linear"
  shows the judgement they're there to find.

  It also lets them help. A hint lands better when they know where you are. Narrate the
  plan before you type, and the checks as you trace.
analogy: A driving instructor's "commentary drive", where the learner says what they see and what they'll do.
usage: Keep thinking aloud during the coding round; the interviewer can't credit a plan they never heard.
related: [online-assessment, brute-force, behavioural-interview]
level: 2
lessons: [algo.mock-round]
