summary: >-
  A **loop** runs the same block of code again and again. Each run is called a **round**, or
  an iteration. Loops are how a program handles ten items or a million with the same few
  lines: sending a reminder to every member, adding up every price in a basket, retrying a
  download until it works.


  JavaScript's two basic loops cover two situations. A `while` loop keeps going as long as a
  condition stays true, which suits work where you don't know the number of rounds in
  advance. A `for` loop packs a counter into one line, with where it starts, when it keeps
  going and how it changes, which suits work that runs a known number of times. Anything one
  can do, the other can too. The choice is about which reads more clearly.


  Two mistakes cause most loop bugs. A loop whose condition never becomes false runs
  forever, an **infinite loop**. And a loop that runs one round too many or too few, an
  **off-by-one error**, usually comes from mixing up `<` and `<=`, or starting at 0 instead
  of 1.
remember:
  - A `while` loop checks its condition before every round and stops the first time the condition is false.
  - 'A `for` loop has three parts: where the counter starts, the condition to keep going, and the update after each round.'
  - Something inside a loop must move the condition towards false, or the loop runs forever.
  - '`for (let i = 0; i < n; i++)` runs exactly `n` times, with `i` going from 0 to `n - 1`.'
  - Use `for` when you know how many rounds you need, and `while` when you stop on a condition.
  - To build a result in a loop, make a variable before the loop and update it inside each round.
  - A counter made with `let` in the `for` brackets exists only inside that loop.
sections:
  - title: What a `for` loop does, step by step
    body: |-
      The three parts of a `for` loop don't run in the order they're written. Here's the real
      sequence for `for (let i = 1; i <= 3; i++)`:

      1. Run the start, `let i = 1`, once.
      2. Check the condition, `i <= 3`. If it's false, the loop is over.
      3. Run the block.
      4. Run the update, `i++`, then go back to step 2.

      So the condition is checked before every round, including the first. If it's false from
      the start, the block never runs at all. And the update happens *after* the block, which
      is why the first round sees `i` as 1, not 2.

      A `for` loop is a `while` loop with its counter tidied into one line. These two print
      the same thing:

      ```js
      for (let i = 1; i <= 3; i++) {
        console.log(`Round ${i}`);
      }

      let j = 1;
      while (j <= 3) {
        console.log(`Round ${j}`);
        j = j + 1;
      }
      // Round 1
      // Round 2
      // Round 3
      // Round 1
      // Round 2
      // Round 3
      ```

      The `for` version keeps the start, the stop and the step together, where a reader looks
      for them. In the `while` version, the update sits at the bottom of the block, where it's
      often forgotten.

      The update doesn't have to be `i++`. Any assignment works, so you can count in twos or
      count down.

      ```js
      for (let i = 10; i > 0; i = i - 3) {
        console.log(i);
      }
      // 10
      // 7
      // 4
      // 1
      ```

      Counting down, the condition flips to `>` and the update subtracts. Get either one wrong
      and the loop never starts, or never stops.
  - title: Off-by-one errors, and how to avoid them
    body: |-
      An off-by-one error is a loop that runs one round too many or too few. It's one of
      the most common bugs in all of programming. The causes are
      almost always the start value and the choice between `<` and `<=`.

      Two shapes cover nearly every counting loop. Learn to recognise them:

      ```js
      for (let i = 0; i < 3; i++) {
        console.log(`Start at 0, stop before 3: ${i}`);
      }
      for (let i = 1; i <= 3; i++) {
        console.log(`Start at 1, up to 3: ${i}`);
      }
      // Start at 0, stop before 3: 0
      // Start at 0, stop before 3: 1
      // Start at 0, stop before 3: 2
      // Start at 1, up to 3: 1
      // Start at 1, up to 3: 2
      // Start at 1, up to 3: 3
      ```

      Both run three rounds. The first, starting at 0 with `<`, is the one you'll see most in
      real code. The reason arrives in lesson 7: positions in a list are counted from 0, so a
      counter that starts at 0 matches them. The second reads more naturally when the numbers
      themselves are shown to a person.

      Mixing the two shapes is where the bug comes from. Starting at 0 with `<=` runs one
      round extra. Starting at 1 with `<` runs one round short.

      The quickest check needs no arithmetic in your head: ask what happens on the *first*
      round and the *last* round. Where does `i` start? What's the last value that still
      passes the condition? If both are right, everything in between is right too. Better
      still, run it and look. A `console.log` inside the loop shows every value the counter
      takes.
  - title: Building up a result with a loop
    body: |-
      Most real loops don't only print. They build something: a total, a count, a piece of
      text. The pattern is always the same. Make a variable before the loop with a starting
      value, update it inside the loop, and use it after the loop ends. A variable used this
      way is often called an **accumulator**, because it gathers a result round by round.

      ```js
      let total = 0;
      for (let day = 1; day <= 7; day++) {
        total = total + 5;
      }
      console.log(`Saved this week: ${total} pounds`);
      // Saved this week: 35 pounds
      ```

      The variable has to live outside the loop. Made inside the block, it would start again
      at 0 every round and vanish when the loop ends.

      Put an `if` inside the loop and you can count or collect only some rounds.

      ```js
      let evens = 0;
      for (let n = 1; n <= 10; n++) {
        if (n % 2 === 0) {
          evens = evens + 1;
        }
      }
      console.log(`Even numbers from 1 to 10: ${evens}`);
      // Even numbers from 1 to 10: 5
      ```

      A loop can also sit inside another loop. The inner loop runs all its rounds for each
      round of the outer one.

      ```js
      for (let row = 1; row <= 3; row++) {
        let line = "";
        for (let seat = 1; seat <= 4; seat++) {
          line = line + "[ ]";
        }
        console.log(`Row ${row}: ${line}`);
      }
      // Row 1: [ ][ ][ ][ ]
      // Row 2: [ ][ ][ ][ ]
      // Row 3: [ ][ ][ ][ ]
      ```

      Notice where `line` is made: inside the outer loop, so each row starts empty. Move it
      above both loops and every row would carry on from the last one. Where you put the
      starting value decides when it resets.
  - title: When to reach for `while`, and how infinite loops happen
    body: |-
      Use `while` when the stopping point depends on something other than a simple count. A
      savings goal is a good example: you don't know how many weeks it takes, only when to
      stop.

      ```js
      let savings = 100;
      let weeks = 0;
      while (savings < 200) {
        savings = savings + 30;
        weeks = weeks + 1;
      }
      console.log(`${weeks} weeks, ${savings} pounds saved`);
      // 4 weeks, 220 pounds saved
      ```

      Real programs use this shape to retry a failed download until it works, to read input
      until the user types "quit", or to keep a game running until someone wins.

      An infinite loop happens when nothing moves the condition towards false. There are
      three usual causes:

      - The update is missing, as in the lesson's countdown that never changed `countdown`.
      - The update goes the wrong way: `i = i - 1` in a loop that waits for `i` to grow.
      - The update is inside an `if` that stops being true, so it stops running.

      Before running a `while` loop, ask one question: which line changes the thing the
      condition checks, and does every round reach it?

      If a program does get stuck, it isn't broken for good. In a terminal, pressing Ctrl and
      C together stops a running Node program. A browser tab may freeze and offer to stop the
      page. This app stops any run that takes too long. A `console.log` inside the loop shows
      whether the condition's variable is changing at all, which is usually the answer.
pitfalls:
  - '**Forgetting to change the loop''s variable.** A `while` loop with no update checks the same true condition forever. Before running it, point to the line that moves the condition towards false.'
  - '**Mixing `<` and `<=` with the start value.** Starting at 0 with `<= 3` runs four rounds, not three. Pick one shape, 0 with `<` or 1 with `<=`, and check the first and last rounds.'
  - '**Making the accumulator inside the loop.** `let total = 0;` inside the block resets the total every round and hides it from the code after the loop. Make it before the loop.'
  - '**Using the counter after the loop.** A counter made with `let` in the `for` brackets disappears when the loop ends, so `console.log(i)` afterwards fails with `i is not defined`. If you need the value later, store it in a variable made before the loop.'
  - '**Flipping the condition when counting down.** `for (let i = 10; i < 0; i = i - 1)` never runs, because 10 isn''t below 0. Counting down needs `>` or `>=`.'
interview:
  - question: When would you use a `while` loop instead of a `for` loop?
    answer: >-
      I use `while` when the loop should stop on a condition rather than after a known
      number of rounds. Retrying a request until it succeeds, reading input until the user
      types "quit" or waiting until a total passes a target are all `while` jobs, because the
      number of rounds isn't known in advance. When I do know it, like once per day in a
      week, a `for` loop is clearer: the start, the condition and the update sit in one line,
      so the update can't be forgotten at the bottom of the block. Either loop can do the
      other's job, so the choice is about readability. The risk with `while` is the infinite
      loop, so I always check which line moves the condition towards false.
  - question: What is an off-by-one error, and how do you avoid one?
    answer: >-
      An off-by-one error is a loop, or any range, that covers one item too many or too few.
      In loops it usually comes from a mismatch between the start value and the condition,
      like starting at 0 but using `<= n`, which runs `n + 1` rounds. I avoid it by sticking
      to two standard shapes: start at 0 with `< n`, which matches how list positions are
      counted, or start at 1 with `<= n` when the numbers are shown to people. Then I check
      the edges: what the first round sees, and the last value that still passes the
      condition. I also test with small inputs, like zero items and one item, where these
      bugs show up at once.
  - question: What causes an infinite loop, and how would you find one?
    answer: >-
      An infinite loop happens when the loop's condition never becomes false, usually
      because nothing inside the loop changes the variable the condition checks, or it
      changes in the wrong direction. The first symptom is a program that never finishes, or
      a browser tab that freezes. To find it, I stop the program, with Ctrl and C in a
      terminal, then put a `console.log` inside the loop showing the variable in the
      condition. If it never changes, the update is missing or never reached. If it moves the
      wrong way, the update or the comparison is backwards. As a safeguard in risky loops,
      like retries, I add a maximum number of attempts, so even a bug can't make it run
      forever.
