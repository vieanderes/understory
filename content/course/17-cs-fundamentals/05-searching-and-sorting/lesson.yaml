id: cs.searching-and-sorting
title: Searching and sorting
objective: Keep the binary search invariant, and rely on sort stability.
level: essential
minutes: 10
concepts: [cs.binary-search, cs.comparison-sorts, cs.sort-stability]
prerequisites: [js.arrays, cs.complexity]
opening:
  text: >-
    You'll find one item among 100,000 in 17 looks, and know the one rule that keeps the
    trick honest. Then you'll fix a leaderboard whose ties come out in the wrong order.

steps:
  - type: prose
    id: name-binary-search
    body: >-
      To find 27 in a sorted list, don't start at the front. Look at the middle.


      ```js
      [3, 8, 12, 15, 21, 27, 30]   // middle is 15: too small
      ```


      15 is too small, so 27 can only be to the right. The whole left half is ruled out in
      one look. Repeat on what's left. That's **binary search**. Each look halves the range,
      which is O(log n): 100,000 items take about 17 looks.

  - type: prose
    id: name-invariant
    body: >-
      In code, two indexes mark the range still in play: `lo` and `hi`. The search rests on
      one promise, the **invariant**: if the target is in the list, it's between `lo` and
      `hi`. Only a sorted list keeps that promise.


      Each pass must shrink the range, or the loop never ends. One more thing: when an `if`
      has a single line, you can drop the braces, as in `if (found) return mid;`.

  - type: parsons
    id: arrange-binary-search
    concept: cs.binary-search
    difficulty: 3
    language: js
    prompt: >-
      Put the binary search in order. It returns the index of `target`, or -1.
    blocks:
      - id: open-function
        code: function findScore(scores, target) {
      - id: start-lo
        code: let lo = 0;
        indent: 1
        subgoal: The range starts as the whole list
      - id: start-hi
        code: let hi = scores.length - 1;
        indent: 1
      - id: loop-open
        code: while (lo <= hi) {
        indent: 1
        subgoal: Look while the range isn't empty
      - id: take-mid
        code: const mid = Math.floor((lo + hi) / 2);
        indent: 2
      - id: found
        code: if (scores[mid] === target) return mid;
        indent: 2
      - id: go-right
        code: if (scores[mid] < target) lo = mid + 1;
        indent: 2
        subgoal: Rule out the half that can't hold it
      - id: go-left
        code: else hi = mid - 1;
        indent: 2
      - id: loop-close
        code: '}'
        indent: 1
      - id: not-found
        code: return -1;
        indent: 1
      - id: close-function
        code: '}'
    distractors:
      - id: loop-too-short
        code: while (lo < hi) {
        feedback: >-
          When `lo` and `hi` meet, one item is still in play. This stops before checking it.

  - type: prose
    id: name-sorts-and-stability
    body: >-
      You met `sort` with a **comparator**: the function that gets two items and says which
      comes first. A sort that keeps equal items in their original order is **stable**.
      JavaScript's is, by rule.


      So you don't need a clever two-part comparator. Sort by name, then sort that by score.
      Players on the same score keep the name order from the first sort.

  - type: playground
    id: fix-leaderboard-ties
    concept: cs.sort-stability
    difficulty: 2
    prompt: >-
      Bug report: Ben and Caz tie on 70, but Caz shows first. Ties should be in name order.
      Sort by name first, then sort that result by score.
    html: |
      <h1>Leaderboard</h1>
      <p id="board"></p>
    js: |
      const players = [
        { name: "Dev", score: 50 },
        { name: "Caz", score: 70 },
        { name: "Ben", score: 70 },
        { name: "Ana", score: 50 },
      ];
      const byScore = players.toSorted((a, b) => b.score - a.score);
      const names = byScore.map((player) => player.name);
      document.querySelector("#board").textContent = names.join(", ");
    editable: [js]
    checks:
      - label: Ties are in name order
        selector: '#board'
        text: Ben, Caz, Ana, Dev
    solution:
      js: |
        const players = [
          { name: "Dev", score: 50 },
          { name: "Caz", score: 70 },
          { name: "Ben", score: 70 },
          { name: "Ana", score: 50 },
        ];
        const byName = players.toSorted((a, b) => a.name.localeCompare(b.name));
        const byScore = byName.toSorted((a, b) => b.score - a.score);
        const names = byScore.map((player) => player.name);
        document.querySelector("#board").textContent = names.join(", ");
    hints:
      - The score sort keeps ties in the order it was given. Give it the players in name order.
      - '`localeCompare` compares two names as text.'
      - 'Add `const byName = players.toSorted((a, b) => a.name.localeCompare(b.name));` and sort `byName` by score.'

  - type: multiple-choice
    id: pick-sort-once
    concept: cs.comparison-sorts
    difficulty: 3
    question: You must look up 1,000 ids in an unsorted list of 100,000. Which plan does the least work?
    choices:
      - text: Scan the list for each id
        feedback: >-
          Up to 100,000 looks per id, so around a hundred million in all. It's the plan that
          needs no thought, and it's the dearest.
      - text: Sort once, then binary search each id
        correct: true
        feedback: >-
          Right. About 1.5 million comparisons to sort, then 17 looks per id.
      - text: Sort the list again before each search
        feedback: >-
          One sort is enough, since the list doesn't change. Sorting 1,000 times costs more
          than scanning.

  - type: ai-review
    id: review-search-never-ends
    concept: cs.binary-search
    difficulty: 4
    language: js
    request: Write a binary search that returns the index of a score, or -1.
    flawClass: logic
    code: |
      function findScore(scores, target) {
        let lo = 0;
        let hi = scores.length - 1;
        while (lo <= hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (scores[mid] === target) return mid;
          if (scores[mid] < target) lo = mid;
          else hi = mid - 1;
        }
        return -1;
      }
    prompt: >-
      An assistant wrote this. The tests looked up 15 and 3 in `[3, 8, 12, 15, 21, 27, 30]`, and
      both were found. Looking up 12 froze the page. Tap the line at fault.
    lines: [7]
    reasons:
      - text: '`lo <= hi` should be `lo < hi`'
        feedback: >-
          We tried that. It stops too soon, and misses 3, 12, 21 and 30. The loop condition
          is right.
      - text: '`lo = mid` keeps an index it has already ruled out'
        correct: true
        feedback: >-
          Yes. With `lo` 1 and `hi` 2, `mid` is 1 for ever. Use `mid + 1`.
      - text: '`Math.floor` should be `Math.round`'
        feedback: >-
          Rounding up only moves the stuck spot. The range has to shrink on every pass, and
          here it sometimes doesn't.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Look up every item, and one missing value
          correct: true
          feedback: >-
            Right. Every position gets tried, including the ones that stick.
        - text: Look up only the middle item
          feedback: >-
            The middle is found on the first pass, before `lo` ever moves.
        - text: Search an empty list
          feedback: >-
            The loop never starts, so it returns -1 at once. The bug needs a range to shrink.
    fix: |
      if (scores[mid] < target) lo = mid + 1;   // mid is ruled out, so step past it
      else hi = mid - 1;

  - type: code-challenge
    id: write-first-at-least
    concept: cs.binary-search
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `firstAtLeast(sorted, value)`. The list is sorted, smallest first. Return the index
      of the first item that is `value` or more. If there's none, return the list's length.


      It's where you'd insert `value` to keep the list sorted. Use binary search, so a long
      list costs a handful of looks.


      So in `[3, 8, 12, 15]`, the value `13` gives `3`, and `8` gives `1`.
    hints:
      - Let `hi` start at `sorted.length`, not the last index, since "past the end" is a valid answer.
      - 'Keep this true: items before `lo` are too small, and items from `hi` on are big enough.'
      - When `sorted[mid]` is too small, move `lo` past it. Otherwise pull `hi` down to `mid`.

  - type: explain-back
    id: explain-unsorted-search
    concept: cs.binary-search
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Someone runs binary search on a list that isn't sorted. It raises no error, and
      sometimes says a value is missing when it's there. Why?
    rubric:
      - Each step throws away half the range because a sorted list guarantees the target can't be there.
      - In an unsorted list that guarantee is false, so the discarded half may hold the target.
      - Nothing checks the order, so the search ends normally with a wrong answer and no error.
    modelAnswer: >-
      Binary search never looks at most of the list. It looks at the middle and rules out a
      whole half. It trusts that everything there is too small or too big. That trust is the
      invariant, and only a sorted list earns it. Unsorted, the target may sit in the half
      that was thrown away. The loop still ends, since the range still shrinks. So you get a
      calm -1 for a value that's present. The cure is to sort first, or to scan.

recap:
  - Search a sorted list by halving, and keep the target between `lo` and `hi`.
  - Expect a comparison sort to cost O(n log n), and sort once before many lookups.
  - Rely on stable sorting, so ties keep the order of an earlier sort.

recall:
  - id: card-binary-search-invariant
    concept: cs.binary-search
    front: What is the invariant of binary search, and what does it need?
    back: >-
      If the target is present, it lies between `lo` and `hi`. That only holds when the list
      is sorted.
  - id: card-binary-search-cost
    concept: cs.binary-search
    front: About how many looks does binary search need for 100,000 sorted items?
    back: >-
      At most 17. Each look halves the range, so the cost is O(log n).
  - id: card-comparison-sort-bound
    concept: cs.comparison-sorts
    front: What does `sort` cost, and when is sorting first worth it?
    back: >-
      O(n log n). It pays off when you'll search the same list many times: sort once, then
      binary search each lookup.
  - id: card-stability
    concept: cs.sort-stability
    front: What does a stable sort promise?
    back: >-
      Items with equal keys keep their original order. So sorting by name, then by score,
      leaves ties in name order.

references:
  - kind: spec
    title: 'ECMAScript Language Specification: Array.prototype.sort'
    authors: Ecma TC39
    venue: Ecma International, ECMA-262
    url: https://tc39.es/ecma262/multipage/indexed-collections.html#sec-array.prototype.sort
    note: Says the sort must be stable, and what a consistent comparator is.
    primary: true
    verified: true
  - kind: essay
    title: Getting things sorted in V8
    authors: Simon Zünd
    year: 2018
    venue: V8 blog
    url: https://v8.dev/blog/array-sort
    note: How V8 moved to TimSort, a stable merge sort, and how it counts comparator calls.
    verified: true
  - kind: essay
    title: 'Extra, Extra - Read All About It: Nearly All Binary Searches and Mergesorts are Broken'
    authors: Joshua Bloch
    year: 2006
    venue: Google Research blog
    url: https://research.google/blog/extra-extra-read-all-about-it-nearly-all-binary-searches-and-mergesorts-are-broken/
    note: A midpoint bug that sat in a standard library's binary search for nine years.
    verified: true

deepDive: >-
  Everything was run on Node 24. Over a sorted list of 100,000 numbers, no lookup needed more
  than 17 looks. 2 to the power 17 is 131,072, the first power of two above 100,000. The
  sort made 8,618 comparator calls for 1,000 random numbers, 119,915 for 10,000 and 1,529,114
  for 100,000.


  `sort` is a comparison sort: all it learns comes from your comparator, two items at a time.
  No such sort can beat O(n log n) comparisons in the worst case. Good ones, like merge sort,
  reach it. Why can't they do better? n items can be arranged in n factorial orders. Each
  comparison has two outcomes, so it can halve the possibilities at best. Telling that many orders
  apart takes about n log n yes-or-no answers. Sorts that beat it, like counting sort, don't
  compare. They use the values as array positions, which only works for small whole numbers.


  Stability has been required since ECMAScript 2019. Before that, some engines used an
  unstable quicksort for longer arrays, and tied items could swap. V8 now uses TimSort, a
  merge sort that's quick on data that's already partly in order.


  The famous binary search bug is in the midpoint. In languages with fixed-size integers,
  `lo + hi` can overflow on a huge array. JavaScript numbers don't overflow that way at any
  array size you can build. The lesson stands, though: a ten-line classic can hide a bug for
  years.
