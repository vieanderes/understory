id: next.loading-data
title: Loading data on the server
objective: Load data in an async Server Component, keep secrets on the server, and stream a slow part in.
level: essential
minutes: 10
concepts: [next.server-data, next.environment-variables, next.streaming]
prerequisites: [next.server-and-client-components, react.fetching-data]
opening:
  text: >-
    You'll load a forecast before the page leaves the server, so it arrives already filled in.
    And your API key will stay where no visitor can read it.

steps:
  - type: prose
    id: await-in-a-component
    body: >-
      In React, a component loaded data in an effect. The page arrived empty, showed "Loading",
      then asked the server again.


      A Server Component can skip all that. It can be `async` and `await` its data, like any
      async function:


      ```tsx

      export default async function WeatherPage() {
        const response = await fetch('https://api.weather.example/today');
        const data = await response.json();
        return <p>It's {data.temperature}°C</p>;
      }

      ```


      The server waits for the answer, then renders. The HTML arrives with the temperature in it.

  - type: parsons
    id: arrange-menu-page
    concept: next.server-data
    difficulty: 1
    language: tsx
    prompt: >-
      A canteen page should arrive with today's dish already in its HTML. Put the lines in
      order.
    blocks:
      - id: signature
        code: export default async function MenuPage() {
      - id: fetch
        code: const response = await fetch('https://api.canteen.example/today');
        indent: 1
      - id: json
        code: const menu = await response.json();
        indent: 1
      - id: render
        code: 'return <h1>Today: {menu.dish}</h1>;'
        indent: 1
      - id: close
        code: '}'
    distractors:
      - id: not-async
        code: export default function MenuPage() {
        feedback: >-
          `await` only works inside an `async` function. A Server Component can be one.
      - id: state
        code: const [menu, setMenu] = useState(null);
        feedback: >-
          That's the effect pattern from React. Here the component waits for the data itself.

  - type: prose
    id: secrets-stay-on-server
    body: >-
      Weather services want an **API key**, a secret you met in the tooling chapter. Keep it in
      `.env.local`, which Next.js reads and Git ignores.


      Server code can read any variable in `process.env`, and that code never reaches the
      browser. A Client Component is different. Only names that start with `NEXT_PUBLIC_` are
      copied into its bundle. Any other name is `undefined` in the browser.

  - type: multiple-choice
    id: pick-key-visible
    concept: next.environment-variables
    difficulty: 2
    language: text
    code: |
      $ cat .env.local
      WEATHER_KEY=sk_live_123
      NEXT_PUBLIC_WEATHER_KEY=sk_live_456

      $ # the browser console, after a Client Component logs both
      key: undefined public: sk_live_456
    question: Who can read `sk_live_456`?
    choices:
      - text: Anyone who visits the site
        correct: true
        feedback: >-
          Right. The prefix copied it into the bundle, a file every visitor downloads.
      - text: Only you, since `.env.local` stays on your laptop
        feedback: >-
          The file stays, but the build copied the value into the browser's JavaScript.
      - text: Only people who open the dev tools
        feedback: >-
          The dev tools only make it quicker. The value sits in a file anyone can download.

  - type: ai-review
    id: review-public-key
    concept: next.environment-variables
    difficulty: 3
    language: tsx
    request: The weather widget says the key is undefined. Fix it.
    flawClass: security
    code: |
      // app/weather/forecast.tsx
      'use client';

      import { useEffect, useState } from 'react';

      export function Forecast({ city }: { city: string }) {
        const [text, setText] = useState('Loading');
        useEffect(() => {
          const key = process.env.NEXT_PUBLIC_WEATHER_KEY;
          fetch(`https://api.weather.example/today?city=${city}&key=${key}`)
            .then((response) => response.json())
            .then((data) => setText(`${data.temperature}°C`));
        }, [city]);
        return <p>{text}</p>;
      }
    prompt: >-
      An assistant renamed the variable to `NEXT_PUBLIC_WEATHER_KEY`, and now the widget works.
      Tap the line at fault.
    lines: [9]
    reasons:
      - text: The paid key now ships to every visitor
        correct: true
        feedback: >-
          Yes. The prefix made it public. Fetch on the server with the old name.
      - text: The key belongs in the URL's path, not the query
        feedback: >-
          Moving it around the URL changes nothing. Any request sent from the browser shows it.
      - text: '`process.env` doesn''t work in an effect'
        feedback: >-
          It does, for `NEXT_PUBLIC_` names. That's exactly why the key is now exposed.
    verify:
      question: After the fix, which check shows the key no longer reaches visitors?
      choices:
        - text: Search the bundle visitors download for the key
          correct: true
          feedback: >-
            Right. The bundle is what every visitor gets, so the key mustn't be in it.
        - text: Check the widget still shows a temperature
          feedback: >-
            It showed one while the key leaked too. Working output says nothing about who can
            read the key.
        - text: Check `.env.local` is listed in `.gitignore`
          feedback: >-
            That keeps the file out of Git. The leak was the build copying the value into the
            bundle.
    fix: |
      // app/weather/forecast.tsx, now a Server Component
      export async function Forecast({ city }: { city: string }) {
        const key = process.env.WEATHER_KEY;
        const response = await fetch(`https://api.weather.example/today?city=${city}&key=${key}`);
        const data = await response.json();
        return <p>{data.temperature}°C</p>;
      }

  - type: code-challenge
    id: build-forecast-page
    concept: next.server-data
    difficulty: 3
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Write `app/forecast/[city]/page.tsx`. Await `params` for the `city`, then fetch
      `https://api.weather.example/forecast?city=` followed by the city.


      If the response isn't `ok`, show a paragraph: `No forecast for Leeds`, with the real city.
      Otherwise the body is `{ days: [{ day: 'Mon', high: 14 }, ...] }`. Show the city in an
      `h1`, and one list item per day, such as `Mon: 14°C`.
    hints:
      - The page is an `async` function, so it can `await` both `params` and `fetch`.
      - Check `response.ok` before you read the JSON, as in the JavaScript chapter.
      - "Start with `const { city } = await params;`, then build the URL with it."

  - type: prose
    id: streaming
    body: >-
      Now a catch. The page waits for every `await`. If reviews take three seconds, the whole
      page takes three.


      Wrap the slow part in React's `<Suspense>`, with a `fallback` to show meanwhile. The server
      sends the page straight away with the fallback. The reviews follow later in the same
      response. That's **streaming**. A `loading.tsx` file does the same for a whole page.

  - type: predict-output
    id: predict-first-chunk
    concept: next.streaming
    difficulty: 2
    language: tsx
    code: |
      import { Suspense } from 'react';

      async function Reviews() {
        const reviews = await getReviews(); // takes 3 seconds
        return <p>{reviews.length} reviews</p>;
      }

      export default function CampsitePage() {
        return (
          <main>
            <h1>Lakeside campsite</h1>
            <Suspense fallback={<p>Loading reviews</p>}><Reviews /></Suspense>
          </main>
        );
      }
    question: What does the visitor see in the first moment?
    choices:
      - text: The heading and `Loading reviews`
        correct: true
        feedback: >-
          Right. Both are ready at once. The review count streams in when it's done.
      - text: A blank page for three seconds
        feedback: >-
          That's what happens without `<Suspense>`. The boundary lets the rest go first.
      - text: The heading only
        feedback: >-
          The fallback is ordinary HTML, sent with the heading. It's swapped out later.

  - type: fill-blank
    id: fill-suspense
    concept: next.streaming
    difficulty: 2
    language: tsx
    prompt: >-
      The price list is quick, but opening hours come from a slow service. Show the prices at
      once, and stream the hours in.
    template: |
      import { {{1}} } from 'react';

      export default function GaragePage() {
        return (
          <main>
            <PriceList />
            <{{1}} {{2}}={<p>Checking opening hours</p>}>
              <{{3}} />
            </{{1}}>
          </main>
        );
      }
    blanks:
      - key: '1'
        answer: Suspense
      - key: '2'
        answer: fallback
      - key: '3'
        answer: OpeningHours
    bank: [Suspense, useEffect, fallback, loading, OpeningHours, PriceList]

  - type: explain-back
    id: explain-server-fetch
    concept: next.server-data
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why load a forecast in a Server Component instead of an effect in a Client Component?
      Give two reasons.
    rubric:
      - The data is already in the first HTML, so there's no empty "Loading" page and no second trip.
      - The API key stays on the server, because server code never reaches the browser.
      - A slow part can still show a fallback first, with `<Suspense>` or `loading.tsx`.
    modelAnswer: >-
      A Server Component awaits the data before rendering, so the HTML arrives filled in. With
      an effect, the page arrives empty and asks again after the JavaScript runs. The fetch also
      runs on the server, so the API key never reaches a visitor. If the data is slow,
      `<Suspense>` sends the rest of the page first.

recap:
  - Load data by making a Server Component `async` and awaiting it.
  - Keep secrets in unprefixed variables, used only in server code.
  - Stream a slow part in behind a `<Suspense>` fallback.

recall:
  - id: card-async-component
    concept: next.server-data
    front: How does a Server Component load data before it renders?
    back: >-
      It's an `async` function that awaits the data, such as `await fetch(...)`. The HTML then
      arrives with the data in it.
  - id: card-public-prefix
    concept: next.environment-variables
    front: What happens to an environment variable named `NEXT_PUBLIC_something`?
    back: >-
      Its value is copied into the browser's JavaScript, so every visitor can read it. Never
      give a secret that prefix.
  - id: card-unprefixed-in-browser
    concept: next.environment-variables
    front: What does a Client Component get for `process.env.WEATHER_KEY` in the browser?
    back: >-
      `undefined`. Only `NEXT_PUBLIC_` names reach the browser. Read the key in server code
      instead.
  - id: card-streaming-unit
    concept: next.streaming
    front: What does wrapping a slow component in `<Suspense>` change?
    back: >-
      The page is sent at once with the fallback in its place. The component's HTML follows in
      the same response when its data is ready.

