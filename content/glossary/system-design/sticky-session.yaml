term: sticky session
aka: [session affinity, sticky sessions]
short: A load balancer setting that keeps sending one user's requests to the same server copy.
explain: |
  With several copies of an app behind a load balancer, each request can land anywhere. One copy may keep a user's basket in memory. The next request can hit a copy that has
  never heard of it.

  Pinning the user to one copy hides that problem until the copy restarts or a release
  removes it. Then everyone pinned to it loses their state. It also spreads load
  unevenly. The lasting fix is keeping session state in a shared store, so any copy can serve
  any user.
analogy: Always queueing for the same cashier because she remembers your order. Fine until her shift ends.
usage: Sticky sessions only hide the problem; move the basket out of memory before we scale to four instances.
related: [load-balancer, session, stateless, horizontal-scaling]
level: 2
lessons: [cloud.reverse-proxies]
