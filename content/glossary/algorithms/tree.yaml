term: tree
aka: [tree data structure, binary tree, leaf node, root node]
short: Data arranged as one top node branching into children, and theirs, with no loops back.
explain: |
  Folders inside folders, comments with replies, a page's HTML. Each item has one parent
  and any number of children. The top one is the root; ones with no children are leaves.

  There's exactly one path from the root to any node, so you can't go round in circles.
  That makes recursion a natural fit: handle this node, then recurse into each child.

  A binary one gives each node at most two children. Its height decides most costs. A balanced shape of log n levels is fast; a long thin
  chain is slow.
analogy: A company's org chart. One boss at the top, each person reporting to one manager.
example:
  language: ts
  code: |
    type Node = { name: string; children: Node[] };

    function countNodes(node: Node): number {
      let count = 1;
      for (const child of node.children) count += countNodes(child);
      return count;
    }
usage: The comments form a tree, so render them with a recursive component that indents each level.
twin:
  term: graph
  difference: A tree has one root and exactly one path to each node. A graph allows any links, including cycles and several paths, so you need a visited set.
related: [binary-search-tree, graph, recursion, depth-first-search, trie]
level: 1
lessons: [cs.trees]
