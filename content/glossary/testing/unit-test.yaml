term: unit test
aka: [unit testing]
short: A small, fast test that checks one function or module on its own, with no network or database.
explain: |
  You write a function that works out the price of a basket. A test calls it with three
  items and a discount code, and checks the answer is £27.50. It runs in a millisecond, so
  you can run hundreds of them on every save.

  "Unit" means a unit of behaviour, not always one function. Test through the public
  surface, not the private helpers, so a refactor doesn't break the tests. They're cheap
  and precise, but they can't tell you the pieces fit together: a passing suite and a
  broken app can sit side by side.
analogy: Testing each Christmas tree bulb on its own before you string them together.
example:
  language: ts
  code: |
    import { expect, test } from 'vitest';
    import { basketTotal } from './basket';

    test('applies a 10% code to the whole basket', () => {
      const items = [{ price: 1000 }, { price: 2000 }];
      expect(basketTotal(items, 'SAVE10')).toBe(2700);
    });
usage: The rounding rule needs a unit test; it's pure maths and we've broken it twice.
twin:
  term: integration-test
  difference: A unit test checks one piece alone, with the outside world replaced. An integration test checks real pieces working together, such as your code and a real database.
related: [integration-test, assertion, tdd, test-pyramid]
level: 1
lessons: [testing.unit-tests]
