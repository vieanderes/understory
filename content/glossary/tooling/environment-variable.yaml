term: environment variable
aka:
  - env var
  - .env
short: A named setting a program reads from the process it runs in, rather than from its code.
explain: |
  The same code runs on your laptop, in CI and in production. Each needs a different
  database address and different keys. Hard-coding them means editing code to deploy it.

  So the code asks its surroundings: `process.env.DATABASE_URL`, `os.environ["PORT"]`.
  Each machine sets its own values, and secrets never land in the repository. Keep local values in a `.env` file that Git ignores. Read everything once at startup, and fail fast with a clear message when one is missing.
analogy: The address on a parcel. The parcel is the same; the label decides where it goes.
example:
  language: bash
  code: |
    $ cat .env
    DATABASE_URL=postgres://localhost:5432/shop
    PORT=3000
    $ PORT=8080 node server.js
    listening on 8080
usage: The deploy failed because the environment variable for the API key was never set in production.
twin:
  term: feature-flag
  difference: An environment variable is fixed when the process starts and is the same for everyone it serves. A feature flag can be flipped while the app runs, and often differs per user.
related:
  - feature-flag
  - continuous-delivery
  - secret
level: 1
lessons:
  - tooling.configuration-and-environment
