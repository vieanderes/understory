term: keyboard navigation
aka: [ keyboard access, keyboard accessibility ]
short: Using a page with no mouse, moving with Tab and acting with Enter, Space and the arrow keys.
explain: |
  Many people don't use a mouse: people with tremors, people who are blind, and fast typists
  who never leave the keys. For them, Tab moves between controls, Enter and Space press
  them, and Escape closes things.

  Native buttons, links and fields do this out of the box. A clickable `div` does nothing:
  it can't be focused and ignores keys. Put your mouse away and try your page; it's the
  quickest accessibility test there is.
analogy: Using a TV with only the remote. Every menu has to be reachable with the arrows and the OK button.
usage: Keyboard navigation breaks in the date picker, because Enter opens it and nothing gets you out.
related: [ focus-order, focus-indicator, button, wcag ]
level: 1
lessons: [ design.keyboard-and-focus, interview.component-round ]
