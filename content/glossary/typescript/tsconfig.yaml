term: tsconfig.json
aka: [tsconfig, compiler options, strict mode]
short: The settings file that tells the TypeScript checker which files to read and how strict to be.
explain: |
  TypeScript needs to know a lot about your project before it can check it. Where are the
  files? Will the code run in a browser or on a server? How strict should it be? A file at
  the project root answers those questions.

  Most of it describes the world your code runs in. `module` and `moduleResolution` say who
  loads the files, `target` which syntax the output may use, and `lib` which built-in APIs
  exist. Turn on `strict` from day one. Switching it on later means fixing hundreds of
  errors at once.
analogy: The brief you give a proofreader, saying which pages to read, which house style, and how picky to be.
example:
  language: json
  code: |
    {
      "compilerOptions": {
        "strict": true,
        "target": "es2022",
        "module": "nodenext",
        "noEmit": true
      },
      "include": ["src"]
    }
usage: The server's tsconfig.json includes the DOM library, so it happily type-checks `window` in Node code.
related: [transpiler, declaration-file, type-erasure, compiler]
level: 2
lessons: [ts.configuration]
