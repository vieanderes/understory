term: LLMOps
aka: [prompts as code, prompt versioning]
short: Treating prompts, model settings and retrieval configuration like code that is versioned, reviewed and tested.
explain: |
  A prompt edit changes answers as surely as a code change. Yet it often lives in a
  dashboard, edited live, with no review and no record. When quality drops, nobody can say
  which change caused it.

  The fix is ordinary discipline. Keep prompts in the repository with a version. Review them
  in pull requests. Gate them with an eval suite in CI. Stamp the version on every response,
  and watch quality in production with traces and metrics.
analogy: Keeping the restaurant's recipes in a binder with dates, so when the soup tastes off, you know what changed.
usage: That regression came from an unreviewed prompt edit; under LLMOps it would have failed the eval gate.
related: [eval, prompt, distributed-tracing, continuous-integration, shadow-mode]
level: 2
lessons: [aisys.llmops]
