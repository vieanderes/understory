term: ADR
aka:
  - architecture decision record
  - decision record
short: A short dated note recording one technical choice, its context, the options and the trade-offs.
explain: |
  A year from now, someone will ask why the app uses a queue here. Without a record, the
  answer left with whoever decided. An ADR is one page: the situation, the options, what was
  chosen, and what that costs.

  ADRs aren't edited once accepted. When a decision changes, a new record replaces the old
  one and links to it. The history of the thinking stays readable. They live in the
  repository, beside the code they explain.
analogy: A ship's logbook. Not every wave, but every change of course, and why the captain made it.
usage: Write an ADR for dropping the cache, because someone will want to add it back next year.
twin:
  term: design-doc
  difference: An ADR records one decision once it's made, and stays as history. A design doc proposes a whole piece of work before it starts, and invites people to challenge it.
related:
  - design-doc
  - non-goal
level: 2
