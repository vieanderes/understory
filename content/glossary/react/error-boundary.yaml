term: error boundary
aka: [ error.tsx ]
short: A component that catches a crash in the part of the page below it and shows a fallback.
explain: |
  One broken widget shouldn't blank the whole screen. Without a safety net, an error thrown
  while drawing takes down everything above it too.

  React lets a component catch errors thrown while its children render. In Next.js an
  `error.tsx` file is that net for its folder. The layout around it survives, and the fallback
  can offer a retry. It catches rendering errors, not a failed click handler or a rejected
  promise you never awaited.
analogy: A fuse box. One room's fuse trips; the lights in the rest of the house stay on.
example:
  language: tsx
  code: |
    'use client';
    // app/dashboard/error.tsx
    export default function Error({ reset }: { reset: () => void }) {
      return <button onClick={reset}>Try again</button>;
    }
usage: Wrap the chart in its own error boundary, so a bad data point doesn't blank the dashboard.
related: [ suspense, layout-file, component ]
level: 2
lessons: [ next.app-router ]
