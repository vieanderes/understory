term: decomposition
aka: [problem decomposition, breaking a problem down]
short: Splitting a big task into small steps that each do one job, before writing any code.
explain: |
  "Build a to-do list" is too big to type in one go. "Store the tasks, add one, mark one
  done, print the list" is four small jobs. You can write and test each one in turn.

  Write the steps in plain words first. Then turn each one into a small function, and call
  it straight away to check it. A mistake in a ten-line function is far quicker to find than
  one in a hundred lines.
analogy: Eating a pizza slice by slice. Nobody fits the whole thing in their mouth at once.
usage: Do some decomposition before you start, so list the steps in comments and write one function per step.
related: [function, comment, bug]
level: 2
lessons: [basics.small-program]
