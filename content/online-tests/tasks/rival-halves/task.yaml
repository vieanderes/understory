id: rival-halves
title: RivalHalves
topic: leader
difficulty: hard
type: algorithmic
recommendedMinutes: 45
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A radio station logs the song requested by each of N callers, in order, as an array A of
  song numbers. A stretch of the log has a favourite if one song was requested by more than
  half of the callers in that stretch.

  The station wants to split the log into a morning part and an evening part. A split point
  S, where 0 ≤ S < N − 1, puts callers 0 to S in the morning and callers S + 1 to N − 1 in
  the evening. The split is a rivalry if both parts have a favourite and the two favourites
  are different songs.

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the number of split points that give a
  rivalry.

  For example, given A = [1, 1, 2, 2], the function should return 3:

  - S = 0 gives [1] and [1, 2, 2], with favourites 1 and 2;
  - S = 1 gives [1, 1] and [2, 2], with favourites 1 and 2;
  - S = 2 gives [1, 1, 2] and [2], with favourites 1 and 2.

  Given A = [4, 4, 4], the function should return 0, because both parts always share the
  favourite 4.

  Given A = [5, 7, 5, 7], the function should return 2: S = 0 gives [5] and [7, 5, 7], and
  S = 2 gives [5, 7, 5] and [7], but S = 1 gives two parts with no favourite.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [−1,000,000,000..1,000,000,000].
examples:
  - { args: [[1, 1, 2, 2]], expected: 3 }
  - { args: [[4, 4, 4]], expected: 0 }
  - { args: [[5, 7, 5, 7]], expected: 2 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: one or two callers
    group: correctness
    cases:
      - { args: [[3]], expected: 0 }
      - { args: [[3, 3]], expected: 0 }
      - { args: [[3, -3]], expected: 1 }
  - name: all_equal
    description: every caller asks for the same song
    group: correctness
    cases:
      - { args: [[-1000000000, -1000000000, -1000000000, -1000000000]], expected: 0 }
      - generate: { seed: 701, args: [{ kind: constant, n: 300, value: 42 }] }
  - name: no_favourite
    description: every song requested once
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4, 5, 6]], expected: 0 }
      - generate: { seed: 702, args: [{ kind: permutation, n: 200 }] }
  - name: whole_log_favourite
    description: one song leads the whole log
    group: correctness
    cases:
      - { args: [[2, 1, 1, 1, 1, 3]], expected: 2 }
      - { args: [[6, 6, 9, 9, 9, 9, 9, 9, 8, 8]], expected: 6 }
      - { args: [[0, 1, 0, 1, 0, 1, 0]], expected: 0 }
  - name: extreme_min_max_value
    description: the smallest and the largest song numbers
    group: correctness
    cases:
      - { args: [[1000000000, -1000000000, -1000000000, 1000000000, 1000000000]], expected: 1 }
  - name: small_random
    description: random, N = 300, few different songs
    group: correctness
    cases:
      - generate: { seed: 703, args: [{ kind: ints, n: 300, min: 0, max: 1 }] }
      - generate: { seed: 704, args: [{ kind: ints, n: 301, min: 0, max: 2 }] }
      - generate: { seed: 705, args: [{ kind: repeat, times: 50, unit: [4, 4, 4, 7, 7, 7] }] }
  - name: medium_random
    description: random, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 706, args: [{ kind: ints, n: 2000, min: 0, max: 1 }] }
      - generate: { seed: 707, args: [{ kind: sorted, n: 2000, min: 0, max: 3 }] }
  - name: large_random
    description: random, N = 100,000, two songs
    group: performance
    cases:
      - generate: { seed: 708, args: [{ kind: ints, n: 100000, min: 0, max: 1 }] }
      - generate: { seed: 709, args: [{ kind: ints, n: 100000, min: -1000000000, max: 1000000000 }] }
  - name: extreme_large
    description: two blocks of songs, N = 100,000
    group: performance
    cases:
      - generate: { seed: 710, args: [{ kind: sorted, n: 100000, min: 1, max: 2 }] }
      - generate: { seed: 711, args: [{ kind: repeat, times: 20000, unit: [3, 3, 3, 8, 8] }] }
