id: atlas.one-product-three-platforms
title: Web, cross-platform or native
objective: Choose between a website, a cross-platform app and a native app, with device needs as hard limits and weights set first.
level: advanced
minutes: 10
concepts: [atlas.device-apis, atlas.decision-framework, atlas.distribution]
prerequisites: [atlas.what-suits-what]
opening:
  text: >-
    You'll choose how to build one product, and show your working. It's a call teams argue
    about for weeks, and you'll settle it in an afternoon.

steps:
  - type: prose
    id: three-routes
    body: >-
      A running club wants an app: routes, a club chat, and heart rate from a chest strap.
      There are three ways to build it.


      A **website**, which you already know how to build. A **cross-platform app**: one
      codebase, installed from the stores on iPhone and Android. Or two **native apps**, one
      in Swift and one in Kotlin.

  - type: prose
    id: name-device-apis
    body: >-
      The first thing to check is **device APIs**: what the code can ask the phone for.
      Bluetooth, NFC, background work, push notifications. A native app reaches all of them. A
      cross-platform app reaches most. A website reaches only what the browser offers.


      And on iPhones, every browser runs pages with Safari's engine underneath. So Safari's
      limits are every iPhone browser's limits.

  - type: multiple-choice
    id: pick-bluetooth-on-iphone
    concept: atlas.device-apis
    difficulty: 1
    language: text
    code: |
      Web API           Chrome on Android   Safari on iPhone
      Web Bluetooth     yes                 no
      Web NFC           yes                 no
      Push              yes                 yes, once installed
    question: The club needs heart rate from a Bluetooth strap, on iPhones too. Can a website do it?
    choices:
      - text: No, so it has to be an app
        correct: true
        feedback: >-
          Right. On iPhones the web can't reach Bluetooth. That one "no" rules the website out.
      - text: Yes, with Web Bluetooth
        feedback: >-
          On Android, yes. Safari on iPhone doesn't offer it, and every iPhone browser uses Safari's engine.
      - text: Yes, through push notifications
        feedback: >-
          Push brings messages from your server. It can't talk to a strap next to the phone.

  - type: prose
    id: name-decision-framework
    body: >-
      When no route is ruled out, a **decision framework** helps. Pick a few criteria, say
      team, reach, device APIs and cost. Give each a weight. Then score each route 1 to 5.


      A route's total is each score times its weight, added up. The rule that keeps it honest:
      write the weights down before you score anything.

  - type: playground
    id: explore-weights
    prompt: >-
      The table adds up the totals for you. Change the weights in the bottom row and watch the
      winner. Try to make native win. What did you have to believe about the club?
    html: |
      <table>
        <tr><th>Route</th><th>Team</th><th>Reach</th><th>Device</th><th>Cost</th><th>Total</th></tr>
        <tr class="route"><th>Website</th><td>5</td><td>5</td><td>1</td><td>5</td><td class="total"></td></tr>
        <tr class="route"><th>Cross-platform</th><td>4</td><td>4</td><td>4</td><td>3</td><td class="total"></td></tr>
        <tr class="route"><th>Native</th><td>1</td><td>3</td><td>5</td><td>1</td><td class="total"></td></tr>
        <tr id="weights"><th>Weight</th><td>3</td><td>2</td><td>4</td><td>1</td><td></td></tr>
      </table>
      <p>Winner: <strong id="winner"></strong></p>
    css: |
      td, th { padding: 4px 8px; text-align: left; }
    js: |
      const numbers = (row) => [...row.querySelectorAll('td')].slice(0, 4).map((td) => Number(td.textContent));
      const weights = numbers(document.querySelector('#weights'));
      let best = null;
      for (const row of document.querySelectorAll('tr.route')) {
        const total = numbers(row).reduce((sum, score, i) => sum + score * weights[i], 0);
        row.querySelector('.total').textContent = total;
        if (!best || total > best.total) best = { name: row.querySelector('th').textContent, total };
      }
      document.querySelector('#winner').textContent = best.name;
    editable: [html]

  - type: playground
    id: fix-cost-scale
    concept: atlas.decision-framework
    difficulty: 2
    prompt: >-
      An assistant filled in cost as pounds to build: £2,000, £9,000 and £30,000. Now the
      dearest route wins. Score cost 1 to 5 instead, cheapest best: 5, 3 and 1.
    html: |
      <table>
        <tr><th>Route</th><th>Team</th><th>Reach</th><th>Device</th><th>Cost</th><th>Total</th></tr>
        <tr class="route" id="web"><th>Website</th><td>5</td><td>5</td><td>1</td><td>2000</td><td class="total"></td></tr>
        <tr class="route" id="cross"><th>Cross-platform</th><td>4</td><td>4</td><td>4</td><td>9000</td><td class="total"></td></tr>
        <tr class="route" id="native"><th>Native</th><td>1</td><td>3</td><td>5</td><td>30000</td><td class="total"></td></tr>
        <tr id="weights"><th>Weight</th><td>3</td><td>2</td><td>4</td><td>1</td><td></td></tr>
      </table>
      <p>Winner: <strong id="winner"></strong></p>
    css: |
      td, th { padding: 4px 8px; text-align: left; }
    js: |
      const numbers = (row) => [...row.querySelectorAll('td')].slice(0, 4).map((td) => Number(td.textContent));
      const weights = numbers(document.querySelector('#weights'));
      let best = null;
      for (const row of document.querySelectorAll('tr.route')) {
        const total = numbers(row).reduce((sum, score, i) => sum + score * weights[i], 0);
        row.querySelector('.total').textContent = total;
        if (!best || total > best.total) best = { name: row.querySelector('th').textContent, total };
      }
      document.querySelector('#winner').textContent = best.name;
    editable: [html]
    checks:
      - label: The website totals 34
        selector: '#web .total'
        text: '34'
      - label: Cross-platform totals 39
        selector: '#cross .total'
        text: '39'
      - label: Cross-platform wins
        selector: '#winner'
        text: Cross-platform
    solution:
      html: |
        <table>
          <tr><th>Route</th><th>Team</th><th>Reach</th><th>Device</th><th>Cost</th><th>Total</th></tr>
          <tr class="route" id="web"><th>Website</th><td>5</td><td>5</td><td>1</td><td>5</td><td class="total"></td></tr>
          <tr class="route" id="cross"><th>Cross-platform</th><td>4</td><td>4</td><td>4</td><td>3</td><td class="total"></td></tr>
          <tr class="route" id="native"><th>Native</th><td>1</td><td>3</td><td>5</td><td>1</td><td class="total"></td></tr>
          <tr id="weights"><th>Weight</th><td>3</td><td>2</td><td>4</td><td>1</td><td></td></tr>
        </table>
        <p>Winner: <strong id="winner"></strong></p>
    hints:
      - The cost column is the fifth cell of each route's row.
      - A raw 30000 outweighs every 1 to 5 score put together. Replace each figure with a score.
      - '`2000` becomes `5`, `9000` becomes `3`, `30000` becomes `1`.'

  - type: code-challenge
    id: write-rank-routes
    concept: atlas.decision-framework
    difficulty: 3
    language: ts
    prompt: >-
      Write the table as code. `rankRoutes(routes, weights, mustHave)` drops each route whose
      `can` list misses anything in `mustHave`. That's the Bluetooth rule.


      Total the rest, each score times its weight. Throw on a score outside 1 to 5, or a
      missing one. Return `{ name, total }` best first, ties by name.
    hints:
      - Filter first, then total, then sort. The throw belongs inside the totalling.
      - '`mustHave.every((need) => route.can.includes(need))` says whether a route can do it all.'
      - 'Sort with `(a, b) => b.total - a.total || a.name.localeCompare(b.name)`.'

  - type: prose
    id: name-distribution
    body: >-
      One criterion needs its own look: **distribution**, how the product reaches people. A
      website needs a link, and a fix is live on the next visit.


      An app needs a store: a paid developer account, a review of every release, an install,
      and users who update when they feel like it. In return you get discovery, trust and
      payments that work.

  - type: explain-back
    id: explain-store-or-link
    concept: atlas.distribution
    difficulty: 3
    audience: non-technical
    kind: decide
    prompt: >-
      The club's organiser, who doesn't code, asks whether the app should be in the stores.
      What do you advise?
    rubric:
      - A store adds a developer account, a review before every release and an install step.
      - Fixes reach users slowly, because each user updates in their own time.
      - The gains are discovery, trust and payments, which matter little to a club that already meets its members.
    modelAnswer: >-
      I'd stick with the link. A store helps strangers find an app, trust it and pay in it.
      The club doesn't need that: it sees its members every Saturday. And a store costs real
      effort. There's a developer account, a review before every release, and fixes that
      reach members only as each one updates. If the app ever needs something only an app
      can do, like the chest strap, we'd think again.

recap:
  - Rule a route out when it can't reach a device API the product needs.
  - Set weights before scoring, keep every score 1 to 5, and let code do the sums.
  - Weigh a store's reach and trust against its review, fee and slow updates.

recall:
  - id: card-device-apis
    concept: atlas.device-apis
    front: Why can't a website on an iPhone read a Bluetooth heart-rate strap?
    back: >-
      Safari on iPhone doesn't offer Web Bluetooth, and every iPhone browser uses Safari's
      engine. Only an app can reach it there.
  - id: card-weights-first
    concept: atlas.decision-framework
    front: What's the one rule that keeps a weighted decision honest?
    back: >-
      Write the weights down before you score. Set afterwards, they get tuned to the answer
      you wanted.
  - id: card-same-scale
    concept: atlas.decision-framework
    front: Why must every criterion be scored on the same scale?
    back: >-
      A raw figure such as pounds swamps scores of 1 to 5, and that one criterion decides
      alone.
  - id: card-distribution
    concept: atlas.distribution
    front: What does a store add to distribution, for better and worse?
    back: >-
      Discovery, trust and payments. Against that, an account fee, a review of every release,
      an install step, and users who don't update.

