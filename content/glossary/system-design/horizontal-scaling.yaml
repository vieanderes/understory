term: horizontal scaling
aka: [scaling out, scale out]
short: Handling more load by adding more machines that share the work.
explain: |
  When one server is too busy, you can add another identical one beside it, then another.
  A load balancer spreads requests across them. In the cloud this can happen
  automatically as traffic rises.

  It only works if the servers don't keep private state. Sessions, uploads and in-memory
  counters must live somewhere shared, like a database or Redis. And the shared database
  doesn't grow with them: more servers often means more connections to one database,
  which becomes the new limit.
analogy: Opening more checkouts at the supermarket when the queues grow.
usage: We can't rely on horizontal scaling until the rate limiter stops keeping its counts in memory.
twin:
  term: vertical-scaling
  difference: Horizontal scaling adds more machines. Vertical scaling makes one machine bigger. Out versus up.
related: [vertical-scaling, load-balancer, sharding]
level: 2
lessons: [cloud.scaling-and-cost]
