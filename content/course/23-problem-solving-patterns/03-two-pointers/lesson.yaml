id: algo.two-pointers
title: Two pointers
objective: Walk a sorted array from both ends, or at two speeds, to replace a nested loop.
level: essential
minutes: 10
concepts: [algo.opposite-pointers, algo.fast-and-slow-pointers]
prerequisites: [algo.hash-map-patterns]
opening:
  text: >-
    You'll solve pair and in-place problems in one pass and no extra memory. Two indices
    moving with a rule often replace a whole nested loop.

steps:
  - type: prose
    id: picture-two-pointers
    body: |-
      A **pointer** here is an index into an array. Put one at each end of a sorted list
      and move them towards each other:

      ```js
      let left = 0;
      let right = sorted.length - 1;
      while (left < right) { /* compare, then move one of them */ }
      ```

      Each move rules out one item for good, so it's one pass. Signals: sorted input and a
      pair to find, or text to read from both ends.

  - type: multiple-choice
    id: pick-fits-pointers
    concept: algo.opposite-pointers
    difficulty: 1
    question: Which problem fits pointers moving in from both ends?
    choices:
      - text: Is this string a palindrome?
        correct: true
        feedback: >-
          Yes. Compare the first and last letters, then step both inwards.
      - text: Which word appears most often?
        feedback: >-
          That's counting, the hash map pattern. Order doesn't help here.
      - text: Find a pair in an unsorted list
        feedback: >-
          Without order, moving a pointer tells you nothing. Use a `Map`, or sort first.

  - type: prose
    id: name-opposite-pointers
    body: |-
      That's **two pointers from both ends**. For a pair that adds to a target: if the sum
      is too small, only a bigger left number can help, so `left` moves right. Too big, and
      `right` moves left.

      It's O(n) time and O(1) extra space, with no `Map` needed. The catch: it only works on
      sorted data.

  - type: predict-output
    id: predict-palindrome
    concept: algo.opposite-pointers
    difficulty: 2
    language: js
    code: |
      function isPalindrome(text) {
        let left = 0;
        let right = text.length - 1;
        while (left < right) {
          if (text[left] !== text[right]) {
            return false;
          }
          left++;
          right--;
        }
        return true;
      }
      console.log(isPalindrome('level'), isPalindrome('abca'));
    question: What does this show?
    choices:
      - text: '`true false`'
        correct: true
        feedback: >-
          Right. In `abca`, the inner letters `b` and `c` differ.
      - text: '`true true`'
        feedback: >-
          The outer `a`s match, but the loop keeps going. `b` and `c` don't match.
      - text: '`false false`'
        feedback: >-
          `level` matches at every step until the pointers meet in the middle.

  - type: ai-review
    id: review-same-index
    concept: algo.opposite-pointers
    difficulty: 4
    language: js
    request: Write pairSum(sorted, target) returning the positions of two different numbers that add to target.
    flawClass: logic
    code: |
      function pairSum(sorted, target) {
        let left = 0;
        let right = sorted.length - 1;
        while (left <= right) {
          const sum = sorted[left] + sorted[right];
          if (sum === target) return [left, right];
          if (sum < target) left++;
          else right--;
        }
        return [];
      }
    prompt: >-
      An assistant wrote this. Tests for real pairs passed. `pairSum([2, 5, 9], 10)` returns
      `[1, 1]`, though no pair exists. Tap the line at fault.
    lines: [4]
    reasons:
      - text: When the pointers meet, one number pairs with itself
        correct: true
        feedback: >-
          Exactly. At `left === right`, 5 plus 5 is 10. The loop must stop first.
      - text: '`right` should start at `sorted.length`'
        feedback: >-
          That index is past the end, so the first sum would be `NaN`.
      - text: The pointers move the wrong way
        feedback: >-
          The moves are right: too small moves `left` up. The stop condition is off.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A target twice one number, with no real pair
          correct: true
          feedback: >-
            Yes. The pointers meet on that number and pair it with itself.
        - text: A pair made of the first and last numbers
          feedback: >-
            That's found on the first sum, so it passes. The pointers never get near each
            other.
        - text: An empty array
          feedback: >-
            Then `right` starts at -1, the loop never runs, and `[]` is right.
    fix: |
      function pairSum(sorted, target) {
        let left = 0;
        let right = sorted.length - 1;
        while (left < right) {
          const sum = sorted[left] + sorted[right];
          if (sum === target) return [left, right];
          if (sum < target) left++;
          else right--;
        }
        return [];
      }

  - type: code-challenge
    id: write-clean-palindrome
    concept: algo.opposite-pointers
    difficulty: 3
    language: python
    starter: palindrome.starter.py
    solution: palindrome.solution.py
    tests: palindrome.tests.py
    prompt: >-
      A word-game app accepts phrases like "Never odd or even". Write `is_palindrome(text)`
      in Python: `True` when the letters and digits read the same both ways, ignoring case
      and everything else.


      `is_palindrome("No 'x' in Nixon")` is `True`.


      **Target:** O(n) time and O(1) extra space, for text up to 600,000 characters. The
      tests include an empty string, only punctuation, and a full-size run. Slicing off both
      ends again and again runs out of time.
    hints:
      - Put `left` at the start and `right` at the end. What should happen at a space?
      - Skip anything where `char.isalnum()` is false, on either side, before comparing.
      - 'Compare `text[left].lower()` with `text[right].lower()`. Match: move both inwards. No match: `False`.'

  - type: prose
    id: name-fast-and-slow
    body: |-
      Pointers can also move the same way. Changing an array **in place** means changing
      the array itself, with no second array.

      Say you remove duplicates from a sorted array in place. `read` visits every item.
      `write` marks where the next kept value goes. When `read` finds a new value, copy it
      to `write` and move `write` on. These are **read and write pointers**.

  - type: code-challenge
    id: write-remove-duplicates
    concept: algo.fast-and-slow-pointers
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: dedupe.starter.py
      solution: dedupe.solution.py
      tests: dedupe.tests.py
    prompt: >-
      An import job must drop repeated ids from a sorted array without copying it. Write
      `removeDuplicates(sorted)`: change the array in place so each value appears once at
      the front, and return how many values that is.


      `[1, 1, 2, 3, 3]` returns `3` and starts with `1, 2, 3`.


      **Target:** O(n) time, O(1) extra space, for up to 1,000,000 ids. The tests include an
      empty array and a full-size run. Removing each repeat with `splice` runs out of time.
    hints:
      - One pointer reads every item. Where does the next kept value go?
      - '`write` is both the next free slot and the count so far.'
      - 'Return `0` for an empty array first, then start `write` at 1 and loop `read` from 1.'

  - type: explain-back
    id: explain-why-safe
    concept: algo.opposite-pointers
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      In a sorted pair sum, the sum is too big and `right` moves left. The interviewer asks
      why that can't skip the answer. What do you say?
    rubric:
      - The sorted order means the right number is the largest still possible.
      - Paired with the smallest left number it's already too big.
      - So it's too big with every other left number too, and can be dropped.
    modelAnswer: >-
      The array is sorted, so `left` points at the smallest number still in play. If even
      that plus the right number is too big, the right number is too big with every other
      candidate. It can never be in the answer, so dropping it loses nothing.

recap:
  - Squeeze a sorted array from both ends to find pairs in O(n).
  - Use a read and a write pointer to change an array in place.
  - Stop before the pointers meet when an item can't pair with itself.
recall:
  - id: card-opposite-signal
    concept: algo.opposite-pointers
    front: What in a problem suggests pointers from both ends?
    back: >-
      Sorted input and a pair or range to find, or a check that reads a string from both
      ends, like a palindrome.
  - id: card-opposite-move
    concept: algo.opposite-pointers
    front: In a sorted pair sum, which pointer moves when the sum is too small?
    back: >-
      The left one. Only a larger left number can raise the sum.
  - id: card-fast-slow
    concept: algo.fast-and-slow-pointers
    front: In an in-place duplicate removal, what does the write pointer mark?
    back: >-
      Where the next new value goes. It's also the count of values kept so far.
  - id: card-two-pointer-cost
    concept: algo.fast-and-slow-pointers
    front: What do two-pointer solutions usually cost?
    back: >-
      O(n) time, since each pointer only moves forward, and O(1) extra space.

references:
  - kind: docs
    title: Array cheatsheet for coding interviews
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/algorithms/array/
    note: Two pointers, sliding windows and in-place tricks, with practice problems.
    primary: true
    verified: true
  - kind: docs
    title: Cycle detection
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Cycle_detection
    note: Floyd's tortoise and hare, the fast and slow pointers on a linked list.
    verified: true

deepDive: >-
  Every output here was run on Node 24.


  Three numbers that sum to a target is the usual follow-up. Sort once, fix each number in
  turn, and run the pair search on the rest. That's O(n²), better than the O(n³) of three
  nested loops.


  The tortoise and hare finds a cycle in a linked list with O(1) memory. The slow pointer
  moves one node, the fast one two. If there's a cycle, the fast one laps the slow one and
  they meet. If not, the fast one reaches the end. A `Set` of visited nodes also works, but
  costs O(n) memory.
