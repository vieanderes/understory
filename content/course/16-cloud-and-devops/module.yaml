id: cloud
number: 16
title: Cloud and DevOps
summary: "From localhost to a live address. Package an app in a container, ship it through a pipeline without downtime, watch it in production, and prove that a restore works."
why: "Code only helps people once it runs somewhere reliable."
youCanBuild: "A model-backed API in a container behind a reverse proxy, deployed by a pipeline with a rollback, with logs, metrics, alerts and a tested restore."
concepts:
  - id: cloud.servers-and-the-cloud
    title: "Servers and the cloud"
    summary: "A server is a computer that runs your code for other people, and the cloud is renting servers and services from a provider by the hour instead of owning them."
  - id: cloud.regions
    title: "Regions"
    summary: "A region is a group of a provider's data centres in one part of the world, and code runs fastest in the region near its users and its data."
  - id: cloud.listening-address
    title: "Listening address and port"
    summary: "A server only answers other machines when it listens on all addresses, 0.0.0.0, and on the port its host gives it, usually in PORT."
  - id: cloud.deploying
    title: "Deploying"
    summary: "Deploying is building your code, copying it to a server and starting it there, so a public address reaches it."
  - id: cloud.ssh
    title: SSH
    summary: SSH gives an encrypted shell on a remote host, authenticated by a key pair instead of a password.
  - id: cloud.users-and-permissions
    title: Users and permissions
    summary: Each process runs as a user, and file modes and sudo rules decide what that user may read, write and run.
  - id: cloud.systemd
    title: Processes and systemd
    summary: systemd starts services at boot, restarts them when they exit, and collects their output in the journal.
  - id: cloud.firewall
    title: Firewalls
    summary: A firewall drops traffic to every port except those opened on purpose, such as 22, 80 and 443.
  - id: cloud.dns-records
    title: DNS records
    summary: A and AAAA records map a name to an address, CNAME maps a name to another name, and MX and TXT carry mail and verification data.
  - id: cloud.dns-ttl
    title: TTL and propagation
    summary: Resolvers cache a record for its TTL, so a change is seen only as each cached copy expires.
  - id: cloud.tls-certificates
    title: TLS certificates
    summary: A certificate binds a domain name to a public key and is signed by an authority the client trusts, and ACME automates issue and renewal.
  - id: cloud.container-images
    title: "Images and containers"
    summary: "An image is your app packaged with everything it needs to run, and a container is that image running as an isolated process."
  - id: cloud.dockerfiles
    title: "Dockerfiles"
    summary: "A Dockerfile lists the steps that build an image: a base image, files copied in, commands run at build time, and the command that starts the app."
  - id: cloud.containers-and-vms
    title: Containers and virtual machines
    summary: A container is a process isolated by kernel namespaces and cgroups that shares the host kernel, and a virtual machine runs its own kernel on virtual hardware.
  - id: cloud.layer-cache
    title: "Layers and the build cache"
    summary: "Each Dockerfile step makes a layer, and a rebuild reuses every layer until the first step whose inputs changed, so steps that change least go first."
  - id: cloud.build-context
    title: "Build context and secrets"
    summary: "Everything in the build context can be copied into the image, so .dockerignore keeps out node_modules and .env, and secrets never go in a layer."
  - id: cloud.multi-stage-builds
    title: Multi-stage builds
    summary: One stage holds the build tools, and the final stage copies out only the built output, which gives a smaller image.
  - id: cloud.image-tags
    title: "Image tags"
    summary: "A tag such as latest can point at a different image tomorrow, so builds are tagged with a version or commit and deploys name that exact tag."
  - id: cloud.compose
    title: Docker Compose
    summary: One file declares the services of a system, with their images, environment, ports and dependencies, and starts them together.
  - id: cloud.container-networks
    title: Container networks
    summary: Services on the same Compose network reach each other by service name, and only published ports are reachable from the host.
  - id: cloud.volumes
    title: Volumes
    summary: A volume stores data outside the container's writable layer, so it survives when the container is replaced.
  - id: cloud.health-checks
    title: "Health checks"
    summary: "A probe that reports whether a service can do its work right now, used to order start-up, route traffic and restart it."
  - id: cloud.reverse-proxy
    title: Reverse proxies
    summary: A server that accepts client connections and forwards each request to one of the application servers behind it.
    confusableWith: [cloud.load-balancing]
  - id: cloud.tls-termination
    title: TLS termination
    summary: The proxy holds the certificate and decrypts traffic, and the hop to the application uses plain HTTP or a second TLS session.
  - id: cloud.load-balancing
    title: Load balancing
    summary: Requests are spread over several instances by a rule such as round robin or least connections, and unhealthy instances are skipped.
    confusableWith: [cloud.reverse-proxy]
  - id: cloud.sticky-sessions
    title: Sticky sessions
    summary: The balancer sends one client to the same instance each time, which hides state kept in memory and breaks when that instance goes away.
  - id: cloud.pipelines
    title: CI/CD pipelines
    summary: Every push runs the same ordered stages of build, check and test, and a passing main branch is deployed automatically.
  - id: cloud.environments
    title: "Environments"
    summary: "Separate running copies of a system, such as staging and production, each with its own config, data and secrets."
  - id: cloud.ci-secrets
    title: "Secrets in CI"
    summary: "CI reads deploy tokens and API keys from the platform's encrypted secret store, scoped to an environment, and masks them in logs."
  - id: cloud.build-once
    title: "Build once, deploy many"
    summary: "One build makes one artefact tagged with its commit, and that same artefact is promoted through every environment."
  - id: cloud.zero-downtime-release
    title: Zero-downtime releases
    summary: New instances start and pass health checks before old ones drain, as in rolling and blue-green deploys.
  - id: cloud.blue-green
    title: "Blue-green deploys"
    summary: "Two identical environments run side by side, traffic switches from the old to the new at once, and switching back is the rollback."
    confusableWith: [cloud.canary-release]
  - id: cloud.rollbacks
    title: Rollbacks
    summary: A release is reversed by redeploying the previous immutable artefact, which works only if the database still suits the old code.
  - id: cloud.migrations-in-deploys
    title: Migrations in deploys
    summary: Schema changes ship ahead of the code that needs them and stay compatible with the version still running.
  - id: cloud.structured-logs
    title: Structured logs
    summary: Each log line is a record with named fields, such as a request ID, so logs can be filtered and joined by machine.
    confusableWith: [cloud.metrics, cloud.traces]
  - id: cloud.metrics
    title: Metrics
    summary: Numbers sampled over time, such as request rate, error rate and latency, that are cheap to store and to alert on.
    confusableWith: [cloud.structured-logs, cloud.traces]
  - id: cloud.traces
    title: Distributed traces
    summary: A trace follows one request across services as a tree of timed spans that share a trace ID.
    confusableWith: [cloud.structured-logs, cloud.metrics]
  - id: cloud.slos
    title: SLOs and alerts
    summary: A service level objective is a target for a user-facing measure over a period, and alerts fire when the error budget burns too fast.
  - id: cloud.alerting
    title: "Alerts that matter"
    summary: "Page a person only for a user-visible problem that needs action now, with enough traffic to be sure; everything else becomes a ticket or a dashboard."
  - id: cloud.incident-response
    title: "Handling an outage"
    summary: "On call, you stop the harm first, usually by rolling back, then find the cause, then write a blameless review with actions."
  - id: cloud.pitr
    title: Point-in-time recovery
    summary: A base backup plus the archived write-ahead log restores the database to any chosen moment.
  - id: cloud.replicas-and-backups
    title: "Replicas are not backups"
    summary: "A replica copies every change at once, including a mistaken delete, so only a backup can go back in time."
  - id: cloud.restore-testing
    title: Tested restores
    summary: A backup is proven only by restoring it on a schedule and measuring the time taken and the data lost against the recovery objectives.
  - id: cloud.vps
    title: Virtual private servers
    summary: A rented virtual machine at a fixed price, where patching, deploys, backups and recovery are your work.
    confusableWith: [cloud.managed-platforms]
  - id: cloud.managed-platforms
    title: Managed platforms and PaaS
    summary: The provider builds, runs and scales the application, in exchange for its limits, its pricing and less control.
    confusableWith: [cloud.vps]
  - id: cloud.kubernetes
    title: Kubernetes
    summary: An orchestrator that keeps a declared number of containers running across a cluster and reschedules them when a node fails.
  - id: cloud.golden-paths
    title: "Golden paths"
    summary: "A supported, paved way to build and ship a common kind of service, with templates and defaults, that teams may leave if they must."
  - id: cloud.serverless-functions
    title: Serverless functions
    summary: The platform runs a handler on demand, scales instances with traffic, including to zero, and bills per invocation and duration.
    confusableWith: [cloud.edge-functions]
  - id: cloud.cold-starts
    title: Cold starts
    summary: A request that needs a new instance waits for the runtime and the code to load before the handler runs.
  - id: cloud.connection-exhaustion
    title: Connection exhaustion
    summary: Each function instance opens its own database connections, so a traffic spike can exceed the database's connection limit.
  - id: cloud.cdn
    title: Content delivery networks
    summary: A network of edge servers that cache responses near users and absorb traffic before it reaches the origin.
  - id: cloud.edge-functions
    title: Edge functions
    summary: Code that runs at the CDN's locations in a restricted runtime, suited to redirects, headers, authentication checks and personalising cached pages.
    confusableWith: [cloud.serverless-functions]
  - id: cloud.data-locality
    title: Data locality
    summary: Code at the edge that queries a database in one region pays the round trip on every query, so compute belongs near its data.
  - id: cloud.vertical-and-horizontal
    title: "Vertical and horizontal scaling"
    summary: "Vertical scaling gives one machine more resources, and horizontal scaling adds machines behind a load balancer."
  - id: cloud.statelessness
    title: Stateless services
    summary: An instance that keeps no session or file state locally can be added, removed or replaced at any time.
  - id: cloud.scaling-order
    title: "Scaling in order"
    summary: "Measure first, then fix the cheapest bottleneck, such as a query, a pool or a cache, and add instances only when the app itself is the limit."
  - id: cloud.capacity-and-cost
    title: "Capacity and cost"
    summary: "Measured load per machine, forecast demand and headroom give the capacity to buy, and budgets and alerts catch spend nobody meant, such as a forgotten GPU."
  - id: cloud.trunk-based-development
    title: "Trunk-based development"
    summary: "Everyone merges small changes into one main branch at least daily, and the branch is always releasable."
  - id: cloud.feature-flags
    title: "Feature flags"
    summary: "A runtime switch separates deploying code from releasing a feature, so unfinished work ships dark and a bad feature turns off without a deploy."
  - id: cloud.canary-release
    title: "Canary releases"
    summary: "A new version takes a small share of traffic first, as an experiment with guardrails written down before it starts, such as crash rate, errors and a product signal, and they decide whether it grows or rolls back."
    confusableWith: [cloud.blue-green]
  - id: cloud.dora-metrics
    title: "DORA metrics"
    summary: "Deployment frequency, change lead time, change fail rate, failed deployment recovery time and deployment rework rate measure how well a team delivers."
  - id: cloud.iac
    title: "Infrastructure as code"
    summary: "Servers, networks and managed services are declared in versioned files and created by a tool, not by clicking in a console."
  - id: cloud.plan-and-apply
    title: "Plan and apply"
    summary: "The tool compares the code with what really exists, shows a plan of creates, changes and destroys, including drift made by hand, and changes nothing until the plan is applied."
  - id: cloud.iac-state
    title: "State files"
    summary: "The tool records what it manages in a state file, which must be stored remotely, locked during a run and kept secret."
  - id: cloud.least-privilege
    title: "Least privilege in the cloud"
    summary: "Each person, service and pipeline gets a role with only the actions and resources it needs, and short-lived credentials instead of long-lived keys."
  - id: cloud.desired-state
    title: "Desired state and reconciliation"
    summary: "You declare the state you want, and controllers keep comparing it with what runs and act to close the gap."
  - id: cloud.k8s-workloads
    title: "Pods and Deployments"
    summary: "A Deployment keeps a declared number of identical Pods running and replaces them in a rolling update."
  - id: cloud.k8s-services-and-ingress
    title: "Services and Ingress"
    summary: "A Service gives changing Pods one stable address and balances across them, and an Ingress or Gateway routes outside traffic in."
  - id: cloud.k8s-probes-and-resources
    title: "Probes, requests and limits"
    summary: "Readiness and liveness probes decide when a Pod gets traffic or restarts, and resource requests and limits decide where it fits and when it is throttled or killed."
