id: career
number: 25
title: "Interviews and career"
summary: "Prepare for senior AI engineering interviews: what each round tests, your introduction, behavioural stories, how you work with AI, the take-home, your questions, the offer and your first 90 days."
why: "Being good at the work and showing it in an hour are separate skills, and the second one can be practised."
youCanBuild: "A one-minute introduction, a bank of five STAR stories, questions for each interviewer, a counter-offer email and a 90-day plan."
concepts:
  - id: career.interview-rounds
    title: "Interview rounds"
    summary: "A senior AI engineering loop has coding, system design, a project deep dive and behavioural rounds, often with an applied AI round on quality, failures and cost."
  - id: career.seniority-signals
    title: "Signals of seniority"
    summary: "Senior answers start from requirements, name trade-offs and failure modes unprompted, say how they'd measure it, and tell decisions with their results."
  - id: career.introduction
    title: "The one-minute introduction"
    summary: "Now, before and next in about a minute: what you do, how you got here with one proof, and why this role."
  - id: career.framing-a-gap
    title: "Explaining a gap or a switch"
    summary: "A gap or career change is stated plainly and without apology, with what you built or learnt, then steered back to the role."
  - id: career.star
    title: "STAR"
    summary: "Situation, task, action and result, told briefly with most of the time on the action you chose and what it changed."
  - id: career.story-bank
    title: "A story bank"
    summary: "One story each for a hard trade-off, an incident, a disagreement, helping someone grow, and a project you scoped down or stopped covers most questions."
  - id: career.ai-tools-answer
    title: "Talking about AI tools"
    summary: "A good answer says what you hand over, how you check it with tests you trust, and that you own correctness and design."
  - id: career.ramp-up-plan
    title: "A ramp-up plan"
    summary: "Naming one real gap, what carries over, and how you'd close it in a week shows self-awareness and speed."
  - id: career.staying-current
    title: "What's changed lately"
    summary: "One change you've used, what it changed in your work and the catch it brought beats a list of tool names."
  - id: career.take-home-review
    title: "How a take-home is judged"
    summary: "Reviewers read the README, run it from a fresh clone, run the tests and try the unhappy path before they read the code."
  - id: career.take-home-scope
    title: "Scoping a take-home"
    summary: "Ask the time budget and the AI rules, keep to them, disclose how you used AI, and list what you'd add next."
  - id: career.questions-to-ask
    title: "Questions for the team"
    summary: "Questions about priorities, how model changes are measured, the last incident and what seniors own show how the team really works."
  - id: career.reading-answers
    title: "Reading the answers"
    summary: "Vague answers, blame in incident stories, or unmeasured quality are signals to weigh as much as the offer."
  - id: career.comparing-offers
    title: "Comparing offers"
    summary: "Put each part on a yearly basis, keep certain money apart from bonus and equity, and weigh level and the work."
  - id: career.negotiation
    title: "Asking for more"
    summary: "Ask once, warmly, with a specific number and a reason, keep your current salary out, and use level or a sign-on when base is fixed."
  - id: career.onboarding-plan
    title: "A 90-day plan"
    summary: "Learn, contribute, lead: trace one request, learn how quality is measured, then own a feature and one improvement."
  - id: career.first-contribution
    title: "A first contribution"
    summary: "A small first change with a description that says what, why and how it was tested builds trust fast."
