approach: >-
  Slide a window along the shelf. For each right end, move the left end forward only as far
  as needed to get back to at most K labels, keeping a count of each label inside the
  window. Every stretch that ends at the right end and starts anywhere in the window is
  tidy, so add the window's length. The left end only ever moves forward, so the whole walk
  is one pass.
complexity: O(N) time, O(M) extra space for the label counts
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Read the bottom first. **N up to 100,000** and **efficient**: there are about five
      billion stretches, so you cannot look at each one. Labels are at most 100,000, which
      means a plain array can count them.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in your own words. A stretch is any run of neighbouring jars, and a single jar
      counts too.
    code:
      ts: |-
        // Count the runs of neighbouring jars that hold at most K different labels.
      python: |-
        # Count the runs of neighbouring jars that hold at most K different labels.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs at the edges:

      - one jar, including the largest label;
      - every label different with a small K;
      - K = N, where every stretch is tidy;
      - repeats that let a window grow long.

      Put them in test-input.txt now.
    input:
      - "(1, [0])"
      - "(1, [100000])"
      - "(3, [1, 2, 3, 4, 5])"
      - "(5, [1, 2, 3, 4, 5])"
      - "(2, [4, 4, 5, 6, 5, 5, 4])"
  - kind: write
    title: Bank a correct version first
    minutes: 4
    body: |-
      Type the direct version yourself: from each start, grow the stretch and track the
      labels in a set, stopping once there are too many. It is correct, but when every
      stretch is tidy it does O(N²) work.
    code:
      ts: |-
        // Count the runs of neighbouring jars that hold at most K different labels.
        // First pass: grow a stretch from every start, O(N²) when K is large.
        function solution(K: number, A: number[]): number {
            let total = 0;
            for (let p = 0; p < A.length; p++) {
                const labels = new Set<number>();
                for (let q = p; q < A.length; q++) {
                    labels.add(A[q]);
                    if (labels.size > K) break;
                    total++;
                }
            }
            return total;
        }
      python: |-
        # Count the runs of neighbouring jars that hold at most K different labels.
        # First pass: grow a stretch from every start, O(N²) when K is large.
        def solution(K, A):
            total = 0
            for p in range(len(A)):
                labels = set()
                for q in range(p, len(A)):
                    labels.add(A[q])
                    if len(labels) > K:
                        break
                    total += 1
            return total
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check each of your cases against the
      rule.
    expect: >-
      Two OKs, then 1 for each single jar, 12 for K = 3 on five labels, 15 when every
      stretch is tidy, and a value for the last case that matches the fast version later.
  - kind: plan
    title: Move the left end forward, never back
    minutes: 3
    body: |-
      If a stretch is tidy, every shorter stretch inside it is tidy too. So for each right
      end there is a leftmost start that still works, and it never moves back as the right
      end moves on.

      That is the **caterpillar**: grow on the right, shrink on the left, and add the
      window length each time. A count per label tells you when a label leaves the window.
  - kind: ask-ai
    title: Ask a syntax question about the counts
    minutes: 1
    body: |-
      You want a zero-filled counting array of 100,001 slots. How to make one is pure
      syntax, so it is a fair question.
    prompt: >-
      One line each: in TypeScript, is new Int32Array(100001) filled with zeros, and what
      is the Python way to make a list of 100001 zeros?
    expect: "Yes, typed arrays start at 0. In Python, [0] * 100001."
  - kind: optimise
    title: Write the caterpillar yourself
    minutes: 5
    body: |-
      This is the core of the task, so type it. Update the count before checking it: a
      label that goes from 0 to 1 adds a distinct label, one that drops to 0 removes one.
    code:
      ts: |-
        // Count the runs of neighbouring jars that hold at most K different labels.
        // Caterpillar: for each right end, the left end only ever moves right, so the walk
        // is O(N) time, with O(M) space for the label counts.
        function solution(K: number, A: number[]): number {
          const seen = new Int32Array(100001);
          let distinct = 0;
          let left = 0;
          let total = 0;
          for (let right = 0; right < A.length; right++) {
            if (seen[A[right]]++ === 0) distinct++;
            while (distinct > K) {
              if (--seen[A[left]] === 0) distinct--;
              left++;
            }
            // Every stretch ending at `right` and starting in [left..right] is tidy.
            total += right - left + 1;
          }
          return total;
        }
      python: |-
        # Count the runs of neighbouring jars that hold at most K different labels.
        # Caterpillar: for each right end, the left end only ever moves right, so the walk
        # is O(N) time, with O(M) space for the label counts.
        def solution(K, A):
            seen = [0] * 100001
            distinct = 0
            left = 0
            total = 0
            for right, label in enumerate(A):
                if seen[label] == 0:
                    distinct += 1
                seen[label] += 1
                while distinct > K:
                    seen[A[left]] -= 1
                    if seen[A[left]] == 0:
                        distinct -= 1
                    left += 1
                # Every stretch ending at `right` and starting in [left..right] is tidy.
                total += right - left + 1
            return total
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Ask for inputs only. Run them on the fast version and on the slow one in a scratch
      tab: the two must agree on every line.
    prompt: >-
      Give me 5 test inputs for solution(K, A), one per line, in the format
      (2, [1, 2, 1, 3]). Cover all jars with the same label, K = 1 with alternating labels,
      labels near 100000, a long run of one label in the middle and K larger than the
      number of labels. Inputs only, no answers and no code.
    expect: Five lines to paste into test-input.txt, with the same results from both versions.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The moment a label's count reaches 0 is the line
      most worth checking.
    prompt: >-
      Review my current solution for correctness when labels leave the window, the size of
      the counting array and time complexity. List any problems in one line each. Do not
      rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the slow version and any debug output. Check the header comment states O(N).
      Then submit.
