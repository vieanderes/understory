term: adjacency list
aka: [adjacency lists, adjacency map, neighbour list]
short: Storing a network as a map from each node to the nodes it links to directly.
explain: |
  Tasks often hand you edges as pairs: `[a, b]` means a links to b. To search, you need
  the other view: given a node, who are its neighbours? So you build that map first.

  It uses O(V + E) memory and lists a node's neighbours in time proportional to how many
  it has. The alternative, a matrix of every pair, costs O(V²) and only pays off when
  nearly every pair is linked.

  Store an undirected edge both ways round.
  Add nodes with no edges too, or a search will never find them.
analogy: Everyone's phone contacts. To reach someone's friends, you open their contact list, not a giant table of everyone against everyone.
example:
  language: python
  code: |
    from collections import defaultdict

    def build(edges):
        neighbours = defaultdict(list)
        for a, b in edges:
            neighbours[a].append(b)
            neighbours[b].append(a)   # undirected: both ways
        return neighbours
usage: First turn the edge pairs into an adjacency list; then each BFS step is a map lookup.
