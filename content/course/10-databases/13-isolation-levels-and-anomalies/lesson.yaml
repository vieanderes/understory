deepDive: >-
  Postgres offers three levels in practice. **Read committed**, the default, gives each
  statement a fresh view. **Repeatable read** gives the whole transaction one view taken at
  its first statement, and cancels an update of a row someone changed since. **Serializable**
  adds the read tracking you met here.


  The doctors case is called **write skew**: two transactions read the same rows, then each
  changes a different one, and together they break a rule. Only serializable catches it.
  The lab's scenario switcher has it.


  Job queues use a cousin of `FOR UPDATE`: `SELECT ... FOR UPDATE SKIP LOCKED LIMIT 1` lets many
  workers each take a different job without waiting. The concurrency chapter builds one.


  Retrying needs care. Retry the whole transaction, a few times, with a short random pause.
  Everything inside it must be safe to run twice, so send emails only after `COMMIT`.
