term: structural typing
aka:
  - structural type system
short: A value fits a type when it has the properties the type asks for, whatever it's called.
explain: |
  A function wants `{ name: string }`. You pass a user with a name, an email and an age. It's
  accepted: it has a `name`, and that's all that was asked for.

  TypeScript compares shapes, not names. Two types with different names but the same shape
  are interchangeable. That's handy, and it also means a `UserId` string and an `OrderId`
  string can be swapped by mistake unless you brand them.
analogy: A job advert that asks "can you drive?". Anyone with a licence qualifies, whatever their job title says.
example:
  language: ts
  code: |
    type Named = { name: string };
    const user = { name: 'Sam', email: 'sam@example.com' };
    function greet(who: Named) {
      return `Hi ${who.name}`;
    }
    greet(user); // fine: user has a name
usage: Structural typing means any object with an id and a title fits, so the test can pass a plain object.
twin:
  term: excess-property-check
  difference: Structural typing accepts extra properties on a value you pass along. The excess property check is the exception for an object literal written in place, where an extra property is probably a typo.
related:
  - excess-property-check
  - interface
level: 2
lessons:
