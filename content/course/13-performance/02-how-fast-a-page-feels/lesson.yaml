id: perf.web-vitals
title: How fast a page feels
objective: Read LCP, INP and CLS in a real report, tell lab data from field data, and stop content jumping as a page loads.
level: essential
minutes: 10
concepts: [perf.core-web-vitals, perf.lab-and-field-data, perf.layout-shift]
prerequisites: [perf.measure-first, html.media-and-head]
opening:
  text: >-
    You'll read the three numbers that say whether a page feels fast, and know which ones
    to believe. Then you'll stop a page from jumping under someone's thumb.

steps:
  - type: prose
    id: three-vitals
    body: >-
      Three numbers, the **Core Web Vitals**, stand for "does this page feel fast".


      **LCP** (Largest Contentful Paint) is when the biggest thing on screen is drawn,
      usually the main image or headline. **INP** (Interaction to Next Paint) is how
      quickly the page answers a tap. **CLS** (Cumulative Layout Shift) scores how much
      content jumps. Good is LCP up to 2.5 s, INP up to 200 ms, CLS up to 0.1.

  - type: multiple-choice
    id: pick-which-vital
    concept: perf.core-web-vitals
    difficulty: 1
    question: A banner loads late and pushes the article down as you read. Which number suffers?
    choices:
      - text: CLS
        correct: true
        feedback: >-
          Right. Content moving after it appeared is exactly what CLS scores.
      - text: LCP
        feedback: >-
          LCP is when the biggest thing is drawn. The trouble here is movement, not lateness.
      - text: INP
        feedback: >-
          INP is about answering a tap. Nobody tapped; the page moved on its own.

  - type: prose
    id: lighthouse
    body: |-
      **Lighthouse** measures one page load and reports the numbers. It's in Chrome's DevTools, under the Lighthouse tab:

      ```text
      Largest Contentful Paint   4.1 s
      Total Blocking Time        620 ms
      Cumulative Layout Shift    0.31
      ```

      Run it on the production build, never the dev server. A dev server sends unminified code with extra checks, so every number comes out wrong.

  - type: multiple-choice
    id: pick-no-inp
    concept: perf.lab-and-field-data
    difficulty: 2
    question: This Lighthouse report has no INP. Why?
    choices:
      - text: Nobody taps anything during its test load
        correct: true
        feedback: >-
          Right. INP needs a real interaction. Total Blocking Time stands in for it.
      - text: The page had no buttons
        feedback: >-
          Even a page full of buttons gets no INP here. Nobody pressed them.
      - text: INP only exists on phones
        feedback: >-
          INP counts clicks, taps and key presses on any device.

  - type: prose
    id: lab-and-field
    body: >-
      Lighthouse gives **lab data**: one controlled load, repeatable, good for finding a
      cause. **Field data** comes from real visits on real phones. It's judged at the
      **75th percentile**, so a slow-but-common visit sets the score.


      PageSpeed Insights shows Chrome's field data for public sites. For your own, the
      small `web-vitals` library reports each visit's numbers from the page.

  - type: fill-blank
    id: fill-report-vitals
    concept: perf.lab-and-field-data
    difficulty: 2
    language: js
    prompt: >-
      Each `on...` function calls you back with a visit's number. Send all three to your
      `/vitals` endpoint. Fill the gaps.
    template: |
      import { onLCP, onINP, onCLS } from "web-vitals";

      function send(metric) {
        const body = JSON.stringify({ name: metric.name, value: metric.value });
        fetch("/vitals", { method: "POST", body });
      }
      onLCP({{1}});
      {{2}}(send);
      onCLS(send);
    blanks:
      - key: '1'
        answer: send
      - key: '2'
        answer: onINP
    bank: [send, 'send()', onINP, onClick, metric]

  - type: ai-review
    id: review-lighthouse-on-dev
    concept: perf.lab-and-field-data
    difficulty: 3
    language: json
    request: Fail CI when the home page's LCP goes over 2.5 seconds.
    flawClass: logic
    code: |
      {
        "ci": {
          "collect": {
            "startServerCommand": "npm run dev",
            "url": ["http://localhost:3000/"]
          },
          "assert": {
            "assertions": {
              "largest-contentful-paint": ["error", { "maxNumericValue": 2500 }]
            }
          }
        }
      }
    prompt: >-
      An assistant wrote this Lighthouse CI config. Now every pull request fails with an LCP
      near 6 seconds, even ones that only change a comment. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It measures the dev server, not the production build
        correct: true
        feedback: >-
          Yes. Build first, then measure what users get, for example with `npm start`.
      - text: 2500 should be written as 2.5
        feedback: >-
          Lighthouse reports LCP in milliseconds, so 2500 is right.
      - text: Lighthouse can't run on localhost
        feedback: >-
          It can. CI starts the server and loads the page from it. The trouble is which server.
    fix: |
      "startServerCommand": "npm run build && npm start",

  - type: prose
    id: reserve-the-space
    body: >-
      Content jumps when something arrives late and takes space nobody saved for it. You
      met the classic case in the HTML chapter: an image with no `width` and `height`.


      A banner, an advert or a late notice does the same. The fix is always to **reserve
      the space** before it arrives. Use sizes in the HTML, or a `min-height` in the CSS.

  - type: playground
    id: fix-jumping-page
    concept: perf.layout-shift
    difficulty: 2
    prompt: >-
      A notice drops in after a second and shoves the story down. Reserve its 48 px with
      `min-height` on `#notice`. Give the photo its `width` and `height` too: 640 by 360.
    html: |
      <div id="notice"></div>
      <h1>Harbour reopens after repairs</h1>
      <img src="harbour.jpg" alt="Boats at the harbour wall">
      <p>The harbour wall is fixed, and boats are back on their moorings.</p>
    css: |
      body { font-family: sans-serif; margin: 16px; }
      .banner { height: 48px; background: #fde68a; }
      img { max-width: 100%; height: auto; background: #cbd5e1; }
    js: |
      setTimeout(() => {
        const banner = document.createElement("div");
        banner.className = "banner";
        banner.textContent = "Ferry times have changed";
        document.querySelector("#notice").append(banner);
      }, 1000);
    editable: [html, css]
    checks:
      - label: '`#notice` keeps 48 px free'
        selector: '#notice'
        style: { property: min-height, value: 48px }
      - label: The photo has a `width`
        selector: img
        attribute: { name: width, value: '640' }
      - label: The photo has a `height`
        selector: img
        attribute: { name: height, value: '360' }
    solution:
      html: |
        <div id="notice"></div>
        <h1>Harbour reopens after repairs</h1>
        <img src="harbour.jpg" alt="Boats at the harbour wall" width="640" height="360">
        <p>The harbour wall is fixed, and boats are back on their moorings.</p>
      css: |
        body { font-family: sans-serif; margin: 16px; }
        .banner { height: 48px; background: #fde68a; }
        img { max-width: 100%; height: auto; background: #cbd5e1; }
        #notice { min-height: 48px; }
    hints:
      - Watch the headline when the notice appears. The empty `#notice` had no height until then.
      - 'A rule for `#notice` with `min-height: 48px` holds the space before the banner lands.'

  - type: explain-back
    id: explain-green-lab-amber-field
    concept: perf.lab-and-field-data
    difficulty: 3
    prompt: >-
      Your Lighthouse score is green, but PageSpeed Insights shows amber field data. A
      teammate wants to trust the green one. What do you tell them?
    rubric:
      - Lighthouse is one controlled load, good for finding and checking a fix.
      - Field data is real visits on real devices, judged at the 75th percentile.
      - Whether users feel the page as fast is a field question, so the amber number decides.
    modelAnswer: >-
      Lighthouse loaded the page once, on one setup, so it can't see the older phone on a
      train. The field data is thousands of real visits, and a quarter of them were slower
      than the amber number. That's what people feel. I'd use Lighthouse to find the cause
      and check the fix, and watch the field number to know it worked.

recap:
  - Read LCP, INP and CLS, and their good lines of 2.5 s, 200 ms and 0.1.
  - Find causes with Lighthouse on a production build, and judge by field data at the p75.
  - Stop content jumping by reserving space for images and anything that arrives late.

recall:
  - id: card-three-vitals
    concept: perf.core-web-vitals
    front: What do LCP, INP and CLS each measure?
    back: >-
      LCP: when the biggest thing is drawn. INP: how fast a tap is answered. CLS: how much
      content jumps.
  - id: card-lab-vs-field
    concept: perf.lab-and-field-data
    front: What is lab data good for, and what is field data good for?
    back: >-
      Lab: a repeatable load for finding and checking a fix. Field: real visits, which say
      whether people feel the speed.
  - id: card-dev-server
    concept: perf.lab-and-field-data
    front: Why run Lighthouse on the production build and not the dev server?
    back: >-
      The dev server sends unminified code with extra checks, so it measures a page no user
      gets.
  - id: card-reserve-space
    concept: perf.layout-shift
    front: How do you stop a late banner from pushing content down?
    back: >-
      Reserve its space before it arrives, for example with `min-height` on its container.

