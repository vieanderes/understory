id: tooling
number: 5
title: Tooling
summary: "The tools every developer uses daily: the terminal, Node, npm and Git, then the build, the checks and the settings that get your code from your laptop to a server."
why: "Every tutorial, job and open-source project assumes you can drive these tools."
youCanBuild: "A project you run with Node, install packages into, save in Git and share for review, with a lint and type-check gate."
concepts:
  - id: tooling.shell
    title: The terminal and the shell
    summary: A terminal is a window where you type commands, and the shell is the program that reads each command and runs it.
  - id: tooling.paths
    title: Files, folders and paths
    summary: A path names a file by the folders you pass through to reach it, and a relative path starts from the folder you're in.
  - id: tooling.pipes-redirection
    title: Pipes and redirection
    summary: A pipe feeds one command's output to the next, and redirection sends output to a file.
  - id: tooling.exit-codes
    title: Exit codes
    summary: A program ends with a number, where 0 means success and anything else means failure.
  - id: tooling.node-runtime
    title: Node
    summary: Node is a program that runs JavaScript outside the browser, so `node app.js` runs a file in the terminal.
  - id: tooling.node-errors
    title: Reading a Node error
    summary: Node prints the error, then a stack trace that names each function still running with its file, line and column.
  - id: tooling.process-env
    title: Environment variables
    summary: An environment variable is a named piece of text a program gets when it starts, read in Node from `process.env`.
  - id: tooling.packages
    title: Packages and npm
    summary: A package is code someone published to the npm registry, and `npm install` downloads it into `node_modules`.
  - id: tooling.package-json
    title: package.json
    summary: The file that names a project, its scripts and the packages it needs to run and to develop.
    confusableWith: [tooling.lockfile]
  - id: tooling.semver
    title: Versions and ranges
    summary: A version is major.minor.patch, and the range `^1.2.3` accepts any later version that keeps the major number 1.
  - id: tooling.lockfile
    title: Lockfiles
    summary: The lockfile records the exact version of every installed package, so every install gets the same code.
    confusableWith: [tooling.package-json]
  - id: tooling.git-commits
    title: Commits
    summary: A commit is a saved snapshot of the project with a message, and the history is the list of those snapshots.
  - id: tooling.staging
    title: The staging area
    summary: "`git add` puts changes in the staging area, and `git commit` saves exactly what is staged."
  - id: tooling.gitignore
    title: .gitignore
    summary: "`.gitignore` lists files Git should never track, such as `node_modules` and `.env`."
  - id: tooling.git-graph
    title: Branches
    summary: A branch is a movable label on one commit, so history forms a graph that splits and joins.
  - id: tooling.merge-rebase
    title: Merging and conflicts
    summary: A merge joins two branches, and when both changed the same lines you choose the result by hand.
  - id: tooling.reflog
    title: Getting work back
    summary: Git records every commit you were on in the reflog, so a commit no branch shows can still be found.
  - id: tooling.remotes
    title: Remotes, push and pull
    summary: A remote is another copy of the repository, often on GitHub, and push and pull move commits to and from it.
  - id: tooling.pull-requests
    title: Pull requests
    summary: A pull request asks to merge a branch, and it is where teammates review the change first.
  - id: tooling.ai-comprehension
    title: Generation then comprehension
    summary: Code from an AI assistant counts as yours only once you can explain and change each line.
  - id: tooling.ai-delegation
    title: What to delegate
    summary: Delegation suits a task whose result you can check, and it costs you the practice that the task would have given.
  - id: tooling.transpiling
    title: Transpiling
    summary: A transpiler rewrites source into JavaScript that the target runtimes accept, for example by removing types or JSX.
    confusableWith: [tooling.bundling]
  - id: tooling.bundling
    title: Bundling and code splitting
    summary: A bundler follows imports from the entry points and joins modules into chunks, starting a new chunk at each dynamic `import()`.
    confusableWith: [tooling.transpiling]
  - id: tooling.tree-shaking
    title: Tree-shaking
    summary: The bundler drops exports that nothing imports, which it can prove only for static ES module syntax in code without side effects.
  - id: tooling.source-maps
    title: Source maps
    summary: A source map links positions in the built file back to the original source, so stack traces and debuggers show your code.
  - id: tooling.linting
    title: Linting
    summary: A linter reads the syntax tree and reports patterns that are likely bugs or break a team rule.
    confusableWith: [tooling.formatting]
  - id: tooling.formatting
    title: Formatting
    summary: A formatter reprints code in one fixed layout and never changes what it does.
    confusableWith: [tooling.linting]
  - id: tooling.type-checking
    title: Type-checking as a gate
    summary: Running the compiler with no output fails the build on a type error before any test runs.
  - id: tooling.ci-parity
    title: Pre-commit and CI parity
    summary: The same checks run before a commit and in CI, so a change that passes locally passes on the server.
  - id: tooling.env-schema
    title: Environment schema
    summary: A schema parses the environment variables once at start-up, so a missing or malformed value stops the process with a clear message.
  - id: tooling.client-bundle-secrets
    title: Secrets and the client bundle
    summary: A variable inlined into client code is public to every visitor, so secrets are read only on the server.
  - id: tooling.build-and-runtime-config
    title: Build-time and runtime configuration
    summary: A build-time value is fixed into the output when it is built, and a runtime value is read when the process starts or serves a request.
