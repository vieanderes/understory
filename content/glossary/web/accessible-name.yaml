term: accessible name
aka: [computed name]
short: The text a screen reader says for a control, taken from its content, its label or aria-label.
explain: |
  "Button" on its own tells a listener nothing. Every control needs a name, like "Save",
  "Search" or "Close dialog". The browser works it out and puts it in the accessibility tree.

  It comes from the element's text, a linked `label`, or `alt` for an image. When there's no
  visible text, as on an icon button, `aria-label` provides it. Start it with the words
  people see, so voice users can say them.
analogy: A name badge at a conference. Without one, people only know you as "a guest".
example:
  language: html
  code: |
    <button>Save</button>                      <!-- name: Save -->
    <button aria-label="Close">×</button>      <!-- name: Close -->
    <label for="q">Search</label>
    <input id="q">                             <!-- name: Search -->
usage: The icon button has no accessible name, so add aria-label="Delete task".
twin:
  term: aria-role
  difference: The accessible name says which control this is, "Delete task". The role says what kind of control it is, a button. A screen reader announces both.
related: [aria-role, form-label, alt-text, accessibility-tree]
level: 2
lessons: [design.accessibility-foundations, design.accessible-widgets]
