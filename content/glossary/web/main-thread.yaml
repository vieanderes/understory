term: main thread
aka: [ UI thread ]
short: The browser's single line of work that runs your scripts, lays out the page and answers input.
explain: |
  A page does many jobs: run JavaScript, work out where everything goes, paint it, and react
  to taps. In the browser most of them share one worker, taking turns.

  So any slow script delays everything else, including input. Work that doesn't touch the page
  can move to a Web Worker, which has its own thread. Animations of `transform` and `opacity`
  can run on the compositor. They stay smooth even while the main thread is busy.
analogy: A one-person kitchen. While the cook chops onions, nobody takes orders.
usage: Move the CSV parsing off the main thread, or the page freezes for two seconds on upload.
related: [ long-task, event-loop, interaction-to-next-paint ]
level: 2
lessons: [perf.cost-of-javascript, perf.graphics-performance, scale.web-workers]
