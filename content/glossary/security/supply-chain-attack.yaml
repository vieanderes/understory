term: supply-chain attack
aka:
  - software supply-chain attack
  - typosquatting
short: An attack that reaches you through code you depend on, such as a package or a build tool.
explain: |
  Your app runs thousands of packages you didn't write. An attacker might take over one, or
  publish a lookalike with a one-letter typo. Their code then runs in every app that
  installs it, often at install time.

  Defend with a lockfile, reviewed updates and pinned versions in CI. Before adding a
  package, check that it exists and is the one you meant. AI assistants sometimes suggest
  packages that don't exist, and attackers register those names.
analogy: Poisoning the flour at the mill. No baker did anything wrong, and every loaf is affected.
usage: That postinstall script phones home, so treat it as a supply-chain attack and pin the previous version.
related:
