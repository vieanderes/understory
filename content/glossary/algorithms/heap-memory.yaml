term: heap memory
aka: [the heap, memory heap, stack and heap]
short: The large pool of memory where objects live for as long as something still refers to them.
explain: |
  A function's local numbers vanish when it returns. But an object you return, store in a
  list or close over must outlive the call. It goes into a big shared pool instead.

  Allocating there is slower than on the call stack, and freeing is someone's job. In C
  it's yours. In JavaScript, Python and Java the garbage collector frees objects once
  nothing can reach them.

  So a "memory leak" in JavaScript is an object something still reaches. Think of a
  forgotten listener, a growing cache or a timer nobody cleared.
analogy: A warehouse next to the workshop. The bench clears at the end of each job; the warehouse keeps things until nobody needs them.
usage: Each request puts a 5 MB buffer in heap memory and the cache keeps them all, so the process grows.
twin:
  term: call-stack
  difference: Heap memory holds objects that outlive a call, freed by the garbage collector. The call stack holds each call's frame, freed the moment the call returns.
related: [call-stack, garbage-collection, binary-heap, closure]
level: 2
lessons: [cs.memory-and-runtimes]
