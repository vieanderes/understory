term: TLS
aka:
  - Transport Layer Security
  - TLS handshake
  - SSL
short: The encryption layer that lets a browser check a server's identity and talk to it privately.
explain: |
  Your request crosses routers you don't own. Without protection, any of them could read
  your password or change the page on its way back.

  Before any HTTP is sent, the two sides run a **handshake**. The server shows a
  certificate signed by an authority the browser trusts, proving it owns the domain.
  Then both agree on fresh keys, and everything after is encrypted and tamper-evident.
  An expired certificate breaks this for every visitor at once, so automate renewal.
analogy: A sealed, signed envelope. The seal shows nobody opened it; the signature shows who sent it.
example:
  language: bash
  code: |
    $ curl -vI https://shop.example 2>&1 | grep -E 'SSL|subject|expire'
    * SSL connection using TLSv1.3
    *  subject: CN=shop.example
    *  expire date: Mar  1 12:00:00 2027 GMT
usage: The TLS certificate expired overnight, so every client refused the connection.
related:
  - http
  - dns
level: 3
lessons:
