deepDive: >-
  **Measured.** Four word-counting jobs in plain Python, on CPython 3.12 on an 8-core
  laptop: 0.90 s one after another, 0.86 s on four threads, and 0.48 s on four processes.
  The processes paid a start-up cost, which is why they weren't four times faster.


  **Free-threaded Python.** Since 3.13 there's an optional build without the GIL, named
  `python3.13t` or `python3.14t`, officially supported from 3.14. Threads there compute in
  parallel. Single-threaded code runs a little slower, and a compiled library without
  support can switch the GIL back on. Check your libraries before you move.


  **NumPy and friends.** Much heavy maths in NumPy runs in compiled code that lets go of
  the GIL, so threads can help there. Measure before you choose. This course's browser
  Python can't start threads at all, which is why this lesson has no code challenge.
