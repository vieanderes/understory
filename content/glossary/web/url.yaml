term: URL
aka:
  - web address
  - uniform resource locator
short: The full address of a resource, from the protocol and host down to the exact page.
explain: |
  To fetch anything, a browser needs to know where it lives and how to ask for it. One
  line of text carries both.

  It has parts, each with a job: the **scheme** (`https`), the **host**
  (`shop.example`), an optional **port**, the **path** (`/shoes/42`), the **query**
  (`?size=40`) and the **fragment** (`#reviews`). The fragment never leaves the browser,
  so the server can't see it. Values in the query must be encoded, or a stray `&` splits
  one value into two.
analogy: A postal address. Country, town, street, house number, and finally "the flat at the back".
example:
  language: text
  code: |
    https://shop.example:8443/shoes/42?size=40&colour=red#reviews
    scheme  host         port path     query               fragment
usage: The share link drops everything after the hash, because that part of the URL never reaches the server.
related:
  - query-string
  - path-parameter
  - dns
level: 1
