term: build or buy
aka:
  - build versus buy
  - build vs buy
  - make or buy
short: The choice between writing a part yourself and paying for an existing product or service.
explain: |
  You need search, payments, email or login. You could write it. Or you could pay someone who
  already has.

  Building looks cheaper because the price is hidden: bugs, security fixes, upgrades and on-call
  for as long as it exists. Buying costs money and control, and ties you to someone else's
  roadmap.

  The question that settles most cases: is this part why people choose you? Build what makes
  you different. Buy the rest, and keep the seam narrow so you could swap it later.
analogy: Baking your own bread versus buying it. Worth it if you're a bakery; otherwise, buy the loaf.
usage: Login isn't what makes us different, so on build or buy it's buy, behind our own adapter.
