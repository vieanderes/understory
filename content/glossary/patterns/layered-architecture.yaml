term: layered architecture
aka: [layering, layers, n-tier architecture]
short: Code split into tiers for input and output, business rules and storage, each calling only the tier below.
explain: |
  A web app does three kinds of work: talking to the outside world, deciding things and
  storing things. Mix them in one handler and a business rule ends up guarding only that one
  route. The CSV import and the nightly job walk straight past it.

  So keep them apart. A thin handler reads the request, calls one domain function and turns
  the result into a status code. The domain holds the rules and knows nothing about HTTP.
  Data access talks to the database. The trap is layers that only pass calls through, which
  add files without adding a boundary.
analogy: A restaurant. Waiters take orders, the kitchen decides how food is made, and the store room holds the stock. Waiters don't cook.
example:
  language: ts
  code: |
    export async function POST(req: Request) {
      const input = parseTransfer(await req.json());
      const result = await transfer(input);
      if (result === 'over-limit') return new Response(null, { status: 422 });
      return Response.json(result);
    }
usage: The admin script walks past the refund check in that route; with layered architecture it would live in the domain.
related: [ports-and-adapters, functional-core, coupling]
level: 2
lessons: [arch.layers]
