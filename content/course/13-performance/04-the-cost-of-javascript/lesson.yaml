deepDive: >-
  Chromium has a built-in way to yield: `await scheduler.yield()`. It lets waiting input run,
  then resumes your task ahead of other queued work. Not every browser has it, so code often
  falls back to the `setTimeout` promise used here.


  Work that doesn't touch the page can leave the main thread entirely, in a **web worker**:
  a script that runs on a thread of its own and sends its results back as messages.


  React can hydrate in pieces. Parts wrapped in `Suspense` hydrate separately, and a part
  someone clicks is hydrated first. Server Components send no JavaScript for the parts that
  never change, so there's less to hydrate at all.


  Throttle the CPU in the Performance panel to see a phone's view. Four times slower is a
  common setting for a mid-range phone.
