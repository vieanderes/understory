summary: >-
  Test-driven development writes the test before the code, in a tight loop: a failing test
  (red), the least code that passes it (green), then a tidy-up with the tests still passing
  (refactor). Each lap takes minutes. The tests become a record of every decision, and the
  code never has a line that no test asked for.


  TDD is a design technique as much as a testing one. Writing the call first makes you
  decide the interface from the caller's side, before the implementation can bend it. The
  steady rhythm of small steps also keeps you out of long stretches where nothing runs and
  you don't know which change broke what.


  It isn't a religion. It pays off where rules are clear and edge cases many: pricing,
  validation, dates, parsers, state machines, bug fixes. It pays off less when you're still
  discovering what to build, such as spiking an unknown API or shaping a layout. These notes
  walk through a full TDD session, the three ways to get to green, using TDD for bug fixes,
  and the two schools you'll hear about in interviews.
remember:
  - TDD is a loop of red, a failing test for the next behaviour, green, the least code that passes, and refactor, tidying while the tests stay green.
  - The red step proves the test can fail and that it fails for the reason you expect, not a typo or a missing import.
  - Triangulation adds a second example to force a general rule where one example could be passed with a constant.
  - A test that passes the moment you write it needs checking, by breaking the code on purpose, because it may not be testing anything new.
  - Fix a bug by first writing a test that reproduces it and fails, then fix the code, so the bug can never return unnoticed.
  - Refactoring changes structure and keeps behaviour, and it's only safe with tests that were green before and stay green after.
  - TDD helps most when the rules are clear and the edge cases many, and least when you're exploring what to build.
  - Classicist TDD tests behaviour with real collaborators where possible, while mockist, or London-style, TDD designs outside-in with mocks for collaborators.
sections:
  - title: A full session, test by test
    body: |-
      A booking system needs `overlaps(a, b)`: do two time slots clash? A slot is a start and
      an end in minutes since midnight, and the end is excluded, so a slot from 9:00 to
      10:00 doesn't clash with one starting at 10:00. Start with a **test list**, a
      scratchpad of cases to cover: far apart, one inside another, touching, partly
      overlapping, either order.

      **Lap 1.** Red: slots hours apart don't clash. Green: `return false`. It looks like
      cheating, and it's the honest minimum.

      **Lap 2.** Red: a slot inside another clashes. `return false` fails. Now you need a real
      rule. The tempting guess is containment, `a.start <= b.start && b.end <= a.end`. It
      passes both tests.

      **Lap 3.** Red: slots that partly overlap clash, whichever comes first. Containment
      fails on `10:30 to 11:30` against `10:00 to 11:00`, because neither slot holds the
      other. The second example ruled out the wrong guess, and the general rule arrives:
      `a.start < b.end && b.start < a.end`.

      **Lap 4.** Red? Touching slots don't clash. The rule already says `false`, so this
      test passes at once. A test that starts green proves nothing yet, so check it can
      fail: change both `<` to `<=` for a moment and watch it go red, then change them back.
      Keep the test, since it pins the boundary.

      ```ts
      import { describe, expect, test } from 'vitest';

      type Slot = { start: number; end: number }; // minutes since midnight, end excluded

      function overlaps(a: Slot, b: Slot): boolean {
        return a.start < b.end && b.start < a.end;
      }

      const at = (start: string, end: string): Slot => {
        const minutes = (hhmm: string) => {
          const [h, m] = hhmm.split(':').map(Number);
          return h * 60 + m;
        };
        return { start: minutes(start), end: minutes(end) };
      };

      describe('overlaps', () => {
        test('slots hours apart do not clash', () => {
          expect(overlaps(at('09:00', '10:00'), at('14:00', '15:00'))).toBe(false);
        });

        test('a slot inside another clashes', () => {
          expect(overlaps(at('09:00', '12:00'), at('10:00', '11:00'))).toBe(true);
        });

        test('slots that partly overlap clash, whichever comes first', () => {
          expect(overlaps(at('10:30', '11:30'), at('10:00', '11:00'))).toBe(true);
          expect(overlaps(at('10:00', '11:00'), at('10:30', '11:30'))).toBe(true);
        });

        test('a slot that starts as another ends does not clash', () => {
          expect(overlaps(at('09:00', '10:00'), at('10:00', '11:00'))).toBe(false);
        });
      });
      ```

      **Refactor.** The `at` helper appeared during lap 1 because raw minutes made the tests
      hard to read. That's refactoring test code, which counts too. The finished suite also
      reads as a specification of what "clash" means, including the touching case a
      reviewer might otherwise argue about.
  - title: Three ways to get to green
    body: |-
      Kent Beck names three strategies for the green step, and good practitioners switch
      between them depending on confidence.

      - **Fake it.** Return a constant that passes, then let the next test force the real
        code. Use it when you're unsure of the general rule, or want to confirm the test
        wiring before writing logic.
      - **Triangulate.** Add a second example that the fake can't pass, so the general
        rule is the only simple way to satisfy both. Laps 2 and 3 above triangulated:
        each new case ruled out a wrong guess.
      - **Obvious implementation.** When the right code is clear, type it. Nobody fakes
        `return a + b`. If an obvious implementation turns red unexpectedly, drop back to
        smaller steps.

      The size of the step is the real control. When things go smoothly, take bigger steps.
      When a test fails in a way you didn't predict, take smaller ones until you understand
      why. Predicting the failure message before you run the red test is a useful habit: if
      you expected "expected false to be true" and got "overlaps is not a function", you've
      learnt something about your setup, not your logic.

      The refactor step is where design happens, and it's the step people skip. Every green
      run is an invitation to remove duplication, rename, and extract a function, while
      the tests guarantee nothing changed. Skip it for a few days and you have green tests
      over code nobody wants to touch. Refactor the tests as well: duplicated setup becomes
      a helper or a `beforeEach`, and unclear names get fixed while the intent is fresh.
  - title: TDD for bug fixes
    body: |-
      Bug fixes are where TDD pays back fastest, even in teams that don't practise it
      anywhere else. The loop becomes: reproduce, red, fix, green.

      A report comes in: a shop page shows a 5p charge as `£0.5`. Before you touch the
      formatter, write the test that captures the report:

      ```ts
      import { expect, test } from 'vitest';

      // The fixed version. The reported one built the text as
      // `£${Math.floor(pence / 100)}.${pence % 100}`.
      function formatPence(pence: number): string {
        const pounds = Math.floor(pence / 100);
        const rest = String(pence % 100).padStart(2, '0');
        return `£${pounds}.${rest}`;
      }

      test('pads single-digit pence to two places', () => {
        expect(formatPence(5)).toBe('£0.05');
        expect(formatPence(1207)).toBe('£12.07');
        expect(formatPence(1200)).toBe('£12.00');
      });

      test('keeps two-digit pence as they are', () => {
        expect(formatPence(1299)).toBe('£12.99');
      });
      ```

      Run the new test against the broken version first and watch it fail with
      "expected '£0.5' to be '£0.05'". That red run proves three things: the test
      reproduces the bug, you understand the cause, and the test will guard against it.
      Then fix the code and watch it pass.

      Skipping the red run is the classic mistake. A test written after the fix and seen
      only green may not exercise the bug at all, perhaps because it uses a price like
      1299 whose pence already have two digits.

      Name the test after the rule, not the ticket. "Pads single-digit pence" still makes
      sense in two years. "Fixes issue 4812" doesn't. And ask the follow-up question: why
      did the suite miss this? Every existing test used prices ending in 10 to 99 pence, so
      the class "0 to 9 pence", whole pounds included, was never tried. That's a gap in the
      equivalence classes, and there may be others like it, such as a negative refund.

  - title: When TDD helps, and the two schools
    body: |-
      TDD works best where you can state the expected result before writing the code:
      business rules, validation, parsing, calculations, state transitions, and algorithms
      with clear inputs and outputs. It also shines when changing risky legacy code, where
      tests written first pin the current behaviour before you move anything.

      It helps less in three situations. **Exploration**: when you don't yet know what the
      API looks like or what the user wants, tests fix decisions you haven't made. Write a
      throwaway **spike** to learn, then delete it and rebuild with tests. **Visual work**:
      whether a layout looks right is judged by eye, though the logic behind it still tests
      well. **Thin glue** over a framework or library, where a test would restate the
      configuration line by line. An integration test covers it better.

      You'll hear of two schools. The **classicist** or Chicago style works from the inside
      out. It tests behaviour through the public interface and uses real collaborators
      wherever they're fast, doubling only slow or external ones. Its tests survive
      refactoring well. The **mockist** or London style works outside in. It starts from the
      top-level behaviour and uses mocks to design the collaborators before they exist, as
      in *Growing Object-Oriented Software, Guided by Tests*. It gives fast feedback on
      interfaces, and its tests are more coupled to how objects talk to each other.

      Most teams mix them: classicist for domain logic, mocks at the edges where a real
      collaborator is a payment provider or an email service. The point in an interview is
      to show you know the trade-off: mocks buy isolation and design feedback, and cost
      tests that break on refactoring.
pitfalls:
  - "**Skipping the red run.** A test never seen failing may be testing nothing, perhaps through a wrong import or a loose matcher. Run it first and read the failure message."
  - "**Writing several tests before any code.** A batch of red tests hides which one each change fixed. Write one failing test, make it pass, then write the next."
  - "**Writing more code than the test demands.** Extra branches have no test behind them. Keep a test list and let the next test earn each branch."
  - "**Skipping the refactor step.** The tests stay green over code that grows worse each lap. Tidy on every green run, including the tests."
  - "**Refactoring while a test is red.** You can't tell whether a failure came from the refactor or the missing feature. Get to green first, then change structure."
  - "**Fixing a bug before reproducing it in a test.** The fix may miss the real cause, and nothing stops the bug returning. Write the failing test first."
  - "**Using TDD to explore.** Tests pin down decisions you haven't made yet. Spike to learn, throw the spike away, then test-drive the real version."
interview:
  - question: Explain TDD and its benefits.
    answer: >-
      TDD is a loop: write one failing test for the next small behaviour, write the least
      code to pass it, then refactor with the tests green. The benefits come from each step.
      The red run proves every test can fail, so the suite isn't full of tests that check
      nothing. Writing the call first makes you design the interface from the caller's side,
      and an awkward API shows up in the test before it spreads. The least-code rule means
      every line exists because a test demanded it, so coverage of real behaviour is high as
      a side effect. And the constant refactoring keeps the code clean because it's always
      safe to change. The cost is time up front and discipline, and it helps less when you're
      exploring an unclear problem.
  - question: When would you not use TDD?
    answer: >-
      When I don't yet know what I'm building. Exploring an unfamiliar API, prototyping a
      product idea or tuning a layout are about learning, and tests would lock in decisions
      I haven't made. There I write a throwaway spike, learn what I need, then delete it and
      build the real version test first, often faster than the spike. I also skip it for
      thin glue code, such as wiring a route to a handler, where a unit test would repeat
      the code; an integration test gives better value. What I don't skip is testing: the
      question is whether tests come first or right after. For bug fixes and business rules
      I always go test first, because there the expected result is known and the red run is
      the proof.
  - question: How do you fix a bug in a TDD style?
    answer: >-
      Reproduce it as a failing test before touching the code. I take the report, find the
      smallest input that shows it, and write a test with the correct expected value, named
      after the rule rather than the ticket. I run it and check it fails with the wrong value
      from the report; that confirms I've understood the cause. Then I fix the code and
      watch the test pass, and run the whole suite to check the fix didn't break a
      neighbour. The test stays as a regression guard. Finally I ask why the suite missed
      it: usually an untested equivalence class, such as prices with fewer than ten pence.
      The trade-off is a few minutes up front, which is far cheaper than the same bug
      reaching production twice.
  - question: What's the difference between classicist and mockist TDD?
    answer: >-
      They differ in what a unit is and how collaborators are handled. Classicists, the
      Chicago school, test a behaviour through its public interface with real collaborators
      wherever those are fast, replacing only slow or external things such as a payment
      provider. The assertions check state and results, so tests survive refactoring.
      Mockists, the London school, work outside in: they start from the top-level behaviour
      and mock each collaborator, discovering its interface through the expectations they
      write. That gives quick design feedback and precise failure locations, but tests
      assert on interactions and break when the internal conversation changes. I lean
      classicist for domain logic and use mocks at architectural boundaries, where the
      interaction itself, such as "an email was sent", is the behaviour.
