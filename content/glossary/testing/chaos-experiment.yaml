term: chaos experiment
aka: [chaos engineering, chaos testing]
short: A planned test that breaks one part of a running system to prove the rest stays healthy.
explain: |
  You believe the site survives losing one database replica. Belief isn't evidence. So you
  remove one, on purpose, while watching.

  Write it down first. Name the steady state you measure and the hypothesis that it holds.
  Name the one fault, who could be hurt, and the condition that stops the run. Start in staging, then a
  small slice of production, and widen only while the hypothesis holds. Don't start here on
  a system whose timeouts have never been tested in a unit test.
analogy: A planned power cut in one wing of a hospital, with engineers standing by, to prove the generators really start.
usage: Let's run a chaos experiment on the queue workers on Thursday, with an abort if checkout errors pass one percent.
related: [fault-injection, blast-radius, slo, observability]
level: 3
lessons: [testing.breaking-it-on-purpose]
