term: starvation
aka: [resource starvation]
short: Waiting work that never gets its turn because other work keeps going ahead of it.
explain: |
  Strict priority sounds fair: urgent jobs first. But if urgent jobs never stop arriving,
  the background jobs wait for ever. Nothing fails and nothing errors. They never run,
  which is worse, because nobody gets told.

  Two cures are common. Ageing raises a job's priority the longer it waits, so it gets a turn
  eventually. A reserved share gives low-priority work, say, one pick in ten whatever is
  waiting. Either way, alert on the age of the oldest waiting job.
analogy: A shop queue where anyone with a loyalty card goes to the front. On a busy day, the rest of us never reach the till.
usage: The nightly reports haven't run since the launch; that's starvation, so reserve them a share of the workers.
related: [priority-queue, noisy-neighbour, queue, deadlock]
level: 3
lessons: [scale.fair-queues]
