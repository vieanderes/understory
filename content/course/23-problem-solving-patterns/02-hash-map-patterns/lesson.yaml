id: algo.hash-map-patterns
title: Hash map patterns
objective: Count, group and look up complements in one pass with Map and Set.
level: essential
minutes: 10
concepts: [algo.frequency-counting, algo.complement-lookup, algo.grouping-by-key]
prerequisites: [algo.approach, cs.arrays-lists-hash-maps]
opening:
  text: >-
    You'll turn three of the most common interview questions into one pass over the data. When
    a brute force compares every pair, a `Map` is usually the way out.

steps:
  - type: prose
    id: picture-hash-maps
    body: |-
      A brute force often compares every item with every other: O(n²). A `Map` removes
      that inner loop. It answers "have I seen this?" and "how many so far?" in O(1) on
      average.

      ```js
      counts.set(vote, (counts.get(vote) ?? 0) + 1);
      ```

      `??` gives the right side when the left is `undefined`, so a first vote counts as 1.

      Signals: "most common", "duplicate", "a pair that adds up to", "group by".

  - type: multiple-choice
    id: spot-map-signal
    concept: algo.frequency-counting
    difficulty: 1
    question: Which task wants a hash map?
    choices:
      - text: Flag any order id that appears twice
        correct: true
        feedback: >-
          Yes. "Have I seen this before?" is one `Map` or `Set` lookup.
      - text: Find the fewest moves between two rooms
        feedback: >-
          Fewest moves is breadth-first search, coming later in this chapter.
      - text: Find where a value would go in a sorted list
        feedback: >-
          Sorted data and a position point at binary search.
      - text: Keep the running total of a bank balance
        feedback: >-
          A running total needs one number, not a map.

  - type: prose
    id: name-counting
    body: |-
      That's **frequency counting**: one pass, a `Map` from value to count. It takes O(n)
      time, and space grows with the number of distinct values.

      Listen for the signal words. "Most common", "appears once", "any duplicates", "same
      letters". Each one is a count in disguise.

  - type: multiple-choice
    id: pick-anagram-check
    concept: algo.frequency-counting
    difficulty: 2
    question: Two words of length n. Which anagram check runs in O(n)?
    choices:
      - text: Count letters in both, then compare counts
        correct: true
        feedback: >-
          Right. Two counting passes and one comparison, all linear.
      - text: Sort both words and compare them
        feedback: >-
          It works, and it's a fine answer. But sorting costs O(n log n).
      - text: For each letter, search the other word
        feedback: >-
          Each search scans up to n letters, n times. That's O(n²).

  - type: prose
    id: name-complement
    body: |-
      Now the classic: find two numbers that add up to a target. For each number `x`, its
      partner is `target - x`. That's its **complement**.

      Keep a `Map` of numbers you've seen, with their positions. Each new number asks one
      question: has my complement already appeared? One pass, O(n).

  - type: code-challenge
    id: write-two-sum
    concept: algo.complement-lookup
    difficulty: 3
    language: python
    starter: pair.starter.py
    solution: pair.solution.py
    tests: pair.tests.py
    twin:
      language: ts
      starter: pair.starter.ts
      solution: pair.solution.ts
      tests: pair.tests.ts
    prompt: >-
      A gift shop offers "two items for exactly your voucher". Write `two_sum(prices,
      target)`, or `twoSum` in TypeScript. Return the positions `[i, j]` of two different
      items that add up to `target`, with `i < j`, or `None` (`null` in TypeScript). Any
      valid pair will do.


      `two_sum([3, 8, 4, 6], 10)` is `[2, 3]`.


      **Target:** O(n) for up to 100,000 prices. The tests include a price that is exactly
      half the target, no pair at all, and a full-size run. Checking every pair runs out of
      time.
    hints:
      - For each price, which other price would complete the pair?
      - 'Keep a map from price to position: a `dict`, or a `Map`. Look up `target - price` before adding the current one.'
      - 'If the complement is stored, return its position and `i`. Otherwise store the price with `i`. Position 0 is a real answer, so check for missing, not for false.'

  - type: ai-review
    id: review-index-of
    concept: algo.complement-lookup
    difficulty: 3
    language: js
    request: Write twoSum(nums, target) that returns the positions of two numbers adding to target.
    flawClass: performance
    code: |
      function twoSum(nums, target) {
        for (let i = 0; i < nums.length; i++) {
          const j = nums.indexOf(target - nums[i]);
          if (j !== -1 && j !== i) {
            return [i, j];
          }
        }
        return [];
      }
    prompt: >-
      An assistant wrote this. Every test with ten numbers passed. On 100,000 numbers with no
      pair, it takes nearly 3 seconds. Tap the line at fault.
    lines: [3]
    reasons:
      - text: '`indexOf` scans the array on every pass'
        correct: true
        feedback: >-
          Yes. A scan inside a loop is O(n²). A `Map` lookup is constant time.
      - text: '`j !== i` makes it check twice'
        feedback: >-
          That check is one comparison, and it stops a number pairing with itself. Keep it.
      - text: The loop should stop halfway
        feedback: >-
          Stopping early would miss pairs. The cost is the scan inside each pass.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A timed run on 100,000 numbers with no pair
          correct: true
          feedback: >-
            Yes. Only a big input shows a scan inside a loop.
        - text: Ten numbers with the pair at the end
          feedback: >-
            Ten numbers scan in no time. Every small test passed, and this one would too.
        - text: A number that is exactly half the target
          feedback: >-
            Good for the `j !== i` check, and it passes. It says nothing about speed.
    fix: |
      function twoSum(nums, target) {
        const seen = new Map();
        for (let i = 0; i < nums.length; i++) {
          const need = target - nums[i];
          if (seen.has(need)) {
            return [seen.get(need), i];
          }
          seen.set(nums[i], i);
        }
        return [];
      }

  - type: prose
    id: name-grouping
    body: |-
      Last pattern. To group things that are "the same" in some way, compute a **key** they
      all share. Then the `Map` does the grouping.

      For anagrams, sort the letters: `listen` and `silent` both become `eilnst`.

      ```js
      const key = word.split('').sort().join('');
      ```

  - type: code-challenge
    id: write-group-anagrams
    concept: algo.grouping-by-key
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: anagrams.starter.py
      solution: anagrams.solution.py
      tests: anagrams.tests.py
    prompt: >-
      A word game shows which of your words use the same letters. Write
      `groupAnagrams(words)`: an array of groups, each holding words made of the same
      letters. Keep groups in the order their first word appears, and words in input order.


      `['tab', 'eat', 'bat', 'tea']` gives `[['tab', 'bat'], ['eat', 'tea']]`.


      **Target:** O(n × k log k) for 100,000 words of up to k letters. The tests include no
      words, repeats and a full-size run. Comparing each word with every group runs out of
      time.
    hints:
      - The last prose screen gives you the key.
      - A `Map` keeps keys in the order they were first added.
      - '`Array.from(groups.values())` turns the groups into an array at the end.'

  - type: explain-back
    id: explain-map-speed
    concept: algo.complement-lookup
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer asks: why does remembering seen prices turn two sum from O(n²) into
      O(n)? And what does it cost in memory?
    rubric:
      - The brute force compares every number with every other one.
      - The Map answers "was my complement seen?" in constant time on average.
      - So each number costs one lookup and one insert, in a single pass.
    modelAnswer: >-
      The brute force checks every pair, which is n² work. With a map, each price only
      asks whether its complement has appeared. A map answers that in constant time on
      average. Each price costs one lookup and one insert, so the pass is O(n) time. The
      trade is O(n) extra memory for the map.

recap:
  - Count with a `Map` when a question hides "how many of each".
  - Find a pair in one pass by looking up each number's complement.
  - Group items by a key they share, such as sorted letters.
recall:
  - id: card-counting
    concept: algo.frequency-counting
    front: Which phrases in a problem hint at frequency counting?
    back: >-
      "Most common", "appears once", "any duplicates" and "same letters". Each asks how many
      of each value there are.
  - id: card-complement
    concept: algo.complement-lookup
    front: In two sum, what does each number look up in the map?
    back: >-
      Its complement, `target - x`. If it's there, the pair is found.
  - id: card-grouping
    concept: algo.grouping-by-key
    front: What key groups anagrams together?
    back: >-
      The word's letters sorted, like `eilnst` for `listen` and `silent`.
  - id: card-two-sum-order
    concept: algo.complement-lookup
    front: Why does two sum add a number to the map after checking, not before?
    back: >-
      So a number can't pair with itself. Target 6 with a single 3 must not match.

references:
  - kind: docs
    title: Hash table cheatsheet for coding interviews
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/algorithms/hash-table/
    note: Counting, lookup and grouping patterns, with practice problems.
    primary: true
    verified: true
  - kind: docs
    title: Map
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map
    note: Insertion order, `has`, `get`, `set` and iteration.
    verified: true

deepDive: >-
  The timings come from Node 24. With 100,000 numbers and no pair, the `indexOf` version
  took 2,818 ms and the `Map` version 9.6 ms.


  The sorted-letters key costs O(k log k) per word of length k. For lowercase letters only,
  a key built from 26 counts is O(k), for example `'1#0#0#…'`. It rarely matters in an
  interview, but it's a nice follow-up to offer.


  Hash lookups are O(1) on average, not in the worst case. Many colliding keys can make
  them slow, which is why some servers use randomised hash functions.


  Spotting a scan inside a loop before it ships is a habit worth building. The lesson Will
  it hold at 10x? turns it into a routine check for any code that loops over growing data.
