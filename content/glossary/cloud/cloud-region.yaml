term: cloud region
aka: [ hosting region, data centre region ]
short: A provider's group of data centres in one part of the world, chosen when you create a resource.
explain: |
  Light takes time to cross the planet. A server on another continent adds a tenth of a second
  to every round trip. That's before your code does anything.

  So you pick where things run. Put compute near its users and, more importantly, near its
  database, because one page may make twenty queries. Data laws may also say where personal
  data must stay. A whole region can fail, which is why critical systems can run in two.
analogy: Choosing which branch of a shop to stock. The one near your customers sells faster.
usage: The app runs in one cloud region and the database in another, so every query crosses an ocean.
twin:
  term: availability-zone
  difference: A cloud region is a geographic area, chosen for latency and law. An availability zone is one separate data centre inside a region, used to survive a building's failure.
related: [ availability-zone, latency, edge-function, single-point-of-failure ]
level: 2
lessons: [ cloud.where-code-runs, cloud.edge ]
