deepDive: >-
  No model was called. The UBL snippet and the splitter ran in Python on made-up
  pages.


  **How a model reads a PDF.** For each page, the API extracts the text layer and renders an
  image. The model gets both. So a scan with an empty text layer
  still gets read, and a page's layout survives. The price is tokens: every page costs text
  tokens plus image tokens. A request takes up to 32 MB and 600 pages, or 100 pages on
  models with a 200k context window. For big jobs, upload once through a Files API and refer
  to the file by id.


  **Citations and schemas don't mix in one call.** Citations point an answer at the page it
  came from. But they can't be combined with structured output in the same request.
  Extract into the schema in one call, and check the values against the text in code, as
  the next lesson does.


  **E-invoice formats.** EN 16931 fixes what an invoice must say. UBL and UN/CEFACT CII are
  two XML syntaxes for it. Hybrid formats such as Factur-X embed the CII XML in a PDF/A-3
  file as an attachment, so a PDF library lists it like any attached file. Validate the XML
  against its schema and rules before booking, as you would any input.


  **Handwriting** is the hardest input. Modern vision models read neat handwriting well,
  but ticked boxes, crossed-out digits and signatures still fail often. Give handwritten
  forms a higher bar for automation, and measure on your own forms.
