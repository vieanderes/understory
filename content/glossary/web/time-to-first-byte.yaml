term: Time to First Byte
aka: [ TTFB ]
short: The wait between asking for a page and receiving the first byte of the server's reply.
explain: |
  Before the browser can draw anything, the reply has to start arriving. Everything before
  that moment counts: DNS, connecting, TLS, and the server thinking.

  A slow one is usually the server's fault. Think of a slow query, a cold start, or rendering
  the whole page first. A CDN, caching and streaming bring it down. Everything else waits on
  it, so it sets the floor for LCP.
analogy: The time between ordering and the waiter saying "coming right up". Nothing else happens until then.
usage: Time to First Byte is 1.8 seconds from Asia, because every request crosses to our one region.
related: [ latency, cdn, streaming, largest-contentful-paint, cold-start ]
level: 2
lessons: [ perf.web-vitals, perf.backend-performance ]
