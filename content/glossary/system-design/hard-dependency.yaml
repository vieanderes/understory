term: hard dependency
aka: [critical dependency, blocking dependency]
short: A service whose failure makes your own request fail too.
explain: |
  Your checkout calls payments, stock and email. If payments is down, checkout can't work.
  That's a hard dependency. If email is down, you can queue the receipt and carry on.
  That's a soft one.

  Availabilities multiply. Three hard dependencies at 99.9% each leave you near 99.7%
  before your own faults. So make every dependency you can optional, with a timeout and a
  fallback.
analogy: A car's engine is hard, its radio is soft. One breaks the journey, the other only makes it quieter.
usage: Recommendations shouldn't be a hard dependency of the product page; render without them on timeout.
related: [single-point-of-failure, timeout, fallback, circuit-breaker]
level: 2
lessons: [sysdesign.the-method]
