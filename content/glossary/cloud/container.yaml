term: container
aka: [Docker container, containerised app, containerized]
short: An app running as an isolated process with its own files and settings, sharing the host's kernel.
explain: |
  "It works on my machine" happens because machines differ: another Node version, a missing
  library. Package the app with everything it needs and run it the same way everywhere.

  It is a running copy of an image. The kernel keeps it apart from other processes, with
  its own filesystem, network and limits on CPU and memory. It starts in about a second,
  because no operating system boots. Anything written inside is lost when it is replaced,
  so data goes in a volume or a database.
analogy: A shipping container. The crane doesn't care what's inside; every port handles it the same way.
example:
  language: bash
  code: |
    docker run --rm -p 8080:8080 -e PORT=8080 shop-api:1.4.2
usage: The container restarts every few minutes; its memory limit is lower than the app needs.
twin:
  term: virtual-machine
  difference: A container shares the host's kernel and starts in a second. A virtual machine runs its own whole operating system on virtual hardware, so it is heavier and more isolated.
related: [virtual-machine, container-image, container-orchestration, stateless]
level: 1
lessons: [cloud.containers]
