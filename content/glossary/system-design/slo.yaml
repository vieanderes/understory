term: SLO
aka: [service level objective]
short: A target for how reliable a service should be, like 99.9% of requests succeeding within 300 ms.
explain: |
  "Fast and reliable" can't be measured. A number can. You pick something users feel, such
  as the share of checkout requests that succeed quickly, and set a target over a window,
  often 30 days.

  The measurement itself is the **SLI**. The gap between the target and 100% is the
  **error budget**: 99.9% over 30 days allows about 43 minutes of failure. While budget
  remains, ship freely. When it's spent, slow down and fix reliability. Alerting on how
  fast the budget burns beats alerting on every spike.
analogy: A bus company promising that 95% of buses arrive within five minutes of the timetable. Not perfect, but a number you can check and plan around.
usage: We've burnt half the month's SLO budget on the search outage, so the redesign waits until next sprint.
related: [percentile, observability, latency]
level: 2
lessons: [sysdesign.slos-and-telemetry]
