    verified: true

deepDive: >-
  All numbers are from Node 24 on one laptop, with `node --expose-gc` so the script could call
  `global.gc()`. You'd never call it in production. The collector runs on its own, when the
  young area fills. Two million small objects took the heap from 4 MB to 113 MB, and back to
  4 MB once unreachable. Ten cached arrays held 84 MB through a collection.


  V8's collector is generational. Most objects die young, so new ones are checked often and
  cheaply. Survivors move to an older area that's checked less.


  "Numbers on the stack, objects on the heap" is the model, not the law. V8 keeps small
  whole numbers inside the reference itself, and boxes other numbers on the heap. It can also
  keep an object off the heap entirely, when it proves the object never leaves its function.
  The model still predicts behaviour correctly: numbers act copied, objects act shared.


  The pipeline has four tiers today: the Ignition interpreter, the Sparkplug baseline
  compiler, then Maglev and TurboFan, which optimise. Running with `--trace-opt` showed `total`
  marked "hot and stable" for Maglev, then TurboFan. The names and tiers change between V8
  versions, so treat them as a snapshot. With `node --jitless`, which interprets only, 20,000
  runs took 379 ms against 16 ms.


  Machine code from the JIT assumes what it saw, such as "`prices` holds whole numbers". If
  that turns false, V8 deoptimises: it drops the fast code and goes back to the interpreter.
  For a test we set one price to `null`. `--trace-deopt` printed "deoptimizing
  total, reason: wrong map". The next 100 runs took 2.2 to 2.8 ms, against 0.1 ms. Later runs
  settled between the two, and varied a lot from run to run.
