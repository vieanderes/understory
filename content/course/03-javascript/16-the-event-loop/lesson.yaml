id: js.event-loop
title: The event loop
objective: Explain why a long task freezes the page, and order timers, promise callbacks and painting.
level: essential
minutes: 10
concepts: [js.event-loop, js.tasks, js.microtasks, js.rendering-steps]
prerequisites: [js.promises, js.dom-events]
opening:
  text: >-
    You'll know why a page freezes, and why a spinner you showed never turned up. Then you'll
    fix it, so a slow job no longer locks people out.

steps:
  - type: prose
    id: one-thing-at-a-time
    body: >-
      JavaScript in a page does one thing at a time. While one function runs, nothing else
      does: no other code, no clicks, no redrawing.


      A quick click handler is fine. A slow one freezes the whole page, and anything that
      happens meanwhile has to wait until it ends. Try it on the next screen.

  - type: playground
    id: see-the-freeze
    prompt: >-
      Press Sort. The spinner should say "Sorting" while it works. Does it ever show? Press
      Taps during the sort too, and watch when the count changes.
    html: |
      <button id="sort">Sort the rows</button>
      <p id="spinner" hidden>Sorting...</p>
      <p id="message">Not sorted yet</p>
      <button id="tap">Taps: 0</button>
    js: |
      const spinner = document.querySelector("#spinner");
      const message = document.querySelector("#message");
      const tap = document.querySelector("#tap");
      let taps = 0;
      tap.addEventListener("click", () => { taps++; tap.textContent = "Taps: " + taps; });
      function sortSlowly() {
        const start = Date.now(); // the time now, in milliseconds
        while (Date.now() - start < 1500) {} // 1.5 seconds of pretend sorting
        spinner.hidden = true;
        message.textContent = "Sorted";
      }
      document.querySelector("#sort").addEventListener("click", () => {
        spinner.hidden = false;
        sortSlowly();
      });

  - type: prose
    id: paint-between-tasks
    body: >-
      Each piece of queued work is a **task**: running a script, one click handler, one timer
      callback. A task runs to the end before the next one starts.


      Changing the DOM isn't drawing it. The browser **paints**, turning the DOM into pixels,
      between tasks. Your handler showed the spinner and hid it again inside one task, so no
      paint ever saw it.

  - type: bug-hunt
    id: hunt-note-never-shows
    concept: js.rendering-steps
    difficulty: 2
    language: js
    code: |
      // <button id="save">Save</button> <p id="note" hidden>Saving</p>
      saveButton.addEventListener("click", () => {
        note.hidden = false;
        compressPhotos(); // takes 2 seconds
        note.hidden = true;
      });
    prompt: >-
      Bug report: "I press Save and the page freezes. The Saving note never shows." Tap the line
      that causes it.
    lines: [4]
    reasons:
      - text: The slow work runs before any paint can happen
        correct: true
        feedback: >-
          Right. The note is shown and hidden again before the browser gets to paint.
      - text: Setting `hidden` doesn't change the page
        feedback: >-
          It does change the DOM at once. The pixels wait for a paint, and none comes until the
          task ends.
      - text: Line 5 runs before the photos finish
        feedback: >-
          Line 5 waits for `compressPhotos` to return. The trouble is that nothing paints in
          between.

  - type: prose
    id: stack-and-queues
    body: >-
      Promise callbacks get a faster lane. `promise.then(fn)` runs `fn` once the promise
      settles. That waiting code is a **microtask**, and so is the rest of an async function
      after `await`.


      Microtasks run as soon as the current task ends, all of them, before the next task. A
      timer's callback is a task, so it waits its turn, even at 0 ms. `Promise.resolve()` makes
      a promise that's already fulfilled.
    figure:
      id: event-loop
      caption: The timer asked for 0 ms, yet the promise callback runs first. The loop empties the microtask queue before it takes the next task.

  - type: lab
    id: lab-event-loop-stepper
    concept: js.microtasks
    lab: event-loop-stepper
    intro: >-
      Step through the program one operation at a time. The call stack lists the functions
      running right now, newest on top. Before each step, say which callback moves next.
    preset:
      scenario: classic
      value: 0
    checkpoint:
      question: '`script finished` has logged. What logs next?'
      difficulty: 2
      choices:
        - text: The promise callback, `seat confirmed`
          correct: true
          feedback: >-
            Right. The script's task is over, so the microtask runs before any new task.
        - text: The timer callback, `hold expired`
          feedback: >-
            It was queued first, but it's a task. Every microtask runs before the next task.
        - text: Nothing, because the script has ended
          feedback: >-
            Both callbacks are still queued. The loop picks them up once the script's task ends.
    fallback:
      type: predict-output
      id: predict-after-script
      concept: js.microtasks
      difficulty: 2
      language: js
      code: |
        const sendReceipt = () => console.log("receipt sent");
        const updateTotal = () => console.log("total updated");
        setTimeout(sendReceipt, 0);
        Promise.resolve().then(updateTotal);
        console.log("order placed");
      question: '`order placed` logs first. What logs next?'
      choices:
        - text: '`total updated`'
          correct: true
          feedback: >-
            Right. The promise callback is a microtask, so it runs before the next task.
        - text: '`receipt sent`'
          feedback: >-
            It was queued first, but a timer callback is a task. Microtasks go before it.
        - text: Nothing, because the script has ended
          feedback: >-
            Both callbacks are still queued. They run once the script's task ends.

  - type: prose
    id: give-it-a-frame
    body: >-
      Here's the catch. A 0 ms timer often fires before the next paint, so
      `setTimeout(sortSlowly, 0)` alone may still hide the spinner.


      `requestAnimationFrame(fn)` runs `fn` right before the next paint. Start the timer from
      inside it, and the slow work begins after that paint. For really long work, split it into
      chunks with a timer between them, so clicks get a turn too.

  - type: ai-review
    id: review-promise-spinner
    concept: js.rendering-steps
    difficulty: 3
    language: js
    request: Make the Sorting spinner show while the rows sort.
    flawClass: logic
    code: |
      sortButton.addEventListener("click", () => {
        spinner.hidden = false;
        // Let the browser paint the spinner before the slow sort.
        Promise.resolve().then(sortSlowly);
      });
    prompt: >-
      A coding assistant suggested this. You press Sort, and the spinner still never shows.
      Tap the line that fails at its job.
    lines: [4]
    reasons:
      - text: A promise callback also runs before the paint
        correct: true
        feedback: >-
          Right. It's a microtask, so it runs before the browser gets to paint.
      - text: It should be `then(sortSlowly())`, with brackets
        feedback: >-
          That would call `sortSlowly` at once, inside the click's task. `then` needs the
          function itself.
      - text: '`then` only works on promises from a server'
        feedback: >-
          Any promise has `then`. The trouble is when its callback runs, not whether it runs.
    fix: |
      sortButton.addEventListener("click", () => {
        spinner.hidden = false;
        // A timer started from the next frame runs after the paint.
        requestAnimationFrame(() => setTimeout(sortSlowly, 0));
      });

  - type: code-challenge
    id: write-handle-in-chunks
    concept: js.tasks
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      A photo app tags 10,000 photos after a click. In one go, the page freezes.


      Write `handleInChunks(items, size, handle)`. Call `handle(item)` for every item, in
      order, `size` items at a time. After each chunk, wait for a timer, so other tasks can
      run. This line waits for one: `await new Promise((resolve) => setTimeout(resolve, 0));`


      Example: with a timer already waiting, `handleInChunks([1, 2, 3, 4], 2, log)` logs 1, 2,
      then the timer's line, then 3, 4.
    hints:
      - The starter handles every item in one loop, with no wait between chunks.
      - >-
        `slice(start, start + size)` gives one chunk. Move `start` forward by `size` each
        turn.
      - >-
        Start with `for (let start = 0; start < items.length; start += size) {`, handle the
        chunk, then put the waiting line.

  - type: explain-back
    id: explain-missing-spinner
    concept: js.event-loop
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: |-
      ```js
      sortButton.addEventListener("click", () => {
        spinner.hidden = false;
        sortRows(); // takes 2 seconds
        spinner.hidden = true;
      });
      ```

      The spinner never appears during the sort. Why, and why wouldn't a promise callback help?
    rubric:
      - The browser paints between tasks, and the whole listener is one long task.
      - By the time the task ends the spinner is hidden again, so no paint ever shows it.
      - A promise callback is a microtask, which also runs before the paint. Only a later task, after a frame, lets it paint.
    modelAnswer: >-
      Showing the spinner only changes the DOM. Pixels change when the browser paints, which
      happens between tasks. The listener shows the spinner, sorts for two seconds and hides
      it again, all in one task. A promise callback wouldn't help, because microtasks also run
      before the paint. The sort has to start in a later task, after a frame, or run in chunks.

recap:
  - Explain why one long task freezes clicks and painting.
  - Order a script, its promise callbacks and its timers.
  - Let the page paint first, and split long work into chunks.

recall:
  - id: card-loop-order
    concept: js.event-loop
    front: What happens between one task and the next?
    back: >-
      The task runs to the end, then microtasks run until none are left. The browser paints
      when it next gets the chance.
  - id: card-task-or-microtask
    concept: js.tasks
    front: Which are tasks, and which are microtasks?
    back: >-
      Scripts, clicks and timer callbacks are tasks. `then` callbacks and the code after an
      `await` are microtasks.
  - id: card-timer-zero
    concept: js.rendering-steps
    front: Why can `setTimeout(work, 0)` still hide a spinner you've shown?
    back: >-
      A 0 ms timer often runs before the next paint. Start it inside `requestAnimationFrame`,
      so a paint comes first.
  - id: card-raf-timing
    concept: js.rendering-steps
    front: When does a `requestAnimationFrame` callback run?
    back: >-
      Right before the browser works out styles and paints, at its next chance to draw a frame.

