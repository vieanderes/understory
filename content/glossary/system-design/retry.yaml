term: retry
aka:
  - retries
  - retry with backoff
short: Trying a failed request again, usually after waiting a little longer each time.
explain: |
  Many failures are brief: a dropped connection, a busy server. Trying again often works.

  Waiting longer between tries (**exponential backoff**) and adding a random wobble
  (**jitter**) stops thousands of clients from retrying at the same instant. Only retry what
  is safe to repeat, and give up after a few tries.
analogy: Redialling a busy number, but waiting a bit longer each time instead of hammering the button.
example:
  language: js
  code: |
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        return await send();
      } catch {
        await sleep(2 ** attempt * 100 + Math.random() * 100);
      }
    }
usage: Add a retry with jitter, or every client hammers the API the second it comes back.
