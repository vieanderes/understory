id: perf.graphics-performance
title: Smooth animation
objective: "Animate with `requestAnimationFrame` and the time between frames, move things with `transform`, and stop a loop from forcing layout again and again."
level: advanced
minutes: 10
concepts: [perf.render-loop, perf.compositor-animation, perf.layout-thrashing]
prerequisites: [perf.cost-of-javascript, css.transitions]
opening:
  text: >-
    You'll make a menu slide without a stutter, even on a slow phone. And you'll spot the
    loop that makes a page lay itself out a thousand times.

steps:
  - type: prose
    id: frames
    body: >-
      A screen shows a new picture about 60 times a second, called 60 Hz. Each picture is a
      **frame**. So the browser has about 16.7 ms per frame for your code, the styles, the
      layout and the paint.


      If a frame isn't ready in time, the screen shows the old one again. Motion then
      stutters, which developers call **jank**.

  - type: multiple-choice
    id: pick-thirty-ms
    concept: perf.render-loop
    difficulty: 1
    question: An animation's code takes 30 ms every frame on a 60 Hz screen. What do people see?
    choices:
      - text: It stutters, at about half the frames
        correct: true
        feedback: >-
          Right. We measured frames 33.3 ms apart: every other refresh is missed.
      - text: Smooth motion, only slower
        feedback: >-
          The screen can't wait for you. Missed refreshes show the old frame, so it jerks.
      - text: The page freezes until the animation ends
        feedback: >-
          Each frame still arrives, only every other refresh. Taps wait a little, not forever.

  - type: prose
    id: render-loop
    body: |-
      You met `requestAnimationFrame(fn)`: it runs `fn` right before the next paint, and passes it the time in milliseconds. Asking again from inside `fn` makes a **render loop**:

      ```js
      function frame(now) {
        ball.x = ball.x + 4; // 4 px per frame
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      ```

      The catch: frames come less often on a slow or busy device, and more often on a 120 Hz screen. Per-frame movement changes speed. Move by the time passed instead.

  - type: fill-blank
    id: fill-delta-time
    concept: perf.render-loop
    difficulty: 2
    language: js
    prompt: Move the ball 240 px per second, however often frames come. Fill the gaps.
    template: |
      let last = performance.now();
      function frame(now) {
        const seconds = (now - {{1}}) / 1000;
        last = {{2}};
        ball.x = ball.x + 240 * {{3}};
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    blanks:
      - key: '1'
        answer: last
      - key: '2'
        answer: now
      - key: '3'
        answer: seconds
    bank: [last, now, seconds, frame, '60', '4']

  - type: prose
    id: what-each-property-costs
    body: >-
      What you animate matters. Change `left`, `top` or `width`, and every frame redoes
      layout and paint. We slid a menu with `left` for one second: 61 layouts.


      `transform` and `opacity` are different. The browser paints the menu once, then the
      **compositor**, the step that puts painted layers together, only moves it. The same
      slide with `transform`: 0 layouts.

  - type: playground
    id: slide-with-transform
    concept: perf.compositor-animation
    difficulty: 3
    prompt: >-
      The menu slides by animating `left`. Keep `left: 0`, hide it with `transform:
      translateX(-100%)`, show it with `translateX(0)`, and transition `transform` instead.
    html: |
      <button id="menu">Menu</button>
      <nav class="drawer">
        <a href="#">Home</a>
        <a href="#">Timetable</a>
      </nav>
    css: |
      button { float: right; }
      .drawer {
        position: fixed; top: 0; left: -272px; width: 240px; height: 100%;
        padding: 16px; background: #e0f2fe;
        transition-property: left;
        transition-duration: 0.3s;
      }
      .drawer.open { left: 0; }
      .drawer a { display: block; padding: 8px 0; }
    js: |
      document.querySelector("#menu").addEventListener("click", () => {
        document.querySelector(".drawer").classList.toggle("open");
      });
    editable: [css]
    checks:
      - label: The menu sits at `left` 0
        selector: .drawer
        style: { property: left, value: 0px }
      - label: The transition animates `transform`
        selector: .drawer
        style: { property: transition-property, value: transform }
    solution:
      css: |
        button { float: right; }
        .drawer {
          position: fixed; top: 0; left: 0; width: 240px; height: 100%;
          padding: 16px; background: #e0f2fe;
          transform: translateX(-100%);
          transition-property: transform;
          transition-duration: 0.3s;
        }
        .drawer.open { transform: translateX(0); }
        .drawer a { display: block; padding: 8px 0; }
    hints:
      - Press Menu to watch the slide. Three lines in the CSS mention `left`.
      - 'The closed menu gets `transform: translateX(-100%)`, and `.drawer.open` gets `translateX(0)`.'

  - type: prose
    id: layout-thrashing
    body: >-
      Reading a size, such as `offsetWidth`, needs an up-to-date layout. If a style has
      changed since, the browser must lay out the page right then, to answer. That's a
      **forced layout**.


      In a loop that writes, then reads, then writes again, it happens every time round.
      That's **layout thrashing**. The fix: do all the reads first, then all the writes.

  - type: ai-review
    id: review-thrashing-loop
    concept: perf.layout-thrashing
    difficulty: 3
    language: js
    request: Make every card a third of the container's width.
    flawClass: performance
    code: |
      const cards = document.querySelectorAll(".card");

      for (const card of cards) {
        card.style.width = container.offsetWidth / 3 + "px";
      }
    prompt: >-
      An assistant wrote this. With 10 cards it's instant. With 1,000 it took 190 ms in
      Chromium, and the page hung. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Each read after a write forces a fresh layout
        correct: true
        feedback: >-
          Yes. Read `offsetWidth` once, before the loop. We measured 2.5 ms.
      - text: '`querySelectorAll` is slow for 1,000 cards'
        feedback: >-
          It runs once and finds them quickly. The cost is inside the loop.
      - text: Setting `style.width` repaints each card at once
        feedback: >-
          Painting waits for the frame. The forced layout from the read is what repeats.
    verify:
      question: 'How would you prove the fix in a browser?'
      choices:
        - text: 'A Performance profile shows one layout, not 1,000'
          correct: true
          feedback: >-
            Yes. The profile counts the forced layouts directly.
        - text: 'The cards come out a third wide'
          feedback: >-
            They did before the fix too. The widths were right; the cost was hidden.
        - text: 'It feels instant with 10 cards'
          feedback: >-
            It felt instant before as well. Ten forced layouts are too cheap to notice.
    fix: |
      const cards = document.querySelectorAll(".card");
      const width = container.offsetWidth / 3; // one read

      for (const card of cards) {
        card.style.width = width + "px"; // then only writes
      }

  - type: explain-back
    id: explain-janky-menu
    concept: perf.compositor-animation
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A slide-in menu is smooth on your laptop and stutters on a phone. What would you check,
      and what would you change?
    rubric:
      - Each frame has about 16.7 ms, and a slow phone misses frames when the work is heavy.
      - Animating `left` or `width` redoes layout and paint every frame.
      - Animate `transform` or `opacity` instead, so the compositor moves the painted menu.
    modelAnswer: >-
      At 60 Hz every frame gets about 16.7 ms, and a phone does the same work much more
      slowly. I'd check which property animates. If it's `left` or `width`, every frame lays
      out and paints the page again. I'd animate `transform` instead, which the compositor
      can move without layout or paint.

recap:
  - Keep each frame's work well under 16.7 ms, and move things by the time passed.
  - "Animate `transform` and `opacity`, never `left`, `top` or `width`."
  - Read sizes before a loop and only write inside it, so layout runs once.

recall:
  - id: card-frame-budget
    concept: perf.render-loop
    front: How long does each frame have at 60 Hz?
    back: >-
      About 16.7 ms, for your code, the styles, layout and paint together.
  - id: card-delta-time
    concept: perf.render-loop
    front: Why move an object by the time passed, not by a fixed amount per frame?
    back: >-
      Frames come more or less often on different devices, so a per-frame step changes the
      speed.
  - id: card-transform
    concept: perf.compositor-animation
    front: Why animate `transform` rather than `left`?
    back: >-
      `left` redoes layout and paint every frame. `transform` lets the compositor move what's
      already painted.
  - id: card-thrashing
    concept: perf.layout-thrashing
    front: What causes layout thrashing, and how do you fix it?
    back: >-
      Reading a size right after each style change. Do all the reads first, then all the
      writes.

references:
  - kind: spec
    title: 'HTML Standard: animation frames'
    authors: WHATWG
    venue: WHATWG
    url: https://html.spec.whatwg.org/multipage/imagebitmap-and-animations.html#animation-frames
    note: When `requestAnimationFrame` callbacks run, and the time they receive.
    primary: true
    verified: true
  - kind: docs
    title: How to create high-performance CSS animations
    authors: Kayce Basques and Rachel Andrew
    venue: web.dev
    url: https://web.dev/articles/animations-guide
    note: Why `transform` and `opacity` animate without layout or paint.
    verified: true
  - kind: docs
    title: Avoid large, complex layouts and layout thrashing
    authors: Jeremy Wagner, Paul Lewis and Barry Pollard
    venue: web.dev
    url: https://web.dev/articles/avoid-large-complex-layouts-and-layout-thrashing
    note: Forced layouts, and reading before writing.
    verified: true
  - kind: essay
