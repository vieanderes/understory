term: self-hosting
aka: [ self-hosted, running your own servers ]
short: Running an app on servers you manage yourself, instead of on a platform that runs it for you.
explain: |
  A managed platform handles the servers, scaling and CDN for a price and on its rules.
  Running the app yourself gives you control and a predictable bill, and gives you the chores.

  For Next.js this means `next build` then `next start`, or the standalone output in a
  container. The traps come with more than one copy. Each instance has its own memory cache,
  so a refresh on one doesn't reach the others.
analogy: Cooking at home instead of eating out. Cheaper and your way, and you do the washing-up.
example:
  language: bash
  code: |
    pnpm build
    PORT=3000 HOSTNAME=0.0.0.0 pnpm start
usage: If we go self-hosting, someone has to own patching, backups and the shared cache.
twin:
  term: managed-platform
  difference: Self-hosting means you run the servers and their chores. A managed platform runs them for you, in exchange for its limits and its prices.
related: [ managed-platform, standalone-output, container, horizontal-scaling ]
level: 2
lessons: [ nextserver.deploying, cloud.hosting-models ]
