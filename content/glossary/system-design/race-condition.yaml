term: race condition
aka: [ race, check-then-act ]
short: A bug where the result depends on which of two overlapping actions happens to finish first.
explain: |
  Two people book the last seat at the same moment. Both check, both see it's free, both
  book. The check and the booking were two steps, and the other person slipped in between.

  Such bugs are rare in testing and common under load, which makes them hard to reproduce.
  The fix is to make the check and the change one step that can't be interrupted: a unique
  constraint, an atomic `UPDATE ... WHERE`, a lock, or a version check. More `await` or a
  short sleep only hides it.
analogy: Two flatmates each seeing the milk is low and each buying a bottle on the way home.
example:
  language: ts
  code: |
    // two requests can both pass the check before either inserts
    const taken = await db.seatIsTaken(seatId);
    if (!taken) await db.bookSeat(seatId, userId);

    // one step: the database refuses the second booking
    // INSERT ... ON CONFLICT (seat_id) DO NOTHING
usage: It's a race condition; two clicks within 50 ms both pass the stock check.
twin:
  term: deadlock
  difference: In a race condition everything runs, but in an order that gives the wrong answer. In a deadlock nothing runs, because each side waits for the other.
related: [ lost-update, deadlock, concurrency, idempotent, effect, thread ]
level: 2
lessons: [scale.race-conditions, react.fetching-data, agents.agent-as-a-system]
