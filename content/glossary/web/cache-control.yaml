term: Cache-Control
aka:
  - caching headers
  - max-age
short: The response header that tells browsers and shared caches whether and how long to keep a copy.
explain: |
  Fetching the same logo on every page wastes everyone's time. So the server says, with
  each response, how long a copy stays good. Until then the browser reuses it without
  asking.

  The words are often mixed up. `max-age=N` keeps a copy fresh for N seconds. `no-cache`
  means store it but check with the server before each use. `no-store` means never keep
  it. `private` keeps it out of shared caches, which matters for anything that differs
  per signed-in user: get that wrong and a CDN serves one person's page to another.
analogy: The use-by date on milk. Before it, you pour without thinking; after it, you sniff first.
example:
  language: http
  code: |
    # hashed files never change
    Cache-Control: public, max-age=31536000, immutable
    # the page that names them
    Cache-Control: no-cache
    # an account page
    Cache-Control: private, no-store
usage: The account page went out with public Cache-Control, so the CDN showed one user's details to the next.
related:
