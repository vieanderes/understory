id: ai
number: 20
title: AI engineering
summary: "Language models as a component you engineer around, in Python: how they write, prompts and context, structured output, tools, retrieval, agents, evals, failures, cost and security."
why: "A language model is a component that can be wrong in new ways, and most of the work is the code around it."
youCanBuild: "A support assistant that answers from your own documents with citations, uses tools through checked code, survives rate limits, and is gated by an eval suite."
concepts:
  - id: ai.tokens
    title: Tokens and the generation loop
    summary: A model writes one token at a time in a loop, and a tokeniser splits text into those sub-word pieces. Prices, limits and context are all counted in tokens.
  - id: ai.sampling
    title: Sampling and temperature
    summary: The model gives every possible next token a probability and one is drawn, so the same prompt can give different answers. Temperature makes the draw more or less adventurous.
  - id: ai.training-stages
    title: Training stages
    summary: Pre-training teaches a base model to continue text. Post-training, from example conversations and people's rankings, turns it into an assistant that answers.
  - id: ai.system-prompts
    title: System prompts and conversations
    summary: The app resends the whole conversation on every call, and the system prompt carries the task, the rules and the exact output format for every turn.
  - id: ai.few-shot
    title: Few-shot examples
    summary: Worked examples in the prompt show the pattern wanted, and the model copies their format and their flaws.
  - id: ai.context-window
    title: The context window
    summary: A model reads a fixed number of tokens per call, shared by the system prompt, the messages and the reply, so the app chooses what to send.
  - id: ai.structured-output
    title: Structured output
    summary: The model is asked, or constrained, to reply with JSON that matches a schema, so code can read the answer.
  - id: ai.output-validation
    title: Validating model output
    summary: "Model output is untrusted input: it is parsed and checked against a schema, and a bad reply is retried once with the error or rejected."
  - id: ai.tool-use
    title: Tool use
    summary: The model replies with a request to call a named tool with arguments. Your code runs it, checks it, and sends the result back; the model never runs anything itself.
    confusableWith: [ai.agents]
  - id: ai.tool-definitions
    title: Tool definitions
    summary: A tool has a name, a description that says when to use it, and a JSON Schema for its arguments, and the description decides whether the model picks it well.
  - id: ai.hallucination
    title: Hallucination
    summary: The model produces fluent text that is false or unsupported, since it generates likely tokens and does not look facts up.
  - id: ai.flaw-classes
    title: Flaw classes in generated code
    summary: "Generated code fails in recurring ways: invented APIs, missing edge cases, insecure defaults, silent error handling and tests that assert nothing."
  - id: ai.review-checklist
    title: Review checklist
    summary: A fixed list of questions, applied to every generated change, catches what reading for plausibility misses.
  - id: ai.embeddings
    title: Embeddings
    summary: An embedding model turns text into a vector, a list of numbers, so that texts with similar meaning get similar vectors.
  - id: ai.cosine-similarity
    title: Cosine similarity
    summary: Two vectors are compared by the angle between them, from 1 for the same direction down to 0 for unrelated, and code computes it.
  - id: ai.vector-search
    title: Vector search
    summary: A question's vector is compared with every stored vector, or with an approximate index for millions, and the closest texts come back.
    confusableWith: [ai.hybrid-search]
  - id: ai.chunking
    title: Chunking
    summary: Documents are split into passages small enough to embed precisely and large enough to keep their meaning, often with some overlap.
  - id: ai.hybrid-search
    title: Hybrid search
    summary: Keyword search and vector search are combined, so exact terms such as codes and names match as well as paraphrases.
    confusableWith: [ai.vector-search]
  - id: ai.rag
    title: Retrieval-augmented generation
    summary: Relevant passages are retrieved at question time and put in the prompt, so the answer draws on them and not on the model's memory.
  - id: ai.retrieval-quality
    title: Retrieval quality
    summary: If the right passage isn't retrieved, no prompt can save the answer, so retrieval is measured on its own with labelled questions.
  - id: ai.grounding
    title: Grounding and citations
    summary: The answer is limited to what the passages support, cites them, and says so when they don't hold the answer.
  - id: ai.agents
    title: Agent loops
    summary: An agent is a model called in a loop with tools. Each turn it asks for a tool or gives a final answer, and code caps the number of turns.
    confusableWith: [ai.tool-use]
  - id: ai.planning-and-memory
    title: Planning and memory
    summary: A plan breaks the goal into steps kept in context, and memory stores facts outside the window and brings them back when needed.
  - id: ai.mcp
    title: Model Context Protocol
    summary: An open protocol by which a server offers tools and data to any compatible AI app, so one integration works in many apps.
  - id: ai.golden-sets
    title: Eval sets
    summary: A fixed set of inputs with expected outputs or grading rules, run against every change to the prompt, model or retrieval, and kept apart from the prompt's examples.
  - id: ai.llm-as-judge
    title: LLM-as-judge
    summary: A model grades outputs against a rubric, which scales but has biases, such as favouring the first answer shown, so it is checked against people's grades.
  - id: ai.regression-gates
    title: Regression gates
    summary: The eval runs on every change, and a drop in any slice, not only the average, blocks the release.
  - id: ai.retries-and-backoff
    title: Retries and backoff
    summary: Rate limits, overloads and dropped connections are retried after growing waits, while bad requests are not retried at all.
  - id: ai.timeouts
    title: Timeouts
    summary: Every model call has a deadline, so a hung request fails fast and the user gets an answer or a clear error.
  - id: ai.stop-reasons
    title: Stop reasons
    summary: "`stop_reason` says why a reply ended: finished, cut off at `max_tokens`, asking for a tool, or refused, and each needs different handling."
  - id: ai.cost-and-latency
    title: Cost and latency
    summary: Cost grows with input and output tokens, and latency mostly with output tokens, so both are measured from `usage` and designed for.
  - id: ai.streaming
    title: Streaming
    summary: A streamed reply shows its first words in about a second, which cuts the wait people feel without changing the total time.
  - id: ai.prompt-caching
    title: Prompt caching
    summary: A long prefix that repeats exactly between calls is cached, so later calls read it for a fraction of the price, and any change to it breaks the cache.
  - id: ai.prompt-injection
    title: Prompt injection
    summary: Text from a user, a document or a tool result contains instructions that the model follows, since it cannot reliably tell data from instructions.
  - id: ai.data-leakage
    title: Data leakage
    summary: Secrets or personal data placed in a prompt can come out in replies, logs or a provider's storage, so they are kept out, limited or redacted.
  - id: ai.test-time-compute
    title: Reasoning and test-time compute
    summary: Better answers from more work while answering, by writing out steps first (chain of thought), keeping the best or most common of several answers, or searching over reasoning steps.
  - id: ai.reward-models
    title: Reward models and RL training
    summary: A reward model scores answers or steps, and reinforcement learning with PPO or GRPO shifts the model towards answers that score well.
