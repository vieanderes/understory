deepDive: >-
  Defence in depth and zero trust fit together. Depth is many independent layers; zero trust
  makes one of those layers, identity, apply everywhere instead of only at the edge.


  Row-level security from the databases chapter is a layer close to the data. Even if the
  app's ownership check is skipped, the database returns only the caller's rows. A control
  near the data survives a bug in the code above it.


  Comparing tokens with `includes` is fine for learning. In production, compare secrets in
  constant time, with `crypto.timingSafeEqual` in Node, and prefer short-lived tokens issued
  per service. Hardening goes further on servers too: fewer open ports, fewer installed
  programs, and no process running with more rights than it needs. The cloud chapter
  returns to that.
