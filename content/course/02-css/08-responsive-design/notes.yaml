summary: >-
  A **responsive** page is one page that works at every width, from a 320px phone to a wide
  desktop monitor. You don't build a separate phone site. You build one set of rules that
  bends: sizes that follow something sensible, and a few points where the layout changes.


  Relative units do the bending. `rem` follows the reader's chosen text size, `%` follows the
  parent, and `vw` follows the **viewport**, the visible part of the browser window. Then
  **media queries** switch the layout when the viewport crosses a width, and **container
  queries** switch a component when the box it sits in crosses a width. `clamp()` lets a size
  slide smoothly between two limits, so many small steps need no query at all.


  Reach for a media query when the whole page changes, such as a sidebar that appears on wide
  screens. Reach for a container query when one component must look right wherever it's
  dropped. And reach for neither when a grid with `auto-fit` or a `clamp()` already adapts on
  its own.
remember:
  - A media query measures the viewport, and a container query measures the nearest ancestor that has a `container-type`.
  - Mobile first means the plain rules are the phone layout, and `min-width` queries only add to it for wider screens.
  - Without the viewport meta tag, a phone pretends to be about 980px wide, so your phone layout never shows.
  - '`min-width: 600px` and `max-width: 600px` both match at exactly 600px, so paired breakpoints must not share a number.'
  - Size text in `rem`, because it grows when the reader raises the browser's text size and `px` does not.
  - On phones, `100vh` is the tallest viewport, with the toolbar hidden, while `100svh` is the shortest and always fits on screen.
  - "A container with `container-type: inline-size` can't take its width from its content, so it needs a width from its parent."
  - '`clamp(min, preferred, max)` gives fluid sizes, and mixing `rem` into the preferred value keeps text zoomable.'
sections:
  - title: How a media query decides
    body: |-
      A media query asks the browser a yes or no question about the device, and the rules
      inside apply only while the answer is yes. The browser asks again whenever something
      changes, such as the window being resized or a phone turning sideways.

      Width is the question you'll ask most. Both `min-width` and `max-width` include the
      number itself. That catches people out when they pair them:

      ```css
      @media (max-width: 600px) { .menu { display: none; } }
      @media (min-width: 600px) { .menu { display: flex; } }
      ```

      At exactly 600px both match, and the later rule wins. Newer **range syntax** says the
      boundary plainly, with comparison signs like the ones you know from JavaScript:

      ```css
      @media (width < 600px) { .menu { display: none; } }
      @media (width >= 600px) { .menu { display: flex; } }
      ```

      Now exactly one of them matches at every width. All current browsers understand it.

      Width isn't the only question. A few others are worth knowing:

      - `(hover: hover)` is true when the main pointer can hover, such as a mouse. On a
        touch screen it's false, so hover-only menus need another way in.
      - `(pointer: coarse)` is true when the main pointer is a finger, a hint to make tap
        targets bigger.
      - `(orientation: landscape)` is true when the viewport is wider than it is tall.

      One more detail: a media query only sees the phone's real width if the page has the
      viewport meta tag from the HTML chapter. Without it, mobile browsers lay the page out
      as if the screen were about 980px wide and then shrink it to fit. In our Chromium test,
      a 390px phone reported 980px, and a `min-width: 600px` query matched. Your desktop
      layout appears, tiny, on the phone.
  - title: Container queries in depth
    body: |-
      A **container** is an element you mark with `container-type`, so that its descendants
      can ask how big it is. There are two useful values:

      - `inline-size` lets descendants query its width. This is the one you'll use almost
        always.
      - `size` lets them query its height too. The container then can't take its height from
        its content, so you must give it one.

      Marking a container has a cost. Its width must not depend on what's inside, or the
      query could change the content, which changes the width, which changes the query. So
      the browser sizes the container as if it were empty. In a normal block layout that's
      fine, because a block takes the parent's width anyway. But anything that shrinks to fit
      its content collapses. In our Chromium test, an `inline-block` container and a flex item
      with no width both measured 0px wide. Give such a container `width: 100%` or `flex: 1`.

      When there are several containers, name them and query the one you mean:

      ```css
      .sidebar { container-type: inline-size; container-name: sidebar; }
      @container sidebar (min-width: 400px) {
        .card { display: flex; gap: 16px; }
      }
      ```

      Without a name, `@container` reads the nearest container above the element. With no
      container above it at all, the query never matches.

      Containers bring their own units too. `1cqi` is 1% of the container's width, the way
      `1vw` is 1% of the viewport's. In a 400px container, `font-size: 5cqi` gave 20px. That
      lets a heading grow with its card rather than with the screen.
  - title: Viewport units and the phone toolbar
    body: |-
      On a phone, the browser's address bar slides away as you scroll down and comes back as
      you scroll up. So the viewport has no single height. CSS gives you a unit for each case:

      - `svh` is 1% of the **small** viewport: toolbar showing, the least room you'll get.
      - `lvh` is 1% of the **large** viewport: toolbar hidden, the most room.
      - `dvh` is 1% of the **dynamic** viewport: whatever is visible right now.
      - `vh` is the old unit. Phones treat it like `lvh`.

      Each has a width twin (`svw`, `lvw`, `dvw`), but width rarely changes, so the height ones
      matter. On a desktop there's no sliding toolbar, and all four heights are the same.

      Which should you pick? For a first screen that must fit completely, such as a sign-in
      form with its button, use `min-height: 100svh`. The button can then never hide under the
      toolbar. `100vh` risks exactly that, because it assumes the toolbar has gone. `100dvh`
      fits too, but it changes size while the reader scrolls, so the layout moves under
      their finger.

      Width has its own trap. `100vw` is the whole viewport, including a classic scrollbar
      on desktop. When the page is tall enough to scroll, a `width: 100vw` box is wider than
      the space beside the scrollbar. In our test with a 15px scrollbar, the page became 15px
      wider than its visible area and scrolled sideways. Use `width: 100%` for full width
      inside the page.
  - title: Fluid sizes that stay accessible
    body: |-
      `clamp()` takes three values: a minimum, a preferred size and a maximum. The middle
      value usually mixes a fixed part and a viewport part, as in `1rem + 2.5vw`. Here's how
      that heading from the lesson behaves at different screen widths, measured in Chromium
      with a 16px root:

      ```text
      viewport   1rem + 2.5vw   after clamp(1.5rem, ..., 2.5rem)
      320px      24px           24px
      640px      32px           32px
      960px      40px           40px
      1400px     51px           40px
      ```

      Why not write `font-size: 5vw` and be done? Because a `vw` size ignores the reader.
      When someone zooms the page to 200%, the viewport becomes half as many CSS pixels
      wide, so `5vw` halves too. The zoom doubles it back, and the text ends up the same size
      on screen. The zoom did nothing for the text. WCAG, the web's accessibility standard,
      asks that text can be resized to 200% without losing content, and pure `vw` text fails
      that.

      The `rem` part of `1rem + 2.5vw` fixes it, because that part does grow with zoom and
      with the reader's text size setting. Keep the limits in `rem` too.

      For widths, prefer grids that adapt without numbers. A grid with
      `repeat(auto-fit, minmax(200px, 1fr))` picks its own column count, and a component
      with a container query adapts to its slot. Many pages need only two or three media
      queries once those are in place.
pitfalls:
  - '**Forgetting the viewport meta tag.** The CSS looks right in a desktop browser made narrow, so nobody notices. On a real phone, the page is laid out 980px wide and shrunk. Put `<meta name="viewport" content="width=device-width, initial-scale=1">` in every page head.'
  - '**Breakpoints that overlap.** `max-width: 600px` and `min-width: 600px` both match at 600px, and a menu can be shown and hidden at once. Use range syntax, `(width < 600px)` and `(width >= 600px)`, or write only `min-width` queries, mobile first.'
  - '**Putting `container-type` on the component itself.** An element can''t answer its own container query, so the card never changes. Put `container-type` on the box around it, and let the card''s children or the card respond.'
  - '**A container that collapses to nothing.** An `inline-block` or a flex item marked as a container ignores its content when sized, so it shrinks to 0px. Give it `width: 100%` or `flex: 1`.'
  - '**Full-height screens built with `100vh`.** On phones `100vh` assumes the toolbar is hidden, so the bottom of the screen, often the main button, sits under the toolbar. Use `min-height: 100svh`.'
  - '**Text sized only in `vw`.** It looks fluid, but zoom no longer makes it bigger. Use `clamp()` with a `rem` part and `rem` limits.'
interview:
  - question: When would you use a container query instead of a media query?
    answer: >-
      I use a container query when a component must adapt to the space it's given, and a
      media query when the page layout itself changes. A media query only knows the
      viewport. A product card in a narrow sidebar and the same card in a wide main column
      get the same answer, so one of them looks wrong. With `container-type: inline-size` on
      each slot, the card asks how wide its own slot is, and one rule serves both. Media
      queries still decide page-level things, such as whether the sidebar exists at all, and
      user preferences like reduced motion. The trade-off is that a container can't size
      itself from its content. It needs a width from its parent, and an inline-block or
      shrink-wrapped flex item collapses to zero.
  - question: What's the difference between `px`, `em` and `rem`, and which do you use for what?
    answer: >-
      `px` is fixed, `rem` is relative to the root font size and `em` is relative to the
      element's own font size. I size text and most spacing in `rem`, because it respects
      the reader's browser text setting while staying predictable: `2rem` means the same
      everywhere. `em` suits things that should scale with their own text, such as padding
      inside a button, so a larger button gets larger padding. The catch is that `em` in
      `font-size` refers to the parent, so nested `em` sizes multiply: three levels of
      `1.2em` gave about 27.6px from a 16px start. I keep `px` for things that shouldn't
      scale with text, such as a 1px border.
  - question: A full-screen hero cuts off its button on phones. What's going on, and how do you fix it?
    answer: >-
      It's almost certainly built with `100vh`, which on phones means the height with the
      address bar hidden. When the page first loads, the bar is showing, so the bottom of a
      `100vh` box, and the button with it, sits under it. The fix is `min-height: 100svh`,
      the small viewport height, which assumes the toolbar is showing and so always fits.
      I'd avoid `100dvh` for large layouts, because it resizes while the reader scrolls and
      the page shifts under their finger. `min-height` rather than `height` also matters:
      if the text is longer than the screen, or the reader zooms, the box can grow instead of
      overflowing.
  - question: What does mobile first mean, and why do people prefer it?
    answer: >-
      Mobile first means the plain rules produce the phone layout, and `min-width` media
      queries add to it for wider screens. The phone is the most constrained case: one
      column, little room. If it works there, wider screens only gain things, such as more
      columns or a bigger heading. The other way round, every phone applies the desktop
      layout and then undoes it with overrides. That means more code, and more rules that
      fight. It also nudges you to decide what matters most, because a phone shows one
      thing at a time. When not to be strict about it: a tool used mostly on desktop may be
      designed wide first, as long as it still works at 320px.
