id: interview
number: 28
title: "Interview challenges"
summary: "The coding challenges senior full-stack and AI engineers meet: timed online tests with hidden scoring, practical feature and component rounds, AI builds, AI-assisted rounds, and a four-hour build you present to a panel."
why: "Each format rewards a different way of working, and knowing the format is worth as much as another practised pattern."
youCanBuild: "Four timed mock assessments passed, accessible widgets built in plain JavaScript and in React, a set of practical and AI build tasks with tests, and a rehearsed plan and presentation for a four-hour build."
concepts:
  - id: interview.round-formats
    title: "Round formats"
    summary: "Timed online tests, levelled tasks, live pair coding, AI-assisted rounds, take-homes and build-and-present days each score different things."
  - id: interview.recruiter-questions
    title: "Questions for the recruiter"
    summary: "The platform, the language, the length, whether AI tools are allowed and how the work is scored all change how you prepare, and you are allowed to ask."
  - id: interview.hidden-tests
    title: "Hidden tests"
    summary: "Online tests score you on unseen correctness and performance tests, so the example passing proves little and your own edge cases decide the score."
    confusableWith: [interview.stress-testing]
  - id: interview.expected-complexity
    title: "The expected complexity"
    summary: "The constraints and the stated worst-case complexity name the algorithm before you start, because the performance tests are sized to fail anything slower."
  - id: interview.platform-conduct
    title: "Conduct on the platform"
    summary: "Compile errors score zero, pastes and tab switches may be recorded, and an assistant's transcript may be read, so work in a way you would show."
  - id: interview.task-statement
    title: "Reading the task statement"
    summary: "A task statement names its inputs, its limits and often the expected complexity, and the hidden tests probe every one of them."
  - id: interview.output-contract
    title: "The output contract"
    summary: "The exact return format, the order, the tie-break and the special values are part of the answer, and hidden tests compare them character by character."
  - id: interview.hidden-quadratic
    title: "Hidden quadratic costs"
    summary: "Calls such as shift, includes and indexOf inside a loop look constant but are linear, which turns a linear pass into a quadratic one."
  - id: interview.runtime-limits
    title: "Runtime limits"
    summary: "Default string sorting, spread on huge arrays, deep recursion and sums past 2^53 fail only on the large inputs that hidden tests use."
  - id: interview.triage
    title: "Triage under time"
    summary: "Reading every task first, starting with the most familiar and banking a brute force for partial credit protects the score when time runs short."
  - id: interview.stress-testing
    title: "Stress testing"
    summary: "Comparing a fast solution with a slow, obviously correct one on many small random inputs finds the bug an example never shows."
    confusableWith: [interview.hidden-tests]
  - id: interview.lru-cache
    title: "An LRU cache"
    summary: "A Map remembers insertion order, so deleting and re-setting a key on each read keeps the least recently used entry first for eviction."
  - id: interview.timing-utilities
    title: "Debounce and throttle"
    summary: "Debounce waits for a pause before calling once, throttle calls at most once per interval, and an injected clock makes both testable."
  - id: interview.injected-clock
    title: "An injected clock"
    summary: "Passing the clock and the timers in as arguments lets a test move time itself, so timing code is checked instantly and the same way every run."
  - id: interview.event-emitter
    title: "An event emitter"
    summary: "A map from event name to a list of listeners supports on, off and once, and copying the list before calling keeps removal during an emit safe."
  - id: interview.levelled-design
    title: "Designing for the next level"
    summary: "In a levelled task later requirements build on your earlier code, so a small clear data model at level one saves a rewrite at level four."
  - id: interview.record-store
    title: "A nested record store"
    summary: "A map of records, each a map of fields, gives set, get, delete and prefix scans with predictable, sorted output."
  - id: interview.time-aware-state
    title: "Time-aware state"
    summary: "Storing when each value expires and passing the current time into every call makes expiry exact and testable."
  - id: interview.backward-compatible-change
    title: "Changing without breaking"
    summary: "A new level adds behaviour while every earlier test keeps passing, which is a refactor done in small, tested steps."
  - id: interview.change-sets
    title: "Change sets"
    summary: "A transaction records the old value of every key it touches, so rollback restores them and commit discards the record."
  - id: interview.nested-transactions
    title: "Nested transactions"
    summary: "A stack of change sets lets an inner transaction roll back alone, while committing it folds its record into the one below."
  - id: interview.handler-shape
    title: "The shape of a handler"
    summary: "A handler takes a request and returns a response: parse and validate at the edge, run plain logic, and map every failure to one error format."
  - id: interview.idempotency-keys
    title: "Idempotency keys"
    summary: "Storing the first response under a client-sent key lets a retried request return the same result instead of acting twice."
  - id: interview.stale-responses
    title: "Stale responses"
    summary: "Responses can arrive out of order, so an autocomplete tags each request and ignores any answer that is not for the latest query."
  - id: interview.ui-state-machine
    title: "UI state as a machine"
    summary: "Modelling idle, loading, success, empty and error as explicit states with a reducer makes impossible combinations impossible."
  - id: interview.combobox-pattern
    title: "The combobox pattern"
    summary: "An accessible autocomplete keeps focus in the input, moves an active option with the arrow keys and announces it through aria-activedescendant."
  - id: interview.native-elements
    title: "Native elements first"
    summary: "A button, a dialog element or a group of radio inputs brings keyboard support and screen reader meaning for free, which a div with a click handler does not."
  - id: interview.aria-state
    title: "ARIA roles and states"
    summary: "A role says what a custom widget is, and aria attributes say its current state, so they change together with what the screen shows."
  - id: interview.roving-focus
    title: "Keyboard inside a widget"
    summary: "A composite widget such as a tab list is one tab stop, and the arrow keys move inside it by moving tabindex and focus together."
  - id: interview.component-api
    title: "A component's interface"
    summary: "A widget takes its data and callbacks as props and keeps one piece of state for what it shows, so the parent stays in control and nothing is stored twice."
  - id: interview.effect-cleanup
    title: "Effects that clean up"
    summary: "An effect that adds a listener or a timer returns a function that removes it, or the component leaks and reacts twice."
  - id: interview.focus-management
    title: "Managing focus"
    summary: "Opening a popup moves focus into it and closing it returns focus to the control that opened it, so keyboard users never get lost."
  - id: interview.reading-first
    title: "Reading before changing"
    summary: "Tracing the data through unfamiliar code and running the failing test first finds the real cause faster than editing on a guess."
  - id: interview.minimal-fix
    title: "The minimal fix"
    summary: "A bug-fix task limits how many lines you may change, so you fix the cause at its source instead of patching the symptom."
  - id: interview.chunking
    title: "Chunking"
    summary: "Splitting documents into overlapping pieces of a fixed size keeps a sentence that spans a boundary retrievable from at least one chunk."
  - id: interview.grounded-answers
    title: "Grounded answers"
    summary: "An answer cites the chunks it used and refuses when no chunk scores above a threshold, instead of inventing one."
  - id: interview.guarded-tool-loop
    title: "A guarded tool loop"
    summary: "The loop runs requested tools and feeds results back, with a step cap, an allowlist and a human approval before any write."
  - id: interview.validate-and-retry
    title: "Validate and retry"
    summary: "Model output is parsed against a schema, and on failure the error is sent back for a bounded number of retries before a fallback."
  - id: interview.delta-accumulation
    title: "Accumulating deltas"
    summary: "A stream arrives as small events, and a reducer folds text and tool-call fragments into the message the UI shows."
  - id: interview.stream-failure
    title: "Failing mid-stream"
    summary: "A stream can stop or be cancelled halfway, so the UI keeps what arrived, marks it incomplete and offers a retry."
  - id: interview.timeout-and-retry
    title: "Timeouts and retries"
    summary: "Each attempt gets a deadline, and only timeouts, 429 and 5xx errors are retried, with backoff and jitter."
  - id: interview.in-flight-cache
    title: "An in-flight cache"
    summary: "Caching the promise as the call starts makes identical calls share one request, and a pool caps how many run at once."
  - id: interview.golden-set
    title: "A golden set"
    summary: "A small set of real questions with known good answers, written before the build, turns 'it looks fine' into a number that can regress."
  - id: interview.retrieval-metrics
    title: "Retrieval metrics"
    summary: "Recall at k and reciprocal rank measure whether the right chunk was found, separately from whether the answer was right."
  - id: interview.plan-before-prompting
    title: "Plan before prompting"
    summary: "Saying your approach aloud before asking an assistant shows your judgement and gives you a standard to check its output against."
  - id: interview.verifying-ai-output
    title: "Verifying AI output"
    summary: "Generated code is read, run against tests and fixed by hand where small, because you are scored on owning every line."
  - id: interview.model-chat
    title: "The model chat"
    summary: "In an assisted online test the assistant clarifies, looks up syntax, suggests tests and reviews, in about five prompts, and never writes the solution."
  - id: interview.prompt-shape
    title: "The prompt shape"
    summary: "A bigger ask names the Job, Why, Context, Constraints and Done, while a one-line factual question stays one line."
  - id: interview.scoping
    title: "Scoping a build"
    summary: "Writing assumptions and three must-haves from the brief decides what a four-hour build leaves out on purpose."
  - id: interview.vertical-slice
    title: "A thin vertical slice"
    summary: "One path working end to end through UI, API and data early beats several layers that are each half done."
  - id: interview.readme-for-reviewers
    title: "A README for reviewers"
    summary: "Reviewers read the README first, so it states what was built, how to run it, the assumptions, the trade-offs, how AI was used and what comes next."
  - id: interview.decision-led-presentation
    title: "A presentation built on decisions"
    summary: "A panel learns more from two or three decisions and the options you rejected than from a tour of every feature."
  - id: interview.handling-questions
    title: "Handling follow-up questions"
    summary: "Good answers own the decision, name what would change it and admit what you do not know, instead of defending or deflecting."
  - id: interview.round-script
    title: "The round script"
    summary: "Clarify, work an example, state the brute force, improve it, agree the plan, code, test and summarise the cost, saying each step aloud."
  - id: interview.taking-hints
    title: "Taking hints"
    summary: "A hint is information about where the interviewer wants you to go, so you acknowledge it, use it and say what it changed."
  - id: interview.pattern-spotting
    title: "Spotting the pattern"
    summary: "Tasks candidates report are a dozen known patterns in new clothes, so naming the pattern first turns a new task into a familiar one."
  - id: interview.one-pass-state
    title: "One pass with the right state"
    summary: "A set, a count per key or a running total carried through one pass replaces the nested loop most reported tasks tempt you into."
