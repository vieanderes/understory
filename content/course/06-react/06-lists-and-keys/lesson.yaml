id: react.lists-and-keys
title: Lists and keys
objective: "Render a list from an array with `map`, give each item a stable key, and predict what state survives a reorder."
level: essential
minutes: 10
concepts: [react.rendering-lists, react.keys, react.state-preservation]
prerequisites: [react.state-as-a-snapshot]
opening:
  text: >-
    You'll turn an array of data into a list, then reorder it without ticks jumping rows.
    And you'll know how to make a component start fresh on purpose.

steps:
  - type: prose
    id: rendering-lists
    body: |-
      Most pages show lists: songs, messages, search results. In React you turn an array of
      data into elements with `map`, the one you met in JavaScript:

      ```tsx
      <ul>
        {plants.map((plant) => <li>{plant.name}</li>)}
      </ul>
      ```

      Braces accept an array, and React shows each element in order. To show only some,
      `filter` first, then `map`. For newest first, `toReversed()` gives a reversed copy, the
      way `toSorted` gives a sorted one.

  - type: fill-blank
    id: fill-plant-list
    concept: react.rendering-lists
    difficulty: 1
    language: tsx
    prompt: >-
      Show only the plants that need water today, one `li` each. Fill the gaps.
    template: |
      function WaterToday({ plants }) {
        return (
          <ul>
            {plants.{{1}}((plant) => plant.dry).{{2}}((plant) => <li>{plant.name}</li>)}
          </ul>
        );
      }
    blanks:
      - key: '1'
        answer: filter
      - key: '2'
        answer: map
    bank: [filter, map, find, forEach]

  - type: prose
    id: what-keys-are
    body: >-
      That list shows fine, but the development build warns in the console: "Each child in a
      list should have a unique key prop."


      A **key** names an element among its siblings: `<li key={plant.id}>`. When the list
      changes, React uses keys to match each new element with the one it was before. Use an id
      from your data, something that stays with the item wherever it moves.

  - type: bug-hunt
    id: hunt-index-key
    concept: react.keys
    difficulty: 2
    language: tsx
    code: |
      function TaskList({ tasks, newestFirst }) {
        const shown = newestFirst ? tasks.toReversed() : tasks;
        return (
          <ul>
            {shown.map((task, index) => (
              <Task key={index} title={task.title} />
            ))}
          </ul>
        );
      }
    prompt: >-
      A bug report says: "I ticked Milk, switched to Newest first, and now Eggs is ticked."
      Each `Task` keeps its tick in state. Tap the line at fault.
    lines: [6]
    reasons:
      - text: The key is the row's position, not the task
        correct: true
        feedback: >-
          Right. The tick stays with key `0`, the top row. `key={task.id}` moves with the task.
      - text: '`toReversed` changes `tasks` in place'
        feedback: >-
          It returns a new array and leaves `tasks` alone. The tick follows the index key.
      - text: '`Task` should do the reversing itself'
        feedback: >-
          A row can't reorder its siblings. The list is fine; the key ties state to a position.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Tick a task, reorder, check that task is ticked
          correct: true
          feedback: >-
            Yes. Only a reorder separates a task from its position.
        - text: Render the list and count the rows
          feedback: >-
            Index keys give the right number of rows. The state lands on the wrong one.
        - text: Check the console shows no key warning
          feedback: >-
            Index keys silence the warning. That's exactly why this bug slips through.
    fix: |
      function TaskList({ tasks, newestFirst }) {
        const shown = newestFirst ? tasks.toReversed() : tasks;
        return (
          <ul>
            {shown.map((task) => (
              <Task key={task.id} title={task.title} />
            ))}
          </ul>
        );
      }

  - type: prose
    id: reconciliation
    body: >-
      After each render, React lines up the new elements with the old ones. It matches them by
      three things: position, type and key.


      Same type, same place, same key: React keeps the component and its state. Change any of
      the three, and the old one goes, state and all. So changing a key is how you reset a
      component on purpose.

  - type: predict-output
    id: predict-same-spot
    concept: react.state-preservation
    difficulty: 2
    language: tsx
    code: |
      function Counter({ label }) {
        const [n, setN] = useState(0);
        return <button onClick={() => setN(n + 1)}>{label} {n}</button>;
      }

      <div>{isAlice ? <Counter label="Alice" /> : <Counter label="Bob" />}</div>
    question: The button shows `Alice 1`. Then `isAlice` becomes `false`. What does it show?
    choices:
      - text: '`Bob 1`'
        correct: true
        feedback: >-
          Right. Same type, same spot: React kept the state and changed the label.
      - text: '`Bob 0`'
        feedback: >-
          They look like two components. To React it's one `Counter` at one position, with a new
          prop.
      - text: '`Alice 1`'
        feedback: >-
          The `label` prop did change, so the text follows it. Only `n` was carried over.

  - type: playground
    id: fix-reverse-keys
    concept: react.keys
    difficulty: 3
    prompt: >-
      Tick Bread, then press Newest first. The tick stays on the top row, which is now Eggs.
      Give each row a key that moves with its task.
    jsx: |
      import { useState } from "react";
      const tasks = [{ id: 1, title: "Bread" }, { id: 2, title: "Milk" }, { id: 3, title: "Eggs" }];
      export default function TaskList() {
        const [newestFirst, setNewestFirst] = useState(false);
        const shown = newestFirst ? tasks.toReversed() : tasks;
        const rows = shown.map((task, index) => (
          <li key={index}><label><input type="checkbox" /> {task.title}</label></li>
        ));
        return (
          <>
            <button onClick={() => setNewestFirst(!newestFirst)}>Newest first</button>
            <ul>{rows}</ul>
          </>
        );
      }
    checks:
      - label: Bread keeps its tick at the bottom
        actions: [{ click: 'li:first-child input' }, { click: button }]
        selector: li:last-child input:checked
        count: 1
      - label: Eggs, now on top, is not ticked
        actions: [{ click: 'li:first-child input' }, { click: button }]
        selector: li:first-child input:checked
        count: 0
    solution:
      jsx: |
        import { useState } from "react";
        const tasks = [{ id: 1, title: "Bread" }, { id: 2, title: "Milk" }, { id: 3, title: "Eggs" }];
        export default function TaskList() {
          const [newestFirst, setNewestFirst] = useState(false);
          const shown = newestFirst ? tasks.toReversed() : tasks;
          const rows = shown.map((task) => (
            <li key={task.id}><label><input type="checkbox" /> {task.title}</label></li>
          ));
          return (
            <>
              <button onClick={() => setNewestFirst(!newestFirst)}>Newest first</button>
              <ul>{rows}</ul>
            </>
          );
        }
    hints:
      - The key is the row's position. After the flip, position 0 is Eggs.
      - Each task has an `id` that goes wherever the task goes.
      - Write `key={task.id}`. The `index` is no longer needed.

  - type: ai-review
    id: review-random-key
    concept: react.keys
    difficulty: 4
    language: tsx
    request: Fix the "Each child in a list should have a unique key" warning.
    flawClass: logic
    code: |
      function TaskList({ tasks }) {
        const [clicks, setClicks] = useState(0);
        return (
          <div>
            <button onClick={() => setClicks(clicks + 1)}>Refresh</button>
            <ul>
              {tasks.map((task) => <Task key={Math.random()} title={task.title} />)}
            </ul>
          </div>
        );
      }
    prompt: >-
      An assistant wrote this. The warning is gone, and the list looks right. But after
      Refresh, every ticked task is unticked. Tap the line at fault.
    lines: [7]
    reasons:
      - text: Every render makes new keys, so every `Task` starts over
        correct: true
        feedback: >-
          Yes. A key that changes each render never matches. Use `task.id`.
      - text: Refresh should use an updater function
        feedback: >-
          `setClicks((n) => n + 1)` would be tidier, but the ticks would still vanish. The keys
          are the cause.
      - text: '`Math.random()` can give two rows the same key'
        feedback: >-
          Possible, but rare. The ticks vanish on every refresh, because the keys change each time.
    fix: |
      function TaskList({ tasks }) {
        const [clicks, setClicks] = useState(0);
        return (
          <div>
            <button onClick={() => setClicks(clicks + 1)}>Refresh</button>
            <ul>
              {tasks.map((task) => <Task key={task.id} title={task.title} />)}
            </ul>
          </div>
        );
      }

  - type: code-challenge
    id: build-task-rows
    concept: react.keys
    difficulty: 4
    language: tsx
    starter: starter.tsx
    solution: solution.tsx
    tests: tests.tsx
    prompt: >-
      Each `TaskRow` keeps its own tick and a half-typed note. Tick Milk, press Reverse, and
      the tick jumps to Eggs. The tests do exactly that.


      Make ticks and notes stay with their task after Reverse. Then give each row a Remove
      button, named `Remove Milk` and so on with `aria-label`. Removing one row must leave the
      others' state alone.
    hints:
      - Look at the `key`. The state stays with it, so ask whether it moves with the task.
      - Remove needs the list, which lives in `TaskList`. Pass the row a function as a prop.
      - 'Start with `key={task.id}`, then `setItems(items.filter((item) => item.id !== task.id))`.'

  - type: explain-back
    id: explain-draft-stays
    concept: react.state-preservation
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      You switch a chat from Alice to Bob, and your half-typed message is still there. Why
      does it survive the switch?
    rubric:
      - The same `Chat` type renders at the same position, so React keeps its state.
      - Changing only props never resets state, so the draft carries over to Bob.
      - 'The fix: a key tied to the contact makes Bob''s chat a new instance, so it starts empty.'
    modelAnswer: >-
      To React, the chat for Alice and the chat for Bob are one `Chat` in one place. Only its
      props changed, and props don't reset state, so the draft stays. With
      `key={contact.id}`, the key changes when the contact does. React treats Bob's chat as
      a new component, drops Alice's state, and starts with an empty box.

recap:
  - Turn an array into a list on the page with `filter` and `map`.
  - Give each item a stable key from your data, never the index or a random number.
  - Predict what state React keeps from position, type and key, and reset it with a new key.

recall:
  - id: card-index-key
    concept: react.keys
    front: Why does `key={index}` move a ticked box to the wrong task after a reorder?
    back: >-
      The state stays with the key, and the index belongs to the position. A new item now
      sits at that position.
  - id: card-random-key
    concept: react.keys
    front: What does `key={Math.random()}` do to a list's state?
    back: >-
      Every render makes new keys, so React rebuilds every item and all their state is lost.
  - id: card-match-rules
    concept: react.state-preservation
    front: What three things must match for React to keep a component's state?
    back: >-
      Its position in the tree, its type, and its key.
  - id: card-reset-with-key
    concept: react.state-preservation
    front: How do you make a component start fresh when a prop changes?
    back: >-
      Give it a key tied to that prop, such as `key={contact.id}`. A new key means a new
      instance.

