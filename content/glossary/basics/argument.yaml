term: argument
aka: [function argument]
short: A value you hand to a function when you call it, inside the brackets.
explain: |
  When you call `greet("Sam")`, the text `"Sam"` is the argument. It travels into the
  function and fills the matching parameter, for that one call only.

  Pass too few and the missing ones are `undefined`. Pass too many and the extra ones are
  ignored. JavaScript doesn't warn you either way, so check the order of what you pass.
analogy: The ingredients you hand over with a recipe. Same recipe, different ingredients, different cake.
example:
  language: js
  code: |
    function lineTotal(price, quantity) {
      return price * quantity;
    }
    lineTotal(4, 3); // 4 and 3 are the arguments
usage: You're passing the arguments the wrong way round, because the price goes first and the quantity second.
twin:
  term: parameter
  difference: An argument is the real value you pass in a call, like `4`. A parameter is the name waiting for it in the definition, like `price`.
related: [parameter, function, rest-parameters]
level: 1
lessons: [basics.functions]
