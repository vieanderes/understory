term: test coverage
aka: [code coverage, coverage, line coverage, branch coverage]
short: A measure of which lines and branches of your code ran while the tests were running.
explain: |
  A report shows each line in green or red: did any test run it? Red lines are code no
  test has touched, which is a useful map of blind spots.

  The trap is reading it as quality. A line that ran wasn't necessarily checked; a test with
  no assertion still turns it green. So 95% can hide weak tests, and chasing 100% wastes
  effort on trivial code. Use it to find untested risky code, and branch counts over line
  counts.
analogy: A map of which rooms the security guard walked through. It tells you where they went, not whether they looked.
usage: Test coverage is 92%, but half those tests never assert anything; look at the mutation score.
twin:
  term: mutation-testing
  difference: Coverage says which lines your tests ran. Mutation testing says whether your tests would notice if those lines changed.
related: [mutation-testing, assertion, unit-test]
level: 1
lessons: [testing.what-to-test]
