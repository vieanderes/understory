term: stack
aka: [ LIFO, last in first out, stack data structure ]
short: A pile where you only add or remove at the top, so the newest item leaves first.
explain: |
  An editor's undo button reverses your latest change, then the one before. You need the
  most recent item first, and only that. Two operations do it: push onto the top, pop off
  the top. Both are O(1).

  In JavaScript an array is one already: `push` and `pop` work at the end. Don't use
  `shift`, which works at the front and moves every item.

  Reach for it when the latest unfinished thing matters most. Matching brackets, undo,
  turning recursion into a loop and depth-first search all use one.
analogy: A stack of plates. You put clean ones on top and take from the top, never pulling one from the bottom.
example:
  language: js
  code: |
    function balanced(text) {
      const open = [];
      const pairs = { ')': '(', ']': '[', '}': '{' };
      for (const ch of text) {
        if ('([{'.includes(ch)) open.push(ch);
        else if (ch in pairs && open.pop() !== pairs[ch]) return false;
      }
      return open.length === 0;
    }
usage: Push every opening bracket onto a stack, and each closer must match whatever's on top.
twin:
  term: fifo-queue
  difference: A stack hands back the newest item first, last in, first out. A FIFO queue hands back the oldest first, like a line at a till.
related: [ fifo-queue, call-stack, monotonic-stack, depth-first-search, loop ]
