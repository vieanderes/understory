term: reverse interview
aka: [questions for us, questions to ask the interviewer]
short: The end of an interview where the candidate asks the questions and gathers evidence about the team.
explain: |
  "What would you like to ask us?" is the one part where you're the one checking. What you
  ask also shows the interviewer what you care about, which signals your level.

  Ask for a recent, specific example, not an opinion. "Walk me through your last incident"
  gets the truth; "How do you handle incidents?" gets a polished answer. Then judge how
  specific the reply is.
analogy: Asking to see the actual flat before signing, not only the brochure photos.
usage: In the reverse interview, ask about their last missed deadline and what changed afterwards.
related: [blameless-postmortem, behavioural-interview, elevator-pitch]
level: 2
lessons: [career.questions-to-ask]
