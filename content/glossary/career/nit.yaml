term: nit
aka:
  - nitpick
  - "nit:"
short: A review comment flagging something small and optional, which the author may take or leave.
explain: |
  Not every review comment is equal. A missing permission check must be fixed. A slightly
  better variable name is a preference.

  Prefixing small comments with "nit" tells the author it won't block the merge. It keeps
  review honest about what matters, and saves arguments over taste.

  The trap is a review made only of them. Twenty small comments and nothing on the design
  means the reviewer looked at the surface. If a style point keeps coming up, add it to the
  linter, not to every review.
analogy: Telling a friend there's a crumb on their collar. Worth a word, not worth stopping the meeting.
usage: "Nit: `items` reads better than `data` here, but don't let it hold up the merge."
related:
  - code-review
  - linter
  - pull-request
level: 2
lessons:
  - judgment.reviewing-a-change
