term: FIFO queue
aka: [FIFO, first in first out, deque, double-ended queue]
short: A line where items join at the back and leave from the front, so the oldest leaves first.
explain: |
  A printer prints jobs in the order they were sent. Whoever joined first is served first.
  You add at the back and take from the front, and both should be O(1).

  In Python use `collections.deque`. In JavaScript, `array.shift()` takes from the front
  but moves every other item, so it's O(n). For big inputs, keep a head index that moves
  forwards instead.

  Breadth-first search runs on one: it's what keeps the rings of nodes in order. A deque
  lets you add and remove at both ends.
analogy: The line at a supermarket till. New people join at the back; the person at the front is served next.
example:
  language: js
  code: |
    const queue = [start];
    let head = 0;                 // front of the line
    while (head < queue.length) {
      const node = queue[head++]; // O(1), unlike queue.shift()
      for (const next of neighbours(node)) {
        if (!seen.has(next)) { seen.add(next); queue.push(next); }
      }
    }
usage: Use a real FIFO queue for the BFS; shift() on an array of a million nodes is quadratic.
twin:
  term: stack
  difference: A FIFO queue hands out the oldest item first, in arrival order. A stack hands out the newest item first, from the top.
related: [stack, breadth-first-search, priority-queue, queue, hidden-quadratic]
level: 1
lessons: [algo.stacks-and-queues, algo.bfs-and-dfs]
