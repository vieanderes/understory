summary: >-
  A coding agent on a real repository works for longer than one chat and touches more than one
  file. Left alone, it drifts: it widens the task, reports tests as passing that never ran,
  switches off a check that got in its way, and forgets everything when the session ends. The
  model isn't the weak part. The setup around it is.


  The fix is a small **workbench** of files and scripts that make the work checkable. An
  instruction file holds rules a diff or a command can verify. A **scope contract** says what
  one task may and may not touch, and what proves it's done. A **verification gate** reads
  real exit codes and the diff, and it, not the agent, says whether the task is done. The
  agent attaches **proof** a person can open, matched to what it claims. A **reviewer** in a
  separate session, with none of the author's chat, tries to break the change. A **handoff
  note** lets the next session start in a minute instead of rediscovering the last hour.


  Reach for this once an agent works on anything longer than a one-line fix, or when several
  sessions or agents share a task. For a quick question in an unfamiliar codebase, it's more
  ceremony than the work needs.
remember:
  - An agent's "done" is a claim; a verification gate that reads exit codes and the diff decides.
  - A useful rule in an instruction file is one a diff or a command can check, and "done" is written the same way.
  - A scope contract names the goal, allowed paths, forbidden paths, the commands that prove it's done, and what needs asking first.
  - Feed a failing check back as its exact output, with the test name, expected and actual values, file and line.
  - The agent attaches proof that matches its claim, such as test output with its command for logic, or screenshots and a recording for a screen.
  - An independent reviewer gets only the intent, the diff and the proof, and tries to break the change.
  - A handoff note records what changed, what failed and why, what's still failing, and the one next action.
  - Never let an agent weaken a check to get green; the rule is "stop and report".
sections:
  - title: Writing rules an agent can follow and you can check
    body: |-
      Most rules in a first instruction file are wishes: "be careful", "write good tests",
      "ask if unsure". The agent can't act on them, and nobody can tell afterwards whether
      they held. Rewrite each one until something can check it.

      Five kinds of rule cover most needs:

      - **Start-up**: what must be true before work begins, such as "read `docs/handoff.md`
        and run `pnpm check` first".
      - **Forbidden**: what must never happen, such as "never edit `migrations/` or
        `.github/`".
      - **Done**: what proves completion, such as "`pnpm check` exits 0 and the new test
        passes".
      - **Uncertainty**: what to do when unsure, such as "write the question in the handoff
        and stop, don't guess".
      - **Approval**: what needs a person, such as "any new dependency, any schema change".

      ```text
      ## Rules
      - Never edit generated/ or migrations/. Run pnpm codegen instead.
      - Never skip, delete or loosen a failing test. Stop and report the output.
      - New dependency or schema change: ask first.
      - Done: pnpm check exits 0, and the task's own test passes.
      ```

      Keep the root file short enough to read every session, and link to topic files for
      depth. A rule that a linter, a hook or CI can enforce should also be enforced there,
      because the tool holds even when the file is ignored.
  - title: The gate and the feedback loop
    body: |-
      A **verification gate** is a script, not a judgement. It runs the checks the contract
      names, reads their exit codes, and compares the list of changed files with the allowed
      and forbidden paths. A check that never ran counts as a failure, which catches the
      commonest false claim: "all tests pass".

      ```bash
      pnpm test && pnpm typecheck && pnpm lint
      echo "exit: $?"
      git diff --name-only main...HEAD
      ```

      Between gate runs, the agent needs good feedback. Paste the failing output itself: the
      test name, the expected and received values, the file and line, the first lines of the
      stack trace. A summary such as "the date test fails" throws away the detail the agent
      needs, so it guesses and often changes the test instead of the code.

      Keep the gate deterministic. It blocks on facts: exit codes, paths, coverage. A gate
      that asks a model whether the code "looks done" is no gate at all. Judgement belongs to
      the reviewer, later.
  - title: Proof that matches the claim
    body: |-
      A green gate proves the checks ran. It doesn't prove the feature works the way a person
      will use it. So every "done" from an agent comes with **proof**: evidence a person can
      open without rerunning anything.

      Pick the proof from the claim, not from what's quickest to produce:

      - "The rounding is right": test output, with the command that produced it, so anyone
        can rerun it.
      - "The screen works on phones": screenshots at 390 and 1440 pixels wide, in light and
        dark if the app has both.
      - "The checkout flow works": a short recording from the first tap to the confirmation.
      - "The slow query is fixed": logs or timings, before and after.

      Proof only covers its own claim. A passing unit test says nothing about a layout that
      overflows on a phone. A screenshot of a full cart says nothing about the empty cart.
      When a claim has an edge case, name it and ask for proof of that case.

      Write the proof into the scope contract before work starts, next to `done_when`:

      ```yaml
      proof:
        end_date_included: pnpm test src/orders (output attached)
        fits_on_a_phone: search-390.png, search-1440.png
      ```

      The agent then knows what to produce, and the reviewer knows what to look at. Proof that
      doesn't match a listed claim is decoration.
  - title: A reviewer that tries to break it
    body: |-
      After the gate passes and the proof is in, a **reviewer** looks for what no script
      checks: the wrong behaviour, a missed case, a risk, a change that isn't the one asked
      for.

      Run it as a separate subagent or a new session that never saw the authoring chat. The
      author's chat is full of reasons the change looked right. A reviewer that reads it
      inherits those assumptions, grades the story instead of the diff, and can be talked
      round: "the edge cases were already checked" becomes its conclusion too.

      A subagent starts with a fresh context, but the task message you write is all it knows
      of the task. Paste the author's summary into it and the story leaks back in. A forked
      session, which copies the parent conversation, isn't independent at all.

      ```yaml
      reviewer:
        session: new
        intent: Filter order search by date
        diff: git diff main...HEAD
        proof: [orders-test.txt, search-390.png, search-1440.png]
        task: Find an input that breaks this change
      ```

      Three inputs, and nothing else: the intent, the diff and the proof. Then ask it to break
      the change, not to confirm it. "Check this looks fine" invites a yes. "Find an input
      where the end date is dropped" sends it looking. A useful report names the cases it
      tried, even when none broke.

      The gate and the reviewer stay apart. The gate is deterministic and blocks. The reviewer
      judges and reports. A person still owns the merge.
  - title: Handoff notes and clean state
    body: |-
      Sessions end: the context fills, the day ends, a different agent takes over. Without a
      handoff, the next session spends its first half hour rediscovering what the last one
      knew and repeating what already failed.

      ```yaml
      task: Filter order search by date
      changed: [orders/search.py, tests/test_search.py]
      checks: 1 failed, 41 passed
      still_failing: test_includes_end_date
      tried: comparing datetimes, which drops orders late on the end date
      next_action: compare dates, not datetimes
      open_questions: [Should the end date be inclusive for refunds too?]
      ```

      The **next action** carries the most weight. A note without it is a status report; with
      it, the next session can start at once. The **tried** line saves the most time, because
      it stops the next session from walking into the same wall.

      A good note sits on a clean state: changes committed on the right branch, no scratch
      files or debug prints, and any red test named in the note rather than left as a
      surprise. Long-running agent setups often keep a progress file and a feature list in the
      repository for the same reason, and read them, with the git log, at the start of every
      session.
pitfalls:
  - "**Rules written as wishes.** \"Be careful\" can't be followed or checked. Rewrite each rule as something a diff or a command shows, or delete it."
  - "**Telling the agent to silence failing checks.** A line like \"add `eslint-disable` and carry on\" teaches it to hide problems. The rule is to stop and report the output."
  - "**Trusting the agent's report.** \"All tests pass\" is a sentence, not a result. Let a gate run the checks and read the exit codes."
  - "**A scope contract with only allowed paths.** Without a forbidden list, a plausible side trip into billing or CI config looks in scope. Name what must not be touched."
  - "**Feeding back a summary instead of the output.** \"It still fails\" leaves the agent guessing. Paste the test name, expected and actual values, file and line."
  - "**Reviewing inside the author's chat.** A reviewer that read the author's reasoning grades the story. Give a separate session only the intent, the diff and the proof."
  - "**Proof that doesn't match the claim.** A passing unit test doesn't show a screen fits a phone. Ask for screenshots for layout and a test for each edge case."
  - "**Ending a session without a next action.** The next session wastes its start rediscovering state. Write what failed, what's open and the one thing to do first."
verify:
  - lens: tests
    check: Let the gate read the real exit code of each check, never the agent's report that the checks passed.
  - lens: breaks
    check: Compare the diff's file list with the scope contract, and fail the task if it touches a forbidden or unlisted path.
  - lens: breaks
    check: Search the diff for new lint-disable comments, skipped tests and loosened assertions, which an agent may add to reach green.
  - lens: tests
    check: Match each claim to proof a person can open, such as test output with its command or screenshots at 390 and 1440 wide.
  - lens: breaks
    check: Hand the reviewer only the intent, the diff and the proof, never the author's chat, and ask it to break the change.
  - lens: confuses
    check: End every agent session with a handoff note saying what changed, what still fails and the one next action.
interview:
  - question: How do you stop a coding agent from drifting outside the task you gave it?
    answer: >-
      I write the task's scope down and check the result against it. Before the agent starts,
      a short scope contract names the goal, the paths it may change, the paths it must not
      touch, the commands that prove it's done, and what needs asking first, such as a new
      dependency. The agent reads it first. At the end a gate compares the changed files with
      the contract and fails on anything forbidden or out of scope. The forbidden list
      matters, because a side trip into CI config always has a plausible reason in the
      moment. The trade-off is a minute of writing per task, which I skip for one-line fixes
      and never skip for anything that runs unattended.
  - question: An agent tells you "all tests pass". What do you do?
    answer: >-
      I treat it as a claim and let the gate check it. A verification gate runs the checks
      the task requires, reads their exit codes, and treats a check that never ran as a
      failure, because the commonest false report is about tests that didn't run or ran on
      the wrong files. It also checks the diff against the scope contract. I ask for proof
      that matches the claim: test output with its command, and screenshots if a screen
      changed. Then a reviewer in a separate session, given only the intent, the diff and
      the proof, tries to break it. I also look at the test diff first, since an agent told
      to get green may loosen an assertion. The trade-off is time on every task, which is small next to
      debugging a change that was never really checked.
  - question: What goes in a good AGENTS.md or CLAUDE.md for a large repository?
    answer: >-
      A short router with rules that can be checked, and links to depth. The root file holds
      the commands, including how to run one test, the few hard rules, a definition of done
      such as "`pnpm check` exits 0", what to do when unsure, and what needs approval. Each
      rule is something a diff or a command can verify, so "never edit `migrations/`" rather
      than "be careful with the database". Topic files, such as a testing or architecture
      guide, are linked and read only when a task touches them, and nested files can hold
      local rules for a folder. Anything a linter or hook can enforce is enforced there too.
      The risk is growth: every incident adds a line, so the file needs pruning like code.
  - question: How do you keep a long agent task on track across several sessions?
    answer: >-
      I make the state live in the repository, not in a chat. Each session starts by reading
      the instruction file, the handoff note and the git log, and runs the checks to see
      where things stand. Each session ends on a clean state with a handoff note: what
      changed, what was tried and why it failed, what's still failing, open questions, and
      the one next action. For bigger work a feature list with one item in progress at a time
      stops the agent starting three things. The trade-off is discipline at the end of every
      session, but it's far cheaper than a new session repeating the last one's failed
      attempts.
terms:
  - term: Instruction file
    say: A README the agent reads, so anything helpful goes in.
    means: >-
      A file such as `AGENTS.md` or `CLAUDE.md` read at the start of every session, holding
      commands and rules that a diff or a command can check.
  - term: Scope contract
    say: The ticket description.
    means: >-
      A short file for one task with the goal, allowed and forbidden paths, the commands that
      prove it's done, and what needs asking first, checked against the diff at the end.
  - term: Verification gate
    say: Running the tests.
    means: >-
      A deterministic script that decides whether a task is done from real exit codes and the
      diff checked against the scope contract. The agent can't override it.
  - term: Proof
    say: The agent saying it tested it.
    means: >-
      Evidence a person can open that matches a claim, such as test output with its command,
      screenshots at phone and desktop widths, or a recording of the flow.
  - term: Independent reviewer
    say: Asking the agent to double-check its work.
    means: >-
      A separate subagent or session that never saw the authoring chat, given only the
      intent, the diff and the proof, and asked to break the change.
  - term: Handoff note
    say: A summary of the session.
    means: >-
      A record of what changed, what failed and why, what's still failing and the one next
      action, so the next session can start at once.
  - term: Definition of done
    say: When the agent says it's finished.
    means: >-
      A condition written down before work starts, such as "`pnpm check` exits 0 and the new
      test passes", that a gate can check.
