term: binary search tree
aka: [BST, balanced binary search tree, self-balancing tree]
short: A branching structure where everything left of a node is smaller and everything right is larger.
explain: |
  Each node holds a key and up to two children. Smaller keys go left, larger go right. To
  find a key, start at the top and turn left or right at each node.

  Each turn throws away a whole side, so a balanced one finds, inserts and deletes in
  O(log n). Walking it left, node, right gives the keys in sorted order.

  Insert keys already in order and it grows into a one-sided chain, so every operation is
  O(n). Self-balancing versions, such as red-black trees, rotate nodes to stop that.
analogy: A "choose your path" book. At each page you turn left for earlier and right for later, and never read the other branch.
example:
  language: ts
  code: |
    type Node = { key: number; left?: Node; right?: Node };

    function has(node: Node | undefined, key: number): boolean {
      if (!node) return false;
      if (key === node.key) return true;
      return has(key < node.key ? node.left : node.right, key);
    }
usage: Inserting sorted ids into a plain binary search tree gives you a linked list with extra steps.
twin:
  term: b-tree
  difference: A binary search tree has two children per node and lives in memory. A B-tree packs hundreds of keys per node so it stays a few levels deep on disk.
related: [tree, b-tree, binary-search, binary-heap]
level: 2
lessons: [cs.trees]
