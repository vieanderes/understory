term: CommonJS
aka: [CJS, require, module.exports]
short: Node's original way of splitting code into files, loading each one synchronously when it is asked for.
explain: |
  Before JavaScript had a standard module system, Node made its own. A file calls
  `require('./prices')`, and gets back whatever that file put on `module.exports`.

  It runs as it goes: `require` reads and runs the file there and then, synchronously. What
  you get is a plain object, so a later change in the exporter isn't seen. Many older
  packages still ship it, and Node decides per file which system to use, from the file
  extension and the `type` field in `package.json`.
analogy: Photocopying a page from a colleague's notebook. You have it now, but later edits don't reach your copy.
example:
  language: js
  code: |
    // prices.cjs
    module.exports = { VAT: 0.2 };

    // checkout.cjs
    const { VAT } = require('./prices.cjs');
usage: That package only ships CommonJS, so the bundler can't drop the parts we don't use.
related: [es-module, package-manager, tree-shaking]
level: 2
lessons: [js.modules, tooling.node]
