term: code walkthrough
aka:
  - walkthrough
  - walking through code
short: Explaining code to someone aloud, following one realistic input from start to finish.
explain: |
  Reading a file aloud from line one loses everyone by line twenty. Listeners need to know
  what it's for and where to look.

  Start with the intent: what the code does and why it exists. Then follow one ordinary input
  through it, with concrete values, along the main path. Only then add the branches and the
  failures.

  Say what you skip. "Ignore the retry wrapper for now" gives the listener permission not to
  follow everything, and they'll follow the rest better.
analogy: A building tour that follows one visitor from the front door, not one listing every room in order.
usage: In the code walkthrough, follow one order of two items through checkout before showing the coupon branch.
related:
  - code-review
  - bottom-line-up-front
  - project-deep-dive
level: 2
lessons:
