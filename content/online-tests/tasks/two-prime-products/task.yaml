id: two-prime-products
title: TwoPrimeProducts
topic: sieve
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: N, type: int }
    - { name: R, type: "int[][]" }
  returns: "int[]"
statement: |-
  A number puzzle calls a positive integer a two-prime product when it equals P · Q for two
  different prime numbers P and Q. For example, 6 = 2 · 3 and 35 = 5 · 7 are two-prime
  products. 4 = 2 · 2 is not, because the primes are the same, and 30 = 2 · 3 · 5 is not,
  because it needs three primes.

  The puzzle asks M questions, given in an array R. Question K is a pair R[K] = [A, B] and
  asks how many two-prime products lie between A and B, both included.

  Write a function:

  {{signature}}

  that, given an integer N and an array R of M questions, returns an array of M integers:
  the answer to each question, in order.

  For example, given N = 26 and R = [[1, 26], [4, 10], [16, 20]], the function should
  return [7, 2, 0]. The two-prime products up to 26 are 6, 10, 14, 15, 21, 22 and 26.

  Given N = 40 and R = [[33, 40]], the function should return [5], for 33, 34, 35, 38 and 39.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..50,000];
  - M is an integer within the range [1..30,000];
  - each element of array R is a pair [A, B] of integers with 1 ≤ A ≤ B ≤ N.
examples:
  - { args: [26, [[1, 26], [4, 10], [16, 20]]], expected: [7, 2, 0] }
  - { args: [40, [[33, 40]]], expected: [5] }
tests:
  - name: extreme_single
    description: one number in the range
    group: correctness
    cases:
      - { args: [1, [[1, 1]]], expected: [0] }
      - { args: [6, [[6, 6]]], expected: [1] }
      - { args: [4, [[4, 4], [2, 3]]], expected: [0, 0] }
  - name: simple
    description: simple tests
    group: correctness
    cases:
      - { args: [35, [[1, 35], [30, 30], [14, 15]]] }
      - { args: [100, [[1, 100], [50, 60], [90, 100]]] }
  - name: squares_and_cubes
    description: squares, cubes and products of three primes
    group: correctness
    cases:
      - { args: [125, [[4, 4], [8, 9], [25, 25], [27, 27], [30, 30], [49, 49], [121, 125]]] }
  - name: small_random
    description: random, N = 500, M = 50
    group: correctness
    cases:
      - generate: { seed: 101, args: [{ kind: value, value: 500 }, { kind: pairs, n: 50, min: 1, max: 500 }] }
  - name: medium_random
    description: random, N = 5,000, M = 1,000
    group: correctness
    cases:
      - generate: { seed: 102, args: [{ kind: value, value: 5000 }, { kind: pairs, n: 1000, min: 1, max: 5000 }] }
  - name: large_random
    description: random, N = 50,000, M = 30,000
    group: performance
    cases:
      - generate: { seed: 103, args: [{ kind: value, value: 50000 }, { kind: pairs, n: 30000, min: 1, max: 50000 }] }
  - name: extreme_large
    description: long ranges near the top, N = 50,000, M = 30,000
    group: performance
    cases:
      - generate: { seed: 104, args: [{ kind: value, value: 50000 }, { kind: pairs, n: 30000, min: 25000, max: 50000 }] }
