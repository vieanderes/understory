deepDive: >-
  How the 45 minutes usually go for an agent question: requirements and the tool list
  first, then the harness sketch, then a deep dive the interviewer picks. Common picks are
  approvals, retries and injection.


  What interviewers probe. What stops a runaway loop? A step cap, a cost cap per request
  and a check for the same tool called with the same arguments twice. What if a ticket says
  "ignore your rules"? The text is data, and the approval gate still guards every costly
  action. How would you roll it out? Start in a mode that only suggests actions, measure how
  often people accept them, then let low-risk tools run alone. What does the audit log hold?
  Who asked, every tool call with its arguments, who approved, and what happened.


  Workflow or agent? If the steps are always the same, write them as code and call the
  model only where judgement is needed. That's cheaper, faster and easier to test. Reach
  for an open-ended agent when the path really varies from request to request.


  The agent engineering chapter builds this harness for real. Start with "The harness
  around the model", then "What an agent may touch" for permissions and approvals.
