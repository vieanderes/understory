id: saga-steps
title: SagaSteps
topic: reliability
difficulty: medium
type: coding
recommendedMinutes: 20
signature:
  params:
    - { name: S, type: "string[]" }
    - { name: R, type: "int[]" }
    - { name: U, type: "int[]" }
  returns: "string[]"
statement: |-
  An order goes through N steps across several services, such as reserving stock, charging
  a card and booking a courier. There is no shared transaction, so each step that changes
  something has an undo action that reverses it. Step K is named S[K]:

  - R[K] = 1 if the step succeeds when run, and 0 if it fails;
  - U[K] = 1 if its undo succeeds, 0 if its undo fails, and -1 if the step only reads data
    and has no undo.

  The steps run in order. When one fails, no later step runs, and the steps that already
  succeeded are undone in reverse order, skipping those without an undo. A step that failed
  is not undone, because it changed nothing. If an undo fails, the system stops at once and
  leaves the rest for a person to fix.

  Write a function:

  {{signature}}

  that, given an array S of N strings and arrays R and U of N integers, returns the log as
  an array of strings, in the order things happen:

  - `"done X"` when step X succeeds and `"failed X"` when it fails;
  - `"undo X"` when the undo of step X succeeds and `"stuck X"` when it fails;
  - a last entry: `"committed"` if every step succeeded, `"rolled back"` if every needed
    undo succeeded, or `"needs attention"` if an undo failed.

  For example, given S = ["check", "reserve", "charge", "ship"], R = [1, 1, 0, 1] and
  U = [-1, 1, 1, 1], the function should return ["done check", "done reserve",
  "failed charge", "undo reserve", "rolled back"].

  Given S = ["reserve", "charge", "ship"], R = [1, 1, 0] and U = [0, 1, 1], the function
  should return ["done reserve", "done charge", "failed ship", "undo charge",
  "stuck reserve", "needs attention"].

  Given S = ["reserve", "charge"], R = [1, 1] and U = [0, 0], the function should return
  ["done reserve", "done charge", "committed"]: no undo is needed.

  Assume that:

  - N is an integer within the range [1..100];
  - each element of array S is a non-empty string of lower-case letters and hyphens, and
    the names are unique;
  - each element of array R is 0 or 1;
  - each element of array U is -1, 0 or 1.

  In your solution, focus on **correctness**. The performance of your solution will not be
  the focus of the assessment.
examples:
  - { args: [["check", "reserve", "charge", "ship"], [1, 1, 0, 1], [-1, 1, 1, 1]], expected: ["done check", "done reserve", "failed charge", "undo reserve", "rolled back"] }
  - { args: [["reserve", "charge", "ship"], [1, 1, 0], [0, 1, 1]], expected: ["done reserve", "done charge", "failed ship", "undo charge", "stuck reserve", "needs attention"] }
  - { args: [["reserve", "charge"], [1, 1], [0, 0]], expected: ["done reserve", "done charge", "committed"] }
tests:
  - name: extreme_single
    description: one step that succeeds or fails
    group: correctness
    cases:
      - { args: [["pay"], [1], [1]], expected: ["done pay", "committed"] }
      - { args: [["pay"], [0], [0]], expected: ["failed pay", "rolled back"] }
  - name: first_step_fails
    description: nothing to undo
    group: correctness
    cases:
      - { args: [["reserve", "charge", "ship"], [0, 1, 1], [1, 0, 0]], expected: ["failed reserve", "rolled back"] }
  - name: failed_step_not_undone
    description: the failed step's own undo would fail, but it is never run
    group: correctness
    cases:
      - { args: [["reserve", "charge"], [1, 0], [1, 0]], expected: ["done reserve", "failed charge", "undo reserve", "rolled back"] }
      - { args: [["a", "b", "c", "d"], [1, 1, 0, 0], [1, 1, 0, 0]], expected: ["done a", "done b", "failed c", "undo b", "undo a", "rolled back"] }
  - name: read_only_steps
    description: steps without an undo are skipped during the rollback
    group: correctness
    cases:
      - { args: [["check-stock", "check-fraud", "notify"], [1, 1, 0], [-1, -1, 1]], expected: ["done check-stock", "done check-fraud", "failed notify", "rolled back"] }
      - { args: [["load", "reserve", "price", "charge", "ship"], [1, 1, 1, 1, 0], [-1, 1, -1, 1, 1]], expected: ["done load", "done reserve", "done price", "done charge", "failed ship", "undo charge", "undo reserve", "rolled back"] }
  - name: stuck_stops_rollback
    description: an undo fails, so earlier steps stay as they are
    group: correctness
    cases:
      - { args: [["a", "b", "c", "d"], [1, 1, 1, 0], [1, 1, 0, 1]], expected: ["done a", "done b", "done c", "failed d", "stuck c", "needs attention"] }
      - { args: [["a", "b", "c", "d"], [1, 1, 1, 0], [0, -1, 1, 1]], expected: ["done a", "done b", "done c", "failed d", "undo c", "stuck a", "needs attention"] }
  - name: all_succeed
    description: every step succeeds, so no undo runs whatever U says
    group: correctness
    cases:
      - { args: [["a", "b", "c"], [1, 1, 1], [0, -1, 0]], expected: ["done a", "done b", "done c", "committed"] }
