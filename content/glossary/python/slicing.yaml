term: slicing
aka:
  - slice notation
short: Taking a section of a list or string with start, stop and step inside square brackets.
explain: |
  You want the first three items, or the last two characters, or every other row. Python
  has one compact notation for all of these.

  `items[start:stop:step]` includes `start` and stops before `stop`. Leave one out and it
  runs to the edge. Negative numbers count from the end, so `[-2:]` is the last two. A
  slice of a list is a new list, a shallow copy. The trap: `items[-n:]` with `n = 0` is
  `items[0:]`, the whole list, not an empty one.
analogy: Cutting slices from a loaf. You say where to start cutting and where to stop, and you can skip every other slice.
example:
  language: python
  code: |
    letters = "abcdefg"
    letters[:3]     # 'abc'
    letters[-2:]    # 'fg'
    letters[::2]    # 'aceg'
    letters[::-1]   # 'gfedcba'
usage: Slicing gives you a copy, so changing top_three won't touch the original scores.
