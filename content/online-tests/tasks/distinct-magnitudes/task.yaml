id: distinct-magnitudes
title: DistinctMagnitudes
topic: counting-elements
difficulty: easy
type: algorithmic
recommendedMinutes: 15
signature:
  params:
    - { name: A, type: "int[]" }
  returns: int
statement: |-
  A vibration sensor logs N readings in an array A. Some readings are negative. The
  **magnitude** of a reading is its absolute value.

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the number of different magnitudes in A.

  For example, given A = [−5, −3, −1, 0, 3, 6], the function should return 5. The
  magnitudes are 5, 3, 1, 0 and 6, and 3 appears twice.

  Given A = [4, 4, 4, 4], the function should return 1.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [−2,147,483,648..2,147,483,647].
examples:
  - { args: [[-5, -3, -1, 0, 3, 6]], expected: 5 }
  - { args: [[4, 4, 4, 4]], expected: 1 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: a single reading
    group: correctness
    cases:
      - { args: [[0]], expected: 1 }
      - { args: [[-7]], expected: 1 }
  - name: simple
    description: each value with its negative, zero and one
    group: correctness
    cases:
      - { args: [[-2, 2, -9, 9, 0, 0]], expected: 3 }
      - { args: [[0, 1, -1, 0]], expected: 2 }
  - name: negative_only
    description: all readings negative
    group: correctness
    cases:
      - { args: [[-1, -2, -3, -2]], expected: 3 }
  - name: sorted
    description: ascending and descending readings
    group: correctness
    cases:
      - { args: [[-4, -1, 0, 1, 4, 5]], expected: 4 }
      - { args: [[5, 4, 1, 0, -1, -4]], expected: 4 }
  - name: extreme_min_max_value
    description: the extremes of the value range
    group: correctness
    cases:
      - { args: [[-2147483648, 2147483647]], expected: 2 }
      - { args: [[-2147483647, 2147483647]], expected: 1 }
      - { args: [[-2147483648, -2147483648]], expected: 1 }
  - name: small_random
    description: random readings in [−100..100], N = 500
    group: correctness
    cases:
      - generate: { seed: 11, args: [{ kind: ints, n: 500, min: -100, max: 100 }] }
      - generate: { seed: 12, args: [{ kind: ints, n: 300, min: -2147483648, max: 2147483647 }] }
  - name: medium_random
    description: random readings, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 13, args: [{ kind: ints, n: 2000, min: -1000, max: 1000 }] }
  - name: large_distinct
    description: evenly spaced readings, N = 100,000
    group: performance
    cases:
      - generate: { seed: 14, args: [{ kind: range, n: 100000, start: -2000000000, step: 40000 }] }
  - name: large_symmetric
    description: readings symmetric around zero, N = 100,000
    group: performance
    cases:
      - generate: { seed: 15, args: [{ kind: range, n: 100000, start: -350000, step: 7 }] }
  - name: large_random
    description: random readings across the whole range, N = 100,000
    group: performance
    cases:
      - generate: { seed: 16, args: [{ kind: ints, n: 100000, min: -2147483648, max: 2147483647 }] }
