title: Full-stack and AI engineering
summary: >-
  One course from your first line of code to a deployed, observable system: the web, the
  backend and its data, Python, AI engineering, system design and interview preparation. Each
  chapter says why it matters and ends with something you can build.
# The course in seven parts, in course order. A part is a stretch of the journey with a
# checkpoint and a capstone at its end. Woven modules (cs, clean, pro, nextserver) belong to no part:
# each of their lessons counts towards the part of the lesson it is woven after.
# Part ids are one lowercase word and never a module id, because the capstone and
# test-out events name a part the way they name a module.
parts:
  - id: firstcode
    title: First code
    summary: You can write small programs and build a page that is structured, styled and responsive.
    modules: [basics, html, css]
    capstone:
      title: A reading list page
      brief: >-
        Build one page that lists books you want to read. Write the list in JavaScript with
        objects and a loop that prints a summary to the console. Mark the page up with
        semantic HTML, with a form for suggesting a book that works without JavaScript. Lay it out with CSS
        on an 8 pt grid, with design tokens as custom properties, so it reads well from a
        phone to a wide screen.
  - id: languages
    title: JavaScript and TypeScript
    summary: You can write modern JavaScript and TypeScript with confidence, and set up the tools that check it.
    modules: [js, ts, tooling]
    capstone:
      title: A typed shopping cart
      brief: >-
        Write a shopping cart module with quantity rules, first in plain JavaScript without
        help from an assistant. Port it to TypeScript with a typed data model, and validate
        every item where it enters. Add a build, a lint and type-check gate, and an
        environment schema, so the project runs the same on any machine.
  - id: interfaces
    title: Interfaces
    summary: You can build accessible React and Next.js interfaces on a small design system.
    modules: [react, next, design]
    capstone:
      title: A small storefront
      brief: >-
        Build a Next.js app with a product list, a product page and a checkout form. Keep
        each piece of state where it belongs, load the products on the server, and keep the
        product pages static with revalidation. Style it from a small component library with
        variants, make the form fully accessible, and give every animation a reduced-motion
        path.
  - id: servers
    title: Servers and data
    summary: You can build an API on a real database and prove it works with tests.
    modules: [backend, db, testing]
    capstone:
      title: A booking API
      brief: >-
        Build an API for booking rooms, with sessions and ownership checks. Store bookings
        in a schema with constraints, take each booking in a safe transaction, and add a
        reversible migration. Handle a payment webhook idempotently. Prove it with unit
        tests, integration tests on a real database and one end-to-end journey.
  - id: production
    title: Production
    summary: You can run a system that stays secure, fast and available under load.
    modules: [security, perf, scale, arch, cloud]
    capstone:
      title: The booking API in production
      brief: >-
        Take the booking API to production. Write a threat model and add rate limits and
        access-control tests. Set a performance budget in CI. Move slow work to a
        queue-backed worker, split the code into modules behind ports, and record three
        decisions. Deploy it in a container behind a reverse proxy, release without
        downtime, and prove a restore works.
  - id: aiengineering
    title: Python and AI engineering
    summary: You can build a Python service that uses a model safely and measure how well it works.
    modules: [python, pyai, ai, aisys]
    capstone:
      title: A support assistant
      brief: >-
        Build a support assistant as an async FastAPI service in a typed uv project. It
        retrieves answers from your own documents, validates every model reply with
        Pydantic, and uses tools only through guarded code paths. A classifier routes each
        ticket, a person approves risky steps, and an evaluation suite gates every prompt
        change.
  - id: senior
    title: Senior engineer
    summary: You can design systems, solve problems methodically and explain your decisions to a team.
    modules: [sysdesign, algo, atlas, career, interview]
    capstone:
      title: A design review pack
      brief: >-
        Write up one system you would build, with requirements, estimates, a diagram, deep
        dives and failure modes. Add a decision document comparing two routes for one part
        of it, and a solved set of problems, one per pattern, each with tests and a
        complexity note. Pass one timed mock assessment, and finish with five STAR stories drawn
        from the work.
