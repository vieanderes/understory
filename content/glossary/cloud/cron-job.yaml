term: cron job
aka: [cron, crontab, scheduled job]
short: A command that runs automatically on a timetable, such as every night at three.
explain: |
  Some work belongs to the clock, not to a request: a nightly digest, an hourly sync, a
  weekly clean-up. The scheduler starts a command when the time matches, and that's all
  it knows.

  It doesn't know whether the last run finished, or whether three servers all started the
  same job. So the safety lives in the job. Claim each time slot once, and hold a lease so runs can't overlap. Keep a watermark so a
  missed or failed run catches up. Schedule in UTC.
  Many teams let the scheduler only enqueue the job, so ordinary workers run it with retries.
analogy: An alarm clock. It rings at seven whether or not you're already up, and it rings in every room that has one.
example:
  language: text
  code: |
    # minute hour day month weekday
    0 3 * * *   node jobs/send-digest.js
    */15 * * * * node jobs/sync-prices.js
usage: The cron job ran on all three instances, so everyone got the digest three times; claim the slot first.
related: [lease, watermark, queue, idempotent]
level: 1
lessons: [scale.cron]
