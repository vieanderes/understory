term: cascade layer
aka:
  - "@layer"
  - CSS layer
short: A named group of styles whose order decides precedence before selector strength is even compared.
explain: |
  A reset, a component library and your own overrides all fight on specificity. Your
  simple override loses to a library's long selector, so you reach for `!important`.

  Layers settle it up front. You declare an order, such as `@layer reset, base,
  components, utilities;`, and a later layer beats an earlier one whatever the selectors.
  Specificity only matters inside a layer. Styles outside every layer beat all of them,
  which surprises people adding layers to an old codebase.
analogy: Sheets of tracing paper stacked in a fixed order. Whatever's drawn on the top sheet shows, however bold the lines below.
example:
  language: css
  code: |
    @layer reset, components, utilities;

    @layer components {
      .menu a.link { color: navy; }
    }
    @layer utilities {
      .text-muted { color: grey; }  /* wins */
    }
usage: Put the vendor styles in a low cascade layer and our one-class overrides will win.
related:
  - cascade
  - specificity
level: 3
