summary: >-
  Backtracking is a depth-first walk through a tree of choices. Each level of the recursion
  makes one choice, the next level makes the next one, and when a branch is finished the
  choice is undone so the following branch starts from a clean state. It visits every
  candidate once, which makes it the standard tool when a task asks for all of something:
  every subset, every order, every way to fill a board.


  The signals are in the wording and the constraints. "List all", "every arrangement",
  "generate every valid", "place n pieces so that none attack" and "can this word be traced
  in the grid" all call for it. So does a small n, typically 20 or less for subsets and 10 or
  less for orders, because the number of answers itself grows exponentially.


  Two things decide whether a backtracking solution passes. The first is bookkeeping: one
  shared path, pushed and popped symmetrically, with a copy taken when an answer is recorded.
  The second is pruning: a check at each choice that abandons a branch as soon as it cannot
  lead to a valid answer. Pruning changes nothing about the worst case, but on real inputs it
  is the difference between a millisecond and never.


  When the task asks only how many ways, or for the best one, look at dynamic programming
  first. Backtracking lists; dynamic programming counts and optimises. If the same smaller
  question repeats across branches, caching it turns a backtracking search into DP.
remember:
  - Backtracking is choose, explore, undo, run as a depth-first search over a tree of partial answers.
  - Push a copy of the path when you record an answer, because every call shares one array.
  - Subsets start the next level at i + 1; orders loop over every item and skip the ones already used.
  - With n items there are 2^n subsets and n factorial orders, so the cost is at least the size of the output.
  - Prune by checking a choice before you recurse, and sort first when an ordering lets you `break` the loop.
  - Anything you mark during a choice, such as a visited cell or a used flag, must be unmarked on the way back.
  - To skip duplicate answers from repeated values, sort and skip an item equal to its neighbour at the same level.
  - If the question asks how many or which is best, check for overlapping subproblems and use dynamic programming instead.
sections:
  - title: One template, three shapes
    body: |-
      Almost every backtracking problem is one of three shapes: subsets (take or skip each
      item), combinations of size k (subsets with a length rule), and orders (use every item
      once, in any order). The skeleton is the same; only the loop and the base case change.

      ```js
      // Every subset. An answer is recorded at every node, not only at the leaves.
      function subsets(items) {
        const result = [];
        const path = [];
        function explore(start) {
          result.push([...path]);
          for (let i = start; i < items.length; i++) {
            path.push(items[i]); // choose
            explore(i + 1); // explore
            path.pop(); // undo
          }
        }
        explore(0);
        return result;
      }

      // Every order. A used flag makes the "already in the path?" check O(1).
      function orders(items) {
        const result = [];
        const path = [];
        const used = new Array(items.length).fill(false);
        function explore() {
          if (path.length === items.length) {
            result.push([...path]);
            return;
          }
          for (let i = 0; i < items.length; i++) {
            if (used[i]) continue;
            used[i] = true;
            path.push(items[i]);
            explore();
            path.pop();
            used[i] = false;
          }
        }
        explore();
        return result;
      }

      console.log(subsets(['a', 'b'])); // [[], ['a'], ['a', 'b'], ['b']]
      console.log(subsets([])); // [[]]
      console.log(orders([1, 2, 3]).length); // 6
      console.log(orders([1, 2])); // [[1, 2], [2, 1]]
      ```

      Subsets cost O(2^n × n) time, because there are 2^n of them and each copy costs up to
      n. Orders cost `O(n! × n)`. The extra space beyond the output is O(n): the path, the
      flags and the recursion stack. Using `used[i]` rather than `path.includes(item)` also
      makes the function correct when two items are equal, since it tracks positions, not
      values.
  - title: Orders with repeated values
    body: |-
      With input `[1, 1, 2]`, the `orders` function above returns six arrays but only three
      are different. The fix for orders differs slightly from the one for combinations in the
      deep dive. Sort first, so equal values sit together. Then, at each level, allow a copy
      of a value only if the copy before it is already in the path. That forces equal values
      to appear in their original left-to-right order, so each distinct arrangement is built
      exactly once.

      ```js
      function uniqueOrders(items) {
        const sorted = [...items].sort((a, b) => a - b);
        const result = [];
        const path = [];
        const used = new Array(sorted.length).fill(false);
        function explore() {
          if (path.length === sorted.length) {
            result.push([...path]);
            return;
          }
          for (let i = 0; i < sorted.length; i++) {
            if (used[i]) continue;
            // Skip a copy whose twin to the left is not in the path yet.
            if (i > 0 && sorted[i] === sorted[i - 1] && !used[i - 1]) continue;
            used[i] = true;
            path.push(sorted[i]);
            explore();
            path.pop();
            used[i] = false;
          }
        }
        explore();
        return result;
      }

      console.log(uniqueOrders([1, 2, 1])); // [[1, 1, 2], [1, 2, 1], [2, 1, 1]]
      console.log(uniqueOrders([2, 2, 2])); // [[2, 2, 2]]
      console.log(uniqueOrders([])); // [[]]
      ```

      Time is `O(n! × n)` in the worst case (all values distinct), and much less when values
      repeat. Space is O(n) beyond the output. A common alternative is a `Set` of joined
      strings to drop duplicates at the end. It gives the right answer, but it still builds
      every duplicate first, so it wastes exactly the work pruning is meant to save.
  - title: Pruning with constraints, the n-queens problem
    body: |-
      Place n queens on an n by n board so that none shares a row, a column or a diagonal.
      Count the placements. Trying every set of n cells is hopeless: for n = 8 that is over
      4 billion. Backtracking places one queen per row, which removes row clashes by
      construction, and prunes any column or diagonal already taken.

      The trick is how to check a diagonal in O(1). On one diagonal direction, `row - col` is
      constant. On the other, `row + col` is constant. Three sets make every check instant.

      ```js
      function countQueens(n) {
        const cols = new Set();
        const downs = new Set(); // row - col
        const ups = new Set(); // row + col
        let count = 0;
        function place(row) {
          if (row === n) {
            count++;
            return;
          }
          for (let col = 0; col < n; col++) {
            if (cols.has(col) || downs.has(row - col) || ups.has(row + col)) continue;
            cols.add(col);
            downs.add(row - col);
            ups.add(row + col);
            place(row + 1);
            cols.delete(col);
            downs.delete(row - col);
            ups.delete(row + col);
          }
        }
        place(0);
        return count;
      }

      console.log(countQueens(1)); // 1
      console.log(countQueens(3)); // 0
      console.log(countQueens(6)); // 4
      console.log(countQueens(8)); // 92
      ```

      The worst-case bound is `O(n!)`, since row r has at most n - r free columns. In practice
      the pruning cuts far deeper: n = 8 finishes in a couple of milliseconds, visiting about 2,000 placements. Notice this
      version counts instead of storing boards. When the question asks for a count, keep a
      number, not a list of copies, and the memory stays O(n).
  - title: Backtracking on a grid, word search
    body: |-
      Given a grid of letters, can a word be traced through cells that touch up, down, left
      or right, using each cell at most once? This is backtracking where the choice is the
      next neighbour, and the thing to undo is the visited mark.

      ```js
      function wordInGrid(grid, word) {
        const rows = grid.length;
        const cols = rows ? grid[0].length : 0;
        const visited = grid.map((row) => row.map(() => false));
        function trace(r, c, i) {
          if (i === word.length) return true;
          if (r < 0 || c < 0 || r >= rows || c >= cols) return false;
          if (visited[r][c] || grid[r][c] !== word[i]) return false;
          visited[r][c] = true;
          const found =
            trace(r + 1, c, i + 1) || trace(r - 1, c, i + 1) ||
            trace(r, c + 1, i + 1) || trace(r, c - 1, i + 1);
          visited[r][c] = false; // undo, so other starting cells can use this one
          return found;
        }
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (trace(r, c, 0)) return true;
          }
        }
        return false;
      }

      const grid = [
        ['A', 'B', 'C', 'E'],
        ['S', 'F', 'C', 'S'],
        ['A', 'D', 'E', 'E'],
      ];
      console.log(wordInGrid(grid, 'ABCCED')); // true
      console.log(wordInGrid(grid, 'SEE')); // true
      console.log(wordInGrid(grid, 'ABCB')); // false
      console.log(wordInGrid([], 'A')); // false
      ```

      Time is O(R × C × 3^L) for a word of length L: every cell can start, and after the
      first step each cell has at most three unvisited neighbours. Space is O(R × C) for the
      marks plus O(L) of stack. The `||` chain stops at the first success, which is its own
      form of pruning: when one answer is enough, return as soon as you have it.
  - title: Explaining a backtracking solution aloud
    body: |-
      Interviewers want three things said clearly: the shape of the tree, the pruning rule,
      and the cost. A good narration for the budget problem goes like this.

      1. "Each level decides the next item to include, from after the last one I picked, so
         every group appears once and in index order."
      2. "The path holds the current choices. I push, recurse, pop, and record a copy when the
         remaining budget hits zero."
      3. "I sort first. Then, when a price is bigger than what's left, every later price is
         too, so I break out of the loop."
      4. "Worst case is still O(2^n × n), because the output can be that large. Pruning only
         helps when most branches die early, which sorted positive prices guarantee here."
      5. "Tests: no prices, nothing fits, one exact match, and the input left unchanged."

      Say which variant you are writing before you start: each item once or reusable,
      distinct values or repeats, all answers or the first one. Each changes one line, and
      guessing wrong costs more time than asking. If the interviewer then asks for a count
      only, mention that the same recursion with a memo on `(start, remaining)` becomes a
      dynamic programming solution in O(n × budget).
pitfalls:
  - "**Recording the shared path.** `result.push(path)` stores one array that later pops empty. Push `[...path]`, or pass a new string down the recursion so there is nothing to copy."
  - "**A mark that is never undone.** Setting `visited[r][c] = true` or `used[i] = true` without resetting it after the recursive call blocks that cell or item for every later branch. Undo every mark in the reverse order you made it."
  - "**`break` on unsorted input.** Stopping the loop at the first price that is too big is only safe when the prices are sorted and positive. Without the sort, `break` silently drops valid answers."
  - "**Using `includes` to check the path.** It costs O(n) per check and gives wrong answers when two items share a value. Track positions with a boolean array instead."
  - "**Recording only at the leaves for subsets.** A subset is complete at every node of the tree, not only when the index reaches the end. Push the path on entry, or you lose every subset shorter than the input."
  - "**Forgetting the empty answer.** Subsets of `[]` is `[[]]`, and a budget of 0 is met by the empty combination. Ask whether the empty answer counts, and write a test for it."
  - "**Sorting the caller's array.** Sorting the input in place changes the caller's data. Sort a copy with `[...items].sort((a, b) => a - b)`."
interview:
  - question: What's the time complexity of generating every permutation of n items?
    answer: >-
      `O(n! × n)`: there are n factorial permutations and copying each one costs n. The
      recursion tree has n choices at the first level, n - 1 at the second, and so on, so it
      has n factorial leaves. Each leaf copies a path of length n into the result, which dominates the
      internal work. No algorithm can beat the output size, so if the question needs every
      permutation, this is optimal. Space beyond the output is O(n) for the path, the used
      flags and the stack. The practical point is the limit: 10 items give 3.6 million
      permutations, and 13 give over 6 billion. So I would ask whether all of them are really
      needed, or whether the task is counting, checking existence, or finding the best one.
  - question: How is backtracking different from dynamic programming?
    answer: >-
      Backtracking enumerates candidates; dynamic programming reuses answers to repeated
      subproblems. Backtracking walks the whole tree of choices, pruning dead branches, and
      is the right tool when you must output every answer, since the output is exponential
      anyway. Dynamic programming applies when the question is a count or an optimum and the
      same smaller question recurs. In the budget problem, "list every combination" is
      backtracking, but "how many combinations" depends only on the start index and the
      remaining budget, so memoising those two values gives O(n × budget). The trade-off is
      that DP needs a small state space: if the state includes the whole path, as in n-queens,
      there is nothing to reuse and backtracking with pruning is the practical answer.
  - question: Your input can contain duplicates. How do you avoid duplicate answers?
    answer: >-
      Sort, then skip an item that equals its left neighbour under a precise rule, so
      duplicates are never generated. For combinations, skip `sorted[i]` when
      `i > start` and it equals `sorted[i - 1]`: at one level, only the first of a run of
      equal values is tried. For permutations, skip it when it equals `sorted[i - 1]` and
      that earlier copy is not in the path yet, which forces equal values into a fixed order.
      Both keep the time proportional to the number of distinct answers. The alternative,
      collecting into a set of serialised arrays, is correct but builds every duplicate first,
      so on inputs with many repeats it does exponentially more work.
  - question: When would you not use recursion for backtracking?
    answer: >-
      When a single path can be thousands of choices deep, because each level is a stack
      frame and Node overflows its default stack at around ten thousand frames. For subsets,
      orders and board puzzles the depth equals n, which is small, so recursion is the
      clearest choice. When the depth is large, such as a flood fill over a big grid, I
      switch to an explicit stack of states and push the next choices myself. For subsets
      with n up to about 20, a bitmask loop from 0 to 2^n - 1 is another option: bit i says
      whether item i is taken, with no recursion at all. The trade-off is readability:
      pruning is harder to express in the iterative forms.
