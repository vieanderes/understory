summary: >-
  A heap is the data structure for "give me the smallest (or largest) item, again and again,
  while items keep arriving". It keeps one item at the root, the best by your ordering, and
  lets you add an item or remove the root in O(log n). It does not keep everything sorted,
  and that is exactly why it is cheaper than sorting: it only does the work needed to know
  the next winner.


  The signals are "top k", "k largest", "k closest", "k most frequent", "the next event in
  time order", "merge these sorted lists", "the median so far" and "the cheapest route". Any
  time you catch yourself re-sorting or rescanning a collection to find its minimum after
  every change, a heap removes that bottleneck.


  The key trick for top k is counter-intuitive: to keep the k largest, use a min-heap of size
  k. Its root is the weakest of your current top k, the one a better newcomer evicts. That
  gives O(n log k) time and O(k) memory, and it works on a stream you can never hold in full.


  JavaScript has no heap in its standard library, so in a JavaScript round you write one,
  about 30 lines, or say which package you would use in real code. Python has `heapq`, a
  min-heap over a plain list. When k is close to n, sorting is simpler and as fast, and when
  you need only the k-th value, quickselect is O(n) on average.
remember:
  - A binary heap stores a complete tree in an array, with the children of index `i` at `2i + 1` and `2i + 2` and the parent at `(i - 1) >> 1`.
  - Push and pop cost O(log n), peek costs O(1), and building a heap from n items by sifting down costs O(n).
  - To keep the k largest items, keep a min-heap of size k and pop whenever it grows past k, for O(n log k) time and O(k) memory.
  - A heap of the current head of each list merges k sorted lists in O(n log k).
  - Two heaps, a max-heap of the lower half and a min-heap of the upper half, give a running median in O(log n) per item.
  - Dijkstra's algorithm is BFS with a heap ordered by distance, and it needs non-negative edge weights.
  - Python's `heapq` is a min-heap only, so negate keys to get a max-heap, and use tuples to break ties.
  - Sort when k is close to n or the data is small, and use quickselect when you need only the k-th value.
sections:
  - title: A reusable heap for JavaScript
    body: |-
      This version takes a comparator in the same shape as `Array.prototype.sort`, so
      `(a, b) => a - b` gives a min-heap and `(a, b) => b - a` a max-heap. Keeping the
      interface familiar saves you from getting the direction wrong under pressure.

      ```js
      class Heap {
        constructor(compare = (a, b) => a - b) {
          this.items = [];
          this.compare = compare;
        }
        get size() {
          return this.items.length;
        }
        peek() {
          return this.items[0];
        }
        push(item) {
          const a = this.items;
          a.push(item);
          let i = a.length - 1;
          while (i > 0) {
            const parent = (i - 1) >> 1;
            if (this.compare(a[i], a[parent]) >= 0) break;
            [a[i], a[parent]] = [a[parent], a[i]];
            i = parent;
          }
        }
        pop() {
          const a = this.items;
          if (a.length === 0) return undefined;
          const top = a[0];
          const last = a.pop();
          if (a.length > 0) {
            a[0] = last;
            let i = 0;
            for (;;) {
              const left = 2 * i + 1;
              const right = left + 1;
              let best = i;
              if (left < a.length && this.compare(a[left], a[best]) < 0) best = left;
              if (right < a.length && this.compare(a[right], a[best]) < 0) best = right;
              if (best === i) break;
              [a[i], a[best]] = [a[best], a[i]];
              i = best;
            }
          }
          return top;
        }
      }

      const heap = new Heap();
      for (const x of [5, 1, 4, 1, 3]) heap.push(x);
      console.log([heap.pop(), heap.pop(), heap.pop()]); // [1, 1, 3]
      console.log(heap.size); // 2
      console.log(new Heap().pop()); // undefined
      ```

      Two details earn their place. `pop` handles the one-item heap separately: after
      `a.pop()` the array is empty, so writing `last` back to index 0 would resurrect the
      item. And the sift-down picks the better of the two children, not the first child
      that beats the parent, or the heap order breaks.

      With the class in hand, the k largest values are a few lines. The rest of this page
      reuses the same `Heap`.

      ```js
      // O(n log k) time, O(k) memory. Returns the k largest, largest first.
      function kLargest(nums, k) {
        if (k <= 0) return [];
        const heap = new Heap((a, b) => a - b); // min-heap: the root is the weakest kept
        for (const x of nums) {
          heap.push(x);
          if (heap.size > k) heap.pop();
        }
        const out = [];
        while (heap.size > 0) out.push(heap.pop());
        return out.reverse();
      }

      console.log(kLargest([7, 2, 9, 4, 9, 1], 3)); // [9, 9, 7]
      console.log(kLargest([3], 5)); // [3]
      console.log(kLargest([], 2)); // []
      ```
  - title: Merging k sorted lists
    body: |-
      Merging sorted lists shows up as "merge the logs of k servers by timestamp" or
      "combine k sorted result pages". Concatenating and sorting costs O(n log n) and ignores
      that each list is already sorted. A heap holding one entry per list, the list's
      current head, always knows the next smallest item overall.

      ```js
      // n items in total across k lists: O(n log k) time, O(k) extra memory.
      function mergeSorted(lists) {
        const heap = new Heap((a, b) => a.value - b.value || a.list - b.list);
        lists.forEach((items, list) => {
          if (items.length > 0) heap.push({ value: items[0], list, index: 0 });
        });
        const out = [];
        while (heap.size > 0) {
          const { value, list, index } = heap.pop();
          out.push(value);
          const next = index + 1;
          if (next < lists[list].length) heap.push({ value: lists[list][next], list, index: next });
        }
        return out;
      }

      console.log(mergeSorted([[1, 4, 9], [2, 3], [], [0, 10]])); // [0, 1, 2, 3, 4, 9, 10]
      console.log(mergeSorted([])); // []
      ```

      Each entry remembers which list it came from and where, so the next item from the same
      list replaces it. The tie-break on `list` keeps the merge stable: equal values come
      out in list order, which matters when the values are records with the same timestamp.
  - title: A running median with two heaps
    body: |-
      "Report the median response time after every request" defeats sorting, because the
      data changes after every answer. Split the numbers into two halves instead. The lower
      half lives in a max-heap, so its largest is at the root. The upper half lives in a
      min-heap. Keep the sizes equal, or the lower half one bigger, and the median is always
      at one or both roots.

      ```js
      // O(log n) per add, O(1) per median.
      class RunningMedian {
        constructor() {
          this.lower = new Heap((a, b) => b - a); // max-heap
          this.upper = new Heap((a, b) => a - b); // min-heap
        }
        add(x) {
          if (this.lower.size === 0 || x <= this.lower.peek()) this.lower.push(x);
          else this.upper.push(x);
          if (this.lower.size > this.upper.size + 1) this.upper.push(this.lower.pop());
          else if (this.upper.size > this.lower.size) this.lower.push(this.upper.pop());
        }
        median() {
          if (this.lower.size === 0) return undefined;
          if (this.lower.size > this.upper.size) return this.lower.peek();
          return (this.lower.peek() + this.upper.peek()) / 2;
        }
      }

      const m = new RunningMedian();
      const seen = [];
      for (const x of [5, 15, 1, 3]) {
        m.add(x);
        seen.push(m.median());
      }
      console.log(seen); // [5, 10, 5, 4]
      ```

      After each `add`, every value in `lower` is at most every value in `upper`, and the
      sizes differ by at most one. Those two invariants are what you state in an interview:
      the code only exists to restore them.
  - title: Dijkstra's shortest paths
    body: |-
      When edges have costs, such as minutes between stations, BFS no longer finds the
      cheapest route. Dijkstra's algorithm replaces the queue with a heap ordered by the
      distance so far, so the cheapest frontier node is always settled next. This is the
      "lazy" version: it allows stale entries in the heap and skips them when popped, which
      avoids needing a decrease-key operation.

      ```js
      // graph[node] = [[next, cost], ...], costs >= 0.
      // O((V + E) log E) time, O(V + E) memory.
      function cheapest(graph, start) {
        const dist = new Map([[start, 0]]);
        const heap = new Heap((a, b) => a[0] - b[0]);
        heap.push([0, start]);
        while (heap.size > 0) {
          const [d, node] = heap.pop();
          if (d > dist.get(node)) continue; // a stale entry: a cheaper one was settled
          for (const [next, cost] of graph[node] ?? []) {
            const candidate = d + cost;
            if (candidate < (dist.get(next) ?? Infinity)) {
              dist.set(next, candidate);
              heap.push([candidate, next]);
            }
          }
        }
        return dist;
      }

      const lines = {
        A: [['B', 4], ['C', 1]],
        C: [['B', 2], ['D', 7]],
        B: [['D', 1]],
      };
      console.log(Object.fromEntries(cheapest(lines, 'A'))); // { A: 0, B: 3, C: 1, D: 4 }
      ```

      From A, the direct edge to B costs 4, but through C it costs 3, which BFS would miss.
      Dijkstra's algorithm is wrong with negative costs, because a node settled early could
      later be reached more cheaply. Bellman-Ford handles negative costs at O(V × E).
  - title: From sorting to a heap, and saying it aloud
    body: |-
      The brute force for top k is to sort everything and slice: O(n log n) time and O(n)
      memory, and it is the right answer when n is small or k is close to n. Name its
      bottleneck: it orders all n items when you only needed the first k. The heap keeps
      only k candidates, so each item costs O(log k). For k = 10 and n = a million, that is
      roughly a million times 3 comparisons instead of a million times 20.

      In a live round, say it in this order:

      1. "Sorting works and costs O(n log n). Can I avoid ordering what I throw away?"
      2. "I'll keep a min-heap of size k. Its root is the weakest of my top k."
      3. "Each new item is pushed; if the heap then holds k + 1, I pop the root."
      4. "That's O(n log k) time and O(k) memory, and it works on a stream."
      5. "JavaScript has no heap, so I'll write push and pop, or use a vetted package in
         production."

      The edge cases to test: k of 0, k larger than the number of items, an empty input,
      ties (decide and state the tie-break, such as alphabetical), and all items equal.
      Python gives you the one-liners: `heapq.nlargest(k, items)` does the size-k heap for
      you, and `heapq.heapify` builds a heap in place in O(n).

      ```python
      import heapq

      scores = [7, 2, 9, 4, 9, 1]
      print(heapq.nlargest(3, scores))  # [9, 9, 7]
      heap = [(-count, word) for word, count in {"tea": 3, "milk": 3, "jam": 1}.items()]
      heapq.heapify(heap)
      print([heapq.heappop(heap)[1] for _ in range(2)])  # ["milk", "tea"]
      ```

      Negating the count turns the min-heap into a max-heap on count, and the word as the
      second tuple item breaks ties alphabetically.
pitfalls:
  - "**A max-heap for the k largest.** It holds all n items to pop the top k, O(n) memory and no gain on a stream. Keep a min-heap capped at k, whose root is the one to evict."
  - "**Sorting numbers without a comparator.** `[10, 9, 1].sort()` sorts as strings. For a sort-and-slice baseline, write `sort((a, b) => a - b)`."
  - "**Popping the last item back into place.** In an array heap, `pop` must check whether the heap is now empty before moving the last item to the root, or a one-item heap never empties."
  - "**Sifting down to the first smaller child.** You must swap with the smaller of the two children, or a larger child ends up above a smaller one."
  - "**Comparing tuples that cannot be compared.** In Python, `(3, {\"id\": 1})` and `(3, {\"id\": 2})` raise a `TypeError` on the tie. Add a unique tie-breaker such as an index: `(3, index, item)`."
  - "**Calling a `PriorityQueue` that does not exist.** Node has no built-in heap class. Write one or import a package you have checked."
  - "**Dijkstra's algorithm with negative weights.** A node settled early can be reached more cheaply later. Use Bellman-Ford when costs can be negative."
verify:
  - lens: breaks
    check: Any heap class is checked to exist in the runtime or a vetted package, since Node has none built in.
  - lens: scales
    check: A top-k heap is capped at k items, so memory stays O(k) however long the stream runs.
  - lens: confuses
    check: The heap's direction is named in a comment or variable, since a min-heap for the largest reads backwards.
  - lens: tests
    check: Tests include ties, k equal to the input length, and k of zero.
interview:
  - question: How do you find the k largest elements of a very large array?
    answer: >-
      I keep a min-heap of at most k elements, which costs O(n log k) time and O(k) memory.
      Each element is pushed, and whenever the heap holds k + 1 I pop the root, which is the
      smallest of my candidates and therefore the one that can't be in the top k. At the end
      the heap holds exactly the k largest. This beats sorting, O(n log n), when k is much
      smaller than n, and it works on a stream I can't hold in memory. If I only need the
      k-th value and can modify the array, quickselect finds it in O(n) on average but
      O(n²) in the worst case. If k is close to n, I'd sort: simpler and no slower.
  - question: How does a binary heap work, and why are push and pop O(log n)?
    answer: >-
      A binary heap is a complete binary tree stored in an array, where every parent is no
      larger than its children, so the minimum sits at index 0. The children of index `i` are
      at `2i + 1` and `2i + 2`, so no pointers are needed. Push appends at the end and swaps
      the item up while it beats its parent. Pop takes the root, moves the last item to the
      root, and swaps it down with its smaller child until the order holds. A complete tree
      of n items has about log₂ n levels, and each operation moves along one path, so both
      are O(log n). The trade-off is that a heap is not sorted: finding an arbitrary item or
      the maximum of a min-heap is O(n).
  - question: Design a structure that returns the median of a stream of numbers.
    answer: >-
      I'd use two heaps: a max-heap for the lower half and a min-heap for the upper half.
      Adding a number puts it in the lower half if it's no bigger than the lower root, else
      in the upper half, then moves one root across if the sizes differ by more than one.
      The invariants are that every lower value is at most every upper value and the lower
      half is equal in size or one bigger. The median is then the lower root, or the average
      of both roots when the sizes are equal. That's O(log n) per add and O(1) per query.
      If numbers could leave the window, heaps struggle, because removing an arbitrary item
      is O(n); an ordered multiset or lazy deletion handles that.
  - question: How would you merge k sorted lists?
    answer: >-
      I put the first item of each list into a min-heap, tagged with its list and position,
      then repeatedly pop the smallest, output it, and push the next item from the same
      list. The heap never holds more than k entries, so with n items in total it runs in
      O(n log k) time and O(k) extra memory. Concatenating and sorting would cost O(n log n)
      and throw away the fact that each list is already sorted. For two lists a plain
      two-pointer merge is simpler. An alternative with the same complexity is merging
      pairs of lists in rounds, like merge sort, which avoids a heap entirely.
  - question: Find the k most frequent items. Would you use a heap or something else?
    answer: >-
      Say both, then pick by the constraints. Count with a map first, in O(n). With a
      size-k min-heap over the counts, the rest is O(m log k) for m distinct items, and it
      works on a stream. With bucket counting it's O(n): no count can pass n, so make n + 1
      separate lists, drop each item in the list for its count, and read from the top down
      until you have k. Mention the trap when building the buckets: `new Array(n +
      1).fill([])` puts one shared array in every slot, so use `Array.from({ length: n + 1
      }, () => [])`. The trade-off is memory and ties: buckets need O(n) extra space and
      give ties in insertion order, while a heap can break ties with its comparator.
terms:
  - term: Heap
    say: A sorted array.
    means: A complete binary tree stored in an array, where every parent is at most (min-heap) or at
      least (max-heap) its children. Only the root is guaranteed to be the extreme.
  - term: Priority queue
    say: Another name for a heap.
    means: An abstract type that hands out the highest-priority item next. A binary heap is its usual
      implementation, with O(log n) push and pop and O(1) peek.
  - term: Top k
    say: Use a max-heap to get the k largest.
    means: Keep a *min*-heap of size k and pop whenever it grows past k. Its root is the weakest of the
      current top k, which gives O(n log k) time and O(k) memory.
  - term: Building a heap
    say: n pushes, so O(n log n).
    means: Sifting down from the last parent back to the root builds a heap in O(n), because most nodes
      sit near the bottom and move only a short way.
  - term: Dijkstra's algorithm
    say: BFS for weighted graphs.
    means: BFS with a min-heap ordered by distance so far. It finds shortest paths only when every edge
      weight is non-negative.
