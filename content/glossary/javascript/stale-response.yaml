term: stale response
aka:
  - out-of-order response
  - latest request wins
short: A reply to an older request that arrives after a newer one and overwrites fresher data.
explain: |
  You type "ca", then "cat". Two requests go out. The network is uneven, so the answer
  for "ca" lands last. The list now shows results for a word you're no longer typing.

  Order of sending is not order of arrival. Fix it by tagging each request and ignoring
  any reply that isn't for the latest one. Aborting the older request also works, and
  saves bandwidth.

  The bug hides in testing, because a local server answers in order. Tests need to
  resolve responses in the wrong order on purpose.
analogy: A letter from last week arriving after today's. You read the old news last and believe it.
example:
  language: js
  code: |
    let latest = 0;
    async function search(query) {
      const id = ++latest;
      const results = await fetchResults(query);
      if (id !== latest) return; // a newer search has started
      show(results);
    }
usage: That flicker is a stale response; the request for the shorter query came back last.
related:
  - race-condition
  - debounce
  - promise
  - combobox
level: 2
