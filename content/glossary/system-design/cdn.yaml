term: CDN
aka: [content delivery network, edge cache]
short: A network of servers around the world that keep copies of your files near the people asking.
explain: |
  Your server is in one city. A visitor on another continent waits for every image and
  script to cross the ocean. Copies held in a nearby data centre cut that wait to a few
  milliseconds.

  Your server decides what may be stored, and for how long, with the `Cache-Control`
  header. Files with a hash in the name (`app.3f9a2c.js`) can be kept for a year, because
  a change makes a new name. HTML and anything personal needs short lifetimes or none, or
  one user may see another's page.
analogy: A chain of corner shops stocking the bestsellers, so you don't drive to the central warehouse for a pint of milk.
example:
  language: http
  code: |
    HTTP/1.1 200 OK
    Content-Type: application/javascript
    Cache-Control: public, max-age=31536000, immutable
usage: The images come from the origin every time; serve them through the CDN with a long max-age.
related: [cache, cache-invalidation, latency, cache-control, dns]
level: 1
lessons: [perf.caching-layers, cloud.edge]
