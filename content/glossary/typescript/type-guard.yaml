term: type guard
aka:
  - type predicate
short: A function returning true or false whose result tells the checker a value's type, like `value is Book`.
explain: |
  Narrowing works on checks the compiler can see. Move the check into a helper and the
  knowledge is lost. A return type of `value is Book` keeps it: when the helper returns true,
  the caller's value counts as a `Book`.

  The checker trusts that promise without reading the body. If the function says `true` for
  the wrong thing, every caller is misled. Test type guards like any other code.
analogy: A bouncer's stamp on your hand. Once you have it, nobody inside checks your ID again.
example:
  language: ts
  code: |
    function isBook(item: unknown): item is Book {
      return typeof item === 'object' && item !== null && 'isbn' in item;
    }
    if (isBook(data)) {
      data.isbn; // data is Book here
    }
usage: Write a type guard for the payload, so the filter result comes out typed.
twin:
  term: type-assertion
  difference: A type guard is a check that runs, so the type is earned. An assertion with `as` runs no check at all; it only silences the checker.
related:
  - narrowing
  - unknown-type
level: 2
lessons:
  - ts.narrowing
