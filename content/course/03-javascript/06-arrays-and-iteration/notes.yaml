summary: >-
  Most work on data in JavaScript is work on arrays: a cart of items, a page of search
  results, a list of messages. The array methods that take a callback turn a loop you would
  write by hand into one named intention. `map` transforms every item, `filter` keeps some,
  `find` picks one, `some` and `every` answer yes or no, and `reduce` folds the list into a
  single value.


  The second half of the lesson is about ownership. Some methods build a new array and leave
  the original alone. Others, such as `sort`, `reverse`, `splice` and `push`, change the array
  in place and hand back that same array. When two parts of a program share one array, a
  mutating call in one of them rearranges the data under the other. ES2023 added copying
  partners, `toSorted`, `toReversed`, `toSpliced` and `with`, so you rarely need to mutate.


  Underneath all of this sits the iteration protocol: an object is iterable if it has a
  `Symbol.iterator` method. That's why `for...of`, spread and `Array.from` work on arrays,
  strings, maps, sets and generators alike. Reach for the array methods when the intent is a
  transform, a filter or a fold. Reach for a plain `for...of` loop when you need to stop
  early, `await` inside the loop, or do several things per item.
remember:
  - '`map`, `filter`, `slice`, `concat` and the `to...` methods return a new array; `sort`, `reverse`, `splice`, `push`, `pop`, `shift`, `unshift` and `fill` change the array in place.'
  - '`sort()` with no comparator compares items as strings, so `[10, 9, 1].sort()` gives `[1, 10, 9]`; pass `(a, b) => a - b` for numbers.'
  - A comparator returns a negative number, zero or a positive number, never a boolean, and `sort` has been stable since ES2019.
  - Always give `reduce` a starting value, because an empty array with no start throws a `TypeError`.
  - Every callback receives `(item, index, array)`, which is why `["1", "2", "3"].map(parseInt)` gives `[1, NaN, NaN]`.
  - '`forEach` cannot stop early and does not wait for `async` callbacks; use `for...of` with `break` or `await` instead.'
  - '`for...of` walks the values of any iterable, while `for...in` walks the enumerable keys of an object, as strings.'
  - Chained methods make one pass and one new array per step, which is fine for UI-sized lists and worth fusing only when a profiler says so.
sections:
  - title: The callback contract, and the parseInt trap
    body: |-
      Every callback-taking method calls your function with three arguments: the item, its
      index and the whole array. `reduce` adds the accumulator in front. Most callbacks use
      only the first, but a function you pass by name receives all of them.

      ```js
      // The callback gets (item, index, array)
      console.log(["1", "2", "3"].map(parseInt)); // [1, NaN, NaN]
      console.log(["1", "2", "3"].map((s) => parseInt(s, 10))); // [1, 2, 3]
      console.log(["1", "2", "3"].map(Number)); // [1, 2, 3]
      ```

      `parseInt` takes a second argument, the radix. So the calls are `parseInt("1", 0)`,
      `parseInt("2", 1)` and `parseInt("3", 2)`. Radix 0 means "work it out", radix 1 is
      invalid, and "3" is not a binary digit. Wrap functions you don't control in an arrow
      that passes only what you mean.

      `reduce` is the general tool: `map`, `filter` and grouping can all be written with it.
      That doesn't mean they should be. Use it when the result is a different shape from
      the input, such as a total or an object keyed by something. For grouping, Node 24 and
      current browsers have `Object.groupBy`.

      ```js
      const orders = [
        { id: 1, status: "paid", total: 30 },
        { id: 2, status: "pending", total: 12 },
        { id: 3, status: "paid", total: 45 },
      ];

      const byStatus = orders.reduce((groups, order) => {
        (groups[order.status] ??= []).push(order.id);
        return groups;
      }, {});
      console.log(byStatus); // { paid: [1, 3], pending: [2] }

      const grouped = Object.groupBy(orders, (order) => order.status);
      console.log(Object.keys(grouped)); // ['paid', 'pending']
      console.log(grouped.paid.length); // 2
      ```

      Without a starting value, `reduce` uses the first item as the start and begins at the
      second. `[5].reduce((a, b) => a + b)` returns 5 without calling the callback at all.
      On an empty array there's nothing to start from, so it throws a `TypeError`.
  - title: How sort really compares
    body: |-
      With no comparator, `sort` converts every item to a string and compares the strings by
      UTF-16 code units. `undefined` items are not converted: they always go to the end.
      That explains three surprises at once.

      ```js
      console.log([10, 9, 1, 100].sort()); // [1, 10, 100, 9]
      console.log([10, 9, 1, 100].sort((a, b) => a - b)); // [1, 9, 10, 100]
      console.log([3, undefined, 1].sort()); // [1, 3, undefined]
      console.log(["b", "a", "Z"].sort()); // ['Z', 'a', 'b']
      console.log(["b", "a", "Z"].sort((a, b) => a.localeCompare(b))); // ['a', 'b', 'Z']
      console.log(["é", "e", "f"].sort()); // ['e', 'f', 'é']
      console.log(["é", "e", "f"].sort((a, b) => a.localeCompare(b))); // ['e', 'é', 'f']

      const natural = new Intl.Collator("en", { numeric: true });
      console.log(["item10", "item9", "item1"].sort(natural.compare)); // ['item1', 'item9', 'item10']
      ```

      Capital letters come before lower case, and accented letters come after `z`. For text
      people read, use `localeCompare`, or build one `Intl.Collator` and reuse its `compare`
      when sorting large lists, since it avoids setting up the locale rules on every call.

      A comparator must be consistent: negative, zero or positive, the same answer every time
      for the same pair. A boolean breaks that contract, because `false` becomes 0 and there is
      never a negative. The result then depends on the engine's algorithm.

      ```js
      const nums = [5, 1, 4, 2, 3, 9, 7, 8, 6, 0, 11, 15, 13, 12, 14];
      console.log(nums.toSorted((a, b) => a > b)); // in Node 24: the same order, unsorted
      ```

      Because sort is stable, you can sort by several keys in one comparator. Chain the
      comparisons with `||`: the second only counts when the first gives 0.

      ```js
      const books = [
        { title: "Dune", year: 1965 },
        { title: "Emma", year: 1815 },
        { title: "Beloved", year: 1987 },
        { title: "Carrie", year: 1974 },
        { title: "Persuasion", year: 1817 },
      ];
      const byCentury = books.toSorted(
        (a, b) =>
          Math.floor(a.year / 100) - Math.floor(b.year / 100) || a.title.localeCompare(b.title),
      );
      console.log(byCentury.map((b) => b.title)); // ['Emma', 'Persuasion', 'Beloved', 'Carrie', 'Dune']
      ```
  - title: Mutating methods and their copying partners
    body: |-
      A mutating method changes the array you call it on. Several also return that same
      array, which makes them look like they return a copy. They don't.

      ```js
      const list = [3, 1, 2];
      const same = list.sort();
      console.log(same === list); // true

      const cart = [1, 2, 3];
      const removed = cart.splice(1, 1);
      console.log(removed, cart); // [2] [1, 3]
      ```

      The mutators are `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill`
      and `copyWithin`. Each of the reordering ones has a copying partner from ES2023:
      `toSorted`, `toReversed`, `toSpliced`, and `with(index, value)` in place of
      `array[index] = value`. `slice`, `concat`, `map`, `filter`, `flat` and `flatMap` have
      always returned new arrays.

      A frozen array makes the difference loud. The mutators throw, the copying methods work.

      ```js
      const queue = Object.freeze(["b", "c", "a"]);
      try {
        queue.sort();
      } catch (e) {
        console.log(e.constructor.name); // TypeError
      }
      console.log(queue.toSorted()); // ['a', 'b', 'c']
      console.log(queue.with(0, "z")); // ['z', 'c', 'a']
      console.log(queue.toSpliced(1, 1)); // ['b', 'a']
      console.log(queue.toReversed()); // ['a', 'c', 'b']
      ```

      `const` does not help here. It stops you pointing the name at another array, but
      `push` and `sort` still work on a `const` array. Where mutation matters in production is
      shared state: React compares state by reference, so `items.sort()` followed by
      `setItems(items)` hands React the same array and nothing redraws. `setItems(items.toSorted())`
      gives it a new one.

      Copying costs O(n) time and memory for each call. For a few hundred items that's
      nothing. For a hot loop over a large array you build yourself and nobody else sees,
      mutating in place is a fair choice.
  - title: Iteration protocols, for...of and generators
    body: |-
      `for...of`, spread, destructuring and `Array.from` don't know about arrays. They ask the
      value for an iterator by calling its `Symbol.iterator` method, then call `next()` until
      it returns `{ done: true }`. Arrays, strings, maps, sets, `arguments` and DOM
      `NodeList`s all implement it, so the same loop works on all of them.

      ```js
      const tags = ["red", "green"];
      tags.note = "extra";
      for (const key in tags) console.log(key); // 0, 1, note
      for (const tag of tags) console.log(tag); // red, green
      for (const [i, tag] of tags.entries()) console.log(i, tag); // 0 red, 1 green

      const pages = {
        total: 3,
        [Symbol.iterator]() {
          let page = 0;
          return {
            next: () =>
              page < this.total ? { value: ++page, done: false } : { value: undefined, done: true },
          };
        },
      };
      console.log([...pages]); // [1, 2, 3]
      ```

      `for...in` is a different tool. It walks enumerable string keys, including inherited
      ones and extra properties, so it's for plain objects, not arrays.

      A generator function (`function*`) writes an iterator for you. It runs only as far as
      the next `yield`, so it can describe an endless sequence. Iterator helpers, in Node 22
      and later and current browsers, add lazy `map`, `filter`, `take` and `toArray` to it.

      ```js
      function* ids(prefix) {
        let n = 1;
        while (true) yield `${prefix}-${n++}`;
      }
      const gen = ids("order");
      console.log(gen.next().value, gen.next().value); // order-1 order-2

      const firstThree = ids("ticket").filter((id) => !id.endsWith("2")).take(3).toArray();
      console.log(firstThree); // ['ticket-1', 'ticket-3', 'ticket-4']

      console.log(Array.from({ length: 3 }, (_, i) => i * 10)); // [0, 10, 20]
      console.log([...new Set([3, 1, 3])]); // [3, 1]
      ```

      The lazy chain produced only four ids. An array chain would need the whole list first,
      which an endless generator never finishes making.
pitfalls:
  - "**Sorting numbers without a comparator.** The default compares strings, so 100 lands before 25 and the bug hides until a number gains a digit. Always pass `(a, b) => a - b` for numbers and `localeCompare` for text."
  - "**Treating the return value of `sort` as a copy.** `const ranked = scores.sort()` reorders `scores` too, because both names hold one array. Use `toSorted`, or `[...scores].sort()` where older runtimes matter."
  - "**Using `forEach` with `async` callbacks.** `forEach` ignores the promises your callback returns, so code after it runs before any save finishes, and a rejection goes unhandled. Use `for...of` with `await` for one at a time, or `await Promise.all(items.map(save))` for all at once."
  - "**Expecting `return` inside `forEach` to stop the loop.** It only ends the current call, and the next item runs. Use `for...of` with `break`, or `find` and `some`, which stop at the first match."
  - "**Passing a named function straight to `map`.** `map(parseInt)` hands the index in as a radix. Wrap it: `map((s) => parseInt(s, 10))`, or use `Number`."
  - "**Calling `reduce` with no starting value.** It works in tests with data and throws on the first empty cart. Give it the value an empty list should produce, such as `0` or `{}`."
interview:
  - question: Why does `[10, 9, 1].sort()` return `[1, 10, 9]`, and how do you fix it?
    answer: >-
      Because the default comparator converts items to strings and compares them by UTF-16
      code units, so "10" sorts before "9" the same way "ab" sorts before "b". The fix is a
      numeric comparator, `(a, b) => a - b`, which returns a negative number when `a` should
      come first, zero when they're equal and a positive number otherwise. I'd also point
      out that `sort` mutates and returns the same array, so if anything else holds a
      reference I'd use `toSorted` instead. For strings people read I'd use `localeCompare`
      or an `Intl.Collator`, since the default puts "Z" before "a". One trap to avoid is a
      boolean comparator like `a > b`: it never returns a negative, so the result depends
      on the engine.
  - question: What does `["1", "2", "3"].map(parseInt)` return, and why?
    answer: >-
      `[1, NaN, NaN]`. `map` calls its callback with three arguments, the item, the index
      and the array, and `parseInt` reads its second argument as the radix. So the first
      call is `parseInt("1", 0)`, and radix 0 means "detect", giving 1. Then `parseInt("2", 1)`
      gives `NaN`, because radix 1 is invalid. Last, `parseInt("3", 2)` gives `NaN`, because
      3 isn't a binary digit. The fix is to pass only what you mean: `map((s) => parseInt(s, 10))`, or
      `map(Number)` if you want strict whole-string parsing. The general lesson is that
      passing a function by name couples you to its full signature, so I wrap functions I
      don't own in an arrow.
  - question: What's the difference between `for...in` and `for...of`?
    answer: >-
      `for...of` iterates the values of any iterable, and `for...in` iterates the enumerable
      string keys of an object. `for...of` uses the iteration protocol: it calls
      `Symbol.iterator` and reads `next()` until `done`, so it works on arrays, strings, maps,
      sets and generators, and it supports `break`, `continue` and `await`. `for...in` walks
      property names, including inherited enumerable ones and any extra properties someone
      added to an array, and it gives indices as strings. So I use `for...of` for arrays and
      other collections, and `Object.entries(obj)` with `for...of` for plain objects. I'd
      reach for `for...in` rarely, and only on plain objects where I'm sure of the prototype.
  - question: Which array methods mutate, and why does it matter in a React app?
    answer: >-
      `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill` and `copyWithin`
      change the array in place. `map`, `filter`, `slice`, `concat` and the ES2023 methods
      `toSorted`, `toReversed`, `toSpliced` and `with` return new arrays. In React it matters
      because state changes are detected by reference: `Object.is(oldState, newState)`. If
      I sort the state array in place and pass it back to the setter, it's the same array,
      so React skips the render and the list on screen is stale. Worse, any other component
      holding that array sees it reordered. So for state I always build a new array. The
      trade-off is an O(n) copy per update, which is negligible at UI sizes.
  - question: When would you use `reduce`, and when would you avoid it?
    answer: >-
      I use `reduce` when the output is a different shape from the input: a total, a
      maximum, or an object built from a list. Always with a starting value, because an
      empty array without one throws, and the starting value documents the result type. I
      avoid it when a more specific method says the intent better. A `reduce` that pushes
      into an array is a `map` or a `filter`. Grouping reads better with `Object.groupBy`.
      A `reduce` with a large callback that does several things is usually clearer as a
      `for...of` loop. Chaining `filter` then `map` costs an extra pass and an extra
      array, but for UI-sized lists readability wins; I'd fuse them only if profiling showed
      the chain mattered.
