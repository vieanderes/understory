term: time to live
aka:
  - TTL
  - expiry time
short: How long a stored value stays valid before it counts as gone.
explain: |
  Some data should not last for ever. A login code, a cached page, a seat held in a
  basket. Each one gets a lifetime when it's written.

  After that, reads treat it as missing. The value may still sit in memory for a while;
  many stores clear expired entries lazily, on the next read or in a sweep.

  Store the moment it expires, not the seconds left. A deadline stays right whatever time
  you check it, while "seconds left" goes wrong the moment you read it later.
analogy: The use-by date on a yoghurt. It might still be in the fridge, but you treat it as gone.
usage: Give the reset link a TTL of fifteen minutes and check it on every read.
related:
  - cache
  - cache-invalidation
level: 2
