term: status code
aka:
  - HTTP status
  - response code
short: The three-digit number at the top of a response that says how the request went.
explain: |
  Before a client reads a single byte of the body, it wants to know: did that work? The
  server answers with a number. `200` means fine, `404` means there's nothing there,
  `500` means the server broke.

  The first digit is the family. `2xx` worked, `3xx` look elsewhere, `4xx` the client got
  something wrong, `5xx` the server did. Clients, caches and retry logic branch on that digit. A `200` with an error in the body quietly fools all of them.
analogy: The light on a parcel locker. Green, amber or red tells you the result before you open the door.
example:
  language: http
  code: |
    HTTP/1.1 201 Created
    HTTP/1.1 304 Not Modified
    HTTP/1.1 404 Not Found
    HTTP/1.1 422 Unprocessable Content
    HTTP/1.1 503 Service Unavailable
usage: The validation failure comes back as a 200, so the client never knows; return a 422 status code.
