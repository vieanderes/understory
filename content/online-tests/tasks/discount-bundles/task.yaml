id: discount-bundles
title: DiscountBundles
topic: caterpillar
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: A, type: "int[]" }
    - { name: K, type: int }
  returns: int
statement: |-
  A shop sells N items. Item I costs A[I]. A bundle is a pair of different items (P, Q)
  such that 0 ≤ P < Q < N. It qualifies for a discount when A[P] + A[Q] ≤ K.

  Write a function:

  {{signature}}

  that, given an array A of N integers and an integer K, returns the number of bundles
  that qualify. The result can exceed 2,147,483,647.

  For example, given A = [4, 1, 7, 3, 2] and K = 6, the function should return 5. The
  pairs of prices are (4, 1), (4, 2), (1, 3), (1, 2) and (3, 2).

  Given A = [3, 3, 3] and K = 6, the function should return 3.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [−1,000,000,000..1,000,000,000];
  - K is an integer within the range [−1,000,000,000..1,000,000,000].
examples:
  - { args: [[4, 1, 7, 3, 2], 6], expected: 5 }
  - { args: [[3, 3, 3], 6], expected: 3 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: one item makes no bundle
    group: correctness
    cases:
      - { args: [[1], 100], expected: 0 }
  - name: extreme_two
    description: two items, an item never pairs with itself
    group: correctness
    cases:
      - { args: [[2, 5], 4], expected: 0 }
      - { args: [[2, 2], 4], expected: 1 }
  - name: simple
    description: every pair fits, duplicates on both sides of the limit
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4, 5], 100], expected: 10 }
      - { args: [[1, 1, 4, 4, 4], 5], expected: 7 }
  - name: negative_only
    description: negative prices and a negative K
    group: correctness
    cases:
      - { args: [[-5, -1, 2, -3], -4], expected: 3 }
  - name: sorted
    description: ascending and descending prices
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4, 5, 6], 7], expected: 9 }
      - { args: [[6, 5, 4, 3, 2, 1], 7], expected: 9 }
  - name: extreme_min_max_value
    description: the extremes of the value range
    group: correctness
    cases:
      - { args: [[1000000000, 1000000000, -1000000000], 0], expected: 2 }
      - { args: [[1000000000, 1000000000], 1000000000], expected: 0 }
      - { args: [[-1000000000, -1000000000], -1000000000], expected: 1 }
  - name: small_random
    description: random prices in [−50..50], N = 400
    group: correctness
    cases:
      - generate: { seed: 5, args: [{ kind: ints, n: 400, min: -50, max: 50 }, { kind: value, value: 3 }] }
      - generate: { seed: 6, args: [{ kind: ints, n: 100, min: -1000000000, max: 1000000000 }, { kind: int, min: -1000000000, max: 1000000000 }] }
  - name: medium_random
    description: random prices, N = 3,000
    group: correctness
    cases:
      - generate: { seed: 7, args: [{ kind: ints, n: 3000, min: -10000, max: 10000 }, { kind: value, value: 500 }] }
  - name: large_random
    description: random prices, N = 100,000
    group: performance
    cases:
      - generate: { seed: 99, args: [{ kind: ints, n: 100000, min: -1000000, max: 1000000 }, { kind: value, value: 250000 }] }
  - name: large_descending
    description: falling prices, N = 100,000
    group: performance
    cases:
      - generate: { seed: 8, args: [{ kind: range, n: 100000, start: 100000, step: -1 }, { kind: value, value: 100000 }] }
  - name: extreme_large
    description: equal prices, every pair fits, N = 100,000
    group: performance
    cases:
      - generate: { seed: 9, args: [{ kind: constant, n: 100000, value: 0 }, { kind: value, value: 0 }] }
