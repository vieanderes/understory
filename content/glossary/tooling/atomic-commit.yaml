term: atomic commit
aka:
  - atomic commits
  - small commit
short: A commit that makes exactly one logical change and leaves the code building and passing tests.
explain: |
  Take a commit called "fixes and tidy-up". It renames a file, fixes a bug and reformats twelve
  others. It's hard to review and impossible to undo in part.

  Make each commit one change you can describe in one short line: the rename, then the fix,
  then the formatting. Each one builds and passes the tests on its own. `git add -p` lets you
  pick which lines go into which.

  The payoff comes later. `git revert` undoes one change cleanly. `git bisect` points at the exact commit that broke
  something, and `git blame` explains why a line exists.
analogy: Moving house with labelled boxes, one room each, instead of one giant box marked "stuff".
usage: Split the reformat into its own atomic commit so the bug fix is three lines a reviewer can read.
twin:
  term: squash-merge
  difference: An atomic commit is one logical change you make while working. A squash merge flattens a whole branch into one commit when it lands, whatever was inside.
related:
  - commit
  - squash-merge
  - conventional-commits
  - diff
level: 2
lessons:
