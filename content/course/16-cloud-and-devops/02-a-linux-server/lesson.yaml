deepDive: >-
  We re-ran this in September 2026 in Debian 12 containers. The mode catch: with the file at
  `644`, `su guest -c "cat /srv/shop/.env"` printed the database URL. At `600` it printed
  "cat: /srv/shop/.env: Permission denied".


  The SSH catch ran with OpenSSH 9.2 inside the container. With the two settings above, a
  correct password got `guest@localhost: Permission denied (publickey).` and exit code 255.
  `PermitRootLogin no` means even a stolen root key can't log in directly. Reload with
  `systemctl reload ssh`, and keep your current session open until a second one gets in.
  That's how you avoid locking yourself out.


  The systemd run used systemd 252 booted as process 1. We made the app exit with code 1.
  Two seconds later `systemctl is-active shop` said `active`, `NRestarts=1`, and the main
  process had a new PID. `Restart=on-failure` restarts after a non-zero exit or a signal,
  and leaves a clean exit alone. `WantedBy=multi-user.target` means "start this in the normal
  boot", and `systemctl enable --now shop` turns that on and starts it at once.


  `sudo` is the other half of permissions. It lets a named user run named commands as root.
  One line, `guest ALL=(root) NOPASSWD: /usr/bin/systemctl restart shop`, lets a deploy user
  restart the app and nothing more.


  In an earlier run of the firewall, port 3000 answered from a second machine until `ufw
  enable`, then timed out, while 22 still answered. A cloud provider's own firewall, often
  called a security group, does the same job one layer further out. Use both. One warning:
  Docker publishes ports by writing its own firewall rules, which can bypass ufw.
