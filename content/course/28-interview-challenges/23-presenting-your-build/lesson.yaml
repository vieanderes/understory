id: interview.presenting
title: Presenting your build
objective: Present a build in ten to fifteen minutes around your decisions, demo one path safely, and answer hard follow-up questions well.
level: essential
minutes: 9
concepts: [interview.decision-led-presentation, interview.handling-questions]
prerequisites: [interview.four-hour-build, sysdesign.the-method]
opening:
  text: >-
    You'll present a build so the panel sees how you think, not only what you made. Then
    you'll answer the hard follow-up questions without defending or dodging.

steps:
  - type: prose
    id: the-structure
    body: |-
      The panel gives you 10 to 15 minutes, then questions. Build the talk on
      **decisions**, not features:

      - the problem and what success means
      - the constraint, and what you chose to leave out
      - a diagram and two or three decisions, each with the option you rejected
      - a demo of one realistic path
      - evidence: tests, evals, known gaps
      - next steps, then invite the hardest question

  - type: multiple-choice
    id: pick-opening-minute
    concept: interview.decision-led-presentation
    difficulty: 1
    question: You have fifteen minutes to present your build. How do you open?
    choices:
      - text: The problem, and what success means
        correct: true
        feedback: >-
          Yes. Now the panel can judge everything after it against that goal.
      - text: The tech stack, tool by tool
        feedback: >-
          Tools come up later, as decisions. On their own they don't say why.
      - text: An apology for what's unfinished
        feedback: >-
          Gaps belong in the evidence section, stated plainly. Opening with them sets the wrong tone.

  - type: parsons
    id: order-talk
    concept: interview.decision-led-presentation
    difficulty: 2
    language: text
    prompt: Order a twelve-minute talk about a help-article assistant.
    blocks:
      - id: problem
        code: 'Problem: support answers, cited, or an honest "don''t know"'
        subgoal: Frame it
      - id: scope
        code: 'Scope: four hours, three must-haves, no login'
      - id: decisions
        code: Diagram, then two decisions and what each rejected
        subgoal: Show the thinking
      - id: demo
        code: 'Demo: one real question, one refusal'
      - id: evidence
        code: 'Evidence: tests, a 20-question eval set, known gaps'
        subgoal: Close
      - id: next
        code: Next steps, then "what would you push on?"
    distractors:
      - id: tour
        code: A tour of every screen and setting
        feedback: >-
          A tour shows what exists, not why. The panel learns little about your judgement.
      - id: code-walk
        code: Read the main file aloud, top to bottom
        feedback: >-
          The panel can read code. They'll ask for a walkthrough if they want one.

  - type: ai-review
    id: review-decision-slide
    concept: interview.decision-led-presentation
    difficulty: 3
    language: yaml
    request: Turn my notes into a decisions slide for the panel.
    flawClass: logic
    code: |
      decisions:
        - search: in-memory index, not a vector database, since 30 articles fit in memory
        - model: a small fast model, not the largest, since answers are short and cited
        - refusal: an early return below a set score, not a prompt rule, so it can't be argued with
        - framework: Next.js, because it's the best framework
    prompt: >-
      A strong decision line has three parts: the choice, the option you rejected, and why.
      Tap the line that will draw a sceptical question.
    lines: [5]
    reasons:
      - text: No rejected option, and the reason is taste
        correct: true
        feedback: >-
          Yes. Say what you weighed it against and what about this build decided it.
      - text: The search line is too specific
        feedback: >-
          The number is the point. It shows the choice fits this scale.
      - text: Refusal is a detail, not a decision
        feedback: >-
          Refusing in code over a prompt rule is a real trade-off. Panels love it.
    fix: |
      decisions:
        - search: in-memory index, not a vector database, since 30 articles fit in memory
        - model: a small fast model, not the largest, since answers are short and cited
        - refusal: an early return below a set score, not a prompt rule, so it can't be argued with
        - framework: Next.js over a separate API, since one deploy covers page and route

  - type: ai-review
    id: review-demo-plan
    concept: interview.decision-led-presentation
    difficulty: 3
    language: text
    request: Plan my talk for a 20-minute slot, questions included.
    flawClass: edge-case
    code: |
      0:00  | The problem and what success means
      1:00  | Scope: three must-haves, what I left out
      2:00  | Diagram, two decisions and what each rejected
      5:00  | Live demo on the venue wifi, against the hosted model
      9:00  | Evidence: 14 tests, 20-question eval set, known gaps
      11:00 | Next steps, then invite the hardest question
      12:00 | Questions
    prompt: >-
      An assistant drafted this. You rehearsed it twice at home, and the demo worked both
      times. Tap the line that could sink the talk.
    lines: [4]
    reasons:
      - text: No fallback if the network or model fails
        correct: true
        feedback: >-
          Yes. Keep a recording or screenshots ready, and switch without fuss.
      - text: Eight minutes of questions is too long
        feedback: >-
          A third of the slot is about right. Questions often count most.
      - text: The demo should open the talk
        feedback: >-
          Without the problem first, the panel can't tell what the demo proves.
    verify:
      question: How would you check the fallback before the day?
      choices:
        - text: Rehearse once with the wifi off, switching to the recording
          correct: true
          feedback: >-
            Yes. Only a real switch proves the fallback works.
        - text: Rehearse twice more at home
          feedback: >-
            That's what already passed. Working home wifi never tests the failure.
        - text: Ask the venue how good their wifi is
          feedback: >-
            Useful to know, but it's a promise, not a test of your switch.
    fix: |
      0:00  | The problem and what success means
      1:00  | Scope: three must-haves, what I left out
      2:00  | Diagram, two decisions and what each rejected
      5:00  | Live demo of one path; recording ready if it fails
      9:00  | Evidence: 14 tests, 20-question eval set, known gaps
      11:00 | Next steps, then invite the hardest question
      12:00 | Questions

  - type: prose
    id: answering-questions
    body: |-
      Then come the questions, and they often count more than the talk. A strong answer
      **owns the decision**, says what would change it, and admits what you don't know.

      "The team decided" doesn't work here, and neither does defending every choice. "I
      haven't measured that; here's how I would" is a good answer.

  - type: ai-review
    id: review-answer-draft
    concept: interview.handling-questions
    difficulty: 3
    language: yaml
    request: Draft answers to the follow-up questions I expect.
    flawClass: logic
    code: |
      - q: Why no vector database?
        a: Thirty articles fit in memory. Past about ten thousand, I'd switch.
      - q: What breaks first at a hundred times the load?
        a: I haven't measured it. My guess is the model calls, and I'd load test to check.
      - q: Why this chunk size?
        a: The starter template had it, so I kept it.
      - q: What would you do with another day?
        a: Streaming answers, then a larger eval set.
    prompt: >-
      You'll rehearse these aloud. One answer would end a deep-dive round fast. Tap it.
    lines: [6]
    reasons:
      - text: It hands the decision to someone else
        correct: true
        feedback: >-
          Yes. Own it: why it suits these articles, and what would make you change it.
      - text: Admitting you haven't measured looks weak
        feedback: >-
          An honest gap with a plan to check beats a confident guess. That one's fine.
      - text: The vector database answer dodges
        feedback: >-
          It names the reason and what would change it. That's the model answer.
    fix: |
      - q: Why this chunk size?
        a: About 200 words, so one answer fits one chunk. My eval set would tell me if it doesn't.

  - type: multiple-choice
    id: pick-ai-question
    concept: interview.handling-questions
    difficulty: 4
    question: '"Walk me through this function." The assistant wrote it. What do you do?'
    choices:
      - text: Walk through it, and say how you checked it
        correct: true
        feedback: >-
          Yes. You kept it, so you own it and can explain it.
      - text: Say the assistant wrote that part
        feedback: >-
          Honest, but it isn't an answer. Code you submitted is code you should explain.
      - text: Offer to rewrite it live instead
        feedback: >-
          That dodges the question. They asked what this code does and why it's there.

  - type: explain-back
    id: explain-decisions-over-tour
    concept: interview.decision-led-presentation
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Why does a panel learn more from two decisions with rejected options than from a tour
      of every feature?
    rubric:
      - A feature tour shows what exists, which the panel can see for itself.
      - A rejected option shows you weighed alternatives against the constraint.
      - Decisions give the panel real hooks for the follow-up questions they'll ask.
    modelAnswer: >-
      A tour shows what the app does, and the panel could find that out by clicking. A
      decision with the option I rejected shows how I weigh trade-offs against the time and
      the scale. That's the judgement they're hiring for. It also points their questions at
      my reasoning, where I'm prepared to go deep.

recap:
  - Open with the problem, then show two or three decisions with what you rejected.
  - Demo one realistic path, with a recording ready if it fails.
  - Answer questions by owning the call, naming what would change it and admitting gaps.
recall:
  - id: card-talk-shape
    concept: interview.decision-led-presentation
    front: What are the parts of a ten to fifteen minute build presentation?
    back: >-
      Problem and success, scope, a diagram with two or three decisions, one demo path,
      evidence, next steps, then invite the hardest question.
  - id: card-question-time
    concept: interview.decision-led-presentation
    front: How much of the slot should you leave for questions?
    back: >-
      About a third. The discussion often counts more than the talk.
  - id: card-demo-fallback
    concept: interview.decision-led-presentation
    front: Why do you prepare a recording or screenshots before a live demo?
    back: >-
      The network or the model can fail on the day. A fallback lets you carry on calmly.
  - id: card-good-answer
    concept: interview.handling-questions
    front: What three things does a strong answer to a follow-up question do?
    back: >-
      It owns the decision, says what would change it, and admits what you don't know.

