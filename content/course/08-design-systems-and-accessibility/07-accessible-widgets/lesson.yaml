id: design.accessible-widgets
title: Accessible widgets
objective: Reach for native widgets first, build a modal with `dialog` that handles focus, and follow the ARIA pattern when there's no native element.
level: essential
minutes: 10
concepts: [design.native-widgets, design.focus-management, design.aria-patterns]
prerequisites: [design.component-apis, design.keyboard-and-focus, react.hooks-and-refs]
opening:
  text: >-
    You'll build an answer panel, a confirm dialog and a set of tabs. Each one works by
    mouse, by keyboard and by ear, mostly with no JavaScript.

steps:
  - type: prose
    id: what-a-widget-is
    body: >-
      A **widget** is a control made of several parts that act as one: a dropdown, a dialog,
      a set of tabs. Built from `div` elements, each needs keys, focus and states by hand.
      That's where most keyboard bugs live.


      So reach for HTML's own first. `details` shows and hides, `dialog` asks a question,
      and `select` picks one option.

  - type: playground
    id: use-details
    concept: design.native-widgets
    difficulty: 1
    prompt: >-
      The answers open by mouse only. Rebuild each pair as `<details><summary>question</summary><p>answer</p></details>`.
      Then Tab to a question and press Enter.
    html: |
      <h2>Delivery questions</h2>
      <div class="question">How long does delivery take?</div>
      <div class="answer" hidden>Two to four working days.</div>
      <div class="question">Can I change the address?</div>
      <div class="answer" hidden>Yes, until the parcel is packed.</div>
    css: |
      body { font-family: sans-serif; }
      .question, summary { padding: 8px 0; font-weight: 700; cursor: pointer; }
    js: |
      document.querySelectorAll(".question").forEach((question) => {
        question.addEventListener("click", () => {
          question.nextElementSibling.hidden = !question.nextElementSibling.hidden;
        });
      });
    editable: [html]
    checks:
      - label: There are two `details` elements
        selector: details
        count: 2
      - label: The first `summary` asks about delivery time
        selector: details summary
        text: How long does delivery take?
      - label: No `div` is left
        selector: div
        count: 0
    solution:
      html: |
        <h2>Delivery questions</h2>
        <details>
          <summary>How long does delivery take?</summary>
          <p>Two to four working days.</p>
        </details>
        <details>
          <summary>Can I change the address?</summary>
          <p>Yes, until the parcel is packed.</p>
        </details>
    hints:
      - Each question and its answer go inside one `details`.
      - The question becomes the `summary`. The answer needs no `hidden`.
      - Start with `<details><summary>How long does delivery take?</summary>`.

  - type: prose
    id: what-a-modal-is
    body: |-
      A **modal dialog** blocks the page until you answer it, like "Delete this file?". It
      owes keyboard users four things. Focus moves in. Tab can't reach the page behind.
      Escape closes it. Focus goes back to the button that opened it. That's **focus
      management**, and `dialog` does all four:

      ```html
      <button commandfor="confirm" command="show-modal">Delete</button>
      <dialog id="confirm">
        <p>Delete this file?</p>
        <button commandfor="confirm" command="close">Cancel</button>
      </dialog>
      ```

  - type: playground
    id: build-the-dialog
    concept: design.focus-management
    difficulty: 2
    prompt: >-
      This modal is a `div`, so Tab walks straight past it. Make it `<dialog id="confirm">`,
      and wire Delete and Cancel with `commandfor` and `command`, as in the step before. Then
      try Tab and Escape.
    html: |
      <p>report-march.pdf</p>
      <button class="delete">Delete</button>
      <a href="#help">Help</a>
      <div class="modal" hidden>
        <p>Delete this file?</p>
        <button class="cancel">Cancel</button>
      </div>
    css: |
      body { font-family: sans-serif; }
      .modal, dialog { padding: 16px; border: 2px solid #1b1d2e; }
    js: |
      // The old div version. It does nothing once the div is gone.
      const modal = document.querySelector("div.modal");
      if (modal) {
        document.querySelector(".delete").addEventListener("click", () => { modal.hidden = false; });
        document.querySelector(".cancel").addEventListener("click", () => { modal.hidden = true; });
      }
    editable: [html]
    checks:
      - label: The modal is `<dialog id="confirm">`
        selector: dialog#confirm
        count: 1
      - label: Delete opens it with `show-modal`
        selector: 'button.delete[commandfor="confirm"][command="show-modal"]'
        count: 1
      - label: Cancel closes it with `close`
        selector: 'dialog button[commandfor="confirm"][command="close"]'
        count: 1
      - label: No `div` is left
        selector: div
        count: 0
    solution:
      html: |
        <p>report-march.pdf</p>
        <button class="delete" commandfor="confirm" command="show-modal">Delete</button>
        <a href="#help">Help</a>
        <dialog id="confirm">
          <p>Delete this file?</p>
          <button class="cancel" commandfor="confirm" command="close">Cancel</button>
        </dialog>
    hints:
      - The `div` becomes a `dialog`, and a dialog starts closed, so `hidden` can go.
      - Both buttons need `commandfor="confirm"`. They differ in `command`.
      - '`<button class="delete" commandfor="confirm" command="show-modal">Delete</button>`.'

  - type: ai-review
    id: review-div-modal
    concept: design.focus-management
    difficulty: 3
    language: tsx
    request: Add a confirmation dialog before deleting a file.
    flawClass: logic
    code: |
      function DeleteFile() {
        const [open, setOpen] = useState(false);
        return (
          <>
            <button onClick={() => setOpen(true)}>Delete</button>
            <div hidden={!open} className="modal">
              <p>Delete file?</p>
              <button onClick={() => setOpen(false)}>Cancel</button>
            </div>
          </>
        );
      }
    prompt: >-
      An assistant wrote this. The test clicks Delete and sees the modal. A keyboard user
      opens it, presses Tab, and lands on a link behind it. Tap the line at fault.
    lines: [6]
    reasons:
      - text: A `div` doesn't move, hold or return focus
        correct: true
        feedback: >-
          Yes. Focus stayed on Delete, so Tab walked on. A `dialog` handles all of it.
      - text: '`hidden` should be `display: none`'
        feedback: >-
          `hidden` hides it fine. Focus is what was never handled.
      - text: Cancel needs `tabIndex={0}`
        feedback: >-
          Buttons take focus already. Focus never got into the modal.
    fix: |
      function DeleteFile() {
        const dialog = useRef<HTMLDialogElement>(null);
        return (
          <>
            <button onClick={() => dialog.current?.showModal()}>Delete</button>
            <dialog ref={dialog}>
              <p>Delete file?</p>
              <button onClick={() => dialog.current?.close()}>Cancel</button>
            </dialog>
          </>
        );
      }

  - type: prose
    id: aria-patterns
    body: >-
      Tabs have no HTML element. For those, follow the **ARIA Authoring Practices Guide**, the
      W3C's catalogue of widget patterns: roles, states and keys.


      Tabs use `role="tablist"`, `role="tab"` and `role="tabpanel"`. Only the chosen tab is
      on the Tab path; arrow keys move between tabs. Roles are promises. `role="menu"` means
      an app menu, like File, driven by arrow keys.

  - type: playground
    id: add-the-tab-roles
    concept: design.aria-patterns
    difficulty: 3
    prompt: >-
      The states are in, but the roles aren't, so the script ignores them. Add `role="tablist"`
      to the wrapper, `role="tab"` to each button and `role="tabpanel"` to each panel. Then
      try the arrow keys.
    html: |
      <div class="tabs">
        <button aria-selected="true">Ingredients</button>
        <button aria-selected="false" tabindex="-1">Method</button>
        <button aria-selected="false" tabindex="-1">Reviews</button>
      </div>
      <section>Flour, butter, sugar and three lemons.</section>
      <section hidden>Beat, fold, bake for forty minutes.</section>
      <section hidden>"Better than my grandmother's."</section>
    css: |
      body { font-family: sans-serif; }
      button { padding: 8px 16px; border: 0; border-bottom: 3px solid transparent; background: none; font: inherit; }
      button[aria-selected="true"] { border-bottom-color: #0f766e; font-weight: 700; }
      section { padding: 16px 0; }
    js: |
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panels = document.querySelectorAll('[role="tabpanel"]');
      function show(index) {
        tabs.forEach((tab, i) => {
          tab.setAttribute("aria-selected", i === index);
          tab.tabIndex = i === index ? 0 : -1;
          panels[i].hidden = i !== index;
        });
        tabs[index].focus();
      }
      tabs.forEach((tab, i) => tab.addEventListener("click", () => show(i)));
      tabs.forEach((tab, i) => tab.addEventListener("keydown", (event) => {
        const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
        if (step) show((i + step + tabs.length) % tabs.length);
      }));
    editable: [html]
    checks:
      - label: The wrapper is a `tablist`
        selector: '.tabs[role="tablist"]'
        count: 1
      - label: All three buttons are tabs
        selector: '[role="tablist"] button[role="tab"]'
        count: 3
      - label: All three panels are tab panels
        selector: 'section[role="tabpanel"]'
        count: 3
    solution:
      html: |
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true">Ingredients</button>
          <button role="tab" aria-selected="false" tabindex="-1">Method</button>
          <button role="tab" aria-selected="false" tabindex="-1">Reviews</button>
        </div>
        <section role="tabpanel">Flour, butter, sugar and three lemons.</section>
        <section role="tabpanel" hidden>Beat, fold, bake for forty minutes.</section>
        <section role="tabpanel" hidden>"Better than my grandmother's."</section>
    hints:
      - Seven elements each get one `role` attribute.
      - The wrapper `div` is the list, the buttons are the tabs, the sections are panels.
      - '`<div class="tabs" role="tablist">`, then `<button role="tab" ...>`.'

  - type: multiple-choice
    id: pick-nav-not-menu
    concept: design.aria-patterns
    difficulty: 3
    language: html
    code: |
      <ul role="menu">
        <li role="menuitem"><a href="/shop">Shop</a></li>
        <li role="menuitem"><a href="/blog">Blog</a></li>
      </ul>
    question: This is a site's main navigation. Is `role="menu"` right?
    choices:
      - text: No, links like these belong in a `nav`
        correct: true
        feedback: >-
          Right. The menu pattern is for app commands, like a File menu, with arrow keys.
      - text: Yes, it's a menu of pages
        feedback: >-
          Most people think so. But the ARIA menu role promises arrow keys and app commands.
      - text: Yes, as long as each item is a link
        feedback: >-
          The links are fine. The role promises a widget these links don't behave like.

  - type: explain-back
    id: explain-dialog-over-div
    concept: design.native-widgets
    difficulty: 3
    prompt: >-
      A teammate built a modal from a `div` and a click handler. Why would you swap it for
      `dialog`?
    rubric:
      - A modal must move focus in, keep Tab from the page behind, close on Escape and return focus.
      - A `div` does none of those, so each would need hand-written code, and some get missed.
      - '`dialog`, opened as a modal, does all four and marks itself as a dialog in the tree.'
    modelAnswer: >-
      A modal owes keyboard users four things. Focus moves into it, and Tab can't wander to
      the page behind. Escape closes it, and focus returns to the button that opened it. A `div`
      gives none of those, so each one is code to write and test, and one always gets
      missed. `dialog` opened with `show-modal` does all four, and a screen reader announces
      it as a dialog.

recap:
  - Use `details`, `dialog` and `select` before building a widget by hand.
  - Open a modal `dialog` so focus moves in, stays in and comes back.
  - Follow the ARIA pattern's roles, states and keys when there's no native element.

recall:
  - id: card-native-first
    concept: design.native-widgets
    front: Which HTML elements give you a show-and-hide panel and a modal, with no script?
    back: >-
      `details` with a `summary` for show and hide. `dialog`, opened as a modal, for a
      question.
  - id: card-dialog-four
    concept: design.focus-management
    front: What four things does a modal dialog owe keyboard users?
    back: >-
      Focus moves in, Tab can't reach the page behind, Escape closes it, and focus returns to
      the opener.
  - id: card-tab-roles
    concept: design.aria-patterns
    front: Which roles make up the ARIA tabs pattern, and which keys move between tabs?
    back: >-
      `tablist`, `tab` and `tabpanel`. The left and right arrow keys, with the whole set as
      one Tab stop.
  - id: card-nav-not-menu
    concept: design.aria-patterns
    front: Why shouldn't a site's main navigation use `role="menu"`?
    back: >-
      The menu role is for app commands with arrow keys. Navigation links belong in a `nav`.

