summary: >-
  The same facts need a different explanation for each listener. Three things change: the
  **vocabulary** (which words they already own), the **detail** (how far down the mechanism
  you go) and the **stakes** (what it means for them, and what they must do or decide). The
  facts themselves never change. A version that is true for the executive and false for the
  engineer is spin, not fitting the audience.


  People outside engineering need the **stakes first**. A customer wants to know whether they
  were affected and whether to act. A product manager wants to know what changes for users
  and the plan. An executive wants the size of the problem, where it stands and the decision
  they own. The mechanism comes only if they ask. For a junior developer it's the other way
  round: the mechanism is the lesson, because it's what lets them spot the pattern next time.


  You'll use this after every incident, in every status report and whenever work crosses a
  team boundary. It also changes what you notice before sending. Reading a message as its
  real reader catches jargon, missing asks and, sometimes, details that were never meant for
  that reader at all.
remember:
  - Keep the facts fixed and change the vocabulary, the detail and the stakes for each listener.
  - Give everyone outside engineering the stakes first, and the mechanism only if they ask.
  - A customer needs to know whether they were affected and whether they must do anything.
  - An executive needs the impact in numbers, where it stands and the one decision or thing you need.
  - A product manager needs what changes for users and for the plan, with the reason for any delay.
  - A junior developer needs the mechanism and the pattern, because spotting it next time is the point.
  - Reread every message as its real reader before sending, including whose data it contains.
  - Write the shortest version first; if you can't state the impact and the ask in three sentences, you don't know them yet.
sections:
  - title: One set of facts, four messages
    body: |-
      Start from a single fact sheet and derive every message from it. That keeps the
      versions consistent, which matters when they get forwarded to each other.

      ```yaml
      what: booking pages showed any booking to anyone who changed the number in the link
      when: Saturday 18:00 to 18:40
      who: 3 accounts viewed 212 other customers' bookings
      exposed: name, film, time, seat; no card details or passwords
      fixed: 18:40, ownership check on the booking page, plus a test
      open: four other pages look up records by id the same way
      ```

      Then pick, for each listener, the lines that change what they do:

      - **Customer**: `exposed` and what to do (nothing), in their words. No `open`, no
        internals.
      - **Product manager**: `fixed` and `open`, translated into the plan: the seat picker
        is one of the four pages, so its launch moves.
      - **Executive**: `who`, `exposed`, `fixed`, then the ask, such as approval to contact
        customers.
      - **Junior developer**: `what` and `fixed` in full, with the request that showed it
        and the test that guards it.

      Notice that no message contradicts another. They differ in selection and wording, not
      in truth. If the executive's version says "minor" and the engineer's says "212
      customers", the executive will hear the second number from someone else, and your
      next brief will be read with suspicion.
  - title: Vocabulary is a contract
    body: |-
      Every word you use is a promise that the listener owns it. "Endpoint", "session" and
      "authorisation check" are free for a developer and expensive for everyone else. Each
      one costs a customer a moment of decoding, and three in a row lose them.

      The fix isn't to remove meaning; it's to swap the term for its effect:

      ```text
      the endpoint skipped the authorisation check
      -> the page didn't check the booking was yours
      the session token was invalidated
      -> you'll need to sign in again
      ```

      The reverse mistake is as real. Talking to an engineer in effects only ("the
      page didn't check") hides the precise term they'd search for, review for and write a
      test against. For a junior developer, give the effect first, then the term: "the page
      didn't check the booking was yours. That's a missing ownership check, one of the most common
      access-control bugs."

      Numbers need the same care. "212 bookings" is clear to everyone. "0.4% of sessions"
      makes a customer ask whether they're in the 0.4% and makes an executive ask how many
      people that is. Give the count that answers their question, and the percentage only
      when the base is obvious.
  - title: When the message itself leaks
    body: |-
      Fitting the audience includes knowing who the audience really is. A customer email
      goes to everyone on the list, a status page goes to the world, and an executive brief
      is often forwarded to a board or a lawyer. Each of those readers can see everything
      you include.

      Three things leak most often in incident communication:

      - **Examples copied from logs.** A real name, email, booking reference or address
        used "for illustration" exposes that person again, to more people.
      - **Exploit detail.** "Changing the number in the link showed other bookings" is fine
        once every page is fixed. Before then, it's instructions.
      - **Internal names.** Hostnames, table names and customer account ids mean nothing to
        customers and help anyone probing your systems.

      The check is mechanical: before sending, highlight every specific detail in the
      message and ask whose it is and who will read it. With an AI assistant drafting from
      logs or tickets, this check matters more, because the assistant has the raw data in
      front of it and no sense of who will read the result.
pitfalls:
  - '**One message for everyone.** A single update tries to serve the customer and the engineer and serves neither. Write from one fact sheet, then one message per audience.'
  - '**Mechanism first for people outside engineering.** It feels thorough, but they stop reading before the part that affects them. Lead with what it means for them, and offer the detail.'
  - '**Softening the facts for seniority.** "A minor issue" to an executive while engineers say 212 customers destroys trust when the numbers meet. Change the words, never the facts.'
  - '**No ask.** A brief that informs but asks nothing leaves the decision unmade. End with what you need from them and by when.'
  - '**Real data as an example.** Logs make handy examples, and every one of them is someone''s personal data. Use invented details or none.'
verify:
  - lens: leaks
    check: Highlight every name, reference, address and seat in a customer message and confirm each belongs to the reader it's sent to.
  - lens: confuses
    check: Find every term the reader wouldn't use themselves, such as endpoint or session, and replace it with its effect on them.
  - lens: breaks
    check: Compare each audience's message against the one fact sheet, so no number or claim differs when they're forwarded to each other.
  - lens: leaks
    check: Remove exploit steps and internal names from anything customers or the public can read until every affected page is fixed.
interview:
  - question: How would you explain a production incident to a non-technical executive?
    answer: >-
      Stakes first, in their terms, with one clear ask. I'd give the impact as numbers they
      can repeat: how many customers, what was exposed or broken, for how long. Then where
      it stands: fixed, contained or still open, and whether it could recur. Then the
      decision they own, such as approving customer contact or accepting a delay. I'd leave
      out the mechanism unless asked, but keep it ready. The trade-off is precision: an
      executive brief compresses, so I make sure it never contradicts the engineering
      version. If the numbers differ when the two meet, trust goes, and every later brief is
      discounted.
  - question: How do you adapt a technical explanation for a junior developer versus a product manager?
    answer: >-
      Same facts, different goal. The junior developer needs to be able to spot and fix the
      pattern next time, so I give the mechanism in full: the request that showed the bug,
      the line that lacked the check, the fix and the test that guards it. Then the review
      question that would have caught it. The product manager needs to plan, so I give what
      changes for users and for the roadmap, and the reason for any delay in their terms:
      "two days so four more pages get the same check, and the seat picker is one of them".
      With both, I check understanding by asking them to apply it, not by asking whether it
      made sense.
  - question: Tell me about a time you had to deliver bad news to a customer or stakeholder.
    answer: >-
      I'd pick a real case and show the structure. I led with what it meant for them, in
      plain words, then whether they needed to act, then what we'd done and what would
      change. I didn't open with an apology or with the cause; those came after the facts
      they needed. I gave a specific next step and a time, so they weren't left waiting. I'd
      also mention what I checked before sending: that every detail in the message belonged
      to them and that no internal names or exploit steps went out. The lesson I'd draw is
      that bad news delivered early and plainly costs less trust than good news delivered
      late.
