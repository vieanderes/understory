term: standard streams
aka: [stdout, stderr, stdin, standard output, standard error, standard input]
short: The three default channels every program gets, one for input, one for results, one for problems.
explain: |
  A command-line program reads from one channel and writes to two. Keeping them apart lets
  other programs use its output without your warnings mixed in.

  Input arrives on stdin. Results go to stdout, which a pipe or a `>` redirect carries to
  the next place. Messages, progress and errors go to stderr, which still shows in the
  terminal while stdout goes to a file. Print a warning to stdout and it ends up inside
  somebody's CSV.
analogy: A kitchen hatch for finished plates and a separate shout to the manager when something burns. Customers never get the shouting on their plate.
example:
  language: python
  code: |
    import sys

    print("name,total")                       # stdout: the data
    print("skipped 3 bad rows", file=sys.stderr)  # stderr: the note
usage: Send the progress messages to stderr, otherwise they end up in the JSON that the next command reads from stdout.
related: [exit-code, process]
level: 2
lessons: [python.report-tool]
