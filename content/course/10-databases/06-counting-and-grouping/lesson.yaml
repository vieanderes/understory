    verified: true

deepDive: >-
  `sum` of no rows is NULL, not 0, which surprises many dashboards on a quiet day.
  `coalesce(sum(total_pence), 0)` swaps the NULL for a zero.


  `count(DISTINCT agent)` counts different values, so it tells you how many agents have
  tickets rather than how many tickets there are.


  A `FILTER` clause counts several things in one pass:
  `count(*) FILTER (WHERE closed_at IS NULL) AS open, count(*) AS all_tickets`. It saves
  running the query twice.


  `ORDER BY` runs after `SELECT`, so unlike `WHERE` it can use an alias:
  `ORDER BY open_tickets DESC` works.
