term: standalone output
aka: [ "output: 'standalone'", standalone build ]
short: A Next.js build setting that copies the server and only the packages it needs into one folder.
explain: |
  A Next.js project's `node_modules` can weigh hundreds of megabytes, mostly build tools.
  Shipping all of it to a server or container is slow and wasteful.

  With `output: 'standalone'`, `next build` traces which files the server really uses. It
  copies only those into `.next/standalone`, with a `server.js` to start. The trap: the
  `public` and `.next/static` folders are not included. Copy them in beside it, or every image
  and script returns a 404.
analogy: Packing for a trip by taking only what you'll wear, not your whole wardrobe.
example:
  language: bash
  code: |
    next build
    cp -r public .next/standalone/
    cp -r .next/static .next/standalone/.next/
    node .next/standalone/server.js
usage: Switch to standalone output and the container image drops from a gigabyte to about 150 MB.
related: [ container-image, self-hosting, bundler ]
level: 3
lessons: [ nextserver.deploying ]
