    note: The community's list of traps, including `timestamp` without a zone and the `money` type.
    verified: true

deepDive: >-
  Postgres has a `money` type, and the community advises against it: its output depends on a
  locale setting, so the same row can print differently on two servers. Stick with integer
  pence or `numeric`.


  Name your constraints when the name will be read: `CONSTRAINT seats_positive CHECK (seats >=
  1)`. The name appears in the error, and your code can turn it into a friendly message.


  `text` has no length limit to worry about in Postgres. `varchar(255)` is a habit from other
  databases. Add a `CHECK (length(code) = 3)` when a length really is a rule.


  A `timestamptz` doesn't store the zone it was written in. It converts to UTC on the way in
  and to the reader's zone on the way out. If you need the organiser's zone too, store it in
  its own column.
