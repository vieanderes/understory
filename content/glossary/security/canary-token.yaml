term: canary token
aka:
  - honeytoken
  - canary value
short: A fake but realistic value planted on purpose, so you notice when it turns up somewhere it shouldn't.
explain: |
  You can't search your logs for every real customer's email. You can search for one you
  made up. So you plant a distinctive fake, such as a made-up address, and watch for it.

  In a test, sign up with the fake value, run the flow, then check every log, URL and
  analytics call for it. Check encoded forms too, since a URL escapes the `@`.

  In production, a fake credential that should never be used works as an alarm. If anyone
  tries it, someone got in.
analogy: Marking a banknote before a sting. If it turns up in someone's wallet, you know where it went.
example:
  language: js
  code: |
    const canary = 'ana.canary@example.com';
    await signUp({ email: canary });
    const leaked = sinks.filter((s) =>
      s.text.toLowerCase().includes(canary) ||
      s.text.includes(encodeURIComponent(canary)));
    expect(leaked).toEqual([]);
usage: Sign up with a canary token, then grep the logs for it.
related:
  - data-sink
  - secret
  - threat-model
level: 3
lessons:
  - judgment.what-leaks
