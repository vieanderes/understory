title: Amateur and pro, side by side
summary: >-
  Forty-eight habits that separate code an interviewer trusts from code they have to
  question. Each one shows the same job done twice: first the way it comes out when you are
  rushing, then the way a senior engineer writes it, with the reason in a few sentences. Read
  a language block the night before a round, then write the pro version from memory.
sections:
  - title: "JavaScript: Strict equality over loose equality"
    body: |-
      You compare a value from a form or an API with a number.

      **Amateur**

      ```js
      const quantity = '0';
      if (quantity == 0) {
        console.log('Cart is empty');
      }
      console.log('' == 0, null == undefined, [] == false); // true true true
      ```

      **Pro**

      ```js
      const quantity = Number('0');
      if (quantity === 0) {
        console.log('Cart is empty');
      }
      console.log('' === 0, [] === false); // false false
      ```

      **Why it matters**

      `==` converts both sides before it compares, so an empty string equals zero and an empty array equals `false`. `===` compares type and value, so you convert once, on purpose, where the data comes in. The one accepted use of `==` is `value == null`, which matches both `null` and `undefined`. An interviewer will notice a stray `==`.

  - title: "JavaScript: Return a copy instead of mutating the input"
    body: |-
      A function adds an item to a cart that the caller still holds.

      **Amateur**

      ```js
      function addItem(cart, item) {
        cart.items.push(item);
        return cart;
      }
      const before = { items: ['tea'] };
      const after = addItem(before, 'milk');
      console.log(before === after, before.items); // true [ 'tea', 'milk' ]
      ```

      **Pro**

      ```js
      function addItem(cart, item) {
        return { ...cart, items: [...cart.items, item] };
      }
      const before = { items: ['tea'] };
      const after = addItem(before, 'milk');
      console.log(before.items, after.items); // [ 'tea' ] [ 'tea', 'milk' ]
      ```

      **Why it matters**

      A function that changes its argument surprises every caller, and React will not re-render when you hand it the same object with new contents. Spread copies one level deep, so copy each level you change, or use `structuredClone` for a full deep copy. Mutating is fine for a local array you created inside the function and nobody else can see.

  - title: "JavaScript: Array methods, and when a plain loop is better"
    body: |-
      You total the paid orders, and separately stop as soon as a budget runs out.

      **Amateur**

      ```js
      const orders = [{ total: 40, paid: true }, { total: 15, paid: false }, { total: 25, paid: true }];
      const paidTotals = [];
      for (let i = 0; i < orders.length; i++) {
        if (orders[i].paid === true) {
          paidTotals.push(orders[i].total);
        }
      }
      let revenue = 0;
      for (let i = 0; i < paidTotals.length; i++) revenue += paidTotals[i];
      console.log(revenue); // 65
      ```

      **Pro**

      ```js
      const orders = [{ total: 40, paid: true }, { total: 15, paid: false }, { total: 25, paid: true }];
      const revenue = orders
        .filter((order) => order.paid)
        .reduce((sum, order) => sum + order.total, 0);
      console.log(revenue); // 65

      // A loop reads better when you need to stop early.
      let spent = 0;
      for (const order of orders) {
        if (spent + order.total > 50) break;
        spent += order.total;
      }
      console.log(spent); // 40
      ```

      **Why it matters**

      `filter` and `reduce` say what you want, so the reader skips the index bookkeeping. Always give `reduce` a starting value: without one it throws on an empty array. Reach for `for...of` when you need `break`, an `await` in order, or several results from one pass, because forcing those into `reduce` is harder to read than the loop.

  - title: "JavaScript: No async callbacks inside forEach"
    body: |-
      You save several records and then report what was saved. Top-level `await` needs a module, so run these as `.mjs` files.

      **Amateur**

      ```js
      const save = (id) => new Promise((resolve) => setTimeout(() => resolve(id), 10));
      const saved = [];
      [1, 2, 3].forEach(async (id) => {
        saved.push(await save(id));
      });
      console.log('Saved:', saved); // Saved: []
      ```

      **Pro**

      ```js
      const save = (id) => new Promise((resolve) => setTimeout(() => resolve(id), 10));
      const saved = [];
      for (const id of [1, 2, 3]) {
        saved.push(await save(id));
      }
      console.log('Saved:', saved); // Saved: [ 1, 2, 3 ]
      ```

      **Why it matters**

      `forEach` ignores the promise each callback returns, so the code after it runs before any save has finished. A rejection inside that callback has nobody waiting for it and becomes an unhandled rejection. Use `for...of` with `await` when order matters, or `Promise.all` with `map` when it does not. This is one of the most common async bugs interviewers plant in review exercises.

  - title: "JavaScript: Run independent requests together with Promise.all"
    body: |-
      You need three prices that do not depend on each other.

      **Amateur**

      ```js
      const fetchPrice = (sku) => new Promise((r) => setTimeout(() => r({ sku, price: 10 }), 100));
      console.time('prices');
      const tea = await fetchPrice('tea');
      const milk = await fetchPrice('milk');
      const bread = await fetchPrice('bread');
      console.timeEnd('prices'); // about 300 ms
      ```

      **Pro**

      ```js
      const fetchPrice = (sku) => new Promise((r) => setTimeout(() => r({ sku, price: 10 }), 100));
      console.time('prices');
      const [tea, milk, bread] = await Promise.all(
        ['tea', 'milk', 'bread'].map((sku) => fetchPrice(sku)),
      );
      console.timeEnd('prices'); // about 100 ms
      ```

      **Why it matters**

      Each `await` in a row waits for the one before, so three 100 ms calls take 300 ms. `Promise.all` starts them together and rejects as soon as one fails. Use `Promise.allSettled` when one failure must not sink the rest, and cap concurrency when you fire hundreds of calls at a rate-limited API such as a model provider. Sequential `await` is right when each call needs the result of the last.

  - title: "JavaScript: Handle errors from fetch and async calls"
    body: |-
      You load an order from an API.

      **Amateur**

      ```js
      async function loadOrder(id) {
        const response = await fetch(`https://api.example.invalid/orders/${id}`);
        return response.json();
      }
      loadOrder(42).then((order) => console.log(order.total));
      // A network error crashes Node with an unhandled rejection.
      ```

      **Pro**

      ```js
      async function loadOrder(id) {
        const response = await fetch(`https://api.example.invalid/orders/${id}`);
        if (!response.ok) {
          throw new Error(`Order ${id} failed with status ${response.status}`);
        }
        return response.json();
      }
      try {
        const order = await loadOrder(42);
        console.log(order.total);
      } catch (error) {
        console.error('Could not load order:', error.message);
      }
      ```

      **Why it matters**

      `fetch` only rejects when the network fails. A 404 or 500 resolves normally, so you must check `response.ok` yourself. A promise that rejects with no `catch` ends a Node process by default, which in a server means a dropped request or a restart. Say out loud what the user sees when the call fails: interviewers listen for it.

  - title: "JavaScript: let in loops, not var"
    body: |-
      You create one callback per loop step.

      **Amateur**

      ```js
      const callbacks = [];
      for (var i = 0; i < 3; i++) {
        callbacks.push(() => console.log(i));
      }
      callbacks.forEach((callback) => callback()); // 3 3 3
      ```

      **Pro**

      ```js
      const callbacks = [];
      for (let i = 0; i < 3; i++) {
        callbacks.push(() => console.log(i));
      }
      callbacks.forEach((callback) => callback()); // 0 1 2
      ```

      **Why it matters**

      `var` is scoped to the function, so every callback closes over the same `i`, which is 3 by the time they run. `let` makes a fresh binding for each step. Default to `const`, use `let` when you reassign, and never write `var` in new code. "What does this print?" with this loop is a classic interview question.

  - title: "JavaScript: Optional chaining and ?? instead of || defaults"
    body: |-
      You read settings where zero and an empty string are valid values.

      **Amateur**

      ```js
      const settings = { user: { quantity: 0, note: '' } };
      const quantity = settings.user.quantity || 1;
      const note = settings.user.note || 'No note';
      const city = settings.address && settings.address.city;
      console.log(quantity, JSON.stringify(note), city); // 1 "No note" undefined
      ```

      **Pro**

      ```js
      const settings = { user: { quantity: 0, note: '' } };
      const quantity = settings.user.quantity ?? 1;
      const note = settings.user.note ?? 'No note';
      const city = settings.address?.city;
      console.log(quantity, JSON.stringify(note), city); // 0 "" undefined
      ```

      **Why it matters**

      `||` falls back on every falsy value, so a real `0`, `''` or `false` is silently replaced. `??` falls back only on `null` and `undefined`, and `?.` stops at a missing object instead of throwing. `||` is still right when an empty string should also get the default, such as a blank display name.

  - title: "JavaScript: Named constants and names that explain"
    body: |-
      You price an order with a bulk discount and a shipping fee.

      **Amateur**

      ```js
      function f(d, x) {
        if (x > 3) return d * 0.9;
        return d + 4.99;
      }
      console.log(f(50, 5), f(50, 1)); // 45 54.99
      ```

      **Pro**

      ```js
      const BULK_DISCOUNT_MIN_ITEMS = 4;
      const BULK_DISCOUNT_RATE = 0.1;
      const SHIPPING_FEE = 4.99;

      function priceOrder(subtotal, itemCount) {
        if (itemCount >= BULK_DISCOUNT_MIN_ITEMS) return subtotal * (1 - BULK_DISCOUNT_RATE);
        return subtotal + SHIPPING_FEE;
      }
      console.log(priceOrder(50, 5), priceOrder(50, 1)); // 45 54.99
      ```

      **Why it matters**

      A reader of `f(d, x)` has to reverse-engineer the business rule, and a change to the fee means hunting for every `4.99`. Named constants document the rule and live in one place. Short names are fine for a loop index or a two-line arrow function. In an interview, good names are the cheapest signal of clear thinking you can give.

  - title: "JavaScript: Map and Set for lookups, not nested searches"
    body: |-
      You attach a customer name to each order.

      **Amateur**

      ```js
      const orders = [{ id: 1, customerId: 'c1' }, { id: 2, customerId: 'c2' }];
      const customers = [{ id: 'c1', name: 'Ada' }, { id: 'c2', name: 'Lin' }];
      const rows = orders.map((order) => ({
        order: order.id,
        name: customers.find((customer) => customer.id === order.customerId).name,
      }));
      console.log(rows);
      ```

      **Pro**

      ```js
      const orders = [{ id: 1, customerId: 'c1' }, { id: 2, customerId: 'c2' }];
      const customers = [{ id: 'c1', name: 'Ada' }, { id: 'c2', name: 'Lin' }];
      const customersById = new Map(customers.map((customer) => [customer.id, customer]));
      const rows = orders.map((order) => ({
        order: order.id,
        name: customersById.get(order.customerId)?.name ?? 'Unknown',
      }));
      console.log(rows);
      ```

      **Why it matters**

      `find` inside `map` scans the whole list for every order, which is O(n × m) and turns into seconds with ten thousand of each. Building a `Map` once costs O(m) and each lookup is O(1). A `Set` does the same for "have I seen this?" checks and for removing duplicates. The amateur version also throws when a customer is missing. This is the first optimisation an interviewer expects you to spot.

  - title: "JavaScript: Sort numbers with a comparator"
    body: |-
      You sort prices from low to high.

      **Amateur**

      ```js
      const prices = [10, 9, 100, 1];
      const sorted = prices.sort();
      console.log(sorted); // [ 1, 10, 100, 9 ]
      console.log(prices === sorted); // true, the original changed too
      ```

      **Pro**

      ```js
      const prices = [10, 9, 100, 1];
      const sorted = prices.toSorted((a, b) => a - b);
      console.log(sorted); // [ 1, 9, 10, 100 ]
      console.log(prices); // [ 10, 9, 100, 1 ], unchanged
      ```

      **Why it matters**

      Without a comparator, `sort` converts every value to a string and orders them as text, so `100` comes before `9`. It also sorts in place and returns the same array. `toSorted` returns a new array and leaves the input alone. For objects, sort by a field with `(a, b) => a.total - b.total`, or `a.name.localeCompare(b.name)` for text.

  - title: "JavaScript: Money in cents and dates in UTC"
    body: |-
      You total a price and read the day of a booking.

      **Amateur**

      ```js
      console.log(0.1 + 0.2 === 0.3); // false
      console.log(1.15 * 3); // 3.4499999999999997
      const booking = new Date('2026-09-29');
      console.log(booking.getDate()); // 28 in any time zone west of UTC
      const october = new Date(2026, 10, 1); // actually November: months start at 0
      console.log(october.getMonth()); // 10
      ```

      **Pro**

      ```js
      const totalInCents = 115 * 3; // 345, exact
      const pounds = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
      console.log(pounds.format(totalInCents / 100)); // £3.45
      const booking = new Date('2026-09-29T00:00:00Z');
      console.log(booking.getUTCDate()); // 29 everywhere
      console.log(Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON); // true
      ```

      **Why it matters**

      Numbers are binary floating point, so decimal fractions are rounded and errors add up across a basket. Store money as whole cents and format only for display. A date-only string parses as midnight UTC, so local getters can show the day before. Floats are fine for measurements such as scores or percentages, but never compare them with `===`.

  - title: "JavaScript: Early returns instead of nested ifs"
    body: |-
      You decide whether a user can book a slot.

      **Amateur**

      ```js
      function canBook(user, slot) {
        if (user) {
          if (user.verified) {
            if (slot.available) {
              return true;
            } else {
              return false;
            }
          } else {
            return false;
          }
        } else {
          return false;
        }
      }
      console.log(canBook({ verified: true }, { available: true })); // true
      ```

      **Pro**

      ```js
      function canBook(user, slot) {
        if (!user) return false;
        if (!user.verified) return false;
        return slot.available;
      }
      console.log(canBook({ verified: true }, { available: true })); // true
      console.log(canBook(null, { available: true })); // false
      ```

      **Why it matters**

      Guard clauses deal with the failures first, so the happy path sits at the left margin and each rule is one line. Nested `if`/`else` makes you match braces to find which `false` belongs to which check. Adding a rule to the pro version is one new line. A single `if` with an `else` is fine when both branches do real work.

  - title: "TypeScript: unknown and narrowing instead of any"
    body: |-
      You read a value from parsed JSON.

      **Amateur**

      ```ts
      function getTotal(data: any): number {
        return data.order.total;
      }
      const raw = JSON.parse('{"order": null}');
      console.log(getTotal(raw)); // compiles, then throws a TypeError
      ```

      **Pro**

      ```ts
      function getTotal(data: unknown): number {
        if (
          typeof data === 'object' && data !== null &&
          'order' in data && typeof data.order === 'object' && data.order !== null &&
          'total' in data.order && typeof data.order.total === 'number'
        ) {
          return data.order.total;
        }
        throw new Error('Expected { order: { total: number } }');
      }
      console.log(getTotal(JSON.parse('{"order": {"total": 12}}'))); // 12
      ```

      **Why it matters**

      `any` switches the type checker off, and it spreads: everything you read from an `any` is `any` too. `unknown` says "I do not know yet" and refuses every use until you narrow it with `typeof`, `in` or `instanceof`. For anything bigger than one field, a schema library does the narrowing for you, as the next section shows. An interviewer reading TypeScript will count your `any`s.

  - title: "TypeScript: Discriminated unions instead of optional-field soup"
    body: |-
      You model a payment that can be pending, paid or failed.

      **Amateur**

      ```ts
      type Payment = {
        status: 'pending' | 'paid' | 'failed';
        paidAt?: Date;
        error?: string;
      };
      const payment: Payment = { status: 'paid', error: 'Card declined' }; // compiles
      console.log(payment.paidAt?.toISOString()); // undefined
      ```

      **Pro**

      ```ts
      type Payment =
        | { status: 'pending' }
        | { status: 'paid'; paidAt: Date }
        | { status: 'failed'; error: string };

      function describe(payment: Payment): string {
        if (payment.status === 'failed') return `Failed: ${payment.error}`;
        if (payment.status === 'paid') return `Paid on ${payment.paidAt.toISOString()}`;
        return 'Waiting';
      }
      console.log(describe({ status: 'failed', error: 'Card declined' })); // Failed: Card declined
      ```

      **Why it matters**

      With optional fields, the type allows states that cannot happen, such as paid with an error and no date, and every reader has to check fields that should be guaranteed. A union with a shared `status` tag makes impossible states unrepresentable. Checking the tag narrows the type, so `paidAt` is there without `?.`. This is how you model API responses, events and agent tool results.

  - title: "TypeScript: Validate at the boundary instead of casting with as"
    body: |-
      You parse a request body, or the JSON a model returned.

      **Amateur**

      ```ts
      type Order = { id: string; total: number };
      const body = '{"id": "a1", "total": "12.50"}';
      const order = JSON.parse(body) as Order;
      console.log(order.total + 1); // 12.501, a string
      ```

      **Pro**

      ```ts
      import { z } from 'zod';

      const OrderSchema = z.object({ id: z.string(), total: z.number() });
      type Order = z.infer<typeof OrderSchema>;

      const body = '{"id": "a1", "total": "12.50"}';
      const result = OrderSchema.safeParse(JSON.parse(body));
      if (result.success) {
        const order: Order = result.data;
        console.log(order.total + 1);
      } else {
        console.error(result.error.issues[0]?.message); // Invalid input: expected number, received string
      }
      ```

      **Why it matters**

      `as` is a promise to the compiler that nobody checks at runtime, so bad data flows on and fails far from where it entered. A schema checks the data once, where it crosses into your code, and gives you the type for free. Validate everything from outside: requests, files, environment variables and model output. `as` is acceptable when you know more than the compiler, such as after your own check, and never on raw input.

  - title: "TypeScript: readonly and as const"
    body: |-
      You define a fixed list of statuses and a function that reads an array.

      **Amateur**

      ```ts
      const STATUSES = ['draft', 'sent', 'paid'];
      type Status = string;
      const status: Status = 'shipped'; // any string passes
      STATUSES.push('refunded'); // allowed
      console.log(STATUSES, status);
      ```

      **Pro**

      ```ts
      const STATUSES = ['draft', 'sent', 'paid'] as const;
      type Status = (typeof STATUSES)[number]; // 'draft' | 'sent' | 'paid'
      const status: Status = 'sent';

      function sum(values: readonly number[]): number {
        return values.reduce((total, value) => total + value, 0);
      }
      // @ts-expect-error push does not exist on a readonly tuple
      STATUSES.push('refunded');
      console.log(status, sum([1, 2]));
      ```

      **Why it matters**

      `as const` keeps the literal values, so one array gives you both the runtime list and the union type, and they cannot drift apart. `readonly` in a parameter tells callers you will not change their array and stops you doing it by accident. Both vanish at runtime: use `Object.freeze` when the value must be protected while the program runs.

  - title: "TypeScript: Generics instead of copies and any"
    body: |-
      You need the same helper for orders, bookings and anything else.

      **Amateur**

      ```ts
      type Order = { id: string; total: number };
      function orderTotals(items: Order[]): number[] {
        return items.map((item) => item.total);
      }
      function pluckAny(items: any[], key: string): any[] {
        return items.map((item) => item[key]);
      }
      console.log(pluckAny([{ id: 'a1', total: 12 }], 'price')); // [ undefined ]
      ```

      **Pro**

      ```ts
      function pluck<T, K extends keyof T>(items: readonly T[], key: K): T[K][] {
        return items.map((item) => item[key]);
      }
      const orders = [{ id: 'a1', total: 12 }, { id: 'b2', total: 30 }];
      const totals = pluck(orders, 'total'); // number[]
      console.log(totals); // [ 12, 30 ]
      // @ts-expect-error 'price' is not a key of the order type
      pluck(orders, 'price');
      ```

      **Why it matters**

      A copy per type means every fix lands in several places. The `any` version works for every type but checks nothing, so a typo in the key returns `undefined`. A generic keeps the link between input and output: the key must exist, and the result has the right type. Overloads are still the tool when the return type depends on the arguments in a way one signature cannot express.

  - title: "TypeScript: Exhaustive switch with never"
    body: |-
      You compute a delivery fee for each delivery kind.

      **Amateur**

      ```ts
      type Delivery =
        | { kind: 'standard' }
        | { kind: 'express'; fee: number }
        | { kind: 'collect'; storeId: string };

      function deliveryFee(delivery: Delivery): number {
        switch (delivery.kind) {
          case 'standard': return 3;
          case 'express': return delivery.fee;
          default: return 0; // a new kind added later lands here silently
        }
      }
      console.log(deliveryFee({ kind: 'collect', storeId: 's1' })); // 0
      ```

      **Pro**

      ```ts
      type Delivery =
        | { kind: 'standard' }
        | { kind: 'express'; fee: number }
        | { kind: 'collect'; storeId: string };

      function assertNever(value: never): never {
        throw new Error(`Unhandled case: ${JSON.stringify(value)}`);
      }
      function deliveryFee(delivery: Delivery): number {
        switch (delivery.kind) {
          case 'standard': return 3;
          case 'express': return delivery.fee;
          case 'collect': return 0;
          default: return assertNever(delivery);
        }
      }
      console.log(deliveryFee({ kind: 'collect', storeId: 's1' })); // 0
      ```

      **Why it matters**

      When every case is handled, the value in `default` has type `never`. Add a fourth kind and `assertNever(delivery)` stops compiling until you handle it, so the compiler finds every switch you forgot. The catch-all `default` hides the new case and quietly returns the wrong fee. A real default is fine when there is a sensible answer for any future case.

  - title: "TypeScript: Record and utility types instead of retyping shapes"
    body: |-
      You need an update type, a preview type and a count per status.

      **Amateur**

      ```ts
      type Booking = { id: string; guest: string; nights: number };
      type BookingUpdate = { guest?: string; nights?: number };
      type BookingPreview = { id: string; guest: string };
      const countsByStatus: { [key: string]: number } = { pending: 1, confirmd: 2 };
      console.log(countsByStatus['confirmed']); // undefined, the typo compiled
      ```

      **Pro**

      ```ts
      type Booking = { id: string; guest: string; nights: number };
      type BookingUpdate = Partial<Omit<Booking, 'id'>>;
      type BookingPreview = Pick<Booking, 'id' | 'guest'>;
      type Status = 'pending' | 'confirmed' | 'cancelled';
      const countsByStatus: Record<Status, number> = { pending: 1, confirmed: 2, cancelled: 0 };

      const update: BookingUpdate = { nights: 3 };
      const preview: BookingPreview = { id: 'b1', guest: 'Ada' };
      console.log(countsByStatus.confirmed, update, preview); // 2 { nights: 3 } { id: 'b1', guest: 'Ada' }
      ```

      **Why it matters**

      Hand-copied types drift: add a field to `Booking` and the update type misses it. `Partial`, `Pick` and `Omit` derive from one source, so a change flows through. `Record<Status, number>` demands every status and rejects unknown keys, where an index signature accepts any typo. Write a new type by hand when the shapes are related by coincidence, not by meaning.

  - title: "TypeScript: A real check instead of a non-null assertion"
    body: |-
      You add an item to a cart kept in a `Map`.

      **Amateur**

      ```ts
      const carts = new Map<string, { items: string[] }>();
      function addToCart(userId: string, item: string): void {
        carts.get(userId)!.items.push(item);
      }
      addToCart('u1', 'tea'); // TypeError: Cannot read properties of undefined
      ```

      **Pro**

      ```ts
      const carts = new Map<string, { items: string[] }>();
      function addToCart(userId: string, item: string): void {
        let cart = carts.get(userId);
        if (!cart) {
          cart = { items: [] };
          carts.set(userId, cart);
        }
        cart.items.push(item);
      }
      addToCart('u1', 'tea');
      console.log(carts.get('u1')); // { items: [ 'tea' ] }
      ```

      **Why it matters**

      `!` tells the compiler "this is never undefined" and removes the check that would have caught the first-time user. A real `if` handles the case, and TypeScript narrows the type after it. When a missing value is truly a bug, throw an error with a clear message instead of `!`, so the failure says what went wrong. `!` is tolerable in a test, or right after a check the compiler cannot follow.

  - title: "Python: No mutable default arguments"
    body: |-
      A function has an optional list parameter.

      **Amateur**

      ```python
      def add_item(item, cart=[]):
          cart.append(item)
          return cart

      print(add_item("tea"))   # ['tea']
      print(add_item("milk"))  # ['tea', 'milk'], the same list again
      ```

      **Pro**

      ```python
      def add_item(item: str, cart: list[str] | None = None) -> list[str]:
          if cart is None:
              cart = []
          cart.append(item)
          return cart

      print(add_item("tea"))   # ['tea']
      print(add_item("milk"))  # ['milk']
      ```

      **Why it matters**

      Python evaluates a default once, when it defines the function, so every call without `cart` shares one list. State leaks between calls, and in a web server between users. Use `None` as the default and create the list inside. The same trap applies to `{}` and `set()`. Interviewers ask about this one by name.

  - title: "Python: enumerate and zip instead of index loops"
    body: |-
      You print a numbered list from two parallel lists.

      **Amateur**

      ```python
      items = ["tea", "milk", "bread"]
      prices = [2.5, 1.2, 3.0]
      for i in range(len(items)):
          print(str(i + 1) + ". " + items[i] + ": " + str(prices[i]))
      ```

      **Pro**

      ```python
      items = ["tea", "milk", "bread"]
      prices = [2.5, 1.2, 3.0]
      for position, (item, price) in enumerate(zip(items, prices, strict=True), start=1):
          print(f"{position}. {item}: {price:.2f}")
      ```

      **Why it matters**

      `enumerate` gives you the index and the item, and `zip` walks lists side by side, so there is no `[i]` to get wrong. `strict=True` raises an error when the lists differ in length, where plain `zip` drops the extras without a word. An f-string formats numbers and saves the `str()` calls. `range(len(...))` is still right when you change the list by position.

  - title: "Python: Comprehensions and generators instead of append loops"
    body: |-
      You collect the totals of paid orders and add them up.

      **Amateur**

      ```python
      orders = [{"total": 40, "paid": True}, {"total": 15, "paid": False}, {"total": 25, "paid": True}]
      paid_totals = []
      for order in orders:
          if order["paid"]:
              paid_totals.append(order["total"])
      revenue = 0
      for total in paid_totals:
          revenue = revenue + total
      print(paid_totals, revenue)  # [40, 25] 65
      ```

      **Pro**

      ```python
      orders = [{"total": 40, "paid": True}, {"total": 15, "paid": False}, {"total": 25, "paid": True}]
      paid_totals = [order["total"] for order in orders if order["paid"]]
      revenue = sum(order["total"] for order in orders if order["paid"])
      print(paid_totals, revenue)  # [40, 25] 65
      ```

      **Why it matters**

      A comprehension says "the totals of paid orders" in one line. Without the square brackets it becomes a generator, which yields one value at a time and never builds the list, so `sum` over a million rows uses almost no memory. Keep the loop when the body has side effects, several steps or error handling. A comprehension nested more than two levels deep is harder to read than the loop it replaced.

  - title: "Python: dict.get, defaultdict and Counter"
    body: |-
      You count items and group them by their first letter.

      **Amateur**

      ```python
      words = ["tea", "milk", "tea", "bread", "tea"]
      counts = {}
      for word in words:
          if word in counts:
              counts[word] = counts[word] + 1
          else:
              counts[word] = 1
      by_letter = {}
      for word in words:
          if word[0] not in by_letter:
              by_letter[word[0]] = []
          by_letter[word[0]].append(word)
      print(counts, by_letter)
      ```

      **Pro**

      ```python
      from collections import Counter, defaultdict

      words = ["tea", "milk", "tea", "bread", "tea"]
      counts = Counter(words)
      print(counts.most_common(1))  # [('tea', 3)]
      by_letter = defaultdict(list)
      for word in words:
          by_letter[word[0]].append(word)
      discounts = {"tea": 0.1}
      print(by_letter["t"], discounts.get("milk", 0))  # ['tea', 'tea', 'tea'] 0
      ```

      **Why it matters**

      `Counter` counts and ranks in one call, `defaultdict` creates the empty list on first use, and `dict.get` returns a default instead of raising `KeyError`. The intent is visible and the key-exists checks disappear. Counting and grouping come up in most timed challenges, so these save real minutes. Use a plain `dict` with `[]` when a missing key is a bug you want to hear about.

  - title: "Python: join instead of += in a loop"
    body: |-
      You build a comma-separated line of names.

      **Amateur**

      ```python
      names = ["tea", "milk", "bread"]
      line = ""
      for name in names:
          line += name + ", "
      line = line[:-2]
      print(line)  # tea, milk, bread
      ```

      **Pro**

      ```python
      names = ["tea", "milk", "bread"]
      print(", ".join(names))  # tea, milk, bread
      quantities = [2, 1, 3]
      print(", ".join(str(quantity) for quantity in quantities))  # 2, 1, 3
      ```

      **Why it matters**

      Strings are immutable, so each `+=` can copy everything built so far, which is O(n²) in the worst case. CPython sometimes avoids the copy, but you cannot rely on it. `join` works out the size once and handles the separator, so there is no trailing comma to trim. `join` needs strings, so convert numbers first as shown.

  - title: "Python: Catch specific exceptions, never a bare except"
    body: |-
      You parse a quantity typed by a user.

      **Amateur**

      ```python
      def parse_quantity(text):
          try:
              return int(text)
          except:
              return 0

      print(parse_quantity("3"), parse_quantity("three"), parse_quantity(None))  # 3 0 0
      ```

      **Pro**

      ```python
      def parse_quantity(text: str) -> int | None:
          try:
              return int(text)
          except ValueError:
              return None

      print(parse_quantity("3"), parse_quantity("three"))  # 3 None
      # parse_quantity(None) raises TypeError: a bug you want to see
      ```

      **Why it matters**

      A bare `except` catches everything, including `KeyboardInterrupt`, typos in variable names and bugs in the caller, and turns them all into a plausible 0. Catch only the exception you expect and can handle. Returning `None` instead of 0 also stops a bad input looking like a real quantity. If you must catch broadly at the top of a worker, use `except Exception`, log it with the traceback and re-raise or report it.

  - title: "Python: with for files and other resources"
    body: |-
      You write a file and read it back.

      **Amateur**

      ```python
      file = open("orders.csv", "w")
      file.write("id,total\n1,40\n")
      file.close()  # skipped if write raises
      file = open("orders.csv")
      lines = file.readlines()
      print(lines)  # this file is left open
      ```

      **Pro**

      ```python
      from pathlib import Path

      path = Path("orders.csv")
      with path.open("w", encoding="utf-8") as file:
          file.write("id,total\n1,40\n")
      with path.open(encoding="utf-8") as file:
          for line in file:
              print(line.rstrip())
      ```

      **Why it matters**

      `with` closes the file when the block ends, even when an exception is raised inside it. Leaked handles pile up in long-running services until the process runs out. Always pass `encoding`, because the default depends on the platform. The same pattern applies to locks, database connections and HTTP sessions.

  - title: "Python: dataclass instead of dicts everywhere"
    body: |-
      You pass an order between functions.

      **Amateur**

      ```python
      order = {"id": "a1", "items": ["tea"], "totl": 12.5}

      def describe(order):
          return f"{order['id']}: {order['total']}"

      print(describe(order))  # KeyError: 'total', found only at runtime
      ```

      **Pro**

      ```python
      from dataclasses import dataclass, field

      @dataclass(frozen=True)
      class Order:
          id: str
          total: float
          items: list[str] = field(default_factory=list)

      def describe(order: Order) -> str:
          return f"{order.id}: {order.total:.2f}"

      print(describe(Order(id="a1", total=12.5, items=["tea"])))  # a1: 12.50
      ```

      **Why it matters**

      A dict accepts any key, so a typo becomes a runtime `KeyError` three calls later. A dataclass names its fields, the editor completes them, a type checker catches `order.totl`, and `frozen=True` stops accidental changes. A dataclass does not check types at runtime, so use a Pydantic `BaseModel` for untrusted input such as request bodies or model output. Dicts are fine for data you only pass through, such as a JSON payload you forward unchanged.

  - title: "Python: Type hints on every function"
    body: |-
      You write a discount helper.

      **Amateur**

      ```python
      def apply_discount(price, rate):
          return price - price * rate

      print(apply_discount(10, 0.1))  # 9.0
      print(apply_discount("10", 0.1))  # TypeError: can't multiply sequence by non-int of type 'float'
      ```

      **Pro**

      ```python
      def apply_discount(price: float, rate: float) -> float:
          """Return the price after a discount, where rate 0.1 means 10 percent."""
          if not 0 <= rate <= 1:
              raise ValueError(f"rate must be between 0 and 1, got {rate}")
          return price * (1 - rate)

      print(apply_discount(10.0, 0.1))  # 9.0
      ```

      **Why it matters**

      Hints document what goes in and out, and a checker such as mypy or pyright flags `apply_discount("10", 0.1)` before you run anything. Python ignores hints at runtime, so the range check is still yours to write. Hints also make FastAPI and Pydantic validate for you. In a timed round, hinting the signature first is a quick way to show you have thought about the inputs.

  - title: "Python: is for identity, == for values"
    body: |-
      You compare a status string and check for a missing value.

      **Amateur**

      ```python
      status = "".join(["pa", "id"])
      print(status is "paid")  # False, and Python warns about it
      discount = None
      if discount == None:
          print("no discount")
      ```

      **Pro**

      ```python
      status = "".join(["pa", "id"])
      print(status == "paid")  # True
      discount = None
      if discount is None:
          print("no discount")
      ```

      **Why it matters**

      `is` asks "the same object in memory", `==` asks "equal value". Two equal strings built at different times are often different objects, so `is` gives answers that change with how the value was made. Use `is` only for singletons: `None`, `True` and `False`. `== None` works, but a class can override `==`, and linters flag it.

  - title: "Python: sorted with a key instead of sorting by hand"
    body: |-
      You rank orders by total, highest first, with ties broken by id.

      **Amateur**

      ```python
      orders = [{"id": "b2", "total": 30}, {"id": "a1", "total": 12}, {"id": "c3", "total": 30}]
      for i in range(len(orders)):
          for j in range(len(orders) - 1 - i):
              if orders[j]["total"] < orders[j + 1]["total"]:
                  orders[j], orders[j + 1] = orders[j + 1], orders[j]
      print([order["id"] for order in orders])  # ['b2', 'c3', 'a1'], ties only in input order
      ```

      **Pro**

      ```python
      import heapq
      from operator import itemgetter

      orders = [{"id": "b2", "total": 30}, {"id": "a1", "total": 12}, {"id": "c3", "total": 30}]
      ranked = sorted(orders, key=lambda order: (-order["total"], order["id"]))
      print([order["id"] for order in ranked])  # ['b2', 'c3', 'a1']
      top_one = heapq.nlargest(1, orders, key=itemgetter("total"))
      print(top_one)  # [{'id': 'b2', 'total': 30}]
      ```

      **Why it matters**

      The hand-written bubble sort is O(n²), changes the input and leaves ties in whatever order they arrived. `sorted` is O(n log n), stable and returns a new list, and a tuple key sorts by several fields at once. `list.sort()` sorts in place and returns `None`, so `orders = orders.sort()` loses your data. Use `heapq.nlargest` when you need the top k of a large list.

  - title: "Python: No blocking calls inside async def"
    body: |-
      You fetch three prices concurrently.

      **Amateur**

      ```python
      import asyncio
      import time

      async def fetch_price(sku):
          time.sleep(1)  # blocks the whole event loop
          return 10

      async def main():
          start = time.perf_counter()
          await asyncio.gather(*(fetch_price(sku) for sku in ["tea", "milk", "bread"]))
          print(f"{time.perf_counter() - start:.1f}s")  # 3.0s

      asyncio.run(main())
      ```

      **Pro**

      ```python
      import asyncio
      import time

      def read_price_from_disk(sku: str) -> int:  # a blocking call you cannot change
          time.sleep(1)
          return 10

      async def fetch_price(sku: str) -> int:
          return await asyncio.to_thread(read_price_from_disk, sku)

      async def main() -> None:
          start = time.perf_counter()
          await asyncio.gather(*(fetch_price(sku) for sku in ["tea", "milk", "bread"]))
          print(f"{time.perf_counter() - start:.1f}s")  # 1.0s

      asyncio.run(main())
      ```

      **Why it matters**

      The event loop runs one thing at a time, so a blocking call such as `time.sleep`, `requests.get` or a heavy computation freezes every other task. Use an async library (`asyncio.sleep`, `httpx.AsyncClient`) or move the blocking work to a thread with `asyncio.to_thread`. In a FastAPI service one blocking call in an `async` route stalls all requests at once. Interviewers for AI roles probe this, because model calls are slow I/O.

  - title: "HTML: Semantic elements instead of div soup"
    body: |-
      You lay out a page with a header, navigation and a list of orders.

      **Amateur**

      ```html
      <div class="header">
        <div class="logo">Shop</div>
        <div class="nav"><div class="link" onclick="location.href='/cart'">Cart</div></div>
      </div>
      <div class="main">
        <div class="title">Your orders</div>
        <div class="order">Order 1042</div>
      </div>
      ```

      **Pro**

      ```html
      <header>
        <a href="/">Shop</a>
        <nav aria-label="Main">
          <a href="/cart">Cart</a>
        </nav>
      </header>
      <main>
        <h1>Your orders</h1>
        <ul>
          <li>Order 1042</li>
        </ul>
      </main>
      ```

      **Why it matters**

      Screen reader users jump between landmarks (`header`, `nav`, `main`) and headings, so a page of `div`s gives them nothing to navigate by. Real links can be opened in a new tab, bookmarked and followed by search engines. You get all of it without writing a line of ARIA. `div` is still the right element for a box that exists only for layout.

  - title: "HTML: button, not a clickable div"
    body: |-
      You add an "Add to cart" control.

      **Amateur**

      ```html
      <div class="button" onclick="addToCart()">Add to cart</div>
      <script>
        function addToCart() { console.log('added'); }
      </script>
      ```

      **Pro**

      ```html
      <button type="button" id="add-to-cart">Add to cart</button>
      <script>
        document.querySelector('#add-to-cart').addEventListener('click', () => {
          console.log('added');
        });
      </script>
      ```

      **Why it matters**

      A `div` cannot be reached with Tab, does not respond to Enter or Space, and is not announced as a button, so keyboard and screen reader users cannot use it. A `button` does all of that for free, which is WCAG 2.1.1 (Keyboard) and 4.1.2 (Name, Role, Value). Set `type="button"` because inside a form the default type is `submit`. Use `<a href>` when the control navigates, and `button` when it acts.

  - title: "HTML: Every input has a label"
    body: |-
      You add an email field to a checkout form.

      **Amateur**

      ```html
      <form>
        <input type="text" placeholder="Email">
        <button>Continue</button>
      </form>
      ```

      **Pro**

      ```html
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Continue</button>
      </form>
      ```

      **Why it matters**

      A placeholder vanishes as soon as you type, often fails contrast, and is not a dependable accessible name. A `label` tied by `for` and `id` is announced by screen readers and makes the text a click target for the field (WCAG 1.3.1 and 3.3.2). `type="email"` brings the right phone keyboard, and `autocomplete` lets browsers fill it in. A visually hidden label is acceptable when the design has no room, but it must still exist.

  - title: "HTML: Every image has the right alt"
    body: |-
      You show a product photo and a decorative divider.

      **Amateur**

      ```html
      <img src="tea.jpg">
      <img src="divider.png" alt="image">
      ```

      **Pro**

      ```html
      <img src="tea.jpg" alt="Loose leaf green tea in a glass jar" width="640" height="480">
      <img src="divider.png" alt="" width="640" height="16">
      ```

      **Why it matters**

      Without `alt`, many screen readers read out the file name, and "image" tells nobody anything. Describe what the image shows in context (WCAG 1.1.1), and give purely decorative images an empty `alt=""` so they are skipped. `width` and `height` let the browser reserve the space before the image loads, which stops the layout jumping. An image inside a link needs alt text that describes where the link goes.

  - title: "CSS: Flexible layouts instead of fixed pixels"
    body: |-
      You lay out a sidebar and main content.

      **Amateur**

      ```css
      .page { width: 1200px; }
      .sidebar { float: left; width: 300px; height: 800px; }
      .content { float: left; width: 900px; font-size: 14px; }
      ```

      **Pro**

      ```css
      .page {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) 3fr;
        gap: 1.5rem;
        max-width: 75rem;
        margin-inline: auto;
        padding-inline: 1rem;
      }
      @media (max-width: 40rem) {
        .page { grid-template-columns: 1fr; }
      }
      .content { font-size: 1rem; }
      ```

      **Why it matters**

      A 1200 px page scrolls sideways on a 390 px phone, and a fixed height cuts off content when the text grows. Grid with `fr` and `max-width` fits any width and stacks on small screens, which WCAG 1.4.10 (Reflow) asks for down to 320 CSS pixels. `rem` follows the reader's browser font size, where `px` for text ignores it. Pixels are fine for borders and small fixed details.

  - title: "CSS: Low specificity instead of escalating overrides"
    body: |-
      You highlight the current link in a navigation menu.

      **Amateur**

      ```css
      #sidebar .menu li a { color: navy; }
      #sidebar .menu li a.active { color: teal; }
      .link-current { color: purple !important; }
      ```

      **Pro**

      ```css
      @layer base, components;

      @layer components {
        .nav-link { color: navy; }
        .nav-link[aria-current="page"] { color: teal; }
      }
      ```

      **Why it matters**

      An ID selector outweighs any number of classes, so the next change needs a longer selector, and then `!important`, and then another `!important` to beat that one. Single classes keep every rule equal and cheap to override, and `@layer` decides order by layer, not by selector weight. Styling `aria-current` ties the look to the markup that screen readers already use. `!important` is acceptable in a utility class that must always win, or to beat inline styles from code you do not control.

  - title: "CSS: gap instead of margins on children"
    body: |-
      You space out a wrapping row of product cards.

      **Amateur**

      ```css
      .cards { display: flex; flex-wrap: wrap; }
      .cards > * { margin-right: 16px; margin-bottom: 16px; }
      .cards > *:last-child { margin-right: 0; }
      ```

      **Pro**

      ```css
      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }
      ```

      **Why it matters**

      Margins on children add space after the last item in every wrapped row and below the last row, so the group never lines up with its neighbours, and the `:last-child` patch fixes only one of those. `gap` puts space only between items, in both directions, and works in flex and grid in every current browser. Margins still have a job: spacing between unrelated blocks that are not in one container.

  - title: "CSS: Visible focus styles"
    body: |-
      You remove the default focus ring because it looks untidy on click.

      **Amateur**

      ```css
      button:focus,
      a:focus {
        outline: none;
      }
      ```

      **Pro**

      ```css
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      ```

      **Why it matters**

      Without an outline, a keyboard user cannot tell where they are on the page, which fails WCAG 2.4.7 (Focus Visible). `:focus-visible` shows the ring when the browser decides it helps, such as for keyboard use, and hides it after a mouse click, so you keep the tidy look without locking anyone out. Keep the ring at 3:1 contrast against its background (WCAG 1.4.11), and make sure sticky headers do not cover the focused element (WCAG 2.4.11, new in 2.2). Replacing the outline with another clear style is fine; removing it is not.

  - title: "CSS: Respect reduced motion"
    body: |-
      You slide in a notification.

      **Amateur**

      ```css
      .toast {
        animation: slide-in 600ms ease-out;
      }
      @keyframes slide-in {
        from { transform: translateY(100vh); }
      }
      ```

      **Pro**

      ```css
      .toast {
        animation: slide-in 200ms ease-out;
      }
      @keyframes slide-in {
        from { transform: translateY(1rem); opacity: 0; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .toast { animation: fade-in 150ms ease-out; }
      }
      ```

      **Why it matters**

      Large movement can cause nausea and dizziness for people with vestibular disorders, and they set "reduce motion" in their system settings for that reason. `prefers-reduced-motion` lets you swap movement for a fade that still shows the change. Animate `transform` and `opacity`, which the browser can run without redoing layout. Anything that moves on its own for more than five seconds also needs a way to pause it (WCAG 2.2.2).

  - title: "Any language: Validate input and name the edge cases"
    body: |-
      You write an average for a list of ratings in a coding round.

      **Amateur**

      ```js
      function average(ratings) {
        return ratings.reduce((sum, rating) => sum + rating) / ratings.length;
      }
      console.log(average([4, 5])); // 4.5
      console.log(average([])); // TypeError: Reduce of empty array with no initial value
      ```

      **Pro**

      ```js
      function average(ratings) {
        if (!Array.isArray(ratings)) throw new TypeError('ratings must be an array');
        if (ratings.length === 0) return null;
        return ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length;
      }
      console.log(average([4, 5])); // 4.5
      console.log(average([])); // null
      ```

      **Why it matters**

      The happy path is the part everyone gets right. Before you code, say the edge cases out loud: empty input, one item, duplicates, negatives, very large values, missing fields. Then decide what each returns and write the check. Interviewers score this explicitly, and it takes thirty seconds.

  - title: "Any language: Small named functions instead of one giant one"
    body: |-
      You price a checkout with a discount and shipping.

      **Amateur**

      ```python
      def checkout(cart):
          total = 0
          for item in cart:
              total += item["price"] * item["qty"]
          if total > 50:
              total = total * 0.9
          if total < 20:
              total += 4.99
          return round(total, 2)

      print(checkout([{"price": 30, "qty": 2}]), checkout([{"price": 5, "qty": 2}]))  # 54.0 14.99
      ```

      **Pro**

      ```python
      def subtotal(cart: list[dict]) -> float:
          return sum(item["price"] * item["qty"] for item in cart)

      def apply_bulk_discount(amount: float) -> float:
          return amount * 0.9 if amount > 50 else amount

      def add_shipping(amount: float) -> float:
          return amount + 4.99 if amount < 20 else amount

      def checkout(cart: list[dict]) -> float:
          return round(add_shipping(apply_bulk_discount(subtotal(cart))), 2)

      print(checkout([{"price": 30, "qty": 2}]), checkout([{"price": 5, "qty": 2}]))  # 54.0 14.99
      ```

      **Why it matters**

      Each small function has a name that states one rule, and you can test it on its own. When the interviewer adds "free shipping for members", you change one function and the rest stays put. The giant version grows a new `if` per requirement until nobody can follow it. In a timed round, write the top-level function first with calls to helpers, then fill them in.

  - title: "Any language: Readable code over clever one-liners"
    body: |-
      You count how often each letter appears.

      **Amateur**

      ```js
      const r = (s) => [...s].reduce((a, c) => ((a[c] = -~a[c]), a), {});
      console.log(r('banana')); // { b: 1, a: 3, n: 2 }
      ```

      **Pro**

      ```js
      function countLetters(text) {
        const counts = new Map();
        for (const letter of text) {
          counts.set(letter, (counts.get(letter) ?? 0) + 1);
        }
        return counts;
      }
      console.log(countLetters('banana')); // Map(3) { 'b' => 1, 'a' => 3, 'n' => 2 }
      ```

      **Why it matters**

      `-~a[c]` works because of how bitwise NOT treats `undefined`, and nobody reading it knows that at a glance. The loop says what it does and is as fast. Code is read far more often than it is written, and an interviewer has to follow yours in real time. Short is good when it is also clear, such as a one-line `filter`.

  - title: "Any language: Check your examples with asserts"
    body: |-
      You finish a function that checks whether a booking fits.

      **Amateur**

      ```python
      def is_valid_booking(start, end, booked):
          for s, e in booked:
              if start > s and start < e:
                  return False
          return True

      print(is_valid_booking(9, 10, [(10, 11)]))  # True, looks done
      print(is_valid_booking(9, 11, [(10, 12)]))  # True, but it overlaps
      ```

      **Pro**

      ```python
      def is_valid_booking(start: int, end: int, booked: list[tuple[int, int]]) -> bool:
          return start < end and all(end <= s or start >= e for s, e in booked)

      assert is_valid_booking(9, 10, [(10, 11)])      # touching ends is fine
      assert not is_valid_booking(9, 11, [(10, 12)])  # overlaps the start
      assert not is_valid_booking(10, 10, [])         # empty slot
      assert is_valid_booking(9, 10, [])              # nothing booked yet
      print("all checks pass")
      ```

      **Why it matters**

      One printed example that looks right proves little. Turning the given examples and your edge cases into `assert`s takes a minute, and the amateur's overlap bug fails on the second one. Run them after every change so you know you did not break an earlier case. Interviewers notice candidates who test without being asked.

  - title: "Any language: Measure before you optimise"
    body: |-
      You sum order totals and want it to be fast.

      **Amateur**

      ```js
      // "Faster": cached length and a bitwise trick to keep integers
      function sumTotals(orders) {
        let s = 0;
        for (let i = 0, n = orders.length; i < n; i++) s = (s + orders[i].total) | 0;
        return s;
      }
      console.log(sumTotals([{ total: 12.5 }, { total: 7.5 }])); // 19, not 20
      ```

      **Pro**

      ```js
      function sumTotals(orders) {
        return orders.reduce((sum, order) => sum + order.total, 0);
      }
      const orders = Array.from({ length: 1_000_000 }, (_, i) => ({ total: i % 100 }));
      console.time('sumTotals');
      console.log(sumTotals(orders)); // 49500000
      console.timeEnd('sumTotals'); // the real number, on your machine
      ```

      **Why it matters**

      Micro-tricks save nanoseconds and add bugs: `| 0` truncates to a 32-bit integer and drops the decimals. The wins that matter are in complexity, such as replacing a nested search with a `Map`, and you find them by measuring with a profiler or a timer. In an interview, write the clear version, state its Big O, then say what you would change if the input grew.

  - title: "Any language: Commits and names that explain themselves"
    body: |-
      You save your work and name the things in it.

      **Amateur**

      ```bash
      git add .
      git commit -m "fix"
      git commit -m "stuff"
      git commit -m "final final"
      ```

      **Pro**

      ```bash
      git add src/cart.ts tests/cart.test.ts
      git commit -m "Reject negative quantities in addItem"
      git commit -m "Add test for empty cart total"
      ```

      **Why it matters**

      A commit message is the only note a future reader gets about why a change happened, and `git add .` sweeps in debug files and secrets. Write one line in the imperative that says what changed and where, and stage the files you mean. The same goes for names in code: `unpaidOrders` beats `data2`, and `isExpired` beats `flag`. In a take-home, the history is part of what gets graded.
