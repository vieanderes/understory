summary: >-
  Events and state are what turn a React page from a picture into an app. An event handler is
  a function you pass to a prop such as `onClick`; React calls it when the event happens. State
  is a value React keeps for a component between renders. Calling its setter stores the new
  value and asks React to render the component again, which is how the page changes.


  A plain variable can't do either job. The component function runs from the top on every
  render, so a `let` starts over each time, and assigning to it doesn't tell React anything
  happened. `useState` solves both: React holds the value outside your function, and the
  setter is the signal to re-render.


  `useState` is a hook, and hooks come with rules because of how React stores them. React
  keeps a component's hooks in a list and matches each call to its slot by position. So hooks
  must run in the same order on every render: at the top level, never behind an `if`, a loop
  or an early `return`. Break the order and React throws, or worse, hands one piece of state
  to another.
remember:
  - Pass the handler itself, `onClick={save}`, or an arrow for arguments, `onClick={() => remove(id)}`; `onClick={save()}` runs it during render.
  - State is a value React keeps for one component instance between renders, and calling its setter schedules a re-render with the new value.
  - React matches hooks to their stored values by call order, so every hook runs at the top level in the same order on every render.
  - The initial value passed to `useState` is used on the first render only; pass a function, `useState(() => load())`, when computing it is expensive.
  - Setting state to a value that is `Object.is` equal to the current one lets React skip the re-render.
  - A state setter replaces the value; it never merges objects, so spread the old fields in yourself.
  - React calls `preventDefault()` only when you do; returning `false` from a handler does nothing.
  - Each component instance has its own state, tied to its position in the tree, so two counters never share a count.
sections:
  - title: How React delivers events
    body: |-
      React doesn't put a listener on every button. It adds one listener per event type at
      the root container and works out which component handlers to call as the event bubbles.
      Your handler receives a **synthetic event**: a wrapper with the same methods as the
      browser event, `preventDefault()`, `stopPropagation()`, `target` and `currentTarget`,
      that behaves the same way in every browser. The original is on `event.nativeEvent`.

      Propagation follows the DOM. A click on a button inside a clickable card runs the
      button's handler, then the card's. Stop that with `e.stopPropagation()`. Each event
      also has a capture version, `onClickCapture`, which runs on the way down, before the
      target's handler.

      ```tsx
      function Card({ onOpen, onDelete }: { onOpen: () => void; onDelete: () => void }) {
        return (
          <article onClick={onOpen}>
            <h3>Blue mug</h3>
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation(); // don't also open the card
                onDelete();
              }}
            >
              Delete
            </button>
          </article>
        );
      }
      ```

      Two differences from plain HTML trip people up. Returning `false` from a handler doesn't
      prevent the default action; you must call `e.preventDefault()`. We checked: a link whose
      handler returns `false` still navigates. And `onChange` on a text input fires on every
      keystroke, like the DOM's `input` event, not when the field loses focus.

      By convention, a component's event props start with `on`, such as `onDelete`, and the
      functions that handle them start with `handle`, such as `handleDelete`. It makes the
      direction of each function clear when you read a component.
  - title: Where React keeps your state
    body: |-
      Your component is a function, and functions forget everything when they return. So the
      state lives with React, attached to this instance of the component in the tree. For each
      instance, React keeps a list of hook slots in the order the hooks were called.

      On the first render, each `useState` call creates the next slot and stores the initial
      value. On later renders, the first call reads slot one, the second reads slot two, and so
      on. React never sees your variable names; it only counts.

      ```tsx
      import { useState } from 'react';

      function Profile({ ready }: { ready: boolean }) {
        const [name, setName] = useState('');   // slot 1
        if (!ready) return <p>Loading</p>;
        const [bio, setBio] = useState('');     // slot 2, but only sometimes
        return <p>{name} {bio}</p>;
      }
      ```

      When `ready` flips from false to true, the second render calls one more hook than the
      first. We ran it: React logs that it "detected a change in the order of Hooks" and throws
      "Rendered more hooks than during the previous render." Now picture a render that skips one
      `useState` call and makes a different one in its place. The count matches, so nothing
      throws, and a component reads another hook's value without any error. That's why the
      rules are strict.

      Custom hooks follow the same rules, because their inner hook calls are part of the
      caller's list. React 19 adds one exception, the `use` API for reading a promise or
      context, which may be called inside a condition. `useState` and the other `use...` hooks
      may not.
  - title: Initial state, lazy initialisers and replacing objects
    body: |-
      The argument to `useState` matters on the first render only. After that, React ignores it
      and returns the stored value. That has two consequences.

      First, an expensive initial value is computed on every render and then thrown away.
      Pass a function instead, and React calls it once:

      ```tsx
      import { useState } from 'react';

      function readDraft(): string {
        return localStorage.getItem('draft') ?? '';
      }

      export function Editor() {
        const [draft, setDraft] = useState(readDraft); // not readDraft()
        return <textarea aria-label="Draft" value={draft} onChange={(e) => setDraft(e.target.value)} />;
      }
      ```

      Second, a prop passed as the initial value is read once. If the prop changes later, the
      state doesn't follow. Name such props `initialValue` so nobody expects otherwise.

      The setter replaces the whole value. Unlike the older class components, it never merges
      an object:

      ```tsx
      import { useState } from 'react';

      export function Signup() {
        const [form, setForm] = useState({ name: '', email: '' });
        return (
          <input
            aria-label="Name"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })} // keep email
          />
        );
      }
      ```

      Writing `setForm({ name: e.target.value })` would drop `email`. The setter function itself
      keeps the same identity across renders, so it's safe to pass down or leave out of
      dependency lists. And if you set a value that `Object.is` says is equal to the current
      one, React skips re-rendering the component's children and commits nothing.
pitfalls:
  - >-
    **Calling the handler in JSX.** `onClick={save()}` runs `save` on every render and passes
    its result. If `save` sets state, you get "Too many re-renders". Pass `save`, or wrap it
    in an arrow.
  - >-
    **A hook after an early return.** The render that passes the `return` calls more hooks
    than the one before, and React throws. Put every hook call above the first `return`.
  - >-
    **Returning `false` to cancel a submit.** The form still submits and the page reloads.
    Call `e.preventDefault()` in the `onSubmit` handler.
  - >-
    **Merging objects by habit.** `setForm({ name })` throws away every other field. Spread
    the old object first: `setForm({ ...form, name })`.
  - >-
    **Calling the initialiser.** `useState(readDraft())` reads storage on every render.
    Pass the function, `useState(readDraft)`, so React calls it once.
  - >-
    **Mutating state and setting the same object.** `form.name = 'x'; setForm(form)` passes
    the same object, `Object.is` sees no change, and nothing re-renders. Create a new object.
verify:
  - lens: breaks
    check: 'Every hook call sits above the first early `return`, so a component that renders "Loading" first keeps the same hook order.'
  - lens: breaks
    check: 'Event props receive a function, like `onClick={save}`, never a call like `save()` that runs during rendering.'
  - lens: confuses
    check: 'Values the page shows and changes live in `useState`, not in plain variables that reset on every render.'
  - lens: tests
    check: 'Components that wait for data are tested first with nothing and then with the data, the order the app uses.'
interview:
  - question: Why can't you call hooks inside conditions or loops?
    answer: >-
      Because React identifies each hook by the order it's called, not by name. For every
      component instance React keeps a list of hook slots; the first `useState` call on each
      render reads slot one, the second reads slot two. If a condition skips a call, every
      later call reads the wrong slot, and state, effects and memos get crossed. React detects
      a changed count and throws "Rendered more hooks than during the previous render", but
      a swap between two hooks of the same kind can fail silently. The fix is to call hooks unconditionally at
      the top and put the condition inside, for example inside the effect or in the JSX. The
      ESLint hooks plugin catches it at edit time. React 19's `use` is the one API that may sit
      in a condition.
  - question: Why doesn't a plain variable work as component state?
    answer: >-
      Because rendering calls the component function again, and a local variable is created
      fresh on every call. Assigning to it also doesn't tell React anything, so no re-render
      is scheduled and the screen keeps showing the old value. State fixes both halves: React
      stores the value outside the function, tied to that instance's position in the tree, and
      the setter is the signal that triggers a new render. A module-level variable would
      survive renders, but it's shared by every instance and still doesn't trigger a render.
      For a value that must survive renders without causing one, such as a timer id, the right
      tool is a ref.
  - question: How does React handle events differently from `addEventListener` on each element?
    answer: >-
      It delegates. React attaches one listener per event type to the root container and
      dispatches to your handlers as the event bubbles through the component tree. Handlers
      get a synthetic event with the standard interface, so `preventDefault`, `stopPropagation`
      and capture handlers such as `onClickCapture` work as you'd expect. The practical
      differences: you must call `preventDefault()` explicitly, because returning `false` does
      nothing; `onChange` on inputs fires per keystroke; and handlers are ordinary props, so they
      can close over the current props and state. Delegation keeps memory flat for big lists,
      and React removes handlers automatically on unmount, so there's nothing to clean up.
  - question: What happens when you call a state setter with the same value?
    answer: >-
      React compares the new value with the current one using `Object.is`, and if they're
      equal it bails out: no children render and nothing is committed. It may still call the
      component itself once before deciding, so don't rely on the body not running. This is
      why mutating an object and passing it back does nothing: it's the same reference, so
      React sees no change. Always create a new object or array when state changes. The
      comparison is shallow on purpose, because it's cheap; a deep compare on every update
      would cost more than most renders.
