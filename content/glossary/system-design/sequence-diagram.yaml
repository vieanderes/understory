term: sequence diagram
aka:
  - sequence chart
short: A drawing of who sends which message to whom, in time order, top to bottom.
explain: |
  Each participant gets a vertical line: the browser, the API, the database, the model.
  Arrows between the lines are messages, and time runs down the page.

  It answers "what talks to what, in which order?" That's where timeouts, retries and
  race conditions hide. Draw the failure paths too, not only the happy one.

  Tools such as Mermaid turn a few lines of text into the drawing, so it lives in the repo
  next to the code.
analogy: A comic strip of a phone call, with each speaker in their own column.
example:
  language: text
  code: |
    sequenceDiagram
      Browser->>API: POST /orders
      API->>Payments: charge
      Payments-->>API: ok
      API-->>Browser: 201 Created
usage: Add a sequence diagram for the refund flow; I can't tell who calls the bank first.
twin:
  term: state-diagram
  difference: A sequence diagram follows messages between many parts over time. A state diagram follows one thing through the states it can be in.
related:
  - state-diagram
  - swimlane-diagram
  - design-doc
level: 2
lessons:
  - judgment.workflows-on-paper
  - explain.talking-through-a-diagram
