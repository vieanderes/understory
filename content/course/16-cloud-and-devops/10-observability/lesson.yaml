deepDive: >-
  The trace and metric output ran on Node 24.21 with `@opentelemetry/api` 1.9.1 and the
  2.11.0 SDK packages (`sdk-trace-base`, `sdk-metrics`, `context-async-hooks`), printing to
  `ConsoleSpanExporter` and `ConsoleMetricExporter`. Nested spans came out as reserve stock,
  charge card, then POST /checkout, all under one trace id, because a span is exported when
  it ends.


  The unended span was real too. With a declined card, the flawed `checkout` exported
  nothing at all. The fixed one exported the span with `status: { code: 2 }`, which is
  `ERROR`, and an `exception` event holding the message and stack. The `with` block in
  Python and `startActiveSpan` with a callback in JavaScript are other ways to make sure a
  span ends.


  Three model calls recorded 5,200 input and 480 output tokens on the counter, and the
  histogram placed the durations in its default buckets. Their edges run 0, 5, 10, 25, 50,
  75, 100, 250, 500, 750, 1000, 2500 and on up to 10000. Bucket edges are fixed up front, so
  a percentile read from a histogram is an estimate. Choose edges that bracket the times you
  care about.


  Services pass trace context to each other in the W3C `traceparent` header, which holds a
  version, the trace id, the caller's span id and flags. OpenTelemetry's HTTP instrumentation
  adds and reads it for you. You rarely touch it by hand.


  Logging personal data is covered in depth in the security chapter's detection and logging
  lesson. The short rule here: log what describes the request, never what describes the
  person.


  "Watching agents in production", in the agent engineering chapter, applies the same three
  signals to an agent: a span per step and tool, and cost per run.
