term: file signature
aka: [magic bytes, magic number of a file, content sniffing]
short: The first few bytes of a file, which reveal its real type whatever its name claims.
explain: |
  An upload's name and declared type are chosen by the person sending it. Calling a script
  `cat.png` costs nothing. So look at the bytes instead.

  Most formats start with a fixed pattern: a PNG with `89 50 4E 47`, a PDF with `%PDF`.
  Decide the type from those bytes, not the extension. A signature proves only the start,
  though. A file can be valid as two formats at once, so re-encode images to strip anything
  else hiding inside.
analogy: Checking the postmark and seal on a letter, not trusting the sender's handwriting on the envelope.
example:
  language: ts
  code: |
    const PNG = [0x89, 0x50, 0x4e, 0x47];
    const isPng = PNG.every((byte, i) => bytes[i] === byte);
    if (!isPng) throw new Error('not a PNG');
usage: Don't trust the extension; check the file signature, then re-encode the avatar before storing it.
related: [path-traversal, allowlist, xss]
level: 2
lessons: [security.uploads-and-paths]
