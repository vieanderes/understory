id: python.lists-and-tuples
title: Lists, tuples and slicing
objective: Change lists in place, slice any sequence, unpack tuples, and tell is from ==.
level: essential
minutes: 10
concepts: [python.lists, python.slicing, python.tuples-and-unpacking, python.identity]
prerequisites: [python.strings]
opening:
  text: >-
    You'll store items in order, slice out any part, and trim a chat history the way model
    apps do. You'll also see why a second name for a list is not a copy.

steps:
  - type: prose
    id: list-basics
    body: |-
      A **list** is Python's array: ordered, and changeable in place.

      ```python
      queue = ["Ana", "Ben"]
      queue.append("Cy")            # like push
      first = queue.pop(0)          # takes out "Ana"
      print(queue[-1], len(queue))  # Cy 2
      sorted([3, 1, 2])                # [1, 2, 3]
      sorted([3, 1, 2], reverse=True)  # [3, 2, 1]
      ```

      `sorted` returns a new list and leaves the old one alone. `items.sort()` sorts in
      place instead, and returns `None`. `+` joins two lists into a new one.

  - type: ai-review
    id: review-discarded-sort
    concept: python.lists
    difficulty: 2
    language: python
    request: Write top_scores(scores), returning the three highest scores.
    flawClass: edge-case
    code: |
      def top_scores(scores):
          sorted(scores, reverse=True)
          return scores[:3]
    prompt: >-
      An assistant wrote this. Its test used `[90, 80, 70, 60]` and passed. Given
      `[60, 90, 70, 80]`, it returns `[60, 90, 70]`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The sorted copy is thrown away
        correct: true
        feedback: >-
          Exactly. Nothing keeps the new list. The test passed because its input was already sorted.
      - text: '`reverse=True` sorts smallest first'
        feedback: >-
          It sorts largest first. The trouble is where that sorted result goes.
      - text: '`[:3]` takes the last three'
        feedback: >-
          `[:3]` is the first three. They'd be right if the list were sorted.
    fix: |
      def top_scores(scores):
          return sorted(scores, reverse=True)[:3]

  - type: prose
    id: slicing-rules
    body: |-
      `scores[:3]` is a **slice**: `seq[start:stop:step]`. As with `range`, the stop isn't
      included, and a part you leave out takes its default.

      ```python
      word = "python"
      word[-3:]    # "hon", the last three
      word[::2]    # "pto", every second letter
      word[2:100]  # "thon", no error
      ```

      Slices work on text and lists alike. A bound past the end is clipped, and a slice is
      always a new copy.

  - type: fill-blank
    id: fill-slice
    concept: python.slicing
    difficulty: 2
    prompt: Keep only the last 3 messages of a chat history, a common way to keep a prompt short.
    language: python
    template: |
      history = ["hi", "hello", "help?", "sure", "thanks"]
      recent = history[{{1}}]
    blanks:
      - key: '1'
        answer: '-3:'
    bank: ['-3:', ':3', '-3', '3:']

  - type: prose
    id: tuples-and-unpacking
    body: |-
      A **tuple** is written with round brackets, and it can't change after it's made. It
      suits a fixed group, such as a point, or a role and a message:

      ```python
      point = (3, 4)
      x, y = point
      head, *rest = [1, 2, 3]
      ```

      The second line is **unpacking**: each name gets one item. A starred name collects
      whatever is left over into a list. `point[0] = 5` fails with a `TypeError`.

  - type: predict-output
    id: predict-star-unpack
    concept: python.tuples-and-unpacking
    difficulty: 2
    language: python
    code: |
      head, *tail = ["mon", "tue", "wed"]
      print(head)
      print(tail)
    question: What does this show?
    choices:
      - text: '`mon`, then `[''tue'', ''wed'']`'
        correct: true
        feedback: >-
          Yes. `head` takes one item, and the star collects the rest as a list.
      - text: '`mon`, then `tue`'
        feedback: >-
          The star makes `tail` take everything left, not only the next item.
      - text: '`[''mon'']`, then `[''tue'', ''wed'']`'
        feedback: >-
          Only the starred name becomes a list. `head` gets the item itself.
      - text: It stops with a `ValueError`
        feedback: >-
          That happens when counts don't match. The star absorbs any number of items.

  - type: prose
    id: aliases-and-identity
    body: |-
      Assignment never copies a list. It gives the same list a second name:

      ```python
      a = ["tea"]
      b = a                   # same list, two names
      b.append("cake")
      print(a)                # ['tea', 'cake']
      c = a[:]                # a real copy
      print(c == a, c is a)   # True False
      ```

      `==` asks: same contents? `is` asks: the very same object? Compare values with `==`,
      and save `is` for `None`.

  - type: bug-hunt
    id: hunt-is-empty
    concept: python.identity
    difficulty: 3
    language: python
    code: |
      def summary(results):
          if results is []:
              return "No results"
          return f"{len(results)} results"
    prompt: '`summary([])` returns `0 results`, never `No results`. Tap the line at fault.'
    lines: [2]
    reasons:
      - text: '`is` checks for the same object; each `[]` is new'
        correct: true
        feedback: >-
          Right. `if not results:` asks what's meant: is it empty?
      - text: '`is` can''t compare lists'
        feedback: >-
          It can, and it runs. It asks a different question: the same object, not the same
          contents.
      - text: '`len` fails on an empty list'
        feedback: >-
          `len([])` is 0, which is why you see `0 results`.
    fix: |
      def summary(results):
          if not results:
              return "No results"
          return f"{len(results)} results"

  - type: code-challenge
    id: write-trim-history
    concept: python.slicing
    difficulty: 3
    language: python
    starter: history.starter.py
    solution: history.solution.py
    tests: history.tests.py
    editable: '2-3'
    prompt: >-
      A chat history is a list of `(role, text)` tuples. The first is the system prompt, the
      model's standing instructions. Write `trim_history(history, keep)`: a new list with the
      system prompt and the last `keep` messages. `keep` is at least 1.


      Example: with `keep` 2, `[sys, a, b, c]` gives `[sys, b, c]`.
    hints:
      - 'The unpacking step splits off the first item with a starred name.'
      - 'A negative slice start counts from the end, and a slice never fails when it runs short.'
      - 'Start with `system, *messages = history`, then join `[system]` to a slice of `messages`.'

  - type: explain-back
    id: explain-slice-copy
    concept: python.identity
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      After `copy = items[:]`, appending to `copy` leaves `items` alone. After
      `alias = items`, appending to `alias` changes `items`. Why?
    rubric:
      - A slice builds a new list with the same items.
      - Plain assignment only gives the same list a second name.
      - So changes through `alias` are changes to `items` itself.
    modelAnswer: >-
      A slice always makes a new list, so `copy` is a separate list that starts with the same
      items. `alias = items` makes no list at all. It's a second name for the one list, so
      `alias is items` is true. Appending through either name changes the same list.

recap:
  - Change lists in place with `append` and `pop`, and sort with `sorted`.
  - Slice any sequence with `[start:stop:step]` for a new copy.
  - Unpack tuples into names, and compare with `==`, keeping `is` for `None`.
recall:
  - id: card-negative-index
    concept: python.lists
    front: How do you get the last item of a list `queue`?
    back: >-
      `queue[-1]`. Negative indexes count from the end.
  - id: card-sorted-vs-sort
    concept: python.lists
    front: How do `sorted(items)` and `items.sort()` differ?
    back: >-
      `sorted` returns a new sorted list and leaves `items` alone. `sort` changes `items` in
      place and returns `None`.
  - id: card-slice-stop
    concept: python.slicing
    front: How do you get the last three items of a list `log`?
    back: >-
      `log[-3:]`. It's a new list, and it never fails when the list is shorter.
  - id: card-star-unpack
    concept: python.tuples-and-unpacking
    front: After `first, *rest = [5, 6, 7]`, what are `first` and `rest`?
    back: >-
      `first` is `5`, and `rest` is the list `[6, 7]`.
  - id: card-is-vs-equals
    concept: python.identity
    front: When do you use `is` instead of `==`?
    back: >-
      To check for `None`: `if x is None:`. For values, use `==`. `is` asks whether two names
      point at the very same object.

