term: quicksort
aka: [quick sort, partition sort]
short: Sorting by picking a pivot, putting smaller items before it and larger after, then repeating on each side.
explain: |
  Pick one item, the pivot. Walk the list and put everything smaller before it and
  everything larger after it. The pivot is now in its final place. Do the same to each side.

  With good pivots each split halves the work, so it's O(n log n) on average. It sorts in
  place and is fast in practice. Bad pivots spoil it. Always take the first item of a sorted list, and every split peels
  off one item, so it becomes O(n²).

  Random pivots make that worst case very unlikely. It isn't stable, so equal items can
  swap order.
analogy: Sorting a class by height. Pick one pupil, send shorter ones left and taller ones right, then sort each group the same way.
example:
  language: python
  code: |
    def quicksort(xs):
        if len(xs) <= 1:
            return xs
        pivot = xs[len(xs) // 2]
        left = [x for x in xs if x < pivot]
        mid = [x for x in xs if x == pivot]
        right = [x for x in xs if x > pivot]
        return quicksort(left) + mid + quicksort(right)
usage: Quicksort with the first element as pivot goes quadratic on already sorted input; pick the pivot at random.
twin:
  term: merge-sort
  difference: Quicksort does its work while splitting around a pivot, in place, and is O(n²) in the worst case. Merge sort does its work while merging, needs extra memory and is always O(n log n).
related: [merge-sort, stable-sort, recursion, in-place]
