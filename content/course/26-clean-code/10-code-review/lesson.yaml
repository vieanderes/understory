    note: A standard set of comment labels, with decorations for blocking and non-blocking.
    verified: true

deepDive: >-
  The same order works when you review AI-written code, with one addition: check that
  every API it calls exists and that its tests assert something real. Generated code tends
  to look tidy, so the naming pass tells you little. The correctness pass is where the
  bugs are.


  Tone matters more than it seems. Comment on the code, not the person: "this skips the
  ownership check" rather than "you forgot". Ask questions when you're unsure; the author
  may know something you don't.


  As an author, help your reviewer. Write a description that says what changed, why, and
  how you tested it. Point reviewers at the risky part. Review your own diff first: you'll
  catch the leftover debug line before anyone else does.
