term: vertical slice
aka: [ smallest testable slice, thin slice, end-to-end slice ]
short: The least you can build that runs through every layer, end to end, on real data.
explain: |
  Building one layer at a time hides the risk until the end. You finish a beautiful
  database, then learn the model can't read the inputs.

  A vertical slice goes thin but all the way through: one input, read, processed, shown.
  Aim it at the riskiest assumption, with a threshold and a stop rule decided first. If
  it fails, you've lost days, not months.
analogy: Baking one test cupcake before making the wedding cake.
usage: "Before the full dashboard, ship a vertical slice: one supplier's invoices, extracted and booked."
related: [ assumption-map, success-metric, yagni ]
level: 2
lessons: [ aisys.shaping-the-build, interview.four-hour-build ]
