id: cloud.containers
title: Containers
objective: Say what an image and a container are, write a Dockerfile for a Node app, and run it with a published port.
level: essential
minutes: 10
concepts: [cloud.container-images, cloud.dockerfiles, cloud.containers-and-vms]
prerequisites: [cloud.where-code-runs, cloud.linux-server, tooling.node-and-npm]
opening:
  text: >-
    You'll package a Node API so it runs the same on your laptop, in CI and on a server. It's
    how most code reaches production today, AI services included.

steps:
  - type: prose
    id: works-on-my-machine
    body: >-
      Your API runs on your laptop. On the server it crashes: older Node, a missing library.
      "It works on my machine", says everyone.


      The fix is to ship the machine's contents too. An **image** is your app packaged with
      its files, its runtime and its libraries. It never changes once built. A **container**
      is that image running as an isolated process, and one image can run as many.

  - type: multiple-choice
    id: pick-what-ships
    concept: cloud.container-images
    difficulty: 1
    question: The server needs your API, Node 24 and its packages. What do you send it?
    choices:
      - text: The image
        correct: true
        feedback: >-
          Right. The image holds the app, Node and the packages together.
      - text: A running container
        feedback: >-
          A container is a process on one machine. You ship the image, and the server starts its own.
      - text: Your project folder and a note of the Node version
        feedback: >-
          That's the "works on my machine" route. The server still has to match your laptop by hand.

  - type: prose
    id: first-dockerfile
    body: |-
      **Docker** is the tool that builds images and runs containers. A **Dockerfile** is the
      recipe for an image, one instruction per line:

      ```text
      FROM node:24-slim
      WORKDIR /app
      COPY . .
      RUN npm ci
      CMD ["node", "server.js"]
      ```

      `FROM` picks a base image with Node on Linux. `WORKDIR` sets the folder. `COPY` copies
      your files in. `RUN` runs a command while building. `CMD` is the command that starts
      the app.

  - type: parsons
    id: arrange-dockerfile
    concept: cloud.dockerfiles
    difficulty: 2
    language: bash
    prompt: >-
      Write the Dockerfile for a to-do API that starts with `node server.js`. One line doesn't
      belong.
    blocks:
      - id: from
        code: FROM node:24-slim
      - id: workdir
        code: WORKDIR /app
      - id: copy
        code: COPY . .
      - id: install
        code: RUN npm ci
      - id: cmd
        code: CMD ["node", "server.js"]
    distractors:
      - id: start
        code: START ["node", "server.js"]
        feedback: >-
          There's no `START` instruction. `CMD` names the command a container starts with.

  - type: prose
    id: build-and-run
    body: |-
      Build the image and give it a name with `-t`. Then run it:

      ```bash
      $ docker build -t todo-api .
      $ docker run -d -p 8080:3000 todo-api
      $ curl localhost:8080/todos
      [{"id":1,"title":"Buy milk","done":false}]
      ```

      A container has its own network. `-p 8080:3000` **publishes a port**: your port 8080
      goes to the container's port 3000. `-d` runs it in the background.

  - type: fill-blank
    id: fill-run-command
    concept: cloud.dockerfiles
    difficulty: 2
    language: bash
    prompt: >-
      The summary API listens on 3000 and reads its model key from `MODEL_API_KEY`. `-e`
      sets an environment variable in the container, at run time. Serve it on port 80 of
      the server.
    template: |
      $ docker run -d \
          -p {{1}}:{{2}} \
          {{3}} MODEL_API_KEY="$MODEL_API_KEY" \
          summary-api
    blanks:
      - key: '1'
        answer: '80'
      - key: '2'
        answer: '3000'
      - key: '3'
        answer: -e
    bank: ['80', '3000', '8080', -e, -t, -d]

  - type: ai-review
    id: review-run-at-build
    concept: cloud.dockerfiles
    difficulty: 3
    language: bash
    request: Write a Dockerfile that starts our API.
    flawClass: logic
    code: |
      FROM node:24-slim
      WORKDIR /app
      COPY . .
      RUN npm ci
      RUN node server.js
    prompt: >-
      We tried the assistant's Dockerfile. The build never finished. Its last line said
      `Listening on 3000`, and then nothing. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`RUN` starts the server during the build'
        correct: true
        feedback: >-
          Yes. `RUN` waits for the command to end, and a server never ends. Use `CMD`.
      - text: '`npm ci` needs `npm install` in Docker'
        feedback: >-
          `npm ci` works in Docker and is the repeatable choice. The install step finished.
      - text: '`WORKDIR` must come before `FROM`'
        feedback: >-
          `FROM` always comes first. Every other line builds on the base image it picks.
    fix: |
      FROM node:24-slim
      WORKDIR /app
      COPY . .
      RUN npm ci
      CMD ["node", "server.js"]

  - type: prose
    id: one-kernel
    body: |-
      The **kernel** is the core of an operating system: it runs programs and talks to the
      hardware. `uname -r` prints its version. Two images, two different Linux systems:

      ```bash
      $ docker run --rm alpine uname -r
      6.10.14-linuxkit
      $ docker run --rm node:24-slim uname -r
      6.10.14-linuxkit
      ```

      Same kernel. Containers share the host's kernel. A **virtual machine** boots its own
      kernel on pretend hardware: stronger walls, far heavier.

  - type: multiple-choice
    id: pick-vm-or-container
    concept: cloud.containers-and-vms
    difficulty: 3
    question: A tool only runs on Windows. Your servers run Linux. What can run it?
    choices:
      - text: A virtual machine running Windows
        correct: true
        feedback: >-
          Right. A VM boots its own kernel, so it can be Windows.
      - text: A container from a Windows image
        feedback: >-
          A container uses the host's kernel. On a Linux host, that's a Linux kernel.
      - text: A container with more memory
        feedback: >-
          Memory doesn't change the kernel. The container still runs on the Linux host's one.

  - type: explain-back
    id: explain-not-a-vm
    concept: cloud.containers-and-vms
    difficulty: 4
    prompt: >-
      A container starts in about a second, and a virtual machine takes far longer. Why is a
      container so much quicker to start?
    rubric:
      - A container is a process on the host's kernel, so there's no operating system to boot.
      - Docker only restricts what that process can see and how much it can use.
      - A virtual machine has to start virtual hardware and boot its own kernel before any program runs.
    modelAnswer: >-
      Starting a container is starting a process. The kernel is already running, and it's the
      host's. Docker gives the process its own view of files, network and other processes.
      It sets limits on memory and CPU, then runs the command. A virtual machine has more to do.
      It creates virtual hardware, boots a whole kernel and starts its services. Only then
      does your program run. The container's speed has a price. Everything shares one
      kernel, so the walls are weaker.

recap:
  - Say what an image is, and what a container is, in one sentence each.
  - Write a Dockerfile with `FROM`, `WORKDIR`, `COPY`, `RUN` and `CMD`, and run it with `-p`.
  - Pass secrets like a model key at run time with `-e`, and explain why a container isn't a VM.

recall:
  - id: card-image-vs-container
    concept: cloud.container-images
    front: What's the difference between an image and a container?
    back: >-
      An image is the packaged app with its runtime and libraries. A container is that image
      running as an isolated process.
  - id: card-run-vs-cmd
    concept: cloud.dockerfiles
    front: When does `RUN` happen, and when does `CMD` happen?
    back: >-
      `RUN` runs while the image is built, and must finish. `CMD` is the command each
      container starts with.
  - id: card-publish-port
    concept: cloud.dockerfiles
    front: What does `-p 8080:3000` do in `docker run`?
    back: >-
      It publishes a port: requests to port 8080 on the host go to port 3000 inside the
      container.
  - id: card-container-vs-vm
    concept: cloud.containers-and-vms
    front: How does a container differ from a virtual machine?
    back: >-
      A container is an isolated process sharing the host's kernel. A VM boots its own kernel
      on virtual hardware.

