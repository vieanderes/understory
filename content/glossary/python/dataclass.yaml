term: dataclass
aka:
  - "@dataclass"
  - data class
short: A Python class whose constructor, printing and comparison are written for you from its typed fields.
explain: |
  Many classes only hold a few values. Writing `__init__`, `__repr__` and `__eq__` for each
  one by hand is dull, and a slip goes unnoticed.

  Put `@dataclass` above the class and list the fields with type hints. Python writes those
  methods for you. Add `frozen=True` and the fields can't be changed after creation.

  The trap: the type hints are documentation, not checks. Pass a string where an `int`
  belongs and a dataclass stores it without a word. For data from outside, use a validating
  class instead.
analogy: A labelled storage box. It keeps things tidy, but it doesn't check what you put in.
example:
  language: python
  code: |
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Booking:
        room: str
        guests: int

    Booking("B12", 2) == Booking("B12", 2)  # True
usage: This only holds three values and never leaves the module, so a frozen dataclass is plenty.
twin:
  term: data-validation-model
  difference: A dataclass trusts its input and only stores it. A data validation model checks and converts every field, so it belongs where outside data arrives.
related:
  - type-hint
  - dunder-method
  - immutability
level: 2
lessons:
  - pro.pythonic
