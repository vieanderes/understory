summary: >-
  A pull request can be green, reviewed and merged, and the product can still fail on its
  first busy evening. **Merge ready** and **launch ready** answer different questions. Merge
  ready says the diff is sound: it does what it claims, and its tests would catch it doing
  otherwise. Launch ready asks about the whole product: does every journey work for real
  users, does it hold at real load, does it survive someone trying to break in, and is there
  a tested way back?


  The bridge between the two is an attack on the running product before launch. Several
  independent attackers, agents or people, each take one angle: features, bugs, performance
  or security. Each starts without the authoring chat or the other attackers' notes, so none
  inherits the author's blind spots. Each returns findings with proof, and a person triages
  them.


  Then the launch itself is an experiment. The feature goes out behind a flag to a small
  share of users, with a hypothesis and guardrails written down before it starts, and a kill
  switch and rollback that were tried in advance. Nothing in it is a one-way door. The
  chapter's habits fit in one line: gate the leaves, deep-read the trunk, attack the whole
  product before launch.
remember:
  - A green, reviewed pull request proves the diff is sound, not that the product works for real users, at load, under attack, with a way back.
  - 'Before launch, independent attackers each take one angle on the running product: features, bugs, performance and security.'
  - An attacker gets the target, the intent and its angle, never the authoring chat, because shared context means shared blind spots.
  - Every finding comes with proof a person can open, such as the steps, a screenshot, a recording or the numbers, and a person triages them.
  - Launch behind a flag to a small share first, with the hypothesis and guardrails such as crash rate, errors, latency and a product signal written down before it starts.
  - A kill switch and a rollback only count once they've been tried, and a data change must stay reversible until the launch is complete.
  - Gate the leaves, deep-read the trunk, attack the whole product before launch.
sections:
  - title: What a merge can't see
    body: |-
      Code review and CI look at a change. Many launch failures live in places a change
      doesn't show.

      - **Journeys across features.** The new booking page works, but the confirmation email
        still links to the old one. Each diff was fine; the journey is broken.
      - **Load and data shape.** Tests run on ten rows. The busiest night has ten thousand
        guests, a slow mobile network, and one account with four hundred bookings.
      - **Configuration and environment.** A missing secret in production, a rate limit at
        the payment provider, a cache that behaves differently with real traffic.
      - **Attack surface.** A new endpoint is reachable signed out, or returns another
        guest's booking when someone edits the id in the URL.
      - **The way back.** Nobody has tried turning the flag off, and the migration already
        dropped the old columns.

      None of these is a reviewer's mistake. They're outside what a diff can show. That's why
      the question changes at launch: from "is this change correct?" to "is this product
      ready for the people who'll use it?"

      For small leaf changes, such as a copy tweak or one new screen behind a flag, the
      launch work is light: a flag, a quick journey check and a watched rollout. For a new
      checkout, a new sign-in, or anything that moves money or data, it's worth the full
      attack.
  - title: Running the attack
    body: |-
      Each attacker gets a short brief. What it doesn't get matters as much as what it does.

      ```yaml
      attacker: security
      target: https://staging.example.test
      intent: Guests book, change and cancel hotel stays.
      angle: Auth, injection, and access to other guests' data.
      may: create test accounts and test bookings on staging
      must not: touch production, real payments or real emails
      report: each finding with severity, steps to reproduce and proof
      ```

      No authoring chat, no design notes, no other attacker's report. An attacker that read
      how the author reasoned tends to check what the author already checked, and to accept
      the author's explanations. A different model, or a person, adds independence too.

      Run them against a staging copy that behaves like production: realistic data shapes,
      the same configuration, fake payment keys. Give them permission to create test data and
      nothing that reaches real people or real money.

      Triage is a person's job. Reproduce every blocker from its proof first. A finding
      without proof is a lead to follow, not a verdict. Then fix, accept with a reason, or
      reject. Merge duplicates, because two attackers often find one cause from two sides.
      The output is a short list: what blocks the launch, what ships with a known issue, and
      what goes on the backlog.
  - title: A launch you can take back
    body: |-
      Clean attacks still aren't real users. So treat the launch as an experiment, written
      down before it starts:

      ```yaml
      hypothesis: more stays booked on phones
      guardrails:
        crash rate: no higher than the old flow
        error rate: under 0.5% of requests
        p95 latency: under 800 ms
        bookings completed: no lower than the old flow
      rollout: 1%, 5%, 25%, 100%, a day at each
      kill switch: flag off, tried on staging
      ```

      The hypothesis is what should improve. The guardrails are what must not get worse,
      and they're set before anyone sees the numbers, so nobody argues them away later.
      **Crash rate** is the share of sessions where the app dies, and it matters most for
      phone apps, which can't be rolled back on the user's device.

      The way back has to really work. A flag turns new code off, but it can't undo data.
      If the launch changes the schema, expand first: add the new column and write both, and
      drop the old ones only after the launch has been at 100% for a while. Try the kill
      switch and the rollback before launch, on staging, and time them.

      The flags, hashed buckets and canary statistics behind this are in the progressive
      delivery lesson of the cloud chapter.
pitfalls:
  - '**Treating merged as launched.** A green pull request is about the diff. Before real users, ask about journeys, load, attack and a way back.'
  - '**Giving attackers the authoring chat.** They inherit its assumptions and pass what the author passed. Give the target, the intent and one angle.'
  - '**One agent told to "test everything".** It skims every angle and goes deep on none. One attacker per angle digs further.'
  - '**Acting on findings without proof.** Some agent findings are wrong. Reproduce each blocker before it holds a launch, and ask for proof when it''s missing.'
  - '**Guardrails chosen after the numbers.** Thresholds set later bend to fit the result. Write them down before the first user sees the change.'
  - '**A kill switch that can''t undo data.** Dropping or rewriting columns in the launch makes flag off useless. Keep data changes reversible until the launch completes.'
verify:
  - lens: tests
    check: Each of the four angles was attacked on a staging copy, and every blocker was reproduced from its proof before the launch decision.
  - lens: breaks
    check: The kill switch and the rollback were tried on staging, and turning the flag off leaves the old path with all the data it needs.
  - lens: leaks
    check: The security attacker tried signed-out access and other users' records on every new endpoint, not only the happy path.
  - lens: scales
    check: The performance attacker loaded the product at ten times the busiest hour, on a slow network, with the largest real accounts.
  - lens: confuses
    check: The hypothesis, guardrails and rollout steps are written in one place before launch, so nobody has to guess what counts as failure.
interview:
  - question: What's the difference between a change being ready to merge and ready to launch?
    answer: >-
      Merge ready is about the diff; launch ready is about the product. A merged change has
      been reviewed against its intent, and its tests pass, so the code is sound. Launch
      readiness asks what no diff can show: whether every user journey works end to end,
      whether it holds at real load with real data shapes, whether someone can break in or
      see another user's data, and whether there's a tested way back. For a small leaf change
      behind a flag, that's a quick journey check and a watched rollout. For a new checkout
      or sign-in, I'd run a proper attack on a staging copy and launch it as a flagged
      experiment.
  - question: How would you use AI agents to test a product before launch?
    answer: >-
      As several independent attackers, one angle each: features, bugs, performance and
      security. Each gets a brief with the staging target, the intent, its angle, what it may
      and may not do, and the shape of a finding with proof. None gets the chat that built
      the feature, because it would inherit the author's assumptions and miss the same
      things. They run against a staging copy with test data and fake payment keys. Then a
      person triages: reproduce each blocker from its proof, merge duplicates, and decide
      fix, accept or reject. The agents widen the search; the launch decision stays with a
      person.
  - question: How do you make a launch reversible?
    answer: >-
      Ship it behind a flag, give it to a small share first, and write the hypothesis and
      guardrails down before it starts: crash rate, error rate, latency and a product signal
      such as completed bookings. If a guardrail is breached, the flag goes off. That only
      works if I've tried the kill switch and rollback beforehand, and if the data still
      suits the old path. So schema changes go expand first and contract last, after the
      launch has been at full rollout for a while. The trade-off is time and some temporary
      duplication, which is worth it for anything that touches money or user data.
