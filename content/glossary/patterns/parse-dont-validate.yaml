term: parse, don't validate
aka: [parse don't validate, parse instead of validate]
short: Converting raw input into a new typed value at the edge, not checking it and passing it on.
explain: |
  A function checks that the input looks right, then passes the same raw data along. The
  next function can't tell it was checked, so it checks again, or forgets to. The checks
  spread out and drift apart.

  Instead, parse once at the edge. A parser takes unknown input and returns either a new,
  typed value holding only the fields it names, or a list of problems. Everything after
  works with that value and never touches the raw input again. The type itself is the proof
  the check happened.
analogy: Swapping foreign coins for local money at the border. After that, every shop takes what you hold without checking.
example:
  language: ts
  code: |
    const Signup = z.object({ email: z.string().email(), age: z.coerce.number().int() });
    type Signup = z.infer<typeof Signup>;

    const result = Signup.safeParse(body);
    if (!result.success) return badRequest(result.error.issues);
    createAccount(result.data); // a Signup, not unknown
usage: Parse, don't validate, so hand the service a typed `Signup`, not the request body.
related: [trust-boundary, unknown-type, type-guard, data-validation-model, mass-assignment]
level: 3
lessons: [backend.validation]
