id: torn-pages
title: TornPages
topic: time-complexity
difficulty: medium
type: algorithmic
recommendedMinutes: 25
signature:
  params:
    - { name: A, type: "int[]" }
  returns: "int[]"
statement: |-
  A notebook had N + 2 pages, numbered from 1 to N + 2. Exactly two pages were torn out. The
  numbers of the N pages that are left are listed, in no particular order, in an array A.

  Write a function:

  {{signature}}

  that, given an array A of N integers, returns the numbers of the two missing pages as an
  array of two integers, the smaller number first.

  For example, given A = [3, 1, 6, 4], the function should return [2, 5].

  Given A = [2, 1], the function should return [3, 4].

  Given A = [], the function should return [1, 2].

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [0..100,000];
  - the elements of A are all distinct;
  - each element of array A is an integer within the range [1..(N + 2)].
examples:
  - { args: [[3, 1, 6, 4]], expected: [2, 5] }
  - { args: [[2, 1]], expected: [3, 4] }
  - { args: [[]], expected: [1, 2] }
timeLimitMs: 300
tests:
  - name: extreme_empty_single
    description: no pages left, or one page left
    group: correctness
    cases:
      - { args: [[]], expected: [1, 2] }
      - { args: [[1]], expected: [2, 3] }
      - { args: [[2]], expected: [1, 3] }
      - { args: [[3]], expected: [1, 2] }
  - name: first_and_last
    description: page 1 and page N + 2 are missing
    group: correctness
    cases:
      - { args: [[4, 2, 3]], expected: [1, 5] }
      - { args: [[2, 3, 4, 5, 6, 7, 8]], expected: [1, 9] }
  - name: neighbours
    description: the missing pages are next to each other
    group: correctness
    cases:
      - { args: [[1, 2, 5, 6]], expected: [3, 4] }
      - { args: [[3, 4, 5]], expected: [1, 2] }
      - { args: [[5, 1, 3, 2, 4]], expected: [6, 7] }
  - name: small_random
    description: shuffled 1..100 without two pages
    group: correctness
    cases:
      - generate: { seed: 301, args: [{ kind: permutation, n: 100, drop: 2 }] }
      - generate: { seed: 302, args: [{ kind: permutation, n: 101, drop: 2 }] }
  - name: medium_random
    description: shuffled, N = 5,000
    group: correctness
    cases:
      - generate: { seed: 303, args: [{ kind: permutation, n: 5002, drop: 2 }] }
  - name: large_random
    description: shuffled, N = 100,000
    group: performance
    cases:
      - generate: { seed: 304, args: [{ kind: permutation, n: 100002, drop: 2 }] }
  - name: extreme_large
    description: pages in order, the two largest missing, N = 100,000
    group: performance
    cases:
      - generate: { seed: 305, args: [{ kind: range, n: 100000, start: 1, step: 1 }] }
