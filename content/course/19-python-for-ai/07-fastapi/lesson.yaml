deepDive: >-
  **Checked with FastAPI 0.141 and its TestClient** on Python 3.12. `max_words: "ten"`
  gave `422` with `loc` `["body", "max_words"]`. `"10"` was accepted as `10`, since
  Pydantic converts safely. The browser Python in this course can't run a web server, so
  this lesson has reviews and arranging instead of a challenge.


  **def or async def.** FastAPI runs a plain `def` route in a thread pool, so a blocking
  call there is fine. Inside `async def`, use async clients only, or you freeze the
  server, as the async lesson showed.


  **Docs for free.** FastAPI builds an OpenAPI description from your types and serves it
  at `/docs`, where you can try every route. Run the app with `uv run fastapi dev main.py`.
