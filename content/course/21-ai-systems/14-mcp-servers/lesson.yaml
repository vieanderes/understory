deepDive: >-
  Everything here ran. The server used the Python SDK 2.2.0 through its own client:
  `tools/list` returned only `find_book`, the resource and prompt had their own lists, and
  the call with "Ulysses" came back with `is_error` true and "Error executing tool find_book:
  No book called Ulysses. Use an exact title." A plain `ValueError` gave only "Error
  executing tool find_book", so raise `ToolError` when the model should see why. The server
  that printed on stdout still worked with that client, which logged a parse failure and
  skipped the line. The spec forbids it, and other clients may be stricter.


  Version 2 of the SDK renamed `FastMCP` to `MCPServer`. Assistants trained on older code
  still write `from mcp.server.fastmcp import FastMCP`, which now fails on import.


  The 2026-07-28 revision made requests stateless and self-contained: every request carries
  its protocol version and client capabilities, and servers no longer start requests of their
  own. Earlier revisions opened a session with an `initialize` handshake, and SDKs still
  fall back to it for older peers.


  **Remote tokens.** Authorisation applies to HTTP servers only. A stdio server takes credentials from its
  environment. A remote server is an OAuth 2.1 resource server: it publishes protected
  resource metadata, and clients request tokens for its exact URI. Accepting a token meant
  for another service, or forwarding the user's token downstream, turns the server into a
  confused deputy.
