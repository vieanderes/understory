term: NoSQL
aka: [NoSQL database, non-relational database]
short: The family of data stores that drop tables and joins to make one shape of access fast.
explain: |
  A relational database stores tables and lets you ask almost any question. NoSQL stores
  give some of that up. A document store keeps whole records together. A key-value store
  fetches by one key. Wide-column and graph stores each fit one shape too.

  In return they often spread across many machines without much fuss. The cost is
  usually joins, constraints or multi-row transactions. Start from your access patterns,
  and pick one only when you've measured a need a relational database can't meet.
analogy: Specialist shops versus a supermarket. The cheese shop is better at cheese, and sells nothing else.
usage: We picked NoSQL for the session store because every read is by one key.
twin:
  term: relational-database
  difference: A relational database makes any query and multi-row transactions cheap. A NoSQL store makes one access pattern fast, often at large scale, and gives up the rest.
related: [relational-database, document-database, key-value-store, access-pattern, sharding]
level: 2
lessons: [sysdesign.sql-or-nosql]
