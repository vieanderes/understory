term: space complexity
aka: [memory complexity, auxiliary space]
short: How much extra memory an algorithm needs as its input grows, apart from the input itself.
explain: |
  Code costs memory as well as time. Copying a list, building a lookup table or recursing
  a thousand calls deep all hold memory until they finish.

  You count the extra memory, not the input. A loop with two counters is O(1) space. A
  set of every item seen is O(n). A recursion n calls deep is O(n) too, because each call
  keeps a frame on the stack.

  Many speed-ups spend memory to save time. A hash map turns an O(n²) search into O(n),
  and pays for it with O(n) space. Say both costs when you explain a solution.
analogy: Doing a sum in your head versus covering a whiteboard in notes. Same answer, different amount of room.
example:
  language: js
  code: |
    // O(1) extra space: two numbers, whatever the input
    let min = Infinity, max = -Infinity;
    for (const x of nums) { min = Math.min(min, x); max = Math.max(max, x); }

    // O(n) extra space: a set that can hold every item
    const seen = new Set(nums);
usage: It's O(n) time, but the space complexity is O(n) as well, because of the set.
twin:
  term: time-complexity
  difference: Space complexity is the extra memory the code needs. Time complexity is the number of steps it takes. Faster often means more memory.
related: [big-o, time-complexity, in-place, hash-set, call-stack]
level: 2
lessons: [cs.complexity, algo.hash-map-patterns]
