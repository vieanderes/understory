term: formatter
aka:
  - code formatter
  - autoformatter
short: A tool that rewrites code's layout, its spacing, quotes and line breaks, to one fixed style.
explain: |
  Code reviews used to be full of comments about spaces and commas. That's time nobody
  gets back, and it hides the comments that matter.

  This tool ends the debate. It reprints every file the same way, so the whole team's code
  looks like one person wrote it. It changes layout only, never behaviour. Run it on save
  and check it in CI with a `--check` flag, so the gate reports instead of rewriting.
analogy: A shop that reprints every recipe card in the same template. The recipe stays the same; now they all look alike.
example:
  language: bash
  code: |
    $ pnpm prettier --check .
    [warn] src/cart.ts
    [warn] Code style issues found. Run with --write to fix.
    $ pnpm prettier --write src/cart.ts
usage: Turn on the formatter on save and these whitespace comments disappear from review.
twin:
  term: linter
  difference: A formatter fixes how code looks and never its meaning. A linter reads what the code does and warns about likely bugs, which formatting can't touch.
related:
  - linter
  - pep-8
level: 2
lessons:
  - tooling.quality-gates
