id: algo.intervals-and-greedy
title: Intervals and greedy choices
objective: Sort intervals to merge them or count overlaps, and argue why a greedy choice is safe before you trust it.
level: advanced
minutes: 10
concepts: [algo.interval-sorting, algo.greedy-choice]
prerequisites: [algo.dynamic-programming, cs.searching-and-sorting]
opening:
  text: >-
    You'll merge overlapping bookings in one pass and pick the most meetings a room can
    hold. You'll also learn to tell when grabbing the best-looking option is safe.

steps:
  - type: prose
    id: picture-intervals
    body: |-
      An **interval** is a pair `[start, end]`: a booking, a meeting, a shift. Interval
      tasks ask about overlaps: merge them, count them, fit the most in.

      The first move is almost always a sort. Sort by start to merge, by end to fit the
      most. In JavaScript, pass a comparator: `sort((a, b) => a[0] - b[0])`. Bare `sort()`
      compares `[10, 12]` and `[9, 11]` as text.

  - type: multiple-choice
    id: spot-interval-signal
    concept: algo.interval-sorting
    difficulty: 1
    question: Which task starts with sorting intervals?
    choices:
      - text: Show a calendar's busy blocks from overlapping meetings
        correct: true
        feedback: >-
          Yes. Sort by start, and overlapping meetings sit side by side.
      - text: Find the best run of consecutive trading days
        feedback: >-
          That's a maximum slice: one pass, no sorting.
      - text: Check that a file's brackets nest properly
        feedback: >-
          Nesting is a stack job, in the order the characters come.
      - text: Total the sales between two dates, many times
        feedback: >-
          Many range totals on fixed data is a prefix sum.

  - type: prose
    id: merge-idea
    body: |-
      Sorted by start, bookings that overlap sit next to each other. So one pass is enough.

      Keep the last merged booking. If the next one starts before the last one ends, stretch
      the end. Otherwise start a new block. That's **merging intervals**: an O(n log n) sort,
      then O(n) work.

  - type: ai-review
    id: review-nested-booking
    concept: algo.interval-sorting
    difficulty: 3
    language: js
    request: Merge overlapping room bookings into blocks of busy time.
    flawClass: edge-case
    code: |
      function merge(list) {
        const sorted = [...list].sort((a, b) => a[0] - b[0]);
        const out = [];
        for (const [start, end] of sorted) {
          const last = out[out.length - 1];
          if (last && start <= last[1]) last[1] = end;
          else out.push([start, end]);
        }
        return out;
      }
    prompt: >-
      An assistant wrote this. The test `[[1, 3], [2, 6], [8, 10]]` passed. Tap the line
      that breaks `[[1, 10], [2, 3]]`.
    lines: [6]
    reasons:
      - text: A booking inside another shrinks the block
        correct: true
        feedback: >-
          Right. `[2, 3]` sets the end to 3, losing hours 3 to 10. Use `Math.max`.
      - text: The sort compares the wrong index
        feedback: >-
          `a[0] - b[0]` sorts by start, which is what merging needs. The trouble comes later.
      - text: Spreading the list is unnecessary
        feedback: >-
          The copy is deliberate. It keeps the caller's array unsorted and untouched.
    verify:
      question: Which test would have caught this?
      choices:
        - text: One booking entirely inside another
          correct: true
          feedback: >-
            Yes. The inner end is smaller, so the block shrinks.
        - text: Two bookings that only touch, end to start
          feedback: >-
            The second end is later, so setting it is right. They merge correctly.
        - text: A single booking
          feedback: >-
            With nothing to merge, the faulty line never runs.
    fix: |
      if (last && start <= last[1]) last[1] = Math.max(last[1], end);

  - type: code-challenge
    id: write-merge-bookings
    concept: algo.interval-sorting
    difficulty: 3
    language: ts
    twin:
      language: python
      starter: merge.starter.py
      solution: merge.solution.py
      tests: merge.tests.py
    prompt: >-
      A calendar shows your busy blocks. Write `mergeBookings(bookings)`: each booking is
      `[start, end]` with `start < end`, in any order. Return the busy blocks, sorted by
      start.


      `mergeBookings([[8, 10], [1, 3], [2, 6]])` is `[[1, 6], [8, 10]]`. Touching bookings
      merge too: `[1, 3]` and `[3, 5]` become `[1, 5]`.


      **Target:** O(n log n) for up to 200,000 bookings. The tests include no bookings, a
      booking inside another, and a check that the input isn't changed. Comparing every
      pair runs out of time.
    hints:
      - Sort a copy by start time first, so overlapping bookings sit side by side.
      - Only the last block you built can overlap the next booking. Touching counts, so compare with `<=`.
      - 'Push a copy of the first booking, then either stretch the last block with `Math.max` or push a new one.'

  - type: prose
    id: greedy-idea
    body: |-
      A new question: one room, many talks. How many can it host without overlap?

      Sort by **end** time. Take each talk that starts at or after the last one you took
      ends. Committing to the best-looking option now is a **greedy choice**. It's safe
      here: the talk that ends first leaves the most room. Any best plan can swap its first
      talk for that one and lose nothing.

  - type: code-challenge
    id: write-most-talks
    concept: algo.greedy-choice
    difficulty: 3
    language: python
    starter: talks.starter.py
    solution: talks.solution.py
    tests: talks.tests.py
    prompt: >-
      Now in Python. A conference app plans the most talks one person can attend. Write
      `most_talks(talks)`: each talk is `(start, end)`. Return how many you can attend
      without overlap. One can start when the last ends.


      `most_talks([(1, 4), (2, 3), (3, 5), (6, 7)])` is `3`.


      **Target:** O(n log n) for up to 100,000 talks. The tests include no talks, a long
      talk that starts first, and a full-size run.
    hints:
      - Which talk should you attend first to leave the most time for the rest?
      - 'The one that ends first. Sort by end with `sorted(talks, key=lambda t: t[1])`.'
      - 'Keep `free = float("-inf")`. Take a talk when `start >= free`, then set `free = end`.'

  - type: multiple-choice
    id: pick-greedy-coins
    concept: algo.greedy-choice
    difficulty: 3
    code: |
      function greedyCoins(amount, coins) {
        const used = [];
        for (const coin of coins) {
          while (amount >= coin) {
            amount -= coin;
            used.push(coin);
          }
        }
        return used;
      }
      greedyCoins(10, [6, 5, 1]);
    language: js
    question: Is "largest coin first" safe for coins 6, 5 and 1?
    choices:
      - text: No, it pays 10 with five coins, not two
        correct: true
        feedback: >-
          Right. It grabs the 6, then only ones fit. Two fives would do.
      - text: Yes, larger coins always mean fewer coins
        feedback: >-
          That holds for everyday coins, which is why it feels right. Try 10 here.
      - text: Yes, as long as the coins are sorted
        feedback: >-
          They are sorted, largest first. The rule itself is what fails.
      - text: No, the loop never ends
        feedback: >-
          The 1 always fits, so it finishes. It finishes with too many coins.

  - type: explain-back
    id: explain-greedy-safe
    concept: algo.greedy-choice
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      The interviewer asks why `most_talks` sorts by end time, not start time. Defend your
      choice.
    rubric:
      - The talk that ends first leaves the most time; any best plan can swap it in.
      - Sorting by start fails, because one early, long talk can block many short ones.
      - The sort costs O(n log n), then one pass is O(n).
    modelAnswer: >-
      Take any best plan. Its first talk ends no earlier than the one that ends first. So
      swapping them clashes with nothing and keeps the count. Repeat for the rest. Sorting
      by start fails because an early, long talk can block several short ones. The sort is
      O(n log n) and the pass is O(n), so O(n log n) overall.

recap:
  - Sort intervals by start, then merge them in one pass.
  - Sort by end to pick the most non-overlapping intervals.
  - Trust a greedy only when you can argue the swap.
recall:
  - id: card-why-sort-start
    concept: algo.interval-sorting
    front: Why does sorting by start let you merge intervals in one pass?
    back: >-
      Overlapping intervals end up next to each other, so each one only needs checking
      against the last merged block.
  - id: card-nested-interval
    concept: algo.interval-sorting
    front: Why does a merge need `Math.max` when it stretches the last block?
    back: >-
      An interval can sit wholly inside the last block. Taking its end would shrink the block.
  - id: card-activity-selection
    concept: algo.greedy-choice
    front: Which rule picks the most non-overlapping meetings?
    back: >-
      Sort by end time, then take each meeting that starts at or after the last taken one ends.
  - id: card-greedy-fails
    concept: algo.greedy-choice
    front: How do you check whether a greedy rule is safe?
    back: >-
      Argue that any best answer can swap in the greedy choice without getting worse. Or find
      a small counterexample, like coins 6, 5 and 1 for 10.

references:
  - kind: docs
    title: Interval scheduling
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Interval_scheduling
    note: The earliest-finish-time greedy and why it's optimal.
    primary: true
    verified: true

deepDive: >-
  **Meeting rooms.** "How many rooms do these meetings need?" is the classic follow-up. Put
  all start times in one sorted array and all end times in another. Walk the starts with a
  pointer into the ends: when a meeting starts before the earliest unfinished one ends, you
  need another room; otherwise a room frees up. The largest number open at once is the
  answer, in O(n log n). A min-heap of end times gives the same answer.


  **Touching intervals.** Always ask whether `[1, 3]` and `[3, 5]` overlap. For bookings with
  exclusive ends they don't clash, yet you may still merge them into one busy block. The
  whole difference is `<` against `<=`, and hidden tests love it.


  **The exchange argument.** The informal swap in this lesson is how greedy proofs go: take
  an optimal answer, show you can exchange its first choice for the greedy one without
  making it worse, then repeat. If you can't make the swap work, try a tiny counterexample
  before coding. Coins 6, 5 and 1 break the largest-first rule; standard currency coins
  happen not to, which is why the rule feels right.


  **The complexity line.** A task that says O(n log n) is hinting at a sort. One that says
  O(n) with intervals usually means they arrive sorted already, so don't sort again.
