deepDive: >-
  `forEach` calls a function for every item and returns nothing. It can't stop early: a
  `return` inside the callback ends only that one call. When you want to stop at the first
  match, use `find`, `some`, or a `for...of` loop with `break`.


  A comparator returns a negative number to put `a` first, a positive one to put `b` first,
  and zero to keep their order. `sort` has been stable since ES2019, so items that compare
  as equal keep their original order. Sort by name, then by score, and names stay in order
  within each score.


  The default comparison uses UTF-16 code units, not the rules of any language, so `"Z"`
  sorts before `"a"`. For text people read, use `a.localeCompare(b)` as the comparator.


  `push`, `pop`, `reverse` and `splice` also change the array in place. `toReversed`,
  `toSpliced` and `with(index, value)` are their copying partners.
