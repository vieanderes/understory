term: operator
aka: [arithmetic operator, comparison operator]
short: A symbol that does something with values, such as adding two numbers or comparing them.
explain: |
  `+`, `-`, `*`, `/` and `%` do sums. `>`, `<` and `===` compare, and give `true` or
  `false`. Even `=` is one: it puts a value into a variable.

  They run in a fixed order, like in maths. `*` and `/` go before `+` and `-`, and brackets
  go first. A wrong order gives a wrong answer with no error. And `+` has two jobs: it adds
  numbers but joins strings.
analogy: The buttons on a calculator. The numbers are the values, and the buttons say what to do with them.
example:
  language: js
  code: |
    console.log(2 + 3 * 4);   // 14, not 20
    console.log((2 + 3) * 4); // 20
    console.log(10 % 3);      // 1, the remainder
    console.log("2" + 3);     // 23, joined as text
usage: The total is wrong because of operator order, so put brackets round the price and the delivery.
related: [expression, string, boolean, strict-equality]
level: 1
lessons: [basics.operators]
