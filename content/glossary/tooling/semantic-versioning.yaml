term: semantic versioning
aka:
  - semver
short: A three-number version scheme where each number says what kind of change a release contains.
explain: |
  A library goes from 2.4.1 to 3.0.0. Should you upgrade without reading anything? The
  numbers are meant to tell you.

  The format is MAJOR.MINOR.PATCH. A patch fixes bugs, a minor adds features without
  breaking anything, a major may break your code. Ranges lean on that promise: `^2.4.1`
  accepts any 2.x from 2.4.1 up, `~2.4.1` only 2.4.x. It's a promise, not a guarantee,
  and below 1.0 nearly anything can change.
analogy: The labels on a road sign. "Minor works" and "Road closed" tell you whether to read the details before you set off.
example:
  language: json
  code: |
    {
      "dependencies": {
        "zod": "^3.23.8",
        "date-utils": "~2.4.1",
        "chart-kit": "5.0.2"
      }
    }
usage: That release removed a function, so it should have been a major under semantic versioning.
twin:
  term: lockfile
  difference: Semantic versioning is the numbering promise that lets you accept a range of versions. A lockfile records the exact versions you actually got.
related:
  - lockfile
  - package-manager
level: 2
lessons:
  - tooling.node-and-npm
