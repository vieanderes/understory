term: cohesion
short: How closely the parts of one module serve a single purpose.
explain: |
  A `utils` file with date helpers, price rounding and a retry wrapper has low cohesion:
  nothing in it belongs together. A `pricing` module where everything is about prices has
  high cohesion.

  High cohesion means one reason to change. When the tax rules change, you open one folder.
  Low cohesion scatters every change and grows files nobody owns.
analogy: A toolbox with one drawer per job, versus the kitchen drawer of random things every home has.
usage: The cohesion is low here, because half this file is billing and half is email.
twin:
  term: coupling
  difference: Cohesion is inside one module, how well its parts belong together. Coupling is between modules, how much a change in one forces a change in another.
related:
  - coupling
  - information-hiding
level: 2
lessons:
