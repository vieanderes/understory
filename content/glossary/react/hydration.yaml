term: hydration
aka:
  - hydrate
short: React in the browser attaching click handlers and state to HTML the server already sent.
explain: |
  The server sends finished HTML, so the page shows at once. But it can't respond to clicks
  yet. When the JavaScript arrives, React walks the existing HTML and wires it up, instead of
  building it again.

  React expects the browser's first draw to match the server's HTML exactly. Read the time,
  a random number or `window` while drawing and the two differ: a hydration mismatch. Read
  browser-only values in an effect instead.
analogy: Bringing a waxwork to life. The figure's already standing there; now it starts to move.
example:
  language: tsx
  code: |
    // mismatch: the server and browser clocks differ
    function Stamp() {
      return <p>{new Date().toLocaleTimeString()}</p>;
    }
usage: That's a hydration error, because the server renders a different date format from the browser.
related:
  - server-component
  - client-component
  - effect
level: 3
lessons:
  - next.server-and-client-components
