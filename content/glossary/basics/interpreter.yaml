term: interpreter
aka: [interpreted language, bytecode, JIT compilation, just-in-time compilation, JIT]
short: A program that reads your code and carries it out step by step while it runs.
explain: |
  Instead of translating everything first, a program can read your code and do what it
  says, line by line. Python and JavaScript started this way. You change a file and run it
  at once, with no build step.

  The price is speed, and mistakes surface only when the broken line actually runs.

  Modern engines blur the line. V8 first turns JavaScript into bytecode and interprets it. Then it compiles the busiest
  functions to machine code mid-run: JIT compilation.
  If its guesses about types turn out wrong, it falls back to the slower path.
analogy: A live interpreter at a meeting, translating each sentence as it's spoken rather than the whole speech beforehand.
example:
  language: bash
  code: |
    $ python report.py   # read and run, line by line
    Total: 42
    Traceback (most recent call last):
      File "report.py", line 9, in <module>
    NameError: name 'totl' is not defined
usage: The typo on line 9 only showed up when the interpreter reached it, after eight lines had run.
twin:
  term: compiler
  difference: An interpreter runs the code as it reads it. A compiler translates the whole program first, so many mistakes show before anything runs.
related: [compiler, runtime, runtime-error, traceback]
level: 2
lessons: [cs.what-a-computer-does, cs.memory-and-runtimes]
