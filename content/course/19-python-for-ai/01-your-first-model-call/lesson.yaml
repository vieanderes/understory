id: pyai.first-model-call
title: Your first model call
objective: "Call a language model from Python with an SDK, and read the text, stop reason and token counts in its reply."
level: essential
minutes: 10
concepts: [pyai.llm-api, pyai.messages-api]
prerequisites: [python.type-hints]
opening:
  text: >-
    You'll send a question to a language model from Python and read its answer. Every AI
    feature you'll build starts with this call.

steps:
  - type: prose
    id: what-a-model-is
    body: >-
      A **language model**, or **LLM**, is a program that reads text and writes the text
      most likely to come next. Ask it a question, and the likely next text is an answer.


      The big ones are far too large for your laptop. They run on a provider's servers,
      and you pay per use. Your code sends them text over the internet and gets text back.

  - type: prose
    id: api-and-sdk
    body: |-
      A provider's **API** is the set of requests its servers accept. An **SDK** is a
      library that makes those requests for you, so you write ordinary Python:

      ```python
      import anthropic

      client = anthropic.Anthropic()
      response = client.messages.create(
          model="claude-opus-5-5",
          max_tokens=1024,
          messages=[{"role": "user", "content": "Capital of France?"}],
      )
      ```

      `messages` is the conversation so far. Here it's one message, from the `"user"`.

  - type: prose
    id: tokens-and-keys
    body: >-
      Models read and write **tokens**: chunks of text, often a short word or part of one.
      You pay per token, in and out. `max_tokens` caps how many the reply may use.


      `Anthropic()` finds your **API key**, the secret that proves who pays, in the
      `ANTHROPIC_API_KEY` environment variable. Other providers' SDKs use other names, but
      the shape is the same.

  - type: fill-blank
    id: fill-first-call
    concept: pyai.messages-api
    difficulty: 1
    language: python
    prompt: Complete the call so it asks the model one question.
    template: |
      response = client.messages.{{1}}(
          model="claude-opus-5-5",
          {{2}}=500,
          messages=[{"role": {{3}}, "content": "Name three rivers in Spain."}],
      )
    blanks:
      - key: '1'
        answer: create
      - key: '2'
        answer: max_tokens
      - key: '3'
        answer: '"user"'
    bank: [create, send, max_tokens, max_words, '"user"', '"me"']

  - type: prose
    id: reading-the-reply
    body: |-
      The reply is an object. Its `content` is a **list of blocks**, and each block has a
      `type`. Text lives in blocks whose type is `"text"`:

      ```python
      for block in response.content:
          if block.type == "text":
              print(block.text)

      print(response.stop_reason)          # end_turn
      print(response.usage.output_tokens)  # 14
      ```

      Why a list? A reply can mix text with other kinds of block, as later lessons show.
      `stop_reason` says why it stopped, and `usage` counts the tokens you pay for.

  - type: ai-review
    id: review-reply-text
    concept: pyai.messages-api
    difficulty: 2
    language: python
    request: Ask the model for a haiku and print it.
    flawClass: hallucinated-api
    code: |
      import anthropic

      client = anthropic.Anthropic()
      response = client.messages.create(
          model="claude-opus-5-5",
          max_tokens=500,
          messages=[{"role": "user", "content": "A haiku about rain."}],
      )
      print(response.text)
    prompt: >-
      An assistant wrote this. It reads well, but the first run crashed with an
      `AttributeError`. Tap the line at fault.
    lines: [9]
    reasons:
      - text: The reply has no `text`, only `content` blocks
        correct: true
        feedback: >-
          Right. The text sits in the reply's text blocks.
      - text: '`max_tokens` is too small for a haiku'
        feedback: >-
          500 tokens is plenty for a haiku. The crash comes from reading the reply.
      - text: The client needs the API key passed in
        feedback: >-
          `Anthropic()` reads the key from the environment. The request itself worked.
    verify:
      question: How could a test have caught this before the first real run?
      choices:
        - text: A fake reply shaped like the SDK's, with `content` blocks
          correct: true
          feedback: >-
            Yes. The fake has no `text`, so the test fails the same way.
        - text: A test that raises `max_tokens`
          feedback: >-
            The token limit was never the problem. The test needs a reply with the real shape.
        - text: A test that checks the API key is set
          feedback: >-
            The request worked, so the key was fine. The crash came after, reading the reply.
    fix: |
      import anthropic

      client = anthropic.Anthropic()
      response = client.messages.create(
          model="claude-opus-5-5",
          max_tokens=500,
          messages=[{"role": "user", "content": "A haiku about rain."}],
      )
      for block in response.content:
          if block.type == "text":
              print(block.text)

  - type: prose
    id: no-network-here
    body: >-
      One honest note. The code you run in this course never reaches the internet, so no
      real model answers it.


      Instead the tests hand your function a **fake client**. It has the same
      `messages.create` and returns a reply recorded from a real model, with the same
      blocks. That's also how professionals test AI code: fast, free and the same every
      time.

  - type: code-challenge
    id: write-ask
    concept: pyai.messages-api
    difficulty: 2
    language: python
    starter: starter.py
    solution: solution.py
    tests: tests.py
    prompt: >-
      Write `ask(client, question)`. Send `question` as one user message with
      `client.messages.create`, using `MODEL` and a `max_tokens` of 1024.


      Return the text of the reply: every text block's `text`, joined in order. Skip
      blocks of any other type. Example: a reply with one text block `Paris.` returns
      `"Paris."`.
    hints:
      - The call is the one from this lesson, with `question` in place of the fixed text.
      - '`response.content` is a list. Keep only the blocks whose `type` is `"text"`.'
      - 'A generator inside `"".join(...)` joins the texts: `"".join(b.text for b in ...)`.'

  - type: multiple-choice
    id: pick-key-home
    concept: pyai.llm-api
    difficulty: 2
    question: A web page lets visitors ask a model questions. Where should the API key live?
    choices:
      - text: On your server, which calls the model for the page
        correct: true
        feedback: >-
          Yes. The browser talks to your server, and only your server holds the key.
      - text: In the page's JavaScript, so the browser calls directly
        feedback: >-
          Anyone can read a page's code. They'd copy the key and spend your money.
      - text: In the Python file, as a string
        feedback: >-
          It works, until the file lands in Git. Keys belong in the environment.
      - text: In the question the page sends
        feedback: >-
          The key proves who pays. Sent from the browser, it's readable by every visitor.

  - type: explain-back
    id: explain-one-call
    concept: pyai.llm-api
    difficulty: 2
    audience: teammate
    kind: explain
    prompt: >-
      In your own words, what happens between `client.messages.create(...)` and the text
      you print?
    rubric:
      - The SDK sends the messages to the provider's servers, with your key.
      - The model there writes the reply token by token, up to `max_tokens`.
      - The reply comes back as blocks, and you read the text blocks.
    modelAnswer: >-
      The SDK turns my call into a request to the provider. It carries my API key from the
      environment. On their servers the model reads the messages. It writes a reply, token by
      token, until it's done or hits `max_tokens`. The reply comes back as a list of
      blocks with a stop reason and token counts. I loop over the blocks and print the text
      ones.

recap:
  - Call a model with `client.messages.create`, a model name, `max_tokens` and messages.
  - Read the reply's text from its text blocks, and check `stop_reason` and `usage`.
  - Keep the API key in the environment, on a server, never in the browser.

recall:
  - id: card-what-llm
    concept: pyai.llm-api
    front: What does a language model do, and where does it usually run?
    back: >-
      It reads text and writes the text most likely to come next. The large ones run on a
      provider's servers, reached through an API and paid per token.
  - id: card-read-text
    concept: pyai.messages-api
    front: How do you get the text out of a reply from `messages.create`?
    back: >-
      Loop over `response.content` and read `block.text` from each block whose `type` is
      `"text"`.
  - id: card-max-tokens
    concept: pyai.messages-api
    front: What does `max_tokens` do?
    back: >-
      It caps how many tokens the reply may use. A reply that hits it stops early, with
      `stop_reason` set to `"max_tokens"`.
  - id: card-key
    concept: pyai.llm-api
    front: Why must an API key never sit in a web page's code?
    back: >-
      Anyone can read a page's code, copy the key and spend your money. The key stays on
      your server, read from the environment.

references:
  - kind: docs
    title: Messages API
    authors: Anthropic
    venue: Claude Platform documentation
    url: https://platform.claude.com/docs/en/api/messages
    note: The request and reply shapes, content blocks, stop reasons and usage.
    primary: true
    verified: true
  - kind: source
    title: anthropic-sdk-python
    authors: Anthropic
    venue: GitHub
    url: https://github.com/anthropics/anthropic-sdk-python
    note: The Python SDK, with the client, environment variables, retries and errors.
    primary: true
    verified: true

deepDive: >-
  **What the SDK sends.** Under the hood `messages.create` is one HTTPS `POST` to
  `/v1/messages`, with your key in an `x-api-key` header and the arguments as JSON. The
  SDK adds retries, timeouts and typed objects. You could send the same request with
  `curl`, which is handy for checking a bug isn't in your own code.


  **Two meanings of model.** Next lesson you'll meet Pydantic, where a "model" is a class
  that describes data. Same word, different thing. When it matters, this course says
  "language model" or "Pydantic model".


  **Why tokens, not words.** A fixed vocabulary of sub-word pieces lets a model spell any
  word, including names and code it never saw whole. It's also why prices, limits and
  context sizes are counted in tokens. Chapter 20 opens with how that works.
