deepDive: >-
  No phone ran in this lesson: no Xcode project, no Flutter SDK. Every claim about the
  frameworks rests on their own documentation in Read next. The endpoint challenge ran in
  Node with a fake model.


  The update's limit is in Expo's own words: an update changes an app's "non-native pieces
  (such as JS, styling, and images)". Expo matches updates to builds by a runtime version, so
  a correctly configured project never sends an update to a build it can't run. The failure
  in the review is what happens when that safeguard is set up wrongly.


  Keys in apps are an old lesson that AI features made expensive. Tools that unpack an app
  and list its strings are free. Once a key is out, rotate it at the provider at once, and
  accept that the app versions holding it will fail until users update. Putting your server
  in the middle also lets you add rate limits per user, which the backend chapter covers.


  Flutter's Dart compiles ahead of time for release builds. React Native ships a JavaScript
  engine, Hermes, inside the app. A Capacitor app inherits the web view's start-up cost.
