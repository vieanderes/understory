term: end-to-end test
aka: [e2e test, E2E, end to end testing, browser test]
short: A test that drives the whole app through a real browser, clicking and typing as a user would.
explain: |
  The only way to know sign-up really works is to sign up: open the page, fill the form,
  press the button, see the welcome screen. A tool like Playwright does exactly that, in a
  real browser, against a running app.

  They catch what nothing else does: a broken route, a button hidden behind a banner, a
  server and front end that disagree. They're also the slowest and the most likely to be
  flaky. Keep a few for the journeys that must never break, find elements by role and label,
  and never wait with a fixed sleep.
analogy: A mystery shopper. They don't inspect the stockroom; they walk in, buy something and see whether it all works.
example:
  language: ts
  code: |
    test('a visitor can sign up', async ({ page }) => {
      await page.goto('/signup');
      await page.getByLabel('Email').fill('reader@example.com');
      await page.getByRole('button', { name: 'Create account' }).click();
      await expect(page.getByRole('heading', { name: 'Welcome' })).toBeVisible();
    });
usage: Checkout is the one flow worth an end-to-end test; the rest is covered lower down.
related: [integration-test, flaky-test, test-pyramid]
level: 1
lessons: [testing.e2e-playwright]
