id: pro.amateur-tells
title: Amateur tells
objective: Spot the signs that give amateur code away, such as leftover logs, vague names, inconsistency and copy-paste, and clean them up.
level: essential
minutes: 9
concepts: [pro.amateur-tells, pro.consistency, pro.leaving-no-trace]
prerequisites: [tooling.quality-gates, clean.comments-and-constants]
opening:
  text: >-
    You'll learn the small signs a reviewer spots in seconds, and how to remove them. They
    decide whether your code reads as careful work or a first draft.

steps:
  - type: bug-hunt
    id: pick-first-flag
    concept: pro.amateur-tells
    difficulty: 1
    language: js
    code: |
      function applyDiscount(cart, discount) {
        console.log("HERE!!!", cart);
        const discounted = cart.total - discount;
        return discounted;
      }
    prompt: This works. A teammate still asks for one change. Tap the line they'd flag.
    lines: [2]
    reasons:
      - text: Debug output was left in
        correct: true
        feedback: >-
          Yes. A leftover `console.log` is the classic giveaway.
      - text: '`const` should be `let`'
        feedback: >-
          `discounted` never changes, so `const` is right. Line 2 is the one that jars.
      - text: Returning a variable is wasteful
        feedback: >-
          Naming a value before returning it is fine. The shouting log is what's noticed.
    fix: |
      function applyDiscount(cart, discount) {
        const discounted = cart.total - discount;
        return discounted;
      }

  - type: prose
    id: the-tells
    body: |-
      Before a pull request is merged, a teammate reads its changes. That's a **code
      review**. Amateur code rarely breaks. It shows nobody read it twice. The usual
      **amateur tells**:

      - debug output left in, like `console.log("HERE")`
      - commented-out code
      - vague names: `data`, `temp`, `stuff`, `i2`
      - unnamed numbers, like `0.9`
      - blocks copied and half edited

  - type: bug-hunt
    id: predict-copy-paste
    concept: pro.amateur-tells
    difficulty: 2
    language: js
    code: |
      const standard = { price: 4.99, label: "Standard" };
      const express = { price: 9.99, label: "Standard" };
      console.log(`${express.label}: £${express.price}`);
    prompt: 'This should print `Express: £9.99`. It prints `Standard: £9.99`. Tap the line at fault.'
    lines: [2]
    reasons:
      - text: The line was copied and half edited
        correct: true
        feedback: >-
          Right. The price was changed, and the label was left behind.
      - text: The message reads the wrong object
        feedback: >-
          It reads `express`, as it should. The `express` object holds the wrong label.
      - text: The price should be text, not a number
        feedback: >-
          A number prints fine inside a template string. The label is the problem.
    fix: |
      const standard = { price: 4.99, label: "Standard" };
      const express = { price: 9.99, label: "Express" };
      console.log(`${express.label}: £${express.price}`);

  - type: prose
    id: consistency
    body: |-
      **Consistency** means one way of doing each thing across the codebase. One naming
      style, one quote style, one way to loop.

      Pros don't keep it by memory. You met the tools in the last lesson: a **formatter**
      such as Prettier fixes spacing and quotes, and a **linter** such as ESLint flags risky
      patterns.

  - type: multiple-choice
    id: pick-consistency-fix
    concept: pro.consistency
    difficulty: 2
    language: js
    code: |
      function getUser(id) { return users.find((u) => u.id == id) }
      function fetch_orders(userId) {
        return orders.filter((order) => order.userId === userId);
      }
    question: What's the professional way to fix this file's style?
    choices:
      - text: One naming style, and a formatter for the layout
        correct: true
        feedback: >-
          Yes. Pick one style, then let a tool keep every file that way.
      - text: Fix each line by hand before review
        feedback: >-
          It helps once, then drifts again. A tool keeps it the same every time.
      - text: Leave it, since both functions work
        feedback: >-
          They work, but mixed styles make a reader wonder what else was rushed.

  - type: ai-review
    id: review-leftover-test-value
    concept: pro.leaving-no-trace
    difficulty: 3
    language: js
    request: Make shipping free for orders of £50 or more.
    flawClass: logic
    code: |
      function shippingCost(order) {
        const FREE_SHIPPING_FROM = 50;
        order.total = 60; // quick check, remove
        if (order.total >= FREE_SHIPPING_FROM) {
          return 0;
        }
        return 4.99;
      }
    prompt: >-
      An assistant wrote this, and it tried the code out. Now every order ships free, even
      a £5 one. Tap the line at fault.
    lines: [3]
    reasons:
      - text: A value set for trying it out was left in
        correct: true
        feedback: >-
          Yes. Leftover debug code is the worst tell: it changes what runs.
      - text: '`>=` should be `>`'
        feedback: >-
          "£50 or more" needs `>=`. And a £5 order fails either way. Look at line 3.
      - text: '`4.99` needs a name too'
        feedback: >-
          Fair, that's a tell. But it doesn't make orders free. Line 3 does.
    verify:
      question: Which test would have caught this before review?
      choices:
        - text: A £5 order costs £4.99
          correct: true
          feedback: >-
            Yes. Line 3 forces 60, so it returns 0 and fails.
        - text: A £60 order ships free
          feedback: >-
            It passes with the bug in, because line 3 sets the total to 60 anyway.
        - text: An order of exactly £50 ships free
          feedback: >-
            A good edge to test, but it passes too. Every order becomes 60.
    fix: |
      const FREE_SHIPPING_FROM = 50;
      const STANDARD_SHIPPING = 4.99;

      function shippingCost(order) {
        if (order.total >= FREE_SHIPPING_FROM) {
          return 0;
        }
        return STANDARD_SHIPPING;
      }

  - type: multiple-choice
    id: pick-unrelated-change
    concept: pro.leaving-no-trace
    difficulty: 3
    question: >-
      Your change fixes a date bug. It also reformats 40 lines in an unrelated file. What
      do you do?
    choices:
      - text: Move the reformat into its own change
        correct: true
        feedback: >-
          Yes. The reviewer sees only the fix, and each change can be undone alone.
      - text: Keep both, since the reformat is harmless
        feedback: >-
          Harmless, but it hides the real fix among 40 lines the reviewer must still read.
      - text: Mention it in a comment in the code
        feedback: >-
          A comment can't shrink what the reviewer reads. Split the change instead.

  - type: code-challenge
    id: write-tidy-order-lines
    concept: pro.leaving-no-trace
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      The two functions work, but they print debug output, mix naming styles and repeat the
      same sum. Rewrite them as `orderLine(item)` and `totalLine(items)`, sharing a
      `lineTotal(item)` that returns `price * qty`.


      `orderLine` gives `Tea: £7.50`, and `totalLine` gives `Total: £10.70`, or
      `Total: £0.00` for no items. Nothing should be printed.
    hints:
      - Look for what's repeated, what's printed, and which names say nothing.
      - '`item.price * item.qty` appears twice. That''s your `lineTotal`.'
      - 'Start with `function lineTotal(item) { return item.price * item.qty; }`'

  - type: explain-back
    id: explain-why-tells-matter
    concept: pro.amateur-tells
    difficulty: 3
    audience: newcomer
    kind: explain
    prompt: >-
      A newcomer asks why a reviewer fussed over a leftover `console.log` that breaks
      nothing. Explain why it changes how the reviewer reads the rest of the change.
    rubric:
      - It shows the change wasn't reread before review.
      - The reviewer then trusts the rest less and checks every line harder.
      - Small tells also hide real problems among noise, like a copied block half edited.
    modelAnswer: >-
      It's a sign nobody read the change once more before sending it. If that slipped
      through, what else did? The reviewer starts doubting every line, and the review gets
      slower and harsher. Removing the tells lets them focus on what the code does.

recap:
  - Spot the tells a reviewer sees first, from leftover logs to half-edited copies.
  - Keep one style everywhere, and let a formatter and a linter hold it.
  - Leave no trace in a finished change, and keep unrelated edits apart.
recall:
  - id: card-tells
    concept: pro.amateur-tells
    front: Name four tells that make code look amateur.
    back: >-
      Leftover debug output, commented-out code, vague names like `data` or `temp`, and
      copied blocks only half edited. Unnamed numbers count too.
  - id: card-copy-paste
    concept: pro.amateur-tells
    front: Why is copy-paste a common source of bugs?
    back: >-
      The copy is edited in some places and not others, so one value quietly keeps the old
      meaning.
  - id: card-consistency
    concept: pro.consistency
    front: How do professional teams keep a codebase's style consistent?
    back: >-
      They agree one style and let tools enforce it: a formatter for layout, a linter for
      risky patterns.
  - id: card-no-trace
    concept: pro.leaving-no-trace
    front: What should a finished change never contain?
    back: >-
      Debug output, stray files, unused imports or variables, and edits unrelated to its
      purpose.

references:
  - kind: docs
    title: How to do a code review
    authors: Google
    venue: Google Engineering Practices
    url: https://google.github.io/eng-practices/review/reviewer/
    note: What reviewers look for, from design down to style.
    primary: true
    verified: true
  - kind: docs
    title: Why Prettier?
    authors: Prettier contributors
    venue: Prettier docs
    url: https://prettier.io/docs/why-prettier
    note: Why teams hand formatting to a tool instead of arguing about it.
    verified: true
  - kind: docs
    title: no-console
    authors: ESLint contributors
    venue: ESLint docs
    url: https://eslint.org/docs/latest/rules/no-console
    note: The lint rule that catches leftover console calls.
    verified: true

deepDive: >-
  Most teams catch tells with tools long before a person reads the change. A formatter
  removes every layout choice, so reviews never discuss spacing. Lint rules such as
  `no-console`, `no-unused-vars` and `eqeqeq` catch debug output, dead variables and loose
  comparisons. A pre-commit hook runs both before a commit is made, and the same checks run
  again in continuous integration.


  The habit tools can't replace is rereading your own diff before you ask for review. Read
  it as the reviewer will: top to bottom, asking of each line why it's there. Most tells
  disappear in that one pass.
