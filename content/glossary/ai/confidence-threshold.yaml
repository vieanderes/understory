term: confidence threshold
aka: [decision threshold, confidence band, confidence bands, cut-off]
short: The score above which a system acts on a model's prediction by itself.
explain: |
  A classifier gives a probability; code needs a decision. A threshold turns one into the
  other. Two thresholds make three bands: act on your own, ask a person, or refuse.

  Where the lines go is a business decision written as a number. It weighs the cost of a
  wrong automatic action against a minute of someone's time. Pick them from labelled past
  cases, not by feel, and pick again when the model or traffic changes.
analogy: A bouncer's rules. Clearly old enough, in. Clearly not, out. Unsure, ask for ID.
usage: Raise the confidence threshold for auto-closing tickets to 0.95; a wrong close is worse than a slow one.
related: [calibration, precision, recall, human-in-the-loop]
level: 2
lessons: [aisys.thresholds-and-calibration, aisys.reading-documents]
