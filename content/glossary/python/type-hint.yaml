term: type hint
aka:
  - Python type hint
short: A note in Python code saying what type a variable, parameter or return value should be.
explain: |
  Six months later, what does `load(data)` expect? A path? A dict? The code runs either
  way until it doesn't.

  Writing `def load(path: str) -> list[Order]:` answers the question in the code. Python
  itself ignores these notes at run time. A checker such as mypy or pyright reads them and finds mistakes before you run anything. Editors use them for autocomplete.
  Libraries like Pydantic go further and validate real data against them.
analogy: The label on a jar in the pantry. It doesn't stop anyone putting salt in the sugar jar, but whoever reads labels will notice.
example:
  language: python
  code: |
    def total(prices: list[float], discount: float = 0) -> float:
        return sum(prices) * (1 - discount)

    total(["4.50"])   # runs, then fails; the checker flags it first
usage: The type hint says it returns a list, but that branch returns None.
