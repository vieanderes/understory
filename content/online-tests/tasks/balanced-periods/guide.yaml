approach: >-
  Keep a running total of the changes. A period from day P to day Q totals K exactly when
  the running total at Q minus the running total just before P equals K. So walk the array
  once, and at each day ask a map how many earlier running totals equal the current one
  minus K. Add that count, then record the current total in the map.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Start at the bottom. **N up to 100,000** and **efficient** mean the performance tests
      use big arrays. There are about five billion periods at that size, so checking each
      one will time out.

      Then note the odd rule: past a billion periods, return -1.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words at the top of the file. Saying it in one line proves
      you know what to count. It also tells the reviewer what you meant.
    code:
      ts: |-
        // Count the runs of consecutive days whose changes add up to exactly K (-1 past a billion).
      python: |-
        # Count the runs of consecutive days whose changes add up to exactly K (-1 past a billion).
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to trip you up:

      - a single day, which is a period on its own;
      - all zeros with K = 0, where periods overlap heavily;
      - negative changes and a negative K;
      - no period matches at all.

      Paste them into test-input.txt now.
    input:
      - "([4], 4)"
      - "([0, 0, 0, 0], 0)"
      - "([-1, -1, -1], -2)"
      - "([1, 2, 3], 100)"
  - kind: ask-ai
    title: Confirm one rule with the assistant
    minutes: 1
    body: |-
      A single day counts only if P may equal Q. The statement says so, but a quick check
      costs seconds and shows the reviewer you read carefully. Ask about the rule, never for
      the answer.
    prompt: >-
      Without solving it: the task says 0 <= P <= Q < N, so a single day (P = Q) counts as a
      period. Is that right? One sentence.
    expect: The assistant agrees, so a one-day match adds one to the count.
  - kind: write
    title: Bank a correct version first
    minutes: 4
    body: |-
      Type the direct version yourself: fix a start day, then extend the end and keep a
      running sum. It is O(N²), so the big tests will time out. That is fine for now: it
      scores the correctness tests and gives you something to compare against.
    code:
      ts: |-
        // Count the runs of consecutive days whose changes add up to exactly K (-1 past a billion).
        // First pass: every start, every end, O(N²).
        function solution(A: number[], K: number): number {
            let count = 0;
            for (let p = 0; p < A.length; p++) {
                let total = 0;
                for (let q = p; q < A.length; q++) {
                    total += A[q];
                    if (total === K) count++;
                }
                if (count > 1_000_000_000) return -1;
            }
            return count;
        }
      python: |-
        # Count the runs of consecutive days whose changes add up to exactly K (-1 past a billion).
        # First pass: every start, every end, O(N²).
        def solution(A, K):
            count = 0
            for p in range(len(A)):
                total = 0
                for q in range(p, len(A)):
                    total += A[q]
                    if total == K:
                        count += 1
                if count > 1_000_000_000:
                    return -1
            return count
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Then check each returned value for your
      own cases against the rule.
    expect: >-
      Two OKs, then 1 for the single day, 10 for the zeros, 2 for the negative case and 0 for
      the case with no match.
  - kind: plan
    title: Turn "sum of a range" into "difference of two totals"
    minutes: 3
    body: |-
      A range sum is the running total at its end minus the running total before its start.
      So at each day you want to know: how many earlier running totals equal today's total
      minus K?

      A map from running total to how often you have seen it answers that at once. Seed it
      with 0 seen once, for periods that start on day 0.
  - kind: ask-ai
    title: Ask a syntax question, not for the code
    minutes: 1
    body: |-
      The map needs a default of 0 for totals you have not seen. That is pure syntax, so it
      is a fair question. It saves you a failed run.
    prompt: >-
      One line each: in TypeScript, what does Map.get return for a missing key, and in
      Python, which dict method returns a default for a missing key?
    expect: "undefined in TypeScript (so use ?? 0), and dict.get(key, 0) in Python."
  - kind: optimise
    title: Replace the double loop with the running-total map
    minutes: 5
    body: |-
      Write the one-pass version yourself: it is the core of the task. Look up before you
      record, or a period of zero days sneaks in. Check the billion limit inside the loop so
      the count never grows without bound.
    code:
      ts: |-
        // Count the runs of consecutive days whose changes add up to exactly K (-1 past a billion).
        // A period (P, Q) totals K when prefix[Q + 1] - prefix[P] === K, so for each running
        // total, count the earlier running totals equal to it minus K: O(N) time, O(N) space.
        function solution(A: number[], K: number): number {
          const LIMIT = 1_000_000_000;
          const seen = new Map<number, number>([[0, 1]]);
          let prefix = 0;
          let count = 0;
          for (const change of A) {
            prefix += change;
            count += seen.get(prefix - K) ?? 0;
            if (count > LIMIT) return -1;
            seen.set(prefix, (seen.get(prefix) ?? 0) + 1);
          }
          return count;
        }
      python: |-
        # Count the runs of consecutive days whose changes add up to exactly K (-1 past a billion).
        # A period (P, Q) totals K when prefix[Q + 1] - prefix[P] == K, so for each running
        # total, count the earlier running totals equal to it minus K: O(N) time, O(N) space.
        def solution(A, K):
            limit = 1_000_000_000
            seen = {0: 1}
            prefix = 0
            count = 0
            for change in A:
                prefix += change
                count += seen.get(prefix - K, 0)
                if count > limit:
                    return -1
                seen[prefix] = seen.get(prefix, 0) + 1
            return count
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write more test inputs
    minutes: 2
    body: |-
      Variety is where the assistant is quick. Ask for inputs only: you decide what is
      right. Run them against both versions if you kept the slow one in a scratch file, and
      the results must match.
    prompt: >-
      Give me 5 test inputs for solution(A, K), one per line, in the format ([3, -1, 2], 2).
      Cover a K that only the whole array reaches, alternating +1 and -1 with K = 0, large
      values near 10000 and -10000, and K larger than any possible sum. Inputs only, no
      answers and no code.
    expect: Five lines to paste into test-input.txt, each returning a value you can explain.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite, so the code stays yours. Pay attention to anything
      about the order of the lookup and the insert.
    prompt: >-
      Review my current solution for correctness, the -1 limit and time complexity. List any
      problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and the slow version if it is still around. Check the header
      comment states O(N). Then submit.

      In the report, the all-zeros performance test is the one that proves the -1 rule.
