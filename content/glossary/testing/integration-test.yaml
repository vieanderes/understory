term: integration test
aka: [integration testing]
short: A test that checks several real parts work together, such as your code with an actual database.
explain: |
  Each piece can pass on its own and still fail together. The SQL has a typo, the column
  is called something else, the transaction never commits. Only running them together
  shows it.

  These tests call real things your code owns, typically a real database started in a
  container, and still fake services you don't own, like a payment provider. They're
  slower than unit tests and catch a different class of bug. A test that mocks the
  database isn't one of these, whatever its file is called.
analogy: Plugging the new kettle into the actual socket in your kitchen, not only checking the kettle on the bench.
example:
  language: ts
  code: |
    test('saves a booking and reads it back', async () => {
      const db = await startTestDatabase(); // real Postgres in a container
      await createBooking(db, { roomId: 7, day: '2026-05-01' });
      const rows = await listBookings(db, 7);
      expect(rows).toHaveLength(1);
    });
usage: Mocking the repository hid the bug; an integration test against Postgres would have caught the missing column.
twin:
  term: unit-test
  difference: An integration test runs real pieces together and finds the bugs between them. A unit test runs one piece alone and finds the bugs inside it.
related: [unit-test, end-to-end-test, contract-test, test-pyramid]
level: 1
lessons: [testing.doubles-and-integration]
