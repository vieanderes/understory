id: clean.errors
title: Handling errors cleanly
objective: Fail fast on bad input, never swallow errors, throw specific error types, and decide where each error is handled.
level: essential
minutes: 10
concepts: [clean.fail-fast, clean.swallowed-errors, clean.error-types]
prerequisites: [ts.typing-the-boundary]
opening:
  text: >-
    You'll make failures loud, early and specific, so a bug shows up where it starts. It
    turns a mystery three screens later into an error message on line one.

steps:
  - type: prose
    id: swallowed
    body: |-
      You met the empty `catch` in JavaScript. It **swallows** the error: the failure
      vanishes, and the code carries on with a value that looks real.

      ```ts
      function parseQuantity(text: string): number {
        try {
          return JSON.parse(text);
        } catch (error) {
          return 0; // "three" mugs now ships zero
        }
      }
      ```

      A clean `catch` does one of three things. It handles the error for real, like showing
      "Try again". It rethrows with more context, as `new Error("...", { cause: error })`.
      Or it isn't there at all, and the error rises to code that can decide.

  - type: multiple-choice
    id: pick-good-catch
    concept: clean.swallowed-errors
    difficulty: 2
    question: '`fetch` for a saved basket fails. Which `catch` is acceptable?'
    choices:
      - text: Try once more, then rethrow with context
        correct: true
        feedback: >-
          Right. It tries to recover, and if it can't, the failure still surfaces.
      - text: Log it, then show an empty basket
        feedback: >-
          The log helps, but the shopper thinks their basket is empty. Still swallowed.
      - text: Return an empty array
        feedback: >-
          Empty looks like "no items". Callers can't tell a failure from a real answer.

  - type: fill-blank
    id: fill-rethrow-cause
    concept: clean.swallowed-errors
    difficulty: 3
    language: ts
    prompt: >-
      Rethrow with context. The new error says what failed, and keeps the original inside it.
    template: |
      async function loadBasket(id: string) {
        try {
          const response = await fetch(`/baskets/${id}`);
          return await response.json();
        } catch (error) {
          {{1}} new Error(`Basket ${id} not loaded`, { {{2}}: {{3}} });
        }
      }
    blanks:
      - key: '1'
        answer: throw
      - key: '2'
        answer: cause
      - key: '3'
        answer: error
    bank: [throw, return, cause, message, error, id]

  - type: prose
    id: fail-fast
    body: |-
      **Fail fast**: check input at the start, and stop with a clear error.

      ```ts
      function transfer(amountPence: number) {
        if (!Number.isInteger(amountPence) || amountPence <= 0) {
          throw new RangeError(`Bad amount: ${amountPence}`);
        }
        // ...
      }
      ```

      The error appears next to its cause, not as a wrong balance three calls later.

  - type: predict-output
    id: predict-nan-spreads
    concept: clean.fail-fast
    difficulty: 2
    language: ts
    code: |
      const balance = 100;
      const amount = Number("ten");
      console.log(balance - amount);
    question: With no check, what does the new balance become?
    choices:
      - text: '`NaN`'
        correct: true
        feedback: >-
          Yes. And every sum that touches it becomes `NaN` too, far from the cause.
      - text: '`100`'
        feedback: >-
          `Number("ten")` isn't 0. It's `NaN`, and `NaN` spreads through arithmetic.
      - text: A `TypeError`
        feedback: >-
          JavaScript doesn't throw here. That's exactly why the check has to be yours.

  - type: prose
    id: expected-or-not
    body: |-
      Some failures are expected. A profile that doesn't exist is normal, and the page can say
      "No such user". Others are not: the network is down, or the reply is garbled.

      A named class, like the `NotFoundError` you wrote in JavaScript, lets a `catch` tell
      them apart. It handles the one it expects and lets the rest rise:

      ```ts
      } catch (error) {
        if (error instanceof NotFoundError) return null;
        throw error;
      }
      ```

      `instanceof` also narrows `error` from `unknown`, so TypeScript is happy.

  - type: bug-hunt
    id: hunt-catch-all
    concept: clean.error-types
    difficulty: 3
    language: ts
    code: |
      async function loadProfile(id: string) {
        try {
          return await fetchProfile(id);
        } catch (error) {
          return null;
        }
      }
    prompt: >-
      `fetchProfile` throws a `NotFoundError` for a missing profile. `null` means "no such
      profile". During a network outage, every user sees "Profile not found". Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: Every failure is treated as not found
        correct: true
        feedback: >-
          Yes. Check for a `NotFoundError` and let everything else rise.
      - text: '`await` is missing a timeout'
        feedback: >-
          A timeout would be good, but outages would still turn into "not found".
      - text: '`id` should be a number'
        feedback: >-
          The id type is fine. The `catch` can't tell one failure from another.
    fix: |
      async function loadProfile(id: string) {
        try {
          return await fetchProfile(id);
        } catch (error) {
          if (error instanceof NotFoundError) return null;
          throw error;
        }
      }

  - type: ai-review
    id: review-leaky-message
    concept: clean.error-types
    difficulty: 4
    language: ts
    request: Turn any thrown error into text for the red banner at the top of the page.
    flawClass: security
    code: |
      function bannerText(error: unknown): string {
        if (error instanceof NotFoundError) {
          return "We couldn't find that item.";
        }
        if (error instanceof Error) {
          return error.message;
        }
        return "Something went wrong. Try again.";
      }
    prompt: >-
      An assistant wrote this. A missing item and a thrown string both look fine. Tap the line
      that shouldn't reach a shopper.
    lines: [6]
    reasons:
      - text: Developer messages go straight on screen
        correct: true
        feedback: >-
          Yes. Shoppers see `Unexpected token '<'`. Log it with `console.error`, and show the
          kind sentence.
      - text: '`instanceof` fails for errors from other files'
        feedback: >-
          It works across modules in one program. The problem is what's shown.
      - text: The last line never runs
        feedback: >-
          It runs when something that isn't an `Error` is thrown, like a string.
    fix: |
      function bannerText(error: unknown): string {
        if (error instanceof NotFoundError) {
          return "We couldn't find that item.";
        }
        console.error(error);
        return "Something went wrong. Try again.";
      }

  - type: code-challenge
    id: write-parse-age
    concept: clean.fail-fast
    difficulty: 4
    language: ts
    prompt: >-
      `parseAge(input)` returns `-1` for bad input, and callers forget to check. Make it fail
      fast. Export a class `InvalidAgeError` that extends `Error`, with `name` set to
      `"InvalidAgeError"` and the input in its message.


      Return the age for whole numbers from 0 to 150. Throw an `InvalidAgeError` for
      anything else, including empty or blank input.
    hints:
      - Look at what `-1` forces on every caller, and at what `Number("")` returns.
      - Write the class like JavaScript's error classes, setting `this.name` in the constructor.
      - 'Start with `export class InvalidAgeError extends Error {` and a guard at the top of `parseAge`.'

  - type: explain-back
    id: explain-return-zero
    concept: clean.fail-fast
    difficulty: 3
    prompt: Why is returning a default like `0` or `-1` for bad input worse than throwing?
    rubric:
      - The default looks like a real answer, so the failure goes unnoticed.
      - The wrong value travels on and breaks something far from the cause.
      - A thrown, specific error stops at the cause and says what went wrong.
    modelAnswer: >-
      A default like 0 looks valid, so the program carries on with it. Much later a total is
      wrong, and nobody can trace it back. Throwing a specific error stops right where the
      bad input arrived, with a message that names it.

recap:
  - Check input at the start and fail fast with a clear message.
  - Handle, rethrow with context, or let an error rise, but never swallow it.
  - Throw named error types, handle the ones you expect, and show people a kind message.
recall:
  - id: card-fail-fast
    concept: clean.fail-fast
    front: What does "fail fast" mean?
    back: >-
      Check inputs as early as possible and stop with a clear error, so the failure appears
      next to its cause.
  - id: card-swallow
    concept: clean.swallowed-errors
    front: What are the three honest things a `catch` can do?
    back: >-
      Handle the error for real, rethrow it with context, or not catch it at all.
  - id: card-specific
    concept: clean.error-types
    front: Why throw a named error class like `NotFoundError` instead of a plain `Error`?
    back: >-
      Callers can pick out the failures they expect with `instanceof`, and let the rest rise.
  - id: card-message-audience
    concept: clean.error-types
    front: Who is an error's `message` written for?
    back: >-
      Developers. Log it in full, and show people a short, kind sentence instead.

references:
  - kind: docs
    title: Error
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Error
    note: Custom error types, `cause`, and the built-in error classes.
    primary: true
    verified: true
  - kind: docs
    title: TSConfig Reference
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/tsconfig/#useUnknownInCatchVariables
    note: The `useUnknownInCatchVariables` option, which strict mode turns on.
    primary: true
