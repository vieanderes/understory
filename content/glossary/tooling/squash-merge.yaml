term: squash merge
aka:
  - squash and merge
  - squashing
  - git squash
short: Landing a whole branch as one new commit, flattening every commit made on it.
explain: |
  A branch often carries "wip", "fix typo" and "address review" commits. Nobody needs those
  in the main history.

  Squashing combines them into one commit with one message when the pull request merges.
  The main branch reads as one entry per pull request, and reverting a feature is one step.

  The cost: careful atomic commits inside the branch are lost too. Squash small pull
  requests freely. For a large one with distinct steps, tidy the commits with an interactive
  rebase and keep them.
analogy: Handing in the final essay, not every draft you wrote on the way.
example:
  language: bash
  code: |
    git switch main
    git merge --squash fix-cart-total
    git commit -m "Fix cart total when a coupon expires"
usage: Use squash merge here; the branch is forty "wip" commits and none of them builds on its own.
twin:
  term: atomic-commit
  difference: A squash merge flattens a branch into one commit when it lands. An atomic commit is a deliberate single change, and several of them can survive a merge intact.
related:
  - merge
  - rebase
  - atomic-commit
  - pull-request
level: 2
lessons:
  - pro.commits-and-prs
