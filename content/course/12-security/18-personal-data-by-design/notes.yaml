summary: >-
  Data protection law, GDPR in the EU, reaches straight into code. It decides which fields you
  may store, for what, for how long, which vendors may see them, and what you must hand back
  or delete when someone asks. Lawyers interpret the law. Engineers build the systems that
  either can or can't do what it requires, and a system that can't find every copy of a
  person's data can't answer an erasure request, whatever the policy says.


  This lesson builds on data minimisation from Abuse, bots and privacy. It adds the
  vocabulary you need to talk to a privacy lead without guessing: personal, pseudonymised
  and anonymised data, lawful bases and special categories, controllers, processors and
  sub-processors, and the rights to access, erasure and portability. The AI systems chapter
  later applies the same ideas to prompts, traces and eval sets.


  None of this is legal advice. The aim is to know which questions to ask, and to build the
  retention rules, export paths, erasure jobs and audit trails that make the answers true in
  production.
remember:
  - Pseudonymised data is still personal data for whoever can link it back, and only data nobody can reasonably re-identify is anonymous.
  - Every purpose needs one lawful basis from Article 6, chosen before you collect, and consent is the wrong pick for anything you would do anyway.
  - Special categories such as health, religion and union membership need an Article 9(2) condition on top of an Article 6 basis.
  - The controller decides why and how data is processed, and a processor acts only on its documented instructions under an Article 28 agreement.
  - A processor that starts using the data for its own purposes becomes a controller for that processing.
  - A processor may add a sub-processor only with the controller's written authorisation, and under a general one it must announce the change so the controller can object.
  - Requests for access, erasure and portability get an answer within one month, and an access copy must not adversely affect other people.
  - Erasure gives way to a legal duty to keep, so a retention rule records which data a law requires and for how long.
sections:
  - title: Choosing a lawful basis in practice
    body: |-
      Article 6(1) lists six bases: consent, contract, legal obligation, vital interests,
      public task and legitimate interests. You choose one per purpose, not per field, and
      you choose before you collect. Switching later because the first one turned out
      awkward is a red flag to a regulator.

      **Contract** covers what is necessary to deliver what the person asked for: the
      delivery address for an order, the email for a password reset. It does not stretch to
      everything a business would like to do with the data.

      **Legal obligation** covers what a law makes you do, such as keeping sales records for
      the tax office. It is also why erasure has limits: Article 17(3)(b) excludes data you
      must keep to comply with a legal obligation.

      **Consent** must be freely given, specific, informed and unambiguous, and Article 7(3)
      says withdrawing it must be no harder than giving it. So build consent as data: who agreed
      to what, which wording, when, and when they withdrew.

      ```ts
      type Consent = {
        memberId: string;
        purpose: 'photo-in-advert' | 'partner-offers';
        textVersion: string; // the exact wording they saw
        givenAt: string;
        withdrawnAt?: string;
      };

      const hasConsent = (consents: Consent[], memberId: string, purpose: Consent['purpose']) =>
        consents.some((c) => c.memberId === memberId && c.purpose === purpose && !c.withdrawnAt);
      ```

      **Legitimate interests** needs a written balancing test: your interest, why the
      processing is necessary for it, and whether the person's rights override it. Recital 47
      names fraud prevention as a legitimate interest. Public authorities can't rely on it
      for their tasks.

      For special categories, Article 9(2) adds conditions such as explicit consent or
      obligations in employment and social security law. A gym storing injury notes, or a
      payroll system holding church tax status, needs both layers.
  - title: Controllers, processors and the agreement between them
    body: |-
      The roles follow what you do, not what your contract calls you. If you decide the
      purpose, you are a controller for it. A software company is often both: controller for
      its own customer accounts and billing, processor for the data its business customers
      put into the product.

      Article 28(3) says what the agreement must cover: the subject matter, duration, nature
      and purpose of the processing, the types of data and categories of people, and the
      processor's duties. The duties are the part engineers implement:

      - process only on documented instructions, so no "improve our models" side use;
      - keep staff bound to confidentiality, and secure the data under Article 32;
      - help the controller answer data subject requests, which means an export and an
        erasure path per customer;
      - delete or return all data when the service ends;
      - give the controller what it needs to check compliance, including audits.

      Sub-processors are the vendors behind your product: hosting, email, transcription, a
      model provider. Article 28(2) needs the controller's prior written authorisation,
      specific or general. Most SaaS agreements use a general one with a published list,
      and Article 28(2) then requires telling customers about additions so they can object.
      Article 28(4) passes the same duties down the chain, and the original processor stays
      liable for the sub-processor.

      So adding a vendor is a release with a lead time: update the list, notify customers,
      wait out the notice period, then switch it on behind a flag.
  - title: Building access, erasure and portability
    body: |-
      Requests arrive by email, form or support chat, and the one-month clock in Article
      12(3) starts on receipt. It can be extended by two further months for complex or
      numerous requests, if you tell the person within the first month. Article 12(6) lets
      you ask for more information when you have reasonable doubts about who is asking.

      An **access** copy under Article 15 includes the data and context: purposes,
      recipients, how long you keep it and where it came from. Article 15(4) says the copy
      must not adversely affect others. In a messaging or club app that means the requester's
      own messages and games, but only a display name for the people they played or wrote to.

      ```ts
      type Game = { playedAt: string; result: string; opponent: { id: string; name: string; email: string } };

      // Keep what the requester needs to recognise the game, and nothing else about the opponent.
      const forExport = (games: Game[]) =>
        games.map((g) => ({ playedAt: g.playedAt, result: g.result, opponent: g.opponent.name }));

      console.log(forExport([{ playedAt: '2026-09-02', result: 'win', opponent: { id: 'm9', name: 'Kai', email: 'kai@example.com' } }]));
      // [ { playedAt: '2026-09-02', result: 'win', opponent: 'Kai' } ]
      ```

      **Portability** under Article 20 is narrower. It covers data the person provided,
      processed by consent or contract and by automated means, in a structured, commonly
      used, machine-readable format such as JSON or CSV.

      **Erasure** only works if every copy is findable. Tag rows, files, search documents,
      cache keys and analytics events with the person's id when you write them. Backups are
      the hard part: common practice is to let them age out on a short, documented cycle and
      to re-apply erasures if a backup is ever restored.
  - title: Retention rules and the audit trail
    body: |-
      Article 5(1)(e), storage limitation, says identifiable data is kept no longer than the
      purpose needs. In code that becomes a policy per kind of record, owned by a person and
      run on a schedule, like the lesson's sweep. Three habits keep it honest.

      First, a kind with no rule is an error. New tables appear every month, and a sweep that
      silently keeps unknown data turns into a store that grows for ever.

      Second, separate "delete" from "anonymise". Anonymising a booking means removing the
      member id and anything that singles a person out, so the class counts survive. If a
      row can still be joined back to a person, it's pseudonymised, not anonymised.

      Third, keep an audit trail of the privacy actions themselves: who exported, erased or
      viewed what, when, and on whose request. Article 5(2), accountability, expects you to be
      able to show compliance, and Article 30 asks for a record of processing activities.
      The trail must not become a copy of the data it describes.

      ```ts
      type AuditEvent = {
        at: string;
        actor: string; // the staff member or job that acted
        action: 'export' | 'erase' | 'view';
        subjectRef: string; // a request id or pseudonym, never the email or the record body
        counts: Record<string, number>;
      };

      const event: AuditEvent = {
        at: '2026-10-01T09:00:00Z',
        actor: 'job:retention-sweep',
        action: 'erase',
        subjectRef: 'dsr-2026-0412',
        counts: { 'injury-note': 1, booking: 3 },
      };
      console.log(JSON.stringify(event));
      ```

      Log counts, not contents, so an erasure leaves a proof that it happened without
      keeping what was erased.
pitfalls:
  - '**Calling hashed or tokenised data anonymous.** If anyone, including you, holds the key or a lookup table, it is pseudonymised and the whole law still applies. Reserve "anonymous" for aggregates or data checked against re-identification.'
  - '**Picking consent for something you need anyway.** If the service can''t work without the processing, a person who withdraws consent breaks it. Use contract or legal obligation, and save consent for optional extras.'
  - '**Missing the special category hiding in a field.** Injury notes, dietary needs that reveal religion, church tax status and union dues deductions all count. Flag them in the schema so access and retention rules can treat them differently.'
  - '**Switching on a new vendor before the paperwork.** A processor adding a sub-processor without authorisation breaches its agreement with every customer at once. Treat the sub-processor list as a release gate.'
  - '**Joining whole rows into an export.** A `SELECT *` on a joined table copies other people''s data into someone''s download. Build exports from an explicit allowlist of fields per table.'
  - '**Erasing what a law says to keep.** Deleting sales records on request can break tax law. Record which kinds a law requires, keep them until their period ends, and restrict their use meanwhile.'
verify:
  - lens: leaks
    check: Search a real export for any email, phone or id that belongs to someone other than the requester before shipping the export path.
  - lens: breaks
    check: Run the retention sweep against a staging copy and confirm every table has a rule, so a new table fails the job instead of being kept silently.
  - lens: tests
    check: Write a test that erases one member and asserts their rows are gone from every store, while legally required records and other members stay untouched.
  - lens: confuses
    check: Name each stored field's purpose and lawful basis next to its schema, so the next engineer can't reuse support data for analytics by accident.
  - lens: scales
    check: Make sure erasure queries every store by an indexed person id, because a full scan per request won't finish inside a month at scale.
interview:
  - question: Your product team wants to call a hashed analytics export anonymous. How do you respond?
    answer: >-
      I'd say it's pseudonymised, so it stays personal data. GDPR's Article 4(5) describes
      exactly this: data that can't be attributed to a person without extra information
      kept separately. Whoever holds the key or the list of ids can match every row, and
      Recital 26 says to count any means reasonably likely to be used, including singling
      someone out from a few attributes. Anonymous would need aggregation, removing the
      stable id and coarsening rare combinations, then a re-identification check. That's a
      real trade-off: anonymous data escapes the law but loses per-person analysis.
      Pseudonymised data keeps it, with the law's duties attached, and still counts as a
      good security measure that GDPR encourages.
  - question: You run a B2B SaaS product. A team wants to add a new LLM vendor for summaries. What has to happen?
    answer: >-
      Our customers are controllers of their users' data and we're their processor, so the
      vendor would be our sub-processor. Article 28(2) needs the customers' authorisation.
      Under the usual general authorisation, we add the vendor to our published list,
      notify customers and give them the notice period to object. We need our own Article
      28 terms with the vendor that pass down the same duties: instructions only, no
      training on the data, security, deletion at the end. If it processes outside the EEA,
      Chapter V needs an adequacy decision or safeguards such as standard contractual
      clauses. In code, I'd ship it behind a per-customer flag, so a customer who objects
      can stay off it.
  - question: How would you design erasure for a system with many stores?
    answer: >-
      I'd make every copy findable by design: each row, file, search document, cache entry
      and event carries the person's id, indexed. An erasure request becomes a job that
      fans out per store and records a count per store in an audit trail that holds a
      request id, not the person's data. Records a law requires, such as sales records for
      tax, are kept until their period ends and restricted meanwhile, because Article
      17(3)(b) excludes them. Backups age out on a short documented cycle, and a restore
      re-applies pending erasures. The trade-off is discipline: tagging everything costs a
      little on every write, but a system that can't find copies can't comply, whatever the
      policy says.
