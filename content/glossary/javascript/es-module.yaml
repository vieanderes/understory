term: ES module
aka: [ESM, ES modules, ECMAScript module]
short: A JavaScript file with its own scope that shares values only through import and export.
explain: |
  Put a whole program in one file and every variable can trip over every other. Modules
  split it into files that keep their names to themselves. A file shares a value only by
  exporting it, and another file only uses it by importing it.

  The standard system loads the whole import graph before running any of it, so imports are
  checked first. Imports are live bindings, not copies: if the exporter changes a value,
  importers see the change. Each module runs once and is cached, so every importer shares
  the same instance.
analogy: Rooms with doors instead of one open-plan hall. You only take out of a room what was put by the door.
example:
  language: js
  code: |
    // prices.js
    export const VAT = 0.2;
    export default function withVat(pence) {
      return Math.round(pence * (1 + VAT));
    }

    // checkout.js
    import withVat, { VAT } from './prices.js';
usage: Switch the package to ES modules so the bundler can tree-shake the helpers nobody imports.
twin:
  term: commonjs
  difference: ES modules use `import` and `export`, load the whole graph before running, and hand out live bindings. CommonJS uses `require`, runs as it goes, synchronously, and hands out a plain object copy of what was exported.
related: [commonjs, tree-shaking, bundler, scope, barrel-file, circular-dependency]
level: 2
lessons: [js.modules]
