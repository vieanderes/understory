term: First Contentful Paint
aka: [ FCP ]
short: The moment the browser first draws any text or image, ending the blank white screen.
explain: |
  Staring at a blank screen feels broken. This marks the moment something, anything, appears:
  a heading, a logo, a line of text.

  It tells you the critical rendering path is short. It doesn't tell you the page is useful: a
  spinner counts. So Core Web Vitals use Largest Contentful Paint for loading. This one helps
  you find why the start is slow.
analogy: The first slice of toast landing on the table. Breakfast has begun, but you're not fed yet.
usage: First Contentful Paint is 0.8 seconds, so the delay is the image itself, not the HTML.
twin:
  term: largest-contentful-paint
  difference: First Contentful Paint is when anything appears. Largest Contentful Paint is when the biggest element appears, usually the thing the visitor came for.
related: [ largest-contentful-paint, critical-rendering-path, time-to-first-byte ]
level: 3
lessons: [ perf.web-vitals, perf.critical-rendering-path ]
