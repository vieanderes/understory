term: Boyer-Moore voting
aka: [Boyer-Moore majority vote, majority vote algorithm, voting algorithm]
short: Finding a list's majority value in one pass and constant memory by cancelling pairs of different values.
explain: |
  Keep one candidate and a count. A matching value adds one; a different value takes one
  away. When the count hits zero, the next value becomes the candidate. A true majority
  outnumbers everything else combined, so it is the one left standing.

  Something is always left standing, even when no majority exists. So count the
  candidate in a second pass before you trust it.
analogy: A crowded room where opposing supporters pair off and leave. Whoever remains had the most.
example:
  language: ts
  code: |
    let candidate = 0, count = 0;
    for (const x of xs) {
      if (count === 0) candidate = x;
      count += x === candidate ? 1 : -1;
    }
    // second pass: confirm candidate fills more than half
usage: Boyer-Moore voting gets us O(1) memory, but remember the check pass at the end.
related: [majority-element, frequency-count, space-complexity]
level: 3
lessons: [algo.counting-and-leaders]
