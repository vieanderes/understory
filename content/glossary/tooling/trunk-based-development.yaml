term: trunk-based development
aka:
  - trunk-based
short: A way of working where everyone merges small changes into the main line at least daily.
explain: |
  Long-lived branches feel safe until merge day, when three weeks of changes collide. The
  longer they live apart, the worse that day gets.

  The alternative: branches last hours, not weeks. Unfinished work merges anyway, hidden
  behind feature flags, so `main` is always releasable. It leans on fast CI and good
  tests, because there's no long stabilising phase to catch problems later.
analogy: Tidying the kitchen as you cook, instead of facing a mountain of washing-up at the end.
usage: We do trunk-based development, so that branch should merge today, flag off if it isn't ready.
related:
  - feature-flag
  - branch
  - continuous-integration
level: 3
lessons:
