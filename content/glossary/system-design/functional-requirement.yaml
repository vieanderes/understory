term: functional requirement
aka: [functional requirements, feature requirement]
short: Something a system must do for its users, stated as a behaviour.
explain: |
  "Users can shorten a link." "Users see posts from people they follow." Each is a
  behaviour someone could check by trying it.

  In a design discussion, list a few and agree on them before drawing anything. Then mark
  what's out of scope. Designing for features nobody asked for wastes the time you need
  for the hard parts.
analogy: The list of rooms in a house plan, before anyone talks about insulation or heating.
usage: The functional requirements are create, redirect and expire; analytics is a nice-to-have.
twin:
  term: non-functional-requirement
  difference: A functional requirement says what the system does. A non-functional requirement says how well and at what scale it must do it.
related: [non-functional-requirement, non-goal, system-design-interview]
level: 2
lessons: [sysdesign.the-method]
