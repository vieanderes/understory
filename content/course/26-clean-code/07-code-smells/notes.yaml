summary: >-
  A code smell is a surface sign that the design may be making change harder than it needs
  to be. It isn't a bug and it isn't a rule. It's a prompt to look closer. Martin Fowler and
  Kent Beck named the common ones in *Refactoring*, and each name comes with the moves that
  usually cure it. That pairing is what makes smells useful: "this is feature envy, move the
  function" is a comment an author can act on.


  **Refactoring** means changing the structure of code without changing what it does. It's
  only safe with tests that pin the behaviour, and it's only fast in small steps, each one
  leaving the tests green. On code with no tests, the first move is to write
  characterisation tests that record today's behaviour, odd parts included.


  These notes give you a field guide from smell to move, worked cures for primitive
  obsession, data clumps and feature envy, and the working rhythm that keeps a refactor from
  turning into a rewrite. The goal in an interview is the same as at work: name the smell,
  say why it hurts the next change, and name the move.
remember:
  - A smell is a hint that the design may resist change, not proof of a bug, so judge it by how often that code changes.
  - Refactoring changes structure without changing behaviour, and a behaviour fix belongs in a separate commit.
  - Before refactoring untested code, write characterisation tests that pin what it does now, including the edges.
  - Refactor in small steps and run the tests after each, so a red run points at the last move.
  - Shotgun surgery means one change touches many places, and the cure is to gather that knowledge into one module.
  - Primitive obsession uses a bare number or string for a domain idea, and the cure is a small type, such as a branded type or value object.
  - Feature envy is a function busier with another object's data than its own, and the cure is to move it next to that data.
  - Data clumps are values that always travel together, and the cure is to give them one type, such as a parameter object.
sections:
  - title: A field guide from smell to move
    body: |-
      Each smell below is paired with the refactoring usually applied to it. The move names
      are the ones in Fowler's catalogue, second edition, so they're searchable.

      - **Long function**: several steps at different levels of detail in one body. Move:
        *Extract Function* for each step, named after what it does, not how.
      - **Long parameter list**: a row of arguments, often booleans, that callers get wrong. Moves: *Introduce
        Parameter Object*, or *Remove Flag Argument* by splitting into one function per case.
      - **Data clumps**: the same three or four values passed together everywhere. Move:
        *Introduce Parameter Object* or *Extract Class*.
      - **Primitive obsession**: pence, emails and ids as bare `number` or `string`. Move:
        *Replace Primitive with Object*, or a branded type in TypeScript.
      - **Feature envy**: a function that mostly reads another object's fields. Move:
        *Move Function* to where the data lives.
      - **Shotgun surgery**: one change edits many modules. Moves: *Move Function* and
        *Combine Functions into Class* to gather the scattered logic.
      - **Divergent change**: the opposite shape, one module edited for many unrelated
        reasons. Moves: *Split Phase* or *Extract Class*.
      - **Repeated switches**: the same `switch` on the same value in several places. Move:
        *Replace Conditional with Polymorphism*, or a lookup of objects as in the lesson.
      - **Message chains**: `order.customer.address.postcode`. Move: *Hide Delegate*.
      - **Speculative generality**: hooks and parameters for needs nobody has. Moves:
        *Inline Function*, *Collapse Hierarchy*, *Remove Dead Code*.

      Smells matter in proportion to change. A long function in a file nobody has touched
      in three years costs little. The same function on the path of every new feature costs
      something every week. Your version control history tells you which is which: files
      that change often and have many bugs are where refactoring pays.
  - title: Curing primitive obsession with types
    body: |-
      A bare `number` can't tell pence from euros, and a bare `string` can't tell a checked
      email from anything typed in a form. In TypeScript, a **branded type** makes the
      compiler tell them apart at no runtime cost. A constructor function is the only way to
      make one, so the check runs once at the boundary.

      ```ts
      type Pence = number & { readonly __unit: 'Pence' };
      type Email = string & { readonly __kind: 'Email' };

      function pence(amount: number): Pence {
        if (!Number.isInteger(amount)) throw new RangeError(`Not whole pence: ${amount}`);
        return amount as Pence;
      }

      function parseEmail(text: string): Email {
        const trimmed = text.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(trimmed)) throw new Error(`Not an email: ${text}`);
        return trimmed as Email;
      }

      function sendReceipt(to: Email, total: Pence): string {
        return `To ${to}: you paid ${(total / 100).toFixed(2)}`;
      }

      console.log(sendReceipt(parseEmail(' Sam@Example.com '), pence(1999)));
      // To sam@example.com: you paid 19.99

      // @ts-expect-error a plain number is not Pence
      sendReceipt(parseEmail('sam@example.com'), 19.99);
      // @ts-expect-error a plain string is not an Email
      sendReceipt('not checked', pence(100));
      ```

      This is "parse, don't validate": once a value has passed `parseEmail`, its type
      carries the proof, and nothing downstream checks again.

      A class-based **value object** such as `Money` goes further. It can hold behaviour,
      such as `add` refusing to mix currencies, and keep amount and currency together. The
      trade-off is weight: every arithmetic step goes through a method. Brands suit units
      and ids. Value objects suit ideas with rules, such as money or a date range.
  - title: Data clumps and feature envy, before and after
    body: |-
      The two smells often appear together. Values travel as a clump, and the code that uses
      them lives far from where they belong.

      ```ts
      // Before: the same three values travel together, and the function envies the customer.
      function labelBefore(name: string, street: string, city: string, postcode: string): string {
        return `${name}\n${street}\n${city} ${postcode.toUpperCase()}`;
      }

      function deliveryZoneBefore(order: { customer: { address: { postcode: string } } }): string {
        const area = order.customer.address.postcode.split(' ')[0].toUpperCase();
        return area.startsWith('E') || area.startsWith('N') ? 'london-east-north' : 'standard';
      }

      // After: the clump becomes a type, and the logic moves next to the data it uses.
      interface Address {
        street: string;
        city: string;
        postcode: string;
      }

      const outwardCode = (address: Address) => address.postcode.split(' ')[0].toUpperCase();

      function zoneOf(address: Address): string {
        const area = outwardCode(address);
        return area.startsWith('E') || area.startsWith('N') ? 'london-east-north' : 'standard';
      }

      function label(name: string, address: Address): string {
        return `${name}\n${address.street}\n${address.city} ${address.postcode.toUpperCase()}`;
      }

      const home: Address = { street: '1 High St', city: 'London', postcode: 'e1 6an' };
      console.log(label('Sam Okafor', home) === labelBefore('Sam Okafor', home.street, home.city, home.postcode)); // true
      console.log(zoneOf(home), deliveryZoneBefore({ customer: { address: home } })); // london-east-north london-east-north
      ```

      A quick test for a clump: delete one value from the group. If the others stop making
      sense, they're one idea and deserve one name. Once `Address` exists, logic that used to
      live in callers, such as the outward code, finds an obvious home beside it. That's the
      usual sequence: introduce the type first, then move behaviour onto it.

      The last two lines are a tiny characterisation check: the new code gives the same
      answers as the old on the same input. Keep both versions side by side like this while
      you switch callers over, then delete the old one.
  - title: The rhythm of a safe refactor
    body: |-
      Refactoring goes wrong when it becomes a long, unverified edit. The rhythm that keeps
      it safe is short and repetitive.

      1. **Pin the behaviour.** On untested code, write characterisation tests first. Cover
         boundaries such as exactly 5000 pence, odd inputs such as lower-case country codes,
         and outputs you suspect are wrong. You're recording, not judging.
      2. **Make one small move.** Rename, extract, move, inline. Prefer your editor's
         automated refactorings, which update every caller at once.
      3. **Run the tests.** Green means commit. Red means undo the move, not debug forward.
      4. **Repeat.** Small green commits can be reviewed, bisected and reverted one by one.

      ```js
      import { test } from 'node:test';
      import assert from 'node:assert/strict';

      // Legacy code nobody fully understands.
      function shippingFor(totalPence, country) {
        if (country === 'GB') return totalPence >= 5000 ? 0 : 399;
        if (country === 'IE') return totalPence > 7500 ? 0 : 699;
        return 1299;
      }

      // Characterisation: record what it does today, edges included.
      const cases = [
        [4999, 'GB'], [5000, 'GB'], [5001, 'GB'],
        [7500, 'IE'], [7501, 'IE'],
        [100, 'FR'], [0, 'gb'],
      ];

      test('shippingFor keeps its current behaviour', () => {
        const actual = cases.map(([total, country]) => shippingFor(total, country));
        assert.deepEqual(actual, [399, 0, 0, 699, 0, 1299, 1299]);
      });
      ```

      Notice what the table pins: GB uses `>=` while IE uses `>`, and lower-case `'gb'`
      pays the foreign rate. Both may be bugs. Both are now visible, and fixing either is a
      separate, deliberate change to this test.

      For a function with many callers, change its signature with **parallel change**, also
      called expand and contract: add the new form beside the old, move callers across in
      small commits, then delete the old form. Kent Beck's well-known advice sums up the
      approach in two steps: first reshape the code so the change becomes simple, which may
      itself be hard, then make the simple change.
pitfalls:
  - "**Mixing a refactor with a behaviour change.** When a test goes red, you can't tell whether the fix or the restructure caused it, and reviewers skim the whole thing. Commit the refactor alone, green, then the fix with its changed test."
  - "**Fixing odd behaviour while writing characterisation tests.** Callers may depend on the odd result. Pin what the code does now, then raise the fix as its own change."
  - "**Characterisation tests that miss the boundaries.** Tests at 1000 and 9000 stay green when `>=` turns into `>`. Add cases at, one below and one above every threshold."
  - "**Refactoring code that never changes.** Cleaning up a stable, rarely read module spends effort and risk for no return. Refactor where the next feature is going, or when you're about to change that code anyway."
  - "**Treating smells as rules.** A four-argument function or a `switch` isn't automatically wrong, and a linter score isn't a design. Name the smell and the concrete cost to the next change, or leave it."
  - "**Big-bang rewrites disguised as refactors.** A branch that restructures a module for two weeks breaks the small-steps rule and conflicts with everyone. Split it into many small moves that each ship green."
  - "**Branding at the wrong place.** Casting with `as Pence` all over the code defeats the brand. Allow the cast only inside one constructor or parse function at the boundary."
verify:
  - lens: tests
    check: Before a refactor, characterisation tests pin every threshold at its value and one either side, and they pass on the old code.
  - lens: tests
    check: The refactor commit changes no test expectations, and a behaviour fix comes in its own commit with the test it changes.
  - lens: confuses
    check: Adding one more case, such as a delivery method, touches one entry, not a branch in several switches or files.
  - lens: breaks
    check: A branded type or a named field keeps values with different units, such as pence and euros, from being swapped silently.
interview:
  - question: What's a code smell? Give me a few you look for and how you'd fix them.
    answer: >-
      A code smell is a surface sign that the design may make the next change harder. It's a
      hint, not a bug. The ones I see most are long functions, fixed with Extract Function
      into well-named steps. Primitive obsession, like prices as bare numbers, fixed with a
      branded type or value object so pence and euros can't mix. Feature envy, where a
      function mostly reads another object's data, fixed by moving it there. And shotgun
      surgery, where adding a delivery option touches four files, fixed by gathering that
      knowledge into one module or a lookup table. I weigh smells by change frequency: a
      smelly file nobody touches can stay, while one on every feature's path is worth
      cleaning first.
  - question: How do you refactor legacy code that has no tests?
    answer: >-
      I pin its current behaviour first with characterisation tests, then refactor in small
      steps under them. The tests record what the code does today, even when it looks wrong,
      because callers may rely on it. I focus on boundaries and odd inputs, since that's where
      refactors silently change behaviour. If the code is hard to test, I make the smallest
      safe change to get a seam, such as passing in the clock or the database, often with
      automated editor refactorings. Then I make one move at a time, run the tests, and commit
      each green step. Suspected bugs get noted and fixed later in separate commits that change
      a test on purpose. The trade-off is time up front, which pays for itself the first time
      a test catches a slip.
  - question: Why do you insist on small refactoring steps? Isn't it faster to restructure in one go?
    answer: >-
      Small steps are faster end to end, because failures stay cheap. If I run the tests
      after each move and one goes red, the cause is the last few lines, and I undo them.
      After a day of unverified edits, a red test could come from any of fifty changes, and
      I'm debugging instead of refactoring. Small green commits also review well, bisect
      cleanly and can ship continuously, so I never hold a long-lived branch that conflicts
      with the team. For changes to widely used signatures I use parallel change: add the new
      form, migrate callers in small commits, remove the old. The only cost is discipline:
      it feels slower in the moment, but it rarely is.
  - question: What's the difference between shotgun surgery and divergent change?
    answer: >-
      They're mirror images of poor cohesion. Shotgun surgery is one kind of change forcing
      edits across many modules, like a new delivery method touching pricing, the checkout
      form, emails and the warehouse export. The knowledge is scattered, so I gather it into
      one place with Move Function or a lookup of rules. Divergent change is one module edited
      for many unrelated reasons, like a report class that changes for new data, new tax rules
      and new email layouts. It has too many jobs, so I split it with Extract Class or Split
      Phase. The goal of both fixes is the same: each kind of change lands in one place, and
      each place has one kind of change.
