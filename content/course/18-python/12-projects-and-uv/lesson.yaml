deepDive: >-
  These outputs come from uv 0.9 and ruff 0.16. `uv init` also writes `.python-version`, a
  README and a Git repository. The first `uv add` creates `.venv` and `uv.lock`. `uv sync`
  makes the environment match the lock, and `--locked` fails if the lock is out of date,
  which is what you want in CI.


  Before uv, the same job took `python -m venv .venv`, activating it, and `pip install -r
  requirements.txt`, with pip-tools or Poetry for locking. You'll still meet those in older
  repositories. `uv pip install` exists for them. Ruff's rules are configured under
  `[tool.ruff]` in `pyproject.toml`, and `ruff check --fix` applies the safe fixes.
