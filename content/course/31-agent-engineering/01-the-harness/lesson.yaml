deepDive: >-
  The gate in the challenge ran in Python 3.12 against scripted calls. No model was called.


  **Hooks in real harnesses.** One coding agent calls them `PreToolUse` and `PostToolUse`.
  A pre-tool hook can allow, deny or ask, and can change the tool's input. Agent frameworks
  offer the same idea as callbacks around each tool call. The shape is always the one you
  built: deny beats allow, and rewrites feed the next check.


  **Bash against dedicated tools.** A shell tool gives the agent huge reach, but the harness
  sees only an opaque command string. A dedicated `send_email` tool has typed arguments a
  hook can read, gate and log. Promote an action to its own tool when you need to gate,
  render, audit or run it in parallel.


  **Sub-agents are a harness choice too.** A sub-agent is a second loop the harness starts
  with its own context, tools and permissions. Give it fewer tools than the parent, never
  more. The context lessons later in this chapter use the same idea to keep the parent's
  context small.


  **Where server tools run.** A provider-run tool such as web fetch never touches your
  sandbox, so your egress rule can't limit it. Restrict it where it runs, with its own
  domain lists, or leave it out of the action space.
