summary: >-
  A component has three places to keep a value, and choosing well is most of this lesson.
  **State** is for what the screen shows: changing it asks React to render. A **ref** is a
  box that survives renders without causing one, so it suits timer ids, the latest request,
  and DOM elements you need to focus, measure or scroll. A plain variable inside the
  component lasts one render only, because the component function runs again from the top
  each time.


  **Custom hooks** are how React shares stateful logic. A function whose name starts with
  `use` and that calls other hooks can package an effect, its cleanup and its state behind a
  name like `useOnlineStatus`. It shares the logic, never the state: every component that
  calls it gets its own copy, because hooks belong to the component whose render calls them.


  Both rest on the rules of hooks. React identifies each hook by its position in the call
  order, so hooks must run unconditionally, at the top level, in the same order on every
  render. The `use` prefix is what lets the linter check those rules inside your own hooks.
remember:
  - A ref keeps a value between renders without causing a render, so use it for values the screen doesn't show.
  - Don't read or write `ref.current` during render; use refs in event handlers and effects, where their value is settled.
  - React identifies hooks by call order, so call them at the top level, never inside a condition, a loop or after an early return.
  - A custom hook shares logic, not state; each component that calls it gets its own state.
  - Name a custom hook with `use` and for what it gives you, and don't use the prefix on a function that calls no hooks.
  - In React 19, `ref` is an ordinary prop for function components, and a callback ref may return a cleanup function.
  - Subscribe to something outside React, such as the online status, with `useSyncExternalStore` rather than state plus an effect.
  - "`useEffectEvent` lets an effect call the latest version of a callback without listing it as a dependency."
sections:
  - title: Why the rules of hooks exist
    body: |-
      React doesn't know your hooks by name. On each render it walks through the hooks in
      the order your component calls them and matches them to the state it stored last
      time: the first `useState` gets slot one, the second gets slot two, and so on. That's
      the whole reason for the rules. If the order changes between renders, state lands in
      the wrong slot.

      ```tsx
      function Profile({ editing }: { editing: boolean }) {
        const [name] = useState('Ada');
        if (editing) {
          const [draft] = useState(name); // breaks the rules: this hook only sometimes runs
          return <input defaultValue={draft} />;
        }
        return <p>{name}</p>;
      }
      ```

      We rendered this with `editing` false, then true. React threw "Rendered more hooks
      than during the previous render." The fix is always the same shape: call every hook
      at the top, unconditionally, and put the condition inside or below it. Here that means
      moving `draft` above the `if`, or better, moving the editing form into its own
      component, which then owns its own hooks.

      The rules in full: call hooks only from React function components or custom hooks,
      only at the top level, never in conditions, loops, nested functions, after an early
      return, or inside `try` and `catch`. React 19's `use` is the one exception: it may be
      called inside a condition or a loop, though still only during render.

      The linter enforces the rules by finding functions named `use...` and components named
      with a capital letter. A helper called `getOnlineStatus` that calls `useState` escapes
      the check entirely, which is why the prefix is a rule, not a style choice.
  - title: Refs, state or a variable
    body: |-
      Three questions pick the box.

      - Does the screen show it? Use **state**. Changing it renders.
      - Must it survive renders but never be shown, such as an interval id, a
        `setTimeout` handle, an `AbortController` or the previous value of a prop? Use a
        **ref**.
      - Is it computed from props and state and needed only in this render? Use a plain
        **variable**.

      Refs come with a discipline. React doesn't know when `ref.current` changes, so reading
      it during render can show a stale value, and writing it during render makes the
      component impure. Read and write refs in handlers and effects. The one exception is
      creating an expensive object once:

      ```tsx
      const playerRef = useRef<VideoPlayer | null>(null);
      if (playerRef.current === null) {
        playerRef.current = new VideoPlayer(); // runs once, on the first render
      }
      ```

      A DOM ref is `null` until React attaches the element, and returns to `null` when it
      detaches, so its type is `HTMLInputElement | null` and code reaches it with optional
      chaining, `inputRef.current?.focus()`.

      In React 19, function components receive `ref` as an ordinary prop, so a design
      system's `TextField` can take `ref` and pass it to its inner `input` without the old
      `forwardRef` wrapper.
  - title: Callback refs and their cleanup
    body: |-
      A ref can also be a function. React calls it with the element when it attaches the
      node, which is the right moment to start observing that node. Since React 19, the
      function may return a cleanup, called when the node is detached. That pairs setup and
      teardown in one place, like an effect does, but tied to the element's life rather
      than the component's.

      ```tsx
      import { useCallback, useState } from 'react';

      export function useElementWidth<T extends HTMLElement>() {
        const [width, setWidth] = useState(0);
        // A callback ref runs when React attaches the node. In React 19 it can return a cleanup,
        // which React calls when the node is detached.
        const ref = useCallback((node: T | null) => {
          if (node === null) return;
          const observer = new ResizeObserver(([entry]) => {
            if (entry) setWidth(entry.contentRect.width);
          });
          observer.observe(node);
          return () => observer.disconnect();
        }, []);
        return [ref, width] as const;
      }

      export function Card() {
        const [ref, width] = useElementWidth<HTMLDivElement>();
        return <div ref={ref}>{width < 400 ? 'Compact layout' : 'Wide layout'}</div>;
      }
      ```

      We tested it with a stand-in `ResizeObserver`: a reported width of 600 switched the
      text to Wide layout, and unmounting called `disconnect`. The `useCallback` matters. A
      new function on every render would look like a different ref, so React would run the
      cleanup and call the new function after each render, observing and disconnecting
      over and over.

      Callback refs also handle a list of elements, where you can't call `useRef` in a loop:
      keep a `Map` from id to node in one ref, add the node in the callback and delete it in
      the cleanup.
  - title: Custom hooks that subscribe, done properly
    body: |-
      The lesson's `useOnlineStatus` keeps a copy of `navigator.onLine` in state and updates
      it from events. React has a hook built for exactly this: `useSyncExternalStore`. You
      give it a `subscribe` function and a `getSnapshot` function, and React reads the
      snapshot whenever the subscription fires. There's no copy to drift, and it stays
      consistent during concurrent rendering.

      ```tsx
      import { useSyncExternalStore } from 'react';

      function subscribe(onChange: () => void) {
        window.addEventListener('online', onChange);
        window.addEventListener('offline', onChange);
        return () => {
          window.removeEventListener('online', onChange);
          window.removeEventListener('offline', onChange);
        };
      }

      export function useOnlineStatus(): boolean {
        return useSyncExternalStore(
          subscribe,
          () => navigator.onLine, // read on the client, on every check
          () => true, // the server can't know, so it assumes online
        );
      }

      export function SaveButton() {
        const online = useOnlineStatus();
        return <button disabled={!online}>{online ? 'Save' : 'Reconnecting'}</button>;
      }
      ```

      `subscribe` is defined outside the hook, so its identity never changes and React never
      resubscribes. The third argument is the snapshot used for server rendering and
      hydration. Callers see only a boolean: the hook's name says what it gives, and how it
      gets it can change without touching a single component.
  - title: A timer hook that always sees the latest props
    body: |-
      A common custom hook runs a callback on an interval. The trap is the callback's
      identity: listed as a dependency, a new arrow every render restarts the timer; left
      out, the timer keeps calling the first callback with stale values. React 19.2 added
      `useEffectEvent` for this. It wraps a function that an effect can call, always sees
      the latest props and state, and isn't a dependency.

      ```tsx
      import { useEffect, useEffectEvent, useState } from 'react';

      export function useInterval(callback: () => void, delay: number | null) {
        // Always sees the latest callback, but isn't a dependency, so the timer isn't restarted
        // every time the parent renders with a new arrow function.
        const onTick = useEffectEvent(callback);
        useEffect(() => {
          if (delay === null) return;
          const id = setInterval(() => onTick(), delay);
          return () => clearInterval(id);
        }, [delay]);
      }

      export function Stopwatch() {
        const [seconds, setSeconds] = useState(0);
        const [running, setRunning] = useState(false);
        const [step, setStep] = useState(1);
        useInterval(() => setSeconds((s) => s + step), running ? 1000 : null);
        return (
          <div>
            <p>{seconds} s</p>
            <button onClick={() => setRunning(!running)}>{running ? 'Stop' : 'Start'}</button>
            <button onClick={() => setStep(10)}>Count in tens</button>
          </div>
        );
      }
      ```

      With fake timers, three seconds showed 3, switching to tens then one more second
      showed 13, and Stop froze it. Passing `null` as the delay pauses the timer, so the
      interval id never leaves the effect and there's no ref to manage. Only call an effect
      event from inside effects; it isn't meant for event handlers or for passing to
      children.
pitfalls:
  - >-
    **Showing a ref's value on screen.** Changing `ref.current` doesn't render, so the screen
    stays behind. If people should see it, it's state.
  - >-
    **Keeping a timer id in a `let`.** The next render runs the component again and the
    variable starts fresh, so Stop can't clear the interval. Keep the id in a ref, or inside
    the effect that owns the timer.
  - >-
    **Calling a hook conditionally.** A hook inside an `if` or after an early return shifts
    every later hook into the wrong slot, and React throws. Call hooks at the top and branch
    below them.
  - >-
    **Expecting a custom hook to share state.** Two components calling `useCart()` get two
    carts. Hold shared state once, in a common parent or in context, and have the hook read it
    from there.
  - >-
    **Naming a hook without `use`, or a plain helper with it.** Without the prefix the linter
    can't check the rules inside; with it on a function that calls no hooks, the linter
    restricts where you can call it for no reason.
  - >-
    **An inline callback ref that sets state.** A new function each render detaches and
    reattaches the ref, and if it sets state every time, the component can loop. Wrap it in
    `useCallback`.
verify:
  - lens: breaks
    check: 'Timer ids and other values the screen never shows live in a ref, not a `let` that resets on every render.'
  - lens: confuses
    check: 'Every function that calls hooks starts with `use`, and plain helpers don''t, so the linter checks the right code.'
  - lens: confuses
    check: 'A custom hook that seems to share data is checked for where the state lives, since each caller gets its own.'
  - lens: tests
    check: 'Start-and-stop controls are tested after at least one re-render, because a fresh variable only shows up then.'
interview:
  - question: What's the difference between useRef and useState?
    answer: >-
      Both keep a value across renders, but only state changes cause a render. I use state for
      anything the screen shows, and a ref for values the screen doesn't: an interval id, an
      `AbortController`, the previous value of a prop, or a DOM element I need to focus or
      measure. A plain variable doesn't work for those because the component function runs
      again on each render and the variable starts fresh. The discipline with refs is to read
      and write them in handlers and effects, not during render, since React doesn't track
      their changes and a render could show a stale value. If I find myself forcing a render
      after changing a ref, the value should have been state.
  - question: Why can't you call hooks inside a condition?
    answer: >-
      Because React identifies hooks by the order they're called, not by name. It stores each
      component's hook data in a list and, on every render, hands the first stored value to the
      first hook call, the second to the second, and so on. If a condition skips a hook on one
      render, every later hook reads the wrong slot; React detects the count change and throws
      "Rendered more hooks than during the previous render." The fix is to call every hook at
      the top level and put the condition inside the hook's callback or below it, or to split
      the conditional part into its own component. React 19's `use` is the documented exception,
      and the linter checks the rest by the `use` naming convention.
  - question: When would you write a custom hook, and what makes a good one?
    answer: >-
      When two components repeat the same stateful logic, usually an effect with its cleanup,
      or when a component's intent is buried under wiring. A good hook is named for what it
      gives, like `useOnlineStatus` rather than `useMountEffect`, has a small return value,
      and hides how it works so that can change. For subscriptions to outside sources I build
      it on `useSyncExternalStore` rather than state plus an effect. I also remember it shares
      logic, not state: each caller gets its own. The case against: a hook that wraps a
      single `useState` adds indirection without removing any complexity, so I don't extract
      one until there's real logic to name.
  - question: How do you give a parent access to a DOM node inside your component in React 19?
    answer: >-
      Accept `ref` as a prop and pass it to the element. In React 19 function components get
      `ref` like any other prop, so `forwardRef` is no longer needed. A `TextField` that
      renders a label and an input can take `ref` and put it on the input, and the parent
      can call `ref.current?.focus()` to move focus to it after an error. If I want to expose
      less than the whole node, say only `focus`, `useImperativeHandle` lets me hand back a
      small object instead. I keep this for focus, measurement and scrolling; if a parent
      wants to change what the child shows, that should be a prop.
