id: judgment.pressure-testing
title: Pressure-testing a design
objective: Pressure-test a design with a pre-mortem, a light failure-mode table, a steelman of the alternative and an adversarial review.
level: advanced
minutes: 10
concepts: [judgment.pre-mortem, judgment.failure-mode-table, judgment.steelman]
prerequisites: [sysdesign.the-method, judgment.what-scales, judgment.what-breaks]
opening:
  text: >-
    You'll find the holes in a design while they still cost a sentence to fix, not an
    outage. Four habits do it: a pre-mortem, a ranked failure table, a steelman and a review
    by someone paid to disagree.

steps:
  - type: prose
    id: imagine-it-failed
    body: >-
      Your team's design for a bike-share's unlock flow is done, and everyone likes it. Before
      anyone builds it, run a **pre-mortem**.


      Say: "It's six months from now. The launch failed. Write down why." Everyone writes
      alone for five minutes, then reads their reasons out. Once failure is a given, people
      explain it instead of defending the plan. Doubts get easier to say, too.

  - type: multiple-choice
    id: pick-premortem-question
    concept: judgment.pre-mortem
    difficulty: 1
    question: Which question opens a pre-mortem?
    choices:
      - text: It's March, and the launch failed. Why?
        correct: true
        feedback: >-
          Yes. The failure is given, so people look for causes.
      - text: What could possibly go wrong?
        feedback: >-
          It sounds close, but it invites a polite "not much". Assuming failure makes people
          hunt for reasons.
      - text: How confident are we, out of ten?
        feedback: >-
          A score hides the reasons, and the reasons are what a pre-mortem is for.
      - text: Is everyone happy with the design?
        feedback: >-
          That asks for agreement. The people with doubts are the ones who stay quiet.

  - type: prose
    id: failure-mode-table
    body: |-
      Turn the reasons into a **failure-mode table**: one row per way a part can fail, how
      likely, how bad, and how you'd notice. Rate with low, medium and high. Nobody knows if a
      risk is a 6 or a 7.

      ```yaml
      - part: dock
        failure: loses mobile signal, so it can't unlock
        likelihood: high
        impact: medium
        detection: unlock timeouts per dock, on a dashboard
      ```

  - type: bug-hunt
    id: hunt-rating-against-evidence
    concept: judgment.failure-mode-table
    difficulty: 2
    language: yaml
    code: |
      - failure: payment provider slow at peak
        likelihood: medium  # 2 slow spells last month
        impact: medium      # unlocks wait, rides still start
      - failure: dock can't report a returned bike
        likelihood: low     # 3 of 40 test docks lost signal daily
        impact: high        # rider charged for hours
      - failure: app crashes on one old phone model
        likelihood: low     # 1% of riders use it
        impact: medium      # they use the card reader instead
    prompt: >-
      A teammate filled in the table. One rating contradicts the evidence beside it. Tap
      that line.
    lines: [5]
    reasons:
      - text: Docks dropping signal daily isn't low likelihood
        correct: true
        feedback: >-
          Right. It happened every day in testing. That's high, and it tops the list.
      - text: Being charged for hours isn't high impact
        feedback: >-
          Money taken for a ride someone ended costs trust and support calls. High fits.
      - text: The payment row should be high impact
        feedback: >-
          Rides still start, only more slowly. Medium matches what the note says happens.
      - text: One old phone model deserves high likelihood
        feedback: >-
          One rider in a hundred, with a card reader to fall back on. Low fits the note.
    fix: |
      - failure: dock can't report a returned bike
        likelihood: high    # 3 of 40 test docks lost signal daily
        impact: high        # rider charged for hours

  - type: code-challenge
    id: write-triage
    concept: judgment.failure-mode-table
    difficulty: 3
    language: ts
    editable: '20-21'
    prompt: >-
      Write `triage(rows)`. Each row has a `failure`, a `likelihood` and an `impact` of
      `'low'`, `'medium'` or `'high'`, and a `detection` string. Look up each row's band in
      `MATRIX`: `'act'`, `'plan'` or `'accept'`.


      A row whose `detection` is empty or only spaces is silent, so it moves up one band:
      `'accept'` to `'plan'`, `'plan'` to `'act'`. Return `{ act, plan, accept }`, each a
      list of failures in the order given.
    hints:
      - '`MATRIX[row.likelihood][row.impact]` gives the band before anything else.'
      - '`detection.trim() === ''''` spots a silent row. `''act''` has nowhere higher to go.'
      - 'A small map does the move: `{ accept: ''plan'', plan: ''act'', act: ''act'' }`.'

  - type: prose
    id: steelman-and-attack
    body: >-
      The team chose docks that push events to the server. Before you commit, **steelman**
      the option you rejected: argue its best case, as its keenest supporter would. If you
      can't answer that, you haven't decided yet.


      Then ask for an **adversarial review**: a colleague whose job is to break the design.
      Answer each attack with a fix, a test, or a risk you accept in writing.

  - type: multiple-choice
    id: pick-the-steelman
    concept: judgment.steelman
    difficulty: 3
    question: The rejected option is polling each dock for its state. Which line steelmans it?
    choices:
      - text: Polling recovers by itself when a basement dock reconnects
        correct: true
        feedback: >-
          Yes. It names a real condition where polling wins.
      - text: Polling is fine, if you don't mind the cost
        feedback: >-
          That "if" is a jab, and it argues the weak version. A steelman makes the case at
          full strength.
      - text: Some engineers prefer polling
        feedback: >-
          A preference isn't an argument. A steelman gives the reason its supporters are
          right.
      - text: Polling is old technology, but it works
        feedback: >-
          Calling it old frames it to lose. The steelman looks for where it truly beats your
          choice.

  - type: ai-review
    id: review-wait-inside-transaction
    concept: judgment.steelman
    difficulty: 4
    language: ts
    request: Unlock a bike at a dock and start the ride, all or nothing.
    flawClass: performance
    code: |
      async function unlock(riderId: string, dockId: string) {
        return db.transaction(async (tx) => {
          const bike = await tx.bikes.claimAt(dockId, riderId);
          await docks.release(dockId, bike.id); // mobile network, 0.2 to 10 s
          await tx.rides.start(riderId, bike.id);
          return bike;
        });
      }
    prompt: >-
      An assistant wrote this. A load test at today's peak passed. In the adversarial review
      someone asks: "Will it hold at 10x on a sunny Saturday?" Tap the line at fault.
    lines: [4]
    reasons:
      - text: It holds a database connection while the dock answers
        correct: true
        feedback: >-
          Yes. Slow docks pin connections, and at 10x the pool runs dry.
      - text: The claim should come after the release
        feedback: >-
          Claiming first stops two riders getting one bike. The order is fine; the wait
          inside the transaction isn't.
      - text: Transactions are too slow for an unlock
        feedback: >-
          A short transaction costs milliseconds. This one is long because it waits on the
          network inside.
      - text: The ride should start before the claim
        feedback: >-
          Then a ride could start with no bike to ride. Claim, release, then start is the
          right order.
    fix: |
      async function unlock(riderId: string, dockId: string) {
        const bike = await db.transaction((tx) => tx.bikes.claimAt(dockId, riderId));
        try {
          await docks.release(dockId, bike.id); // no connection held while we wait
        } catch (error) {
          await db.bikes.unclaim(bike.id);
          throw error;
        }
        await db.rides.start(riderId, bike.id);
        return bike;
      }
    verify:
      question: How would you prove the fix holds at 10x?
      choices:
        - text: Load test at 10x with docks that answer slowly
          correct: true
          feedback: >-
            Yes. The slow dock was the cause, so the test must include it.
        - text: Load test at 10x with an instant fake dock
          feedback: >-
            Most people run this one. An instant dock never holds a connection for long, so it
            passes either way.
        - text: A unit test that `unlock` returns the bike
          feedback: >-
            That proves one rider's happy path. The failure needs many riders and slow docks
            at once.
        - text: Watch the dashboards after release
          feedback: >-
            Then riders find it for you, on the busiest day. The point is to find it first.

  - type: explain-back
    id: explain-top-risk
    concept: judgment.pre-mortem
    difficulty: 4
    audience: reviewer
    kind: risk
    prompt: >-
      In the design review, present the pre-mortem's top risk: a dock that can't report a
      returned bike. Say what could go wrong, and how you'd check.
    rubric:
      - It says what riders suffer, such as a ride that never ends and a charge for hours.
      - It backs the rating with evidence, such as three of forty test docks losing signal daily.
      - It says how you'd notice and prove the fix, such as alerts on overlong rides and a test with docks offline.
    modelAnswer: >-
      Top risk: a dock loses signal as a rider returns a bike. The ride never ends, so
      we charge for hours. It's likely, because three of our forty test docks dropped signal
      every day. We'll alert on rides open far past normal, and let the phone report a return
      that the dock confirms later. Before launch, we'll test the whole flow with docks
      offline.

recap:
  - Run a pre-mortem that assumes the launch failed and asks everyone why.
  - Rank failures by likelihood and impact on low, medium and high, and move silent ones up.
  - Steelman the option you rejected, and answer every attack with a fix, a test or a written risk.

recall:
  - id: card-premortem
    concept: judgment.pre-mortem
    front: How does a pre-mortem's question differ from "What could go wrong?"
    back: >-
      It states that the project has already failed and asks why. People then explain a
      failure instead of defending the plan.
  - id: card-table-columns
    concept: judgment.failure-mode-table
    front: What goes in each row of a light failure-mode table?
    back: >-
      The part and how it fails, its likelihood and impact on a low, medium, high scale, and
      how you'd notice.
  - id: card-silent
    concept: judgment.failure-mode-table
    front: Why does a failure nobody would notice move up the list?
    back: >-
      It keeps doing harm until someone stumbles on it, so the same likelihood and impact
      cost far more.
  - id: card-steelman
    concept: judgment.steelman
    front: What does it mean to steelman the option you rejected?
    back: >-
      Argue its strongest case, as its best supporter would. If you can't answer it, you
      haven't really decided.

references:
  - kind: essay
    title: Performing a Project Premortem
    authors: Gary Klein
    year: 2007
    venue: Harvard Business Review, September 2007
    url: https://hbr.org/2007/09/performing-a-project-premortem
    note: The short original description of the pre-mortem and how to run one.
    primary: true
    verified: false
  - kind: paper
    title: 'Back to the future: Temporal perspective in the explanation of events'
    authors: Deborah J. Mitchell, J. Edward Russo, Nancy Pennington
    year: 1989
    venue: Journal of Behavioral Decision Making, 2(1)
    note: The prospective hindsight study behind the pre-mortem. Imagining an outcome as certain helps people explain it.
    verified: false
  - kind: spec
    title: 'MIL-STD-1629A: Procedures for Performing a Failure Mode, Effects and Criticality Analysis'
    authors: US Department of Defense
    year: 1980
    note: The classic failure-mode analysis that the light table in this lesson slims down.
    primary: true
    verified: false

deepDive: >-
  Classic failure-mode analysis scores severity, occurrence and detection from 1 to 10, then
  multiplies them into a risk priority number. The product looks precise and isn't. The
  scales are ranks, not measurements, so a 2 times 9 and a 3 times 6 tie for very different
  risks. The automotive industry's 2019 FMEA handbook moved to a lookup table it calls
  action priority, much like the matrix in the challenge.


  A pre-mortem works on the same people who wrote the plan, so it has blind spots. Bring in
  someone from support or operations, who has seen how things really fail. Keep the list
  anonymous if the team is new or the stakes are political.


  An adversarial review has rules. Attack the design, never the author. Write down every
  attack and its answer. An attack you can't answer becomes a row in the table, or a test.


  The strongest pressure test is to make the failure happen. Slow a dependency down on
  purpose, cut a dock's network, kill a worker mid-job, and check the design does what it
  claims. That's fault injection. Run on purpose in production, it's often called chaos
  engineering.
