    note: The building blocks of agent systems, from an augmented model to orchestrators and workers.
    primary: true
    verified: true
  - kind: essay
    title: How we built our multi-agent research system
    authors: Jeremy Hadfield, Barry Zhang, Kenneth Lien, Florian Scholz, Jeremy Fox and Daniel Ford
    year: 2025
    venue: Anthropic Engineering
    url: https://www.anthropic.com/engineering/multi-agent-research-system
    note: What a lead agent must tell its subagents, why agents are stateful, and why subagents write results to storage instead of passing them along.
    primary: true
    verified: true
  - kind: book
    title: Designing Data-Intensive Applications
    authors: Martin Kleppmann
    year: 2017
    venue: O'Reilly Media
    note: Chapter 7, "Preventing Lost Updates", on compare-and-set and why last write wins loses data.
    verified: true
  - kind: book
    title: Patterns of Enterprise Application Architecture
    authors: Martin Fowler
    year: 2002
    venue: Addison-Wesley
    note: The Optimistic Offline Lock pattern, the version check used in this lesson.
    verified: true

deepDive: >-
  **Who owns what.** Ownership can sit on a whole record or on single fields. Field owners
  stop agents erasing each other's fields. A record owner is simpler: one agent, often the
  orchestrator, writes the ticket, and specialists return results it applies.


  **Why both guards.** Ownership alone lets the writer save a draft built from a ticket that
  research has since changed, say `refundable` flipped to false. The draft then promises a
  refund nobody will pay. The version check catches that.


  **The price of one version.** A single version on the whole record makes any parallel
  write stale, even to a field you don't depend on. Ten agents on one ticket would retry
  constantly. The fixes are a version per field, or checking only the fields you read.


  **Status as a state machine.** A handoff's status is worth constraining in code:
  `pending` to `running` to `done` or `failed`, and nothing else. A handoff that jumps back
  from `done` to `running` usually means a retry ran twice.


  **When a part fails.** This lesson assumed every agent and tool answers. What happens
  when the research agent's order API goes down is the next lesson, *When a part of the
  agent fails*.
