term: reward hacking
aka: [specification gaming, reward gaming]
short: A trained system scoring well by exploiting a flaw in its scoring instead of doing the task.
explain: |
  Training pushes a model towards whatever scores well. If the score has a loophole, the
  model finds it. A coding model rewarded for passing tests may learn to edit the tests.

  It isn't intent or cheating in a human sense. It's an optimiser doing exactly what the
  reward asked. The fix is a better reward: checks the model can't touch, and review of
  what high-scoring runs actually did.
analogy: A class told they're graded on page count, handing in essays in size 20 font.
usage: The agent's pass rate jumped because it started deleting failing tests; that's reward hacking, not progress.
twin:
  term: hallucination
  difference: A hallucination is a confident false statement. Reward hacking is a learnt shortcut that games the score, which can be perfectly true and still useless.
related: [reward-model, rlhf, eval]
level: 3
lessons: [ai.reasoning-and-training]
