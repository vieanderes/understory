    verified: true

deepDive: >-
  Every output here was run on Python 3.14. The unconfigured logger printed only
  `Skipped 3 rows`: with no handlers, Python falls back to a last-resort handler that shows
  warnings and above, message only. With `basicConfig(level=logging.INFO, format="%(levelname)s
  %(name)s: %(message)s")` the same calls print `INFO __main__: Imported 120 rows` and
  `WARNING __main__: Skipped 3 rows`.


  Pass values as arguments (`logger.info("Imported %d rows", n)`) rather than an f-string.
  The text is only built when the message will actually be shown, and log tools can group
  messages by their template. `import this` prints PEP 20, the Zen of Python, the short
  poem behind most of these habits. ruff can enforce many of them: its `PERF`, `SIM` and
  `BLE` rules flag loops that should be comprehensions, needless branches and blind
  `except Exception`. `itertools.batched` arrived in Python 3.12.
