id: career.take-home
title: The take-home task
objective: Know how a reviewer judges a take-home, and hand in work that runs, fails gracefully and explains its decisions.
level: essential
minutes: 10
concepts: [career.take-home-review, career.take-home-scope]
prerequisites: [career.interview-loop]
opening:
  text: >-
    You'll see a take-home through the reviewer's eyes, so you spend your hours where the
    marks are. Most candidates lose points on things that take ten minutes to fix.

steps:
  - type: prose
    id: what-a-take-home-is
    body: |-
      A **take-home** is a small project you build alone, meant to take three to eight
      hours. A reviewer then runs it, and often you discuss it on a call.

      For AI roles the brief is often a chatbot over some documents. Other favourites: a
      pipeline that pulls fields out of files, or a small agent.

  - type: prose
    id: how-its-judged
    body: |-
      Picture the reviewer. They have your repository and maybe 30 minutes.

      They read the README, run it from a fresh clone, and run the tests. Then they try to
      break it, and only then read the core code. They're scoring: does it work, was the
      scope sensible, is the code clear, and can you explain your choices?

  - type: multiple-choice
    id: pick-first-check
    concept: career.take-home-review
    difficulty: 1
    question: What does a reviewer usually do first with your take-home?
    choices:
      - text: Read the README and try to run it
        correct: true
        feedback: >-
          Yes. If it won't start, little else gets read.
      - text: Read every file from the top
        feedback: >-
          Few reviewers have time. They start where you point them: the README.
      - text: Count the features
        feedback: >-
          More features rarely win. A working core with clear reasons does.

  - type: ai-review
    id: review-readme
    concept: career.take-home-review
    difficulty: 2
    language: yaml
    request: Summarise my take-home README as short sections.
    flawClass: logic
    code: |
      run: copy .env.example to .env, add your API key, then make run
      assumptions: English documents only, 500 pages at most
      trade-off: search runs in memory, fine for 500 pages, not 50,000
      quality: answers looked right on the few questions I tried
      next: stream answers, then grow the test questions to 50
    prompt: >-
      A chatbot over documents. The reviewer will trust this README less because of one
      line. Tap it.
    lines: [4]
    reasons:
      - text: It's an impression, not repeatable evidence
        correct: true
        feedback: >-
          Right. Ship a few test questions with known answers, and report the score.
      - text: Asking the reviewer for a key is rude
        feedback: >-
          It's normal. Committing your own key would be the real mistake.
      - text: Searching in memory is the wrong choice
        feedback: >-
          For 500 pages it's right, and the line says when it stops being right.
    fix: |
      run: copy .env.example to .env, add your API key, then make run
      assumptions: English documents only, 500 pages at most
      trade-off: search runs in memory, fine for 500 pages, not 50,000
      quality: 20 test questions with known answers, 18 pass; make eval reruns them
      next: stream answers, then grow the test questions to 50

  - type: prose
    id: unhappy-path
    body: |-
      Reviewers try the unhappy path early: an empty file, a huge one, a question the
      documents can't answer.

      In an AI take-home that last one is the classic. The brief often says "say you don't
      know". A model given unrelated passages will still answer, confidently, from what it
      learnt in training.

  - type: bug-hunt
    id: hunt-no-answer
    concept: career.take-home-review
    difficulty: 3
    language: python
    code: |
      def answer(question, index, model):
          chunks = index.search(question, k=3)
          context = "\n\n".join(chunk.text for chunk in chunks)
          prompt = f"Use these notes:\n{context}\n\nQuestion: {question}"
          return model.complete(prompt)
    prompt: >-
      `index.search` always returns the three closest passages, each with `.text` and a
      `.score`. The reviewer asks about something the documents never mention. Tap the line
      to change.
    lines: [2]
    reasons:
      - text: It never checks the passages are relevant
        correct: true
        feedback: >-
          Yes. Weak matches go in, and the model answers anyway.
      - text: Three passages is too few
        feedback: >-
          More weak passages don't help. The missing piece is a relevance check.
      - text: The f-string is unsafe here
        feedback: >-
          Building a prompt with an f-string is fine. The problem is what goes into it.
    fix: |
      def answer(question, index, model):
          chunks = [c for c in index.search(question, k=3) if c.score >= 0.5]
          if not chunks:
              return "I don't have that information in these documents."
          context = "\n\n".join(chunk.text for chunk in chunks)
          prompt = f"Use these notes:\n{context}\n\nQuestion: {question}"
          return model.complete(prompt)

  - type: prose
    id: time-box
    body: |-
      Before you start, ask two things: roughly how long it should take, and whether AI
      tools are allowed.

      Then keep to the time, give or take an hour. Reviewers judge against the stated
      budget, so 20 hours of polish can look like poor judgement. Put what you'd add next
      in the README.

  - type: ai-review
    id: review-hand-in-note
    concept: career.take-home-scope
    difficulty: 3
    language: yaml
    request: Write the note I send with my take-home.
    flawClass: logic
    code: |
      built: upload PDFs, ask questions, answers cite the page
      time: about five hours, one over the four in the brief
      ai-use: an assistant drafted the loader and tests; I rewrote the chunking
      extras: I also added logins, a dashboard and dark mode
      missing: no streaming yet, first on the next-steps list
    prompt: >-
      The brief asked for a chatbot over documents in about four hours. Tap the line that
      costs marks.
    lines: [4]
    reasons:
      - text: It's work the brief never asked for
        correct: true
        feedback: >-
          Yes. It suggests weak scoping, and it's where the extra hour went.
      - text: Admitting you went over time
        feedback: >-
          Honesty about time is respected. Hiding it would be the risk.
      - text: Saying an assistant helped
        feedback: >-
          If tools are allowed, saying how you used them is exactly right.
    fix: |
      built: upload PDFs, ask questions, answers cite the page
      time: about four hours, as the brief asked
      ai-use: an assistant drafted the loader and tests; I rewrote the chunking
      missing: no streaming yet, first on the next-steps list

  - type: explain-back
    id: explain-first-ten-minutes
    concept: career.take-home-review
    difficulty: 4
    prompt: >-
      A brief asks for a chatbot over the attached documents. What must a reviewer see in
      their first ten minutes? Name three things.
    rubric:
      - It starts from a fresh clone with one documented command.
      - The README states assumptions, trade-offs and next steps.
      - There's evidence it works, including a question the documents can't answer.
    modelAnswer: >-
      It must run from a fresh clone with one command the README gives. The README must say
      what I assumed, what I traded off and what I'd do next. There must be evidence:
      tests on the core and a few test questions with known answers. And a graceful "I don't
      know" for a question the documents don't cover.

recap:
  - Picture the reviewer, who reads the README, runs it, then tries to break it.
  - Handle the unhappy path, above all the question the documents can't answer.
  - Keep to the time budget, disclose AI use, and list what's next.
recall:
  - id: card-reviewer-order
    concept: career.take-home-review
    front: In what order does a reviewer usually look at a take-home?
    back: >-
      README, run it from a fresh clone, run the tests, try to break it, then read the code.
  - id: card-unhappy-path
    concept: career.take-home-review
    front: Which question do reviewers of an AI chatbot take-home try early?
    back: >-
      One the documents can't answer, to see if it says so instead of inventing an answer.
  - id: card-quality-evidence
    concept: career.take-home-review
    front: What evidence of answer quality belongs in the README?
    back: >-
      A small set of test questions with known answers, the score, and a command to rerun them.
  - id: card-time-box
    concept: career.take-home-scope
    front: Why keep a take-home near its stated time?
    back: >-
      Reviewers judge against the budget, so extra hours of polish can read as weak scoping.

