summary: >-
  The reference solution is three files in one folder. `reading-list.js` holds five books as an array of objects, and small functions answer one question each: how many pages in total, which book is longest, how many are short. A counting `for` loop prints a numbered summary, and `node reading-list.js` shows it in the terminal. `index.html` marks up the same list with a `header`, a `nav` of fragment links, one `main` and a `footer`, with headings that form a clean outline and an `ol` because the order means something. Its suggestion form has an `action`, `method="post"`, a `name` and a `label` on every box, and `required` and `type="email"`, so the browser checks it and sends it with no JavaScript at all. `styles.css` starts with design tokens as custom properties: colour roles, a spacing scale of multiples of 8, type sizes and one page width. Every gap, padding and margin reads a token. The layout is written for a phone first, and two `min-width` media queries add wider padding, then a second column for the form. We ran the script in Node 24 and drove the page in Chromium at 320, 390, 768, 1024 and 1440 pixels, light and dark: no sideways scrolling, every spacing value on the 8 px grid, native validation blocking bad input, the exact request body captured, every colour pair above WCAG 2.2 AA, and zero axe violations.
remember:
  - >-
    The data is an array of objects with the same shape, so one loop can handle every book and adding a book is one `push`.
  - >-
    Each function answers one question and returns its answer, so `printSummary` only arranges results and every piece can be checked alone.
  - >-
    A counting `for` loop is used where the position matters, for the line numbers; `for...of` is used everywhere else.
  - >-
    The HTML says what each part is: landmarks for regions, headings by level, an `ol` because reading order means something, and a real `button`.
  - >-
    The form works without JavaScript because the browser does the work: `action` says where, `method` says how, and each `name` becomes a key.
  - >-
    `required` and `type="email"` stop a bad submit in the browser, but the server must check everything again, because anyone can send a request without the page.
  - >-
    Colours are roles, not values: components read `var(--accent)`, so a dark theme is one media query that redefines the roles.
  - >-
    Every gap, padding and margin is a spacing token that is a multiple of 8 px, and containers space their children with `gap`, so margins never collapse.
  - >-
    The layout is mobile first: the plain rules make the phone page, and `min-width` queries only add.
  - >-
    Check by looking and measuring: run the script, load the page at a phone width and a wide one, and compute every contrast ratio.
sections:
  - title: '1. The plan: three files and the order to build them'
    body: |-
      The brief asks for three things that fit together: data in JavaScript, a page in HTML and a look in CSS. Each gets its own file in one folder.

      ```text
      reading-list/
        reading-list.js   the books as data, and a summary printed with node
        index.html        the page: header, list, suggestion form, footer
        styles.css        tokens first, then base rules, layout and parts
      ```

      Build them in that order. The data comes first because it decides what the page shows: a title, an author, a page count and whether the book is next. Once the data is settled, the HTML marks up the same facts. The CSS comes last, because you can only style what exists.

      Plan the page on paper before you type. Write down what it must do:

      1. List five books, in reading order.
      2. Show which book is next.
      3. Let a visitor suggest a book, even with JavaScript switched off.
      4. Read well on a 390 px phone and a 1440 px monitor.

      Each line turns into a decision later. Reading order means an `ol`. "Next" is a property on the data and a label on the page. "Without JavaScript" means a plain HTML form. "Phone to monitor" means mobile-first CSS.

      One more decision up front: the JavaScript file does not run on the page. The brief asks for a summary printed to the console, and Node prints to the terminal, so `node reading-list.js` is enough. Keeping JavaScript off the page also makes the form's promise plain to check: nothing on the page needs a script to work.
  - title: '2. The data: one object per book'
    body: |-
      A book has several facts, so it's an object. There are several books, so they go in an array. That's the shape from the objects lesson: a list of objects with the same properties.

      ```js
      // The reading list: one object per book, in the order I plan to read them.
      const books = [
        { title: "Frankenstein", author: "Mary Shelley", pages: 280, upNext: true },
        { title: "Dune", author: "Frank Herbert", pages: 412, upNext: false },
        { title: "The Hobbit", author: "J. R. R. Tolkien", pages: 310, upNext: false },
        { title: "Pride and Prejudice", author: "Jane Austen", pages: 432, upNext: false },
        { title: "Middlemarch", author: "George Eliot", pages: 880, upNext: false },
      ];
      ```

      Look at the choices in those five lines.

      **Every object has the same four properties**, spelt the same way. A loop can then treat every book alike. One misspelt name, such as `Pages` in one object, would give `undefined` for that book and a wrong total with no error at all. The watching-code lesson hunted exactly that bug.

      **`pages` is a number, not text.** Written as `"280"`, the `+` in a total would join text instead of adding, and you'd get `0280412...` instead of a sum.

      **`upNext` is a boolean.** It already holds `true` or `false`, so it can be a condition on its own: `if (book.upNext)`. A string such as `"yes"` would need a comparison every time, and `"no"` would count as true.

      **The array order is the reading order.** No property stores a position. The position in the list is the position, which is one less fact to keep in step.

      **`books` is a `const`.** The name always points at the same list. You can still `push` a new book onto it, because `const` stops a new list being swapped in, not the list changing.

      Page counts differ between editions, so treat these as example data. The footer of the page says so too.
  - title: '3. Small functions that each answer one question'
    body: |-
      The summary needs four answers: a readable line per book, the total pages, the longest book and a count of short books. Each becomes a function that takes the list and returns its answer.

      ```js
      function describe(book) {
        return `${book.title} by ${book.author}, ${book.pages} pages`;
      }

      function totalPages(list) {
        let total = 0;
        for (const book of list) {
          total = total + book.pages;
        }
        return total;
      }

      function longestBook(list) {
        // Start from a real book, not from 0, so the answer is always on the list.
        let longest = list[0];
        for (const book of list) {
          if (book.pages > longest.pages) {
            longest = book;
          }
        }
        return longest;
      }

      function countShorterThan(list, limit) {
        let count = 0;
        for (const book of list) {
          if (book.pages < limit) {
            count = count + 1;
          }
        }
        return count;
      }
      ```

      **They return, they don't print.** A returned value can be stored, compared or placed inside other text. `longestBook` hands back the whole object, so the caller can choose to show its title, its author or both. A function that only called `console.log` would leave nothing to use.

      **The parameter is `list`, not `books`.** Each function works on whatever list it's given. That's why the same `totalPages` can later sum a list of finished books, or a test list of two.

      **`longestBook` starts from `list[0]`.** Starting from `0` would work here, because every book has pages. But the warmest-day bug in the watching-code lesson came from starting at a value that wasn't in the data. Starting from the first real item is the habit that avoids it.

      **`countShorterThan` takes the limit as a parameter.** The summary asks about 350 pages today. Tomorrow it might be 200. The number lives in the call, not buried in the function.

      **`describe` uses a template literal.** With `+`, a line like `book.title + " by " + book.author + ", " + book.pages + " pages"` breaks the moment you drop a space. Backticks and `${ }` show the finished sentence as you read it.
  - title: '4. The summary, and the exact output'
    body: |-
      The last function arranges the answers. It doesn't calculate anything itself.

      ```js
      function printSummary(list) {
        if (list.length === 0) {
          console.log("Your reading list is empty");
          return;
        }

        console.log(`Reading list: ${list.length} books`);
        // A counting loop, because the line numbers need the position, not only the book.
        for (let i = 0; i < list.length; i++) {
          const book = list[i];
          if (book.upNext) {
            console.log(`${i + 1}. ${describe(book)} (up next)`);
          } else {
            console.log(`${i + 1}. ${describe(book)}`);
          }
        }
        console.log(`Total: ${totalPages(list)} pages`);
        console.log(`Longest: ${longestBook(list).title}`);
        console.log(`Under 350 pages: ${countShorterThan(list, 350)}`);
      }

      printSummary(books);
      ```

      The three code blocks in sections 2, 3 and 4, in that order, are the whole of `reading-list.js`. Run it with `node reading-list.js`. Node 24 prints exactly this:

      ```text
      Reading list: 5 books
      1. Frankenstein by Mary Shelley, 280 pages (up next)
      2. Dune by Frank Herbert, 412 pages
      3. The Hobbit by J. R. R. Tolkien, 310 pages
      4. Pride and Prejudice by Jane Austen, 432 pages
      5. Middlemarch by George Eliot, 880 pages
      Total: 2314 pages
      Longest: Middlemarch
      Under 350 pages: 2
      ```

      **Why a counting loop here?** `for...of` hands you each book but not its position. The numbered lines need the position, so this one loop uses `for (let i = 0; i < list.length; i++)`. Indexes start at 0, and people count from 1, hence `i + 1`.

      **Why the empty check?** With an empty list, `list[0]` is `undefined`. `longestBook` would return `undefined`, and reading `.title` from it stops the program: `TypeError: Cannot read properties of undefined (reading 'title')`. The check at the top prints a friendly line instead, and `return` ends the function before anything reads a missing book.

      To see the functions adapt, add one line above the call and run again:

      ```js
      books.push({ title: "The Left Hand of Darkness", author: "Ursula K. Le Guin", pages: 304, upNext: false });
      ```

      The summary now starts `Reading list: 6 books`, gains a sixth numbered line, and ends with `Total: 2618 pages`, `Longest: Middlemarch` and `Under 350 pages: 3`. No function changed. That's the payoff of data in a list and functions that take the list.
  - title: '5. The page: the whole of index.html'
    body: |-
      The page marks up the same five books. Here's the complete file.

      ```html
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width">
          <title>My reading list</title>
          <meta name="description" content="Five books I want to read next, and a form to suggest another.">
          <link rel="stylesheet" href="styles.css">
        </head>
        <body>
          <header class="site-header">
            <div class="bar wrap">
              <p class="site-name">Reading list</p>
              <nav>
                <a href="#books">Books</a>
                <a href="#suggest">Suggest a book</a>
              </nav>
            </div>
          </header>

          <main class="page wrap">
            <div class="intro">
              <h1>Books I want to read</h1>
              <p>Five books, in the order I plan to read them. Know a good one? Suggest it below.</p>
            </div>

            <section id="books" class="books">
              <h2>The list</h2>
              <ol class="book-list">
                <li class="book">
                  <h3>Frankenstein</h3>
                  <p>Mary Shelley, 280 pages</p>
                  <p class="tag">Up next</p>
                </li>
                <li class="book">
                  <h3>Dune</h3>
                  <p>Frank Herbert, 412 pages</p>
                </li>
                <li class="book">
                  <h3>The Hobbit</h3>
                  <p>J. R. R. Tolkien, 310 pages</p>
                </li>
                <li class="book">
                  <h3>Pride and Prejudice</h3>
                  <p>Jane Austen, 432 pages</p>
                </li>
                <li class="book">
                  <h3>Middlemarch</h3>
                  <p>George Eliot, 880 pages</p>
                </li>
              </ol>
            </section>

            <section id="suggest" class="suggest">
              <h2>Suggest a book</h2>
              <p>Title and author are required.</p>
              <form class="form" action="/suggestions" method="post">
                <label class="field">Title <input name="title" required></label>
                <label class="field">Author <input name="author" required></label>
                <label class="field">Your email (optional) <input name="email" type="email"></label>
                <button class="button">Send suggestion</button>
              </form>
            </section>
          </main>

          <footer class="site-footer">
            <div class="wrap">
              <p>Page counts come from one edition and vary between printings.</p>
            </div>
          </footer>
        </body>
      </html>
      ```

      The `head` does four jobs, each from the images-and-head lesson. `meta charset="utf-8"` comes first, so the browser reads every letter correctly. The `viewport` tag makes a phone lay the page out at its own width. Without it, a phone draws the page wide and shrinks it, and the media queries in the CSS would never match. The `title` names the tab and the search result, and the description is the summary under it. The `link` loads the style sheet.

      `lang="en"` on `html` tells the browser and screen readers the page is in English, so a screen reader picks the right voice and pronunciation.

      The page has no images, so there's no `alt`, `width` or `height` to get right. If you add book covers, give each `img` all three.
  - title: '6. Landmarks, headings and the list'
    body: |-
      A screen reader user meets this page through the accessibility tree, not the pixels. So every element was picked for what it tells that tree.

      **Four landmarks.** `header` holds the site name and the menu. `nav` wraps the menu links. `main` holds what's unique to this page, and there's only one. `footer` holds the note about editions. Screen reader users can jump straight to any landmark, so "skip to the form" is one keystroke away.

      **The heading outline.** List the headings on their own and they read like a table of contents:

      ```text
      h1  Books I want to read
        h2  The list
          h3  Frankenstein
          h3  Dune
          h3  The Hobbit
          h3  Pride and Prejudice
          h3  Middlemarch
        h2  Suggest a book
      ```

      No level is skipped, and each level was chosen by position, not size. Each book title is an `h3` because it sits inside "The list". That lets a screen reader user jump from book to book by heading. The site name in the header is a `p`, not a heading: it's the same on every page and would only repeat the `h1`.

      **Why `ol`, not `ul`?** The brief's list is books you want to read, and this list is in reading order. Order carries meaning, so it's an `ol`. The browser numbers the items, and a screen reader announces a list of 5 items with the numbers that carry the order. If order didn't matter, `ul` would be right.

      **Why `section` elements?** Each groups a themed part of the page and starts with a heading, which is what `section` is for. Each also carries an `id`, so the nav links `#books` and `#suggest` jump to them. Fragment links need no script: the browser scrolls on its own, and a click on the same page sends no request.

      **Why "Up next" is text.** The first book's status is written in words, not shown only by colour. Anyone who can't see the green label still hears "Up next".

      **Why the `div` elements are fine.** `.bar`, `.intro` and the footer's inner `div` exist only for layout. A `div` has no role, so it adds nothing to the tree, which is exactly right for a box that means nothing.
  - title: '7. A form that works without JavaScript'
    body: |-
      Here's the form again, on its own:

      ```html
      <form class="form" action="/suggestions" method="post">
        <label class="field">Title <input name="title" required></label>
        <label class="field">Author <input name="author" required></label>
        <label class="field">Your email (optional) <input name="email" type="email"></label>
        <button class="button">Send suggestion</button>
      </form>
      ```

      Every part of sending is done by the browser. That's why it works with JavaScript switched off, blocked, or still downloading.

      **`action="/suggestions"`** says where the form goes. It starts with `/`, so it means the top of the site, whatever page the form sits on. A relative `suggestions` would break the day the page moved into a folder.

      **`method="post"`** says how. A suggestion adds something to a list, so it changes data. The forms lesson's rule applies: GET for a search you might bookmark, POST for anything that changes something. With POST the pairs travel inside the request, not in the address, so a suggestion can't be bookmarked, shared or sent twice from the history.

      **Every box has a `name`.** The name is the key the server receives. A box with only an `id` would show, take input and even pass `required`, yet send nothing. The forms lesson's missing guest count was that bug.

      **Every box has a `label`.** Wrapping the box in its `label` makes the text its name. A screen reader announces the box as Title, and says it's required, instead of a bare "edit text". Clicking the word Title puts the cursor in the box, which gives a bigger target on a phone.

      **Optional is said in words.** Two fields are required and one isn't. The paragraph above the form says title and author are required, and the email label says "(optional)". Nobody has to guess, or learn it by failing.

      **The button has no `type`.** Inside a form, a `button` submits by default, which is what this one should do. Pressing Enter in any box clicks it too. If you ever add a second button that shouldn't send, give that one `type="button"`.

      There's no server in this project, so `/suggestions` doesn't exist yet. Open `index.html` straight from your disk, submit, and Chromium shows an error page, because the browser tries to load the form's address and finds nothing there. That's expected. The page's half of the job is done: it builds the right request. A server that reads it is what the backend chapters add.
  - title: '8. What the browser checks, and what the server receives'
    body: |-
      We drove the form in Chromium and watched both the page and the network.

      **An empty submit sends nothing.** Click Send with every box empty, and no request leaves the page. The browser moves focus to the Title box, the first failing field, and shows a message that asks you to fill it in.

      **Title alone isn't enough.** Fill in only the title and submit again. Focus jumps to Author, the next failing field, and still nothing is sent.

      **A bad email is caught.** With title and author filled in and `hello` as the email, the browser blocks the submit and explains that an email address needs an `@`.

      **An empty optional email passes.** Clear the email box and submit. An empty box that isn't `required` skips its other checks, so the form goes. That's the behaviour you want for an optional field.

      Here is the request the page sent for that last submit, captured as it left the browser and trimmed to the lines that matter:

      ```http
      POST /suggestions HTTP/1.1
      Content-Type: application/x-www-form-urlencoded

      title=The+Left+Hand+of+Darkness&author=Ursula+K.+Le+Guin&email=
      ```

      Read the body as the server will. Each box with a `name` becomes a pair, `name=value`, joined by `&`, in the order the boxes appear. Spaces became `+`. The empty email still arrived, as `email=` with nothing after it. So the server must treat an empty value as "not given", not assume the key is missing.

      Characters that have a job in this format get escaped. We typed `Cats & Dogs: A History` and `reader@example.com`, and pressed Enter in the email box:

      ```text
      title=Cats+%26+Dogs%3A+A+History&author=A.+Writer&email=reader%40example.com
      ```

      `&` became `%26`, so it can't be mistaken for the start of a new pair. `:` became `%3A` and `@` became `%40`. The server decodes these back. Enter submitted the form, as the forms lesson said it would.

      With `method="get"`, the same pairs would appear in the address instead: `/suggestions?title=The+Left+Hand+of+Darkness&author=Ursula+K.+Le+Guin&email=`. Same format, different place.

      **The browser's checks are help, not protection.** They save a visitor a round trip and point at the mistake. But anyone can send a POST to `/suggestions` without this page. The server must check that title and author are present and not blank, and that the email looks right if it's given, all over again.
  - title: '9. Design tokens: colour roles that pass contrast'
    body: |-
      The style sheet opens with its tokens. Everything below reads them, and nothing below writes a colour, a space or a size by hand.

      ```css
      /* Design tokens: every colour, space and size on the page comes from here. */
      :root {
        --paper: #f4f1ec;
        --surface: #ffffff;
        --ink: #1f2328;
        --muted: #57606a;
        --line: #6e7781;
        --accent: #0b6e4f;
        --accent-strong: #08563d;
        --on-accent: #ffffff;

        /* The 8 pt grid: every gap, padding and margin is one of these. */
        --space-1: 0.5rem; /* 8px */
        --space-2: 1rem; /* 16px */
        --space-3: 1.5rem; /* 24px */
        --space-4: 2rem; /* 32px */
        --space-6: 3rem; /* 48px */
        --space-8: 4rem; /* 64px */

        --text-body: 1rem;
        --text-h3: 1.25rem;
        --text-h2: 1.5rem;
        --text-h1: clamp(2rem, 1.5rem + 2vw, 3rem);

        --font-ui: system-ui, sans-serif;
        --font-reading: Georgia, serif;
        --measure: 65ch;
        --page-width: 72rem;
        --radius: 0.5rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #16181d;
          --surface: #22262d;
          --ink: #e9e7e4;
          --muted: #aab1b9;
          --line: #8b949e;
          --accent: #5fcf9f;
          --accent-strong: #8fe0bd;
          --on-accent: #0d1f17;
        }
      }
      ```

      **Names say what a colour is for, not what it looks like.** `--accent` is the colour of links and the main button. It isn't called `--green`, because in dark mode it's a lighter green, and one day it might be blue. `--paper` is the page, `--surface` is a raised card or bar, `--ink` is text, `--muted` is secondary text and `--line` is a field's border. `--on-accent` is text that sits on the accent.

      **Dark mode is one media query.** It redefines the roles on `:root`, and every rule that reads a role follows, because custom properties inherit. No component rule mentions dark mode.

      **Every pair was checked.** Contrast is a ratio of the lighter colour's brightness to the darker one's, from 1:1 to 21:1. WCAG 2.2 AA asks for 4.5:1 for normal text and 3:1 for a field's border. We computed each pair with the WCAG formula:

      - Light: ink on paper 14.02:1, ink on surface 15.80:1, muted on paper 5.67:1, muted on surface 6.39:1, accent on paper 5.55:1, accent on surface 6.25:1, white on accent 6.25:1, white on accent-strong 8.72:1, line on surface 4.55:1, line on paper 4.04:1.
      - Dark: ink on paper 14.39:1, ink on surface 12.30:1, muted on paper 8.20:1, muted on surface 7.01:1, accent on paper 9.23:1, accent on surface 7.89:1, on-accent on accent 8.90:1, on-accent on accent-strong 11.07:1, line on surface 4.94:1, line on paper 5.77:1.

      The tightest is the light theme's field border against the page, at 4.04:1, still above the 3:1 it needs. The input's own fill and the text inside it use surface and ink, so they're covered too.

      **Why set `background` and `color` on inputs?** Form controls don't take the page's colours on their own. Without those two lines, the boxes would stay white in dark mode.

      **Why system fonts?** `system-ui` is already on every device, so nothing downloads and nothing reflows when a web font lands. Georgia gives the headings a bookish voice and ends in `serif`, so a device without it still gets a serif. A web font is a fine next step, with `font-display: swap` and a fallback of similar width.
  - title: '10. The base rules: reset, type and links'
    body: |-
      Next come the rules every page needs before any layout.

      ```css
      /* A short reset: widths include padding and border, and no stray margins. */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: var(--text-body);
        line-height: 1.5;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1,
      h2,
      h3 {
        font-family: var(--font-reading);
        line-height: 1.2;
      }

      h1 {
        font-size: var(--text-h1);
      }

      h2 {
        font-size: var(--text-h2);
      }

      h3 {
        font-size: var(--text-h3);
      }

      a {
        color: var(--accent);
      }
      ```

      **`box-sizing: border-box` on everything.** A width then includes padding and border. The input with `width: 100%` and padding fits its column exactly instead of poking out by 34 px.

      **Default margins go.** Browsers give `body`, headings and paragraphs their own margins, in sizes that aren't on the 8 px grid. Setting them to 0 means every space on the page comes from a token you chose. It also ends margin collapsing surprises, because spacing now comes from `gap` on the parent, and `gap` never collapses.

      **Type in `rem`.** `1rem` is the root font size, usually 16 px. If a reader turns up their browser's text size, every `rem` size grows with it. A `px` size would ignore their choice.

      **The heading scale.** Body text is 16 px, `h3` 20 px, `h2` 24 px. The `h1` uses `clamp(2rem, 1.5rem + 2vw, 3rem)`: 32 px on a phone, growing with the window, and 48 px from 1200 px up. We measured it at 32 px at 390 px wide, 39.36 px at 768, 44.48 px at 1024 and 48 px at 1440.

      **`line-height` as a plain number.** `1.5` is handed down as a number, so each element multiplies it by its own size. Body text gets 24 px lines, which is three steps of 8. Headings get the tighter `1.2`, because big text needs less room between lines.

      **Links keep their underline.** Only the colour changes. The underline tells people it's a link without relying on colour alone.
  - title: '11. The 8 pt grid in practice: layout and header'
    body: |-
      An 8 pt grid means every space is a multiple of 8: 8, 16, 24, 32, 48, 64. In CSS, 8 pt means 8 px here. Picking from a short list makes spacing consistent without measuring, and makes a wrong value stand out.

      ```css
      /* One centred column that the header, main and footer all share. */
      .wrap {
        max-width: var(--page-width);
        margin: 0 auto;
        padding-inline: var(--space-2);
      }

      /* Header */
      .site-header {
        background: var(--surface);
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-1) var(--space-3);
        padding-block: var(--space-2);
      }

      .site-name {
        font-weight: bold;
      }

      .bar nav {
        display: flex;
        gap: var(--space-2);
      }

      .bar nav a {
        font-weight: bold;
      }
      ```

      **The tokens are in `rem`, so the grid follows the reader.** `--space-1` is `0.5rem`, which is 8 px at the default size. A reader who sets 20 px text gets 10 px steps, and the proportions hold.

      **One column class, used three times.** `.wrap` caps the width at `72rem` (1152 px), centres it with `margin: 0 auto`, and keeps a 16 px gutter from the screen edge. The header's `.bar`, `main` and the footer's inner `div` all carry it. So at 1440 px their left edges line up exactly: we measured all three at x = 144.

      **The header is a flex row that may wrap.** `space-between` pushes the name and the menu to opposite ends, and `align-items: center` lines them up. `flex-wrap: wrap` is a safety net: on a very narrow screen the menu drops under the name instead of pushing off the side. Two values in `gap` set the row gap first, then the column gap.

      **What isn't on the grid, on purpose.** Font sizes and line heights follow the type scale. The field border is 1 px. The 8 px grid is for the spaces between and inside boxes, and every one of those is a token.

      We checked that claim, not only the CSS. In Chromium, a script read the computed margin, padding and gap of every element on the page. At 390, 768, 1024 and 1440 px, every non-zero value was a multiple of 8. The first run found one exception: inputs and buttons carry 1 px of top and bottom padding from the browser. Writing their padding in full, `padding: 0 var(--space-2)`, removed it.
  - title: '12. The list and the form, on the same grid'
    body: |-
      The main area and its parts are all grids spaced by `gap`.

      ```css
      /* Main: one column on a phone */
      .page {
        display: grid;
        gap: var(--space-6);
        padding-block: var(--space-4) var(--space-8);
      }

      .intro {
        display: grid;
        gap: var(--space-2);
      }

      .intro p {
        max-width: var(--measure);
        color: var(--muted);
      }

      .books,
      .suggest {
        display: grid;
        gap: var(--space-3);
      }

      /* The book list */
      .book-list {
        display: grid;
        gap: var(--space-2);
        margin: 0;
        padding-inline-start: var(--space-4);
      }

      .book {
        padding: var(--space-2) var(--space-3);
        background: var(--surface);
        border-radius: var(--radius);
      }

      .book p {
        margin-top: var(--space-1);
        color: var(--muted);
      }

      /* Two classes, so it beats `.book p` above. */
      .book .tag {
        display: inline-block;
        padding-inline: var(--space-1);
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-weight: bold;
      }
      ```

      **Bigger gaps between bigger things.** Sections sit 48 px apart, a heading and its content 24 px, cards 16 px, lines inside a card 8 px. The size of a gap tells the eye what belongs together.

      **The intro keeps a readable measure.** `max-width: 65ch` stops the paragraph running across a wide screen. Lines of 45 to 75 characters are easier to follow back.

      **The list keeps its numbers.** The `ol` keeps a 32 px start padding, which is where the browser draws "1.", "2." and so on. Each `li` stays a list item. Making the `li` itself a grid would change its `display` from `list-item` and take its number away, so the lines inside a card are spaced with `margin-top` instead.

      **The tag needs two classes.** `.book p` scores (0, 1, 1) and would win over `.tag` at (0, 1, 0), turning the label grey. `.book .tag` scores (0, 2, 0) and wins, with no `!important`. It's `inline-block`, so it hugs its words but takes padding like a block.

      Now the form, the button and the footer:

      ```css
      /* The form */
      .form {
        display: grid;
        gap: var(--space-3);
      }

      .field {
        display: grid;
        gap: var(--space-1);
        font-weight: bold;
      }

      .field input {
        width: 100%;
        min-height: var(--space-6);
        padding: 0 var(--space-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        font-family: inherit;
        font-size: inherit;
        font-weight: normal;
      }

      .button {
        min-height: var(--space-6);
        padding: 0 var(--space-3);
        border: 0;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-family: inherit;
        font-size: inherit;
        font-weight: bold;
      }

      .button:hover {
        background: var(--accent-strong);
      }

      /* Footer */
      .site-footer {
        padding-block: var(--space-4);
        background: var(--surface);
        color: var(--muted);
      }
      ```

      **Each label is a two-row grid.** Its text sits in the first row and the box in the second, 8 px apart. The label stays wrapped around its box, so the two stay linked.

      **Fields and the button are 48 px tall.** `min-height: var(--space-6)` with `border-box` makes the whole box 48 px, border included. That lands on the grid and gives a comfortable target for a thumb.

      **Controls inherit the page's font.** Inputs and buttons use their own small font by default. `font-family: inherit` and `font-size: inherit` give them the page's 16 px. Text under 16 px in a field makes some phones zoom in when it gets focus.

      **The focus ring stays.** Nothing removes the browser's own outline, so keyboard users always see where they are.
  - title: '13. Mobile first, then wider screens'
    body: |-
      Everything so far is the phone page. The last block only adds.

      ```css
      /* Wider screens only add. */
      @media (min-width: 48rem) {
        .wrap {
          padding-inline: var(--space-4);
        }
      }

      @media (min-width: 64rem) {
        .page {
          grid-template-columns: 2fr 1fr;
          align-items: start;
          gap: var(--space-6) var(--space-8);
        }

        .intro {
          grid-column: 1 / -1;
        }
      }
      ```

      The code blocks in sections 9 to 13, in order, are the whole of `styles.css`.

      **On a phone** there's one column. The list comes first and the form after it, the same order as the HTML, which is also the order a screen reader reads.

      **From 48rem (768 px)** the side gutter grows from 16 px to 32 px, because a tablet has room to breathe.

      **From 64rem (1024 px)** the page gets two columns. The list takes two shares and the form one, with 64 px between them. The intro spans both with `grid-column: 1 / -1`, from the first line to the last. `align-items: start` lets each column be as tall as its content. Without it, the shorter form column would stretch to the list's height, and its rows would spread apart.

      **The breakpoints are where the content needs them.** Below about 1024 px, a form beside the list would squeeze both, so the form stays underneath. Above it, the list would stretch into very long cards, so the form moves beside it. They're in `rem`, so a reader with larger text gets the one-column layout sooner, which is what their text needs.

      **Why the query order matters.** Mobile first means a phone never loads a two-column layout and undoes it. The plain rules are the whole phone page, and each query adds one thing.

      We measured the result in Chromium. At 320, 390, 768, 1024 and 1440 px wide, in light and dark, the page's scroll width equalled its visible width: no sideways scrolling anywhere. At 390 px the list is 358 px wide, the screen minus two 16 px gutters. At 1440 px the column is centred at 1152 px, the list is 683 px wide and the form starts at x = 923.
  - title: '14. How the solution was checked'
    body: |-
      Every claim above was checked by running something. Here's how, so you can repeat it on your own version.

      **The script.** `node reading-list.js` in Node 24.21 printed the output in section 4, line for line. An empty list printed `Your reading list is empty`. The six-book version printed the totals quoted there.

      **The page at real widths.** Playwright loaded `index.html` and `styles.css` in Chromium, served from a made-up local address so the form had somewhere to post. At each width it compared the document's `scrollWidth` with its `clientWidth`. A difference of 0 means nothing sticks out sideways.

      ```js
      const overflow = await page.evaluate(
        () => document.documentElement.scrollWidth - document.documentElement.clientWidth,
      );
      ```

      **The 8 px grid.** A second script read `getComputedStyle` for every element and listed any margin, padding or gap that wasn't a multiple of 8. The final list was empty at every width.

      **The form.** The test clicked Send on an empty form, then with only a title, then with a bad email. After each click it recorded which box had focus and whether any request had left. Then it intercepted the valid POST and printed its body, which is the request in section 8.

      **Contrast.** A short function applied the WCAG formula to each token pair in both themes. It turns each colour into a relative brightness and divides the lighter by the darker, after adding 0.05 to both. The results are in section 9.

      **Accessibility rules.** axe, an automated checker, ran against the page at 320, 390 and 1440 px, light and dark, with its WCAG A and AA rules up to version 2.2. It found no violations. Automated checks catch missing labels and low contrast. They can't tell you whether a heading's words make sense, so read the headings list aloud too.

      **Your eyes.** Screenshots at 390 and 1440 px, in both themes, showed the numbers beside each card, the label above each field, and the Up next tag, readable everywhere.
  - title: '15. Decisions and trade-offs'
    body: |-
      Every choice in this solution gave something up. Here are the main ones, so you can choose differently on purpose.

      **The books are written twice.** Once as objects in JavaScript, once as markup in HTML. That breaks "one fact, one place": add a book to one file and forget the other, and they disagree. The alternative is a script that builds the list from the array, but that's DOM scripting this part hasn't taught beyond `textContent`, and it would make the list vanish with JavaScript off. For now the duplication is small and visible. Later chapters show how a server or a build step writes the HTML from the data.

      **No JavaScript on the page.** The summary lives in the terminal, not on screen. A `script` element could load the same file, and the browser's console would show the same lines. It's left out so the page has nothing that could fail to load.

      **POST, not GET.** A suggestion changes data, so it's POST. The cost is that a visitor can't bookmark a half-filled suggestion. That's fine, since no one wants to.

      **Three fields, not more.** A "why should I read it" box would need several lines, which a single-line `input` doesn't suit. Rather than use an element this part hasn't taught, the form asks only for what it must. The email is optional, because asking for more than you need puts people off.

      **Browser messages, not custom ones.** The validation messages come from the browser, in the visitor's language, with no code. They look different in each browser, and you can't style them. For a first project, that's the right trade.

      **Hover without motion.** The button darkens on hover with no transition. A colour fade would be harmless, but it adds a rule to maintain and nothing to understand. Movement, if you add it, belongs in transforms, with a `prefers-reduced-motion: reduce` rule to tone it down.

      **Two breakpoints, not five.** The layout has only two moments where the content needs a change. Each extra query is another state to test at every width.

      **What a next version adds:** a server that stores suggestions and checks them again, book covers with `alt`, `width` and `height`, and the list built from the data instead of typed twice.
checklist:
  - '`node reading-list.js` prints the numbered summary, the total, the longest book and the short-book count, with no errors.'
  - Every book object has the same property names, `pages` is a number and `upNext` is a boolean.
  - Each helper function returns its answer instead of printing it, and takes the list as a parameter.
  - An empty list prints a message instead of crashing on `list[0]`.
  - 'The page has one `h1`, one `main`, a `header` with a `nav`, and a `footer`.'
  - Heading levels never skip, and each book title is an `h3` under the list's `h2`.
  - The books are an `ol`, in the same order as the array, and the next book says "Up next" in words.
  - The `head` has `charset`, `viewport`, a `title`, a description and the style sheet link, and `html` has `lang`.
  - The form has an `action` that starts with `/` and `method="post"`.
  - Every input has a `name` and a visible `label`, and the optional field says "(optional)".
  - Title and author are `required`, the email box has `type="email"`, and an empty submit sends no request.
  - The submitted body holds `title`, `author` and `email` pairs, URL-encoded.
  - '`styles.css` starts with tokens on `:root`, and no colour value appears outside the token blocks.'
  - Every margin, padding and gap reads a spacing token that is a multiple of 8 px.
  - Containers space their children with `gap`, and default heading and paragraph margins are reset.
  - 'Text and links pass 4.5:1 and field borders pass 3:1, in light and dark.'
  - The phone layout is the plain rules, and media queries use `min-width` and only add.
  - At 390 px and 1440 px there's no sideways scrolling, and the form sits beside the list from 1024 px.
  - Fields and the button are at least 48 px tall and use the page's 16 px text.
  - The browser's focus ring is visible on every link, field and button.
