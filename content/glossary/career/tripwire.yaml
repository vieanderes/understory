term: tripwire
aka:
  - decision tripwire
  - what would change my mind
short: A signal agreed in advance that tells you to revisit a decision you already made.
explain: |
  Once a decision is made, people stop looking at it. Months later it's still in place,
  though the reasons behind it are gone.

  A tripwire fixes that. You name, up front, the evidence that would change your mind.
  "If the queue grows past ten thousand jobs, we move to a broker." Now the decision has
  a review built in.

  It also makes a recommendation easier to accept. People agree more readily when they
  can see the way back. Make the signal concrete and measurable, not "if it gets slow".
analogy: The fuel light in a car. You don't watch the gauge all day; the light tells you when to act.
usage: Let's ship the single database, with a tripwire at a thousand writes a second.
