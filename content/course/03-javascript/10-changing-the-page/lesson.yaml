deepDive: >-
  `document.querySelectorAll("li")` finds every match, as a NodeList you can loop with
  `for...of`. It doesn't update: add a matching element later and the list you already hold
  won't include it. Run the query again when you need the new one.


  `append` takes several things at once, text included: `row.append(name, " - ", price)`.
  `prepend` adds at the start, and `before` and `after` place an element next to another.
  Appending an element that's already in the page moves it rather than copying it.


  Other form controls follow the same pattern. A `select` has `value`, the value of the
  chosen option. A number input has `valueAsNumber` as well as its string `value`, and it's
  `NaN` when the box is empty.


  `element.style.color = "red"` sets one inline style, which beats most rules in the style
  sheet. It suits values only known while the code runs, such as a position that follows the
  pointer. For states like open, read or selected, a class keeps the design in the CSS.
