term: cache stampede
aka: [thundering herd, dogpile effect]
short: Many requests miss the same expired copy at once and all rush to rebuild it from the database.
explain: |
  A popular page's stored copy expires. In the next second, a thousand requests find it
  missing, and all thousand run the same expensive query. The database falls over, so the
  copy is never rebuilt, so the next thousand do the same.

  Three fixes, often combined. Let only one request rebuild while the others wait or get
  the old copy (**single flight**, or a short lock). Refresh hot keys a little before they
  expire. And add random jitter to expiry times, so keys made together don't all expire
  together.
analogy: The shop doors opening on sale day. Everyone was waiting for the same moment, and everyone rushes the same shelf.
usage: The homepage key expired at midnight and we got a cache stampede; let one request rebuild it and serve the stale copy meanwhile.
related: [cache, cache-invalidation, load-shedding]
level: 3
lessons: [sysdesign.caching-patterns, perf.server-caching]
