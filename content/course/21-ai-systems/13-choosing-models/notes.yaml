summary: >-
  Every model call is a choice of model, and that choice decides cost, quality, speed and
  where your users' data goes. This lesson is about making it on evidence instead of
  habit: which kind of model to use at all, how to adapt it when it falls short, which
  request goes to which model, and which models a given piece of data may reach.


  The first fork is **frontier models through an API** against **open-weight models you
  host**. An API gives you the strongest models, paid per token, with nothing to run.
  Self-hosting gives control: data never leaves your network and the version is pinned.
  But you pay for GPUs whether they're busy or idle, for people to run them, and for your
  own evals at every upgrade. Steady, very high volume or strict data rules can justify it;
  a few hundred requests a day almost never do.


  When quality falls short, prompting comes first, retrieval supplies missing facts, and
  fine-tuning on corrected examples pays off for a narrow, stable task, often to make a
  small model good enough. Then routing: code picks a model per request from the cost of a
  wrong answer, measured quality on that task and the budget. And none of it may break the
  provider's **data terms**, read per model and per platform.
remember:
  - Self-hosting an open-weight model costs GPUs that bill when idle, people to run them, and your own evals for every upgrade, not only the download.
  - Try prompting first, retrieval when facts are missing, and fine-tuning only for a narrow, stable task with thousands of corrected examples.
  - Fine-tuning teaches behaviour and format, not fresh facts. Facts that change belong in retrieval.
  - Route by risk in code, before the call. A request that moves money or reaches a customer needs a higher measured bar.
  - A model with no score on a task hasn't been measured, and unmeasured means unproven.
  - Read data terms per model and per platform. DPA, training on inputs, retention and region can all differ.
  - Every fallback path obeys the same data rules as the main path.
  - Never evaluate a fine-tuned model on examples it trained on. Hold out a test set before training.
sections:
  - title: What self-hosting really costs
    body: |-
      The weights are free to download. Everything after that is yours. Start with memory:
      the weights alone take roughly the parameter count times the bytes per parameter.

      ```python
      def weights_gb(params_billion, bits):
          return params_billion * 1e9 * bits / 8 / 1e9


      for params, bits in [(8, 16), (70, 16), (70, 4)]:
          print(f"{params}B at {bits}-bit: {weights_gb(params, bits):.0f} GB")
      # 8B at 16-bit: 16 GB
      # 70B at 16-bit: 140 GB
      # 70B at 4-bit: 35 GB
      ```

      Add memory for each request's context on top. A large model at full precision needs
      several GPUs; quantising to 4 bits shrinks it, usually with some loss you must
      measure on your own tasks.

      Then the running costs. GPUs bill by the hour whether you send one request or a
      million, so self-hosting only pays when traffic is steady and high enough to keep them
      busy, with many requests batched together. Someone has to deploy, monitor, patch and
      scale the serving stack, and be on call for it. Each new model release means a new
      round of evals, prompt changes and a migration. A provider's API turns all of that
      into a per-token price, and a quiet day costs nothing.

      Self-hosting earns its cost in a few situations: data that truly may not leave your
      network, very high steady volume of a task a small model handles well, a need for a
      version that never changes, or offline and edge use. Run the numbers with your own
      traffic before deciding, and include the people.
  - title: Prompting, retrieval or fine-tuning
    body: |-
      Treat these as levers with different jobs, tried in order of cost.

      **Prompting** fixes unclear instructions, missing examples and format problems. It's
      instant to change and to roll back, so it always comes first, and an eval set tells
      you whether a change helped.

      **Retrieval** fixes missing or changing facts: this term's dates, the current price
      list, a policy updated last week. Chapter 20's RAG puts the facts in the prompt at
      question time, with sources a person can check. Fine-tuning can't do this job well,
      because facts baked into weights go stale and can blend with older ones.

      **Fine-tuning** trains a model further on examples of the task. It shines for a
      narrow, stable task with thousands of corrected examples, such as labelling
      enrolment forms by type, where a tuned small model can match a large prompted one at a
      fraction of the cost and latency. A review queue produces exactly those examples:
      every correction is a label. Parameter-efficient methods such as LoRA train small
      added matrices instead of the whole model, which makes tuning cheaper.

      Fine-tuning has running costs: data cleaning, a held-out test set no training run ever
      sees, and a fresh tune and eval whenever the base model changes. Training a small model
      on a larger model's outputs, called distillation, is common, but check the provider's
      terms first, because some restrict using outputs to build competing models.
  - title: Routing by risk, on measured quality
    body: |-
      Lesson 12 routed by difficulty to save money. Risk routing asks a second question:
      what does a wrong answer cost here? Drafting an internal summary and paying out a
      refund can use the same words and carry very different risk.

      Decide risk in code from facts about the request: does it move money, reach a
      customer, touch personal data, or change a record? Give each risk level a quality bar,
      and give each model a score per task from your eval set, not a general reputation. A
      model is eligible for a request only if its score on that task clears the bar, its
      cost fits the budget, and its data terms allow the data. Then pick the cheapest
      eligible one.

      Three details keep the router honest. A model that was never measured on a task is not
      eligible for it, however strong it is elsewhere. Scores go stale, so re-run the evals
      when a provider updates a model or you change a prompt, and recompute the routing
      table from them. And when nothing is eligible, the safe answer depends on risk: a
      high-risk request goes to a person, a low-risk one can wait for a batch or a retry.
      Log the chosen model, its score and the reason for every request, so you can answer
      "why did this go there?" months later.
  - title: Reading a provider's data terms
    body: |-
      In lesson 9, sending personal data to a provider was processing, with the provider as
      your processor. Before a model
      may receive a class of data, four questions need written answers, for that exact model
      on that exact platform.

      - **Contract.** Is there a data processing agreement covering this service?
      - **Training.** Are your inputs and outputs used to train models? Business API terms
        usually say no, but check, and check any free tier or trial separately.
      - **Retention.** How long are inputs kept, including for abuse monitoring? Is zero
        retention offered, to whom, and on which models?
      - **Region.** Where is the data processed and stored, and can you pin a region?

      The answers vary more than people expect. Zero retention can be available on most of a
      provider's models but not all of them. The same model resold through a cloud platform
      comes under that platform's terms and regions. Record the answers where code can read
      them, and let the router check them on every call.

      ```python
      REGISTRY = {
          "api-large": {"dpa": True, "trains_on_inputs": False, "regions": {"eu", "us"}},
          "api-small": {"dpa": True, "trains_on_inputs": False, "regions": {"us"}},
          "trial-endpoint": {"dpa": False, "trains_on_inputs": True, "regions": {"us"}},
      }


      def allowed(model, data_class, region):
          terms = REGISTRY[model]
          if data_class == "public":
              return True
          return terms["dpa"] and not terms["trains_on_inputs"] and region in terms["regions"]


      print([m for m in REGISTRY if allowed(m, "personal", "eu")])   # ['api-large']
      ```

      Review the registry when terms change, and have a person who reads contracts sign off
      on it.
pitfalls:
  - '**Counting only the download as the cost of open weights.** GPUs bill when idle, and someone runs, patches and re-tests the model. Compare total cost at your real traffic.'
  - '**Fine-tuning to teach facts.** Facts in weights go stale and blend with old ones. Use retrieval for anything that changes.'
  - '**Evaluating a tuned model on its training data.** It scores brilliantly and does no better in production. Split off a test set before training.'
  - '**Routing on reputation instead of measurement.** A strong general model can be weak on your task. Route only on per-task eval scores.'
  - '**A fallback that skips the data rules.** The main path is filtered, the backup is not, and an outage leaks data. Filter every attempt.'
  - '**Assuming terms are the same across models and platforms.** Retention, training and region can differ per model and per reseller. Check each one you use.'
  - '**Trusting a free trial with real data.** Trial and consumer terms often differ from business terms. Keep personal data on contracted services only.'
verify:
  - lens: leaks
    check: Force the primary model to fail on a request with personal data, and confirm the fallback only reaches models whose terms allow that data.
  - lens: tests
    check: Confirm the fine-tuning test set shares no example with the training set, by id or by text, before trusting any score.
  - lens: breaks
    check: Re-run the per-task evals after any provider model update, and recompute which models clear each risk bar before routing to them.
  - lens: scales
    check: Before self-hosting, model GPU hours at peak and at night with real traffic, because idle capacity often costs more than the API would.
  - lens: confuses
    check: Log the chosen model, its measured score and the routing reason for each request, so anyone can explain a routing decision later.
interview:
  - question: When would you self-host an open-weight model instead of using a frontier model through an API?
    answer: >-
      When control or volume outweighs the running cost. Self-hosting makes sense if data
      genuinely can't leave our network, if we need a pinned version that never changes,
      or if we have steady, very high volume of a task a smaller model handles well, so the
      GPUs stay busy. Otherwise an API usually wins: the strongest models, per-token pricing,
      and nobody on call for a serving stack. The hidden costs of self-hosting are GPUs that
      bill when idle, memory sized to the weights plus context, engineers to deploy and
      patch, and a full eval cycle at every upgrade. I'd decide with numbers: our real
      traffic profile, cost per completed task on both options, and quality on our eval set.
      Often the answer is mixed, an API for hard requests and a self-hosted small model for
      one high-volume classification.
  - question: Your team wants to fine-tune a model. How do you decide whether that's the right move?
    answer: >-
      I ask what's actually failing. If it's instructions or format, better prompting with
      examples fixes it fastest. If the model lacks facts, especially changing ones,
      retrieval is the fix, because tuned-in facts go stale. Fine-tuning fits a narrow,
      stable task where we have thousands of corrected examples and a cost or latency
      reason to use a smaller model, like classifying form types at high volume. Before
      tuning, I'd set aside a held-out test set and compare three versions on it: the best
      prompt, prompt plus retrieval, and the tuned model. I'd also count the running cost:
      cleaning data, re-tuning when the base model changes, and serving the tuned model. If
      the tuned model wins on held-out data and on cost per task, we ship it behind the same
      validation as before.
  - question: How would you route requests between several models?
    answer: >-
      In code, before the call, from measured facts. Each request gets a risk level from
      what it does: moving money or reaching a customer is high, an internal draft is low.
      Each risk level has a quality bar, and each model has a score per task from our eval
      set. A model is eligible if its score on this task clears the bar, its cost fits the
      remaining budget, and its data terms allow the request's data. I pick the cheapest
      eligible model. If none qualifies, high-risk work goes to a person and low-risk work is
      deferred. Unmeasured tasks count as ineligible. I re-run evals on provider updates and
      log every decision with its reason. Before adding a cascade, I'd also test one strong
      model at a lower effort setting, which keeps a single prompt cache and may be simpler.
  - question: Legal asks whether we can send gym members' health notes to an LLM provider. What do you check?
    answer: >-
      Four things, for the exact model and platform we'd use. A data processing agreement
      with the provider that covers this service. Whether inputs or outputs are used for
      training, which business API terms usually exclude, while trials and consumer tiers
      may not. Retention: how long inputs are kept, including for abuse monitoring, and
      whether zero retention is available on this specific model, because it can differ
      between models. And region: where data is processed and whether we can pin it. Health
      data is a special category under GDPR, so we'd also need a lawful basis, data
      minimisation such as redacting what the task doesn't need, and likely an impact
      assessment. I'd encode the approved models per data class in a registry the router
      enforces, including on fallbacks.
