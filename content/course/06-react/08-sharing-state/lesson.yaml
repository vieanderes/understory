deepDive: >-
  **Older code.** Before React 19 the provider was written `<ThemeContext.Provider
  value="dark">`. It still works, so you'll see both.


  **Context and renders.** When a provider's value changes, every component that reads that
  context renders again. A value that changes many times a second, like a mouse position,
  is a poor fit. Split rarely-changing settings and busy values into separate contexts.


  **Try composition first.** Before reaching for context, check whether the middle
  components could take `children` instead. A layout that places `{children}` never needs to
  know about the user. The top component can pass `<Avatar user={user} />` straight in.


  **A prop that starts state.** Sometimes a picker should start from a prop, then go its
  own way. Name that prop `initialQuantity`, so the name says it's read once.
