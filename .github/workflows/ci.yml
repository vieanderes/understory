# One job, so dependencies install once and the build is reused. Steps run cheapest first,
# so a broken lesson or a lint slip fails in minutes, not after the full suite.
#
# Cost is Actions minutes. The end-to-end suite is the expensive part (about 50 minutes for
# desktop and phone), so it runs on demand and on pull requests from people, not on every
# push to main and not on Dependabot's weekly bumps. Run it locally with `pnpm test:e2e`
# before a push that touches the UI, or start it here with "Run workflow".
name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'data/news/**'
  push:
    branches: [main]
    # Docs change nothing that runs. The news bot commits data/news/*.json every day, and
    # the news workflow validates those itself.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'data/news/**'
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Run the end-to-end suite as well'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    # A hung step must not burn the month's minutes.
    timeout-minutes: 90
    env:
      E2E: ${{ (github.event_name == 'workflow_dispatch' && inputs.e2e) || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Strict here, so the unit suite skips its own full validation of the real content.
      - run: pnpm validate:content --strict
      - name: Dependency audit (must be completely clean)
        run: pnpm audit --audit-level=low
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

      # WebKit as well as Chromium: the phone project runs on Safari's engine.
      - if: env.E2E == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - if: env.E2E == 'true'
        run: pnpm test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure() && env.E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
