id: js.arrays
title: Arrays and iteration
objective: "Write arrow functions for `map`, `filter`, `find` and `reduce`, and know which methods change the array."
level: essential
minutes: 10
concepts: [js.arrow-functions, js.array-iteration, js.array-helpers, js.array-mutation]
prerequisites: [js.destructuring-and-spread]
opening:
  text: >-
    You'll turn a list into a shorter list, a new list or a total, each in one line. And
    you'll spot the methods that quietly rearrange the list you still need.

steps:
  - type: prose
    id: arrow-functions
    body: |-
      Many array methods take a function and call it once for each item. A function handed
      over like that is a **callback**. The short way to write one is an **arrow function**:

      ```js
      const prices = [4, 10, 25];
      const doubled = prices.map((price) => price * 2);
      ```

      `(price) => price * 2` takes a price and returns it doubled. `map` puts each result in a
      new array: `[8, 20, 50]`. Wrap the body in braces, and you need your own `return`.

  - type: predict-output
    id: predict-map-leaves-original
    concept: js.arrow-functions
    difficulty: 1
    language: js
    code: |
      const minutes = [30, 45, 90];
      const hours = minutes.map((m) => m / 60);
      console.log(hours);
      console.log(minutes);
    question: What does the last line log?
    choices:
      - text: '`[ 30, 45, 90 ]`'
        correct: true
        feedback: >-
          Right. `map` builds a new array and leaves the old one alone.
      - text: '`[ 0.5, 0.75, 1.5 ]`'
        feedback: >-
          That's `hours`. `map` doesn't write back into `minutes`, it hands you a fresh array.
      - text: '`undefined`'
        feedback: >-
          `minutes` still exists and still holds its three numbers. Only `hours` is new.

  - type: prose
    id: filter-find-some
    body: |-
      `filter` keeps the items whose callback returns true, in a new array:

      ```js
      const cheap = prices.filter((price) => price < 20); // [4, 10]
      ```

      `find` returns the first item that passes, or `undefined`. `some` asks whether any item
      passes, and `every` asks whether all of them do. Both answer `true` or `false`.
      `includes(10)` checks for one exact value.

  - type: playground
    id: show-in-stock
    concept: js.array-helpers
    difficulty: 2
    prompt: >-
      The shop lists every product, even sold-out ones. Use `filter` so only products with
      stock above 0 are listed. Then, if `some` product has no stock, set the warning's text
      to Some items are sold out.
    html: |
      <h1>Kitchen shop</h1>
      <p>In stock: <span id="available"></span></p>
      <p id="warning"></p>
    js: |
      const products = [
        { name: "Kettle", stock: 3 },
        { name: "Blender", stock: 0 },
        { name: "Toaster", stock: 5 },
        { name: "Mixer", stock: 2 },
      ];
      const names = products.map((product) => product.name);
      document.querySelector("#available").textContent = names.join(", ");
    editable: [js]
    checks:
      - label: Only in-stock products are listed
        selector: '#available'
        text: Kettle, Toaster, Mixer
      - label: The sold-out warning shows
        selector: '#warning'
        text: sold out
    solution:
      js: |
        const products = [
          { name: "Kettle", stock: 3 },
          { name: "Blender", stock: 0 },
          { name: "Toaster", stock: 5 },
          { name: "Mixer", stock: 2 },
        ];
        const inStock = products.filter((product) => product.stock > 0);
        const names = inStock.map((product) => product.name);
        document.querySelector("#available").textContent = names.join(", ");
        if (products.some((product) => product.stock === 0)) {
          document.querySelector("#warning").textContent = "Some items are sold out";
        }
    hints:
      - Filter first, then map the products that are left.
      - '`products.filter((product) => product.stock > 0)` keeps the ones in stock.'
      - '`products.some((product) => product.stock === 0)` is true when anything is sold out.'

  - type: prose
    id: reduce-to-one-value
    body: |-
      `reduce` folds a whole list into one value. You give it a callback and a starting value:

      ```js
      const total = prices.reduce((sum, price) => sum + price, 0);
      ```

      `sum` starts at 0. For each price, the callback returns the new sum, and that becomes
      `sum` next time round. At the end, `total` is 39. The starting value is also the answer
      for an empty list.

  - type: ai-review
    id: review-reduce-empty-cart
    concept: js.array-iteration
    difficulty: 3
    language: js
    request: Write cartTotal(items), the sum of price times quantity.
    flawClass: edge-case
    code: |
      function cartTotal(items) {
        return items
          .map((item) => item.price * item.quantity)
          .reduce((sum, amount) => sum + amount);
      }
    prompt: >-
      This came from an assistant, and a test with three items passed. Opening an empty cart
      crashes the page. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`reduce` has no starting value'
        correct: true
        feedback: >-
          Right. With no items and no start, `reduce` throws. Pass `0` as a second argument.
      - text: '`map` fails on an empty array'
        feedback: >-
          `map` on an empty array returns an empty array. The crash comes one line later.
      - text: '`price * quantity` gives `NaN`'
        feedback: >-
          Only if a field were missing. An empty cart has no items, so nothing gets multiplied.
      - text: A chain can't continue on a new line
        feedback: >-
          A line starting with a dot continues the one above, so the chain is fine.
    fix: |
      function cartTotal(items) {
        return items
          .map((item) => item.price * item.quantity)
          .reduce((sum, amount) => sum + amount, 0);
      }

  - type: prose
    id: sort-and-copies
    body: |-
      `sort` puts an array in order, with two surprises. With no arguments, it compares items as
      text, so `100` comes before `25`. And it changes the array you call it on.

      For numbers, pass a comparator: `(a, b) => a - b` sorts low to high. To keep the
      original, use `toSorted`. It takes the same comparator and returns a sorted copy.

  - type: playground
    id: fix-race-results
    concept: js.array-mutation
    difficulty: 2
    prompt: >-
      The results page should list finish times fastest first, in seconds. Right now 101
      comes before 88. Give `sort` a comparator so the times go low to high.
    html: |
      <h1>Park run results</h1>
      <p>Times: <span id="times"></span></p>
    js: |
      const times = [95, 120, 88, 101];
      times.sort();
      document.querySelector("#times").textContent = times.join(", ");
    editable: [js]
    checks:
      - label: 'The times read 88, 95, 101, 120'
        selector: '#times'
        text: 88, 95, 101, 120
    solution:
      js: |
        const times = [95, 120, 88, 101];
        times.sort((a, b) => a - b);
        document.querySelector("#times").textContent = times.join(", ");
    hints:
      - With no comparator, `sort` compares the times as text.
      - A comparator is a callback that takes two items, `a` and `b`.
      - Write `times.sort((a, b) => a - b);`.

  - type: code-challenge
    id: write-cheapest-available
    concept: js.array-mutation
    difficulty: 4
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `cheapestInStock(products)`. Each product has `name`, `price` and `stock`. Return
      the names of products with `stock` above zero, cheapest first.


      Compare prices as numbers. Products with the same price keep their order. Don't change
      the input array: the tests check it afterwards.


      Example: for a pen at 100, a clip at 9 with no stock, and a pad at 25, it returns
      `["pad", "pen"]`.
    hints:
      - Three jobs, in order. Drop the empty products, sort what's left, then keep only names.
      - >-
        `sort` would change the caller's array. `toSorted` takes the same comparator and returns
        a copy.
      - Start with `products.filter((product) => product.stock > 0)`, then chain `toSorted`.

  - type: explain-back
    id: explain-sorted-prices
    concept: js.array-mutation
    difficulty: 3
    prompt: >-
      A page shows `scores` in two lists. After `const ranked = scores.sort()`, why do both
      lists change order?
    rubric:
      - '`sort` mutates: it reorders the array it is called on.'
      - It returns that same array, so `ranked` and `scores` are two names for one array.
      - '`toSorted` returns a sorted copy and leaves `scores` alone.'
    modelAnswer: >-
      `sort` doesn't make a new array. It reorders the one you call it on, then returns it. So
      `ranked` and `scores` point at the same array, and both lists show its new order. To
      keep the original, use `toSorted`, which returns a sorted copy.

recap:
  - Write an arrow function and hand it to `map`, `filter`, `find` or `some`.
  - Fold a list into one value with `reduce`, always with a starting value.
  - Sort numbers with `(a, b) => a - b`, and use `toSorted` to keep the original.

recall:
  - id: card-arrow-braces
    concept: js.arrow-functions
    front: What does `[1, 2].map((n) => { n * 2; })` give, and why?
    back: >-
      `[undefined, undefined]`. With braces, an arrow needs `return`. Without braces, it returns
      the expression by itself.
  - id: card-find-or-filter
    concept: js.array-helpers
    front: What do `filter`, `find` and `some` each hand back?
    back: >-
      `filter` gives a new array of every match. `find` gives the first match or `undefined`.
      `some` gives `true` or `false`.
  - id: card-reduce-initial
    concept: js.array-iteration
    front: What happens when `reduce` runs on an empty array with no starting value?
    back: >-
      It throws a `TypeError`. Pass a starting value as the second argument, like `0` for a sum.
  - id: card-default-sort
    concept: js.array-mutation
    front: What does `[100, 25, 9].sort()` give, and how do you sort numbers low to high?
    back: >-
      `[100, 25, 9]`, because items are compared as text. Pass `(a, b) => a - b`.
  - id: card-copying-partners
    concept: js.array-mutation
    front: You need a sorted list and the original order. Which method do you use?
    back: >-
      `toSorted`. It returns a sorted copy and leaves the original alone, while `sort` reorders
      the array itself.

