term: saga
aka: [ saga pattern, compensating transaction ]
short: A chain of steps across services, each with an undo step that runs if a later one fails.
explain: |
  Booking a trip means charging a card, reserving a flight and reserving a hotel, in three
  different systems. No single database transaction can cover all three. If the hotel
  fails, the flight and the charge are already done.

  So each step comes with a **compensating step**: refund the card, cancel the flight. When
  a step fails, the earlier ones are undone in reverse order. Compensation isn't a true
  rollback; the customer may have seen the charge for a minute. Every step and every undo
  must be safe to repeat, because they'll be retried.
analogy: Planning a party. If the venue cancels, you ring the caterer and the band to cancel too, one call at a time.
usage: Checkout spans payments, stock and shipping now, so we need a saga with a refund as the compensating step.
twin:
  term: transaction
  difference: A transaction undoes everything automatically, inside one database. A saga spans several systems, so each step needs its own undo, written and run by you.
related: [ transaction, idempotent, eventual-consistency, event-sourcing, adr ]
level: 3
lessons: [ arch.sagas-and-workflows ]
