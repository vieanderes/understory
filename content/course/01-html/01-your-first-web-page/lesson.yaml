    verified: true

deepDive: >-
  `<!doctype html>` isn't an element. It tells the browser to use today's rules. Without it,
  the page falls into quirks mode, which copies old browser bugs in layout.


  Tag names don't care about case: `<P>` and `<p>` are the same. Lower case is the habit
  almost everyone follows.


  Some elements have no content and no end tag, such as `img` for a picture and `br` for a
  line break. They're called void elements. You'll meet `img` in the next lesson.


  Several spaces in a row also shrink to one. This rule is called whitespace collapsing, and
  CSS can switch it off with `white-space: pre`. That's why code blocks keep their layout.


  If you leave out `html`, `head` or `body`, the browser adds them for you. You'll see that
  happen in the DOM lesson.
