summary: >-
  Every coding round, live or timed, rewards the same habit: understand the input before you
  choose an approach. The size of the input tells you which complexity is fast enough, and the
  value range tells you which edge cases and number traps exist. A candidate who asks two good
  questions and then writes a plain loop often scores better than one who races to a clever
  answer for the wrong problem.


  The method has six moves: clarify the input, work a small example by hand, state a brute
  force and its cost, name its bottleneck, remove it with a known pattern, then test the
  edges. Each move produces something you can say out loud, so the interviewer can follow
  you and help when you stall.


  The rest of this chapter is a catalogue of patterns. This lesson is the part that decides
  which one to pick. Signals in the statement point the way: "sorted" suggests two pointers or
  binary search, "contiguous" suggests a window or prefix sums, "fewest steps" suggests BFS,
  "the best k" suggests a heap, and "count the ways" suggests dynamic programming. The
  bottleneck of your brute force usually names the same pattern from the other direction.
remember:
  - Ask how large the input can be before choosing an approach, because the size decides which complexity passes.
  - At about 100 million simple steps a second, n up to 5,000 allows O(n²), and n up to a million needs O(n log n) or O(n).
  - State a brute force with its complexity first, then name its bottleneck, the work it repeats.
  - A repeated lookup calls for a hash map, a repeated range sum for prefix sums, and a recounted overlap for a sliding window.
  - After a one-pass loop, check the state still in progress, such as a run that reaches the last item.
  - Test the empty input, one item, all equal, duplicates, negatives, sorted and reversed input, and the largest size.
  - In a timed test the expected complexity in the statement names the pattern, and code that does not run scores zero.
  - Compare your fast solution with the brute force on many small random inputs before you submit.
sections:
  - title: Reading the constraints as a hint
    body: |-
      Constraints are the problem setter telling you what they expect. Read them in three
      layers.

      **The size of n** picks the complexity. With n up to 100,000 an O(n²) loop does 10
      billion steps and times out, so the setter wants O(n log n) or O(n). With n up to 20,
      trying every subset (about a million) is fine, so they may expect backtracking.

      **The value range** picks the traps. Values up to 10⁹ summed over 100,000 items reach
      10¹⁴, which is still exact in a JavaScript number. Products of two such values reach
      10¹⁸, past `Number.MAX_SAFE_INTEGER` (about 9 × 10¹⁵), so you need `BigInt` or a
      modulus. Negative values break any shortcut that assumes a sum only grows, such as a
      sliding window over sums.

      **The shape** picks the data structure. "Sorted" invites two pointers or binary search.
      "Each value is between 1 and N" invites a counting array instead of a map. "Distinct"
      removes the duplicate edge cases, and "may contain duplicates" says a test has them.

      Online assessment statements usually end with lines such as "N is an integer within the range
      [1..100,000]" and, on performance tasks, the expected worst-case time complexity. When
      the range starts at 1, you do not need to handle an empty array. Do not validate what
      the constraints already rule out: it costs time and adds bugs.

      ```js
      // A quick check of where exact integers end.
      console.log(Number.MAX_SAFE_INTEGER); // 9007199254740991
      console.log(1e9 * 100000 <= Number.MAX_SAFE_INTEGER); // true
      console.log(1e9 * 1e9 <= Number.MAX_SAFE_INTEGER); // false
      console.log(10n ** 18n + 1n); // 1000000000000000001n
      ```
  - title: From brute force to optimal, one bottleneck at a time
    body: |-
      The step from brute force to a fast answer is rarely inspiration. You look at what the
      slow version does again and again, and ask which structure makes that repeated work
      cheap. The common pairs are worth knowing by heart:

      - Searching the array for a partner: store what you have seen in a `Set` or `Map`.
      - Summing a range again and again: build prefix sums once.
      - Recounting a window that overlaps the last one: slide it, add one item and drop one.
      - Scanning for the smallest or largest many times: keep a heap.
      - Solving the same smaller problem many times: memoise or tabulate it.
      - Scanning a sorted array item by item: binary search or two pointers.

      Here is the move on a classic: does any pair in the array sum to `target`? The brute
      force checks every pair, O(n²). Its bottleneck is the inner loop, which searches for
      `target - x`. A set answers that search in constant time on average.

      ```js
      function hasPairBrute(nums, target) {
        for (let i = 0; i < nums.length; i++) {
          for (let j = i + 1; j < nums.length; j++) {
            if (nums[i] + nums[j] === target) return true;
          }
        }
        return false;
      }

      // O(n) time, O(n) space: each item asks whether its partner came earlier.
      function hasPair(nums, target) {
        const seen = new Set();
        for (const x of nums) {
          if (seen.has(target - x)) return true;
          seen.add(x);
        }
        return false;
      }

      console.log(hasPair([3, 8, 1, 5], 6)); // true
      console.log(hasPair([3, 8, 1, 5], 7)); // false
      console.log(hasPair([3], 6)); // false
      console.log(hasPair([3, 3], 6)); // true
      ```

      Checking before adding matters: it stops `[3]` with target 6 from pairing 3 with
      itself. Say that trade aloud in an interview: you spend O(n) memory to save a factor of
      n in time.
  - title: Testing without seeing the hidden tests
    body: |-
      In a timed test your Run button checks only the example and cases you type in, and it
      shows you what your function returned, not whether it was right. The fastest way to
      trust a clever solution is to compare it with the brute force on thousands of small
      random inputs. This is called **stress testing**, and it takes about ten lines.

      ```js
      function longestStreakBrute(steps, goal) {
        let best = 0;
        for (let start = 0; start < steps.length; start++) {
          let length = 0;
          while (start + length < steps.length && steps[start + length] >= goal) length++;
          best = Math.max(best, length);
        }
        return best;
      }

      function longestStreak(steps, goal) {
        let best = 0;
        let current = 0;
        for (const count of steps) {
          current = count >= goal ? current + 1 : 0;
          best = Math.max(best, current);
        }
        return best;
      }

      function randomArray(maxLength, maxValue) {
        const length = Math.floor(Math.random() * (maxLength + 1));
        return Array.from({ length }, () => Math.floor(Math.random() * (maxValue + 1)));
      }

      for (let trial = 0; trial < 2000; trial++) {
        const steps = randomArray(8, 4);
        const expected = longestStreakBrute(steps, 2);
        const actual = longestStreak(steps, 2);
        if (expected !== actual) throw new Error(`${JSON.stringify(steps)}: ${expected} vs ${actual}`);
      }
      console.log('all agree'); // 'all agree'
      ```

      Keep the random values in a tiny range such as 0 to 4. Small ranges produce duplicates,
      ties and values equal to the goal, which is where the bugs live. Keep arrays short so a
      failing case is small enough to trace by hand. Then add one large input to check the
      running time, for example 200,000 items, and time it with `console.time`.
  - title: What to say in a live round
    body: |-
      Interviewers score communication alongside the code. Silence for five minutes looks the
      same as being stuck. A steady commentary sounds like this for the streak problem:

      1. "Can the list be empty? Can a day equal the goal exactly, and does that count?"
      2. "For `[12000, 9000, 11000, 13000, 10500]` and 10,000, the runs are 1 then 3, so 3."
      3. "The brute force starts a count from every day. That's O(n²) when every day hits the
         goal, too slow for 200,000 days."
      4. "The waste is recounting days the previous start already counted. If I carry the
         current run length, one pass is enough: O(n) time, O(1) space."
      5. While typing: "`current` resets on a missed day. I update `best` every day, so a run
         at the end still counts."
      6. "Tests: empty list gives 0, no good days gives 0, all good days gives n, and a run
         that ends on the last day."

      Two habits make this work. Say the complexity every time you propose an approach, so the
      interviewer can steer you before you build the wrong thing. And when you are stuck, say
      what you are stuck on ("I need the smallest value seen so far without rescanning"): that
      sentence often contains the answer, and it gives the interviewer something to hint at.
  - title: A plan for a timed online test
    body: |-
      A typical online coding assessment gives one timer for two or three tasks, scores hidden tests only,
      and splits them into correctness tests on small inputs and performance tests on large
      ones. That shapes how you spend the time.

      - Read every statement and its constraint lines first, about five minutes in total.
      - Start with the task you recognise. A full score there is worth more than half of two.
      - If the fast idea does not come, submit a correct brute force. It usually passes every
        correctness test and some performance tests.
      - Keep your code runnable at all times. A syntax error when the timer ends scores zero.
      - Before submitting, run the empty or smallest input, all equal values, duplicates,
        negatives if allowed, and one input of the largest size.
      - Keep five minutes at the end to reread each function against its statement.

      The JavaScript traps that turn a correct O(n) idea into a timeout are worth checking in
      the final pass: `arr.shift()` inside a loop (each call moves every item), `includes` or
      `indexOf` inside a loop, and spreading a huge array into `Math.max`, which throws a
      `RangeError` at around 200,000 items in Node 24.
pitfalls:
  - "**Coding before clarifying.** Under pressure the first idea feels like progress. Ask about size, empty input, duplicates and negatives first, and restate the problem in one sentence before typing."
  - "**Forgetting the state after the loop.** A running best that only updates on a reset misses a run that reaches the last item. Update the best on every iteration, or check once more after the loop."
  - "**Sorting the caller's array.** `arr.sort()` sorts in place, and some tests check the input is unchanged. Copy first with `[...arr].sort(...)` or use `arr.toSorted(...)`, which Node has had since version 20."
  - "**Default sort order.** `[10, 9, 1, 100].sort()` gives `[1, 10, 100, 9]` because it compares strings. Always pass a comparator such as `(a, b) => a - b` for numbers."
  - "**Quadratic helpers in a linear loop.** `shift`, `splice`, `includes` and `indexOf` each cost O(n). Inside a loop they make O(n²). Use an index for a queue and a `Set` for membership."
  - "**Spreading a huge array.** `Math.max(...arr)` passes every item as an argument and throws a `RangeError` for large arrays. Use a loop or `reduce` for the maximum."
  - "**Exact integers past 2^53.** Sums and products of large values silently lose precision. Check the value range and switch to `BigInt` or a modulus when the result can pass 9 × 10¹⁵."
interview:
  - question: Walk me through how you approach a problem you've never seen.
    answer: >-
      I clarify the input, work one small example, state a brute force with its cost, then
      remove its bottleneck. First I ask how large n is, whether the input can be empty, and
      whether duplicates or negatives appear, because the size tells me which complexity will
      pass. Then I solve a tiny example by hand, which catches misunderstandings early. The
      brute force gives me something correct to fall back on and a precise question: what
      work does it repeat? That repeated work usually names the pattern, a map for repeated
      lookups or prefix sums for repeated range sums. I code the better version while
      narrating, then test the edges. The trade-off is time: on a simple problem I say the
      brute force in one sentence and move on rather than coding it.
  - question: The constraints say n can be 100,000. What does that tell you?
    answer: >-
      It rules out O(n²) and points at O(n log n) or O(n). Squared, 100,000 is 10 billion
      steps, far beyond the roughly 100 million simple steps a second a judge allows. So I
      look for a single pass with a hash map, a sort followed by a linear scan, two pointers,
      a sliding window, or prefix sums. O(n log n) is about 1.7 million steps, comfortably
      fast. I also check the value range: if values reach 10⁹, sums over 100,000 of them are
      still exact in JavaScript, but products are not. The caveat is that the limit is a rule
      of thumb: a heavy constant, such as creating objects in the inner loop, can still time
      out an O(n log n) solution.
  - question: Your solution passes the example. How do you convince yourself it's correct?
    answer: >-
      I test the edges deliberately and then compare against a brute force on random inputs.
      The edges I always try are the smallest input, one item, all values equal, duplicates,
      negatives when allowed, sorted and reverse-sorted input, and a case where the answer
      sits at the very end, which catches state left in a variable after the loop. Then I
      write a short loop that generates thousands of tiny random arrays and asserts that the
      fast and slow versions agree, with values in a small range so ties are common. Finally
      I run one input at the maximum size to check the running time. The trade-off is minutes:
      in a live round I describe the stress test and run a handful of cases instead.
  - question: You're stuck on the optimal solution with ten minutes left. What do you do?
    answer: >-
      I make sure a correct solution exists first, then keep improving it. In a timed test
      that means submitting the brute force, since it usually passes every correctness test
      and some performance tests, while broken clever code scores nothing. In a live round I
      say where I'm stuck in one precise sentence, such as "I need the smallest price seen
      so far without rescanning", because that often contains the idea and gives the
      interviewer something to hint at. Then I try the usual moves on the bottleneck: a hash
      map, sorting first, prefix sums, or carrying a running value. The one thing I avoid is
      silence, because the interviewer cannot score thinking they cannot hear.
terms:
  - term: Brute force
    say: The bad solution.
    means: The simplest correct solution, stated with its cost. It is the baseline you optimise from and
      the reference you test the fast version against.
  - term: Bottleneck
    say: The slow part.
    means: The work the brute force repeats, such as searching again for a partner or re-summing a
      range. Naming it points to the pattern that removes it.
  - term: Constraints
    say: Limits you check at the end.
    means: The input size and value ranges, read first. At about 100 million simple steps a second, n up
      to 5,000 allows O(n²), and n up to a million needs O(n log n) or O(n).
  - term: Big-O
    say: How fast the code runs.
    means: How the work grows as the input grows, ignoring constant factors. It tells you whether code
      survives the largest n, not how many milliseconds it takes.
  - term: Edge case
    say: A weird input that won't happen.
    means: An input at the edge of the allowed ranges, such as empty, one item, all equal, negatives or
      the largest size. Hidden tests are built from them.
