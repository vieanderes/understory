id: html.forms
title: Forms
objective: Build a labelled form that sends the right data and checks it without JavaScript.
level: essential
minutes: 10
concepts: [html.form-controls, html.form-submission, html.get-and-post-forms, html.constraint-validation]
prerequisites: [html.links-and-urls]
opening:
  text: >-
    You'll build forms that everyone can fill in and that send exactly what you expect. You'll
    also meet the classic form bugs before they catch you out.

steps:
  - type: prose
    id: form-basics
    body: |-
      A **form** collects what people type and sends it off. Here's a search box:

      ```html
      <form action="/search">
        <input name="q">
        <button>Search</button>
      </form>
      ```

      `input` is a box to type in, with no end tag, and `value` fills it in advance. The
      `button` sends the form to the `action` address. The `name` is the key for the typed
      value: search for soup, and the browser loads `/search?q=soup`.

  - type: predict-output
    id: predict-entry-list
    concept: html.form-submission
    difficulty: 1
    language: html
    code: |
      <form action="/rooms">
        <input name="room" value="blue">
        <input id="guests" value="4">
        <button>Search</button>
      </form>
    question: Someone clicks Search. Which address does the browser load?
    choices:
      - text: '`/rooms?room=blue`'
        correct: true
        feedback: >-
          Yes. Only a box with a `name` sends its value.
      - text: '`/rooms?room=blue&guests=4`'
        feedback: >-
          Most people pick this. But an `id` isn't a key. It's for links and scripts, and the
          server never sees it.
      - text: '`/rooms?guests=4`'
        feedback: >-
          It's the other way round. `room` has a `name`, so it's sent. `guests` has only an
          `id`.

  - type: prose
    id: labels
    body: |-
      A box on its own doesn't say what it's for. A screen reader can only say "text box".
      A `label` fixes that:

      ```html
      <label>Email <input name="email"></label>
      ```

      The label's text becomes the box's name. As a bonus, clicking the label puts the cursor
      in the box.

  - type: playground
    id: label-the-fields
    concept: html.form-controls
    difficulty: 2
    prompt: >-
      Neither box has a label. Wrap each one in a `label`: "Name" for the first, "Email" for
      the second. Then click a label in the preview.
    html: |
      <form action="/newsletter">
        <input name="name">
        <input name="email">
        <button>Subscribe</button>
      </form>
    editable: [html]
    checks:
      - label: The name box has a label that says Name
        selector: 'label:has(input[name="name"])'
        text: Name
      - label: The email box has a label that says Email
        selector: 'label:has(input[name="email"])'
        text: Email
      - label: Both boxes still have their `name`
        selector: 'input[name]'
        count: 2
    solution:
      html: |
        <form action="/newsletter">
          <label>Name <input name="name"></label>
          <label>Email <input name="email"></label>
          <button>Subscribe</button>
        </form>
    hints:
      - The label goes around the text and the box together.
      - Start with `<label>Name` in front of the first box.
      - Close it after the box, `<input name="name"></label>`.

  - type: prose
    id: get-versus-post
    body: >-
      Sending a form makes a **request**: a message from the browser to the server, the
      computer that runs the site. The `method` attribute picks how.


      With `method="get"`, the default, the pairs go into the address, after a `?`. That suits
      a search you might bookmark. With `method="post"`, they travel inside the request
      instead. Use it for anything that changes something, like a booking.

  - type: multiple-choice
    id: pick-booking-method
    concept: html.get-and-post-forms
    difficulty: 2
    question: A form books a table at a restaurant. Which method should it use?
    choices:
      - text: '`post`, because it changes something'
        correct: true
        feedback: >-
          Right. A booking changes data, so the pairs belong inside the request.
      - text: "`get`, because it's the default"
        feedback: >-
          The default suits searches. A booking in the address could be bookmarked, shared or
          sent twice.
      - text: "`get`, because it's faster"
        feedback: >-
          Neither is faster in any way you'd notice. The choice is about what the form does.

  - type: prose
    id: built-in-checks
    body: >-
      Browsers can check a form before sending it, with no JavaScript. `required` means the
      box can't be empty. `type="email"` means the text must look like an email address.


      If a check fails, nothing is sent. The browser points at the first problem and shows a
      message.

  - type: playground
    id: add-validation
    concept: html.constraint-validation
    difficulty: 2
    prompt: >-
      This sign-up form accepts an empty box, or "hello" as an email. Make the email box
      required, and make it an email box.
    html: |
      <form action="/signup" method="post">
        <label>Email <input name="email"></label>
        <button>Sign up</button>
      </form>
    editable: [html]
    checks:
      - label: The email box is required
        selector: 'input[name="email"][required]'
        count: 1
      - label: The email box has `type="email"`
        selector: 'input[name="email"][type="email"]'
        count: 1
    solution:
      html: |
        <form action="/signup" method="post">
          <label>Email <input name="email" type="email" required></label>
          <button>Sign up</button>
        </form>
    hints:
      - Both changes are attributes on the `input`.
      - '`required` is written on its own, with no value.'
      - Add `type="email" required` after `name="email"`.

  - type: bug-hunt
    id: hunt-add-guest-button
    concept: html.form-submission
    difficulty: 3
    language: html
    code: |
      <form action="/bookings" method="post">
        <label>Guest name <input name="guest"></label>
        <button>Add another guest</button>
        <button>Book table</button>
      </form>
    prompt: >-
      A script makes the first button add another name box. But clicking it sends the booking
      straight away. Tap the line at fault.
    lines: [3]
    reasons:
      - text: Every button in a form sends the form
        correct: true
        feedback: >-
          Yes. Add `type="button"` to make a button that doesn't send.
      - text: A form can only hold one button
        feedback: >-
          A form can hold many buttons. Each one submits it, unless told otherwise.
      - text: The script runs after the form is sent
        feedback: >-
          The script isn't the problem. The button itself sends the form, before anyone asked
          it to.
    fix: |
      <form action="/bookings" method="post">
        <label>Guest name <input name="guest"></label>
        <button type="button">Add another guest</button>
        <button>Book table</button>
      </form>

  - type: explain-back
    id: explain-missing-quantity
    concept: html.form-submission
    difficulty: 4
    prompt: >-
      The guests box was `<input id="guests" required>`. Why did bookings arrive with no
      guest count, and no error anywhere?
    rubric:
      - Only a box with a `name` adds a pair, and `id` is never sent.
      - The box still shows, takes input and passes `required`, so the page looks fine.
      - The server gets a normal request without the key, so only a server check can catch it.
    modelAnswer: >-
      The browser builds the pairs from boxes that have a `name`. This one has only an `id`,
      so its value is skipped. Everything else works: it shows, takes input and passes
      `required`. Nothing went wrong in the browser, so there's no error. The server gets a
      valid request with no `guests` key. Add `name="guests"`, and check on the server that
      it's there.

recap:
  - Give every box a `label` and a `name`, and predict what's sent.
  - Choose GET for searches and POST for changes.
  - Check input with `required` and `type`, and stop stray buttons with `type="button"`.

recall:
  - id: card-label-and-name
    concept: html.form-controls
    front: What does a `label` give a box, and what does `name` give it?
    back: >-
      The `label` gives it a name a screen reader can say. The `name` gives its value a key
      in the sent data.
  - id: card-missing-name
    concept: html.form-submission
    front: A box has an `id` but no `name`. What does the form send for it?
    back: >-
      Nothing. Only boxes with a `name` add a pair to the data.
  - id: card-button-type
    concept: html.form-submission
    front: How do you stop a button inside a form from sending the form?
    back: >-
      Give it `type="button"`. Without a type, a button in a form submits it.
  - id: card-get-or-post
    concept: html.get-and-post-forms
    front: Where do the pairs go with GET, and where with POST?
    back: >-
      GET puts them in the address after a `?`. POST sends them inside the request.
  - id: card-required
    concept: html.constraint-validation
    front: What does the browser do when a `required` box is empty and someone submits?
    back: >-
      It sends nothing, points at the box and shows a message.

