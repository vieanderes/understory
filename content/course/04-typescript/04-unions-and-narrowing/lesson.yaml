deepDive: >-
  You'll often see a `switch` on the tag instead of `if` checks. Each `case` narrows the same
  way, and `default: return assertNever(sub);` does the exhaustiveness job.


  `querySelector("button")` knows it returns a button because the selector is a tag name.
  With a class, like `querySelector(".save")`, you get the general `Element | null`, and
  `querySelector<HTMLButtonElement>(".save")` is a claim the checker takes on trust.


  A **type predicate**, like `function isActive(s: Subscription): s is ActiveSub`, narrows
  wherever you call it. The checker only checks that the body returns a boolean. It trusts the
  claim, so a sloppy test narrows to the wrong type without an error.


  Narrowing is a fact about one variable at one point in the code. Assigning a new value to a
  `let` resets it. A callback created before that assignment falls back to the declared type,
  because it may run later.
