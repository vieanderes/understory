term: semantic cache
aka: [semantic caching, embedding cache]
short: A store that returns an earlier answer when a new question means nearly the same thing.
explain: |
  Two people ask "How do I reset my password?" and "password reset how?". The questions
  differ, the meaning doesn't. Compare their embeddings, and if they're close enough, serve
  the stored answer without calling the model.

  It saves the whole call, but it can answer a subtly different question wrongly. "Cancel
  my order" and "cancel my subscription" sit close together. Use it only where a near miss
  is harmless, and log every hit.
analogy: A help desk that hands you the leaflet for the question it thinks you asked.
usage: The semantic cache answered a refund question with the returns policy; tighten the similarity cut-off.
twin:
  term: prompt-caching
  difference: A semantic cache returns an old answer without calling the model. Prompt caching calls the model and only reuses its work on the start of the prompt.
related: [cache, embedding, vector-search]
level: 3
lessons: [aisys.cost-and-latency]
