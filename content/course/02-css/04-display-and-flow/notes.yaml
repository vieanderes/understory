summary: >-
  With no layout rules at all, the browser still places every box. It follows the **normal
  flow**: block boxes, such as paragraphs and headings, stack down the page and fill its
  width. Inline boxes, such as links and `strong`, sit inside lines of text and are only as
  wide as their words. Most of any page is laid out this way, and flexbox and grid only take
  over where you ask them to.


  The `display` property decides which kind of box an element makes. Every element has a
  default, set by the browser's style sheet, and you can switch it. `inline-block` mixes the
  two: it sits in a line like text, but takes a width, a height and margins like a block.
  `none` removes the box altogether.


  Content doesn't always fit the box it's in. When a box has a fixed height, extra content
  spills out and overlaps whatever comes next, because only the box takes up space. The
  `overflow` property decides whether that content shows, gets cut off, or scrolls. Knowing
  the flow is what lets you predict a page before you open it.
remember:
  - Block boxes start on a new line and fill the width, and inline boxes sit in a line of text and are as wide as their content.
  - Inline boxes ignore `width`, `height` and top and bottom margins, and their top and bottom padding doesn't push lines apart.
  - '`inline-block` stays in the line of text but takes a width, a height and all four margins like a block.'
  - '`display: none` removes the box and the space it took, though the element is still in the DOM.'
  - A box with a fixed `height` never grows, so content that doesn't fit spills over the next box; `min-height` lets it grow.
  - '`overflow: auto` only scrolls when something limits the box''s size, such as a `height`.'
  - Changing `display` changes how a box flows, never what the element means, so pick the right element first.
  - 'Images are inline by default, which leaves a small gap below them; `display: block` removes it.'
sections:
  - title: What display really sets
    body: |-
      Each `display` value answers two questions. How does the box behave among its
      neighbours, outside? And how does it lay out its own children, inside?

      - `block`: a block outside, and normal flow inside.
      - `inline`: inline outside, flowing as part of the text.
      - `inline-block`: inline outside, but its inside is a fresh area of its own. That's why
        it takes a width and height and keeps its children's margins inside, like
        `display: flow-root` did in the last lesson.
      - `flow-root`: a block outside, with that same self-contained inside.
      - `flex` and `grid`: a block outside, and flex or grid layout for the children inside.

      So `display: flex` doesn't change how the container sits on the page. It still stacks
      like any block. It changes how its children are arranged.

      Every element starts with a default from the browser's style sheet. In Chromium:
      `div`, `p` and `section` are `block`. `span`, `a`, `strong` and `img` are `inline`.
      `button` and `input` are `inline-block`. `li` is `list-item`, a block that also draws
      the bullet.

      The `hidden` attribute from HTML works through this too. The browser's style sheet gives
      `[hidden]` the value `display: none`. That rule is weak, so any rule of yours that sets
      `display` wins:

      ```html
      <style>
        .panel { display: block; }
      </style>
      <div class="panel" hidden>Order details</div>
      <!-- still visible: .panel beats the browser's [hidden] rule -->
      ```

      A new `display` never changes what an element **means**. A `div` shown as
      `inline-block` is still a `div` to a screen reader, and a `span` styled to look like a
      button still isn't one: it can't be focused or pressed with the keyboard. Choose the
      element for its meaning, then choose `display` for its look.
  - title: How lines of text are built
    body: |-
      Inline content is laid out in **line boxes**: invisible rows, each as tall as the text
      needs. Words, links and inline images sit along the **baseline**, the line the letters
      stand on. When a line is full, the rest wraps to the next line box.

      That model explains the odd behaviour of inline boxes. Top and bottom padding and
      borders are drawn, but they don't make the line box taller, so they can overlap the line
      above or below. Top and bottom margins do nothing at all. Left and right margins,
      padding and borders work normally and push the neighbouring words aside.

      An `inline-block` is different. It sits on the baseline like a word, but its full height
      counts. A 50px-tall inline-block makes its whole line taller.

      Two classic side effects come from this model. First, **the gap under an image.**
      An `img` is inline and sits on the baseline, and the line keeps a little room below the
      baseline for the tails of letters like g and y. So a 100px image in a `div` makes the
      `div` about 104px tall at a 16px font:

      ```css
      img { display: block; }        /* no longer in a line: no gap */
      img { vertical-align: top; }   /* or: line it up with the top, not the baseline */
      ```

      Second, **gaps between inline-blocks.** The line break between two tags in your HTML is
      a space character, and inline-blocks sit in text, so the space shows. At a 16px font
      it's about 4px:

      ```html
      <span class="tag">bread</span>
      <span class="tag">baking</span>
      <!-- about 4px of space between the two, even with margin: 0 -->
      ```

      Flexbox, the next lesson, ignores those spaces, and its `gap` property gives exact
      spacing instead.
  - title: Heights, and seeing the real size
    body: |-
      Widths and heights behave differently in normal flow. A block with no `width` fills its
      parent. A block with no `height` grows to fit its content. That second rule is what
      keeps text from overlapping, so a fixed `height` on anything holding text is a risk. A
      longer message, a larger font setting or a narrower phone, and it spills.

      `min-height` keeps a minimum size and still lets the box grow:

      ```css
      .note { min-height: 40px; }
      /* short notes are 40px tall; long ones grow, and the next paragraph moves down */
      ```

      A second trap hides in the developer tools and in JavaScript. `getComputedStyle` reports
      the value you set, even when the browser doesn't use it. On an inline `span` with
      `width: 120px`, it still says `120px`, though the span is only as wide as its text. To
      see the size the box was really drawn at, ask for its rectangle:

      ```js
      const price = document.querySelector('.price'); // an inline span, width: 120px
      console.log(getComputedStyle(price).width); // 120px
      console.log(price.getBoundingClientRect().width < 120); // true
      ```

      The rectangle also shows what `display: none` does. A hidden element is still in the
      DOM, so `querySelector` finds it, but it has no box, so its rectangle is 0 by 0.
  - title: Overflow in depth
    body: |-
      `overflow` is really two properties, `overflow-x` for sideways and `overflow-y` for up
      and down. Writing `overflow` sets both.

      They can't mix freely. If one axis is `hidden`, `auto` or `scroll`, a `visible` on the
      other axis turns into `auto`. So `overflow-x: hidden` quietly gives the box a vertical scroll bar
      when its content is too tall.

      The values differ in more than looks:

      - `visible` lets content spill, and it overlaps what comes next.
      - `hidden` cuts off the extra, but the box can still be scrolled from JavaScript, so
        content can move into view unexpectedly.
      - `clip` cuts off the extra and can't be scrolled at all.
      - `auto` shows a scroll bar only when the content doesn't fit.
      - `scroll` keeps a scroll bar in place even when nothing overflows, on systems that
        show scroll bars all the time.

      A box only overflows when something limits its size. A block with no height grows to fit
      its content, so `overflow: auto` alone never scrolls. Pair it with a `height`, as the
      chat box did, or a `max-height`, which lets a short list stay short.

      Scrolling boxes need care for keyboard users. The lesson's chat box had
      `tabindex="0"` in its HTML. That lets someone tab to the box and scroll it with the
      arrow keys, since there's nothing inside it that could take focus.

      Any `overflow` other than `visible` also makes the box self-contained, like
      `flow-root`: its children's margins stay inside it. That's a side effect, so reach for
      `display: flow-root` when containment is all you want.
pitfalls:
  - '**Giving a text box a fixed `height`.** It looks right with today''s text and breaks with tomorrow''s. Leave the height to the content, or use `min-height`.'
  - '**Hunting for a margin that makes gaps between inline-blocks.** The gap is the space character between the tags. Make the parent a flex container and space the items with `gap`.'
  - '**Styling a `div` or `span` to look like a button.** It has the look but not the behaviour: no keyboard focus, no Enter or Space. Use a real `button` and restyle it.'
  - '**Adding `overflow: auto` and seeing no scroll bar.** The box grows to fit its content, so nothing overflows. Give it a `height` or `max-height`.'
  - '**Trusting `getComputedStyle` for sizes.** It reports declared values such as a `width` an inline box ignores. Use `getBoundingClientRect()` to measure what was drawn.'
  - '**Being surprised by `hidden` not hiding.** A class that sets `display` beats the browser''s `[hidden]` rule. Avoid setting `display` on elements you hide with the attribute, or add `[hidden] { display: none !important; }` to your own CSS, one of the rare fair uses of `!important`.'
interview:
  - question: What's the difference between block, inline and inline-block?
    answer: >-
      They differ in how the box sits in the flow and which sizes it respects. A block starts
      on a new line, fills its parent's width by default and respects `width`, `height` and
      all margins. An inline box sits in a line of text, is as wide as its content, and
      ignores `width`, `height` and top and bottom margins; its vertical padding is drawn but
      doesn't push lines apart. `inline-block` sits in the line like inline content but is
      sized like a block, so a tag or a badge can have padding, a height and margins without
      breaking the line. The trade-off with inline-block is that whitespace between tags
      becomes visible gaps, which is one reason a row of items is usually flexbox now.
  - question: What are the ways to hide an element, and how do they differ?
    answer: >-
      `display: none` removes the box entirely: no space, no clicks, and screen readers skip
      it. The `hidden` attribute does the same through the browser's style sheet, but any
      `display` rule of yours overrides it. `visibility: hidden` hides the box but keeps its
      space, and it's also skipped by screen readers. Both are for content nobody should
      reach right now, such as a closed panel. For text that only screen readers should hear,
      neither works; teams use a visually hidden class that shrinks and clips the element
      instead. Choosing starts with the question: should this take up space, and should
      assistive technology read it?
  - question: Why is there a small gap under an image inside a div, and how do you remove it?
    answer: >-
      Because an `img` is inline by default. It sits on the text baseline, and the line
      keeps space below the baseline for letters like g and y, so a 100px image makes its
      container a few pixels taller. The usual fix is `display: block` on the image, which
      takes it out of the line altogether. If the image must stay inline, for example an
      icon inside a sentence, `vertical-align: middle` or `top` lines it up differently and
      removes the gap. The same line model explains gaps between inline-blocks, which come
      from the spaces between tags in the HTML.
