term: merge
aka:
  - git merge
  - merge commit
short: Combining two lines of work by adding a new snapshot that has both of them as parents.
explain: |
  Your feature branch and `main` both moved on. Now you want both sets of changes in one
  place.

  This joins them with a new commit that has two parents, keeping every original commit
  exactly as it was. History stays true to what happened, forks and all. When both sides
  changed the same lines, you get a **conflict** and choose the result by hand. If `main`
  hadn't moved, Git fast-forwards the label and no new commit is needed.
analogy: Two streams meeting in a river. Both stay on the map, and you can see where they joined.
example:
  language: bash
  code: |
    $ git switch main
    $ git merge add-search
    Merge made by the 'ort' strategy.
    $ git log --oneline --graph
    *   9c1e2d0 Merge branch 'add-search'
    |\
usage: Do a merge rather than a rebase here; the branch is shared and others have pulled it.
twin:
  term: rebase
  difference: A merge keeps both histories and ties them with a new commit. A rebase rewrites your commits as if you'd started from the latest main, giving a straight line but new commit hashes.
related:
  - rebase
  - branch
  - pull-request
level: 2
lessons:
  - tooling.git-as-a-graph
