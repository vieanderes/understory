    verified: true

deepDive: >-
  The database in these steps is real Postgres, compiled to run inside your browser. On a real
  project Postgres runs as a server: your app connects over the network, sends SQL, and gets
  rows back. The `psql` command does the same from a terminal.


  Postgres isn't the only choice. SQLite keeps a whole database in one file inside your app,
  which suits phones and small tools. MySQL is Postgres's long-time rival. "NoSQL" stores
  such as MongoDB keep documents instead of tables. Most web apps start well on Postgres.


  Postgres also stretches into AI work. The `pgvector` extension stores embeddings, the lists
  of numbers a model makes from text, and finds the nearest ones fast. The AI engineering
  chapter builds on that.


  The missing comma works because `AS` is optional: `SELECT title AS author` and
  `SELECT title author` mean the same thing. A few words, such as `year`, can't follow a
  column bare, so a lost comma there is a syntax error instead, which is luckier. Some teams always write `AS` so a lost comma stands
  out.
