term: component library
aka: [UI library, UI kit]
short: A package of ready-made, styled interface parts, such as buttons, inputs and dialogs, that a team imports.
explain: |
  A good button takes care: a focus ring, disabled and loading states, keyboard support,
  sizes. A component library does it once and shares it. Teams import `Button` and get all
  of it.

  Its value is in its API. Props with a closed list of options, such as
  `variant="primary"`, make the wrong button hard to build. A library that accepts any
  colour or class soon drifts apart.
analogy: A kit of matching flat-pack parts. Every shelf fits every frame, because they were made to go together.
usage: Take the dialog from the component library, because it already handles focus and Escape.
twin:
  term: design-system
  difference: A component library is the code you import, the buttons and fields. A design system is the wider agreement around it, with tokens, rules and the reasons behind them.
related: [design-system, component, component-variant, design-token]
level: 2
lessons: [design.component-apis]
