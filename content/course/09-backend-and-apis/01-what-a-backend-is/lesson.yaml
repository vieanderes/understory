id: backend.what-a-backend-is
title: What a backend is
objective: "Say what a server and a backend do, and read a real request and response with `curl`."
level: essential
minutes: 9
concepts: [backend.client-server, backend.curl]
prerequisites: [js.requests-and-responses, tooling.terminal]
opening:
  text: >-
    You'll know what the backend of an app is and what it's for. Then you'll talk to one
    straight from your terminal, the way developers check an API every day.

steps:
  - type: prose
    id: frontend-and-backend
    body: >-
      Everything you've built so far runs in the browser. That side of an app is the
      **frontend**.


      But a to-do list should be on your phone and your laptop, so it needs a shared home.
      That's a **server**: a program that waits for requests and answers them. The code
      running there is the **backend**. An app that asks an AI model talks to a backend too.

  - type: prose
    id: endpoints-and-apis
    body: |-
      A backend offers a short menu of requests it understands. Each item is an
      **endpoint**: a method and a path.

      ```text
      GET  /todos       list the to-dos
      POST /todos       add a to-do
      GET  /todos/3     read to-do 3
      ```

      The whole menu is the server's **API**, the way other programs talk to it. Your
      frontend is one of those programs.

  - type: multiple-choice
    id: pick-backend-job
    concept: backend.client-server
    difficulty: 1
    question: Which job has to run on the backend?
    choices:
      - text: Checking a password against the saved ones
        correct: true
        feedback: >-
          Right. The saved passwords must never reach a browser, so only the server can check.
      - text: Showing a spinner while the list loads
        feedback: >-
          That's the page's job. The spinner lives in the browser, next to the list it waits for.
      - text: Changing a button's colour on hover
        feedback: >-
          CSS does that in the browser. The server never hears about a hover.

  - type: prose
    id: meet-curl
    body: |-
      You don't need a page to talk to a server. **`curl`** is a terminal command that sends
      a request and prints what comes back.

      ```bash
      $ curl localhost:3000/todos
      [{"id":1,"title":"Buy milk","done":false}]
      ```

      That's the body of the response: the to-do list as JSON. By default `curl` sends a
      `GET`.

  - type: prose
    id: localhost-and-ports
    body: >-
      Two new words in that command. **`localhost`** means your own computer. While you
      build, the server runs on your machine, not somewhere far away.


      One computer runs many programs, so a **port** picks which one gets the request.
      `:3000` sends it to the program listening on port 3000. A server prints its port
      when it starts, so read that line first.

  - type: bug-hunt
    id: hunt-wrong-port
    concept: backend.curl
    difficulty: 2
    language: bash
    code: |
      $ node server.js
      Listening on http://localhost:3000

      $ curl localhost:8080/todos
      curl: (7) Failed to connect to localhost port 8080 after 0 ms: Couldn't connect to server
    prompt: The server started fine, but `curl` can't reach it. Tap the line at fault.
    lines: [4]
    reasons:
      - text: It asks port 8080, and the server listens on 3000
        correct: true
        feedback: >-
          Yes. Nothing listens on 8080, so the connection is refused. Use `:3000`.
      - text: '`localhost` only works in a browser'
        feedback: >-
          `curl` understands `localhost` too. It found your computer, then found no program on 8080.
      - text: '`/todos` doesn''t exist on this server'
        feedback: >-
          A missing path gets an answer, a 404. Here nothing answered at all, so the port is wrong.
    fix: |
      $ node server.js
      Listening on http://localhost:3000

      $ curl localhost:3000/todos
      [{"id":1,"title":"Buy milk","done":false}]

  - type: prose
    id: curl-i
    body: |-
      Add **`-i`** and `curl` shows the whole response, not only the body:

      ```bash
      $ curl -i localhost:3000/todos
      HTTP/1.1 200 OK
      content-type: application/json
      Content-Length: 42

      [{"id":1,"title":"Buy milk","done":false}]
      ```

      First the **status line**, with the code. Then the headers, one per line. Then a blank
      line, and the body. Every HTTP response has this shape.

  - type: parsons
    id: arrange-a-response
    concept: backend.curl
    difficulty: 2
    language: http
    prompt: >-
      Put this response in the order `curl -i` prints it. The blank line comes before the
      body. One line isn't part of a response.
    blocks:
      - id: status-line
        code: HTTP/1.1 404 Not Found
      - id: type-header
        code: 'content-type: application/json'
      - id: length-header
        code: 'Content-Length: 21'
      - id: body
        code: '{"error":"Not found"}'
    distractors:
      - id: request-line
        code: GET /todos/9 HTTP/1.1
        feedback: >-
          That's a request line: a method and a path. A response starts with its status.

  - type: fill-blank
    id: fill-curl-check
    concept: backend.curl
    difficulty: 2
    language: bash
    prompt: >-
      A teammate says to-do 3 is gone. See the status line and headers the server sends back
      for it. Fill the gaps.
    template: |
      $ curl {{1}} {{2}}:3000/todos/{{3}}
    blanks:
      - key: '1'
        answer: '-i'
      - key: '2'
        answer: localhost
      - key: '3'
        answer: '3'
    bank: ['-i', '-o', localhost, browser, '3', ':3']

  - type: explain-back
    id: explain-why-a-backend
    concept: backend.client-server
    difficulty: 3
    prompt: >-
      A friend builds a to-do app that saves the list inside the page. It works on their
      laptop but the list is empty on their phone. Explain what a backend would change.
    rubric:
      - Each browser keeps its own copy, so the phone never sees what the laptop saved.
      - A server is one shared place that every device asks, with requests to its endpoints.
      - The backend stores the list and answers each device with the same data.
    modelAnswer: >-
      The list lives inside one browser, so each device has its own. The phone starts empty
      because it never saw the laptop's copy. With a backend, the list lives on a server.
      Every device sends a request to the same endpoint, like `GET /todos`, and gets the same
      answer back. Saving is a request too, so the change reaches everyone.

recap:
  - Say what the frontend, a server and the backend each do.
  - Read an API as a list of endpoints, each a method and a path.
  - "Send a request with `curl`, and read the status line, headers and body with `-i`."

recall:
  - id: card-backend
    concept: backend.client-server
    front: What is a server, and what is the backend?
    back: >-
      A server is a program that waits for requests and answers them. The backend is the code
      that runs there.
  - id: card-endpoint
    concept: backend.client-server
    front: What is an endpoint, and what is an API?
    back: >-
      An endpoint is one method and path a server answers, like `GET /todos`. The API is the
      whole set of them.
  - id: card-localhost-port
    concept: backend.curl
    front: 'What do `localhost` and `:3000` mean in `curl localhost:3000/todos`?'
    back: >-
      `localhost` is your own computer. `:3000` is the port, which picks the program listening
      on it.
  - id: card-curl-i
    concept: backend.curl
    front: What does `curl -i` show that plain `curl` doesn't?
    back: >-
      The status line and the headers, above a blank line and the body.

