term: message broker
aka: [event broker, pub/sub]
short: A server that receives messages from some apps and delivers them to others, keeping them until they're handled.
explain: |
  When an order is placed, billing, email and stock all need to know. Calling each one
  directly ties the order service to all three. Publishing one message to a middleman lets
  each of them subscribe on its own.

  There are two shapes. A **queue** broker hands each message to one worker and deletes it
  once confirmed. A **log** broker, like Kafka, keeps messages in order and lets each
  consumer group read at its own pace, even replaying old ones. Ordering is only promised
  within a partition, so the partition key matters.
analogy: A post office sorting room. Senders drop letters off; the sorting room makes sure each one reaches the right letterboxes, even if the recipient is away for a day.
usage: Publish OrderPlaced to the message broker and let the email service subscribe, instead of calling it inline.
twin:
  term: queue
  difference: A message broker is the server that moves messages between many apps. A queue is one line of waiting jobs, which a broker may hold.
related: [queue, dead-letter-queue, event-sourcing, eventual-consistency]
level: 2
lessons: [sysdesign.message-brokers]
