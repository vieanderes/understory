term: accessibility tree
aka: [a11y tree]
short: The browser's list of every element's role, name and state, which screen readers read from.
explain: |
  A screen reader can't see your page, so it asks the browser what's there. The browser
  answers from a second tree it builds from the DOM: "button, Save", "heading level 2,
  Ingredients", "link, Menu".

  Decoration drops out and meaning stays. That's why a styled `div` that looks like a button
  can vanish here: it has no role. The developer tools show this tree in their accessibility
  panel.
analogy: A book read aloud from its table of contents. The listener gets the structure and the names, never the fonts.
usage: Check the accessibility tree, because that icon button has no name and is announced only as "button".
twin:
  term: dom
  difference: The accessibility tree keeps only what assistive technology needs, each element's role, name and state. The DOM holds every element and every detail, and the screen is drawn from it.
related: [dom, screen-reader, accessible-name, aria-role, semantic-html]
level: 2
lessons: [html.semantic-structure, design.accessibility-foundations]
