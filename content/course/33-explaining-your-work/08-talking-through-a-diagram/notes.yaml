summary: >-
  A diagram on its own is a map with no route. Talking someone through it gives them the
  route: start with the **user** and what they want, then add each box in the order their
  request meets it. Follow the main path to the end before any side branch, because side
  branches only make sense once the listener knows what reaches them.


  On each arrow, say what moves and when: the full order to the API, only its id on the
  queue, a charge to the payment provider. "The API talks to the queue" names two boxes and
  explains nothing. Naming the data is what turns a picture into an explanation, and it's
  where reviewers spot problems, such as a whole customer record travelling where an id
  would do.


  Then walk the same request again and ask, at each arrow, **what if this fails?** Say what
  happens, who notices and what the user sees. You drew failure paths in Drawing the
  workflow; this lesson is about saying them out loud, in an order a listener can follow.
  You'll use it in design reviews, onboarding, incident reviews and interviews. The system
  design chapter builds a full method on it, and Presenting your build turns it into a
  talk.
remember:
  - Start with the user and their goal, then add each box in the order the request meets it.
  - Follow the main path to the end before any side branch, so every branch has context.
  - Say what data moves on each arrow and when, not only which boxes are connected.
  - Pause for questions after the main path, before the failures, while the picture is fresh.
  - Walk the request a second time asking "what if this fails?" at each arrow.
  - For each failure, say what happens, who or what notices, and what the user sees.
  - A retry or redelivery is only safe to describe as safe if the repeated step is idempotent.
sections:
  - title: Building the picture as you talk
    body: |-
      The best order for talking is the order you'd draw it in front of someone. Here's the
      bakery flow, written so it reads in the same order you'd say it:

      ```text
      flowchart LR
        customer -->|order| app
        app -->|order| api
        api -->|order id| queue
        queue --> worker
        worker -->|charge| payments
        worker -. timeout, retry with same key .-> payments
      ```

      The dotted arrow is a failure path. Draw it, and say it, only on the second walk.

      Listing the arrows in story order is useful beyond talking. Mermaid places boxes for
      you, and a file whose lines follow the request is easier to review than one grouped
      by box type. The `talkOrder` function you wrote leans on exactly that: it follows
      arrows in the order they're listed.

      When you present a finished diagram, the listener reads all of it at once while you
      talk about one box. Three habits help. Point at the box you're on, by name or with the
      cursor. Say how much is left: "three more boxes on the main path". And say what you're
      skipping: "refunds have their own path, and I'll leave them aside". That last sentence
      stops the listener wondering whether you forgot.

      A good test of a walkthrough is whether the listener could redraw the main path from
      memory. If they can't, you either went too fast or started in the middle.
  - title: Narrating a failure precisely
    body: |-
      A failure walk is only as good as its claims. "The queue redelivers, so it's safe"
      sounds reassuring and can be false. Here's the case that fails in production:

      ```text
      sequenceDiagram
        participant W as worker
        participant P as payments
        participant D as db
        W->>P: charge, key = order id
        P-->>W: charged
        Note over W: crash here, before marking paid
        W->>P: redelivered: charge, same key
        P-->>W: already charged, same result
        W->>D: mark order paid
      ```

      Redelivery is safe here only because the charge carries an **idempotency key**
      derived from the order id, so the provider recognises the repeat and returns the
      first result. Without it, the second charge is a second payment.

      So for every "it retries" or "it redelivers" in a walkthrough, say what makes the
      repeat harmless. For every "it waits", say how long and who notices. Concretely:

      - "Orders wait on the queue, and we alert when the oldest is over five minutes old."
      - "A timed-out charge is retried with the same key, at most three times."
      - "After that, the order stays pending and the customer gets an email."

      Each sentence names the mechanism, the limit and the signal. That's the level of
      detail a reviewer can check and an interviewer is listening for.
  - title: Inviting questions without losing the thread
    body: |-
      Questions are the point of talking through a diagram rather than sending it. Two
      places invite them best: after the main path, when the listener has the whole story,
      and after each failure, when the stakes are clearest.

      Ask a specific question rather than "any questions?" For a reviewer: "Is there a box
      here you'd expect to fail that I haven't covered?" For a newcomer: "Where does the
      order id come from?" A specific question gets an answer, and the answer tells you what
      landed.

      When someone interrupts with "what if this fails?" before you reach the failures,
      answer it at that arrow. It's the same move, only earlier. Then say where you are and
      carry on: "so that's the queue. Back to the worker."

      If a question goes deep on one box, offer to park it: "That's worth ten minutes. Can
      we finish the path first and come back?" Write it down where they can see you do it.
      Parked questions you come back to show you were listening. Parked questions you forget
      look like dodging.

      Finally, say where you'd look hardest. "The worker is the riskiest part, because it
      talks to money" gives the listener your judgement as well as your picture, and it
      often starts the most useful discussion of the session.
pitfalls:
  - '**Starting with the most interesting box.** The database or the queue feels like the heart, but nothing explains why data arrives there. Start with the user.'
  - '**Naming boxes, not data.** "The API talks to the queue" says nothing. Say what travels: the order id, a charge, a receipt.'
  - '**Mixing failures into the first walk.** Branches before the main path is complete lose the listener. Walk the happy path once, then walk it again for failures.'
  - '**Calling retries safe without saying why.** A retried charge is a second charge unless it reuses an idempotency key. Name what makes each repeat harmless.'
  - '**"Any questions?" at the end only.** By then the early boxes are forgotten. Pause after the main path with a specific question.'
verify:
  - lens: breaks
    check: For every retry or redelivery in the walkthrough, name what makes the repeated step idempotent, or mark it as a risk.
  - lens: tests
    check: Kill the worker between its external call and its database write in staging, then confirm the provider saw exactly one call.
  - lens: confuses
    check: Ask a listener to redraw the main path from memory after the first walk, and change the order wherever they get it wrong.
  - lens: scales
    check: Say which arrow carries the most traffic at ten times the orders, and what waits or drops first when it slows.
interview:
  - question: Walk me through the architecture of something you've built.
    answer: >-
      I'd start with the user and their goal, not the stack: "a customer pre-orders bread
      for Saturday". Then I'd follow that one request box by box, saying what moves on each
      arrow: the full order to the API, only the id on the queue, a charge to the payment
      provider. Once the main path is done, I'd pause for questions, then walk it again for
      failures: what happens if the worker is down, if a charge times out, if it crashes
      after charging. I'd end by saying where I'd look hardest and why. The trade-off is
      breadth: following one request means skipping some boxes, so I say which ones I'm
      leaving aside.
  - question: How do you explain a system diagram to someone non-technical?
    answer: >-
      Same order, fewer boxes, everyday names. I'd start with the person and what they want,
      then follow their request in plain words: "your order goes to our server, which saves
      it and tells you it's received; then a separate helper takes the payment and emails
      your receipt". I'd merge boxes they don't need to tell apart, and translate failures
      into what they'd see: "if payment is slow, your order still shows as received, and you
      get the receipt a little later". I'd check understanding by asking what happens to an
      order if the helper is down. The trade-off is precision, so I keep the exact version
      ready for anyone who asks.
  - question: An interviewer points at a queue in your diagram and asks what happens if the consumer fails. What do you say?
    answer: >-
      I'd name the failure points and what happens at each. If the consumer is down,
      messages wait on the queue; nothing is lost while it holds them, and I'd alert on the
      age of the oldest message. If it crashes mid-job, the queue redelivers, which is
      at-least-once delivery, so every step the job takes must be safe to repeat. For an
      external call like a card charge, that means an idempotency key derived from the order
      id. For the database write, an update that sets the order to paid is naturally
      idempotent. If a message keeps failing, it goes to a dead-letter queue after a few
      attempts, so one bad message can't block the rest.
