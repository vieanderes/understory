term: fine-tuning
aka:
  - fine-tune
short: Training an existing model further on your own examples, so its weights change.
explain: |
  A general model can learn your task from thousands of examples: these inputs, these
  outputs. The training nudges its internal numbers, and the new behaviour is baked in.

  It's good at style, format and narrow tasks such as a classifier. It's bad at adding facts:
  they go stale, can't be cited, and the model still guesses around them. Try a better prompt
  and RAG first; fine-tuning is the expensive last step.
analogy: Sending a colleague on a training course. It changes how they work, but it's a slow way to tell them this week's prices.
usage: Fine-tuning won't keep up with the docs, because they change every week.
twin:
  term: rag
  difference: Fine-tuning changes the model itself, slowly, to teach a behaviour. RAG leaves the model alone and hands it fresh facts with each question.
related:
  - rag
  - few-shot-prompting
  - eval
level: 2
