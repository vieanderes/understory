id: shelf-variety
title: ShelfVariety
topic: prefix-sums
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: S, type: string }
    - { name: P, type: "int[]" }
    - { name: Q, type: "int[]" }
  returns: "int[]"
statement: |-
  A library shelf holds N books in a row, numbered from 0 to N − 1. Each book has one of four
  genres, written as a letter: F (fiction), H (history), P (poetry) or S (science). The shelf
  is described by a string S of N letters.

  Visitors ask M questions. Question K names two positions, P[K] and Q[K], in either order,
  and asks how many different genres appear on the shelf between those two positions,
  both ends included.

  Write a function:

  {{signature}}

  that, given a string S of N letters and arrays P and Q of M integers each, returns an array
  of M integers: the answer to every question, in order.

  For example, given S = "FFHSFP", P = [0, 4, 3] and Q = [1, 2, 3]:

  - books 0 to 1 are "FF": one genre;
  - books 2 to 4 are "HSF": three genres;
  - book 3 is "S": one genre;

  so the function should return [1, 3, 1].

  Given S = "PHSF", P = [0] and Q = [3], the function should return [4].

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - M is an integer within the range [1..50,000];
  - each element of arrays P and Q is an integer within the range [0..N − 1];
  - string S consists only of the letters F, H, P and S.
examples:
  - { args: ["FFHSFP", [0, 4, 3], [1, 2, 3]], expected: [1, 3, 1] }
  - { args: ["PHSF", [0], [3]], expected: [4] }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: one book, one question
    group: correctness
    cases:
      - { args: ["F", [0], [0]], expected: [1] }
      - { args: ["S", [0, 0], [0, 0]], expected: [1, 1] }
  - name: reversed_ends
    description: P[K] greater than Q[K]
    group: correctness
    cases:
      - { args: ["FHPS", [3, 2, 3], [0, 1, 3]], expected: [4, 2, 1] }
      - { args: ["SSHH", [3], [1]], expected: [2] }
  - name: whole_shelf_and_edges
    description: the first and the last book, and the whole shelf
    group: correctness
    cases:
      - { args: ["HFFFFP", [0, 5, 0, 1], [0, 5, 5, 4]], expected: [1, 1, 3, 1] }
      - { args: ["PFFFFFFFFS", [0, 9, 1], [9, 0, 8]], expected: [3, 3, 1] }
  - name: all_equal
    description: every book of one genre
    group: correctness
    cases:
      - generate: { seed: 401, args: [{ kind: string, n: 50, alphabet: "H" }, { kind: ints, n: 20, min: 0, max: 49 }, { kind: ints, n: 20, min: 0, max: 49 }] }
  - name: small_random
    description: random, N = 100, M = 100
    group: correctness
    cases:
      - generate: { seed: 402, args: [{ kind: string, n: 100, alphabet: "FHPS" }, { kind: ints, n: 100, min: 0, max: 99 }, { kind: ints, n: 100, min: 0, max: 99 }] }
      - generate: { seed: 403, args: [{ kind: string, n: 100, alphabet: "FFFFFFFFFFFFFFFFFFHP" }, { kind: ints, n: 100, min: 0, max: 99 }, { kind: ints, n: 100, min: 0, max: 99 }] }
  - name: large_random
    description: random, N = 100,000, M = 50,000
    group: performance
    cases:
      - generate: { seed: 404, args: [{ kind: string, n: 100000, alphabet: "FHPS" }, { kind: ints, n: 50000, min: 0, max: 99999 }, { kind: ints, n: 50000, min: 0, max: 99999 }] }
  - name: extreme_large
    description: whole-shelf questions, one genre is rare, N = 100,000, M = 50,000
    group: performance
    cases:
      - generate: { seed: 405, args: [{ kind: string, n: 100000, alphabet: "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFHHHHHHHHHHHHHHHHHHHHPPPPPPPPPPPPPPPPPPPPS" }, { kind: constant, n: 50000, value: 0 }, { kind: constant, n: 50000, value: 99999 }] }
