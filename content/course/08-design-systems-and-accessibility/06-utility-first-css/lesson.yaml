id: design.utility-first-css
title: Utility-first CSS with Tailwind
objective: Style markup with Tailwind's utility classes, read its theme as design tokens, and extract a component when classes repeat.
level: essential
minutes: 10
concepts: [design.utility-classes, design.tailwind-theme, design.type-and-spacing-scale, design.component-extraction]
prerequisites: [design.component-apis, css.modern-architecture]
opening:
  text: >-
    You'll style a card by listing what you want right in the markup. No style sheet to keep
    in step, and it's how a lot of today's React code is styled.

steps:
  - type: prose
    id: what-tailwind-is
    body: |-
      **Tailwind CSS** is a tool that writes your CSS for you. It reads your files, finds class
      names it knows, and generates one small rule for each:

      ```html
      <p class="p-4 text-lg">Hello</p>
      ```

      `p-4` becomes `padding: 16px`, and `text-lg` a font size. Each is a **utility class**:
      a class that sets one thing. You compose the design by listing them.

  - type: playground
    id: style-the-card
    concept: design.utility-classes
    difficulty: 1
    prompt: >-
      This playground has a few of Tailwind's classes loaded. Give the `article` the classes
      `p-4 rounded-lg bg-surface`, and the heading `text-lg font-bold`. Watch the card take
      shape.
    html: |
      <article>
        <h2>Walking boots</h2>
        <p>Waterproof, with a grippy sole. From £89.</p>
      </article>
    css: |
      body { font-family: sans-serif; }
      .p-4 { padding: 16px; }
      .rounded-lg { border-radius: 8px; }
      .bg-surface { background-color: #f5f3ee; }
      .text-lg { font-size: 18px; line-height: 28px; }
      .font-bold { font-weight: 700; }
    editable: [html]
    checks:
      - label: The card has 16 px of padding
        selector: article
        style: { property: padding-top, value: 16px }
      - label: The card has rounded corners
        selector: article
        style: { property: border-radius, value: 8px }
      - label: The card sits on the surface colour
        selector: article
        style: { property: background-color, value: 'rgb(245, 243, 238)' }
      - label: The heading is large and bold
        selector: h2
        style: { property: font-size, value: 18px }
    solution:
      html: |
        <article class="p-4 rounded-lg bg-surface">
          <h2 class="text-lg font-bold">Walking boots</h2>
          <p>Waterproof, with a grippy sole. From £89.</p>
        </article>
    hints:
      - Classes go in a `class` attribute, separated by spaces.
      - The first three go on `article`, the other two on `h2`.
      - '`<article class="p-4 rounded-lg bg-surface">`.'

  - type: prose
    id: typos-fail-silently
    body: >-
      Here's the catch. Tailwind makes rules only for names it recognises. A misspelt class
      matches nothing, so no rule is made and nothing complains.


      The page quietly loses that one style. Tailwind's editor extension underlines unknown
      classes, which is the main reason to install it.

  - type: playground
    id: find-the-typo
    concept: design.utility-classes
    difficulty: 2
    prompt: >-
      The Subscribe button has white text on no background, so it's invisible. One class is
      misspelt. Find it and fix it, using the classes in the CSS tab.
    html: |
      <p>New recipes every Friday.</p>
      <button class="bg-acent text-white p-2 rounded-lg">Subscribe</button>
    css: |
      body { font-family: sans-serif; }
      button { border: 0; font: inherit; }
      .p-2 { padding: 8px; }
      .rounded-lg { border-radius: 8px; }
      .bg-accent { background-color: #0f766e; }
      .text-white { color: #ffffff; }
    editable: [html]
    checks:
      - label: The button has the accent background
        selector: button
        style: { property: background-color, value: 'rgb(15, 118, 110)' }
    solution:
      html: |
        <p>New recipes every Friday.</p>
        <button class="bg-accent text-white p-2 rounded-lg">Subscribe</button>
    hints:
      - Compare each class on the button with the list in the CSS tab.
      - The background class is the odd one out.
      - '`bg-acent` should be `bg-accent`.'

  - type: prose
    id: the-theme
    body: |-
      Where does `bg-accent` come from? From Tailwind's **theme**, which holds your design
      tokens. Your CSS file loads Tailwind, then fills the theme:

      ```css
      @import "tailwindcss";

      @theme {
        --color-accent: #0f766e;
        --spacing: 0.25rem;
      }
      ```

      `--color-accent` creates `bg-accent`, `text-accent` and `border-accent` at once.
      Spacing classes count steps of `--spacing`, 4 px each: `p-4` is 16 px.

  - type: fill-blank
    id: fill-theme-colour
    concept: design.tailwind-theme
    difficulty: 2
    language: css
    prompt: >-
      Add a danger colour to the theme, so a Delete button can use it. Fill the gaps.
    template: |
      @import "tailwindcss";

      {{1}} {
        {{2}}: #b91c1c;
      }

      /* <button class="{{3}} text-white">Delete</button> */
    blanks:
      - key: '1'
        answer: '@theme'
      - key: '2'
        answer: --color-danger
      - key: '3'
        answer: bg-danger
    bank: ['@theme', '@layer', --color-danger, --danger, bg-danger, bg-color-danger]

  - type: playground
    id: lay-out-with-the-scale
    concept: design.type-and-spacing-scale
    difficulty: 2
    prompt: >-
      A designer's note says: 16 px inside each card, 24 px between the cards. The CSS tab
      holds the spacing scale. Add the matching class to the list, and one to each card.
    html: |
      <ul class="flex">
        <li class="card">Tent</li>
        <li class="card">Stove</li>
        <li class="card">Lantern</li>
      </ul>
    css: |
      body { font-family: sans-serif; }
      ul { list-style: none; padding: 0; }
      .card { background: #f5f3ee; border-radius: 8px; }
      .flex { display: flex; }
      .gap-2 { gap: 8px; }
      .gap-4 { gap: 16px; }
      .gap-6 { gap: 24px; }
      .p-2 { padding: 8px; }
      .p-4 { padding: 16px; }
      .p-6 { padding: 24px; }
    editable: [html]
    checks:
      - label: The list has a 24 px gap
        selector: ul.gap-6
        count: 1
      - label: Every card has 16 px of padding
        selector: li.card.p-4
        count: 3
    solution:
      html: |
        <ul class="flex gap-6">
          <li class="card p-4">Tent</li>
          <li class="card p-4">Stove</li>
          <li class="card p-4">Lantern</li>
        </ul>
    hints:
      - Find 24 px and 16 px in the CSS tab.
      - The gap goes on the `ul`, the padding on each `li`.
      - '`<ul class="flex gap-6">`, then `<li class="card p-4">`.'

  - type: prose
    id: extracting-a-component
    body: >-
      Six classes on every button soon becomes a trap: change one, forget five. So you
      **extract a component**. The React `Button` from the last lesson holds its classes once,
      and every screen uses `<Button>`.


      One more trap: square brackets. `bg-[#2f6bff]` is an **arbitrary value**, a way round the
      theme. It works, and it never follows the theme again.

  - type: ai-review
    id: review-off-system-colour
    concept: design.tailwind-theme
    difficulty: 3
    language: tsx
    request: Our brand teal looks dull on the Subscribe button. Make it pop.
    flawClass: logic
    code: |
      function SubscribeButton() {
        return (
          <button className="rounded-lg bg-[#14b8a6] p-2 text-white">
            Subscribe
          </button>
        );
      }
    prompt: >-
      An assistant wrote this. It's brighter, and the test that finds the button passes. Next
      month the brand colour changes in the theme. Tap the line at fault.
    lines: [3]
    reasons:
      - text: The colour steps outside the theme
        correct: true
        feedback: >-
          Yes. `bg-accent` follows the theme. A bracketed hex is frozen in this one file.
      - text: '`className` should be `class`'
        feedback: >-
          React uses `className` and renders `class`. The trouble is the value.
      - text: The classes are in the wrong order
        feedback: >-
          Order in a class list doesn't matter. The frozen colour does.
    fix: |
      function SubscribeButton() {
        return (
          <button className="rounded-lg bg-accent p-2 text-white">
            Subscribe
          </button>
        );
      }

  - type: explain-back
    id: explain-extract-a-button
    concept: design.component-extraction
    difficulty: 3
    prompt: >-
      Every button in an app repeats `rounded-lg bg-accent p-2 text-white`. Why extract a
      `Button` component instead of copying the classes?
    rubric:
      - Copied classes drift, because a change must be made in every copy.
      - A component holds the classes once, next to the markup and behaviour.
      - The component can also fix the element and the variants, so every button stays accessible.
    modelAnswer: >-
      Copies drift. Someone changes the padding on three buttons and forgets the other
      thirty. A `Button` component holds the classes in one place, so one edit reaches every
      screen. It also keeps the real `button` element and the variants together. Nobody
      builds a new one from a `div` by accident.

recap:
  - Style with utility classes, one declaration each, listed in the markup.
  - Keep colours and spacing in the theme, and avoid square brackets.
  - Extract a component when the same classes repeat.

recall:
  - id: card-utility-class
    concept: design.utility-classes
    front: What does a utility class like `p-4` set?
    back: >-
      One declaration: padding, 4 steps of `--spacing`, which is 16 px by default.
  - id: card-typo-class
    concept: design.utility-classes
    front: What happens to a misspelt class like `bg-acent`?
    back: >-
      Nothing. Tailwind makes no rule for it and reports nothing, so the style quietly goes
      missing.
  - id: card-theme-family
    concept: design.tailwind-theme
    front: What does adding `--color-danger` to `@theme` give you?
    back: >-
      A family of classes at once, such as `bg-danger`, `text-danger` and `border-danger`.
  - id: card-why-a-scale
    concept: design.type-and-spacing-scale
    front: Why does a design system offer a few spacing steps instead of any pixel value?
    back: >-
      Every gap comes from the same short list, so screens line up. Changing `--spacing`
      resizes them all at once.
  - id: card-when-to-extract
    concept: design.component-extraction
    front: When do you extract a component instead of repeating classes?
    back: >-
      When the same group of classes repeats. One component holds them once, with the markup
      and behaviour.

