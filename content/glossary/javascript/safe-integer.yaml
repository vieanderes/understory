term: safe integer
aka: [Number.MAX_SAFE_INTEGER, MAX_SAFE_INTEGER, safe integers]
short: A whole number small enough, up to about nine quadrillion, for a JavaScript number to hold it exactly.
explain: |
  A JavaScript number is a 64-bit float. It holds every whole number exactly up to 2⁵³,
  about 9 × 10¹⁵. Past that it starts skipping values, and adding 1 may change nothing.

  There's no error, only a wrong answer. It bites on big sums, on products of two large numbers and on long counts. Hidden tests
  use all three.

  Use `BigInt` for exact big integers, written with an `n` suffix. When a task asks for
  an answer "modulo 1,000,000,007", take the remainder after each step.
analogy: A ruler marked in millimetres up to a point, then only in centimetres. Measure past the end and you get the nearest mark, not the real length.
example:
  language: js
  code: |
    Number.MAX_SAFE_INTEGER;      // 9007199254740991
    9007199254740992 + 1;         // 9007199254740992: the 1 is lost
    9007199254740992n + 1n;       // 9007199254740993n: BigInt is exact
    Number.isSafeInteger(2 ** 53); // false
usage: The product goes past the safe integer range on the big test, so do the maths in BigInt.
related: [floating-point, type-coercion]
level: 2
lessons: [interview.js-traps, algo.number-tricks, interview.reading-the-task]
