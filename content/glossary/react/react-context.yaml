term: React context
aka:
  - useContext
  - context provider
short: A way for a parent to share a value with every child below it, skipping the layers between.
explain: |
  Wrap part of the tree in a provider with a value, such as the current theme. Any component
  below can read it with `useContext`, however deep it is.

  It's for values many parts need and that rarely change: theme, language, the signed-in
  user. Every reader draws again when the value changes, so a big, busy object here slows the
  whole tree. It isn't a store; it only passes a value down.
analogy: The Wi-Fi in a house. Any room can connect, and nobody runs a cable from the router.
example:
  language: tsx
  code: |
    const ThemeContext = createContext('light');

    function App() {
      return <ThemeContext value="dark"><Toolbar /></ThemeContext>;
    }

    function SaveButton() {
      const theme = useContext(ThemeContext);
      return <button className={theme}>Save</button>;
    }
usage: Put the locale in React context; twelve components read it.
twin:
  term: prop-drilling
  difference: React context hands a value to any child below the provider. Prop drilling passes it by hand through each layer, which is wordier but plain to trace.
related:
  - prop-drilling
  - hook
level: 2
