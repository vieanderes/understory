id: js.errors
title: Errors
objective: Throw, catch and clean up after errors, and never hide one.
level: essential
minutes: 10
concepts: [js.errors, js.error-types, js.swallowed-errors]
prerequisites: [js.references-and-copying]
opening:
  text: >-
    You'll stop a failure where it starts, and show people what went wrong instead of a false
    "Saved". That's the difference between a two-minute fix and an evening of guessing.

steps:
  - type: prose
    id: throw-and-catch
    body: |-
      `throw` stops the code on the spot. `try` and `catch` let you deal with it:

      ```js
      try {
        placeOrder(order);
        console.log("Order placed");
      } catch (error) {
        console.log("Failed: " + error.message);
      }
      ```

      If anything in `try` throws, the rest of it is skipped and `catch` runs. Throw
      `new Error("out of stock")`, and `error.message` holds that text.

  - type: predict-output
    id: predict-thrown-string
    concept: js.errors
    difficulty: 1
    language: js
    code: |
      function charge(card) {
        if (card.number === undefined) {
          throw "card number missing";
        }
        return "charged";
      }
      try {
        charge({});
      } catch (error) {
        console.log("checkout failed: " + error.message);
      }
    question: This code throws a plain string. What does it log?
    choices:
      - text: '`checkout failed: undefined`'
        correct: true
        feedback: >-
          Right. A string was thrown, and a string has no `message`.
      - text: '`checkout failed: card number missing`'
        feedback: >-
          `throw` doesn't wrap anything. Only an `Error` object carries a `message`.
      - text: A `TypeError`, because you can only throw errors
        feedback: >-
          You can throw any value at all. That's why a handler can't trust what it receives.

  - type: prose
    id: throw-unwinds
    body: >-
      The **call stack** is the pile of functions still running, newest on top. When
      `checkout` calls `charge`, `charge` sits on top until it returns.


      `throw` stops the function on top at once. Each caller below it stops too, until one
      has a `try`. Its `catch` gets the error. A `finally` block runs after `try` or `catch`,
      whatever happened, so it's where you tidy up.

  - type: predict-output
    id: predict-finally-runs
    concept: js.errors
    difficulty: 2
    language: js
    code: |
      function loadPage() {
        try {
          console.log("loading");
          throw new Error("timed out");
        } catch (error) {
          console.log("failed: " + error.message);
          return "error page";
        } finally {
          console.log("hide spinner");
        }
      }
      console.log(loadPage());
    question: '`catch` returns early. What are the last two lines logged?'
    choices:
      - text: '`hide spinner`, then `error page`'
        correct: true
        feedback: >-
          Right. `finally` runs before the value leaves the function.
      - text: '`error page` only'
        feedback: >-
          A `return` would end most functions there. `finally` still runs first.
      - text: '`error page`, then `hide spinner`'
        feedback: >-
          It's the other way round. `finally` runs before anything is handed back.

  - type: playground
    id: show-save-error
    concept: js.swallowed-errors
    difficulty: 2
    prompt: >-
      The payment service is down, yet the page says Order saved. Fix the `try` and `catch` so
      the page shows the error's message instead. Only a real save should say Order saved.
    html: |
      <h1>Blue mug</h1>
      <button id="place">Place order</button>
      <p id="result"></p>
    js: |
      function saveOrder(order) {
        throw new Error("Payment service is down");
      }

      const result = document.querySelector("#result");
      document.querySelector("#place").addEventListener("click", () => {
        try {
          saveOrder({ item: "Blue mug", quantity: 1 });
        } catch (error) {}
        result.textContent = "Order saved";
      });

      // Test it: this presses Place order once
      document.querySelector("#place").click();
    editable: [js]
    checks:
      - label: The page shows the error's message
        selector: '#result'
        text: Payment service is down
    solution:
      js: |
        function saveOrder(order) {
          throw new Error("Payment service is down");
        }
        const result = document.querySelector("#result");
        document.querySelector("#place").addEventListener("click", () => {
          try {
            saveOrder({ item: "Blue mug", quantity: 1 });
            result.textContent = "Order saved";
          } catch (error) {
            result.textContent = "Could not save: " + error.message;
          }
        });

        // Test it: this presses Place order once
        document.querySelector("#place").click();
    hints:
      - The `catch` is empty, so the failure stops there and the next line claims success.
      - Move the success line inside `try`, after the save.
      - In `catch`, set `result.textContent` using `error.message`.

  - type: bug-hunt
    id: hunt-empty-catch
    concept: js.swallowed-errors
    difficulty: 3
    language: js
    code: |
      function saveOrder(store, order) {
        try {
          store.write(order);
        } catch (error) {} // storage errors are rare
        return { saved: true };
      }
      const fullDisk = {
        write: (order) => {
          throw new Error("disk full");
        },
      };
      console.log(saveOrder(fullDisk, { id: 42 })); // { saved: true }
    prompt: >-
      The disk filled up at 20:00. Customers still saw "Order saved", and no order exists. Tap
      the line at fault.
    lines: [4]
    reasons:
      - text: The `catch` neither handles nor rethrows
        correct: true
        feedback: >-
          Right. The failure stops here, and the next line claims success.
      - text: '`store.write` never runs'
        feedback: >-
          It runs and throws "disk full". The `catch` receives it. What it does next is the
          problem.
      - text: A `finally` block is missing
        feedback: >-
          `finally` is for tidying up. It wouldn't send the error onwards either.
    fix: |
      function saveOrder(store, order) {
        try {
          store.write(order);
        } catch (error) {
          console.log("Save failed: " + error.message);
          throw error;
        }
        return { saved: true };
      }

  - type: prose
    id: types-and-cause
    body: >-
      Built-in failures come as kinds of `Error`. Reading a property of `undefined` gives a
      `TypeError`. `JSON.parse` on broken text gives a `SyntaxError`.


      `error instanceof SyntaxError` asks whether an error is of that kind. A handler deals
      with the kinds it understands and throws the rest onwards. To add a clearer message, throw
      `new Error("reply unreadable", { cause: error })`. The original stays in `error.cause`.

  - type: ai-review
    id: review-catch-everything
    concept: js.error-types
    difficulty: 3
    language: js
    request: Read the answer from an AI model's JSON reply. If the JSON is broken, ask to try again.
    flawClass: logic
    code: |
      function readAnswer(reply) {
        try {
          const data = JSON.parse(reply);
          return data.answer.trim();
        } catch (error) {
          return "The model sent broken JSON. Try again.";
        }
      }
      console.log(readAnswer('{"error":"rate limited"}'));
      // The model sent broken JSON. Try again.
    prompt: >-
      The JSON on line 9 is valid, but users are told it's broken, and nobody sees "rate
      limited". Tap the line at fault.
    lines: [6]
    reasons:
      - text: It treats every error as broken JSON
        correct: true
        feedback: >-
          Right. A missing `answer` threw a `TypeError`. Catch `SyntaxError` only, rethrow the
          rest.
      - text: Valid JSON means `catch` never runs
        feedback: >-
          It did run. `data.answer` is `undefined`, and calling `trim` on it throws a
          `TypeError`.
      - text: '`JSON.parse` returns text, not an object'
        feedback: >-
          It returns an object. That object has `error`, not `answer`, which is the real
          surprise.
    fix: |
      } catch (error) {
        if (error instanceof SyntaxError) {
          return "The model sent broken JSON. Try again.";
        }
        throw error;
      }

  - type: code-challenge
    id: write-settle-order
    concept: js.swallowed-errors
    difficulty: 4
    language: js
    starter: starter.js
    editable: '4-7'
    solution: solution.js
    tests: tests.js
    prompt: >-
      Write `settleOrder(charge, release)` for a ticket checkout.


      Call `charge()`. It returns a receipt, or throws. On a receipt, return
      `{ status: "paid", receipt }`. A declined card throws an `Error` whose `code` is
      `"card_declined"`: return `{ status: "declined", reason }` with its message.


      For anything else thrown, even a string, throw `new Error("checkout failed")` with the
      thrown value as its `cause`. Call `release()` exactly once, whatever happens, to free the
      held seats.
    hints:
      - The starter's `catch` receives every failure and does nothing with any of them.
      - >-
        Three outcomes need three exits: a return from `try`, and a return or a throw from
        `catch`.
      - >-
        Test `thrown instanceof Error && thrown.code === "card_declined"`, and put `release()`
        in a `finally`.

  - type: explain-back
    id: explain-undefined-log
    concept: js.swallowed-errors
    difficulty: 3
    prompt: |-
      ```js
      try {
        charge({}); // throws "card number missing"
      } catch (error) {
        console.log("checkout failed: " + error.message);
      }
      console.log("order paid");
      ```

      This logs `checkout failed: undefined`, then `order paid`. Why? Name two changes that would help.
    rubric:
      - Something threw a value that wasn't an `Error`, so `message` was `undefined`.
      - The `catch` logged and carried on, so the code after it reported success.
      - Throw `Error` objects, and handle the failure properly or rethrow it, with `cause` when wrapping.
    modelAnswer: >-
      Something threw a plain string, which has no `message`, so the log printed `undefined`.
      The handler then swallowed it: no fix, no rethrow. Code after the `catch` carried on and
      reported a paid order. Throwing `Error` objects gives a message and a stack. Rethrowing,
      with the original as `cause`, stops the caller in time.

recap:
  - Throw `Error` objects, and catch them with `try` and `catch`.
  - Tidy up in `finally`, and keep the original failure with `cause` when you wrap one.
  - Handle an error properly or rethrow it, and never swallow it.

recall:
  - id: card-call-stack
    concept: js.errors
    front: What happens to the call stack when a function throws?
    back: >-
      Each function stops in turn, newest first, until one of the callers has a `try`. Its
      `catch` receives the error.
  - id: card-finally-runs
    concept: js.errors
    front: Does `finally` run when `catch` returns early?
    back: >-
      Yes. It runs after `try` or `catch` finishes, even past a `return`, and then the value
      leaves.
  - id: card-cause
    concept: js.error-types
    front: How do you throw a clearer error without losing the original?
    back: >-
      `new Error("order not saved", { cause: error })`. The original stays available as
      `error.cause`, with its type and stack.
  - id: card-swallowed
    concept: js.swallowed-errors
    front: What are the only two honest things a `catch` can do?
    back: >-
      Handle the failure fully, or throw again. An empty `catch`, or a log followed by a normal
      return, hides it from the caller.

