id: js.meets-the-page
title: JavaScript meets the page
objective: Run a script in a page, change what it shows and react to a click.
level: essential
minutes: 10
concepts: [js.page-scripts, js.event-listeners]
prerequisites: [html.the-dom, basics.functions]
opening:
  text: >-
    You'll make a page answer a click: press a button, and something appears. It's the moment
    your HTML stops being a poster and starts being an app.

steps:
  - type: prose
    id: three-jobs
    body: |-
      A web page has three jobs, and three languages. HTML says what's there. CSS says how it
      looks. **JavaScript** says what it does.

      You've already met a script in the DOM lesson:

      ```html
      <script>
        document.querySelector("h1").textContent = "Open now";
      </script>
      ```

      A `script` element runs once, line by line from the top, when the browser reaches it.

  - type: predict-output
    id: predict-top-to-bottom
    concept: js.page-scripts
    difficulty: 1
    language: html
    code: |
      <h1>Closed</h1>
      <script>
        const sign = document.querySelector("h1");
        sign.textContent = "Opening soon";
        sign.textContent = "Open now";
      </script>
    question: What does the heading say once the page has loaded?
    choices:
      - text: Open now
        correct: true
        feedback: >-
          Right. Both lines run, in order, and the last one wins.
      - text: Opening soon
        feedback: >-
          That line does run first. Then the next line replaces the text again.
      - text: Closed
        feedback: >-
          That's the file. The script runs straight after and changes the DOM, which the screen
          follows.

  - type: prose
    id: console-and-errors
    body: >-
      When a script goes wrong, the page stays quiet. The message goes to the **Console**, a
      tab in the developer tools. It shows what `console.log` prints, and every error in red,
      with its line number.


      One classic error: a script above the element it looks for. It runs first, so
      `querySelector` finds nothing and returns `null`, meaning no value at all.

  - type: ai-review
    id: review-script-in-head
    concept: js.page-scripts
    difficulty: 2
    language: html
    request: Write a page whose heading says Open now, set from JavaScript.
    flawClass: logic
    code: |
      <html>
        <head>
          <script>
            document.querySelector("h1").textContent = "Open now";
          </script>
        </head>
        <body>
          <h1>Closed</h1>
        </body>
      </html>
    prompt: >-
      The heading still says Closed. The Console shows "Cannot set properties of null". Tap the
      line at fault.
    lines: [3]
    reasons:
      - text: The script runs before the `h1` exists
        correct: true
        feedback: >-
          Right. Scripts run where they sit. Move it to the end of `body`.
      - text: '`textContent` can''t be set from a script'
        feedback: >-
          It can, as the DOM lesson showed. The trouble is there's no heading to set it on yet.
      - text: '`querySelector` only looks inside `head`'
        feedback: >-
          It searches the whole document. At that moment the document has no `body` content
          yet.
    fix: |
      <html>
        <body>
          <h1>Closed</h1>
          <script>
            document.querySelector("h1").textContent = "Open now";
          </script>
        </body>
      </html>

  - type: prose
    id: listen-for-clicks
    body: |-
      A click is an **event**: something that happens on the page. You give the browser a
      function to run each time it happens:

      ```js
      button.addEventListener("click", showHours);
      ```

      That function is a **listener**. Pass its name with no brackets, so the browser can call
      it later. `hours.hidden = false` shows a hidden element. And `button.click()` presses the
      button from code, the way a test would.

  - type: playground
    id: reveal-hours
    concept: js.event-listeners
    difficulty: 2
    prompt: >-
      The function `showHours` is ready, but nothing calls it. Add one line so a click on the
      button runs it. The last line presses the button once for you.
    html: |
      <h1>Corner Café</h1>
      <button>Show opening times</button>
      <p id="hours" hidden>Every day, 8 to 6</p>
    js: |
      const button = document.querySelector("button");
      const hours = document.querySelector("#hours");

      function showHours() {
        hours.hidden = false;
      }

      // Your line goes here.

      // A test press, like a visitor's click.
      button.click();
    editable: [js]
    checks:
      - label: The opening times are showing
        selector: '#hours:not([hidden])'
      - label: They still say every day, 8 to 6
        selector: '#hours'
        text: Every day, 8 to 6
    solution:
      js: |
        const button = document.querySelector("button");
        const hours = document.querySelector("#hours");

        function showHours() {
          hours.hidden = false;
        }

        button.addEventListener("click", showHours);

        // A test press, like a visitor's click.
        button.click();
    hints:
      - The listener goes on the button, for the event called `"click"`.
      - '`addEventListener` takes the event name, then the function.'
      - 'Write `button.addEventListener("click", showHours);` above the test press.'

  - type: predict-output
    id: predict-brackets
    concept: js.event-listeners
    difficulty: 3
    language: js
    code: |
      function greet() {
        console.log("Hello");
      }
      button.addEventListener("click", greet());
      button.click();
      button.click();
    question: Look closely at line 4. How many times is Hello logged?
    choices:
      - text: Once, as the page loads
        correct: true
        feedback: >-
          Right. `greet()` runs straight away, and the clicks have nothing to call.
      - text: Twice, once per click
        feedback: >-
          Most people pick this. But the brackets call `greet` on line 4 and hand over its
          result, `undefined`.
      - text: Three times
        feedback: >-
          It does run once at load. The clicks run nothing, since no function was handed over.
      - text: Never, the page throws
        feedback: >-
          Surprisingly, no error. The browser accepts `undefined` as a listener and quietly does
          nothing.

  - type: playground
    id: show-the-answer
    concept: js.event-listeners
    difficulty: 3
    prompt: >-
      A quiz card. Write a function that shows the answer and changes the button text to Answer
      shown. Then make a click on the button run it.
    html: |
      <h2>Which planet is closest to the Sun?</h2>
      <p id="answer" hidden>Mercury</p>
      <button>Show the answer</button>
    js: |
      const answer = document.querySelector("#answer");
      const button = document.querySelector("button");

      // Your function and your listener go here.

      // A test press, like a visitor's click.
      button.click();
    editable: [js]
    checks:
      - label: The answer is showing
        selector: '#answer:not([hidden])'
      - label: The button says Answer shown
        selector: button
        text: Answer shown
    solution:
      js: |
        const answer = document.querySelector("#answer");
        const button = document.querySelector("button");

        function reveal() {
          answer.hidden = false;
          button.textContent = "Answer shown";
        }

        button.addEventListener("click", reveal);

        // A test press, like a visitor's click.
        button.click();
    hints:
      - Two lines go in the function. One uses `hidden`, one uses `textContent`.
      - Name the function anything, such as `reveal`. Pass that name to the listener.
      - 'End with `button.addEventListener("click", reveal);`, no brackets after `reveal`.'

  - type: explain-back
    id: explain-brackets
    concept: js.event-listeners
    difficulty: 3
    prompt: >-
      `addEventListener("click", greet)` says hello on every click. With `greet()` it says hello
      once, as the page loads, and clicks do nothing. Why?
    rubric:
      - Without brackets you hand over the function itself, for the browser to call later.
      - With brackets the function runs right there, while the script runs.
      - What's handed over is its result, `undefined`, so a click has nothing to run.
    modelAnswer: >-
      `greet` is the function itself. Passing it lets the browser keep it and call it on each
      click. `greet()` calls it on the spot, as the script runs, so hello appears once. What
      reaches `addEventListener` is the return value, `undefined`. The browser has no function
      to call, so later clicks do nothing.

recap:
  - Say what HTML, CSS and JavaScript each do in a page.
  - Put a script after the elements it uses, and read its errors in the Console.
  - Run a function on every click with `addEventListener`, passing its name without brackets.

recall:
  - id: card-three-jobs
    concept: js.page-scripts
    front: What are the jobs of HTML, CSS and JavaScript in a page?
    back: >-
      HTML says what's on the page, CSS how it looks, and JavaScript what it does.
  - id: card-script-too-early
    concept: js.page-scripts
    front: A script can't find an element that's clearly in the file. What's the usual cause?
    back: >-
      The script sits above the element, so it runs before the element exists. Put scripts at
      the end of `body`.
  - id: card-add-listener
    concept: js.event-listeners
    front: How do you run `save` every time a button is clicked?
    back: >-
      `button.addEventListener("click", save);`, with the function's name and no brackets.
  - id: card-where-errors-go
    concept: js.page-scripts
    front: Your click does nothing and the page shows no error. Where do you look?
    back: >-
      The Console tab of the developer tools. It lists every error in red, with its line.

