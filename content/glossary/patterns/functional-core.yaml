term: functional core, imperative shell
aka:
  - functional core
short: Pure decision-making code in the middle, wrapped by a thin layer that does all the input and output.
explain: |
  Most logic is decisions: is this order valid, what discount applies, which email to send.
  Those can be pure functions. The shell around them does the effects. It reads the request,
  loads the data, calls the core, saves the result and sends the email.

  The core gets fast tests with plain values and no mocks. The shell stays so thin it barely
  needs tests of its own. When the core needs the time, the shell reads the clock and passes
  it in.
analogy: A chef and a waiter. The chef only cooks what's on the ticket; the waiter deals with the customers, the doors and the till.
example:
  language: ts
  code: |
    // Core: pure, decides
    function decideRefund(order: Order, now: Date): Refund | null {
      return now < order.returnBy ? { orderId: order.id, amount: order.total } : null;
    }

    // Shell: does the effects
    const order = await db.orders.find(id);
    const refund = decideRefund(order, new Date());
    if (refund) await payments.refund(refund);
usage: Split it into a functional core and a shell, and the refund rules get tested without a database.
