id: testing.what-to-test
title: What to test
objective: Test behaviour rather than code, pick a test level by risk, and read coverage for what it can't prove.
level: essential
minutes: 10
concepts: [testing.test-cost, testing.test-levels, testing.risk-based-testing, testing.coverage]
prerequisites: [testing.first-test, db.constraints]
opening:
  text: >-
    You'll decide which tests are worth writing before you write one. It's the difference
    between a suite that catches the checkout bug and one that only slows every change.

steps:
  - type: prose
    id: the-cost-of-a-test
    body: >-
      Your first tests called `total` and checked the answer. That's testing **behaviour**:
      what a caller can see. How `total` works inside, its loop and its variables, is the
      implementation.


      Every test has a cost: time to write, time on every run, time to fix when it breaks.
      A test of the implementation breaks on every tidy-up and catches no bug. All cost.

  - type: multiple-choice
    id: pick-rename-breaks
    concept: testing.test-cost
    difficulty: 1
    question: You rename the variable `sum` inside `total` to `running`. Which tests should break?
    choices:
      - text: None of them
        correct: true
        feedback: >-
          Right. Nothing a caller sees has changed, so no good test notices.
      - text: Every test that calls `total`
        feedback: >-
          Calling `total` is fine. It still returns the same answers, so those tests pass.
      - text: Only the test for an empty basket
        feedback: >-
          An empty basket still costs 0. A rename inside can't change any answer.

  - type: ai-review
    id: review-cache-test
    concept: testing.test-cost
    difficulty: 2
    language: js
    request: Add tests for the cart before I refactor it.
    flawClass: logic
    code: |
      test('total adds each line', () => {
        const cart = createCart([{ pence: 250, qty: 2 }]);
        expect(cart.total()).toBe(500);
      });

      test('total is stored after the first call', () => {
        const cart = createCart([{ pence: 250, qty: 2 }]);
        cart.total();
        expect(cart.cachedTotal).toBe(500);
      });
    prompt: >-
      An assistant wrote these. The refactor stops storing the total, and the cart still
      works. One test goes red anyway. Tap the line at fault.
    lines: [9]
    reasons:
      - text: It reads a field inside the cart, not an answer
        correct: true
        feedback: >-
          Yes. `cachedTotal` is how, not what. The first test already checks the answer.
      - text: Two tests shouldn't build the same cart
        feedback: >-
          Each test building its own cart is good. It keeps them independent.
      - text: Two mugs at 250 aren't 500
        feedback: >-
          They are, and the first test agrees. The second one checks a stored field.
    fix: |
      test('total adds each line', () => {
        const cart = createCart([{ pence: 250, qty: 2 }]);
        expect(cart.total()).toBe(500);
      });
    verify:
      question: How would you check the fixed suite still guards the refactor?
      choices:
        - text: Break `total()` on purpose and see a test fail
          correct: true
          feedback: Yes. The suite must notice a wrong answer, whatever the insides.
        - text: Run the refactored cart and see every test pass
          feedback: Passing is needed, not enough. A suite that checks nothing passes too.
        - text: Measure coverage and see it stay at 100%
          feedback: Coverage counts lines run. It can't tell you an assertion would notice a wrong total.

  - type: prose
    id: three-levels
    body: >-
      Tests come in three **levels**. A unit test calls one function, with no page, server
      or database. An integration test runs pieces together, such as your code and a real
      database. An end-to-end test drives the whole app through a browser.


      Higher levels catch more kinds of bug, but run slower: milliseconds against half a
      second. So most tests sit at the bottom. That shape is the **test pyramid**.

  - type: prose
    id: rank-by-risk
    body: >-
      You can't test everything to the same depth. **Risk-based testing** asks two things of
      each part: how likely is it to break, and what would a break cost?


      Checkout rarely breaks and costs a fortune. A theme toggle might break and costs
      nothing. Test the risky parts first and deepest, each at the cheapest level that can
      catch its bug.

  - type: fill-blank
    id: fill-test-plan
    concept: testing.risk-based-testing
    difficulty: 2
    language: text
    prompt: >-
      Pick the cheapest test that catches each problem. Choose none if a break costs
      nothing.
    template: |
      discount rule     wrong price from 10 items    {{1}}
      UNIQUE (email)    two accounts, one address    {{2}}
      checkout          the Pay button does nothing  {{3}}
      theme toggle      wrong colour for a moment    {{4}}
    blanks:
      - key: '1'
        answer: unit
      - key: '2'
        answer: integration
      - key: '3'
        answer: end-to-end
      - key: '4'
        answer: none
    bank: [unit, integration, end-to-end, none]

  - type: prose
    id: what-coverage-is
    body: >-
      A **coverage** tool watches your tests run and marks every line that ran. Vitest's
      `--coverage` option prints a percentage for each file.


      It's good at finding code no test touches. What it can't see is whether a test checked
      anything. A line counts as covered the moment it runs, right or wrong.

  - type: ai-review
    id: review-hundred-percent-coverage
    concept: testing.coverage
    difficulty: 3
    language: js
    request: Get the cart module to 100% coverage before the release.
    flawClass: logic
    code: |
      test('applyDiscount runs', () => {
        applyDiscount({ total: 1000 }, 'SAVE10');
      });

      test('applyDiscount handles a bad code', () => {
        applyDiscount({ total: 1000 }, 'NOPE');
      });
    prompt: >-
      An assistant wrote this. Coverage reads 100%, and the tests pass. Then a release ships a
      discount that doubles the total. Tap the line at fault.
    lines: [2]
    reasons:
      - text: The tests run the code and check nothing
        correct: true
        feedback: >-
          Yes. Every line ran, so coverage is full. No `expect` means any result passes.
      - text: The bad-code test should throw
        feedback: >-
          Maybe, but neither test asserts anything. A thrown error is also a result to check.
      - text: The tests need a `describe` block
        feedback: >-
          Grouping changes nothing. The missing piece is an assertion on the total.
    fix: |
      test('SAVE10 takes ten percent off', () => {
        expect(applyDiscount({ total: 1000 }, 'SAVE10').total).toBe(900);
      });

      test('an unknown code leaves the total alone', () => {
        expect(applyDiscount({ total: 1000 }, 'NOPE').total).toBe(1000);
      });

  - type: code-challenge
    id: write-todo-tests
    concept: testing.test-cost
    difficulty: 3
    language: ts
    editable: '17-25'
    prompt: >-
      `createTodoList` is done. Fill in its two tests, using only `add`, `complete` and
      `remaining`.


      We'll run them on the real list, then on a rewrite that stores tasks differently but
      behaves the same. Both must pass. Then on two broken copies, which must each fail a
      test.
    hints:
      - The rewrite has no `items`, so a test that reads it breaks there.
      - '`remaining()` is the answer a user of the list would see. Check that.'
      - "Start the first test with `list.add('Buy milk');`"

  - type: explain-back
    id: explain-few-browser-tests
    concept: testing.test-levels
    difficulty: 3
    audience: reviewer
    kind: decide
    prompt: >-
      A pull request adds a browser test for every feature, since it "tests the real thing".
      You ask to keep browser tests to a few journeys. Defend that choice to the author.
    rubric:
      - A browser test takes about half a second and breaks on layout changes, so hundreds of them slow every change.
      - Most bugs sit in one function or one query, where a cheaper test finds them and names the cause.
      - A few end-to-end journeys through the riskiest paths prove the layers fit together, which the lower levels can't.
    modelAnswer: >-
      A browser test is the most realistic and the most expensive. Half a second each, and
      a failure says only "the page was wrong", not where. Hundreds of them turn every change
      into a coffee break. Most bugs live in one function or one query, where a cheap test
      finds them and names them. Keep browser tests for the few journeys that would cost most
      if they broke. They prove the layers fit together.

recap:
  - Test what a caller can see, so a tidy-up never breaks a test.
  - Rank parts by how likely and how costly a break is, and test at the cheapest level that catches it.
  - Read coverage as "which lines ran", never as "which results were checked".

recall:
  - id: card-risk-formula
    concept: testing.risk-based-testing
    front: What two questions does risk-based testing ask of each part?
    back: >-
      How likely is it to break, and what would a break cost? The riskiest parts get tested
      first and deepest.
  - id: card-three-levels
    concept: testing.test-levels
    front: Name the three test levels and what each one checks.
    back: >-
      Unit checks one function alone. Integration checks pieces together, such as code with a
      real database. End-to-end drives the whole app through a browser.
  - id: card-implementation-coupled
    concept: testing.test-cost
    front: Why is a test that reads a private field like `cachedTotal` all cost?
    back: >-
      It breaks on every refactor and never catches a bug. A test should check what a caller
      can see.
  - id: card-coverage-without-assert
    concept: testing.coverage
    front: What does 100% coverage prove when a test has no `expect`?
    back: >-
      Only that every line ran. Nothing about whether the result was right.

references:
  - kind: essay
    title: The Practical Test Pyramid
    authors: Ham Vocke
    year: 2018
    venue: martinfowler.com
    url: https://martinfowler.com/articles/practical-test-pyramid.html
    note: The levels, why most tests sit at the bottom, and what each one should and shouldn't check.
    primary: true
    verified: true
  - kind: essay
    title: Test Pyramid
    authors: Martin Fowler
    year: 2012
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/TestPyramid.html
    note: The shape in one page, and the ice-cream cone it warns against.
    verified: true
  - kind: docs
    title: Coverage
    authors: VoidZero Inc. and Vitest contributors
    venue: Vitest documentation
    url: https://vitest.dev/guide/coverage
    note: Turning coverage on, and what the line, branch and function numbers count.
    verified: true

deepDive: >-
  Coverage counts lines, branches and functions that ran. Treat a drop as a question ("what
  did we stop testing?"), and never treat a high number as an answer. Mutation testing, two
  lessons on, measures what coverage can't: whether a change to the code would fail a test.


  The pyramid is a rule of thumb, not a law. A thin interface over a rich database may want
  more integration tests than unit tests. What holds at every layer: write the cheapest test
  that can catch the bug.


  The timings are typical, not fixed. One real app ran 2,049 unit tests in 37 seconds and
  268 browser tests in 138 seconds on one laptop: about 18 ms against half a second each.


  The to-do rewrite in the challenge is how a refactor looks from a test's point of view:
  same calls, same answers, different insides. A suite that passes on both is one you can
  refactor under.


  Choosing which tests to add for one particular change, and what else that change could
  break, is the subject of "What could this change break?".
