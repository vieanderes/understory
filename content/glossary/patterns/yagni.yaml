term: YAGNI
aka:
  - you aren't gonna need it
  - you ain't gonna need it
short: The rule to build only what today's need requires, not features you guess you'll want later.
explain: |
  "Let's make it configurable, in case." "Let's support three databases, in case." Each guess
  costs code to write, test and read, and most guesses are wrong.

  Build for the need you have. When the second need arrives, you'll know its real shape and
  build the right thing. YAGNI isn't an excuse for skipping quality: tests and clear names
  are needed now.
analogy: Packing for the trip you're taking, not every trip you might take. The suitcase closes, and you buy snow boots if it snows.
usage: YAGNI says one payment provider today, so no plugin system for providers.
twin:
  term: dry
  difference: YAGNI says don't build for needs you only imagine. DRY says don't repeat knowledge you already have. They clash when removing repetition means guessing at a general case.
related:
