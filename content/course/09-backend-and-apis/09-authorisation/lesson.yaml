    note: Deny by default, least privilege, and checking on every request.
    verified: true

deepDive: >-
  Random ids don't fix an IDOR. They only make guessing slower, and ids leak anyway: in
  emails, in links people share, in other endpoints' responses. The check per object is what
  closes it.


  Authorisation belongs where the data is read and changed, not only in one check in front
  of the routes. That check covers the paths it knows about; a new endpoint arrives without
  it. A lookup that filters by owner protects every path that runs it. With a database,
  chapter 10, the owner goes into the query itself.


  Role checks that trust a `role` field sent by the client are the same bug in a different
  coat. The role comes from the session the server stored, never from the request.
