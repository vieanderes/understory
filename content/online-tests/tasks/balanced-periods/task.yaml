id: balanced-periods
title: BalancedPeriods
topic: prefix-sums
difficulty: medium
type: algorithmic
recommendedMinutes: 30
signature:
  params:
    - { name: A, type: "int[]" }
    - { name: K, type: int }
  returns: int
statement: |-
  An account records its daily balance changes in an array A of N integers. A **period**
  is a pair of days (P, Q) such that 0 ≤ P ≤ Q < N. Its total is
  A[P] + A[P + 1] + ... + A[Q].

  Write a function:

  {{signature}}

  that, given an array A of N integers and an integer K, returns the number of periods
  whose total is exactly K. If that number exceeds 1,000,000,000, the function should
  return −1.

  For example, given A = [3, −1, 2, 1, −2] and K = 2, the function should return 3. The
  periods are (0, 1), (1, 3) and (2, 2).

  Given A = [0, 0, 0, 0] and K = 0, the function should return 10.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array A is an integer within the range [−10,000..10,000];
  - K is an integer within the range [−1,000,000,000..1,000,000,000].
examples:
  - { args: [[3, -1, 2, 1, -2], 2], expected: 3 }
  - { args: [[0, 0, 0, 0], 0], expected: 10 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: a single day
    group: correctness
    cases:
      - { args: [[4], 5], expected: 0 }
      - { args: [[4], 4], expected: 1 }
      - { args: [[-10000], -10000], expected: 1 }
  - name: simple
    description: equal changes, cancelling changes, no match
    group: correctness
    cases:
      - { args: [[2, 2, 2, 2], 4], expected: 3 }
      - { args: [[1, -1, 1, -1], 0], expected: 4 }
      - { args: [[1, 2, 3], 100], expected: 0 }
  - name: negative_only
    description: all changes negative, negative K
    group: correctness
    cases:
      - { args: [[-1, -1, -1], -2], expected: 2 }
  - name: sorted
    description: ascending and descending changes
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4, 5], 5], expected: 2 }
      - { args: [[5, 4, 3, 2, 1], 5], expected: 2 }
  - name: extreme_min_max_value
    description: extremes of the value range, whole array only match
    group: correctness
    cases:
      - { args: [[10000, -10000, 10000], 10000], expected: 3 }
      - { args: [[-10000, -10000], -1000000000], expected: 0 }
      - { args: [[3, 4, -2, 6], 11], expected: 1 }
  - name: small_random
    description: random changes in [−3..3], N = 300
    group: correctness
    cases:
      - generate: { seed: 7, args: [{ kind: ints, n: 300, min: -3, max: 3 }, { kind: value, value: 1 }] }
      - generate: { seed: 8, args: [{ kind: ints, n: 200, min: -2, max: 2 }, { kind: value, value: 0 }] }
  - name: medium_random
    description: random changes, N = 2,000
    group: correctness
    cases:
      - generate: { seed: 11, args: [{ kind: ints, n: 2000, min: -100, max: 100 }, { kind: value, value: 50 }] }
  - name: large_small_changes
    description: random changes in [−3..3], N = 100,000
    group: performance
    cases:
      - generate: { seed: 42, args: [{ kind: ints, n: 100000, min: -3, max: 3 }, { kind: value, value: 5 }] }
  - name: large_random
    description: random changes across the whole range, N = 100,000
    group: performance
    cases:
      - generate: { seed: 9, args: [{ kind: ints, n: 100000, min: -10000, max: 10000 }, { kind: value, value: 10000 }] }
  - name: extreme_large
    description: all zeros, more than a billion periods, N = 100,000
    group: performance
    cases:
      - generate: { seed: 1, args: [{ kind: constant, n: 100000, value: 0 }, { kind: value, value: 0 }] }
