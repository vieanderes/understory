id: backend.calling-other-apis
title: Calling other APIs from your server
objective: Keep an API key on the server, call a model or payment API with it, and turn its failures into clear errors.
level: essential
minutes: 10
concepts: [backend.api-keys, backend.upstream-failures]
prerequisites: [backend.error-responses, tooling.configuration-and-environment, js.fetch-cancellation]
opening:
  text: >-
    You'll put an AI model behind your own endpoint, so the page can use it without ever
    seeing your key. And when the model is slow or down, your users will get a clear answer.

steps:
  - type: prose
    id: your-server-in-the-middle
    body: >-
      You met **API keys** in the Tooling chapter: a secret that proves calls come from you.
      Model and payment APIs bill every call to the key, so whoever holds it spends your
      money.


      So the page never calls the model itself. It calls your endpoint, say `POST /api/ask`.
      Your server adds the key and calls the model. A server that forwards requests like
      this is a **proxy**.

  - type: multiple-choice
    id: pick-who-calls-the-model
    concept: backend.api-keys
    difficulty: 1
    question: A chat page needs a model's answer. Which request should the browser send?
    choices:
      - text: '`POST /api/ask` on your own server'
        correct: true
        feedback: >-
          Right. Your server holds the key and makes the model call for the page.
      - text: '`POST` to the model API, with the key'
        feedback: >-
          Then the key sits in the page, where any visitor can read it and spend your money.
      - text: '`POST` to the model API, without a key'
        feedback: >-
          The model API refuses calls it can't bill. It answers `401` and no text.

  - type: prose
    id: bearer-header
    body: |-
      The key travels in the `Authorization` header, after the word `Bearer`, meaning "whoever
      bears this". The server reads it from its environment:

      ```js
      const upstream = await fetch("https://api.example.com/v1/answer", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${process.env.MODEL_API_KEY}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ question }),
      });
      ```

      Only the question from the page goes in. The key never goes back out.

  - type: fill-blank
    id: fill-bearer-call
    concept: backend.api-keys
    difficulty: 2
    language: js
    prompt: >-
      Your handler asks a translation API for a French version. Send the key from the
      server's environment in the right header. Fill the gaps.
    template: |
      const upstream = await fetch("https://api.example.com/v1/translate", {
        method: "POST",
        headers: {
          {{1}}: `{{2}} ${{{3}}.TRANSLATE_API_KEY}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ text, to: "fr" }),
      });
    blanks:
      - key: '1'
        answer: Authorization
      - key: '2'
        answer: Bearer
      - key: '3'
        answer: process.env
    bank: [Authorization, Cookie, Bearer, Basic, process.env, localStorage]

  - type: ai-review
    id: review-key-in-the-page
    concept: backend.api-keys
    difficulty: 3
    language: tsx
    request: Add a Summarise button that sends the article to the model API.
    flawClass: security
    code: |
      "use client";

      export function SummariseButton({ text }: { text: string }) {
        async function summarise() {
          const response = await fetch("https://api.example.com/v1/summary", {
            method: "POST",
            headers: { Authorization: `Bearer ${process.env.NEXT_PUBLIC_MODEL_KEY}` },
            body: JSON.stringify({ text }),
          });
          alert((await response.json()).summary);
        }
        return <button onClick={summarise}>Summarise</button>;
      }
    prompt: >-
      An assistant wrote this. The button works and the demo went well. A week later the bill
      shows thousands of calls nobody made from your site. Tap the line at fault.
    lines: [7]
    reasons:
      - text: The key is built into code every visitor downloads
        correct: true
        feedback: >-
          Yes. `NEXT_PUBLIC_` means "ship to the browser". Call your own endpoint instead.
      - text: The `Content-Type` header is missing
        feedback: >-
          Worth adding, but it can't run up a bill. The key in the page can, for anyone.
      - text: '`alert` blocks the page'
        feedback: >-
          Clumsy, not costly. The calls came from people who copied the key out of your bundle.
    fix: |
      "use client";

      export function SummariseButton({ text }: { text: string }) {
        async function summarise() {
          const response = await fetch("/api/summary", {
            method: "POST",
            body: JSON.stringify({ text }),
          });
          alert((await response.json()).summary);
        }
        return <button onClick={summarise}>Summarise</button>;
      }

  - type: prose
    id: timeouts
    body: >-
      The other service can be slow, or down. By default `fetch` waits minutes for an answer,
      and your user waits with it.


      Give the call a deadline with `signal: AbortSignal.timeout(10000)`. After ten seconds
      `fetch` gives up and throws an error whose `name` is `"TimeoutError"`. If the service
      can't be reached at all, `fetch` throws a `TypeError` instead.

  - type: prose
    id: map-the-failure
    body: |-
      Catch both, and answer with your own error. **`504 Gateway Timeout`** means the
      service behind you was too slow. **`502 Bad Gateway`** means it failed.

      ```bash
      $ curl -i -d '{"question":"Hi"}' localhost:3000/api/ask
      HTTP/1.1 504 Gateway Timeout
      content-type: application/json

      {"error":"The model took too long"}
      ```

      Never pass on their error text. It can name your key, your account or their internals.

  - type: code-challenge
    id: write-ask-handler
    concept: backend.upstream-failures
    difficulty: 3
    language: ts
    editable: '20-22'
    prompt: >-
      `ask` passes a question to the model and returns its answer. `callModel` stands in for
      the `fetch`. Make it safe.


      A missing or empty `question` answers `400` without calling the model. A thrown error
      named `"TimeoutError"` answers `504`, any other thrown error `502`. The error body is
      your own message, never the thrown one.
    hints:
      - Check the question first, then wrap the model call in `try` and `catch`.
      - In `catch`, the error's `name` tells a timeout from everything else.
      - 'Start the `catch` with `if (error instanceof Error && error.name === "TimeoutError")`.'

  - type: explain-back
    id: explain-proxy-and-deadline
    concept: backend.upstream-failures
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Your chat page calls `POST /api/ask`, which calls a model API with a ten-second timeout.
      Explain why each of those two choices is there.
    rubric:
      - The key stays on the server, so the browser, its bundle and DevTools never see it.
      - Without a deadline a slow model holds the request, and the user, for minutes.
      - On timeout or failure the server answers 504 or 502 with its own message, not the model's.
    modelAnswer: >-
      The page can't hold the key, because anything in the browser can be read and copied.
      So it calls my endpoint, and my server adds the key from its environment. The timeout
      is there because the model can be slow or stuck. After ten seconds my server stops
      waiting and answers `504`, or `502` if the call failed. The user gets a clear message,
      and the model's own error text stays on the server.

recap:
  - Put your own endpoint between the page and any paid API, so the key stays on the server.
  - "Send a key as `Authorization: Bearer ...`, read from `process.env`."
  - Give every outgoing call a timeout, and answer 504 or 502 with your own message.

recall:
  - id: card-proxy
    concept: backend.api-keys
    front: Why does the page call your endpoint instead of the model API?
    back: >-
      Anything in the browser can be read. Your server holds the key and makes the call.
  - id: card-bearer
    concept: backend.api-keys
    front: Which header carries an API key, and where does the server get it?
    back: >-
      `Authorization: Bearer <key>`, with the key read from `process.env`.
  - id: card-timeout
    concept: backend.upstream-failures
    front: How do you stop `fetch` waiting for ever, and what does it throw?
    back: >-
      Pass `signal: AbortSignal.timeout(ms)`. It throws an error named `TimeoutError`.
  - id: card-502-504
    concept: backend.upstream-failures
    front: When do you answer 502, and when 504?
    back: >-
      504 when the service behind you was too slow, 502 when it failed or sent an error.

references:
  - kind: docs
    title: 'AbortSignal: timeout() static method'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/timeout_static
    note: A signal that aborts after a delay, and the `TimeoutError` it raises.
    primary: true
    verified: true
  - kind: rfc
    title: 'RFC 6750: The OAuth 2.0 Authorization Framework: Bearer Token Usage'
    authors: M. Jones and D. Hardt
    year: 2012
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc6750
    note: 'The `Authorization: Bearer` header that most APIs use for keys.'
    primary: true
    verified: true
  - kind: rfc
    title: 'RFC 9110: HTTP Semantics'
    authors: R. Fielding, M. Nottingham and J. Reschke (editors)
    year: 2022
    venue: IETF
    url: https://www.rfc-editor.org/rfc/rfc9110
    note: '502 Bad Gateway and 504 Gateway Timeout, sections 15.6.3 and 15.6.5.'
    verified: true
  - kind: docs
    title: Secrets Management Cheat Sheet
    authors: OWASP
    venue: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    note: Keeping keys out of code and clients, and rotating them when they leak.
    verified: true

deepDive: >-
  Node's `fetch` doesn't wait for ever without a signal, but close: it gives up after
  five minutes with no response headers. That's far longer than any user will sit and
  watch.


  Log the real upstream error on the server, with the request's id, before you answer
  `502`. You need it to debug, and your user doesn't.


  A leaked key is revoked, not hidden. Deleting the commit or the file doesn't help,
  because copies already exist. Make a new key in the provider's dashboard, put it in the
  environment, then delete the old one.


  Provider SDKs wrap this same call. They add the header, retries and a timeout of their
  own. Read their defaults: some retry a failed call twice before your code hears about it.


  Other services also answer wrongly while looking fine, such as a `200` with an error
  inside. "Systems you don't control" shows how to parse a reply into a typed result or a
  clear error.
