summary: >-
  The component round asks for a small widget with no framework: tabs, a modal, a star
  rating, a dropdown. It looks like a styling task. It is really a test of whether you know
  what each widget promises to keyboard and screen reader users, and whether you keep the
  visible state and the announced state in step.


  The strategy is short. Reach for a native element first, because `<dialog>`, radios and
  buttons already carry the right role, keys and focus behaviour. When nothing native fits,
  as with tabs, follow the ARIA Authoring Practices pattern exactly, and put every state
  change in one function so `aria-selected`, `aria-expanded`, `tabindex` and `hidden` can
  never drift apart.


  You win the round by testing aloud as you go: click it, put the mouse down and use only
  the keyboard, then say what a screen reader announces. An interviewer who watches you find
  and fix a focus bug yourself learns more than one who watches a perfect first draft.
remember:
  - ARIA only describes behaviour; it never adds any, so every role you write commits you to the keys and focus that role promises.
  - Use a native element when one fits, because `<dialog>`, radios and `<button>` bring keyboard support, focus handling and the right announcement for free.
  - A modal needs `showModal()`, not `show()`, so Escape closes it, the page behind goes inert and focus returns to the opener on close.
  - Keep every state attribute in one function, such as `select(index)` or `setOpen(open)`, so the screen and the accessibility tree always agree.
  - A composite widget such as a tab list is one tab stop; a roving tabindex gives only the active item `tabindex="0"` and the arrows move it.
  - A dropdown of links is a disclosure (a button with `aria-expanded` and `aria-controls`), not `role="menu"`, which promises app-style keys.
  - "Hide inputs visually with a clip technique, never `display: none` or `hidden`, which remove them from the keyboard and the accessibility tree."
  - Every listener you add to `document` needs a matching remove, or closed widgets keep reacting to clicks.
sections:
  - title: The dropdown as a disclosure, complete
    body: |-
      Navigation dropdowns are the widget candidates get wrong most often, usually by
      reaching for `role="menu"`. A list of links is a **disclosure**: a real `<button>`
      that shows and hides a region. The links stay ordinary links, and Tab moves through
      them as users expect.

      ```html
      <nav aria-label="Account">
        <button type="button" aria-expanded="false" aria-controls="account-links">Account</button>
        <ul id="account-links">
          <li><a href="/profile">Profile</a></li>
          <li><a href="/orders">Orders</a></li>
        </ul>
      </nav>
      ```

      ```ts
      // aria-expanded and hidden change together in one function, so the screen and the
      // screen reader never disagree.
      export function mountDisclosure(button: HTMLButtonElement): () => void {
        const panel = document.getElementById(button.getAttribute('aria-controls')!)!;

        function setOpen(open: boolean): void {
          button.setAttribute('aria-expanded', String(open));
          panel.hidden = !open;
          if (open) document.addEventListener('click', onDocumentClick);
          else document.removeEventListener('click', onDocumentClick);
        }

        function onDocumentClick(event: MouseEvent): void {
          const target = event.target as Node;
          if (!button.contains(target) && !panel.contains(target)) setOpen(false);
        }

        function onKeyDown(event: KeyboardEvent): void {
          if (event.key !== 'Escape' || panel.hidden) return;
          setOpen(false);
          button.focus();
        }

        const onClick = () => setOpen(button.getAttribute('aria-expanded') !== 'true');
        button.addEventListener('click', onClick);
        button.addEventListener('keydown', onKeyDown);
        panel.addEventListener('keydown', onKeyDown);
        setOpen(false);

        // Unmount removes everything this function added.
        return () => {
          setOpen(false);
          button.removeEventListener('click', onClick);
          button.removeEventListener('keydown', onKeyDown);
          panel.removeEventListener('keydown', onKeyDown);
        };
      }
      ```

      Four details carry the marks. A `<button>` gives Enter and Space for free, which a
      clickable `div` does not. The outside-click listener exists only while the panel is
      open, so a page with ten closed dropdowns has no listeners on `document`. The outside
      check also ignores the opening click itself as it bubbles up to `document`. And Escape
      puts focus back on the button, because focus inside a panel that has become `hidden`
      would be lost to the top of the page.
  - title: The modal dialog done properly
    body: |-
      With `<dialog>` and `showModal()` most of a modal comes free. In Chromium we checked
      the following: `showModal()` focuses the element with `autofocus` (or the first
      focusable one), Tab never reaches the page behind, Escape closes it, and focus goes
      back to the button that opened it. A form with `method="dialog"` closes the dialog
      when submitted and sets `returnValue` to the pressed button's `value`.

      ```html
      <button type="button" id="delete-file">Delete file</button>
      <dialog id="confirm-delete" aria-labelledby="confirm-title">
        <form method="dialog">
          <h2 id="confirm-title">Delete this file?</h2>
          <p>This can't be undone.</p>
          <button value="cancel" autofocus>Cancel</button>
          <button value="delete">Delete</button>
        </form>
      </dialog>
      ```

      ```js
      const dialog = document.querySelector('#confirm-delete');

      document.querySelector('#delete-file').addEventListener('click', () => {
        dialog.returnValue = '';
        dialog.showModal();
      });

      // One place decides the outcome, whether the dialog closed by a button or by Escape.
      dialog.addEventListener('close', () => {
        if (dialog.returnValue === 'delete') deleteFile();
      });
      ```

      Resetting `returnValue` before each open matters: Escape closes without setting it, so
      a stale "delete" from the last time would otherwise delete again. Focus starts on
      Cancel because the action is destructive; for a form dialog, focus the first field.
      `aria-labelledby` gives the dialog its accessible name from the heading.

      Clicking the backdrop does not close a modal by default. If the design wants it,
      remove the dialog's padding, pad an inner wrapper instead, and close when the click
      lands on the dialog itself:

      ```js
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
      ```

      With the padding on the dialog, a click in that padding would also count as a
      backdrop click, which is why the wrapper takes it.
  - title: A roving tabindex, and the questions that come after it
    body: |-
      The challenge builds automatic activation: an arrow press selects the tab and shows
      its panel. Interviewers then extend it, and three extensions come up often.

      Tabs built from data. Generate `id`s for each tab and panel, set `aria-controls` on
      the tab and `aria-labelledby` on the panel, and mount after the markup exists. Put
      the keydown listener on the `tablist` once, not on every tab, and find the index from
      `event.target`. That is event delegation, and it keeps working when tabs are added.

      ```ts
      tablist.addEventListener('keydown', (event: KeyboardEvent) => {
        const current = tabs.indexOf(event.target as HTMLElement);
        if (current === -1) return;
        const last = tabs.length - 1;
        const next =
          event.key === 'ArrowRight' ? (current === last ? 0 : current + 1)
          : event.key === 'ArrowLeft' ? (current === 0 ? last : current - 1)
          : event.key === 'Home' ? 0
          : event.key === 'End' ? last
          : -1;
        if (next === -1) return;
        event.preventDefault();
        select(next);
        tabs[next]!.focus();
      });
      ```

      Vertical tabs. Set `aria-orientation="vertical"` on the tab list and use ArrowUp and
      ArrowDown instead of left and right.

      Panels without focusable content. The APG pattern gives such a panel
      `tabindex="0"`, so Tab from the tab list lands on the panel and a screen reader reads
      it. If the panel starts with a link or a field, leave it out.
  - title: The star rating, and why hidden inputs stay in the tree
    body: |-
      Radios with one `name` inside a `fieldset` give you the whole rating pattern. The
      group is one tab stop. The arrow keys move between stars and check them as they go.
      The `legend` names the group, and screen readers announce the position, such as "3
      of 5". Writing that by hand with `role="radiogroup"` and a roving tabindex is thirty
      lines you then have to test.

      The design wants stars, not circles, so the inputs are hidden visually and the labels
      are styled. The hiding technique decides whether it still works:

      ```css
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      input:checked + label { font-weight: bold; }
      input:focus-visible + label { outline: 2px solid; }
      ```

      `display: none`, `visibility: hidden` and the `hidden` attribute all remove the input
      from the tab order and the accessibility tree, so the rating becomes mouse-only. The
      clip keeps the input focusable and announced, while the label draws the star. The
      `:focus-visible` rule matters: the input is invisible, so the label must show where
      keyboard focus is. One limit to mention: a radio cannot be unchecked, so a rating
      that may be cleared needs a sixth "No rating" option or a separate clear button.
  - title: How to run the 45 minutes
    body: |-
      The round rewards a visible process more than speed. A plan that fits most widgets:

      - Minutes 0 to 5: restate the widget, and say which native element or APG pattern
        it is. Name the keys you will support and the ones you will skip.
      - Minutes 5 to 15: markup with roles, names and ids first, and check it renders.
      - Minutes 15 to 30: one state function that owns every attribute, then the mouse, then
        the keyboard.
      - Minutes 30 to 40: test aloud. Click through, then keyboard only, then say what a
        screen reader would announce at each step. Fix what you find.
      - Minutes 40 to 45: the extensions you would add next, such as manual activation,
        typeahead or tabs from data, and how you would write the automated tests.

      If an assistant is allowed, use it for markup and CSS, and check every ARIA attribute
      it writes against the pattern. Invented attributes and `role="menu"` on navigation
      are its common slips.
pitfalls:
  - >-
    **Using `show()` for a modal.** It opens a non-modal dialog, so Escape does nothing and
    Tab walks behind it. Use `showModal()`, and reserve `show()` for non-blocking popups.
  - >-
    **Updating `hidden` but not `aria-expanded` (or the reverse).** The screen shows one
    thing and a screen reader says another. Put both in one `setOpen` function and call
    nothing else.
  - >-
    **Every tab a tab stop.** Leaving each tab at the default makes keyboard users Tab
    through all of them before reaching the panel. Give only the selected tab
    `tabindex="0"` and the rest `-1`.
  - >-
    **Clickable divs.** A `div` with a click handler has no role, no focus and no Enter or
    Space. Use `<button type="button">`, which also avoids submitting a surrounding form.
  - >-
    **`role="menu"` on site navigation.** It tells screen readers to expect arrow keys and
    typeahead, and changes how their keys behave. Navigation links are a disclosure.
  - >-
    **Hiding radios with `display: none`.** The rating looks right and cannot be reached by
    keyboard. Use a visually hidden class and show focus on the label.
  - >-
    **A document listener that is never removed.** Every open adds a click handler and none
    go away, so closed dropdowns keep toggling. Add it on open, remove it on close.
  - >-
    **Stale `returnValue`.** Escape closes a dialog without setting `returnValue`, so the
    previous answer survives. Reset it to an empty string before each `showModal()`.
interview:
  - question: Why did you use a native dialog and radios instead of divs with ARIA?
    answer: >-
      Because native elements implement the behaviour that ARIA only describes. A
      `<dialog>` opened with `showModal()` closes on Escape, makes the page behind inert,
      focuses its first control or the `autofocus` one, and returns focus to the opener.
      Radios in a fieldset are one tab stop, move with the arrow keys and announce their
      position. With divs I would have to write and test all of that, and each hand-written
      piece is a place where the announced state can drift from the screen. I reach for
      ARIA roles only when no element fits, like tabs. The trade-off is styling: native
      controls take more CSS work, such as hiding the radio circles without removing them.
  - question: Explain roving tabindex. When would you use aria-activedescendant instead?
    answer: >-
      Roving tabindex makes a composite widget one tab stop by moving real focus. Only the
      active item has `tabindex="0"`, the rest have `-1`, and the arrow keys change which
      item has 0 and call `focus()` on it. Screen readers announce the focused element
      directly, and the browser scrolls it into view. `aria-activedescendant` leaves DOM
      focus on a container or input and points at the active item's id. I use it when focus
      must stay put, the classic case being a combobox where the user keeps typing in the
      input. The trade-off is that activedescendant needs stable ids and I must scroll the
      active item into view myself.
  - question: The interviewer asks for a dropdown for the account links. What do you build, and why not a menu?
    answer: >-
      A disclosure: a `<button>` with `aria-expanded` and `aria-controls` that shows and
      hides a list of ordinary links. That matches what the content is, navigation, so
      screen reader users Tab through the links as they do everywhere else on a site.
      `role="menu"` promises application-style behaviour: arrow keys between items,
      typeahead, and focus managed by the widget, and it changes how some screen readers
      handle keys. If I use it without implementing all of that, the widget lies. I would
      add Escape to close with focus back on the button, and close on an outside click with
      a listener that exists only while open. A menu fits app commands, like a toolbar's
      "Rename, Duplicate, Delete".
  - question: How would you test these widgets automatically?
    answer: >-
      With Testing Library in jsdom, driving them like a user and asserting on roles,
      attributes and focus. I query with `getByRole('tab', { name: 'Pricing' })`, so a
      missing role or name fails the test. I press keys with `user-event`, then check
      `aria-selected`, `tabindex`, `toBeVisible` on the panel and `toHaveFocus` on the new
      tab. For the disclosure I test Escape returning focus and an outside click closing it.
      jsdom has no layout and does not implement `<dialog>` methods, so the modal needs a
      real browser test, for example Playwright, where I would also run axe. The trade-off
      is speed against fidelity, so I keep most tests in jsdom and a few in a browser.
