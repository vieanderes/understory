term: covering index
aka: [index-only scan, INCLUDE columns]
short: An index holding every column a query needs, so the table itself is never read.
explain: |
  A normal index tells the database where a row lives. Then it still has to go to the table
  to fetch the other columns. If the index already holds them, that second trip disappears.

  In Postgres you add the extra columns with `INCLUDE`, and `EXPLAIN` shows an
  **Index Only Scan**. It pays off for hot, narrow queries. The cost is a bigger index, and
  an index-only scan still checks the visibility map, so a table that was changed a lot
  since its last vacuum gains less.
analogy: A phone book that lists the number next to each name. You never have to ring anyone to ask for it.
example:
  language: sql
  code: |
    CREATE INDEX orders_customer_created_idx
      ON orders (customer_id, created_at)
      INCLUDE (total_pence);

    SELECT created_at, total_pence
    FROM orders WHERE customer_id = 42;
usage: If we add total_pence as an INCLUDE column, it becomes a covering index and the dashboard query stops touching the table.
related: [index, query-plan]
level: 3
lessons: [db.indexes]
