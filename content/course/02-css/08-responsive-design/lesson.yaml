deepDive: >-
  `em` in `font-size` means the parent's font size. Everywhere else, it means the element's
  own. So `font-size: 0.75em` inside a 24px parent gives 18px, and `padding: 1em` on that
  element is 18px too. Nested `em` sizes multiply, which is why `rem` is the safer default.


  Inside a media query, `rem` always means the browser's starting font size, usually 16px. A
  rule on `html` that changes the root size doesn't move a breakpoint.


  On phones, `100vh` is the height with the browser's toolbar hidden, so part of a
  full-height screen can sit under the toolbar. `100dvh` follows the visible height as the
  toolbar slides in and out.


  An element can't answer its own container query, because its size would depend on its own
  rules. `container-type` goes on a parent. That declaration also stops the container's width
  from depending on its contents, which breaks the loop.
