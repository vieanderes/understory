id: next.content-and-static-sites
title: Content sites and static export
objective: Give each page a title and a share preview, use `next/image` and `next/font`, and export a site as plain files.
level: essential
minutes: 10
concepts: [next.metadata, next.image-and-font, next.mdx, next.static-export]
prerequisites: [next.rendering-spectrum]
opening:
  text: >-
    You'll give every page its own title and a picture for when someone shares the link. Then
    you'll ship the whole site as plain files that any cheap host can serve.

steps:
  - type: prose
    id: what-metadata-is
    body: >-
      Think of a page's tab title, its search description, and the picture shown for a shared
      link. They all live in the HTML `<head>`. That's the page's
      **metadata**.


      In Next.js, a page or layout exports it:


      ```tsx

      import type { Metadata } from 'next';


      export const metadata: Metadata = {
        title: 'About',
        description: 'Who bakes the bread',
        openGraph: { images: ['/cover.png'] },
      };

      ```


      `openGraph` fills in the tags that link previews read.

  - type: predict-output
    id: predict-tab-title
    concept: next.metadata
    difficulty: 1
    language: tsx
    code: |
      // app/layout.tsx
      export const metadata = { title: 'Create Next App' };

      // app/about/page.tsx
      export const metadata = { title: 'About' };
    question: You open `/about`. What does the browser tab say?
    choices:
      - text: '`About`'
        correct: true
        feedback: >-
          Right. The page's metadata wins over its layout's for the same field.
      - text: '`Create Next App`'
        feedback: >-
          That's what every other page shows until you change the layout. The page sets its own.
      - text: '`About | Create Next App`'
        feedback: >-
          Joining them needs a title template in the layout. This one is plain text.

  - type: ai-review
    id: review-og-image-field
    concept: next.metadata
    difficulty: 2
    language: ts
    request: When someone shares the about page, show our cover picture in the preview.
    flawClass: hallucinated-api
    code: |
      // app/about/page.tsx
      export const metadata = {
        title: 'About',
        ogImage: '/cover.png',
      };
    prompt: >-
      An assistant wrote this. The build passes, and the tab says "About". But shared links show
      no picture. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`ogImage` isn''t a metadata field'
        correct: true
        feedback: >-
          Yes. It's quietly ignored. The picture goes in `openGraph: { images: [...] }`.
      - text: Metadata can't be set on a page
        feedback: >-
          Pages can export it, and the title shows that it worked. One field is the problem.
      - text: The path needs the full domain
        feedback: >-
          A relative path is fine. No picture tag was written at all.
    fix: |
      // app/about/page.tsx
      import type { Metadata } from 'next';

      export const metadata: Metadata = {
        title: 'About',
        openGraph: { images: ['/cover.png'] },
      };

  - type: code-challenge
    id: write-recipe-metadata
    concept: next.metadata
    difficulty: 3
    language: ts
    starter: starter.ts
    solution: solution.ts
    tests: tests.ts
    prompt: >-
      Each recipe at `/recipes/[slug]` needs its own metadata. A page does that with
      `generateMetadata`, which Next.js calls with the same `params` as the page.


      Await `params`, look the slug up in `recipes`, and return `title` and `description` from
      it. Add `openGraph: { images: ['/photos/lemon-cake.jpg'] }`, using the slug. For an unknown
      slug, return only `{ title: 'Recipe not found' }`.
    hints:
      - The function is `async`, so it can `await params` like a page does.
      - "`recipes[slug]` is `undefined` for an unknown slug. Check that first."
      - "The picture's path is `` `/photos/${slug}.jpg` ``."

  - type: prose
    id: images-and-fonts
    body: >-
      Two built-in components make pages load well. `<Image>` from `next/image` sends each
      image at the size the screen needs. Its `width` and `height` reserve the space, so text
      below doesn't jump when the picture arrives.


      `next/font` downloads a font during the build and serves it from your own site, with a
      fallback sized to match. The layout `create-next-app` made already uses it for its font.

  - type: prose
    id: what-export-means
    body: >-
      Some sites need no server at all: a portfolio, the docs for a project. Add
      `output: 'export'` to `next.config.ts`, and `npm run build` writes an `out` folder:


      ```text

      $ ls out

      404.html  _next  about.html  index.html  recipes.html  ...

      ```


      A **static host** only hands out files, and runs none of your code. It can serve that
      folder. The price: nothing that needs a server at visit time works.

  - type: bug-hunt
    id: hunt-exported-images
    concept: next.image-and-font
    difficulty: 3
    language: tsx
    code: |
      // next.config.ts
      const nextConfig = { output: 'export' };

      // app/page.tsx
      import Image from 'next/image';

      export default function Page() {
        return <Image src="/cake.jpg" alt="Lemon cake" width={600} height={400} />;
      }
    prompt: >-
      The `out` folder goes to a static host. The photo is broken, and its HTML asks for
      `/_next/image?url=%2Fcake.jpg&w=1200&q=75`. Tap the line at fault.
    lines: [2]
    reasons:
      - text: Resizing images needs a server, and an export has none
        correct: true
        feedback: >-
          Right. `/_next/image` resizes on request. Add `images: { unoptimized: true }`.
      - text: '`width` and `height` should be removed'
        feedback: >-
          They reserve the image's space. The broken part is the URL the image points to.
      - text: The image needs a longer `alt` text
        feedback: >-
          The `alt` is fine for a screen reader. The URL is what the host can't answer.
    fix: |
      // next.config.ts
      const nextConfig = { output: 'export', images: { unoptimized: true } };

      // app/page.tsx
      import Image from 'next/image';

      export default function Page() {
        return <Image src="/cake.jpg" alt="Lemon cake" width={600} height={400} />;
      }

  - type: prose
    id: what-mdx-is
    body: >-
      Markdown is plain text with light marks: `# Title` for a heading, `*word*` for
      emphasis. Articles are easier to write that way. **MDX** is Markdown that can also use
      your React components, such as a chart in a post.


      The `@next/mdx` package turns each `.mdx` file into a component during the build. List
      `mdx` in `pageExtensions`, and a `page.mdx` becomes a page. It also needs an
      `mdx-components.tsx` file at the root.

  - type: fill-blank
    id: fill-mdx-export-config
    concept: next.mdx
    difficulty: 2
    language: ts
    prompt: >-
      Make `.mdx` files into pages, and build the site as static files. Fill the gaps.
    template: |
      // next.config.ts
      import createMDX from '@next/mdx';

      const nextConfig = {
        pageExtensions: ['ts', 'tsx', '{{1}}'],
        output: '{{2}}',
      };

      const withMDX = createMDX();

      export default {{3}}(nextConfig);
    blanks:
      - key: '1'
        answer: mdx
      - key: '2'
        answer: export
      - key: '3'
        answer: withMDX
    bank: [mdx, md, export, static, withMDX, createMDX]

  - type: explain-back
    id: explain-what-export-drops
    concept: next.static-export
    difficulty: 3
    prompt: >-
      A blog works with `npm run start`, but its exported copy loses its search page. Why?
    rubric:
      - An export renders every page once, during the build, into plain files.
      - A static host runs none of your code when someone visits.
      - The search page read the query string per visit, so it needed a server that isn't there.
    modelAnswer: >-
      `output: 'export'` renders every page during the build and writes the results as files.
      The static host only hands those files out; none of your code runs when someone visits.
      The search page was dynamic: it read `searchParams` for each visit. With no server, there's
      nothing to run it, so it can't be exported.

recap:
  - Set each page's title, description and share picture with `metadata` or `generateMetadata`.
  - Use `next/image` and `next/font` so pictures and text don't jump.
  - Export a site as plain files, and know which features need a server.

recall:
  - id: card-og-image
    concept: next.metadata
    front: Where does the picture for a shared link go in a page's metadata?
    back: >-
      In `openGraph: { images: ['/cover.png'] }`. A made-up field such as `ogImage` is
      ignored without an error.
  - id: card-image-size
    concept: next.image-and-font
    front: Why does `<Image>` need `width` and `height` for a string `src`?
    back: >-
      To reserve the image's space before it loads, so the text below doesn't jump.
  - id: card-mdx-setup
    concept: next.mdx
    front: What does `@next/mdx` need before a `page.mdx` becomes a page?
    back: >-
      `mdx` in `pageExtensions`, and an `mdx-components.tsx` file at the root of the project.
  - id: card-export-needs-no-server
    concept: next.static-export
    front: Name two features a static export can't use.
    back: >-
      Anything that needs a server at visit time, such as a page that reads `searchParams`,
      and the default image resizing.

