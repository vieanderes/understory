term: state machine
aka: [finite state machine, FSM]
short: One named status for a thing plus a table of the moves allowed between statuses.
explain: |
  An order with `isPaid`, `isShipped` and `isCancelled` flags has eight combinations, and
  most of them make no sense. Shipped but cancelled? Paid twice? Somebody's code will build
  one eventually.

  Give the thing one status instead, such as `draft`, `paid`, `shipped` or `cancelled`, and
  list which moves are legal. Every change goes through one function that checks the table,
  so an illegal jump is refused in one place. In TypeScript a discriminated union lets each
  status carry only the fields that make sense for it.
analogy: A board game. Your counter sits on one square, and the rules say which squares you may move to next.
example:
  language: ts
  code: |
    const moves = {
      draft: ['paid', 'cancelled'],
      paid: ['shipped', 'refunded'],
      shipped: [],
    } as const;
usage: Those three booleans keep contradicting each other; let's turn the booking into a state machine with five statuses.
related: [discriminated-union, invariant, value-object]
level: 2
lessons: [arch.domain-modelling]
