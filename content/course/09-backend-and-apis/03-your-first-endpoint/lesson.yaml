id: backend.first-endpoint
title: Your first endpoint
objective: Write a handler that routes by method and path, reads JSON and answers with JSON and a status.
level: essential
minutes: 10
concepts: [backend.handlers, backend.routing]
prerequisites: [backend.what-a-backend-is, js.promises, tooling.node-and-npm]
opening:
  text: >-
    You'll write the code on the other side of `curl`: a small to-do API that lists, adds
    and finds to-dos. It's the same shape every backend and every AI endpoint has.

steps:
  - type: prose
    id: a-handler
    body: |-
      A server's own code is small. For each request it calls one function of yours, the
      **handler**: request in, response out.

      ```js
      function handle(request) {
        return Response.json({ message: "Hello" });
      }
      ```

      `Response.json(data)` builds a response with `data` as its JSON body and the right
      `content-type` header. The stand-in server in the JavaScript chapter was a handler too.

  - type: prose
    id: run-it
    body: |-
      A package connects the handler to real requests. After `npm install @hono/node-server`:

      ```js
      import { serve } from "@hono/node-server";

      serve({ fetch: handle, port: 3000 });
      console.log("Listening on http://localhost:3000");
      ```

      `serve` listens on port 3000 and passes every request to `handle`. The option is named
      `fetch` because your function answers a request, the way a server answers `fetch`.

  - type: predict-output
    id: predict-any-path
    concept: backend.handlers
    difficulty: 1
    language: bash
    code: |
      $ node server.js
      Listening on http://localhost:3000

      $ curl localhost:3000/weather/paris
    question: '`handle` always returns the same response. What does this `curl` print?'
    choices:
      - text: '`{"message":"Hello"}`'
        correct: true
        feedback: >-
          Yes. The handler never looks at the request, so every path gets the same answer.
      - text: 'A `404`, since `/weather/paris` was never written'
        feedback: >-
          A 404 only happens if your code returns one. This handler answers everything alike.
      - text: Nothing, since no weather exists
        feedback: >-
          The server always answers. What it says is up to the handler, and it says Hello.

  - type: prose
    id: routing
    body: |-
      Choosing code by method and path is **routing**. `request.method` is `"GET"` or
      `"POST"`. `request.url` is the whole address, and `new URL(...).pathname` cuts out the
      path.

      ```js
      function handle(request) {
        const path = new URL(request.url).pathname;
        if (request.method === "GET" && path === "/todos") {
          return Response.json(todos);
        }
        return Response.json({ error: "Not found" }, { status: 404 });
      }
      ```

      The second argument sets the status. The last line catches everything else.

  - type: fill-blank
    id: fill-route
    concept: backend.routing
    difficulty: 2
    language: js
    prompt: >-
      Answer `GET /notes` with the list of notes, and anything else with a 404. Fill the
      gaps.
    template: |
      function handle(request) {
        const path = new URL(request.{{1}}).pathname;
        if (request.{{2}} === "GET" && path === "/notes") {
          return Response.json(notes);
        }
        return Response.json({ error: "Not found" }, { {{3}}: 404 });
      }
    blanks:
      - key: '1'
        answer: url
      - key: '2'
        answer: method
      - key: '3'
        answer: status
    bank: [url, path, method, verb, status, code]

  - type: prose
    id: reading-a-body
    body: |-
      To add a to-do, the client sends JSON in the body. `request.json()` reads it, and it
      returns a promise, so the handler becomes `async`:

      ```js
      if (request.method === "POST" && path === "/todos") {
        const body = await request.json();
        const todo = { id: nextId++, title: body.title, done: false };
        todos.push(todo);
        return Response.json(todo, { status: 201 });
      }
      ```

      `201` means created. `curl -d '{"title":"Call Sam"}' localhost:3000/todos` sends
      that body as a `POST`.

  - type: ai-review
    id: review-missing-await
    concept: backend.handlers
    difficulty: 3
    language: js
    request: Add a POST /todos endpoint that saves the title it's sent.
    flawClass: logic
    code: |
      if (request.method === "POST" && path === "/todos") {
        const body = request.json();
        const todo = { id: nextId++, title: body.title, done: false };
        todos.push(todo);
        return Response.json(todo, { status: 201 });
      }
    prompt: >-
      An assistant wrote this. `curl -d '{"title":"Water plants"}'` gets a `201`, but the
      reply is `{"id":3,"done":false}` and the title is gone. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`request.json()` returns a promise, and nothing waits for it'
        correct: true
        feedback: >-
          Right. Without `await`, `body` is a promise, and a promise has no `title`.
      - text: '`curl` sent the body in the wrong format'
        feedback: >-
          The body was fine JSON. The handler read `title` from a promise before it settled.
      - text: '`201` drops the body, so use `200`'
        feedback: >-
          A 201 carries a body happily. The title was `undefined` before the response was built.
    fix: |
      if (request.method === "POST" && path === "/todos") {
        const body = await request.json();
        const todo = { id: nextId++, title: body.title, done: false };
        todos.push(todo);
        return Response.json(todo, { status: 201 });
      }

  - type: prose
    id: practice-shape
    body: >-
      The practice sandbox has no network, so its requests are plain objects:
      `{ method, path, body }`, with the body as text. You return `{ status, body }`.


      `JSON.parse(request.body)` plays the part of `await request.json()`. A helper,
      `json(status, data)`, plays `Response.json`. The routing is exactly the same.

  - type: code-challenge
    id: write-todo-routes
    concept: backend.routing
    difficulty: 3
    language: ts
    editable: '30-31'
    prompt: >-
      `handle` answers `GET /todos` and a 404 for anything else. Add two routes.


      `POST /todos`: read the JSON body, make `{ id, title, done: false }` with the next id,
      add it to `todos`, and answer `201` with it. `GET /todos/1`: answer `200` with that
      to-do, or fall through to the 404 when there's no such id.
    hints:
      - Each route is one more `if` on the method and the path, above the last `return`.
      - '`request.path.startsWith("/todos/")` finds the one-to-do route. Slice off the start to get the id text.'
      - 'For the POST, start with `const data = JSON.parse(request.body);` and use `nextId`, then add 1 to it.'

  - type: explain-back
    id: explain-request-to-response
    concept: backend.handlers
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      You run `curl localhost:3000/todos/7` against your server. Describe what your code does
      from the moment the request arrives.
    rubric:
      - The server calls the handler with the request.
      - The handler compares the method and path with each route in turn.
      - It returns the matching response with a status, or the 404 at the end if none match.
    modelAnswer: >-
      The server hands the request to `handle`. It reads the method, `GET`, and the path,
      `/todos/7`. It checks each route in turn: not the list, but the one-to-do route
      matches, so it looks for id 7. If to-do 7 exists it answers `200` with it as JSON. If
      not, the code falls through to the last line and answers `404`.

recap:
  - Write a handler that takes a request and returns a response.
  - Route by `request.method` and the path, with a 404 for everything else.
  - "Read a JSON body with `await request.json()`, and answer `201` for something new."

recall:
  - id: card-handler
    concept: backend.handlers
    front: What is a handler?
    back: >-
      The function the server calls for each request. It takes the request and returns the
      response.
  - id: card-routing
    concept: backend.routing
    front: What does a handler look at to route a request?
    back: >-
      The method, `request.method`, and the path, `new URL(request.url).pathname`.
  - id: card-read-json
    concept: backend.handlers
    front: How does a handler read a JSON body, and what's the classic mistake?
    back: >-
      `await request.json()`. Forgetting `await` leaves a promise, and every field reads as
      `undefined`.
  - id: card-fallback
    concept: backend.routing
    front: Why does a handler end with a 404?
    back: >-
      A request that matched no route still needs an answer. The last line says there's
      nothing here.

