term: eval
aka:
  - eval set
  - evaluation suite
short: Test inputs with expected results, run against an AI feature to score its answers.
explain: |
  A model's output varies, so one manual try proves little. An eval is a fixed set of real
  cases, each with a way to check the answer. That check might be an exact match, a rule in
  code, or a grader model with a rubric.

  Run it on every prompt or model change, like a test suite. The score is the evidence.
  Without it, "the new prompt seems better" is a feeling, and a quiet regression ships.
analogy: A driving test route. Same streets, same checks for every candidate, so the results can be compared.
usage: The new prompt fixed the refund case but dropped the eval score from 91 to 84.
related:
  - llm-as-judge
  - prompt
  - fine-tuning
level: 1
