term: normal flow
aka: [document flow, flow layout, block and inline layout]
short: The browser's default way of placing boxes, blocks stacked down the page and inline boxes along lines.
explain: |
  With no layout rules at all, a page still has a layout. Paragraphs and headings stack
  down the page, each as wide as its container. Links and bold words sit inside lines of
  text and are only as wide as their words.

  Each element's `display` value decides which kind of box it makes: `block`, `inline`,
  `inline-block` or `none`. Flexbox and grid take over only where you ask. Positioning with
  `absolute` or `fixed` takes a box out of the flow, so the boxes around it close the gap as
  if it weren't there.
analogy: Writing on lined paper. Paragraphs start on a new line, and words wrap at the edge.
example:
  language: css
  code: |
    a { display: inline-block; padding: 8px; } /* sits in a line, takes padding */
    .hidden { display: none; }                  /* no box at all */
    .badge { position: absolute; }              /* leaves the flow */
usage: The badge is absolutely positioned, so it's out of normal flow and the card no longer makes room for it.
twin:
  term: flexbox
  difference: Normal flow is what every page gets for free, stacking blocks and wrapping inline text. Flexbox is a layout you switch on for one container to line up its children.
related: [box-model, flexbox, css-grid, stacking-context]
level: 2
lessons: [css.display-and-flow]
