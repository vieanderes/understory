summary: >-
  An eval suite is only as good as two things: the items in it and the grader that scores
  them. This lesson is about keeping both honest. The items should look like what users
  actually send, above all the cases that went wrong. The grader, often an **LLM judge**, is
  itself a model, so it has to earn trust by agreeing with people on the cases that matter,
  the failures.


  The problem it solves is false confidence. A set built from happy examples passes at 0.97
  while complaints pile up. A judge that says pass to everything agrees with people 80% of
  the time and catches nothing. A pairwise comparison that ignores position bias crowns
  whichever answer was shown first. Each produces a number that looks like evidence and
  isn't.


  You reach for these methods whenever a model's output quality decides whether you ship:
  before trusting a judge, when growing an eval set, when choosing between two prompts or
  models, and after launch, when live traffic drifts away from the questions you tested.
  They cost labelling time and model calls, so you spend them where risk is highest: the
  failing slices, the rare but costly cases, and every change to a prompt, model or judge.
remember:
  - Trust an LLM judge only after it catches most of the failures people found, on a labelled sample it wasn't tuned on.
  - Raw agreement flatters a judge when one label is common, so report the share of failures caught and agreement beyond chance, such as Cohen's kappa.
  - Grow the eval set from production traces with bad signals, such as thumbs down, retries, edits and handovers, redacted and labelled by slice.
  - Keep a held-out part of the set, so you can't tune the prompt or the judge to the items you report on.
  - In pairwise judging, ask twice with the order swapped, and count a verdict that follows position as a tie.
  - Small eval sets are noisy, since at 100 items a 90% pass rate is only known to about six points either way.
  - Compare two versions on the same items and look at which items flipped, not only at the two totals.
  - Online evals score a sample of live traffic continuously and alert per slice, which catches drift an offline set can't.
sections:
  - title: Measuring a judge properly
    body: |-
      Put a judge's verdicts next to human labels and you get four counts: failures it caught,
      failures it missed, passes it wrongly failed (false alarms) and passes it agreed with.
      Everything worth knowing comes from those four. The two that matter most are the
      share of failures caught, the judge's **recall on failures**, and the kappa, which
      corrects agreement for chance.

      ```python
      def cohen_kappa(human, judge):
          n = len(human)
          observed = sum(h == j for h, j in zip(human, judge)) / n
          labels = set(human) | set(judge)
          chance = sum((human.count(l) / n) * (judge.count(l) / n) for l in labels)
          return (observed - chance) / (1 - chance) if chance < 1 else float("nan")


      def confusion(human, judge):
          pairs = list(zip(human, judge))
          return {
              "caught": sum(p == ("fail", "fail") for p in pairs),
              "missed": sum(p == ("fail", "pass") for p in pairs),
              "false_alarm": sum(p == ("pass", "fail") for p in pairs),
              "agreed_pass": sum(p == ("pass", "pass") for p in pairs),
          }


      human = ["pass"] * 80 + ["fail"] * 20
      lazy = ["pass"] * 100
      better = ["pass"] * 75 + ["fail"] * 5 + ["fail"] * 16 + ["pass"] * 4

      for name, judge in [("lazy", lazy), ("better", better)]:
          agree = sum(h == j for h, j in zip(human, judge)) / len(human)
          print(name, agree, round(cohen_kappa(human, judge), 2), confusion(human, judge))
      # lazy 0.8 0.0 {'caught': 0, 'missed': 20, 'false_alarm': 0, 'agreed_pass': 80}
      # better 0.91 0.72 {'caught': 16, 'missed': 4, 'false_alarm': 5, 'agreed_pass': 75}
      ```

      Raw agreement puts the two judges 11 points apart. Kappa shows the real gap: 0 against
      0.72. The better judge catches 16 of 20 failures, and its 5 false alarms cost a person
      a second look each, which is usually acceptable.

      Then read every disagreement. They show whether the rubric is vague, whether the judge
      has a blind spot such as trusting confident wording, or whether the human label was
      wrong. Fix the rubric, not only the judge prompt: often people disagreed with each
      other too. Measure on a held-out sample, and repeat whenever the judge's prompt or
      model changes.

      A judge that agrees with people is good at grading. It isn't automatically good at
      grading *this* kind of item: check it per slice, because a judge can be sharp on
      billing questions and blind on refunds.
  - title: How big an eval set needs to be
    body: |-
      An eval score is a measurement with noise, and small sets are noisier than people
      expect. For a pass rate `p` on `n` independent items, the rough 95% margin is
      `1.96 * sqrt(p * (1 - p) / n)`.

      ```python
      import math


      def margin(pass_rate, n):
          return 1.96 * math.sqrt(pass_rate * (1 - pass_rate) / n)


      for n in (50, 100, 400, 1600):
          print(n, round(margin(0.9, n), 3))
      # 50 0.083
      # 100 0.059
      # 400 0.029
      # 1600 0.015
      ```

      At 100 items and 90% passing, the truth could be anywhere from about 84% to 96%. A
      prompt change that moves the score from 88% to 91% on that set proves nothing.
      Quadrupling the set halves the margin, so precision is expensive.

      Two habits make a small set go further. First, compare versions on the **same items**
      and look at what changed per item. The totals can hide a lot of churn.

      ```python
      def paired_changes(old, new):
          fixed = sum(o == "fail" and n == "pass" for o, n in zip(old, new))
          broken = sum(o == "pass" and n == "fail" for o, n in zip(old, new))
          return fixed, broken


      old = ["pass"] * 88 + ["fail"] * 12
      new = ["pass"] * 83 + ["fail"] * 5 + ["pass"] * 9 + ["fail"] * 3
      print(paired_changes(old, new), old.count("pass"), new.count("pass"))
      # (9, 5) 88 92
      ```

      The total rose four points, but five items that used to pass now fail. Those five are
      regressions a user will meet, and they're the first thing to read. Second, keep hard
      gates on critical slices and must-pass items, such as refusing to reveal another
      user's order, where a single failure blocks the change whatever the average says.
  - title: Pairwise comparison without the biases
    body: |-
      Asking "which of these two answers is better?" is easier for a judge, and for people,
      than giving each an absolute score, so pairwise comparison is the usual way to choose
      between two prompts or models. Judges have known biases in this setting: they tend to
      prefer the answer shown first, longer answers, and sometimes answers written in their
      own style. Swapping the order and requiring the verdict to survive the swap removes
      position bias. The rest you handle in the rubric, for example "don't reward length".

      ```python
      def verdict(one, two):
          # one is judge(q, a, b) and two is judge(q, b, a); "first" means the first shown won.
          if one == "first" and two == "second":
              return "a"
          if one == "second" and two == "first":
              return "b"
          return "tie"


      def win_rate(pairs):
          results = [verdict(one, two) for one, two in pairs]
          wins, losses, ties = results.count("a"), results.count("b"), results.count("tie")
          decided = wins + losses
          return {
              "wins": wins, "losses": losses, "ties": ties,
              "win_rate": wins / decided if decided else None,
              "tie_rate": ties / len(results),
          }


      pairs = [("first", "second")] * 30 + [("second", "first")] * 18 + [("first", "first")] * 12
      print(win_rate(pairs))
      # {'wins': 30, 'losses': 18, 'ties': 12, 'win_rate': 0.625, 'tie_rate': 0.2}
      ```

      Report ties separately rather than hiding them. A high tie rate means the judge can't
      tell the versions apart, or follows position: either way the win rate rests on fewer
      items than it seems. Check the pairwise judge against people too, with pairs that
      people have already ranked.

      Pairwise tells you which is better, not whether either is good enough. Keep the
      absolute pass or fail checks for gates, and use pairwise to choose between candidates
      that both pass.
  - title: Running evals on live traffic
    body: |-
      Online evals score a sample of real requests after they're answered, off the request
      path, so they add no latency for the user. A job picks a sample, runs cheap checks on
      all of it, format, grounding, refusal, length, and runs the calibrated judge on a
      smaller share, since judge calls cost money on every item.

      The implicit signals are free and often the most telling: the user edited the draft,
      asked again, pressed thumbs down, or asked for a person. Record them in the trace next
      to the prompt version, so you can chart each signal per version and per slice.

      Alerting works like any service level. Pick a baseline per slice, say a grounding pass
      rate of 95% on refunds, and alert when a daily or hourly window drops below it by more
      than normal noise. Slices matter because an overall average hides a collapse in a
      small slice.

      Online evals also feed the offline set. Every flagged trace is a candidate eval item:
      redact it, have a person label it, tag its slice, and add it, keeping part as held-out.
      That closes the loop: production failures become tests, and the next prompt change
      must pass them in CI.

      Mind privacy and retention here. Traces and eval items drawn from live traffic are
      personal data unless redacted, and they fall under the same deletion duties as the
      rest of the system.
pitfalls:
  - '**Trusting raw agreement.** When most items pass, a judge that always says pass agrees most of the time. Report failures caught and kappa, and read every disagreement.'
  - '**Tuning the judge on the items you report.** Its agreement looks better than it is. Split labelled items, tune on one part, and report on the held-out part.'
  - '**Sampling only happy traces.** An eval set grown from thumbs-up chats never sees the failures users flagged. Sample traces with bad signals first.'
  - '**Reading the swapped pairwise verdict the wrong way round.** Two "first" verdicts mean position won, not answer A. Map each call''s verdict back to the answer it names.'
  - '**Celebrating a small gain on a small set.** At 100 items a three-point change is noise. Look at per-item flips and grow the set where it matters.'
  - '**One overall number.** An average hides a collapsed slice. Report and alert per slice, and keep must-pass items as hard gates.'
  - '**Never rechecking the judge.** A new judge model or prompt changes its behaviour. Recalibrate against human labels on every change.'
verify:
  - lens: tests
    check: Check the judge against fresh human labels on a held-out sample, and count how many of the people's failures it caught.
  - lens: breaks
    check: Feed the pairwise judge a stub that always prefers the first position, and confirm every comparison comes back a tie.
  - lens: confuses
    check: Report each eval score with its sample size and margin of error, so nobody reads a two-point drop on 100 items as real.
  - lens: scales
    check: Sample live traffic for online evals at a fixed rate per slice, so judge cost grows with your budget rather than with traffic.
  - lens: leaks
    check: Redact traces before they join the eval set, because eval sets are copied, shared and kept far longer than logs.
interview:
  - question: How do you know whether an LLM-as-judge can be trusted?
    answer: >-
      I compare it with human labels on a held-out sample and look at the failures it
      catches, not raw agreement. If 80% of answers are good, a judge that always says pass
      agrees 80% of the time and is useless. So I build the confusion matrix, check the share
      of human failures the judge also failed, and compute Cohen's kappa for agreement beyond
      chance. Then I read every disagreement, which usually shows a vague rubric or a blind
      spot. I check it per slice and recalibrate whenever the judge prompt or model changes.
      The trade-off is labelling effort: a few hundred labelled items is typical, and the
      judge only replaces people for grading at scale, not for building the rubric.
  - question: Where do the items in your eval set come from?
    answer: >-
      Mostly from production, weighted towards failures. I sample traces with bad signals,
      thumbs down, retries, edits, handovers to a person, plus a random slice of normal
      traffic so the set isn't only hard cases. Each item is redacted, labelled by a person
      against a rubric and tagged with its slice. I add hand-written edge cases and
      adversarial inputs, like injection attempts, and every incident becomes an item. Part
      of the set is held out and never used for tuning. The set is versioned in the
      repository, so a score always refers to a known set. The risk is that it ages as
      traffic changes, which is why online evals keep feeding it.
  - question: A new prompt scores 91% against the old prompt's 88% on your eval set. Do you ship it?
    answer: >-
      Not on that number alone, because on a set of around 100 items a three-point gap is
      within noise: the margin at 90% is about six points either way. I'd compare the two
      prompts item by item. If the new one fixed nine items but broke five, I read those five
      first, because they're regressions users will meet. I'd check the critical slices and
      must-pass items, which gate independently of the average. And I'd look at cost and
      latency, since a longer prompt can win slightly on quality and lose on both. If it
      passes those checks, I'd ship behind a flag and watch the online metrics per slice.
  - question: How would you run a pairwise comparison between two models fairly?
    answer: >-
      Judge each pair twice with the order swapped, and only count a win that survives the
      swap. Judges tend to favour the first answer shown and longer answers, so a single
      ordering measures position as much as quality. A verdict that flips with the order
      becomes a tie, and I report the tie rate next to the win rate, because many ties mean
      the judge can't separate the two. The rubric tells the judge not to reward length. I'd
      validate the judge against pairs people have ranked, and break results down by slice.
      Pairwise picks the better candidate but doesn't say either is good enough, so absolute
      pass or fail checks still gate the release.
terms:
  - term: LLM judge
    say: An objective grader.
    means: A model that grades outputs against a rubric. Trust it only after it catches most of
      the failures people found on a labelled sample it wasn't tuned on.
  - term: Cohen's kappa
    say: Agreement as a percentage.
    means: Agreement between two graders corrected for the agreement chance alone would give. 1
      is perfect, 0 is no better than chance, so a judge that always says pass scores 0.
  - term: Position bias
    say: The judge prefers the better answer.
    means: A judge's lean towards the answer shown first. Ask twice with the order swapped, and
      count a verdict that follows position as a tie.
  - term: Held-out set
    say: The eval set.
    means: A part of the eval set you never tune the prompt or the judge on, so the number you
      report isn't fitted to the items.
  - term: Online eval
    say: Watching the dashboards.
    means: Scoring a sample of live traffic continuously and alerting per slice, which catches
      drift an offline set can't.
  - term: Drift
    say: The model got worse.
    means: A change over time in what users send, or in the model behind an API, that moves
      quality even though your code didn't change.
