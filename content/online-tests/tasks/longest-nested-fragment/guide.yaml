approach: >-
  Keep a stack of positions. Its bottom is the index just before the current fragment, and
  above it sit the open brackets still waiting for a partner. A closing bracket pops one.
  If the stack is then empty, this bracket breaks every fragment, so it becomes the new
  bottom. Otherwise the fragment that just closed runs from the new top to here, and its
  length is the difference of the two indices.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      **N up to 200,000** and **efficient** rule out checking every start and end: that is
      O(N²) or worse. Aim for one pass.

      Also note that N can be **0**, and that the empty fragment counts, so the answer is
      never negative.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      A short comment keeps you honest about what you are counting: a length, not a number of
      pairs.
    code:
      ts: |-
        // Return the length of the longest run of consecutive brackets that is properly nested.
      python: |-
        # Return the length of the longest run of consecutive brackets that is properly nested.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      - the empty string;
      - only opening brackets;
      - two fragments side by side, which join into one;
      - an unclosed bracket at the front;
      - closers before openers;
      - a stray closer at each end.
    input:
      - '""'
      - '"(((("'
      - '"()()"'
      - '"(()"'
      - '"))(("'
      - '")()())"'
  - kind: ask-ai
    title: Confirm one rule, not the method
    minutes: 1
    body: |-
      Whether side-by-side fragments join decides the whole design. Check it with a narrow
      question, not by asking for code.
    prompt: >-
      Without solving it: in this task, is "()()" one properly nested fragment of length 4,
      or two of length 2? One sentence.
    expect: One fragment of length 4, because "VW" is properly nested when V and W are.
  - kind: plan
    title: Bank correctness with a simple version
    minutes: 2
    body: |-
      For each start, walk right keeping a depth: +1 for "(", −1 for ")". Stop when the depth
      goes below 0. Each time it is exactly 0, the fragment so far is nested.

      This is O(N²): it passes correctness and fails the large tests. That is fine as a first
      step.
  - kind: write
    title: Write the simple version yourself
    minutes: 4
    body: |-
      The depth walk is short and yours to type. Run it before optimising, so you have a
      reference to check the fast version against.
    code:
      ts: |-
        // Return the length of the longest run of consecutive brackets that is properly nested.
        function solution(S: string): number {
          let best = 0;
          for (let p = 0; p < S.length; p++) {
            let depth = 0;
            for (let q = p; q < S.length; q++) {
              depth += S[q] === '(' ? 1 : -1;
              if (depth < 0) break;
              if (depth === 0) best = Math.max(best, q - p + 1);
            }
          }
          return best;
        }
      python: |-
        # Return the length of the longest run of consecutive brackets that is properly nested.
        def solution(S):
            best = 0
            for p in range(len(S)):
                depth = 0
                for q in range(p, len(S)):
                    depth += 1 if S[q] == '(' else -1
                    if depth < 0:
                        break
                    if depth == 0:
                        best = max(best, q - p + 1)
            return best
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Write down the results: they are the reference for the next step.
    expect: Three OKs, then 0, 0, 4, 2, 0 and 4 for your six cases.
  - kind: optimise
    title: One pass with a stack of indices
    minutes: 8
    body: |-
      Push the index of each "(". On ")", pop. If the stack is now empty, this closer can
      never be inside a nested fragment, so push its index as the new floor. Otherwise the
      fragment that just closed starts right after the top, so its length is `i − top`.

      Seed the stack with −1 so a fragment starting at index 0 is measured correctly.
    code:
      ts: |-
        // Return the length of the longest run of consecutive brackets that is properly nested.
        // A stack of indices, seeded with -1 as the floor: O(N) time, O(N) space.
        function solution(S: string): number {
          const stack: number[] = [-1];
          let best = 0;
          for (let i = 0; i < S.length; i++) {
            if (S[i] === '(') {
              stack.push(i);
            } else {
              stack.pop();
              if (stack.length === 0) stack.push(i);
              else best = Math.max(best, i - stack[stack.length - 1]);
            }
          }
          return best;
        }
      python: |-
        # Return the length of the longest run of consecutive brackets that is properly nested.
        # A stack of indices, seeded with -1 as the floor: O(N) time, O(N) space.
        def solution(S):
            stack = [-1]
            best = 0
            for i, ch in enumerate(S):
                if ch == '(':
                    stack.append(i)
                else:
                    stack.pop()
                    if not stack:
                        stack.append(i)
                    else:
                        best = max(best, i - stack[-1])
            return best
    codeMode: full
  - kind: test
    title: Check the fast version matches the slow one
    minutes: 1
    body: |-
      Run again and compare with the results you wrote down. A difference usually means the
      floor was not pushed after an unmatched closer.
    expect: Three OKs, then 0, 0, 4, 2, 0 and 4 again.
  - kind: ai-writes
    title: Let the assistant write tricky inputs
    minutes: 2
    body: |-
      Bracket strings are fiddly to type, so let the assistant produce them. Keep the answers
      to yourself: you check each result by reading the string.
    prompt: >-
      Give me 4 test inputs for this function, one per line, as quoted strings like "(()())".
      Include a long nested fragment after an unclosed "(", and one where the longest fragment
      is at the very end. Inputs only, no answers and no code.
    expect: Four quoted lines for test-input.txt, and each result matches what you can see.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The stack seed and the empty-stack branch are where a
      second pair of eyes helps most.
    prompt: >-
      Review my current solution for correctness and time complexity. List any problems in
      one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the slow version and any debug output. Check the header states the complexity,
      then submit.
