term: property-based testing
aka: [property test, property-based test, generative testing]
short: Testing a rule that must hold for every input, by checking it against hundreds of generated inputs.
explain: |
  Hand-written tests check the examples you thought of. Bugs live in the ones you didn't:
  an empty list, a negative number, an emoji in a name. A generator can try far more inputs
  than you'd ever type.

  You state a **property**, a rule that is always true, such as "sorting twice gives the
  same result as sorting once" or "decode(encode(x)) equals x". The tool, such as
  fast-check, throws random inputs at it. When one fails, it **shrinks** the input to the
  smallest case that still fails, which is usually the bug in plain sight.
analogy: Instead of checking a ladder with three people you know, you check it with a coach-load of strangers of every size.
example:
  language: ts
  code: |
    import fc from 'fast-check';

    test('decoding an encoded string gives it back', () => {
      fc.assert(
        fc.property(fc.string(), (s) => decode(encode(s)) === s),
      );
    });
usage: Property-based testing found it in seconds; the slug function fails on a single space.
related: [unit-test, assertion, stress-testing]
level: 3
lessons: [testing.property-based]
