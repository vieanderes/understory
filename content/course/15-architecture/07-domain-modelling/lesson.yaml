id: arch.domain-modelling
title: Domain modelling
objective: Replace flags with a state machine, enforce each invariant in one place, and wrap amounts in value objects.
level: advanced
minutes: 10
concepts: [arch.state-machines, arch.invariants, arch.value-objects]
prerequisites: [arch.hexagonal, ts.narrowing, js.references-and-copying]
opening:
  text: >-
    You'll shape your data so that nonsense can't be built in the first place. Rules you'd
    otherwise check in twenty places get checked in one.

steps:
  - type: prose
    id: what-domain-modelling-is
    body: >-
      **Domain modelling** is shaping the domain's data so invalid states can't exist. Take an
      order kept as three flags:


      ```js
      { isPaid: false, isShipped: true, isCancelled: true }
      ```


      Shipped and cancelled, and never paid. Three true-or-false flags make eight
      combinations, and most of them mean nothing. Every function that reads them has to
      guess.

  - type: prose
    id: name-state-machine
    body: >-
      A **state machine** fixes that. The order is in exactly one named state, and a table
      lists every move allowed out of each one:


      ```js
      const NEXT = {
        placed: ['paid', 'cancelled'],
        paid: ['baking', 'refunded'],
        baking: ['collected'],
      };
      ```


      One `move` function checks the table and refuses anything else, in one place.

  - type: predict-output
    id: predict-illegal-move
    concept: arch.state-machines
    difficulty: 1
    language: js
    code: |
      function move(order, to) {
        if (!NEXT[order.state].includes(to)) {
          throw new Error(`cannot go from ${order.state} to ${to}`);
        }
        return { ...order, state: to };
      }
      let order = { id: 7, state: 'placed' };
      order = move(order, 'paid');
      order = move(order, 'baking');
      order = move(order, 'cancelled');
    question: A bakery order is placed, paid, and in the oven. What does the last line do?
    choices:
      - text: It sets the state to `cancelled`
        feedback: >-
          Look up `baking` in `NEXT`. The only way out is `collected`. Cancelling isn't
          listed, so `move` refuses.
      - text: It throws "cannot go from baking to cancelled"
        correct: true
        feedback: >-
          Right. That's the message Node printed. The table said no.
      - text: It throws a `TypeError` on `includes`
        feedback: >-
          `NEXT.baking` exists, so `includes` runs fine. The `throw` comes from our own check.

  - type: code-challenge
    id: write-order-states
    concept: arch.state-machines
    difficulty: 3
    language: ts
    prompt: >-
      Refactor this order from three flags to one `state` and a table of allowed moves.
      Placed may go to paid or cancelled. Paid may go to shipped or cancelled. Shipped and
      cancelled are final.


      Keep `pay`, `ship`, `cancel` and `status`. A move the table doesn't allow throws
      `cannot go from <state> to <state>`, and changes nothing.


      So cancelling a shipped order throws `cannot go from shipped to cancelled`.
    hints:
      - Replace the three `let` flags with one `let state`, and write the table above `makeOrder`.
      - All three actions do the same thing with a different target. One inner `move(to)` can serve them all.
      - "Type the table as `const NEXT: Record<State, State[]> = { placed: ['paid', 'cancelled'], ... };`"

  - type: prose
    id: name-invariant
    body: >-
      A rule that must be true after every operation is an **invariant**. "Quantities are 1
      or more." "An order has at least one line." "A shipped order stays shipped."


      Enforce each one in one place: inside the object that owns the data. Keep the data
      private, as lesson 1 showed, and make every function that changes it run the check.
      Then no caller can forget.

  - type: bug-hunt
    id: hunt-second-door
    concept: arch.invariants
    difficulty: 3
    language: js
    code: |
      export function makeOrder() {
        const lines = [];
        return {
          addLine(item, qty) {
            if (!Number.isInteger(qty) || qty < 1) throw new Error('bad quantity');
            lines.push({ item, qty });
          },
          setQuantity(index, qty) {
            lines[index].qty = qty;
          },
          getLines() { return lines.map((line) => ({ ...line })); },
        };
      }
    prompt: >-
      The invariant is "every quantity is a whole number, 1 or more". A customer's order came
      to minus £6. Tap the line that let it happen.
    lines: [9]
    reasons:
      - text: '`setQuantity` changes a line without the check'
        correct: true
        feedback: >-
          Yes. One function guards the rule, one doesn't. Every change needs the same check.
      - text: The checkout should refuse negative totals
        feedback: >-
          That treats the symptom. By then the order is already invalid. Stop the bad quantity
          going in.
      - text: '`lines` should be a `Map`'
        feedback: >-
          The container isn't the issue. Any structure can hold a quantity of minus three if a
          function lets it.
    fix: |
      setQuantity(index, qty) {
        if (!Number.isInteger(qty) || qty < 1) throw new Error('bad quantity');
        lines[index].qty = qty;
      },

  - type: prose
    id: name-value-object
    body: >-
      A bare number for money might be pounds, pence or euros. A **value object** wraps it:
      `money(500, 'GBP')`. It's compared by its contents, so two fivers are equal. It's valid
      from birth, because the factory refuses fractional pence.


      And it's frozen. `Object.freeze` makes an object's properties read-only, so nothing can
      change a price after it's made.

  - type: ai-review
    id: review-floor-to-pence
    concept: arch.value-objects
    difficulty: 4
    language: js
    request: Add a helper that turns a price typed in pounds into our money value object.
    flawClass: edge-case
    code: |
      export function fromPounds(pounds, currency) {
        const pence = Math.floor(pounds * 100);
        return money(pence, currency);
      }
    prompt: >-
      An assistant wrote this. The tests tried £5.00 and £12.50, and both came out exact. A
      loaf priced at £4.35 now sells for £4.34. Tap the line at fault.
    lines: [2]
    reasons:
      - text: '`money` should accept fractional pence'
        feedback: >-
          Whole pence is the invariant that keeps sums exact. Loosening it would spread the
          problem, not fix it.
      - text: '`4.35 * 100` is a hair under 435'
        correct: true
        feedback: >-
          Yes. Node gives `434.99999999999994`, and `floor` drops it. `Math.round` gives 435.
      - text: '`pounds` should be multiplied by 1000'
        feedback: >-
          There are 100 pence in a pound. The factor is right. What's done to the product
          isn't.
    fix: |
      const pence = Math.round(pounds * 100);

  - type: explain-back
    id: explain-one-place
    concept: arch.invariants
    difficulty: 4
    prompt: >-
      A codebase checks "quantity is at least 1" in the form, the handler and a nightly job.
      Invalid orders still appear. Why doesn't checking in three places protect the rule?
    rubric:
      - Each check guards one path, so any new path that skips them can write bad data.
      - The order itself accepts any value, so nothing stops code from building an invalid one.
      - Enforcing the invariant inside the order, in its factory and every function that changes it, covers all callers at once.
    modelAnswer: >-
      Three checks guard three doors, and the building has more. A fourth path, an import or
      an admin script, skips all of them. The real gap is that the order object takes
      whatever it's given. So the rule depends on every caller remembering it. I'd move the
      check into the order itself: the factory and each function that changes a line. Then
      an invalid order can't be built, whoever is calling. The form can still check, but
      only to be helpful.

recap:
  - Model a lifecycle as one named state and a table of allowed moves, not a set of flags.
  - Enforce each invariant inside the object that owns the data, on every function that changes it.
  - Wrap amounts and the like in frozen value objects, valid from construction and equal by contents.

recall:
  - id: card-state-machine
    concept: arch.state-machines
    front: Why is one `state` field better than several true-or-false flags?
    back: >-
      The thing is in exactly one named state, and a table lists the allowed moves. Flags
      allow combinations that mean nothing, like shipped and cancelled.
  - id: card-value-object
    concept: arch.value-objects
    front: Name the three properties of a value object.
    back: >-
      It's immutable, it's compared by its contents, and it's valid from construction. Money
      in whole pence is the classic case.
  - id: card-pence
    concept: arch.value-objects
    front: Why does `Math.floor(4.35 * 100)` give the wrong pence?
    back: >-
      `4.35 * 100` is `434.99999999999994` in floating point, so `floor` gives 434. Round to
      the nearest whole number, then keep integers.
  - id: card-invariant
    concept: arch.invariants
    front: What is a domain invariant, and where do you enforce it?
    back: >-
      A rule that's true after every operation. Enforce it in one place, inside the object
      that owns the data, on every function that changes it.

references:
  - kind: essay
    title: Value Object
    authors: Martin Fowler
    year: 2016
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/ValueObject.html
    note: Equality by contents, immutability, and why small domain types repay their cost.
    primary: true
    verified: true
  - kind: docs
    title: Object.freeze()
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze
    note: What freezing prevents, that it's shallow, and that strict mode throws on a write.
    verified: true
  - kind: docs
    title: Narrowing
    authors: Microsoft
    venue: TypeScript documentation
    url: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
    note: Discriminated unions and the `never` check, which make a state field safe to branch on.
    verified: true

deepDive: >-
  Every output was run on Node 24. `move` threw "cannot go from baking to cancelled".
  Assigning to a frozen field threw "Cannot assign to read only property 'pence'", because
  modules run in strict mode. `4.35 * 100` printed `434.99999999999994`, and `Math.round`
  of it gave `435`.


  `Object.freeze` is shallow. We froze an order and its `lines` array, and `push` threw
  "object is not extensible". The line objects inside were still open. Freeze each level,
  or copy on the way in and on the way out.


  In TypeScript, give each state its own shape with a discriminated union, as the narrowing
  lesson showed. A `paid` order has a `paidAt`. A `placed` one doesn't. Then code can't
  read a payment date from an unpaid order, and the `never` check finds every place a new
  state was forgotten.


  The table in code is only half of it. Two requests can both read `paid` and both try to
  move on. The conditional `UPDATE` from the databases chapter, which names the state it
  expects in its `WHERE`, is the same table enforced where the data lives.
