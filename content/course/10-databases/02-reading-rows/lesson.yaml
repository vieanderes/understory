id: db.reading-rows
title: Finding the rows you want
objective: "Filter with `WHERE`, sort with `ORDER BY`, keep the first few with `LIMIT`, and find missing values with `IS NULL`."
level: essential
minutes: 9
concepts: [db.filtering, db.sorting-and-limit, db.null]
prerequisites: [db.what-a-database-is]
opening:
  text: >-
    You'll pull exactly the rows a screen needs out of a table: the open tasks, the next three
    due, the ones nobody owns. You'll also meet the missing value that fools almost everyone.

steps:
  - type: prose
    id: where-keeps-rows
    body: >-
      A to-do app never shows every task at once. `WHERE` keeps only the rows where a condition
      is true:


      ```sql

      SELECT * FROM tasks WHERE done = false;

      SELECT * FROM tasks WHERE assignee = 'sam';

      ```


      Text goes in single quotes. Double quotes mean a column name, so `"sam"` gets you
      `column "sam" does not exist`. You can also compare with `<>` (not equal), `<` and `>`.

  - type: sql
    id: find-open-tasks
    concept: db.filtering
    difficulty: 1
    prompt: >-
      Show only the tasks that aren't done yet.
    setup: &tasks |
      CREATE TABLE tasks (
        id integer PRIMARY KEY,
        title text NOT NULL,
        done boolean NOT NULL,
        priority text NOT NULL,
        due date NOT NULL,
        assignee text
      );
      INSERT INTO tasks VALUES
        (1, 'Write the release notes', false, 'high', '2026-10-02', 'sam'),
        (2, 'Fix the login bug', true, 'urgent', '2026-09-28', 'ana'),
        (3, 'Update the logo', false, 'low', '2026-10-20', NULL),
        (4, 'Renew the domain', false, 'urgent', '2026-10-01', NULL),
        (5, 'Reply to support emails', false, 'normal', '2026-10-05', 'ana'),
        (6, 'Plan the team lunch', true, 'low', '2026-09-30', 'sam'),
        (7, 'Back up the database', false, 'high', '2026-10-03', 'kofi');
    starter: |
      SELECT * FROM tasks;
    solution: |
      SELECT * FROM tasks WHERE done = false;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Add a `WHERE` after the table name.
      - The `done` column holds `true` or `false`.

  - type: prose
    id: and-or
    body: >-
      `AND` needs both sides true. `OR` needs either. Mixed together, `AND` is worked out
      first, the way `×` goes before `+`:


      ```sql

      WHERE done = false AND priority = 'high' OR priority = 'urgent'

      ```


      That reads as "open and high, or urgent", so a finished urgent task sneaks in. Brackets
      say what you mean: `done = false AND (priority = 'high' OR priority = 'urgent')`.

  - type: sql
    id: fix-and-or
    concept: db.filtering
    difficulty: 2
    prompt: >-
      The team wants open tasks that are high or urgent. Run this query: a finished task sneaks
      in. Fix it so only open ones come back.
    setup: *tasks
    starter: |
      SELECT * FROM tasks
      WHERE done = false AND priority = 'high' OR priority = 'urgent';
    solution: |
      SELECT * FROM tasks
      WHERE done = false AND (priority = 'high' OR priority = 'urgent');
    checks:
      ordered: false
    showSchema: true
    hints:
      - Find the row with `done` true. Which part of the condition let it in?
      - Put brackets around the two priorities.

  - type: prose
    id: order-and-limit
    body: >-
      Rows come back in no promised order. Today's order can change tomorrow. `ORDER BY` sorts
      them, and `DESC` flips the sort:


      ```sql

      SELECT * FROM tasks ORDER BY due;

      SELECT * FROM tasks ORDER BY due DESC LIMIT 5;

      ```


      `LIMIT 5` keeps the first five rows after sorting. Together they answer "what's next?" and
      "what's newest?", the two questions most lists ask.

  - type: sql
    id: next-three-due
    concept: db.sorting-and-limit
    difficulty: 2
    prompt: >-
      The home screen shows the three open tasks due soonest, earliest first. Write the query.
    setup: *tasks
    starter: |
      SELECT * FROM tasks WHERE done = false;
    solution: |
      SELECT * FROM tasks WHERE done = false ORDER BY due LIMIT 3;
    checks:
      ordered: true
    showSchema: true
    hints:
      - '`ORDER BY` goes after the `WHERE`, and `LIMIT` goes last.'
      - Earliest first is the normal direction, so you don't need `DESC`.

  - type: prose
    id: what-null-is
    body: >-
      Tasks 3 and 4 have no assignee. The cell holds **NULL**, which means "missing" or
      "unknown". It isn't an empty string or zero.


      Here's the trap. Is an unknown value equal to NULL? Postgres says "unknown", not "yes", and
      `WHERE` keeps only rows where the answer is yes. So `= NULL` never matches anything. The
      test is `IS NULL`, and its opposite is `IS NOT NULL`.

  - type: sql
    id: fix-equals-null
    concept: db.null
    difficulty: 2
    prompt: >-
      This should list the tasks nobody is assigned to. It runs without an error and finds
      nothing. Fix it.
    setup: *tasks
    starter: |
      SELECT * FROM tasks WHERE assignee = NULL;
    solution: |
      SELECT * FROM tasks WHERE assignee IS NULL;
    checks:
      ordered: false
    showSchema: true
    hints:
      - '`=` with NULL is never true, so every row is dropped.'
      - Postgres has a special test for missing values.

  - type: sql
    id: not-sams-tasks
    concept: db.null
    difficulty: 3
    prompt: >-
      Sam is away. Show every task not assigned to Sam, so others can pick them up. The
      unassigned ones count too, but this query misses them. Fix it.
    setup: *tasks
    starter: |
      SELECT * FROM tasks WHERE assignee <> 'sam';
    solution: |
      SELECT * FROM tasks WHERE assignee <> 'sam' OR assignee IS NULL;
    checks:
      ordered: false
    showSchema: true
    hints:
      - Is NULL different from `'sam'`? Postgres answers "unknown", so the row is dropped.
      - Keep the `<>` test, and add the rows where the assignee is missing.

  - type: explain-back
    id: explain-equals-null
    concept: db.null
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      A teammate's query `WHERE deleted_at = NULL` returns no rows, though many rows have no
      `deleted_at`. Explain why, and what to write instead.
    rubric:
      - NULL means unknown, so comparing anything with it gives unknown, not true.
      - '`WHERE` keeps only rows where the condition is true, so every row is dropped.'
      - '`IS NULL` is the test for a missing value.'
    modelAnswer: >-
      NULL stands for "unknown". Asking whether an unknown value equals NULL gives unknown
      again, not true. `WHERE` keeps a row only when its condition is true, so every row falls
      out and the query finds nothing. The fix is `WHERE deleted_at IS NULL`, the one test
      built for missing values.

recap:
  - Keep the rows you need with `WHERE`, using brackets when `AND` meets `OR`.
  - Sort with `ORDER BY` and keep the first few with `LIMIT`.
  - Find missing values with `IS NULL`, never `= NULL`.

recall:
  - id: card-and-before-or
    concept: db.filtering
    front: How does Postgres read `a AND b OR c`?
    back: "As `(a AND b) OR c`. `AND` is worked out first, so add brackets when you mean otherwise."
  - id: card-no-order
    concept: db.sorting-and-limit
    front: Without `ORDER BY`, what order do rows come back in?
    back: No promised order. It can change between runs, so sort whenever order matters.
  - id: card-is-null
    concept: db.null
    front: Why does `WHERE x = NULL` return no rows?
    back: >-
      Comparing with NULL gives unknown, not true, and `WHERE` keeps only true rows. Write
      `x IS NULL`.
  - id: card-not-equal-null
    concept: db.null
    front: Which rows does `WHERE assignee <> 'sam'` leave out besides Sam's?
    back: The rows where `assignee` is NULL, because the comparison is unknown for them.

