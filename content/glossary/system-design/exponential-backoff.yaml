term: exponential backoff
aka:
  - backoff
  - exponential retry delay
short: Waiting longer before each new attempt, usually doubling the pause, up to a fixed cap.
explain: |
  A server is overloaded and your call fails. Retrying at once adds load at the worst
  moment. Retrying every second is barely better.

  So the wait grows: half a second, then one, then two, then four. The struggling server
  gets more room each time. A cap stops the wait growing without limit, and a maximum
  number of tries stops it for good.

  On its own it still lines clients up, since they all double in step. Add jitter to
  spread them out. If the server sends `Retry-After`, wait that long instead.
analogy: Knocking on a door, then waiting a little longer before each knock, so you don't pester whoever's inside.
example:
  language: js
  code: |
    function backoffMs(attempt, base = 500, cap = 30_000) {
      return Math.min(cap, base * 2 ** attempt);
    }
usage: Use exponential backoff on the 429s, capped at thirty seconds, and honour Retry-After.
related:
  - retry
  - jitter
  - retry-after
  - transient-error
level: 2
