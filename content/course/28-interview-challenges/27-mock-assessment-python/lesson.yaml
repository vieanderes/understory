    note: The min-heap behind task 3, with `heappush`, `heapreplace` and `heap[0]` as the smallest item.
    primary: true
    verified: true
  - kind: docs
    title: "sys: setrecursionlimit"
    authors: Python Software Foundation
    venue: The Python Standard Library
    url: https://docs.python.org/3/library/sys.html#sys.setrecursionlimit
    note: The recursion limit and why raising it can crash the interpreter.
    verified: true

deepDive: |-
  **Python in online assessments.** Most assessment platforms offer Python 3, and this mock runs
  CPython 3.13 in WebAssembly, at about half native speed. On the platform the function is
  usually called `solution`. The names here are descriptive so the three tasks read
  apart.

  **Task 1, distinct magnitudes.** `len({abs(value) for value in A})` is the whole answer:
  O(N) time on average and O(N) space. The brute force keeps a list and checks `in`
  before each append. It reads naturally and is correct, but each check scans the list,
  so 100,000 different readings cost about 5 billion comparisons. The traps are zero, a
  value with its negative, and -2,147,483,648, whose magnitude is one more than the
  largest positive value. Python handles that without a thought. In Java or C it
  overflows.

  **Task 2, two-item bundles.** Sort, then walk two pointers inward. If the smallest and
  largest remaining prices fit, the smallest fits with every price between them, so add
  `right - left` and move `left`. Otherwise the largest fits with nothing left, so move
  `right`. Sorting costs O(N log N) and the walk O(N). The brute force tries every pair,
  O(N²), about 5 billion checks at the maximum size. The traps: an item is never paired
  with itself, a sum equal to K counts, and 100,000 equal prices give 4,999,950,000
  bundles. Python's `int` holds that exactly, so there is no overflow to guard.

  **Task 3, rooms with cleaning.** Add C to every end, then it's the classic meeting
  rooms problem. Sort by start. A min-heap holds the minute each room is free again. For
  each booking, if `heap[0]` is free by its start, `heapreplace` reuses that room.
  Otherwise `heappush` opens a new one. The heap's length is the answer. Sorting is
  O(N log N) and each heap step O(log N). An equivalent sweep sorts all start and
  free-again events and tracks the running count, with frees before starts on ties.

  The brute force counts, for each start, the bookings that cover it: O(N²). Two tempting
  Python shortcuts are also slow: keeping free times in a list and calling `sorted()`
  per booking, or taking the earliest with `pop(0)`. The traps: a gap exactly C long is
  enough, identical bookings each need a room, and the input arrives unsorted.

  **Recursion.** None of these tasks needs it, but a recursive merge sort or depth-first
  search on 100,000 items stops at CPython's default limit of 1,000 frames.
  `sys.setrecursionlimit` can raise it, but the C stack may still overflow and crash the
  run. On a timed test, write the loop.
