term: rollback
aka: [ roll back, rolling back, revert a deploy ]
short: Undoing a release by putting the previous working version back into production.
explain: |
  A release goes out and errors spike. The fastest way to stop the harm usually isn't finding
  the bug. It's returning to what worked an hour ago.

  If every build is an immutable artefact, this means redeploying the previous one, which
  takes minutes. The trap is the database. If the release changed the schema so the old code
  can't read it, going back breaks too. So migrations ship ahead of the code that needs them
  and stay compatible with the version still running.
analogy: The undo button. It only works if you haven't thrown away the version before.
example:
  language: bash
  code: |
    # put the last good image back
    deploy --image shop-api:1.4.1
usage: Roll back first and debug after; the rollback takes three minutes and the fix could take hours.
related: [ build-artefact, blue-green-deployment, canary-release, migration, feature-flag ]
level: 1
lessons: [ cloud.releases ]
