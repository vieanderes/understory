id: algo.heaps-and-top-k
title: Heaps and top k
objective: Picture a binary heap as an array, keep the top k items in O(n log k), and use a heap library such as Python's heapq.
level: advanced
minutes: 10
concepts: [algo.binary-heap, algo.top-k]
prerequisites: [algo.bfs-and-dfs, cs.trees]
opening:
  text: >-
    You'll answer "the best k" questions without sorting everything: the top scores, the
    busiest pages, the nearest stores. A small heap does it in one pass.

steps:
  - type: prose
    id: picture-heap
    body: |-
      A **min-heap** hands you its smallest item, fast. It's a tree stored in an array: the
      item at index `i` has children at `2i + 1` and `2i + 2`. Every parent is no bigger
      than its children, so the smallest sits at index 0.

      Signals: "top k", "k closest", "the best so far in a stream".

      For small lists, sort. A heap pays off when n is huge and k small.

  - type: multiple-choice
    id: spot-heap-signal
    concept: algo.top-k
    difficulty: 1
    question: Which task wants a heap?
    choices:
      - text: Keep the 10 slowest requests from a live log
        correct: true
        feedback: >-
          Yes. "Best k" from a stream: a heap of 10 holds them.
      - text: Find two prices that add up to a budget
        feedback: >-
          A pair that sums to a target is a map lookup.
      - text: Merge overlapping bookings
        feedback: >-
          Overlaps want a sort by start and one pass.
      - text: Find the first failing build
        feedback: >-
          A check that flips once wants binary search.

  - type: prose
    id: heap-pop
    body: |-
      **Push**: add the item at the end, then swap it up while it's smaller than its parent.

      **Pop**: take the root, move the last item into its place, then **sift down**: swap it
      with its smaller child until neither child is smaller.

      The tree is about log n levels deep, so both cost O(log n). JavaScript has no heap
      built in; Python has `heapq`.

  - type: prose
    id: why-min-heap
    body: |-
      A min-heap for the largest items feels backwards. Here's why it works.

      Keep at most k items. Push each new score. When the heap holds k + 1, pop the root:
      the smallest, so the weakest candidate leaves. Each score costs O(log k), so the whole
      pass is O(n log k). With k = 10, that's close to O(n). It works on a stream, too.

  - type: ai-review
    id: review-priority-queue
    concept: algo.top-k
    difficulty: 3
    language: js
    request: Write a function that returns the k highest scores.
    flawClass: hallucinated-api
    code: |
      function topScores(scores, k) {
        const heap = new PriorityQueue((a, b) => a - b);
        for (const score of scores) {
          heap.push(score);
          if (heap.size() > k) heap.pop();
        }
        return heap.toArray();
      }
    prompt: >-
      An assistant wrote this. The logic is exactly right, and it passed in a coding site's
      editor. In Node it stops at once. Tap the line at fault.
    lines: [2]
    reasons:
      - text: JavaScript has no built-in `PriorityQueue`
        correct: true
        feedback: >-
          Right. Node throws `ReferenceError: PriorityQueue is not defined`. You write the heap.
      - text: The comparator should be `b - a`
        feedback: >-
          For keeping the highest, the root must be the smallest. `a - b` is right.
      - text: It should pop before it pushes
        feedback: >-
          Pushing first lets the new score compete. The order is fine. The class isn't real.
    fix: |
      // No heap in the standard library: write push and pop over an array,
      // or import a package you've checked exists.

  - type: code-challenge
    id: write-top-k-frequent
    concept: algo.top-k
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: frequent.starter.py
      solution: frequent.solution.py
      tests: frequent.tests.py
    prompt: >-
      A search page shows the `k` most searched words. The starter gives you a `MinHeap`
      with `push`, `pop`, `peek` and `size`. Write `topKFrequent(words, k)`: most used first,
      ties alphabetical, so `apple` before `fig`.


      `topKFrequent(['tea', 'milk', 'tea'], 1)` is `['tea']`. An empty list, or `k` of `0`,
      gives `[]`.


      **Target:** O(n + m log k) for 200,000 searches of m distinct words. The tests include
      ties, `k` bigger than m, and a full-size run.
    hints:
      - Two patterns meet here. Count first, then choose the best k.
      - 'A `Map` counts in one pass. Build the heap with a `less` that puts the weakest word at the root: fewer uses, or later in the alphabet.'
      - 'Push each word; when `size` passes `k`, pop. At the end pop everything and reverse.'

  - type: prose
    id: bucket-by-count
    body: >-
      For "the k most frequent", there's an O(n) way with no heap. Count each item first.
      No count can pass n, so make n + 1 empty lists, called **buckets**.


      Put each item in the bucket for its count: seen 3 times, bucket 3. Then walk from the
      top bucket down until you have k items. No sorting at all.

  - type: ai-review
    id: review-shared-buckets
    concept: algo.top-k
    difficulty: 3
    language: js
    request: Return the k most frequent numbers in O(n), with buckets by count.
    flawClass: logic
    code: |
      function topKFrequent(nums, k) {
        const count = new Map();
        for (const n of nums) count.set(n, (count.get(n) ?? 0) + 1);
        const buckets = new Array(nums.length + 1).fill([]);
        for (const [n, times] of count) buckets[times].push(n);
        const result = [];
        for (let times = nums.length; times > 0 && result.length < k; times--) {
          for (const n of buckets[times]) if (result.length < k) result.push(n);
        }
        return result;
      }
    prompt: >-
      An assistant wrote this. `topKFrequent([1, 1, 1, 2, 2, 3], 2)` gives `[1, 2]`, as
      expected. But `topKFrequent([5, 7, 7, 7], 1)` gives `[5]`. Tap the line at fault.
    lines: [4]
    reasons:
      - text: Every bucket is the same array
        correct: true
        feedback: >-
          Yes. `fill` puts one array in every slot, so all numbers land together.
      - text: The loop should start at `nums.length - 1`
        feedback: >-
          A count can equal the length: `[4, 4, 4]` has one number seen 3 times.
      - text: A `Map` doesn't keep its keys in order
        feedback: >-
          A `Map` keeps insertion order. The trouble is that the buckets aren't separate.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A rare number listed before a common one
          correct: true
          feedback: >-
            Yes. The shared array keeps listing order, so the rare one comes out first.
        - text: Every number appearing exactly once
          feedback: >-
            All counts tie, so any k numbers are right. The shared array goes unnoticed.
        - text: The most common number listed first
          feedback: >-
            Listing order then matches frequency by luck, so it passes like the first test.
    fix: |
      // Array.from calls the function once per slot: a new empty array each time.
      const buckets = Array.from({ length: nums.length + 1 }, () => []);

  - type: code-challenge
    id: write-k-closest
    concept: algo.binary-heap
    difficulty: 4
    language: python
    starter: closest.starter.py
    solution: closest.solution.py
    tests: closest.tests.py
    prompt: >-
      Now in Python, with `heapq`. A map app lists the `k` stores nearest to you at
      `(0, 0)`. Write `k_closest(stores, k)`: the indexes of the `k` nearest `(x, y)`
      stores, nearest first, ties by lower index.


      `k_closest([(3, 4), (1, 1), (-2, 0), (5, 5)], 2)` is `[1, 2]`.


      **Target:** O(n log k) for 200,000 stores and `k` up to 1,000. `heapq` is a min-heap
      only, so to evict the farthest, push negated keys.
    hints:
      - Compare `x * x + y * y`. The square root never changes the order, so skip it.
      - 'Keep a heap of at most `k` entries `(-distance, -index)`. Its root is then the farthest, highest index.'
      - '`heapq.heappush`, and `heapq.heappop` when `len(heap) > k`. Finally sort what''s left by `(distance, index)`.'

  - type: explain-back
    id: explain-min-heap-for-max
    concept: algo.top-k
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      The interviewer asks why you kept the 10 highest scores in a min-heap instead of
      sorting. Defend it.
    rubric:
      - The min-heap root is the weakest of the current top 10, the only one to evict.
      - Each score costs O(log k), so O(n log k) time and O(k) memory, against O(n log n) to sort.
      - Sorting is simpler and fine for a small list; the heap wins on big inputs or a stream.
    modelAnswer: >-
      Sorting is the simple baseline, and for a small list I'd take it. The heap wins when n
      is large or scores arrive as a stream. It holds only the best 10 so far. A min-heap keeps the weakest of them at the root, the one to throw out. Each score is a
      push and maybe a pop, O(log k). So it's O(n log k) time and O(k) memory, against O(n
      log n) to sort.

recap:
  - Picture a heap as an array with children at `2i + 1` and `2i + 2`.
  - Keep the top k in a min-heap of size k, or in buckets by count for the most frequent.
  - Use `heapq` in Python, negating keys when you need the largest at the root.
recall:
  - id: card-sift-down
    concept: algo.binary-heap
    front: How do you remove the smallest item from an array min-heap?
    back: >-
      Take the root, move the last item into its place, then swap it with its smaller child
      until neither child is smaller.
  - id: card-top-k-cost
    concept: algo.top-k
    front: What does finding the top k of n items with a size-k heap cost?
    back: >-
      O(n log k) time and O(k) memory, against O(n log n) to sort everything.
  - id: card-top-k-heap-kind
    concept: algo.top-k
    front: For the k largest items, which kind of heap do you keep, and why?
    back: >-
      A min-heap, because its root is the weakest candidate, the one to evict.
  - id: card-heapq-max
    concept: algo.binary-heap
    front: Python's `heapq` is a min-heap. How do you keep the k smallest distances with it?
    back: >-
      Push negated distances, so the root is the largest. Pop whenever the heap holds more
      than k.
  - id: card-shared-buckets
    concept: algo.top-k
    front: Why does `new Array(n).fill([])` break bucket counting?
    back: >-
      `fill` puts the same array in every slot, so every push lands in one list. Use
      `Array.from({ length: n }, () => [])`.

