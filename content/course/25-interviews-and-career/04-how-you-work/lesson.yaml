id: career.how-you-work
title: How you work with AI
objective: Answer how you use AI tools, what you'd need to ramp up on, and what's changed lately, each backed by your own work.
level: essential
minutes: 9
concepts: [career.ai-tools-answer, career.ramp-up-plan, career.staying-current]
prerequisites: [career.behavioural-stories]
opening:
  text: >-
    You'll answer the three questions every AI engineering loop asks about how you work. Each
    one turns into a point in your favour when you back it with something you did.

steps:
  - type: prose
    id: three-questions
    body: |-
      Somewhere in the loop, someone asks how you work. Three questions come up again and
      again.

      - How do you use AI coding tools?
      - What would you need to ramp up on here?
      - What's changed lately in AI engineering?

      Each wants evidence from your own work, not an opinion you read.

  - type: prose
    id: ai-tools
    body: |-
      A good answer on **AI tools** has three parts.

      What you hand over: boilerplate, a first draft of tests, exploring an unfamiliar API.
      How you check it: tests you trust, type checks, reading every diff. And who owns the
      result: you do, including correctness and design.

  - type: multiple-choice
    id: pick-ai-answer
    concept: career.ai-tools-answer
    difficulty: 1
    question: They ask how you use AI coding tools. Which answer sounds strongest?
    choices:
      - text: '"For drafts and exploring. Tests and review gate everything."'
        correct: true
        feedback: >-
          Yes. A clear use, a checking loop, and ownership.
      - text: '"I let the agent write most of it now."'
        feedback: >-
          It suggests nothing checks the output. They want to hear how you keep quality.
      - text: '"I avoid them, they make mistakes."'
        feedback: >-
          Most teams use them now. Saying how you catch the mistakes is far stronger.

  - type: ai-review
    id: review-ai-tools-answer
    concept: career.ai-tools-answer
    difficulty: 3
    language: yaml
    request: Draft a sample answer to "How do you use AI coding tools?"
    flawClass: logic
    code: |
      hand-over: first drafts of handlers, tests and migrations
      check: I merge when the tests the agent wrote for it pass
      check: I read every diff before it goes to review
      own: design and correctness stay mine
    prompt: >-
      A sample to review, not a script to learn. A careful interviewer would push on one
      line. Tap it.
    lines: [2]
    reasons:
      - text: The code grades its own homework
        correct: true
        feedback: >-
          Yes. Tests from the same agent share its mistakes. Write or check the tests yourself.
      - text: Reading every diff is too slow
        feedback: >-
          It's the habit that catches what tests miss. Interviewers want to hear it.
      - text: Migrations shouldn't be drafted by a tool
        feedback: >-
          A draft is fine when you review it. The weak spot is how it's checked.
    fix: |
      hand-over: first drafts of handlers, tests and migrations
      check: I write the key test cases myself, then let the agent fill the rest
      check: I read every diff before it goes to review
      own: design and correctness stay mine

  - type: prose
    id: ramp-up
    body: |-
      "What would you need to ramp up on?" Saying "nothing" sounds like you haven't looked
      at their stack.

      A strong **ramp-up plan** names one real gap and what carries over from your past.
      Then it says how you'd close the gap in about a week. It shows you know yourself, and that you learn on
      purpose.

  - type: ai-review
    id: review-ramp-up-answer
    concept: career.ramp-up-plan
    difficulty: 2
    language: yaml
    request: Draft a sample ramp-up answer. Their team runs on Kubernetes.
    flawClass: logic
    code: |
      gap: I've mostly deployed to a managed platform, not Kubernetes
      carries-over: containers, health checks and gradual rollouts
      plan: I'd read up on it when I get a chance
    prompt: >-
      A sample to review, not a script to learn. Two lines are strong. Tap the one that
      loses the point.
    lines: [3]
    reasons:
      - text: It has no concrete plan or deadline
        correct: true
        feedback: >-
          Right. Name the step and the week, and it becomes a strength.
      - text: Admitting the gap looks weak
        feedback: >-
          Honesty with a plan beats a bluff a follow-up would expose.
      - text: Nothing really carries over
        feedback: >-
          The ideas do transfer. Saying so shows you'll be useful fast.
    fix: |
      gap: I've mostly deployed to a managed platform, not Kubernetes
      carries-over: containers, health checks and gradual rollouts
      plan: in week one I'd pair on two deploys and run one myself

  - type: prose
    id: whats-changed
    body: |-
      "What's changed lately?" tests whether you keep up, and whether you think for
      yourself.

      Pick one change you've **used**, not read about. Say what it changed in your work,
      and one catch it brought. A list of tool names dates within months and proves
      nothing.

  - type: parsons
    id: order-trend-answer
    concept: career.staying-current
    difficulty: 2
    prompt: Put the beats of an answer to "What's changed lately?" in order.
    language: yaml
    blocks:
      - id: change
        code: 'change: one change you have used yourself'
        subgoal: The change
      - id: used
        code: 'used: what you built or changed with it'
        subgoal: What you did
      - id: result
        code: 'result: what it changed in your work'
      - id: catch
        code: 'catch: the risk it brought, and how you handle it'
        subgoal: The catch
    distractors:
      - id: tool-list
        code: 'list: the names of five new frameworks'
        feedback: >-
          Names date fast and show no judgement. One change you used says more.

  - type: explain-back
    id: explain-ai-example
    concept: career.ai-tools-answer
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      An interviewer asks how you check what AI tools write. Describe one time your tests or
      your review caught a mistake an AI tool made. Keep it to four sentences.
    rubric:
      - It names what you asked the tool for, briefly.
      - It says what was wrong and what caught it.
      - It ends with what you changed in how you work.
    modelAnswer: >-
      Your example is yours, so check its shape, not its words. One sentence says what the
      tool was asked for, such as pagination for a list endpoint. One says what was wrong
      and which of your checks caught it. One says how you fixed it. The last names the
      habit you changed, such as writing edge-case tests first.

recap:
  - Say what you hand to AI tools, how you check it, and that you own the result.
  - Name one ramp-up gap, what carries over, and a one-week plan.
  - Answer "what's changed" with one change you used and its catch.
recall:
  - id: card-ai-answer
    concept: career.ai-tools-answer
    front: What three things should an answer about AI coding tools cover?
    back: >-
      What you hand over, how you check its output, and that you own the result.
  - id: card-own-tests
    concept: career.ai-tools-answer
    front: Why aren't tests written by the same agent enough to trust its code?
    back: >-
      They share its misunderstanding, so they can pass while the code is wrong.
  - id: card-ramp-up
    concept: career.ramp-up-plan
    front: What makes a strong answer to "what would you need to ramp up on"?
    back: >-
      One real gap, what carries over, and how you'd close it in about a week.
  - id: card-whats-changed
    concept: career.staying-current
    front: How do you answer "what's changed lately in AI engineering"?
    back: >-
      One change you've used, what it changed in your work, and the catch it brought.

references:
  - kind: docs
    title: State of AI-assisted Software Development 2025
    authors: DORA
    venue: Google Cloud
    url: https://dora.dev/research/2025/dora-report/
    note: Research on how teams use AI tools and what makes that use work.
    primary: true
    verified: true
  - kind: docs
    title: Guidance on Candidates' AI Usage
    authors: Anthropic
    venue: Anthropic
    url: https://www.anthropic.com/candidate-ai-guidance
    note: One employer's rules for when AI tools are and aren't welcome in its process.
    verified: true

deepDive: >-
  Have two AI examples ready: one where a tool saved real time, and one where your checks
  caught its mistake. The second is the stronger one, because it proves the checking loop
  exists. The AI systems chapter covers the practice in its lesson on engineering with
  coding agents.


  For "what's changed", keep a short running note of changes you've tried at work or on a
  side project, with one line on what happened. Before an interview, pick the one closest
  to their product. Good candidates in 2026 include models calling tools, longer context
  windows, evals run in CI, and cheaper small models for routing. Expect the list to be
  different a year from now; the shape of the answer won't be.


  The ramp-up question also works in reverse. Ask them what new starters usually find
  hardest in the first month. Their answer tells you what to study before you start.
