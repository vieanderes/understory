term: access pattern
aka: [access patterns, query pattern, read pattern]
short: The specific reads and writes an application makes, with how often and how fast each must be.
explain: |
  "Fetch a user's last 20 orders, newest first, 500 times a second." That sentence decides
  more about a data store than any opinion about technology does.

  List the patterns before picking a store or an index. Each store makes some patterns
  cheap and others costly. Picking a store before knowing them is guessing.
analogy: Arranging a kitchen by what you cook every day, not by what looks tidy.
usage: Write the access patterns down first; then we'll see whether we need anything beyond Postgres.
related: [nosql, index, relational-database, denormalisation]
level: 2
lessons: [sysdesign.sql-or-nosql]
