    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API
    note: The browser `WebSocket` object and when to reach for it.
    verified: true

deepDive: >-
  The stream above comes from a handler that returns `new Response(stream, { headers:
  { "Content-Type": "text/event-stream" } })`, where `stream` is a `ReadableStream`. Its
  `start(controller)` calls `controller.enqueue(text)` for each event and
  `controller.close()` at the end. Measured with Node's own `EventSource`: after the stream
  ended, it reconnected about three seconds later and streamed the answer again.


  `EventSource` can only send a `GET`. A chat that posts a prompt uses `fetch` with a
  `POST` and reads `response.body` chunk by chunk instead, parsing the `data:` lines itself.
  Model SDKs do exactly that for you.


  Long polling is the middle way: the server holds each request open until there's news,
  then answers, and the client asks again at once. One request per change, but a new
  connection each time.


  A WebSocket starts life as an HTTP request with `Upgrade: websocket`. The server answers
  `101 Switching Protocols`, and from then on the connection carries WebSocket frames, not
  HTTP. Proxies and load balancers must be told to allow that, which is one reason SSE,
  plain HTTP all the way, is often the easier choice.
