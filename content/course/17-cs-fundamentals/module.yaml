id: cs
number: 17
title: CS fundamentals
summary: "The ideas under every other chapter: cost, data structures, representation and the machine. These lessons are scheduled between the other modules, not as a block."
why: "These ideas explain why code is fast, slow or wrong."
youCanBuild: "Five complexity analyses of real code, written up as notes."
concepts:
  - id: cs.process
    title: Program and process
    summary: A program is a file on disk, and a process is that program loaded into memory and running.
  - id: cs.memory-hierarchy
    title: CPU, memory and storage
    summary: The CPU works on data in memory, which is fast and temporary, while storage is slow and lasting.
  - id: cs.counting-operations
    title: Counting operations
    summary: The cost of code is found by counting how often its innermost step runs as a function of the input size.
  - id: cs.big-o
    title: Big-O notation
    summary: Big-O gives an upper bound on how running time or memory grows with input size, ignoring constant factors and lower-order terms.
  - id: cs.growth-rates
    title: Common growth rates
    summary: Constant, logarithmic, linear, linearithmic, quadratic and exponential growth, in order from cheapest to most costly.
  - id: cs.arrays-and-linked-lists
    title: Arrays and linked lists
    summary: An array gives constant-time access by index and costly insertion in the middle, and a linked list gives the reverse.
  - id: cs.hash-maps
    title: Hash maps
    summary: A hash function maps a key to a bucket, which gives insertion and lookup in constant time on average.
  - id: cs.collisions
    title: Hash collisions
    summary: Two keys that land in one bucket are kept apart by chaining or probing, and many collisions turn constant time into linear time.
  - id: cs.map-and-object
    title: Map and plain objects
    summary: "`Map` accepts any key type, keeps insertion order, reports its size and has no inherited keys, unlike a plain object."
  - id: cs.recursion
    title: Recursion
    summary: A recursive function solves a problem by calling itself on a smaller input until it reaches a base case.
  - id: cs.call-stack
    title: The call stack
    summary: Each call pushes a frame that holds its locals and return address, and unbounded recursion overflows the stack.
  - id: cs.recursion-to-iteration
    title: Recursion to iteration
    summary: Any recursion can be rewritten as a loop with an explicit stack, which removes the limit on depth.
  - id: cs.binary-search
    title: Binary search
    summary: Halving a sorted range at each step finds a value in logarithmic time, and its invariant is that the target, if present, lies inside the range.
  - id: cs.comparison-sorts
    title: Comparison sorts
    summary: A comparison sort cannot beat O(n log n) comparisons in the worst case, which merge sort achieves and quicksort achieves on average.
  - id: cs.sort-stability
    title: Sort stability
    summary: A stable sort keeps elements with equal keys in their original order, which `Array.prototype.sort` has guaranteed since ES2019.
  - id: cs.binary-integers
    title: Bits and integers
    summary: An n-bit integer holds 2 to the power n values, and two's complement gives the top bit a negative weight.
  - id: cs.floating-point
    title: Floating point
    summary: An IEEE 754 double stores a sign, an exponent and a 53-bit significand, so most decimal fractions, such as 0.1, are rounded.
  - id: cs.money
    title: Representing money
    summary: Money is kept as an integer count of minor units or as a decimal type, since binary floating point cannot hold most decimal fractions exactly.
  - id: cs.unicode
    title: Unicode and UTF-8
    summary: Unicode assigns a code point to each character, and UTF-8 encodes a code point as one to four bytes.
  - id: cs.binary-search-trees
    title: Binary search trees
    summary: A balanced binary search tree keeps keys ordered and gives logarithmic search, insertion and deletion.
    confusableWith: [cs.b-trees]
  - id: cs.heaps
    title: Heaps
    summary: A binary heap keeps the smallest or largest item at the root, with logarithmic insertion and removal, and implements a priority queue.
    confusableWith: [cs.stack-and-heap]
  - id: cs.b-trees
    title: B-trees
    summary: A B-tree node holds many keys and children, sized to a disk page, so the tree stays a few levels deep and each lookup reads few pages.
    confusableWith: [cs.binary-search-trees]
  - id: cs.graphs
    title: Graphs
    summary: A graph is a set of nodes and the edges between them, stored as adjacency lists or a matrix.
  - id: cs.graph-traversal
    title: Breadth-first and depth-first search
    summary: Breadth-first search visits nodes in order of distance using a queue, and depth-first search follows one path to its end using a stack.
  - id: cs.topological-order
    title: Topological order
    summary: An ordering of a directed acyclic graph where every node comes after the nodes it depends on, which is how builds and installs are ordered.
  - id: cs.stack-and-heap
    title: Stack and heap memory
    summary: The stack holds call frames and is freed on return, and the heap holds objects whose lifetime is not tied to one call.
    confusableWith: [cs.heaps]
  - id: cs.garbage-collection
    title: Garbage collection
    summary: A tracing collector frees objects that are unreachable from the roots, and a generational one collects young objects more often.
  - id: cs.jit
    title: Interpreters and JIT compilation
    summary: V8 first runs bytecode in its Ignition interpreter and compiles hot functions to machine code, deoptimising when its type assumptions fail.
  - id: cs.processes
    title: Processes
    summary: A process is a running program with its own address space, its own file descriptors and at least one thread.
    confusableWith: [cs.threads]
  - id: cs.threads
    title: Threads
    summary: A thread is a path of execution inside a process that shares the process's memory with its other threads.
    confusableWith: [cs.processes]
  - id: cs.file-descriptors
    title: File descriptors
    summary: A small integer by which a process refers to an open file, socket or pipe, limited in number per process.
  - id: cs.transport-protocols
    title: TCP, QUIC and the TLS handshake
    summary: TCP delivers an ordered byte stream and completes its handshake before TLS adds another, while QUIC runs over UDP and combines both handshakes.
