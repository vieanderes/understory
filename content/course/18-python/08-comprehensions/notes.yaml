summary: >-
  A comprehension builds a new list, dict or set from any iterable in one expression:
  `[p for p in prices if p < 6]`. It replaces the "make an empty list, loop, append" shape
  with something you read left to right: what to keep, where it comes from, which items
  pass. It's the Python counterpart to JavaScript's `filter` and `map` chains, without the
  callbacks.


  Underneath every `for` loop, comprehension, `sum`, `zip` and `enumerate` sits one small
  protocol: ask an object for an iterator, then ask the iterator for the next item until it
  says it's done. Understanding that protocol explains most of this lesson's surprises.
  Generators are iterators that make each item only when asked, which is why a generator
  expression inside `sum` or `any` holds one value at a time and can stop early, and why it
  can be walked only once.


  Reach for a comprehension when you're transforming or filtering into a new collection.
  Reach for a generator expression when the result goes straight into a function that
  consumes it. Use a plain loop when the body has side effects, several outputs or error
  handling, or when a comprehension would need more than two `for` clauses to express.
remember:
  - A `for` loop calls `iter()` on the iterable, then `next()` on the iterator until it raises `StopIteration`; comprehensions, `sum`, `zip` and unpacking all use the same protocol.
  - A list comprehension builds the whole list at once, while a generator expression produces items lazily, one per request, and can be consumed only once.
  - Use a generator expression inside `sum`, `any`, `all`, `max`, `min` and `"".join`, because nothing needs the intermediate list and `any` and `all` stop early.
  - Never add or remove items in a collection you're looping over; build a new one, or loop over a copy.
  - '`zip` stops at the shortest input without an error; pass `strict=True` when the inputs must line up.'
  - A filter goes at the end, `[x for x in xs if ok(x)]`, while a choice between two values goes at the front, `[a if ok(x) else b for x in xs]`.
  - A comprehension has its own scope, so its loop variable doesn't leak, unlike a plain `for` loop's.
  - In Python 3, `map`, `filter`, `zip` and `enumerate` return lazy iterators, not lists, unlike JavaScript's eager `Array.prototype.map`.
sections:
  - title: The iteration protocol underneath
    body: |-
      An **iterable** is anything you can loop over: a list, a string, a dict, a file, a
      `range`. An **iterator** is the object that does the walking and remembers the
      position. `iter(iterable)` gives you a fresh iterator, and `next(iterator)` gives the
      next item or raises `StopIteration` when there's nothing left. A `for` loop is those
      two calls in disguise:

      ```python
      tasks = ["write", "review", "ship"]

      walker = iter(tasks)
      print(next(walker))  # write
      print(next(walker))  # review

      walker = iter(tasks)
      while True:
          try:
              task = next(walker)
          except StopIteration:
              break
          print(task)
      # write
      # review
      # ship

      numbers = iter([1, 2, 3, 4])
      print(3 in numbers)   # True
      print(list(numbers))  # [4]
      ```

      A list is an iterable, not an iterator: each `for` over it calls `iter` again and
      starts from the beginning. An iterator returns itself from `iter`, so once it's
      exhausted it stays exhausted. The last example shows the consequence: `in` walked the
      iterator up to `3` and consumed everything before it, so only `4` was left.

      JavaScript has the same design with different spelling. An iterable has a
      `[Symbol.iterator]()` method, and the iterator's `next()` returns
      `{ value, done }`. Python signals the end with an exception instead of a `done` flag.
      JS generator functions, `function*` with `yield`, correspond to Python functions that
      contain `yield`.

      Many built-ins return iterators rather than lists: `map`, `filter`, `zip`,
      `enumerate` and `reversed`. That's cheap and composable,
      but it means `print(map(str.upper, tags))` shows `<map object at ...>` rather than the
      data. Wrap it in `list()` when you need the values more than once.
  - title: Comprehension shapes, and when a loop is better
    body: |-
      All three collections have a comprehension, and a generator expression uses round
      brackets:

      ```python
      prices = {"tea": 3, "cake": 7, "scone": 4}

      cheap = [name for name, price in prices.items() if price < 5]
      labels = ["cheap" if price < 5 else "treat" for price in prices.values()]
      with_tax = {name: round(price * 1.2, 2) for name, price in prices.items()}
      first_letters = {name[0] for name in prices}
      grid = [[1, 2], [3, 4]]
      flat = [cell for row in grid for cell in row]

      print(cheap)                  # ['tea', 'scone']
      print(labels)                 # ['cheap', 'treat', 'cheap']
      print(with_tax)               # {'tea': 3.6, 'cake': 8.4, 'scone': 4.8}
      print(sorted(first_letters))  # ['c', 's', 't']
      print(flat)                   # [1, 2, 3, 4]
      ```

      Two positions for `if` confuse people. A trailing `if` is a **filter**: it decides
      whether an item appears at all. An `a if cond else b` at the front is a
      **conditional expression**: every item appears, as one value or the other. Writing
      `[x for x in xs if x else 0]` is a `SyntaxError`. Nested `for` clauses read in the
      same order as nested loops, outer first.

      Compared with `map` and `filter`, a comprehension needs no lambda and reads in one
      direction, so it's the idiomatic choice. `map(str.strip, lines)` is fine when a named
      function already exists. Compared with JavaScript, `items.filter(f).map(g)` builds an
      intermediate array at each step, whereas a single comprehension or generator
      expression does the filter and the transform in one pass.

      Use a plain loop when the body does something rather than computes something:
      writing to a database, printing, appending to two lists, or catching an exception per
      item. `[print(x) for x in xs]` builds a list of `None` values that nobody wants. Past
      two `for` clauses or one condition, a loop with good names is clearer too.
  - title: Generators and laziness
    body: |-
      A generator expression doesn't compute anything when it's created. It runs one step
      each time something calls `next` on it. You can see the interleaving:

      ```python
      import sys


      def score(answer):
          print(f"scoring {answer}")
          return len(answer)


      answers = ["yes", "no", "maybe", "never"]
      scores = (score(a) for a in answers)
      print("nothing scored yet")
      print(any(s > 4 for s in scores))
      print(list(scores))
      # nothing scored yet
      # scoring yes
      # scoring no
      # scoring maybe
      # True
      # scoring never
      # [5]

      big_list = [n for n in range(1_000_000)]
      big_gen = (n for n in range(1_000_000))
      print(sys.getsizeof(big_list) > 8_000_000)  # True
      print(sys.getsizeof(big_gen) < 500)         # True
      ```

      `any` pulled three scores, found `5 > 4` and stopped, so `"never"` wasn't scored until
      `list` asked for the rest. The generator then gave only what was left. A list of a
      million numbers holds a million references, several megabytes, while the generator
      object stays a couple of hundred bytes whatever its length.

      Laziness lets you chain steps into a **pipeline** that never materialises a full
      list: read lines from a file, strip them, drop blanks, parse each one, and total the
      results, all in constant memory. `itertools` adds lazy building blocks such as
      `islice` (take the first n), `chain` (join iterables) and `batched` (Python 3.12,
      groups of n).

      The costs are real too. A generator can be consumed once. It has no `len()`, no
      indexing, and nothing to print. Debugging is harder, because nothing runs until
      something consumes it, and an exception inside surfaces at the consumer. If you need
      the data twice, need its length, or it's small, a list is the better choice. A
      function containing `yield` is a generator function, the multi-line version of the
      same idea, useful when the logic doesn't fit one expression.
  - title: Comprehension scope, and changing what you loop over
    body: |-
      A comprehension runs in its own scope. Its loop variable disappears afterwards, while a
      plain `for` loop's variable stays behind. Python 3.12 inlined comprehensions for speed
      (PEP 709) but kept that isolation. The walrus operator `:=` is the one exception: it
      binds in the enclosing scope, which is handy for computing a value once and both
      filtering on it and keeping it:

      ```python
      for i in range(3):
          pass
      print(i)  # 2

      squares = [n * n for n in range(3)]
      print("n" in dir())  # False

      readings = [3, 12, 7, 15]
      doubled_big = [d for r in readings if (d := r * 2) > 20]
      print(doubled_big, d)  # [24, 30] 30

      stock = {"tea": 0, "cake": 4, "scone": 0}
      try:
          for name in stock:
              if stock[name] == 0:
                  del stock[name]
      except RuntimeError as error:
          print(error)  # dictionary changed size during iteration

      stock = {"tea": 0, "cake": 4, "scone": 0}
      for name in list(stock):
          if stock[name] == 0:
              del stock[name]
      print(stock)  # {'cake': 4}

      inbox = ["hi", "", "", "done"]
      alias = inbox
      inbox[:] = [m for m in inbox if m]
      print(alias)  # ['hi', 'done']
      ```

      Changing a collection while you iterate it fails differently per type. A list skips
      items silently, as the lesson showed, because the iterator is only a position. A dict
      or set detects the change in size and raises `RuntimeError`. The safe patterns are to
      loop over a snapshot, `list(stock)`, or to build a new collection. When other code
      holds a reference to the same list and must see the change, assign to the full slice,
      `inbox[:] = ...`, which replaces the contents but keeps the list object.

      One scoping oddity: in a class body, a comprehension can't see the class's own
      variables, except in its first iterable, because class scope isn't visible to nested
      scopes. Compute such values in a method or at module level.
pitfalls:
  - '**Consuming a generator twice.** The second loop, `sum` or `list` gets nothing, with no error. Store the values with `list(...)` if you need them more than once, or re-create the generator.'
  - '**Calling `len()` on a generator or `map` object.** It raises `TypeError: object of type ''generator'' has no len()`. Count with `sum(1 for _ in items)`, or build a list when you need both the items and the length.'
  - '**Removing items from the list you are looping over.** The next item slides into the freed position and is skipped. Build a new list with a comprehension, or use `items[:] = [...]` to update it in place.'
  - '**Trusting `zip` with inputs that should match.** A missing prediction or label drops the tail silently and skews an eval. Check lengths, or use `zip(a, b, strict=True)` so a mismatch raises `ValueError`.'
  - '**Using a comprehension for side effects.** `[save(x) for x in xs]` builds a throwaway list of return values and hides the intent. Write a `for` loop.'
  - '**Building a list only to ask one question.** `len([o for o in orders if o > 100]) > 0` walks everything and stores the matches. `any(o > 100 for o in orders)` stops at the first match and stores nothing.'
  - '**Cramming logic into one line.** Three `for` clauses and two conditions are harder to review than the loop they replace. Split it into named steps or a plain loop.'
interview:
  - question: When would you use a list comprehension, and when a generator expression?
    answer: >-
      A list comprehension when I need the collection itself, a generator expression when
      the values go straight into a consumer. A list lets me index it, take its `len`,
      iterate it several times and print it, and it's often a little faster for small data. A
      generator yields items one at a time, so memory stays constant, and short-circuiting
      consumers like `any`, `all` or `next` can stop early without computing the rest. So
      `sum(len(line) for line in lines)` over a large file uses almost no memory, where the
      bracketed version holds every length first. The trade-offs are that a generator is
      single-use, has no length, and defers errors to whoever consumes it, which makes
      debugging harder.
  - question: What's the difference between an iterable and an iterator in Python?
    answer: >-
      An iterable can produce iterators, while an iterator is the stateful cursor that
      yields items. Formally, an iterable implements `__iter__` returning an iterator, and an
      iterator implements `__next__`, raising `StopIteration` at the end, and returns itself
      from `__iter__`. A list is iterable: every `for` loop gets a fresh iterator and starts
      from the beginning. A generator or a file object is its own iterator, so once it's
      exhausted, looping again gives nothing. That distinction explains bugs such as passing
      a generator to two functions and the second seeing nothing. JavaScript has the same
      split with `Symbol.iterator` and `next()` returning `{ value, done }`; Python signals
      the end with an exception instead of a flag.
  - question: Comprehension, `map` and `filter`, or a plain loop. How do you choose?
    answer: >-
      I default to a comprehension for building a new collection, use `map` when a named
      function already does the work, and use a loop when there are side effects. A
      comprehension reads left to right, needs no lambda, and filters and transforms in one
      pass. `map(str.strip, lines)` is equally clear, but `map(lambda x: x["id"], rows)` is
      worse than `[row["id"] for row in rows]`. In Python 3 `map` and `filter` are lazy, so
      they behave like generator expressions, not lists. A loop wins when the body writes to
      a database, appends to several outputs, catches exceptions per item, or would need
      nested conditions, because readability in review matters more than line count.
  - question: Why does removing items inside a `for` loop skip some, and how do you filter in place?
    answer: >-
      Because the list iterator tracks only an index. When you remove the current item,
      everything after it shifts left one place, and the next step of the iterator moves
      past the item that slid into the gap. With two matching items in a row, the second is
      never checked. Dicts and sets are stricter and raise `RuntimeError` if their size
      changes during iteration. The fix is to build a new list with a comprehension. If
      callers hold a reference to the original list and must see the change, assign to the
      full slice, `items[:] = [x for x in items if keep(x)]`, which replaces the contents
      of the same object. For dicts, iterate over `list(d)` when deleting keys.
terms:
  - term: List comprehension
    say: A shorter `for` loop.
    means: An expression that builds a new list from any iterable, with an optional filter at the end.
      It has its own scope, so its loop variable doesn't leak.
  - term: Generator expression
    say: A comprehension in round brackets.
    means: A lazy iterator that makes one item per request and can be walked only once. Inside `sum`,
      `any` or `''.join` it skips building a list, and `any` and `all` stop early.
  - term: Iterator
    say: Anything you can loop over.
    means: That's an iterable, which hands out an iterator through `iter()`. The iterator returns items
      through `next()` until it raises `StopIteration`, and is used up afterwards.
  - term: "`zip`"
    say: It pairs up two lists.
    means: It pairs items from any iterables lazily and stops at the shortest without an error. Pass
      `strict=True` when the lengths must match.
  - term: "`if` in a comprehension"
    say: The `if` always goes at the end.
    means: A filter goes at the end, `[x for x in xs if ok(x)]`. A choice between two values goes at the
      front, `[a if ok(x) else b for x in xs]`.
  - term: Removing while iterating
    say: Remove items inside the loop to filter in place.
    means: Each removal shifts later items left under the loop's position, so some are skipped. Build a
      new list, or assign a comprehension to `xs[:]`.
