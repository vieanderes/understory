id: cloud.kubernetes
title: "Kubernetes essentials"
objective: "Deploy a service with a Deployment, a Service and probes, set resource requests, and say when a managed platform is the better choice."
level: advanced
minutes: 10
concepts: [cloud.desired-state, cloud.k8s-workloads, cloud.k8s-services-and-ingress, cloud.k8s-probes-and-resources]
prerequisites: [cloud.compose, cloud.hosting-models]
opening:
  text: >-
    You'll run a service on Kubernetes and watch it heal itself and hold back a broken
    release. You'll also know when a team is better off without it.

steps:
  - type: prose
    id: what-kubernetes-is
    body: >-
      Compose runs containers on one machine. Big teams run hundreds of containers on dozens
      of machines. **Kubernetes** is a program that keeps those containers running, and moves
      them when a machine dies.


      The machines together are a **cluster**. Each machine is a **node**. You talk to the
      cluster with a command called **`kubectl`**. It's heavy machinery to run, which lesson
      13 weighed up.

  - type: prose
    id: name-desired-state
    body: |-
      You don't start containers yourself. You write down what you want:

      ```yaml
      kind: Deployment
      metadata: { name: web }
      spec:
        replicas: 3
        template:            # the Pod to copy
          spec:
            containers:
              - { name: web, image: nginx:1.29 }
      ```

      A **Pod** is one or more containers that run together. A **Deployment** asks for three
      of them. That's **desired state**: a controller keeps comparing it with what runs, and
      fixes the gap.

  - type: predict-output
    id: predict-deleted-pod
    concept: cloud.k8s-workloads
    difficulty: 1
    language: bash
    code: |
      $ kubectl get pods
      web-677884d894-pzwrd   1/1   Running   0   72s
      web-677884d894-rvxsq   1/1   Running   0   72s
      web-677884d894-tw974   1/1   Running   0   72s
      $ kubectl delete pod web-677884d894-pzwrd
      $ kubectl get pods
    question: The Deployment asks for 3 Pods. What does the last command show?
    choices:
      - text: Three Pods, one of them brand new
        correct: true
        feedback: >-
          Yes. We saw `web-677884d894-rwr4q`, 8 seconds old, beside the other two.
      - text: Two Pods, until someone starts another
        feedback: >-
          On a plain server, yes. Here the controller notices the gap and fills it.
      - text: Three Pods, the deleted one restarted
        feedback: >-
          Close. A deleted Pod is gone for good. A new one, with a new name, takes its place.

  - type: prose
    id: labels-and-services
    body: >-
      Each new Pod gets a new address, so nothing can call a Pod directly. A **label** is a
      tag on a Pod, such as `app: web`. A **selector** picks every Pod with that label.


      A **Service** uses a selector to give those Pods one stable name. It spreads requests
      across them, like the load balancer in lesson 7.

  - type: fill-blank
    id: fill-service
    concept: cloud.k8s-services-and-ingress
    difficulty: 2
    language: yaml
    prompt: >-
      Give the `web` Pods one stable address on port 80. Fill the gaps.
    template: |
      apiVersion: v1
      kind: {{1}}
      metadata:
        name: web
      spec:
        {{2}}: { app: web }
        ports:
          - port: 80
            targetPort: 80
    blanks:
      - key: '1'
        answer: Service
      - key: '2'
        answer: selector
    bank: [Service, Deployment, Pod, selector, replicas, image]

  - type: prose
    id: name-probes-and-resources
    body: |-
      Kubernetes asks your container three things.

      - **Readiness probe**: can you take traffic? If not, the Service skips you, so a broken release never gets users.
      - **Liveness probe**: are you stuck? If so, you're restarted.
      - **Requests and limits**: how much CPU and memory you need, and your cap. Over the memory cap, you're killed: `OOMKilled`.

  - type: ai-review
    id: review-liveness-database
    concept: cloud.k8s-probes-and-resources
    difficulty: 3
    language: yaml
    request: Add health probes to the orders service so broken Pods get fixed automatically.
    flawClass: logic
    code: |
      containers:
        - name: orders
          image: registry.example/orders:2.3.0
          resources:
            requests: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /health/database, port: 8080 }
            periodSeconds: 5
    prompt: >-
      This passed in a test cluster. Then the database was down for one minute, and every
      orders Pod restarted at once. Tap the line at fault.
    lines: [9]
    reasons:
      - text: Liveness checks the database, not this process
        correct: true
        feedback: >-
          Exactly. A restart can't fix the database. Liveness asks: is this process stuck?
      - text: '`periodSeconds: 5` is too short'
        feedback: >-
          A longer period only delays it. Any database outage still restarts every Pod.
      - text: The memory request is too small
        feedback: >-
          A small request changes where the Pod fits. It doesn't cause restarts during an outage.
    verify:
      question: 'Which test would have caught this?'
      choices:
        - text: 'Stop the test cluster''s database and watch for restarts'
          correct: true
          feedback: >-
            Yes. The outage triggers the flaw, so rehearse the outage.
        - text: 'Deploy and check every Pod becomes ready'
          feedback: >-
            That passed in the test cluster. The flaw only shows when the database fails.
        - text: 'Delete one Pod and check a new one starts'
          feedback: >-
            That tests the Deployment, not what liveness does in an outage.
    fix: |
      containers:
        - name: orders
          image: registry.example/orders:2.3.0
          resources:
            requests: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /live, port: 8080 }
            periodSeconds: 5

  - type: multiple-choice
    id: pick-managed-instead
    concept: cloud.desired-state
    difficulty: 2
    question: Three developers run one API, one worker and a database. Where should they run them?
    choices:
      - text: A managed platform that runs containers
        correct: true
        feedback: >-
          Right. They get the healing and rollouts without running a cluster.
      - text: Their own Kubernetes cluster
        feedback: >-
          It works, but upgrades, networking and certificates become a second job for three people.
      - text: One server, started by hand
        feedback: >-
          Nothing restarts a crash or rolls out a release. That trades one problem for another.

  - type: code-challenge
    id: write-reconcile
    concept: cloud.desired-state
    difficulty: 4
    language: ts
    prompt: >-
      Write the heart of a controller: `reconcile(desired, pods)` returns how many Pods to
      `start` and which to `remove`.


      A `Failed` Pod is always removed. `Pending` and `Running` Pods count as live. If there
      are too few live Pods, start the difference. If there are too many, remove the extras
      from the end of the list. List failed Pods first in `remove`.


      Example: `reconcile(3, [{ name: 'a', phase: 'Failed' }, { name: 'b', phase: 'Running' }])`
      gives `{ start: 2, remove: ['a'] }`.
    hints:
      - Split the list into failed Pods and live Pods first.
      - Extras are the live Pods after the first `desired` of them, and `slice` gives you those.
      - "`start` can't go below zero, so reach for `Math.max`."

  - type: explain-back
    id: explain-probe-roles
    concept: cloud.k8s-probes-and-resources
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      A new release fails its readiness probe, yet users notice nothing. Why, and what would
      a failing liveness probe do instead?
    rubric:
      - A Pod that isn't ready gets no traffic from the Service.
      - The rollout stops adding new Pods, so the old ones keep serving.
      - A failing liveness probe restarts the container instead of holding traffic back.
    modelAnswer: >-
      Readiness decides whether the Service sends a Pod traffic. The broken Pod never
      becomes ready, so the old Pods keep serving and the rollout waits. You can then roll
      back. A failing liveness probe means something else: restart this container. That
      helps a stuck process, but it never keeps a bad release away from users.

recap:
  - Declare a Deployment, and let controllers keep what runs matching it.
  - Reach Pods through a Service that picks them by label and skips Pods that aren't ready.
  - Keep liveness about the process itself, and pick a managed platform when a cluster is overkill.
recall:
  - id: card-desired-state
    concept: cloud.desired-state
    front: What does a Kubernetes controller do, over and over?
    back: >-
      Compares the declared state with what's running, and acts to close the gap, such as
      starting a Pod to replace a lost one.
  - id: card-service
    concept: cloud.k8s-services-and-ingress
    front: How does a Service know which Pods to send traffic to?
    back: >-
      Its selector matches Pod labels, and only Pods that pass their readiness probe get
      traffic.
  - id: card-requests-limits
    concept: cloud.k8s-probes-and-resources
    front: What happens when a container goes over its memory limit, and over its CPU limit?
    back: >-
      Over memory, it's killed (`OOMKilled`, exit 137). Over CPU, it's throttled and keeps
      running.
  - id: card-deployment
    concept: cloud.k8s-workloads
    front: You delete a Pod that belongs to a three-replica Deployment. What happens?
    back: >-
      A new Pod with a new name starts within seconds, because the Deployment still asks for
      three.

