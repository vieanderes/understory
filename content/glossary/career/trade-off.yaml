term: trade-off
aka:
  - tradeoff
  - trade off
short: A choice where gaining one good thing means giving up some of another.
explain: |
  A cache makes pages fast and sometimes shows old data. A second database survives an outage
  and doubles the bill. Almost every engineering choice buys something with something else.

  Saying so out loud is the skill. "We chose X, which gives us A and costs us B, and B is
  acceptable because of C." That sentence lets others check your reasoning, and it tells the
  next team when to revisit it.

  The tell of a weak answer is a choice with no downside. If you can't name what an option
  costs, you haven't understood it yet.
analogy: A bigger suitcase. You can pack more, and now you have to carry it.
usage: The trade-off is a minute of stale prices for a page that loads in a tenth of the time.
