term: pipe
aka: [redirection, shell pipeline]
short: A shell connection that feeds one program's output straight into the next program's input.
explain: |
  Small tools can each do one thing well if you can join them up. The `|` symbol takes
  what the program on its left prints and hands it to the program on its right, as it
  arrives. `grep` finds lines, `wc -l` counts them, and together they count matches.

  Its cousin, redirection, sends output to a file instead: `>` replaces, `>>` adds, `<`
  reads from one, and `2>` catches errors. Neither program knows it's connected to anything.
  The shell rewires their channels before they start.
analogy: A garden hose between two water butts. Whatever fills the first runs into the second.
example:
  language: bash
  code: |
    grep ERROR app.log | wc -l     # count error lines
    npm test > out.txt 2> err.txt  # results and errors apart
    sort names.txt | uniq >> seen.txt
usage: Pipe the log through `grep` before counting, so you only count the failed requests.
related: [standard-streams, shell, exit-code]
level: 1
lessons: [tooling.pipes-and-exit-codes]
