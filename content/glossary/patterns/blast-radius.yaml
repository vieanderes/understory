term: blast radius
aka:
  - impact radius
short: Everything a change or failure could affect, such as callers, contracts, data and users.
explain: |
  You change a date format in one function. Which code calls it? Which emails, reports and
  cached replies show its output? Which other teams parse it? That whole set could break.

  Mapping it before you change anything tells you which tests to add and how carefully to
  roll out. Search for every caller and check contracts with code you don't deploy. Think about data already
  stored in the old shape.

  It also guides design. Small, isolated pieces, permissions per tool and gradual rollouts all
  exist to keep it small when something does go wrong.
analogy: Dropping a stone in a pond. The question is how far the ripples reach.
usage: Billing and the email jobs both use this helper, so the blast radius is bigger than the diff.
related:
  - coupling
  - regression
  - feature-flag
  - least-privilege
level: 2
