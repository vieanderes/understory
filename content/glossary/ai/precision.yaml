term: precision
aka: [positive predictive value]
short: Of everything a classifier flagged, the share it got right.
explain: |
  A spam filter flags 100 emails, and 90 really are spam. Its precision is 90%. High
  precision means that when it says yes, you can trust it.

  Precision says nothing about what it missed. A filter that flags only one obvious email
  can reach 100%. That's why it's always read beside its twin, and why raising a threshold
  usually lifts one and lowers the other.
analogy: A fisherman who only keeps what he's sure is trout. Few wrong fish in the bucket, plenty left in the river.
usage: At a 0.9 threshold the auto-refund precision is 98%, so wrong refunds are rare.
twin:
  term: recall
  difference: Precision asks how many of the flagged items were right. Recall asks how many of the right items got flagged.
related: [recall, confidence-threshold, calibration, eval]
level: 2
lessons: [aisys.thresholds-and-calibration]
