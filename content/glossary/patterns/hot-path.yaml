term: hot path
aka:
  - hot code path
short: The few lines of code that run on almost every request, and so decide most of the cost.
explain: |
  A slow function called once a day costs nothing. A slightly slow one called on every page
  view costs real money and real seconds at scale.

  The code run per request, per message or per item in a big loop is where performance
  matters. A database query there, an extra network call, or a big object copied each time
  adds up fast.

  Find it by measuring, not guessing: a profiler, request traces, or counting calls. Then
  spend your care there and leave the rarely run code readable instead.
analogy: The busiest corridor in a hospital. Widen that one before you repaint the storeroom.
usage: The permission check is on the hot path, so that new query will run a million times an hour.
related:
  - latency
  - n-plus-one-query
