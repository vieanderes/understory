term: server-sent events
aka:
  - SSE
  - event stream
  - text/event-stream
short: A plain-text format for a server to push a series of messages down one open HTTP response.
explain: |
  Normally a response arrives whole. For a chat reply that takes ten seconds, you want the
  words as they're written. So the server keeps the response open and sends small events.

  Each event is a few `data:` lines, ended by a blank line. The browser's `EventSource` reads
  them, but it only sends GET. To POST a prompt, read the same format from `fetch` yourself.

  Network chunks don't line up with events. One chunk can hold half an event, or half a
  character. Buffer the text and split on blank lines.
analogy: A news ticker. One connection, and headlines keep sliding in as they happen.
example:
  language: http
  code: |
    HTTP/1.1 200 OK
    Content-Type: text/event-stream

    data: {"delta": "Hel"}

    data: {"delta": "lo"}

    data: [DONE]
usage: Stream the reply as server-sent events, so the first words show in under a second.
twin:
  term: polling
  difference: With polling the client keeps asking for news. With server-sent events it asks once and the server keeps talking.
related:
  - http
  - streaming
  - abort-controller
level: 2
lessons:
