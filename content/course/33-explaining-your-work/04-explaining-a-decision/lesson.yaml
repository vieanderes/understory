id: explain.explaining-a-decision
title: Explaining a decision
objective: Explain a decision with the options, the criteria, a recommendation, and what would change your mind.
level: advanced
minutes: 9
concepts: [explain.options-and-criteria, explain.what-would-change-my-mind]
prerequisites: [arch.monolith-and-services, explain.walking-through-code]
opening:
  text: >-
    You'll explain a technical decision so people can check it, not only take your word for
    it. Decisions explained this way get agreed faster and reopened at the right time.

steps:
  - type: prose
    id: options-first
    body: >-
      Your team asks: should the school timetable app send its notifications from a separate
      service? *I think we should keep the monolith* is a preference. Nobody can check it.


      An explained decision shows the **options** you compared, the **criteria** that matter
      here, and how each option did. Then comes the recommendation, and what it costs you.

  - type: multiple-choice
    id: pick-decision-opening
    concept: explain.options-and-criteria
    difficulty: 1
    question: Which opening gives your team something they can check?
    choices:
      - text: Services are how modern apps are built.
        feedback: >-
          That's a trend, not a reason. It says nothing about what matters for this app.
      - text: I've always preferred monoliths, honestly.
        feedback: >-
          Honest, but it's a taste. Nobody can weigh a taste against evidence.
      - text: We compared both on deploys, cost and team size.
        correct: true
        feedback: >-
          Yes. Options and criteria: now they can disagree with something specific.
      - text: Let's keep the monolith, trust me on this.
        feedback: >-
          Asking for trust skips the reasons. Show the comparison and you won't need it.

  - type: parsons
    id: arrange-decision-note
    concept: explain.options-and-criteria
    difficulty: 2
    language: text
    prompt: >-
      Put this decision note in an order a reviewer can check. One line doesn't belong.
    blocks:
      - id: question
        code: 'Question: should notifications run as their own service?'
        subgoal: The question
      - id: options
        code: 'Options: keep them in the modular monolith, or split them out.'
        subgoal: Options
      - id: criteria
        code: 'What matters: three developers, weekly deploys, low running cost.'
        subgoal: Criteria
      - id: scoring
        code: A split adds a deploy, a network hop and partial failure.
        subgoal: How each option does
      - id: recommend
        code: 'Recommendation: keep the modular monolith for now.'
        subgoal: The recommendation
      - id: trade-off
        code: We accept that a notification fix waits for the weekly release.
        subgoal: The trade-off
      - id: reopen
        code: We'd reopen this if notifications needed daily deploys.
        subgoal: What would change our mind
    distractors:
      - id: big-apps
        code: The big apps all use services, so we should too.
        feedback: >-
          What suits a thousand engineers says little about three. Judge it on this team's
          criteria.

  - type: prose
    id: change-my-mind
    body: >-
      End with what would change your mind: *we'd split notifications out if they needed
      daily deploys, or if a burst of texts slowed the timetable.*


      It sounds like weakness. It's the opposite. It shows the decision rests on evidence.
      And it tells everyone when to reopen it, instead of arguing it again every month.

  - type: bug-hunt
    id: hunt-vague-reopen
    concept: explain.what-would-change-my-mind
    difficulty: 3
    language: yaml
    code: |
      question: move timetable exports to a background job?
      options: export inside the request, or a queued job
      criteria: exports finish under 10 seconds, no new infrastructure
      recommendation: keep exports inside the request
      trade-off: a big export ties up one web worker while it runs
      reopen if: things change a lot
    prompt: >-
      Six months on, exports take 40 seconds. Nobody reopened the decision. Tap the line
      that should have made them.
    lines: [6]
    reasons:
      - text: It names no signal anyone can watch
        correct: true
        feedback: >-
          Right. "If exports pass 10 seconds" is a line someone notices crossing.
      - text: The trade-off admits a weakness
        feedback: >-
          Naming the cost is a strength. The vague last line is what let this slide.
      - text: It should list more options
        feedback: >-
          Two options are enough here. The trouble is that nobody knew when to look again.
      - text: The criteria are too specific
        feedback: >-
          Specific criteria make it checkable. The last line threw that away.
    fix: |
      reopen if: a typical export passes 10 seconds, or exports slow other pages

  - type: ai-review
    id: review-decision-claim
    concept: explain.options-and-criteria
    difficulty: 3
    language: yaml
    request: Draft a decision note on splitting notifications out of the timetable app.
    flawClass: performance
    code: |
      question: split notifications out of the timetable app?
      options: keep the modular monolith, or a notifications service
      criteria: page speed, deploy speed, running cost, three developers
      recommendation: split notifications into their own service
      because: a separate service makes every timetable page faster
      trade-off: one more thing to deploy, monitor and version
      reopen if: running cost rises above the hosting budget
    prompt: >-
      It reads well, and the team nearly approved it. Tap the line that won't survive a
      measurement.
    lines: [5]
    reasons:
      - text: A network hop adds latency, it doesn't remove it
        correct: true
        feedback: >-
          Right. A split adds a network trip. Speed needs a measurement, not a hope.
      - text: The trade-off line is too honest
        feedback: >-
          Naming the cost makes the note trustworthy. Line 5 is the claim with nothing behind
          it.
      - text: Three developers isn't a criterion
        feedback: >-
          Team size decides how many deployable units you can run. It's one of the best
          criteria here.
      - text: The reopen line should come first
        feedback: >-
          It belongs at the end, after the decision it would reopen.
    fix: |
      recommendation: keep the modular monolith
      because: a split adds a deploy and a network hop for no measured gain
    verify:
      question: What would show whether a split makes timetable pages faster?
      choices:
        - text: Benchmark the new service on its own
          feedback: >-
            Alone, it skips the network trip the split adds. It measures the wrong thing.
        - text: Measure where page time goes today
          correct: true
          feedback: >-
            Yes. If notifications aren't on the slow path, a split can't speed it up.
        - text: Ask the team if pages feel slow
          feedback: >-
            Feelings don't show where the time goes. A measurement of each part does.
        - text: Check the service passes its tests
          feedback: >-
            Passing tests shows it works, not that anything got faster.

  - type: explain-back
    id: explain-to-head-teacher
    concept: explain.options-and-criteria
    difficulty: 4
    audience: non-technical
    kind: decide
    prompt: >-
      The head teacher asks why you won't build a separate notifications service "like the
      big apps do". Defend your recommendation in terms that matter to the school. Say it out
      loud first.
    rubric:
      - It names the options and what matters to the school, such as cost, speed of fixes and reliability.
      - It gives the recommendation and the trade-off the school accepts, in the school's terms.
      - It says what would change your mind, such as needing text changes every day.
    modelAnswer: >-
      We looked at two ways: keep notifications in the app we have, or build a separate
      system. For a team of three, that means more to run, more to pay for and more that can
      break. So we're keeping one app. The cost is that a change to texts waits
      for the weekly update. If you ever need daily changes, we'll look again.

  - type: explain-back
    id: warn-when-wrong
    concept: explain.what-would-change-my-mind
    difficulty: 4
    audience: teammate
    kind: risk
    prompt: >-
      You recommended keeping notifications in the monolith. Warn a teammate what could make
      that the wrong call, and how you'd notice in time.
    rubric:
      - It names concrete signals, such as fixes waiting on releases or a burst of texts slowing pages.
      - It says how you'd watch for them, such as release notes or page response times on busy days.
      - It agrees a line that reopens the decision, rather than arguing it again each month.
    modelAnswer: >-
      Three things would make it wrong. Notifications could need daily changes while the rest
      ships weekly. A burst of texts, like on results day, could slow the timetable pages. Or
      a second team could take notifications over. I'd watch for fixes waiting on releases,
      and page response times on busy days. If either crosses the line we agreed, we reopen
      it.

recap:
  - Explain a decision with the options, the criteria and how each did.
  - Recommend one, and say plainly what it costs you.
  - Name the signal that would reopen it, so people know when to look again.

recall:
  - id: card-before-recommending
    concept: explain.options-and-criteria
    front: What does a decision explanation give before the recommendation?
    back: >-
      The question, the options you compared, the criteria that matter, and how each option
      did against them.
  - id: card-trade-off
    concept: explain.options-and-criteria
    front: Why say out loud the trade-off you accept?
    back: >-
      It shows you saw the cost, and nobody is surprised by it later. A decision with no cost
      named wasn't weighed.
  - id: card-useful-reopen
    concept: explain.what-would-change-my-mind
    front: What makes a "what would change my mind" line useful?
    back: >-
      A signal someone can watch, such as "if exports pass 10 seconds". "If things change"
      tells nobody anything.
  - id: card-why-reopen-builds-trust
    concept: explain.what-would-change-my-mind
    front: Why does saying what would change your mind make a decision stronger?
    back: >-
      It shows the decision rests on evidence. It also says when to reopen it, so it isn't
      argued again every month.

references:
  - kind: book
    title: 'Decisive: How to Make Better Choices in Life and Work'
    authors: Chip Heath and Dan Heath
    year: 2013
    venue: Crown Business
    note: Widening your options, and setting tripwires that tell you when to revisit a choice.
    primary: true
    verified: false
  - kind: essay
    title: Documenting Architecture Decisions
    authors: Michael Nygard
    year: 2011
    venue: Cognitect blog
    url: https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
    note: The short written form of a decision, with its context and consequences.
    primary: true
    verified: false
  - kind: essay
    title: MonolithFirst
    authors: Martin Fowler
    year: 2015
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/MonolithFirst.html
    note: Why most successful service systems began as a monolith that was split later.
    verified: false

deepDive: >-
  A "what would change my mind" line is a **tripwire**: a condition, chosen in advance, that
  forces a second look. Choosing it while calm beats deciding in the middle of an incident,
  when every option looks bad. The best tripwires are numbers someone already watches, such
  as a response time, a deploy count or a monthly bill.


  Weighted decision matrices, where each option scores points against each criterion, look
  rigorous. Use them to make the criteria visible, not to settle the choice. Small changes to
  the weights often flip the winner, which tells you the options are close and the trade-off
  is the real conversation.


  Written down and kept with the code, this explanation becomes an architecture decision
  record, which a later lesson covers. So does telling a decision you can undo cheaply from
  one you can't. A cheap-to-undo decision needs a lighter explanation and a faster call.
