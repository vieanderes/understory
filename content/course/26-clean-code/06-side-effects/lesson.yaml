    title: Functional Core, Imperative Shell
    authors: Gary Bernhardt
    venue: Destroy All Software
    url: https://www.destroyallsoftware.com/screencasts/catalog/functional-core-imperative-shell
    note: The screencast that named the pattern.
    primary: true
    verified: true
  - kind: docs
    title: Pure function
    authors: Wikipedia contributors
    venue: Wikipedia
    url: https://en.wikipedia.org/wiki/Pure_function
    note: The two properties, with examples of hidden inputs and side effects.
    verified: true
  - kind: docs
