id: security
number: 12
title: Security
summary: "Think like an attacker, then close each door. Run the common web attacks against your own sandboxed code, fix them, and finish by auditing a whole app."
why: "An attacker needs only one open door."
youCanBuild: "A threat model, a page that shows hostile input as text, safe cookie and CORS settings, access-control tests, safe uploads, and an audit of a small app."
concepts:
  - id: security.owasp-top-ten
    title: "The OWASP Top 10"
    summary: "OWASP's list of the most common and serious web application risks, rebuilt from real data every few years, used as a map and a review checklist."
  - id: security.assets-and-attackers
    title: Assets and attackers
    summary: A threat model starts from what is worth protecting and who would want it, not from a list of tools.
  - id: security.attack-surface
    title: Attack surface and trust boundaries
    summary: The attack surface is every entry point an attacker can reach, and a trust boundary is where data passes between parts with different privileges.
  - id: security.stride
    title: STRIDE
    summary: "A checklist of six threat types: spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege."
  - id: security.xss
    title: Cross-site scripting (XSS)
    summary: An attacker's input is delivered to another user's browser as script, where it runs with that user's session on your origin.
    confusableWith: [security.csrf]
  - id: security.output-encoding
    title: Contextual output encoding
    summary: "Untrusted data is inserted as text, or escaped for the exact context it lands in: HTML text, an attribute, a URL or a script."
  - id: security.csp
    title: Content Security Policy
    summary: A response header that lists the sources of script, style and other content the browser may load, with a per-response nonce to allow inline scripts.
    confusableWith: [security.cors]
  - id: security.security-headers
    title: Security headers
    summary: Headers such as `Strict-Transport-Security` and `X-Content-Type-Options`, and the CSP `frame-ancestors` directive, switch on browser defences.
  - id: security.csrf
    title: Cross-site request forgery (CSRF)
    summary: Another site makes the victim's browser send a state-changing request, and the browser attaches the victim's cookies to it.
    confusableWith: [security.xss, security.cors, security.ssrf]
  - id: security.samesite
    title: SameSite cookies
    summary: "`SameSite=Lax` or `Strict` stops the browser attaching a cookie to most or all requests that start from another site."
  - id: security.same-origin-policy
    title: Same-origin policy
    summary: A script may read responses only from its own origin (scheme, host and port), though it can still send requests elsewhere.
    confusableWith: [security.cors]
  - id: security.cors
    title: CORS
    summary: Response headers by which a server lets named other origins read its responses; it relaxes the same-origin policy and protects nothing on its own.
    confusableWith: [security.csp, security.csrf, security.same-origin-policy]
  - id: security.cors-credentials
    title: CORS with credentials
    summary: "A cross-origin request that carries cookies can be read only if the server names the exact origin and allows credentials; `*` is refused."
  - id: security.sql-injection
    title: SQL injection
    summary: Input concatenated into a query string is parsed as SQL, so the attacker changes what the query does, up to reading other tables.
  - id: security.parameterised-queries
    title: Parameterised queries
    summary: The query text and the values travel separately, so a value is never parsed as SQL; names such as a sort column come from an allow-list instead.
  - id: security.ssrf
    title: Server-side request forgery (SSRF)
    summary: The server fetches a URL chosen by the attacker, which reaches internal services that the attacker cannot reach directly.
    confusableWith: [security.csrf]
  - id: security.allow-lists
    title: Allow-lists
    summary: Accept only values from a known-good set, compared exactly, because a list of bad values is never complete.
  - id: security.session-fixation
    title: Session fixation
    summary: The attacker plants a session ID before login, so the server must issue a fresh ID when the user authenticates.
  - id: security.reset-flows
    title: Password reset flows
    summary: A reset token is random, single-use and short-lived, and the response is the same whether or not the account exists.
  - id: security.access-control-tests
    title: Access-control tests
    summary: For each endpoint, a test signs in as the owner, as a stranger and as nobody, and expects success, a refusal and a demand to sign in.
  - id: security.hashing
    title: Hashing and encryption
    summary: A hash is a one-way fingerprint of data that cannot be turned back, while encryption can be undone by whoever holds the key.
    confusableWith: [security.password-hashing, security.encryption]
  - id: security.password-hashing
    title: Password storage
    summary: Passwords are stored with a slow, salted function such as Argon2id, scrypt or bcrypt, so each guess is expensive for an attacker.
    confusableWith: [security.hashing]
  - id: security.encryption
    title: Encryption
    summary: Encryption hides data from anyone without the key; symmetric encryption uses one shared key, and public-key encryption a pair.
    confusableWith: [security.hashing, security.mac-and-signatures]
  - id: security.mac-and-signatures
    title: MACs and digital signatures
    summary: A MAC proves integrity with a secret that both sides share, and a signature does so with a private key that only the signer holds.
    confusableWith: [security.encryption]
  - id: security.tls-guarantees
    title: What TLS guarantees
    summary: TLS gives confidentiality, integrity and authentication of the server between two endpoints, and nothing about what either endpoint does with the data.
  - id: security.secret-storage
    title: Where secrets live
    summary: Secrets stay out of the repository and the client bundle, and reach the process through the environment or a secrets manager.
  - id: security.key-rotation
    title: Key rotation
    summary: Replacing a secret on a schedule and after any suspected leak, since deleting a leaked key from the code does not make it secret again.
  - id: security.least-privilege
    title: Least privilege and scopes
    summary: Each key is granted only the permissions its one task needs, so a leak exposes as little as possible.
  - id: security.jwt-verification
    title: "Verifying a JWT"
    summary: "A server checks the signature with a pinned algorithm and key, then the exp, iss and aud claims, before it trusts anything inside."
  - id: security.token-storage
    title: Where a token lives
    summary: "A token in `localStorage` can be read by any script on the page, so an XSS steals it; an `HttpOnly` cookie keeps it out of scripts' reach."
  - id: security.token-revocation
    title: "Token revocation"
    summary: "A self-contained token stays valid until it expires, so short lifetimes, refresh tokens and a deny list are what make logout real."
  - id: security.upload-validation
    title: Safe file uploads
    summary: An upload is checked for size and real type on the server, stored under a name the server chooses, and served so it cannot run as a page.
  - id: security.path-traversal
    title: Path traversal
    summary: "A file name containing `../` walks out of the intended folder, so a server resolves the path and checks it still sits inside that folder."
  - id: security.rate-limiting
    title: Rate limiting
    summary: A limiter caps requests per key, such as an account or IP address, in a time window, often with a token bucket.
  - id: security.bot-defence
    title: Bot and scalper defence
    summary: Purchase limits, queues, challenges and behaviour signals raise the cost of automated buying without blocking people.
  - id: security.data-minimisation
    title: Data minimisation
    summary: GDPR requires collecting only the personal data a stated purpose needs and keeping it no longer than that purpose lasts.
  - id: security.security-logging
    title: Security logging
    summary: Recording the security-relevant events needed to detect and reconstruct an attack, while keeping secrets and personal data out of the log.
  - id: security.detection-vs-prevention
    title: Detection and prevention
    summary: Prevention blocks an attack, and detection notices one that slipped through, so a system needs both because prevention eventually fails.
  - id: security.alerting-signals
    title: Alerting on signals
    summary: An alert should fire on a signal that warrants action, tuned so that real attacks are not lost in a flood of noise.
  - id: security.ir-lifecycle
    title: The incident response lifecycle
    summary: "The phases of handling an incident: prepare, detect, contain, eradicate, recover and review."
  - id: security.containment
    title: Containment
    summary: Limiting an active incident's spread and damage before removing its cause, such as revoking a leaked key before hunting for how it leaked.
  - id: security.blameless-postmortem
    title: Blameless post-mortems
    summary: A review that finds the system and process causes of an incident rather than a person to blame, so the fix actually holds.
  - id: security.defence-in-depth
    title: Defence in depth
    summary: Layering independent controls so that the failure of any one of them does not expose the asset.
  - id: security.zero-trust
    title: Zero trust
    summary: Trusting no request for its network location, and verifying identity and authorisation on every request instead.
  - id: security.hardening
    title: Hardening
    summary: Shrinking the attack surface by switching off what you don't use, such as debug pages, default accounts, verbose errors and unused endpoints.
  - id: security.authorised-testing
    title: Authorisation and the law
    summary: Testing a system for weaknesses is lawful only on your own systems or within a written scope and signed permission; the same act without them is a crime.
  - id: security.reconnaissance
    title: Reconnaissance
    summary: Gathering what a system reveals about itself, such as error pages, headers and versions, to map its attack surface before any attack.
  - id: security.privilege-escalation
    title: Privilege escalation
    summary: Turning limited access into more, vertically to higher privileges or horizontally to another user's data, often through a field the server should never accept.
  - id: security.responsible-disclosure
    title: Responsible disclosure
    summary: Reporting a flaw privately to its owner with time to fix it before any public detail, often through a bug-bounty or a security.txt policy.
  - id: security.install-scripts
    title: Install scripts and lockfile changes
    summary: "A package's install script runs with your permissions the moment it is installed, so a new or changed dependency in the lockfile deserves review."
  - id: security.compromised-dependency
    title: "Responding to a compromised package"
    summary: "When a dependency is hijacked you find every build that pulled it, rotate what it could reach, and pin to a known-good version."
  - id: security.security-review
    title: Security review
    summary: Reading code or an app against a checklist of known flaws, naming each one found and the fix, the way a reviewer or auditor does.
  - id: security.fail-closed
    title: Failing closed
    summary: When a security check errors or cannot decide, it refuses access, so a failure never becomes a way in.
  - id: security.pseudonymisation
    title: "Personal, pseudonymised and anonymised data"
    summary: "Pseudonymised data can still be linked back to a person with extra information and stays personal data, while truly anonymised data cannot."
  - id: security.lawful-basis
    title: "Lawful basis and special categories"
    summary: "Every use of personal data needs a lawful basis such as contract or consent, and special categories such as health need a stronger one."
  - id: security.controller-and-processor
    title: "Controllers, processors and DPAs"
    summary: "The controller decides why data is processed, a processor acts on its instructions under a data processing agreement, and sub-processors are listed."
  - id: security.data-subject-requests
    title: "Retention and data subject requests"
    summary: "Data is kept only as long as needed, and requests to see, export or erase it are answered across every store, backup and log."
