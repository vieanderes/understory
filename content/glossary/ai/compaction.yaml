term: compaction
aka:
  - context compaction
  - conversation summarisation
short: Replacing an agent's older turns with a short summary note, so a long run stays within budget.
explain: |
  A long run's history grows every turn until it is too costly, too slow, or too big to fit.
  Something has to go.

  Compaction rewrites the old turns as a short state note under a token budget. It keeps the
  task, the decisions and why, the open questions and the files touched. The last few turns
  stay word for word.

  The trap is summarising the task itself. Paraphrase "never touch the payments table" and
  the rule softens. Copy instructions and constraints across exactly; summarise only the
  journey.
analogy: Handing over a shift with a one-page note, not the whole day's recordings.
usage: Compaction kept the decisions but dropped the user's exact constraint, so pin constraints outside the summary.
related:
  - context-engineering
  - context-rot
  - context-window
level: 3
lessons:
  - agents.context-at-scale
