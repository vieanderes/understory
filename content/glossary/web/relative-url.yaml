term: relative URL
aka: [relative path, relative link]
short: An address written from where the current page sits, like `photos/cake.jpg`, rather than from the very start.
explain: |
  Writing the full address for every link in your own site is long, and it breaks when the
  site moves. A shorter address starts from the folder of the current page. `menu.html`
  means "the menu page next to this one".

  A path starting with `/` starts at the top of the site instead, and `../` goes up a folder.
  The same link can work on one page and break on another, so check which folder you're in.
analogy: Directions like "second door on the left". Perfect from where you stand, and wrong from the next street.
example:
  language: html
  code: |
    <!-- on the page /recipes/index.html -->
    <a href="pancakes.html">Pancakes</a>  <!-- /recipes/pancakes.html -->
    <a href="/about.html">About</a>       <!-- /about.html -->
    <a href="../shop/cart.html">Cart</a>  <!-- /shop/cart.html -->
usage: The image breaks on the blog pages because it's a relative URL, so start it with a slash.
twin:
  term: url
  difference: A full URL works from anywhere, because it names the scheme and the domain. A relative URL is filled in from the current page's address, so its meaning depends on where it's written.
related: [url, hyperlink]
level: 2
lessons: [html.links-and-urls]
