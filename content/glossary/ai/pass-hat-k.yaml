term: pass^k
aka:
  - pass hat k
  - pass power k
short: The chance that every one of several attempts at a task succeeds, a measure of reliability.
explain: |
  A support agent that solves a refund correctly two times in three sounds decent. Every
  customer meets it once, so one in three gets a wrong answer.

  This metric asks: if I try k times, will all of them work? With a success rate of p per try,
  it's roughly p to the power k, so it drops fast. Two in three per try becomes under one in
  three over three tries.

  Use it for anything users rely on every time. It's the number that shows whether an agent
  is dependable, not merely capable.
analogy: A bus that turns up on time. Not whether it ever does, but whether it does every morning this week.
usage: Report pass^k for the billing agent; customers never see the best of five tries.
twin:
  term: pass-at-k
  difference: pass^k asks whether all k tries succeed, so it falls as k grows. pass@k asks whether at least one does, so it rises.
related:
  - pass-at-k
  - eval
  - trajectory
level: 3
