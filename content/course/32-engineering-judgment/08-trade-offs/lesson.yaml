id: judgment.trade-offs
title: Making the call
objective: Make a technical call between building and buying, prefer boring technology, and tell one-way doors from two-way doors.
level: advanced
minutes: 10
concepts: [judgment.build-or-buy, judgment.boring-technology, judgment.reversible-decisions]
prerequisites: [arch.adrs-and-twelve-factor, clean.duplication, arch.hexagonal]
opening:
  text: >-
    You'll make technical calls quickly when they're cheap to undo, and carefully when they
    aren't. Then you'll defend them in a sentence, which is most of what people mean by
    senior judgment.

steps:
  - type: prose
    id: two-kinds-of-door
    body: >-
      Some decisions are **two-way doors**. If you're wrong, you walk back through: a button
      label, a lint rule, a library hidden behind your own interface. Decide those fast, with
      most of the facts, and review later.


      Others are **one-way doors**, hard or impossible to undo: deleting data, the shape of a
      public API, a three-year contract. Slow down for those, and gather evidence first.

  - type: multiple-choice
    id: pick-one-way-door
    concept: judgment.reversible-decisions
    difficulty: 1
    question: Which of these is a one-way door?
    choices:
      - text: Dropping the old bookings table after a migration
        correct: true
        feedback: >-
          Right. Once the data is gone, there's no walking back.
      - text: Renaming the "Book" button to "Reserve"
        feedback: >-
          If members dislike it, you rename it back tomorrow. That's a two-way door.
      - text: Switching on a stricter lint rule
        feedback: >-
          A lint rule can be switched off in one line. Cheap to try, cheap to undo.
      - text: Trying a date library behind your own wrapper
        feedback: >-
          The wrapper keeps the library in one file. Swapping it out later is a small change.

  - type: ai-review
    id: review-door-label
    concept: judgment.reversible-decisions
    difficulty: 2
    language: yaml
    request: Draft an ADR for moving class bookings to a document database.
    flawClass: logic
    code: |
      title: 9. Move class bookings to a document database
      status: proposed
      context: Booking pages take 2 s. The team wants faster reads.
      decision: Copy all bookings to the document store, then drop the Postgres tables.
      door: two-way, we can always move back
      consequences: Faster reads. Reports that join bookings to payments need rewriting.
    prompt: >-
      An assistant drafted this record for a gym's booking app. The team approved it in five
      minutes, because it said two-way. Tap the line at fault.
    lines: [5]
    reasons:
      - text: Dropping the tables makes it a one-way door
        correct: true
        feedback: >-
          Yes. With the tables gone, moving back means rebuilding the data.
      - text: The context should name the database product
        feedback: >-
          Which product is a separate choice. The danger here is how hard this one is to
          undo.
      - text: Rewriting reports isn't a real cost
        feedback: >-
          It's a real cost, and the record is right to list it. The mislabelled door is what
          rushed the review.
      - text: The status should already say accepted
        feedback: >-
          Proposed is right before a review. The review was short because line 5 made it look
          safe.
    fix: |
      decision: Copy bookings to the document store. Postgres stays the source of truth for 3 months.
      door: two-way while Postgres stays. Dropping its tables is a later, one-way decision.
    verify:
      question: Which check proves the team really could move back?
      choices:
        - text: Rehearse switching reads back to Postgres in staging
          correct: true
          feedback: >-
            Yes. A way back you've run is the only one you know works.
        - text: Unit tests for the new store's client
          feedback: >-
            They prove the new path works. They say nothing about getting back to the old
            one.
        - text: A load test of the document store
          feedback: >-
            Speed is a fair question, but a different one. Going back needs a rehearsed route.
        - text: Read the vendor's migration guide
          feedback: >-
            A guide describes a way back. Only running it shows your data and code survive the
            trip.

  - type: prose
    id: build-or-buy
    body: >-
      **Build or buy?** Building gives you control, plus upkeep for ever: fixes, security
      patches, someone on call. Buying costs money and ties you to a vendor.


      The deciding question: is this part your core, the reason people choose you? A gym
      app's class timetable might be. Email delivery and card payments aren't. An assistant
      makes building feel cheap. The upkeep costs exactly what it always did.

  - type: code-challenge
    id: write-break-even
    concept: judgment.build-or-buy
    difficulty: 3
    language: ts
    editable: '13-14'
    prompt: >-
      Money is half the question, so model it quickly. Write `breakEvenYear(build, buy)`.
      Building costs `upfront` once, then `perYear` every year from year 1. Buying costs
      `perUserPerMonth` for each member, every month, where `users[0]` is year 1's members.


      Return the first year in which the total spent on buying is more than the total spent
      on building. A tie isn't more. If it never happens in the years given, return `null`.
    hints:
      - Keep two running totals, one for building and one for buying, and add one year at a time.
      - 'Building starts at `upfront` and adds `perYear` each year. A year of buying is `perUserPerMonth * 12 * members`.'
      - '`buy.users.entries()` gives each index with its members. Return `index + 1` as soon as buying is strictly ahead.'

  - type: prose
    id: boring-technology
    body: >-
      Every new tool brings failures nobody on the team has seen yet. **Boring technology** is
      the opposite: tools whose failure modes are known, and whose error messages you can
      search.


      One well-known essay gives each team about three innovation tokens. Spend them where the
      new thing earns its risk. The rule of three from Duplication fits too: don't build a
      general platform before the third use.

  - type: bug-hunt
    id: hunt-wasted-token
    concept: judgment.boring-technology
    difficulty: 3
    language: yaml
    code: |
      # Gym booking app: a team of three, 2,000 members
      language: TypeScript           # everyone knows it
      database: PostgreSQL           # members, classes, bookings
      jobs: a jobs table in PostgreSQL
      search: PostgreSQL full-text search
      friends: a new graph database  # "friends who booked this class"
      hosting: the platform we already run
    prompt: >-
      The team's tech choices for the next year. Tap the line that spends an innovation
      token where it won't earn its risk.
    lines: [6]
    reasons:
      - text: A new database for a query Postgres handles
        correct: true
        feedback: >-
          Yes. Friends among 2,000 members is a small join. Keep the token.
      - text: Jobs need a dedicated queue service
        feedback: >-
          A jobs table is boring and fine at this size. A queue service is one more thing to
          run and learn.
      - text: Class search needs a search engine
        feedback: >-
          Postgres full-text search covers a gym's class list well. Move when it stops coping.
      - text: TypeScript is the risky choice here
        feedback: >-
          The whole team knows it. That familiarity is exactly what makes it boring and safe.
    fix: |
      friends: a join on a friendships table in PostgreSQL

  - type: multiple-choice
    id: pick-decide-now
    concept: judgment.reversible-decisions
    difficulty: 3
    question: You have about 70% of the facts for a two-way door. What do you do?
    choices:
      - text: Decide now, and set a date to review
        correct: true
        feedback: >-
          Yes. Undoing is cheap, so waiting costs more than a wrong call.
      - text: Wait until you have all the facts
        feedback: >-
          You rarely get them all, and waiting has a cost too. Save the wait for one-way doors.
      - text: Run a month-long study first
        feedback: >-
          That's the care a one-way door deserves. Here a mistake is cheap to undo.
      - text: Ask the whole team to vote
        feedback: >-
          A vote spreads the blame, not the risk. Someone decides, and the review date catches
          mistakes.

  - type: explain-back
    id: explain-build-or-buy-email
    concept: judgment.build-or-buy
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks: for the gym app, would you build your own email sending or buy a
      service? Make the call and defend it.
    rubric:
      - It decides by whether the part is core, and email delivery isn't why members choose the gym.
      - It counts the real cost of building, such as deliverability, bounces, upkeep and on-call, not only the first version.
      - It keeps the door two-way, such as a `Mailer` interface around the vendor, and says when to revisit.
    modelAnswer: >-
      I'd buy. Members choose us for classes, not for how we deliver email. Building it means
      deliverability, bounce handling, spam rules and someone on call, for ever. A service
      costs money and ties us to a vendor. So I'd put it behind our own `Mailer` interface,
      which keeps switching a two-way door. I'd record that in an ADR, and revisit if the bill
      outgrows the cost of running it ourselves.

recap:
  - Decide two-way doors fast with most of the facts, and slow down for one-way doors.
  - Build what makes you different, buy the rest, and count upkeep as part of building.
  - Spend innovation tokens only where a new tool earns its risk, and write the call down.

recall:
  - id: card-one-way
    concept: judgment.reversible-decisions
    front: What makes a decision a one-way door, and how should you treat it?
    back: >-
      It's hard or impossible to undo, such as deleting data or a public API's shape. It gets
      slower care and more evidence.
  - id: card-build-buy
    concept: judgment.build-or-buy
    front: What question decides most build-or-buy calls?
    back: >-
      Whether the part is your core, the reason people choose you. Build that, and buy the
      rest, counting upkeep as a cost of building.
  - id: card-boring
    concept: judgment.boring-technology
    front: What does choosing boring technology buy a team?
    back: >-
      Failure modes that are already known and searchable. New tools are kept for the few
      places where they earn their risk.
  - id: card-two-way-vendor
    concept: judgment.reversible-decisions
    front: How can you make buying a service closer to a two-way door?
    back: >-
      Put the vendor behind your own interface, so switching means rewriting one adapter, not
      every caller.

references:
  - kind: essay
    title: Choose Boring Technology
    authors: Dan McKinley
    year: 2015
    venue: mcfunley.com
    url: https://mcfunley.com/choose-boring-technology
    note: Innovation tokens, and why known failure modes are worth more than new features.
    primary: true
    verified: false
  - kind: essay
    title: 2015 Letter to Shareholders
    authors: Jeff Bezos
    year: 2016
    venue: Amazon
    note: The source of one-way and two-way doors, and of deciding reversible calls fast.
    primary: true
    verified: false
  - kind: essay
    title: UtilityVsStrategicDichotomy
    authors: Martin Fowler
    year: 2014
    venue: martinfowler.com
    url: https://martinfowler.com/bliki/UtilityVsStrategicDichotomy.html
    note: Why software that sets you apart deserves different treatment from utility software.
    verified: false
  - kind: essay
    title: Documenting Architecture Decisions
    authors: Michael Nygard
    year: 2011
    venue: Cognitect blog
    url: https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions
    note: The ADR format from Recording decisions, where each of these calls gets written down.
    verified: false

deepDive: >-
  Doors aren't fixed. Good engineering often turns a one-way door into a two-way one. Keep the
  old table while the new store proves itself. Write to both for a while. Put a vendor behind
  your own interface. Ship behind a flag. Each costs a little extra work, and buys back the
  right to change your mind.


  The opposite mistake is common too: treating every call as a one-way door. Teams that
  review a lint rule like a database migration move slowly and still make mistakes. Most
  decisions are two-way. A widely quoted rule of thumb says to decide most calls with about
  70% of the information you wish you had.


  Build or buy has a third option: adopt open source. You get control and no licence fee, but
  you take on upgrades, security fixes and sometimes the project's future. Count that as
  upkeep.


  Whichever way you go, write the call in an ADR, as in Recording decisions. Name the door,
  and the change that would make you revisit it. A break-even year from the challenge makes
  a good line in the consequences.
