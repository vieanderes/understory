term: jitter
aka: [ random jitter, full jitter, backoff with jitter ]
short: A random amount added to each retry wait, so many clients don't retry at the same moment.
explain: |
  When a service stumbles, every client fails at once. If they all wait exactly one second,
  then two, then four, they all come back together. The service gets hit by the same wave
  again and again.

  Adding a random part to each wait spreads the clients out. The usual recipe is
  exponential backoff with a cap, then a random wait between zero and that number. Fifty
  workers then trickle back instead of stampeding.
analogy: A teacher letting the class leave a row at a time, instead of everyone rushing the door when the bell goes.
example:
  language: ts
  code: |
    const cap = 30_000;
    const base = Math.min(cap, 500 * 2 ** attempt);
    // full jitter: anywhere between zero and the backoff
    await sleep(Math.random() * base);
usage: The workers retry in lockstep and keep tripping the rate limit; add jitter to the backoff.
related: [ retry, transient-error, rate-limiting, cache-stampede ]
level: 2
lessons: [ai.failures, interview.llm-client-build, backend.rate-limits]
