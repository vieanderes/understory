id: design.i18n-and-forms
title: Internationalisation
objective: Format dates, money and counts for any locale with `Intl`, and mark a page's language and direction.
level: advanced
minutes: 10
concepts: [design.locale-formatting, design.pluralisation, design.rtl]
prerequisites: [design.forms-that-help, css.modern-architecture]
opening:
  text: >-
    You'll show the same price, date and count to people in Berlin, Dublin and Moscow and get
    each one right. And a screen reader will pronounce each language in its own voice.

steps:
  - type: prose
    id: what-a-locale-is
    body: >-
      **Internationalisation** means building an interface that works in any language and
      region. The code for a language and region is a **locale**: `en-GB` is English as
      written in Britain, `de-DE` German in Germany.


      Locales disagree on more than words. The order of a date, the decimal mark and the
      side the currency sign sits on all change.

  - type: prose
    id: never-by-hand
    body: |-
      So never build those strings by hand. JavaScript has **`Intl`**, a set of formatters
      that know every locale's rules:

      ```js
      const date = new Date(2026, 2, 4); // 4 March
      new Intl.DateTimeFormat("en-GB").format(date); // "04/03/2026"
      new Intl.DateTimeFormat("en-US").format(date); // "3/4/2026"
      ```

      Build `04/03/2026` by hand and a reader in the US sees 3 April.

  - type: multiple-choice
    id: pick-wrong-locale-date
    concept: design.locale-formatting
    difficulty: 1
    question: A British shop shows every visitor `03/04/2026`, meaning 3 April. What does a reader in the US see?
    choices:
      - text: 4 March
        correct: true
        feedback: >-
          Right. In the US the month comes first, so a delivery looks a month early.
      - text: 3 April
        feedback: >-
          That's the British reading. In the US, `03` is the month.
      - text: An invalid date
        feedback: >-
          It's valid in both orders. That's what makes the bug so quiet.

  - type: playground
    id: format-the-prices
    concept: design.locale-formatting
    difficulty: 2
    prompt: >-
      Both shops show the same hand-built price. In `show`, replace it with
      `new Intl.NumberFormat(locale, { style: "currency", currency: "EUR" }).format(price)`.
      Watch Germany and Ireland differ.
    html: |
      <p>Germany: <span id="de"></span></p>
      <p>Ireland: <span id="ie"></span></p>
    js: |
      const price = 1234.5;

      function show(id, locale) {
        const text = "€" + price.toFixed(2);
        document.querySelector("#" + id).textContent = text;
      }

      show("de", "de-DE");
      show("ie", "en-IE");
    editable: [js]
    checks:
      - label: Germany shows `1.234,50 €`
        selector: '#de'
        text: 1.234,50 €
      - label: Ireland shows `€1,234.50`
        selector: '#ie'
        text: €1,234.50
    solution:
      js: |
        const price = 1234.5;

        function show(id, locale) {
          const text = new Intl.NumberFormat(locale, { style: "currency", currency: "EUR" }).format(price);
          document.querySelector("#" + id).textContent = text;
        }

        show("de", "de-DE");
        show("ie", "en-IE");
    hints:
      - Only the line that builds `text` changes.
      - The formatter needs the `locale` that `show` receives.
      - '`const text = new Intl.NumberFormat(locale, { style: "currency", currency: "EUR" }).format(price);`'

  - type: prose
    id: plural-categories
    body: |-
      Counts are harder. English has two forms: 1 item, 2 items. Russian has three for whole
      numbers: 1 товар, 2 товара, 5 товаров. And 21 goes back to the first.

      `Intl.PluralRules` names the form, called a **plural category**:

      ```js
      new Intl.PluralRules("ru").select(5); // "many"
      ```

      A message then keeps one text per category, instead of adding an s.

  - type: playground
    id: pluralise-the-basket
    concept: design.pluralisation
    difficulty: 3
    prompt: >-
      The hand rule gives "5 товара" and "21 товара", both wrong. In `line`, pick the word with
      `messages[new Intl.PluralRules("ru").select(count)]` instead.
    html: |
      <ul lang="ru">
        <li id="n2"></li>
        <li id="n5"></li>
        <li id="n21"></li>
      </ul>
    js: |
      const messages = { one: "товар", few: "товара", many: "товаров", other: "товара" };

      function line(count) {
        const word = count === 1 ? messages.one : messages.other;
        return `${count} ${word} в корзине`;
      }

      document.querySelector("#n2").textContent = line(2);
      document.querySelector("#n5").textContent = line(5);
      document.querySelector("#n21").textContent = line(21);
    editable: [js]
    checks:
      - label: 5 uses `товаров`
        selector: '#n5'
        text: 5 товаров в корзине
      - label: 21 uses `товар`
        selector: '#n21'
        text: 21 товар в корзине
      - label: 2 uses `товара`
        selector: '#n2'
        text: 2 товара в корзине
    solution:
      js: |
        const messages = { one: "товар", few: "товара", many: "товаров", other: "товара" };

        function line(count) {
          const word = messages[new Intl.PluralRules("ru").select(count)];
          return `${count} ${word} в корзине`;
        }

        document.querySelector("#n2").textContent = line(2);
        document.querySelector("#n5").textContent = line(5);
        document.querySelector("#n21").textContent = line(21);
    hints:
      - Only the line that picks `word` changes.
      - '`select(count)` gives a category name, such as `many`.'
      - Use that name as the key into `messages`.

  - type: ai-review
    id: review-plural-format
    concept: design.pluralisation
    difficulty: 3
    language: js
    request: Show how many items are in the basket, in Russian.
    flawClass: hallucinated-api
    code: |
      const messages = { one: "товар", few: "товара", many: "товаров", other: "товара" };
      const rules = new Intl.PluralRules("ru");

      function basketLine(count) {
        const word = messages[rules.format(count)];
        return `${count} ${word} в корзине`;
      }
    prompt: >-
      An assistant wrote this, and it reads well. The first basket to load crashes with
      `rules.format is not a function`. Tap the line at fault.
    lines: [5]
    reasons:
      - text: '`PluralRules` has `select`, not `format`'
        correct: true
        feedback: >-
          Yes. `format` belongs to the other formatters. Plural rules only name a category.
      - text: '`messages` is missing a key'
        feedback: >-
          All four Russian categories are there. The crash comes before any key is read.
      - text: '`rules` must be made inside the function'
        feedback: >-
          Making it once is fine, and cheaper. The method name is what doesn''t exist.
    fix: |
      const messages = { one: "товар", few: "товара", many: "товаров", other: "товара" };
      const rules = new Intl.PluralRules("ru");

      function basketLine(count) {
        const word = messages[rules.select(count)];
        return `${count} ${word} в корзине`;
      }

  - type: prose
    id: lang-and-dir
    body: >-
      Two attributes finish the job. `lang` says which language the text is in, so a screen
      reader picks the right voice: `<html lang="en">`, and `lang="ru"` on a Russian list.


      `dir="rtl"` turns the reading direction round for Arabic or Hebrew. The logical
      properties from the CSS chapter, like `margin-inline-start`, follow it.

  - type: playground
    id: mark-the-languages
    concept: design.rtl
    difficulty: 2
    prompt: >-
      A travel page greets visitors in three languages. Mark the Welsh paragraph
      `lang="cy"`. Mark the Arabic one `lang="ar"` and `dir="rtl"`, and watch it move to the
      right.
    html: |
      <h1>Welcome</h1>
      <p class="welsh">Croeso i'n siop.</p>
      <p class="arabic">مرحبا بكم في متجرنا.</p>
    css: |
      body { font-family: sans-serif; }
      p { border-inline-start: 4px solid #0f766e; padding-inline-start: 8px; }
    editable: [html]
    showTree: true
    checks:
      - label: The Welsh paragraph is `lang="cy"`
        selector: 'p.welsh[lang="cy"]'
        count: 1
      - label: The Arabic paragraph is `lang="ar"`
        selector: 'p.arabic[lang="ar"]'
        count: 1
      - label: The Arabic paragraph reads right to left
        selector: 'p.arabic[dir="rtl"]'
        count: 1
    solution:
      html: |
        <h1>Welcome</h1>
        <p class="welsh" lang="cy">Croeso i'n siop.</p>
        <p class="arabic" lang="ar" dir="rtl">مرحبا بكم في متجرنا.</p>
    hints:
      - The attributes go on each `p`, next to its class.
      - The Welsh one needs one attribute, the Arabic one two.
      - '`<p class="arabic" lang="ar" dir="rtl">`.'

  - type: explain-back
    id: explain-intl-over-hand
    concept: design.locale-formatting
    difficulty: 3
    prompt: >-
      A teammate formats prices with `"€" + price.toFixed(2)` because "everyone knows what it
      means". What goes wrong for a shop that sells across Europe?
    rubric:
      - Locales differ in the decimal mark, the grouping and where the currency sign sits.
      - A hand-built string looks foreign or wrong in most locales, and can be misread.
      - '`Intl.NumberFormat` with the visitor''s locale gets every one right, with no rules to maintain.'
    modelAnswer: >-
      It's right for Ireland and wrong for Germany, where the same price is `1.234,50 €`: a
      comma for decimals, a point for thousands and the sign after. French puts a space in
      the thousands. Each hand-built rule is a bug in some country. `Intl.NumberFormat`
      already knows every locale, so the code passes the locale and never learns the rules.

recap:
  - Format dates and money with `Intl`, passing the visitor's locale.
  - Pick plural forms with `Intl.PluralRules`, never by adding an s.
  - Mark the page's language with `lang`, and right-to-left text with `dir`.

recall:
  - id: card-date-order
    concept: design.locale-formatting
    front: What does `Intl.DateTimeFormat` print for 4 March 2026 in `en-GB`, and in `en-US`?
    back: >-
      `04/03/2026` and `3/4/2026`. Same date, different order, so never build it by hand.
  - id: card-plural-categories
    concept: design.pluralisation
    front: Why can't a message add an s for counts other than 1?
    back: >-
      Languages have different plural forms. Russian has `few` and `many` too, and
      `Intl.PluralRules` names the right one.
  - id: card-lang
    concept: design.rtl
    front: What does the `lang` attribute change for a screen reader user?
    back: >-
      The voice and pronunciation. Without it, a screen reader reads every language with the
      page's voice.
  - id: card-rtl-start
    concept: design.rtl
    front: In `dir="rtl"`, which side does `margin-inline-start` land on?
    back: >-
      The right. The inline start follows the reading direction, and `margin-left` doesn't.

references:
  - kind: spec
    title: ECMAScript Internationalization API Specification
    authors: Ecma TC39
    venue: Ecma International, ECMA-402
    url: https://tc39.es/ecma402/
    note: The specification behind `Intl.NumberFormat`, `DateTimeFormat` and `PluralRules`.
    primary: true
    verified: true
  - kind: docs
    title: Intl.PluralRules
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/PluralRules
    note: '`select` and the categories a locale can return.'
    verified: true
  - kind: docs
    title: Language Plural Rules
    authors: Unicode CLDR
    venue: Unicode Consortium
    url: https://www.unicode.org/cldr/charts/latest/supplemental/language_plural_rules.html
    note: The plural categories of every language, with example numbers.
    primary: true
    verified: true
  - kind: docs
    title: 'Understanding Success Criterion 3.1.2: Language of Parts'
    authors: W3C Web Accessibility Initiative
    venue: WCAG 2.2 Understanding Docs
    url: https://www.w3.org/WAI/WCAG22/Understanding/language-of-parts.html
    note: Why a passage in another language needs its own `lang`.
    verified: true

deepDive: >-
  Russian has a fourth category, `other`, for fractions: `select(1.5)` gives `other`. Arabic
  and Welsh each use six categories. The CLDR chart in the references lists them all.


  `Intl.PluralRules` also has an ordinal type. In English, `select(2)` with `{ type:
  "ordinal" }` gives `two`, which is how "2nd" gets its ending. `Intl.RelativeTimeFormat`
  turns -1 day into "yesterday", or "gestern" for `de`.


  Digit grouping varies too. `en-IN` writes 1234567 as `12,34,567`. `fr-FR` separates
  thousands with a narrow no-break space, so the string never matches a plain `' '` in a
  test.


  Where does the locale come from? `navigator.language` gives the browser's preference, and
  a server can read the `Accept-Language` request header. Let people change it, too.
