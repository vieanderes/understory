term: latency
aka: [ response time ]
short: How long one request takes, from the moment it is sent to the moment the answer arrives.
explain: |
  Click a button and wait. That wait is what people feel. It's measured in milliseconds,
  and it adds up across every hop: browser to server, server to database, and back.

  An average hides the pain. Ten fast requests and one ten-second request average out to
  something that looks fine. So teams report **percentiles**: p50 for the typical case, p95
  and p99 for the slow tail that your busiest users hit most.
analogy: How long your pizza takes to arrive after you order it.
usage: Latency on the search endpoint jumped to 900 ms at p95 after we added the spelling check.
twin:
  term: throughput
  difference: Latency is how long one request takes. Throughput is how many requests finish per second. A motorway can carry lots of cars (throughput) while each trip still takes an hour (latency).
related: [ throughput, percentile, cache, cdn, token ]
level: 1
lessons: [ perf.measure-first, sysdesign.estimation]
