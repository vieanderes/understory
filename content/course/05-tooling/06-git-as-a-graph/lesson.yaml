    note: A branch as a movable pointer to a commit, and how `HEAD` names the current one.
    primary: true
    verified: true
  - kind: book
    title: 'Pro Git, second edition: 3.2 Git Branching, Basic Branching and Merging'
    authors: Scott Chacon and Ben Straub
    year: 2014
    venue: Apress
    url: https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging
    note: Fast-forward, merge commits, and resolving a conflict with its markers.
    verified: true
  - kind: docs
    title: git-reflog
    authors: The Git project
