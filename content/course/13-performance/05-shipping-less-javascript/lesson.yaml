deepDive: >-
  The numbers here are from esbuild with React 19 and marked. Gzip took the 262 kB
  production bundle to 82 kB over the wire, and the 1.2 MB dev build to 223 kB. Budgets
  usually name the compressed size, since that's what travels.


  Bytes aren't the whole story. The browser still parses and runs the unzipped 262 kB, so
  a big bundle costs CPU on a phone even when it arrived quickly.


  Next.js splits by route for you: each page loads its own code. `next/dynamic` wraps
  `import()` for a component, with a loading state while it arrives.


  Before adding a package, check its size on a site such as bundlephobia or pkg-size. A
  date or chart library can outweigh your whole app.
