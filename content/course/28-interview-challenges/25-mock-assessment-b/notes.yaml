summary: >-
  The second mock keeps the format, three tasks in ninety minutes scored on hidden tests,
  and adds a line real tests often include: the expected worst-case time complexity. That
  line is a hint, not a threat. O(N) with brackets means a stack. A log with a product of
  N and the largest value means binary search over the answer. O(N) for a "best of the last
  K" recurrence means a sliding-window maximum with a deque.


  The skill the mock trains is letting that line pick the algorithm, then proving the fast
  version right. Each task has a slow version you can trust at a glance: repeatedly delete
  matched pairs, try every limit upwards, look back over all K stones. Those make perfect
  stress-test partners. Write the slow one first when the fast one is uncertain, submit it
  if time runs short, and compare the two on small random inputs when you have both.


  These notes give, for each task, the reasoning from the complexity line to the idea, the
  complete solution, a trace of the example, and the traps; then the stress test that
  checked all three.
remember:
  - The expected complexity names the algorithm; O(N) forbids nested loops over the input, and a log term points at sorting or binary search.
  - Brackets are matched with a stack, because each closing bracket must match the most recent unclosed opening one.
  - Binary search over the answer works when a yes or no check is monotonic, so the smallest limit that passes can be found in logarithmic tries.
  - The greedy check for splitting into K consecutive groups starts a new group only when the next item would overflow the limit.
  - A monotonic deque keeps the maximum of a sliding window at its front; each index enters and leaves once, so the whole pass is O(N).
  - Dynamic programming over "best total ending here" turns a route question into a recurrence; the deque makes each step O(1).
  - Stress tests compare a fast solution with a trusted slow one on many small random inputs and report the first input where they differ.
sections:
  - title: Task 1, where the nesting breaks
    body: |-
      "Properly nested" is defined recursively, but checking it is a scan with a stack.
      Each closing bracket must match the most recent opening bracket still open, and
      "most recent first" is a stack. The task adds positions: return the index of the
      first closing bracket with no match, or N if all closings matched but something is
      still open.

      ```ts
      const OPENER: Record<string, string> = { ')': '(', ']': '[', '}': '{' };

      export function firstBreak(S: string): number {
        const open: string[] = [];
        for (let i = 0; i < S.length; i++) {
          const char = S[i]!;
          const wanted = OPENER[char];
          if (wanted === undefined) {
            open.push(char);
          } else if (open.pop() !== wanted) {
            return i;
          }
        }
        return open.length === 0 ? -1 : S.length;
      }
      ```

      On `"([)()]"`: push `(`, push `[`, then `)` pops `[`, which is the wrong type, so the
      answer is 2. On `"(()"` every closing matches but one `(` is left, so the answer is
      N = 3. `open.pop()` on an empty stack returns `undefined`, which never equals an
      opener, so a closing bracket at index 0 returns 0 without a special case. O(N) time
      and O(N) space.

      Traps the hidden tests use: the empty string (return -1), a single closing bracket,
      `"(]"` where the count is right and the type wrong, and `"())("` where the break at
      index 2 must win over the unclosed tail. A counter instead of a stack passes the
      one-type cases and fails every mixed-type test.
  - title: Task 2, even seasons, and binary search over the answer
    body: |-
      The complexity line, O(N log(N·M)), says: a linear pass, repeated a logarithmic
      number of times over a range of size about N·M. That range is the answer itself:
      the longest season lies between the longest episode and the total.

      The check "can the episodes fit into K seasons of at most `limit` minutes?" is a
      greedy pass: fill a season until the next episode would overflow, then start a new
      one. Greedy is optimal here because ending a season earlier than necessary can never
      reduce the number of seasons needed. The check is also **monotonic**: if a limit
      fits, every larger limit fits. So binary search finds the smallest limit that fits.

      ```ts
      function fits(A: number[], K: number, limit: number): boolean {
        let seasons = 1;
        let current = 0;
        for (const minutes of A) {
          if (current + minutes > limit) {
            seasons += 1;
            current = 0;
          }
          current += minutes;
        }
        return seasons <= K;
      }

      export function largestSeason(K: number, A: number[]): number {
        let low = 0;
        let high = 0;
        for (const minutes of A) {
          low = Math.max(low, minutes);
          high += minutes;
        }
        while (low < high) {
          const middle = Math.floor((low + high) / 2);
          if (fits(A, K, middle)) high = middle;
          else low = middle + 1;
        }
        return low;
      }
      ```

      The search on the example, `K = 3`, `A = [20, 10, 30, 20, 20, 20, 20]`:

      ```text
      low 30 high 140 try 85: fits
      low 30 high 85 try 57: too small
      low 58 high 85 try 71: fits
      low 58 high 71 try 64: fits
      low 58 high 64 try 61: fits
      low 58 high 61 try 59: too small
      low 60 high 61 try 60: fits
      answer 60
      ```

      Starting `low` at the longest episode is what makes `fits` safe: no single episode
      can exceed the limit, so every season holds at least one. The loop keeps the
      invariant "the answer is in [low, high]" and ends when they meet, so there is no
      off-by-one to argue about. Traps: K larger than N (empty seasons are allowed, so the
      answer is the longest episode), all zeros (answer 0) and one dominant episode.
  - title: Task 3, stepping stones, and the sliding-window maximum
    body: |-
      Start with the recurrence. Let `best[i]` be the highest total of a route that ends
      on stone i. You arrive from one of the K stones before it, so `best[i] = A[i] +
      max(best[i-K .. i-1])`, and `best[0] = A[0]`. Computed directly that is O(N·K), five
      billion steps at the limits. The complexity line says O(N), so the window maximum
      must cost O(1) per step.

      A **monotonic deque** does it. Keep indices whose `best` values fall from front to
      back. The front is the window's maximum. Before using it, drop the front if it has
      left the window. After computing `best[i]`, pop from the back every index whose value
      is no better than `best[i]`, since `i` is both newer and at least as good, then push
      `i`.

      ```ts
      export function bestRoute(A: number[], K: number): number {
        const n = A.length;
        const best = new Array<number>(n);
        best[0] = A[0]!;
        const window: number[] = [0];
        let head = 0;
        for (let i = 1; i < n; i++) {
          if (window[head]! < i - K) head += 1;
          best[i] = A[i]! + best[window[head]!]!;
          while (window.length > head && best[window[window.length - 1]!]! <= best[i]!) {
            window.pop();
          }
          window.push(i);
        }
        return best[n - 1]!;
      }
      ```

      The trace for `A = [1, -2, 0, 9, -1, -2]`, `K = 3` (window shown from `head`):

      ```text
      i=1: best -1, window [0,1]
      i=2: best 1, window [2]
      i=3: best 10, window [3]
      i=4: best 9, window [3,4]
      i=5: best 8, window [3,4,5]
      ```

      The answer is `best[5] = 8`, the route 0, 2, 3, 5. An array with a `head` index
      replaces `shift()`, which would be O(N) per call. One expiry per step is enough,
      because the window moves by one index at a time. Traps: all negative stones (the
      route should jump as far as allowed), K at least N (every earlier stone is
      reachable), and duplicates in the window, which the `<=` pop handles.
  - title: The stress test that checked all three
    body: |-
      The brief suggests logging what a `stressTest` finds during Run. Here is one that
      compares each fast solution with its slow version:

      ```ts
      // firstBreakSlow, largestSeasonSlow and bestRouteSlow are the brute-force versions.
      const int = (lo: number, hi: number) => lo + Math.floor(Math.random() * (hi - lo + 1));
      const list = (n: number, lo: number, hi: number) => Array.from({ length: n }, () => int(lo, hi));

      function stressTest(name: string, make: () => unknown[], fast: (...a: any[]) => unknown, slow: (...a: any[]) => unknown, runs = 3000) {
        for (let i = 0; i < runs; i++) {
          const args = make();
          const a = fast(...args);
          const b = slow(...args);
          if (a !== b) return console.log(`${name}: differs on ${JSON.stringify(args)}: fast ${a}, slow ${b}`);
        }
        console.log(`${name}: ${runs} cases agree`);
      }

      stressTest('firstBreak', () => [Array.from({ length: int(0, 8) }, () => '()[]{}'[int(0, 5)]).join('')], firstBreak, firstBreakSlow);
      stressTest('largestSeason', () => [int(1, 5), list(int(1, 8), 0, 9)], largestSeason, largestSeasonSlow);
      stressTest('bestRoute', () => [list(int(1, 9), -5, 5), int(1, 10)], bestRoute, bestRouteSlow);
      ```

      All three agreed on 3,000 cases each. The generators are tuned to hit corners: bracket
      strings up to 8 characters include empty strings and every kind of mismatch; episode
      lengths from 0 to 9 include zeros; K up to 10 on paths up to 9 stones includes K
      larger than N. Remove the harness before submitting.
pitfalls:
  - >-
    **Counting brackets instead of stacking them.** A counter per type accepts `"([)]"`.
    Only a stack checks that the most recent opening bracket matches.
  - >-
    **Returning N when a break comes first.** A mismatch at index i must return i
    immediately, even if brackets would also be left open later.
  - >-
    **Starting the binary search at 0.** With a limit below the longest episode, the
    greedy check puts an oversized episode in a season on its own and reports a fit it
    should not. Start at the longest episode.
  - >-
    **Searching the answer linearly.** Trying every limit upwards is correct and O(N × S),
    which times out when episodes are long. The check is monotonic, so binary search it.
  - >-
    **Using `shift()` for the deque front.** It is O(N) per call in the worst case. Keep a
    head index into an array.
  - >-
    **Initialising the window maximum with 0.** With all-negative stones, 0 is not a real
    route total, and the answer comes out too high. Start from `best[0] = A[0]`.
  - >-
    **Leaving the stress test in the submission.** It slows the run and may print output
    the grader does not expect. Delete it, or keep it outside the submitted function.
interview:
  - question: How do you use the expected complexity line in a timed test?
    answer: >-
      As the first hint to the algorithm. With N up to 100,000, O(N) rules out any nested
      loop over the input and suggests one pass with a stack, a map, two pointers or a
      deque. O(N log N) suggests sorting first or binary search. A log over a value range,
      such as log of N times the largest element, suggests binary search over the answer.
      I read it before planning, write the brute force if the fast idea is not immediate,
      and check that my final solution meets it, because the performance tests are sized so
      that anything slower times out. It is guidance, not proof: I still test correctness
      separately.
  - question: When can you binary search over the answer?
    answer: >-
      When the question is "the smallest value such that something is possible", and
      checking a given value is easier than finding the best one, and the check is
      monotonic: once a value works, every larger value works. For splitting episodes into
      K seasons, "can every season be at most L?" is a greedy O(N) pass, and a larger L can
      only need fewer seasons. So I search L between the longest episode and the total, in
      about thirty tries for totals up to a billion. The whole thing is O(N log S). If the
      check were not monotonic, binary search could skip the true answer.
  - question: Explain the sliding-window maximum with a deque.
    answer: >-
      The deque holds indices whose values decrease from front to back, so the front is the
      maximum of the current window. For each new index I drop the front if it has left the
      window, read the maximum from the front, then pop from the back every index whose
      value is no larger than the new one, because the new index is both more recent and at
      least as good, so the old ones can never be the maximum again. Then I push the new
      index. Each index is pushed and popped at most once, so the pass is O(N) with O(K)
      extra space. I implement it as an array with a head index to avoid O(N) `shift()`.
  - question: What makes a good stress test?
    answer: >-
      A slow reference I trust, a generator that hits the corners, and small sizes. The
      reference should be clearly right by reading, even if it is quadratic or worse,
      such as deleting matched bracket pairs until none are left. The generator should use
      narrow value ranges so duplicates, zeros and equal values appear often, and include
      the smallest sizes, such as an empty string or K larger than N. Inputs should be
      small so the reference is instant and a failing case can be traced by hand. I print
      the first mismatch with its input, fix the bug, and rerun until thousands of cases
      agree.
terms:
  - term: Expected complexity line
    say: A target to worry about later.
    means: A hint that names the algorithm. O(N) forbids nested loops over the input, and a log term
      points at sorting or binary search.
  - term: Balanced brackets
    say: Count the opening and closing brackets.
    means: Counts accept `([)]`. A stack checks that each closer matches the most recent unclosed
      opener, in O(N).
  - term: Binary search over the answer
    say: Binary search needs a sorted array.
    means: "It needs a monotonic check: if a limit passes, every larger limit passes. Then the smallest
      passing limit takes O(log range) checks."
  - term: Monotonic deque
    say: A queue that stays sorted.
    means: A deque of indexes whose values fall from front to back, so the front is the window's
      maximum. Each index enters and leaves once, so a pass is O(N).
  - term: Trusted slow version
    say: The brute force is throwaway code.
    means: A plainly correct slow version is the reference a stress test compares against, and the
      fallback you submit if the fast one isn't ready.
