term: strong customer authentication
aka: [SCA, 3D Secure, 3DS, card challenge]
short: An extra step where the buyer's bank asks them to approve a card payment, often in an app.
explain: |
  In many countries a card number alone isn't enough to pay online. The bank wants proof
  it's really you, so it pops up a challenge: approve in your banking app, or type a code.

  For your code, that means a payment isn't paid or failed straight away. It can sit waiting
  for the buyer's action for minutes, then succeed, fail or be abandoned. So never treat the
  browser's return to your site as payment. Wait for the provider's verified webhook.
analogy: A shop assistant phoning your bank to ask if it's really you before taking a big payment.
usage: Half the failed orders were stuck in strong customer authentication, so the buyer never approved in their banking app.
related: [pci-dss, webhook, authentication, idempotency-key]
level: 3
lessons: [backend.payments]
