term: agent loop
aka:
  - tool loop
  - agentic loop
short: The code that calls a model, runs the tools it asks for, sends back the results and repeats.
explain: |
  A model can't run a tool itself. It replies with a request to call a tool, with arguments,
  and stops. Your code has to do the rest.

  So the loop sends the conversation and checks why the model stopped. It runs each requested tool,
  appends the results and calls again. It ends when the model says it's done, or when the
  loop's own limits say so.

  The limits are the important part. A step cap, a token and cost budget, a timeout and a
  check for repeated identical calls. Without them, one confused run loops until someone
  notices the bill.
analogy: A manager and an assistant passing notes. The assistant asks for a file; the manager fetches it and passes it back.
example:
  language: python
  code: |
    for step in range(MAX_STEPS):
        reply = client.messages.create(model=MODEL, tools=TOOLS, messages=messages)
        messages.append({"role": "assistant", "content": reply.content})
        if reply.stop_reason != "tool_use":
            return reply
        messages.append({"role": "user", "content": run_tools(reply.content)})
    raise StepLimitReached(step)
usage: The agent loop has no step cap, so a tool that keeps failing will retry until the budget runs out.
twin:
  term: agent
  difference: The agent is the whole system that decides its own steps. The agent loop is the plain code inside it that calls the model and runs tools, turn after turn.
