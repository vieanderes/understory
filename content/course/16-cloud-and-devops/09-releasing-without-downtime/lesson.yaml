deepDive: >-
  The releases ran on Docker 28 with Caddy 2.11.4 and k6 in containers, 10 virtual users
  for 15 seconds against a small Node app. Stop, then start: 661 of 3,733 requests failed,
  17.7%. The rate was low because everything ran on one laptop. Blue-green, with Caddy
  pointed at `v2:8080`: we started v3, waited for `/health`, changed the Caddyfile to
  `v3:8080`, ran `caddy reload`, then removed v2. 0 of 4,012 requests failed. A reload is
  graceful: requests already in flight finish on the old config.


  With several instances, a rolling deploy does the same one instance at a time. A proxy
  that looks up its upstreams by DNS may keep dialling a stopped instance for a second or
  so. Caddy's `lb_try_duration` retries such a request on another upstream. A server that
  handles `SIGTERM` helps too: it stops accepting, finishes open requests, then exits.
  That's **draining**. `docker stop` sends `SIGTERM` and waits ten seconds before it kills.


  The `latest` run used Docker 28 with the containerd image store: after two builds with
  the same tag, `docker images notes` listed one image. The first build had no name left.
  In a registry the same thing happens when a push moves the tag. Some registries can make
  tags immutable, which refuses the second push outright.


  A rename in one release fails the same way a drop does. Release 6 asks for `name`, and
  PostgreSQL answers `column "name" does not exist` until release 6 is gone.
