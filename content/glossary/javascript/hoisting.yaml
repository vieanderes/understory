term: hoisting
short: JavaScript setting up every declared name in a scope before it runs a single line there.
explain: |
  You can call a function on line 1 and declare it on line 20. It works. Before a scope
  runs, JavaScript sets up every name declared in it.

  The trap is that names arrive differently. A `function` declaration arrives complete. A
  `var` arrives as `undefined`, so you read a wrong value without an error. A `let` or
  `const` exists but throws if you touch it before its line: the temporal dead zone.
analogy: A teacher reading the register before the lesson. Every name is called, even for pupils who haven't walked in yet.
example:
  language: js
  code: |
    greet(); // works: the declaration arrived first
    console.log(count); // undefined, not an error
    var count = 3;

    function greet() {
      console.log('hi');
    }
usage: That call only works because of hoisting, so move the helper above it.
twin:
  term: temporal-dead-zone
  difference: Hoisting is JavaScript setting up names before the code runs. The temporal dead zone is the stretch where a `let` or `const` name is set up but reading it throws.
related:
  - scope
  - temporal-dead-zone
