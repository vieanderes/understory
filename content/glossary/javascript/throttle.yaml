term: throttle
aka:
  - throttling
short: Letting a function run at most once per set interval, however often something triggers it.
explain: |
  A scroll event can fire sixty times a second. If each one measures the layout, the page
  stutters. Throttling lets one call through, then ignores the rest until the interval
  passes.

  Unlike debounce, it keeps firing during the activity, at a steady pace. Use it for scroll,
  resize and drag, where people want feedback while it's happening.
analogy: A rationed tap. Turn it as often as you like; you get one cup a minute.
usage: Throttle the scroll handler to every 100 ms, since nobody needs sixty position updates a second.
twin:
  term: debounce
  difference: Throttle runs at a steady pace while events keep coming. Debounce stays silent until they stop, then runs once.
related:
  - debounce
level: 2
