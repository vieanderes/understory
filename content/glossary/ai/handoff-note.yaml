term: handoff note
aka: [handover note, session notes]
short: A record of what changed, what failed and the one next action, left for whoever continues the work.
explain: |
  An agent session ends and forgets everything. The next session, or a person, starts from
  zero and repeats the same dead ends.

  A handoff note stops that. It says what changed, what was tried and why it failed, what
  still fails, and the single next step. Write it as files on disk, not in a chat that
  disappears.
analogy: A nurse's notes at shift change. The next nurse knows what was given, and what to watch for.
usage: Leave a handoff note before you stop; tomorrow's session shouldn't retry the migration fix that failed.
related: [context-file, scope-contract, status-update]
level: 2
lessons: [aisys.agent-workbench, agents.agent-as-a-system]
