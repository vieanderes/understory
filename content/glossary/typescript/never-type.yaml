term: never type
aka:
  - never
  - exhaustiveness check
short: The type with no possible values, used to mark code that can't be reached.
explain: |
  After you've checked every case of a union, nothing is left. TypeScript calls what's left
  `never`. A function that always throws returns `never` too.

  The useful trick is the exhaustiveness check. Assign the leftover to a `never` variable in a
  `switch` default. Add a new case to the union later, and that line stops compiling until
  you handle it.
analogy: An empty seat after the last guest has sat down. If somebody's still standing, you've counted wrong.
example:
  language: ts
  code: |
    type Shape = { kind: 'circle'; r: number } | { kind: 'square'; side: number };
    function area(s: Shape): number {
      switch (s.kind) {
        case 'circle': return Math.PI * s.r ** 2;
        case 'square': return s.side ** 2;
        default: {
          const unhandled: never = s;
          return unhandled;
        }
      }
    }
usage: Add a never check to the switch, so a new status breaks the build instead of production.
related:
  - discriminated-union
  - union-type
  - narrowing
level: 3
lessons:
