term: OAuth scope
aka: [ scopes, granted scopes, permission scope ]
short: A named permission an app asks for when a user connects it, such as reading contacts.
explain: |
  An app should get only the access it needs. So it asks for named permissions, such as
  `contacts.read`, and the user sees the list before approving.

  The trap: the user or the provider can grant fewer than you asked for. The API then returns
  less data, with no error. Your sync looks fine and silently misses records. Read the scopes
  in the token reply and compare them with what you need. Say so clearly when one is missing.
analogy: A house-sitter's list. Water the plants and feed the cat, but the study stays locked.
example:
  language: json
  code: |
    {
      "access_token": "at_...",
      "expires_in": 3600,
      "scope": "contacts.read"
    }
usage: The customer granted only contacts.read, so the OAuth scope for deals is missing and they look deleted.
related: [ oauth, access-token, least-privilege ]
level: 3
lessons: [ integrations.tokens-that-expire ]
