id: career.the-offer
title: The offer
objective: Compare offers like for like, and ask for a better one politely, with a specific number and a reason.
level: essential
minutes: 9
concepts: [career.comparing-offers, career.negotiation]
prerequisites: [career.questions-to-ask]
opening:
  text: >-
    You'll compare offers on what they're really worth, and ask for more without risking the
    job. One polite call at this stage can be worth more than a year of raises.

steps:
  - type: prose
    id: whats-in-an-offer
    body: |-
      An offer has more parts than the salary.

      - **Base salary**: paid every month, guaranteed.
      - **Bonus**: extra money, often tied to results, so not guaranteed.
      - **Equity**: shares or options you earn over years, called **vesting**.
      - **Level**: the rung you join on, which sets future pay and scope.
      - Benefits: pension, holiday, learning budget, remote days.

  - type: multiple-choice
    id: pick-offer-part
    concept: career.comparing-offers
    difficulty: 1
    question: Which part of an offer from a young start-up is least certain?
    choices:
      - text: The equity
        correct: true
        feedback: >-
          Yes. Its value depends on a future sale or listing that may never come.
      - text: The base salary
        feedback: >-
          Base is the guaranteed part. It's the safest line in the offer.
      - text: The holiday allowance
        feedback: >-
          Holiday is written into the contract. It doesn't change with the company's luck.

  - type: prose
    id: like-for-like
    body: |-
      Compare offers like for like. Put each part on a yearly basis, and keep the certain
      money apart from the maybe money.

      A one-off sign-on bonus counts once, not every year. Start-up equity is a lottery
      ticket with better odds than most, so value it low. Then weigh what money can't show:
      the level, the team and the work.

  - type: ai-review
    id: review-offer-comparison
    concept: career.comparing-offers
    difficulty: 2
    language: yaml
    request: Lay out my two offers side by side, per year.
    flawClass: logic
    code: |
      offer-a:
        base: 120k a year
        bonus: target 10% of base, paid on company results
        sign-on: 20k, paid once in the first month
        counted-per-year: base, bonus target and sign-on
      offer-b:
        base: 130k a year
        equity: options over four years, private company
        counted-per-year: base, equity at a low guess
    prompt: >-
      The assistant made offer A look better than it is. Tap the line.
    lines: [5]
    reasons:
      - text: A one-off bonus counted every year
        correct: true
        feedback: >-
          Yes. The sign-on is paid once, so leave it out of the yearly figure.
      - text: A bonus target isn't guaranteed money
        feedback: >-
          True, but the line says target. Worth a note, not the main distortion.
      - text: Private options should count as zero
        feedback: >-
          A low guess is a fair way to value them. Zero is the cautious extreme.
    fix: |
      offer-a:
        base: 120k a year
        bonus: target 10% of base, paid on company results
        sign-on: 20k, paid once in the first month
        counted-per-year: base and bonus target; sign-on noted apart
      offer-b:
        base: 130k a year
        equity: options over four years, private company
        counted-per-year: base, equity at a low guess

  - type: prose
    id: asking-for-more
    body: |-
      When the offer arrives, thank them and say you're excited. Ask for it in writing, and
      for a few days to decide. That's normal.

      Then ask for more, once. Give a **specific number** and a reason: market data for the
      level, or another offer. Recruiters expect it, and a polite, reasoned ask rarely
      costs an offer.

  - type: parsons
    id: order-counter-email
    concept: career.negotiation
    difficulty: 2
    prompt: Put a counter-offer email in order.
    language: yaml
    blocks:
      - id: thanks
        code: 'thanks: I loved meeting the team, and I want to make this work'
        subgoal: Warmth
      - id: ask
        code: 'ask: could you bring the base to 140k?'
        subgoal: The ask
      - id: reason
        code: 'reason: that matches the published range for this level here'
      - id: flexible
        code: 'flexible: if base is fixed, a sign-on bonus would close the gap'
        subgoal: Close
      - id: date
        code: 'close: I could confirm by Friday'
    distractors:
      - id: invented
        code: 'reason: another company offered me 20% more (not true, but it helps)'
        feedback: >-
          Never invent an offer. Recruiters ask for it in writing, and trust goes with it.

  - type: ai-review
    id: review-salary-script
    concept: career.negotiation
    difficulty: 3
    language: yaml
    request: Draft a sample answer to "What are your salary expectations?" for a recruiter call.
    flawClass: logic
    code: |
      - Thanks, I'm excited about the role.
      - I'd rather talk numbers once we both know it's a fit.
      - I'm on 95k now, so anything above that works for me.
      - What's the budgeted range for the role?
    prompt: >-
      A sample to review, not a script to learn. It's the first recruiter call. Tap the line
      that costs most.
    lines: [3]
    reasons:
      - text: It anchors them on your old salary
        correct: true
        feedback: >-
          Right. The offer will start from 95k, not from the market range.
      - text: Asking their range is too forward
        feedback: >-
          It's a normal question, and their answer helps you more than yours helps them.
      - text: Delaying numbers sounds evasive
        feedback: >-
          It's a common, polite move. Numbers mean more once they want you.
    fix: |
      - Thanks, I'm excited about the role.
      - I'd rather talk numbers once we both know it's a fit.
      - What's the budgeted range for the role?

  - type: multiple-choice
    id: pick-lever
    concept: career.negotiation
    difficulty: 3
    question: They say base salary is already at the top of the band. What can you still ask for?
    choices:
      - text: A higher level, or a sign-on bonus
        correct: true
        feedback: >-
          Yes. Bands are per level, and one-off money often has its own budget.
      - text: Nothing, the band is final
        feedback: >-
          The band caps base at this level. Other parts of the package often still move.
      - text: A written promise of a raise in a month
        feedback: >-
          Few companies commit to that. A level or a sign-on is a realistic ask.

  - type: explain-back
    id: explain-counter
    concept: career.negotiation
    difficulty: 4
    prompt: >-
      The offer is below what your research says the level pays. Write what you'd say to the
      recruiter, in three sentences.
    rubric:
      - It opens with thanks and real interest in the role.
      - It asks for a specific number, with a reason such as market data.
      - It leaves room to move, such as a sign-on bonus or a higher level.
    modelAnswer: >-
      Use your own words, and check the beats. The first sentence thanks them and says what
      excites you about the role. The second names one figure and where it comes from, such
      as published ranges for the level. The third offers a fallback if base is fixed: a
      sign-on bonus or the level.

recap:
  - Compare offers yearly, with certain money apart from the maybe money.
  - Ask for more once, with a specific number and a reason.
  - Keep your current salary out, and use level and sign-on when base is fixed.
recall:
  - id: card-offer-parts
    concept: career.comparing-offers
    front: What are the main parts of an offer?
    back: >-
      Base salary, bonus, equity with its vesting, level, and benefits.
  - id: card-sign-on
    concept: career.comparing-offers
    front: How does a sign-on bonus count when you compare offers per year?
    back: >-
      Once, not every year. Note it apart from the yearly figure.
  - id: card-counter
    concept: career.negotiation
    front: What makes a counter-offer ask strong?
    back: >-
      Warmth, a specific number, a reason such as market data, and room on other parts.
  - id: card-current-salary
    concept: career.negotiation
    front: Why keep your current salary out of the conversation?
    back: >-
      It anchors the offer on your past pay instead of the market rate for the role.

references:
  - kind: essay
    title: 'Salary Negotiation: Make More Money, Be More Valued'
    authors: Patrick McKenzie
    venue: Kalzumeus
    url: https://www.kalzumeus.com/2012/01/23/salary-negotiation/
    note: The classic long read on negotiating as an engineer, and why it's expected.
    primary: true
    verified: true
  - kind: essay
    title: Ten Rules for Negotiating a Job Offer
    authors: Haseeb Qureshi
    venue: haseebq.com
    url: https://haseebq.com/my-ten-rules-for-negotiating-a-job-offer/
    note: Practical rules for the call and the counter-offer, from a candidate's side.
    verified: true
  - kind: docs
    title: Ten Rules of Negotiation
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/negotiation-rules/
    note: A short checklist for the offer stage, drawn from the rules above.
    verified: true

deepDive: >-
  Rules on pay vary by country and state. Some places ban employers from asking about your
  salary history, and many now require a pay range in the job posting. Look up what applies
  where the job is.


  Equity needs its own questions. For options, ask the strike price, the vesting schedule
  and any cliff (often nothing vests in the first year, then a quarter at once). Ask how
  long you'd have to buy vested options if you leave. For shares in a listed company, value
  them at today's price, and remember it moves.


  Level is the lever people forget. Joining one level higher usually moves your whole pay
  band, your scope and your next promotion. If your interviews went well, it's fair to ask
  whether the loop supports the higher level.
