term: webhook signature
aka: [ signature verification, HMAC signature, signed webhook ]
short: A code computed from a message and a shared secret, proving its sender and that nobody changed it.
explain: |
  Your webhook URL is public. Anyone who finds it can post a fake "payment succeeded". You
  need proof that the request came from the provider.

  The provider computes an HMAC of the raw body with a secret you share. It sends that in a
  header. You compute it again and compare. Use the raw bytes, not re-serialised JSON, and
  compare in constant time. Reject old timestamps, so nobody can replay a captured request.
analogy: A wax seal on a letter. Only the sender has the stamp, and a broken seal shows tampering.
example:
  language: ts
  code: |
    import { createHmac, timingSafeEqual } from 'node:crypto';

    const expected = createHmac('sha256', secret).update(`${timestamp}.${rawBody}`).digest();
    const given = Buffer.from(signatureHex, 'hex');
    if (given.length !== expected.length || !timingSafeEqual(given, expected)) {
      return new Response('bad signature', { status: 401 });
    }
usage: The webhook signature check fails, because we verify the parsed JSON instead of the raw body.
related: [ webhook, hashing, secret ]
level: 3
lessons: [integrations.webhooks-and-polling, backend.webhooks]
