id: css.transitions
title: Transitions and transforms
objective: Move, turn and scale elements, and animate a change smoothly.
level: essential
minutes: 10
concepts: [css.transforms, css.transitions]
prerequisites: [css.typography]
opening:
  text: >-
    You'll make buttons glide and cards lift instead of snapping from one look to the next.
    Small, smooth movement is much of what makes an interface feel finished.

steps:
  - type: prose
    id: transforms
    body: |-
      Some properties change how a box is drawn without moving anything around it:

      ```css
      .card { translate: 0 -4px; }  /* shift it */
      .arrow { rotate: 90deg; }     /* turn it */
      .icon { scale: 1.2; }         /* grow it */
      ```

      The neighbours stay exactly where they were. These are **transforms**. You'll also
      see the older form, `transform: rotate(90deg)`, which does the same.

  - type: playground
    id: turn-the-arrow
    concept: css.transforms
    difficulty: 1
    prompt: >-
      The first question is open, but its arrow still points right. Add a rule for `.open
      .arrow` with `rotate: 90deg;` and watch it point down.
    html: |
      <div class="question open">
        <span class="arrow">›</span> Can I bring my dog?
        <p>Yes, dogs on a lead are welcome in the garden.</p>
      </div>
      <div class="question">
        <span class="arrow">›</span> Is there parking?
      </div>
    css: |
      body { font-family: sans-serif; }
      .question { padding: 12px; border-bottom: 1px solid lightgrey; }
      .arrow {
        display: inline-block;
        font-size: 24px;
        color: teal;
      }
    editable: [css]
    checks:
      - label: The open arrow is turned 90 degrees
        selector: .open .arrow
        style: { property: rotate, value: 90deg }
      - label: The closed arrow still points right
        selector: '.question:not(.open) .arrow'
        style: { property: rotate, value: none }
    solution:
      css: |
        body { font-family: sans-serif; }
        .question { padding: 12px; border-bottom: 1px solid lightgrey; }
        .arrow {
          display: inline-block;
          font-size: 24px;
          color: teal;
        }
        .open .arrow { rotate: 90deg; }
    hints:
      - The selector `.open .arrow` matches only the arrow inside the open question.
      - The property is `rotate`, and angles are written in `deg`.
      - 'Write `.open .arrow { rotate: 90deg; }`.'

  - type: prose
    id: what-a-transition-is
    body: |-
      A change of style normally happens in one frame. A **transition** spreads it over time:

      ```css
      .button { background: teal; transition: background-color 0.3s; }
      .button:hover { background: darkcyan; }
      ```

      `:hover` matches while the pointer is over an element. The transition names the
      property to animate and how long to take, here 0.3 seconds.

  - type: playground
    id: smooth-the-button
    concept: css.transitions
    difficulty: 2
    prompt: >-
      Hover over the button: the colour snaps. Add `transition: background-color 0.3s;` to
      `.button`, then hover again and watch it glide.
    html: |
      <button class="button">Join the club</button>
    css: |
      body { font-family: sans-serif; }
      .button {
        padding: 12px 24px;
        border: 0;
        background: teal;
        color: white;
      }
      .button:hover { background: darkorange; }
    editable: [css]
    checks:
      - label: The background colour is transitioned
        selector: .button
        style: { property: transition-property, value: background-color }
      - label: The transition takes 0.3 seconds
        selector: .button
        style: { property: transition-duration, value: 0.3s }
    solution:
      css: |
        body { font-family: sans-serif; }
        .button {
          padding: 12px 24px;
          border: 0;
          background: teal;
          color: white;
          transition-property: background-color;
          transition-duration: 0.3s;
        }
        .button:hover { background: darkorange; }
    hints:
      - The transition goes on `.button`, not on the `:hover` rule.
      - It names the property first, then the time.
      - 'Add `transition: background-color 0.3s;` inside `.button`.'

  - type: playground
    id: fix-snap-back
    concept: css.transitions
    difficulty: 3
    prompt: >-
      A teammate's button glides to orange, then snaps back to teal. Hover on and off to see
      it. Move the `transition` into `.button`, so it glides both ways.
    html: |
      <button class="button">Book a table</button>
    css: |
      body { font-family: sans-serif; }
      .button {
        padding: 12px 24px;
        border: 0;
        background: teal;
        color: white;
      }
      .button:hover {
        background: darkorange;
        transition: background-color 0.3s;
      }
    editable: [css]
    checks:
      - label: The button itself has the transition
        selector: .button
        style: { property: transition-property, value: background-color }
    solution:
      css: |
        body { font-family: sans-serif; }
        .button {
          padding: 12px 24px;
          border: 0;
          background: teal;
          color: white;
          transition-property: background-color;
          transition-duration: 0.3s;
        }
        .button:hover {
          background: darkorange;
        }
    hints:
      - Off the button, the hover rule stops matching, and its transition goes with it.
      - The transition must live in a rule that always matches.
      - 'Cut `transition: background-color 0.3s;` from `.button:hover` and paste it into `.button`.'

  - type: prose
    id: what-to-animate
    body: >-
      Animate transforms and `opacity` when you can. The browser can move those without
      working out the page's layout again, so they stay smooth on a phone. Animating `width`,
      `height`, `top` or `margin` redoes the layout every frame, and it can stutter.


      Some people feel ill from motion. A media query, `prefers-reduced-motion: reduce`, lets
      you tone it down for them.

  - type: multiple-choice
    id: pick-smooth-lift
    concept: css.transforms
    difficulty: 2
    question: A card should rise 8px on hover. Which declaration animates most smoothly?
    choices:
      - text: '`translate: 0 -8px;`'
        correct: true
        feedback: >-
          Yes. A transform moves the drawing, and nothing needs laying out again.
      - text: '`margin-top: -8px;`'
        feedback: >-
          It works, but a margin moves the layout, so every frame is worked out again.
      - text: '`top: -8px;` on a relative card'
        feedback: >-
          `top` is a layout property too. The browser recalculates it on every frame.

  - type: playground
    id: lift-the-card
    prompt: >-
      Hover over the card and watch it lift. Try the duration at `1s`, then `0.05s`, then
      back to `0.2s`. Then change `-6px` to `-20px` and feel the difference.
    html: |
      <div class="card">
        <h3>Seed swap</h3>
        <p>Saturday, 10am, at the community garden.</p>
      </div>
    css: |
      body { font-family: sans-serif; padding: 24px; }
      .card {
        padding: 16px;
        background: honeydew;
        border: 2px solid darkgreen;
        transition: translate 0.2s;
      }
      .card:hover { translate: 0 -6px; }
    editable: [css]

  - type: explain-back
    id: explain-smooth-lift
    concept: css.transitions
    difficulty: 3
    prompt: >-
      Why does a hover lift built with `translate` feel smoother than one built with
      `margin-top`?
    rubric:
      - A transform changes only how the card is drawn, so nothing around it moves.
      - A margin change moves the layout, so the browser works out the page again every frame.
      - Less work per frame means the animation keeps up, even on a slow phone.
    modelAnswer: >-
      `translate` only moves the card's drawing. Its neighbours don't move, so the browser
      doesn't need to lay out the page again. A `margin-top` change moves the layout itself,
      so every frame of the animation means working out the positions again. On a slow phone
      that extra work shows up as stutter.

recap:
  - Shift, turn and grow elements with `translate`, `rotate` and `scale`.
  - Animate a change with `transition`, on the element's own rule.
  - Pick transforms and `opacity` for smooth motion.

recall:
  - id: card-transform-neighbours
    concept: css.transforms
    front: 'A card gets `translate: 0 -8px`. What happens to the cards around it?'
    back: >-
      Nothing. A transform changes how the card is drawn, not its place in the layout.
  - id: card-transition-parts
    concept: css.transitions
    front: 'What does `transition: background-color 0.3s` say?'
    back: >-
      When `background-color` changes, animate it over 0.3 seconds instead of jumping.
  - id: card-transition-placement
    concept: css.transitions
    front: Why put a transition on `.button` rather than on `.button:hover`?
    back: >-
      On `.button` it applies both ways. On the hover rule it disappears when the hover ends,
      so the change back snaps.
  - id: card-cheap-properties
    concept: css.transforms
    front: Which properties animate most smoothly, and why?
    back: >-
      Transforms and `opacity`. The browser can change them without laying the page out
      again.

references:
  - kind: docs
    title: Using CSS transitions
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Transitions/Using
    note: The transition properties, timing functions and which properties can animate.
    verified: true
  - kind: spec
    title: CSS Transitions Module Level 1
    authors: L. David Baron, Brian Birtles, Dean Jackson
    venue: W3C
    url: https://www.w3.org/TR/css-transitions-1/
    note: When a transition starts, and which rule's transition is used.
    primary: true
    verified: true
  - kind: spec
    title: CSS Transforms Module Level 2
    authors: Tab Atkins Jr., L. David Baron, Simon Fraser, Dean Jackson, Theresa O'Connor
    venue: W3C
    url: https://www.w3.org/TR/css-transforms-2/
    note: The individual `translate`, `rotate` and `scale` properties.
    verified: true

deepDive: >-
  The full shorthand is `transition: property duration timing-function delay`. The timing
  function sets how the change speeds up: `ease` is the default, `linear` is constant, and
  `ease-out` starts fast and settles, which suits things arriving on screen.


  `transition: all 0.3s` animates every property that changes. It's tempting, but it also
  animates changes you didn't mean to, such as a layout property changed by a media query.


  For motion that plays by itself or loops, use `@keyframes` and the `animation` property. A
  transition only runs between two states, when something changes.


  The individual `translate`, `rotate` and `scale` properties always combine in that fixed
  order. Writing them in one `transform` lets you choose the order, which changes the result:
  rotating then moving isn't the same as moving then rotating.
