term: OCR
aka: [optical character recognition, text recognition]
short: Turning a picture of text, such as a scan or photo, into characters a program can read.
explain: |
  A scanned page is only pixels. No program can search it or copy a number out of it until
  something recognises the letters. That step is OCR.

  It often loses layout: columns run together and table cells shift. A born-digital PDF
  already has a text layer, so it doesn't need OCR at all. A multimodal model reading the
  page image is the other route, and keeps the layout better.
analogy: Someone reading a handwritten letter aloud so a typist can type it up.
usage: Only send scans through OCR; the digital PDFs have a text layer we can read for free.
related: [structured-output, multimodal-model]
level: 2
lessons: [aisys.reading-documents]
