term: prefers-reduced-motion
aka: [reduced motion]
short: A media query that reports someone asked their device for less animation.
explain: |
  For some people, big sliding and zooming movement brings on dizziness or nausea. They
  switch on a setting on their device to reduce motion. Your page can read that setting and
  calm down.

  Answer it by removing or replacing motion, not by making it faster. A slide becomes a fade
  or a cut. Small effects that help understanding, like a colour change on hover, can stay.
analogy: Asking the bus driver to take the corners gently. You still arrive, and the trip is calmer.
example:
  language: css
  code: |
    .panel {
      transition: transform 300ms ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .panel {
        transition: opacity 150ms;
      }
    }
usage: The page-turn animation ignores prefers-reduced-motion, so swap it for a fade under that query.
related: [media-query, wcag]
level: 2
lessons: [design.contrast-colour-and-motion]
