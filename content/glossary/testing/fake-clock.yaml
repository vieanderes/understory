term: fake clock
aka:
  - fake timers
  - injected clock
  - mock clock
short: A stand-in for real time that a test moves forward by hand, so timed code runs instantly.
explain: |
  Code that waits is slow to test. A debounce of 300 ms means each test sleeps 300 ms, and
  timing on a busy machine makes tests flaky.

  So the code takes its clock as a parameter instead of calling `Date.now()` or
  `setTimeout` directly. The test passes in a fake one and says "advance 299 ms", then
  "advance 1 ms more". Hundreds of timing cases run in a blink, the same every time.

  The trap is a hidden clock. One stray `Date.now()` inside the code ignores the fake,
  and the test passes for the wrong reason.
analogy: Skipping through a film with the remote. You jump to the scene you want to check.
example:
  language: js
  code: |
    const clock = fakeClock();
    const save = debounce(spy, 300, clock);
    save();
    clock.advance(299);
    expect(spy).not.toHaveBeenCalled();
    clock.advance(1);
    expect(spy).toHaveBeenCalledOnce();
usage: Pass the debounce a fake clock, so the test doesn't sleep for real.
related:
