term: migration
aka: [schema migration, database migration]
short: A versioned script that changes the database structure, run in order on every copy of it.
explain: |
  Your code needs a new column. Your laptop, the test database and production must all get
  it, in the same order, exactly once. A file in the repo that makes the change, plus a tool
  that records which files have run, gives you that.

  On a live database, a change and the code that uses it can't switch at the same instant.
  So risky changes go in steps, called **expand and contract**: add the new column, deploy
  code that writes both, backfill, switch reads, then drop the old one. And never edit a
  migration that has already run somewhere.
analogy: The numbered steps in flat-pack furniture instructions. Everyone who builds the wardrobe follows the same steps, in the same order.
example:
  language: sql
  code: |
    -- 0042_add_display_name.sql
    ALTER TABLE users ADD COLUMN display_name text;
    UPDATE users SET display_name = name WHERE display_name IS NULL;
usage: Split that migration; renaming the column in one step breaks every server still running the old code.
related: [orm, transaction]
level: 1
lessons: [db.migrations]
