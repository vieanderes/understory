term: cold start
aka: [cold starts, warm start]
short: The extra wait when a request needs a fresh instance, which must load the runtime and code first.
explain: |
  A serverless platform shuts down idle copies of your code. The next request has to wait
  while a new one boots: start the runtime, load your code, open connections.

  That can add hundreds of milliseconds, sometimes seconds, and it hits the first visitor
  after a quiet spell. Smaller bundles, fewer imports at the top level and lazy connections
  shorten it. Keeping instances warm costs money, so decide whether the latency matters.
analogy: The first coffee of the morning, while the machine heats up. After that, each cup comes quickly.
usage: The p99 spikes are cold starts; the function loads the whole PDF library before every first request.
related: [serverless, latency, percentile, time-to-first-byte]
level: 2
lessons: [cloud.serverless]
