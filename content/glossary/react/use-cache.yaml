term: use cache
aka: ["'use cache'", cache directive]
short: A directive at the top of a Next.js function or component that keeps its result and reuses it.
explain: |
  A list of categories is the same for every visitor. Running its query on each request
  is wasted work. Mark the function, and the first result is kept and served again.

  With `cacheComponents` turned on, `'use cache'` caches an async function or component,
  keyed by its arguments. Different arguments make different entries. Anything personal,
  such as cookies, can't be read inside, because the result is shared with everyone.
  `cacheLife` sets how long it lives.
analogy: A chef who batch-cooks the soup of the day. Everyone who orders it gets a bowl from the same pot.
example:
  language: ts
  code: |
    import { cacheLife, cacheTag } from 'next/cache';

    export async function getCategories() {
      'use cache';
      cacheLife('hours');
      cacheTag('categories');
      return db.category.findMany();
    }
usage: Add use cache to getCategories, and tag it so the admin form can refresh it.
related: [cache, cache-tag, stale-while-revalidate, incremental-static-regeneration]
level: 3
lessons: [nextserver.caching]
