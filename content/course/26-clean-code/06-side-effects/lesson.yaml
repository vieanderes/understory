id: clean.side-effects
title: Pure core, effects at the edges
objective: Keep decisions in pure functions, push fetching, the clock and page changes to the edges, and avoid hidden shared state.
level: advanced
minutes: 10
concepts: [clean.pure-functions, clean.functional-core, clean.hidden-state]
prerequisites: [clean.errors]
opening:
  text: >-
    You'll split code into a part that decides and a part that does. The deciding part
    becomes simple to check, and bugs stop depending on what happened earlier.

steps:
  - type: prose
    id: pure-functions
    body: |-
      A **side effect** is anything a function does besides handing back its result. It
      changes an outside variable, edits the page, sends a request or reads the clock.

      A **pure function** has none, and its answer depends only on its arguments. This one
      reads a variable from outside, so one price can give two answers:

      ```ts
      let discount = 0.1;
      function priceAfterDiscount(price: number): number {
        return price - price * discount; // hidden input
      }
      ```

      Pass `discount` in as an argument, and the same inputs always give the same output.

  - type: multiple-choice
    id: pick-clock-impure
    concept: clean.pure-functions
    difficulty: 2
    language: ts
    code: |
      function isExpired(expiresAt: number): boolean {
        return expiresAt < Date.now();
      }
    question: Is `isExpired` pure?
    choices:
      - text: No, it reads the clock
        correct: true
        feedback: >-
          Right. The clock is a hidden input, so the answer changes over time.
      - text: Yes, it changes nothing
        feedback: >-
          Changing nothing is half of it. It also has to depend only on its arguments.
      - text: Yes, it only reads its argument
        feedback: >-
          It reads `Date.now()` too. Run it tomorrow and the same call can flip.

  - type: bug-hunt
    id: hunt-gift-wrap
    concept: clean.hidden-state
    difficulty: 3
    language: ts
    code: |
      function withGiftWrap(items: string[]): string[] {
        items.push("Gift wrap");
        return items;
      }

      const basket = ["Mug", "Tea"];
      const preview = withGiftWrap(basket);
    prompt: >-
      A shopper taps "Preview with gift wrap", then closes the preview. Their real basket now
      has gift wrap in it. Tap the line at fault.
    lines: [2]
    reasons:
      - text: It changes the caller's array
        correct: true
        feedback: >-
          Yes. `items` and `basket` are one array, as you saw in JavaScript. Return a copy.
      - text: '`push` returns the new length'
        feedback: >-
          True, but the result of `push` isn't used. The change to the array is the bug.
      - text: The preview should be `let`
        feedback: >-
          `const` is fine. The variable never changes. The array it points to does.
    fix: |
      function withGiftWrap(items: string[]): string[] {
        return [...items, "Gift wrap"];
      }

  - type: prose
    id: functional-core
    body: |-
      Pages still have to read the clock, fetch and change the screen. The trick is where.
      Split the code in two:

      - A **core** of pure functions makes every decision.
      - A thin **shell** around it does the effects, step by step: it gathers the inputs,
        calls the core, and acts on the answer.

      ```ts
      const loans = await loadLoans(); // shell: fetch
      const due = overdue(loans, Date.now()); // core: pure
      showReminders(due); // shell: change the page
      ```

      The logic lives in the core, so that's what you check.

  - type: fill-blank
    id: fill-inject-now
    concept: clean.functional-core
    difficulty: 2
    prompt: Make the core pure. The shell reads the clock and passes it in.
    language: ts
    template: |
      function isOverdue(dueAt: number, {{1}}: number): boolean {
        return dueAt < now;
      }

      const overdue = isOverdue(loan.dueAt, {{2}});
    blanks:
      - key: '1'
        answer: now
      - key: '2'
        answer: Date.now()
    bank: [now, Date.now(), Date, today, dueAt]

  - type: ai-review
    id: review-shared-query
    concept: clean.hidden-state
    difficulty: 4
    language: ts
    request: Search as the user types, and show "Results for ..." above the list.
    flawClass: race
    code: |
      let query = "";

      async function search(text: string) {
        query = text;
        const results = await fetchResults(text);
        heading.textContent = `Results for "${query}"`;
        showResults(results);
      }
    prompt: >-
      An assistant wrote this. Typing slowly works. Type "cat" then "cats" fast, and the
      heading says "cats" above the cat results. Tap the line that shows the wrong word.
    lines: [6]
    reasons:
      - text: A second search changes `query` during the `await`
        correct: true
        feedback: >-
          Exactly. While "cat" waits, the "cats" call overwrites `query`. Use `text` instead.
      - text: '`showResults` runs before the results arrive'
        feedback: >-
          The `await` on line 5 finishes first. The trouble is what changed meanwhile.
      - text: '`textContent` can''t hold quotes'
        feedback: >-
          It can hold any text. The word inside is the problem.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Start two searches, and make the first one answer last
          correct: true
          feedback: >-
            Yes. The overlap is the only time `query` changes mid-wait.
        - text: One slow search for a long word
          feedback: >-
            With one call nothing overwrites `query`, so the heading is right.
        - text: A search for text with quotes in it
          feedback: >-
            `textContent` shows any text safely. Quotes don't touch the shared variable.
    fix: |
      async function search(text: string) {
        const results = await fetchResults(text);
        heading.textContent = `Results for "${text}"`;
        showResults(results);
      }

  - type: code-challenge
    id: write-fees-due
    concept: clean.functional-core
    difficulty: 4
    language: ts
    prompt: >-
      `overdueFees(loans)` reads the clock itself, so nobody can pin "today" to check it.
      Export a pure core, `feesDue(loans, now)`, returning `{ id, fee }` for each
      unreturned, overdue loan. Times are milliseconds, like `Date.now()`.


      The fee is 50 pence per full day late, capped at 1000. Skip returned loans. Don't change
      `loans`, and don't read the clock inside `feesDue`. Keep `overdueFees` as the shell.
    hints:
      - Find the one line that reads the clock. That's the hidden input.
      - Everything else is a decision about the loans, which is the part to make pure.
      - 'Start with `export function feesDue(loans: Loan[], now: number)` and use `now` for the time.'

  - type: explain-back
    id: explain-inject-clock
    concept: clean.pure-functions
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: Why is a function that takes `now` as an argument easier to check than one that calls `Date.now()`?
    rubric:
      - The result depends only on the arguments, so you control every input.
      - You can pick any time, such as exactly one day late, and expect a fixed answer.
      - With `Date.now()` inside, the answer changes with the real time, so checks drift.
    modelAnswer: >-
      With `now` as an argument, I decide what time it is. I can check a loan one day late
      or a year late and expect an exact fee. With `Date.now()` inside, the result depends on
      when I run it, so it can't be pinned.

recap:
  - Write decisions as pure functions that depend only on their arguments.
  - Read the clock, fetch and change the page in a thin shell around the core.
  - Pass state in instead of sharing it in module variables or changing arguments.
recall:
  - id: card-pure
    concept: clean.pure-functions
    front: What two things make a function pure?
    back: >-
      Its result depends only on its arguments, and it changes nothing outside itself.
  - id: card-core-shell
    concept: clean.functional-core
    front: In "core and shell", what does each part do?
    back: >-
      The core makes the decisions with pure functions. The shell reads inputs, calls the
      core, and performs the effects it asked for.
  - id: card-hidden-state
    concept: clean.hidden-state
    front: Why is a shared variable risky in `async` code?
    back: >-
      Calls overlap. One can change the variable while another is paused at an `await`.
  - id: card-mutate-argument
    concept: clean.hidden-state
    front: How do you change prices without changing the caller's array?
    back: >-
      Return a new array, for example `prices.map((price) => price * 1.2)`.

references:
