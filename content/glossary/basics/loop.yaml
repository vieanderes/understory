term: loop
aka: [for loop, while loop]
short: Code that repeats a block, once for each item or until a condition turns false.
explain: |
  Printing ten lines by hand means ten copies of the same code. A loop writes it once and
  repeats it. A `for` loop counts or walks through a list. A `while` loop keeps going while
  a condition stays true.

  Each run is called an iteration. Make sure something changes every time round, or the
  condition never turns false. That's an infinite loop, and the page freezes.
analogy: Laps of a running track. You run the same lap again and again, and stop when you've done enough.
example:
  language: js
  code: |
    const tasks = ["Wash up", "Post letter", "Call home"];
    for (const task of tasks) {
      console.log(task);
    }

    let count = 3;
    while (count > 0) {
      count = count - 1;
    }
usage: Move the total out of the loop, or it starts again at zero on every lap.
twin:
  term: if-statement
  difference: A loop checks its condition again after every run and repeats. An if statement checks once, runs its block at most once, and moves on.
related: [if-statement, off-by-one-error, array, iterable, recursion]
level: 1
lessons: [basics.loops]
