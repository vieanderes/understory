term: partial failure
aka:
  - half-finished operation
  - partial success
short: When some steps of an operation succeed and others fail, leaving things half done.
explain: |
  An order saves, then the email fails. Or the card is charged, then the server crashes
  before it records the order. Neither "it worked" nor "it failed" is true.

  This is the normal case once more than one system is involved. Plan for it. Make each
  step safe to repeat, record progress, and decide which way to recover: finish the rest,
  or undo what happened.

  The nastiest version is a timeout. You don't know whether the other side did the work, so
  a blind retry can do it twice.
analogy: A removal van that leaves with half your furniture. You're neither moved nor still home.
usage: The charge succeeds but the insert fails; that partial failure needs an idempotency key.
related:
  - failure-mode
  - idempotent
  - transaction
  - saga
level: 2
lessons:
  - judgment.what-breaks
