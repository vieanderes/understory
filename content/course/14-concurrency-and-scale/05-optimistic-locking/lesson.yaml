    primary: true
    verified: true

deepDive: >-
  We ran the ticket saves on PostgreSQL 17. Without the version check, Ben's save replaced
  Ana's reply and reported `UPDATE 1`. With it, Ben got `UPDATE 0` and the row kept Ana's
  reply at version 4.


  HTTP has the same idea built in. A server can send the version as an `ETag` header. The
  client sends it back in `If-Match` when it saves, and a stale save gets `412
  Precondition Failed`. Many ORMs offer a version column too, and raise an error when the
  guarded update changes nothing.


  Retrying is right for a program and wrong for a person. A program can re-apply "add the
  label urgent" to any version. A person's edit was a decision about the text they saw, so
  show them the newer text instead of merging for them.


  Locks across machines come up in "Scheduled jobs", as leases. A lease expires on the
  clock, and a paused holder may wake and write after it has lost the lease. The fix is a
  fencing token: a number that rises with each grant, checked by the store on every write.
  That check is a version check in disguise.
