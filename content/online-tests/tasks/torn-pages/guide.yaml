approach: >-
  A simple correct answer marks every page that is left in a boolean array, then lists the
  two unmarked ones. To use no extra space, work with sums instead. The two missing pages
  add up to s, the full sum minus the sum of A. The smaller one is at most s / 2 and the
  larger one is above it, so the missing sum among pages up to s / 2 is the smaller page
  alone.
complexity: O(N) time, O(1) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N up to 100,000**, values distinct, and a time limit of
      300 ms. Sorting would pass, but a linear pass is the clean target.

      Note that **N can be 0**. An empty array is a real input here.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words at the top of the file. Say where the page numbers
      stop: N + 2, not N.
    code:
      ts: |-
        // A holds N distinct pages from 1..N+2; return the two missing ones, smaller first.
      python: |-
        # A holds N distinct pages from 1..N+2; return the two missing ones, smaller first.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - no pages left at all;
      - one page left;
      - page 1 and the last page missing;
      - the two missing pages next to each other.
    input:
      - "[]"
      - "[2]"
      - "[2, 3, 4]"
      - "[1, 4, 2]"
  - kind: plan
    title: Start with the plain, safe idea
    minutes: 1
    body: |-
      Mark every page you see in a boolean array of size N + 3. Then walk from 1 to N + 2
      and collect the two unmarked pages. They come out in order, so no sorting.

      It is O(N) time and O(N) space. That already passes every test.
  - kind: write
    title: Write the marking version yourself
    minutes: 3
    body: |-
      Type it yourself: it is six lines. A version that is correct and fast earns full
      marks, so bank it before you try anything clever.
    code:
      ts: |-
        // A holds N distinct pages from 1..N+2; return the two missing ones, smaller first.
        // Mark the pages that are left, then collect the unmarked ones: O(N) time, O(N) space.
        function solution(A: number[]): number[] {
            const n = A.length + 2;
            const seen = new Array<boolean>(n + 1).fill(false);
            for (const page of A) seen[page] = true;
            const missing: number[] = [];
            for (let page = 1; page <= n; page++) if (!seen[page]) missing.push(page);
            return missing;
        }
      python: |-
        # A holds N distinct pages from 1..N+2; return the two missing ones, smaller first.
        # Mark the pages that are left, then collect the unmarked ones: O(N) time, O(N) space.
        def solution(A):
            n = len(A) + 2
            seen = [False] * (n + 1)
            for page in A:
                seen[page] = True
            return [page for page in range(1, n + 1) if not seen[page]]
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Check each of your cases against
      the rule: two numbers, smaller first.
    expect: >-
      Three OKs, then [1, 2], [1, 3], [1, 5] and [3, 5].
  - kind: ask-ai
    title: Check the no-extra-space idea before coding it
    minutes: 1
    body: |-
      Interviewers often follow up with "can you do it without the array?". Ask the
      assistant to confirm your key claim, not to write the code. That keeps the idea
      yours.
    prompt: >-
      Two distinct missing numbers from 1..N+2 add up to s. Is it true that exactly one of
      them is at most floor(s / 2)? Yes or no, with one sentence of why. Do not write code.
    expect: Yes. The smaller one is at most s / 2, and the larger one is above it.
  - kind: plan
    title: Split the missing sum at s / 2
    minutes: 2
    body: |-
      First find s: the sum of 1..N+2 minus the sum of A. Then add up only the pages in A
      that are at most s / 2, and subtract that from the sum of 1..s/2.

      What is left is the smaller missing page. The larger is s minus it.
  - kind: optimise
    title: Write the constant-space version
    minutes: 4
    body: |-
      Type it yourself. Sums reach about 5,000,000,000, which is safe for JavaScript numbers
      and Python integers alike. Run your edge cases again: they must match the marking
      version.
    code:
      ts: |-
        // A holds N distinct pages from 1..N+2; return the two missing ones, smaller first.
        // Sums split at the pivot s / 2 give each page: O(N) time, O(1) extra space.
        function solution(A: number[]): number[] {
          // The two missing numbers sum to s. The smaller is at most s / 2 and the larger is above
          // it, so the missing sum below that pivot is the smaller one alone. Two passes, O(N).
          const n = A.length + 2;
          let present = 0;
          for (const page of A) present += page;
          const s = (n * (n + 1)) / 2 - present;
          const pivot = Math.floor(s / 2);
          let below = 0;
          for (const page of A) if (page <= pivot) below += page;
          const smaller = (pivot * (pivot + 1)) / 2 - below;
          return [smaller, s - smaller];
        }
      python: |-
        # A holds N distinct pages from 1..N+2; return the two missing ones, smaller first.
        # Sums split at the pivot s // 2 give each page: O(N) time, O(1) extra space.
        def solution(A):
            # The two missing numbers sum to s. The smaller is at most s // 2 and the larger is above
            # it, so the missing sum below that pivot is the smaller one alone. Two passes, O(N).
            n = len(A) + 2
            s = n * (n + 1) // 2 - sum(A)
            pivot = s // 2
            below = sum(page for page in A if page <= pivot)
            smaller = pivot * (pivot + 1) // 2 - below
            return [smaller, s - smaller]
    codeMode: full
  - kind: ai-writes
    title: Let the assistant write a large-value input
    minutes: 2
    body: |-
      You want one case where the missing pages are far apart and near the top. Let the
      assistant produce the line. Check it yourself: distinct values, all within 1..N+2.
    prompt: >-
      Give me one test input line in the format [3, 1, 6, 4]: the numbers 1 to 22 in
      shuffled order with 9 and 22 removed. The line only, no answer and no code.
    expect: One line of 20 numbers. Your function returns [9, 22].
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours. Integer division and the empty array
      are what to check.
    prompt: >-
      Review my current solution for correctness on an empty array, integer division, and
      overflow. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time and O(1) extra space.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output. Check the header comment states the complexity. Then submit.

      Both versions would score 100%. The second one is the answer to the follow-up
      question.
