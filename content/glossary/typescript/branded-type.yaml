term: branded type
aka: [brand, branded types, nominal type, opaque type]
short: A primitive type tagged with a marker, so values that share a primitive can't be swapped.
explain: |
  A `userId` and an `orderId` are both strings. TypeScript will happily let you pass one
  where the other belongs. A brand adds a type-only tag that makes them different.

  The tag exists only in the types, so it costs nothing at run time. Create branded values
  in one place, usually a parsing function, so every value carrying the brand was checked.
analogy: Colour-coded keys. Same blank metal, but the red one never goes in the blue lock.
example:
  language: ts
  code: |
    type UserId = string & { readonly __brand: 'UserId' };
    type OrderId = string & { readonly __brand: 'OrderId' };
    declare function cancel(id: OrderId): void;
    cancel(userId); // error: UserId is not OrderId
usage: Make the amounts a branded type, so pence can't be passed where pounds are expected.
related: [structural-typing, type-alias, type-assertion]
level: 3
lessons: [pro.typescript]
