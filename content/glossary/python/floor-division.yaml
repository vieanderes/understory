term: floor division
aka: [integer division, "//"]
short: Dividing and rounding down to a whole number, written with two slashes in Python.
explain: |
  Python has two divisions. `/` always gives a float, even for `6 / 3`, which returns `2.0`.
  Feed that to `range` or use it as an index and you get a `TypeError`.

  `//` rounds down to a whole number, and `%` gives what's left over. "Down" means towards
  minus infinity, so `-7 // 2` is `-4`, not `-3`. For rounding up, as in a page count, write
  `-(-total // size)`. Pick by the answer you need: `/` for a measurement, `//` for a count.
analogy: Packing eggs into boxes of six. Thirteen eggs fill two whole boxes; the leftover egg is the remainder.
example:
  language: python
  code: |
    7 / 2     # 3.5
    7 // 2    # 3
    7 % 2     # 1
    -7 // 2   # -4
    pages = -(-total // per_page)
usage: Use floor division for the page number, because range won't take the float that a single slash gives you.
related: [floating-point, operator, off-by-one-error]
level: 1
lessons: [python.decisions-and-loops]
