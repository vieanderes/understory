term: custom property
aka:
  - CSS variable
  - CSS custom property
short: A value you name in CSS, starting with two dashes, and reuse with var().
explain: |
  The brand colour appears in forty rules. Change it and you edit forty places, and miss
  one. You need a name for it.

  Declare `--accent: teal;` and read it with `var(--accent)`. Unlike a preprocessor
  variable, it lives in the browser: it inherits down the tree. One rule can change it for a whole subtree, which is how dark mode and themes work. It can't be used inside
  a media query condition, a common surprise.
analogy: A thermostat setting. Change the number on the wall and every radiator in that room follows.
example:
  language: css
  code: |
    :root { --accent: teal; --space: 8px; }

    .button {
      background: var(--accent);
      padding: var(--space) calc(var(--space) * 2);
    }
    .danger { --accent: crimson; }
usage: Read the colour from a custom property, so the dark theme can swap it in one place.
related:
  - cascade
  - design-token
level: 2
