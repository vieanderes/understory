term: minimal reproduction
aka:
  - minimal repro
  - repro
short: The smallest code and steps that still show a bug, with nothing else in the way.
explain: |
  "It doesn't work" in a 5,000-line app gets no answers. Cut away everything the bug doesn't
  need: other components, real data, unrelated config. Stop when removing anything more
  makes the bug vanish.

  Half the time, you find the cause while cutting. The other half, you have a question
  anyone can run in a minute. Here's the code, I expected this, I got that.
analogy: Showing the mechanic exactly which noise, at which speed, instead of saying the car sounds funny sometimes.
usage: Can you post a minimal reproduction? I can't run the whole app to see the error.
related:
  - code-review
level: 2
lessons:
  - explain.asking-for-help
