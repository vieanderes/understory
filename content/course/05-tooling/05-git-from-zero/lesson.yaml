    note: '`git status`, `git add`, the staging area, `.gitignore` and `git commit`, step by step.'
    primary: true
    verified: true
  - kind: docs
    title: gitignore
    authors: The Git project
    venue: Git reference manual
    url: https://git-scm.com/docs/gitignore
    note: The pattern rules, and why a file Git already tracks isn't affected.
    primary: true
    verified: true
  - kind: docs
