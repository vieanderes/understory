summary: >-
  A technical decision is explained when someone else can check it. That takes five parts,
  in order: the question, the **options** you compared, the **criteria** that matter for this
  team and this system, how each option did against them, and the recommendation with the
  trade-off you accept. A sixth part makes it durable: **what would change your mind**, the
  signal that should reopen the decision.


  Without the options and criteria, a recommendation is a preference, and people can only
  agree or disagree with you as a person. With them, they can disagree with something
  specific: "deploy speed matters more than you weighted it", or "you missed an option". That
  disagreement is useful, and it happens before the code exists, when changing course is
  cheap.


  The last part does two jobs. It shows the decision rests on evidence, not on taste. And it
  replaces endless re-arguing with a clear trigger: when exports pass 10 seconds, or when a
  second team owns notifications, look again. You'll use this shape in team discussions,
  design reviews, pull requests that change structure, and interviews that ask "monolith or
  services?"
remember:
  - Explain a decision with the question, the options, the criteria, how each option did, and the recommendation.
  - Criteria come from this team and this system, such as team size, deploy rhythm and cost, not from what large companies do.
  - Name the trade-off you accept, because a decision with no cost named looks unweighed.
  - End with what would change your mind, as a signal someone can watch, such as a response time crossing a number.
  - Saying what would reverse a decision builds trust, because it shows the call rests on evidence.
  - A claim in a decision, such as "services are faster", needs a measurement behind it, or it should go.
  - Fit the explanation to the listener, in the costs and risks they care about, while keeping the same reasoning.
sections:
  - title: Choosing criteria that decide something
    body: |-
      Criteria are where most decision explanations go wrong. Three tests catch the weak
      ones.

      **Does it tell the options apart?** "Reliable" is a criterion everyone wants and both
      options claim. "One deploy a week from three developers" separates a monolith from a
      fleet of services at once.

      **Is it about this situation?** "Scales to millions of users" matters for some systems
      and not for a school timetable with 900 users. Criteria borrowed from much bigger
      companies tend to pick their architecture for you.

      **Can someone check it?** "Page response under 300 ms at the morning peak" can be
      measured. "Fast" can't. A measurable criterion also makes the tripwire quick to write
      later.

      Write the scoring as short facts, not adjectives:

      ```text
      option             deploys   new failure modes          running cost
      modular monolith   1 unit    none                       current
      split service      2 units   network hop, partial fail  one more host
      ```

      Then state the weighting in a sentence: "With three developers, deploys and running
      cost matter most." That sentence is usually where a reviewer pushes back, which is
      exactly what you want. If two options come out close, say so. Close options mean the
      decision is cheap to get slightly wrong, and the trade-off is the real conversation.
  - title: Writing a tripwire
    body: |-
      "What would change my mind" works only if someone can notice it happening. Compare:

      ```yaml
      reopen if: things change a lot
      reopen if: we outgrow it
      reopen if: a typical export passes 10 seconds
      reopen if: notification fixes wait on the weekly release twice in a month
      ```

      The first two are mood. Nobody will ever agree that things have changed a lot. The last
      two are tripwires: specific, observable, and tied to the criteria the decision used.
      They answer three questions. What signal? Measured where? Crossing what line?

      A good tripwire usually mirrors the trade-off you accepted. You kept exports inside the
      request and accepted that a big export ties up a worker. So the tripwire watches export
      time. You kept notifications in the monolith and accepted that their fixes wait for a
      release. So the tripwire watches waiting fixes.

      Put the signal where someone already looks: a dashboard panel, an alert, an item in a
      monthly review. A tripwire nobody checks is the vague version with extra steps.

      When a tripwire fires, the decision isn't automatically reversed. It's reopened, with
      new evidence, using the same options and criteria. Often the answer is still the same,
      and now everyone knows why.
  - title: Same decision, different listeners
    body: |-
      The reasoning stays the same for every listener. The vocabulary and the detail change.

      For a **reviewer** or another engineer, give the full structure: options, criteria
      with the weighting, the scoring, the recommendation, the trade-off and the tripwire.
      They'll want to check the criteria and may add an option.

      For a **non-technical** decision-maker, such as a head teacher or a product owner,
      translate each criterion into what it costs or risks for them. "One more deployable
      unit" becomes "more to run and pay for, and one more thing that can break". The
      trade-off becomes something they'll notice: "a change to the texts waits for the weekly
      update". Keep the tripwire, phrased as a request: "If you ever need daily changes, tell
      us and we'll look again."

      For an **interviewer**, the structure is the answer. They care less about which option
      you pick than about whether you named the options, chose criteria from the scenario,
      and said what would change your mind. "It depends" is weak on its own; "it depends on
      team size and deploy rhythm, and here's my call for this team" is strong.

      Later lessons cover writing the decision down as a record and a one-page design doc,
      and telling different audiences about the same change.
pitfalls:
  - '**Leading with the recommendation and no options.** It sounds like a preference, so people argue with you instead of with the reasoning. Show what you compared first.'
  - '**Borrowing criteria from much bigger teams.** What suits hundreds of engineers says little about three. Take criteria from your own team, load and deploy rhythm.'
  - '**Claims without measurements.** "Services make it faster" is often false, since a split adds a network hop. Measure where the time goes, or drop the claim.'
  - '**Hiding the trade-off.** Every option costs something. A decision note that names no cost looks unweighed, and the cost surprises people later.'
  - '**A vague "reopen if".** "If things change" never fires. Name a signal, where it''s measured and the line it must cross.'
verify:
  - lens: confuses
    check: Check each criterion tells the options apart and comes from this team or system, not from what large companies do.
  - lens: tests
    check: Find the measurement behind every speed, cost or reliability claim in the decision, and drop any claim that has none.
  - lens: breaks
    check: Write the tripwire as a signal, where it's measured and the line it crosses, and confirm someone already looks at that signal.
  - lens: scales
    check: Ask what the decision looks like at ten times the users or twice the team, and say whether that would reopen it.
interview:
  - question: Should this system be a monolith or microservices?
    answer: >-
      I'd answer with the structure rather than a slogan. The options are a monolith, a
      modular monolith with enforced boundaries, and separate services. The criteria come
      from the scenario: team size, how often parts need to deploy independently, load
      differences between parts, and how much operational work the team can carry. For a
      small team with one deploy rhythm, I'd recommend a modular monolith. Services add
      network latency, partial failure and versioning for little gain at that size. The
      trade-off is that every module ships together. I'd reopen it if one part needed to
      deploy daily while the rest shipped weekly, if one part's load needed scaling alone,
      or if a separate team took ownership of it.
  - question: Tell me about a technical decision you disagreed with. How did you handle it?
    answer: >-
      I'd pick a real case and show I argued with the reasoning, not the person. For example,
      a proposal to cache every page for five minutes. I asked which criteria mattered and
      offered a second option: caching only the catalogue pages. I put both against the same
      criteria, page speed and how stale prices could be, and measured where the time
      actually went. The measurement showed most time was in two slow queries, so we fixed
      those and cached less. When a call goes the other way, I commit to it and ask what
      would make us revisit. That turns disagreement into a tripwire everyone accepts.
  - question: How do you explain a technical trade-off to a non-technical stakeholder?
    answer: >-
      Point first, in their terms, with the trade-off they'll actually feel. I'd say what we
      recommend, then the alternative, then why, translated into cost, risk and speed of
      change. "We'll keep one app, not two. Two would mean more to run, more to pay for and
      more that can break, for a team of three. The cost is that changes to texts wait for
      the weekly update." Then I'd hand them the tripwire as a request: "If you need daily
      changes, tell us and we'll look again." I'd skip mechanism unless asked. The trade-off
      is precision, but the decision and its cost stay honest.
