term: webhook
aka: [ webhooks, HTTP callback, web hook ]
short: An HTTP request another system sends to your URL the moment something happens there.
explain: |
  To learn that a payment cleared, you could ask the provider every minute. Or the provider
  could tell you. You give it a URL, and it posts an event there when something changes.

  Delivery is never guaranteed. Events arrive late, twice, out of order, or not at all. So
  verify the signature, answer `200` quickly and do the work in a queue. Make the handler
  idempotent. Run a regular reconciliation to catch what went missing.
analogy: A doorbell. You don't keep opening the door to check; it rings when someone's there.
example:
  language: http
  code: |
    POST /webhooks/payments HTTP/1.1
    Content-Type: application/json
    Signature: t=1760000000,v1=5257a8...

    {"id":"evt_81","type":"payment.succeeded","data":{"id":"pay_42"}}
usage: The webhook fires twice for the same refund, so the handler must check the event id first.
twin:
  term: polling
  difference: With a webhook the other system calls you when something changes. With polling you call it on a schedule and ask whether anything has.
related: [ polling, webhook-signature, idempotent, data-reconciliation, queue ]
level: 2
lessons: [integrations.webhooks-and-polling, backend.webhooks]
