summary: >-
  The terminal is a window for text, and the shell is the program inside it that turns each
  line you type into a program run. It splits the line into words, expands the special
  characters, finds the program and starts it with those words as its arguments. Every tool in
  this chapter, from Node to npm to Git, is a program the shell starts this way.


  Most surprises at the prompt come from the shell rewriting your line before the program sees
  it. A space splits an argument in two, a `*` turns into a list of file names, a `~` becomes
  your home folder, and quotes decide which of those happen. Once you know the order the shell
  does this in, commands stop being magic words and start being predictable.


  The other half is place. The shell always stands in one folder, and every relative path is
  read from there. Most "No such file or directory" errors are a path read from the wrong
  folder, not a missing file.
remember:
  - The shell rewrites your line before any program runs, so the program only ever sees the finished list of arguments.
  - Unquoted spaces split arguments, so a name with a space needs quotes or a backslash.
  - Single quotes keep every character literal, while double quotes still expand `$VARIABLE` and `$(command)` but stop word splitting and globbing.
  - A glob such as `*.txt` is expanded by the shell into matching file names, and in bash a pattern that matches nothing is passed on as the literal text.
  - The shell finds a program by searching the folders listed in `PATH`, in order, and reports exit code 127 when it finds none.
  - '`cd` is built into the shell, because a child process can never change its parent''s working directory.'
  - A relative path starts from the working directory, and `pwd` tells you where that is.
  - A variable is only passed to programs you start if it's exported, or set on the same line as the command.
sections:
  - title: What the shell does to your line
    body: |-
      Before a program starts, the shell works through your line in a fixed order. In bash it
      goes like this:

      1. Brace expansion: `{draft,final}.md` becomes `draft.md final.md`.
      2. Tilde, variable and command substitution, left to right: `~` becomes your home
         folder, `$name` becomes its value and `$(date +%Y)` becomes the command's output.
      3. Word splitting: the results of step 2 that weren't in double quotes are split on
         spaces, tabs and newlines.
      4. Globbing: words with `*`, `?` or `[...]` are replaced by the file names they match.
      5. Quote removal: the quotes you typed are stripped, and the words go to the program.

      Here it is in a folder holding `old notes.txt`, `shop.txt` and `todo.txt`. The command
      `printf '[%s]\n'` prints each argument it gets in brackets on its own line, which makes
      the argument list visible:

      ```text
      $ name="old notes.txt"
      $ printf '[%s]\n' $name
      [old]
      [notes.txt]
      $ printf '[%s]\n' "$name"
      [old notes.txt]
      $ printf '[%s]\n' *.txt
      [old notes.txt]
      [shop.txt]
      [todo.txt]
      $ printf '[%s]\n' '*.txt' "~" ~
      [*.txt]
      [~]
      [/Users/sam]
      $ printf '[%s]\n' {draft,final}.md
      [draft.md]
      [final.md]
      ```

      Two details matter in practice. Globbing happens after splitting, so a file name with a
      space that comes out of `*.txt` stays one argument. And `~` is only expanded when it's
      unquoted and at the start of a word, which is why `"~/notes.txt"` looks for a folder
      literally named `~`.

      This is why `rm *.log` is dangerous in the wrong folder: `rm` never sees the star. It
      receives a list of names the shell already chose.
  - title: Quoting, and where bash and zsh differ
    body: |-
      There are three ways to stop the shell from treating a character as special:

      - **Single quotes** keep everything inside literal. `'$HOME'` is five characters, not
        your home folder. You can't put a single quote inside single quotes.
      - **Double quotes** still expand `$name`, `$(command)` and a backslash before `$`, `"`
        or `\`, but they turn off word splitting and globbing. Use them around almost every
        variable.
      - **A backslash** protects the next character only: `holiday\ photos`.

      The safe habit in scripts is to write `"$name"` every time. It costs nothing when the
      value has no spaces and saves you when it does.

      A Mac uses zsh as its default login shell, and zsh differs from bash in two ways you'll
      meet:

      ```text
      $ name="old notes.txt"
      $ printf '[%s]\n' $name        # zsh doesn't split variables
      [old notes.txt]
      $ echo *.pdf                   # and a glob with no match is an error
      zsh: no matches found: *.pdf
      ```

      In bash the first command would print two arguments, and `echo *.pdf` would print the
      text `*.pdf` unchanged. Scripts usually start with `#!/bin/bash` or `#!/bin/sh`, so they
      run under bash rules even on a Mac. Quote your variables and you're correct in both.
      Tools that print commands for you, including AI assistants, often forget quotes, so read
      any command with a variable or a space in it before you run it.
  - title: How the shell finds and starts a program
    body: |-
      When the first word isn't built into the shell, the shell looks for a file with that name
      in each folder listed in the `PATH` variable, left to right, and runs the first match.
      `type` shows what a name resolves to:

      ```text
      $ type cd
      cd is a shell builtin
      $ type ls
      ls is /bin/ls
      $ echo $PATH
      /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      ```

      Yours probably holds more folders. Installers such as Homebrew and nvm add their own folders to
      the front, which is how their version of a tool wins over the system one.

      If nothing matches you get `command not found` and exit code 127. If the file exists but
      isn't marked as executable you get `permission denied` and exit code 126. That's why a
      script you wrote runs with `bash show.sh` but needs `chmod +x show.sh` before
      `./show.sh` works. The `./` matters too: the current folder is not in `PATH`, so `show.sh`
      on its own isn't found.

      Starting a program means the shell creates a **child process**, a separate running copy,
      and has it run the program with your arguments. The shell waits, and the child's exit
      code comes back as `$?`.

      This explains why `cd` must be built in. Each process has its own working directory. A
      child can change its own, but never its parent's. A `cd` program would move itself, exit,
      and leave you where you were:

      ```text
      $ pwd
      /Users/sam
      $ bash -c 'cd /; pwd'
      /
      $ pwd
      /Users/sam
      ```

      The same rule covers `export`, `source` and anything else that changes the shell itself.
  - title: Variables and what child programs see
    body: |-
      A shell variable lives in the shell. A program you start only receives the variables
      that are **exported** into its environment, the set of named text values every process
      gets at start-up. You'll read that set from Node as `process.env` later in this chapter.

      ```text
      $ COLOUR=blue
      $ bash -c 'echo "child sees: [$COLOUR]"'
      child sees: []
      $ export COLOUR
      $ bash -c 'echo "child sees: [$COLOUR]"'
      child sees: [blue]
      $ COLOUR=red bash -c 'echo "child sees: [$COLOUR]"'
      child sees: [red]
      ```

      The last form sets a variable for one command only, without changing the shell's own
      value. It's the usual way to pass a setting such as `PORT=8080` to a server.

      Inside the single quotes the child shell expands `$COLOUR` itself, which is why the
      quotes are single: with double quotes the outer shell would expand it first.

      A file such as `~/.zshrc` or `~/.bashrc` runs each time an interactive shell starts.
      That's where `export PATH=...` lines and aliases go, and why a change there only shows
      up in a new terminal window, or after `source ~/.zshrc`.
pitfalls:
  - '**Leaving variables unquoted in scripts.** `rm $file` with `file="old notes.txt"` tries to delete `old` and `notes.txt` in bash. Write `"$file"` around every variable unless you want splitting.'
  - '**Quoting the tilde.** `cd "~/projects"` looks for a folder named `~`. Leave `~` outside the quotes, as in `cd ~/"my projects"`, or use `"$HOME/my projects"`.'
  - '**Trusting a glob in an unknown folder.** `rm *.html` deletes whatever matches where you stand. Run `pwd` and `ls *.html` first, which shows exactly the list `rm` would get.'
  - '**Running a script by name alone.** `show.sh` gives `command not found` because the current folder isn''t in `PATH`. Use `./show.sh` after `chmod +x show.sh`, or run `bash show.sh`.'
  - '**Expecting a script to move your shell.** A script that runs `cd build` changes folder in its own child process and then exits. Your prompt stays put. To change the current shell, run the `cd` yourself or `source` the script.'
interview:
  - question: What happens between typing a command and pressing Enter, and the program running?
    answer: >-
      The shell parses the line, expands it into a list of words, finds the program and starts
      it as a child process with those words as arguments. Expansion runs in a fixed order:
      braces, then tilde, variables and command substitution, then word splitting of unquoted
      results, then globbing, then quote removal. If the first word is a builtin such as `cd`
      the shell handles it itself. Otherwise it searches each folder in `PATH` for an
      executable with that name. The child runs, the shell waits, and the child's exit code
      becomes `$?`. The practical consequence is that programs never see quotes or wildcards.
      `rm *.log` receives a finished list of names, so the program can't protect you from a
      glob that matched more than you meant.
  - question: What's the difference between single and double quotes in the shell?
    answer: >-
      Single quotes make everything literal, while double quotes still allow variable and
      command substitution. `'$HOME'` passes those five characters. `"$HOME"` passes the path,
      as one argument even if it contains spaces, because double quotes turn off word
      splitting and globbing. So the rule in scripts is to put double quotes around every
      variable, and single quotes around text that must reach a program unchanged, such as a
      `grep` pattern containing `$` or a JavaScript snippet for `node -e`. The trade-off shows
      when you need both: you can't nest a single quote inside single quotes, so you close the
      quote, add an escaped quote and reopen, or switch to double quotes and escape the `$`.
  - question: Why is `cd` a shell builtin rather than a separate program?
    answer: >-
      Because a process can only change its own working directory, never its parent's. If
      `cd` were a program, the shell would start it as a child, the child would change folder
      and exit, and the shell would stay exactly where it was. The same reasoning makes
      `export`, `source` and `exit` builtins: they all change the state of the shell itself.
      It also explains a common surprise in scripts. Running `./setup.sh` that contains
      `cd build` doesn't move your terminal, because the script ran in a child shell. If you
      want a script to change the current shell, you run it with `source setup.sh`, at the cost
      of letting it change anything else in your session too.
  - question: A teammate says a command works on their machine but yours says "command not found". How do you debug it?
    answer: >-
      I check how the name resolves on each machine, because "command not found" means no
      folder in `PATH` holds an executable with that name. `type toolname` shows what it
      resolves to on their machine, and `echo $PATH` shows where mine looks. Usually the tool
      is installed somewhere my `PATH` doesn't include, or installed per project, such as a
      package in `node_modules/.bin`, which npm adds to `PATH` only inside `npm run`. The fix
      is to run it through the project's scripts or `npx`, or add the folder to `PATH` in my
      shell start-up file. Exit code 126 instead would mean the file exists but isn't
      executable, which `chmod +x` fixes.
