    verified: true

deepDive: >-
  A text field matches `:focus-visible` even after a mouse click, because typing needs a
  caret you can find. Buttons and links don't, which is the case most people test.


  A positive `tabindex` puts an element ahead of everything at 0, in its own queue. One
  `tabindex="1"` on a search box sends the first Tab there from anywhere on the page. That's
  why the advice is never.


  The Tab path is only for controls. Screen reader users move through text with their own
  keys, such as H for the next heading, so adding `tabindex="0"` to paragraphs makes the page
  slower for everyone.


  On a Mac, Safari reaches only text fields with Tab until you turn on "Press Tab to
  highlight each item" in its settings, or use Option+Tab. Test in Chrome or Firefox first.
