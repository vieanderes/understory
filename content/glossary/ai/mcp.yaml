term: MCP
aka:
  - Model Context Protocol
short: An open standard that lets one server offer tools and data to any compatible AI app.
explain: |
  Without a shared standard, every app wires up every tool its own way. With this protocol,
  you write a server once. It lists its tools, resources and prompt templates, and any
  compatible client can use them.

  The convenience is also the risk. A tool's description goes straight into the model's
  context, so a server you didn't write can carry instructions. Scope each tool to least
  privilege, validate every argument, and treat descriptions from others as untrusted input.
analogy: A standard lens mount. Any lens built for it fits any camera that has it. Great, until someone sells a lens that scratches the sensor.
usage: Wrap the ticket API as an MCP server, so the coding agent and the chat app share one tool.
related:
