term: frequency count
aka: [counting array, count map, tally, frequency table]
short: A record of how many times each value appears, built in one pass over the data.
explain: |
  Instead of comparing every pair, walk the list once and count. Then duplicates, missing
  values, anagrams and the most common item are all quick lookups.

  Use a `Map` from value to count for anything. When values are small whole numbers in a
  known range, an array indexed by value is faster and leaner, because it skips hashing.
analogy: Tally marks on a whiteboard during a class vote, instead of re-counting hands for every pair of names.
example:
  language: ts
  code: |
    const counts = new Map<string, number>();
    for (const w of words) counts.set(w, (counts.get(w) ?? 0) + 1);
usage: Build a frequency count of both strings; they're anagrams if the counts match.
related: [hash-map, majority-element, time-complexity]
level: 2
lessons: [algo.counting-and-leaders]
