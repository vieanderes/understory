summary: >-
  This lesson covers the control flow every script needs: choosing a path with `if`, `elif`
  and `else`, repeating with `for` and `while`, and doing arithmetic that gives the type you
  expect. The ideas match JavaScript. Three details don't, and each causes real bugs when
  JavaScript habits leak into Python.


  First, **truthiness**: Python treats every empty container as false, so `if results:`
  means "is there anything in it?", where JavaScript would say yes to an empty array.
  Second, **`for` walks items, not indexes**: it asks an object for its items one by one,
  and `range` supplies numbers when you need to count. Third, **there are two divisions**:
  `/` always gives a float and `//` rounds down to a whole number, which matters the moment
  a result feeds `range`, an index or a page count.


  Reach for `if not items:` to test for "empty", and `is None` to test for "missing". Use
  `for` over the collection itself rather than over its indexes. And pick the division by
  the answer you need: `/` for a measurement, `//` and `%` for counts and remainders.
remember:
  - '`False`, `None`, zero of any number type, `""` and every empty container count as false, and everything else counts as true.'
  - Test for a missing value with `is None`, because `if not value:` also treats `0` and `""` as missing.
  - A `for` loop calls `iter()` on the object and then `next()` until `StopIteration`, so it works on anything iterable.
  - '`range(start, stop, step)` includes the start, excludes the stop, and is a lazy sequence that stores only those three numbers.'
  - '`/` always returns a float, `//` rounds down towards minus infinity, and `%` takes the sign of the divisor.'
  - Python integers never overflow, while floats are the same 64-bit doubles JavaScript uses, with the same rounding errors.
  - Ceiling division on integers is `-(-a // b)` or `(a + b - 1) // b`, which stays exact where `math.ceil(a / b)` can drift on huge numbers.
sections:
  - title: What "counts as true" means underneath
    body: |-
      When a value appears in a condition, Python calls `bool()` on it. `bool()` asks the
      object's type. If the type defines `__bool__`, that answers. Otherwise, if it defines
      `__len__`, a length of zero means false. A type with neither is always true.

      ```python
      class Cart:
          def __init__(self, items):
              self.items = items

          def __len__(self):
              return len(self.items)

      print(bool(Cart([])))          # False: length 0
      print(bool(Cart(["tea"])))     # True
      print(bool(0.0), bool(0j))     # False False: zero of every number type
      print(bool("0"), bool(" "))    # True True: non-empty text
      ```

      That's why the rule is so regular: lists, dicts, sets, strings, tuples and `range`
      objects all define a length, so all of them are false when empty. JavaScript has a
      short fixed list of falsy values instead, and objects are always truthy, which is why
      `[]` and `{}` are true there. Note that `"0"` is true in both languages, since it's a
      non-empty string.

      `and` and `or` short-circuit and return one of their operands, as `&&` and `||` do.
      So `name or "guest"` gives a default. Python has no `??` operator, so there's no
      short spelling of "default only when `None`". When `0` or `""` is a valid value,
      write it out:

      ```python
      def delivery_days(requested):
          # requested or 3 would turn a real 0 (same-day) into 3
          return 3 if requested is None else requested

      print(delivery_days(None))   # 3
      print(delivery_days(0))      # 0
      ```

      Comparisons chain, and that includes `==` and `in`. `x in items == True` means
      `(x in items) and (items == True)`, which is always `False` for a list. Write
      `if x in items:` and let the condition stand on its own.
  - title: How a for loop works
    body: |-
      A Python `for` loop has no counter. It follows the **iteration protocol**: call
      `iter()` on the object to get an iterator, then call `next()` on that iterator until
      it raises `StopIteration`. Here's the loop written out by hand:

      ```python
      letters = "cat"
      it = iter(letters)
      while True:
          try:
              letter = next(it)
          except StopIteration:
              break
          print(letter)
      ```

      This is JavaScript's `for...of` and `Symbol.iterator` under different names:
      `next()` there returns `{ value, done }`, while Python raises an exception to say
      "done". Python has nothing like `for...in` over property names; a `for` over a dict
      walks its keys, as lesson 5 shows.

      Strings, lists, tuples, dicts, sets, files and `range` are all iterable, so one loop
      shape works for all of them. An iterator is used up after one pass, which matters
      once you meet files and generators.

      `range` is not a list. It's a lazy sequence that stores only start, stop and step and
      works out each number on demand. So `range(10**12)` costs almost no memory, and
      `len`, indexing and `in` are all instant, because they're arithmetic:

      ```python
      r = range(0, 10, 3)
      print(list(r))                         # [0, 3, 6, 9]
      print(len(r), r[-1], 6 in r, 7 in r)   # 4 9 True False
      print(len(range(10**12)))              # 1000000000000
      print(list(range(5, 0, -1)))           # [5, 4, 3, 2, 1]
      ```

      A negative step counts down, and the stop is still excluded. When you need the index
      and the item together, don't write `range(len(items))`. `enumerate(items)` gives both,
      and `zip` walks two sequences side by side. Lesson 8 covers them.
  - title: Loops with else, and while
    body: |-
      A `for` or `while` loop can end with an `else` block. It runs only when the loop ends
      without `break`. Read it as "no break". It replaces the flag variable you'd set in
      JavaScript to remember whether a search found anything.

      ```python
      def first_overdue(tickets):
          for ticket_id, days_open in tickets:
              if days_open > 7:
                  print(f"Overdue: {ticket_id}")
                  break
          else:
              print("Nothing overdue")

      first_overdue([("T-1", 2), ("T-2", 9), ("T-3", 12)])  # Overdue: T-2
      first_overdue([("T-1", 2)])                           # Nothing overdue
      ```

      Use it sparingly. Many readers misread `else` as "if the loop was empty". Inside a
      function, a `return` in the loop and a final `return` after it often reads better.
      The `any()` built-in, from lesson 8, covers the common "is there at least one?" case
      in one call.

      `while` works as in JavaScript, and it's the right loop when you don't know the
      count in advance: retrying a request, reading until a sentinel, polling. Python has
      no `do...while`. The idiom is `while True:` with a `break` where the condition is
      met. `continue` skips to the next pass in both loop kinds.

      A `while` loop is where infinite loops come from, so make sure every pass moves
      towards the exit. For retries, bound the attempts with `for attempt in range(3):`
      instead, and the loop can't run forever.
  - title: Integers, floats and the two divisions
    body: |-
      Python has separate types for whole numbers and decimals. An `int` has **arbitrary
      precision**: it grows as large as memory allows and never overflows. A `float` is an
      IEEE 754 64-bit double, exactly like every JavaScript `number`, so it has the same
      rounding errors.

      ```python
      print(2**53 + 1)             # 9007199254740993, exact
      print(0.1 + 0.2)             # 0.30000000000000004
      print(0.1 + 0.2 == 0.3)      # False

      import math
      print(math.isclose(0.1 + 0.2, 0.3))    # True

      from decimal import Decimal
      print(Decimal("0.1") + Decimal("0.2"))  # 0.3
      ```

      In JavaScript, `2**53 + 1` rounds to `9007199254740992`, which is why JS has a
      separate `BigInt`. In Python, big IDs, timestamps in nanoseconds and exact
      factorials need nothing special. For money, store integer cents or use `Decimal`
      built from strings, never from floats.

      `//` rounds towards minus infinity, and `%` is defined to match, so
      `a == (a // b) * b + a % b` always holds. The remainder takes the divisor's sign.
      JavaScript's `%` takes the sign of the dividend instead, so the two languages
      disagree on negative numbers:

      ```python
      import math

      print(-7 // 2, -7 % 2)     # -4 1  (JavaScript: -7 % 2 is -1)
      print(divmod(-7, 2))       # (-4, 1)
      print(int(-3.7))           # -3: int() truncates towards zero
      print(7 // 2.0)            # 3.0: a float in gives a float out

      big = 10**17 + 1
      print(math.ceil(big / 1))  # 100000000000000000, wrong: / went through a float
      print(-(-big // 1))        # 100000000000000001, exact
      ```

      Python's `%` is the one you want for wrapping around, such as a weekday index or a
      round-robin worker: `-1 % 7` is `6`, never negative. For ceiling division, the
      batch counting in this lesson, the integer-only forms stay exact at any size.
pitfalls:
  - '**`if value:` when zero is valid.** A quantity of `0` or an empty string is treated as missing. Test with `if value is None:` when you mean "not provided".'
  - '**`value or default` for numbers.** `limit or 10` replaces a real `0` with `10`. Write `10 if limit is None else limit`.'
  - '**Feeding `/` into `range` or an index.** `range(9 / 2)` fails, because `/` always gives a float. Use `//` wherever the result must be whole.'
  - '**Off-by-one with `range`.** `range(1, 7)` stops at 6. To include the end, add one: `range(1, n + 1)`.'
  - '**`range(len(items))` loops.** They work but hide intent and invite index bugs. Loop over the items, or use `enumerate` when the position matters too.'
  - '**Comparing floats with `==`.** `0.1 + 0.2 == 0.3` is `False`. Use `math.isclose`, or integer cents and `Decimal` for money.'
  - '**Porting a JavaScript `%` on negatives.** Python gives `-7 % 2 == 1`, JavaScript gives `-1`. Check any modulo code that can see negative numbers when you translate it.'
interview:
  - question: Which values are falsy in Python, and how does that differ from JavaScript?
    answer: >-
      In Python, `False`, `None`, zero of any numeric type, and anything empty are falsy:
      `""`, `[]`, `{}`, `set()`, `()` and `range(0)`. Under the hood `bool()` calls the
      object's `__bool__`, falling back to `__len__`, so any container with a length of
      zero is false, including your own classes. JavaScript's list is fixed and treats all
      objects as truthy, so an empty array or object is true there. The practical
      consequence is that `if items:` is the idiomatic emptiness check in Python. The trap
      is using truthiness for "missing": `if not quantity:` also catches a real `0`, so
      when zero or an empty string is a legitimate value I test `is None` explicitly.
  - question: How does a Python `for` loop work under the hood?
    answer: >-
      It uses the iteration protocol. The loop calls `iter()` on the object, which returns
      an iterator, then calls `next()` on it repeatedly and binds each result to the loop
      variable. When `next()` raises `StopIteration`, the loop ends and the exception is
      swallowed. Any object that implements `__iter__` can be looped over, which is why
      one syntax covers lists, strings, dicts, files and generators. It maps directly onto
      JavaScript's `for...of` with `Symbol.iterator`, except JS signals the end with
      `done: true` instead of an exception. One consequence: an iterator is consumed once,
      so looping over the same generator twice gives nothing the second time. If I need
      several passes, I keep the data in a list.
  - question: What's the difference between `/`, `//` and `%` in Python, and what is `-7 // 2`?
    answer: >-
      `/` is true division and always returns a float, `//` is floor division, and `%` is
      the matching remainder. `-7 // 2` is `-4`, because floor division rounds towards
      minus infinity, not towards zero, and `-7 % 2` is `1`, so `(a // b) * b + a % b ==
      a` always holds. JavaScript's `%` truncates, giving `-1`, so modulo code on negative
      numbers doesn't port directly. I use `//` wherever a result feeds `range`, an index
      or a count of pages or batches, since `/` would give a float. For ceiling division I
      write `-(-a // b)`, which stays exact on big integers where `math.ceil(a / b)`
      detours through a float.
  - question: Why don't Python integers overflow, and what does that cost?
    answer: >-
      A Python `int` is an arbitrary-precision object: CPython stores it as an array of
      digits that grows as needed, so `2**100` or a 20-digit order ID is exact. JavaScript
      numbers are 64-bit doubles and lose precision past `2**53`, which is why JS added
      `BigInt`. The cost is speed and memory. Every int is a heap object with a header, and
      arithmetic on large values is slower than a single machine instruction. For heavy
      numeric work that's why you use numpy, which stores fixed-width machine integers in
      contiguous arrays and can overflow like C. Floats in Python are ordinary 64-bit
      doubles, so `0.1 + 0.2` is still `0.30000000000000004`, and money wants integer cents
      or `Decimal`.
