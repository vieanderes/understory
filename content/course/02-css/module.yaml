id: css
number: 2
title: CSS
summary: How a page gets its look. Colours, spacing, layout and motion, written as rules the browser applies, tried live on real pages.
why: "HTML says what things are and CSS says how they look. Almost every screen you build needs both, and layout bugs are among the ones you'll fix most."
youCanBuild: "A responsive page with a nav bar, a card grid, and a light and a dark theme."
lab: box-model-explorer
concepts:
  - id: css.rules
    title: Rules and declarations
    summary: "A rule is a selector and a block of declarations. Each declaration sets one property to a value, such as `color: teal`."
  - id: css.class-selectors
    title: Class selectors
    summary: "A class selector, written with a dot, such as `.sale`, styles only the elements that carry that class in their HTML."
  - id: css.everyday-properties
    title: Everyday properties
    summary: "`color`, `background`, `border`, `padding` and `text-align` set how text and boxes look."
  - id: css.cascade
    title: The cascade
    summary: When several rules set the same property on one element, the cascade picks one. The more specific selector wins, and a later rule breaks a tie.
    confusableWith: [css.specificity, css.inheritance]
  - id: css.specificity
    title: Specificity
    summary: Specificity ranks selectors. An ID beats any number of classes, and a class beats any number of element names.
    confusableWith: [css.cascade, css.cascade-layers]
  - id: css.inheritance
    title: Inheritance
    summary: Some properties, such as `color` and `font-family`, pass from a parent to its children when no rule sets them on the child.
    confusableWith: [css.cascade]
  - id: css.box-model
    title: The box model
    summary: Every element is a box. Content sits in the middle, then padding, then a border, then margin on the outside.
  - id: css.box-sizing
    title: box-sizing
    summary: "By default `width` sets the content alone, so padding and border are added on top. `box-sizing: border-box` makes `width` include them."
  - id: css.margin-collapse
    title: Margin collapsing
    summary: When two vertical margins touch, they merge into one margin, the size of the larger.
  - id: css.normal-flow
    title: Normal flow
    summary: Without other layout rules, block boxes stack down the page and inline boxes run along lines inside them.
    confusableWith: [css.display]
  - id: css.display
    title: The display property
    summary: "`display` sets how a box takes part in layout: `block`, `inline`, `inline-block`, `flex`, `grid`, or `none` to remove it."
    confusableWith: [css.normal-flow]
  - id: css.overflow
    title: Overflow
    summary: "Content bigger than its box spills out by default. `overflow` can clip it or give the box a scroll bar instead."
  - id: css.flexbox
    title: Flexbox
    summary: "`display: flex` lines a container's children up in a row or a column, then spaces and aligns them."
    confusableWith: [css.grid]
  - id: css.flex-axes
    title: Main and cross axis
    summary: "`justify-content` spreads items along the main axis, the direction the items run, and `align-items` lines them up across it."
  - id: css.flex-sizing
    title: Sizing flex items
    summary: "`flex: 1` lets an item take the spare space, and `min-width: 0` lets it shrink narrower than its content."
  - id: css.grid
    title: Grid
    summary: Grid layout places items in rows and columns at the same time, on tracks that the container defines.
    confusableWith: [css.flexbox]
  - id: css.grid-tracks
    title: Tracks and the fr unit
    summary: A track is a row or a column, and an `fr` unit takes a share of the space left after the fixed tracks.
  - id: css.grid-areas
    title: Grid areas
    summary: "`grid-template-areas` draws the layout as named areas, and `grid-area` puts an element in one of them."
  - id: css.grid-auto-placement
    title: Auto-placement
    summary: Items with no set position fill the next free cells, row by row, and the grid adds rows as it needs them.
  - id: css.containing-block
    title: Containing block
    summary: "An absolutely positioned box measures `top`, `right` and friends from its containing block: its nearest ancestor with a `position` other than `static`."
  - id: css.positioning
    title: Positioning
    summary: "`position` moves a box out of the normal flow: `relative` nudges it, `absolute` places it, `fixed` pins it to the window and `sticky` sticks it while scrolling."
  - id: css.stacking-context
    title: Stacking contexts
    summary: A stacking context is a group of boxes painted as one layer, and `z-index` only orders boxes inside the same group.
  - id: css.relative-units
    title: Relative units
    summary: "`rem` follows the root font size, `em` the element's own font size, `%` the parent, and `vw` the width of the viewport."
  - id: css.media-queries
    title: Media queries
    summary: A media query applies rules only when the viewport matches a condition, such as a minimum width.
    confusableWith: [css.container-queries]
  - id: css.container-queries
    title: Container queries
    summary: A container query applies rules when a containing element, not the viewport, matches a size condition.
    confusableWith: [css.media-queries]
  - id: css.fluid-sizing
    title: Fluid sizing with clamp()
    summary: "`clamp(min, preferred, max)` lets a value grow with the viewport between two fixed limits."
  - id: css.custom-properties
    title: Custom properties
    summary: "A custom property, such as `--brand: teal`, names a value once. `var(--brand)` reads it on that element and everything inside it."
    confusableWith: [css.theming]
  - id: css.theming
    title: Themes
    summary: A theme redefines a few custom properties under one selector, and every rule that reads them follows.
    confusableWith: [css.custom-properties]
  - id: css.text-styling
    title: Styling text
    summary: "`font-family` lists typefaces in order of preference, with a generic family last. `font-size` and `font-weight` set size and boldness."
  - id: css.measure-and-scale
    title: Measure and line height
    summary: Measure is the length of a line of text, and line height is the distance from one line to the next. Both decide how easy text is to read.
  - id: css.font-loading
    title: Font loading
    summary: "A web font must download before it draws text. `font-display: swap` shows a fallback first, and text can move when the web font arrives."
  - id: css.transforms
    title: Transforms
    summary: "`translate`, `rotate` and `scale` move, turn or resize how a box is drawn, and nothing around it moves."
    confusableWith: [css.transitions]
  - id: css.transitions
    title: Transitions
    summary: A transition animates a property from its old value to its new one over a set time, instead of jumping.
    confusableWith: [css.transforms]
  - id: css.page-layout
    title: Page layout
    summary: A page combines layouts. Grid shapes the page and the card lists, flex lines up the rows inside them, and media queries adapt both.
  - id: css.cascade-layers
    title: Cascade layers
    summary: "`@layer` groups rules so that, for normal declarations, a later layer beats an earlier one whatever the specificity."
    confusableWith: [css.specificity]
  - id: css.nesting-and-has
    title: Nesting and :has()
    summary: Nesting writes a rule inside its parent's block, and `:has()` matches an element by what it contains.
  - id: css.logical-properties
    title: Logical properties
    summary: Properties such as `margin-inline-start` follow the writing direction, so one rule serves left-to-right and right-to-left text.
