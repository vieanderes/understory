term: definition of done
aka: [DoD, done criteria]
short: A checkable condition, written before work starts, that says when a task counts as finished.
explain: |
  "Done" means different things to different people. For one it's "the code is written",
  for another "it's in production and monitored". Disagreements about that waste days.

  Write the condition down first, in terms a check can confirm: "`pnpm check` exits 0 and
  the new test passes". Then nobody, person or agent, can call it done early.
analogy: A recipe saying "bake until a skewer comes out clean", not "bake until it looks ready".
usage: Our definition of done includes the e2e spec for the screen, not only the unit tests.
related: [verification-gate, scope-contract, non-goal]
level: 2
lessons: [aisys.agent-workbench]
