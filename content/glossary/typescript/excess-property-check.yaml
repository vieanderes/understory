term: excess property check
aka:
  - excess property checking
short: An error for an object written in place that has a property its target type doesn't list.
explain: |
  Pass `{ colour: 'red', sise: 2 }` to a function wanting `{ colour: string; size?: number }`
  and TypeScript complains about `sise`. A fresh object with an unknown property is almost
  always a typo.

  The check applies only to an object literal written straight into a typed spot. Put the
  same object in a variable first and pass that, and the extra property is allowed, because
  structural typing takes over.
analogy: A form that rejects a field it doesn't have a box for. Hand in a letter instead, and nobody checks the extra lines.
example:
  language: ts
  code: |
    type Options = { colour: string; size?: number };
    function draw(o: Options) {}
    draw({ colour: 'red', sise: 2 }); // error: typo caught
    const opts = { colour: 'red', sise: 2 };
    draw(opts); // no error
usage: The excess property check would catch that typo if you passed the object inline.
twin:
  term: structural-typing
  difference: The excess property check rejects unknown properties, but only on a fresh object literal. Structural typing is the general rule, and it ignores extras.
related:
  - structural-typing
level: 3
lessons:
  - ts.structural-typing
