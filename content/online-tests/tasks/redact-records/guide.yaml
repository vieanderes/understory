approach: >-
  Two regular-expression passes per line, in the order the statement gives. Pass 1 finds a
  run of local-part characters, an @ and a run of domain characters, trims the full stops
  at the end of the domain, and replaces the address only if the domain still has a full
  stop and does not start with one. Pass 2 finds each longest digit run with single spaces
  or hyphens inside, notes whether a + sits right before it, counts its digits and decides:
  8 to 15 after a + is a phone, exactly 16 without one is a card, anything else stays.
complexity: O(total length of L) time and space
steps:
  - kind: read
    title: Read the rules as a specification
    minutes: 3
    body: |-
      This task is a specification, and the tests check every sentence of it. Read the two
      passes slowly and note the **order**: emails first, then numbers on the result.

      Then list what must stay: years, order numbers, a national phone number without a +,
      and 15 or 17 digits.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Name both passes and the three outcomes of pass 2.
    code:
      ts: |-
        // Pass 1: valid emails -> [EMAIL]. Pass 2: +8..15 digits -> [PHONE], 16 digits -> [CARD], others kept.
      python: |-
        # Pass 1: valid emails -> [EMAIL]. Pass 2: +8..15 digits -> [PHONE], 16 digits -> [CARD], others kept.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 3
    body: |-
      Write down the inputs most likely to break a quick solution:

      - an address followed by a full stop, and one that is not an address;
      - 15, 16 and 17 digits;
      - a card number after a +;
      - two spaces inside a number, which splits it;
      - digits inside an email address.
    input:
      - "[\"End: q@w.uk...\", \"user@localhost\", \"me@.com\"]"
      - "[\"411111111111111\", \"4111111111111111\", \"41111111111111111\"]"
      - "[\"+4111111111111111\", \"+1-555-0100\", \"+1234567\"]"
      - "[\"4111 1111  1111 1111\", \"4111-1111 1111-1111\"]"
      - "[\"4000000000000002@pay.example.com\"]"
  - kind: ask-ai
    title: Ask for the number pattern, then check it yourself
    minutes: 2
    body: |-
      Writing the digit-run pattern is a fair job to delegate, but you must check it against
      the rule. Ask for the pattern only, with the + as an optional group.
    prompt: >-
      Give me one regular expression, valid in both JavaScript and Python, that matches an
      optional "+" as group 1, then as group 2 a longest run of ASCII digits where two digits
      may be separated by one space or one hyphen. The pattern only, no code.
    expect: >-
      Something like (\+?)([0-9](?:[ -]?[0-9])*). Check it: two spaces end the run, and a
      separator must sit between two digits.
  - kind: write
    title: Write both passes yourself
    minutes: 8
    body: |-
      Use a replace with a callback for each pass, so the decision is ordinary code you can
      read. Count digits after removing the separators.
    code:
      ts: |-
        // Pass 1: valid emails -> [EMAIL]. Pass 2: +8..15 digits -> [PHONE], 16 digits -> [CARD], others kept.
        function solution(L: string[]): string[] {
          // Emails go first, so the digits inside an address are never read as a phone or a card.
          const EMAIL = /[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+/g;
          // One digit, then digits each after at most one space or hyphen: a longest run.
          const NUMBER = /(\+?)([0-9](?:[ -]?[0-9])*)/g;
          return L.map((line) => {
            const pass1 = line.replace(EMAIL, (match) => {
              const at = match.indexOf('@');
              const raw = match.slice(at + 1);
              const domain = raw.replace(/\.+$/, '');
              const trailing = raw.slice(domain.length);
              if (domain.includes('.') && !domain.startsWith('.')) return '[EMAIL]' + trailing;
              return match;
            });
            return pass1.replace(NUMBER, (match, plus: string, digits: string) => {
              const count = digits.replace(/[ -]/g, '').length;
              if (plus === '+') return count >= 8 && count <= 15 ? '[PHONE]' : match;
              return count === 16 ? '[CARD]' : match;
            });
          });
        }
      python: |-
        # Pass 1: valid emails -> [EMAIL]. Pass 2: +8..15 digits -> [PHONE], 16 digits -> [CARD], others kept.
        import re

        # Emails go first, so the digits inside an address are never read as a phone or a card.
        EMAIL = re.compile(r'[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+')
        # One digit, then digits each after at most one space or hyphen: a longest run.
        NUMBER = re.compile(r'(\+?)([0-9](?:[ -]?[0-9])*)')


        def redact_email(match):
            text = match.group(0)
            raw = text[text.index('@') + 1:]
            domain = raw.rstrip('.')
            trailing = raw[len(domain):]
            if '.' in domain and not domain.startswith('.'):
                return '[EMAIL]' + trailing
            return text


        def redact_number(match):
            plus, digits = match.group(1), match.group(2)
            count = len(digits.replace(' ', '').replace('-', ''))
            if plus == '+':
                return '[PHONE]' if 8 <= count <= 15 else match.group(0)
            return '[CARD]' if count == 16 else match.group(0)


        def solution(L):
            return [NUMBER.sub(redact_number, EMAIL.sub(redact_email, line)) for line in L]
    codeMode: full
  - kind: run
    title: Run the example and your cases
    minutes: 2
    body: |-
      Press **Run code**. The example must say OK. Check every line of your cases against
      the rules, not against what looks right.
    expect: >-
      OK on the example. Then ["End: [EMAIL]...", "user@localhost", "me@.com"], only the
      16-digit line becomes [CARD], ["+4111111111111111", "[PHONE]", "+1234567"],
      ["4111 1111  1111 1111", "[CARD]"] and ["[EMAIL]"].
  - kind: ai-writes
    title: Let the assistant write tricky lines
    minutes: 2
    body: |-
      Realistic messages full of numbers are slow to invent. Ask for input only; you decide
      each expected result from the rules.
    prompt: >-
      Give me one test input line in the format ["first line", "second line"] with 5 short
      support messages that mix dates, order numbers, prices, phone numbers with and without
      a leading +, card numbers in groups and email addresses at the end of sentences. The
      line only, no answer and no code.
    expect: >-
      One line. Every replacement in your output follows a rule you can name, and every
      date and order number is untouched.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution against these rules: trailing full stops are not part of
      the domain, a + must sit directly before a phone number, a run after a + is never a
      card, and only one space or hyphen joins digits. List any problems in one line each.
      Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
