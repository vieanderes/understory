    note: Why crossing out starts at p squared, the cost, and memory-saving variants.
    verified: true
  - kind: docs
    title: Euclidean algorithm for computing the greatest common divisor
    authors: cp-algorithms contributors
    venue: Algorithms for Competitive Programming
    url: https://cp-algorithms.com/algebra/euclid-algorithm.html
    note: The proof, the logarithmic bound and lcm.
    verified: true

deepDive: >-
  **Primes up to n: the sieve.** Keep one flag per number. Walk `p` upwards; if `p` isn't
  crossed out, it's prime, so cross out `p * p`, `p * p + p` and so on. Smaller multiples
  were crossed out by smaller primes already. It's O(n log log n), close to one pass, and a
  `Uint8Array(n + 1)` keeps 10 million flags in 10 MB. Store the smallest prime that
  claims each number, and any number up to n factorises in O(log n).


  **Greatest common divisor.** The gcd of two numbers is the largest number dividing both.
  Euclid's rule: `gcd(a, b) = gcd(b, a % b)`, until `b` is 0. It takes O(log min(a, b))
  steps. The least common multiple is `a / gcd(a, b) * b`: dividing first keeps the middle
  value small, where `a * b` might pass 2^53.


  **"Answer mod 1,000,000,007".** Contest-style tasks ask for this so answers fit. Take `%`
  after every addition and product, not at the end. Two values under that modulus still
  multiply past 2^53, so do the product in BigInt. Subtraction can go negative: add the
  modulus back before the final `%`.


  **Python.** Integers never overflow, and `%` takes the sign of the right side, so
  `-1 % 3` is `2`. Integer division is `//`, which rounds down, even for negatives.
