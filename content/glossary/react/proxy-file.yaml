term: proxy file
aka: [ proxy.ts, Next.js middleware, middleware.ts ]
short: Code that runs before a request reaches any page, and can redirect, rewrite or answer it.
explain: |
  Some decisions apply to many pages at once. Send signed-out visitors to the login page; pick
  a language from a header. Writing that in every page repeats it.

  Next.js 16 calls this file `proxy.ts`; older versions called it `middleware.ts`. It sees
  each matching request first. Use it as a quick first filter, never as the only check. The
  page or action behind it still checks permissions itself, in case a request slips past.
analogy: A receptionist who points you to the right floor. The doors upstairs still need your key card.
example:
  language: ts
  code: |
    // proxy.ts
    import { NextResponse, type NextRequest } from 'next/server';

    export function proxy(request: NextRequest) {
      if (!request.cookies.has('session')) {
        return NextResponse.redirect(new URL('/login', request.url));
      }
    }
    export const config = { matcher: ['/account/:path*'] };
usage: The proxy file redirects guests, but the account page must still check the session itself.
related: [ route-handler, authentication, session, load-balancer ]
level: 3
lessons: [ nextserver.route-handlers ]
