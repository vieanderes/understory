term: bottom line up front
aka:
  - BLUF
  - TL;DR
  - point first
short: Opening any message with its main point or request, so details follow for those who want them.
explain: |
  Most people read the first two lines and stop. If your conclusion sits in paragraph three,
  they never see it.

  So put the decision, the answer or the ask first. "We should delay launch by a week, because
  load tests fail at twice today's traffic." Then the reasons, then the detail.

  It feels abrupt to write and reads as respect. The listener can place every detail that
  follows, and can stop as soon as they have what they need.
analogy: A newspaper headline. You know the story before you choose whether to read it.
usage: Put the bottom line up front; the reader should know it's a request for budget before the history.
related:
  - status-update
  - incident-update
  - design-doc
  - stakeholder
level: 1
