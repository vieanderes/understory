summary: >-
  A class bundles data with the functions that work on it, so an `Account` carries its
  balance and knows how to withdraw. Python classes do the same job as JavaScript classes,
  but the machinery is more visible: `self` is an ordinary first parameter, operators like
  `==` and `print` call methods with double-underscore names, and an instance is little more
  than a dict of attributes with a pointer to its class.


  That visibility is what makes Python's classes flexible. You can make your own types
  compare, hash, print and sort like built-ins by writing a few **dunder methods**. And for
  the very common case of "a named bundle of fields", `@dataclass` writes those methods for
  you, including immutability with `frozen=True`.


  Reach for a class when data and the rules that protect it belong together, such as a
  balance that must never go negative. Reach for a dataclass when the type is mostly data:
  a message, a config, a tool result. Don't reach for a class to group functions that share
  no state, since a module does that, and prefer holding another object over inheriting from
  it unless the subclass really is a kind of its parent.
remember:
  - '`obj.method(x)` is `Class.method(obj, x)`: `self` is the instance, passed in as the first argument.'
  - Attribute lookup checks the instance first, then its class, then the parent classes in method resolution order.
  - A mutable value in the class body is shared by every instance, so create per-instance state in `__init__`.
  - Defining `__eq__` without `__hash__` makes instances unhashable, because equal objects must have equal hashes.
  - '`__repr__` is for developers and should look like the call that builds the object, `__str__` is for users.'
  - '`@dataclass` writes `__init__`, `__repr__` and `__eq__` from the fields, and `frozen=True` adds immutability and a hash.'
  - Use `field(default_factory=list)` for a mutable default in a dataclass, never `= []`.
  - '`super()` calls the next class in the MRO, not necessarily the direct parent, which is what makes multiple inheritance work.'
sections:
  - title: What an instance really is
    body: |-
      An instance keeps its own attributes in a dict, `__dict__`, and has a link to its class.
      Reading `obj.name` checks the instance dict first, then the class, then the parents.
      Assigning `obj.name = ...` always writes to the instance.

      ```python
      class Cart:
          tax_rate = 0.2  # class attribute: one value, shared

          def __init__(self, owner):
              self.owner = owner  # instance attribute: stored on this object
              self.items = []

          def add(self, item):
              self.items.append(item)


      cart = Cart("Ana")
      print(cart.__dict__)            # {'owner': 'Ana', 'items': []}
      print("tax_rate" in cart.__dict__, cart.tax_rate)  # False 0.2

      cart.tax_rate = 0.1             # creates an instance attribute that shadows the class one
      print(cart.tax_rate, Cart.tax_rate)  # 0.1 0.2

      add = cart.add                  # a bound method remembers its object
      add("tea")
      Cart.add(cart, "cake")          # what cart.add("cake") does underneath
      print(cart.items)               # ['tea', 'cake']
      ```

      That explains both sides of the shared-list bug. `self.items.append` reads the name, so
      it finds a class list and mutates it for everyone. `cart.tax_rate = 0.1` assigns, so it
      creates a new instance attribute and leaves the class alone. Immutable class attributes
      such as constants and defaults are fine. Mutable ones are shared state.

      Methods are plain functions stored on the class. Looking one up through an instance
      produces a **bound method** that carries the instance, so `add = cart.add` still knows
      which cart it belongs to. That's the biggest practical difference from JavaScript, where
      `const add = cart.add` loses `this`, and passing a method as a callback needs `.bind`
      or an arrow function. In Python, `button.on_click(cart.add)` works as written.

      Python has no `new` and no separate constructor syntax. Calling the class creates the
      object and then runs `__init__` on it, which initialises rather than constructs, so it
      returns `None`.
  - title: Dunder methods and the data model
    body: |-
      Python's operators and built-in functions are hooks into methods. `a == b` calls
      `a.__eq__(b)`, `len(x)` calls `x.__len__()`, `print(x)` calls `__str__`, and the REPL
      and containers show `__repr__`. `for` uses `__iter__`, `x in y` uses `__contains__`, and
      `bool(x)` uses `__bool__`, falling back to `__len__`. The full list is the **data model**.

      ```python
      class Booking:
          def __init__(self, room, day):
              self.room = room
              self.day = day

          def __repr__(self):
              return f"Booking(room={self.room!r}, day={self.day!r})"

          def __eq__(self, other):
              if not isinstance(other, Booking):
                  return NotImplemented
              return (self.room, self.day) == (other.room, other.day)

          def __hash__(self):
              return hash((self.room, self.day))


      a = Booking("Blue", "Mon")
      b = Booking("Blue", "Mon")
      print(a)                 # Booking(room='Blue', day='Mon')
      print(a == b, a is b)    # True False
      print(len({a, b}))       # 1
      print(a == "Blue")       # False


      class Plain:
          def __eq__(self, other):
              return True


      print(Plain.__hash__)    # None
      try:
          {Plain()}
      except TypeError as error:
          print(error)         # unhashable type: 'Plain'
      ```

      Three rules sit in that code. First, return `NotImplemented` for types you don't know,
      rather than `False`: Python then tries the other side's `__eq__` and falls back to
      identity. Second, **equal objects must have equal hashes**, or sets and dicts break. So
      defining `__eq__` sets `__hash__` to `None` unless you define it too. Third, hash only
      what never changes. If `room` changes after the booking is in a set, the set can no
      longer find it.

      `__repr__` should be unambiguous, ideally the code that rebuilds the object, because it's
      what you see in logs, tracebacks and the debugger. `__str__` defaults to `__repr__`, so
      write it only when users need a friendlier form. JavaScript has almost none of this: no
      operator overloading, `===` is always identity for objects, and `Map` keys compare by
      identity too, so two equal-looking bookings are two keys.
  - title: Dataclasses beyond the basics
    body: |-
      `@dataclass` reads the annotated class attributes and generates the methods. Its options
      cover most of what you'd otherwise write by hand:

      ```python
      from dataclasses import FrozenInstanceError, asdict, dataclass, field, replace


      @dataclass(frozen=True, slots=True)
      class Money:
          amount: int  # in pence, to avoid float rounding
          currency: str = "GBP"

          def __post_init__(self):
              if self.amount < 0:
                  raise ValueError("amount cannot be negative")


      @dataclass(order=True)
      class Task:
          priority: int
          title: str = field(compare=False)
          tags: list[str] = field(default_factory=list, compare=False)


      price = Money(1250)
      print(price)                        # Money(amount=1250, currency='GBP')
      print({price: "tea set"}[Money(1250)])  # tea set
      try:
          price.amount = 0
      except FrozenInstanceError as error:
          print(error)                    # cannot assign to field 'amount'

      print(replace(price, amount=999))   # Money(amount=999, currency='GBP')

      tasks = [Task(2, "write tests"), Task(1, "fix login")]
      print([t.title for t in sorted(tasks)])  # ['fix login', 'write tests']
      first, second = Task(1, "a"), Task(1, "b")
      first.tags.append("urgent")
      print(second.tags, first == second)      # [] True
      print(asdict(first))  # {'priority': 1, 'title': 'a', 'tags': ['urgent']}

      try:
          Money(-5)
      except ValueError as error:
          print(error)                    # amount cannot be negative
      ```

      `frozen=True` blocks assignment and, together with the default `eq=True`, generates
      `__hash__`, so value objects can be dict keys and set members. A plain `@dataclass` is
      unhashable, for the reason in the previous section. `replace` returns a changed copy,
      the frozen way to "update". `__post_init__` runs after the generated `__init__` and is
      where validation goes. `order=True` adds `<` and friends, comparing fields as a tuple in
      order, and `field(compare=False)` leaves a field out of comparisons. `slots=True` stores
      fields in fixed slots instead of a `__dict__`, which saves memory and turns an assignment
      to a misspelt attribute into an `AttributeError`. `kw_only=True` forces keyword arguments.

      Frozen means the attributes can't be reassigned. A list inside a frozen dataclass can
      still be appended to, so use a tuple for truly immutable data. Also, dataclasses don't
      check types at run time: `Money("lots")` is accepted. For data from outside, such as
      JSON or a model's reply, a pydantic model validates and converts, which a later chapter
      covers. In TypeScript terms, a dataclass is closer to a class with a generated
      constructor than to an `interface`, because it exists at run time.
  - title: Properties, privacy and alternative constructors
    body: |-
      Python has no `private` keyword. The convention is a leading underscore, `_balance`,
      meaning "internal, don't touch". When you want controlled access, a `@property` turns a
      method into something read like an attribute:

      ```python
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self._balance = 0  # leading underscore: internal, by convention

          @property
          def balance(self):
              return self._balance

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("deposit must be positive")
              self._balance += amount

          @classmethod
          def from_dict(cls, data):
              account = cls(data["owner"])
              account.deposit(data["balance"])
              return account


      account = Account.from_dict({"owner": "Ana", "balance": 40})
      print(account.balance)          # 40
      try:
          account.balance = 1_000_000
      except AttributeError as error:
          print(error)
      ```

      The last line prints `property 'balance' of 'Account' object has no setter`. So callers
      read `account.balance` but can only change it through `deposit`, which enforces the
      rule. Because a property looks like an attribute, you can start with a plain attribute
      and switch to a property later without changing any caller. That's why Python code
      doesn't write `get_balance()` methods up front, unlike Java.

      A double underscore, `self.__balance`, triggers **name mangling**: Python renames it to
      `_Account__balance` to avoid clashes in subclasses. It's not security, and the single
      underscore is the usual choice. JavaScript's `#balance` fields are truly private and
      its `get balance()` accessor is the equivalent of `@property`.

      `@classmethod` receives the class as `cls` instead of an instance. It's the idiom for
      alternative constructors such as `from_dict` or `from_json`, and using `cls` means a
      subclass gets an instance of itself. `@staticmethod` receives neither, and is only a
      namespaced function.
  - title: Inheritance, super() and the MRO
    body: |-
      A subclass inherits every method and can override some. `super()` reaches the next
      implementation along the **method resolution order** (MRO), the list of classes Python
      searches. With single inheritance that's the parent. With several parents, Python
      builds one line using the C3 algorithm: each class comes before its parents, and parents
      keep the order you listed them in.

      ```python
      class Notifier:
          def send(self, message):
              return [f"sent: {message}"]


      class Logged(Notifier):
          def send(self, message):
              return ["log"] + super().send(message)


      class Retried(Notifier):
          def send(self, message):
              return ["retry"] + super().send(message)


      class SafeNotifier(Logged, Retried):
          pass


      print([cls.__name__ for cls in SafeNotifier.__mro__])
      # ['SafeNotifier', 'Logged', 'Retried', 'Notifier', 'object']
      print(SafeNotifier().send("hi"))
      # ['log', 'retry', 'sent: hi']
      ```

      Look at `Logged`: its `super().send` called `Retried`, a class it has never heard of,
      because `super()` follows the MRO of the actual object. That's how cooperative mixins
      stack behaviour, and why every class in the chain must call `super()` and accept the
      same arguments. JavaScript has single inheritance only, so `super` there always means
      the parent.

      That flexibility is also the case against deep hierarchies. Behaviour spread over a
      chain of classes is hard to follow, and a subclass is tied to its parent's internals.
      Composition keeps the parts separate: an `OrderService` that receives an emailer in
      `__init__` can be given a fake in tests, and swapping email for SMS changes one
      argument. Use inheritance for a real "is a" relationship with a stable parent, such as
      your own exception classes or a framework's base class. For "must have these methods"
      without shared code, `abc.ABC` or a `typing.Protocol` states the contract.
pitfalls:
  - >-
    **A mutable class attribute.** `items = []` in the class body is one list shared by every
    instance, so one customer's cart shows up in another's. Assign `self.items = []` in
    `__init__`, or use `field(default_factory=list)` in a dataclass.
  - >-
    **Forgetting `self`.** Writing `def add(item):` makes the call `cart.add("tea")` fail with
    `TypeError: Cart.add() takes 1 positional argument but 2 were given`, because the instance
    is passed too. Every instance method takes `self` first, and reads attributes as
    `self.items`, never bare `items`.
  - >-
    **Defining `__eq__` and then using the object as a key.** Instances become unhashable,
    and putting them in a set raises `TypeError: unhashable type`. Define `__hash__` over the
    same immutable fields, or use `@dataclass(frozen=True)`.
  - >-
    **Returning `False` from `__eq__` for unknown types.** It stops Python from asking the
    other operand. Return `NotImplemented` instead, and let Python fall back.
  - >-
    **Skipping `super().__init__()` in a subclass.** The parent's attributes are never set,
    and the error appears later as an `AttributeError` far from the cause. Call
    `super().__init__(...)` first in the subclass's `__init__`.
  - >-
    **Trusting dataclass type hints to validate.** `Message(role=3, content=None)` is
    accepted, because annotations aren't checked at run time. Validate in `__post_init__`, or
    use pydantic for data from outside.
interview:
  - question: What's the difference between a class attribute and an instance attribute, and where does it bite?
    answer: >-
      A class attribute is defined in the class body and shared by every instance. An
      instance attribute is assigned on `self`, usually in `__init__`, and belongs to one
      object. Reading `obj.x` looks on the instance first, then the class, so a class
      attribute acts as a shared default. It bites with mutable values: `items = []` in the
      class body means `self.items.append(...)` mutates the one shared list, and data leaks
      between users. Assignment behaves differently, since `self.x = 1` always creates an
      instance attribute and shadows the class one. So I keep class attributes for constants
      and configuration, and create per-object state in `__init__`. Dataclasses guard the
      common case by refusing a list default and requiring `field(default_factory=list)`.
  - question: Why does defining `__eq__` make an object unhashable, and how do you fix it?
    answer: >-
      Because sets and dicts rely on the rule that equal objects have equal hashes. The
      default `__hash__` is based on identity, which would break that rule the moment you
      define value equality, so Python sets `__hash__` to `None` when a class defines `__eq__`
      alone. To fix it I define `__hash__` from the same fields `__eq__` compares, typically
      `hash((self.room, self.day))`. Those fields must never change while the object is in a
      set or used as a key, or lookups silently fail. That's why the cleanest option is
      `@dataclass(frozen=True)`, which generates both methods and blocks assignment. If the
      object has to stay mutable, I leave it unhashable and key by an ID instead.
  - question: When would you use a dataclass, a plain class, or a pydantic model?
    answer: >-
      It depends on who creates the data and whether there are rules to protect. A dataclass
      suits internal data I construct myself: messages, config, results. It gives `__init__`,
      `__repr__` and `__eq__` for free, and `frozen=True` makes a hashable value object. A
      plain class with methods and properties suits objects whose job is to protect an
      invariant, like an account that must never go negative, where behaviour matters more
      than fields. A pydantic model suits data crossing a boundary, such as request bodies,
      JSON files or a model's structured output, because it validates and converts types at
      run time, which dataclasses never do. The trade-off is cost: pydantic adds a dependency
      and validation overhead, so I don't use it for hot internal objects.
  - question: How does `super()` work with multiple inheritance?
    answer: >-
      `super()` returns a proxy for the next class after the current one in the instance's
      method resolution order, not for the direct parent. Python computes the MRO with C3
      linearisation: a subclass comes before its parents, and parents keep their listed
      order. With `class SafeNotifier(Logged, Retried)` the MRO is SafeNotifier, Logged,
      Retried, Notifier, object, so `super().send()` inside `Logged` calls `Retried.send`.
      That's what lets mixins cooperate, as long as every method in the chain calls `super()`
      and accepts compatible arguments, often with `**kwargs`. You can inspect it with
      `Class.__mro__`. In practice I keep multiple inheritance to small mixins and prefer
      composition, because a long MRO makes behaviour hard to trace.
terms:
  - term: "`self`"
    say: A keyword, like `this`.
    means: An ordinary first parameter, named by convention. `obj.method(x)` is `Class.method(obj, x)`.
  - term: Class attribute
    say: A default value for each instance.
    means: An attribute on the class itself, shared by every instance. A mutable one such as a list is
      shared too, so per-instance state belongs in `__init__`.
  - term: Dunder method
    say: A private method.
    means: "A method with a double-underscore name that Python calls for you: `__eq__` for `==`,
      `__repr__` for the console, `__len__` for `len`."
  - term: "`__eq__` and `__hash__`"
    say: Define `__eq__` and equality is done.
    means: Defining `__eq__` without `__hash__` sets `__hash__` to `None`, so instances can't go in a
      set or be dict keys. Equal objects must have equal hashes.
  - term: Dataclass
    say: A class with less typing.
    means: A decorator that writes `__init__`, `__repr__` and `__eq__` from the fields, and
      `frozen=True` adds immutability and a hash. A mutable default needs
      `field(default_factory=list)`.
  - term: "`super()`"
    say: It calls the parent class.
    means: It calls the next class in the method resolution order, which under multiple inheritance may
      not be the direct parent.
