approach: >-
  Scan left to right and keep a stack of the snowballs rolling right that nothing has
  stopped yet. A snowball rolling left meets them nearest first, so it fights the top of the
  stack: while it is bigger, it absorbs the top and grows. If the top is at least as big, the
  top absorbs it and grows instead. A left roller that empties the stack escapes. The answer
  is the escaped count plus what is left on the stack.
complexity: O(N) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      **N up to 100,000** and **efficient** mean you cannot replay the track one meeting at a
      time. Each snowball should be handled a constant number of times.

      Then read the rules carefully: the winner **grows**, and a tie goes to the one rolling
      right.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say it in terms of pairs that meet. That wording points to the pattern: a right roller
      followed by a left roller.
    code:
      ts: |-
        // A right roller meeting a left roller absorbs it if at least as big; count survivors.
      python: |-
        # A right roller meeting a left roller absorbs it if at least as big; count survivors.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      - a single snowball;
      - everyone rolling the same way;
      - a tie, which the right roller wins;
      - a small left roller that grows by eating several;
      - two snowballs rolling apart.
    input:
      - "([5], [0])"
      - "([1, 2, 3], [1, 1, 1])"
      - "([2, 2], [1, 0])"
      - "([1, 1, 1, 5], [1, 1, 1, 0])"
      - "([3, 1], [0, 1])"
  - kind: ask-ai
    title: Confirm the growth rule, not the method
    minutes: 1
    body: |-
      Growth is what separates this from the classic version where the loser just vanishes.
      Check you read it right with one small question.
    prompt: >-
      Without solving it: in this task, with sizes [2, 1, 2] and directions [1, 1, 0], does
      snowball 2 survive? Answer in one sentence using the growth rule.
    expect: >-
      Yes. It absorbs snowball 1 and grows to 3, so it is now bigger than snowball 0 and
      absorbs that too. Without growth it would have lost the tie.
  - kind: plan
    title: Pick the data structure
    minutes: 3
    body: |-
      A left roller only meets right rollers to its left, nearest first. "Nearest first" is
      last in, first out: a stack of right rollers still in play.

      Each snowball is pushed at most once and popped at most once, so the scan is O(N), even
      though there is a loop inside the loop.
  - kind: write
    title: Write the solution yourself
    minutes: 8
    body: |-
      The fight loop is the heart of the task, so type it yourself. Watch the two branches:
      when the top wins it grows in place; when the left roller wins it grows and the top is
      popped.
    code:
      ts: |-
        // A right roller meeting a left roller absorbs it if at least as big; count survivors.
        // A stack of right rollers; each ball is pushed and popped at most once: O(N) time, O(N) space.
        function solution(A: number[], B: number[]): number {
          const right: number[] = [];
          let escaped = 0;
          for (let i = 0; i < A.length; i++) {
            if (B[i] === 1) {
              right.push(A[i]!);
              continue;
            }
            let size = A[i]!;
            while (right.length > 0) {
              const top = right[right.length - 1]!;
              if (top >= size) {
                right[right.length - 1] = top + size;
                size = 0;
                break;
              }
              size += top;
              right.pop();
            }
            if (size > 0) escaped++;
          }
          return escaped + right.length;
        }
      python: |-
        # A right roller meeting a left roller absorbs it if at least as big; count survivors.
        # A stack of right rollers; each ball is pushed and popped at most once: O(N) time, O(N) space.
        def solution(A, B):
            right = []
            escaped = 0
            for size, direction in zip(A, B):
                if direction == 1:
                    right.append(size)
                    continue
                while right:
                    top = right[-1]
                    if top >= size:
                        right[-1] = top + size
                        size = 0
                        break
                    size += top
                    right.pop()
                if size > 0:
                    escaped += 1
            return escaped + len(right)
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. For each of your cases, follow the meetings by hand and compare.
    expect: Two OKs, then 1, 3, 1, 1 and 2 for your five cases.
  - kind: ai-writes
    title: Let the assistant write a large input
    minutes: 2
    body: |-
      Two long matching arrays are tedious to type and easy to check by shape, so delegate
      them. The count is still yours to reason about.
    prompt: >-
      Write one line for test-input.txt in the format ([1, 2], [1, 0]): sizes are 2,000
      copies of 7, and directions alternate 1, 0 starting with 1. Output the line only, no
      code.
    expect: The run finishes at once and returns 1000, since every right roller wins its tie.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The tie rule and the growth after a pop are the lines
      worth a second look.
    prompt: >-
      Review my current solution for correctness and time complexity, including ties and
      growth. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output, since printing slows the performance tests. Check the header
      states the complexity, then submit.
