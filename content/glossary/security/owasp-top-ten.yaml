term: OWASP Top 10
aka: [OWASP top ten, OWASP]
short: A ranked list of the most common serious risk categories in web applications, refreshed every few years.
explain: |
  Security is a huge field, and a team needs somewhere to start. This list comes from a non-profit security community. It names the ten families of flaws
  that cause the most harm in real web apps.

  The 2025 edition puts broken access control first, then misconfiguration and supply chain
  failures. It's an awareness document and a review checklist, not a certification
  standard. Each category is a family of causes. A review asks which input reaches the code, and which
  family it could trigger.
analogy: A driving instructor's list of the ten mistakes that fail most tests. Learn them first, though passing needs more.
usage: Walk the endpoint through the OWASP Top 10 before review; access control and injection catch most of what we ship.
related: [threat-model, authorisation, sql-injection, xss, supply-chain-attack, fail-closed]
level: 2
lessons: [security.owasp-top-ten]
