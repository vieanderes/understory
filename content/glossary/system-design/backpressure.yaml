term: backpressure
aka: [back pressure]
short: A slow consumer telling a fast producer to wait, so the work piling up between them stays bounded.
explain: |
  A fast part of a system hands work to a slower part. If nothing slows the fast part
  down, the pile in between grows until memory runs out, and everything crashes at once.

  The fix is a limit with a signal: a bounded buffer that blocks when full, a cap on how
  many calls are in flight, or a stream that only reads more when the last chunk was
  written. Unbounded `Promise.all` over ten thousand items is the classic missing case.
analogy: A kitchen that stops taking orders at the counter until the chefs catch up, instead of spiking tickets until the rail falls off the wall.
example:
  language: ts
  code: |
    // at most 5 uploads in flight; the rest wait their turn
    const limit = pLimit(5);
    await Promise.all(files.map((f) => limit(() => upload(f))));
usage: The importer has no backpressure; it reads the whole file into memory faster than the API accepts it.
twin:
  term: load-shedding
  difference: Backpressure makes the sender wait, so the work still gets done later. Load shedding refuses the extra work outright, so the work that is accepted stays fast.
related: [load-shedding, queue, throughput, rate-limiting]
level: 3
lessons: [scale.backpressure]
