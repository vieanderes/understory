summary: >-
  A Python string, `str`, is an immutable sequence of Unicode characters. Most of what an AI
  engineer handles is text: prompts, model replies, log lines, CSV rows, user input. So the
  day-to-day work is cleaning text, cutting it into pieces and joining it back, and a small
  set of string methods covers nearly all of it.


  Two facts shape everything else. Strings are **immutable**: every method returns a new
  string and leaves the original alone, so the result has to be kept. And strings are
  **sequences**: indexing, slicing, `len`, `in` and `for` work on them exactly as on lists.
  There's no separate character type; `word[0]` is a string of length one.


  Reach for the methods before you reach for regular expressions: `strip`, `lower`,
  `replace`, `split` and `join` are faster to read and harder to get wrong. Reach for the
  `re` module only when the pattern is a real pattern, such as "digits followed by a unit".
  And whenever you compare text typed by people, normalise it first, because two strings
  that look the same can differ in case, spacing or even the Unicode behind an accent.
remember:
  - Strings are immutable, so every string method returns a new string and you must assign the result to keep it.
  - '`len` counts Unicode code points, not bytes, and not the characters a person sees, so an emoji with a skin tone has a length of 2.'
  - '`split()` with no argument splits on any run of whitespace and drops empty pieces, while `split(",")` keeps every empty piece.'
  - '`join` is a method of the separator and needs strings: `", ".join(tags)`, never `tags.join(", ")`.'
  - '`replace` changes every occurrence by default, unlike JavaScript''s `replace` with a string pattern, which changes only the first.'
  - '`strip("abc")` removes any of those characters from both ends; use `removeprefix` and `removesuffix` to drop an exact piece.'
  - Building a long string with `+=` in a loop can copy the text every time, so collect the pieces in a list and `join` them once.
sections:
  - title: What a string holds, and what len counts
    body: |-
      A Python `str` is a sequence of **Unicode code points**, the numbers Unicode assigns
      to characters. `len` counts those code points. It doesn't count bytes, and it doesn't
      count what a reader would call characters.

      ```python
      import unicodedata

      word = "café"
      print(len(word), len(word.encode("utf-8")))   # 4 5: é takes two bytes in UTF-8
      print(len("😀"))                               # 1

      decomposed = "café"                     # e followed by a combining accent
      print(decomposed == word, len(decomposed))    # False 5
      nfc = unicodedata.normalize("NFC", decomposed)
      print(nfc == word)                            # True

      print(len("👍🏽"))                              # 2: thumbs up plus a skin-tone modifier
      ```

      JavaScript strings are sequences of UTF-16 code units instead, so `"😀".length` is
      `2` in JavaScript and `1` in Python. Neither language counts what a person sees: a
      thumbs up with a skin tone is one symbol on screen and two code points. When the
      count is user-facing, such as a character limit on a form, check what the other side
      counts. When the limit is in bytes, measure `len(text.encode("utf-8"))`.

      The same visible text can arrive as different code points. "é" can be one code point
      or an "e" plus a combining accent, and they aren't `==`. Text pasted from different
      systems does this. For search, deduplication or cache keys, normalise with
      `unicodedata.normalize("NFC", text)` first.

      Text goes out of Python as bytes. `text.encode("utf-8")` gives a `bytes` object, and
      `data.decode("utf-8")` turns bytes back into a `str`. Files and HTTP libraries do this
      for you when you give them an encoding, which lesson 10 covers.

      Out-of-range indexing is an error: `"abc"[10]` raises `IndexError`, where JavaScript
      returns `undefined`. A slice, `"abc"[10:]`, returns `""` instead.
  - title: Immutability, and building text efficiently
    body: |-
      A string can't change after it's made. `word[0] = "P"` raises `TypeError: 'str'
      object does not support item assignment`. JavaScript strings are immutable too, so
      the rule is the same. What differs is how visible it is, because Python code builds
      a lot of text by hand.

      Immutability buys two things. A string can be shared freely, since nobody can change
      it under you. And a string can be a dict key or a set member, because its hash can
      never change.

      The cost shows up when you build text in a loop. `report += line` makes a new string
      and may copy everything built so far, so a loop over n lines can do O(n²) work.
      CPython sometimes extends the string in place as an optimisation, but it's an
      implementation detail. The idiom that is always linear is to collect pieces in a list
      and join once:

      ```python
      orders = [("Tea", 4, 2.5), ("Mug", 1, 8.0), ("Beans", 2, 30.0)]

      lines = []
      for item, qty, price in orders:
          lines.append(f"{qty} x {item:<6}{qty * price:>7.2f}")
      receipt = "\n".join(lines)
      print(receipt)
      ```

      That prints:

      ```text
      4 x Tea     10.00
      1 x Mug      8.00
      2 x Beans   60.00
      ```

      `join` accepts any iterable of strings, and raises a `TypeError` naming the first
      non-string item it meets. So `", ".join([1, 2])` fails. Convert first:
      `", ".join(str(n) for n in numbers)`.

      Because methods return new strings, they chain: `raw.strip().lower().replace("?",
      "")`. Each step works on the previous result. A method that returns something else
      ends the chain: `startswith` returns a `bool`, `split` returns a list, and `find`
      returns an `int`.
  - title: The methods that matter, next to their JavaScript names
    body: |-
      Most string methods have a JavaScript twin with a different name. A few behave
      differently, and those are the ones that cause bugs in translated code.

      ```text
      JavaScript                    Python
      s.length                      len(s)
      s.includes(x)                 x in s
      s.trim()                      s.strip()
      s.toLowerCase()               s.lower()  (or s.casefold() for comparing)
      s.indexOf(x)                  s.find(x)  (-1 when missing) or s.index(x)
      s.replaceAll(a, b)            s.replace(a, b)
      s.replace(a, b)               s.replace(a, b, 1)
      s.padStart(3, "0")            s.zfill(3) or s.rjust(3, "0")
      s.split(",")                  s.split(",")
      arr.join(", ")                ", ".join(arr)
      ```

      The edge cases are where the two languages differ, and where tests should look:

      ```python
      print("a  b".split(" "))       # ['a', '', 'b']: one cut per space
      print("a  b".split())          # ['a', 'b']: any run of whitespace
      print("".split(","))           # ['']: one empty piece, not an empty list
      print("".split())              # []
      print("banana".replace("a", "o"))     # bonono: all of them
      print("hello".find("z"))       # -1
      print("x.csv".endswith((".csv", ".tsv")))   # True: a tuple means "any of"
      print("www.example.com".strip("w.com"))     # example: strips characters, not a word
      print("www.example.com".removeprefix("www."))   # example.com
      ```

      `"".split(",")` giving `['']` is why this lesson's tag cleaner has to drop empty
      pieces after splitting. `find` returns `-1` for "not found", while `index` raises
      `ValueError`, which is the better choice when a missing piece is a bug.

      The `is...` methods are stricter or looser than they look. `"²".isdigit()` is `True`,
      but `int("²")` raises `ValueError`. To check that text is a whole number, try `int()`
      and catch the error rather than testing first.

      `lower` is right for display. For comparing text in any language, `casefold` goes
      further: `"Straße".casefold()` is `"strasse"`, which matches `"STRASSE".casefold()`.
  - title: Multi-line text, escapes and prompt templates
    body: |-
      Prompts, SQL and emails are often several lines long. Triple quotes, `"""` or
      `'''`, make a string that keeps its line breaks. Add `f` and it's a multi-line
      f-string, the Python version of a multi-line template literal.

      Indentation inside triple quotes is part of the string. `textwrap.dedent` removes the
      common leading whitespace, so the literal can sit indented in your code:

      ```python
      import textwrap

      def support_prompt(product, question):
          return textwrap.dedent(f"""\
              You are a support assistant for {product}.
              Answer in two sentences at most.

              Question: {question}
          """)

      print(support_prompt("a booking app", "Can I change my date?"))
      ```

      The backslash after the opening quotes stops the string starting with an empty line.

      A backslash starts an escape: `\n` is a line break and `\t` a tab. A **raw string**,
      `r"..."`, turns escapes off, so `r"\d+"` is four characters. Use raw strings for
      regular expressions and Windows paths. `len("\n")` is `1`; `len(r"\n")` is `2`.

      Two string literals side by side are joined at compile time: `"tea" "milk"` is
      `"teamilk"`. It's handy for splitting a long literal over lines inside brackets. It's
      also why a missing comma in a list of strings produces no error:

      ```python
      tags = [
          "refunds",
          "billing"      # missing comma
          "delivery",
      ]
      print(tags)        # ['refunds', 'billingdelivery']
      ```

      For prompts built from user input, remember an f-string inserts the text as it is.
      Nothing escapes it, so keep instructions and user content clearly separated, for
      example by delimiting the user's text.
pitfalls:
  - '**Calling a method and dropping the result.** `reply.strip()` on its own line does nothing visible. Assign it: `reply = reply.strip()`, or chain it into the return.'
  - '**Writing `tags.join(", ")`.** Lists have no `join`, so it raises `AttributeError`. The separator owns the method: `", ".join(tags)`.'
  - '**Joining non-strings.** `", ".join([1, 2])` raises `TypeError: sequence item 0: expected str instance, int found`. Convert each item with `str()` first.'
  - '**Expecting `replace` to change only the first match.** Python replaces every occurrence. Pass a count, `replace(old, new, 1)`, when you want one.'
  - '**Using `strip` to remove a word.** `strip("www.")` removes any of the characters `w` and `.` from both ends. Use `removeprefix` and `removesuffix` for exact pieces.'
  - '**`split(" ")` for words.** Double spaces produce empty strings. Use `split()` with no argument to split on any run of whitespace.'
  - '**Comparing text from users with `==`.** Case, spacing and Unicode forms differ. Normalise first: collapse whitespace, `casefold`, and `unicodedata.normalize("NFC", ...)`.'
  - '**A missing comma in a list of strings.** Adjacent literals are joined silently. A formatter that puts one item per line makes it easier to spot, and linters can flag it.'
interview:
  - question: Why are Python strings immutable, and what does that mean for building a large string?
    answer: >-
      Immutability makes strings safe to share and hashable, so they can be dict keys and
      set members, and the interpreter can reuse them freely. The consequence is that every
      "change" builds a new string. Concatenating in a loop with `+=` can therefore copy the
      whole accumulated text each time, which makes the loop quadratic. CPython has an
      optimisation that sometimes resizes in place, but it isn't guaranteed and doesn't
      apply on other implementations. The idiom that is always linear is to append pieces
      to a list and call `"".join(pieces)` once, or to write to an `io.StringIO`. For a
      handful of pieces, an f-string or `+` is clearer and perfectly fine. The quadratic
      case only bites at scale, such as building a big report or CSV in memory.
  - question: What does `len` return for a string containing emoji, and how does that compare with JavaScript?
    answer: >-
      `len` returns the number of Unicode code points. `len("😀")` is `1` in Python, while
      JavaScript's `.length` counts UTF-16 code units and gives `2`. Neither counts
      user-perceived characters. A thumbs up with a skin-tone modifier is two code points,
      and a flag is two regional-indicator code points, so both have `len` 2 though each
      shows as one symbol. Bytes are different again: `len("café".encode("utf-8"))` is `5`.
      So I decide what the limit actually means. A database column or an API payload limit
      is usually bytes, so I measure encoded length. A user-facing character counter needs
      grapheme clusters, which need a library such as `regex` with `\X`. A token limit for a
      model needs the model's tokenizer.
  - question: How would you normalise user text before comparing or deduplicating it?
    answer: >-
      I'd normalise Unicode first, then case, then whitespace. `unicodedata.normalize("NFC",
      text)` makes composed and decomposed accents identical, and NFKC goes further by
      folding compatibility forms such as ligatures and full-width letters. `casefold()` is
      stronger than `lower()` for comparison, so "Straße" matches "STRASSE". Then
      `" ".join(text.split())` trims the ends and collapses every run of whitespace,
      including tabs and newlines, to one space. I keep the original for display and store
      the normalised form as a lookup key. The trade-off is losing information: NFKC and
      casefolding are right for matching and search, but wrong for text you show back, and
      some languages have case rules, such as Turkish dotted I, that a generic casefold
      doesn't handle.
  - question: What's the difference between `split()` and `split(" ")`?
    answer: >-
      `split()` with no argument splits on any run of whitespace, including tabs and
      newlines, and discards empty strings, so leading, trailing and repeated spaces
      vanish. `split(" ")` cuts at every single space, so `"a  b".split(" ")` gives
      `['a', '', 'b']`, and leading or trailing spaces produce empty strings at the ends.
      There's a related edge case: `"".split(",")` returns `['']`, a list with one empty
      string, while `"".split()` returns `[]`. For words in free text I use `split()`. For
      a real delimiter, such as commas in user input, I use `split(",")` and then strip and
      filter each piece, since empty fields are meaningful there. For real CSV with quoting,
      I'd use the `csv` module, not `split`.
terms:
  - term: "`str`"
    say: A list of characters.
    means: "An immutable sequence of Unicode code points. There's no separate character type: `word[0]`
      is a string of length one."
  - term: "`len` of a string"
    say: The number of characters.
    means: The number of code points, not bytes or visible characters, so an emoji with a skin tone has
      a length of 2.
  - term: "`split()` and `split(' ')`"
    say: Both split on spaces.
    means: "`split()` splits on any run of whitespace and drops empty pieces. `split(' ')` splits on
      every single space and keeps the empty strings between them."
  - term: "`join`"
    say: A list method.
    means: "A method of the separator, and every item must be a string: `', '.join(tags)`. Convert
      numbers first."
  - term: "`strip`"
    say: It removes the given text from the ends.
    means: "`strip('abc')` removes any of those *characters* from both ends. Use `removeprefix` and
      `removesuffix` to drop an exact piece."
  - term: "`replace`"
    say: It replaces the first match, like in JavaScript.
    means: Python's `replace` changes every occurrence by default; pass a count to limit it.
