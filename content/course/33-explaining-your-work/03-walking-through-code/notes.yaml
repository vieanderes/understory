summary: >-
  Walking someone through code means helping them build a picture of what it does, not
  reading it to them. The listener can already see the lines. What they can't see is what
  the code is for, which input matters, and why each odd line is there. This lesson gives
  three moves for that: **intent before mechanics**, **one path at a time**, and **the why
  behind each choice**.


  Intent first gives the listener a map: once they know `rideCost` works out a price, every
  line has a job. One path second gives them the normal case: follow a realistic input from
  the top to the return value, skipping the exceptions. Functions often open with guard
  clauses, so reading top to bottom meets the special cases before the rule they are
  exceptions to. The branches come third, each with the reason it exists, because the
  reason is the one thing nobody can read off the screen.


  You use this in code reviews, pair programming, interviews, onboarding, and when you check
  an AI assistant's explanation of code. The same habit also catches bugs. Following a real
  input through the code and comparing it with what the comment or the walkthrough claims is
  how you find a comment that has drifted from the code.
remember:
  - Start with what the code is for, in one sentence, before any line of how it works.
  - Follow one ordinary input from the top to the return value before you cover any branch.
  - Cover the branches one at a time after the main path, each with the reason it exists.
  - Your words should add the why, because the what is already on the screen.
  - Reading code aloud line by line helps you debug, but it loses a listener by the third line.
  - Check a walkthrough or a comment by running a real input through the code and comparing.
  - Tests never read comments, so a wrong comment passes every test and misleads every reader.
sections:
  - title: Choosing the path to follow
    body: |-
      The path you pick decides how well the walkthrough lands. Three rules help.

      **Pick the common case.** Choose the input most users send, not the strangest one. For
      `rideCost` that's a 20-minute ride without a pass, not a one-minute ride. The common
      case shows what the function is mostly for.

      **Pick concrete values.** "A ride of some length" is harder to follow than "20
      minutes". Real numbers let the listener check you as you go, and they make the
      boundaries visible: the cap matters for a 3-hour ride, not a 20-minute one.

      **Say what you skip.** "I'll skip the early returns for now and come back to them"
      tells the listener the gap is deliberate. Without it, they spend attention wondering
      if they missed something.

      In a longer system the path is a request. Start where the user acts, say the button
      press, and follow the data through each function it touches to the response:

      ```text
      press "End ride"  ->  endRide(rideId)  ->  rideCost(ride, member)
                        ->  charge(member, pence)  ->  receipt shown
      ```

      Name each stop by what it does for the ride, then zoom into the one that matters for
      the question you were asked. Questions like "why was I charged twice?" pick the path
      for you.
  - title: Comments as a written walkthrough
    body: |-
      Good comments are a walkthrough frozen in place. They follow the same rule: say what
      the code can't. Compare two versions of the same function:

      ```js
      // Returns 0 if minutes <= 1.
      if (ride.minutes <= 1) return 0;
      // Returns the minimum of cost and DAILY_CAP.
      return Math.min(cost, DAILY_CAP);
      ```

      ```js
      // Undocking by mistake shouldn't cost anything.
      if (ride.minutes <= 1) return 0;
      // A day out never costs more than a day pass.
      return Math.min(cost, DAILY_CAP);
      ```

      The first pair repeats the code, so it adds reading time and nothing else. Worse, it
      goes stale: change `<= 1` to `<= 2` and the comment now lies. The second pair records
      decisions. It would survive a change to the number, and it tells the next developer
      what they must keep true.

      A function-level comment carries the intent: one sentence on what it's for, its units
      and anything surprising, such as "prices are in pence". That's the walkthrough's first
      sentence, written down.

      Comments still need checking. They're never run, so nothing fails when they drift. In
      review, pick one real input and follow it through: the comment on line 8 of the AI
      walkthrough claimed a floor where the code set a ceiling, and a 10-minute ride
      disproves it at once.
  - title: Walking through code in an interview
    body: |-
      Interviewers ask you to walk through code for two reasons: to see if you understand it,
      and to see if you can make someone else understand it. The same three moves serve
      both.

      Open with the intent and, if you can, the shape: "This decides whether a member can
      borrow a book. Two early checks, then a limit." That takes five seconds and shows you
      read the whole thing before speaking.

      Then follow one ordinary input aloud, with concrete values. If the code is unfamiliar,
      say so and trace it honestly: "Let me follow a member with nothing overdue." Thinking
      aloud is fine; silence followed by a summary is harder to give credit for.

      Then the branches with their reasons, and finally anything you'd question: "If
      `heldFor` can be `0`, this check would let anyone borrow it." Naming a risk you found
      while walking through shows judgment, not only reading.

      Watch the interviewer. If they nod through the main path, skip ahead. If they lean in
      on one branch, that's the question they care about. For live-coding interviews, the
      interview chapter covers running a whole round out loud.
pitfalls:
  - '**Reading the code aloud.** "If ride dot minutes is less than or equal to one, return zero" tells the listener what they can already see. Say what it means and why it''s there.'
  - '**Starting with the exceptions.** Top to bottom puts guard clauses first, before the normal case they guard. Follow the ordinary input first.'
  - '**Describing every branch at once.** Several paths in one breath blur together. Finish the main path, then take each branch in turn.'
  - '**Comments that restate the code.** They add reading time and go stale when the code changes. Comment the reason, not the operation.'
  - '**Trusting a walkthrough because it reads well.** A fluent explanation, from a person or an AI, can still misdescribe a branch. Run one real input and compare.'
verify:
  - lens: confuses
    check: Check the first sentence of the walkthrough or the function comment says what the code is for, with units, before any mechanics.
  - lens: confuses
    check: Look for comments that restate the operation, such as "returns the minimum", and replace them with the reason the line exists.
  - lens: tests
    check: Pick one ordinary input and one edge input, run them, and confirm each comment's claim matches what the code returns.
  - lens: breaks
    check: When you change a limit or a condition, reread the comment beside it, because no test fails when a comment goes stale.
interview:
  - question: Walk me through a piece of code you wrote recently.
    answer: >-
      I'd start with what it's for and who uses it, in one sentence. Say: "It works out what
      a bike-share ride costs, in pence, for the receipt." Then one ordinary case with real
      values: a 20-minute ride without a pass skips both early returns and pays the unlock
      fee plus the minutes, under the cap. Then each exception with its reason: rides under a
      minute are free because people undock by mistake, pass holders have paid already, and
      the cap stops a day out costing more than a pass. I'd end with one thing I'd change,
      such as moving the prices into configuration, which shows I can judge the code as well
      as describe it.
  - question: How do you explain an unfamiliar codebase to a new team member?
    answer: >-
      One path end to end, before any architecture diagram. I'd pick the most common user
      action and follow it from the button to the database and back, naming each stop by
      what it does for the user. That gives them a skeleton. Then I'd show where the main
      variations branch off, one at a time, with the reasons behind the odd parts, because
      the reasons are what's missing from the code. I'd skip history and rare paths on day
      one and say I'm skipping them. Then I'd ask them to make a small change on that path,
      which tells me what they understood. The trade-off is breadth, which they pick up
      later with a map already in their head.
  - question: What makes a code comment good or bad?
    answer: >-
      A good comment says what the code can't: the reason, the constraint, the unit or the
      surprise. "Undocking by mistake shouldn't cost anything" earns its place, because no
      one can read that intent off `minutes <= 1`. A bad comment restates the operation,
      like "returns the minimum of cost and cap". It adds nothing and goes stale silently,
      because comments are never run. The worst comment is a wrong one, since readers trust
      it over the code. So I keep comments few, put the intent at the top of a function, and
      in review I check a comment's claim against one real input. The trade-off is that some
      knowledge belongs in names or tests instead, which can't drift.
