term: allowlist
aka:
  - allow list
  - safelist
short: A fixed list of things that are permitted, where anything not on it is refused.
explain: |
  There are two ways to filter. List what's banned, or list what's allowed. A banned list
  misses whatever nobody thought of. An allowed list fails safe: the unknown is refused.

  For an agent, the allowlist is the set of tools it may call, checked in code. The model
  can ask for anything, so the check matters. Look the name up as an own property of a known
  map, so a name like `constructor` can't slip through.

  The opposite is a denylist. Use one only when the set of good things is too large to list.
analogy: A guest list at the door. If your name isn't on it, you don't get in, however good your story.
example:
  language: js
  code: |
    const tools = { searchOrders, getOrder };
    function runTool(name, args) {
      if (!Object.hasOwn(tools, name)) return { error: `Unknown tool: ${name}` };
      return tools[name](args);
    }
usage: Check the tool name against the allowlist in code; the prompt is not a security control.
related:
  - least-privilege
  - tool-use
  - prompt-injection
level: 2
lessons:
