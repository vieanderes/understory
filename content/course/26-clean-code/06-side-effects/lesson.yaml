    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map
    note: How to build a changed copy instead of changing the original.
    verified: true

deepDive: >-
  The Architecture module shows the same idea at the size of a whole app. The core never
  imports the database or the clock, so it runs in a test with plain values. The shell stays
  thin enough that one integration test covers it.


  Time is the hidden input people forget most. `Date.now()`, `new Date()`, `Math.random()`
  and environment variables all make a function impure. Pass them in, or pass a small
  function that provides them, such as `clock: () => Date`.


  Purity isn't all or nothing. Logging from a core function is a side effect, but a
  harmless one. What matters is that the decisions are testable and that no function
  depends on state its caller can't see.
