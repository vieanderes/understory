id: pro.css-and-html
title: HTML and CSS like a pro
objective: "Write semantic HTML and maintainable CSS: tokens instead of magic values, low specificity, no !important, and logical properties."
level: essential
minutes: 10
concepts: [pro.semantic-markup, pro.maintainable-css]
prerequisites: [css.modern-architecture]
opening:
  text: >-
    You'll write markup and styles that a senior front-end developer would approve. Pages
    will work for more people, and your CSS will stay simple to change as it grows.

steps:
  - type: prose
    id: semantic-markup
    body: |-
      You already know the pro habit for HTML. **Semantic markup** means choosing each
      element for what it is, not how it looks.

      ```html
      <div class="header">Opening hours</div>
      <header><h2>Opening hours</h2></header>
      ```

      Both look alike once styled. Only the second gives a screen reader a landmark and a
      heading to jump to. Reviewers spot the first in seconds.

  - type: playground
    id: pick-semantic-fix
    concept: pro.semantic-markup
    difficulty: 1
    prompt: >-
      A pull request builds this header from `div`s. Swap the outer `div` for `header`, and
      the inner one for an `h2`.
    html: |
      <div class="header">
        <div class="big-text">Opening hours</div>
      </div>
      <p>Monday to Friday, 9 until 5.</p>
    css: |
      body { font-family: sans-serif; }
      .header { border-bottom: 2px solid teal; }
      .big-text { font-size: 24px; font-weight: bold; }
    editable: [html]
    checks:
      - label: The page has a `header`
        selector: header
        count: 1
      - label: The `header` holds an `h2`
        selector: header h2
        text: Opening hours
    solution:
      html: |
        <header class="header">
          <h2 class="big-text">Opening hours</h2>
        </header>
        <p>Monday to Friday, 9 until 5.</p>
    hints:
      - Change the tag names at both ends of each element.
      - Keep the classes, so the styles still apply.
      - 'The outer one becomes `<header class="header">`.'

  - type: bug-hunt
    id: hunt-missing-label
    concept: pro.semantic-markup
    difficulty: 2
    language: html
    code: |
      <form>
        <p>Email</p>
        <input type="email" name="email">
        <button>Subscribe</button>
      </form>
    prompt: A screen reader announces the field as "edit text", with no name. Tap the line to fix.
    lines: [2]
    reasons:
      - text: The text isn't tied to the field
        correct: true
        feedback: >-
          Right. A linked `label` names the field, and makes the text clickable.
      - text: The input needs a `placeholder`
        feedback: >-
          A placeholder vanishes as you type and isn't a reliable name. A `label` is.
      - text: The button needs `type="submit"`
        feedback: >-
          In a form, a `button` already submits by default. The field's name is the problem.
    fix: |
      <form>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <button>Subscribe</button>
      </form>

  - type: prose
    id: maintainable-css
    body: |-
      Now the CSS. Remember specificity: an id beats any number of classes. So one
      `#sidebar .link` rule makes every later fix need something stronger, then
      `!important`. **Maintainable CSS** avoids the race:

      - one class per selector, kept flat and low
      - custom properties for every colour and size
      - logical properties, like `padding-inline`
      - no `!important`, no ids for styling

  - type: playground
    id: fix-specificity-race
    concept: pro.maintainable-css
    difficulty: 2
    prompt: >-
      The active link should be crimson, but the id rule beats it. Lower `#sidebar .link` to
      plain `.link`, with no `!important`. Watch Home turn crimson.
    html: |
      <nav id="sidebar">
        <a class="link is-active" href="#">Home</a>
        <a class="link" href="#">Shop</a>
      </nav>
    css: |
      body { font-family: sans-serif; }
      #sidebar .link { color: navy; }
      .link.is-active { color: crimson; }
    editable: [css]
    checks:
      - label: The active link is crimson
        selector: .is-active
        style: { property: color, value: 'rgb(220, 20, 60)' }
      - label: The other link stays navy
        selector: '.link:not(.is-active)'
        style: { property: color, value: 'rgb(0, 0, 128)' }
    solution:
      css: |
        body { font-family: sans-serif; }
        .link { color: navy; }
        .link.is-active { color: crimson; }
    hints:
      - Only the selector of the navy rule changes.
      - With one class each, the later, more specific rule wins.
      - 'Write `.link { color: navy; }`.'

  - type: multiple-choice
    id: pick-no-important
    concept: pro.maintainable-css
    difficulty: 2
    question: Your `.price` colour loses to an older `#shop .card span` rule. What's the pro fix?
    choices:
      - text: Lower the older rule to one class
        correct: true
        feedback: >-
          Yes. Fix the cause, and both rules compete fairly by order again.
      - text: Add `!important` to `.price`
        feedback: >-
          It wins today, but the next change needs another `!important`. The race only escalates.
      - text: Give the price element an id
        feedback: >-
          An id makes your new rule the hardest to override. That's the same trap, one level up.

  - type: fill-blank
    id: fill-tokens
    concept: pro.maintainable-css
    difficulty: 2
    prompt: >-
      Pad the card's sides so it flips for right-to-left text, and colour its border from
      the custom property.
    language: css
    template: |
      :root {
        --space-2: 16px;
        --color-accent: #3b4fd8;
      }
      .card {
        {{1}}: var(--space-2);
        border-color: {{2}};
      }
    blanks:
      - key: '1'
        answer: padding-inline
      - key: '2'
        answer: var(--color-accent)
    bank: [padding-inline, padding-left, var(--color-accent), '#3b4fd8', '--color-accent']

  - type: prose
    id: focus-ring
    body: |-
      Press Tab on a page and the browser draws an outline round the focused element. That's
      the **focus ring**: it shows keyboard users where they are.

      ```css
      .button:focus-visible { outline: 2px solid teal; }
      ```

      `:focus-visible` matches when the browser thinks a ring should show, such as after
      Tab. Style it, but never remove it with nothing in its place.

  - type: ai-review
    id: review-focus-ring
    concept: pro.maintainable-css
    difficulty: 3
    language: css
    request: Style our buttons, with a clear state when a keyboard user lands on one.
    flawClass: logic
    code: |
      .button {
        padding-block: 8px;
        padding-inline: 16px;
        border-radius: 8px;
      }
      .button:focus {
        outline: none;
        background: var(--color-hover);
      }
    prompt: >-
      An assistant wrote this. Clicking looked fine in a quick test, but keyboard users lose
      track of where they are. Tap the line at fault.
    lines: [7]
    reasons:
      - text: It removes the focus ring it was asked to show
        correct: true
        feedback: >-
          Right. A faint background change is hard to spot. Keep a clear outline instead.
      - text: '`padding-inline` should be `padding-left`'
        feedback: >-
          `padding-inline` is the logical, right-to-left-safe choice. It's the pro version.
      - text: '`border-radius` hides the focus'
        feedback: >-
          Rounded corners don't hide anything. The outline was switched off on line 7.
    verify:
      question: How would you check the fix works?
      choices:
        - text: Tab through the page and watch each button
          correct: true
          feedback: >-
            Yes. Only keyboard focus shows the ring with `:focus-visible`.
        - text: Click each button with the mouse
          feedback: >-
            That's the quick test that already passed. Browsers often hide `:focus-visible` on a click.
        - text: Check the hover colour's contrast
          feedback: >-
            Worth checking, but hover isn't focus. A keyboard user never hovers.
    fix: |
      .button {
        padding-block: 8px;
        padding-inline: 16px;
        border-radius: 8px;
      }
      .button:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }

  - type: explain-back
    id: explain-flat-selectors
    concept: pro.maintainable-css
    difficulty: 4
    audience: reviewer
    kind: decide
    prompt: >-
      Your pull request replaces `#sidebar ul li a` with a `.nav-link` class. A reviewer asks
      why touch working CSS. Defend the change, and name its cost.
    rubric:
      - The long selector has high specificity, so later rules need `!important` to override it.
      - It breaks when the HTML nesting changes, while a class moves with the element.
      - The cost is adding the class to every link, once, in the markup.
    modelAnswer: >-
      `#sidebar ul li a` has an id and depends on the exact nesting. Anything that wants to
      change those links needs a stronger selector, so people reach for `!important`. Move a
      link and the rule stops matching. A single class is weak on purpose, so rules compete
      by order, and it follows the element anywhere. The cost is adding the class to each
      link once.

recap:
  - Pick elements for meaning, and tie every field to a `label`.
  - Keep selectors to one low, flat class, and never reach for `!important`.
  - Use custom properties and logical properties, and never remove a focus ring.
recall:
  - id: card-semantic
    concept: pro.semantic-markup
    front: What do you get for free by using `button`, `h2` and `label` instead of styled `div`s?
    back: >-
      Keyboard support, headings people can jump between, and names read aloud with fields,
      with no extra code.
  - id: card-label
    concept: pro.semantic-markup
    front: How do you give a text input an accessible name?
    back: >-
      With a `label` whose `for` matches the input's `id`, or by wrapping the input in the
      `label`.
  - id: card-specificity
    concept: pro.maintainable-css
    front: Why do pros avoid ids and `!important` in CSS?
    back: >-
      Both win almost every contest, so each later fix needs something stronger. Styles
      become hard to change.
  - id: card-tokens
    concept: pro.maintainable-css
    front: What replaces raw values like `16px` and `#3b4fd8` in maintainable CSS?
    back: >-
      Custom properties, read with `var()`, defined once and used everywhere.

references:
  - kind: docs
    title: HTML elements reference
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements
    note: Every element and what it means, to pick the right one.
    primary: true
    verified: true
  - kind: docs
    title: Specificity
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Specificity
    note: How selectors are weighed, and why `!important` is a last resort.
    primary: true
    verified: true
  - kind: docs
    title: ':focus-visible'
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-visible
    note: Showing a focus ring for keyboard users without showing it on every click.
    verified: true

deepDive: >-
  The colours in the specificity step were checked in Chromium: with the id rule, the
  active link computes to `rgb(0, 0, 128)`, navy; with `.link`, it's `rgb(220, 20, 60)`,
  crimson. An id selector counts in a higher column than any number of classes, so no
  amount of class chaining catches up.


  Teams keep specificity flat with a naming scheme such as BEM (`card__title--large`), or
  with utility classes. Cascade layers help too: a whole layer can win without a stronger
  selector. Whichever you choose, the pro habit is the same: one approach, applied
  everywhere, with custom properties as the only source of colours and sizes.
