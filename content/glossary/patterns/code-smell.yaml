term: code smell
aka:
  - smell
short: A surface sign in code, such as a huge function, that something deeper might be wrong.
explain: |
  A 300-line function, a class everyone edits, the same switch statement in four places, a
  parameter list of eight booleans. None of them is a bug. Each hints that the design will
  fight the next change.

  A smell is a reason to look, not a rule to obey. Each has known refactoring moves: extract
  a function, group parameters into an object, replace a conditional with a lookup table.
  Fix it when you're about to work there anyway, under tests.
analogy: A smell of burning in the kitchen. Maybe it's toast, maybe it's the wiring, but you look before you carry on.
usage: The long parameter list is a code smell, so group them into an options object.
related:
  - refactoring
  - magic-number
  - guard-clause
level: 2
lessons:
  - clean.code-smells
