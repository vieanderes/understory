summary: >-
  TypeScript's checker is only as strict as its settings. `strict: true` switches on a family
  of checks, and the one that matters most is `strictNullChecks`: without it, `null` and
  `undefined` fit every type, so the most common crash in JavaScript, reading a property of
  nothing, goes unreported. TypeScript 6.0 turned `strict` on by default, but plenty of code
  and tutorials predate that, so you'll still meet projects with it off.


  Two useful checks sit outside the family because they flag working code.
  `noUncheckedIndexedAccess` adds `undefined` to reads by index or key.
  `exactOptionalPropertyTypes` tells "the property is missing" apart from "the property is
  there and set to `undefined`". Both are worth turning on in new code.


  The other half of the lesson is what people do when the checker complains. `any` switches
  checking off, `as` claims a type, and `!` claims a value is present. All three are erased,
  so they change what the checker believes and nothing about what runs. In review, treat each
  one as a question: what would happen here if the claim were false?
remember:
  - "`strictNullChecks` is the check that matters most: without it `null` and `undefined` fit every type, and missing-value crashes go unreported."
  - "`strict: true` switches on `noImplicitAny`, `strictNullChecks`, `strictFunctionTypes`, `strictBindCallApply`, `strictPropertyInitialization`, `strictBuiltinIteratorReturn`, `noImplicitThis`, `useUnknownInCatchVariables` and `alwaysStrict`, and TypeScript 6.0 made it the default."
  - "`noUncheckedIndexedAccess` isn't part of `strict`; it adds `undefined` to array indexes and index-signature reads, but not to tuples or known property names."
  - "`exactOptionalPropertyTypes` makes `nickname?: string` mean \"absent or a string\", so writing `nickname: undefined` becomes an error."
  - "`useUnknownInCatchVariables` types a caught value as `unknown`, because JavaScript can throw anything; check `error instanceof Error` before reading `.message`."
  - "`any`, `as` and `!` silence the checker and change nothing at run time, so each one needs a reason you could defend in review."
  - Prefer `unknown` to `any` for values you don't know yet, because `unknown` accepts everything but allows nothing until you narrow it.
  - "When a codebase can't be fixed at once, mark each known error with `@ts-expect-error`, which fails when the error disappears, rather than `@ts-ignore`, which hides future errors too."
sections:
  - title: What the strict family catches
    body: |-
      Each flag closes one gap. Four of them in action, with the errors `tsc --strict`
      reports:

      ```ts
      function total(items) {
        return items.length;
      }
      // Parameter 'items' implicitly has an 'any' type.            (noImplicitAny)

      class Basket {
        items: string[];
        owner: string;
        constructor(owner: string) {
          this.owner = owner;
        }
      }
      // Property 'items' has no initializer and is not definitely
      // assigned in the constructor.                    (strictPropertyInitialization)

      try {
        JSON.parse("{");
      } catch (error) {
        console.log(error.message);
      }
      // 'error' is of type 'unknown'.                   (useUnknownInCatchVariables)

      function add(a: number, b: number) {
        return a + b;
      }
      add.call(undefined, 1, "2");
      // Argument of type 'string' is not assignable to
      // parameter of type 'number'.                     (strictBindCallApply)
      ```

      The fixes are ordinary code. Annotate `items: readonly string[]`. Initialise
      `items: string[] = []`. Narrow the caught value:

      ```ts
      try {
        JSON.parse("{");
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        console.log(message.startsWith("Expected")); // true
      }
      ```

      The `catch` rule exists because `throw "timeout"` and `Promise.reject(404)` are legal,
      so a caught value is not always an `Error`. `noImplicitThis` flags a `this` whose type
      can't be known, and `alwaysStrict` parses every file in JavaScript's strict mode.
      `strictBuiltinIteratorReturn` (TypeScript 5.6) types the finished result of built-in
      iterators as `undefined` rather than `any`. New checks join the family over time, so
      upgrading TypeScript can surface new errors; that's by design.
  - title: strictFunctionTypes and the method loophole
    body: |-
      A function that handles any payment can stand in where a card-payment handler is
      wanted. The reverse is unsafe: a card handler given a plain payment reads a card number
      that isn't there. With `strictFunctionTypes`, the checker compares function parameters
      in this safe direction, called **contravariance**. There's one deliberate exception:

      ```ts
      type Payment = { amount: number };
      type CardPayment = Payment & { last4: string };

      const showLast4 = (p: CardPayment) => console.log(p.last4.padStart(8, "*"));

      type AsProperty = { handle: (p: Payment) => void };
      interface AsMethod {
        handle(p: Payment): void;
      }

      const a: AsProperty = { handle: showLast4 };
      // Type '(p: CardPayment) => void' is not assignable to type '(p: Payment) => void'.

      const b: AsMethod = { handle: showLast4 }; // compiles
      b.handle({ amount: 500 });
      // TypeError: Cannot read properties of undefined (reading 'padStart')
      ```

      Parameters declared with **method syntax**, `handle(p: Payment): void`, are still
      checked in both directions, called **bivariance**. The reason is history: arrays and
      the DOM's own types are written with methods, and checking them strictly would reject
      a lot of correct code, such as passing a `CardPayment[]` where a `Payment[]` is read. The
      practical rule: in your own types, write callbacks as properties,
      `handle: (p: Payment) => void`, and you get the strict check.
  - title: The two checks outside strict
    body: |-
      `noUncheckedIndexedAccess` assumes a read by computed key may miss. It knows the
      difference between shapes it can see and ones it can't:

      ```ts
      const fares: Record<string, number> = { central: 280 };
      const list = [190, 230];
      const pair: [string, number] = ["central", 280];

      fares.central; // number | undefined: an index signature, even with a dot
      list[0]; // number | undefined, even after checking list.length
      list.at(0); // number | undefined, with or without the flag
      pair[0]; // string: a tuple's length is known
      for (const fare of list) fare; // number: iteration never misses

      const i = 0;
      if (list[i] !== undefined) list[i]; // number: narrowed, because i is a const
      ```

      So the fixes are narrowing, `for...of` instead of index loops, and destructuring into
      a checked variable. A length check doesn't narrow, which is the flag's main annoyance.

      `exactOptionalPropertyTypes` separates two states that JavaScript also separates:

      ```ts
      type Profile = { name: string; nickname?: string };

      const p: Profile = { name: "Ada", nickname: undefined };
      // Type '{ name: string; nickname: undefined; }' is not assignable to type 'Profile'
      // with 'exactOptionalPropertyTypes: true'.

      const q: Profile = { name: "Ada" };
      console.log("nickname" in p, "nickname" in q); // true false (with the error ignored)
      ```

      The two objects behave differently under `in`, `Object.keys`, spread and
      `JSON.stringify`, so the flag catches the "spread wipes a field" bug from the last
      lesson. When `undefined` is a meaningful value, say so: `nickname?: string | undefined`.

      Other checks worth knowing: `noImplicitOverride` requires `override` on a method that
      replaces a parent's, `noImplicitReturns` flags a path that forgets to return, and
      `noFallthroughCasesInSwitch` flags a `case` that runs into the next.
  - title: Escape hatches, ranked by risk
    body: |-
      **`any`** is the worst, because it spreads. Everything read from an `any` is `any`,
      and an `any` fits every annotation, so one untyped `JSON.parse` result can switch off
      checking across a module. Use `unknown` for values you haven't checked yet.

      **`as`** is limited. The checker refuses a conversion between types that don't overlap:

      ```ts
      type Order = { id: string; totalPence: number };
      const a = "O-1" as Order;
      // Conversion of type 'string' to type 'Order' may be a mistake because neither type
      // sufficiently overlaps with the other. If this was intentional, convert the
      // expression to 'unknown' first.
      const b = "O-1" as unknown as Order; // compiles, and is a lie
      const c = {} as Order; // compiles: {} overlaps, and c has no id
      ```

      A double cast through `unknown` is always a review question. `{} as Order` is the
      common quiet one: a half-built object claiming to be complete.

      **`!`** removes `null` and `undefined` and nothing else. The related **definite
      assignment** form, `total!: number` on a class field, tells the checker a field is set
      somewhere it can't see.

      Legitimate uses exist. A test may cast a partial fixture. A library boundary may need
      `as` after a check the checker can't follow, such as a runtime schema. The DOM's
      `querySelector<HTMLInputElement>("#email")` is a typed lookup that still returns
      `null` when nothing matches, so it keeps you honest. Keep each hatch small, local and
      commented, and prefer a type guard, `(x): x is Order`, which at least puts the check in
      code you can test.
  - title: Turning strict on in an existing codebase
    body: |-
      Switching `strict` on in a large, lax codebase can produce thousands of errors. Nobody
      fixes those in one pull request. A plan that works:

      1. Turn on one flag at a time, starting with `noImplicitAny`, then
         `strictNullChecks`, which finds the most real bugs and produces the most errors.
      2. Fix what you can with narrowing: an `if`, an early return, a default value with
         `??`.
      3. Mark the rest with `// @ts-expect-error` and a short reason. It fails with
         "Unused '@ts-expect-error' directive" once the line is fixed, so the list only
         shrinks. `@ts-ignore` stays silent forever and hides new errors on that line too.
      4. Stop new hatches arriving: typescript-eslint's `no-explicit-any` and
         `no-non-null-assertion` rules, and a CI step that runs `tsc --noEmit`.
      5. Count the remaining directives in CI and never let the number rise.

      Some teams check new code strictly and old code loosely, using a second
      `tsconfig.json` or per-directory settings. It works, but it splits the codebase into
      two type systems, so treat it as temporary.
pitfalls:
  - "**Adding `!` to make a red line go away.** The value can still be missing, and now the crash has no warning. Narrow with an `if`, return early, or give a default with `??`."
  - "**Casting parsed data with `as`.** `JSON.parse(text) as Order` checks nothing about the text. Treat it as `unknown` and validate it, by hand or with a schema library."
  - "**Checking `undefined` with truthiness.** `if (!fare)` also rejects `0` and `\"\"`, which are real values. Compare with `=== undefined` when zero or empty text is allowed."
  - "**Assuming the caught value is an `Error`.** `(error as Error).message` gives `undefined` when a library throws a string. Use `error instanceof Error ? error.message : String(error)`."
  - "**Using `@ts-ignore` during a migration.** It also hides every new error on that line and never reminds you. Use `@ts-expect-error` with a reason, so a fixed line forces its removal."
  - "**Writing callbacks as methods in your own types.** `handle(p: Payment): void` is checked loosely and lets a narrower handler through. Write `handle: (p: Payment) => void`."
verify:
  - lens: breaks
    check: '`strict` stays on, and each `!` or `as` in a diff becomes narrowing unless the value truly cannot be missing.'
  - lens: breaks
    check: 'DOM lookups check for `null` before use, since the same script may run on pages without the element.'
  - lens: confuses
    check: 'Caught values are checked with `instanceof Error` before anyone reads `message`.'
  - lens: tests
    check: 'Run each script on a page where its elements are missing, as well as the one it was written for.'
interview:
  - question: What's the difference between `any` and `unknown`?
    answer: >-
      Both accept any value, but `unknown` makes you prove what it is before you use it,
      while `any` switches checking off. With `unknown`, reading a property, calling it or
      passing it to a typed parameter is an error until you narrow with `typeof`,
      `instanceof`, `in` or a type guard. With `any`, everything compiles, every read gives
      another `any`, and an `any` satisfies every annotation, so it spreads silently through
      a codebase. I use `unknown` at every boundary: `JSON.parse` results, `fetch` bodies,
      caught errors, message events, then validate. `any` has a few legitimate uses, such as
      a generic constraint like `(...args: any[]) => unknown`. Even then it should be
      deliberate and local.
  - question: What does `strict` mode do, and which flag matters most?
    answer: >-
      `strict: true` switches on a family of checks: `noImplicitAny`, `strictNullChecks`,
      `strictFunctionTypes`, `strictBindCallApply`, `strictPropertyInitialization`,
      `noImplicitThis`, `useUnknownInCatchVariables`, `alwaysStrict` and, since 5.6,
      `strictBuiltinIteratorReturn`. TypeScript 6.0 made it the default. `strictNullChecks`
      matters most: without it `null` and `undefined` are assignable to every type, so
      `document.querySelector("#email").value` compiles and crashes on pages without the
      field. I'd also add `noUncheckedIndexedAccess`, which isn't in the family, so
      `items[0]` is `T | undefined`. The trade-off is some noise, mostly index loops that are
      safe, and the fix is usually `for...of` or a narrowing check.
  - question: When is a non-null assertion acceptable, and what's the danger?
    answer: >-
      Rarely: only when an invariant guarantees the value and the checker can't see it, and
      then with a comment. The danger is that `!` is erased. It tells the checker the value
      is never `null` or `undefined`, and nothing checks that at run time, so if the
      invariant breaks you get "Cannot read properties of undefined" far from the cause.
      Typical misuse is `members.find(...)!.name` or `querySelector(...)!`, where "not found"
      is a real case. Better options are narrowing with an `if`, a default with `??`, or an
      assertion function that throws a clear error, such as
      `assertDefined(member, "no member M-9")`, which fails loudly at the right place. Lint with
      `no-non-null-assertion` so each use is a decision.
  - question: Why does TypeScript allow a method parameter to be narrower than the interface says?
    answer: >-
      Because method-syntax parameters are checked bivariantly, even under
      `strictFunctionTypes`. Function parameters should be contravariant: a handler for any
      payment can replace a card-payment handler, not the other way round. `strictFunctionTypes`
      enforces that for function-typed properties like `handle: (p: Payment) => void`. For
      methods written `handle(p: Payment): void`, TypeScript keeps the old bivariant check,
      because built-in types such as `Array<T>` are declared with methods and strict checking
      would reject common correct code. The cost is a real hole: a `CardPayment` handler can
      be assigned and then crash on a plain payment. So in my own types I declare callbacks
      as properties to get the strict check.
  - question: How would you turn on strict mode in a large existing codebase?
    answer: >-
      Incrementally, one flag at a time, with a ratchet so progress can't slip back. I'd
      start with `noImplicitAny`, then `strictNullChecks`, which finds the most real bugs.
      For each flag, fix what's quick with narrowing and defaults, and mark the rest with
      `@ts-expect-error` plus a reason, which fails once the line is fixed, unlike
      `@ts-ignore`. CI runs `tsc --noEmit` and counts the directives so the number only
      falls. Lint rules against `any` and `!` stop new debt. Splitting old and new code into
      separate configs can help a very large repository, but it creates two standards, so I'd
      give it an end date. The trade-off is time now against fewer production
      null-reference bugs later, and in my experience the null checks pay for themselves.
