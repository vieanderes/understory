id: widest-banner
title: WidestBanner
topic: stacks-and-queues
difficulty: hard
type: algorithmic
recommendedMinutes: 40
signature:
  params:
    - { name: H, type: "int[]" }
  returns: int
statement: |-
  A street has N buildings in a row, each 1 metre wide. Building K is H[K] metres tall. A
  rectangular banner hangs flat against the front of some adjacent buildings. Its top
  cannot rise above the lowest building it covers.

  Write a function:

  {{signature}}

  that, given an array H of N integers, returns the largest area, in square metres, that
  one banner can have. If every building has height 0, the function should return 0.

  For example, given H = [2, 1, 5, 6, 2, 3], the function should return 10. The banner
  covers buildings 2 and 3 and is 5 metres high.

  Given H = [3, 3, 3, 3], the function should return 12.

  Write an **efficient** algorithm for the following assumptions:

  - N is an integer within the range [1..100,000];
  - each element of array H is an integer within the range [0..1,000,000,000].
examples:
  - { args: [[2, 1, 5, 6, 2, 3]], expected: 10 }
  - { args: [[3, 3, 3, 3]], expected: 12 }
timeLimitMs: 500
tests:
  - name: extreme_single
    description: a single building
    group: correctness
    cases:
      - { args: [[0]], expected: 0 }
      - { args: [[7]], expected: 7 }
  - name: all_equal
    description: equal heights, all zero
    group: correctness
    cases:
      - { args: [[3, 3, 3, 3]], expected: 12 }
      - { args: [[0, 0, 0]], expected: 0 }
  - name: sorted
    description: ascending and descending heights
    group: correctness
    cases:
      - { args: [[1, 2, 3, 4, 5]], expected: 9 }
      - { args: [[5, 4, 3, 2, 1]], expected: 9 }
  - name: simple
    description: a zero splits the row, duplicates beside a dip, a valley
    group: correctness
    cases:
      - { args: [[4, 4, 0, 3, 3, 3]], expected: 9 }
      - { args: [[2, 2, 1, 2, 2]], expected: 5 }
      - { args: [[6, 2, 5, 4, 5, 1, 6]], expected: 12 }
  - name: extreme_min_max_value
    description: one tall building, many at the maximum height
    group: correctness
    cases:
      - { args: [[1, 1000000000, 1]], expected: 1000000000 }
      - generate: { seed: 1, args: [{ kind: constant, n: 1000, value: 1000000000 }] }
  - name: small_random
    description: random heights, N = 200
    group: correctness
    cases:
      - generate: { seed: 3, args: [{ kind: ints, n: 200, min: 0, max: 50 }] }
      - generate: { seed: 4, args: [{ kind: ints, n: 150, min: 0, max: 1000000000 }] }
  - name: medium_random
    description: random heights, N = 3,000
    group: correctness
    cases:
      - generate: { seed: 5, args: [{ kind: ints, n: 3000, min: 0, max: 10000 }] }
  - name: large_ascending
    description: heights 1 to N, N = 100,000
    group: performance
    cases:
      - generate: { seed: 6, args: [{ kind: range, n: 100000, start: 1, step: 1 }] }
  - name: large_random
    description: random heights, N = 100,000
    group: performance
    cases:
      - generate: { seed: 7, args: [{ kind: ints, n: 100000, min: 0, max: 1000000000 }] }
      - generate: { seed: 8, args: [{ kind: repeat, times: 1000, unit: [1000, 1010, 1020, 1030, 1040, 1050, 1060, 1070, 1080, 1090, 1100, 1110, 1120, 1130, 1140, 1150, 1160, 1170, 1180, 1190, 1200, 1210, 1220, 1230, 1240, 1250, 1260, 1270, 1280, 1290, 1300, 1310, 1320, 1330, 1340, 1350, 1360, 1370, 1380, 1390, 1400, 1410, 1420, 1430, 1440, 1450, 1460, 1470, 1480, 1490, 1500, 1510, 1520, 1530, 1540, 1550, 1560, 1570, 1580, 1590, 1600, 1610, 1620, 1630, 1640, 1650, 1660, 1670, 1680, 1690, 1700, 1710, 1720, 1730, 1740, 1750, 1760, 1770, 1780, 1790, 1800, 1810, 1820, 1830, 1840, 1850, 1860, 1870, 1880, 1890, 1900, 1910, 1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990] }] }
  - name: extreme_large
    description: all buildings at the maximum height, N = 100,000
    group: performance
    cases:
      - generate: { seed: 9, args: [{ kind: constant, n: 100000, value: 1000000000 }] }
