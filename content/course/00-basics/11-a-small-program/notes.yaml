summary: >-
  A real program is many small ideas working together. This lesson joins everything from the
  chapter into one. A list of objects holds the data and functions do the jobs. A loop goes
  through the tasks, and an `if` decides how each one looks. None of that is new. What's new is
  the order you do it in.


  That order is the skill. First list what the program must do, in plain words. Then decide
  the shape of the data, because every function will read or change it. Then write one small
  function per job, and try each one as soon as it exists. This is called **breaking a problem
  down**, and it's how programs of every size get written.


  Small functions pay off right away. Each one can be read on its own, called again and fixed
  without touching the others. When something breaks, the stack trace names the function, and
  you know which few lines to open.
remember:
  - Before writing code, list what the program must do in small steps, and let each step become a function.
  - Decide the shape of the data first, here a list of objects that all have a `title` and a `done` flag.
  - Give each function one job and a name that says what it does, like `addTask` or `showList`.
  - Write one function at a time and call it straight away, so a mistake shows up while the code is still small.
  - A function that returns a value can be reused and checked, while one that only prints can only be looked at.
  - People count tasks from 1 and indexes start at 0, so subtract 1 when a person picks task 2.
  - Ask what each function should do with an empty list or a position that doesn't exist.
sections:
  - title: From a plan to working code, in order
    body: |-
      Starting at line 1 and typing until it works rarely goes well. This order does.

      1. **Write the jobs in plain words.** Keep a list, add a task, mark one done, show the
         list. If a job needs "and" to describe, it's probably two jobs.
      2. **Choose the data shape.** One task is an object: `{ title: "Buy milk", done: false }`.
         All tasks are an array of those. Every function depends on this, so settle it first.
      3. **Name the functions.** A function name should be a verb phrase that says what it
         does: `addTask`, `completeTask`, `showList`. If you can't name a function in a few
         words, it's doing too much.
      4. **Write the smallest function first and call it.** Write `addTask`, call it once,
         print `tasks`, and look. Only then write the next function.
      5. **Add the edge cases last**, once the everyday path works.

      Step 4 matters most. Code you've run is code you know works. If you write all three
      functions and then run them, and something's wrong, the bug could be anywhere. If you run
      after each one, the bug is in the lines you wrote in the last few minutes.

      ```js
      const tasks = [];
      function addTask(title) {
        tasks.push({ title: title, done: false });
      }
      addTask("Buy milk");
      console.log(tasks); // [ { title: 'Buy milk', done: false } ]
      ```

      That one printed line proves the data shape and the function in one go.
  - title: Return values make the pieces fit together
    body: |-
      In the challenge, `showList` does two jobs at once. It decides how a task looks, and it
      prints it. Splitting those gives you pieces you can reuse.

      ```js
      function formatTask(task) {
        if (task.done) {
          return `[x] ${task.title}`;
        }
        return `[ ] ${task.title}`;
      }

      console.log(formatTask({ title: "Buy milk", done: true })); // [x] Buy milk
      console.log(formatTask({ title: "Call the dentist", done: false })); // [ ] Call the dentist
      ```

      `formatTask` returns text instead of printing it. So it can be used anywhere: in a list,
      in a message, or in a test that checks its answer. When the first `return` runs, the
      function ends, which is why the second `return` needs no `else`.

      The same goes for numbers. A `countLeft` function that returns how many tasks are open
      can feed a heading, a warning or a badge. A function that only prints the count can feed
      nothing.

      A useful split for any program: some functions **work things out** and return a result,
      and a few functions at the edge **show** results. The working-out functions are where
      most bugs hide, and they're the simplest ones to check, because you can compare what they
      return with what you expected.
  - title: Edge cases the challenge leaves out
    body: |-
      The challenge's `completeTask` trusts its caller. Give it a position that doesn't exist
      and the program stops:

      ```text
      TypeError: Cannot set properties of undefined (setting 'done')
          at completeTask (todo.js:6:21)
      ```

      `tasks[index]` is `undefined` when nothing is stored there, and you can't set a property
      on `undefined`. A careful version checks first and reports whether it worked. Here's the
      whole program with that change, plus numbered lines and a message for an empty list:

      ```js
      const tasks = [];

      function addTask(title) {
        tasks.push({ title: title, done: false });
      }

      function completeTask(index) {
        const task = tasks[index];
        if (task === undefined) {
          return false;
        }
        task.done = true;
        return true;
      }

      function formatTask(task) {
        if (task.done) {
          return `[x] ${task.title}`;
        }
        return `[ ] ${task.title}`;
      }

      function countLeft() {
        let left = 0;
        for (const task of tasks) {
          if (task.done === false) {
            left = left + 1;
          }
        }
        return left;
      }

      function showList() {
        if (tasks.length === 0) {
          console.log("Nothing to do");
        } else {
          for (let i = 0; i < tasks.length; i++) {
            console.log(`${i + 1}. ${formatTask(tasks[i])}`);
          }
          console.log(`${countLeft()} left`);
        }
      }

      showList();
      addTask("Buy milk");
      addTask("Call the dentist");
      addTask("Water the plants");
      console.log(completeTask(0));
      console.log(completeTask(7));
      showList();
      // Nothing to do
      // true
      // false
      // 1. [x] Buy milk
      // 2. [ ] Call the dentist
      // 3. [ ] Water the plants
      // 2 left
      ```

      Look at the numbers. The screen shows `1.` for the task at index 0. So when a person
      says "I finished task 2", the code calls `completeTask(2 - 1)`. Mixing up the two ways of
      counting is the most common bug in programs like this one.
  - title: One shared list, and when that stops working
    body: |-
      Every function here reads and changes the same `tasks` list, made at the top of the
      file. For a program this size, that's the right choice. It's short, and each function is
      clear to follow.

      It has a cost that grows with the program. Any function can change the list, so when the
      list is wrong, every function is a suspect. And you can't have two lists, say one for
      home and one for work, without copying every function.

      The fix, when you need it, is to pass the list in as a parameter:

      ```js
      function countLeft(list) {
        let left = 0;
        for (const task of list) {
          if (task.done === false) {
            left = left + 1;
          }
        }
        return left;
      }

      const home = [{ title: "Water the plants", done: false }];
      const work = [
        { title: "Send the report", done: true },
        { title: "Book a meeting room", done: false },
      ];
      console.log(countLeft(home)); // 1
      console.log(countLeft(work)); // 1
      ```

      Now `countLeft` works on any list, and it can only read the list it was given. Later
      chapters build on this, with functions that return a new list instead of changing the
      old one. For now, knowing why the shared list is a trade-off is enough.

      One more limit: the list lives only while the program runs. Run it again and it starts
      empty. Keeping tasks between runs needs a file or a database, which later chapters cover.
pitfalls:
  - '**Writing everything before running anything.** A bug could then be in any of fifty lines. Run the code after each function, while the new part is still small.'
  - '**Checking the list instead of the task.** Inside `for (const task of tasks)`, `tasks.done` asks the list, which has no `done`, so every task looks unfinished. Use `task.done`.'
  - '**Replacing the list instead of adding to it.** `tasks = { title: title, done: false }` tries to swap the whole list for one task, and a `const` list stops with a type error. Use `tasks.push(...)`.'
  - '**Mixing up the position people see and the index.** The first task shows as `1.` but lives at index 0. Subtract 1 when a person gives you a number.'
  - '**One function doing every job.** A `showList` that also adds and completes tasks can''t be reused or checked in parts. Give each job its own function.'
  - '**Trusting every position.** `completeTask(7)` on a list of three stops with `Cannot set properties of undefined`. Check that the item exists before changing it.'
interview:
  - question: How would you approach building a small program from scratch?
    answer: >-
      I'd plan it in plain words first, settle the data shape, then build and run one small
      function at a time. For a to-do list, the jobs are to keep tasks, add one, mark one done
      and show them. The data shape comes next, because every function depends on it: an array
      of objects, each with a `title` and a `done` flag. Then each job becomes a function named
      after what it does. I write the simplest one, call it, and print the result before
      writing the next, so any bug is in the few lines I've just added. Edge cases come once
      the everyday path works, such as an empty list or a position that doesn't exist. For a
      throwaway script I'd plan less, but I'd still run it in small pieces.
  - question: Why split a program into small functions rather than one long block?
    answer: >-
      Because each small function can be understood, reused and fixed on its own. A function
      with one job and a clear name, like `formatTask`, can be read in a few seconds and checked
      by comparing what it returns with what I expect. It can be called from several places, so
      the logic exists once, and a fix in one place fixes every use. When an error happens, the
      stack trace names the function, which tells me which few lines to open. Functions that
      return values rather than printing also make testing possible. The trade-off is that
      splitting too finely scatters simple logic across many tiny functions, which is harder to
      follow. I split when a piece has a job I can name.
  - question: 'What happens if `completeTask` gets a position that doesn''t exist, and how would you handle it?'
    answer: >-
      Without a check, the program stops with a type error, because `tasks[index]` is
      `undefined` and you can't set `done` on it. The message is `TypeError: Cannot set
      properties of undefined (setting 'done')`. To handle it, I read the item into a variable
      first and check whether it's `undefined`. If it is, I return `false` and change nothing.
      Otherwise I set `done` and return `true`. The caller can then tell the person the task
      wasn't found, instead of the whole program stopping. I'd also look at where bad positions
      come from. The usual cause is off-by-one: the screen numbers tasks from 1 while the list
      counts from 0, so the caller must subtract 1.
