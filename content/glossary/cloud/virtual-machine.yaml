term: virtual machine
aka: [ VM, VPS, virtual private server ]
short: A whole computer imitated in software, with its own operating system, running on shared physical hardware.
explain: |
  A big physical server is more than one app needs. Software can carve it into several pretend
  computers, each believing it has its own hardware.

  Each one boots a full operating system with its own kernel, so it's strongly isolated. But
  it starts slower and uses more memory. Renting one by the month is the classic VPS. You get
  root access, and the patching, backups and security are yours.
analogy: Flats in one building. Each has its own front door, kitchen and bills, but they share the foundations.
usage: The old app runs on one virtual machine nobody has patched since it was set up.
twin:
  term: container
  difference: A virtual machine runs a whole operating system with its own kernel. A container is an isolated process that shares the host's kernel, so it is lighter and starts faster.
related: [ container, self-hosting, vertical-scaling ]
level: 1
lessons: [ cloud.containers, cloud.hosting-models ]
