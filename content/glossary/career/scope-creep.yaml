term: scope creep
aka:
  - feature creep
short: A project's goals growing bit by bit after it starts, until the plan no longer fits.
explain: |
  "While you're in there, could it also..." Each request sounds small. Together they double
  the work, but the deadline stays where it was.

  The defence is written down before work starts: the goal, the non-goals, and what "done"
  means. A new idea then becomes a choice, now or next, with its cost visible, instead of a
  quiet addition.
analogy: Agreeing to paint one room, then the hall, then the ceiling "since the ladder's out". Same price, same weekend.
usage: Export to PDF is scope creep, so put it in the next milestone and ship this one.
related:
  - non-goal
  - design-doc
