term: base case
aka: [base cases, stopping case]
short: The input small enough for a self-calling function to answer directly, without calling itself again.
explain: |
  A recursive function keeps handing a smaller problem to itself. Something has to stop
  it. That's the input whose answer is known outright: an empty list, a zero, a leaf.

  Check it first, at the top of the function. Then make sure every other call moves
  towards it. A recursion that skips past its stopping point runs until the stack
  overflows.

  Most recursion bugs live here. The empty input gets forgotten. Or a step jumps
  over the stopping value, like counting down by two from an odd number.
analogy: The bottom step of a staircase. However high you start, you know you're done when your foot touches the floor.
example:
  language: python
  code: |
    def total(nums):
        if not nums:          # stop: an empty list sums to 0
            return 0
        return nums[0] + total(nums[1:])
usage: You've got no base case for the empty array, so the first hidden test will recurse forever.
related: [recursion, call-stack, edge-case]
level: 2
lessons: [cs.recursion, algo.dynamic-programming]
