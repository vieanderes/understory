term: mutation testing
aka: [mutation score, mutant]
short: Making small deliberate bugs in the code and checking that at least one test fails for each.
explain: |
  How do you test your tests? Break the code on purpose and see if they notice. Change a
  `>` to `>=`, a `+` to `-`, delete a line. Each change is a **mutant**. If every test
  still passes, the mutant **survived**, and that's a gap.

  Tools like Stryker do this automatically and report a score: the share of mutants your
  tests killed. It measures what coverage can't, whether anything is checked. It's slow, so
  teams run it on core logic or on changed files, not the whole codebase every commit.
analogy: A fire drill with a fake fire in a different room each time, to see whether the alarms really go off.
example:
  language: ts
  code: |
    // original
    const canVote = (age: number) => age >= 18;

    // a mutant: if no test checks age 18, it survives
    const canVoteMutant = (age: number) => age > 18;
usage: Mutation testing shows the boundary at 18 isn't tested; every mutant there survived.
twin:
  term: test-coverage
  difference: Mutation testing checks that your tests would notice a change. Coverage only checks that your tests ran the line.
related: [test-coverage, assertion, unit-test]
level: 3
lessons: [testing.unit-tests]
