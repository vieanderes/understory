term: rebase
aka:
  - git rebase
short: Replaying your commits on top of a newer starting point, so history reads as one straight line.
explain: |
  You branched off `main` last week, and `main` has moved on. You'd like your work to look
  as if you started today, with no tangle in the history.

  This takes each of your commits and re-applies it on top of the new base. The changes
  are the same, but every commit is new, with a new hash. That's fine on your own branch.
  On a branch others have pulled, it rewrites history under them, so their next pull goes
  wrong. If you did rewrite a pushed branch, use `git push --force-with-lease`.
analogy: Re-dealing a hand of cards onto a fresh pile. Same cards, same order, but now they sit on top of everything played since.
example:
  language: bash
  code: |
    $ git switch add-search
    $ git fetch origin
    $ git rebase origin/main
    Successfully rebased and updated refs/heads/add-search.
    $ git push --force-with-lease
usage: Rebase onto main before you open the PR, so the history is one clean line.
twin:
  term: merge
  difference: A rebase rewrites your commits onto a new base for a straight history. A merge leaves every commit alone and adds one that joins the two lines.
related:
  - merge
  - branch
level: 3
lessons:
  - tooling.git-as-a-graph
  - tooling.remotes
