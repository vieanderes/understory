deepDive: >-
  Every run used Docker 28.3, Caddy 2.11 as the balancer, PostgreSQL 17.11 and k6 2.3, all
  on one laptop. Each request ran `SELECT pg_sleep(0.05)` through a `pg` pool of 10
  connections per instance. We set `max_connections=20` so the limit would bite early;
  three of those are reserved for superusers. One instance served 2,161 requests in 20
  seconds with no failures. Three instances wanted 30 connections: 672 of 2,342 requests
  failed. Six wanted 60: 597 of 1,306 failed, and only 709 succeeded. The fix is a shared
  pooler such as PgBouncer (db.storage-and-pooling), or fewer connections per instance.


  The hit counter ran on the same setup at three instances, with Caddy's `dynamic a` upstreams
  and `round_robin`. Caddy found the copies by the Compose service name.


  Once one balancer carries everything, it becomes the single point of failure. Providers
  sell managed balancers that are already redundant. On your own servers, two proxies share
  a floating IP, moved by a tool such as keepalived.


  The bill is made up from real list prices: a g5.xlarge (one NVIDIA A10G) was listed at
  $1.006 an hour on demand, so a month of 720 hours is about $724. Prices vary by region
  and change over time; check your provider's price list. Budgets on AWS, GCP and Azure
  alert by email or a message queue, and some can stop resources, but none stop spend by
  default.
