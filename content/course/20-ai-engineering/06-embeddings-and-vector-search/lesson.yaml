deepDive: >-
  **Where embeddings come from.** Chat models and embedding models are different models.
  Some providers offer both. Anthropic points to a partner, Voyage AI, for embeddings. The
  vectors in this lesson's challenge are three made-up numbers, so they fit on a screen.


  **Unit length.** Many embedding APIs return vectors of length 1. Then the dot product
  alone equals the cosine, which is why vector databases often offer both.


  **pgvector in one line.** A column of type `vector(1024)`, an index `USING hnsw
  (embedding vector_cosine_ops)`, and `ORDER BY embedding <=> $1 LIMIT 5` gives the five
  nearest by cosine distance. On 100,000 random vectors, adding the index took one query
  from 22 ms to 0.3 ms.


  **A silent bug.** The pure-Python `cosine` in the challenge uses `zip`, which stops at the
  shorter list. Vectors of two different lengths, from two models, give a score and no
  error. NumPy would raise instead.
