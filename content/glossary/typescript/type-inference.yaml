term: type inference
aka:
  - inference
  - inferred type
short: The checker working out a type by itself from the value, with no note from you.
explain: |
  Write `let count = 0` and TypeScript already knows `count` is a number. Assign a string to
  it later and you get an error, though you never wrote `: number`.

  So most variables need no annotation. Annotate the edges instead: function parameters and
  the values that come from outside. Hover in your editor to see what was worked out. If it
  surprises you, that's a bug waiting to happen.
analogy: A waiter who sees you holding a tea bag and brings hot water without being asked.
example:
  language: ts
  code: |
    let count = 0; // number
    const names = ['tea', 'milk']; // string[]
    const total = names.length * 2; // number
    count = 'many'; // error: string is not number
usage: Leave that one to type inference; the annotation repeats what the checker already knows.
twin:
  term: type-annotation
  difference: Inference is the checker working out a type from the value. An annotation is you writing the type down yourself, which the checker then holds the value to.
related:
  - type-annotation
  - generics
level: 1
lessons:
  - ts.everyday-types
