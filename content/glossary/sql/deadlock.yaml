term: deadlock
aka: [deadlocks, lock cycle]
short: Two pieces of work each waiting for something the other holds, so neither can ever continue.
explain: |
  Transaction A locks row 1 and wants row 2. Transaction B locks row 2 and wants row 1.
  Each waits for the other, forever.

  Databases spot the cycle and cancel one of the two; Postgres raises error `40P01`. Your
  code should retry the cancelled one. To make deadlocks rare, take locks in the same order
  everywhere, for example by sorting ids before you update them, and keep transactions
  short.
analogy: Two cars meeting on a single-track lane, each waiting for the other to reverse.
example:
  language: sql
  code: |
    -- lock in one order everywhere: lowest id first
    BEGIN;
    SELECT * FROM accounts WHERE id IN (3, 8)
      ORDER BY id FOR UPDATE;
    -- move the money
    COMMIT;
usage: The transfer job hits a deadlock whenever two transfers cross; sort the account ids before locking.
twin:
  term: race-condition
  difference: In a deadlock nothing moves, because everyone is waiting. In a race condition everything moves, but in an order that gives the wrong answer.
related: [transaction, isolation-level, race-condition]
level: 2
lessons: [db.isolation-levels]
