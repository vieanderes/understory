id: aisys.shaping-the-build
title: Shape the build before you code
objective: "Shape an AI feature before building it: state the outcome and its success metric, rank the assumptions by risk, pick the smallest testable slice, and write a spec that leaves room for judgement."
level: advanced
minutes: 10
concepts: [aisys.outcomes-and-metrics, aisys.assumption-mapping, aisys.smallest-testable-slice, aisys.judgement-preserving-specs]
prerequisites: [aisys.agent-workbench]
opening:
  text: >-
    You'll turn a vague request into a brief worth building: a measurable outcome, the risky
    bets named, a first slice and a spec. With agents, typing is cheap, so knowing what to
    build is the job.

steps:
  - type: prose
    id: outcome-not-output
    body: |-
      Say you're asked to "add AI summaries to support tickets". That's an **output**: a
      thing you ship. The **outcome** is the change it should cause, such as agents resolving
      tickets faster.

      Before building, give the outcome a **success metric**: what you'll measure, the
      baseline, the target, and a guardrail that mustn't get worse. Set them now, before a
      result can bend them.

  - type: multiple-choice
    id: pick-the-outcome
    concept: aisys.outcomes-and-metrics
    difficulty: 1
    question: Which one is an outcome, not an output?
    choices:
      - text: Median handling time drops from 12 to 9 minutes
        correct: true
        feedback: >-
          Yes. It's a change for the people using it, and you can measure it.
      - text: A summary panel on every ticket
        feedback: >-
          That's the thing you ship. It could ship and change nothing for anyone.
      - text: A prompt that scores 90% on evals
        feedback: >-
          Useful evidence, but users don't feel an eval score. It still describes the output.
      - text: Launch by the end of the quarter
        feedback: >-
          That's a date. It says when, not what should change for anyone.

  - type: fill-blank
    id: fill-success-metric
    concept: aisys.outcomes-and-metrics
    difficulty: 2
    prompt: Finish the brief before any code. Pick the metric, a guardrail and a decision date.
    language: yaml
    template: |
      feature: ticket summaries
      outcome: agents resolve tickets faster
      metric: {{1}}
      baseline: 12 minutes
      target: 9 minutes
      guardrail: {{2}}
      decide_on: {{3}}
    blanks:
      - key: '1'
        answer: median_handling_minutes
      - key: '2'
        answer: reopen_rate
      - key: '3'
        answer: '2026-11-30'
    bank: [median_handling_minutes, summaries_generated, reopen_rate, tokens_used, '2026-11-30', when it feels ready]

  - type: prose
    id: assumptions-and-risk
    body: |-
      Every build rests on bets. Summaries help only if they're accurate on real tickets. Agents
      must read them, and you must be allowed to store ticket text.

      Write each bet as a claim that could turn out false. Score it: how bad if it's wrong,
      and how unsure you are. Test the riskiest first. Test anything you can't undo, like a
      data migration, sooner still.

  - type: code-challenge
    id: write-rank-open
    concept: aisys.assumption-mapping
    difficulty: 3
    language: python
    starter: risk.starter.py
    solution: risk.solution.py
    tests: risk.tests.py
    prompt: >-
      Write `rank_open(assumptions)`. Each assumption has a `claim`, an `impact` and an
      `uncertainty` from 1 to 5, and the booleans `irreversible` and `tested`.


      Return the claims of the untested ones, riskiest first. Risk is `impact *
      uncertainty`. On a tie, irreversible ones go first. Otherwise keep the original order.
    hints:
      - Drop the tested ones first with a list comprehension.
      - '`sorted` takes a `key`. A tuple key like `(risk, irreversible)` sorts by risk, then by the flag.'
      - Python's sort is stable, even with `reverse=True`, so equal items keep their order.

  - type: prose
    id: smallest-slice
    body: |-
      Now pick what to build first: the **smallest testable slice**. It runs end to end
      through the riskiest bet, on real data, with as little else as possible.

      Watch for false minimums. A polished screen on fake tickets skips the accuracy
      question. A happy path skips the hard cases. And write a stop rule: which result
      would make you change course?

  - type: multiple-choice
    id: pick-the-slice
    concept: aisys.smallest-testable-slice
    difficulty: 3
    question: The riskiest bet is that summaries are accurate on real tickets. Which slice tests it first?
    choices:
      - text: Summarise 50 past tickets and have agents grade them
        correct: true
        feedback: >-
          Yes. Real data, the risky part, and no customer sees anything yet.
      - text: A polished summary panel on sample tickets
        feedback: >-
          It looks finished, but sample tickets can't tell you how accurate it is on real ones.
      - text: Turn summaries on for every agent
        feedback: >-
          That tests everything at once, with everyone exposed. Learn the risky part cheaply first.
      - text: Build a shared vector store platform first
        feedback: >-
          That's infrastructure before evidence. Nothing yet says summaries are worth it.

  - type: prose
    id: specs-that-preserve-judgement
    body: |-
      Then write the spec that an agent or a colleague builds from. Fix what must hold, and
      leave the rest open.

      Mark each decision. **Locked**: nobody changes it without asking, like what customers
      see. **Bounded**: choose within limits, like a cost per ticket. **Delegated**: the
      builder's call, like function names. Add non-goals, and the proof you'll accept.

  - type: ai-review
    id: review-spec
    concept: aisys.judgement-preserving-specs
    difficulty: 3
    language: yaml
    request: Draft a spec for the ticket summaries feature.
    flawClass: logic
    code: |
      outcome: agents resolve tickets faster
      invariants:
        - summaries never include card numbers
        - p95 latency under 3 s
      locked:
        - the summary panel is visible to agents only
      bounded:
        - model: any approved model under 2p per ticket
      delegated:
        - function and file names
        - prompt wording
        - whether to email the summary to the customer
      non_goals: [auto-replies, ticket routing]
      proof: [eval on 50 graded tickets, pnpm check]
    prompt: >-
      An assistant drafted this spec. One decision sits in the wrong place. Tap the line at
      fault.
    lines: [12]
    reasons:
      - text: It delegates a customer-facing choice you can't undo
        correct: true
        feedback: >-
          Right. An email can't be unsent. Lock it, or make it a non-goal.
      - text: Prompt wording should be locked
        feedback: >-
          Wording is cheap to change, and the eval checks it. Leaving it to the builder is fine.
      - text: The latency limit should be delegated
        feedback: >-
          Users feel latency, so a fixed budget belongs with the invariants. That line is right.
    verify:
      question: Where else could a choice like this hide in the spec?
      choices:
        - text: In delegated items that touch customers or stored data
          correct: true
          feedback: >-
            Yes. Those are the decisions that can't be taken back.
        - text: In the list of non-goals
          feedback: >-
            Non-goals rule work out. Nothing listed there gets built, so nothing there can go out.
        - text: In the function and file names
          feedback: >-
            Names are cheap to change later. They're rightly left to the builder.
    fix: |
      non_goals: [auto-replies, ticket routing, emailing summaries to customers]

  - type: explain-back
    id: explain-shape-first
    concept: aisys.smallest-testable-slice
    difficulty: 3
    audience: non-technical
    kind: decide
    prompt: >-
      The product owner wants the whole ticket summaries feature built at once. Defend
      setting the success metric and testing the riskiest bet first, in plain words.
    rubric:
      - Agreeing on the measure of success first stops anyone reading any result as a win.
      - If the riskiest bet fails, such as accuracy on real tickets, the rest of the work is wasted.
      - A small throwaway trial on real data costs a short delay and can save weeks.
    modelAnswer: >-
      First we agree what success means, say tickets closed faster, so nobody picks a
      flattering number afterwards. Then we test the one thing that could sink it: are the
      summaries accurate on our real tickets? A small trial we throw away takes days. If it
      fails, we've saved weeks of building. If it passes, we build the rest knowing it's
      worth it. The cost is a short wait before the full build starts.

recap:
  - Write the outcome and its success metric, baseline, target and guardrail before any code.
  - List the bets, rank them by risk, and build the smallest slice that tests the riskiest.
  - Lock what mustn't change, bound what may, and delegate the rest in the spec.

recall:
  - id: card-outcome-output
    concept: aisys.outcomes-and-metrics
    front: What's the difference between an output and an outcome?
    back: >-
      An output is what you ship, like a summary panel. An outcome is the change it causes,
      like tickets resolved faster, measured against a baseline.
  - id: card-riskiest-first
    concept: aisys.assumption-mapping
    front: Which assumption should a team test first?
    back: >-
      The one that is most damaging if wrong and least certain, and sooner still if the
      decision can't be undone.
  - id: card-smallest-slice
    concept: aisys.smallest-testable-slice
    front: What makes a first slice of a feature a good one?
    back: >-
      It runs end to end through the riskiest assumption on real data, with little else, and
      has a stop rule.
  - id: card-decision-modes
    concept: aisys.judgement-preserving-specs
    front: What are locked, bounded and delegated decisions in a spec?
    back: >-
      Locked ones need asking before any change, bounded ones are chosen within limits, and
      delegated ones are the builder's call.

references:
  - kind: book
    title: 'Shape Up: Stop Running in Circles and Ship Work that Matters'
    authors: Ryan Singer
    year: 2019
    venue: Basecamp
    url: https://basecamp.com/shapeup
    note: Shaping work before betting on it, with an appetite, boundaries and rabbit holes named.
    primary: true
    verified: true
  - kind: paper
    title: A Spiral Model of Software Development and Enhancement
    authors: Barry W. Boehm
    year: 1986
    venue: ACM SIGSOFT Software Engineering Notes
    url: https://dl.acm.org/doi/10.1145/12944.12948
    note: Resolving the biggest risks first in each cycle, before committing further.
    primary: true
    verified: false
  - kind: book
    title: 'Outcomes Over Output: Why Customer Behavior Is the Key Metric for Business Success'
    authors: Joshua Seiden
    year: 2019
    venue: Sense & Respond Press
    note: Defining success as a change in what people do, not as features shipped.
    verified: false

deepDive: >-
  **Metrics that can be gamed.** A metric becomes a target, and targets get met in the
  cheapest way. That's why the brief carries a guardrail. Faster handling with more reopened
  tickets isn't a win.


  **Specs for agents.** An agent fills gaps with guesses, and it follows detail it shouldn't.
  A spec with invariants, examples and non-goals gives it the edges without dictating every
  line. Examples of normal, edge and forbidden cases say more than adjectives ever can.


  **Proof matches the claim.** A unit test proves a function. An eval on graded real tickets
  proves accuracy. A change in median handling time proves the outcome. Don't accept a lower
  layer as proof of a higher claim.
