term: abstraction
short: A simpler surface over messy detail, so you can use something without knowing how it works.
explain: |
  `sendEmail(to, body)` hides servers, retries and encodings. That's an abstraction: you
  think about what it does, not how.

  A good one fits the problem. A wrong one is worse than repetition. Two pieces of code that
  looked alike get merged into one function. Then it grows flags and special cases until
  nobody can change it safely. When that happens, inline it back and start again.
analogy: A car's pedals. You press to go faster and never think about fuel injection.
usage: This abstraction has six boolean flags; it's two functions pretending to be one.
