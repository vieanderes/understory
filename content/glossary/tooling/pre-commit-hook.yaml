term: pre-commit hook
aka: [pre-commit, git hook, commit hook]
short: A script Git runs before each commit is recorded, which can stop the commit if checks fail.
explain: |
  Mechanical mistakes, like a stray `console.log` or bad formatting, are cheap to catch on
  your own machine. A pre-commit hook runs the formatter and linter on the files you're
  committing, every time.

  Keep it fast, a few seconds, or people skip it with `--no-verify`. It doesn't replace
  CI, which runs the same checks where nobody can skip them.
analogy: Checking your pockets for keys and phone before the door shuts behind you.
usage: Add the formatter to the pre-commit hook, so layout never comes up in review again.
related: [linter, formatter, continuous-integration, commit]
level: 2
lessons: [pro.amateur-tells]
