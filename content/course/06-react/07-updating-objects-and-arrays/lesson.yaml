deepDive: >-
  **How React compares.** React checks old and new state with `Object.is`. For arrays and
  objects it behaves like `===`: true only for the very same one. React doesn't look inside,
  which keeps the check fast however big the state gets.


  **Why mutating is risky even when it renders.** `item.packed = true; setList([...list])`
  does render, because the array is new. But the old item object changed too, so anything
  still holding the previous state now sees `packed: true`. Undo history and comparisons
  with the last render break quietly.


  **Deep nesting.** Copying three levels by hand gets long. Often the fix is flatter state:
  keep items in a list and refer to them by id. A library such as Immer lets you write
  `draft.address.city = "York"` and makes the copies for you.
