term: calibration
aka: [calibrated, model calibration, overconfident, expected calibration error]
short: How well a model's stated confidence matches how often it is actually right.
explain: |
  A classifier says "0.9". Is it right nine times in ten? If so, its scores are
  calibrated, and you can set rules on them. Many models are overconfident: their 0.9 is
  right far less often.

  You check it with a bucket table. Group past predictions by score, then compare each
  group's average score with its real accuracy. If they drift apart, rescale the scores,
  for example with temperature scaling, and choose thresholds again.
analogy: A weather forecast. If it says 70% rain, it should rain on about seven of ten such days.
usage: The router's scores aren't calibrated; its 0.95 bucket is only right 80% of the time.
related: [confidence-threshold, precision, recall]
level: 3
lessons: [aisys.thresholds-and-calibration]
