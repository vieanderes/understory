term: back-of-the-envelope estimate
aka: [back-of-the-envelope estimation, capacity estimate, napkin maths, Fermi estimate]
short: Rough numbers worked out from stated assumptions, accurate to within a factor of ten.
explain: |
  "Twenty million daily users" decides nothing until it becomes numbers. How many requests
  a second at the peak? How many bytes stored in a year? Round hard, state each guess
  aloud, and work it out in a minute.

  It's a sorting tool, not a calculation. It tells you whether the system fits on one
  machine, needs a cache and replicas, or must spread over many. A factor of two rarely
  changes that; a factor of 100 always does.
analogy: Guessing how many pizzas to order for a party by counting heads, not weighing everyone.
example:
  language: text
  code: |
    20M users × 10 reads/day = 200M reads/day
    200M / 100k seconds      ≈ 2,000 reads/s average
    peak ≈ 2–3× average      ≈ 5,000 reads/s
usage: Do a back-of-the-envelope estimate first; at 50 writes a second we don't need sharding.
related: [throughput, littles-law, non-functional-requirement, latency-budget]
level: 2
lessons: [sysdesign.estimation, sysdesign.the-method]
