id: interview.transactions
title: A key-value store with transactions
objective: Support begin, commit and rollback, including nested transactions, with a stack of change sets.
level: advanced
minutes: 10
concepts: [interview.change-sets, interview.nested-transactions]
prerequisites: [db.transactions, interview.utilities]
opening:
  text: >-
    You'll add begin, commit and rollback to an in-memory store, nested ones included. It's
    one of the most reported live-round tasks, and it rewards one small idea.

steps:
  - type: prose
    id: what-you-need
    body: |-
      What you need: `Map`, and the idea of a **transaction**. It groups changes so they
      happen together or not at all. `begin` opens one, `commit` keeps its changes and
      `rollback` undoes them.

      In the round you build this over an in-memory `Map`, usually as commands like `SET`,
      `GET`, `BEGIN` and `ROLLBACK`. Transactions can nest, one inside another.

  - type: predict-output
    id: predict-first-old-value
    concept: interview.change-sets
    difficulty: 1
    language: js
    code: |
      const data = new Map([['seat', 'free']]);
      const changes = new Map();
      function set(key, value) {
        if (!changes.has(key)) changes.set(key, data.get(key));
        data.set(key, value);
      }
      set('seat', 'held');
      set('seat', 'sold');
      console.log(changes.get('seat'));
    question: What does this log?
    choices:
      - text: "`free`"
        correct: true
        feedback: >-
          Yes. Only the first write records a value, so it's the one from before.
      - text: "`held`"
        feedback: >-
          The second `set` finds `seat` already in `changes`, so it records nothing new.
      - text: "`sold`"
        feedback: >-
          That's what `data` holds now. `changes` remembers what was there before.

  - type: prose
    id: change-sets
    body: >-
      That map is a **change set**. It keeps the old value of every key the transaction
      touched, taken the first time it's touched.


      Rollback writes those values back. Commit throws the change set away, because the new
      values are already in place. A key that didn't exist records `undefined`, so rollback
      deletes it.

  - type: fill-blank
    id: fill-rollback
    concept: interview.change-sets
    difficulty: 2
    prompt: Finish `rollback`, so every touched key goes back, including keys that were new.
    language: js
    template: |
      function rollback(data, changes) {
        for (const [key, old] of changes) {
          if (old === {{1}}) data.{{2}}(key);
          else data.set(key, old);
        }
      }
    blanks:
      - key: '1'
        answer: undefined
      - key: '2'
        answer: delete
    bank: [undefined, 'null', delete, set, clear]

  - type: ai-review
    id: review-overwritten-old-value
    concept: interview.change-sets
    difficulty: 3
    language: js
    request: Add rollback to the stock counter. Record old values so they can be restored.
    flawClass: edge-case
    code: |
      const data = new Map([['stock', '5']]);
      const changes = new Map();
      function set(key, value) {
        changes.set(key, data.get(key));
        data.set(key, value);
      }
      function rollback() {
        for (const [key, old] of changes) {
          if (old === undefined) data.delete(key);
          else data.set(key, old);
        }
        changes.clear();
      }
    prompt: >-
      An assistant wrote this. Its test set each key once, then rolled back, and passed. Set
      `stock` to `'4'`, then `'3'`, then roll back: you get `'4'`. Tap the line at fault.
    lines: [4]
    reasons:
      - text: A second write replaces the recorded old value
        correct: true
        feedback: >-
          Right. Record only when the key isn't in `changes` yet, so the first value survives.
      - text: Rollback should loop in reverse order
        feedback: >-
          Order would matter for a log of every write. A change set holds one value per key.
      - text: '`changes.clear()` loses the old values'
        feedback: >-
          It runs after they're restored, which is what it should do. The damage happened earlier.
    verify:
      question: 'Which test would have caught this?'
      choices:
        - text: 'Set one key twice, then roll back'
          correct: true
          feedback: >-
            Yes. The second write is what overwrites the record.
        - text: 'Set two different keys, then roll back'
          feedback: >-
            Each key is recorded once, so both restore correctly.
        - text: 'Set a new key, then roll back'
          feedback: >-
            It tests the delete path, which works. Nothing writes the key twice.
    fix: |
      if (!changes.has(key)) changes.set(key, data.get(key));

  - type: prose
    id: stack-of-change-sets
    body: >-
      Nesting needs one change set per open transaction, kept on a **stack**. `begin` pushes a
      new one. Writes record into the top one.


      Rollback pops the top set and restores it, so only the inner work is undone. Commit pops
      it and folds it into the set below. The outer transaction can still undo everything.

  - type: trace-table
    id: trace-nested
    concept: interview.nested-transactions
    difficulty: 3
    language: js
    code: |
      store.set('seat', 'free');
      store.begin();
      store.set('seat', 'held');
      store.begin();
      store.set('seat', 'sold');
      store.rollback();
      console.log(store.get('seat'));
      store.begin();
      store.set('seat', 'paid');
      store.commit();
      console.log(store.get('seat'));
      store.rollback();
      console.log(store.get('seat'));
    prompt: >-
      `store` works as the last step describes. What does each `console.log` print?
    columns: [seat]
    rows:
      - line: 7
        values: [held]
      - line: 11
        values: [paid]
      - line: 13
        values: [free]

  - type: ai-review
    id: review-fold-overwrites
    concept: interview.nested-transactions
    difficulty: 4
    language: js
    request: Commit the innermost transaction into the one below it.
    flawClass: logic
    code: |
      commit() {
        if (this.stack.length === 0) return 'NO TRANSACTION';
        const inner = this.stack.pop();
        const outer = this.stack.at(-1);
        if (outer) {
          for (const [key, old] of inner) outer.set(key, old);
        }
        return 'OK';
      }
    prompt: >-
      An assistant wrote this. Its test nested once, touched a new key inside, committed,
      then rolled back the outer. It passed. Start with `seat` as `free`. Set `held` in the
      outer, `sold` in the inner, commit, roll back: you get `held`. Tap the line.
    lines: [6]
    reasons:
      - text: It overwrites the outer's older recorded value
        correct: true
        feedback: >-
          Yes. Only copy keys the outer hasn't recorded, so its older value survives.
      - text: '`pop` should come after the loop'
        feedback: >-
          The order of pop and read doesn't change which old value wins.
      - text: The outermost commit should also fold
        feedback: >-
          With nothing below, there's nowhere to fold. Dropping the set is right there.
    fix: |
      for (const [key, old] of inner) {
        if (!outer.has(key)) outer.set(key, old);
      }

  - type: code-challenge
    id: write-tx-store
    concept: interview.nested-transactions
    difficulty: 4
    language: ts
    prompt: >-
      Finish the class `TxStore`. `set`, `get`, `delete` and `count(value)` work on string
      values. `delete` returns whether the key existed. `count` returns how many keys hold
      that value.


      `begin` opens a transaction, and they nest. `rollback` and `commit` act on the
      innermost one and return `'OK'`. With none open, both return `'NO TRANSACTION'`.


      `count` must stay fast with 100,000 keys, so keep a tally as values change.
    hints:
      - Keep a stack of change sets, one `Map` per open transaction, from key to old value.
      - Record a key only the first time the top set sees it. Commit keeps the parent's older record.
      - 'Route every change through one private `#write(key, value)` that updates the data and the tally.'

  - type: explain-back
    id: explain-fold
    concept: interview.nested-transactions
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Why can't an inner commit throw its change set away, the way the outermost commit
      does?
    rubric:
      - An inner commit only hands its work to the enclosing transaction; nothing is final yet.
      - The outer transaction can still roll back, and must undo the inner writes too.
      - So the inner old values move into the parent's set, except keys the parent already recorded.
    modelAnswer: >-
      An inner commit isn't final. The outer transaction can still roll back, and then every
      write made inside must be undone as well. If the inner set were thrown away, those
      old values would be lost. So commit folds them into the parent, keeping the parent's
      own older value wherever both touched the same key.

recap:
  - Record each key's old value the first time a transaction touches it.
  - Nest transactions with a stack of change sets.
  - Fold an inner commit into its parent, keeping the older value.
recall:
  - id: card-change-set
    concept: interview.change-sets
    front: What does a transaction's change set store, and when?
    back: >-
      The old value of each key it touches, recorded on the first touch only. A key that
      didn't exist records `undefined`.
  - id: card-rollback-absent
    concept: interview.change-sets
    front: How does rollback treat a key whose recorded old value is `undefined`?
    back: >-
      It deletes the key, because the key didn't exist before the transaction.
  - id: card-nested-rollback
    concept: interview.nested-transactions
    front: With transactions nested three deep, what does one rollback undo?
    back: >-
      Only the innermost transaction. It pops the top change set and restores it; the outer
      two stay open.
  - id: card-fold
    concept: interview.nested-transactions
    front: When an inner transaction commits, what happens to its change set?
    back: >-
      Its entries move into the parent's set, except keys the parent already recorded, so the
      parent keeps the older value.

references:
  - kind: docs
    title: SAVEPOINT
    authors: The PostgreSQL Global Development Group
    venue: PostgreSQL documentation
    url: https://www.postgresql.org/docs/current/sql-savepoint.html
    note: How a real database nests transactions. `ROLLBACK TO SAVEPOINT` undoes only the inner work.
    primary: true
    verified: true
  - kind: docs
    title: Transactions
    authors: Redis
    venue: Redis documentation
    url: https://redis.io/docs/latest/develop/using-commands/transactions/
    note: A contrast. `MULTI` and `EXEC` queue commands, and Redis has no rollback.
    verified: true

deepDive: |-
  **The task as it's usually set.** Commands arrive as lines: `SET a 10`, `GET a`, `DELETE a`,
  `COUNT 10`, `BEGIN`, `ROLLBACK`, `COMMIT`. `GET` of a missing key prints `NULL`. `ROLLBACK`
  and `COMMIT` with nothing open print `NO TRANSACTION`. Write the store as a class first,
  then a ten-line loop that parses lines and calls it. Graders test the class through the
  parser, so keep the parser thin.


  **Commit: innermost or all?** Some versions say `COMMIT` closes every open transaction at
  once. Then commit clears the whole stack. Ask which one is wanted: it's a one-line
  difference, and asking shows you noticed.


  **Why not copy the whole store on `BEGIN`?**

  A snapshot per transaction is hard to get wrong. But it costs O(n) memory and time for every `BEGIN`. A change set costs O(k), where
  k is the number of keys touched. Say the snapshot out loud as the brute force, then
  improve it. That's the round script from module 23.


  **Why the tally for `COUNT`?** Scanning the values makes `COUNT` O(n). Keeping a map from
  value to how many keys hold it makes it O(1). Every write then has to update the tally.
  That's why one private `#write` is the only place that touches the data. Rollback goes
  through it too, so the tally never drifts.


  **Where this shows up for real.** Databases nest with savepoints, and undo logs in editors
  work the same way. Redis `MULTI` is often mistaken for this, but it queues commands and
  has no rollback.
