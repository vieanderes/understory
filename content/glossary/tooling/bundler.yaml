term: bundler
aka:
  - module bundler
short: A build tool that follows your imports and packs the code into a few browser-ready files.
explain: |
  Your app is hundreds of files importing each other and thousands more from packages.
  Asking a browser to fetch each one separately would take ages.

  This tool starts at your entry file, follows every `import`, and writes a handful of
  output files. On the way it drops code nothing uses, called tree shaking, and shrinks the rest. Rarely used parts go into chunks loaded later. A careless import of a whole
  library is how a page ends up shipping megabytes of script.
analogy: Packing for a trip from a list. Follow the list, leave behind what you won't use, and fit it all in two bags.
example:
  language: bash
  code: |
    $ pnpm build
    dist/index.html            0.4 kB
    dist/assets/index-3f2a.js  142.1 kB  gzip 46.0 kB
    dist/assets/chart-9c1e.js   88.7 kB  gzip 29.3 kB
usage: The bundler pulled in the whole date library; import only the one function.
twin:
  term: package-manager
  difference: A bundler packs your code and its imports into files for the browser. A package manager only fetches and installs the packages into your project in the first place.
related:
  - package-manager
level: 2
lessons:
  - tooling.what-a-build-does
