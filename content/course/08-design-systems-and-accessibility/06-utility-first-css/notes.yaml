summary: >-
  Utility-first CSS moves styling decisions into the markup. Instead of inventing a class
  name like `.product-card` and writing its rules in a separate file, you list small classes
  that each set one thing: `p-4 rounded-lg bg-surface`. Tailwind CSS is the tool most teams
  use for this. It reads your source files as plain text, collects every word that looks like
  one of its class names, and writes a style sheet containing only those rules.


  The payoff is that styles live where you read them, nothing grows stale in a forgotten
  file, and every value comes from one theme. In Tailwind 4 that theme is plain CSS: an
  `@theme` block of custom properties such as `--color-accent` and `--spacing`. Each
  variable in a known namespace creates a family of classes, so the theme doubles as your
  design tokens.


  The costs are real too. Long class lists repeat, so you extract components. Class names
  built at run time are invisible to the scanner. Square-bracket values slip past the theme.
  Reach for Tailwind when a team builds many screens from one design system in components.
  Plain CSS or CSS modules can suit a small site, or content you don't write, better.
remember:
  - Tailwind scans your files as text and generates a rule only for complete class names it finds, so a name assembled at run time is never generated.
  - 'In Tailwind 4 the configuration is CSS: `@import "tailwindcss"` loads it, and `@theme` holds the design tokens.'
  - A theme variable in a known namespace, such as `--color-danger`, creates a whole family of classes like `bg-danger`, `text-danger` and `border-danger`.
  - Spacing classes multiply one variable, `--spacing`, so `p-4` is `calc(var(--spacing) * 4)`, 16 px with the default 0.25rem.
  - When two classes set the same property, the one later in the generated CSS wins, not the one later in the class attribute.
  - Square-bracket values like `bg-[#14b8a6]` are escape hatches that never follow the theme, so add a token instead when a value repeats.
  - Extract a component when the same class list repeats, and keep `@apply` for markup you don't control.
sections:
  - title: How Tailwind finds your classes
    body: |-
      Tailwind never runs your code. Its scanner reads each source file as text and splits it
      into **candidates**: runs of characters that could be a class name. Every candidate that
      matches a utility becomes a rule, and everything else is ignored. That's why a stray
      word like `block` in a comment can produce a rule, and why that costs nothing worth
      worrying about.

      Here are the candidates Tailwind 4.3's scanner finds on each line:

      ```tsx
      const tone = "danger";                              // const, tone, danger
      const broken = `bg-${tone}`;                        // const, broken
      const tones = { danger: "bg-danger", ok: "bg-ok" }; // ..., bg-danger, bg-ok
      ```

      The finished name `bg-danger` only exists at run time, so the second line gives the
      scanner nothing to generate. The fix is a lookup that spells every full name out, as in
      the third line, and choosing between names in code.

      Which files does it read? With automatic detection, every file under the project root
      except files listed in `.gitignore`, anything in `node_modules`, binary files, CSS files
      and package-manager lock files. You adjust that in the CSS:

      ```css
      @import "tailwindcss";

      /* A component library installed as a package, which node_modules hides. */
      @source "../node_modules/@acme/ui";

      /* Old pages that should not add rules. */
      @source not "./src/legacy";

      /* Names that only arrive at run time, from a CMS for example. */
      @source inline("bg-{danger,ok}");
      ```

      `@source inline(...)` safelists names with brace expansion, so the last line makes both
      `bg-danger` and `bg-ok`. `@import "tailwindcss" source(none);` turns automatic detection
      off, and then only your `@source` lines count. Reach for these when a class goes
      missing only in production: the file that uses it is often one the scanner never read.
  - title: The theme, underneath
    body: |-
      `@theme` looks like a block of custom properties, and it is one, with a second job:
      each variable in a known **namespace** also registers utilities. The namespace is the
      prefix.

      ```css
      @import "tailwindcss";

      @theme {
        --color-accent: #0f766e;    /* bg-accent, text-accent, border-accent, ... */
        --spacing: 0.25rem;         /* p-4, gap-6, m-0.5, w-12, ... */
        --radius-card: 12px;        /* rounded-card */
        --text-lead: 1.25rem;       /* text-lead */
        --text-lead--line-height: 1.75rem;
        --font-display: "Inter", sans-serif; /* font-display */
        --breakpoint-tablet: 48rem; /* tablet:p-6 */
      }
      ```

      Compiled with Tailwind 4.3, `bg-accent` becomes `background-color: var(--color-accent)`,
      and the variable itself is written to `:root`. So the classes point at live variables,
      and a dark theme can redefine `--color-accent` without touching one class. By default
      only the variables your classes use are emitted. `@theme static` emits every one, which
      helps when plain CSS or JavaScript reads them too.

      A variable declared in an ordinary `:root` rule is only a variable. `--brand` there
      makes no `bg-brand`. That's the whole difference between `@theme` and `:root`.

      Two switches matter in a design system. `--color-*: initial;` removes every default
      colour, so `bg-blue-500` generates nothing and only your tokens exist. And
      `@theme inline` makes utilities use a value directly instead of the variable:
      with `--color-accent: var(--brand)` inside `@theme inline`, `bg-accent` compiles to
      `background-color: var(--brand)`. Use `inline` when a token refers to another
      variable, so it resolves where the class is used rather than at `:root`.
  - title: Variants and which class wins
    body: |-
      A **variant** is a prefix that wraps a utility in a condition. Tailwind 4.3 compiles
      them like this:

      ```css
      /* md:p-6 */
      @media (width >= 48rem) { .md\:p-6 { padding: calc(var(--spacing) * 6); } }

      /* hover:bg-accent, only on devices that can hover */
      @media (hover: hover) { .hover\:bg-accent:hover { background-color: var(--color-accent); } }

      /* dark:bg-surface follows the operating system by default */
      @media (prefers-color-scheme: dark) { .dark\:bg-surface { background-color: var(--color-surface); } }
      ```

      Breakpoints are mobile first: `md:` means 48rem and wider, so unprefixed classes are the
      phone layout. `@custom-variant` defines your own, for example a dark mode driven by an
      attribute: `@custom-variant dark (&:where([data-theme=dark], [data-theme=dark] *));`.

      Now the conflict. Every utility has the same specificity, one class. So when an element
      has `p-4 p-2`, the rule that comes **later in the generated CSS** wins. Tailwind sorts
      that file itself, and in 4.3 `.p-2` comes before `.p-4`, so `p-4` wins whichever you
      wrote last. The class attribute's order means nothing.

      That bites when a component accepts a `className` from its caller. `tailwind-merge`
      resolves it by removing the earlier conflicting class:

      ```ts
      import { twMerge } from "tailwind-merge";

      twMerge("rounded-lg p-4 bg-accent", "p-2"); // "rounded-lg bg-accent p-2"
      twMerge("px-4 py-2", "p-3");                 // "p-3"
      twMerge("p-3", "px-4");                      // "p-3 px-4"
      ```

      The last line keeps both, because `px-4` only overrides part of `p-3`. Merging is the
      caller-wins rule a component usually wants.
  - title: Arbitrary values, and better escape hatches
    body: |-
      Square brackets write a value straight into a class: `p-[13px]`, `bg-[#14b8a6]`,
      `grid-cols-[200px_1fr]`. Parentheses read a custom property: `p-(--gap)` compiles to
      `padding: var(--gap)`. Both are real features, and both skip the theme.

      The trade-off is drift. A bracketed hex is a copy of a colour. When the brand teal
      changes in `@theme`, every copy stays behind, and nothing warns you. A design system
      whose rule is "tokens only" can clear the defaults with `--color-*: initial` and forbid
      brackets in a lint rule or a test.

      There are fair uses. A one-off grid template, a size dictated by a third-party embed or
      a `calc()` that exists in exactly one place don't deserve a token. The test: would a
      second screen ever want this value? If yes, it's a token.

      When you need a utility Tailwind lacks, define one rather than repeating brackets:

      ```css
      @utility content-auto {
        content-visibility: auto;
      }
      ```

      `content-auto` then works with every variant, like `md:content-auto`.

      `@apply` goes the other way: it copies utilities into your own CSS class.

      ```css
      .prose-link {
        @apply text-accent underline;
      }
      ```

      That's right for HTML you don't write, such as a CMS body or Markdown output. For
      your own markup, a component is better: it keeps the element, the behaviour and the
      classes together, and `@apply` everywhere rebuilds the separate style sheet that
      utility-first set out to remove.
pitfalls:
  - '**Building class names from strings.** `` `text-${colour}-600` `` reads naturally in code, but the scanner never sees the full name and no rule is made. Map each value to a complete class name, or safelist with `@source inline(...)`.'
  - '**Expecting the last class to win.** People read `p-4 p-2` left to right. The cascade uses the order of rules in the generated CSS, which Tailwind decides. Remove the conflict, or merge caller classes with `tailwind-merge`.'
  - '**Putting tokens in `:root` instead of `@theme`.** The variable works in `var()`, so it looks configured, but no utilities appear. Declare tokens in `@theme` so they become classes.'
  - '**Reaching for brackets to match a mock-up.** `mt-[13px]` makes the screen match today and leaves the scale for good. Round to the scale, or add the value to the theme if the design really needs it.'
  - '**Missing classes only in production.** Development may read files that the build skips, or a package in `node_modules` holds the markup. Add an `@source` line for the folder and check the built CSS for the class.'
  - '**Rebuilding BEM with `@apply`.** Wrapping every group of utilities in a named class brings back the naming and the separate file. Extract a component instead, and keep `@apply` for content you cannot add classes to.'
interview:
  - question: Why would a team choose utility-first CSS over BEM or CSS modules?
    answer: >-
      Because it keeps styling next to the markup and ties every value to one theme. With
      BEM you invent names, write rules in another file and hope nobody else depends on them,
      so style sheets only grow. With utilities, deleting a component deletes its styles, and
      the CSS size tracks the number of distinct utilities, not the number of screens. The
      theme limits choices to tokens, which keeps spacing and colour consistent. The costs
      are long class lists, a vocabulary to learn and markup that's harder to scan. Those are
      managed by extracting components, so each class list lives once. For a small site or a
      team that styles content it doesn't write, CSS modules or plain CSS can be simpler.
  - question: A class works in development but is missing in production. How do you debug it?
    answer: >-
      First I'd check whether the full class name appears literally in a file the scanner
      reads. Tailwind finds classes by scanning text, so a name like `` `bg-${tone}` ``
      never exists whole and no rule is made. The fix is a lookup object that spells out
      `bg-danger` and `bg-ok`. If the name is literal, I'd check where it lives: automatic
      detection skips `.gitignore` entries, `node_modules`, CSS and binary files, so markup
      inside an installed component package needs an `@source` line. Last, I'd search the
      built CSS for the class to confirm. For names that only arrive at run time, such as
      from a CMS, `@source inline(...)` safelists them. I'd avoid a large safelist, because
      it ships rules no page uses.
  - question: How do you make Tailwind enforce a design system rather than bypass it?
    answer: >-
      I'd make the theme the only vocabulary. In `@theme` I clear the default palette with
      `--color-*: initial` and declare role tokens like `--color-accent` and
      `--color-surface`, so an off-system colour generates nothing and shows up as a missing
      style. Spacing comes from one `--spacing` unit, and type sizes from a few `--text-*`
      tokens. Then I'd forbid arbitrary values such as `bg-[#14b8a6]` with a lint rule or a
      test, because brackets copy values and never follow the theme. Finally, shared pieces
      like `Button` become components with typed variants, so screens use `<Button>` rather
      than repeating classes. The trade-off is friction: a genuine one-off needs a token or
      an agreed exception, and that's a conversation worth having.
  - question: A component takes a className prop and the caller's padding doesn't apply. Why, and how do you fix it?
    answer: >-
      Both paddings are on the element, and the one later in the generated CSS wins, not the
      one the caller added last. Every utility has the same specificity, so the cascade falls
      back to source order, and Tailwind decides that order when it sorts the style sheet.
      With `p-4` from the component and `p-2` from the caller, `p-4` wins in Tailwind 4.3.
      The fix is to merge classes with `tailwind-merge`: `twMerge(base, className)` drops the
      earlier conflicting class, so the caller wins. Another option is to expose a variant,
      such as a `size` prop, instead of accepting arbitrary classes. That keeps the design
      system in control, at the cost of less flexibility for one-off layouts.
