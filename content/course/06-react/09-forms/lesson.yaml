id: react.forms-and-actions
title: Forms
objective: "Choose a controlled or uncontrolled input, submit with `<form action={fn}>`, and show a pending state while it saves."
level: essential
minutes: 10
concepts: [react.controlled-inputs, react.uncontrolled-inputs, react.form-actions]
prerequisites: [react.sharing-state]
opening:
  text: >-
    You'll build forms that count characters as you type, send with one function and say
    "Booking" while they save. Every sign-up, search box and checkout you build will use this.

steps:
  - type: prose
    id: controlled-and-uncontrolled
    body: |-
      An input can hold its text in two ways.

      **Uncontrolled**: the page keeps the text, as in chapter 3. You read it when the form
      is sent. `<input name="title" />`

      **Controlled**: the text lives in state. `value` shows it, and `onChange` updates it on
      every keystroke:

      ```tsx
      const [note, setNote] = useState("");
      <input value={note} onChange={(e) => setNote(e.target.value)} />
      ```

      Control an input when you need its text while someone types.

  - type: predict-output
    id: predict-frozen-input
    concept: react.controlled-inputs
    difficulty: 2
    language: tsx
    code: |
      function NameField() {
        const [name, setName] = useState("Ada");
        return <input value={name} />;
      }
    question: You click at the end of the box and type `m`. What does it show?
    choices:
      - text: '`Ada`'
        correct: true
        feedback: >-
          Right. The box shows state, and nothing changes it. React warns in the console too.
      - text: '`Adam`'
        feedback: >-
          The key press is heard, but the box must show `name`, which is still `Ada`. `onChange` is missing.
      - text: An empty box
        feedback: >-
          The box starts with `Ada` from state. It's stuck there, not cleared.

  - type: code-challenge
    id: build-message-form
    concept: react.controlled-inputs
    difficulty: 3
    language: tsx
    starter: message.starter.tsx
    solution: message.solution.tsx
    tests: message.tests.tsx
    prompt: >-
      A message box counts down as you type, so its value must live in state. The tests type
      into it and press Send.


      Show `20 characters left` under the field, counting down. Past the limit, show `2
      characters too many`. Disable Send when the message is blank, spaces included, or too
      long.


      Send passes the text to `onSend` and empties the field. This form uses `onSubmit`, and
      nobody empties a controlled field for you.
    hints:
      - Look at where the field's value lives now. Nothing in the component can read it.
      - '`value={text}` and `onChange` make it controlled. The count and the button come from `text`.'
      - "Start with `const [text, setText] = useState('');` and `const left = MAX - text.length;`."

  - type: prose
    id: what-a-form-action-is
    body: |-
      Give a form a function as its `action`, and React takes over the submit. No page reload,
      no `preventDefault`:

      ```tsx
      function addSong(formData) {
        console.log(formData.get("title"));
      }
      <form action={addSong}>...</form>
      ```

      React calls it with a **FormData**: a built-in object holding every field that has a
      `name`. `formData.get("title")` reads one. The function may be `async`. Once it
      succeeds, React clears the uncontrolled fields.

  - type: predict-output
    id: predict-action-logs
    concept: react.uncontrolled-inputs
    difficulty: 2
    language: tsx
    code: |
      function AddPlant() {
        function addPlant(formData) {
          console.log("Added", formData.get("plant"));
        }
        return (
          <form action={addPlant}>
            <input name="plant" />
            <button>Add</button>
          </form>
        );
      }
    question: You type `Fern` and press Add. What logs?
    choices:
      - text: '`Added Fern`'
        correct: true
        feedback: >-
          Right. React calls `addPlant` with the form's fields, and `get` reads one by name.
      - text: Nothing, because the page reloads
        feedback: >-
          A plain HTML form would reload. With a function as `action`, React handles the submit.
      - text: '`Added undefined`'
        feedback: >-
          The field has `name="plant"`, so the form data carries it. No state was needed.

  - type: prose
    id: pending-state
    body: |-
      While an async action runs, people need to see it's working. `useFormStatus` tells you:

      ```tsx
      function SaveButton() {
        const { pending } = useFormStatus();
        return <button disabled={pending}>{pending ? "Saving" : "Save"}</button>;
      }
      ```

      It reads the status of the form it sits inside. So the button is its own component,
      placed inside the `<form>`. `useFormStatus` comes from `react-dom`.

  - type: prose
    id: action-state
    body: |-
      Often the action has something to say back: "Name taken", "Saved". `useActionState`
      wraps your action and keeps what it returns:

      ```tsx
      const [message, formAction] = useActionState(save, "");
      <form action={formAction}>...</form>
      ```

      Now `save` gets two arguments: the last message and the form data. Whatever it returns
      becomes the new `message`. The `""` is the message before the first submit.

  - type: fill-blank
    id: fill-pending-form
    concept: react.form-actions
    difficulty: 3
    language: tsx
    prompt: >-
      Disable the button while saving, and show the error `saveName` returns. Fill the gaps.
    template: |
      function SubmitButton() {
        const { pending } = {{1}}();
        return <button disabled={pending}>Save</button>;
      }

      function Profile() {
        const [state, formAction] = {{2}}(saveName, { error: null });
        return (
          <form {{3}}={formAction}>
            <input name="name" />
            <SubmitButton />
            <p>{state.error}</p>
          </form>
        );
      }
    blanks:
      - key: '1'
        answer: useFormStatus
      - key: '2'
        answer: useActionState
      - key: '3'
        answer: action
    bank: [useFormStatus, useState, useActionState, useEffect, action, onSubmit]

  - type: code-challenge
    id: build-booking-form
    concept: react.form-actions
    difficulty: 4
    language: tsx
    starter: booking.starter.tsx
    solution: booking.solution.tsx
    tests: booking.tests.tsx
    prompt: >-
      A restaurant's booking form gets a `reserve(name)` prop that returns a promise. The form
      has a field labelled `Your name` and a Book button, and does nothing yet.


      Send it with an action. Trim the name. If it's blank, show `Add a name for the booking.`
      and don't call `reserve`. Otherwise await `reserve(name)` and show `Booked for Priya.`
      While it saves, the button says `Booking` and is disabled.
    hints:
      - The message the action returns is state that `useActionState` can keep for you.
      - '`useFormStatus` only knows about the form it sits inside. The button needs its own component.'
      - "Start with `async function book(previous: string, formData: FormData) {` and read `formData.get('name')`."

  - type: explain-back
    id: explain-status-in-child
    concept: react.form-actions
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Someone calls `useFormStatus()` in the same component that renders the `<form>`, and
      `pending` never turns true. Why, and what's the fix?
    rubric:
      - '`useFormStatus` reads the status of the form above the component that calls it.'
      - In the component that renders the form, there's no form above it, so `pending` stays false.
      - Move the call into a child component, such as the submit button, placed inside the form.
    modelAnswer: >-
      `useFormStatus` looks upwards, for a form that contains the component calling it. The
      component that renders the `<form>` sits above that form, not inside it. So it finds
      nothing, and `pending` stays false. Put the button in its own small component, call
      `useFormStatus` there, and place it inside the form.

recap:
  - Control an input with `value` and `onChange` when you need its text as people type.
  - Submit with `<form action={fn}>` and read fields with `formData.get`.
  - Show pending and returned messages with `useFormStatus` and `useActionState`.

recall:
  - id: card-controlled
    concept: react.controlled-inputs
    front: What makes an input controlled?
    back: >-
      Its `value` comes from state, and `onChange` updates that state on every keystroke.
  - id: card-frozen-input
    concept: react.controlled-inputs
    front: Why can't anyone type into `<input value={name} />`?
    back: >-
      It shows `name`, and with no `onChange` nothing changes `name`. Add `onChange`, or use
      `defaultValue` for an uncontrolled field.
  - id: card-form-action
    concept: react.form-actions
    front: What does React pass to the function in `<form action={fn}>`?
    back: >-
      A `FormData` object with every named field. `formData.get('title')` reads one.
  - id: card-reset
    concept: react.uncontrolled-inputs
    front: Which fields does React clear after a form action succeeds?
    back: >-
      The uncontrolled ones. A controlled field keeps showing its state.

