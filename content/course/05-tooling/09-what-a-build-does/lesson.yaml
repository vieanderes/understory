deepDive: |-
  **Side effects.** Tree-shaking only removes code when nobody could tell. Say `convert.js`
  starts with `console.log("convert loaded")`. That line runs the moment the module loads,
  so the bundler keeps it, even when no export is used. A package can promise it has none
  with `"sideEffects": false` in its `package.json`. Get the promise wrong and a needed setup
  line quietly disappears.

  **CommonJS stays whole.** esbuild wraps a `require`d file in a function and keeps every
  export, because in CommonJS `exports` can be filled in at run time.

  **Inside the map.** `mappings` is a string like `AAEO,SAASA`. Each group is a segment
  written as base64 numbers, each relative to the one before, and `;` starts the next built
  line. Columns there count from 0, while a stack trace counts from 1.

  **Why dev is fast.** Vite's dev server skips bundling. The browser asks for each module
  by its `import`, and Vite transpiles only that file on request.
