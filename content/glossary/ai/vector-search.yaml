term: vector search
aka:
  - semantic search
  - similarity search
short: Finding passages by closeness in meaning, comparing lists of numbers instead of matching words.
explain: |
  Keyword search finds "refund" only where the word "refund" appears. Vector search turns the
  question into an embedding and fetches the stored passages whose embeddings sit nearest.
  It finds "money back" too.

  It misses exact things: an order number, an error code, a rare name. That's why real
  systems run **hybrid search**, keyword and vector together, and often add a reranker to
  reorder the shortlist.
analogy: Asking a librarian for "something like this book" instead of searching the catalogue for a title.
usage: Vector search can't find "ERR_4012", so add keyword search alongside it.
related:
  - embedding
  - reranking
  - rag
  - chunking
