id: cs.trees
title: Trees, heaps and B-trees
objective: Explain why databases use B-trees.
level: advanced
minutes: 10
concepts: [cs.binary-search-trees, cs.heaps, cs.b-trees]
prerequisites: [db.schema-design, cs.searching-and-sorting]
opening:
  text: >-
    You'll see how a tree finds one key among a billion in a handful of steps. It's the shape
    behind every database index, and the next lesson puts one to work.

steps:
  - type: prose
    id: name-tree
    body: >-
      You've met trees already. The DOM is one, and so are folders on a disk. A **tree** has
      one **node** at the top, the root, and each node points to its children.


      In a **binary search tree**, each node holds a key and at most two children. Smaller
      keys hang on the left, larger on the right. In code, a node is a small object:


      ```js

      const node = (key, left = null, right = null) => ({ key, left, right });

      ```

  - type: predict-output
    id: predict-bst-visits
    concept: cs.binary-search-trees
    difficulty: 1
    language: js
    code: |
      const node = (key, left = null, right = null) => ({ key, left, right });
      const tree = node(50, node(30, node(20), node(40)), node(70, node(60), node(80)));

      function visits(root, key) {
        const seen = [];
        let current = root;
        while (current) {
          seen.push(current.key);
          if (key === current.key) break;
          current = key < current.key ? current.left : current.right;
        }
        return seen;
      }
      console.log(visits(tree, 60));
    question: Which keys does the search for 60 look at?
    choices:
      - text: '`[50, 30, 20, 40, 70, 60]`'
        feedback: >-
          That's checking everything in turn. At 50 the search goes right, and the whole left
          side is never touched.
      - text: '`[50, 70, 60]`'
        correct: true
        feedback: >-
          Right. Each comparison throws away half of what's left.
      - text: '`[60]`'
        feedback: >-
          The search only holds the top node. It has to walk down from there, one comparison at
          a time.

  - type: prose
    id: name-binary-search-tree
    body: >-
      That's binary search, from the searching lesson, turned into a shape. Each step down
      throws away half of what's left, so a search costs O(log n).


      Unlike a sorted array, it's cheap to add to. A new key walks down the same way and hangs
      on the first empty side. That stays fast while the tree is **balanced**: about as deep on
      every side.

  - type: multiple-choice
    id: predict-sorted-inserts
    concept: cs.binary-search-trees
    difficulty: 2
    question: Keys arrive already sorted, 20, then 30, then 40, and so on. What shape does the tree take?
    choices:
      - text: A balanced tree, like before
        feedback: >-
          Same keys, different shape. Each new key is larger than every key before it, so it
          always goes right.
      - text: One long line leaning right
        correct: true
        feedback: >-
          Right. It's a list in disguise, and search slows to O(n).
      - text: One long line leaning left
        feedback: >-
          Left is for smaller keys. Every new key here is larger, so each one hangs on the
          right.

  - type: code-challenge
    id: write-bst-insert
    concept: cs.binary-search-trees
    difficulty: 3
    language: ts
    prompt: >-
      Write `insert(root, key)` for a binary search tree. Walk down from the root, left for a
      smaller key and right for a larger one. Hang a new node on the first empty side, and
      return the root.


      An empty tree (`null`) gets the new node as its root. A key that's already there is
      left alone.
    hints:
      - Handle `null` first. Then keep a `current` node that starts at the root.
      - At each node, pick a side. If that side is `null`, the new node goes there.
      - Loop while `key !== current.key`, and move `current` down to the side you picked.

  - type: prose
    id: name-heap
    body: >-
      Sometimes you don't need to find any key, only the smallest. A **heap** is a tree kept
      in an array that promises one thing: the smallest item is at the front.


      Adding an item, or taking the smallest, costs O(log n). The rest isn't sorted. That's
      how a **priority queue** works: the next job to run, the next timer to fire. You'll use a
      library for it, not write one.

  - type: ai-review
    id: review-resort-queue
    concept: cs.heaps
    difficulty: 3
    language: js
    request: Keep print jobs in priority order. Lowest number goes first.
    flawClass: performance
    code: |
      const jobs = [];

      function addJob(job) {
        jobs.push(job);
        jobs.sort((a, b) => a.priority - b.priority);
      }

      function nextJob() {
        return jobs.shift();   // shift removes and returns the first item
      }
    prompt: >-
      An assistant wrote this. Jobs come out in the right order, and the test added five. A
      busy office queued 20,000 jobs, and adding them took over three seconds. Tap the line at
      fault.
    lines: [5]
    reasons:
      - text: '`shift` returns the wrong end of the array'
        feedback: >-
          After an ascending sort the lowest number is first, and `shift` takes the first.
          The order is right. The cost isn't.
      - text: It re-sorts the whole list on every add
        correct: true
        feedback: >-
          Yes. We measured 3,216 ms. A heap did the same 20,000 adds in 3.4 ms.
      - text: The comparator should return a boolean
        feedback: >-
          `sort` wants a number: negative, zero or positive. Subtracting the priorities is the
          usual way.
    verify:
      question: Which test would have caught this?
      choices:
        - text: Time 20,000 adds against a time limit
          correct: true
          feedback: >-
            Right. The cost only shows when the list is long.
        - text: Add five jobs and check the order
          feedback: >-
            That's the test it passed. The order is right, and five items sort instantly.
        - text: Add two jobs with equal priority
          feedback: >-
            Worth checking for ties, but it's still a tiny list. Size is the problem here.
    fix: |
      // keep a heap: a new job climbs at most log n levels, and nothing is re-sorted
      function addJob(job) {
        heapPush(jobs, job);
      }

  - type: prose
    id: name-b-tree
    body: >-
      Databases keep their indexes on disk. Remember the first CS lesson: a disk read costs far
      more than a memory fetch. So a lookup's cost is how many disk reads it takes, one per
      level of the tree.


      A **B-tree** is a very wide tree. Each node holds hundreds of sorted keys and as many
      children. A node fills one **page**, the block a database reads in one go.

  - type: playground
    id: play-fan-out
    concept: cs.b-trees
    difficulty: 2
    prompt: >-
      This counts the levels a tree needs for a billion rows. With 2 children per node it's
      30. A Postgres page holds about 300 keys. Set `fanOut` to 300 and watch.
    html: |
      <p id="levels"></p>
    js: |
      const rows = 1000000000;
      const fanOut = 2;

      let levels = 0;
      let reach = 1;
      while (reach < rows) {
        reach = reach * fanOut;
        levels = levels + 1;
      }
      document.querySelector('#levels').textContent = `${levels} page reads per lookup`;
    editable: [js]
    checks:
      - label: The page shows 4 page reads
        selector: '#levels'
        text: 4 page reads
    solution:
      js: |
        const rows = 1000000000;
        const fanOut = 300;

        let levels = 0;
        let reach = 1;
        while (reach < rows) {
          reach = reach * fanOut;
          levels = levels + 1;
        }
        document.querySelector('#levels').textContent = `${levels} page reads per lookup`;
    hints:
      - Change only the number on the `fanOut` line.

  - type: explain-back
    id: explain-why-b-trees
    concept: cs.b-trees
    difficulty: 4
    audience: interviewer
    kind: decide
    prompt: >-
      An interviewer asks: a binary search tree and a B-tree are both logarithmic. Why would
      you pick the B-tree for a database on disk?
    rubric:
      - Every level of a tree on disk costs a page read, far slower than a comparison in memory.
      - A B-tree node fills a page with hundreds of keys, so a billion keys need about four levels, not thirty.
      - The trade is a little more comparing inside each node for far fewer disk reads.
    modelAnswer: >-
      Both are logarithmic, but the base of the logarithm is what you pay for. On disk, each
      step down the tree is a page read, thousands of times slower than comparing keys in
      memory. A binary tree needs about thirty steps for a billion keys. A B-tree packs
      hundreds of keys into each page-sized node, so it needs about four. I'd pick it because
      it trades a little CPU work inside a node for far fewer disk reads.

recap:
  - Search and insert in a binary search tree, and know that sorted inserts unbalance it.
  - Reach for a heap, through a library, when you only need the smallest item next.
  - Explain a B-tree as a wide, shallow tree with one node per disk page.

recall:
  - id: card-bst-balance
    concept: cs.binary-search-trees
    front: What happens to a plain binary search tree if you insert keys in sorted order?
    back: >-
      Every key goes to the right, so the tree becomes a linked list. Search drops from
      O(log n) to O(n).
  - id: card-heap-promise
    concept: cs.heaps
    front: What does a min-heap promise, and what doesn't it?
    back: >-
      The smallest item is at index 0, and adding or removing costs O(log n). The rest of the
      array isn't sorted.
  - id: card-b-tree-depth
    concept: cs.b-trees
    front: Why is a B-tree only about four levels deep for a billion keys?
    back: >-
      Each node holds hundreds of keys, so each level divides the keys by hundreds. Each level
      costs one page read.

references:
  - kind: paper
    title: Ubiquitous B-Tree
    authors: Douglas Comer
    year: 1979
    venue: ACM Computing Surveys, 11(2)
    url: https://doi.org/10.1145/356770.356776
    note: The structure itself, and why its height stays small as the data grows.
    primary: true
    verified: true
  - kind: paper
    title: Organization and maintenance of large ordered indexes
    authors: R. Bayer and E. McCreight
    year: 1972
    venue: Acta Informatica, 1(3)
    url: https://doi.org/10.1007/BF00288683
    note: The original B-tree paper, written for indexes too large for main memory.
    primary: true
    verified: true
  - kind: docs
    title: B-Tree Indexes
    authors: The PostgreSQL Global Development Group
    venue: PostgreSQL 17 Documentation
    url: https://www.postgresql.org/docs/17/btree.html
    note: How PostgreSQL's own B-tree is laid out in pages.
    verified: true

deepDive: >-
  The numbers are from Node 24. We built binary search trees without rebalancing. From 1,000
  shuffled keys the tree was 24 levels deep, and from 100,000 it was 42. From sorted keys the
  depth equalled the key count, and building the 100,000-key one took 12.6 seconds. Real
  libraries use self-balancing trees, such as red-black trees, which rotate nodes as they
  insert.


  Removing the smallest item from a heap is the mirror of adding. Move the last item to
  index 0, then swap it down with its smaller child until it fits. Popping our six-item heap
  took one swap.


  A heap lives in an array with no pointers. The parent of index `i` sits at
  `Math.floor((i - 1) / 2)`, and its children at `2 * i + 1` and `2 * i + 2`. A new item goes
  on the end and swaps with its parent while the parent is larger.


  The B-tree arithmetic is `Math.log(keys) / Math.log(fanOut)`. With 100 children per node a
  billion keys need 5 levels. With 200 to 500 they need 4. Real fan-out depends on the key
  size and the page size, and PostgreSQL's pages are 8 kB by default. Most databases use a
  variant where only the bottom level holds row pointers, and those leaf pages are linked
  side by side. That makes a range scan one walk along the bottom.


  A B-tree stays balanced by construction. A full node splits in two and pushes its middle
  key up to the parent. When the root splits, the tree gains a level, so every leaf is always
  at the same depth.
