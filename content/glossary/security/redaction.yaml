term: redaction
aka: [redact, PII redaction, masking]
short: Removing or replacing sensitive values in text before it goes somewhere it shouldn't.
explain: |
  Before a support message goes to a model provider or a log, you swap the card number for
  `[CARD]` and the name for `[PERSON]`. Patterns catch structured values like IBANs and
  emails. Entity recognition catches names and places.

  Detectors miss things and flag harmless text, so treat redacted free text as still
  personal. And a model can't reason about what it can't see: redact what the task doesn't
  need, not everything.
analogy: The black marker on a released government document. You can read the story, not the names.
example:
  language: ts
  code: |
    const redacted = text
      .replace(EMAIL, '[EMAIL]')
      .replace(IBAN, '[IBAN]');
usage: Run redaction before the prompt leaves our network, not after the reply comes back.
twin:
  term: pseudonymisation
  difference: Redaction throws the value away. Pseudonymisation swaps it for a placeholder you can map back to the real value later.
related: [pii, pseudonymisation, data-minimisation, structured-logging]
level: 2
lessons: [aisys.pii-and-privacy, agents.debugging-from-a-trace]
