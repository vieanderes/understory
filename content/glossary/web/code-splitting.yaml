term: code splitting
aka: [dynamic import, bundle splitting, "import()"]
short: Cutting an app's JavaScript into several files, so a page downloads only the code it uses.
explain: |
  One giant bundle makes every visitor download the code for every screen, including the
  admin panel they will never open.

  A dynamic `import()` tells the bundler to put that module in its own file, fetched when the
  line runs. Split by route and by heavy, rarely used features such as a chart library or an
  editor. Split too finely and you pay for many small requests instead.
analogy: A travel guide sold by chapter. Going to Rome, you carry the Rome chapter, not the whole of Italy.
example:
  language: ts
  code: |
    button.addEventListener('click', async () => {
      const { openEditor } = await import('./editor'); // its own file
      openEditor();
    });
usage: Code splitting the chart library out of the main bundle saved 180 KB on the home page.
twin:
  term: lazy-loading
  difference: Code splitting cuts the JavaScript into separate files. Lazy loading decides to fetch something only when it's needed, which is how those files usually get loaded.
related: [lazy-loading, tree-shaking, bundler, long-task, performance-budget]
level: 2
lessons: [perf.shipping-less-javascript]
