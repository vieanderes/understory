term: depth-first search
aka: [DFS, depth first search, flood fill]
short: Exploring a network by following one path to its end, then backing up to try the next.
explain: |
  To explore a maze, keep going until a dead end. Then step back to the last junction
  and try another way. That visits everything reachable from where you started.

  Recursion does it naturally, or a loop with your own stack. A seen set stops cycles.
  It's O(V + E), like breadth-first search, but it doesn't find shortest paths.

  It answers "is there a way?" and "how many separate groups?". Start it from each
  unvisited node and count the starts. Deep inputs can overflow the call stack, so
  switch to an explicit stack for big grids.
analogy: Exploring a cave with a ball of string. Follow one tunnel to its end, then wind back to the last fork.
example:
  language: js
  code: |
    function countIslands(grid) {
      let islands = 0;
      const sink = (r, c) => {
        if (grid[r]?.[c] !== 1) return;
        grid[r][c] = 0; // mark visited
        sink(r + 1, c); sink(r - 1, c); sink(r, c + 1); sink(r, c - 1);
      };
      grid.forEach((row, r) => row.forEach((v, c) => {
        if (v === 1) { islands++; sink(r, c); }
      }));
      return islands;
    }
usage: Run a depth-first search from each unvisited cell and count how many times you start one.
twin:
  term: breadth-first-search
  difference: Depth-first search follows one path to its end, using a stack, and finds a path. Breadth-first search goes ring by ring with a queue, and finds the shortest one.
related: [breadth-first-search, recursion, stack, backtracking, graph, topological-sort]
level: 2
lessons: [algo.bfs-and-dfs, cs.graphs]
