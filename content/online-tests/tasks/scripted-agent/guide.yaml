approach: >-
  Keep a list of the calls that actually ran. For each turn, apply the checks in the order
  the statement gives: final answer, step cap, loop, approval, then run the call and add it
  to the list. The loop test compares the new call with the last one, and with the one two
  back while the last call equals the one three back. Return the outcome with the length of
  the list.
complexity: O(len(T)) time, O(len(T)) space
steps:
  - kind: read
    title: Read the checks as a numbered list
    minutes: 2
    body: |-
      The statement numbers the checks for a reason: the **order** decides the outcome when
      two rules apply at once.

      Then pin down the loop rule on paper: with ran calls ..., X, Y, Z, a new call is a
      loop if it equals Z, or if it equals Y while Z equals X.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Write the check order into the comment. It becomes the body of the loop.
    code:
      ts: |-
        // Per turn: final -> answered, K ran -> step-cap, repeat -> loop, unapproved write -> needs-approval, else run.
      python: |-
        # Per turn: final -> answered, K ran -> step-cap, repeat -> loop, unapproved write -> needs-approval, else run.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 3
    body: |-
      Write down the inputs most likely to break a quick solution:

      - an empty script;
      - a final answer as the turn after the cap is reached, which still answers;
      - A, B, A, C, A, B, which never repeats a pair in a row;
      - a looping write call that is also unapproved, where the loop wins.
    input:
      - "([], [], [], 1)"
      - "([\"search a\", \"search b\", \"final\"], [], [], 2)"
      - "([\"get a\", \"get b\", \"get a\", \"get c\", \"get a\", \"get b\", \"final\"], [], [], 20)"
      - "([\"write a\", \"write a\"], [\"write\"], [], 5)"
  - kind: ask-ai
    title: Check the loop rule on one sequence
    minutes: 1
    body: |-
      The pair rule is where readings differ. Ask about one sequence, not for code.
    prompt: >-
      Without writing code: the loop rule says a new call is a loop if it equals the last
      call, or if it and the last call repeat the two calls before them. After the calls
      "get a", "get b", "get a", is a new call "get b" a loop, and is "get c"? One sentence.
    expect: >-
      "get b" is a loop, because a, b, a, b repeats the pair. "get c" is not.
  - kind: write
    title: Write the runner yourself
    minutes: 6
    body: |-
      One loop over the turns, the checks in order. Count only calls that ran: a stopped
      call never joins the list.
    code:
      ts: |-
        // Per turn: final -> answered, K ran -> step-cap, repeat -> loop, unapproved write -> needs-approval, else run.
        function solution(T: string[], W: string[], A: string[], K: number): string {
          const writes = new Set(W);
          const approved = new Set(A);
          // Only calls that actually ran count for the step cap and the loop rules.
          const ran: string[] = [];
          const stop = (outcome: string): string => `${outcome} ${ran.length}`;
          for (const turn of T) {
            if (turn === 'final') return stop('answered');
            if (ran.length === K) return stop('step-cap');
            const m = ran.length;
            const repeatsLast = m >= 1 && turn === ran[m - 1];
            const repeatsPair = m >= 3 && turn === ran[m - 2] && ran[m - 1] === ran[m - 3];
            if (repeatsLast || repeatsPair) return stop('loop');
            const tool = turn.split(' ')[0]!;
            if (writes.has(tool) && !approved.has(tool)) return stop('needs-approval');
            ran.push(turn);
          }
          return stop('no-answer');
        }
      python: |-
        # Per turn: final -> answered, K ran -> step-cap, repeat -> loop, unapproved write -> needs-approval, else run.
        def solution(T, W, A, K):
            writes = set(W)
            approved = set(A)
            # Only calls that actually ran count for the step cap and the loop rules.
            ran = []
            for turn in T:
                if turn == 'final':
                    return 'answered ' + str(len(ran))
                if len(ran) == K:
                    return 'step-cap ' + str(len(ran))
                m = len(ran)
                repeats_last = m >= 1 and turn == ran[m - 1]
                repeats_pair = m >= 3 and turn == ran[m - 2] and ran[m - 1] == ran[m - 3]
                if repeats_last or repeats_pair:
                    return 'loop ' + str(m)
                tool = turn.split(' ')[0]
                if tool in writes and tool not in approved:
                    return 'needs-approval ' + str(m)
                ran.append(turn)
            return 'no-answer ' + str(len(ran))
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Check your own cases against the
      numbered checks.
    expect: >-
      Three OKs, then "no-answer 0", "answered 2", "answered 6" and "loop 1".
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours.
    prompt: >-
      Review my current solution for the order of the checks, the pair loop rule, and that
      only calls that ran are counted. List any problems in one line each. Do not rewrite
      the code.
    expect: No problems.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and submit.
