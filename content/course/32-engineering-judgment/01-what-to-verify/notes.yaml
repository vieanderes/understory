summary: >-
  Writing code has become cheap. An assistant produces a working function in seconds, with
  good names and a passing test. What stays expensive is judgment: knowing what will break,
  what will not survive more load, what will mislead the next reader, what will expose data,
  and how you would prove any of it.


  This lesson gives that judgment a shape: five questions you ask of any code before you
  trust it. What could break? Will it hold at 10x? What will confuse the next person? What
  could this expose? How would you prove it works, and what could it regress? Each one finds
  a different family of bug, and each turns into a concrete check you can run.


  The questions matter most for code you didn't write line by line, which now includes most
  assistant output. That code looks finished, so it invites skimming. The later lessons in
  this module take one question each and go deep. The "Before you ship" list at the end of
  many lectures uses the same five lenses.
remember:
  - A passing test proves only the cases it tried, so the review's job is to find the cases nobody tried.
  - Ask five questions of any code you are about to trust, an assistant's or your own.
  - Each question becomes a check you can run, such as a test at the exact limit or a field you follow out of the system.
  - Off-by-one bugs live at the edge, so test exactly full, exactly empty and one past.
  - A loop inside a loop over the same list grows with the square of its size, so it is the first thing to die at 10x.
  - TypeScript types are erased at run time, so only code that names each field stops extra data leaving.
  - A function that changes its input surprises every other caller holding that input.
sections:
  - title: Turning each question into a check
    body: |-
      A question you can't act on is a worry, not a review. Each of the five has a usual check.

      - **What could break?** Write down the inputs at the edges: empty, one, exactly at the limit, one past it. Then test the one the code has not seen.
      - **Will it hold at 10x?** Find every loop and every call whose work grows with the data. Picture the list ten times longer.
      - **What will confuse the next person?** Read each function's name, then its body. Anything the name doesn't promise is a surprise someone will trip on.
      - **What could this expose?** Pick each sensitive field and follow it to every place it is printed, returned or sent.
      - **How would you prove it works?** Name the test that would fail if the bug were there, and the existing behaviour the change could alter.

      Here is the test the gym assistant never wrote, with Node's built-in runner:

      ```js
      import { test } from "node:test";
      import assert from "node:assert/strict";

      function bookClass(gymClass, memberId) {
        if (gymClass.booked.includes(memberId)) return "already booked";
        if (gymClass.booked.length < gymClass.capacity) {
          gymClass.booked.push(memberId);
          return "booked";
        }
        return "full";
      }

      test("a class that's exactly full refuses one more", () => {
        const gymClass = { capacity: 2, booked: [1, 2] };
        assert.equal(bookClass(gymClass, 3), "full");
        assert.deepEqual(gymClass.booked, [1, 2]);
      });
      ```

      Save it as `book.test.mjs` and run `node --test book.test.mjs`. With `<=` on the
      capacity line, it fails; with `<`, it passes. That is the shape of a good check: it
      names the bug it would catch.
  - title: Why assistant code needs the questions more
    body: |-
      Assistant output fails in recognisable ways, and every one of them hides behind a
      fluent surface.

      It handles the case in the request and stops there. "Book a member if there's room"
      gets the room check, but not the full class. It reaches for a likely API that may not
      exist, or one that exists but does something slightly different, like `sort` without a
      compare function. It writes tests that agree with its own code, so a wrong answer can
      sit inside a passing test. And it reports with confidence: "Tested, it works" means
      that the cases it thought of work.

      Studies of people coding with assistants point the same way. People with an assistant
      wrote less secure code while rating it as more secure, and learners who delegated the
      thinking understood least afterwards. Feeling sure is not a check.

      The fix is not to stop using assistants. It is to read the diff, not the summary, and
      to run the five questions over it. Two habits help. Ask the assistant for the edge-case
      tests separately, then read them as hard as the code. And when a test changes in the
      same diff as the code, read the test first: a changed expectation is where a bug most
      often gets waved through.
  - title: When time is short, which question first
    body: |-
      You rarely have time to ask every question with equal care. Order them by what a miss
      would cost.

      Code that moves money or touches personal data gets "What could this expose?" and
      "What could break?" first, because those failures are expensive and hard to undo. A
      leaked password can't be un-leaked. Code on a busy path, such as the home page or a
      login, gets "Will it hold at 10x?" early, since its cost is multiplied by every
      visitor. Shared helpers, used from many places, get "What will confuse the next
      person?" and "What could it regress?", because a surprise there spreads to every caller.

      A one-off script that you run once and read the output of needs little beyond a careful
      read. A migration that rewrites a production table needs all five, plus a rehearsal
      on a copy.

      This is likelihood times cost, the same reasoning the testing chapter uses to rank tests. The questions
      tell you where to look; the risk tells you how hard.
pitfalls:
  - '**Trusting "Tested, it works".** An assistant''s summary describes the cases it thought of. Read the diff and its tests yourself, and ask which case is missing.'
  - '**Testing only the happy path.** The first test anyone writes is the one that works. Add the empty, the exactly-full and the one-past-the-limit cases before you trust a comparison.'
  - '**Thinking a type removes fields.** A value typed as a smaller shape still carries every field it had. Build the outgoing object field by field, or validate it at the boundary.'
  - '**Sorting or changing a list you were handed.** `sort`, `reverse` and `splice` change the caller''s array. Use `toSorted`, `toReversed` and `toSpliced`, or copy first.'
  - '**Asking all five questions with equal effort everywhere.** Spend the care where a miss costs most: money, personal data, hot paths and shared helpers.'
verify:
  - lens: breaks
    check: Every comparison against a limit is tested at exactly the limit and one past it, not only well inside it.
  - lens: scales
    check: No loop over a list contains a second loop, search or call over a list that grows with the data.
  - lens: confuses
    check: No function changes an array or object it was given unless its name says it does.
  - lens: leaks
    check: Passwords, tokens and personal fields never reach a log line or a response built with a spread of a whole record.
  - lens: tests
    check: Each fix comes with the test that failed before it, and any test edited in the same diff is read first.
interview:
  - question: How do you review code that an AI assistant wrote?
    answer: >-
      The same way as any code, with more suspicion of the parts that look finished. I read
      the diff, not the assistant's summary, and I ask five questions. What could break,
      especially at the edges the request didn't mention? Will it hold at ten times the data?
      What will surprise the next reader? What could it expose, following each sensitive
      field? And how would I prove it works: which test fails without the fix, and what
      existing behaviour could change? Assistants tend to handle the stated case, invent
      plausible APIs and write tests that agree with their own code, so I read changed tests
      first. The trade-off is time, so I spend most of it where a miss costs most: money,
      personal data and hot paths.
  - question: The tests pass. Why would you still block a pull request?
    answer: >-
      Because passing tests prove the cases that were written, not the ones that matter. I'd
      block when I can name a case the tests don't cover and the cost of missing it is high.
      For example, a capacity check tested only on an empty class says nothing about a full
      one, where an off-by-one lets one extra booking in. Or a response that spreads a whole
      user record passes every functional test while sending a password hash to the browser.
      In the comment I'd name the missing case, why it matters, and the test I'd want added.
      Blocking without naming the test is just doubt, and the author can't act on doubt.
  - question: What does "Will it hold at 10x?" mean in practice?
    answer: >-
      It means finding the work that grows with the data or the traffic, and picturing it ten
      times bigger. Most lines cost the same at any scale. A few don't: a loop inside a loop
      over the same list grows with the square of its size, a query without a limit returns
      every row, and a call per item multiplies round trips. Ten times is useful because it is
      close enough to happen within a year of growth and big enough to show the shape of the
      cost. A quadratic duplicate check that takes 16 ms at 2,000 members takes seconds at
      20,000. The fix is usually a better shape, such as a `Set`, a `LIMIT` or a batch, not a
      faster machine.
