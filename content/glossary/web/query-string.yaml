term: query string
aka:
  - query parameters
  - search params
short: The key-value pairs after the question mark in an address, used to refine a request.
explain: |
  Often you want the same resource, only filtered or sorted. Rather than a new address
  for every combination, you tack options on the end: `?status=open&sort=newest`.

  Pairs are joined with `&`, and values must be URL-encoded. They suit optional things:
  filters, sorting, pages, search terms. They end up in logs, history and analytics, so
  never put a password or token in one.
analogy: The extras you shout after your order. Same coffee, but "oat milk, extra hot".
example:
  language: http
  code: |
    GET /orders?status=open&sort=-created&page=2 HTTP/1.1
    Host: api.example
usage: Move the page number into the query string; it isn't a different resource.
twin:
  term: path-parameter
  difference: A path parameter picks which thing you mean, as in `/orders/42`. A query string refines how you want it, as in `?sort=newest`. Remove the query and you still have a valid address.
related:
  - url
  - path-parameter
  - rest
level: 2
lessons:
  - backend.api-design
  - html.links-and-urls
