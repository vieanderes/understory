summary: >-
  A browser reads an HTML file from the top, building the DOM as it goes. When it meets a
  `script` element it stops, runs the script, and only then carries on. That one fact explains
  most first-day bugs: a script can only see the elements the parser has already built, and an
  element further down does not exist yet.


  JavaScript's job in the page is behaviour. It changes the DOM, and the screen follows the
  DOM. Most of that behaviour waits for something to happen: a click, a key press, a reply
  from a server. You hand the browser a function, a **listener**, and the browser calls it each
  time the event fires. Your script finishes quickly; the listeners keep the page alive.


  In real projects the placement question is settled with attributes, not by moving tags about.
  `defer` and `type="module"` scripts download while the HTML is parsed and run once it is
  complete, in document order. `async` runs a script as soon as it arrives, in any order, which
  suits independent scripts such as analytics. Knowing which one to use, and why, is a classic
  front-end interview question.
remember:
  - A classic script runs the moment the parser reaches it, so it can only find elements written above it.
  - '`defer` downloads in parallel and runs after parsing, in document order, before `DOMContentLoaded`; module scripts behave like that by default.'
  - '`async` runs the script as soon as it has downloaded, in no guaranteed order, so use it only for scripts that depend on nothing.'
  - Pass a listener as a function value, `addEventListener("click", save)`, never as a call, `save()`, which runs once and hands over its result.
  - An uncaught error stops the rest of that script or that listener call, but the page, other scripts and other listeners carry on.
  - The browser draws the screen between tasks, never in the middle of your script, so only the final state of a synchronous run is ever seen.
  - Errors never show on the page; they go to the Console in the developer tools, with the file and line.
sections:
  - title: 'How a script loads: classic, defer, async and module'
    body: |-
      A plain `<script src="app.js">` is **parser-blocking**. The browser pauses building the
      DOM, downloads the file, runs it, then resumes. A slow file on a slow network holds up
      everything below it. Putting scripts at the end of `body` avoids the missing-element bug,
      but the download only starts when the parser gets there.

      The attributes fix both problems at once:

      ```html
      <head>
        <!-- Downloads now, runs after parsing, in this order. -->
        <script defer src="/vendor/chart.js"></script>
        <script defer src="/app.js"></script>

        <!-- Module scripts are deferred without asking. -->
        <script type="module" src="/main.js"></script>

        <!-- Runs whenever it arrives. Order not guaranteed. -->
        <script async src="/analytics.js"></script>
      </head>
      ```

      The rules to know:

      - **Classic, no attribute**: stops the parser, runs straight away, in document order.
      - **`defer`**: downloads alongside parsing, runs after the whole document is parsed, in
        document order, before the `DOMContentLoaded` event. Ideal for your app code.
      - **`async`**: downloads alongside parsing, runs the moment it arrives, possibly before
        parsing ends and in any order. Fine for a script that touches nothing else.
      - **`type="module"`**: deferred by default, inline or external. Add `async` to a module
        and it runs as soon as it and its imports are ready.
      - `defer` and `async` do nothing on an inline classic script, because there is nothing to
        download.

      With `defer`, `chart.js` always runs before `app.js`, even if `app.js` arrives first. With
      `async`, that promise is gone, so an async script that needs a library can run before the
      library exists. Two events mark the end of loading: `DOMContentLoaded` fires once the DOM
      is built and deferred scripts have run, and `load` fires later, once images, styles and
      async scripts have finished too.
  - title: When the screen updates
    body: |-
      In the lesson, the heading goes from Closed to Opening soon to Open now. Nobody ever sees
      Opening soon. The browser runs JavaScript and draws the page on the same thread, taking
      turns: it runs a whole task, such as a script or one event's listeners, and only after
      that can it paint. The DOM changes instantly, but the pixels wait for your code to finish.

      Two consequences matter in practice:

      - **Intermediate states are invisible.** A loading message you set and then replace in the
        same synchronous run never appears. It needs a real pause, such as waiting for a network
        reply.
      - **Long scripts freeze the page.** While a loop runs for two seconds, clicks queue up,
        nothing repaints, and scrolling can stall. Heavy work belongs off the main thread or in
        smaller pieces.

      The event loop lesson later in this chapter shows the machinery. For now the rule is
      enough: the browser paints between tasks, never in the middle of one.
  - title: What an error stops, and what it does not
    body: |-
      Each `script` element is its own unit of work. An uncaught error ends that script at the
      failing line, and the next `script` element still runs. Inside listeners, an error ends
      that one listener call, and the other listeners for the same event still run.

      ```html
      <script>
        console.log("a1");
        document.querySelector("#missing").textContent = "Hi"; // TypeError, script a stops
        console.log("a2"); // never runs
      </script>
      <script>
        console.log("b1"); // runs: a new script, a fresh start
      </script>
      <button>Save</button>
      <script>
        const button = document.querySelector("button");
        button.addEventListener("click", () => {
          console.log("first listener");
          throw new Error("boom"); // reported in the Console
        });
        button.addEventListener("click", () => console.log("second listener")); // still runs
        button.click();
        console.log("after click"); // still runs
      </script>
      ```

      The Console shows `a1`, the TypeError, `b1`, `first listener`, the error `boom`, then
      `second listener` and `after click`. That is why a broken page often half works: one
      button does nothing while the rest of the page behaves. Read the red line and its line
      number before you guess.
  - title: Listeners in real code
    body: |-
      `addEventListener` keeps a list of functions per event, and runs them in the order they
      were added. A few details come up again and again.

      **Arguments.** A listener receives one argument, the event object. To pass your own
      values, wrap the call in an arrow function, which creates a new function value for the
      browser to keep:

      ```js
      button.addEventListener("click", () => addToCart("tea", 2));
      ```

      **Removing.** `removeEventListener` needs the very same function value. Passing a fresh
      arrow that looks identical removes nothing, because it is a different function. Keep a
      named function if you plan to remove it, or pass `{ once: true }` as a third argument so
      the browser removes it after the first call.

      **Duplicates.** Adding the same function twice for the same event registers it once. Two
      different arrow functions with the same body register twice.

      **Inline handlers.** `onclick="save()"` in the HTML and `button.onclick = save` both hold
      one handler per event, so a second assignment replaces the first. They also mix
      behaviour into markup, and a strict Content Security Policy blocks inline handlers.
      `addEventListener` is the standard choice.
pitfalls:
  - '**Calling the listener instead of passing it.** `addEventListener("click", save())` runs `save` once while the script loads and registers `undefined`. Pass `save`, or wrap it: `() => save(id)`.'
  - '**A script above the elements it needs.** `querySelector` returns `null` and the next property access throws. Move the script to the end of `body`, or better, load it from `head` with `defer`.'
  - '**Using `async` for code that depends on other scripts.** Async scripts run in arrival order, which changes from one load to the next, so the bug appears only sometimes. Use `defer`, or modules with `import`.'
  - '**Removing a listener with a new arrow function.** `removeEventListener("click", () => save())` matches nothing, because each arrow is a new function. Keep a reference, or use `{ once: true }`.'
  - '**Looking for errors on the page.** A failing script leaves the page silent. Open the Console first, read the message and the line number, then fix.'
verify:
  - lens: breaks
    check: 'A classic script in `head` without `defer` finds `null` for every element below it, so the first property access throws.'
  - lens: breaks
    check: 'Each `addEventListener` receives a function, not the result of calling one, or the handler runs once on load and never on click.'
  - lens: tests
    check: 'Load the page with the Console open and check it shows no red errors before you call it working.'
interview:
  - question: What's the difference between async and defer on a script tag?
    answer: >-
      Both download the script without blocking the HTML parser; they differ in when the
      script runs. A `defer` script runs after the document has been parsed, in document
      order, and before `DOMContentLoaded`, so it can rely on the full DOM and on earlier
      deferred scripts. An `async` script runs as soon as it arrives, which can be mid-parse
      and in any order relative to other scripts. I use `defer`, or `type="module"`, which is
      deferred by default, for application code. I keep `async` for independent third-party
      scripts like analytics, where running early matters more than order. Neither attribute
      does anything on an inline classic script.
  - question: Why might `document.querySelector` return null when the element is clearly in the HTML?
    answer: >-
      Usually because the script ran before the parser reached that element. A classic
      script executes the moment the parser meets it, and the DOM only contains what has been
      parsed so far. So a script in `head` that looks for a button in `body` finds nothing,
      and the next line throws a TypeError on `null`. The fixes are to load the script with
      `defer` or as a module, to place it at the end of `body`, or to wait for
      `DOMContentLoaded`. I prefer `defer` in `head`: the download starts early and execution
      waits for the DOM. The other causes worth checking are a typo in the selector and an
      element that JavaScript adds later.
  - question: What's the difference between addEventListener and an onclick attribute?
    answer: >-
      `addEventListener` lets several listeners share one event and keeps behaviour in
      JavaScript; `onclick` holds one handler and lives in the markup. With the property or
      attribute, a second assignment silently replaces the first, which is a problem when
      two parts of an app or a third-party script want the same event. `addEventListener` also
      takes options such as `{ once: true }` and pairs with `removeEventListener`. Inline
      attributes are blocked by a strict Content Security Policy, because they are inline
      code. The only real advantage of `onclick` is brevity in a throwaway demo.
  - question: When does DOMContentLoaded fire compared with load?
    answer: >-
      `DOMContentLoaded` fires when the HTML has been fully parsed and all deferred and module
      scripts have run. `load` fires later, when every dependent resource has finished too:
      images, stylesheets, iframes and async scripts. So code that only needs the DOM should
      wait for `DOMContentLoaded`, or run from a deferred script, which amounts to the same
      thing. Waiting for `load` delays interactivity until the heaviest image arrives. `load`
      is right when you need final sizes, such as measuring an image. Async scripts are not
      guaranteed to run before `DOMContentLoaded`.
