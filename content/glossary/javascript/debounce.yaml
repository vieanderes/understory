term: debounce
aka:
  - debouncing
short: Waiting until the calls stop for a set pause, then running the function once with the latest input.
explain: |
  A search box that fetches on every keystroke sends ten requests for one word. Instead,
  wait. Each keystroke restarts a short timer, say 300 ms. The search runs only when typing
  pauses.

  It's a closure around a timer. The trade-off is delay: nothing happens until the user
  stops. For steady feedback while something keeps happening, such as scrolling, you want
  throttle.
analogy: A lift that waits for people to stop getting in before it shuts the doors. Every new person restarts the wait.
example:
  language: js
  code: |
    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    input.addEventListener('input', debounce(search, 300));
usage: Debounce the search input, or we'll hit the API on every keystroke.
twin:
  term: throttle
  difference: Debounce waits for a quiet gap and then runs once. Throttle runs at most once per interval, so it keeps firing while the activity goes on.
related:
  - throttle
  - closure
level: 2
