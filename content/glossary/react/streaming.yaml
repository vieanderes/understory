term: streaming
aka: [streaming SSR, streamed rendering, HTML streaming]
short: Sending a page in pieces, the ready parts first and slow parts as each finishes.
explain: |
  One slow query shouldn't hold back the whole page. Without this, the server waits for
  every piece of data before sending a single byte.

  The server sends the shell at once, with fallbacks where data is still loading. As each
  part's data arrives, its HTML follows on the same response and replaces the fallback. In
  Next.js you mark those parts with `<Suspense>` or a `loading.tsx` file. The response keeps
  its status code from the start, so a later error can't turn it into a 404.
analogy: A restaurant that brings the bread while the main course cooks, instead of serving everything at once after forty minutes.
example:
  language: tsx
  code: |
    export default function Page() {
      return (
        <>
          <Header />
          <Suspense fallback={<p>Loading reviews</p>}>
            <Reviews />
          </Suspense>
        </>
      );
    }
usage: Streaming the reviews means the product shows in 200 ms even though reviews take two seconds.
related: [suspense, server-side-rendering, latency]
level: 2
lessons: [next.loading-data]
