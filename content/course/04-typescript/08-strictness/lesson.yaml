deepDive: >-
  The `strict` family covers `noImplicitAny`, `strictNullChecks`, `strictFunctionTypes`,
  `strictBindCallApply`, `strictPropertyInitialization`, `strictBuiltinIteratorReturn`,
  `noImplicitThis`, `alwaysStrict` and `useUnknownInCatchVariables`, and new members join over
  time. `noImplicitAny` is the one that
  stops a parameter with no annotation from quietly becoming `any`.


  TypeScript 6.0 turned `strict` on by default, so an older tutorial may show code that no longer
  compiles. Writing `"strict": true` anyway makes the intent plain to the next reader.


  Linters can ban the hatches. typescript-eslint has rules against `any`
  (`no-explicit-any`) and against `!` (`no-non-null-assertion`), so each use needs a comment
  saying why it's safe.
