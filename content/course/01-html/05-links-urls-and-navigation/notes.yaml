summary: >-
  Every link and every image points at something with a **URL**, a web address. You can
  write that address in full, `https://docs.example/img/logo.png`, or as a shorter path the
  browser, the app you read websites in, completes for you. A path that starts with `/` starts at the top of the site. A path
  with no leading slash is **relative**: the browser starts from the folder of the page it's
  on. The same tag can therefore lead to different files on different pages, and that's the
  cause of most broken images and dead links.


  Links can also point at a spot within a page. The part after `#`, the **fragment**, names an element, one
  piece of the page, by its `id`, and the browser scrolls there without loading anything. That's how
  tables of contents, "back to top" links and skip links work. Skip links matter a lot to
  keyboard users: one keypress takes them past the menu to the content.


  Once you can resolve any path in your head, you can predict where a link goes before you
  click it. Then you can choose the kind of path that survives when pages move, when the
  site runs on your laptop, and when it goes live.
remember:
  - A relative path starts from the page's folder, found by dropping everything after the last `/` in the page's address.
  - A path that starts with `/` starts at the top of the site, so it leads to the same place from every page.
  - Each leading `../` climbs one folder, and climbing past the top of the site stops at the top.
  - The trailing slash changes the folder, so `screen.png` on `/guides` leads to `/screen.png` but on `/guides/` leads to `/guides/screen.png`.
  - A fragment such as `#find-us` scrolls to the element whose `id` matches exactly, and ids are case-sensitive.
  - The fragment never reaches the server, and a link to a fragment on the same page loads nothing.
  - Every `id` on a page must be unique, because a fragment link only ever finds the first match.
  - A skip link, `href="#main"`, moves keyboard users past repeated menus, and the next Tab continues from its target.
sections:
  - title: The parts of a URL
    body: |-
      A full URL has up to five parts. Here's one taken apart, the way the browser splits it:

      ```text
      https://shop.example:8080/books/list.html?sort=price&page=2#reviews

      https:              the scheme: how to fetch it
      shop.example:8080   the host: which computer, and an optional port
      /books/list.html    the path: which file or page on that computer
      ?sort=price&page=2  the query: extra settings, as name=value pairs
      #reviews            the fragment: a spot within the page
      ```

      A **server** is the computer that runs a site and sends pages back when the browser
      asks. The browser sends it the scheme, host, path and query. The fragment stays behind:
      it's only for the browser. In a test in Chrome, loading
      `https://docs.example/guides/setup.html#main` sent a request for the address without
      `#main`, then scrolled to the element once the page arrived.

      The query holds pairs of a name and a value, joined with `&`. You'll write them without
      noticing in the next lesson, because a search form builds one for you.

      Some characters can't appear in a URL as they are. A space in a file name becomes `%20`,
      so `my photo.jpg` is requested as `my%20photo.jpg`. It works, but it's ugly, and some
      tools handle it badly. That's why web files use hyphens: `my-photo.jpg`.

      One more thing to know about the path: many servers treat upper and lower case as
      different, so `Logo.png` and `logo.png` are two files. A Mac or Windows laptop usually
      treats them as the same file by default. So a wrongly cased path can work on your
      machine and break once the site goes live.
  - title: Resolving any path, step by step
    body: |-
      Resolving a path means turning it into a full URL. The browser starts from the address
      of the current page, called the **base**. Every result below was checked with the
      browser's own URL rules, from the page `https://docs.example/guides/setup.html`:

      ```text
      img/screen.png          ->  https://docs.example/guides/img/screen.png
      ./img/screen.png        ->  https://docs.example/guides/img/screen.png
      ../index.html           ->  https://docs.example/index.html
      ../../../x.png          ->  https://docs.example/x.png
      /img/logo.png           ->  https://docs.example/img/logo.png
      ?page=2                 ->  https://docs.example/guides/setup.html?page=2
      #install                ->  https://docs.example/guides/setup.html#install
      (empty)                 ->  https://docs.example/guides/setup.html
      //cdn.example/app.js    ->  https://cdn.example/app.js
      ```

      Read them as rules. `./` means "this folder" and changes nothing. Each `../` climbs one
      folder, and extra ones stop at the top of the site instead of failing. A path that is
      only a query or only a fragment keeps the page and replaces that part. An empty `href`
      points at the page itself, so clicking it reloads the page. Two slashes at the start
      keep the scheme and replace everything else, which is rare in new code.

      The trailing slash is the rule people forget. The folder is everything up to the last
      `/`:

      ```text
      base https://docs.example/guides    + screen.png  ->  https://docs.example/screen.png
      base https://docs.example/guides/   + screen.png  ->  https://docs.example/guides/screen.png
      ```

      On `/guides`, the word `guides` is treated like a file name and dropped. To test a case
      you're unsure about, open the Console in the developer tools, the inspection panels
      built into the browser, and run
      `new URL("screen.png", "https://docs.example/guides").href`. It uses the same rules as
      links.
  - title: Which kind of path to write
    body: |-
      Each kind of path survives a different kind of change, so choose by what's likely to
      move.

      - **Full URLs** for other sites. They're the only option there. For your own site
        they're fragile: the site often runs at several addresses, such as your laptop, a
        preview copy and the live domain, and a full URL ties every link to one of them.
      - **Paths from the top, starting with `/`**, for anything shared across the site: the
        menu, the logo, the footer links. They work from any page at any depth, and they
        survive a page moving to a deeper folder.
      - **Relative paths** for files that travel together. A guide with its own `img` folder
        can move as one unit, and every relative path inside still works.

      Each choice has a failure mode:

      ```text
      A relative path breaks when the page moves without its files.
        /guides/setup.html -> /guides/2026/setup.html
        img/screen.png now asks for /guides/2026/img/screen.png

      A path from the top breaks when the whole site moves into a folder.
        example.com/ -> example.com/shop/
        /img/logo.png still asks for example.com/img/logo.png
      ```

      The second case is real: some free hosting puts a site at an address like
      `username.example.io/project-name/`. Build tools you'll meet later can add that folder
      to every path for you. For a hand-written site at the top of its own domain, use `/`
      paths for shared parts and relative paths inside self-contained folders.
  - title: Fragments, focus and skip links
    body: |-
      A fragment link scrolls to the element with a matching `id`. Chrome follows a few rules
      worth knowing, all checked in a test page:

      - **The match is exact.** `href="#MAIN"` doesn't find `id="main"`. The address changes
        and nothing scrolls.
      - **The first duplicate wins.** With two elements using `id="menu"`, the link always goes
        to the first. Duplicate ids are invalid HTML for this reason.
      - **`#top` and a lone `#` go to the top** of the page when no element has that id.
      - **Each jump adds a history entry.** The Back button returns to where you were.

      The most important fragment link on many sites is the **skip link**. It's the first
      thing in `body`, so it's the first thing the Tab key reaches:

      ```html
      <body>
        <a href="#main">Skip to content</a>
        <header>...</header>
        <nav>...</nav>
        <main id="main">
          <h1>Set up your account</h1>
          <a href="/billing">Billing</a>
        </main>
      </body>
      ```

      In Chrome, activating the skip link scrolls to `main` and moves the starting point for
      the keyboard there. The next Tab press lands on "Billing", the first link inside `main`,
      not on the menu. Without it, a keyboard user presses Tab through every menu link on
      every page. The skip link is a common way to meet WCAG 2.2 success criterion 2.4.1,
      Bypass Blocks, level A.
  - title: What happens when you follow a link
    body: |-
      A link to another page starts a **navigation**. The browser asks the server for the new
      page, then throws the old one away completely: its DOM, the tree of
      objects built from its HTML, its JavaScript variables, what
      someone half-typed into a form. It also adds an entry to the history behind the Back
      button. A link to a fragment on the same page is different: nothing is requested and
      nothing is thrown away.

      By default, a navigation replaces the current page in the same tab. `target="_blank"`
      opens the link in a new tab or window instead:

      ```html
      <a href="https://maps.example/harbour" target="_blank">Harbour map (opens in a new tab)</a>
      ```

      Years ago, the new page could reach back and change the page that opened it. That's why
      older code adds `rel="noopener"` to every such link. Browsers now apply that
      automatically for `target="_blank"`. In a test in Chrome, the new tab's `window.opener`,
      its link back to the page that opened it, was `null`.

      Use new tabs sparingly. People can already open any link in a new tab themselves. A tab they
      didn't ask for is disorienting, especially for screen reader users, who hear the page read aloud
      by an app and may not notice the switch. If a link does open a new tab, say so in the link text, as above.
pitfalls:
  - '**Relative paths in a shared menu.** `contact` works on the home page and breaks one folder down. Use paths from the top, like `/contact`, for anything on every page.'
  - '**Forgetting the trailing slash.** On `/guides`, relative paths start from the top of the site, not from `guides`. Link to folders with the slash, `/guides/`.'
  - '**Getting the case wrong.** `Logo.png` may work on your laptop and fail on the server, which treats it as a different file. Name files in lower case and copy names exactly.'
  - '**Putting spaces in file names.** They turn into `%20` and break in scripts and tools. Use hyphens, like `ridge-trail.jpg`.'
  - '**Reusing an id.** A fragment link always finds the first element with that id, so the second section is unreachable. Keep every id unique on the page.'
  - '**Hard-coding your own domain.** Full URLs to your own pages break on your laptop and on preview copies. Use paths from the top for internal links.'
interview:
  - question: Explain absolute, root-relative and relative URLs, and when you'd use each.
    answer: >-
      They differ in how much of the address they fix, which decides what change they survive.
      An absolute URL includes the scheme and host, like `https://docs.example/img/logo.png`.
      I use it for other sites. A root-relative path such as `/img/logo.png` keeps the current
      host and starts at the top of the site. I use it for shared parts like the menu and the
      logo, because it resolves the same from every page. A relative path such as
      `img/logo.png` starts from the current page's folder, so it suits files that move
      together, like a guide and its screenshots. The trade-offs: relative paths break when a page moves alone.
      Root-relative paths break when the whole site is served from a sub-folder, which build
      tools solve with a base path setting. Absolute URLs to your own
      site break across local, preview and live environments.
  - question: Is the fragment part of a URL sent to the server? What's it for?
    answer: >-
      No. The browser keeps the fragment, the part after `#`, and sends only the rest. It uses
      the fragment itself: after the page loads, it scrolls to the element whose `id` matches.
      Following a link to a fragment on the current page sends no request at all, but it does
      add a history entry, so Back returns to the previous position. That makes fragments
      right for tables of contents, deep links to a section and skip links. The consequence
      for developers is that the server can't use the fragment. You can't choose what to
      return based on it, and it won't show in server logs. Anything the server must know,
      like a search term or a page number, belongs in the path or the query string instead.
  - question: What's a skip link, and how does it work?
    answer: >-
      It's a link, usually the first element in `body`, that jumps past the repeated header
      and menu to the main content. It's a plain fragment link, `href="#main"`, pointing at
      `main id="main"`. Because it comes first, it's the first thing the Tab key reaches. When
      activated, the browser scrolls to the target and moves the keyboard's starting point
      there, so the next Tab reaches the first link inside `main` rather than the menu.
      Without it, keyboard users press Tab through every menu link on every page. It's a
      common way to meet WCAG 2.4.1, Bypass Blocks. It's often hidden visually until it
      receives focus, which keeps the design clean, but it must become visible then, or
      sighted keyboard users won't know where focus went.
  - question: What does target="_blank" do, and is it a security risk?
    answer: >-
      It opens the link in a new tab or window, and in current browsers it's no longer a
      security risk on its own. The old risk was that the new page could reach the opening
      page through `window.opener` and redirect it to a fake login page, a trick known as reverse
      tabnabbing. The fix was `rel="noopener"`, and browsers now apply it by default for
      `target="_blank"`: the new page's `window.opener` is `null`. Adding `rel="noopener"`
      explicitly is still harmless for very old browsers. The bigger question is whether to
      open a new tab at all. Users can already choose to, and an unexpected new tab confuses
      people, especially with a screen reader. When a new tab is justified, for example to
      keep a half-filled form open, I say so in the link text.
