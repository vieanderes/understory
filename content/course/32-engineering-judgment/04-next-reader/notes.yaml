summary: >-
  "What will confuse the next person?" is not a question about style. Names and formatting
  matter, but the confusion that causes bugs is behavioural: a function that does something
  its name doesn't suggest, a rule the code relies on but never enforces, or behaviour that
  callers depend on although nobody promised it.


  The **principle of least surprise** says code should do what its name and shape suggest,
  because the next person will change it on that assumption. A **hidden invariant**, such as
  "the timetable is sorted", holds only until someone adds data a new way, and then breaks
  far from the change. An **implicit contract**, such as the order a list comes back in, is
  something callers rely on without anyone writing it down, so a change that passes every
  test can still break them.


  The fixes have the same shape. Make behaviour match the name, enforce rules in one place
  in code, and turn the contracts callers rely on into tests or names that state them.
remember:
  - The next person changes code based on what its name and shape suggest, so every behaviour the name hides is a future bug.
  - A function that both reads and writes should be split, or named for both, so each call site says what happens.
  - Any behaviour a caller can observe can become a contract, including order, `null` against `[]`, timing and error text.
  - A change that keeps every test green can still break callers who relied on behaviour nobody tested.
  - A hidden invariant is enforced in one place in code, not stated in a comment that new code never reads.
  - "`Object.keys` lists integer-like keys in ascending order first, while `Map` and `Set` keep insertion order."
  - Before changing observable behaviour, find the callers or pin today's behaviour with a test.
sections:
  - title: Three kinds of surprise, and their fixes
    body: |-
      Most behavioural surprises fall into a few patterns you can spot in review.

      - **A read that writes.** `findMember` that creates a member, a `get` that caches by changing shared state, a `validate` that also fixes the input. Split the read from the write, or name the function for both.
      - **A function that changes its input.** A `sort`, `reverse` or `push` on an array the caller still holds. Return a new value and leave the input alone.
      - **Two shapes for one answer.** `null` on one path and `[]` on another, or a number on success and a string on failure. Pick one shape and use it on every path.

      Here is the third one, which TypeScript would catch but JavaScript won't:

      ```js
      function overdueLoans(member) {
        if (!member.loans) return null;
        return member.loans.filter((loan) => loan.due < "2026-10-07");
      }

      console.log(overdueLoans({ loans: [] }).length); // 0
      console.log(overdueLoans({}).length);            // TypeError
      ```

      A caller who tested with a member who has an empty list would write `.length` and ship
      it. The first member with no `loans` field crashes the page. Returning `[]` on both
      paths removes the surprise and the bug together.

      In review, the cheap test for surprise is to cover the body, read only the name and
      the parameters, and say what you expect it to do. Then read the body. Every difference
      is either a misleading name or a hidden behaviour.
  - title: Hidden invariants, from comment to code
    body: |-
      An invariant moves through three stages of safety.

      In the first, it lives in someone's head. In the second, it is a comment such as "sorted
      by start time", which helps a careful reader and stops nobody. In the third, it is
      enforced: the only way to change the data keeps the rule, or a check refuses data that
      breaks it.

      The challenge built the third stage for adding lessons. A check is the other half,
      useful where data arrives from elsewhere, such as a file or another service:

      ```js
      function assertSorted(timetable) {
        for (let i = 1; i < timetable.length; i++) {
          if (timetable[i - 1].start > timetable[i].start) {
            throw new Error(`Timetable out of order at ${timetable[i].name}`);
          }
        }
        return timetable;
      }

      assertSorted([{ name: "Maths", start: "09:00" }, { name: "Art", start: "11:00" }]);
      assertSorted([{ name: "Art", start: "11:00" }, { name: "Chess", start: "08:00" }]);
      // Error: Timetable out of order at Chess
      ```

      The value of the check is where the error appears. Without it, the symptom is "the
      screen shows the wrong next lesson", reported days later. With it, the error names the
      bad data at the moment it enters.

      Databases enforce invariants too, and do it for every writer at once: a `UNIQUE`
      constraint, a `CHECK`, an exclusion constraint against overlapping ranges. When many
      services write the same table, the database is often the only place a rule can live.
  - title: Changing behaviour that callers depend on
    body: |-
      Sometimes the behaviour must change. The order of a list, the shape of an error, the
      speed of a call. The safe way follows four steps.

      First, find the callers: search the codebase for the function, and for an API, check
      the access logs for who calls the endpoint. Second, pin today's behaviour with a test, so
      you can see exactly what your change alters. Third, prefer adding over changing: a new
      function or a new field with the new behaviour, while the old one keeps working. Fourth,
      move callers over one at a time, then remove the old behaviour once nothing uses it.

      This is slower than changing one line, and it is the reason mature codebases look
      conservative. The alternative is the ai-review in this lesson: a faster
      `recentBorrowers` that passed every test and quietly broke the home page, because no
      test pinned the order.

      When you write new code, you can reduce future contracts on purpose. Return only what
      callers need, document what order you promise, and say "unordered" when you don't
      promise one. A stated contract can be kept or changed deliberately. An unstated one
      can only be broken by accident.
pitfalls:
  - '**Fixing a surprise with a comment.** Callers read the call site, not the function body. Make the behaviour match the name, or change the name.'
  - '**Assuming "nobody promised it" means "nobody relies on it".** Order, timing and error text become contracts once callers can see them. Find the callers before changing it.'
  - '**Swapping a data structure without checking order.** Moving from an array to object keys sorts integer-like keys. Use a `Set` or `Map` when order matters, and test the order.'
  - '**Enforcing a rule in one writer but not another.** An invariant kept by `addLesson` breaks the day a second function pushes directly. Route every write through one place, or enforce it in the database.'
  - '**Returning different shapes from different paths.** `null` here and `[]` there makes every caller defend against both. Pick one and use it on every path.'
verify:
  - lens: confuses
    check: Each changed function does only what its name says, with no hidden write, mutation of its input or second return shape.
  - lens: confuses
    check: Any rule the code relies on, such as sorted order or one primary address, is enforced in one place in code, not only in a comment.
  - lens: breaks
    check: A change to order, return shape, timing or error text has a list of callers that depend on it, and each was checked.
  - lens: tests
    check: Observable behaviour callers rely on, such as the order of a returned list, is pinned by a test before the code is refactored.
interview:
  - question: What makes code hard to change safely, beyond bad names?
    answer: >-
      Behaviour the reader can't see from the outside. Three things in particular. Hidden side
      effects, like a find function that also creates records, which callers use without
      knowing. Hidden invariants, rules like "this list is sorted" that the code relies on but
      never enforces, so a new way of adding data breaks something far away. And implicit
      contracts, behaviour callers depend on that nobody promised, such as order or the
      exact error message. Good names help with none of these on their own. The fixes are to
      split functions that read and write, enforce invariants in one place, and pin the
      behaviour callers rely on with tests. That makes the next change safe.
  - question: You need to change the order an API returns its results in. How do you do it?
    answer: >-
      Carefully, because order is a contract the moment a client can see it, even if the
      documentation never promised one. I'd first find who calls it, from the code and the
      access logs. I'd add a test that pins the current order, so the change is visible.
      Then, rather than changing the existing behaviour, I'd add the new order behind a
      parameter, such as `sort=name`, or as a new endpoint, and move callers over. Once
      nobody uses the old default, it can change. For new APIs I'd document the order I
      promise, or say explicitly that there is none, which keeps future changes cheap.
  - question: How would you stop a rule like "bookings never overlap" from being broken?
    answer: >-
      Enforce it in one place that every write must pass through, and as close to the data as
      possible. In application code, that means one function that adds bookings, checks for
      overlaps and refuses them, with no other code writing to the list directly. But if
      several services or scripts write to the same table, the database is the only place
      that sees every write, so I'd add a constraint there. In Postgres an exclusion
      constraint on a time range does exactly this. A comment saying "never overlap" protects
      nothing. A check that throws turns a far-away wrong answer into an error at the moment
      the bad data arrives.
