approach: >-
  Guess a limit and check it: walk the episodes, start a new season whenever the next
  episode would pass the limit, and see whether K seasons are enough. Raising the limit
  never needs more seasons, so binary search the smallest limit that fits, between the
  longest episode and the total length.
complexity: O(N log S) time, where S is the total length; O(1) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Read the bottom first. **N and K up to 100,000**, episodes up to 10,000 minutes. The
      number of ways to split grows far too fast to try them all.

      "The smallest possible longest season" means minimising a maximum. That phrase often
      points to binary search on the answer.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put the task in your own words. Calling the answer a "limit" turns an optimisation
      into a yes-or-no question you can check.
    code:
      ts: |-
        // Split A into K runs in order; return the smallest limit on the longest run's total.
      python: |-
        # Split A into K runs in order; return the smallest limit on the longest run's total.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs at the edges:

      - one episode, with one or many seasons;
      - more seasons than episodes, where the longest episode decides;
      - episodes of 0 minutes;
      - zeros between long episodes.

      Put them in test-input.txt now.
    input:
      - "(1, [40])"
      - "(5, [40])"
      - "(10, [30, 50, 20])"
      - "(2, [0, 0, 0, 0])"
      - "(2, [7, 0, 0, 7, 0, 7])"
  - kind: ask-ai
    title: Confirm the search range with the assistant
    minutes: 1
    body: |-
      The bounds decide whether the search is right. Check your reasoning about them with a
      narrow question. Never paste the task and ask for the solution.
    prompt: >-
      Without solving it: the answer can never be below the longest episode, and can never
      be above the sum of all episodes. Is that right? One sentence.
    expect: The assistant agrees, so the search runs from max(A) to sum(A).
  - kind: plan
    title: A greedy check inside a binary search
    minutes: 3
    body: |-
      For a fixed limit, filling each season as full as possible uses the fewest seasons.
      That check is one pass, O(N).

      If a limit fits, every bigger limit fits too. So the limits form "no, no, ..., yes,
      yes": binary search finds the first yes in about 30 checks.
  - kind: write
    title: Write the greedy check yourself
    minutes: 4
    body: |-
      Type the check first: it is the part that decides correctness. Note the order: reset
      the running total when a season closes, then add the episode to the new season.
    code:
      ts: |-
        const fits = (limit: number): boolean => {
          let seasons = 1;
          let current = 0;
          for (const minutes of A) {
            if (current + minutes > limit) {
              seasons += 1;
              current = 0;
            }
            current += minutes;
          }
          return seasons <= K;
        };
      python: |-
        def fits(limit):
            seasons = 1
            current = 0
            for minutes in A:
                if current + minutes > limit:
                    seasons += 1
                    if seasons > K:
                        return False
                    current = 0
                current += minutes
            return True
    codeMode: snippet
  - kind: write
    title: Add the binary search around it
    minutes: 4
    body: |-
      Now the search. Start at the longest episode and the total. When the middle fits, it
      becomes the new top; when it does not, the bottom moves past it. The loop ends when
      the two meet, and that is the answer.
    code:
      ts: |-
        // Split A into K runs in order; return the smallest limit on the longest run's total.
        // A limit that fits in K seasons keeps fitting when raised, so binary search the
        // smallest one between max(A) and sum(A), checking each with a greedy pass:
        // O(N log S) time, O(1) space.
        function solution(K: number, A: number[]): number {
          const fits = (limit: number): boolean => {
            let seasons = 1;
            let current = 0;
            for (const minutes of A) {
              if (current + minutes > limit) {
                seasons += 1;
                current = 0;
              }
              current += minutes;
            }
            return seasons <= K;
          };
          let low = 0;
          let high = 0;
          for (const minutes of A) {
            low = Math.max(low, minutes);
            high += minutes;
          }
          while (low < high) {
            const middle = Math.floor((low + high) / 2);
            if (fits(middle)) high = middle;
            else low = middle + 1;
          }
          return low;
        }
      python: |-
        # Split A into K runs in order; return the smallest limit on the longest run's total.
        # A limit that fits in K seasons keeps fitting when raised, so binary search the
        # smallest one between max(A) and sum(A), checking each with a greedy pass:
        # O(N log S) time, O(1) space.
        def solution(K, A):
            def fits(limit):
                seasons = 1
                current = 0
                for minutes in A:
                    if current + minutes > limit:
                        seasons += 1
                        if seasons > K:
                            return False
                        current = 0
                    current += minutes
                return True

            low, high = max(A), sum(A)
            while low < high:
                middle = (low + high) // 2
                if fits(middle):
                    high = middle
                else:
                    low = middle + 1
            return low
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Check each of your cases against the
      rule.
    expect: >-
      Two OKs, then 40 for both single-episode cases, 50 when seasons outnumber episodes, 0
      for the zeros and 14 for the zeros between long episodes.
  - kind: ai-writes
    title: Let the assistant write a brute-force checker
    minutes: 3
    body: |-
      A tiny brute force that tries every split is fine to delegate: it is throwaway test
      code, not your answer. Read it before you trust it, and only run it on small inputs.
      Do not let it touch your solution.
    prompt: >-
      Write a separate function brute(K, A) in my current language that tries every way to
      split A into at most K consecutive runs and returns the smallest possible longest run
      total. Keep it simple, for arrays of up to 8 items. Do not change my solution
      function.
    expect: >-
      A short recursive function. On your test inputs and a few of your own, it returns the
      same values as solution. Delete it before submitting.
  - kind: review
    title: Ask for a review that lists problems only
    minutes: 1
    body: |-
      Ask for problems, not a rewrite. The search bounds and the reset of the running total
      are where bugs hide.
    prompt: >-
      Review my current solution for off-by-one errors in the binary search, the greedy
      check and time complexity. List any problems in one line each. Do not rewrite the
      code.
    expect: No problems, and the assistant confirms O(N log S) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Delete the brute-force helper and any debug output. Check the header comment states
      the complexity. Then submit.
