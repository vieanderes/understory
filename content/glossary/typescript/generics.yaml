term: generics
aka:
  - generic
  - type parameter
short: Types that take another type as an input, written in angle brackets, so one function serves many types.
explain: |
  A `first` function should work on a list of numbers and a list of strings, and say which it
  returns. `function first<T>(items: T[]): T` does that. `T` is filled in at each call.

  Callers rarely write `<T>` themselves; it's inferred from the arguments. Add a constraint,
  `T extends { id: string }`, when the body needs something from `T`. Like all types,
  generics vanish at run time.
analogy: A cake tin. The shape is fixed, but you choose the mixture each time.
example:
  language: ts
  code: |
    function first<T>(items: T[]): T | undefined {
      return items[0];
    }
    const n = first([1, 2]); // number | undefined
    const s = first(['a']); // string | undefined
usage: Make the cache generic over the value type instead of storing any.
twin:
  term: any-type
  difference: A generic keeps the link between what goes in and what comes out. `any` throws the type away, so whatever comes out is unchecked.
related:
  - type-inference
  - any-type
level: 2
lessons:
  - ts.generics
