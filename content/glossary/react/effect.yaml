term: effect
aka:
  - useEffect
short: Code React runs after the screen updates, to keep a component in step with something outside React.
explain: |
  Some work can't happen while React works out the page: connecting to a chat server,
  starting a timer, syncing with a browser API. `useEffect` runs it after the update, and its
  cleanup undoes it before the next run.

  The common mistake is using one where none is needed. A value you can calculate from props
  or state should be calculated during the draw. Something caused by a click belongs in the
  click handler.
analogy: A thermostat. After the room changes, it checks and adjusts the heating to match.
example:
  language: tsx
  code: |
    useEffect(() => {
      const id = setInterval(() => setSeconds((s) => s + 1), 1000);
      return () => clearInterval(id); // cleanup
    }, []);
usage: That effect only copies props into state; calculate it during render and delete the effect.
twin:
  term: side-effect
  difference: A side effect is any change outside a function. An effect is React's place to run one after the screen updates, kept in step by its dependency array.
related:
  - dependency-array
  - side-effect
  - hook
level: 1
lessons:
  - react.effects
