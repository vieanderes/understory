id: algo.mock-round
title: A full coding round
objective: Solve one problem end to end under interview conditions, from constraints to tested, optimised code, explained aloud.
level: advanced
minutes: 10
concepts: [algo.pattern-recognition, algo.communicating-solutions]
prerequisites: [algo.dynamic-programming]
opening:
  text: >-
    You'll run one coding round from the first question to the last test. How you get
    there counts as much as the answer.

steps:
  - type: prose
    id: the-problem
    body: |-
      Here's the problem. A support tool groups ticket numbers into streaks. Given an
      unsorted list of whole numbers, return the length of the longest run of consecutive
      values.

      ```js
      longestRun([100, 4, 200, 1, 3, 2]); // 4, from 1, 2, 3, 4
      ```

      You lead from here. Don't start typing: ask about the input first.

  - type: multiple-choice
    id: pick-first-question
    concept: algo.communicating-solutions
    difficulty: 2
    question: Which question do you ask the interviewer first?
    choices:
      - text: How large can the list get?
        correct: true
        feedback: >-
          Right. The size decides whether O(n log n) is fine or O(n) is needed.
      - text: Should I use a hash set?
        feedback: >-
          That asks them for the answer. Choosing the structure is your part of the round.
      - text: Can I skip the edge cases?
        feedback: >-
          Edge cases are part of the job. Ask what they should return, not whether they count.

  - type: code-challenge
    id: write-brute-run
    concept: algo.communicating-solutions
    difficulty: 3
    language: python
    starter: brute.starter.py
    solution: brute.solution.py
    tests: brute.tests.py
    prompt: >-
      The interviewer says: up to 100,000 numbers, any whole values, repeats allowed, and an
      empty list gives 0. Get a correct answer on the board first. Write `longest_run(nums)`
      in Python by sorting. O(n log n) is fine for now.


      `longest_run([100, 4, 200, 1, 3, 2])` is `4`.
    hints:
      - After sorting, a run is a stretch where each value is one more than the last.
      - What should a repeated value do to the current run? Try `[1, 2, 2, 3]`.
      - 'Sort `set(nums)` to drop repeats, then walk it with a `run` and a `best` counter.'

  - type: ai-review
    id: review-duplicate-reset
    concept: algo.communicating-solutions
    difficulty: 3
    language: js
    request: Return the length of the longest run of consecutive numbers in a list.
    flawClass: edge-case
    code: |
      function longestRun(nums) {
        if (nums.length === 0) return 0;
        const sorted = [...nums].sort((a, b) => a - b);
        let best = 1, run = 1;
        for (let i = 1; i < sorted.length; i++) {
          if (sorted[i] === sorted[i - 1] + 1) run++;
          else run = 1;
          best = Math.max(best, run);
        }
        return best;
      }
    prompt: >-
      An assistant wrote this brute force. It returns 4 for the example. For `[1, 2, 2, 3]` it
      returns 2. Tap the line at fault.
    lines: [7]
    reasons:
      - text: A repeated number resets the run
        correct: true
        feedback: >-
          Yes. The second `2` isn't one more than the first, so the run restarts.
      - text: '`best` should start at 0'
        feedback: >-
          The empty list returns early, so any other list has a run of at least 1.
      - text: '`sort` puts the numbers in text order'
        feedback: >-
          Without a comparator it would. `(a, b) => a - b` sorts them as numbers.
    verify:
      question: Which test would have caught this?
      choices:
        - text: A list with a repeated number inside a run
          correct: true
          feedback: >-
            Yes. The repeat is what resets the run.
        - text: An empty list
          feedback: >-
            That returns 0 on line 2, before the faulty line is reached.
        - text: Numbers given in reverse order
          feedback: >-
            The sort puts them in order first, so the run is counted right.
    fix: |
      if (sorted[i] === sorted[i - 1]) continue;   // a repeat: neither extends nor breaks
      if (sorted[i] === sorted[i - 1] + 1) run++;
      else run = 1;

  - type: multiple-choice
    id: pick-set-signal
    concept: algo.pattern-recognition
    difficulty: 2
    question: For O(n), which structure tells you at once whether n + 1 is present?
    choices:
      - text: A set of every number
        correct: true
        feedback: >-
          Yes. Membership in O(1), with no sorting.
      - text: Sort, then binary-search each neighbour
        feedback: >-
          That still pays O(n log n) for the sort.
      - text: Two pointers from both ends
        feedback: >-
          Two pointers need sorted input, which costs the sort again.
      - text: A heap of the numbers
        feedback: >-
          A heap gives the smallest fast, not "is this value here?".

  - type: prose
    id: optimise
    body: |-
      Say the cost out loud: O(n log n), and the bottleneck is the sort.

      With every number in a set, you can walk a run upwards: is n + 1 here? n + 2? The
      catch is where to start walking. Start from every number and a run of length k gets
      walked k times. That's O(n²) on one long run. Your challenge is to avoid it.

  - type: code-challenge
    id: write-longest-run
    concept: algo.pattern-recognition
    difficulty: 4
    language: ts
    twin:
      language: python
      starter: run.starter.py
      solution: run.solution.py
      tests: run.tests.py
    prompt: >-
      Now the optimised version. Write `longestRun(nums)` in O(n): the length
      of the longest run of consecutive values.


      `longestRun([100, 4, 200, 1, 3, 2])` is `4`. An empty list gives `0`.


      **Target:** O(n) for 100,000 numbers. The tests include repeats, negatives, and one
      run of 100,000. Walking upwards from every number runs out of time there.
    hints:
      - Which numbers are worth walking upwards from?
      - A number starts a run only if the number one below it is missing.
      - 'Start with `const seen = new Set(nums);`, then loop over `seen`, skipping any `n` where `seen.has(n - 1)`.'

  - type: explain-back
    id: explain-linear
    concept: algo.communicating-solutions
    difficulty: 4
    audience: interviewer
    kind: explain
    prompt: >-
      The interviewer points at the `while` inside the `for` and asks why that isn't O(n²).
      What do you say?
    rubric:
      - The `while` only runs from numbers that start a run.
      - Each run is walked once, from its start, so each number is stepped over once by a `while`.
      - With the `for` visiting each number once too, the total work is O(n).
    modelAnswer: >-
      The `while` only starts at a number whose left neighbour is missing, the start of a run.
      Each run is walked once, from its start. So across the whole loop, every number is
      visited once by the `for` and at most once by a `while`. That's about 2n steps: O(n).

recap:
  - Ask about size and odd cases before choosing an approach.
  - State a brute force, name its bottleneck, and match signals to a pattern.
  - Trace examples and edge cases aloud before calling it done.
recall:
  - id: card-first-question
    concept: algo.communicating-solutions
    front: Why ask about the input size before choosing an approach?
    back: >-
      The size decides which complexity is acceptable, and so which approach is worth
      writing.
  - id: card-signal-set
    concept: algo.pattern-recognition
    front: Which signal points at a hash set?
    back: >-
      Unsorted input where the key question is "is this value present?", with a linear time
      target.
  - id: card-run-start
    concept: algo.pattern-recognition
    front: In the longest-run problem, how do you avoid counting a run many times?
    back: >-
      Only start counting from a number whose left neighbour is missing, the start of a run.
  - id: card-before-done
    concept: algo.communicating-solutions
    front: What should you do between writing the code and saying you're done?
    back: >-
      Trace the example and the edge cases through it aloud, and state its time and space
      cost.

references:
  - kind: docs
    title: Set
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set
    note: Constant-time membership, and iteration in insertion order.
    primary: true
    verified: true
  - kind: docs
    title: Array.prototype.sort()
    authors: MDN contributors
    venue: MDN Web Docs
    url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort
    note: Why sorting numbers needs a comparator.
    verified: true

deepDive: >-
  A shape for any coding round. Restate the problem, ask about constraints, and work one
  small example by hand. State a brute force and its cost, then name the bottleneck. Pick
  the pattern that removes it, write clean code, then trace the example and the edge cases. Say each step
  aloud. Silence makes the interviewer guess, and a guess rarely goes your way.


  Signals worth memorising: sorted input suggests two pointers or binary search. A
  contiguous range suggests a sliding window. "Fewest steps" suggests BFS. "Best k" suggests
  a heap. Counting or "seen before" suggests a hash map. Repeating subproblems suggest
  dynamic programming.


  For `longestRun`, the set holds every number, so space is O(n). The sort version needs
  O(n) for its copy too, and skips the copy only if changing the input is allowed. That trade-off is
  worth saying out loud: it's exactly what the interviewer hopes to hear.


  Talking while you code is half of this round. The lesson Live-coding communication, in the
  interview chapter, practises what to say at each stage.
