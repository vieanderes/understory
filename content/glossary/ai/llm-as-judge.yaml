term: LLM-as-judge
aka:
  - LLM judge
  - model grader
short: A second model grading outputs against a rubric, used where a rule in code can't decide.
explain: |
  Some answers can't be checked with an exact match. Is this summary faithful? Is this reply
  polite? A second model, given a clear rubric, can grade thousands of them.

  But the grader has biases: it prefers longer answers, the first one shown, and text in its
  own style. Trust it only after its grades agree with people's grades on a labelled sample
  it wasn't tuned on. Ask for a pass or fail per criterion, not a score out of ten.
analogy: A teaching assistant marking essays. Useful at scale, but you spot-check their marking before you trust the grades.
usage: The LLM-as-judge passes every long answer, so check it against human labels before we rely on it.
related:
