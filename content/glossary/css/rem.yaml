term: rem
aka:
  - root em
short: A length unit that's a multiple of the font size set on the page's root element.
explain: |
  Someone with weak eyesight sets their browser's text larger. If you sized everything in
  pixels, your page ignores them. Sizes need to follow that setting.

  `1rem` is the font size of `<html>`, usually 16 pixels unless the reader changed it.
  It always looks at the root, so `2rem` means the same everywhere on the page. That makes it the steady choice for font sizes, spacing and media queries.
analogy: Measuring in "pages of this book". If the printer picks a bigger page size, everything scales together.
example:
  language: css
  code: |
    h1     { font-size: 2rem; }      /* 32px by default */
    .card  { padding: 1.5rem; }      /* 24px by default */
    @media (min-width: 48rem) { }    /* follows zoom too */
usage: Use rem for the heading so it grows when someone raises their browser's text size.
twin:
  term: em
  difference: A rem always measures from the root, so it means the same size anywhere on the page. An em measures from the current element's font size, so it compounds when you nest elements.
related:
  - em
  - responsive-design
level: 2
lessons:
  - css.responsive-design
