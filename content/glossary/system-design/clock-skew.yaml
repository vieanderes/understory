term: clock skew
aka: [clock drift, skewed clocks]
short: The difference between the times two machines believe it is, which can be seconds or more.
explain: |
  Every computer keeps its own clock, and no two agree exactly. Yours may say 12:00:00
  while the vendor's says 11:59:57.

  That matters whenever you compare times from different machines. A delta sync asking for
  changes since your 12:00 may miss records the vendor stamped 11:59:58. A token may look
  valid to you and expired to the server. Leave margins: reach back a few minutes, refresh
  tokens early.
analogy: Two friends agreeing to meet at noon with watches three minutes apart.
usage: Clock skew between us and the vendor lost records, so overlap each delta by five minutes.
related: [delta-sync, watermark, access-token]
level: 3
lessons: [integrations.full-and-delta-sync, integrations.tokens-that-expire]
