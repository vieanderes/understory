id: algo.approach
title: Approaching a problem
objective: Ask about constraints, work a small example, state a brute force, then improve it and test the edges while saying the complexity aloud.
level: essential
minutes: 10
concepts: [algo.constraints-first, algo.brute-force-first, algo.edge-cases]
prerequisites: [cs.complexity]
opening:
  text: >-
    You'll get a method that works on any coding-round problem, even one you've never seen.
    Interviewers score how you think as much as the code you end with.

steps:
  - type: prose
    id: the-method
    body: |-
      A **coding round** is a live interview or a timed online test where you solve a
      problem in code. The same six moves work every time:

      1. Ask about the input: size, empty, negatives, duplicates.
      2. Work one small example by hand.
      3. Say the brute force and its cost.
      4. Name its bottleneck and remove it.
      5. Code it, saying what you're doing.
      6. Test the edges.

  - type: multiple-choice
    id: pick-first-move
    concept: algo.constraints-first
    difficulty: 1
    question: The interviewer reads out a problem. What do you do first?
    choices:
      - text: Ask how large the input can get
        correct: true
        feedback: >-
          Yes. The size decides which approach is fast enough.
      - text: Start typing the obvious loop
        feedback: >-
          Tempting under pressure. But you might build the wrong thing, fast.
      - text: Name the cleverest algorithm you know
        feedback: >-
          Without the constraints, you can't know which one fits.
      - text: Write the function signature and stop
        feedback: >-
          A signature helps later. First make sure you know what the input looks like.

  - type: prose
    id: constraints-first
    body: |-
      Before any code, ask about the input. How big can it get? Can it be empty? Negative
      numbers? Duplicates?

      The size decides what's fast enough. Roughly: up to 1,000 items, O(n²) is fine. Up to
      a million, you need O(n log n) or O(n). This is **constraints first**: the answer picks
      your approach.

  - type: prose
    id: worked-problem
    body: |-
      Here's a problem: a fitness app shows your longest run of days that hit the step goal.

      By hand first. With a goal of 10,000 and days `[12000, 9000, 11000, 13000, 10500]`,
      the runs are 1 day, then 3 days. The answer is 3.

      The **brute force**: from each day, count forward while the goal is met, and keep the
      longest.

  - type: parsons
    id: arrange-brute-force
    concept: algo.brute-force-first
    difficulty: 2
    language: js
    prompt: >-
      Arrange the brute force: from each start day, count forward while the goal is met.
    blocks:
      - id: open
        code: function longestStreak(steps, goal) {
      - id: best
        code: let best = 0;
        indent: 1
      - id: each-start
        code: for (let start = 0; start < steps.length; start++) {
        indent: 1
        subgoal: Try every start day
      - id: length
        code: let length = 0;
        indent: 2
      - id: count-forward
        code: while (start + length < steps.length && steps[start + length] >= goal) {
        indent: 2
        subgoal: Count forward while the goal is met
      - id: grow
        code: length++;
        indent: 3
      - id: close-while
        code: '}'
        indent: 2
      - id: keep-best
        code: best = Math.max(best, length);
        indent: 2
      - id: close-for
        code: '}'
        indent: 1
      - id: return-best
        code: return best;
        indent: 1
      - id: close
        code: '}'
    distractors:
      - id: strictly-above
        code: while (start + length < steps.length && steps[start + length] > goal) {
        feedback: >-
          `>` skips days that hit the goal exactly. "Hit the goal" means at least the goal.
      - id: overwrite-best
        code: best = length;
        feedback: >-
          That keeps the last run, not the longest. A short run at the end would win.

  - type: multiple-choice
    id: pick-too-slow
    concept: algo.constraints-first
    difficulty: 2
    question: There can be 200,000 days, all on target. Is the brute force fast enough?
    choices:
      - text: No, it's about 20 billion steps
        correct: true
        feedback: >-
          Right. Each start counts to the end: roughly n² over 2.
      - text: Yes, loops are fast in JavaScript
        feedback: >-
          Fast per step, yes. But 20 billion steps still takes a long time, not milliseconds.
      - text: Yes, the inner loop stops early
        feedback: >-
          It stops at a missed day. When every day hits the goal, it never stops early.

  - type: prose
    id: brute-force-then-better
    body: |-
      Now name the **bottleneck**: each start day recounts days that the run before it
      already counted.

      So carry the count instead. Walk the days once. On a good day, the current run grows
      by one. On a missed day, it drops to zero. Keep the best you've seen. One pass, O(n).

  - type: code-challenge
    id: write-longest-streak
    concept: algo.brute-force-first
    difficulty: 3
    language: js
    starter: starter.js
    solution: solution.js
    tests: tests.js
    twin:
      language: python
      starter: streak.starter.py
      solution: streak.solution.py
      tests: streak.tests.py
    prompt: >-
      Write `longestStreak(steps, goal)`: the longest run of consecutive days with at least
      `goal` steps.


      `longestStreak([12000, 9000, 11000, 13000, 10500], 10000)` is `3`.


      **Target:** O(n) for up to 200,000 days. The tests include no days, no good days, a
      run that reaches the last day, and a full-size run. The brute force runs out of time.
    hints:
      - What does the brute force recount, again and again?
      - Carry the length of the current run. A missed day resets it to 0.
      - 'Loop once. Set `current = count >= goal ? current + 1 : 0`, then update `best`.'

  - type: ai-review
    id: review-streak-at-end
    concept: algo.edge-cases
    difficulty: 3
    language: js
    request: Write longestStreak(steps, goal) in one pass.
    flawClass: edge-case
    code: |
      function longestStreak(steps, goal) {
        let best = 0;
        let current = 0;
        for (const count of steps) {
          if (count >= goal) {
            current++;
          } else {
            best = Math.max(best, current);
            current = 0;
          }
        }
        return best;
      }
    prompt: >-
      A teammate's assistant wrote this. `[12000, 9000, 11000]` passed. A user who hit the
      goal every day this week sees a streak of 0. Tap the line at fault.
    lines: [12]
    reasons:
      - text: A run that reaches the last day is never counted
        correct: true
        feedback: >-
          Yes. `best` only updates on a missed day. Return `Math.max(best, current)`.
      - text: '`current++` should come after the check'
        feedback: >-
          The order inside the `if` is fine. The trouble is what happens after the loop.
      - text: '`>=` should be `>`'
        feedback: >-
          Hitting the goal exactly counts. That's not why a full week shows 0.
    fix: |
      return Math.max(best, current);

  - type: explain-back
    id: explain-brute-force-first
    concept: algo.brute-force-first
    difficulty: 3
    prompt: >-
      You already see the one-pass answer. Why is it still worth saying the brute force out
      loud first?
    rubric:
      - It gives a correct baseline and shows you understood the problem.
      - Naming its bottleneck explains where the faster idea comes from.
      - It can test the fast version, since both must agree.
    modelAnswer: >-
      The brute force proves I understood the problem, and it's correct, so there's always
      something working. Naming its bottleneck, recounting the same days, shows why the
      faster version exists. I can also check the fast version against it on small inputs.

recap:
  - Ask about size, empty input and odd values before choosing an approach.
  - State a brute force, name its bottleneck, then remove it.
  - Test the edges, like a run that reaches the last item.
recall:
  - id: card-constraints
    concept: algo.constraints-first
    front: Why ask how large the input can be before writing code?
    back: >-
      The size decides which complexity is fast enough. Up to about 1,000 items, O(n²) is
      fine. At a million, it isn't.
  - id: card-bottleneck
    concept: algo.brute-force-first
    front: What do you say right after stating a brute force?
    back: >-
      Its complexity and its bottleneck, the repeated work that a better idea can remove.
  - id: card-streak-end
    concept: algo.edge-cases
    front: In a one-pass "longest run" loop, what must you check after the loop ends?
    back: >-
      The run still in progress. If it reaches the last item, no reset ever recorded it.
  - id: card-edge-cases
    concept: algo.edge-cases
    front: Name four edge cases to check for a function over a list.
    back: >-
      An empty list, one item, all items equal or repeated, and the largest allowed size.
      Negative values too, when they're allowed.

