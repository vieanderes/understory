term: design doc
aka:
  - design document
  - one-pager
short: A short document proposing how to build something, written before coding so others can challenge it.
explain: |
  An hour of reading saves a week of building the wrong thing. A design doc states the
  problem, the goals and non-goals, the proposed approach, the alternatives you rejected, and
  the risks.

  One page beats ten. Lead with the decision you need from readers. The best feedback comes
  while changing course still costs only an edit.
analogy: An architect's sketch before the builders arrive. Moving a wall on paper costs an eraser.
usage: Before anyone starts on sync, write a design doc and get the mobile team to read it.
twin:
  term: adr
  difference: A design doc proposes a whole piece of work and asks for feedback before it starts. An ADR records a single decision after it's made.
related:
  - adr
  - non-goal
  - scope-creep
  - pre-mortem
level: 1
lessons:
