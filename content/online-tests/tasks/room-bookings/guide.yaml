approach: >-
  Sorting by end minute and taking each request that starts after the last accepted one
  ends is the right greedy idea. The bug is the starting value of lastEnd: it begins at 0,
  so a first request that starts at minute 0 looks like a clash with nothing. Starting
  lastEnd below every possible minute, at −1, fixes it.
complexity: O(N log N) time, O(N) extra space
steps:
  - kind: read
    title: Read the rules and the constraints
    minutes: 1
    body: |-
      You may change **at most one line**, and only correctness is scored. The statement
      even tells you the algorithm is meant to be greedy by end minute, so trust the idea and
      hunt for the slip.

      Note the ranges: a minute can be **0**, and both ends are included.
  - kind: explain
    title: Say what the function should return
    minutes: 1
    body: |-
      One sentence: the most requests you can accept with no two sharing a minute. Keep it on
      paper, not in the file. An added comment counts as a changed line.
  - kind: read
    title: Read the code line by line
    minutes: 2
    body: |-
      The sort and the loop match the description. Now look at what each variable holds
      **before** the loop starts. `lastEnd` stands for "the last minute already taken". What
      should it be when nothing is taken yet?
  - kind: edge-cases
    title: List the cases at the edges of the range
    minutes: 2
    body: |-
      Pick cases that test the smallest minute and the shared-minute rule:

      - one request starting at minute 0;
      - two one-minute requests at minutes 0 and 1;
      - two requests that share exactly one minute;
      - two requests that just miss each other;
      - one long request covering two short ones.
    input:
      - "[[0, 3]]"
      - "[[0, 0], [1, 1]]"
      - "[[1, 2], [2, 3]]"
      - "[[1, 2], [3, 4]]"
      - "[[0, 9], [1, 2], [3, 4]]"
  - kind: run
    title: Run the buggy code to see it fail
    minutes: 1
    body: |-
      Press **Run code** before changing anything. The examples all pass, which is how this
      bug got through. Your own cases are what catch it.
    expect: >-
      Three OKs for the examples. Your first case returns 0 instead of 1 and your second
      returns 1 instead of 2. The rest pass.
  - kind: plan
    title: Name the bug from the pattern
    minutes: 2
    body: |-
      Both failures involve a request starting at minute 0. With `lastEnd = 0`, the test
      `start > lastEnd` is false for it, as if minute 0 were already booked. Nothing is
      booked at the start, so `lastEnd` must begin below every minute: −1.
  - kind: ask-ai
    title: Check the reasoning with a narrow question
    minutes: 1
    body: |-
      Ask about one behaviour, not for the fix. It confirms your reading and shows the
      reviewer you found the bug.
    prompt: >-
      Without changing any code: can this function ever accept a request that starts at
      minute 0? One sentence.
    expect: The assistant says no, because 0 > 0 is false.
  - kind: write
    title: Change the starting value and nothing else
    minutes: 1
    body: |-
      Only the line that sets `lastEnd` before the loop changes. Add no comments and do not
      touch the sort: the checker counts every changed line.
    code:
      ts: |-
        function solution(B: number[][]): number {
            const byEnd = B.slice().sort((x, y) => x[1] - y[1]);
            let accepted = 0;
            let lastEnd = -1;
            for (let i = 0; i < byEnd.length; i++) {
                if (byEnd[i][0] > lastEnd) {
                    accepted += 1;
                    lastEnd = byEnd[i][1];
                }
            }
            return accepted;
        }
      python: |-
        def solution(B):
            by_end = sorted(B, key=lambda booking: booking[1])
            accepted = 0
            last_end = -1
            for start, end in by_end:
                if start > last_end:
                    accepted += 1
                    last_end = end
            return accepted
    codeMode: full
  - kind: run
    title: Run everything again
    minutes: 1
    body: |-
      Press **Run code** and check each returned value against the rule, not the old output.
    expect: Three OKs, then 1, 2, 1, 2 and 2 for your five cases.
  - kind: ai-writes
    title: Let the assistant suggest more inputs
    minutes: 1
    body: |-
      Varied inputs are a fair job for the assistant. You still decide each right answer, so
      ask for inputs only.
    prompt: >-
      Give me 4 more test inputs for this function, one per line, in the format
      [[1, 4], [3, 5]]. Include unsorted requests, identical requests and a request of a
      single minute. Inputs only, no answers and no code.
    expect: Four lines for test-input.txt, and each result matches what you work out.
  - kind: review
    title: Ask for a problem list
    minutes: 1
    body: |-
      Ask for any remaining problems without a rewrite. The one-line limit still applies to
      anything it suggests.
    prompt: >-
      Review this function for correctness only. List any remaining problems in one line
      each. Do not rewrite the code.
    expect: No problems.
  - kind: submit
    title: Check the diff and submit
    minutes: 1
    body: |-
      Confirm exactly one line differs from the original and there is no debug output. Then
      submit.
