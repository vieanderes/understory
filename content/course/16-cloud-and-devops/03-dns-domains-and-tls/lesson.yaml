id: cloud.dns-and-tls
title: DNS, domains and TLS
objective: Point a domain at a server with DNS records, plan a move around the TTL, and get a certificate that covers every name.
level: essential
minutes: 10
concepts: [cloud.dns-records, cloud.dns-ttl, cloud.tls-certificates]
prerequisites: [cloud.linux-server, backend.how-a-page-reaches-you]
opening:
  text: >-
    You'll point a domain at your server and give it the padlock. You'll also move a site
    without leaving your users on a dead one.

steps:
  - type: prose
    id: what-dns-is
    body: |-
      You met this hop in the backend chapter. **DNS** turns a name into an address. A **resolver**, usually run by your network, asks on your behalf and keeps the answer for a while. `dig` asks and prints the reply:

      ```bash
      $ dig +noall +answer example.com
      example.com.  151  IN  A  172.66.147.243
      example.com.  151  IN  A  104.20.23.154
      ```

      Name, a number we'll come back to, then the record type and the address.

  - type: prose
    id: name-the-records
    body: |-
      DNS is a table of **records**, each with a type. `A` maps a name to an IPv4 address, `AAAA` to an IPv6 one. `CNAME` says "this name is another name", and the lookup carries on:

      ```bash
      $ dig +noall +answer www.github.com
      www.github.com.  2552  IN  CNAME  github.com.
      github.com.      43    IN  A      140.82.121.3
      ```

      `MX` names the servers that take the domain's mail. `TXT` holds free text.

  - type: multiple-choice
    id: pick-address-record
    concept: cloud.dns-records
    difficulty: 1
    language: bash
    code: |
      $ dig +noall +answer www.iana.org
      www.iana.org.                     2396  IN  CNAME  www.iana.org.cdn.cloudflare.net.
      www.iana.org.cdn.cloudflare.net.  122   IN  A      104.18.24.232
    question: Which record holds the address the browser connects to?
    choices:
      - text: The `CNAME` record
        feedback: >-
          That one points a name at another name. The lookup carries on to find an address.
      - text: The `A` record
        correct: true
        feedback: >-
          Right. It maps a name to an IPv4 address. The chain ends there.
      - text: Neither, DNS only returns names
        feedback: >-
          Addresses are DNS's main job. `104.18.24.232` is one, on the second line.

  - type: multiple-choice
    id: pick-verification-record
    concept: cloud.dns-records
    difficulty: 2
    language: bash
    code: |
      $ dig +noall +answer example.com TXT
      example.com.  273  IN  TXT  "v=spf1 -all"
      example.com.  273  IN  TXT  "_k2n1y4vw3qtb4skdx9e7dxt97qrmmq9"
    question: An email service asks you to prove you own your domain. Which record will it ask for?
    choices:
      - text: An `A` record, pointing at the service
        feedback: >-
          That would send your visitors to them. Proving ownership shouldn't move any traffic.
      - text: A `TXT` record with a code it gives you
        correct: true
        feedback: >-
          Right. Only the owner can publish it. The second line above looks like one.
      - text: An `MX` record
        feedback: >-
          `MX` says where mail is delivered. You may add one later, but it proves nothing.

  - type: prose
    id: name-ttl-and-propagation
    body: |-
      That number is the **TTL**: how many seconds a resolver may keep the record. We asked 1.1.1.1 twice, five seconds apart:

      ```bash
      example.com.  217  IN  A  104.20.23.154
      example.com.  212  IN  A  104.20.23.154
      ```

      Until it hits zero, the resolver answers from its copy and never sees your change. So nothing "propagates": thousands of copies expire, each on its own clock.

  - type: ai-review
    id: review-long-ttl-move
    concept: cloud.dns-ttl
    difficulty: 3
    language: yaml
    request: Write tonight's runbook for moving notes.example to the new server.
    flawClass: edge-case
    code: |
      # the record today: notes.example  86400  IN  A  198.51.100.7
      - step: point the A record at the new server
        record: { name: notes.example, type: A, value: 203.0.113.20, ttl: 300 }
      - step: check the site loads from the office
      - step: switch off the old server
        wait: 5 minutes
    prompt: >-
      An assistant wrote this. The office check passed, since its resolver had no cached copy.
      Next morning, some users got a dead site until the evening. Tap the line at fault.
    lines: [6]
    reasons:
      - text: The new record's TTL of 300 is too short
        feedback: >-
          A short TTL is the right choice around a move. It only governs copies fetched from
          now on.
      - text: Copies cached under the old TTL last a day
        correct: true
        feedback: >-
          Yes. 86400 seconds is 24 hours. Keep the old server up that long.
      - text: The record should be a `CNAME`
        feedback: >-
          The bare domain can't be a `CNAME`, and the type isn't the trouble. The timing is.
    fix: |
      # a day before: lower the TTL, and let the old one run out
      - step: set ttl to 300 on the existing record
        wait: 24 hours
      - step: point the A record at the new server
      - step: switch off the old server
        wait: 1 hour

  - type: prose
    id: name-certificates-and-acme
    body: >-
      HTTPS needs a **certificate**: a file listing domain names and a public key, signed
      by an authority browsers trust. The names sit in the Subject Alternative Name field.
      A client checks the signer, the dates, and that the host is listed.


      **ACME** gets you one for free. Your server proves it controls the domain, and the
      authority signs. Lesson 7 shows a proxy that does it for you.

  - type: bug-hunt
    id: hunt-missing-name
    concept: cloud.tls-certificates
    difficulty: 3
    language: bash
    code: |
      $ openssl x509 -noout -ext subjectAltName -in notes.pem
      X509v3 Subject Alternative Name:
          DNS:notes.test

      $ curl https://notes.test/
      ok
      $ curl https://www.notes.test/
      curl: (60) SSL: no alternative certificate subject name matches target host name 'www.notes.test'
    prompt: >-
      The same server answers both names. One works and one fails. Tap the line that explains
      why.
    lines: [3]
    reasons:
      - text: The certificate lists only `notes.test`, not `www.notes.test`
        correct: true
        feedback: >-
          Yes. Ask for a certificate that names both.
      - text: '`www.notes.test` has no DNS record'
        feedback: >-
          Then curl couldn't connect at all. It connected, read the certificate, then refused it.
      - text: The certificate has expired
        feedback: >-
          The same certificate works for `notes.test`, so its dates are fine. Only the name fails.
    fix: |
      X509v3 Subject Alternative Name:
          DNS:notes.test, DNS:www.notes.test

  - type: code-challenge
    id: write-covers-name
    concept: cloud.tls-certificates
    difficulty: 4
    language: ts
    prompt: >-
      Write `coversName(names, host)`. `names` are the DNS names on a certificate. Return
      `true` when one of them covers `host`. Ignore letter case.


      An exact match counts. A name like `*.example.com` is a wildcard. Its star stands for
      exactly one label, so it covers `www.example.com`. It doesn't cover `example.com` or
      `a.b.example.com`.


      So `coversName(['notes.test'], 'www.notes.test')` is `false`.
    hints:
      - Handle the exact match first. Then look at names that start with `*.`.
      - For a wildcard, the host must end with the part after the star.
      - 'Whatever is left in front must be non-empty and hold no dot. Start with `name.slice(1)`.'

  - type: explain-back
    id: explain-old-server
    concept: cloud.dns-ttl
    difficulty: 4
    prompt: >-
      You changed an A record an hour ago, and your own browser reaches the new server. Why do
      some users still land on the old one?
    rubric:
      - Resolvers cache a record for its TTL and answer from that copy without asking again.
      - Each resolver fetched its copy at a different moment, so the copies expire at different times.
      - Until a user's resolver lets its old copy expire, that user keeps getting the old address.
    modelAnswer: >-
      Nothing pushes a DNS change out. Each resolver keeps the copy it fetched, for as long as
      the TTL allowed. Mine had no copy, or an expired one, so it asked and got the new
      address. A user's resolver may have fetched the old record minutes before my change. If
      the TTL was a day, it can keep answering with the old address for most of a day. So I'd
      lower the TTL well before a move. And I'd keep the old server up until the old TTL
      has run out.

recap:
  - Read and set `A`, `CNAME`, `MX` and `TXT` records, and check them with `dig`.
  - Plan a move around the TTL, since cached copies expire one by one.
  - Get a certificate that names every host you serve, and let ACME renew it.

recall:
  - id: card-a-vs-cname
    concept: cloud.dns-records
    front: How do an `A` record and a `CNAME` record differ?
    back: >-
      An `A` record maps a name to an IPv4 address. A `CNAME` maps a name to another name, and
      the lookup carries on from there.
  - id: card-ttl
    concept: cloud.dns-ttl
    front: Why doesn't a DNS change reach everyone at once?
    back: >-
      Resolvers cache each record for its TTL. Every cached copy has to expire before that
      resolver asks again.
  - id: card-before-a-move
    concept: cloud.dns-ttl
    front: What do you do to the TTL before moving a site to a new server?
    back: >-
      Lower it, then wait for the old TTL to pass. After the move, keep the old server up for
      at least that long.
  - id: card-certificate-checks
    concept: cloud.tls-certificates
    front: What three things does a client check on a TLS certificate?
    back: >-
      That a trusted authority signed it, that today falls inside its dates, and that one of
      its names matches the host.

