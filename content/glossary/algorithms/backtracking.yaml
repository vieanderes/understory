term: backtracking
aka: [backtrack, choose explore undo, pruning]
short: Building an answer one choice at a time, exploring each, and undoing it to try the next.
explain: |
  "List every way to pick 3 toppings from 8." Make one choice, then the next from what's left. When a branch is complete, or hopeless, step back one choice and
  try another.

  Each step is choose, explore, undo. The undo lets one list be reused instead of copied.
  The number of answers is often exponential, so the cost is too.

  What keeps it usable is pruning: stop a branch the moment it can't lead to a valid
  answer. Sudoku solvers, N-queens and word searches all run on it.
analogy: Trying keys on a ring. Try one, and if the lock won't turn, take it out and try the next.
example:
  language: js
  code: |
    function subsets(items) {
      const out = [], picked = [];
      function explore(i) {
        if (i === items.length) return out.push([...picked]);
        picked.push(items[i]);  // choose
        explore(i + 1);         // explore
        picked.pop();           // undo
        explore(i + 1);         // explore without it
      }
      explore(0);
      return out;
    }
usage: Add pruning to the backtracking, so once the running sum passes the target, you return early.
related: [recursion, depth-first-search, dynamic-programming, brute-force]
level: 2
lessons: [algo.backtracking]
