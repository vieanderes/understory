approach: >-
  A waiter with step k serves exactly the seats that are multiples of g = gcd(N, k), so
  only the distinct values of g matter. Group the seats by d = gcd(seat, N): d is always a
  divisor of N, and exactly phi(N / d) seats share it. A group is served when some g
  divides d. Summing phi(N / d) over the served divisors counts seats without visiting
  them, and N has at most a few thousand divisors.
complexity: O(M log N + sqrt(N) + D · (G + P)), where D is the number of divisors of N
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 3
    body: |-
      Scroll to the bottom first. **N reaches 1,000,000,000**. That rules out an array of
      seats and even a single loop over every seat. The answer has to come from the numbers
      themselves.

      Now read the story. Each waiter walks in fixed steps round a circle until a repeat.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Say what is counted, not how the waiters move. If you can say it without the circle,
      you are close to the maths already.
    code:
      ts: |-
        // Count the seats in 0..N-1 reached by starting at 0 and adding some K[J], modulo N.
      python: |-
        # Count the seats in 0..N-1 reached by starting at 0 and adding some K[J], modulo N.
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - one seat, where the answer is always 1;
      - a step that is a multiple of N, so the waiter never leaves seat 0;
      - several waiters whose seats overlap, which must be counted once;
      - a step larger than N that is not a multiple of it.
    input:
      - "(1, [5])"
      - "(1000, [3000])"
      - "(30, [6, 10, 15])"
      - "(9, [6])"
      - "(12, [20])"
  - kind: ask-ai
    title: Check the number fact you are relying on
    minutes: 2
    body: |-
      The whole task rests on one fact about steps on a circle. Ask the assistant to
      confirm it, not to apply it. A wrong assumption here would cost you the rest of the
      test, and the question shows you know where the idea comes from.
    prompt: >-
      A pointer starts at 0 and repeatedly adds k modulo N. Is the set of positions it
      reaches exactly the multiples of gcd(N, k)? Yes or no, with one sentence of why.
      Do not solve anything else.
    expect: Yes. So each waiter is really just a divisor g of N.
  - kind: plan
    title: Plan a correct version on seats first
    minutes: 3
    body: |-
      Turn every step into g = gcd(N, k) and drop duplicates. Then a seat x is served when
      some g divides x.

      Looping over all N seats is O(N · G). It passes the small correctness tests, but the
      performance tests have N near a billion. Bank it anyway: it is also your checker.
  - kind: write
    title: Write the seat loop yourself
    minutes: 5
    body: |-
      Type it yourself: gcd is three lines, and you should know it by heart. This version
      is slow on purpose. Your later fast version must agree with it on every small case.
    code:
      ts: |-
        // Count the seats in 0..N-1 reached by starting at 0 and adding some K[J], modulo N.
        // A waiter with step k serves the multiples of gcd(N, k). Seat loop: O(N * G), slow.
        function solution(N: number, K: number[]): number {
            const gcd = (a: number, b: number): number => {
                while (b !== 0) [a, b] = [b, a % b];
                return a;
            };
            const steps = [...new Set(K.map((k) => gcd(N, k)))];
            let served = 0;
            for (let x = 0; x < N; x++) {
                if (steps.some((g) => x % g === 0)) served++;
            }
            return served;
        }
      python: |-
        # Count the seats in 0..N-1 reached by starting at 0 and adding some K[J], modulo N.
        # A waiter with step k serves the multiples of gcd(N, k). Seat loop: O(N * G), slow.
        from math import gcd


        def solution(N, K):
            steps = list({gcd(N, k) for k in K})
            served = 0
            for x in range(N):
                if any(x % g == 0 for g in steps):
                    served += 1
            return served
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. All three examples must say OK. Keep these results: they are the
      reference for the fast version.
    expect: >-
      Three OKs, then 1, 1, 8, 3 and 3 for your five cases.
  - kind: plan
    title: Count groups of seats, not seats
    minutes: 4
    body: |-
      Whether seat x is served depends only on d = gcd(x, N), and d is a divisor of N.
      Exactly **phi(N / d)** seats share each d, where phi is Euler's totient.

      So loop over the divisors of N instead of the seats. For each d that some g divides,
      add phi(N / d). A billion has only 100 divisors, so this is fast.
  - kind: ai-writes
    title: Let the assistant write the totient helper
    minutes: 3
    body: |-
      Factorising N and computing phi is a standard helper, a fair thing to delegate. Keep
      the divisor loop and the served check for yourself: that is the idea being tested.
      Check the helper before you trust it.
    prompt: >-
      In TypeScript and in Python, write only a helper that finds the distinct prime
      factors of N by trial division up to sqrt(N), and a function phi(m) that uses those
      primes to return Euler's totient of any divisor m of N. No other code.
    expect: >-
      For N = 12, phi(12) returns 4, phi(6) returns 2 and phi(1) returns 1. Print them once,
      then remove the prints.
  - kind: optimise
    title: Loop over the divisors of N
    minutes: 5
    body: |-
      Pair each divisor i up to sqrt(N) with N / i, and take care not to count a square
      root twice. Run again: every small case must match the seat loop's results.
    code:
      ts: |-
        // Count the seats in 0..N-1 reached by starting at 0 and adding some K[J], modulo N.
        // Seats are grouped by d = gcd(seat, N); phi(N / d) seats share each divisor d.
        // O(M log N + sqrt(N) + divisors * (steps + primes)) time.
        function solution(N: number, K: number[]): number {
          const gcd = (a: number, b: number): number => {
            while (b !== 0) [a, b] = [b, a % b];
            return a;
          };
          // A waiter with step k serves exactly the multiples of gcd(N, k).
          const steps = [...new Set(K.map((k) => gcd(N, k)))];
          const primes: number[] = [];
          let rest = N;
          for (let p = 2; p * p <= rest; p++) {
            if (rest % p !== 0) continue;
            primes.push(p);
            while (rest % p === 0) rest /= p;
          }
          if (rest > 1) primes.push(rest);
          const phi = (m: number): number => {
            let out = m;
            for (const p of primes) if (m % p === 0) out = (out / p) * (p - 1);
            return out;
          };
          // Seat x has gcd(x, N) = d for exactly phi(N / d) seats, and it is served when some
          // step divides d. Summing over the divisors of N avoids walking all N seats.
          let served = 0;
          for (let i = 1; i * i <= N; i++) {
            if (N % i !== 0) continue;
            const pair = N / i;
            for (const d of i === pair ? [i] : [i, pair]) {
              if (steps.some((g) => d % g === 0)) served += phi(N / d);
            }
          }
          return served;
        }
      python: |-
        # Count the seats in 0..N-1 reached by starting at 0 and adding some K[J], modulo N.
        # Seats are grouped by d = gcd(seat, N); phi(N / d) seats share each divisor d.
        # O(M log N + sqrt(N) + divisors * (steps + primes)) time.
        from math import gcd


        def solution(N, K):
            # A waiter with step k serves exactly the multiples of gcd(N, k).
            steps = list({gcd(N, k) for k in K})
            primes = []
            rest = N
            p = 2
            while p * p <= rest:
                if rest % p == 0:
                    primes.append(p)
                    while rest % p == 0:
                        rest //= p
                p += 1
            if rest > 1:
                primes.append(rest)

            def phi(m):
                out = m
                for q in primes:
                    if m % q == 0:
                        out = out // q * (q - 1)
                return out

            # Seat x has gcd(x, N) = d for exactly phi(N / d) seats, and it is served when some
            # step divides d. Summing over the divisors of N avoids walking all N seats.
            served = 0
            i = 1
            while i * i <= N:
                if N % i == 0:
                    for d in {i, N // i}:
                        if any(d % g == 0 for g in steps):
                            served += phi(N // d)
                i += 1
            return served
    codeMode: full
  - kind: test
    title: Try a huge N by hand
    minutes: 1
    body: |-
      Add one line with N at the maximum. The seat loop would never finish on it; the new
      version should answer at once.
    input:
      - "(1000000000, [640000000, 250000000, 999999999])"
    expect: A returned value within a fraction of a second, and no timeout.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask the assistant to look for the slips this kind of code invites: a square root
      counted twice, or overflow in the totient. Problems only, so the code stays yours.
    prompt: >-
      Review my current solution for correctness, for double counting when N is a perfect
      square, and for integer overflow. List any problems in one line each. Do not rewrite
      the code.
    expect: No problems. Every value stays below N, so plain numbers are safe.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove the phi prints and any other debug output. Check the header comment states the
      idea and the complexity. Then submit.
