term: lease
aka: [time-limited lock]
short: A right to something that ends on its own at a set time unless it's renewed or used.
explain: |
  Some promises last minutes: seats held while a card is charged, a job claimed by one
  worker. You can't keep a database lock open that long. So write the promise down with an
  expiry time, and let it lapse if the holder disappears.

  The catch is that a holder can lose its lease without noticing. A worker pauses for a long garbage collection and the lease expires. Someone else takes
  over, then the first worker wakes up and writes anyway. A lease alone isn't mutual exclusion; pair it with a fencing token.
analogy: A library loan. The book is yours for three weeks, and if you don't renew it, it goes back on the shelf.
example:
  language: sql
  code: |
    UPDATE job_leases
    SET holder = $1, expires_at = now() + interval '5 minutes'
    WHERE job = 'nightly-digest' AND expires_at < now();
usage: Make the checkout hold a lease of ten minutes, and let the sweep return the seats when it lapses.
related: [fencing-token, cron-job, race-condition, invariant]
level: 3
lessons: [scale.overselling, scale.cron]
