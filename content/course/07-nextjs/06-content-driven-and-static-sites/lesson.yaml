deepDive: >-
  **Title templates.** A layout can set `title: { template: '%s | Bakery', default: 'Bakery' }`.
  A page's `title: 'About'` then shows as "About | Bakery", and `title: { absolute: 'Home' }`
  skips the template.


  **`metadataBase`.** A relative Open Graph image is resolved against `metadataBase`. Leave it
  unset and the build falls back to `http://localhost:3000`, which no one else can reach. Set it
  to your real domain.


  **Dynamic pages in an export.** `app/recipes/[slug]/page.tsx` can still be exported if it
  exports `generateStaticParams`, returning every slug to build. A slug missing from that list
  has no file, so it's a 404.


  **Frontmatter.** `@next/mdx` doesn't read the YAML block some posts start with. An MDX file
  can `export const` values instead, or you add a remark plugin.
