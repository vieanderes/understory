term: runtime error
aka: [run-time error, TypeError, ReferenceError]
short: A crash that happens while the program is running, at the first line it can't carry out.
explain: |
  The code reads fine and starts running, then hits a line it can't do. It stops there and
  prints a message with three parts: the kind of error, the place, and what went wrong.

  Two kinds come up most. A `ReferenceError` means a name doesn't exist, often a typo. A
  `TypeError` means the value exists but can't do what you asked, like reading `.title`
  from `undefined`.
analogy: A recipe that reads fine until step four asks for an egg, and the box is empty.
example:
  language: js
  code: |
    const task = undefined;
    console.log("Start"); // prints
    console.log(task.title);
    // TypeError: Cannot read properties of undefined
usage: The page loads, then throws a runtime error when you open an empty basket.
twin:
  term: syntax-error
  difference: A runtime error happens while the program runs, so the lines before it have already run. A syntax error stops everything before the first line, because the code can't be read.
related: [syntax-error, stack-trace, bug, call-stack]
level: 1
lessons: [basics.debugging]
