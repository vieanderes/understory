term: system prompt
aka:
  - system message
  - system instructions
short: Standing instructions sent first on every call, setting the model's job, rules and reply format.
explain: |
  A chat looks like a conversation, but the app resends the whole thing on every call. At
  the top sits a block the user never sees. It says what the model is for, what it may do,
  and the exact shape of its answer.

  It steers behaviour, but it isn't a lock. A user, or a document the model reads, can talk
  the model out of it. Rules that must hold belong in code around the model, not only in the
  system prompt.
analogy: The briefing staff get before the shop opens. Customers never hear it, but it shapes every answer, and a pushy customer can still talk them round.
usage: Move the JSON format into the system prompt so every turn gets it, not only the first.
twin:
  term: prompt
  difference: The system prompt is the standing instructions, the same on every call. The prompt is the whole of what you send, including the system prompt, the history and the user's message.
