term: feature flag
aka:
  - feature toggle
  - flag
short: A switch in running software that turns a piece of behaviour on or off without a new deploy.
explain: |
  The new checkout is merged and deployed, but you're not ready for everyone to see it.
  You'd like to show it to staff first, then five percent of users, then all.

  The code checks a switch before taking the new path. Turning it on is a setting change,
  not a release, and turning it off is the fastest rollback there is. That separates
  **deploying** code from **releasing** a feature. Every flag is a branch in your code,
  so delete it once the rollout is done.
analogy: A light switch on a new room. The wiring is all in; you decide when to flick it on, and you can flick it off in a second.
example:
  language: ts
  code: |
    if (flags.isOn('new-checkout', user)) {
      return renderNewCheckout(cart);
    }
    return renderCheckout(cart);
usage: Ship it behind a feature flag and turn it on for staff first.
twin:
  term: environment-variable
  difference: A feature flag changes behaviour at run time, often per user or percentage. An environment variable is read once at startup and is the same for every request.
related:
  - continuous-delivery
  - trunk-based-development
  - environment-variable
level: 2
lessons:
  - cloud.progressive-delivery
