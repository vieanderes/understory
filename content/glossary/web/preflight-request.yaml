term: preflight request
aka: [preflight, CORS preflight, OPTIONS request]
short: A permission check the browser sends on its own before a cross-origin call, asking if it is allowed.
explain: |
  A page on one site can call an API on another, but the browser is careful. For anything
  beyond a plain GET or a simple form post, it first asks the server for permission. Only
  if the answer says yes does the real request go.

  The question is an `OPTIONS` request naming the method and headers it wants to use. The
  server replies with `Access-Control-Allow-*` headers. A JSON body or an `Authorization`
  header is enough to trigger it. When the server forgets to answer `OPTIONS`, the real
  request never leaves the browser, and the console blames CORS.
analogy: Ringing ahead to ask if you can bring a friend to dinner, before turning up with them.
example:
  language: http
  code: |
    OPTIONS /v1/notes HTTP/1.1
    Origin: https://app.example.com
    Access-Control-Request-Method: PUT
    Access-Control-Request-Headers: content-type

    HTTP/1.1 204 No Content
    Access-Control-Allow-Origin: https://app.example.com
    Access-Control-Allow-Methods: GET, PUT
usage: The preflight request gets a 404 because the router has no OPTIONS handler, so the PUT never happens.
related: [cors, http-method, http-header]
level: 3
lessons: [js.requests-and-responses]
