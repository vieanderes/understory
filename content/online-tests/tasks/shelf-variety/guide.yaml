approach: >-
  There are only four genres, so keep four running counts along the shelf: for each genre,
  how many of the first i books have it. The number of books of that genre between two
  positions is then a difference of two counts. A genre is present when its difference is
  above zero, so every question costs four subtractions.
complexity: O(N + M) time, O(N) extra space
steps:
  - kind: read
    title: Read the assumptions before the story
    minutes: 2
    body: |-
      Scroll to the bottom first. **N up to 100,000 and M up to 50,000**. Scanning the
      segment for every question could cost 5,000,000,000 steps. That times out.

      Then note the small detail that fails many answers: P[K] and Q[K] come **in either
      order**.
  - kind: explain
    title: Restate the task in one line, as a comment
    minutes: 1
    body: |-
      Put it in your own words at the top of the file. Mention the either-order rule, so
      you cannot forget it while coding.
    code:
      ts: |-
        // For each question, count the distinct letters of S between P[K] and Q[K] (either order, inclusive).
      python: |-
        # For each question, count the distinct letters of S between P[K] and Q[K] (either order, inclusive).
    codeMode: snippet
  - kind: edge-cases
    title: List the edge cases before any code
    minutes: 2
    body: |-
      Write down the inputs most likely to break a quick solution:

      - one book and one question;
      - P[K] greater than Q[K];
      - a question on the first book and one on the last book;
      - the whole shelf with a genre that appears only at one end.
    input:
      - '("F", [0], [0])'
      - '("FHPS", [3, 2, 3], [0, 1, 3])'
      - '("HFFFFP", [0, 5, 0], [0, 5, 5])'
      - '("PFFFFFFFFS", [0, 9, 1], [9, 0, 8])'
  - kind: ask-ai
    title: Ask a syntax question you would otherwise look up
    minutes: 1
    body: |-
      A quick syntax check is exactly what the assistant is for. It is narrow and says
      nothing about the algorithm, so the transcript reads well.
    prompt: >-
      In TypeScript, what is the shortest way to create an array of 4 separate Int32Arrays,
      each of length n + 1, without them sharing memory? One line of code only.
    expect: >-
      Something like Array.from({ length: 4 }, () => new Int32Array(n + 1)). Not
      new Array(4).fill(...), which shares one array.
  - kind: write
    title: Bank a correct version first
    minutes: 3
    body: |-
      Write the direct version yourself: order the two ends, then collect the letters of
      the segment in a set. It is O(N · M), too slow for the big tests, but it is correct
      and it earns the correctness points now.
    code:
      ts: |-
        // For each question, count the distinct letters of S between P[K] and Q[K] (either order, inclusive).
        // Direct scan per question: O(N * M), slow.
        function solution(S: string, P: number[], Q: number[]): number[] {
            return P.map((p, k) => {
                const from = Math.min(p, Q[k]);
                const to = Math.max(p, Q[k]);
                return new Set(S.slice(from, to + 1)).size;
            });
        }
      python: |-
        # For each question, count the distinct letters of S between P[K] and Q[K] (either order, inclusive).
        # Direct scan per question: O(N * M), slow.
        def solution(S, P, Q):
            out = []
            for p, q in zip(P, Q):
                lo, hi = min(p, q), max(p, q)
                out.append(len(set(S[lo:hi + 1])))
            return out
    codeMode: full
  - kind: run
    title: Run the examples and your cases
    minutes: 1
    body: |-
      Press **Run code**. Both examples must say OK. Then read each "Returned value" for
      your cases against the shelf, one question at a time.
    expect: >-
      Two OKs, then [1], [4, 2, 1], [1, 1, 3] and [3, 3, 1].
  - kind: plan
    title: Precompute so each question is instant
    minutes: 3
    body: |-
      The slow part is rescanning the shelf for every question. Build **prefix counts**
      once instead: seen[g][i] is how many of the first i books have genre g.

      Books of genre g from a to b is seen[g][b + 1] minus seen[g][a]. Above zero means
      the genre is there. Four genres, so four subtractions per question.
  - kind: optimise
    title: Write the prefix counts yourself
    minutes: 5
    body: |-
      Type this part yourself: the off-by-one in b + 1 is where the marks are. Your edge
      cases on the first and last book will catch a slip.
    code:
      ts: |-
        // For each question, count the distinct letters of S between P[K] and Q[K] (either order, inclusive).
        // Four prefix counts, one per genre, make each question O(1): O(N + M) time.
        function solution(S: string, P: number[], Q: number[]): number[] {
          // One running count per genre: seen[g][i] is how many of the first i books have genre g,
          // so any segment's count of g is a difference of two entries. O(N + M).
          const genres = 'FHPS';
          const n = S.length;
          const seen = Array.from({ length: 4 }, () => new Int32Array(n + 1));
          for (let i = 0; i < n; i++) {
            const g = genres.indexOf(S[i]!);
            for (let k = 0; k < 4; k++) seen[k]![i + 1] = seen[k]![i]! + (k === g ? 1 : 0);
          }
          return P.map((p, i) => {
            const from = Math.min(p, Q[i]!);
            const to = Math.max(p, Q[i]!);
            let kinds = 0;
            for (let k = 0; k < 4; k++) if (seen[k]![to + 1]! > seen[k]![from]!) kinds++;
            return kinds;
          });
        }
      python: |-
        # For each question, count the distinct letters of S between P[K] and Q[K] (either order, inclusive).
        # Four prefix counts, one per genre, make each question O(1): O(N + M) time.
        def solution(S, P, Q):
            # One running count per genre: seen[g][i] is how many of the first i books have genre g,
            # so any segment's count of g is a difference of two entries. O(N + M).
            seen = []
            for genre in 'FHPS':
                counts = [0] * (len(S) + 1)
                running = 0
                for i, book in enumerate(S):
                    if book == genre:
                        running += 1
                    counts[i + 1] = running
                seen.append(counts)
            out = []
            for p, q in zip(P, Q):
                lo, hi = (p, q) if p <= q else (q, p)
                out.append(sum(1 for counts in seen if counts[hi + 1] > counts[lo]))
            return out
    codeMode: full
  - kind: run
    title: Run again and compare
    minutes: 1
    body: |-
      Run the same cases. Every result must match what the slow version returned. A
      mismatch on the last book means the b + 1 is missing.
    expect: The same four results as before, and both examples OK.
  - kind: ai-writes
    title: Let the assistant write a random test line
    minutes: 2
    body: |-
      A long random shelf is tedious to type and easy to delegate. Ask for the input only.
      Keep the slow version in a scratch file and compare the two answers yourself.
    prompt: >-
      Give me one test input line in the format ("FHPS", [0, 2], [3, 1]) with a random
      30-letter string of F, H, P and S and 8 questions, some with P greater than Q. The
      line only, no answer and no code.
    expect: One line you can paste. The fast and slow versions return the same array.
  - kind: review
    title: Ask for a problem list, not a rewrite
    minutes: 1
    body: |-
      Ask for problems only, so the code stays yours. Off-by-one errors and the reversed
      ends are what a reviewer checks first.
    prompt: >-
      Review my current solution for off-by-one errors, reversed P and Q, and time
      complexity. List any problems in one line each. Do not rewrite the code.
    expect: No problems, and the assistant confirms O(N + M) time.
  - kind: submit
    title: Tidy up and submit
    minutes: 1
    body: |-
      Remove any debug output and the scratch copy of the slow version. Check the header
      comment states the complexity. Then submit.
