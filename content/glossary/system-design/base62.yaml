term: base62
aka: [base 62, base62 encoding]
short: Writing a number with digits and upper- and lower-case letters, 62 symbols in all.
explain: |
  Decimal uses ten symbols. Using 0-9, a-z and A-Z gives 62, so the same number takes far
  fewer characters. Seven characters cover about 3.5 trillion values.

  It's the usual way to turn an id into a short code for a link. The symbols are all safe
  in a URL, unlike base64, which uses `+` and `/`.
analogy: Counting with a bigger set of fingers. More symbols per position means fewer positions.
example:
  language: ts
  code: |
    const ABC = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    function toBase62(n: number): string {
      let out = '';
      do { out = ABC[n % 62] + out; n = Math.floor(n / 62); } while (n > 0);
      return out;
    }
usage: Encode the counter in base62 so the short codes stay at seven characters.
related: [url, hash-collision, birthday-problem]
level: 2
lessons: [sysdesign.case-url-shortener]
