id: agents.memory
title: Memory that helps instead of haunts
objective: Give an agent memory with write policies that dedupe, update and forget, check it for staleness, and guard it against poisoning.
level: advanced
minutes: 10
concepts: [agents.memory-types, agents.memory-write-policies, agents.memory-staleness, agents.memory-poisoning]
prerequisites: [agents.context-at-scale, ai.agents, ai.injection-and-leakage]
opening:
  text: >-
    You'll build agent memory that remembers the right things, for the right person, and
    checks before it trusts itself. Bad memory is worse than none, because it's confidently wrong.

steps:
  - type: prose
    id: kinds-of-memory
    body: |-
      Inside one run, memory is the context: **short-term memory**. Across runs, it's a store
      your code writes and reads: **long-term memory**, as the Agents lesson put it.

      Long-term memory comes in three kinds. **Episodic**: what happened ("Tuesday's order
      arrived late"). **Semantic**: facts ("Sam is vegetarian"). **Procedural**: how to do
      something ("ask before swapping a brand").

  - type: multiple-choice
    id: pick-memory-kind
    concept: agents.memory-types
    difficulty: 1
    question: A recipe app's shopping agent stores "for this customer, always ask before swapping brands". Which kind?
    choices:
      - text: Procedural
        correct: true
        feedback: >-
          Yes. It's a rule for how to act, not a fact or an event.
      - text: Semantic
        feedback: >-
          Close. A semantic memory states a fact. This one tells the agent how to behave.
      - text: Episodic
        feedback: >-
          An episode records something that happened once. This applies to every order.
      - text: Short-term
        feedback: >-
          It must outlive this chat, so it lives in the long-term store.

  - type: prose
    id: name-write-policies
    body: |-
      Memory lives in files the agent reads and edits, or in a vector store searched by
      meaning. People can read and audit files. Vectors scale to many thousands of entries.

      Either way, writes need a **write policy**. Store one fact per entry. Merge duplicates.
      Update a fact that changed instead of adding a rival. Forget what has expired.

  - type: predict-output
    id: predict-planted-memory
    concept: agents.memory-poisoning
    difficulty: 2
    language: text
    code: |
      /memories/preferences.md
      - vegetarian                         (from: user, 2 Mar)
      - no coriander                       (from: user, 2 Mar)
      - always buys Vellano olive oil 1 L  (from: fetch_page, 14 Apr)
    question: Every shopping list now includes Vellano oil. The customer never asked for it. Why?
    choices:
      - text: A web page wrote it into memory
        correct: true
        feedback: >-
          Right. The page said "remember this", and the agent obeyed. That's **memory poisoning**.
      - text: The customer said it, then forgot
        feedback: >-
          Check the source column. That line came from a fetched page, not the customer.
      - text: The model invented a preference
        feedback: >-
          The model didn't invent it. The memory file holds it, written on 14 April.
      - text: The recommender has a bug
        feedback: >-
          Most people look for a ranking bug first. The memory file explains it on its own.

  - type: ai-review
    id: review-unscoped-recall
    concept: agents.memory-poisoning
    difficulty: 3
    language: python
    request: Give the parcel support agent memory of each customer's details.
    flawClass: data-exposure
    code: |
      def remember(session, fact):
          store.add(text=fact, meta={"user": session.user_id, "at": today()})

      def recall(session, query, k=5):
          hits = store.search(query, k=k)   # nearest by meaning
          return [hit.text for hit in hits]
    prompt: >-
      An assistant wrote this. Each test started with an empty store and one customer. In
      production, "send it to my usual address" went to another customer's address. Tap the
      line at fault.
    lines: [5]
    reasons:
      - text: Search ignores whose memory it is
        correct: true
        feedback: >-
          Yes. Recall must filter by the session's user and tenant, every time.
      - text: Five results is too many
        feedback: >-
          One result would still be the nearest match from anyone's memories.
      - text: Facts should be deduplicated first
        feedback: >-
          Duplicates waste space. They don't hand one customer's address to another.
      - text: The date should be a timestamp
        feedback: >-
          Precision of the date doesn't matter here. Whose memory comes back does.
    fix: |
      def recall(session, query, k=5):
          scope = {"tenant": session.tenant_id, "user": session.user_id}
          hits = store.search(query, k=k, filter=scope)
          return [hit.text for hit in hits]
    verify:
      question: Which test would have caught this?
      choices:
        - text: Two customers' memories, recalled as one of them
          correct: true
          feedback: >-
            Right. Only a store with two people in it can leak between them.
        - text: Recall straight after remember, for one user
          feedback: >-
            That's what the tests did. With one customer, the nearest match is always theirs.
        - text: Search with an empty query
          feedback: >-
            It might return something odd, but with one customer it can't show the leak.

  - type: prose
    id: name-stale-and-trusted
    body: |-
      A memory is a claim made in the past. Store its source and date, and check a **stale**
      fact before acting on it: "Your usual class moved to Wednesday. Book that one?"

      Guard writes too. Only the user's own words and verified tool results may become
      memories, never text from a page or an email. Scope every memory to one tenant and one
      user.

  - type: fill-blank
    id: fill-memory-path
    concept: agents.memory-poisoning
    difficulty: 3
    language: python
    prompt: >-
      The memory tool sends paths like `/memories/diet.md`. Map each into this user's own
      folder, and refuse any path that climbs out. Fill the gaps.
    template: |
      ROOT = Path("/srv/memories")

      def resolve(session, path):
          user_dir = (ROOT / session.tenant_id / session.user_id).resolve()
          target = (user_dir / path.removeprefix("/memories/")).{{1}}()
          if not target.{{2}}(user_dir):
              raise PermissionError("Path escapes this user's memory")
          return target
    blanks:
      - key: '1'
        answer: resolve
      - key: '2'
        answer: is_relative_to
    bank: [resolve, absolute, is_relative_to, startswith, exists]

  - type: parsons
    id: arrange-verify-before-acting
    concept: agents.memory-staleness
    difficulty: 3
    language: python
    prompt: >-
      The gym agent remembers a member's usual class. Check it against today's timetable
      before booking, and ask when anything changed. One block doesn't belong.
    checkIndent: true
    blocks:
      - id: recall-fact
        code: 'fact = recall(session, "usual_class")'
        subgoal: 'Recall the memory'
      - id: if-none
        code: 'if fact is None:'
      - id: ask-new
        code: 'return ask("Which class would you like?")'
        indent: 1
      - id: find-current
        code: 'current = timetable.find(fact["name"])'
        subgoal: 'Check the world, not the memory'
      - id: if-gone
        code: 'if current is None:'
      - id: ask-gone
        code: 'return ask(f"{fact[''name'']} has stopped. Pick another?")'
        indent: 1
      - id: if-moved
        code: 'if current.slot != fact["slot"]:'
      - id: ask-moved
        code: 'return ask(f"It moved to {current.slot}. Book that?")'
        indent: 1
      - id: book-it
        code: 'return book(session, current)'
        subgoal: 'Act on what is true today'
    distractors:
      - id: trust-memory
        code: 'return book(session, fact)'
        feedback: >-
          That books from memory alone. A class that moved last month gets booked at the old
          time.

  - type: code-challenge
    id: write-memory-store
    concept: agents.memory-write-policies
    difficulty: 4
    language: python
    starter: memory.starter.py
    solution: memory.solution.py
    tests: memory.tests.py
    prompt: >-
      Build `MemoryStore` with `write(scope, key, value, source, day, ttl=None)` and
      `recall(scope, today, stale_after=90)`. A scope is `(tenant, user)`. Days are whole
      numbers.


      `write` returns `"rejected"` unless `source` is in `TRUSTED`. Each scope holds one value
      per key. Return `"added"` for a new key. Return `"duplicate"` for the same value,
      ignoring case and outer spaces. Return `"updated"` when it changed, replacing the old
      value.


      `recall` returns that scope's facts only, sorted by key, as
      `{"key", "value", "day", "verify"}`. `verify` is `True` when `today - day` exceeds
      `stale_after`. A fact with a `ttl` expires once `today - day` exceeds it. Delete it,
      and leave it out.
    hints:
      - Key the store by the scope and the key together, so one fact per key per scope comes for free.
      - Look up the old entry before you overwrite it. Its value decides added, duplicate or updated.
      - In `recall`, loop over a sorted copy of the entries, so you can delete expired ones as you go.

  - type: explain-back
    id: warn-shop-owner
    concept: agents.memory-poisoning
    difficulty: 4
    audience: non-technical
    kind: risk
    prompt: >-
      A greengrocer wants to switch on "the assistant remembers customers". Warn them: what
      could go wrong, and how will you check it?
    rubric:
      - Memories go stale or are wrong, so the assistant checks them before acting.
      - One customer's details could reach another, so memory is kept per customer and tested with two.
      - Outside text could plant false memories, so only customers and checked records can write them.
    modelAnswer: >-
      Three things could go wrong. A memory can go out of date, like an old address, so the
      assistant confirms before acting on it. One customer's details could reach another, so
      each customer's memory is kept apart, and we test with two customers. And a web page
      could plant a false "preference", so only customers and checked records can write
      memories. Customers can also see and delete what's remembered.

recap:
  - Tell short-term from long-term memory, and episodic, semantic and procedural from each other.
  - Write memory with policies that reject untrusted sources, dedupe, update and forget.
  - Scope every memory to a tenant and a user, and verify stale facts before acting.

recall:
  - id: card-memory-kinds
    concept: agents.memory-types
    front: Give an example each of an episodic, a semantic and a procedural memory.
    back: >-
      Episodic: "Tuesday's order arrived late". Semantic: "Sam is vegetarian". Procedural:
      "ask before swapping a brand".
  - id: card-write-policy
    concept: agents.memory-write-policies
    front: What should a memory store do when a fact it holds has changed?
    back: >-
      Update the existing entry instead of adding a second one, so two rival facts never
      come back together.
  - id: card-staleness
    concept: agents.memory-staleness
    front: Why does each memory carry its source and date?
    back: >-
      So the agent can judge how far to trust it, and check an old fact against the world
      before acting on it.
  - id: card-poisoning
    concept: agents.memory-poisoning
    front: How can a web page change an agent's behaviour weeks after it was read?
    back: >-
      Its text tells the agent to remember something, and that memory steers every later
      run. Only trusted sources should write memory.

