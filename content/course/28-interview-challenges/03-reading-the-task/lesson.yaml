id: interview.reading-the-task
title: Reading the task statement
objective: "Read a task statement the way the hidden tests will: the constraints, the complexity hint, the exact output format and the special cases."
level: essential
minutes: 10
concepts: [interview.task-statement, interview.output-contract]
prerequisites: [interview.online-assessments]
opening:
  text: >-
    You'll read a task statement the way its hidden tests will, before you write a line.
    Most lost points in online tests hide in two sentences people skim.

steps:
  - type: prose
    id: parts-of-a-statement
    body: |-
      What you need: JavaScript functions, and hidden tests from lesson 02. A task
      statement has the same parts every time:

      - **The story**: skim it.
      - **The signature**: your inputs and your output.
      - **The examples**: worked cases that don't score.
      - **The assumptions**: the range of N and of each value.
      - **The expected complexity**, when given: it names the algorithm.

  - type: prose
    id: limits-name-the-algorithm
    body: |-
      The assumptions are the most useful lines on the page. As a rough guide to N:

      - Up to about 20: trying every subset is fine.
      - Up to a few thousand: a loop inside a loop is fine.
      - 100,000 or more: aim for O(N log N) or O(N).

      The value ranges list the **edge cases**. If a range allows negatives or zero, a
      hidden test uses them.

  - type: bug-hunt
    id: hunt-value-range
    concept: interview.task-statement
    difficulty: 1
    language: js
    code: |
      function hottest(A) {
        let best = 0;
        for (const t of A) {
          if (t > best) best = t;
        }
        return best;
      }
    prompt: >-
      The task: return the highest temperature in `A`. N is from 1 to 100,000, and each
      value is from -50 to 50. The examples were summer weeks. Tap the line a hidden test
      catches.
    lines: [2]
    reasons:
      - text: Starting at 0 fails when every value is negative
        correct: true
        feedback: >-
          Yes. A winter week returns 0, a temperature nobody recorded. Start at `A[0]`.
      - text: '`>` should be `>=`'
        feedback: >-
          A tie changes nothing here, since the value is the same. The start value is wrong.
      - text: The loop skips the last reading
        feedback: >-
          `for...of` visits every item. The trouble is what `best` holds before the loop.
    fix: |
      let best = A[0]; // N is at least 1, so A[0] exists

  - type: prose
    id: the-output-contract
    body: |-
      The second place points hide is the **output contract**: exactly what you return. The
      format of a string, the order, the tie-break rule, and special values like `-1` or
      `"NULL"`.

      Hidden tests compare your answer character by character. `A7(120)` and `A7 (120)` are
      different answers. "Ascending string order" means comparing character codes, which is
      what `<` and a plain `sort()` do.

  - type: ai-review
    id: review-output-format
    concept: interview.output-contract
    difficulty: 2
    language: js
    request: 'Return one line per order as "id(total)", for example "A7(120)".'
    flawClass: logic
    code: |
      function receipts(orders) {
        const lines = [];
        for (const order of orders) {
          const total = order.items.reduce((sum, item) => sum + item.price, 0);
          lines.push(`${order.id} (${total})`);
        }
        return lines;
      }
    prompt: >-
      An assistant wrote this, and it looks right at a glance. Every hidden test fails.
      Tap the line at fault.
    lines: [5]
    reasons:
      - text: There's a space before the bracket
        correct: true
        feedback: >-
          Yes. `A7 (120)` isn't `A7(120)`, and the tests compare strings exactly.
      - text: '`reduce` needs no start value'
        feedback: >-
          Without the `0`, an order with no items throws. The start value is right.
      - text: It should return one joined string
        feedback: >-
          The task asks for one line per order, so a list is right. Look at each line's text.
    fix: |
      lines.push(`${order.id}(${total})`);

  - type: predict-output
    id: predict-string-order
    concept: interview.output-contract
    difficulty: 2
    language: js
    code: |
      console.log(['bo', 'Amy', 'al'].sort());
    question: What does this log?
    choices:
      - text: "`[ 'Amy', 'al', 'bo' ]`"
        correct: true
        feedback: >-
          Right. Capital letters have lower character codes, so `Amy` comes first.
      - text: "`[ 'al', 'Amy', 'bo' ]`"
        feedback: >-
          That's dictionary order, what `localeCompare` gives. String order puts capitals first.
      - text: "`[ 'al', 'bo', 'Amy' ]`"
        feedback: >-
          Close, but backwards on case. Capitals come before lower case in string order.

  - type: fill-blank
    id: fill-tie-break
    concept: interview.output-contract
    difficulty: 3
    prompt: >-
      The statement says: highest total first, and ties in ascending string order of name.
      Complete the comparator.
    language: ts
    template: |
      rows.sort((a, b) => {
        if (a.total !== b.total) return {{1}};
        return a.name {{2}} b.name ? -1 : 1;
      });
    blanks:
      - key: '1'
        answer: b.total - a.total
      - key: '2'
        answer: '<'
    bank: [b.total - a.total, a.total - b.total, '<', '>', a.name.localeCompare(b.name)]

  - type: ai-review
    id: review-missed-cap
    concept: interview.task-statement
    difficulty: 3
    language: js
    request: >-
      Count the pairs of days with equal readings. If there are more than 1,000,000,000
      pairs, return -1.
    flawClass: edge-case
    code: |
      function equalPairs(A) {
        const seen = new Map();
        let pairs = 0;
        for (const value of A) {
          pairs += seen.get(value) ?? 0;
          seen.set(value, (seen.get(value) ?? 0) + 1);
        }
        return pairs;
      }
    prompt: >-
      An assistant wrote this. It's O(N) and every example passes. N goes up to 100,000.
      Tap the line a hidden test catches.
    lines: [8]
    reasons:
      - text: The -1 rule for a huge count is missing
        correct: true
        feedback: >-
          Yes. 100,000 equal readings make about five billion pairs. The statement wants -1.
      - text: A `Map` is too slow for 100,000 values
        feedback: >-
          Each `Map` call is constant time on average. Speed is fine; one rule is missing.
      - text: '`??` should be `||`'
        feedback: >-
          Both give 0 for a missing key here. The problem is at the very end.
    verify:
      question: 'Which test would have caught this?'
      choices:
        - text: '100,000 equal readings'
          correct: true
          feedback: >-
            Yes. About five billion pairs, well past the cap.
        - text: '100,000 different readings'
          feedback: >-
            That makes no pairs at all, so the cap never comes into play.
        - text: 'Two equal readings'
          feedback: >-
            One pair is far below the cap. The missing rule needs a huge count.
    fix: |
      return pairs > 1_000_000_000 ? -1 : pairs;

  - type: code-challenge
    id: write-leaderboard
    concept: interview.output-contract
    difficulty: 3
    language: ts
    starter: leaderboard.starter.ts
    solution: leaderboard.solution.ts
    tests: leaderboard.tests.ts
    twin:
      language: python
      starter: leaderboard.starter.py
      solution: leaderboard.solution.py
      tests: leaderboard.tests.py
    prompt: >-
      Read this statement slowly, then write `leaderboard(results, n)`.


      Each result is `{ name, points }` from one game. A player can appear many times, and
      their total is the sum of their points. Return the top `n` players as strings of the
      form `"name(total)"`, highest total first. Break ties by name, in ascending string
      order.


      If there are fewer than `n` players, return them all. N is from 0 to 100,000 results,
      and `n` is from 0 to 100,000.


      So `[{ name: 'ada', points: 30 }, { name: 'bo', points: 50 }, { name: 'ada', points: 40 }]`
      with `n = 2` gives `['ada(70)', 'bo(50)']`.
    hints:
      - List every rule in the statement before you code. There are five.
      - A `Map` from name to total handles repeated names in one pass.
      - Sort the map's entries with the comparator from the fill-in step, then `slice(0, n)` and format.

  - type: explain-back
    id: explain-read-first
    concept: interview.task-statement
    difficulty: 3
    audience: teammate
    kind: explain
    prompt: >-
      Why read the assumptions and the output rules before you write any code, rather than
      after the examples pass?
    rubric:
      - The examples rarely touch the edge cases or the exact format, so passing them proves little.
      - The ranges name the edge cases and the speed the hidden tests demand.
      - Rules like a tie-break or a cap shape the code, so finding them late means a rewrite under time.
    modelAnswer: >-
      The examples are the simple cases, so passing them says little. The hidden tests are
      built from the assumptions: the largest N, negative values, an empty input, a tie. If
      I read those first, I pick an algorithm that's fast enough and handle each case as I
      write. Finding a cap or a tie-break rule after coding means patching under time.

recap:
  - Read the assumptions first, and let N pick the algorithm.
  - Treat the value ranges as the list of edge cases the tests will use.
  - Match the output contract exactly, down to spaces and tie-breaks.
recall:
  - id: card-statement-parts
    concept: interview.task-statement
    front: What are the parts of a timed-test task statement?
    back: >-
      The story, the signature, the examples, the assumptions (ranges of N and values) and
      often the expected worst-case complexity.
  - id: card-n-guide
    concept: interview.task-statement
    front: N can be 1,000,000. What complexity do you aim for?
    back: >-
      O(N log N) or O(N). A loop inside a loop won't finish in time.
  - id: card-ranges-edges
    concept: interview.task-statement
    front: How do the value ranges in a statement help you test?
    back: >-
      Every value they allow is fair game: negatives, zero, duplicates, the extremes and the
      largest N. Test each one.
  - id: card-string-order
    concept: interview.output-contract
    front: What does "ascending string order" mean for a tie-break in JavaScript?
    back: >-
      Compare character codes with `<`, as a plain `sort()` does. Capitals come before lower
      case. `localeCompare` gives dictionary order instead.

references:
  - kind: docs
    title: Top techniques to approach and solve coding interview questions
    authors: Yangshun Tay
    venue: Tech Interview Handbook
    url: https://www.techinterviewhandbook.org/coding-interview-techniques/
    note: Clarify, brute force, optimise, test, and talk throughout.
    primary: true
    verified: true

deepDive: |-
  A two-minute checklist before you type, for every task:

  - What's the smallest N? Zero means an empty input exists.
  - Can values be negative, zero or repeated?
  - Can a sum pass 2^53? Then JavaScript numbers lose digits.
  - What's the exact return type: a number, a string, a list?
  - Is there a special value: -1, `null`, `"NULL"`, an empty list?
  - How are ties broken, and what order is "ascending" here?
  - Is there a cap, such as "return -1 above 1,000,000,000"?

  Levelled tasks add one more trap. Methods often return strings such as `"true"` or
  `""` rather than booleans or `null`. The tests compare exactly, so `true` fails where
  `"true"` was asked for. Copy the statement's examples into your own tests word for word.

  On localeCompare: it sorts for people, following language rules, and its results can
  depend on the runtime's locale data. A statement that says "string order" or
  "lexicographic order" means character codes. Use `<`, or a plain `sort()` on strings.
