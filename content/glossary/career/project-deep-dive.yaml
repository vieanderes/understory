term: project deep dive
aka:
  - deep dive
  - past project interview
short: An interview round where you walk through a project you built and defend its decisions under questioning.
explain: |
  You pick something you built. The interviewer keeps asking why: why that database, what
  broke, what you'd change, how you knew it worked.

  It tests whether you made the decisions or only watched them happen. The best answers name
  the options you rejected, the numbers you measured, and the mistake you'd fix today.

  The trap is the tour. Listing every component in order fills the hour and shows nothing.
  Lead with the problem and the hardest decision, then let the questions take you deeper.
analogy: A chef asked about one dish. Not the recipe, but why that heat, that order, that salt.
usage: For the project deep dive, pick the work where you made the trade-off yourself and can show the result.
related:
