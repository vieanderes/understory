id: basics
number: 0
title: First steps in JavaScript
summary: "Programming from zero: values, variables, decisions, loops, functions, lists and objects. Nothing is assumed, and every lesson runs in the editor here."
why: "Every program you'll ever write is built from these few ideas."
youCanBuild: "A small to-do list program, written from scratch."
concepts:
  - id: basics.values
    title: "Values"
    summary: "Numbers and text are values a program works with."
  - id: basics.console-log
    title: "Printing with console.log"
    summary: "`console.log` shows a value in the output, so you can see what your code did."
  - id: basics.variables
    title: "Variables"
    summary: "A variable is a name that points at a value."
  - id: basics.let-and-const
    title: "let and const"
    summary: "`let` makes a variable you can change later, and `const` makes one you cannot reassign."
  - id: basics.arithmetic
    title: "Arithmetic"
    summary: "The operators `+`, `-`, `*`, `/` and `%` calculate with numbers."
  - id: basics.strings
    title: "Joining text"
    summary: "`+` joins strings, and a template literal puts values inside text."
  - id: basics.comparisons
    title: "Comparisons"
    summary: "A comparison such as `>` or `===` gives `true` or `false`."
  - id: basics.if-else
    title: "if and else"
    summary: "`if` runs code only when a condition is true, and `else` runs when it is not."
  - id: basics.for-loops
    title: "for loops"
    summary: "A `for` loop runs the same code once for each step of a counter or each item of a list."
  - id: basics.while-loops
    title: "while loops"
    summary: "A `while` loop keeps running its code as long as a condition stays true."
  - id: basics.functions
    title: "Functions"
    summary: "A function is a named piece of work that you can run again with different inputs."
  - id: basics.return-values
    title: "Return values"
    summary: "`return` hands a result back to the code that called the function."
  - id: basics.arrays
    title: "Arrays"
    summary: "An array is an ordered list of values, read by index from 0."
  - id: basics.array-methods
    title: "Working with arrays"
    summary: "`length` counts the items, and `push` adds one to the end."
  - id: basics.objects
    title: "Objects"
    summary: "An object groups related values under property names."
  - id: basics.lists-of-objects
    title: "Lists of objects"
    summary: "An array of objects holds many records of the same shape, like the tasks in a to-do list."
  - id: basics.program-design
    title: "Breaking a problem into steps"
    summary: "A program is built by splitting a task into small steps that each do one thing."
  - id: basics.probes
    title: Probing with console.log
    summary: A `console.log` added inside the code shows how its values change as it runs.
  - id: basics.debugger
    title: Breakpoints and stepping
    summary: A debugger pauses a running program so you can read its variables one line at a time.
  - id: basics.stack-trace
    title: Stack traces
    summary: A stack trace lists the calls that led to an error, with the failing call first.
    confusableWith: [basics.error-messages]
  - id: basics.error-messages
    title: Error messages
    summary: An error message names the kind of error, what went wrong and the place in the code that raised it.
    confusableWith: [basics.stack-trace]
