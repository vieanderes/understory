deepDive: >-
  No model was called. The triage results are made up, and the routing code ran in Python
  3.12. The latencies are illustrative. A small trained classifier typically answers in
  milliseconds, and a small prompted model in a few hundred. A large model writing a
  paragraph takes seconds. Measure your own.


  **Where the probability comes from.** A trained classifier ends with one score per label.
  A function called softmax turns those scores into probabilities that add up to 1.
  A prompted LLM gives you a label, not a calibrated number. Some teams sample it a few
  times and use the share of agreeing answers. Many log its labels, have people correct a
  sample, and train a small model on the result. That's often the cheapest route to fast,
  well-behaved probabilities.


  **Where it pays.** Route a scanned invoice or contract to the right parser before paying
  for expensive processing. Decide inside a real-time loop, where seconds of generation are
  useless. In an agent loop, one call after every tool result can answer "which action
  next?", "is the task complete?" and "is it stuck?". The large model then runs only when
  the chosen action is to write something.


  **Several questions, one call.** Asking about the same input once, rather than four
  times, reads it once. That matters for cost and latency, and it keeps the answers
  consistent with each other.
