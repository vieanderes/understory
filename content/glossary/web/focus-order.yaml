term: focus order
aka: [tab order]
short: The sequence in which pressing Tab moves through the interactive parts of a page.
explain: |
  Pressing Tab moves from control to control in the order they appear in the HTML. If CSS
  moves things around on screen, the two orders drift apart, and focus jumps about.

  Fix the source order rather than forcing it. A positive `tabindex` reorders things and
  nearly always makes it worse. `tabindex="0"` adds an element in its natural place, and
  `tabindex="-1"` makes it reachable by script only.
analogy: The stops on a bus route. Passengers expect them to follow the road, not hop across town.
usage: The focus order jumps from the header to the footer and back, because the grid reorders the columns.
twin:
  term: focus-management
  difference: Focus order is the route Tab follows through a page, set by the source. Focus management is your code moving focus on purpose, like into a dialog that opens.
related: [focus-management, keyboard-navigation, focus-indicator]
level: 2
lessons: [design.keyboard-and-focus]
