term: vesting
aka:
  - vesting schedule
  - cliff
  - vested shares
short: The schedule by which shares promised in a job offer become yours, bit by bit, as you stay.
explain: |
  An offer says "shares worth this much". You don't get them on day one. They're released
  over time, usually across four years, and you keep only what has been released when you
  leave.

  Many schedules start with a cliff. Nothing vests for the first year, then a year's worth at once,
  then a little each month. Leave at eleven months and you leave with none.

  Ask what kind of shares they are, when they vest, and what they're worth if the company is
  never sold. Options in a young company may be worth nothing; count them last.
analogy: A loyalty card that stamps once a month. The free coffee only comes if you keep turning up.
usage: The equity looks big, but vesting starts with a one-year cliff, so I'm counting base and bonus first.
