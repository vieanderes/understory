term: uncontrolled input
aka:
  - uncontrolled component
short: A form field that keeps its own value in the browser, read only when the form is sent.
explain: |
  The browser already remembers what you type. Leave out `value`, maybe give a
  `defaultValue`, and read the field on submit with `FormData` or a ref.

  It's less code and no draw on every keystroke. You lose live checks and formatting while
  typing. For a plain form that's sent once, it's often the better choice.
analogy: A paper form you fill in alone. Nobody reads it until you hand it in.
example:
  language: tsx
  code: |
    function Signup() {
      function submit(formData: FormData) {
        console.log(formData.get('email'));
      }
      return (
        <form action={submit}>
          <input name="email" defaultValue="" />
        </form>
      );
    }
usage: Keep the comment box an uncontrolled input and read it with FormData on submit.
twin:
  term: controlled-input
  difference: An uncontrolled input keeps its value in the browser and you read it later. A controlled input mirrors React state on every keystroke.
related:
  - controlled-input
  - ref
level: 3
lessons:
