id: pro.typescript
title: TypeScript like a pro
objective: Let inference work, keep config precise with satisfies, brand ids, and never cast outside data.
level: essential
minutes: 10
concepts: [pro.illegal-states, pro.unknown-over-any, pro.inference-over-annotation]
prerequisites: [ts.configuration]
opening:
  text: >-
    You'll write types that make whole classes of bug impossible to write. That's what
    separates TypeScript that merely compiles from TypeScript a senior trusts.

steps:
  - type: prose
    id: unknown-and-inference
    body: |-
      You know the tools. Pros use them in a few set places. The first habit: annotate the
      edges, and let **inference** do the middle.

      ```ts
      function total(prices: number[]): number {
        return prices.reduce((sum, price) => sum + price, 0);
      }
      ```

      The parameter and return type are the edges, where other code meets yours. The
      callback needs no annotations. TypeScript already knows both are numbers.

  - type: multiple-choice
    id: pick-redundant-annotations
    concept: pro.inference-over-annotation
    difficulty: 3
    language: ts
    code: |
      const prices: number[] = [4, 2.5];
      const total: number = prices.reduce(
        (sum: number, price: number): number => sum + price,
        0,
      );
    question: Which annotations would a reviewer ask you to drop?
    choices:
      - text: All of them, since each is inferred
        correct: true
        feedback: >-
          Yes. The array literal and `reduce` already give every one of these types.
      - text: None, more types are always safer
        feedback: >-
          Inferred types are checked as strictly. Extra ones add noise and can drift.
      - text: Only the one on `prices`
        feedback: >-
          That one is inferred too, and so are the callback's. None adds safety.

  - type: prose
    id: satisfies-config
    body: |-
      The second habit is for config objects. You met `satisfies` in deriving types: it
      checks a value against a type, and keeps what TypeScript inferred.

      An annotation throws that detail away. Here the keys become plain `string`:

      ```ts
      const sizes: Record<string, number> = { small: 45, large: 300 };
      // keyof typeof sizes is string, so "smal" is fine
      ```

      With `satisfies`, the keys stay `"small" | "large"`, and each value is still checked.

  - type: bug-hunt
    id: hunt-widened-config
    concept: pro.inference-over-annotation
    difficulty: 3
    language: ts
    code: |
      type Theme = { background: string; text: string };

      const themes: Record<string, Theme> = {
        light: { background: "white", text: "black" },
        dark: { background: "black", text: "white" },
      };

      function setTheme(name: keyof typeof themes) {
        applyColours(themes[name]);
      }

      setTheme("drak");
    prompt: >-
      A typo in the settings page picks a theme called "drak". `tsc` says nothing, and the page
      crashes. Tap the line that let the typo through.
    lines: [3]
    reasons:
      - text: The annotation widens the keys to `string`
        correct: true
        feedback: >-
          Yes. Use `satisfies Record<string, Theme>`, and "drak" fails to compile.
      - text: '`setTheme` should take a `string`'
        feedback: >-
          That's what it takes already, by accident. The type should list the real names.
      - text: '`Theme` is missing a `name` field'
        feedback: >-
          The name is the key. The trouble is what the annotation did to the keys.
    fix: |
      const themes = {
        light: { background: "white", text: "black" },
        dark: { background: "black", text: "white" },
      } satisfies Record<string, Theme>;

  - type: prose
    id: branded-ids
    body: |-
      The third habit: **brand** your ids. Two ids that are both `string` are the same type.
      So an order id slips in where a user id belongs.

      `A & B` means a value that is both. Add a tag that exists only in the type:

      ```ts
      type UserId = string & { readonly brand: "UserId" };
      type OrderId = string & { readonly brand: "OrderId" };

      function toUserId(raw: string): UserId {
        if (raw.slice(0, 2) !== "u_") throw new Error(`Not a user id: ${raw}`);
        return raw as UserId;
      }
      ```

      Now a plain string or an `OrderId` won't fit a `UserId` parameter. The one `as` sits
      behind a check.

  - type: fill-blank
    id: fill-brand
    concept: pro.illegal-states
    difficulty: 3
    language: ts
    prompt: >-
      Brand the order id, so `cancelOrder` refuses a `UserId` or a plain string.
    template: |
      type OrderId = {{1}} & { readonly brand: {{2}} };

      function toOrderId(raw: string): OrderId {
        if (raw.slice(0, 2) !== "o_") throw new Error(`Not an order id: ${raw}`);
        return raw {{3}} OrderId;
      }

      function cancelOrder(id: {{4}}) {
        // ...
      }
    blanks:
      - key: '1'
        answer: string
      - key: '2'
        answer: '"OrderId"'
      - key: '3'
        answer: as
      - key: '4'
        answer: OrderId
    bank: [string, '"OrderId"', as, OrderId, satisfies, unknown, '"UserId"']

  - type: ai-review
    id: review-as-cast
    concept: pro.unknown-over-any
    difficulty: 4
    language: ts
    request: Write createAccount(input) for sign-up requests. New accounts are always ordinary users.
    flawClass: security
    code: |
      type SignUp = { email: string; role: 'user' };

      function createAccount(input: unknown) {
        const body = input as SignUp;
        return saveUser({ email: body.email, role: body.role });
      }
    prompt: >-
      An assistant wrote this, and `tsc` is happy. A test sending a normal sign-up passed.
      Someone sends `role: "admin"` in the request. Tap the line at fault.
    lines: [4]
    reasons:
      - text: '`as` trusts the input without checking it'
        correct: true
        feedback: >-
          Right. A cast is a promise, not a check. The admin role goes straight through.
      - text: '`input` should be typed `any`'
        feedback: >-
          `any` would hide even more. `unknown` is right; the cast throws its safety away.
      - text: The `SignUp` type allows `admin`
        feedback: >-
          The type says `'user'` only. But nothing ever checks the data against it.
    verify:
      question: Which test would have caught this?
      choices:
        - text: 'Sign up with `role: "admin"`, expect a user'
          correct: true
          feedback: >-
            Yes. It's the request an attacker sends, and it fails today.
        - text: Sign up with a normal email and no role
          feedback: >-
            That's close to the test that passed. It never tries the field that matters.
        - text: Run `tsc` in strict mode
          feedback: >-
            `tsc` is already happy. A cast tells it to stop checking.
    fix: |
      function createAccount(input: unknown) {
        if (
          typeof input !== 'object' || input === null ||
          !('email' in input) || typeof input.email !== 'string'
        ) {
          throw new Error('Invalid sign-up');
        }
        return saveUser({ email: input.email, role: 'user' });
      }

  - type: code-challenge
    id: write-payment-union
    concept: pro.illegal-states
    difficulty: 4
    language: ts
    prompt: >-
      `Payment` uses flags and optional fields, so a card with no digits type-checks. Model
      it as a union on `kind`: `card` with `last4`, `bank` with `accountName`, and
      `voucher` with `code`.


      `describePayment` returns `Card ending 4242`, `Bank transfer from Ana Silva` or
      `Voucher SPRING10`. Its switch assigns the leftover case to `never`, and throws if one
      ever arrives.
    hints:
      - Each flag becomes one member of a union, holding only its own field.
      - Switch on `payment.kind`, and each case can read its own field with no `?`.
      - "Start with `export type Payment = | { kind: 'card'; last4: string }`"

  - type: explain-back
    id: explain-union-safety
    concept: pro.illegal-states
    difficulty: 4
    audience: teammate
    kind: explain
    prompt: >-
      Why is a union of shapes, one per state, safer than one type with optional fields?
    rubric:
      - Optional fields allow combinations that never happen in reality.
      - A union allows only the real states, so impossible ones can't be written.
      - Checking the tag tells the compiler which fields exist, so no guessing or `?` checks.
    modelAnswer: >-
      With optional fields, any mix is allowed, so code has to guess and check everything.
      A union lists only the states that can really happen. You can't build a failed
      request with data. And once you check `status`, TypeScript knows exactly which fields
      are there.

recap:
  - Annotate the edges, let inference do the middle, and check config with `satisfies`.
  - Brand ids, and keep the one `as` behind a check.
  - Take outside data as `unknown`, and check it instead of casting.
recall:
  - id: card-illegal-states
    concept: pro.illegal-states
    front: How do you make "loading, failed and done at once" impossible to write?
    back: >-
      Model the states as a union of shapes, each with a `status` tag and only its own
      fields.
  - id: card-unknown
    concept: pro.unknown-over-any
    front: What's the difference between `any` and `unknown`?
    back: >-
      Both accept any value. `any` turns checking off, while `unknown` makes you narrow it
      before use.
  - id: card-satisfies
    concept: pro.inference-over-annotation
    front: Why write `satisfies Record<string, Theme>` instead of annotating the object?
    back: >-
      Both check the values. Only `satisfies` keeps the exact keys, so a typo in a name
      fails to compile.
  - id: card-brand
    concept: pro.illegal-states
    front: How do you stop an `OrderId` being passed where a `UserId` belongs?
    back: >-
      Brand them: `string & { readonly brand: "UserId" }`. Make them only in a function
      that checks the raw string.
  - id: card-inference
    concept: pro.inference-over-annotation
    front: Where do experienced developers write type annotations?
    back: >-
      At the edges: function parameters, exported return types and outside data. Inside,
      they let inference work.

