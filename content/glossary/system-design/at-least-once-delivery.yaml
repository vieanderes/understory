term: at-least-once delivery
aka: [at least once, at-most-once delivery, exactly-once delivery]
short: A messaging promise that nothing is lost, paid for by sometimes sending the same message twice.
explain: |
  A sender can't always tell whether a message arrived. If it resends on doubt, nothing is
  lost but some messages arrive twice. If it never resends, nothing doubles but some
  messages vanish. Those are the two honest choices.

  Most queues, brokers and webhooks pick the first, because a lost payment event is worse
  than a repeated one. "Exactly once" across a network is really at-least-once plus a consumer that ignores
  repeats. It usually records each event id in the same transaction as its own work.
analogy: A friend who texts "running late" twice because the first one showed no tick. Annoying, but you'd rather that than no text.
usage: The relay gives us at-least-once delivery, so the email consumer has to skip event ids it has already handled.
twin:
  term: idempotent
  difference: The delivery promise is the sender's side and allows repeats. Being idempotent is the receiver's side, making those repeats harmless.
related: [transactional-outbox, idempotent, message-broker, dead-letter-queue]
level: 2
lessons: [arch.event-driven, backend.webhooks]
