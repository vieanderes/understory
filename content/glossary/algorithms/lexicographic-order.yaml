term: lexicographic order
aka: [lexicographical order, dictionary order, alphabetical order]
short: Ordering text the way a dictionary does, character by character from the left.
explain: |
  Compare the first characters. If they differ, that decides it. If they match, move to
  the next. A shorter word that is a prefix of a longer one comes first.

  The trap is numbers stored or sorted as text. "10" comes before "9", because "1" comes
  before "9". JavaScript's `sort()` with no comparator turns numbers into strings, so
  `[10, 9, 1].sort()` gives `[1, 10, 9]`.

  Character codes also put every capital before every lower-case letter. When a task says
  "lexicographic", it usually means this plain code order, not a language-aware one.
analogy: Looking up a word in a paper dictionary. First letter, then second, then third.
example:
  language: js
  code: |
    [10, 9, 1].sort();               // [1, 10, 9]: compared as text
    [10, 9, 1].sort((a, b) => a - b); // [1, 9, 10]: compared as numbers
    ['b', 'B', 'a'].sort();          // ['B', 'a', 'b']: capitals first
usage: Ties break in lexicographic order by id; the default sort suits the ids but not the scores.
related: [comparator, stable-sort, unicode]
level: 2
lessons: [interview.reading-the-task, interview.js-traps]
